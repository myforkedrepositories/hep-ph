<script>
const RAW = {"n":[{"id":"3167964","arxiv":"2606.13514","title":"Electroweak First-Order Phase Transition Triggered by Non-Gaussian Fluctuations of a $\\mathbb{Z}_2$-Symmetric Spectator Scalar","first":"Lu","nauth":1,"year":2026,"cites":0,"role":"repl","note":"Cites 2 network papers: [[2924315]], [[2795517]]. Also cites widely used network papers: [[1518747]]. Closest of your papers: [[1832796]] (coupling 0.02, 4 shared references). Closest network paper: [[2862278]] (coupling 0.14, 45 shared references). Shared topics: observed relic, relic abundance, dark matter candidate, dark matter.","score":40.0,"rank":1,"section":"replacement","parts":[0.72,0.05,0.39,0.0,0.75],"abstract":"We propose a novel mechanism to trigger a first-order cosmological electroweak phase transition using non-Gaussian primordial fluctuations of a $\\mathbb{Z}_2$-symmetric spectator scalar field. We show that the large fluctuations of the spectator field can modify the Higgs thermal mass and enhance the thermal barrier, thereby enabling a strong first-order phase transition. Non-Gaussianities in the primordial fluctuation spectrum significantly increase the probability of large-amplitude fluctuations, allowing a substantial fraction of the Universe to undergo the transition. The spectator field also naturally serves as a cold dark matter candidate through its coherent oscillations, reproducing the observed relic abundance. The resulting stochastic gravitational-wave background peaks at $f\\sim 10^{-3}-10^{-1}$ Hz, but its amplitude lies roughly ten orders of magnitude below the projected sensitivities of planned space-based and ground-based interferometers.","authors":"Bo-Qiang Lu","nlinked":174,"nref":185,"src":"INSPIRE","html":true},{"id":"3233981","arxiv":"2611.34438","title":"Lighting up LZ with Loopy Transitions in a leptophilic Dark Sector","first":"Biondini","nauth":5,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3217265]]. Closest of your papers: [[3130296]] (coupling 0.03, 7 shared references). Closest network paper: [[3202840]] (coupling 0.21, 16 shared references). Shared topics: observed dark matter, dark matter abundance, direct detection, dark sector, nuclear recoil.","score":36.0,"rank":2,"section":"new","parts":[0.45,0.11,0.59,0.0,0.82],"abstract":"We study the direct detection phenomenology and cosmology of a multicomponent dark sector with a leptophilic t-channel portal. The coupling to right-handed Standard Model leptons is mediated by a charged vector-like fermion, allowing both a scalar and a vector dark candidate to connect to the SM through the same mediator. Motivated by the high-energy nuclear-recoil event recently reported by the LUX-ZEPLIN (LZ) experiment, we consider a nearly degenerate dark sector with mass splittings of order a few hundred keV and investigate the resulting inelastic transitions. Concretely, we focus on endothermic scattering of the dark states, which can shift the recoil spectrum towards the high-energy region preferred by LZ while suppressing low-energy events. We scrutinize the effective operators generating the dark-matter-photon coupling, which provides the essential interaction for nuclear recoils. Interestingly, the inelastic transition arises at dimension five whereas elastic scattering on nuclei is induced only at dimension six. This naturally explains the prominence of endothermic scattering compared to its elastic counterpart. We determine the parameter space compatible with the observed dark matter abundance and scrutinize the event rate and signal shape for scattering on xenon. Our results demonstrate that the observation of a single $E_R=248\\pm 46$ keV nuclear recoil event in LZ can be accommodated by thermally produced dark matter in a leptophilic dark sector.","authors":"Simone Biondini, Clara Hofheinz, Stefan Melchin, Lorenzo Tiberi, Stefan Vogl","nlinked":74,"nref":75,"src":"INSPIRE","html":true},{"id":"3228722","arxiv":"2611.17411","title":"HydróDex: gotta match 'em all!","first":"Barni","nauth":2,"year":2026,"cites":0,"role":"repl","note":"Cites 2 network papers: [[2657746]], [[1863581]]. Closest of your papers: [[2787890]] (coupling 0.01, 1 shared references). Closest network paper: [[2957941]] (coupling 0.18, 24 shared references).","score":32.7,"rank":3,"section":"replacement","parts":[0.7,0.02,0.52,0.0,0.0],"abstract":"First-order phase transitions can source a stochastic gravitational-wave background within reach of LISA and other future detectors, with sound waves in the plasma typically providing the dominant contribution. Predicting the resulting gravitational-wave signal requires determining the stationary fluid profiles around expanding bubbles. We present a complete hydrodynamic classification of these profiles in the constant-sound-speed model, which generalizes the bag model by allowing the sound speeds in front of and behind the wall, $c_+$ and $c_-$, to differ. Solving the matching conditions at the wall and evolving the surrounding plasma, we recover the known direct and inverse detonations, deflagrations, and hybrids, and uncover mixed hybrids, a new class with rarefaction waves on both sides of the wall and oppositely directed fluid flows. For a sufficiently pronounced hierarchy $c_+>c_-$, multiple stationary profiles can correspond to the same wall velocity $ξ_w$ and asymptotic transition strength $α_N$. This non-uniqueness arises because this parametrization discards thermodynamic information and is resolved once the underlying microphysics is specified. We compute the kinetic-energy budget and acoustic gravitational-wave spectra within the sound-shell model, finding that mixed hybrids introduce no additional spectral feature and can be mimicked by ordinary direct or inverse hybrids with substantially different fluid profiles. Finally, we release HydróDex, a public code implementing the complete classification, profile construction, energy-budget calculation, and gravitational-wave prediction.","authors":"Giulio Barni, Eric Madge","nlinked":128,"nref":158,"src":"INSPIRE","html":true},{"id":"3128102","arxiv":"2603.09126","title":"Dark matter in classically conformal theories: WIMP and supercooling","first":"Xie","nauth":2,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[2892286]]. Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2856850]] (coupling 0.02, 6 shared references). Closest network paper: [[1918535]] (coupling 0.10, 20 shared references). Shared topics: viable parameter space, interacting massive particle, weakly interacting massive particle, production mechanism, dark matter.","score":31.0,"rank":4,"section":"replacement","parts":[0.48,0.08,0.28,0.0,0.75],"abstract":"Beyond solving the hierarchy problem, classically conformal (CC) theories naturally accommodate dark matter (DM). In this work, we explore the CC $SU(2)_X$ gauge theory with a triplet dark scalar, uncovering two distinct DM scenarios: weakly interacting massive particle (WIMP) and supercooled DM. The production mechanisms are strongly influenced by the CC model's unique first-order phase transition evolution history, which differs significantly from those in non-conformal models. We obtain the viable parameter space for each scenario and investigate the current constraints and future sensitivities at experiments, demonstrating that gravitational wave signals from the phase transition provide a common detection channel for both the WIMP and supercooled DM regimes.","authors":"Ke-Pan Xie, Cheng-Hao Zhan","nlinked":134,"nref":135,"src":"INSPIRE","html":true},{"id":"3233985","arxiv":"2611.34464","title":"Ultralight Dark Matter Spectrum with Gravitational Focusing and Doppler Motion","first":"Ge","nauth":3,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[2795517]]. Also cites widely used network papers: [[1783234]]. Closest of your papers: [[1941263]] (coupling 0.03, 7 shared references). Closest network paper: [[2753529]] (coupling 0.04, 3 shared references). Shared topics: standard model particle, production mechanism, dark matter.","score":25.9,"rank":5,"section":"new","parts":[0.48,0.11,0.12,0.0,0.4],"abstract":"Ultralight dark matter can produce signals in experiments through its couplings with the Standard Model particles. The resulting signal spectrum is determined by the phase-space distribution of dark matter, which encodes information about its production mechanism and the history of the local universe. However, the local environmental effects can modify the observed spectrum and should be included in signal modeling to avoid biased parameter estimates. In this work, we investigate how the gravitational focusing by Sun and the Doppler effect due to the detector's motion modify the signal spectrum and affect inferring the underlying dark matter parameters. We analytically estimate the signal significance and perform Bayesian analysis on simulated data to demonstrate their impact.","authors":"Shao-Feng Ge, Yong Tang, Yue-Hui Yao","nlinked":95,"nref":103,"src":"INSPIRE","html":true},{"id":"3233984","arxiv":"2611.34504","title":"Majorana Neutrino Exchange in Free-Baryon $B_1B_2\\to ppe^-e^-$ Reactions","first":"Xu","nauth":6,"year":2026,"cites":0,"role":"today","note":"Co-authors of yours: Xu. Cites 1 network paper: [[3193100]]. Closest of your papers: [[1686334]] (coupling 0.02, 1 shared references). Closest network paper: [[3227657]] (coupling 0.05, 3 shared references).","score":25.2,"rank":6,"section":"new","parts":[0.45,0.05,0.14,0.5,0.07],"abstract":"The free-baryon reactions $B_1B_2\\to pp e^-e^-$ are studied for six nonstrange and strange initial states, with light- and heavy-Majorana-neutrino exchange treated in the same baryon-level framework. For light-neutrino exchange, the cross sections scale with the square of the effective Majorana mass $m_{ββ}$. The calculated cross sections increase as the off-shell cutoff $Δq^2$ is reduced, especially near threshold and in the hyperon channels, because more of the phase-space region where the squared four-momentum of the exchanged neutrino is close to zero is retained. At $\\sqrt{s}=5.1~\\mathrm{GeV}$, the six light-neutrino cross sections span $9.28\\times10^{-49}$--$1.78\\times10^{-45}~\\mathrm{GeV}^{-2}$ for $m_{ββ}=30~\\mathrm{meV}$ and $Δq^2=10^{-2}~\\mathrm{GeV}^2$. For heavy-neutrino exchange, the cross sections scale with $η_N^2$, where $η_N=|U_{eN}|^2/m_N$. The leading propagator correction remains below one percent for $m_N\\gtrsim50~\\mathrm{GeV}$ over the phase-space region considered. At $\\sqrt{s}=5.1~\\mathrm{GeV}$, the heavy-neutrino cross sections span $7.55\\times10^{-45}$--$1.98\\times10^{-41}~\\mathrm{GeV}^{-2}$ for $η_N=4.0\\times10^{-9}~\\mathrm{GeV}^{-1}$. At higher energies, the two exchange cases give the same CKM-driven channel ordering, with the $nn$ cross section largest. At fixed $\\sqrt{s}$, compared with the light-neutrino spectra calculated with $Δq^2=10^{-2}~\\mbox{GeV}^2$, the heavy-neutrino peaks occur at a smaller squared invariant mass for the proton pair and a larger one for the electron pair. These results extend the free-baryon analogue of neutrinoless double-beta decay to strange initial states and provide theoretical reference results for comparing light- and heavy-Majorana-neutrino exchange.","authors":"Yuan-Guo Xu, Bo Lan, Ben-Hou Xiang, Shuang-Shi Fang, Yi-Bing Zhang, Ru-Min Wang","nlinked":34,"nref":35,"src":"INSPIRE","html":true},{"id":"3233941","arxiv":"2611.34213","title":"Lower Bound on the Lightest Neutrino Mass with Resonant Neutrino Self-Interactions","first":"Ge","nauth":5,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Also cites widely used network papers: [[2817040]]. Closest of your papers: [[3184726]] (coupling 0.02, 5 shared references). Closest network paper: [[2721886]] (coupling 0.07, 12 shared references). Shared topics: neutrino mass.","score":23.3,"rank":7,"section":"new","parts":[0.48,0.06,0.2,0.0,0.16],"abstract":"We show the possibility of using the resonant $s$-channel scattering of ultra high energy astrophysical neutrinos with the low energy cosmic neutrino background to put a lower bound on the lightest neutrino mass. This can be realized and illustrated by neutrino self-interactions with a light scalar mediator of $\\mathcal O(1)$ MeV mass. After analyzing the kinematics and cross section features of the $s$-channel resonance, we derive from first principles the double transport equations with double regeneration terms for the coupled evolution of neutrinos and anti-neutrinos. The simulated event spectrum is then compared with the HESE 7.5 year data observed at IceCube to give a clear lower bound on the lightest neutrino mass.","authors":"Shao-Feng Ge, Joao Paulo Pinheiro, Shaoyang Qin, Ruitao Sun, Oleg Titov","nlinked":121,"nref":132,"src":"INSPIRE","html":true},{"id":"3233991","arxiv":"2611.34525","title":"Confronting $b \\to (s, d)μ^+ μ^-$ and $\\mathcal{L}_{K^{*}\\bar{K}^{*}}$ puzzle in a $U(1)_{B-3L_μ}$ framework with neutrino phenomenology","first":"Panda","nauth":4,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Closest of your papers: [[1854224]] (coupling 0.02, 2 shared references). Closest network paper: [[3203506]] (coupling 0.12, 7 shared references).","score":22.5,"rank":8,"section":"new","parts":[0.45,0.05,0.35,0.0,0.0],"abstract":"Current data on several observables in $b \\to (s,d)$ $μ^+ μ^-$ transitions reveal certain discrepancies with Standard Model (SM) predictions. Considering the possibility that these deviations stem from new physics, we explore a $Z^{\\prime}$ framework based on $U(1)_{B-3L_μ}$ model. The parameter space is examined in light of existing constraints from $b \\to (s,d)$ $μ^+ μ^-$ transitions. Within this framework, we show that the quark couplings accommodating $b \\to (s,d)$ $μ^+ μ^-$ anomalies, imprint correlated signatures on the non-leptonic puzzles $\\mathcal{L}_{K^{*}\\bar{K}^{*}}$ in $B_{s(d)} \\to K^{*}\\bar{K}^{*}$ decays. We find that the scenario with both vector and axial-vector contributions of opposite sign is favored by the data compared to pure vector contribution, offering a correlated probe of the underlying new-physics scenario. We further explore the neutrino phenomenology within the same framework in light of current data.","authors":"Dhiren Panda, Priya Mishra, Manas Kumar Mohapatra, Rukmani Mohanta","nlinked":57,"nref":60,"src":"INSPIRE","html":true},{"id":"3233947","arxiv":"2611.34263","title":"Complete NNLO QCD Calculations of $B_c^{(*)}\\to J/ψ(η_c)$ Form Factors and Semileptonic Decays","first":"Tao","nauth":4,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Also cites widely used network papers: [[2817040]]. Closest of your papers: [[3184726]] (coupling 0.00, 1 shared references). Closest network paper: [[3227657]] (coupling 0.02, 2 shared references).","score":18.0,"rank":9,"section":"new","parts":[0.48,0.01,0.05,0.0,0.0],"abstract":"We present the first complete next-to-next-to-leading-order (NNLO) QCD calculation of all 34 vector, axial-vector, tensor, and axial-tensor form factors for the four $B_c^{(*)}\\to J/ψ(η_c)$ transitions within nonrelativistic QCD (NRQCD) factorization. Using automated multi-loop techniques based on \\texttt{FeynCalc} and \\texttt{AMFlow}, we provide a dataset with at least 40 significant digits at 35 exact rational points in the $(m_b,m_c,q^2)$ parameter space, covering $q^2\\in[-10,10]~\\mathrm{GeV}^2$. In the spacelike region ($q^2<0$) and near $q^2=0$, the NLO corrections typically enhance the LO form factors by $\\mathcal{O}(70\\%)$, while the NNLO corrections amount to $\\mathcal{O}(20\\%)$ of the NLO predictions and substantially reduce the renormalization-scale dependence, demonstrating good perturbative convergence. In contrast, fixed-order NRQCD predictions suffer from threshold instabilities and become less reliable at higher timelike $q^2$. We therefore extrapolate the form factors to the full physical region via $z$-series fits to the NRQCD results at spacelike and near-zero $q^2$, finding broad agreement with the latest lattice QCD results for $B_c\\to J/ψ$. With the resulting NRQCD+$z$-series form factors, we predict the decay widths, branching fractions, and lepton-flavor-universality (LFU) ratios for $B_c^{(*)}\\to J/ψ(η_c)\\,\\ellν_\\ell$ ($\\ell=e,μ,τ$) at LO, NLO, and NNLO. Higher-order corrections substantially enhance the absolute rates but largely cancel in the ratios, whose uncertainties are dominated by the choice of fitting points. In particular, our NNLO central prediction $\\mathcal{R}(B_c\\to J/ψ)=0.2836$ lies between the latest lattice QCD determination and the most recent LHCb measurement.","authors":"Wei Tao, Zhen-Jun Xiao, Ruilin Zhu, Qin Chang","nlinked":127,"nref":135,"src":"INSPIRE","html":true},{"id":"3176184","arxiv":"2607.00593","title":"QCD sum-rule determination of the axial-vector mixing angle in the \\(B_c(1P)\\) sector","first":"Aliev","nauth":3,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[3193100]]. Closest network paper: [[3217357]] (coupling 0.04, 3 shared references).","score":17.7,"rank":10,"section":"replacement","parts":[0.45,0.0,0.13,0.0,0.0],"abstract":"We determine the mixing angle between the \\(1^1P_1\\) and \\(1^3P_1\\) axial-vector states in the \\(B_c(1P)\\) sector using QCD sum rules. The operator product expansion includes the gluon condensates and the four-quark condensate up to dimension six, and the next-to-leading-order perturbative corrections to all three correlation functions; for the correlator of the axial-vector and tensor currents these corrections are calculated here for the first time. The analysis of the sum rules leads to \\(θ_{B_c(1P)}=(46.6\\pm0.4)^\\circ\\) for the mixing angle between these two states. We also compare our result with theoretical studies available in the literature.","authors":"T. M. Aliev, S. Bilmis, M. Savci","nlinked":41,"nref":42,"src":"INSPIRE","html":true},{"id":"3179997","arxiv":"2607.10631","title":"$λ$, $ρ$, and $σ$ Regge trajectories for the quadruply heavy pentaquark $bb\\bar{u}cc$ in the diquark-triquark picture","first":"Liu","nauth":3,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[3193100]]. Closest network paper: [[2817040]] (coupling 0.02, 18 shared references).","score":16.5,"rank":11,"section":"replacement","parts":[0.45,0.0,0.04,0.0,0.0],"abstract":"Systematic investigations of four series of Regge trajectories for quadruply heavy pentaquarks are still lacking. Using the diquark and triquark Regge trajectory relations, we propose the Regge trajectory relations for the quadruply heavy pentaquark ${bb\\bar{u}cc}$: $M=2m_{b}+2m_{c}+m_{u}+5C/2 +β_{x_λ}(x_λ+c_{0x_λ})^{2/3} +β_{x_{ρ_1}}(x_{ρ_1}+c_{0x_{ρ_1}})^{2/3}+β_{x_{ρ_2}}\\sqrt{x_{ρ_2}+c_{0x_{ρ_2}}} +β_{x_σ}(x_σ+c_{0x_σ})^{2/3}$. Four series of Regge trajectories, namely the $λ$-, $ρ_1$-, $ρ_2$-, and $σ$-trajectories, are investigated. We demonstrate that accounting for the internal structure and substructure of pentaquarks is indispensable for constructing the $ρ_1$-, $ρ_2$-, and $σ$-trajectories; without such structural considerations, functional form and trajectory parameters can only be obtained via pure fitting against theoretical or experimental data. We further prove that the Regge trajectories of diquark 1, triquark, and diquark 2 (embedded within the triquark) do not correspond one to one to the $ρ_1$-, $ρ_2$-, and $σ$-trajectories. Nevertheless, these trajectories govern the behaviors of the respective $ρ_1$-, $ρ_2$-, and $σ$-trajectories. For both configurations $(bb)(\\bar{u}(cc))$ and $(cc)(\\bar{u}(bb))$, the $λ$-, $ρ_1$-, and $σ$-trajectories exhibit behavior of $M{\\sim}x^{2/3}$ ($x=n_{r_1},n_{r_3},l_1,l_3,N_{r},L$), whereas the $ρ_2$-trajectories exhibit behavior of $M{\\sim}\\sqrt{x}$ ($x=n_{r_2},\\,l_2$). The functional behavior of Regge trajectories for diquarks and triquark offers guidance for fitting the pentaquark Regge trajectories. Additionally, we provide rough estimates for spin-averaged masses of the $λ$-, $ρ_1$-, $ρ_2$-, and $σ$-excited states.","authors":"Xin-Ru Liu, Qi Liu, Jiao-Kai Chen","nlinked":94,"nref":98,"src":"INSPIRE","html":true},{"id":"3233952","arxiv":"2611.34439","title":"Inverted Pendulum in the Sky: Floquet Stabilization of Cosmological Axions","first":"Numasawa","nauth":2,"year":2026,"cites":0,"role":"today","note":"Closest of your papers: [[1955022]] (coupling 0.04, 8 shared references). Closest network paper: [[1963344]] (coupling 0.13, 22 shared references). Shared topics: relic abundance, dark matter.","score":14.1,"rank":12,"section":"new","parts":[0.0,0.14,0.38,0.0,0.45],"abstract":"Many cosmological scenarios require a scalar field to sit near the top of its potential, which usually requires a fine-tuned initial condition. We ask whether the hilltop of an axion potential can be dynamically stabilized by a rapidly oscillating coupling, as for the inverted pendulum of Kapitza, and to what extent this can reduce the fine-tuning. Using Floquet theory, we determine the stability window of the hilltop and analyze several realizations: an oscillating coupling, a spinning or oscillating second field, and a gyroscopic analogue, an inverted spinning top realized by a sigma model on a squashed three-sphere. In an expanding Universe the stabilized phase lasts for a number of $e$-folds logarithmic in the hierarchy of scales, independently of the cosmological background. Classifying the stabilizers by how their effective frequency redshifts, we show that in these realizations the hilltop cannot both attract the field and leave it frozen by the Hubble friction during radiation or matter domination, and that during inflation the attraction is limited by the Hubble friction and the energy budget. Thus the simple realizations studied here do not generically remove the hilltop fine-tuning. They can instead delay the onset of the oscillation and enhance the relic abundance as $n_φ/n_{φ,{\\rm std}}\\propto(\\tilde m/H_c)^{3/2}$ in radiation domination. We discuss the implications for axion dark matter, inflation, quintessence and curvatons.","authors":"Tokiro Numasawa, Masahito Yamazaki","nlinked":72,"nref":80,"src":"INSPIRE","html":true},{"id":"3233898","arxiv":"2611.33862","title":"Origin of flavour cancellations in thermal leptogenesis","first":"Kitabayashi","nauth":1,"year":2026,"cites":0,"role":"today","note":"Closest of your papers: [[3184726]] (coupling 0.05, 8 shared references). Closest network paper: [[2851262]] (coupling 0.16, 15 shared references). Shared topics: turn out.","score":13.1,"rank":13,"section":"new","parts":[0.0,0.14,0.45,0.0,0.21],"abstract":"In thermal leptogenesis with three hierarchical heavy neutrinos $N_1$, $N_2$ and $N_3$, the baryon asymmetry can be the small remainder of large contributions that cancel. Interference terms in the CP asymmetry are known to contribute to the final asymmetry through flavour-dependent washout. However, it remains unclear where the cancellation occurs, how large the interference contribution is, and how the accuracy of approximate equations changes when this information is lost. We split the CP asymmetry into diagonal and off-diagonal parts in the charged-lepton basis and evolve them with Standard Model transport equations. We find that the cancellation occurs mainly between the diagonal and off-diagonal parts of the same heavy neutrino, and that it is caused by flavour-dependent washout. We also find that the interference between the lepton state produced in the decay and the states orthogonal to it typically accounts for most of the $N_2$ and $N_3$ contribution. Approximations that reduce the CP asymmetry to flavour populations turn out to miss most of this contribution, whereas density-matrix equations with the full CP-asymmetry matrix agree much better.","authors":"Teruyuki Kitabayashi","nlinked":61,"nref":68,"src":"INSPIRE","html":true},{"id":"3233831","arxiv":"2611.33292","title":"Harder, Better, Faster, Stronger: The $Δ(1232)$ Resonance in Supernova QCD Axion Emission","first":"Arcangeli","nauth":5,"year":2026,"cites":0,"role":"today","note":"Also cites widely used network papers: [[1783234]], [[2817040]]. Closest of your papers: [[1597138]] (coupling 0.05, 13 shared references). Closest network paper: [[2866211]] (coupling 0.09, 19 shared references).","score":12.8,"rank":14,"section":"new","parts":[0.11,0.16,0.26,0.0,0.0],"abstract":"The high-energy tail of supernova axion emission controls searches whose response grows with axion energy. We identify a novel production channel, in which the axion is emitted through an intermediate $Δ(1232)$ resonance, which adds a hard component to the spectrum. We calculate the axion production rate from nucleon-nucleon Bremsstrahlung in chiral effective field theory through next-to-leading order. Including the $Δ(1232)$ roughly doubles the luminosity at one second after bounce and increases the number of escaping axions above $200$ MeV by a factor of about $3$ over the first nine seconds, relative to the nucleon-only calculation. Adding this new production channel roughly doubles $γ$-ray counts from conversion in the progenitor's magnetic field and increases water-Cherenkov counts by about an order of magnitude through its combined effects on emission and absorption. The same hard component can mimic a higher core temperature or thermal-pion emission in $γ$-ray spectral fits. The $Δ(1232)$ resonance is therefore crucial for predicting supernova axion signals and interpreting their spectra.","authors":"Paolo Arcangeli, Konstantin Springmann, Michael Stadlbauer, Stefan Stelzl, Andreas Weiler","nlinked":139,"nref":159,"src":"INSPIRE","html":true},{"id":"3233786","arxiv":"2611.33180","title":"Testing the Unitarity of Three-Flavor Neutrino Mixing above the GUT Scale","first":"Koranga","nauth":2,"year":2026,"cites":0,"role":"today","note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[3184726]] (coupling 0.03, 4 shared references). Closest network paper: [[2707246]] (coupling 0.10, 3 shared references). Shared topics: neutrino mass.","score":11.0,"rank":15,"section":"new","parts":[0.06,0.11,0.28,0.0,0.16],"abstract":"We investigate how physics between the grand-unification and Planck scales affects neutrino mixing in the standard three-flavor framework, distinguishing genuine non unitarity from unitary shifts of the mixing parameters. First, we show that heavy gauge singlet states at or above the grand-unification scale induce deviations from unitarity of the effective (3\\times3) Pontecorvo Maki Nakagawa Sakata (PMNS) matrix, suppressed by the ratio of the light-neutrino mass to the heavy mass. The resulting effects are estimated to be of order (10^{-27}), far below current oscillation constraints. Second, we examine the impact of a flavor-blind dimension-five Weinberg operator suppressed by a high-energy scale (Λ). This operator modifies the neutrino mass matrix and shifts the mixing angles while preserving the exact unitarity of the PMNS matrix. Using the NuFIT 6.1 best-fit parameters for normal mass ordering, including the Dirac CP-violating phase, and numerically diagonalizing the corrected complex-symmetric mass matrix, we find that the shift in (θ_{12}) can reach approximately (0.12^\\circ) at the Planck scale for a quasi-degenerate neutrino spectrum, compared with (0.011^\\circ) for normal ordering. The corrections increase as (1/Λ), reaching approximately (6.5^\\circ) for normal ordering near the grand-unification scale, where perturbation theory becomes unreliable for the quasi-degenerate spectrum. Since the Weinberg operator acts entirely within the active three-flavor sector, it introduces no additional non-unitarity parameters; instead, the correlated shifts of the three mixing angles are governed by a single parameter. Our results demonstrate that tests of active-flavor probability conservation cannot directly constrain this high-scale contribution. Its phenomenological signatures must instead be sought in the correlated modifications of the neutrino mixing parameters.","authors":"Bipin Singh Koranga, Samrat Vashisht","nlinked":23,"nref":27,"src":"INSPIRE","html":true},{"id":"3233883","arxiv":"2611.33787","title":"Higgsino dark matter explanation of LZ high-recoil event from deflected AMSB with $U(1)_X$ generated $μ$ term","first":"Li","nauth":2,"year":2026,"cites":0,"role":"today","note":"Closest of your papers: [[926166]] (coupling 0.02, 2 shared references). Closest network paper: [[3202840]] (coupling 0.18, 13 shared references). Shared topics: dark matter.","score":11.0,"rank":16,"section":"new","parts":[0.0,0.06,0.52,0.0,0.13],"abstract":"Motivated by the recent LZ high-recoil event, we propose to study the Higgsino dark matter in a supersymmetric $U(1)_X$ framework with one charged visible singlet. The gauge symmetry forbids the bare Higgs bilinear and the cubic $S^3$ while allowing the singlet interaction that generates an effective Higgsino mass after symmetry breaking. We present the six-state neutralino mixing matrix, including the $U(1)_X$ gaugino and the singlino, and the resulting neutral Higgsino mass splitting. Different deflected-anomaly-mediated parameter regimes provide the soft-mass hierarchies needed for light, 1.1 TeV and heavy Higgsino candidates. The cosmological consequences of the messenger sector in deflected AMSB can affect greatly the thermal history of the dark matter. Late messenger decays can supplement an underabundant thermal population or dilute an overabundant one through entropy production. These possibilities are governed by a common final-yield relation: a dominating messenger must have sufficiently suppressed Higgsino production for net dilution to succeed. We organise the 500 GeV, 1.1 TeV and 100 TeV reference regimes around this condition. Direct-detection and solar-capture constraints are discussed as tests of the resulting spectrum and final abundance. The elastic bino- or singlino-like interpretation of the same event is also realized in this spectrum: the Higgsino asymmetry $|X_A|\\simeq10^{-2}$ that a $248\\keV$ recoil requires arises without tuning, with a spin-dependent rate lying close to the present experimental sensitivity.","authors":"Ke-Lin Li, Fei Wang","nlinked":59,"nref":83,"src":"INSPIRE","html":true},{"id":"3095581","arxiv":"2512.21151","title":"Acoustic gravitational waves from primordial curvature perturbations","first":"Ning","nauth":5,"year":2026,"cites":0,"role":"repl","note":"Closest of your papers: [[2826987]] (coupling 0.04, 8 shared references). Closest network paper: [[3081453]] (coupling 0.14, 27 shared references). Shared topics: gravitational wave.","score":11.0,"rank":17,"section":"replacement","parts":[0.0,0.14,0.4,0.0,0.1],"abstract":"Standard perturbative calculations of scalar-induced gravitational waves (SIGWs) have neglected nonperturbative effects in the large-amplitude regime. We develop a hybrid numerical framework to signify nonperturbative effects on the stochastic gravitational wave (GW) background sourced by primordial curvature perturbations, focusing on the acoustic channel (fluid motions). Fully general-relativistic, spherically symmetric simulations are used to extract nonperturbative sound-shell profiles from isolated curvature peaks; these profiles are then embedded into three-dimensional lattice evolutions of relativistic hydrodynamics coupled to transverse-traceless metric perturbations to compute the acoustic GW spectra. The acoustic signal has a peak frequency determined by the comoving shell thickness, and its amplitude is extremely sensitive to the mean comoving separation of peaks, scaling approximately as $R_{*c}^{-7}$. We find a robust causal low-frequency tail $\\propto k^{3}$, and the nonlinear hydrodynamic interactions can enhance the ultraviolet power. Comparing with SIGWs computed perturbatively from the same real-space configuration, we show that acoustic GWs can be amplified by an order of magnitude and display a peak shifted to a lower frequency in the large-amplitude regime. These results highlight the importance of nonperturbative effects for accurate predictions of stochastic GW signals induced from primordial curvature perturbations.","authors":"Zhuan Ning, Zi-Yan Yuwen, Xiang-Xi Zeng, Rong-Gen Cai, Shao-Jiang Wang","nlinked":96,"nref":96,"src":"INSPIRE","html":true},{"id":"3233925","arxiv":"2611.34172","title":"Black hole accretion flows as dark matter bolometers","first":"Ding","nauth":3,"year":2026,"cites":0,"role":"today","note":"Closest of your papers: [[3130296]] (coupling 0.08, 14 shared references). Closest network paper: [[3115426]] (coupling 0.07, 8 shared references). Shared topics: dark matter.","score":10.9,"rank":18,"section":"new","parts":[0.0,0.22,0.19,0.0,0.13],"abstract":"Astrophysical systems provide powerful probes of dark matter interactions, complementing direct-detection searches. We propose using accretion flows of the supermassive black hole as a bolometer for light DM. The kinetic energy of sub-MeV dark matter in the black hole gravitational potential can remain below the thermal energy of the plasma electrons. The colder dark matter population can therefore absorb energy through elastic scattering, cooling the electrons and modifying their emission spectrum. We integrate dark matter cooling into the advection-dominated accretion flow around M87$^{*}$ and solve the full set of thermodynamic equations to obtain the resulting temperature profile and radio-to-millimeter emission. By comparing the predicted spectrum with observations accompanying the Event Horizon Telescope campaign, we use, for the first time, the thermal energy balance of the hot accretion flow to constrain DM-electron scattering, obtaining stringent limits on keV-to-MeV DM for both heavy and light mediators.","autho er: [[2128137]] (coupling 0.09, 8 shared references). Shared topics: gravitational wave.","abstract":"The dynamics of electroweak phase transition could have profound consequences for particle physics and cosmology. We study the prospects for the HL-LHC to probe the strong first-order electroweak phase transition (SFOEWPT) regime in the type-I 2HDM. We focus on the Higgstrahlung channel $pp\\to ZH/A$ with a resonant top-quark pair final state $H/A\\to t\\bar t$. We find that the top-quark pair final state renders the largest sensitivity to the SFOEWPT regime, in comparison to the other Higgstrahlung searches already performed by ATLAS and CMS, that focus on the $H/A\\to bb$ and $H\\to WW$ final states. We also derive the complementarity of the Higgstrahlung searches with other relevant classes of searches at the HL-LHC and compare them with the gravitational wave sensitivity at LISA."},{"arxiv":"2606.00237","id":"3164280","title":"Matter-wave Interferometers as Open-system Dark Matter Detectors","authors":"Leonardo Badurina, Kathryn M. Zurek","score":7.5,"section":"replacement","rank":20,"parts":[0.0,0.07,0.11,0.0,0.36],"note":"Closest of your papers: [[2794409]] (coupling 0.03, 2 shared references). Closest network paper: [[2033551]] (coupling 0.04, 3 shared references). Shared topics: dm mass, dark matter.","abstract":"Matter-wave interferometers (MWIs) offer a uniquely quantum route to dark matter (DM) detection: DM can reveal itself through phase and decoherence between spatially separated wavepackets, even when energy deposition is negligible and no resolvable recoil displacement occurs. We formulate these effects in an open effective field theory for MWIs using the Schwinger--Keldysh formalism, which highlights a structural asymmetry between the two detection channels. For elastic spin-independent DM scattering, decoherence inherits novel Bose enhancement or Pauli blocking factors, while the phase is at most linear in the DM occupation number. By retaining the DM's coherence time, this framework spans Markovian and non-Markovian dynamics across a wide range of DM masses, and systematically organizes corrections beyond the heavy-probe limit."},{"arxiv":"2611.34927","id":"3234032","title":"KEBBABS: Kilometric Enhanced Balloon-Baseline for Axion Birefringence Search","authors":"Tommaso Feri, Silvia Gasparotto","score":7.1,"section":"new","rank":21,"parts":[0.0,0.15,0.1,0.0,0.13],"note":"Closest of your papers: [[1597138]] (coupling 0.05, 6 shared references). Closest network paper: [[1286910]] (coupling 0.03, 6 shared references). Shared topics: dark matter.","abstract":"We propose a broadband search for ultralight axion dark matter through the rotation of laser polarization induced by the axion--photon coupling. Two stratospheric balloons flying at altitudes of 30--40 km form a free-space optical link. One balloon sends a linearly polarized beam to the other, which reflects it back to a polarimeter on the first balloon. The long physical baseline provides an alternative to the repeated reflections used in resonant optical cavities. We target axion masses in the range $4\\times10^{-15}\\,\\mathrm{eV}\\lesssim m_a\\lesssim10^{-11}\\,\\mathrm{eV}$. The lower edge corresponds to a frequency of about $1\\,\\mathrm{Hz}$, below which gondola roll about the line of sight can mimic a polarization signal. At $m_a=10^{-14}\\,\\mathrm{eV}$, a low-cost Pathfinder using flight-demonstrated technology could probe couplings as small as $g_{aγ}\\simeq2.8\\times10^{-11}\\,\\mathrm{GeV}^{-1}$, about a factor of two below the CAST bound. At the same mass, the Feasible today configuration could probe couplings just below the astrophysical bounds considered here, while the Futuristic configuration could reach $g_{aγ}\\simeq6.4\\times10^{-15}\\,\\mathrm{GeV}^{-1}$, roughly two orders of magnitude below those bounds."},{"arxiv":"2611.33277","id":"3233802","title":"Unitarization from Spin Geometry","authors":"Francesco Bertucci, James Bonifacio, Andrew Schrader","score":6.6,"section":"cross","rank":22,"parts":[0.0,0.0,0.44,0.0,0.0],"note":"Closest network paper: [[2832249]] (coupling 0.15, 14 shared references).","abstract":"We derive the dimensional reduction of 10D super Yang-Mills theory on a general closed 6D spin manifold using spectral decompositions for the higher-dimensional gauge field and gaugino, keeping the infinite towers of Kaluza-Klein (KK) modes in the lower-dimensional theory. We then calculate tree-level $2 \\rightarrow 2$ scattering amplitudes with external massive spinors and vectors in this lower-dimensional theory. By studying the high-energy behavior of these amplitudes and imposing perturbative unitarity, we derive several sum rules that involve the eigenvalues of Laplace and Dirac operators on the internal 6-manifold, together with products of cubic coupling constants of the KK modes. These give concrete realizations of the known unitarity sum rules for spontaneously broken gauge theories. We illustrate explicitly how the simplest sum rule is satisfied for flat tori and round spheres."},{"arxiv":"2609.11896","id":"3202299","title":"Mathematical inverse problem for the world data inference of the parton distribution functions of the proton","authors":"Henri Hänninen","score":6.5,"section":"replacement","rank":23,"parts":[0.11,0.03,0.11,0.0,0.0],"note":"Also cites widely used network papers: [[1362180]], [[2817040]]. Closest of your papers: [[3094526]] (coupling 0.01, 3 shared references). Closest network paper: [[2817040]] (coupling 0.04, 61 shared references).","abstract":"We show that the inference problem of constraining the parton distribution functions of the proton from deeply inelastic scattering data can be formulated as a linear tensor reconstruction inverse problem. This means that instead of fitting model parameters to the world data, a reconstructive approach to solve a system of coupled linear functional integral equations can be formulated. We leverage the mathematical structures of the integral equations defined by perturbative QCD and global analysis to pose the problem of global analysis as a coupled system of linear integral equations, and construct a proof-of-principle methodology to solve it. To formulate this approach concretely, we review all next-to-leading order accuracy results for inclusive virtual photon, neutral current, charged current, heavy flavor production, and neutrino deep-inelastic lepton--proton scattering. This mathematical methodology of inference opens a path towards a parametrization-bias-free extraction of the proton PDFs from the world data of deeply inelastic scattering in the spirit of indirect measurement employed in mathematical inverse problems, including robust estimation of uncertainties with reduced bias from model parametrization, while closely adhering to the established paradigm of perturbative QCD and global analysis."},{"arxiv":"2611.34595","id":"3233999","title":"Gravity-induced mixing, regeneration and CP violation","authors":"Jean-Marcel Rax","score":6.3,"section":"new","rank":24,"parts":[0.06,0.03,0.14,0.0,0.14],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[3184726]] (coupling 0.01, 1 shared references). Closest network paper: [[2074575]] (coupling 0.05, 6 shared references). Shared topics: early universe.","abstract":"The analysis of neutral mesons oscillations perturbed by Earth's gravity reveals a small coupling between flavor oscillations and quarks zitterbewegung. As a result of this small gravity-induced coupling between two very low energy oscillations, the mass eigenstates are no longer the Charge-Parity eigenstates. The three types of observed CP violation effects result from this gravity-induced mixing. The associated violation parameters are predicted in full agreement with the experimental data. Thus gravity-induced CP violation offers the accurate framework to understand the origin of CP symmetry violation in neutral mesons experiments. This origin renews in depth the problem of the required large-scale asymmetric baryogenesis in the early universe. Furthermore, the issues of the small time reversal violation in neutral kaons experiments and of the strong CP problem are fully clarified within this new framework of analysis taking into account gravity."},{"arxiv":"2610.31370","id":"3218163","title":"Revealing irregularities through distributional discrepancies in latent space via Stein-witness estimation","authors":"Ali Eren Simsek","score":6.2,"section":"replacement","rank":25,"parts":[0.0,0.06,0.29,0.0,0.0],"note":"Closest of your papers: [[1455793]] (coupling 0.02, 1 shared references). Closest network paper: [[3187354]] (coupling 0.10, 2 shared references).","abstract":"RIDDLE is a new method for resonant anomaly detection that uses a scalar Stein-witness function to identify discrepancies between unlabeled signal-region events and a background distribution inferred from dijet-mass sidebands. The witness is optimized in a latent representation of auxiliary jet observables against a differentiable background reference, without requiring an explicit signal model. The method is evaluated using simulated LHC Olympics dijet events and compared with its idealized and supervised benchmarks, which share the same statistical construction but use additional background or signal information, and with LaCATHODE as an independent anomaly detection method. RIDDLE demonstrates strong signal-background discrimination comparable to the idealized benchmark, generally outperforming LaCATHODE while largely preserving the background dijet-mass spectrum under anomaly-score selection. Tests incorporating additional angular information and deliberately mass-correlated features further demonstrate the method's robustness under the studied conditions. Together, these results highlight the potential of RIDDLE as a robust, data-driven approach for enhanced resonance searches that combines effective anomaly discrimination with background-shape preservation."},{"arxiv":"2507.15110","id":"2952263","title":"Smooth binary evolution from wide resonances in boson clouds","authors":"Giovanni Maria Tomaselli","score":6.0,"section":"replacement","rank":26,"parts":[0.0,0.03,0.34,0.0,0.0],"note":"Closest of your papers: [[1941263]] (coupling 0.01, 2 shared references). Closest network paper: [[2791814]] (coupling 0.12, 8 shared references).","abstract":"Ultralight scalars can form superradiant clouds around rotating black holes. These may alter the dynamics of compact binaries and the ensuing waveform through orbital resonances and cloud ionization. We re-examine resonances involving states with nonzero decay width, deriving an effective treatment for resonances that are wider than the binary's frequency chirp. We demonstrate the utility of this approach by calculating an upper bound for the cloud's mass surviving up to the latest stages of the inspiral. Next, we study the accumulation of resonances with high-energy bound states. When these infinitely many, increasingly weak resonances are properly taken into account, they smooth out the \"sharp features\" in the binary's evolution that had been attributed to the ionization of the cloud. We compare our Newtonian results with recent relativistic calculations, highlighting common features as well as discrepancies. Our conclusions emphasize the need to carefully incorporate resonances in boson cloud waveform modeling."},{"arxiv":"2611.28144","id":"3232168","title":"ACT Excited: Reconciling Starobinsky and Quadratic Chaotic Inflationary Models with ACT Results via Excited States","authors":"Amjad Ashoorioon, Abdolreza Yousefi-Sostani","score":5.8,"section":"cross","rank":27,"parts":[0.0,0.12,0.14,0.0,0.0],"note":"Closest of your papers: [[2663002]] (coupling 0.05, 6 shared references). Closest network paper: [[3177342]] (coupling 0.05, 10 shared references).","abstract":"Data Release 6 of the Atacama Cosmology Telescope, combined with Planck, CMB lensing and DESI BAO data, favours a higher scalar spectral index $n_{s}$ than Planck and a mildly positive running $α_{s}$, putting the Starobinsky model in tension with the data, while the quadratic chaotic model is already excluded by its large tensor-to-scalar ratio $r$. We show that relaxing the Bunch--Davies assumption for the initial state of the scalar perturbations can restore agreement without modifying the inflaton potential. Parametrising the Bogoliubov coefficients by an excitation parameter $χ_{S}$ and a relative phase $2\\varphi_{S}$, we derive the shifts of $n_{s}$ and $α_{s}$ induced by their scale dependence and map the regions of the $(\\varphi_{S},χ_{S})$ plane compatible with the $1σ$ ACT DR6 ranges, the bound $r<0.038$, and the requirement that the scale of new physics $Λ$ exceed the Hubble scale $H$. For the Starobinsky model, a scale-dependent $χ_{S}$ or $\\varphi_{S}$ works almost everywhere in this plane: only small neighbourhoods of $\\varphi_{S}=0,π$ with $χ_{S}\\gtrsim1.22$ are excluded, and a scale-dependent phase fails at $\\varphi_{S}=0,π/2,π$ and at $χ_{S}=0$, where the required ${\\rm d}\\varphi_{S}/{\\rm d}\\ln k$ and ${\\rm d}^2\\varphi_{S}/{\\rm d}(\\ln k)^2$ diverge. For the QC model, the excited state must also suppress $r$, which requires $χ_{S}\\gtrsim0.63$ and $Λ\\lesssim6H$. A scale-dependent $χ_{S}$ must satisfy $|{\\rm d}χ_{S}/{\\rm d}\\ln k|\\gtrsim0.0021$ in both models, and in the QC model we show analytically that $0.0021\\lesssim{\\rm d}χ_{S}/{\\rm d}\\ln k\\lesssim0.0058$ and $0.0008\\lesssim{\\rm d}^2χ_{S}/{\\rm d}(\\ln k)^2\\lesssim0.0062$. If the tensor modes remain in the BD state, the scenario also predicts a violation of the consistency relation $r=-8n_{T}$, testable once the tensor power spectrum and its tilt are measured."},{"arxiv":"2611.34856","id":"3234031","title":"Probing the CKM Origin of CP Violation with Paramagnetic EDMs and Rare Kaon Decays","authors":"Giancarlo D'Ambrosio, Luca Di Luzio","score":5.7,"section":"new","rank":28,"parts":[0.06,0.04,0.16,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2690106]] (coupling 0.01, 2 shared references). Closest network paper: [[3152706]] (coupling 0.06, 4 shared references).","abstract":"In the Standard Model, paramagnetic electric dipole moments (EDMs) are dominated by kaon exchange, which pairs the CP-violating short-distance transition $s\\to d\\,e^+e^-$ with a CP-conserving weak kaon-nucleon coupling. Long-distance two-photon exchange, which dominates $K_L\\to e^+e^-$, gives an electron vertex about thirty-five times larger than the short-distance one and could obscure this origin. We show that it does not: the two-photon vertex conserves CP and must be paired with the CP-violating penguin component of the nucleon coupling, whose relative size is $3\\times10^{-4}$, so that electromagnetic corrections stay at the few-percent level. Paramagnetic EDMs therefore measure $\\mathrm{Im}(V_{ts}^*V_{td})$ and, together with the CP-violating $S$ wave of $K_S\\toμ^+μ^-$ and $K_L\\toπ^0ν\\barν$, determine the same imaginary coordinate of a kaon CKM plane with electrons, muons, and neutrinos, without $B$-decay input. Lepton-specific new physics, or CP violation that bypasses kaon exchange, would separate these determinations. Testing their common CKM origin calls for coordinated progress in molecular EDM searches, rare-kaon experiments at LHCb, NA62, and KOTO, and lattice determinations of weak nucleon matrix elements."},{"arxiv":"2611.34808","id":"3234016","title":"Probing Ultralight Dark Matter at the Electroweak Scale","authors":"Martin Bauer, Sreemanti Chakraborti","score":5.5,"section":"new","rank":29,"parts":[0.0,0.06,0.16,0.0,0.14],"note":"Closest of your papers: [[1597138]] (coupling 0.02, 2 shared references). Closest network paper: [[2810207]] (coupling 0.05, 9 shared references). Shared topics: dark matter.","abstract":"Ultralight dark matter provides an explanation for astrophysical evidence for dark matter at all scales. This non-thermal dark matter requires a misalignment mechanism to reproduce the observed matter energy density of the Universe and therefore induce oscillating, time-dependent signals. We determine the sensitivity of current and future collider measurements of the width of the Z and Higgs bosons, and show that CP odd observables such as dipole moments in $Z\\to τ^+τ^-$ decays provide a better sensitivity to ultralight dark matter than atomic clocks or equivalence principle tests."},{"arxiv":"2611.34838","id":"3234042","title":"Screening of New Abelian Long-Range Forces","authors":"Marco Costa, Andrey Shkerin, Ananda Thomlinson","score":5.1,"section":"new","rank":30,"parts":[0.06,0.06,0.09,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[3130296]] (coupling 0.02, 2 shared references). Closest network paper: [[3089716]] (coupling 0.03, 3 shared references).","abstract":"We study how bounds on new $U(1)$ long-range forces, resulting from gauging the Standard Model symmetries $B-L$ and $L_a-L_b$, $a,b=e,μ,τ$, are modified if the mediator mass is generated by the Higgs mechanism. Large baryonic and leptonic charges of astronomical bodies displace the Higgs field from its vacuum value, resulting in charge screening. Depending on the $U(1)$ Higgs mass, the screening relaxes the bounds on the new force strength and mediator mass from equivalence principle violation and neutrino oscillations experiments, and eliminates the bounds on the muonic $L_μ-L_τ$ force from neutron star binaries."},{"arxiv":"2611.33311","id":"3233800","title":"Machine Learning for Calabi--Yau Geometry and Heterotic Compactification","authors":"Vishnu Jejjala, Damian Mayorga Pena","score":4.7,"section":"cross","rank":31,"parts":[0.06,0.07,0.04,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1655573]] (coupling 0.03, 3 shared references). Closest network paper: [[2821768]] (coupling 0.01, 2 shared references).","abstract":"Quantitative predictions from string compactification depend on geometric data that are difficult to compute analytically. This review surveys machine learning approaches to predicting topological properties of Calabi-Yau manifolds, discusses the search for new Calabi-Yau fourfolds, as well as numerical methods for approximating Ricci-flat metrics. In the context of heterotic compactifications, we explain how bundle metrics and harmonic matter forms enter calculations of canonically normalized Yukawa couplings and axion-matter interactions. We also outline applications to flux compactifications, warped and corrected backgrounds, and geometric structures beyond the Calabi-Yau setting. Finally, we review available datasets and software, highlight connections with analytic methods, and discuss geometric constraints, numerical validation, and recent progress in rigorous error control."},{"arxiv":"2611.34797","id":"3234027","title":"Measuring the flavor composition of high-energy neutrinos from the Milky Way","authors":"Mauricio Bustamante","score":4.7,"section":"cross","rank":32,"parts":[0.06,0.03,0.13,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2751074]] (coupling 0.01, 1 shared references). Closest network paper: [[2796272]] (coupling 0.04, 8 shared references).","abstract":"The origin of the Milky Way's high-energy neutrinos is debated. Their flavor composition reflects how they are made and could help settle it, but remains to be measured. We show that IceCube and KM3NeT, which see the inner Galaxy in complementary ways from opposite hemispheres, could start resolving its flavor composition in about a decade. With upcoming telescopes, they would infer the $ν_e$ fraction at the sources to within 27%. A first comparison of Galactic and extragalactic flavor compositions could reveal strong magnetic fields in extragalactic sources or neutrino decay."},{"arxiv":"2611.33324","id":"3233805","title":"NuSrcAgent: An AI Agent for High-Energy Neutrino Source Searches","authors":"Bei Zhou, Po-Wen Chang, Kohta Murase","score":4.4,"section":"cross","rank":33,"parts":[0.06,0.04,0.08,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2751074]] (coupling 0.02, 1 shared references). Closest network paper: [[2891229]] (coupling 0.03, 3 shared references).","abstract":"Identifying the sources of high-energy cosmic neutrinos is crucial for understanding cosmic particle accelerators and probing new physics. IceCube provides public data that allow researchers to search independently for neutrino sources, but these analyses require substantial technical expertise and careful scientific choices. We present \\system, the first publicly available AI agent for high-energy neutrino source searches. Compared to public likelihood codes, \\system is easier to install and use, and supports more analysis types. To start an analysis, users need only specify a source or catalog. The agent takes natural-language requests, runs likelihood analyses on public IceCube event data, and saves the settings and calculation records so users can repeat the analyses. We demonstrate \\system through single-source and catalog stacking analyses, obtaining results consistent with IceCube results. These examples also show its ability to search the literature, analyze non-power-law spectra using user-provided model code, and develop new analysis functions, such as signal-injection simulations. \\system is also a powerful tool for improving and testing existing analysis code, as we demonstrate by using it to refine the background probability density functions and reduce residuals and spurious signal contributions in stacking analyses. \\system makes high-energy neutrino data analysis more accessible to the broader research community. Code and usage instructions: \\href{https://github.com/beizhouphys/NuSrcAgent}{\\faGithub\\ {\\tt github.com/beizhouphys/NuSrcAgent}}."},{"arxiv":"2611.34888","id":"3234045","title":"The Look-Elsewhere Effect in Searches for New Physics: from Classical Methods to Machine Learning","authors":"Gaia Grosso, Sergio Rodriguez-Benitez, Louis Lyons","score":4.3,"section":"new","rank":34,"parts":[0.0,0.07,0.15,0.0,0.0],"note":"Closest of your papers: [[2751074]] (coupling 0.02, 1 shared references). Closest network paper: [[3095771]] (coupling 0.05, 3 shared references).","abstract":"The look-elsewhere effect (LEE) arises when the location of an effect in parameter space is not specified in advance: scanning many locations inflates the significance of the largest excess, and the local $p$-value must be corrected into a global one. A well-established framework, rooted in the work of Davies and operationalised for particle physics by Gross and Vitells, provides this correction for scans over continuous parameters. Some aspects, however, remain unsettled. The definition of \"elsewhere\" is ambiguous and ranges from a single distribution to an entire experimental programme. Moreover, the analytical shortcuts of the classical framework do not carry over to searches based on machine learning (ML), which are affected by an implicit post-selection bias that depends on the model's resolution and expressiveness. This review covers the LEE in searches for new physics at colliders, from its statistical foundations to these modern challenges. We discuss the corrections for continuous scans and for multiple discrete tests, illustrated with simple numerical examples, and the interaction between ML and the LEE, which we connect to the broader literature on selective inference. We highlight open problems, including the computational cost of empirical calibration for complex models and the development of analytical shortcuts for ML test statistics, and offer recommendations for reporting discovery significance in both classical and ML-based searches in particle physics."},{"arxiv":"2512.11539","id":"3092489","title":"Lindblad-driven recombination of the X(3872) tetraquark","authors":"Néstor Armesto, Miguel Ángel Escobedo, Elena G. Ferreiro, Víctor López-Pardo","score":4.3,"section":"replacement","rank":35,"parts":[0.06,0.02,0.02,0.0,0.14],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[3184726]] (coupling 0.01, 1 shared references). Closest network paper: [[3156721]] (coupling 0.01, 1 shared references). Shared topics: production mechanism.","abstract":"The internal structure of the exotic meson X(3872) remains an open question. We investigate its production in heavy-ion collisions under the hypothesis that it is a compact tetraquark. To this end, we derive a coalescence model from the Lindblad equation, assuming that unbound heavy quarks are thermalized within the quark-gluon plasma and that the adiabatic approximation holds. Using this model, we predict the nuclear modification factor of the X(3872) at LHC energies, with proton-proton baseline cross sections estimated from available experimental data. We also consider the effect of simplifying assumptions on the model, and a complementary approach based on chemical equilibration. Our results indicate that recombination is the dominant production mechanism for a tetraquark X(3872). It leads to a significant yield enhancement in heavy-ion collisions, suggesting that the nuclear modification factor is a powerful observable for probing the exotic nature of this state"},{"arxiv":"2512.06671","id":"3090348","title":"Study of anomalous charged triple gauge couplings with $W^-W^+$ process at $e^-e^+$ collider","authors":"Amir Subba, Ritesh K. Singh","score":4.2,"section":"replacement","rank":36,"parts":[0.0,0.09,0.1,0.0,0.0],"note":"Closest of your papers: [[3094526]] (coupling 0.03, 8 shared references). Closest network paper: [[3206672]] (coupling 0.03, 6 shared references).","abstract":"We study anomalous charged triple gauge couplings (aTGC) in $e^-e^+\\to W^-W^+$ at $\\sqrt{s}=250$~GeV with longitudinally polarized beams, parameterized by the five dimension-six operators $\\mathcal{O}_{WWW}$, $\\mathcal{O}_{W}$, $\\mathcal{O}_{B}$, $\\mathcal{O}_{\\widetilde{W}WW}$ and $\\mathcal{O}_{\\widetilde{W}}$ of the HISZ basis. All three decay channels, $\\ell^\\pm jj\\slashed{E}$, $4j$ and $\\ell^-\\ell^+\\slashed{E}$, are simulated explicitly at a leading-order including all diagrams that contribute to each final state and hence the interference of $W^-W^+$ with non-resonant amplitudes. The semi-leptonic signal is selected with cuts on $m_{j_1j_2}$ and $m_T^W$. The flavor identity of the two hardest light jets are classified as \\emph{up}-type and \\emph{down}-type jets with a dedicated boosted decision trees (BDT). In the $4j$ channel a multi-class BDT separates $W^-W^+$ from $ZZ$ and QCD production and the $W^\\pm$ candidates are assigned using jet charge. In the dilepton channel $W^-W^+$ events are selected with cuts on $p_T^{\\ell^-}$ and $m_{\\ell^-\\ell^+}$, and the two neutrino momenta are reconstructed analytically from the on-shell and beam-energy constraints. The cross section and 80 polarization and spin-correlation asymmetries in four disjoint bins of $\\cosθ_{W^-}$ are combined for both beam-polarization configurations through a covariance-based $χ^2$. The two set of beam polarization offers an orthogonal cuts on parameter space leading to tighter bounds. The semi-leptonic and full-hadronic final states provides a competitive bounds on aTGCs, while full-leptonic offers the least sensitivity. Marginalized limits on aTGCs via. Markov Chain Monte Carlo analysis for integrated luminosities for different values of integrated luminosities and systematic benchmarks are reported."},{"arxiv":"2611.34007","id":"3233923","title":"Determining the kaon distribution amplitudes by fitting the $D\\to K$ transition form factor to investigate the equivalence of two chiral LCSR frameworks","authors":"Fang-Ping Peng, Sheng-Bo Wu, Hai-Bing Fu","score":3.9,"section":"new","rank":37,"parts":[0.06,0.01,0.1,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[3184726]] (coupling 0.00, 1 shared references). Closest network paper: [[2835155]] (coupling 0.04, 5 shared references).","abstract":"In this work, we fit the $D\\to K$ vector transition form factor (TFF) to the BESIII experimental data using a Monte Carlo (MC) method. We also calculate the TFF using QCD light-cone sum rules (LCSRs) with left-and right-handed chiral currents. For the TFF derived using the right-handed chiral current, the key input is the kaon twist-2 distribution amplitude (DA), for which we consider three models: the power-law parametrization ($\\mathrm{R1}$), the truncated Gegenbauer expansion ($\\mathrm{R2}$), and the light-cone harmonic oscillator (LCHO) model ($\\mathrm{R3}$). The parameters of these models are determined by fitting the corresponding TFF predictions to the MC-fit results. For the TFF derived using the left-handed chiral current, the dominant input is the kaon twist-3 DA ($\\mathrm{L4}$), which is constructed within the LCHO framework. Its parameters are determined from theoretical constraints rather than from the fit. In the large-recoil region, the resulting TFF are $f^{DK}_+(0)|_{\\rm{R1}}=0.7381^{+0.0180}_{-0.0194}$, $f^{DK}_+(0)|_{\\rm{R2}}=0.7320^{+0.0178}_{-0.0192}$, $f^{DK}_+(0)|_{\\rm{R3}}=0.7324^{+0.0180}_{-0.0191}$, and $f^{DK}_+(0)|_{\\rm{L4}}=0.7343^{+0.0459}_{-0.0573}$. We then calculate the decay widths and branching fractions of the semileptonic decays $D\\to K eν_e$ and extract the CKM matrix element $|V_{cs}|$. Finally, we predict the two important ratios, $\\mathcal{R}_{π^-/K^-}^{e}$ and $\\mathcal{R}_{π^0/K^0}^{e}$. All the obtained results are consistent with existing experimental measurements and theoretical predictions."},{"arxiv":"2611.33708","id":"3233850","title":"Singly-strange hidden-bottom and double-bottom molecular pentaquarks","authors":"Fu-Lai Wang, Jia-Ning Cui, Rui Chen, Xiang Liu","score":3.6,"section":"new","rank":38,"parts":[0.06,0.01,0.08,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[3184726]] (coupling 0.00, 1 shared references). Closest network paper: [[2817040]] (coupling 0.03, 32 shared references).","abstract":"Inspired by the observation of the singly-strange hidden-charm pentaquarks $P_{ψs}^Λ(4459)$ and $P_{ψs}^Λ(4338)$, we present a systematic investigation of the mass spectra of the singly-strange hidden-bottom and double-bottom molecular pentaquarks arising from the $Ξ_b^{(\\prime,\\,*)}B^{(*)}$ and $Ξ_b^{(\\prime,\\,*)}\\bar B^{(*)}$ interactions. Using the one-boson-exchange model, we derive the effective potentials for the $Ξ_b^{(\\prime,\\,*)}B^{(*)}$ systems by exchanging light mesons. The effective potentials for the corresponding $Ξ_b^{(\\prime,\\,*)}\\bar B^{(*)}$ systems are then obtained via the $G$-parity rule. By solving the coupled-channel Schrödinger equation with $S$-$D$ wave mixing and coupled-channel effects, we search for loosely bound states with all possible isospin and spin-parity quantum numbers. Our results show that the $Ξ_b B$ state with $I(J^P)=0(1/2^-)$, the $Ξ_b B^*$ states with $I(J^P)=0(1/2^-)$ and $0(3/2^-)$, the $Ξ_b^\\prime B$ state with $I(J^P)=0(1/2^-)$, the $Ξ_b^* B$ state with $I(J^P)=0(3/2^-)$, the $Ξ_b^\\prime B^*$ states with $I(J^P)=0(1/2^-)$ and $0(3/2^-)$, and the $Ξ_b^* B^*$ states with $I(J^P)=0(1/2^-)$, $0(3/2^-)$, and $0(5/2^-)$ are identified as promising candidates of the singly-strange hidden-bottom molecular pentaquarks. Their $Ξ_b^{(\\prime,\\,*)}\\bar B^{(*)}$ partners are likewise predicted to be the singly-strange double-bottom molecular pentaquark candidates. These predictions provide concrete targets for future experimental searches for exotic hadrons in the bottom sector, for example at LHCb."}],"rest":[{"arxiv":"2604.00099","title":"Light-by-light scattering: asymptot   const lab=sim.filter(s=>isNew(s.n)||s.n.role==='seed'||s.n.deg>=3);
  const L=lab.map(s=>{const right=s.x>W*.8,t=isNew(s.n)?`#${s.n.rank} ${s.n.first}`:`${s.n.first} ${s.n.year}`,w=t.length*6.2;return{s,t,right,x0:right?s.x-r(s.n)-4-w:s.x+r(s.n)+4,w,y:s.y+4}}).sort((a,b)=>a.y-b.y);
  const placed=[];L.forEach(l=>{let k=0;while(k<40&&placed.some(p=>l.x0<p.x0+p.w&&p.x0<l.x0+l.w&&Math.abs(l.y-p.y)<13)){l.y+=13*(k%2?-1:1)*(1+Math.floor(k/2));k++;l.y=Math.max(m.t+10,Math.min(H-m.b-4,l.y))}placed.push(l)});
  G.append('g').selectAll('text').data(L).join('text').attr('class','nlabel').attr('x',l=>l.right?l.s.x-r(l.s.n)-4:l.s.x+r(l.s.n)+4).attr('y',l=>l.y)
    .attr('text-anchor',l=>l.right?'end':'start').text(l=>l.t);
  paint();
}
function showTip(ev,n){const b=document.getElementById('chart').getBoundingClientRect();tip.hidden=false;tip.textContent=`${auth(n)} (${n.year}) — ${plain(n.title)}`+(isNew(n)?` · score ${n.score}`:'');
  let L=ev.clientX-b.left+12;if(L>b.width-290)L=ev.clientX-b.left-290;tip.style.left=Math.max(4,L)+'px';tip.style.top=(ev.clientY-b.top+12)+'px'}
function paint(){if(!G)return;const f=hover||sel,on=new Set();if(f){on.add(f.i);f.out.forEach(i=>on.add(i));f.inn.forEach(i=>on.add(i))}
  svg.classed('dim',!!f);
  G.selectAll('path.edge').attr('class',l=>'edge '+l.k+(!f?'':l.s===f.i?' hot out':l.t===f.i?' hot in':''));G.selectAll('path.edge.hot').raise();
  G.selectAll('circle').classed('on',s=>on.has(s.n.i)).classed('sel',s=>sel&&s.n.i===sel.i).classed('match',s=>query&&`${s.n.first} ${s.n.title} ${s.n.arxiv} ${s.n.authors||''}`.toLowerCase().includes(query));
  G.selectAll('text.nlabel').classed('on',l=>on.has(l.s.n.i))}
function panel(){const p=document.getElementById('panel'),n=sel;
  if(!n){p.innerHTML='<p>Select a paper in the network.</p>';return}
  const links=`<div class="links">${n.id?`<a href="https://inspirehep.net/literature/${n.id}" target="_blank" rel="noopener">INSPIRE</a>`:''}${n.arxiv?`<a href="https://arxiv.org/abs/${esc(n.arxiv)}" target="_blank" rel="noopener">arXiv</a>`:''}</div>`;
  if(isNew(n)) p.innerHTML=`<div class="role" style="color:${col(n)}">#${n.rank} · ${esc(SEC[n.section])} · score ${n.score.toFixed(1)}</div><h4>${esc(n.title)}</h4>
   <div class="meta">${esc(auth(n))} · arXiv:${esc(n.arxiv)}</div><p>${why(n.note)}</p><div class="links"><a href="#p${n.i}">Back to abstract</a></div>`;
  else p.innerHTML=`<div class="role" style="color:${col(n)}">${esc(ROLE[n.role])}</div><h4>${esc(n.title)}</h4>
   <div class="meta">${esc(auth(n))} · ${n.year}${n.arxiv?' · arXiv:'+esc(n.arxiv):''}</div>
   <div class="stats"><span>${n.cites.toLocaleString()} citations</span><span>${n.inn.filter(i=>isNew(N[i])).length} of the matches link here</span></div>${links}`;
  tex(p)}
function pick(n,scroll){sel=n;panel();paint();document.querySelectorAll('.paper').forEach(el=>el.classList.toggle('sel',el.id==='p'+n.i));if(scroll)document.getElementById('chart').scrollIntoView({behavior:'smooth',block:'nearest'})}
const present=new Set(N.map(n=>n.role));
document.getElementById('legend').innerHTML=['today','repl','seed','other'].filter(k=>present.has(k)).map(k=>`<span><i class="dot" style="background:var(--${k})"></i>${esc(ROLE[k])}</span>`).join('')+'<span style="color:var(--fg-3)">Listing papers: size ∝ score; others: size ∝ log(citations)</span>';
document.getElementById('q').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();paint()});
svg.on('click',ev=>{if(ev.target.tagName!=='circle'){sel=null;panel();paint()}});
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(draw,200)});
function nextList(){const X=RAW.next||[];if(!X.length)return;const box=document.getElementById('nextlist'),more=document.getElementById('more');
  more.hidden=false;more.querySelector('summary').firstChild.textContent=`The next ${X.length} papers by score `;
  const nmin=M.nextMin;
  document.getElementById('moresub').textContent=`below the threshold of ${M.threshold}${nmin!=null?`: every paper scoring ${nmin} or more, and at least ${M.nextCount} when available`:''}; not drawn in the network`;
  const cut=nmin!=null?X.findIndex(n=>n.score<nmin):-1;
  box.innerHTML=X.map((n,i)=>(i===cut?`<li class="divider">Below ${nmin}: weaker relation (most of these share no specific reference, coupling or topic with your work)</li>`:'')+`<li><div class="role" style="color:var(--${n.section==='replacement'?'repl':'today'})">#${n.rank} · ${esc(SEC[n.section])} · score ${n.score.toFixed(1)}</div>
    <div class="t">${esc(n.title)}</div><div class="authors">${authors(n.authors)} · arXiv:${esc(n.arxiv)}</div>
    ${n.note?`<p class="why">${why(n.note)}</p>`:''}
    <details class="abs"><summary>Abstract</summary><p class="abs">${esc(n.abstract)}</p></details>
    <div class="links">${n.id?`<a href="https://inspirehep.net/literature/${n.id}" target="_blank" rel="noopener">INSPIRE</a>`:''}<a href="https://arxiv.org/abs/${esc(n.arxiv)}" target="_blank" rel="noopener">arXiv</a><a href="https://arxiv.org/pdf/${esc(n.arxiv)}" target="_blank" rel="noopener">PDF</a></div></li>`).join('');
  more.addEventListener('toggle',()=>{if(more.open)tex(box)})}
const rtip=document.getElementById('reftip');let rcur=null;
function refShow(el){const r=REFS[el.dataset.ref];if(!r)return;rcur=el;rtip.textContent=`${auth(r)} (${r.year}) — ${plain(r.title)}`;rtip.hidden=false;
  const b=el.getBoundingClientRect(),t=rtip.getBoundingClientRect();let L=Math.min(Math.max(8,b.left),innerWidth-t.width-8),T=b.bottom+6;
  if(T+t.height>innerHeight-8)T=b.top-t.height-6;rtip.style.left=L+'px';rtip.style.top=T+'px'}
function refHide(){rtip.hidden=true;rcur=null}
document.addEventListener('pointerover',e=>{const el=e.target.closest('.ref');if(el&&e.pointerType==='mouse')refShow(el)});
document.addEventListener('pointerout',e=>{if(e.target.closest('.ref')&&e.pointerType==='mouse')refHide()});
document.addEventListener('click',e=>{const el=e.target.closest('.ref');if(el)refShow(el);else if(rcur)refHide()});
document.addEventListener('focusin',e=>{const el=e.target.closest('.ref');if(el)refShow(el)});
document.addEventListener('focusout',e=>{if(e.target.closest('.ref'))refHide()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')refHide()});
addEventListener('scroll',()=>{if(rcur)refHide()},{passive:true});
// the rest of the day's papers by score: only the title, linked to the arXiv record
function restList(){const X=RAW.rest||[];if(!X.length)return;const d=document.getElementById('rest'),box=document.getElementById('restlist');
  d.hidden=false;d.querySelector('summary').firstChild.textContent=`All other ${X.length} papers in this listing `;
  document.getElementById('restsub').textContent='by score, title only';
  box.innerHTML=X.map(n=>`<li><span class="sc">#${n.rank} · ${n.score.toFixed(1)}</span><a href="https://arxiv.org/abs/${esc(n.arxiv)}" target="_blank" rel="noopener">${esc(n.title)}</a></li>`).join('');
  d.addEventListener('toggle',()=>{if(d.open)tex(box)})}
list();nextList();restList();fold();draw();panel();
window.addEventListener('load',()=>{tex(document.getElementById('list'));tex(document.getElementById('panel'));fold();
  if(window.MathJax&&MathJax.startup&&MathJax.startup.promise)MathJax.startup.promise.then(()=>setTimeout(fold,300))});
addEventListener('resize',()=>{clearTimeout(window._ft);window._ft=setTimeout(fold,200)});
</script>
