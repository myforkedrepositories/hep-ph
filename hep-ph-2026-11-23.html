<script>
const RAW = {"n":[{"id":"3231822","arxiv":"2611.27518","title":"Probing Compressed Dark Sectors at a Muon Collider through Dilepton Signatures and Machine Learning","first":"Belfkir","nauth":3,"year":2026,"cites":0,"role":"today","note":"Cites 2 network papers: [[875754]], [[2740358]]. Also cites widely used network papers: [[2817040]], [[1518747]]. Closest of your papers: [[1455793]] (coupling 0.13, 13 shared references). Closest network paper: [[1674879]] (coupling 0.20, 13 shared references). Shared topics: relic abundance, scalar dark matter, dm mass, dark matter candidate, dark sector.","score":55.0,"rank":1,"section":"new","parts":[0.73,0.41,0.57,0.0,0.84],"abstract":"The inert doublet model (IDM), a minimal extension of the Standard Model (SM), provides a scalar dark matter (DM) candidate that belongs to the additional Higgs doublet. The model faces challenges in achieving the correct relic abundance for compressed spectra and DM masses in the high-mass range. In this work we investigate the prospects of detecting dark matter candidates at future high-energy muon colliders. Focusing on the process $μ^+ μ^- \\to AH$ with subsequent decay $A \\to H Z^*$ and $Z^* \\to \\ell^+\\ell^-$, we explore the sensitivity of machine learning techniques, specifically Boosted Decision Trees (BDT) and XGBoost, to distinguish the signal from Standard Model backgrounds. We demonstrate that the combination of advanced multivariate analysis with high-luminosity muon collisions enhances the discovery potential for inert scalars in compressed mass spectra scenarios.","authors":"Mohamed Belfkir, Ayoub Hmissou, Larbi Rahili","nlinked":42,"nref":42,"src":"INSPIRE","html":true},{"id":"3161877","arxiv":"2605.27910","title":"Matching second-order classical and 1-loop quantum tensor power spectra in de Sitter spacetime","first":"Hauser","nauth":2,"year":2026,"cites":0,"role":"repl","note":"Cites 2 network papers: [[3081453]], [[2756278]]. Closest of your papers: [[2826987]] (coupling 0.02, 2 shared references). Closest network paper: [[3081453]] (coupling 0.11, 17 shared references). Shared topics: gravitational wave.","score":31.9,"rank":2,"section":"replacement","parts":[0.7,0.05,0.33,0.0,0.1],"abstract":"Large corrections to the inflationary tensor power spectrum have been speculated to emerge either as second-order scalar-induced classical effects, or as 1-loop quantum corrections. These two sources are not independent of each other. Choosing the example of a massless minimally coupled scalar field, we show how the full 1-loop result can be divided into its classical and vacuum parts. Working first in dimensional regularization, we show that the classical part is IR divergent, with IR referring to small comoving momenta that have an influence for a very long time. In the full 1-loop quantum result, these divergences cancel. Introducing then a momentum cutoff that permits for a numerical evaluation of the classical contribution, we show that the IR sensitivity manifests itself as a cubic divergence. We suggest a procedure of \"non-perturbative renormalization\" for extracting physical information not affected by the divergence. If this can be implemented in realistic systems, it could consolidate numerical studies of inflationary scalar-induced gravitational waves.","authors":"A. Hauser, M. Laine","nlinked":59,"nref":59,"src":"INSPIRE","html":true},{"id":"3157804","arxiv":"2605.18944","title":"The Majoron Cosmological Window: Dark Matter and Thermal Leptogenesis","first":"Giorgi","nauth":3,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[2154677]]. Closest of your papers: [[1941263]] (coupling 0.03, 10 shared references). Closest network paper: [[3190925]] (coupling 0.13, 22 shared references). Shared topics: viable region, neutrino mass, production mechanism, dark matter.","score":31.0,"rank":3,"section":"replacement","parts":[0.45,0.11,0.36,0.0,0.66],"abstract":"The majoron is the Nambu-Goldstone boson associated with the spontaneous breaking of a global $B-L$ symmetry. Remarkably, the minimal majoron framework can simultaneously address three key empirical indications of physics beyond the Standard Model: neutrino masses, the matter-antimatter asymmetry, and dark matter. In this work, we identify the cosmologically viable region in which majoron dark matter and high-scale thermal leptogenesis can be realised simultaneously. We show that successful leptogenesis plays a central role in making this scenario predictive: by constraining the right-handed-neutrino mass scale, it determines the irreducible freeze-in contribution to the majoron abundance and fixes the size of the couplings relevant for visible dark matter decays. Combining the irreducible dark matter production mechanisms with warm dark matter limits and indirect searches for decaying dark matter, we map the resulting majoron cosmological window and show that future X- and gamma-ray telescopes can probe part of the surviving parameter space.","authors":"Arturo de Giorgi, Daniel Naredo-Tuero, Xavier Ponce Díaz","nlinked":171,"nref":178,"src":"INSPIRE","html":true},{"id":"3124274","arxiv":"2602.23915","title":"Impact of non-standard neutrino-electron interactions on Big Bang Nucleosynthesis","first":"Froustey","nauth":5,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[3193100]]. Closest of your papers: [[2663002]] (coupling 0.05, 6 shared references). Closest network paper: [[2895271]] (coupling 0.05, 5 shared references). Shared topics: big bang nucleosynthesis, early universe.","score":27.4,"rank":4,"section":"replacement","parts":[0.45,0.18,0.15,0.0,0.4],"abstract":"Neutrino non-standard interactions (NSI) with electrons, predicted in many extended theoretical models of particle physics, are known to alter the picture of neutrino decoupling from the cosmic plasma. We update previous analyses of neutrino decoupling in the presence of NSI with electrons, extending the parameter space and assessing their impact on the primordial light-element abundances produced during Big Bang Nucleosynthesis (BBN). We show that tracking the NSI-induced modifications of the neutrino distributions is necessary to accurately predict the helium-4 abundance, which cannot be derived from a pure $N_{\\rm eff}$-driven change. BBN therefore provides additional observables that are complementary to $N_{\\rm eff}$. We then derive cosmological constraints on non-universal and flavour-changing NSI parameters, using different dataset combinations, and compare them with bounds from terrestrial experiments. We find that the cosmological limits are significantly less stringent than the terrestrial ones, but they provide an independent probe of neutrino interactions in the early universe.","authors":"Julien Froustey, Stefano Gariazzo, Jaume Moncho, Sergio Pastor, Ofelia Pisanti","nlinked":49,"nref":52,"src":"INSPIRE","html":true},{"id":"3167179","arxiv":"2606.10017","title":"Refined anti-proton and anti-deuteron fluxes from weak-scale Dark Matter","first":"Cirelli","nauth":3,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[2795517]]. Closest of your papers: [[860906]] (coupling 0.05, 2 shared references). Closest network paper: [[2795517]] (coupling 0.06, 25 shared references). Shared topics: dark matter.","score":23.4,"rank":5,"section":"replacement","parts":[0.45,0.13,0.17,0.0,0.13],"abstract":"We provide the cosmic-ray (CR) fluxes of antiprotons and antideuterons produced by the Galactic annihilation or decay of weak-scale dark matter (DM) particles of masses in the range from a few GeV to 100 TeV. We estimate these fluxes based on the updated models for the propagation of charged particles in the Galaxy and using the improved $\\bar{p}$ and $\\bar{d}$ spectra provided by $\\texttt{CosmiXs}$. For the updated propagation models we consider the MIN/MED/MAX sets under the new SLIM/BIG/QUAINT schemes. We treat the Galactic propagation in a semi-analytic way including different possible effects such as spatial diffusion, energy-losses, convection and diffusive reacceleration. For the DM distribution in the Galactic halo we consider NFW, Einasto and Burkert profiles with the most updated parameters. Moreover, we also incorporate the latest models for the inelastic cross-sections of $\\bar{p}$ and $\\bar{d}$ based on ALICE data. We validate our calculations with those available in the literature or those obtained from other publicly available numerical packages. We compare the CR fluxes obtained in this work with those provided previously by $\\texttt{PPPC4DMID}$ which were based on old propagation scenarios. We find that the CR fluxes obtained here with the new propagation models are much more robust (compared to the older ones) under the variation MIN - MAX. We also discuss the impact of this in the improvement of the discovery potential of a possible DM signal in the light of the present and upcoming CR observations. We provide all our results for the DM-induced interstellar CR fluxes in a tabulated format (for the kinetic energy range 0.1 GeV - 100 TeV) in the $\\texttt{GitHub}$ repository of the newly created $\\texttt{CosmiXsPPPC}$ project. The results are ready to be used for studies related to DM indirect searches.","authors":"Marco Cirelli, Mattia Di Mauro, Arpan Kar","nlinked":46,"nref":49,"src":"INSPIRE","html":true},{"id":"3231716","arxiv":"2611.26691","title":"The cosmological lithium problem and how decaying relics still solve it","first":"Ovchynnikov","nauth":1,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Closest of your papers: [[3130296]] (coupling 0.02, 5 shared references). Closest network paper: [[2051195]] (coupling 0.07, 44 shared references).","score":20.2,"rank":6,"section":"new","parts":[0.45,0.05,0.19,0.0,0.0],"abstract":"Lithium-7 in old stars is about three times below the prediction of standard big-bang nucleosynthesis, and deuterium lies slightly above it. Precise measurements of deuterium, helium-4, and the effective number of neutrino species now disfavor most previously proposed particle solutions. We find that relics that decay or evaporate with lifetimes of a few hours, mostly into electron antineutrinos of about a hundred MeV and into electrons or photons, still lower lithium-7 while respecting these measurements. Such relics include gauge bosons of $L_e-L_τ$ or $B-3L_e$ and heavy neutral leptons with a dipole coupling or mixing with $ν_τ$, with masses of a few hundred MeV, and populations of evaporating Q-balls that carry lepton number. The decaying particles substantially alleviate the lithium problem, while Q-ball populations reach the $2σ$ range of lithium-7 adopted by the Particle Data Group. These relics can shift the effective number of neutrino species by up to about $2.5$ times the precision expected from the Simons Observatory, and a future Galactic supernova can test the particles.","authors":"Maksym Ovchynnikov","nlinked":188,"nref":194,"src":"INSPIRE","html":true},{"id":"3231823","arxiv":"2611.27602","title":"Probing grand unification in the dark dimension: proton decay and collider signatures","first":"Ahmed","nauth":2,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[2053590]]. Closest of your papers: [[1394206]] (coupling 0.02, 3 shared references). Closest network paper: [[2936613]] (coupling 0.05, 4 shared references).","score":20.2,"rank":7,"section":"new","parts":[0.45,0.08,0.14,0.0,0.0],"abstract":"We study the geometric connection between a stretched grand-unified state, proton decay, and electroweak Kaluza--Klein (KK) resonances in a dark-dimension-inspired interval model. The gravitational length sets the five-dimensional Planck scale, while a shorter gauge interval controls the KK spectrum and the stretched-state mass. We construct normalized fermion and Higgs profiles, diagonalize the neutral-vector sector, and determine its fermionic widths. Proton partial lifetimes are evaluated using a two-operator, SU(5)-inspired effective matching prescription. One-loop four-dimensional MSSM and split-supersymmetric reference running determines electroweak coupling-crossing scales and the residual strong-coupling mismatch. A selected common-threshold benchmark gives a heavy-state mass of $1.137\\times10^{16}$ GeV, a reference crossing of $1.139\\times10^{16}$ GeV, and a conditional proton partial lifetime of $8.72\\times10^{35}$ years. At a micron-scale gravitational length, suppressed baryon-violating matching amplitudes can satisfy proton limits, although the high-scale mass-matching condition selects a distinct region of the scanned geometry. Independently, a $5$ TeV neutral-vector benchmark yields an inclusive leading-order dielectron cross section of $0.183$ fb over $4.5$--$5.5$ TeV at a collider energy of $13.6$ TeV, before detector selection. The analysis provides quantitative effective-model benchmarks and identifies the remaining high-scale matching and experimental tests.","authors":"Waqas Ahmed, George K. Leontaris","nlinked":100,"nref":104,"src":"INSPIRE","html":true},{"id":"3226343","arxiv":"2611.10075","title":"Phenomenological explorations of a quasi-degenerate $Z'$ boson","first":"Kim","nauth":5,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[3193100]]. Closest of your papers: [[1755250]] (coupling 0.02, 2 shared references). Closest network paper: [[2864372]] (coupling 0.05, 3 shared references).","score":19.6,"rank":8,"section":"replacement","parts":[0.45,0.06,0.14,0.0,0.0],"abstract":"We do a general model-independent phenomenological analysis of the curious case of a quasi-degenerate $Z'$ boson, i.e. a $Z'$ boson whose mass is close to that of the Standard Model (SM) $Z$ boson, with SM $Z$-like fermionic couplings. Assuming that it exists hidden or unresolved in the present experimental data, we show that the experimentally measured invisible width can constrain the coupling of such a $Z'$ to SM fermions. From tree-level calculation alone we show that presence of such a $Z'$ boson affects both the cross-section and forward-backward asymmetry of the process $e^+ e^- \\to f \\bar{f}$ where $f$ (with $f\\neq e^-$) can be a lepton or quark. We also show that the dimensionless difference-over-sum (DoS) ratios of both cross-section and forward-backward asymmetry are more effective observables to probe the $Z'$-pole.","authors":"C. S. Kim, Donghun Lee, Gyeonghyun Min, Sechul Oh, Dibyakrupa Sahoo","nlinked":57,"nref":63,"src":"INSPIRE","html":true},{"id":"3231725","arxiv":"2611.26760","title":"Exploring Screening Masses of Light and Heavy Spin-$3/2$ Baryons in a Symmetry Preserving Contact Interaction Model","first":"Hernández-Pinto","nauth":4,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Closest network paper: [[3127309]] (coupling 0.04, 6 shared references).","score":17.5,"rank":9,"section":"new","parts":[0.45,0.0,0.11,0.0,0.0],"abstract":"We present a study of the screening masses of spin-$3/2$ baryons within a symmetry preserving contact interaction framework. Extending previous finite-temperature investigations of light baryons, we analyze 16 systems composed of $u$, $s$, $c$, and $b$ quarks, including light, heavy-light, and fully-heavy configurations with both positive and negative parity states. Whenever available, our results are compared with previous contact interaction calculations and other theoretical predictions. Our analysis shows that the screening masses generally increase with temperature, while the thermal evolution of the relative splitting between positive and negative parity states exhibits a clear dependence on the flavor content. Although a reduction of the relative parity splitting is observed in most channels, this behavior is not universal. Nevertheless, the uncertainties associated with the screening masses allow the parity partners to approach more closely at high temperatures, remaining compatible with an enhanced tendency toward parity degeneracy. Thermal modifications are strongest in the light sector and become increasingly suppressed as the heavy-quark content grows. To characterize this evolution, we introduce characteristic temperatures associated with the onset of thermal effects and find a general tendency for strong thermal modifications to occur at comparable or slightly higher temperatures in the negative parity channel. We further analyze the corresponding Faddeev amplitudes and show that the dominant diquark correlations remain clearly identifiable throughout the temperature range considered. These results provide a unified description of light and heavy spin-$3/2$ baryons and offer new insight into the flavor dependence of their thermal evolution and the persistence of quark--diquark correlations in hot QCD matter.","authors":"R. J. Hernández-Pinto, J. A. Alvarado-Morales, M. C. Díaz-Lucas, L. X. Gutiérrez-Guerrero","nlinked":50,"nref":50,"src":"INSPIRE","html":true},{"id":"3231849","arxiv":"2611.27612","title":"Analysis of the triply-charm tetraquark states via the QCD sum rules","first":"Wang","nauth":1,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Closest network paper: [[2817040]] (coupling 0.03, 33 shared references).","score":17.2,"rank":10,"section":"new","parts":[0.45,0.0,0.09,0.0,0.0],"abstract":"In this work, we construct the diquark-antidiquark type local currents to interpolate the triply-charm tetraquark states, and investigate the spectroscopy of the scalar, axialvector and tensor triply-charm tetraquark states via the QCD sum rules comprehensively. As a byproduct, we obtain the masses of four vector triply-charm tetraquark states.","authors":"Zhi-Gang Wang","nlinked":79,"nref":80,"src":"INSPIRE","html":true},{"id":"2840541","arxiv":"2410.12180","title":"Testable leptogenesis and $0νββ$ decay in extended seesaw model","first":"Li","nauth":4,"year":2026,"cites":0,"role":"repl","note":"Also cites widely used network papers: [[1362180]]. Closest of your papers: [[1249404]] (coupling 0.06, 13 shared references). Closest network paper: [[3087237]] (coupling 0.12, 42 shared references). Shared topics: neutrino mass, early universe, seesaw model.","score":17.1,"rank":11,"section":"replacement","parts":[0.06,0.18,0.34,0.0,0.44],"abstract":"We investigate the possibility of observable neutrinoless double beta decay $( 0 νββ)$ and viable leptogenesis within a low-scale extended inverse seesaw mechanism with additional sterile neutrinos. General effective field theory (EFT) considerations suggest that if there are experimentally observable signatures in $0 νββ$-decay and a lepton asymmetry generated by heavy right-handed neutrino decays, thermal leptogenesis is likely to be unviable. However, in this work, we show that in the context of low-scale leptogenesis, one can obtain the observed baryon asymmetry of the universe and observable signatures of $0 νββ$ decay in the presence of additional sterile neutrinos. In this framework, the light neutrino masses are suppressed by the extended seesaw parameter, $μ$, thereby allowing for $\\mathcal{O}(10\\, \\mathrm{TeV})$ right-handed (RH) neutrinos, while avoiding small Yukawa couplings as in other neutrino mass models and near degeneracies in the RH neutrino spectrum as required by the low-scale leptogenesis paradigm. Contributions to the $0 νββ$-decay rate from additional sterile neutrinos can be appreciable, while the corresponding contributions to the early universe lepton asymmetry washout rate are suppressed by other parameters not entering the $0 νββ$-decay amplitudes. We show that for keV-MeV scale, sterile neutrinos future ton-scale $0νββ$-decay experiments offer potential signals while maintaining viable leptogenesis.","authors":"Gang Li, Michael J. Ramsey-Musolf, Supriya Senapati, Sebastián Urrutia Quiroga","nlinked":133,"nref":142,"src":"INSPIRE","html":true},{"id":"3231853","arxiv":"2611.27716","title":"Challenging the Körner-Pati-Woo Theorem in Charmed Baryon Decays","first":"Wang","nauth":3,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Closest network paper: [[3227657]] (coupling 0.03, 1 shared references).","score":16.9,"rank":12,"section":"new","parts":[0.45,0.0,0.07,0.0,0.0],"abstract":"The Körner-Pati-Woo (KPW) theorem is a long-standing selection rule widely used in heavy-baryon decays. In this work, we argue that the conventional valence-color argument underlying the KPW theorem does not, by itself, establish an exact selection rule. The $\\rm KPW$-$\\rm SU(3)_F$ prediction for $\\mathcal{B}(Ξ_c^0\\to pK^-)$, inferred from $Λ_c^+\\to Ξ^0K^+$, is $17.2\\pm6.0$ times the measured value. A joint likelihood fit to five observables in $Ξ_c^0\\to pK^-$ and $Λ_c^+\\to Ξ^0K^+$ yields a $6.3σ$ discrepancy under the $\\rm KPW$-$\\rm SU(3)_F$ ansatz. A comparison of $α(Λ_c^+\\to Δ^{++}K^-)$ and $α(Λ_c^+\\to Σ^{*}π)$ reveals a pronounced sign-sensitive tension. Accommodating these measurements within the KPW constraint requires anomalously large $\\rm SU(3)_F$ breaking effects. Future measurements of $Λ^+_c\\toΣ^{(*)0}K^+$, $Σ^{(*)+}K^0_S$, $Δ^+η^{(\\prime)}$, $Δ^{++}π^-$, $Δ^+π^0$, $Δ^0π^+$, $Δ^{++}K^-$, and $Δ^{+}K^0_S$ would provide high-precision tests of the KPW theorem.","authors":"Di Wang, Ying-Xin Lai, Fu-Sheng Yu","nlinked":19,"nref":19,"src":"INSPIRE","html":true},{"id":"3231889","arxiv":"2611.27944","title":"Probing CP violation in weak radiative and dielectron decays of $Λ$ and $Ξ^-$ hyperons","first":"He","nauth":3,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Closest network paper: [[3154646]] (coupling 0.02, 2 shared references).","score":16.7,"rank":13,"section":"new","parts":[0.45,0.0,0.06,0.0,0.0],"abstract":"The rare decays $Λ\\to ne^+e^-$ and $Ξ^-\\toΣ^-e^+e^-$ can serve as sensitive probes of $CP$ violation, especially that induced by interactions from beyond the standard model. We demonstrate that this is so because the dominant long-distance components of these processes provide sizable absorptive phases that can give rise to significant $CP$ violation via interference with potential new-physics effects. Treating the new contributions model-independently, we find that this leads to $CP$-odd rate asymmetries that are currently allowed by kaon and hyperon data to reach the 10% and 20% levels in the $Λ$ and $Ξ^-$ cases, respectively. Interestingly, we obtain comparable outcomes for the related weak radiative modes $Λ\\to nγ$ and $Ξ^-\\toΣ^-γ$. These results are testable at future high-statistics hyperon facilities.","authors":"Xiao-Gang He, Jusak Tandean, German Valencia","nlinked":59,"nref":63,"src":"INSPIRE","html":true},{"id":"1941263","arxiv":"2110.04312","title":"ALP dark matter in a primordial black hole dominated universe","first":"Bernal","nauth":4,"year":2021,"cites":65,"role":"seed","note":"","score":null},{"id":"2740358","arxiv":"2312.14894","title":"micrOMEGAs 6.0: N-component dark matter","first":"Alguero","nauth":8,"year":2023,"cites":263,"role":"other","note":"","score":null},{"id":"2154677","arxiv":"2209.09908","title":"Opening up a Window on the Postinflationary QCD Axion","first":"Bao","nauth":3,"year":2022,"cites":19,"role":"other","note":"","score":null},{"id":"2843535","arxiv":"2410.21385","title":"Thermal gravitational waves during reheating","first":"Bernal","nauth":2,"year":2024,"cites":31,"role":"other","note":"","score":null},{"id":"2115290","arxiv":"2207.07382","title":"Unraveling the Scotogenic model at muon collider","first":"Liu","nauth":4,"year":2022,"cites":36,"role":"other","note":"","score":null},{"id":"2051136","arxiv":"2203.07059","title":"Theories and Experiments for Testable Baryogenesis Mechanisms: A Snowmass White Paper","first":"Barrow","nauth":19,"year":2022,"cites":38,"role":"other","note":"","score":null},{"id":"2736974","arxiv":"","title":"Solving all the problems of our universe, one neutrino mass model at a time","first":"Berbig","naut ,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1249404]] (coupling 0.03, 4 shared references). Closest network paper: [[2074211]] (coupling 0.10, 10 shared references).","abstract":"We study the pair production of a doubly charged Higgs boson via $e^{-} e^{+}$ in the presence of a polarized laser field in the Higgs Triplet Model (HTM), mediated by the photon and the $Z$ boson exchange. A unified formulation based on generalized Bessel functions is developed for a monochromatic plane wave with arbitrary ellipticity, encompassing linear, circular, and elliptical polarization states. The numerical analysis shows a strong interplay between laser polarization and scattering geometry, affecting both the characteristic multiphoton domain and the relative strengths of individual harmonic contributions. At a fixed cycle-averaged squared laser potential, the peak ratio normalized to linear polarization exhibits distinct geometry-dependent trends, including a reversal of the polarization hierarchy between different incidence configurations. The dependence on the collision energy and doubly charged Higgs boson mass is also investigated, revealing pronounced kinematic effects on the differential cross section. In contrast, the relative polarization pattern remains similar over a broad mass range. These results provide a unified characterization of polarization and geometrical effects on the multiphoton structure of this process."},{"arxiv":"2608.31109","id":"3198216","title":"Chiral Couplings of a Light Lmu-Ltau-like Z': Reinterpretation of CMS Four-Muon Data and High-Luminosity LHC Projections","authors":"Cesar Rendon","score":8.8,"section":"replacement","rank":15,"parts":[0.0,0.15,0.28,0.0,0.0],"note":"Closest of your papers: [[3094526]] (coupling 0.05, 6 shared references). Closest network paper: [[2942039]] (coupling 0.10, 7 shared references).","abstract":"We reinterpret the CMS search for a light $Z^\\prime$ boson in $Z\\to4μ$ events with $77.3~\\mathrm{fb}^{-1}$ at $\\sqrt{s}=13$~TeV for a $Z^\\prime$ with the flavor structure of $L_μ-L_τ$ and independent left- and right-handed couplings, parametrized by $ε=g_R/g_L$. Signal events are simulated with \\textsc{MadGraph5\\_aMC@NLO}, \\textsc{Pythia}~8 and \\textsc{Delphes} and analyzed with the event selection of the CMS search, while the background is digitized from the same CMS publication. For the vector model ($ε=1$) the expected limits agree with those of CMS within $9\\%$ over $5$--$62$~GeV. For chiral couplings, $ε=-1,3,7,\\infty$, we separate the effects on the production cross section, the branching ratio and the acceptance. For the axial model ($ε=-1$) the production cross section and the acceptance are the same as for the vector model. For $|g_L|\\neq|g_R|$ the production cross section decreases by up to 15\\% and the acceptance by up to 9\\% at low masses, while the branching ratio increases. The expected limit on $\\bar g=\\sqrt{(g_L^2+g_R^2)/2}$ changes by at most $15\\%$, and rescaling the vector limits with the ratio of branching ratios only overestimates the sensitivity by up to 12\\%. For right-handed-dominated couplings, constraints from neutrino trident production, which require a coupling to neutrinos, no longer apply, while the four-muon channel remains sensitive through $g_R$. We project the sensitivity of the High-Luminosity LHC with $3000~\\mathrm{fb}^{-1}$ at $\\sqrt{s}=14$~TeV under several assumptions on the background systematic uncertainty and on pileup, reaching $\\bar g\\simeq1.5$--$2.1\\times10^{-3}$ at $m_{Z^\\prime}=5$~GeV."},{"arxiv":"2611.26817","id":"3231778","title":"Study of Radiative Muon Capture Experimental Data and its Implications for Muon-Conversion Experiments","authors":"Yury Kolomensky, Michael MacKenzie, Ryan Plestid, Matthew Stortini, Ajla Trumic","score":8.7,"section":"new","rank":16,"parts":[0.06,0.13,0.19,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1854224]] (coupling 0.04, 4 shared references). Closest network paper: [[3178456]] (coupling 0.07, 6 shared references).","abstract":"Radiative muon capture (RMC) is an important background in searches for the neutrinoless conversion of a muon into an electron in the field of a nucleus, and in particular in searches for the lepton flavor and lepton number violating process of muon-to-positron conversion. The high-energy tail of the RMC photon spectrum remains theoretically understudied, leading to large uncertainties in background predictions for upcoming muon-conversion experiments. In this work, we revisit previously published RMC data to investigate improved modeling of the high-energy tail. We develop a model characterized by distinct nucleon-knockout final states, each with its associated multibody phase space and kinematic endpoint. This framework is applied to photon data from TRIUMF and positron data from SINDRUM II, and the results are compared to the previously used closure approximation. We find that separately modeling the distinct nucleon-knockout final states provides an improved description of the available RMC data near the endpoint, and we discuss the implications for the COMET and Mu2e experiments."},{"arxiv":"2611.27704","id":"3231859","title":"A pseudoscalar Higgs boson interfering with toponium: a QCD analysis of $\\mathbf{gg\\to A\\to t\\bar t}$ near threshold","authors":"Abdelhak Djouadi, John Ellis","score":7.5,"section":"new","rank":17,"parts":[0.0,0.05,0.07,0.5,0.0],"note":"Co-authors of yours: Ellis. Closest of your papers: [[1455793]] (coupling 0.02, 1 shared references). Closest network paper: [[3170413]] (coupling 0.02, 1 shared references).","abstract":"The CMS and ATLAS collaborations have observed an excess of $t\\bar t$ events near threshold that is consistent with the formation of the pseudoscalar toponium state $η_t$. A pseudoscalar Higgs boson $A$ with a large coupling to top quarks could contribute part of this excess and the presence of the $A$ boson could be concealed. We point out that, if such a state exists with $M_A$ close to $2m_t$, it necessarily interferes with toponium, since both live in the colour--singlet ${}^1S_0$ channel and share the same Coulomb final--state interaction. Using exact leading--order amplitudes, whose relative phase is fixed by unitarity, and Coulomb resummation applied coherently to the QCD background, the $A$ boson signal and their interference, we show that the line shape is controlled by a single complex number $κ$, the ratio of the resonant and non--resonant amplitudes at the peak. Unitarity fixes ${\\rm Im}\\,κ=-1$ exactly when $A$ decays into top quarks, so that the interference reduces the resonant rate by $2/|κ|^2$ and produces an exact zero of the ${}^1S_0$ amplitude just above $M_A$. The parameter $κ$ does not depend on the $A$ coupling to top quarks and, with the Coulomb--enhanced width we find $|κ|\\approx1.5$--$1.7$ for $M_A=350$--$380$ GeV and, hence, the $A$ resonance is completely distorted. For an $A$ boson accounting for 50\\% (25\\%) of the observed excess, it enhances the toponium peak by about 10 to 70\\% (5 to 35\\%), and the threshold excess differs strongly from the sum of the toponium and $A$ contributions."},{"arxiv":"2611.27986","id":"3231891","title":"Ohmic warm inflation","authors":"Anish Ghoshal, Alessandro Strumia","score":7.2,"section":"new","rank":18,"parts":[0.0,0.04,0.41,0.0,0.0],"note":"Closest of your papers: [[2039411]] (coupling 0.01, 1 shared references). Closest network paper: [[2753529]] (coupling 0.14, 6 shared references).","abstract":"We show that Warm Little Inflation is anomalous, lacks a suitable inflaton potential, and cannot sustain the thermal bath, as the quasi-static approximation over-estimated the dissipated power. To address these issues, we propose a new friction mechanism and new anomaly-free models based on one fermion charged under a U(1) gauge group in one extra dimension. The four-dimensional lattice version is a ring of $N$ U(1) groups with one fermion at each site, reducing to an anomaly-free version of the warm little inflaton model for $N=2$. The inflaton is a Wilson line, protected for $N\\ge5$. Large $N$ allows a suitable monodromy inflaton potential. In the continuum limit, $N\\to\\infty$, the inflaton velocity becomes a five-dimensional electric field and friction becomes Ohmic dissipation, which seems able to sustain warm inflation compatibly with observations."},{"arxiv":"2611.26692","id":"3231737","title":"Moment bounds and UV reconstruction from curved positivity cones","authors":"Fu-Ming Chang, Shi-Lin Wan, Shuang-Yong Zhou","score":6.8,"section":"new","rank":19,"parts":[0.0,0.0,0.46,0.0,0.0],"note":"Closest network paper: [[3092194]] (coupling 0.16, 17 shared references).","abstract":"The fundamental principles of the S-matrix impose positivity bounds on the Wilson coefficients of EFTs, including the SMEFT. These bounds form convex cones that often have curved boundaries when there are degeneracies among the irreducible two-particle low-energy states. Numerical approximations have previously been used to evaluate these curved cones. We develop a moment-based framework to analytically carve out these cones, particularly those associated with anomalous quartic gauge couplings in the SMEFT. The framework also allows us to reverse engineer UV models from the curved boundaries of the positivity cones."},{"arxiv":"2508.03823","id":"2957928","title":"Scaling Relations for Dark Matter Halos Hosting Ultra-Faint Dwarf Galaxies","authors":"Levi K. C. Fisher, Isabelle S. Goldstein, Jason Kumar, Louis E. Strigari","score":6.3,"section":"replacement","rank":20,"parts":[0.0,0.07,0.19,0.0,0.13],"note":"Closest of your papers: [[1869725]] (coupling 0.02, 1 shared references). Closest network paper: [[1873947]] (coupling 0.07, 2 shared references). Shared topics: dark matter.","abstract":"We consider the extraction of parameters of dark matter halos hosting ultra-faint dwarf galaxies, in the case where there are only ${\\cal O}(10)$ identified member stars with measured line-of-sight velocities. This scenario is likely to be increasingly common, as upcoming newly discovered dwarf galaxies in the Milky Way, by e.g. the Rubin Observatory, will likely (at least initially) have only a few identified members. Assuming an NFW dark matter profile, equilibrium modeling likely can only robustly extract one halo parameter ($ρ_s r_s$), but the scale radius itself will typically be unconstrained. In these cases, the results obtainable from Jeans modeling can be well replicated by a simple scaling relation motivated by the half-light mass estimator. As a application, we examine the recently discovered stellar system Ursa Major III, which has been optimistically assessed to have the largest $J$-factor of any known object. We suggest that, because of the presence of outlier stars, the $J$-factor obtained from modeling of Ursa Major III is likely inflated, as it is inconsistent with the half-light mass estimator, while removal of the outliers will leave the $J$-factor unconstrained from below."},{"arxiv":"2611.27456","id":"3231807","title":"Flavor-Modulated Neutrino Communication: Channel Model, Modulation Schemes, and Link Budget for Through-Earth Links","authors":"Bipin Singh Koranga, Biswmkwr Boro, Imran Khan, Vivek Kumar Nautiyal","score":6.2,"section":"new","rank":21,"parts":[0.0,0.11,0.2,0.0,0.0],"note":"Closest of your papers: [[1854224]] (coupling 0.03, 3 shared references). Closest network paper: [[2874212]] (coupling 0.07, 6 shared references).","abstract":"We investigate the physical limits of transmitting information through the Earth using neutrinos, modeling the link as a discrete-input, Poisson-output classical channel whose crosstalk is set by the three-flavor evolution operator in a layered, matter-filled Earth. For the maximum-likelihood receiver, we derive closed-form Bhattacharyya and Chernoff error exponents for Poisson counts, accurate to within 0.4\\% of the exact Chernoff limit. We examine three modulation schemes: source-flavor keying (SFK), oscillation-phase keying (OPK), and matter-path keying (MPK). For an Earth-diameter link with a neutrino-factory-class source (\\(3 \\times 10^{13}\\) decays/s) and a 200 kt detector, the mean charged-current event rate is \\(1.31 \\times 10^{-2}\\,\\mathrm{s^{-1}}\\), yet the information rate is only \\(1.36 \\times 10^{-4}\\) bit/s for SFK and \\(5.2 \\times 10^{-6}\\) bit/s for OPK. This reduction occurs because at \\(E \\simeq 25\\) GeV the first oscillation maximum nearly fully relabels \\(ν_μ\\to ν_τ\\) (\\(T_{μτ} \\simeq 0.98\\)); SFK relies mainly on a count-based \\(e\\)-like channel, while OPK suffers from suppressed appearance probabilities. For DUNE and T2HK with horn-polarity keying, assuming \\(10^{4}\\) unoscillated events per year, rates are \\(\\sim 10^{-6}\\)--\\(10^{-7}\\) bit/s. The OPK estimate is highly sensitive to the Earth density profile: full tabulated PREM lowers it threefold relative to a three-layer model, and a \\(\\pm 2\\%\\) density rescaling changes it by an order of magnitude, whereas SFK varies by less than 10\\%. Flavor modulation does not remove the fundamental flux limit; it adds a signaling dimension with constant-intensity operation and directional access, though these do not constitute a cryptographic guarantee"},{"arxiv":"2510.07387","id":"3065764","title":"Probing Dark Matter Interactions with Stellar Motion near Sagittarius A*","authors":"R. Andrew Gustafson, Ian M. Shoemaker, Volodymyr Takhistov","score":5.7,"section":"replacement","rank":22,"parts":[0.0,0.04,0.1,0.0,0.31],"note":"Closest of your papers: [[2856850]] (coupling 0.01, 1 shared references). Closest network paper: [[2791814]] (coupling 0.04, 2 shared references). Shared topics: direct detection, dark matter.","abstract":"Stars orbiting Sagittarius A* (Sgr A*) at the Milky Way's center provide a unique laboratory to test gravity and dark matter (DM). We demonstrate that DM interactions in stellar interiors induce a novel momentum transfer force, altering orbits beyond gravitational effects. We derive the first astrophysical constraints on DM-nucleon scattering using S2's 2000-2019 orbital data probing sub-GeV parameter space for specified DM distributions near Sgr A*. We further show that complementary orbital survival constraints and future observations of highly eccentric S-stars extend the reach to DM profiles allowed by present gravitational measurements. Unlike bounds requiring DM capture and annihilation, our constraints apply broadly to scattering DM including asymmetric DM, and extend to masses where methods based on capture can lose sensitivity. Stellar lifetime constraints over Myr timescales complement these, surpassing some direct detection and cosmological limits. This work establishes stellar dynamics as a novel probe of DM interactions."},{"arxiv":"2605.29902","id":"3162359","title":"Electromagnetic pion mass splitting using a Pauli-Villars-regulated photon propagator","authors":"Alessandro De Santis, Dominik Erb, Harvey B. Meyer","score":4.2,"section":"replacement","rank":23,"parts":[0.06,0.02,0.11,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[3184726]] (coupling 0.01, 1 shared references). Closest network paper: [[2873857]] (coupling 0.04, 3 shared references).","abstract":"We present a lattice QCD calculation of the charged-neutral pion mass splitting $M_{π^+} - M_{π^0}$ at $\\mathcal{O}(α_\\mathrm{em})$ using a recently proposed framework based on a Pauli-Villars (PV) regulated photon propagator defined in the continuum and infinite-volume limit, with $Λ$ acting as an additional UV cutoff scale. This formulation, when combined with a dedicated treatment of the elastic contribution, avoids power-law finite-volume effects on electromagnetic mass shifts. We perform the calculation using CLS ensembles, studying finite-volume effects, the continuum limit and the extrapolation to the physical point for several values of the scale $Λ$. By means of the Cottingham formula, we further decompose the result into elastic and inelastic contributions at fixed $Λ$. Our final result, after removing the cutoff scale $Λ$, is $M_{π^+} - M_{π^0} = 4.56(22)$ MeV, in good agreement with the experimental measurement. Our complete calculation demonstrates that, for a mass splitting not requiring any counterterms, the formalism can be implemented successfully, whilst also offering useful insights into the computation of electromagnetic corrections to other observables."},{"arxiv":"2607.21244","id":"3182815","title":"Shape wall: Constraints on late-time solutions to the Hubble tension from the dimensionless expansion rate","authors":"Miguel A. Sabogal, Luis A. Escamilla, Davide Pedrotti, Edvig Selimaj, Sunny Vagnozzi","score":4.2,"section":"replacement","rank":24,"parts":[0.0,0.05,0.17,0.0,0.0],"note":"Closest of your papers: [[1755250]] (coupling 0.02, 5 shared references). Closest network paper: [[2051195]] (coupling 0.06, 51 shared references).","abstract":"The standard \"no-go theorem\" against late-time solutions to the Hubble tension is essentially a normalization wall, since Baryon Acoustic Oscillation (BAO) measurements constrain the product $H_0r_d$, with $r_d$ the sound horizon at baryon drag. However, late-time solutions (which keep $r_d$ fixed) are tightly constrained not only by the BAO normalization $H_0r_d$, but also by the shape of the expansion history, i.e. the dimensionless expansion rate $E(z) \\equiv H(z)/H_0$. We show that, if $r_d$ and the acoustic angular scale $θ_s$ are fixed, an increase in $H_0$ needs to be matched by an equal fractional increase in the dimensionless distance integral $I \\equiv \\int dz/E(z)$: $δH_0/H_0 \\simeq δI/I$. We use this to quantify the \"shape wall\" set by relative distance constraints on $E(z)$, which we reconstruct nonparametrically, using Gaussian Processes and the latest unanchored Type Ia Supernovae (SNeIa) and BAO data. In our most conservative analysis using PantheonPlus SNeIa and DESI DR2 BAO data, we find a maximum fractional increase in $H_0$ of $\\lesssim 2\\%$, falling well short of the $\\gtrsim 8\\%$ required to solve the tension. This shape wall holds even in the presence of early-time new physics, and limits the maximum increase in $H_0$ which can be contributed by late-time modifications to $E(z)$ at fixed $θ_s$. Therefore, late-time modifications, whether invoked alone or alongside early-time new physics, face not only the well-known normalization wall, but also a stringent percent-level shape wall."},{"arxiv":"2605.00181","id":"3150826","title":"Extracting production fractions of $b$ hadrons from exclusive semi-leptonic decays","authors":"Carolina Bolognani, Martin Jung, Méril Reboud, K. Keri Vos","score":3.9,"section":"replacement","rank":25,"parts":[0.06,0.01,0.1,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[3184726]] (coupling 0.00, 1 shared references). Closest network paper: [[3193100]] (coupling 0.04, 58 shared references).","abstract":"Ratios of production fractions of $b$ hadrons are a dominant source of uncertainty in many LHC analyses, in particular in measurements with $B_s$ mesons. The currently used value for $f_s/f_d$ is based on a combination of hadronic and semi-inclusive semi-leptonic decays, and relies in part on assumptions about the underlying decays that are hard to quantify. We propose an independent alternative method to obtain this quantity by measuring ratios of the exclusive semi-leptonic decays $\\bar B_{(s)} \\to D_{(s)}^{(*)} \\ell \\barν$. This method benefits from significant cancellations of both experimental and theoretical uncertainties, as well as robustness against potential contamination from heavy physics beyond the Standard Model. As a proof of principle, we show that current measurements constrain $f_s/f_d$ with an uncertainty of $7\\%$, dominated by present experimental uncertainties. This method can also be applied to other ratios of production fractions involving heavier $b$ hadrons, such as $B_c$ or $Λ_b$."},{"arxiv":"2611.11600","id":"3226510","title":"Threshold resummation for top-quark pair production in association with a jet at the LHC","authors":"Bakar Chargeishvili","score":3.9,"section":"replacement","rank":26,"parts":[0.0,0.05,0.17,0.0,0.0],"note":"Closest of your papers: [[1455793]] (coupling 0.02, 3 shared references). Closest network paper: [[3206672]] (coupling 0.06, 7 shared references).","abstract":"We study threshold resummation for the invariant-mass distribution of a top-quark pair and a jet at the LHC. We perform the resummation at next-to-next-to-leading logarithmic accuracy in soft-collinear effective theory, with the logarithms of the jet radius treated at fixed order, and match it to the exact next-to-leading-order (NLO) cross section. We correct the one-loop soft anomalous-dimension matrices in the literature and validate the hard functions. We compare the leading-power kernel with exact real emission, and validate this comparison on Drell-Yan production. At invariant masses up to about 1 TeV with a fixed jet threshold the method does not apply. At 1-4 TeV with a jet threshold of 15% of the invariant mass, the kernel describes the exact real-emission density close to threshold but fails once the emitted energy exceeds about 100-200 GeV. We trace part of this failure to initial states absent from the kernel, which depend on $τ=M^2/S$, with $M$ the invariant mass and $\\sqrt{S}$ the hadronic centre-of-mass energy. In addition, at fixed $τ$ the difference between the kernel and the exact result grows with the ratio $M/m_t$ of the invariant mass to the top-quark mass. As a consequence, the resummed correction beyond NLO, for a scale equal to the invariant mass, ranges from 1-2% to 17-23% for different treatments of this region. The upper end becomes 13-16% for a jet threshold of 20% of the invariant mass and 23-33% for 10%. The range is not a bound, and the correction is not under perturbative control. We therefore keep NLO as the central prediction. We compare the possible effect of resummation with the NLO scale uncertainty, with the known next-to-next-to-leading-order corrections, and with NLO matched to a parton shower."},{"arxiv":"2611.26718","id":"3231735","title":"Dijet production in $e^+e^-$ collisions at NNLO+PS accuracy","authors":"Florian König, Marius Wiesemann, Giulia Zanderighi","score":3.8,"section":"new","rank":27,"parts":[0.06,0.02,0.08,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[3146383]] (coupling 0.01, 1 shared references). Closest network paper: [[2817040]] (coupling 0.03, 24 shared references).","abstract":"We present the first complete Monte Carlo event generator with next-to-next-to-leading order QCD accuracy for lepton collisions. The approach is based on a new formulation of the MiNNLO formalism and is applied to dijet production. Starting from the resummation of the three-jet resolution variable $y_3$, we present the corresponding MiNNLO master formula and implement it within the Powheg framework. We discuss phenomenological results relevant for LEP and future electron-positron colliders."},{"arxiv":"2601.06582","id":"3103070","title":"Lattice QCD determination of the $γZ$ box contribution to the proton weak charge","authors":"Zhao-long Zhang, Xu Feng, Mikhail Gorchtein, Lu-Chang Jin, Chuan Liu, Chien-Yeah Seng","score":3.6,"section":"replacement","rank":28,"parts":[0.06,0.02,0.07,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[3184726]] (coupling 0.01, 1 shared references). Closest network paper: [[3095306]] (coupling 0.03, 2 shared references).","abstract":"We present the first lattice QCD determination of the $γZ$ box contribution to parity-violating electron-proton scattering, $\\square_{γZ}$, a key ingredient for the precise tests of the Standard Model via the proton weak charge. Our calculation covers the electron beam energies up to $E=155$ MeV. At $E=0$, the vector contribution is known analytically and excluded by convention; for the remaining axial-vector component we obtain $\\square_{γZ}(0)=0.00411(9)$. Incorporating this result implies a value for weak charge of $Q_W^p=0.06987(50)$. The calculated energy dependence of $\\square_{γZ}$ is directly relevant to the upcoming P2 experiment at Mainz, which will operate at the optimized beam energy of 155 MeV to extract $Q_W^p$.Although the systematic error budget in this exploratory study is not yet complete, this work establishes a lattice-QCD framework for computing the $γZ$ box contribution and demonstrates the feasibility of a first-principles approach, providing a foundation for future calculations with improved systematic control."},{"arxiv":"2511.02363","id":"3233155","title":"Testing Electromagnetic Memory and Aharonov--Bohm Effect via Acceleration-Imprinted Superconducting Phases","authors":"Jie Sheng, Tsutomu T. Yanagida, Bo Gao, Hong Ding","score":3.5,"section":"replacement","rank":29,"parts":[0.0,0.0,0.23,0.0,0.0],"note":"Closest network paper: [[3196194]] (coupling 0.08, 5 shared references).","abstract":"Electromagnetic memory is an infrared observable of gauge theory associated with soft photons and large gauge transformations. Despite its fundamental theoretical importance, it has not yet been experimentally verified. From a phenomenological perspective, a transient electromagnetic configuration can leave a persistent gauge-invariant phase imprint on charged coherent states after the local field has vanished through electric Aharonov-Bohm effect. We point out that the electric field and associated gauge potential induced inside a normal conductor by gravitational acceleration can imprint this phase without requiring external phase-imprinting electric field. It can then be read out through a superconducting protocol. For representative parameters, the predicted signal can lie within the range of present sensitivities, providing a possible tabletop route toward testing both electromagnetic memory and Aharonov-Bohm effect."},{"arxiv":"2608.04182","id":"3187780","title":"Bare effective potential and Goldstone boson anti-resummation","authors":"Stephen P. Martin","score":3.2,"section":"replacement","rank":30,"parts":[0.0,0.03,0.16,0.0,0.0],"note":"Closest of your papers: [[1365306]] (coupling 0.01, 1 shared references). Closest network paper: [[1489994]] (coupling 0.06, 8 shared references).","abstract":"I discuss the evaluation of the effective potential and related quantities starting from bare perturbation theory followed by $\\overline{\\rm{MS}}$ renormalization. The advantages of this method include a simple new way of avoiding infrared problems associated with Goldstone bosons, by treating their bare squared masses as two-point interaction vertices instead of incorporating them into the propagators. Thus, only positive integer powers of the Goldstone-boson squared masses appear at every stage of calculation, avoiding the imaginary parts and singularities encountered in intermediate steps of previous resummation methods for the minimization conditions. This Goldstone boson anti-resummation approach is implemented using simple rules provided through three-loop order in terms of the master vacuum integrals. Explicit results are given for the Standard Model at three-loop order. The method is shown to give effective potential minimization conditions that are consistent with previous resummation methods, but in a form more directly useful for related future multi-loop calculations of observables in the tadpole-free scheme."},{"arxiv":"2611.27265","id":"3231800","title":"Features investigated: A detailed study of axion monodromy inflation using CLiENT","authors":"Steen Hannestad, Rasmus Lumbye, Andreas Nygaard, Thomas Tram","score":2.8,"section":"cross","rank":31,"parts":[0.0,0.02,0.14,0.0,0.0],"note":"Closest of your papers: [[2663002]] (coupling 0.01, 2 shared references). Closest network paper: [[3223723]] (coupling 0.05, 16 shared references).","abstract":"We investigate features in the primordial power spectrum from inflation, specifically those predicted by the axion monodromy model, using recent observational data. In order to compute posteriors, profile likelihoods and Bayesian evidence accurately for the complex likelihood surfaces arising in this model we have used the CLiENT emulator framework. As our data combinations we use both a \"conservative\" set consisting of Planck PR4 temperature, polarisation and lensing data together with DESI DR2 BAO and Pantheon+ supernovae, and a more \"aggressive\" set which also includes small-scale CMB data from ACT and SPT. We find no robust oscillatory feature in current data. With the conservative data the best fit lies at a frequency $ω\\simeq 51$ and lowers $χ^2$ by 10.1 relative to a featureless spectrum. However, this feature is disfavoured by the more aggressive data combination, whose best fit lies at $ω\\simeq 31$ and lowers $χ^2$ by 7.4. Fits to featureless data are known to give similar improvements, and the Akaike information criterion, the Bayes factors and the look-elsewhere effect all indicate that neither improvement is significant. The amplitude is limited to $A_\\mathrm{osc} < 0.056$ and $A_\\mathrm{osc} < 0.062$ (95%) for the two datasets. The emulators reproduce the true log-likelihood at samples of their posteriors with rms errors of 0.07 and 0.16, and the profile likelihoods are calculated with the true likelihood, using the profile capability of CLiENT."},{"arxiv":"2608.30447","id":"3197986","title":"Examples of infinitesimal Gribov copies in the presence of planar boundaries, and an emergent boundary gauge invariance in Yang-Mills theory","authors":"David Dudal, Luigi Rosa, Sebbe Stouten","score":2.8,"section":"replacement","rank":32,"parts":[0.0,0.04,0.11,0.0,0.0],"note":"Closest of your papers: [[2627241]] (coupling 0.01, 1 shared references). Closest network paper: [[2639544]] (coupling 0.04, 2 shared references).","abstract":"First, we explicitly construct zero-modes of the Yang-Mills Faddeev-Popov operator in the presence of two parallel plates, with either perfect electric (PEC) or perfect magnetic (PMC) boundary conditions imposed. This establishes the existence of infinitesimal Gribov copies with finite action, and even finite L_2-norm, in Yang-Mills theory with non-trivial interfaces. We adapt Henyey's construction, although the boundary configuration imposes extra restrictions on the ansatz for the gauge field. Second, we discuss the phenomenon of an emergent boundary gauge invariance for PEC and PMC plates in Yang-Mills theory. This shall be important when applying the Gribov-Zwanziger procedure to parallel plate setups, of relevance for non-perturbatively studying the non-Abelian Casimir effect in the future."},{"arxiv":"2609.11448","id":"3202443","title":"Casimir effect in Gribov-Zwanziger theory","authors":"David Dudal, Philipe De Fabritiis, Sebbe Stouten, David Vercauteren","score":2.7,"section":"replacement","rank":33,"parts":[0.0,0.03,0.11,0.0,0.0],"note":"Closest of your papers: [[2627241]] (coupling 0.01, 1 shared references). Closest network paper: [[2639544]] (coupling 0.04, 2 shared references).","abstract":"We consider Yang-Mills theory with two infinite parallel plates, separated by a distance \\(L\\), that are perfect magnetic conductors (PMC) or perfect electric conductors (PEC). Recently, it was shown that the Gribov copy problem persists in such a setting. We then study the Gribov-Zwanziger (GZ) action in the presence of those boundaries using functional integral methods. Lagrange multiplier fields allow one to lift the boundary conditions into the action, after which the boundary modifications to the gluon propagator can straightforwardly be determined. In the PEC case, we provide evidence that, even when translation invariance is (partially) broken, the usual horizon term in the GZ action still restricts the functional integral to the Gribov region. We compute the Casimir energy for GZ with PMC or PEC plates, both directly from the functional integral and from the energy-momentum tensor, obtaining consistent results. We compare our analytical results with recent lattice data, in both 4D and 3D. A priori, one might expect that the boundary-modified gluon propagator introduces new \\(L\\)-dependencies into the GZ gap equation. This would make the Gribov mass \\(γ\\) dynamically dependent on \\(L\\), implying an interesting interplay with the Casimir energy. However, we show that no such dynamical \\(L\\)-dependence occurs within the current approximation."}],"rest":[{"arxiv":"2611.27079","title":"Weight-space programming and mechanistic interpretability for model editing in particle physics","score":2.4,"section":"new","rank":34},{"arxiv":"2611.27324","title":"A resolution-based framework for coherent and decoherent jet energy loss in NLO pQCD","score":2.4,"section":"new","rank":35},{"arxiv":"2611.27367","title":"Regularizing gravity in the presence of matter fields","score":2.3,"section":"cross","rank":36},{"arxiv":"2611.27985","title":"Is Neutrino Disappearance Sensitive to T-Violation for Asymmetric Matter Profiles ?","score":2.1,"section":"new","rank":37},{"arxiv":"2611.27611","title":"Cosmological Correlators with Triple Massive Exchanges","score":1.8,"section":"cross","rank":38},{"arxiv":"2508.18448","title":"Imprints of screened dark energy on nonlocal quantum correlations","score":1.6,"section":"replacement","rank":39},{"arxiv":"2611.27314","title":"Electronic Wichmann-Kroll correction to the energy levels of muonic hydrogen-like atoms","score":1.5,"section":"new","rank":40},{"arxiv":"2607.12006","title":"Minding the gap between hard and diffractive structure functions at the Electron-Ion Collider","score": document.getElementById('dek').textContent=`${M.nrel} of the ${M.nlist} papers in this listing (${M.counts.new} new, ${M.counts.cross} cross-lists, ${M.counts.replacement} replacements) score ${M.threshold} or more for belonging to the reference and citation network of your ${M.nown} papers and the ${M.next} papers by other authors around them. Highest score first.`;
const T=!!M.topics;   // network file with shared phrases: 35/30/15/10 + 10% shared topics
document.getElementById('foot').innerHTML=`<p><b>Score (0–100).</b> ${T?35:40}% direct citations of network papers (each of your papers counts 1, each other network paper 0.6, network papers with over 1,000 citations 0.06; saturating as 1 − e<sup>−x</sup>); ${T?30:35}% bibliographic coupling with your own papers (idf-weighted cosine of INSPIRE-linked reference sets, best match and mean of the top three, 0.30 = full marks); 15% best coupling with the other network papers (0.35 = full marks); 10% authorship (you, or your co-authors)${T?`; 10% shared topics: technical phrases of two or more words in the title and abstract that your papers and the network use much more often than hep-ph as a whole (each weighted by how much more${M.halfLife?`, with recent papers counting more: a paper's weight halves every ${M.halfLife} years`:''}; saturating as 1 − e<sup>−x/3</sup>)${(M.watch||[]).length?`, plus your watch topics (${M.watch.map(esc).join(', ')})`:''}`:''}.</p>
<p><b>Data.</b> Network: INSPIRE records supplied with the project. Listing papers: INSPIRE records where already harvested (${M.onInspire} of ${M.nlist}); for the rest the reference list was read from the arXiv source and matched to INSPIRE by arXiv number, DOI and texkey. Only links between papers on this page are drawn. Built ${esc(M.built)}.</p>`;
const P=['Direct citations','Coupling to your papers','Coupling to network','Authorship','Shared topics'];
const PS=['Citations','Your papers','Network','Authors','Topics'];   // short labels for phones
function list(){const box=document.getElementById('list');
  if(!NEWS.length){box.innerHTML=`<div class="empty">No paper in this listing reaches a score of ${M.threshold}.</div>`;document.getElementById('mainnet').hidden=true;return}
  NEWS.forEach(n=>{const d=document.createElement('article');d.className='paper';d.id='p'+n.i;
    d.innerHTML=`<div class="role" style="color:${col(n)}">#${n.rank} · ${esc(SEC[n.section])} · score ${n.score.toFixed(1)}</div>
    <h2>${esc(n.title)}</h2>
    <div class="authors">${authors(n.authors)} · arXiv:${esc(n.arxiv)}</div>
    <p class="abs">${esc(n.abstract)}</p><button class="linkbtn absmore" type="button" hidden>More</button>
    <p class="why">${why(n.note)}</p>
    <div class="row"><div class="bars">${n.parts.map((v,j)=>`<span><span class="pl">${P[j]}</span><span class="ps">${PS[j]}</span> <span class="mb"><i style="width:${Math.round(v*100)}%"></i></span></span>`).join('')}</div><span>${n.nlinked} of ${n.nref} references linked to INSPIRE · refs from ${esc(n.src)}</span></div>
    <div class="links">${n.id?`<a href="https://inspirehep.net/literature/${n.id}" target="_blank" rel="noopener">INSPIRE</a>`:''}<a href="https://arxiv.org/abs/${esc(n.arxiv)}" target="_blank" rel="noopener">arXiv</a><a href="https://arxiv.org/pdf/${esc(n.arxiv)}" target="_blank" rel="noopener">PDF</a>${n.html?`<a href="https://arxiv.org/html/${esc(n.arxiv)}" target="_blank" rel="noopener" title="arXiv's experimental HTML version">HTML</a>`:''}<button class="linkbtn graphbtn" type="button">Show in network</button></div>`;
    d.querySelector('.graphbtn').addEventListener('click',()=>pick(n,true));
    d.querySelector('.absmore').addEventListener('click',e=>{const o=d.classList.toggle('open');e.target.textContent=o?'Less':'More'});
    box.appendChild(d)});
  toc();tex(box)}
// Phones: long author lists show the first 3 and "et al." (tap to expand); abstracts fold to 3 lines with More.
function authors(s){const a=String(s||'').split(', ');if(a.length<=3)return esc(s);
  return `<span class="au-short">${esc(a.slice(0,3).join(', '))} <button class="aubtn" type="button" aria-label="Show all ${a.length} authors">et al. (+${a.length-3})</button></span><span class="au-full">${esc(s)}</span>`}
document.addEventListener('click',e=>{const b=e.target.closest('.aubtn');if(b)b.closest('.authors').classList.add('open')});
function fold(){document.querySelectorAll('.paper').forEach(d=>{const p=d.querySelector('.abs'),b=d.querySelector('.absmore');
  if(!p||!b||d.classList.contains('open'))return;b.hidden=!(p.scrollHeight>p.clientHeight+2)})}
function toc(){const t=document.getElementById('toc');if(!NEWS.length)return;t.hidden=false;
  const X=RAW.next||[];
  t.innerHTML=`<h3>In this listing</h3><ol>${NEWS.map(n=>`<li><a href="#p${n.i}"><span class="sc${n.role==='repl'?' repl':''}">${n.score.toFixed(0)}</span><span class="tt">${esc(n.title)}</span></a></li>`).join('')}${X.length?`<li class="more-link"><a href="#more"><span class="sc">+${X.length}</span><span class="tt">The next ${X.length} papers by score (folded)</span></a></li>`:''}</ol>`;
  const m=t.querySelector('.more-link a');if(m)m.addEventListener('click',()=>{document.getElementById('more').open=true});tex(t)}
let sel=NEWS[0]||null, hover=null, query='', G;
const svg=d3.select('#svg'), tip=document.getElementById('tip');
function draw(){
  if(!NEWS.length)return;
  const RNG=d3.randomLcg(11);
  const W=Math.max(300,document.getElementById('chart').clientWidth), H=W<600?500:480, m={l:16,r:16,t:20,b:34};
  svg.attr('viewBox',`0 0 ${W} ${H}`); svg.selectAll('*').remove();
  const yrs=d3.extent(N,n=>n.year);
  const x=d3.scaleLinear().domain([yrs[0]-.5,yrs[1]+1.2]).range([m.l+8,W-m.r-8]);
  const ticks=x.ticks(W<600?6:12).filter(t=>Number.isInteger(t)&&t<=yrs[1]);
  svg.append('g').attr('class','grid').selectAll('line').data(ticks).join('line').attr('x1',d=>x(d)).attr('x2',d=>x(d)).attr('y1',m.t).attr('y2',H-m.b);
  svg.append('g').attr('class','axis').attr('transform',`translate(0,${H-m.b})`).call(d3.axisBottom(x).tickValues(ticks).tickFormat(d3.format('d')).tickSizeOuter(0));
  const cy=(m.t+H-m.b)/2, xf=n=>isNew(n)?x(yrs[1]+.75):x(n.year);
  const sim=N.map(n=>({n,x:xf(n)+(RNG()-.5)*4,y:cy+(RNG()-.5)*H*.5}));
  const links=E.map(e=>({source:sim[e.s],target:sim[e.t],s:e.s,t:e.t,k:e.k}));
  d3.forceSimulation(sim).force('x',d3.forceX(s=>xf(s.n)).strength(1)).force('y',d3.forceY(cy).strength(.04))
    .force('link',d3.forceLink(links).strength(.03)).force('charge',d3.forceManyBody().strength(-40))
    .force('col',d3.forceCollide(s=>r(s.n)+2)).stop().tick(320);
  sim.forEach(s=>{s.y=Math.max(m.t+8,Math.min(H-m.b-8,s.y));s.x=Math.max(m.l+4,Math.min(W-m.r-4,s.x))});
  G=svg.append('g');
  G.append('g').selectAll('path').data(links).join('path').attr('class',l=>'edge '+l.k)
    .attr('d',l=>{const a=l.source,b=l.target;return `M${a.x},${a.y}Q${(a.x+b.x)/2},${(a.y+b.y)/2-Math.abs(a.x-b.x)*.12} ${b.x},${b.y}`});
  G.append('g').selectAll('circle').data([...sim].sort((a,b)=>RANK[b.n.role]-RANK[a.n.role])).join('circle')
    .attr('class','node').attr('cx',s=>s.x).attr('cy',s=>s.y).attr('r',s=>r(s.n)).attr('fill',s=>col(s.n))
    .on('pointerenter',(ev,s)=>{hover=s.n;showTip(ev,s.n);paint()}).on('pointermove',(ev,s)=>showTip(ev,s.n))
    .on('pointerleave',()=>{hover=null;tip.hidden=true;paint()}).on('click',(ev,s)=>pick(s.n,false));
  const lab=sim.filter(s=>isNew(s.n)||s.n.role==='seed'||s.n.deg>=3);
  const L=lab.map(s=>{const right=s.x>W*.8,t=isNew(s.n)?`#${s.n.rank} ${s.n.first}`:`${s.n.first} ${s.n.year}`,w=t.length*6.2;return{s,t,right,x0:right?s.x-r(s.n)-4-w:s.x+r(s.n)+4,w,y:s.y+4}}).sort((a,b)=>a.y-b.y);
  const placed=[];L.forEach(l=>{let k=0;while(k<40&&placed.some(p=>l.x0<p.x0+p.w&&p.x0<l.x0+l.w&&Math.abs(l.y-p.y)<13)){l.y+=13*(k%2?-1:1)*(1+Math.floor(k/2));k++;l.y=Math.max(m.t+10,Math.min(H-m.b-4,l.y))}placed.push(l)});
  G.append('g').selectAll('text').data(L).join('text').attr('class','nlabel').attr('x',l=>l.right?l.s.x-r(l.s.n)-4:l.s.x+r(l.s.n)+4).attr('y',l=>l.y)
    .attr('text-anchor',l=>l.right?'end':'start').text(l=>l.t);
  paint();
}
function showTip(ev,n){const b=document.getElementById('chart').getBoundingClientRect();tip.hidden=false;tip.textContent=`${auth(n)} (${n.year}) — ${plain(n.title)}`+(isNew(n)?` · score ${n.score}`:'');
  let L=ev.clientX-b.left+12;if(L>b.width-290)L=ev.clientX-b.left-290;tip.style.left=Math.max(4,L)+'px';tip.style.top=(ev.clientY-b.top+12)+'px'}
function paint(){if(!G)return;const f=hover||sel,on=new Set();if(f){on.add(f.i);f.out.forEach(i=>on.add(i));f.inn.forEach(i=>on.add(i))}
  svg.classed('dim',!!f);
  G.selectAll('path.edge').attr('class',l=>'edge '+l.k+(!f?'':l.s===f.i?' hot out':l.t===f.i?' hot in':''));G.selectAll('path.edge.hot').raise();
  G.selectAll('circle').classed('on',s=>on.has(s.n.i)).classed('sel',s=>sel&&s.n.i===sel.i).classed('match',s=>query&&`${s.n.first} ${s.n.title} ${s.n.arxiv} ${s.n.authors||''}`.toLowerCase().includes(query));
  G.selectAll('text.nlabel').classed('on',l=>on.has(l.s.n.i))}
function panel(){const p=document.getElementById('panel'),n=sel;
  if(!n){p.innerHTML='<p>Select a paper in the network.</p>';return}
  const links=`<div class="links">${n.id?`<a href="https://inspirehep.net/literature/${n.id}" target="_blank" rel="noopener">INSPIRE</a>`:''}${n.arxiv?`<a href="https://arxiv.org/abs/${esc(n.arxiv)}" target="_blank" rel="noopener">arXiv</a>`:''}</div>`;
  if(isNew(n)) p.innerHTML=`<div class="role" style="color:${col(n)}">#${n.rank} · ${esc(SEC[n.section])} · score ${n.score.toFixed(1)}</div><h4>${esc(n.title)}</h4>
   <div class="meta">${esc(auth(n))} · arXiv:${esc(n.arxiv)}</div><p>${why(n.note)}</p><div class="links"><a href="#p${n.i}">Back to abstract</a></div>`;
  else p.innerHTML=`<div class="role" style="color:${col(n)}">${esc(ROLE[n.role])}</div><h4>${esc(n.title)}</h4>
   <div class="meta">${esc(auth(n))} · ${n.year}${n.arxiv?' · arXiv:'+esc(n.arxiv):''}</div>
   <div class="stats"><span>${n.cites.toLocaleString()} citations</span><span>${n.inn.filter(i=>isNew(N[i])).length} of the matches link here</span></div>${links}`;
  tex(p)}
function pick(n,scroll){sel=n;panel();paint();document.querySelectorAll('.paper').forEach(el=>el.classList.toggle('sel',el.id==='p'+n.i));if(scroll)document.getElementById('chart').scrollIntoView({behavior:'smooth',block:'nearest'})}
const present=new Set(N.map(n=>n.role));
document.getElementById('legend').innerHTML=['today','repl','seed','other'].filter(k=>present.has(k)).map(k=>`<span><i class="dot" style="background:var(--${k})"></i>${esc(ROLE[k])}</span>`).join('')+'<span style="color:var(--fg-3)">Listing papers: size ∝ score; others: size ∝ log(citations)</span>';
document.getElementById('q').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();paint()});
svg.on('click',ev=>{if(ev.target.tagName!=='circle'){sel=null;panel();paint()}});
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(draw,200)});
function nextList(){const X=RAW.next||[];if(!X.length)return;const box=document.getElementById('nextlist'),more=document.getElementById('more');
  more.hidden=false;more.querySelector('summary').firstChild.textContent=`The next ${X.length} papers by score `;
  const nmin=M.nextMin;
  document.getElementById('moresub').textContent=`below the threshold of ${M.threshold}${nmin!=null?`: every paper scoring ${nmin} or more, and at least ${M.nextCount} when available`:''}; not drawn in the network`;
  const cut=nmin!=null?X.findIndex(n=>n.score<nmin):-1;
  box.innerHTML=X.map((n,i)=>(i===cut?`<li class="divider">Below ${nmin}: weaker relation (most of these share no specific reference, coupling or topic with your work)</li>`:'')+`<li><div class="role" style="color:var(--${n.section==='replacement'?'repl':'today'})">#${n.rank} · ${esc(SEC[n.section])} · score ${n.score.toFixed(1)}</div>
    <div class="t">${esc(n.title)}</div><div class="authors">${authors(n.authors)} · arXiv:${esc(n.arxiv)}</div>
    ${n.note?`<p class="why">${why(n.note)}</p>`:''}
    <details class="abs"><summary>Abstract</summary><p class="abs">${esc(n.abstract)}</p></details>
    <div class="links">${n.id?`<a href="https://inspirehep.net/literature/${n.id}" target="_blank" rel="noopener">INSPIRE</a>`:''}<a href="https://arxiv.org/abs/${esc(n.arxiv)}" target="_blank" rel="noopener">arXiv</a><a href="https://arxiv.org/pdf/${esc(n.arxiv)}" target="_blank" rel="noopener">PDF</a></div></li>`).join('');
  more.addEventListener('toggle',()=>{if(more.open)tex(box)})}
const rtip=document.getElementById('reftip');let rcur=null;
function refShow(el){const r=REFS[el.dataset.ref];if(!r)return;rcur=el;rtip.textContent=`${auth(r)} (${r.year}) — ${plain(r.title)}`;rtip.hidden=false;
  const b=el.getBoundingClientRect(),t=rtip.getBoundingClientRect();let L=Math.min(Math.max(8,b.left),innerWidth-t.width-8),T=b.bottom+6;
  if(T+t.height>innerHeight-8)T=b.top-t.height-6;rtip.style.left=L+'px';rtip.style.top=T+'px'}
function refHide(){rtip.hidden=true;rcur=null}
document.addEventListener('pointerover',e=>{const el=e.target.closest('.ref');if(el&&e.pointerType==='mouse')refShow(el)});
document.addEventListener('pointerout',e=>{if(e.target.closest('.ref')&&e.pointerType==='mouse')refHide()});
document.addEventListener('click',e=>{const el=e.target.closest('.ref');if(el)refShow(el);else if(rcur)refHide()});
document.addEventListener('focusin',e=>{const el=e.target.closest('.ref');if(el)refShow(el)});
document.addEventListener('focusout',e=>{if(e.target.closest('.ref'))refHide()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')refHide()});
addEventListener('scroll',()=>{if(rcur)refHide()},{passive:true});
// the rest of the day's papers by score: only the title, linked to the arXiv record
function restList(){const X=RAW.rest||[];if(!X.length)return;const d=document.getElementById('rest'),box=document.getElementById('restlist');
  d.hidden=false;d.querySelector('summary').firstChild.textContent=`All other ${X.length} papers in this listing `;
  document.getElementById('restsub').textContent='by score, title only';
  box.innerHTML=X.map(n=>`<li><span class="sc">#${n.rank} · ${n.score.toFixed(1)}</span><a href="https://arxiv.org/abs/${esc(n.arxiv)}" target="_blank" rel="noopener">${esc(n.title)}</a></li>`).join('');
  d.addEventListener('toggle',()=>{if(d.open)tex(box)})}
list();nextList();restList();fold();draw();panel();
window.addEventListener('load',()=>{tex(document.getElementById('list'));tex(document.getElementById('panel'));fold();
  if(window.MathJax&&MathJax.startup&&MathJax.startup.promise)MathJax.startup.promise.then(()=>setTimeout(fold,300))});
addEventListener('resize',()=>{clearTimeout(window._ft);window._ft=setTimeout(fold,200)});
</script>
