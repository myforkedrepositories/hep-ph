<script>
const RAW = {"n":[{"id":"","arxiv":"2610.35444","title":"Probing the singlet-triplet scotogenic model with lepton flavor violation, gravitational waves and dark matter","first":"Li","nauth":4,"year":2026,"cites":0,"role":"today","note":"Cites your papers: [[1746620]]. Cites 5 network papers: [[2940359]], [[1456154]], [[1759674]], [[1245492]], [[1607799]]. Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1746620]] (coupling 0.09, 14 shared references). Closest network paper: [[2940359]] (coupling 0.12, 48 shared references).","score":53.6,"rank":1,"section":"new","parts":[0.98,0.26,0.34,0.0],"abstract":"We perform a comprehensive phenomenological analysis of neutrino masses, lepton-flavor violation, gravitational-wave signature induced by the first-order electroweak phase transition, and scalar dark matter within the framework of the singlet--triplet scotogenic model. We derive general analytical expressions for the one-loop Wilson coefficients of the penguin and box contributions to lepton-flavor-violating processes, considering generic scalar and fermion mediators. These general results are then applied to the singlet--triplet scotogenic model to calculate the branching ratios of $μ\\to eγ$ and $μ\\to e\\overline{e}e$, as well as the coherent $μ$--$e$ conversion rate. We systematically investigate the lepton-flavor-violation phenomenology and the constraints from current and future experiments. It is found that the coupling $λ_5$ plays a key role in connecting neutrino masses, lepton flavor violation, and dark matter direct detection. We also study the finite-temperature effective potential and the gravitational-wave signatures of the resulting first-order phase transition. By analyzing the thermal history of the model, we identify the viable parameter space allowing for a first-order electroweak phase transition in the early Universe and find that the portal parameters $λ_1^Ω$ and $μ_1$ play a crucial role in determining the transition strength. The corresponding stochastic gravitational-wave spectra can be probed by future gravitational-wave observatories. As a representative example, we identify a benchmark point that simultaneously satisfies the current constraints from lepton-flavor-violation and dark-matter experiments and generates a stochastic gravitational-wave spectrum that may be probed by the Laser Interferometer Space Antenna, the Big Bang Observer, and the Ultimate Deci-hertz Interferometer Gravitational-wave Observatory.","authors":"Shi-Yu Li, Jun-Nan Lu, Yang Zhang, Gui-Jun Ding","nlinked":120,"nref":124,"src":"arXiv source","html":true},{"id":"3214429","arxiv":"2610.16968","title":"Self-Interacting Dark Matter: From Particle Physics Theories to Structure Formation Simulations","first":"Rosenlyst","nauth":10,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[3128103]]. Also cites widely used network papers: [[2817040]], [[1518747]]. Closest of your papers: [[1679809]] (coupling 0.04, 6 shared references). Closest network paper: [[1362180]] (coupling 0.07, 69 shared references).","score":27.4,"rank":2,"section":"replacement","parts":[0.51,0.12,0.19,0.0],"abstract":"We establish a unified theory-to-simulation framework for self-interacting dark matter (SIDM) that integrates three components: (i) a comprehensive, self-contained treatment of its particle-physics foundations and a broad range of model classes; (ii) a systematic, quantitative mapping from microscopic dark-sector physics to structure-formation simulation inputs through explicit expressions and numerical prescriptions; and (iii) the development, implementation, and validation of a broad suite of SIDM algorithms and a dedicated DM decay module in the moving-mesh code AREPO-2. Under (i), we detail the particle content, symmetries, interactions, production mechanisms, and constraints of a broad landscape of elementary and composite SIDM models, and present representative viable benchmark models. Under (ii), the mapping specifies cosmological initial conditions, internal-state masses and populations, reaction networks, velocity- and angle-dependent cross sections, dissipative energy loss, and decay rates and recoil kinematics. We then apply this mapping to a broad range of SIDM model classes. Under (iii), we implement and validate SIDM algorithms with constant and velocity-dependent cross sections, covering isotropic and anisotropic scattering, multi-state elastic and inelastic reactions, and dissipative processes, alongside a dedicated DM decay module in AREPO-2. We validate these implementations through beam-lattice deflection experiments, thermalization and uniform-box decay tests, isolated-halo gravothermal core-collapse simulations, and cosmological box and zoom-in simulations. These tests recover analytical predictions, establish agreement across numerical schemes, and reproduce published benchmarks. Our theory-to-simulation framework serves as a cross-disciplinary reference and a practical bridge between SIDM particle physics and simulations of nonlinear structure formation.","authors":"Martin Rosenlyst, Vinh Tran, Oliver Zier, Xuejian Shen, Mark Vogelsberger, Thejs Brinckmann, Mads T. Frandsen, Jesús Zavala, Frederik Holt Dihver Christensen, Mikkel Theiss Kristensen","nlinked":580,"nref":643,"src":"INSPIRE","html":true},{"id":"3096530","arxiv":"2512.24132","title":"An $A_4$-Symmetric Double Seesaw for Neutrino Masses and Mixing in Light of JUNO results","first":"Nanda","nauth":5,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[649840]]. Also cites widely used network papers: [[779828]]. Closest of your papers: [[1249404]] (coupling 0.04, 13 shared references). Closest network paper: [[2762216]] (coupling 0.08, 38 shared references).","score":26.9,"rank":3,"section":"replacement","parts":[0.48,0.12,0.23,0.0],"abstract":"We discuss a double seesaw mechanism for generating light neutrino masses within the Standard Model extensions that include both right-handed neutrinos and extra gauge-singlet sterile fermions. The flavour structure of the double seesaw framework is invoked by an $A_4$ discrete symmetry which yields predictive textures for the Dirac neutrino mass matrix $M_D$, the mixing matrix $M_{RS}$ connecting right-handed and sterile neutrinos, and the bare Majorana mass matrix $M_S$ for the sterile neutrinos. The interesting feature of the present framework is that the combination of the double seesaw mechanism and $A_4$ flavour alignments yields a leading-order TBM structure, corrected by a single rotation in the (1-3) sector. We also derive analytic expressions for the heavy sterile eigenvalues and for the resulting light neutrino masses, thereby clarifying the role of the symmetry in shaping the neutrino mass hierarchy. We further incorporate the most recent JUNO measurements, which improve the precision of the solar mixing angle $\\sin^2θ_{12} \\simeq 0.31$, along with updated constraints on $\\sin^2θ_{13}$. We show that these results significantly restrict the allowed parameter space of the model. In particular, the observed value of $\\sin^2θ_{12}$ constrains the magnitude of the (1--3) rotation and the phases associated with the $A_4$ flavon couplings, while the value of $\\sin^2θ_{13}$ sharpens these restrictions further. Overall, the interplay between double seesaw dynamics, $A_4$ flavour symmetry, and the recent JUNO constraints yields a highly predictive framework for neutrino masses and mixings, offering a coherent explanation for the generation of light neutrino masses and testable predictions for future experiments.","authors":"Swaraj Kumar Nanda, Maibam Ricky Devi, Chandini Dash, R. N. Panda, Sudhanwa Patra","nlinked":150,"nref":160,"src":"INSPIRE","html":true},{"id":"","arxiv":"2610.33593","title":"A Tool-Grounded AI Agent for Gauge Coupling Unification and Proton Decay","first":"Saad","nauth":1,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[707996]]. Closest of your papers: [[1249404]] (coupling 0.03, 8 shared references). Closest network paper: [[1518938]] (coupling 0.11, 16 shared references).","score":26.4,"rank":4,"section":"new","parts":[0.45,0.11,0.31,0.0],"abstract":"We present proton_agent, a tool-grounded AI agent that enables natural-language interaction with computational tools for gauge coupling unification and proton decay in grand unified theories. The agent translates user requests into computational tasks, selects and executes the appropriate tools, and interprets their outputs. All numerical calculations, model evaluations, experimental comparisons, parameter scans, and visualizations are handled by a deterministic scientific backend to ensure numerical accuracy and reproducibility. A central objective of this framework is to enable fully local deployment using free and open-source LLMs, while retaining compatibility with commercial LLM APIs. The framework computes one- and two-loop gauge beta coefficients for user-defined scalar and fermion multiplets and performs gauge coupling evolution through the Standard Model and various intermediate symmetry-breaking stages of $SO(10)$, including $SU(3)_C \\times SU(2)_L \\times SU(2)_R \\times U(1)_{B-L}$, $SU(3)_C \\times SU(2)_L \\times U(1)_R \\times U(1)_{B-L}$, $SU(4)_C \\times SU(2)_L \\times U(1)_R$, and $SU(4)_C \\times SU(2)_L \\times SU(2)_R$. For proton decay, the framework evaluates gauge-mediated dimension-six contributions in non-supersymmetric $SU(5)$ and $SO(10)$, as well as dressed dimension-five contributions in their supersymmetric counterparts. It supports benchmark calculations for user-specified parameter points, random and grid-based parameter scans, Markov-chain Monte Carlo exploration, comparisons with experimental limits, and publication-ready two- and three-dimensional visualizations. We describe the agent architecture, demonstrate its capabilities through representative benchmark calculations and regression tests, and discuss its current physics scope.","authors":"Shaikh Saad","nlinked":74,"nref":78,"src":"arXiv source","html":true},{"id":"3097802","arxiv":"2601.01579","title":"Unraveling Dirac Magnetic Monopoles with Muon Beams at TeV Energies Using Machine Learning","first":"Javaid","nauth":5,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[1710078]]. Closest of your papers: [[1746620]] (coupling 0.02, 2 shared references). Closest network paper: [[2665284]] (coupling 0.09, 5 shared references).","score":24.7,"rank":5,"section":"replacement","parts":[0.45,0.08,0.26,0.0],"abstract":"The focus of this paper is the production of magnetic monopoles via the Drell-Yan and photon-fusion mechanisms to generate velocity-dependent scalar, fermionic, and vector monopoles of spin angular momentum 0, 1/2, 1, respectively at a future muon collider. A computational study compares the monopole pair-production cross-sections for both methods at various center-of-mass energies ($\\sqrt{s}$) with different magnetic dipole moments. The comparison of kinematic distributions of monopoles at the generator and reconstructed level is demonstrated for both DY and PF mechanisms. We demonstrate the observability of magnetic monopoles against the most relevant Standard Model background using multivariate analysis techniques. Specifically, we apply three different classifiers based on neural networks, e.g., Boosted Decision Trees, Multilayer Perceptrons, and Likelihood methods, to evaluate their effectiveness. Our results highlight the efficiency and robustness of these approaches in distinguishing magnetic monopole signals from background noise. Quantitatively, our analysis shows that the Photon-Fusion mechanism significantly dominates at high energies; for a spin-1/2 monopole with a mass of 1.5 TeV at $\\sqrt{s}=30$ TeV, the PF cross-section (13.33 Pb) is approximately 30 times larger than the Drell-Yan process (0.44 Pb). Furthermore, the Boosted Decision Tree (BDT) classifier outperforms other methods, reaching a signal efficiency of 0.97 and a statistical significance of 22.80 at an optimal cut of 0.042, with an AUC value of 0.989, underscoring the high discovery potential for magnetic monopoles in multi-TeV muon collisions.","authors":"M. Tayyab Javaid, Haroon Sagheer, M. Danial Farooq, Ijaz Ahmed, Jamil Muhammad","nlinked":30,"nref":37,"src":"INSPIRE","html":true},{"id":"","arxiv":"2610.33805","title":"Fermiophobic Z' Bosons in 3-4-1 Models: Classification and Collider Constraints","first":"Suarez","nauth":3,"year":2026,"cites":0,"role":"today","note":"Co-authors of yours: Rojas. Closest of your papers: [[611590]] (coupling 0.06, 3 shared references). Closest network paper: [[1756878]] (coupling 0.13, 7 shared references).","score":16.4,"rank":6,"section":"new","parts":[0.0,0.17,0.37,0.5],"abstract":"We investigate the fermion spectra and collider phenomenology of models based on the \\(SU(3)_C \\otimes SU(4)_L \\otimes U(1)_X\\) gauge symmetry, focusing on two realizations of the electric charge operator characterized by \\(b=c=1\\) and \\(b=1,\\ c=-2\\). For each configuration, we classify anomaly-free fermion sets and identify five minimal spectra with at least three SM-like quark and lepton families for each configuration, distinguishing algebraically irreducible structures from reducible spectra that remain minimal under the three-family requirement. We derive the chiral couplings of the additional neutral gauge boson \\(Z'\\) to Standard Model fermions and show that distinct anomaly-free fermion spectra can lead to identical low-energy neutral-current interactions. We then investigate the corresponding collider constraints using the ATLAS dilepton resonance search at \\(\\sqrt{s}=13\\) TeV with an integrated luminosity of \\(139\\,\\mathrm{fb}^{-1}\\), assuming negligible \\(Z-Z'\\) mixing and kinematically inaccessible exotic fermions. A particularly interesting result emerges for the \\(b=c=1\\) configuration, where all \\(Z'\\) couplings to Standard Model fermions are proportional to \\(\\sinψ\\), with \\(ψ\\) denoting the additional neutral gauge-boson mixing angle. Consequently, these couplings vanish simultaneously at \\(ψ=nπ\\), giving rise to a fermiophobic limit in which conventional Drell-Yan dilepton constraints disappear. In contrast, the \\(b=1,\\ c=-2\\) configuration does not exhibit a universal fermiophobic limit. Our results demonstrate that collider constraints on additional neutral gauge bosons depend sensitively on the fermion embeddings and neutral gauge-boson mixing structure, and suggest the possibility of comparatively light \\(Z'\\) bosons in suitable realizations of extended electroweak gauge theories.","authors":"Eduard Suarez, Yithsbey Giraldo, Eduardo Rojas","nlinked":24,"nref":24,"src":"arXiv source","html":true},{"id":"","arxiv":"2610.34880","title":"Light top-flavoured dark matter in dark SMEFT: one-loop matching and phenomenology","first":"Gao","nauth":5,"year":2026,"cites":0,"role":"today","note":"Also cites widely used network papers: [[1518747]]. Closest of your papers: [[2859009]] (coupling 0.11, 13 shared references). Closest network paper: [[2780204]] (coupling 0.06, 4 shared references).","score":15.3,"rank":7,"section":"new","parts":[0.06,0.3,0.16,0.0],"abstract":"We study light top-flavoured dark matter (DM) below the electroweak (EW) scale within the dark Standard Model effective field theory (DSMEFT). We perform the one-loop matching of the DSMEFT onto the dark low-energy effective field theory (DLEFT) at the EW scale for all relevant operators that couple scalar, fermionic or vector DM, as well as axion-like particles, exclusively to third-generation quarks. After QCD evolution to the relevant low-energy scales, we match the DLEFT onto the non-relativistic EFT for DM-nucleus scattering. This EFT chain provides a unified framework for phenomenological studies of rare $B$- and $K$-meson decays with missing energy, direct and indirect detection, and the thermal relic abundance. Interpreting the Belle II excess in $B^+\\to K^+ν\\barν$ as a decay into DM, we find that only the DSMEFT operators contributing at tree level can accommodate it with $O(1)$ couplings for a new-physics scale of $1\\,\\mathrm{TeV}$. The decay $B^0\\to K^{*0}+\\mathrm{inv}$ provides the strongest constraint over large portions of the Belle II-favoured parameter space, while $K^+\\toπ^++\\mathrm{inv}$ can dominate at low and $B_s\\to\\mathrm{inv}$, $B^+\\toπ^++\\mathrm{inv}$ and $Υ(1S)\\to\\mathrm{inv}$ become important at high DM masses, respectively. Direct-detection searches by CRESST-III and DarkSide-50 are competitive for operators involving scalar quark currents and, depending on the operator, exclude the Belle~II-favoured band for $m_{\\mathrm{DM}}\\gtrsim1$-$2\\,\\mathrm{GeV}$. We also perform detailed analyses of the thermal relic abundance and the indirect-detection constraints from the CMB and Fermi-LAT.","authors":"Meng-Chao Gao, Xin-Qiang Li, Ya-Dong Yang, Xing-Bo Yuan, Xin Zhang","nlinked":167,"nref":171,"src":"arXiv source","html":true},{"id":"3131605","arxiv":"2603.19109","title":"Searching for dark matter X-ray lines from the Large Magellanic Cloud with eROSITA","first":"Calvo","nauth":5,"year":2026,"cites":0,"role":"repl","note":"Co-authors of yours: Taoso. Closest of your papers: [[793723]] (coupling 0.04, 4 shared references). Closest network paper: [[839969]] (coupling 0.11, 9 shared references).","score":14.0,"rank":8,"section":"replacement","parts":[0.0,0.12,0.31,0.5],"abstract":"We perform a search for an X-ray monochromatic line arising from dark matter (DM) decay in the halo of the Large Magellanic Cloud. An emission line can be expected from two well-motivated DM candidates: sterile neturinos and axion-like particles (ALPs). We analyze the eROSITA-DE DR1 datasets in the energy range between 1 and 9 keV. No evidence for a DM line is found, and we set lower limits on the DM lifetime. We then recast these bounds into upper limits on the active-sterile neutrino mixing angle $\\sin^2(2θ)$ and on the ALP to photon coupling $g_{aγ}$, for DM masses between 2 and 18 keV. These results set new strong constraints for masses below 5 keV.","authors":"Jorge Terol Calvo, Marco Taoso, Andrea Caputo, Michela Negro, Marco Regis","nlinked":77,"nref":81,"src":"INSPIRE","html":true},{"id":"3181009","arxiv":"2607.14156","title":"New approach to the estimation of the lowest boundary of an axion mass and axion-electron coupling constant","first":"Guseynova","nauth":5,"year":2026,"cites":0,"role":"repl","note":"Closest of your papers: [[1607572]] (coupling 0.08, 5 shared references). Closest network paper: [[2703113]] (coupling 0.12, 10 shared references).","score":12.9,"rank":9,"section":"replacement","parts":[0.0,0.23,0.33,0.0],"abstract":"In this work, we have performed the theoretical estimation of the lowest boundary of an axion mass. We have analyzed the energy spectrum of the electron in a constant homogeneous magnetic field, taking into account its anomalous magnetic moment. We have applied the obtained results on the energy spectrum of the electron in a constant homogeneous magnetic field with allowance for its anomalous magnetic moment to the hydrogen atom electron, which is located in addition to the Coulomb field of the proton, as well as in the magnetic field produced by the magnetic moment of the proton. We have applied the idea of the restriction for the lowest boundary of the axion mass to the triplet-singlet transition between two adjacent levels obtained as a result of the hyperfine structure splitting of the s-levels in the hydrogen atom. We have concluded that the mass of an axion ought to be more than 5.885*10^(-6) eV. We have also obtained the analytical relation for the lowest boundary of the axion-electron coupling constant and numerically estimated its value: the axion-electron coupling constant ought to be more than 1.670*10^(-16).","authors":"Sevinj O. Guseynova, Vali A. Huseynov, Mehriban Sh. Hasanova, Sevinj Y. Rzayeva, Nigar E. Musazade","nlinked":39,"nref":54,"src":"INSPIRE","html":false},{"id":"","arxiv":"2610.34325","title":"Near-exact Upper Confidence Limits for Axion Haloscopes","first":"Rosso","nauth":2,"year":2026,"cites":0,"role":"today","note":"Closest of your papers: [[1607572]] (coupling 0.09, 5 shared references). Closest network paper: [[2703113]] (coupling 0.10, 9 shared references).","score":12.8,"rank":10,"section":"cross","parts":[0.0,0.24,0.3,0.0],"abstract":"The data acquisition of axion haloscopes commonly implements sequential adaptive frequency scans. We present a method to calculate likelihood-based upper confidence limits on axion-photon coupling under this circumstance. We compare the likelihood-based method conceptually and quantitatively with tailor-made methods, i.e. the one proposed by Brubaker et al. (Geometric) and its upgrade the Bayesian Power-Measured (BPM) framework proposed by Palken et al. We find that the likelihood method yields average upper limits that are significantly more constraining than those obtained from these methods. For example, expected constraints improve by a factor of 1.4 as compared with the current state of the art when applied to projections for the ALPHA Plasma-haloscope. We further clarify the statistical basis for the Geometric and BPM methods. In particular, we point out the correspondence of BPM to e-values, proposed as an alternative to conventional p-values in statistics.","authors":"Andrea Gallo Rosso, Jan Conrad","nlinked":36,"nref":44,"src":"arXiv source","html":true},{"id":"3190347","arxiv":"2608.11522","title":"How to Identify a Majoron: Effective Field Theories of Spontaneous Lepton Number Breaking","first":"Biggio","nauth":5,"year":2026,"cites":0,"role":"repl","note":"Also cites widely used network papers: [[1494411]], [[2817040]]. Closest of your papers: [[796080]] (coupling 0.04, 5 shared references). Closest network paper: [[1861353]] (coupling 0.08, 18 shared references).","score":12.5,"rank":11,"section":"replacement","parts":[0.11,0.13,0.22,0.0],"abstract":"We revisit the traditional type~I, II, and III seesaw mechanisms in the presence of a complex scalar field charged under a global $U(1)$ symmetry that can be identified with lepton number and the Peccei-Quinn symmetry. After symmetry breaking, the radial mode becomes heavy while the angular mode appears as an axionlike particle, traditionally dubbed the Majoron. We construct the effective field theory obtained after integrating out the heavy states and analyze two matching orders: first removing the radial mode and then the seesaw fields, and vice versa. Both procedures yield the same low-energy Lagrangian containing only Standard Model fields and the Majoron. Because a single vacuum expectation value fixes the mediator masses, the radial mode, and every Majoron coupling, these models predict relations among observables rather than their individual size, and it is these relations that are testable. Indeed, the invisible Higgs width is locked to the universal suppression of the Higgs couplings, while the Majoron-lepton coupling is fixed by the measured nonunitarity of the leptonic mixing matrix, and the two independently give comparable lower bounds on the same lepton-number-breaking scale, of the order of $1$--$10$~TeV. Neutrinoless double beta decay with Majoron emission, by contrast, has no sensitivity in this class of models. The framework is, thus, falsifiable even when the new states lie far beyond experimental reach.","authors":"Carla Biggio, Marta Fuentes Zamoro, Xu Li, Luca Merlo, Luca Ottonello","nlinked":186,"nref":200,"src":"INSPIRE","html":true},{"id":"3089741","arxiv":"2512.05694","title":"p-Wave Dominant Majorana Dark Matter and Its Self-Interactions in a Gauged $U(1)_{L_μ- L_τ}$ Model","first":"Yang","nauth":1,"year":2026,"cites":0,"role":"repl","note":"Also cites widely used network papers: [[1362180]], [[813721]]. Closest of your papers: [[2859009]] (coupling 0.05, 6 shared references). Closest network paper: [[2946768]] (coupling 0.04, 12 shared references).","score":11.2,"rank":12,"section":"replacement","parts":[0.11,0.14,0.12,0.0],"abstract":"We propose a model of $p$-wave dominant Majorana dark matter (DM) featuring a macroscopic mass gap in a gauged $U(1)_{L_μ- L_τ}$ extension of the Standard Model. Spontaneous symmetry breaking generates a dominant Majorana mass via a strong Yukawa coupling, splitting the dark fermion into two distinct states. The lighter state ($χ_-$) is the DM candidate, with an allowed mass of $\\sim 10$ GeV to several hundred GeV. Crucially, within the $10 \\sim 75$ GeV mass range and a scalar mediator at the tens of MeV scale, this strong coupling dictates the thermal relic abundance and induces significant elastic self-interactions. These self-interactions naturally resolve small-scale structure anomalies, such as the core-cusp problem, while satisfying massive cluster constraints. Furthermore, we place stringent joint constraints on the scalar mass and the Higgs mixing angle $α$ using the latest LZ 2025 direct detection data. The model's gauge boson $Z^\\prime$ maintains early-Universe thermal equilibrium and accommodates the muon anomalous magnetic moment $(g-2)_μ$, remaining consistent with updated cosmological and experimental bounds.","authors":"Kwei-Chou Yang","nlinked":133,"nref":140,"src":"INSPIRE","html":true},{"id":"3117687","arxiv":"2602.07423","title":"Relic density and astrophysical signatures of MeV scale bound state dark matter","first":"Prasad","nauth":2,"year":2026,"cites":0,"role":"repl","note":"Also cites widely used network papers: [[1518747]]. Closest of your papers: [[1415059]] (coupling 0.06, 1 shared references). Closest network paper: [[3122101]] (coupling 0.06, 4 shared references).","score":10.9,"rank":13,"section":"replacement","parts":[0.06,0.17,0.17,0.0],"abstract":"We study a strongly interacting complex scalar dark matter candidate, $χ$, interacting through an attractive potential mediated by a dark radiation $Φ$. Such interactions allow $χ$ to form bound states: SIMPonium. We systematically investigate the bound-state dynamics of this dark sector, including the formation and decay of SIMPonium and its impact on the thermal evolution of dark matter. We performed Monte Carlo simulations to compute the relic abundances of both free and bound state dark matter. We find that a successful freeze out of the dark sector requires a free dark matter yield of $Y_χ\\sim 10^{-9}$ and SIMPonium yield of $Y_B \\sim 10^{-13}$. The constraints from $ΔN_{\\rm eff}$ reveal that only scalar mediated self interactions remain viable. For Higgs portal models, these constraints require the dark matter mass to satisfy $m_χ< 25~\\mathrm{MeV}$. Within this mass range, indirect detection constraints imply that, for $g_χ> 10^{-2}$, the allowed range of the Higgs portal coupling is approximately $10^{-4} \\lesssim λ\\lesssim 10^{-2}$. For $g_χ< 10^{-2}$, the constraints are satisfied for a broader range, $10^{-4} \\lesssim λ\\lesssim 1$.","authors":"Pa. Gokhula Prasad, V. Suryanarayana Mummidi","nlinked":37,"nref":56,"src":"INSPIRE","html":false},{"id":"3188104","arxiv":"2608.05279","title":"Axion-driven spontaneous leptogenesis, precisely","first":"Kuckenberg","nauth":4,"year":2026,"cites":0,"role":"repl","note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2855387]] (coupling 0.04, 6 shared references). Closest network paper: [[1210691]] (coupling 0.08, 15 shared references).","score":10.3,"rank":14,"section":"replacement","parts":[0.06,0.13,0.24,0.0],"abstract":"We revisit a minimal scenario for spontaneous leptogenesis where the asymmetry generation is driven by a heavy axion-like field evolving via standard misalignment. We focus on the simplest framework in which lepton number violation originates from the dimension-five Weinberg operator and contributions from standard thermal leptogenesis become negligible. The asymmetry is computed by solving a set of transport equations, which incorporate fully flavor-dependent interaction rates for the Weinberg operator that are presented here for the first time. We also derive a simple algebraic master formula for the generated $B\\!-\\!L$ asymmetry, valid for arbitrary axion velocities and classically shift-symmetric couplings to the Standard Model, that reproduces the $B\\!-\\!L$-production dynamics of the full set of transport equations in controlled parameter regions. Along the way, we quantify the importance of low-scale neutrino masses and the two mass orderings on the final prediction for the generated asymmetry. Finally, we assess the cosmological viability of different axion couplings by accounting for entropy dilution from late-time axion decays and imposing constraints from baryonic isocurvature perturbations. We demonstrate that explaining the baryon asymmetry via standard Majoron misalignment is under severe tension due to dilution from late-time decays. In contrast, axions coupled to strong or weak sphalerons can successfully produce the observed asymmetry for decay constants near the energy scale of grand unification and axion oscillation temperatures $T_{\\text{osc}} \\gtrsim 10^{11\\cdots12}$ GeV, provided a cosmological history featuring high-scale inflation and efficient reheating.","authors":"Konstantin Kuckenberg, Martin A. Mojahed, Kai Schmitz, Hidenaga Watanabe","nlinked":80,"nref":81,"src":"INSPIRE","html":true},{"id":"3217357","arxiv":"2610.29543","title":"Detectable Dark Matter Freeze-in via Low Reheating","first":"Alagappan","nauth":1,"year":2026,"cites":0,"role":"repl","note":"Closest of your papers: [[2855387]] (coupling 0.07, 6 shared references). Closest network paper: [[1605577]] (coupling 0.06, 5 shared references).","score":10.1,"rank":15,"section":"replacement","parts":[0.0,0.22,0.16,0.0],"abstract":"This work focuses on freeze-in production of dark matter (DM) during low reheating, where the latter arises from the decay of inflatons leading to a non-adiabatic matter-dominated era. Under freeze-in, DM comoving yield is inversely proportional to Hubble, and during matter domination, as Hubble increases, the coupling, keeping the DM interaction with SM, should be enhanced to have relic density $Ω_{DM}\\simeq0.12$, making DM potentially vulnerable to direct detection searches. A renormalizable Yukawa-like Lagrangian is considered for DM interaction with a singlet electron $e$, and a BSM parent particle $P$. With the decay being the dominant freeze-in production channel, the required coupling enhancement is calculated with the aid of freeze-in Boltzmann equation. Dealing with freeze-in, the higher coupling could thermalize the feebly interacting particles, and this places an upper bound on coupling. The coupling has been found to be sensitive to the vacuum energy of the inflaton during the inflationary phase. Keeping this vacuum energy at the upper bound from {\\tt planck}, the model fails to feature any detectable direct detection signals even at a reheating temperature of BBN. The findings of this thesis then show that, only under low reheating and low inflationary vacuum energy, the DM-electron cross sections become high enough to be detectable in near-future direct detection searches. However, the proposed model becomes non-perturbative near the direct detection exclusion limits.","authors":"Sadayappan Alagappan","nlinked":49,"nref":76,"src":"INSPIRE","html":true},{"id":"2703113","arxiv":"2309.15052","title":"Singlet–doublet Dirac fermion dark matter from Peccei–Quinn symmetry","first":"Longas","nauth":4,"year":2023,"cites":4,"role":"other","note":"","score":null},{"id":"1625258","arxiv":"1709.08417","title":"Common origin of neutrino mass and dark matter from anomaly cancellation requirements of a $U(1)_{B-L}$ model","first":"Nanda","nauth":2,"year":2017,"cites":50,"role":"other","note":"","score":null},{"id":"2817040","arxiv":"","title":"Review of particle physic "],[74,40,"c"],[12,70,"k"],[42,33,"c"],[29,71,"c"],[68,47,"c"],[57,58,"c"],[13,71,"k"],[14,72,"k"],[30,54,"c"],[49,71,"c"],[43,29,"c"],[1,73,"k"],[14,47,"k"],[33,47,"c"],[10,74,"k"],[50,17,"c"],[68,51,"c"],[50,51,"c"],[68,73,"c"],[1,75,"k"],[2,71,"c"],[74,73,"c"],[18,41,"c"],[42,73,"c"],[33,51,"c"],[25,29,"c"],[74,35,"c"]],"next":[{"arxiv":"2607.24329","id":"3183736","title":"The Spectrum of a Compact Internal Space II: Effective Couplings and Mass Scales","authors":"Jinku Guo","score":9.8,"section":"replacement","rank":16,"parts":[0.06,0.09,0.28,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1615477]] (coupling 0.03, 2 shared references). Closest network paper: [[1724445]] (coupling 0.10, 4 shared references).","abstract":"Minimal unbiased compositional change generates the Gaussian source of the compact internal construction. We derive joint constraints on effective couplings and mass scales from its gauge and matter content, scalar sector, spectral endpoint and kinetic normalizations. Compatibility of source and colour screening selects three matter copies. Within the response family indexed by integers, shell support and position retention select the level R=5, whose transverse traceless endpoint equation has a unique positive root. Eliminating shared transfer parameters gives a relation among six geometric fermion masses. Bandwidth variation correlates the electron and electroweak scales, while two cosmological ratios are independent of the common neutrino mass normalization. Finite matching through one loop implements the generated Fermi, top and Higgs conditions in a common action. The absorptive top self energy gives the Born decay width as an additional output. The compact source covariance and positive RMS amplitude determine a local nonlinear flux that couples matter motion to source feedback. A model with an auxiliary radius admits autonomous source evolution, positive reduced propagation forms and a matter phase clock on a specified finite cosmological interval. Physical comparisons use the stated mass definitions, matching and thermal approximations. The fixed DESI DR2 distance comparison gives \\c{hi}^2 = 29.5087 for thirteen components and p=0.00554, indicating tension in the adopted cosmological mapping. Spectral tail and quadrature bounds control the finite response calculation."},{"arxiv":"2610.34720","id":"","title":"Fermion Mass and Mixing Patterns from Fusion Algebras","authors":"Jacques Distler, Can Kilic, Sanjay Mathai","score":9.3,"section":"new","rank":17,"parts":[0.06,0.14,0.14,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[509514]] (coupling 0.05, 3 shared references). Closest network paper: [[2963992]] (coupling 0.05, 5 shared references).","abstract":"The large hierarchy of fermion masses in the Standard Model has long posed a challenge to be explained. One approach is to try to invoke a symmetry principle to dictate the structure (\"texture\") of the matrices of fermion Yukawa couplings to the Higgs field. Here we invoke noninvertible symmetries, specifically, fusion algebras, to provide such textures. In particular, the structure of the fusion-algebra can be used to assign labels to each field, which determines how suppressed any given composite operator is as a term in the Lagrangian. In UV completions, this can be interpreted as specifying a hierarchy of operators that in the IR effective theory become the Yukawa couplings to the Higgs field. Remaining agnostic of a specific UV model, we perform a Monte Carlo numerical scan over unknown Wilson coefficients, and we identify the rank-8 fusion algebra $\\rm{FR}^{8,6}_8$ as the one providing the best fit for the textures of the up-quark, down-quark and charged-lepton Yukawa matrices. We also study the predictions for the CKM and PMNS mixing matrices, with the conclusion that none of the fusion algebras we study provide an accurate fit for the masses and mixing angles simultaneously. The fusion algebra structure ensures that the textures that we find are stable under RG running and persist down to low energies."},{"arxiv":"2610.35789","id":"","title":"The neutrino fog for inelastic dark matter","authors":"C. S. Amarasinghe","score":9.3,"section":"new","rank":18,"parts":[0.0,0.13,0.32,0.0],"note":"Closest of your papers: [[2859009]] (coupling 0.05, 2 shared references). Closest network paper: [[3201080]] (coupling 0.11, 6 shared references).","abstract":"We characterize the behavior of the neutrino fog for inelastic dark matter scattering on xenon. The inelastic scattering kinematics reshape the recoil spectrum of the signal and produce a qualitatively different neutrino fog landscape. In some regions of the inelastic parameter space the fog is completely absent for future xenon experiments at any scale, while in other regions the fog is dispelled only to reappear at larger exposures. We find that multiple background sources with uncertain normalizations can make the onset of the fog jump discontinuously with the dark matter mass and mass splitting, while the discovery limit varies smoothly. We also describe a mechanism by which reduced uncertainties on neutrino rates may have the unintuitive effect of raising neutrino floors derived from the fog opacity."},{"arxiv":"2608.19277","id":"3193587","title":"Effective flavor interaction for the charged-lepton mass hierarchy and the Koide relation","authors":"Olivier Rousselle","score":9.3,"section":"replacement","rank":19,"parts":[0.0,0.18,0.19,0.0],"note":"Closest of your papers: [[922002]] (coupling 0.06, 1 shared references). Closest network paper: [[1344030]] (coupling 0.07, 2 shared references).","abstract":"This article proposes a dynamical framework to address the charged-lepton mass hierarchy and derive the empirical Koide formula. We postulate a $U(3)_F$ flavor symmetry at the high-energy scale, where a heavy dynamical flavon field couples to the electroweak Higgs sector via an effective operator. As the universe cools, spontaneous symmetry breaking of the flavor group occurs following the pattern $U(3)_F \\to U(1)^3_F$. Subsequently, the electroweak symmetry breaking at the Fermi scale generates the charged-lepton mass matrix. The phenomenological values of these masses are determined in the infrared regime, where the effective potential governing the flavon VEV undergoes a dynamical vacuum alignment.The stable minimum of this potential enforces an algebraic equipartition between the flavor-singlet and flavor-octet invariants ($I_{(0)} = I_{(8)}$). This geometric equilibrium yields the Koide mass ratio ($Q=2/3$), successfully identifying the dynamically generated eigenvalues with the physical pole masses of the electron, muon, and tau."},{"arxiv":"2610.33662","id":"","title":"Relativistic corrections to $Υ(1S,2S)\\rightarrowγη^{(\\prime)}$ in perturbative QCD","authors":"Cong Wang, Chao-Jie Fan, Jun-Kang He","score":8.6,"section":"new","rank":20,"parts":[0.06,0.15,0.08,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2855387]] (coupling 0.05, 4 shared references). Closest network paper: [[2946768]] (coupling 0.03, 4 shared references).","abstract":"We calculate the radiative decays $Υ(1S),Υ(2S)\\rightarrowγη^{(\\prime)}$ in perturbative quantum chromodynamics through order $q^{2}$ in the relativistic expansion, including the quark-content, two-gluon, and electromagnetic contributions. The quark contribution dominates, with substantial constructive electromagnetic interference and a strongly suppressed gluon contribution. The annihilation rates depend weakly on the tested light-cone distribution amplitudes and light-quark masses. Relativistic corrections reduce the $Υ(1S)$ rates by a few percent but enhance the $Υ(2S)$ rates by approximately $17\\%$--$30\\%$. The ratio of the $γη^{\\prime}$ and $γη$ branching fractions is sensitive to the light-meson mixing parameters, with predictions differing by about a factor of $5$ between two representative schemes. At a scale of half the quarkonium mass, however, the $Υ(1S)\\rightarrowγη^{\\prime}$ central predictions in the two mixing schemes exceed the experimental upper limit by factors of approximately $5$ and $7$. We also examine the heavy-pseudoscalar admixtures in the light mesons. The $η_c$ contribution is small, whereas $η_b$ mixing can substantially modify the rates through interference. Destructive interference alleviates the discrepancy. With the scale set to the quarkonium mass, the prediction in the mixing scheme inferred from transition form factors is compatible with the upper limit within the input uncertainty."},{"arxiv":"2602.02817","id":"3115009","title":"Dark-Matter-Induced Nuclear Deexcitation at the Short Baseline Near Detector with Ab Initio Nuclear Theory","authors":"Bhaskar Dutta, Debopam Goswami, Baishan Hu, Wei-Chih Huang, Vishvas Pandey","score":8.4,"section":"replacement","rank":21,"parts":[0.0,0.05,0.1,0.5],"note":"Co-authors of yours: Dutta. Closest of your papers: [[2855387]] (coupling 0.02, 2 shared references). Closest network paper: [[3214448]] (coupling 0.03, 3 shared references).","abstract":"We explore the sensitivity of the short-baseline near detector (SBND) experiment to light dark matter using MeV-scale electromagnetic activity. Inelastic scattering of dark matter with argon nuclei can excite nuclear states that subsequently deexcite via the emission of MeV-scale photons, producing localized low-energy \"blip\" signatures in a liquid argon time projection chamber. We perform state-of-the-art ab initio nuclear calculations, including all relevant argon excited states with energies up to 18 MeV, to provide reliable predictions for these signals. After accounting for relevant backgrounds, we find that SBND can probe previously unexplored regions of parameter space for light dark matter."},{"arxiv":"2610.33152","id":"","title":"A Low Scale for Quark-Lepton Unification","authors":"Lawrence J. Hall, Claudio Andrea Manzari, Clara Murgui","score":7.3,"section":"new","rank":22,"parts":[0.06,0.05,0.22,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[530816]] (coupling 0.02, 1 shared references). Closest network paper: [[1704332]] (coupling 0.08, 9 shared references).","abstract":"The measured fermion masses may be pointing to the scale of quark-lepton unification. Studying the renormalization-group evolution of the Standard Model Yukawa couplings, we find that $y_τ=y_b$ and $y_μ=3y_s$ occur at nearly the same scale, around $10^6$ GeV, while the first generation reaches the Georgi-Jarlskog relation $y_e\\simeq y_d/3$ at order $10^8$ GeV and can arise from the same Clebsch structure through a simple hierarchical flavor texture. This pattern naturally suggests low-scale Pati-Salam symmetry. We show that flavor mixing and finite threshold corrections preserve this picture. If the electron mass has an independent origin, the two heavier-generation relations can be realized in theories with a unification scale as low as $(5$-$7)\\times10^5$ GeV. We identify two simple theories that accommodate all three relations and in which the measured masses fix the flavor structure. The first unifies all three generations at $4.6^{+1.2}_{-0.9}\\times10^6$ GeV; the second, with symmetric Yukawa matrices, at $1.5^{+0.7}_{-0.5}\\times10^7$ GeV, and predicts $|V_{cb}|=0.042\\pm0.002$. Their shared light-family texture fixes the relevant vector-leptoquark couplings, making $μ\\to e$ conversion in nuclei a direct test of unification: upcoming searches will probe part of the region selected by the two theories, and proposed facilities could cover it completely."},{"arxiv":"2610.12443","id":"3212986","title":"A scalar-extended ${\\rm U(1)_{L_μ-L_τ}}$ explanation of the LUX-ZEPLIN 248 keV excess","authors":"Dipankar Pradhan, Abhik Sarkar","score":7.2,"section":"replacement","rank":23,"parts":[0.0,0.1,0.24,0.0],"note":"Closest of your papers: [[2859009]] (coupling 0.03, 4 shared references). Closest network paper: [[3201080]] (coupling 0.08, 7 shared references).","abstract":"The recently observed dark matter (DM) nuclear recoil event at an energy of $248 \\pm 23\\,(\\text{stat.}) \\pm 23\\,(\\text{syst.})\\,\\text{keV}$ at the LUX-ZEPLIN (LZ) experiment, favoring an inelastic scattering interpretation, has motivated various beyond the Standard Model (BSM) scenarios aimed at explaining the observed excess. In particular, this provides an opportunity to probe models that naturally accommodate inelastic DM scattering. In this work, we explore one such possibility by extending the $\\rm U(1)_{L_μ-L_τ}$ model with two complex scalar fields, $Φ$ and $S$, carrying charges $-1$ and $+2$, respectively, under the $\\rm U(1)_{L_μ-L_τ}$ gauge symmetry. These charge assignments allow a trilinear interaction between the two scalar fields, which is crucial for generating the DM mass splitting. Following the spontaneous breaking of the $\\rm U(1)_{L_μ-L_τ}$ symmetry, with $S$ acquiring a vacuum expectation value and generating a mass for the BSM gauge boson $Z_{μτ}$, the real and imaginary components of $Φ$ acquire a mass splitting. This naturally gives rise to an inelastic DM scattering scenario that can accommodate the LZ excess. We perform a likelihood-based assessment of the sensitivity of the model parameters to the observed event while consistently accounting for other relevant phenomenological constraints. Finally, we discuss the prospects for probing the viable parameter space at future experiments."},{"arxiv":"2607.08175","id":"3178722","title":"Transformer-based machine learning using low-level calorimeter signals for collimated photon identification at collider experiments","authors":"Gabriel Matos, Lauren Larson, Abhilasha Dave, Maria Bressan, Azal Amer, Cindy Liu, Nikiforos Nikiforou, Jonathan Long, Timothy Andeen, John Parsons, Julia Gonski","score":7.0,"section":"replacement","rank":24,"parts":[0.0,0.11,0.21,0.0],"note":"Closest of your papers: [[1607572]] (coupling 0.04, 3 shared references). Closest network paper: [[2703113]] (coupling 0.07, 8 shared references).","abstract":"Electromagnetic calorimeters provide essential information for reconstructing and selecting both Standard Model (SM) and potential beyond the SM physics events at high-energy particle colliders. The fine-grained segmentation of modern calorimeters captures rich information about the internal structure of particle showers, much of which is discarded by conventional high-level reconstruction methods. In this work, we leverage calorimeter cell-level information to classify highly collimated diphoton signatures, arising from the decay of light axion-like particles, from isolated single-photon showers. We systematically compare a range of machine learning architectures, spanning high-level, shower shape variable-based approaches and direct cell-level methods. Cell-level machine learning shows significantly superior classification ability, with a Transformer in particular representing the best performance among six different architectures studied, and an MLP Mixer representing a resource-constrained alternative for potential real-time, trigger-level applications. Beyond classification, the Transformer model developed enables direct invariant mass regression from calorimeter cells, improving the characterization of light resonances and providing an additional handle in reducing the $π^0$ and $η$ fake photon backgrounds. These results demonstrate that cell-level machine learning methods can extend calorimeter-based particle identification and performance well beyond the capabilities of current conventional techniques."},{"arxiv":"2610.33153","id":"","title":"Muon Tridents at FASER and NA64$μ$: Motivation, Predictions, and Prospects for Precision Measurements","authors":"Reinaldo Francener, Victor P. Goncalves, Felix Kling, Gabriel Rabelo-Soares","score":6.8,"section":"new","rank":25,"parts":[0.06,0.1,0.07,0.0],"note":"Also cites widely used network papers: [[1688995]]. Closest of your papers: [[2855387]] (coupling 0.04, 3 shared references). Closest network paper: [[2946768]] (coupling 0.03, 4 shared references).","abstract":"The intense flux of high-energy muons produced in the far-forward region of $pp$ collisions at the LHC provides a unique opportunity to study rare electromagnetic interactions at TeV energies. In this work, we investigate the muon trident scattering in muon-nucleus interactions at the FASER experiment, which is expected to have recorded more than $10^5$ such events. The theoretical description of the process is reviewed and improved. Predictions for the total event rates and differential distributions expected during Run~3 of the LHC are presented, taking into account realistic detector acceptance and the main background contributions. The dependence of the predictions on the treatment of the nuclear form factors and the impact of higher-order QED effects such as Coulomb corrections are investigated. Our results indicate that the muon trident process can be measured for the first time at TeV energies using FASER's spectrometer, with a projected precision on the cross-section at the percent level. We also extended our analysis to the NA64$μ$ experiment and showed that, together with FASER, these experiments can probe the energy dependence of the muon trident cross-section over a broad unexplored energy range."},{"arxiv":"2610.34380","id":"","title":"Spiralling into Dark Energy: Axio-Dilaton Attractors in Light of Current Data","authors":"Mario Ramos-Hamud","score":5.9,"section":"cross","rank":26,"parts":[0.0,0.0,0.06,0.5],"note":"Co-authors of yours: Ramos-Hamud. Closest network paper: [[795558]] (coupling 0.02, 2 shared references).","abstract":"In string compactifications, dilaton-like moduli always come paired with axions, and the two fields interact through a curved field-space metric. We study the cosmology of such an axio-dilaton system, in which the dilaton rolls down an exponential potential corrected by a polynomial prefactor and couples to a massless axion through the kinetic function $W=e^{-ξφ_1/M_p}$. A dynamical systems analysis shows that the late-time attractor follows a non-geodesic trajectory in field space with equation of state $ω_φ=(λ-2ξ)/(λ+2ξ)$, so accelerated expansion is possible for steep potentials provided $ξ\\ggλ$. No physical fixed point is phantom. A Bayesian analysis with DESI DR2 BAO, binned Pantheon supernovae and Planck 2018 distance priors gives $λ\\gtrsim7$--$9$ and $\\log_{10}ξ\\gtrsim2.5$ at 95% confidence, together with a degeneracy between the two parameters. The model is slightly favoured over $Λ$CDM by current data, while the different polynomial corrections cannot yet be distinguished. This contribution is based on arXiv:2609.22539."},{"arxiv":"2610.34540","id":"","title":"Axions from Betelgeuse: Probing Axion Couplings with $^{23}\\rm{Na}$ and $^{55}\\rm{Mn}$","authors":"Nicholas A. M. Revel, Baldeep Grewal, Anupam Ray, Aaron C. Vincent","score":5.8,"section":"new","rank":27,"parts":[0.06,0.06,0.09,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2690106]] (coupling 0.02, 2 shared references). Closest network paper: [[2703113]] (coupling 0.03, 3 shared references).","abstract":"We investigate axion-like particle (ALP) production in the interior of Betelgeuse via nuclear de-excitation of thermally populated excited states of $^{23}$Na and $^{55}$Mn. As these ALPs propagate to Earth, they can produce photons either through their conversion in the Galactic magnetic field or through their decay. Using INTEGRAL-ISGRI and NuSTAR observations, we search for these photon signals, find no significant excess, and derive 95% CL exclusion limits on the ALP couplings. For magnetic-field conversion of ALPs, the $^{23}\\mathrm{Na}$ ($^{55}\\mathrm{Mn}$) line observed with INTEGRAL-ISGRI constrains $|g_{aγ}g_{ap}| < 4.1\\times10^{-21}$ ($6.9\\times10^{-19}$) $\\mathrm{GeV}^{-1}$ for $m_a < 10^{-10} \\mathrm{eV}$. For ALP decays, the $^{23}\\mathrm{Na}$ ($^{55}\\mathrm{Mn}$) line observed with INTEGRAL-ISGRI (NuSTAR) constrains $|g_{aγ}g_{ap}|$ down to $3.0\\times10^{-22}$ ($2.9\\times10^{-19}$) $\\mathrm{GeV}^{-1}$ at $m_a \\simeq 400$ ($83$) keV, weakening in both cases as $m_a^{-3/2}$ for lower ALP masses, and as $m_a^{-2}$ for $^{23}$Na below $m_a \\sim 1$ keV, with sensitivity extending to $m_a \\simeq 440.2$ ($124$) keV. Although our $^{23}\\mathrm{Na}$-based limits are the strongest for both channels, their larger transition energy makes them more sensitive to the precise evolutionary stage of Betelgeuse, whereas the $^{55}\\mathrm{Mn}$-based limits are considerably more robust against such uncertainties."},{"arxiv":"2610.35379","id":"","title":"Revisiting supernova constraints on dark gauge bosons","authors":"Zun Wang, Yongchao Zhang","score":5.6,"section":"new","rank":28,"parts":[0.06,0.05,0.1,0.0],"note":"Also cites widely used network papers: [[1362180]]. Closest of your papers: [[1854224]] (coupling 0.02, 4 shared references). Closest network paper: [[1742302]] (coupling 0.04, 16 shared references).","abstract":"We revisit the supernova constraints on three well-motivated light gauge bosons: the dark photon, the $U(1)_{B-L}$ gauge boson, and the $U(1)_{L_μ-L_τ}$ gauge boson. For the dark photon and the $U(1)_{B-L}$ gauge boson, we re-evaluate the nucleon bremsstrahlung process within the one-pion exchange approximation, retaining the full momentum and mass dependence. The geometrical dependence of the decay and absorption of these gauge bosons inside the supernova core is also taken into account. Updated bounds on these models are derived based on the cooling of SN1987A and energy deposition constraints from low-energy supernovae (LESNe). Taking the SFHo-18.8 $18.8\\,M_\\odot$ profile, the SN1987A cooling constraints reach masses of about $230$ MeV, $280$ MeV, and $300$ MeV for the dark photon, the $U(1)_{B-L}$ boson, and the $U(1)_{L_μ-L_τ}$ boson, while the corresponding LESN limits extend to about $450$ MeV, $440$ MeV, and $600$ MeV, respectively. The kinetic mixing parameter $ε$ for dark photon, the gauge coupling $g_{BL}$ in the $U(1)_{B-L}$ model, and the gauge coupling $g_{μτ}$ for the $U(1)_{L_μ-L_τ}$ model are constrained down to $5.8\\times10^{-12}$, $2.9\\times10^{-16}$, and $6.4\\times10^{-12}$, respectively."},{"arxiv":"2603.22391","id":"3133820","title":"What does it take to have $N_{\\rm eff} < 3$ at CMB times?","authors":"Miguel Escudero, Maksym Ovchynnikov, Neal Weiner","score":5.5,"section":"replacement","rank":29,"parts":[0.06,0.06,0.07,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2855387]] (coupling 0.02, 3 shared references). Closest network paper: [[795558]] (coupling 0.02, 7 shared references).","abstract":"The vast majority of extensions of the Standard Model affecting the number of effective relativistic neutrino species ($N_{\\rm eff}$) do so additively, namely, they enhance this quantity with some light state contributing to dark radiation. In this work, we consider precisely the opposite case: new physics scenarios that can lead to $N_{\\rm eff} < 3$ that are consistent with all known cosmological, astrophysical, and laboratory data. We are motivated by three main reasons: 1) a recent measurement from ACT and SPT in combination with Planck that leads to $N_{\\rm eff} = 2.81\\pm0.12$, 2) by a new and powerful measurement of the primordial helium abundance, which anchors $N_{\\rm eff}$ to be very close to the Standard Model value one second after the Big Bang, 3) by the deployment of the Simons Observatory which will provide precise tests of the radiation content in the Universe and which may detect with a high significance cosmologies with $N_{\\rm eff}<3$. We survey the main theoretical possibilities and find that only a few simple scenarios can consistently give $N_{\\rm eff}=2.81\\pm0.12$. One class consists of thermal electrophilic relics with masses $m\\sim 8\\!-\\!13\\,{\\rm MeV}$. Another consists of out-of-equilibrium particles decaying to $e^+e^-$ or $γγ$, with a rather particular lifetime $0.05\\,{\\rm s}\\lesssim τ\\lesssim 3\\,{\\rm min}$, mass $250\\,{\\rm MeV}\\lesssim m \\lesssim 600\\,{\\rm MeV}$, and abundance $ρ/ρ_γ\\sim 0.1$ at decay. Thermal electrophilic particles are especially interesting because they can account for the dark matter in the Universe and can be tested in experiments such as SENSEI, DAMIC-M, and Oscura, and their portals to the visible sector at experiments such as NA64 and LDMX. We conclude that if the Simons Observatory confirms that $N_{\\rm eff} \\simeq 2.8$, it will point to very specific extensions of the Standard Model."},{"arxiv":"2609.25601","id":"3206125","title":"Electroweak phase transition triggered by a long-lived scalar and LHC searches","authors":"Lei Wang, Xiaoting Zhao, Xiao-Fang Han, Hongxin Wang","score":5.3,"section":"replacement","rank":30,"parts":[0.0,0.11,0.09,0.0],"note":"Closest of your papers: [[1627633]] (coupling 0.04, 4 shared references). Closest network paper: [[2815960]] (coupling 0.03, 4 shared references).","abstract":"We investigate a long-lived scalar $S$ that triggers a strongly first-order electroweak phase transition (SFOEWPT) in the singlet scalar extension of standard model (SM). A sufficient small mixing angle between $S$ and the SM-like Higgs boson $h$ naturally leads to a long lifetime for $S$. We focus on the mass range $m_S>m_h/2$, where the dominant production channel at the LHC is the Higgs-mediated process $gg\\to h^*\\to SS$ with an off-shell $h$. By analyzing the finite-temperature effective potential, we identify the parameter space realizing an SFOEWPT and calculate the associated gravitational-wave spectra, finding that part of the parameter space can be probed by LISA. We further study the LHC sensitivity to the long-lived $S$ using the ATLAS detector and proposed far detectors, including ANUBIS, CODEX-b, FACET, FASER2, MoEDAL-MAPP1 and MAPP2, and MATHUSLA. The combined sensitivity of the main detector and far detectors, particularly ANUBIS and MATHUSLA, allows a large fraction of the SFOEWPT parameter space to be probed for $10^{-10}\\leq \\sinθ\\leq 10^{-5}$, with $m_S$ up to $250~\\mathrm{GeV}$. For $\\sinθ\\leq 10^{-11}$, however, the SFOEWPT parameter space becomes inaccessible to both the main detector and the far-detector searches."},{"arxiv":"2603.05585","id":"3127297","title":"$e^+e^- \\to ZH$ at NLO EW matched to a QED parton shower","authors":"Lois Flower, Marek Schönherr","score":5.1,"section":"replacement","rank":31,"parts":[0.0,0.06,0.19,0.0],"note":"Closest of your papers: [[1615477]] (coupling 0.02, 2 shared references). Closest network paper: [[1494411]] (coupling 0.07, 28 shared references).","abstract":"To prepare for the next generation particle collider, likely to be a high-energy precision-frontier electron-positron machine, theoretical predictions must improve in tandem. One aspect in which it is necessary to build on the progress made at LEP and at low-energy $e^+e^-$ colliders is in the modelling of initial-state QED radiation from leptons. In this paper we combine the MC@NLO parton shower matching method with QED resummation methods such as the electron structure function to obtain an automated, process-independent NLO-matched QED parton shower. The case of an electron-positron collider provides a particular challenge to the method due to the integrable singularity present in the lepton structure function, at variance with QCD PDFs. We develop new methods to allow a standard dipole parton shower to operate in the presence of this singularity. We validate the method by examining its dependence on infrared parameters and by verifying both the NLO-correctness, and the resummation properties, of the MC@NLO prediction. Finally, we present results for the case of Higgs production in association with an on-shell $Z$ boson at two proposed FCC-ee energies, the first such predictions at EW NLO+PS accuracy."},{"arxiv":"2604.24849","id":"3149759","title":"Accidental Peccei-Quinn Symmetry from Chiral Gauge Symmetry and Mirror QCD","authors":"Hajime Fukuda, Keisuke Harigaya","score":4.7,"section":"replacement","rank":32,"parts":[0.0,0.09,0.11,0.0],"note":"Closest of your papers: [[1663960]] (coupling 0.03, 2 shared references). Closest network paper: [[2946768]] (coupling 0.04, 11 shared references).","abstract":"We present a solution to the strong CP problem in which a simple chiral U(1) gauge symmetry gives rise to an accidental Peccei-Quinn symmetry that is both explicitly and spontaneously broken by mirror QCD dynamics, yielding a framework without massless fermions or a light QCD axion. The model contains no stable domain walls or colored relics, and it accommodates a sufficiently high reheating temperature to account for the baryon asymmetry of the Universe via leptogenesis. Metastable domain walls and first-order mirror QCD phase transition generate a stochastic background of primordial gravitational waves. Additionally, one of the pseudo-Nambu-Goldstone bosons serves as a viable WIMP dark matter candidate. The gauge boson associated with the chiral U(1) gauge symmetry, which kinetically mixes with the Standard Model hypercharge gauge boson, provides a vector portal connecting dark matter to the Standard Model and plays a central role in the dark-matter phenomenology. Colored pseudo-Nambu-Goldstone bosons can be probed at the LHC through searches for dijet resonances, jets plus missing energy, multijet events with leptons, and displaced vertices."},{"arxiv":"2610.33150","id":"","title":"Dark Matter phase space distribution under a fully relativistic treatment. Eddington inversion according to general relativity","authors":"Jaime Hoefken Zink, Pellegrino Piantadosi","score":4.4,"section":"new","rank":33,"parts":[0.0,0.11,0.04,0.0],"note":"Closest of your papers: [[2859009]] (coupling 0.04, 3 shared references). Closest network paper: [[3122101]] (coupling 0.02, 1 shared references).","abstract":"We develop a fully relativistic extension of Eddington inversion to reconstruct the phase-space distribution function of dark matter from its density profile. Treating dark matter as an effective perfect fluid in a static, spherically symmetric spacetime, we use the Tolman-Oppenheimer-Volkoff equations to determine the gravitational background and derive an Abel-type inversion that yields the distribution function in terms of the conserved particle energy measured at infinity. We show that the resulting expression recovers the classical Eddington inversion in the weak-field, nonrelativistic limit. We also investigate the finite-boundary contribution, which can introduce an unphysical divergence, and present a regularization procedure that removes it. We apply our method to a Milky Way model consisting of a generalized Navarro-Frenk-White halo and a Gondolo-Silk dark-matter spike around Sagittarius A$^*$, neglecting baryonic contributions. The relativistic and Newtonian velocity distributions agree at radii far from the Galactic center but begin to differ at distances of order $10^{-5}\\,\\mathrm{pc}$. Closer to the black hole, the relativistic peak speed can reach approximately twice the Newtonian prediction. Finally, we derive a general expression for dark-matter capture by neutron stars that accommodates arbitrary ambient velocity distributions. Near Sagittarius A$^*$, the relativistic capture factor is nearly an order of magnitude smaller than the Maxwell-Boltzmann prediction, while the Newtonian Eddington result can overestimate it by a factor of approximately two. These results demonstrate the importance of relativistic phase-space reconstruction for dark-matter phenomenology in strong gravitational fields."},{"arxiv":"2610.33725","id":"","title":"Direct Detection of Millicharged Particles from Evaporating Primordial Black Holes","authors":"Biprajit Mondal","score":4.1,"section":"new","rank":34,"parts":[0.0,0.09,0.07,0.0],"note":"Closest of your papers: [[2859009]] (coupling 0.03, 2 shared references). Closest network paper: [[3122101]] (coupling 0.02, 2 shared references).","abstract":"We investigate the direct detection of millicharge particles produced via Hawking evaporation of neutral primordial black holes (PBHs). As they travel through the Galactic magnetic field and then Earth's overburden, they lose energy before reaching an underground detector. Using electron recoil signals, we obtain constraints on the mass and charge parameter space for XENONnT, JUNO and Super-K for evolved PBH populations with initial mass $ M_i=10^{15}~\\rm g$ and $ M_i=8\\times10^{15}~\\rm g$ with initial abundances $f_i^{\\rm PBH}=3.9\\times10^{-7}$ and $f_i^{\\rm PBH}=3.7\\times10^{-4}$, respectively. In the relevant parameter space, this model can provide strong constraints in the high mass region."},{"arxiv":"2605.17832","id":"3157173","title":"Higher excited charmed and charmed-strange mesons in an unquenched quark model","authors":"Ru-Hui Ni, Jia-Jun Wu, Xian-Hui Zhong","score":4.1,"section":"replacement","rank":35,"parts":[0.06,0.02,0.08,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2690106]] (coupling 0.01, 1 shared references). Closest network paper: [[1710056]] (coupling 0.03, 11 shared references).","abstract":"In this paper, as a continuation of our previous work on the low-lying heavy-light meson spectra, we systematically study the mass spectra and Okubo-Zweig-Iizuka-allowed strong decays of the higher $3S$-, $2P$-, $2D$-, and $1F$-wave charmed and charmed-strange mesons within a unified unquenched quark model. It is found that coupled-channel effects induce sizable state dependent mass shifts, which modify the relative level spacings and lower the predicted masses compared with conventional quenched calculations. The newly observed $D_{s1}(2933)^+$ reported by the LHCb collaboration could be identified as the low mass axial vector state $D_s(2P_1)$ via the $2^1P_1-2^3P_1$ mixing. For the broad structure $D_{sJ}(3040)^+$ observed earlier by the \\emph{BABAR} collaboration, the $D_s(3^1S_0)$ assignment seems to be favored over the high mass mixed state $D_s(2P_1^\\prime)$. Meanwhile, the $D(3000)^0$ signals reported by LHCb cannot be consistently explained by any of the considered $3S$, $2P$, $2D$, or $1F$ assignments. Our predicted masses and decay properties of the missing higher $D$ and $D_s$ mesons may provide useful information for future experimental searches."}],"refs":{"1210691":{"first":"Fong","year":2012,"nauth":3,"title":"Leptogenesis in the Universe","role":"other"},"1607799":{"first":"Cai","year":2017,"nauth":5,"title":"From the trees to the forest: a review of radiative neutrino mass models","role":"other"},"3201080":{"first":"Borah","year":2026,"nauth":4,"title":"Inelastic Singlet-Doublet Fermion Dark Matter in light of the 248 keV LZ event","role":"other"},"2963992":{"first":"Jobu","year":2025,"nauth":2,"title":"<math display=\"inline\"><msub><mi>Z<\/mi><mn>4<\/mn><\/msub><\/math> scotogenic model with a Higgs portal","role":"other"},"1756878":{"first":"Palacio Cárdenas","year":2017,"nauth":1,"title":"Models for dark matter and neutrino masses","role":"other"},"1362180":{"first":"Alekhin","year":2015,"nauth":85,"title":"A facility to Search for Hidden Particles at the CERN SPS: the SHiP physics case","role":"other"},"2859009":{"first":"Arbeláez","year":2024,"nauth":5,"title":"Effective field theory and scalar triplet dark matter","role":"seed"},"2946768":{"first":"Suárez Roldán","year":2025,"nauth":1,"title":"Exploring the Frontiers of Standard Model : Neutrinos and Dark Matter, 2021-2025","role":"other"},"509514":{"first":"Mira","year":1999,"nauth":3,"title":"Nonanomalous horizontal U(1)H gauge model of flavor","role":"seed"},"795558":{"first":"Iocco","year
