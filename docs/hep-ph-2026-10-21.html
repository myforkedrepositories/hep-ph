<script>
const RAW = {"n":[{"id":"3216872","arxiv":"2610.28014","title":"Two-Component Dark Matter and Strongly First-Order Electroweak Phase Transition via a Two-Step Mechanism in the Inert Doublet plus Real Singlet Model","first":"Naik","nauth":2,"year":2026,"cites":0,"role":"today","note":"Cites 2 network papers: [[1501489]], [[822544]]. Closest of your papers: [[1455793]] (coupling 0.03, 9 shared references). Closest network paper: [[1778927]] (coupling 0.08, 14 shared references).","score":35.2,"rank":1,"section":"new","parts":[0.7,0.11,0.22,0.0],"abstract":"We study a two-component dark matter model in which a real singlet scalar and an inert doublet scalar are simultaneously present alongside the Standard Model, each stabilized by an independent discrete symmetry. The real singlet undergoes a strong first-order transition at high temperature, establishing an intermediate phase with a non-zero singlet vacuum expectation value, which in turn generates the barrier required for the Higgs field to complete a strongly first-order electroweak transition at a lower temperature. This two-step mechanism naturally enforces the condition $v_c/T_c \\geq 1$, the sphaleron washout-avoidance criterion necessary for electroweak baryogenesis. The gravitational wave spectrum from both steps is computed; the second step produces a decihertz signal, peaking near $0.08$--$0.34~\\mathrm{Hz}$ across the viable parameter space and $0.14$--$0.22~\\mathrm{Hz}$ at the benchmark points, that reaches the sensitivity of DECIGO for the strongest transitions and of BBO more widely, while the first remains sub-threshold for all planned detectors. At the coupling values required to drive the phase transition, the singlet is generically underabundant as a thermal relic, so the inert doublet carries the dominant fraction of the observed relic density. Confronting the model with current constraints, we find that the LUX-ZEPLIN 2024 result excludes the entire electroweak-phase-transition-viable parameter space of the singlet sector across the full mass range, even after rescaling by the singlet relic fraction, establishing a complete no-go for the singlet as a viable thermal dark matter candidate in this framework.","authors":"Deeksha Dattaram Naik, Arnab Chaudhuri","nlinked":116,"nref":116,"src":"INSPIRE","html":true},{"id":"3216990","arxiv":"2610.27270","title":"Correlations in oscillation data and their impact on neutrino mixing models","first":"Gluza","nauth":3,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[2762216]]. Closest of your papers: [[1679809]] (coupling 0.03, 2 shared references). Closest network paper: [[2762216]] (coupling 0.19, 44 shared references).","score":29.5,"rank":2,"section":"new","parts":[0.45,0.09,0.56,0.0],"abstract":"With increasing precision of neutrino experiments, complete correlation among the oscillation parameters will scrutinize theoretical neutrino mass and mixing models. Using available 1D--3D global-fit datasets, we construct a multidimensional $\\tildeχ^2$ function that provides a conservative estimate of the full six-dimensional parameter correlations. In our approach, we delineate the model-constrained parameter space by combining the interpolated experimental data with the analytical relations implied by a given mixing scheme. We identify $\\tildeχ^2_{\\text{min}}$, corresponding to the optimal agreement attainable for parameter points satisfying the model. Applying this framework to several schemes ($\\text{TM}_{1,2}$, $\\mu1,2$--$\\tau1,2$) yields generally better fits for IO than for NO, with the $\\mu1$--$\\tau1$ scheme under IO providing the best overall fit. While $\\mu1,2$--$\\tau1,2$ and $\\text{TM}_1$ schemes perform significantly better than $\\text{TM}_2$, the latter is excluded at $>3σ$ C.L. using NuFIT~v6.1 data. We further evaluate the implications of these correlation-respecting constraints on the effective neutrino mass observables relevant to tritium $β$-decay ($m_β$) and neutrinoless double $β$-decay ($m_{ββ}$). The proposed approach can be readily extended to test any theoretical framework that predicts algebraic relations among neutrino oscillation parameters, and we provide a GitHub starter kit.","authors":"Janusz Gluza, Biswajit Karmakar, Szymon Zięba","nlinked":79,"nref":86,"src":"INSPIRE","html":true},{"id":"3216948","arxiv":"2610.28252","title":"Probing a heavy neutral lepton in a radiative neutrino model at a muon collider","first":"Bamwidhi","nauth":4,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[1607799]]. Also cites widely used network papers: [[1494411]]. Closest of your papers: [[1627633]] (coupling 0.05, 4 shared references). Closest network paper: [[2665284]] (coupling 0.07, 7 shared references).","score":28.1,"rank":3,"section":"new","parts":[0.48,0.16,0.21,0.0],"abstract":"We investigate direct and Higgs-mediated production of a Dirac heavy neutral lepton in a radiative neutrino-mass model at a future $3~\\mathrm{TeV}$ muon collider. We consider heavy neutral lepton masses in the window $m_Z<m_N<m_h$, where the decays $N\\to\\ell W$ and $N\\toνZ$ can proceed with on-shell weak bosons. We consider both direct production, $μ^+μ^-\\to Nν$, and Higgs-mediated production through $μ^+μ^-\\toν_μ\\barν_μh$, $h\\to Nν$. Both channels lead to the common $\\ell^\\pm jj+p_{\\mathrm T}^{\\mathrm{miss}}$ final state. We perform a detector-level analysis with an integrated luminosity of $1~\\mathrm{ab}^{-1}$, assuming unpolarized muon beams, and derive median expected $95\\%$ confidence-level upper limits on the visible signal cross section ranging from approximately $0.027$ to $0.113~\\mathrm{fb}$, corresponding to limits on the mixing strength parameter $|U_{μN}|^2$ ranging from $6.7\\times10^{-6}$ to $8.3\\times10^{-5}$ for six benchmark points. The Higgs-mediated production channel contributes $\\sim15$--$72\\%$ of the signal after the common event selection, but improves the expected limits by $\\sim0.18$--$1.19\\%$ within the common classifier and binning scheme. This small improvement reflects the classifier-score distribution of the Higgs-mediated events. The limits on $|U_{μN}|^2$ account for the benchmark-specific flavor mixings and assume an independent $10\\%$ background uncertainty in each classifier-score bin.","authors":"Isaac Bamwidhi, Mohamed Belfkir, Mohamed Amin Loualidi, Salah Nasri","nlinked":39,"nref":41,"src":"INSPIRE","html":true},{"id":"3216809","arxiv":"2610.27105","title":"The Electron-Recoil Response Tail and the LZ High-Energy Event Background","first":"Bandyopadhyay","nauth":3,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3201080]]. Closest of your papers: [[2859009]] (coupling 0.01, 2 shared references). Closest network paper: [[3201080]] (coupling 0.19, 18 shared references).","score":27.4,"rank":4,"section":"cross","parts":[0.45,0.04,0.54,0.0],"abstract":"We reconstruct the continuum electron-recoil contribution to the LZ background expectation from the collaboration's released simulation configuration. The released model specifies a definite response tail, but the published calibration information supplies no bound on how far the physical tail may depart from it at the probabilities the expectation depends on. Distributions reproducing the executable model's mean, variance, and standardised skewness exactly, and its event-conditioned 10, 50, and 90\\% \\(N_e\\) quantiles to about one per cent, differ in the relevant tail probability by more than five orders of magnitude. The ladder is short: a tail agreeing with that central characterisation to 0.14\\% in the quantiles lifts the electron-recoil contribution out of the negligible range, and one agreeing to 0.47\\% makes it comparable to the entire background quoted for the comparison region. We go on to identify the measurements that would settle it.","authors":"Triparno Bandyopadhyay, Rajarajeswari Ramasamy, Nishitha TP","nlinked":126,"nref":136,"src":"INSPIRE","html":true},{"id":"3216929","arxiv":"2610.28267","title":"$\\mathbb{Z}_3$ and $S_3$ gaugings of $\\mathbb{Z}_N\\times\\mathbb{Z}'_N$ non-invertible symmetries: quark texture zeros and phenomenology","first":"Jiang","nauth":3,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[2762216]]. Closest of your papers: [[2690106]] (coupling 0.01, 1 shared references). Closest network paper: [[2762216]] (coupling 0.06, 12 shared references).","score":21.7,"rank":5,"section":"new","parts":[0.45,0.03,0.18,0.0],"abstract":"We investigate texture zeros in the quark Yukawa matrices arising from the $\\mathbb{Z}_3$ and $S_3$ gauging of $\\mathbb{Z}_N\\times\\mathbb{Z}'_N$, associated with the non-invertible $Δ(3N^2)$ and $Δ(6N^2)$ symmetries, respectively. We construct the equivalence classes and their fusion rules and use them as selection rules for the Yukawa interactions. We systematically classify the full-rank quark Yukawa textures generated by the two gaugings for $N=2,3,4,$ and $5$. The two gaugings yield the same texture spectrum for $N=2$ and $N=4$, whereas the $S_3$ gauging produces additional textures for $N=3$ and $N=5$. We further analyze the most restrictive texture pairs compatible with quark data and find that there are at most nine zeros in these texture pairs. For up- and down-quark mass matrices with a total of nine texture zeros, one sector is allowed to contain six zeros while the other contains three, or one contains five zeros while the other contains four. The former case has been studied in previous works. We perform numerical fits for the latter and find it consistent with experimental data. Some viable textures also admit real quark-mass determinants while retaining a physical CKM phase, suggesting a possible connection to the strong CP problem.","authors":"Zheng Jiang, Bu-Yao Qu, Gui-Jun Ding","nlinked":60,"nref":61,"src":"INSPIRE","html":true},{"id":"3216753","arxiv":"2610.27006","title":"Axion-Like Particle Searches at Muon Colliders: Photon-Neutrino Signatures and Heavy-Neutral-Lepton Feasibility","first":"Ahmed","nauth":4,"year":2026,"cites":0,"role":"today","note":"Closest of your papers: [[1671831]] (coupling 0.06, 6 shared references). Closest network paper: [[2665284]] (coupling 0.10, 7 shared references).","score":11.0,"rank":6,"section":"new","parts":[0.0,0.2,0.28,0.0],"abstract":"We study the mono-photon signature $μ^+μ^-\\toγa\\toγν\\barν$ at $3$ and $10\\TeV$ muon colliders, with integrated luminosities of $1$ and $10\\,\\mathrm{ab}^{-1}$, in a two-coupling axion-like-particle (ALP) simplified model. Five benchmarks spanning $m_a=100$--$1000\\GeV$ are generated at $g_{aγγ}=0.01\\TeV^{-1}$ and flavor-universal pseudoscalar neutrino couplings $y_ν=0.1$ or $0.3$, giving invisible branching fractions above 99.995\\% and mono-photon cross sections of $0.00854$--$0.01217\\,\\mathrm{fb}$. Assuming a 1\\% background normalization uncertainty, a cut-based photon-line selection gives projected 95\\% sensitivity to $g_{aγγ}\\simeq0.039$--$0.045\\TeV^{-1}$ at $3\\TeV$ and $0.0137$--$0.0140\\TeV^{-1}$ at $10\\TeV$. A ROOT/TMVA gradient-boosted decision tree with validation-fixed thresholds reaches held-out AUC values of $0.9967$--$0.9993$ and $g_{95}=0.0192$--$0.0400\\TeV^{-1}$ at $3\\TeV$ and $0.0122$--$0.0144\\TeV^{-1}$ at $10\\TeV$. Because only 2-41 irreducible-background test events populate the optimized classifier tails, the mass--coupling contours are reported as projected expected sensitivities rather than profile-likelihood or CL$_s$ exclusions. A separate appendix records a phenomenological, parton-level HNL diphoton feasibility study; it is not used to claim detector-level sensitivity or exclusion.} \\keywords{Axion-like particles, muon collider, mono-photon, diphoton, heavy neutral leptons, neutrinos, multivariate analysis, effective field theory","authors":"Ijaz Ahmed, Waqas Ahmad, M. Tayyab Javaid, Jamil Muhammad","nlinked":32,"nref":34,"src":"INSPIRE","html":true},{"id":"3216894","arxiv":"2610.27987","title":"Displaced e+e- Signatures from an X17-Mediated Inelastic Dark-Sector Cascade","first":"Serao","nauth":2,"year":2026,"cites":0,"role":"today","note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2855387]] (coupling 0.04, 4 shared references). Closest network paper: [[3214448]] (coupling 0.09, 8 shared references).","score":10.1,"rank":7,"section":"new","parts":[0.06,0.11,0.25,0.0],"abstract":"We investigate displaced electron-positron signatures from an inelastic dark sector mediated by a light vector boson associated with the X17 anomaly. A heavy neutral fermion decays into a lighter stable state and the mediator, whose subsequent decay produces a single visible vertex after two stages of neutral propagation. We calculate the decay width, displacement distribution, lepton kinematics, and production rate in electro-positron collisions, including vector polarization. At Belle II, stronger dark-sector couplings increase production but require finely adjusted masses to preserve a macroscopic decay length. We quantify off-shell contributions and assess the validity of the two-body approximation. We show that the electron-positron pair cannot satisfy simultaneously the moment and opening-angle cuts of an existing search proposal for the configuration studied. Less restrictive selections allow nonzero kinematic acceptance. Our results clarify the experimental requirements for searching these signatures at Belle II.","authors":"Raoul Serao, Antonio Capolupo","nlinked":61,"nref":68,"src":"INSPIRE","html":true},{"id":"1494411","arxiv":"1610.07922","title":"Handbook of LHC Higgs Cross Sections: 4. Deciphering the Nature of the Higgs Sector","first":"de Florian","nauth":376,"year":2016,"cites":2934,"role":"other","note":"","score":null},{"id":"1778927","arxiv":"2002.02036","title":"Inert doublet as multicomponent dark matter","first":"Betancur","nauth":3,"year":2020,"cites":20,"role":"other","note":"","score":null},{"id":"16718 genic extension","first":"Borah","nauth":2,"year":2017,"cites":61,"role":"other","note":"","score":null}],"e":[[10,16,"c"],[24,20,"c"],[14,22,"c"],[25,7,"c"],[2,7,"c"],[14,28,"c"],[16,20,"c"],[21,24,"c"],[22,15,"c"],[10,24,"c"],[0,8,"k"],[5,9,"k"],[13,11,"c"],[2,10,"k"],[0,11,"k"],[5,12,"k"],[7,20,"c"],[14,10,"c"],[5,13,"k"],[18,23,"c"],[25,24,"c"],[28,21,"c"],[8,10,"c"],[26,23,"c"],[0,14,"k"],[14,17,"c"],[23,16,"c"],[0,15,"k"],[5,16,"k"],[17,7,"c"],[22,23,"c"],[6,17,"c"],[22,27,"c"],[2,9,"k"],[6,18,"k"],[23,28,"c"],[3,19,"c"],[14,15,"c"],[0,20,"c"],[2,12,"k"],[28,24,"c"],[0,21,"c"],[2,13,"k"],[13,23,"c"],[8,15,"c"],[1,14,"k"],[4,22,"c"],[27,15,"c"],[2,23,"c"],[25,21,"c"],[5,10,"k"],[10,21,"c"],[18,11,"c"],[5,24,"k"],[1,22,"c"],[14,27,"c"],[2,25,"k"],[6,26,"k"],[8,21,"c"],[14,21,"c"],[0,16,"k"],[1,27,"k"],[14,23,"c"],[2,16,"k"],[26,17,"c"],[0,28,"k"]],"next":[{"arxiv":"2610.28144","id":"3216963","title":"Polarization signatures of mixed scalar - pseudoscalar ALP - photon couplings in intense laser pulses","authors":"Musajan Kadir, Hong-Hao Fan, Ying Wu, Qi-Rong Wang, Bai-Song Xie","score":9.2,"section":"new","rank":8,"parts":[0.06,0.11,0.2,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1607572]] (coupling 0.04, 3 shared references). Closest network paper: [[1955022]] (coupling 0.07, 7 shared references).","abstract":"We investigate photon-to-axion-like-particle (ALP) conversion in a finite, linearly polarized laser pulse for a single ALP field with simultaneous scalar-type and pseudoscalar-type couplings to photons. Varying the collision angle between the strong pulse and the probe provides a continuous kinematic scan of the resonant ALP mass. For fixed kinematics in this setting, the scalar-type and pseudoscalar-type ALP conversion amplitudes interfere coherently, making both the photon-to-ALP conversion probability and the polarization rotation depend on the difference between the probe polarization angle $α$ and the coupling angle $θ_g$. Conversion is maximal at $|α-θ_g|=90^\\circ$, where the polarization rotation vanishes, while the rotation magnitude peaks at $α-θ_g=45^\\circ$ modulo $90^\\circ$, where conversion is half-maximal. These complementary polarization-angle dependences provide polarization-resolved signatures of mixed scalar--pseudoscalar photon couplings."},{"arxiv":"2610.27057","id":"3216775","title":"Probing Lepton Flavor Violation at FCC-ee","authors":"L. Allwicher, R. Bartocci, M. Cepeda, C. Cornella, L. P. S. Leal, A. Lusiani, C. Martin Perez, P. Paradisi, E. Scantamburlo, O. Sumensari","score":8.8,"section":"new","rank":9,"parts":[0.06,0.11,0.18,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1854224]] (coupling 0.04, 5 shared references). Closest network paper: [[1796007]] (coupling 0.06, 13 shared references).","abstract":"We investigate the prospects for probing Lepton Flavor Violation (LFV) at FCC-ee within the Standard Model Effective Field Theory (SMEFT) framework. The approximately $2 \\times 10^{11}$ $τ$-lepton pairs expected at the $Z$-pole run of FCC-ee could improve current limits on the branching fractions of $τ\\to3\\ell$ and $τ\\to\\ellγ$ ($\\ell=e,μ$) by factors ranging from 30 to 800, depending on the specific channel. We compare the resulting new-physics reach with that obtained from searches for $Z \\to τ\\ell$ and $h \\to τ\\ell$, which have so far received greater attention in studies of LFV at future $e^+e^-$ colliders. We find that $τ$ decays can surpass both the current and the projected sensitivity of $Z\\toτ\\ell$ searches to the same LFV interactions, while probing a broader range of SMEFT operators. We further show that, for LFV Yukawa-like interactions, direct searches for $h\\toτ\\ell$ provide the strongest sensitivity. By contrast, for semileptonic operators that radiatively induce LFV Higgs decays, this hierarchy can be reversed, with $τ$ decays providing the leading probe."},{"arxiv":"2510.23695","id":"3074263","title":"New Bounds on Heavy QCD Axions from Big Bang Nucleosynthesis","authors":"Tae Hyun Jung, Takemichi Okui, Kohsaku Tobioka, Jiabao Wang","score":8.6,"section":"replacement","rank":10,"parts":[0.06,0.12,0.13,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1607572]] (coupling 0.04, 5 shared references). Closest network paper: [[1861353]] (coupling 0.05, 8 shared references).","abstract":"We study Big Bang Nucleosynthesis (BBN) constraints on heavy QCD axions. BBN offers a powerful probe of new physics that modifies the neutron-to-proton ratio during the process, thanks to the precisely measured primordial Helium-4 abundance. A heavy QCD axion provides an attractive target for this probe, because not only is it a well-motivated hypothetical particle by the strong CP problem, but also it dominantly decays to hadrons if kinematically allowed. A range of its lifetime is thus excluded where the hadronic decays would significantly alter the neutron-to-proton ratio. We compute axion-induced modification of the neutron-to-proton ratio, and obtain robust upper bounds on the axion lifetimes, as low as 0.017 s for the axion mass higher than 300 MeV. Remarkably, this is stronger than projected future CMB bounds via $N_{\\rm eff}$. Our bounds are largely insensitive to uncertainties in hadronic cross sections and the axion's branching fractions into various hadrons, as well as to the precise value of the initial axion abundance. We also incorporate, for the first time, several key improvements, such as scattering processes by energetic $K_L$ and secondary hadrons, that can also be important for studying general hadronic injections during BBN, not limited to those from axion decays."},{"arxiv":"2610.27131","id":"3216851","title":"Illuminating Light Dark Matter with Fixed-Target Experiments","authors":"Taylor R. Gray","score":8.5,"section":"new","rank":11,"parts":[0.06,0.12,0.13,0.0],"note":"Also cites widely used network papers: [[1518747]]. Closest of your papers: [[2855387]] (coupling 0.04, 9 shared references). Closest network paper: [[2946768]] (coupling 0.04, 19 shared references).","abstract":"Astronomical and cosmological observations provide overwhelming evidence for a non-luminous matter component, dark matter (DM), whose particle nature remains unknown. Experimental searches for non-gravitational DM interactions have largely targeted DM with GeV-TeV masses via nuclear recoils, yielding no discovery thus far. DM in the MeV-GeV mass range, however, is theoretically motivated, reproducing the observed relic abundance while remaining invisible to nuclear recoil searches. Such light DM is better probed via electron recoils or at fixed-target experiments. This thesis advances the theoretical and statistical toolkit for light DM searches at fixed-target experiments, spanning model building, statistical inference, global fits, and signal simulation. We survey the landscape of fixed-target searches for light DM, focusing on the Light Dark Matter eXperiment (LDMX). We also simulate DM signatures at the next-generation experiment SHiP to assess its sensitivity. Within minimal DM models, we present a likelihood-based statistical framework for LDMX using the full two-dimensional recoil electron distribution, spanning exclusion, discovery, parameter estimation, and model comparison in frequentist and Bayesian formulations. This establishes the discovery potential of LDMX, and we quantify the direct detection exposure needed to independently confirm a potential signal. Beyond this paradigm, we perform global fits of scalar and fermionic light DM, combining cosmological, astrophysical, and laboratory constraints. We then extend fixed-target searches to spin-1 DM and higher electromagnetic moment dark photons, yielding rich signatures with strong complementarity to other probes. Finally, we go beyond standard nuclear modelling of dark photon production, incorporating elastic nuclear form factors and spectral functions from many-body ab initio methods in place of analytic treatments."},{"arxiv":"2610.28068","id":"3216962","title":"Constraints on Dark Matter Annihilation from Starlight-Induced Inverse Compton Emission in Omega Centauri","authors":"Guan-Sen Wang, Xu Pan, Lei Feng","score":7.3,"section":"cross","rank":12,"parts":[0.06,0.1,0.1,0.0],"note":"Also cites widely used network papers: [[1518747]]. Closest of your papers: [[2859009]] (coupling 0.04, 3 shared references). Closest network paper: [[2703113]] (coupling 0.04, 4 shared references).","abstract":"The search for the particle identity of dark matter (DM) remains one of the foremost challenges in modern physics. In this work, we derive new constraints on the DM annihilation cross section $\\langleσv\\rangle$ by considering the inverse Compton (IC) scattering of DM annihilation injected $e^+e^-$ off the starlight radiation field in Omega Centauri. As a likely remnant core of a dwarf galaxy, Omega Centauri provides a dense stellar environment that enhances the predict IC signal. Using multi-wavelength observations from Chandra and Fermi-LAT, we establish upper limits on $\\langleσv\\rangle$ over a wide DM mass range from MeV to TeV. Notably, in the tens-of-MeV range, our results surpass existing constraints by approximately two orders of magnitude, exceeding $\\langleσv\\rangle \\sim 10^{-31}~{\\rm cm^3\\,s^{-1}}$. At several GeV to the TeV DM masses range, our constraints also remain stronger than existing limits. Our results demonstrate that starlight induced IC emission is an important component for indirect DM searches in dense stellar systems, establishing Omega Centauri as a powerful probe of the nature of DM."},{"arxiv":"2610.28198","id":"3216999","title":"Soft Breaking Naturalness in Majorana Fermion Loop induced Scalar and Majoron Amplitudes","authors":"Mussawir Khan, Wei Chao, Yu Gao","score":6.9,"section":"new","rank":13,"parts":[0.0,0.13,0.17,0.0],"note":"Closest of your papers: [[452755]] (coupling 0.04, 2 shared references). Closest network paper: [[1944631]] (coupling 0.06, 10 shared references).","abstract":"Majorana fermion loops contribute a shift-symmetry violating effective potential to the coupled scalar field. When the Majorana fermion is light, a larger number of symmetry violating insertions let the loop contribution to grow increasingly infrared sensitive to the Majorana mass. With explicit calculations, we calculate the symmetry violating amplitudes, show that the scalar potential's natural scales serve as nonzero kinematic matching points which remove the superficial sensitivity to the symmetry-violating Majorana mass, continuously restoring the shift symmetry in agreement with 't Hooft naturalness. In the spontaneous broken phase, the scalar radial vacuum expectation value readily ensures the infrared safety of symmetry violating Majorana fermion loops, and all $n$-point Majoron functions develop a leading linear dependence on the symmetry violating parameter in the soft breaking limit, which matches the expansion of the Coleman-Weinberg determinant."},{"arxiv":"2610.28147","id":"3216898","title":"Probing the $τ$ anomalous magnetic and electric dipole moments in photon-induced $γγ\\toτ^+τ^-$ production at the FCC-hh","authors":"A. Senol, H. Denizli, M. Köksal","score":6.7,"section":"new","rank":14,"parts":[0.0,0.13,0.13,0.0],"note":"Closest of your papers: [[1627633]] (coupling 0.04, 4 shared references). Closest network paper: [[1674879]] (coupling 0.05, 4 shared references).","abstract":"The sensitivity of the FCC-hh to the anomalous magnetic moment $a_τ$ and the electric dipole moment $d_τ$ of the $τ$ lepton is studied in photon-induced $γγ\\toτ^+τ^-$ production with both $τ$ leptons decaying hadronically. Central exclusive (elastic) signal events, in which both protons remain intact, are generated with MadGraph5_aMC@NLO using a FeynRules UFO model of the anomalous $γττ$ vertex merged with the TauDecay model, so that the $τ$ decays and their spin correlations are included in the matrix element. Single- and double-dissociative production is estimated with SuperChic and added to the elastic signal with its own coupling dependence and with normalisation and shape uncertainties of 25%. Pythia 8 decays the unstable hadrons in the signal, decays the $τ$ leptons and simulates the parton shower and hadronisation in the backgrounds, and hadronises the dissociated protons. Signal and backgrounds are passed through the Delphes simulation of the FCC-hh detector. Hadronic $τ$ decays are reconstructed from particle-flow tracks and photons with an algorithm based on the hadrons-plus-strips approach, with an efficiency of 73.4% within the acceptance. Requiring no additional tracks from the $τ$ vertices retains part of the dissociative contribution and reduces the Drell-Yan and $γγ\\to WW$ backgrounds to 0.9% of the SM yield. The couplings are constrained from the shape of the total transverse mass distribution. For a centre-of-mass energy of 84 TeV and 30 ab$^{-1}$, the expected 95% CL limits are $-3.38\\times10^{-4} < a_τ< 3.36\\times10^{-4}$ and $|d_τ| < 1.88\\times10^{-18}\\,e\\,$cm, about an order of magnitude beyond the current bounds. Results are also given for FCC-hh scenarios between 72 and 120 TeV and for an optimistic detector parametrisation."},{"arxiv":"2610.27082","id":"3216784","title":"Cosmic birefringence from a stiff axion field and its cosmological implications","authors":"Andrea Minotti, Yunzhi Wu, Tiziano Zanzarella, Nicolao Fornengo, Marco Regis, Marco Taoso","score":6.2,"section":"new","rank":15,"parts":[0.0,0.02,0.05,0.5],"note":"Co-authors of yours: Taoso. Closest of your papers: [[1686334]] (coupling 0.00, 1 shared references). Closest network paper: [[1955022]] (coupling 0.02, 2 shared references).","abstract":"We propose a model in which the observed cosmic microwave background birefringence arises from the interaction of photons with a stiff ($w=1$) pseudo-scalar field that today contributes a subdominant fraction of the total energy density, distinct from both dark matter and dark energy. Big Bang Nucleosynthesis constrains the cosmological density of the stiff field, leading to a lower bound for its coupling with photons, $g_{φγ} > 8.9 \\times 10^{-14}\\,\\mathrm{GeV}^{-1}$. Photon conversion in cluster-hosted quasars sets an upper bound, $g_{φγ} < 5.0 \\times 10^{-13}\\,\\mathrm{GeV}^{-1}$. Therefore, there is a narrow window for the discovery of this cosmological component that can be explored in the forthcoming years with astrophysical axion searches. Moreover, we show that this scenario leads to gravitational-wave signals that can be tested with planned experiments."},{"arxiv":"2610.27996","id":"3216889","title":"Partial reconstruction of the decay $B_{s}^{0}\\rightarrow φ(K^{+}K^{-})η' (π^{+}π^{-}η)$","authors":"Jeremiah D. Juevesano, Marlon P. Brade, Dennis C. Arogancia, Jan Mickelle V. Maratas","score":6.1,"section":"new","rank":16,"parts":[0.06,0.08,0.07,0.0],"note":"Also cites widely used network papers: [[1688995]]. Closest of your papers: [[1627633]] (coupling 0.03, 1 shared references). Closest network paper: [[1499879]] (coupling 0.03, 1 shared references).","abstract":"The decay $B_s^0 \\to φ(K^+K^-)η'(π^+π^-η)$ is of particular interest in flavour physics because in the Standard Model it proceeds predominantly through the quark transition $\\bar{b} \\to \\bar{s}s\\bar{s}$. However, the reconstruction of this decay is experimentally challenging due to the presence of the neutral $η$ particle, which significantly reduces the overall reconstruction efficiency. In this study, the feasibility of using the partial reconstruction technique to reconstruct the invariant mass of the $B_s^0$ meson without explicitly detecting the $η$ particle is investigated. Monte Carlo simulated events corresponding to an FCC-ee environment are used, and the effects of detector momentum and vertex resolutions on the reconstruction performance are examined. The results show that improved vertex resolution substantially improves the global reconstructed mass response and partial-reconstruction efficiency, while improvements in momentum resolution are manifested primarily through a narrowing of the fitted central DCB component. These findings suggest that future high-luminosity $e^+e^-$ colliders such as FCC-ee could effectively exploit the partial reconstruction technique to study rare decay modes containing undetected neutral particles."},{"arxiv":"2608.16107","id":"3191716","title":"Unfolding the low-energy reactor neutrino flux from CE$ν$NS data with a finite Dirac sum","authors":"Muping Chen, Graciela Gelmini, Danny Marfatia, Koichiro Yasuda","score":6.1,"section":"replacement","rank":17,"parts":[0.06,0.07,0.08,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1708009]] (coupling 0.02, 1 shared references). Closest network paper: [[1742302]] (coupling 0.03, 3 shared references).","abstract":"We present a novel method to analyze coherent elastic neutrino--nucleus scattering (CE$ν$NS) data to extract the reactor antineutrino spectrum below the inverse beta decay threshold of 1.8 MeV, where it remains unmeasured. Adapting halo-independent analysis techniques developed for direct dark matter detection, we show how to obtain a best-fit and a pointwise confidence band for the integrated neutrino flux, without assuming a parametric form or smoothness prior for the spectrum. In our approach, which follows from convex geometry arguments, the differential neutrino rate is written as a linear combination of Dirac delta functions -- a finite Dirac sum (FDS) -- with a maximum number of terms determined by the number of data points. We apply our \"FDS method\" to mock CE$ν$NS data for a low-threshold Ge detector and compare it with Tikhonov-regularized unfolding."},{"arxiv":"2610.28207","id":"3216968","title":"Hadronization in QCD and Fragmentation Functions","authors":"Ignacio Borsa, Marco Stratmann","score":6.0,"section":"new","rank":18,"parts":[0.06,0.02,0.21,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1627633]] (coupling 0.01, 1 shared references). Closest network paper: [[2817040]] (coupling 0.07, 153 shared references).","abstract":"The hadronization of quarks and gluons is reviewed within the framework of collinear parton-to-hadron fragmentation functions closely associated with the notion of factorization in hard scattering processes in QCD. The state-of-the-art in calculating both the scale evolution of fragmentation functions and the partonic cross sections pertinent to their determination from data up to next-to-next-to-leading order accuracy is presented. Potential improvements up to next-to-next-to-leading logarithmic order are outlined as well. All relevant experimental data sets for single-inclusive pion, kaon, and unidentified charged hadron production are listed. The most recent sets of fragmentation functions and their uncertainties extracted from these data in global QCD analyses utilizing various different strategies are presented and compared to each other."},{"arxiv":"2610.27346","id":"3216856","title":"Pretraining on boosted boson decays for polarization tagging of hadronic $W$ bosons","authors":"Saptaparna Bhattacharya","score":5.9,"section":"cross","rank":19,"parts":[0.0,0.12,0.12,0.0],"note":"Closest of your papers: [[1455793]] (coupling 0.04, 4 shared references). Closest network paper: [[1674879]] (coupling 0.04, 3 shared references).","abstract":"Longitudinally polarized weak bosons probe the unitarization of vector-boson scattering. At large boosts, longitudinal and transverse $W$ bosons produce jets with the same mass and two-prong structure, distinguished only by the decay angle. Longitudinal bosons are rare: they occur in only 0.3% of $W$+jet events at these large boosts. We ask where the polarization information of a boosted $W$ boson lies and how much a tagger can recover. Requiring both decay quarks within the jet truncates the decay-angle distribution at an edge set by $m/(p_T R)$, which we show bounds any hadronic polarization tagger. Within this acceptance, the decay angle carries essentially all the polarization information of a jet in $W$+jet events. Polarized samples are costly to simulate for vector-boson scattering, so we pretrain a point-edge transformer on $10^7$ unpolarized jets of boosted bosons, top quarks and QCD and test how much it recovers from few labels. Fine-tuned on 783 labeled jets per class with its transformer blocks kept fixed, the network pretrained to classify these jets improves on training from scratch, but generic pretraining on a broad mix of jets and a boosted decision tree on substructure observables do as well. The best taggers recover most, but not all, of the separation the decay angle allows, and student networks with a few hundred times fewer parameters, trained by knowledge distillation, match their teacher. More information lies outside the jet. The production angle, reconstructed with the recoiling jet, improves every tagger. In diboson production and vector-boson scattering at matrix-element level, the production kinematics carry more information than the decay angles of both bosons. Trading the generality of a jet tagger for an event-level tagger trained on the process thus brings significant gains, which measurements of longitudinal vector-boson scattering could exploit."},{"arxiv":"2607.15098","id":"3181044","title":"Inelastic Scattering Effects on Attenuation of Boosted Dark Matter","authors":"Guanhua Gu, Liangliang Su, Lei Wu, Jin Min Yang","score":5.9,"section":"replacement","rank":20,"parts":[0.06,0.06,0.1,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2859009]] (coupling 0.02, 2 shared references). Closest network paper: [[3094526]] (coupling 0.03, 4 shared references).","abstract":"Earth attenuation is crucial for interpreting direct-detection constraints on boosted dark matter (DM), since scatterings with terrestrial nuclei can significantly modify the flux and energy spectrum reaching underground detectors. At boosted energies, inelastic nuclear channels beyond ordinary elastic scattering can become relevant, including quasi-elastic scattering, deep-inelastic scattering, and resonant scattering. In this work, we incorporate the resonant scattering of boosted dark matter (DM) off nuclei into the Earth-attenuation framework, in combination with the elastic, quasi-elastic, and deep-inelastic channels. We find that, in the heavy-mediator regime, resonant scattering can give a non-negligible contribution to the attenuation of boosted DM. Using the latest PandaX-4T data, we derive new constraints on the spin-independent boosted DM-nucleon cross section $\\barσ_n$."},{"arxiv":"2610.27015","id":"3216766","title":"$Λ_b \\to Λ\\ell^+\\ell^-$ and $Λ_b \\to Λ^{\\ast} \\ell^+\\ell^-$ decays with polarized leptons","authors":"Diganta Das, Vedant Parekh, Ria Sain, Dargi Shameer","score":5.6,"section":"new","rank":21,"parts":[0.0,0.12,0.1,0.0],"note":"Closest of your papers: [[1708009]] (coupling 0.05, 3 shared references). Closest network paper: [[1710056]] (coupling 0.04, 15 shared references).","abstract":"We present an analysis of lepton polarization observables in the rare flavor-changing neutral current decays $Λ_b \\to Λ\\ell^+\\ell^-$ and $Λ_b \\to Λ^*\\ell^+\\ell^-$. These decays are driven by the quark-level transition $b \\to s\\ell^+\\ell^-$ and are sensitive to short-distance physics within and beyond the Standard Model. We work within an effective Hamiltonian framework and derive single lepton polarization asymmetries, double lepton polarization asymmetries, and polarized forward-backward asymmetries using the helicity method. The observables are expressed in terms of transversity amplitudes and evaluated using state-of-the-art lattice QCD form factors. We analyze the $q^2$ dependence of several observables for both the ground-state $Λ$ and the excited $Λ^*(1520)$ final states and discuss sensitivities of the observables to chiral structure of the effective operators and complex Wilson coefficients."},{"arxiv":"2610.26908","id":"3216736","title":"Floquet Instability of Photon-Axion Conversion","authors":"Yuuki Sugiyama, Kazushige Ueda","score":5.3,"section":"new","rank":22,"parts":[0.0,0.11,0.1,0.0],"note":"Closest of your papers: [[1607572]] (coupling 0.04, 3 shared references). Closest network paper: [[1861353]] (coupling 0.04, 4 shared references).","abstract":"The discovery of axions would provide evidence for physics beyond the Standard Model. In this work, we investigate axion-photon conversion in the presence of a background magnetic field with simultaneous spatial and temporal periodicity. By performing a Lorentz transformation, the coupled axion-photon system is mapped onto a time-periodic linear system that can be analyzed using Floquet theorem. We find unstable modes associated with resonant crossing between Floquet replicas. The resulting complex Floquet exponents lead to exponentially growing modes, which we identify as a Floquet instability. Then, we determine the parameter regions in which this instability appears in a perturbative analysis. We further show that the Floquet instability enhances the axion-field amplitude generated from an initial photon field. Our results demonstrate that spatiotemporally periodic magnetic backgrounds provide a distinct mechanism for modifying axion-photon conversion through Floquet instability."},{"arxiv":"2610.26892","id":"3216743","title":"Minimal-length kinematics of coherent light and a proposed two-color vacuum chronoscopy","authors":"Zhi-Wei Wang, Saurya Das, Samuel L. Braunstein","score":5.0,"section":"cross","rank":23,"parts":[0.0,0.0,0.0,0.5],"note":"Co-authors of yours: Das.","abstract":"The unification of quantum theory and general relativity suggests the existence of a minimal measurable length, leading to a generalized uncertainty principle (GUP) and an energy-dependent vacuum group velocity. Testing these effects with macroscopic objects typically encounters the ``soccer-ball problem,'' where applying Planck-scale deformations to the total momentum predicts observationally ruled-out velocity deviations. We adopt the QFT-natural prescription in which the GUP modifies single-mode commutators, and verify by explicit calculation that the macroscopic group velocity of a multimode coherent pulse reduces to the single-photon GUP velocity evaluated at the central wavelength, multiplied by the classical Gaussian-beam factor, with no dependence on the total pulse energy. The energy--momentum relation $E=pc$ itself is unmodified; the deformation enters through the velocity--momentum relation and is equivalent to a modified dispersion relation in the wave vector, with a quadratic coefficient that depends on which of the two variables is used. The soccer-ball problem $\\,$---$\\,$ which arises only when the GUP is applied to the center-of-mass momentum of a composite system $\\,$---$\\,$ is therefore absent for coherent light, and macroscopic petawatt pulses probe the same parameter space as single high-energy photons. Building on this framework, we propose a two-color vacuum chronoscopy experiment using a short-pulse petawatt laser and its high-harmonic generation. By systematically varying the macroscopic beam waist, our setup separates Planck-scale kinematic shifts from classical diffraction delays, establishing a controlled, source-independent terrestrial methodology whose sensitivity we assess against current astrophysical bounds and against the dominant waist-independent systematics that limit it, residual-gas dispersion and the harmonic birth-time offset."},{"arxiv":"2610.27056","id":"3216783","title":"Annihilation feedback on elastic scattering in self-interacting dark matter","authors":"Kalliopi Petraki, Thomas Pignard","score":4.9,"section":"new","rank":24,"parts":[0.0,0.07,0.17,0.0],"note":"Closest of your papers: [[793723]] (coupling 0.02, 3 shared references). Closest network paper: [[3122101]] (coupling 0.06, 4 shared references).","abstract":"Sizable dark-matter self-interactions, motivated by observations of galactic structure, often arise from the exchange of light force mediators. Light mediators can render scattering nonperturbative and make inelastic processes important. Unitarity, via the optical theorem, implies that elastic and inelastic interactions cannot be treated independently: inelasticity induces absorptive contributions to the two-particle self-energy kernel that determines the elastic amplitude, while the resulting incoming-state dynamics also modifies the inelastic amplitudes. We study the feedback of dark-matter annihilation on elastic scattering in the presence of a long-range force. Although annihilation is a short-distance process, it can be strongly enhanced by such a force. We find that its feedback becomes significant near Sommerfeld resonances, where it suppresses the low-velocity growth of the baseline elastic cross section. Near baseline elastic-scattering zeros, it may instead generate a nonzero elastic floor required by unitarity. A companion paper studies the feedback of radiative bound-state formation on elastic scattering, which can generate sizable self-interactions."},{"arxiv":"2605.22245","id":"3158574","title":"Probing freeze-in dark matter using Bose-Einstein condensate in neutron star","authors":"Deep Ghosh, Anirban Das","score":4.8,"section":"replacement","rank":25,"parts":[0.0,0.08,0.14,0.0],"note":"Closest of your papers: [[2859009]] (coupling 0.03, 3 shared references). Closest network paper: [[1844771]] (coupling 0.05, 4 shared references).","abstract":"Neutron star (NS) is one of the most promising astrophysical targets to probe non-gravitational interaction of dark matter (DM) with visible matter. Their compactness makes them an ideal object which can capture particle DM efficiently over its lifetime using the DM-nucleon scattering cross-section. If DM particles are bosonic, then the captured DM population may form a Bose-Einstein condensate at the center of the NS, increasing the DM density significantly. In this work, we study the phenomenology of such scenario with enhanced DM annihilation rate due to the increased density in a condensate. The enhanced DM annihilation makes the NS surface `hotter' than in the standard cooling scenario. We show that the annihilation rate is enhanced by a factor of $\\mathcal{O}(10^{15}-10^{20})$ if DM forms a condensate without large self-interaction, and DM with freeze-in value annihilation cross-section can heat up the NS to higher temperatures, bringing it within the reach of James Webb Space Telescope. It also allows us to probe DM-nucleon scattering cross section within the neutrino fog regime which will complement the terrestrial direct detection searches. Moreover, the enhanced annihilation from the condensate changes the lower limits on s-wave DM annihilation cross-section for capture-annihilation equilibrium and the formation of a black hole inside the NS. Finally, we show an example of a scalar DM model where such small annihilation and DM-nucleon scattering cross sections can generically arise."},{"arxiv":"2606.30222","id":"3174554","title":"Multiparameter Quantum Estimation and Degeneracy Structure in Three-Flavor Neutrino Oscillations","authors":"Bhavna Yadav, Amir Subba, Yu Shi","score":4.8,"section":"replacement","rank":26,"parts":[0.0,0.09,0.1,0.0],"note":"Closest of your papers: [[1220579]] (coupling 0.03, 3 shared references). Closest network paper: [[2062672]] (coupling 0.04, 7 shared references).","abstract":"We investigate three-flavor neutrino oscillations within the framework of quantum estimation theory using the quantum Fisher information matrix (QFIM). We analyze all six independent elements of the QFIM for the parameters $θ_{23}$, $δ_{\\mathrm{CP}}$, and $Δm^2_{31}$, together with the corresponding quantum Cramér--Rao bounds and normalized parameter correlations. To connect the intrinsic quantum sensitivity of the neutrino state with experimentally accessible information, we further compare the QFI with the classical Fisher information (CFI) associated with flavor-probability measurements. We find that the difference between the quantum and classical information bounds is strongly dependent on the oscillation parameter and $L/E$, demonstrating that the efficiency with which the available quantum information is accessed depends on the measurement. We also investigate probability-degenerate solutions in the $(θ_{23},δ_{\\mathrm{CP}})$ parameter space. Although different parameter sets can produce identical $ν_μ\\rightarrowν_e$ appearance probabilities at specific $L/E$ values, their corresponding quantum states can remain distinct, as demonstrated by the quantum fidelity. The QFIM differences further reveal distinct local quantum-information geometries for these probability-degenerate solutions, while the corresponding CFIM differences show a parameter and $L/E$ dependent degree of distinguishability accessible through the flavor-probability measurement. Our results demonstrate that QFI and CFI provide complementary information for neutrino parameter estimation, with the QFIM serving as a measurement-independent quantum benchmark and the CFI characterizing the information accessible through a specified measurement."},{"arxiv":"2610.27182","id":"3216973","title":"Jets as differential probes of hot QCD matter","authors":"João M. Silva","score":4.4,"section":"new","rank":27,"parts":[0.06,0.03,0.08,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1627633]] (coupling 0.01, 2 shared references). Closest network paper: [[2817040]] (coupling 0.03, 75 shared references).","abstract":"Ultra-relativistic heavy-ion collisions create short-lived droplets of deconfined, hot QCD matter whose evolution connects far-from-equilibrium early dynamics to the hydrodynamic quark-gluon plasma. High-energy jets, produced in early hard scatterings and modified by this evolving medium, provide multi-scale probes of its microscopic properties. This thesis develops perturbative QCD tools to extract information about hot QCD matter from its imprint on differential jet substructure observables. Our framework is the BDMPS-Z description of high-energy partons propagating through stochastic colour fields. We first study anisotropic QCD matter by replacing the usual scalar broadening parameter with direction-dependent transverse momentum broadening. This relates anisotropic corrections to medium-induced splittings to spin information and azimuthal patterns in final-state energy flow. Energy correlators are then used as observables sensitive to these effects, including heavy-flavour EECs, azimuthally differential EECs and clover projections designed to isolate leading anisotropy-induced harmonics. We also examine how energy loss affects the interpretation of jet substructure modifications. Quantile matching defines reconstructed energy loss as a population-level shift between vacuum and medium-modified jet spectra. We further develop energy-loss functions, which encode the distribution of energy retained by jet-originated hadrons, and show how their moments enter multi-point projected energy correlators. Finally, we go beyond single $1\\to2$ medium-induced splittings by studying spin-induced correlations between successive emissions and higher-point energy correlators including contributions from medium response. The results show that differential jet substructure can probe directional properties of QCD matter and multi-point dynamics of jets propagating through it."}],"refs":{"1455793":{"first":"von der Pahlen","year":2016,"nauth":4,"title":"Radiative Type III Seesaw Model and its collider phenomenology","role":"seed"},"822544":{"first":"Dolle","year":2009,"   const sim=N.map(n=>({n,x:xf(n)+(RNG()-.5)*4,y:cy+(RNG()-.5)*H*.5}));
  const links=E.map(e=>({source:sim[e.s],target:sim[e.t],s:e.s,t:e.t,k:e.k}));
  d3.forceSimulation(sim).force('x',d3.forceX(s=>xf(s.n)).strength(1)).force('y',d3.forceY(cy).strength(.04))
    .force('link',d3.forceLink(links).strength(.03)).force('charge',d3.forceManyBody().strength(-40))
    .force('col',d3.forceCollide(s=>r(s.n)+2)).stop().tick(320);
  sim.forEach(s=>{s.y=Math.max(m.t+8,Math.min(H-m.b-8,s.y));s.x=Math.max(m.l+4,Math.min(W-m.r-4,s.x))});
  G=svg.append('g');
  G.append('g').selectAll('path').data(links).join('path').attr('class',l=>'edge '+l.k)
    .attr('d',l=>{const a=l.source,b=l.target;return `M${a.x},${a.y}Q${(a.x+b.x)/2},${(a.y+b.y)/2-Math.abs(a.x-b.x)*.12} ${b.x},${b.y}`});
  G.append('g').selectAll('circle').data([...sim].sort((a,b)=>RANK[b.n.role]-RANK[a.n.role])).join('circle')
    .attr('class','node').attr('cx',s=>s.x).attr('cy',s=>s.y).attr('r',s=>r(s.n)).attr('fill',s=>col(s.n))
    .on('pointerenter',(ev,s)=>{hover=s.n;showTip(ev,s.n);paint()}).on('pointermove',(ev,s)=>showTip(ev,s.n))
    .on('pointerleave',()=>{hover=null;tip.hidden=true;paint()}).on('click',(ev,s)=>pick(s.n,false));
  const lab=sim.filter(s=>isNew(s.n)||s.n.role==='seed'||s.n.deg>=3);
  const L=lab.map(s=>{const right=s.x>W*.8,t=isNew(s.n)?`#${s.n.rank} ${s.n.first}`:`${s.n.first} ${s.n.year}`,w=t.length*6.2;return{s,t,right,x0:right?s.x-r(s.n)-4-w:s.x+r(s.n)+4,w,y:s.y+4}}).sort((a,b)=>a.y-b.y);
  const placed=[];L.forEach(l=>{let k=0;while(k<40&&placed.some(p=>l.x0<p.x0+p.w&&p.x0<l.x0+l.w&&Math.abs(l.y-p.y)<13)){l.y+=13*(k%2?-1:1)*(1+Math.floor(k/2));k++;l.y=Math.max(m.t+10,Math.min(H-m.b-4,l.y))}placed.push(l)});
  G.append('g').selectAll('text').data(L).join('text').attr('class','nlabel').attr('x',l=>l.right?l.s.x-r(l.s.n)-4:l.s.x+r(l.s.n)+4).attr('y',l=>l.y)
    .attr('text-anchor',l=>l.right?'end':'start').text(l=>l.t);
  paint();
}
function showTip(ev,n){const b=document.getElementById('chart').getBoundingClientRect();tip.hidden=false;tip.textContent=`${auth(n)} (${n.year}) — ${plain(n.title)}`+(isNew(n)?` · score ${n.score}`:'');
  let L=ev.clientX-b.left+12;if(L>b.width-290)L=ev.clientX-b.left-290;tip.style.left=Math.max(4,L)+'px';tip.style.top=(ev.clientY-b.top+12)+'px'}
function paint(){if(!G)return;const f=hover||sel,on=new Set();if(f){on.add(f.i);f.out.forEach(i=>on.add(i));f.inn.forEach(i=>on.add(i))}
  svg.classed('dim',!!f);
  G.selectAll('path.edge').attr('class',l=>'edge '+l.k+(!f?'':l.s===f.i?' hot out':l.t===f.i?' hot in':''));G.selectAll('path.edge.hot').raise();
  G.selectAll('circle').classed('on',s=>on.has(s.n.i)).classed('sel',s=>sel&&s.n.i===sel.i).classed('match',s=>query&&`${s.n.first} ${s.n.title} ${s.n.arxiv} ${s.n.authors||''}`.toLowerCase().includes(query));
  G.selectAll('text.nlabel').classed('on',l=>on.has(l.s.n.i))}
function panel(){const p=document.getElementById('panel'),n=sel;
  if(!n){p.innerHTML='<p>Select a paper in the network.</p>';return}
  const links=`<div class="links">${n.id?`<a href="https://inspirehep.net/literature/${n.id}" target="_blank" rel="noopener">INSPIRE</a>`:''}${n.arxiv?`<a href="https://arxiv.org/abs/${esc(n.arxiv)}" target="_blank" rel="noopener">arXiv</a>`:''}</div>`;
  if(isNew(n)) p.innerHTML=`<div class="role" style="color:${col(n)}">#${n.rank} · ${esc(SEC[n.section])} · score ${n.score.toFixed(1)}</div><h4>${esc(n.title)}</h4>
   <div class="meta">${esc(auth(n))} · arXiv:${esc(n.arxiv)}</div><p>${why(n.note)}</p><div class="links"><a href="#p${n.i}">Back to abstract</a></div>`;
  else p.innerHTML=`<div class="role" style="color:${col(n)}">${esc(ROLE[n.role])}</div><h4>${esc(n.title)}</h4>
   <div class="meta">${esc(auth(n))} · ${n.year}${n.arxiv?' · arXiv:'+esc(n.arxiv):''}</div>
   <div class="stats"><span>${n.cites.toLocaleString()} citations</span><span>${n.inn.filter(i=>isNew(N[i])).length} of the matches link here</span></div>${links}`;
  tex(p)}
function pick(n,scroll){sel=n;panel();paint();document.querySelectorAll('.paper').forEach(el=>el.classList.toggle('sel',el.id==='p'+n.i));if(scroll)document.getElementById('chart').scrollIntoView({behavior:'smooth',block:'nearest'})}
const present=new Set(N.map(n=>n.role));
document.getElementById('legend').innerHTML=['today','repl','seed','other'].filter(k=>present.has(k)).map(k=>`<span><i class="dot" style="background:var(--${k})"></i>${esc(ROLE[k])}</span>`).join('')+'<span style="color:var(--fg-3)">Listing papers: size ∝ score; others: size ∝ log(citations)</span>';
document.getElementById('q').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();paint()});
svg.on('click',ev=>{if(ev.target.tagName!=='circle'){sel=null;panel();paint()}});
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(draw,200)});
function nextList(){const X=RAW.next||[];if(!X.length)return;const box=document.getElementById('nextlist'),more=document.getElementById('more');
  more.hidden=false;more.querySelector('summary').firstChild.textContent=`The next ${X.length} papers by score `;
  document.getElementById('moresub').textContent=`below the threshold of ${M.threshold}, not drawn in the network`;
  box.innerHTML=X.map(n=>`<li><div class="role" style="color:var(--${n.section==='replacement'?'repl':'today'})">#${n.rank} · ${esc(SEC[n.section])} · score ${n.score.toFixed(1)}</div>
    <div class="t">${esc(n.title)}</div><div class="authors">${esc(n.authors)} · arXiv:${esc(n.arxiv)}</div>
    ${n.note?`<p class="why">${why(n.note)}</p>`:''}
    <details class="abs"><summary>Abstract</summary><p class="abs">${esc(n.abstract)}</p></details>
    <div class="links">${n.id?`<a href="https://inspirehep.net/literature/${n.id}" target="_blank" rel="noopener">INSPIRE</a>`:''}<a href="https://arxiv.org/abs/${esc(n.arxiv)}" target="_blank" rel="noopener">arXiv</a><a href="https://arxiv.org/pdf/${esc(n.arxiv)}" target="_blank" rel="noopener">PDF</a></div></li>`).join('');
  more.addEventListener('toggle',()=>{if(more.open)tex(box)})}
const rtip=document.getElementById('reftip');let rcur=null;
function refShow(el){const r=REFS[el.dataset.ref];if(!r)return;rcur=el;rtip.textContent=`${auth(r)} (${r.year}) — ${plain(r.title)}`;rtip.hidden=false;
  const b=el.getBoundingClientRect(),t=rtip.getBoundingClientRect();let L=Math.min(Math.max(8,b.left),innerWidth-t.width-8),T=b.bottom+6;
  if(T+t.height>innerHeight-8)T=b.top-t.height-6;rtip.style.left=L+'px';rtip.style.top=T+'px'}
function refHide(){rtip.hidden=true;rcur=null}
document.addEventListener('pointerover',e=>{const el=e.target.closest('.ref');if(el&&e.pointerType==='mouse')refShow(el)});
document.addEventListener('pointerout',e=>{if(e.target.closest('.ref')&&e.pointerType==='mouse')refHide()});
document.addEventListener('click',e=>{const el=e.target.closest('.ref');if(el)refShow(el);else if(rcur)refHide()});
document.addEventListener('focusin',e=>{const el=e.target.closest('.ref');if(el)refShow(el)});
document.addEventListener('focusout',e=>{if(e.target.closest('.ref'))refHide()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')refHide()});
addEventListener('scroll',()=>{if(rcur)refHide()},{passive:true});
list();nextList();draw();panel();
window.addEventListener('load',()=>{tex(document.getElementById('list'));tex(document.getElementById('panel'))});
</script>
