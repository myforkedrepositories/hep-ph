<script>
const RAW = {"n":[{"id":"3216233","arxiv":"2610.24547","title":"Ultra-relativistic freeze-out of fermion dark matter through a heavy scalar mediator","first":"Yang","nauth":5,"year":2026,"cites":0,"role":"today","note":"Cites 2 network papers: Ávila 2025, Molinaro 2014. Also cites widely used network papers: Arcadi 2017. Closest of your papers: Arbelaez 2015 (coupling 0.05, 5 shared references). Closest network paper: Betancur 2017 (coupling 0.08, 9 shared references).","score":37.1,"rank":1,"section":"new","parts":[0.72,0.15,0.22,0.0],"abstract":"We investigate the production of Majorana fermion dark matter (DM) via a heavy scalar mediator during reheating, with particular emphasis on ultra-relativistic freeze-out (UFO). Depending on the mediator mass, interaction strengths, and reheating temperature, we identify three distinct production regimes: freeze-in, WIMP-like freeze-out, and UFO, all of which can account for the observed DM relic abundance. In the UFO regime, significant DM production can persist after chemical decoupling, while entropy injection during reheating simultaneously dilutes the DM yield. An accurate determination of the final relic abundance therefore requires a consistent treatment of both continued production and entropy dilution. We further examine the impact of scalar cubic interactions and find that they modify the boundaries between the different production regimes and reshape the relic-density contours. In particular, the results are more sensitive to the cubic coupling involving the mediator and the light scalar than to the heavy-scalar self-coupling.","authors":"Jin-Lei Yang, Ke-Shuo Cai, Yin-Jie Zhang, Hai-Bin Zhang, Tai-Fu Feng","nlinked":113,"nref":116,"src":"INSPIRE","html":true},{"id":"3216393","arxiv":"2610.26648","title":"Dark Matter Interpretations of the Galactic Center Gamma-Ray Excess with 18 Years of Fermi-LAT Data and the FL16Y Source Catalog","first":"Kim","nauth":3,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: Agrawal 2014. Closest of your papers: Horiuchi 2016 (coupling 0.12, 14 shared references). Closest network paper: Dutta Banik 2015 (coupling 0.08, 10 shared references).","score":32.5,"rank":2,"section":"new","parts":[0.45,0.31,0.23,0.0],"abstract":"We investigate dark matter (DM) interpretations of the Galactic Center Excess (GCE) using 17.7 years of Fermi-LAT data and the FL16Y source catalog. We test 80 Galactic diffuse-emission models and include correlated systematic uncertainties from Galactic-plane control regions. We derive combined 95% CL annihilation limits from 30 dwarf spheroidal galaxies (dSphs), including $J$-factor uncertainties, and compare the GCE-preferred regions with these limits and AMS-02 antiproton bounds. For self-conjugate DM, we study two-body annihilation, effective $4b$, $4τ$, and $2b2τ$ channels, and cascades through on-shell scalar mediators. For Model X, the best-fitting diffuse-emission model in our template analysis including a DM component, the dSph limits exclude the 68% CL GCE regions for $b\\bar b$, $c\\bar c$, light quarks, gluons, and effective $4b$ and $2b2τ$. Parts of the $τ^+τ^-$ and effective $4τ$ regions remain compatible, although their best-fit points exceed these limits. Heavy two-body final states are less constrained but fit the GCE less well. Mediator masses affect both the preferred regions and the constraints. Part of the 68% CL $4b$ cascade region remains below the dSph limits for $r=m_{\\rm mediator}/m_{\\rm DM}\\lesssim0.4$. Among the four-body benchmarks, $4τ$ retains a comparatively large preferred region compatible with dSph and antiproton bounds. With the adopted BIG propagation model, antiproton bounds are generally weaker but constrain part of the $4b$ cascade region. Finally, we examine a secluded singlet fermionic DM benchmark with a predominantly four-bottom cascade.","authors":"Sang Hwan Kim, Hae Barg Kang, Seodong Shin","nlinked":74,"nref":79,"src":"INSPIRE","html":true},{"id":"3216186","arxiv":"2610.24063","title":"Testing Leptogenesis via CP asymmetries in Lepton-Number-Violating $W$ Decays at Colliders","first":"Fortin","nauth":5,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: Cai 2017. Also cites widely used network papers: Navas 2024. Closest of your papers: Bernal 2018 (coupling 0.06, 8 shared references). Closest network paper: Cai 2017 (coupling 0.12, 40 shared references).","score":30.5,"rank":3,"section":"new","parts":[0.48,0.17,0.35,0.0],"abstract":"In principle, searches for CP asymmetries in rare $W$-boson decays can test low-scale leptogenesis in the GeV-scale type-I seesaw with three quasi-degenerate-in-mass heavy right-handed neutrinos. To investigate this, we focus on the lepton-number-violating heavy-neutrino-mediated decay $W^{\\pm}\\to e^{\\pm} e^{\\pm} (\\bar{q} q')^{\\mp}$, with $(\\bar{q} q')^+ = (\\bar{d}u)^+$ and $(\\bar{q} q')^- = (\\bar{u}d)^-$. We determine the minimum branching ratio required for a CP asymmetry to be observable at colliders with a given statistical significance. We then perform a numerical scan of the presently-allowed parameter space, also solving the density matrix equations for low-scale leptogenesis, and identify regions where, simultaneously, the present baryon asymmetry of the Universe can be achieved and the collider CP asymmetry for the considered decay is observable at HL-LHC and FCC-hh. We find that these regions are sizeable. A future observation of a CP asymmetry in $W^{\\pm}\\to e^{\\pm} e^{\\pm} (\\bar{q} q')^{\\mp}$ within the regions identified here would provide evidence in favour of low-scale leptogenesis as the origin of the matter-antimatter asymmetry of the Universe.","authors":"Jean-François Fortin, Alessandro Granelli, David London, Serguey T. Petcov, Nicolas Sanfaçon","nlinked":127,"nref":128,"src":"INSPIRE","html":true},{"id":"3216300","arxiv":"2610.25423","title":"Exothermic Dark Matter with a Dark Higgs: The LZ 248 keV Event and the Galactic Center Excess","first":"Kim","nauth":3,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: Borah 2026. Closest of your papers: Horiuchi 2016 (coupling 0.02, 3 shared references). Closest network paper: Borah 2026 (coupling 0.20, 18 shared references).","score":28.3,"rank":4,"section":"new","parts":[0.45,0.05,0.56,0.0],"abstract":"LUX-ZEPLIN (LZ) reported a $248~\\mathrm{keV}$ nuclear-recoil event. Exothermic dark matter can explain it in a dark $U(1)$ model whose dark Higgs generates the dark photon mass and the mass splitting. A computed excited-state fraction gives two branches with dark photon masses near $1$ and $26~\\mathrm{GeV}$ for kinetic mixing $ε=10^{-4}$. INTEGRAL/SPI limits on excited-state decays bound the LZ rate, and cosmic microwave background limits exclude the lighter branch at its likelihood minimum. For a dark Higgs boson near the dark photon mass, the heavier branch agrees with the southern-sky Galactic Center $γ$-ray excess.","authors":"Jinheung Kim, Jongkuk Kim, Pyungwon Ko","nlinked":119,"nref":121,"src":"INSPIRE","html":true},{"id":"3199052","arxiv":"2609.02483","title":"Lepton-flavor violation and muon $(g-2)$ in the flavor-dependent $U(1)_F$ model","first":"Peng","nauth":5,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: Toma 2013. Closest of your papers: Calle 2021 (coupling 0.03, 6 shared references). Closest network paper: Hernández 2021 (coupling 0.10, 14 shared references).","score":25.6,"rank":5,"section":"replacement","parts":[0.45,0.1,0.27,0.0],"abstract":"Lepton flavor violation (LFV) processes are forbidden in the standard model (SM), hence the observation of LFV transitions would represent a clear signal of new physics beyond the SM. In this work, we investigate the muon anomalous magnetic dipole moments (MDM) and LFV processes $l_{j}^{-}\\to l_{i}^{-}γ$ and $l_{j}^{-}\\to l_{i}^{-}l_{i}^{-}l_{i}^{+}$ in the extension of the SM with $U(1)_F$ local gauge symmetry (FDM). The muon anomalous MDM is one of the most precisely measured quantities in particle physics, which can be used to constrain the contributions from new couplings in the FDM. The newly incorporated $U(1)_F$ charges are correlated with the flavor properties of fermions, hence the newly added Yukawa couplings make contributions to these LFV processes. Considering the latest experimental constraints on the muon anomalous MDM, the new interactions in the FDM can make significant contributions to the LFV processes $l_{j}^{-}\\to l_{i}^{-}γ$ and $l_{j}^{-}\\to l_{i}^{-}l_{i}^{-}l_{i}^{+}$, the predicted branching ratios can well reach the future experimental sensitivity.","authors":"Yu-Ju Peng, Feng-Yan Niu, Qi-Zhen Qin, Zhan Cao, Jin-Lei Yang","nlinked":98,"nref":102,"src":"INSPIRE","html":true},{"id":"3209897","arxiv":"2609.39381","title":"New Observables for Resonant and Non-Resonant New Physics Searches at Colliders","first":"Touchèque","nauth":1,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: Arcadi 2019. Also cites widely used network papers: Navas 2024, Branco 2011. Closest of your papers: Restrepo 2019 (coupling 0.03, 6 shared references). Closest network paper: Jueid 2023 (coupling 0.05, 12 shared references).","score":25.6,"rank":6,"section":"replacement","parts":[0.51,0.08,0.15,0.0],"abstract":"The discovery of the Higgs boson cemented the Standard Model of particle physics (SM) as we know it and observations have so far confirmed SM predictions. Now, too many beyond-the-Standard-Model (BSM) models can be explored to overcome the remaining shortcomings of the SM. As a result, generic models present a useful intermediary step to point towards the next extension of the SM probing multiple Ultraviolet models simultaneously. In this work, two examples are investigated. First, off-shell effects of potential heavy new particles are provided in the Standard Model Effective Field Theory (SMEFT) through higher dimensional operators. In particular, Charge-parity (CP) symmetry violating contributions from Wilson coefficients are ranked by using U(1) global flavour symmetries on CP-odd operators of the Warsaw basis. Asymmetries of simple triple products are proven to be more sensitive than the cross-section to these SMEFT operators and more efficient than most of the usual observables used in experiments. Then, on-shell effects of singlet and octet scalars of SUC(3) are independently searched for in four-top production. The signal consists of the associated production of a scalar with a top quark pair and of pair production in the case of the octet producing boosted top-quark pairs. The processes are generated at next-to-leading order in quantum chromodynamics with a careful renormalisation procedure and the correct selection of loop diagrams. Using improvements in top-jet tagging techniques and in the main background simulation as well as a new technique to select the events, a new particle search is performed to constrain the respective mass and coupling to top quarks of new resonances.","authors":"Julien Touchèque","nlinked":310,"nref":350,"src":"INSPIRE","html":true},{"id":"1734036","arxiv":"1905.03663","title":"Axion RG flows and the holographic dynamics of instanton densities","first":"Hamada","nauth":4,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: Baer 2014. Closest of your papers: Ma 2017 (coupling 0.03, 2 shared references). Closest network paper: Carvajal 2018 (coupling 0.04, 4 shared references).","score":22.0,"rank":7,"section":"replacement","parts":[0.45,0.07,0.11,0.0],"abstract":"Axionic holographic RG flow solutions are studied in the context of general Einstein-axion-dilaton theories. A non-trivial axion profile is dual to the (non-perturbative) running of the -term for the corresponding instanton density operator. It is shown that a non-trivial axion solution is incompatible with a non-trivial (holographic) IR conformal fixed point. Imposing a suitable axion regularity condition allows to select the IR geometry in a unique way. The solutions are found analytically in the asymptotic UV and IR regimes, and it is shown that in those regimes the axion backreaction is always negligible. The axion backreaction may become important in the intermediate region of the bulk. To make contact with the axion probe limit solutions, a systematic expansion of the solution is developed. Several concrete examples are worked out numerically. It is shown that the regularity condition always implies a finite allowed range for the axion source parameter in the UV. This translates into the existence of a finite (but large) number of saddle-points in the large N c limit. This ties in well with axion-swampland conjectures.","authors":"Yuta Hamada, Elias Kiritsis, Francesco Nitti, Lukas T. Witkowski","nlinked":70,"nref":72,"src":"INSPIRE","html":true},{"id":"3216397","arxiv":"2610.26512","title":"Probing Leptophilic Scalar Dark Matter with SMEFT and Direct Detection","first":"Biondini","nauth":4,"year":2026,"cites":0,"role":"today","note":"Also cites widely used network papers: Arcadi 2017. Closest of your papers: Restrepo 2019 (coupling 0.08, 7 shared references). Closest network paper: Griffith 2026 (coupling 0.10, 10 shared references).","score":15.0,"rank":8,"section":"new","parts":[0.06,0.24,0.29,0.0],"abstract":"Heavy dark sectors may evade direct production at current colliders while leaving measurable imprints in precision observables and dark matter searches. We study leptophilic scalar dark matter within the Standard Model Effective Field Theory (SMEFT), considering both real and complex scalar dark matter coupled to vector-like leptonic mediators. We perform the complete one-loop matching of the model onto the dimension-six Warsaw basis and combine the resulting precision constraints with predictions for direct and indirect detection. We compute the relic abundance including coannihilations with the mediator, Sommerfeld enhancement, bound-state formation, and one-loop corrections to scalar dark matter annihilation. We also derive the effective dark matter-photon interactions relevant for nuclear recoils, retaining the full dependence on the dark matter and mediator masses and extending previous results beyond the heavy-mediator limit. We find that global SMEFT fits provide competitive constraints for dark matter masses up to approximately $850$ GeV, while direct detection becomes particularly powerful for compressed spectra. The complex scalar scenario is strongly constrained by the charge-radius interaction, whereas real scalar dark matter remains viable across a substantial region of parameter space. Finally, we show that a modified cosmological expansion history can significantly shift the relic-density-compatible parameter space, thereby changing the complementarity among the different probes.","authors":"Simone Biondini, Chiara Megan Bolloni, Orlando Panella, Lorenzo Tiberi","nlinked":81,"nref":87,"src":"INSPIRE","html":true},{"id":"3157191","arxiv":"2605.16540","title":"ULYSSES the Third: An Odyssey Towards a Unified Python Toolkit for Leptogenesis","first":"Granelli","nauth":5,"year":2026,"cites":0,"role":"repl","note":"Also cites widely used network papers: Alekhin 2015, Navas 2024, Tanabashi 2018. Closest of your papers: Restrepo 2013 (coupling 0.03, 6 shared references). Closest network paper: Fong 2012 (coupling 0.08, 15 shared references).","score":13.1,"rank":9,"section":"replacement","parts":[0.16,0.09,0.22,0.0],"abstract":"We present the third release of $\\texttt{ULYSSES}$, a Python package for the numerical evaluation of the baryon asymmetry generated through leptogenesis. This version includes code implementing state-of-the-art density matrix equations for low-scale leptogenesis with three quasi-degenerate right-handed neutrinos. We extend the validity of the code in this scenario beyond the 100 GeV right-handed neutrino mass scale, into the regime of resonant leptogenesis, by including neutrino production rates valid in both the relativistic and non-relativistic regimes. In addition, in the high-scale vanilla scenario, we provide routines for computing $ΔL = 1$ scattering processes, enabling full phase-space evolution of the right-handed neutrino and lepton asymmetry. A new $\\texttt{--extended}$ parameter interface allows users to pass model-specific inputs beyond the standard leptogenesis runcard without modifying the core infrastructure and demonstrate its use with a toy module that simultaneously solves the vanilla leptogenesis equations and the freeze-in production of dark matter. On top of these improvements, we introduce an alternative parametrisation of the Casas-Ibarra matrix, update the default neutrino oscillation parameters and report cross-checks of the new low-scale leptogenesis module against published benchmarks and independent codes. $\\texttt{ULYSSES}$ is publicly available on $\\href{https://github.com/earlyuniverse/ulysses}{\\texttt{GitHub}}$ and pip-installable from PyPI.","authors":"Alessandro Granelli, Juraj Klarić, Dhruv Pasari, Yuber F. Perez-Gonzalez, Jessica Turner","nlinked":73,"nref":73,"src":"INSPIRE","html":true},{"id":"3216235","arxiv":"2610.24404","title":"Phenomenology of Spontaneous CP-violation in 2HDMs","first":"Mondal","nauth":2,"year":2026,"cites":0,"role":"today","note":"Also cites widely used network papers: Branco 2011. Closest of your papers: Cardenas 2012 (coupling 0.06, 3 shared references). Closest network paper: Akeroyd 2016 (coupling 0.10, 20 shared references).","score":12.8,"rank":10,"section":"new","parts":[0.06,0.18,0.28,0.0],"abstract":"Spontaneous CP violation (SCPV) provides an attractive possibility for explaining the origin of CP violation and the observed CP-violating phenomena in the quark sector. We investigate SCPV in the two-Higgs-doublet model as one of its simplest realizations, in which the additional Higgs bosons are necessarily non-decoupling and flavor misalignment in the Yukawa sector is required. The non-decoupling Higgs sector predicts sizable deviations from the Standard Model predictions even in the Higgs alignment limit: the decay rates of the discovered Higgs boson into $γγ$ and $Zγ$ can deviate by at least about $-10\\%$ and $-4\\%$, respectively, while the trilinear Higgs self-coupling can receive $\\mathcal{O}(100)\\%$ corrections. We consider a scenario in which the down-type quark and charged-lepton Yukawa matrices are flavor aligned, while flavor-violating interactions are allowed in the up-type quark sector to reproduce the Kobayashi-Maskawa phase. We explore the viable parameter space by imposing theoretical constraints together with experimental constraints from electroweak precision observables, flavor measurements, electric dipole moments, and LHC data. We find that a sizable flavor-violating top-charm Yukawa coupling remains allowed, giving rise to distinctive LHC signatures, including same-sign top-quark and three-top production as well as scalar cascade decays. We also find that the deviation in the trilinear Higgs self-coupling is correlated with the decay patterns of the additional neutral Higgs bosons, providing a connection between precision Higgs measurements and direct searches for the additional Higgs bosons. Our results demonstrate the importance of combining searches for additional Higgs bosons with precision Higgs measurements, complemented by flavor and electric-dipole-moment experiments, to probe SCPV.","authors":"Tanmoy Mondal, Kei Yagyu","nlinked":82,"nref":91,"src":"INSPIRE","html":true},{"id":"3216188","arxiv":"2610.24028","title":"Axion identification in multi-phase models","first":"Lei","nauth":2,"year":2026,"cites":0,"role":"today","note":"Closest of your papers: Ma 2017 (coupling 0.08, 6 shared references). Closest network paper: Ohata 2021 (coupling 0.09, 9 shared references).","score":11.8,"rank":11,"section":"new","parts":[0.0,0.23,0.25,0.0],"abstract":"Axion identification in multi-phase models is subtle because local mass eigenstates do not by themselves determine global properties such as the fundamental period and domain-wall number. In this paper, we develop a route to identify the axion in a broad class of multi-phase models, including DFSZ-like theories. The construction involves two reductions: gauge identification and integrating out heavy phase fields. We study these reductions explicitly in two representative two-phase models. Gauge identification reduces the compact field space of the phase fields to a quotient space by identifying points connected by gauge transformations, while integrating out heavy phase fields restricts the low-energy dynamics to nonlinear orbits. Under the stated assumptions and within the validity of the derivative expansion, the physical low-energy field space forms a finite union of $S^1$. The axion is identified as the effective field on an $S^1$ orbit and coincides locally with the lightest mass eigenstate near the vacuum. Its fundamental period and domain-wall number are well-defined and can be determined from the original Lagrangian. Nevertheless, the reduction to a single axion does not capture all properties of topological defects in the original multi-phase theory. In particular, axion strings can retain nontrivial gauge flux, while special defect configurations can involve non-negligible spacetime derivatives of the heavy phase fields and invalidate the single-field reduction. These effects represent fundamental differences between multi-phase and single-phase theories at the level of topological defects.","authors":"Zhen-Yu Lei, Jian-Wei Cui","nlinked":58,"nref":62,"src":"INSPIRE","html":true},{"id":"1589847","arxiv":"1704.01162","title":"Doublet-triplet dark matter with neutrino masses","first":"Betancur","nauth":3,"year":2017,"cites":12,"role":"other","note":"","score":null},{"id":"1506434","arxiv":"1612.08621","title":"Two component WIMP–FImP dark matter model with singlet fermion, scalar and pseudo scalar","first":"Dutta Banik","nauth":4,"year":2016,"cites":66,"ro   d3.forceSimulation(sim).force('x',d3.forceX(s=>xf(s.n)).strength(1)).force('y',d3.forceY(cy).strength(.04))
    .force('link',d3.forceLink(links).strength(.03)).force('charge',d3.forceManyBody().strength(-40))
    .force('col',d3.forceCollide(s=>r(s.n)+2)).stop().tick(320);
  sim.forEach(s=>{s.y=Math.max(m.t+8,Math.min(H-m.b-8,s.y));s.x=Math.max(m.l+4,Math.min(W-m.r-4,s.x))});
  G=svg.append('g');
  G.append('g').selectAll('path').data(links).join('path').attr('class',l=>'edge '+l.k)
    .attr('d',l=>{const a=l.source,b=l.target;return `M${a.x},${a.y}Q${(a.x+b.x)/2},${(a.y+b.y)/2-Math.abs(a.x-b.x)*.12} ${b.x},${b.y}`});
  G.append('g').selectAll('circle').data([...sim].sort((a,b)=>RANK[b.n.role]-RANK[a.n.role])).join('circle')
    .attr('class','node').attr('cx',s=>s.x).attr('cy',s=>s.y).attr('r',s=>r(s.n)).attr('fill',s=>col(s.n))
    .on('pointerenter',(ev,s)=>{hover=s.n;showTip(ev,s.n);paint()}).on('pointermove',(ev,s)=>showTip(ev,s.n))
    .on('pointerleave',()=>{hover=null;tip.hidden=true;paint()}).on('click',(ev,s)=>pick(s.n,false));
  const lab=sim.filter(s=>isNew(s.n)||s.n.role==='seed'||s.n.deg>=3);
  const L=lab.map(s=>{const right=s.x>W*.8,t=isNew(s.n)?`#${s.n.rank} ${s.n.first}`:`${s.n.first} ${s.n.year}`,w=t.length*6.2;return{s,t,right,x0:right?s.x-r(s.n)-4-w:s.x+r(s.n)+4,w,y:s.y+4}}).sort((a,b)=>a.y-b.y);
  const placed=[];L.forEach(l=>{let k=0;while(k<40&&placed.some(p=>l.x0<p.x0+p.w&&p.x0<l.x0+l.w&&Math.abs(l.y-p.y)<13)){l.y+=13*(k%2?-1:1)*(1+Math.floor(k/2));k++;l.y=Math.max(m.t+10,Math.min(H-m.b-4,l.y))}placed.push(l)});
  G.append('g').selectAll('text').data(L).join('text').attr('class','nlabel').attr('x',l=>l.right?l.s.x-r(l.s.n)-4:l.s.x+r(l.s.n)+4).attr('y',l=>l.y)
    .attr('text-anchor',l=>l.right?'end':'start').text(l=>l.t);
  paint();
}
function showTip(ev,n){const b=document.getElementById('chart').getBoundingClientRect();tip.hidden=false;tip.textContent=`${auth(n)} (${n.year}) — ${plain(n.title)}`+(isNew(n)?` · score ${n.score}`:'');
  let L=ev.clientX-b.left+12;if(L>b.width-290)L=ev.clientX-b.left-290;tip.style.left=Math.max(4,L)+'px';tip.style.top=(ev.clientY-b.top+12)+'px'}
function paint(){if(!G)return;const f=hover||sel,on=new Set();if(f){on.add(f.i);f.out.forEach(i=>on.add(i));f.inn.forEach(i=>on.add(i))}
  svg.classed('dim',!!f);
  G.selectAll('path.edge').attr('class',l=>'edge '+l.k+(!f?'':l.s===f.i?' hot out':l.t===f.i?' hot in':''));G.selectAll('path.edge.hot').raise();
  G.selectAll('circle').classed('on',s=>on.has(s.n.i)).classed('sel',s=>sel&&s.n.i===sel.i).classed('match',s=>query&&`${s.n.first} ${s.n.title} ${s.n.arxiv} ${s.n.authors||''}`.toLowerCase().includes(query));
  G.selectAll('text.nlabel').classed('on',l=>on.has(l.s.n.i))}
function panel(){const p=document.getElementById('panel'),n=sel;
  if(!n){p.innerHTML='<p>Select a paper in the network.</p>';return}
  const links=`<div class="links">${n.id?`<a href="https://inspirehep.net/literature/${n.id}" target="_blank" rel="noopener">INSPIRE</a>`:''}${n.arxiv?`<a href="https://arxiv.org/abs/${esc(n.arxiv)}" target="_blank" rel="noopener">arXiv</a>`:''}</div>`;
  if(isNew(n)) p.innerHTML=`<div class="role" style="color:${col(n)}">#${n.rank} · ${esc(SEC[n.section])} · score ${n.score.toFixed(1)}</div><h4>${esc(n.title)}</h4>
   <div class="meta">${esc(auth(n))} · arXiv:${esc(n.arxiv)}</div><p>${esc(n.note)}</p><div class="links"><a href="#p${n.i}">Back to abstract</a></div>`;
  else p.innerHTML=`<div class="role" style="color:${col(n)}">${esc(ROLE[n.role])}</div><h4>${esc(n.title)}</h4>
   <div class="meta">${esc(auth(n))} · ${n.year}${n.arxiv?' · arXiv:'+esc(n.arxiv):''}</div>
   <div class="stats"><span>${n.cites.toLocaleString()} citations</span><span>${n.inn.filter(i=>isNew(N[i])).length} of the matches link here</span></div>${links}`;
  tex(p)}
function pick(n,scroll){sel=n;panel();paint();document.querySelectorAll('.paper').forEach(el=>el.classList.toggle('sel',el.id==='p'+n.i));if(scroll)document.getElementById('chart').scrollIntoView({behavior:'smooth',block:'nearest'})}
const present=new Set(N.map(n=>n.role));
document.getElementById('legend').innerHTML=['today','repl','seed','other'].filter(k=>present.has(k)).map(k=>`<span><i class="dot" style="background:var(--${k})"></i>${esc(ROLE[k])}</span>`).join('')+'<span style="color:var(--fg-3)">Listing papers: size ∝ score; others: size ∝ log(citations)</span>';
document.getElementById('q').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();paint()});
svg.on('click',ev=>{if(ev.target.tagName!=='circle'){sel=null;panel();paint()}});
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(draw,200)});
list();draw();panel();
window.addEventListener('load',()=>{tex(document.getElementById('list'));tex(document.getElementById('panel'))});
</script>
