<script>
const RAW = {"n":[{"id":"3216233","arxiv":"2610.24547","title":"Ultra-relativistic freeze-out of fermion dark matter through a heavy scalar mediator","first":"Yang","nauth":5,"year":2026,"cites":0,"role":"today","note":"Cites 2 network papers: [[2940359]], [[1294681]]. Also cites widely used network papers: [[1518747]]. Closest of your papers: [[1394206]] (coupling 0.05, 5 shared references). Closest network paper: [[1589847]] (coupling 0.08, 9 shared references).","score":37.1,"rank":1,"section":"new","parts":[0.72,0.15,0.22,0.0],"abstract":"We investigate the production of Majorana fermion dark matter (DM) via a heavy scalar mediator during reheating, with particular emphasis on ultra-relativistic freeze-out (UFO). Depending on the mediator mass, interaction strengths, and reheating temperature, we identify three distinct production regimes: freeze-in, WIMP-like freeze-out, and UFO, all of which can account for the observed DM relic abundance. In the UFO regime, significant DM production can persist after chemical decoupling, while entropy injection during reheating simultaneously dilutes the DM yield. An accurate determination of the final relic abundance therefore requires a consistent treatment of both continued production and entropy dilution. We further examine the impact of scalar cubic interactions and find that they modify the boundaries between the different production regimes and reshape the relic-density contours. In particular, the results are more sensitive to the cubic coupling involving the mediator and the light scalar than to the heavy-scalar self-coupling.","authors":"Jin-Lei Yang, Ke-Shuo Cai, Yin-Jie Zhang, Hai-Bin Zhang, Tai-Fu Feng","nlinked":113,"nref":116,"src":"INSPIRE","html":true},{"id":"3216393","arxiv":"2610.26648","title":"Dark Matter Interpretations of the Galactic Center Gamma-Ray Excess with 18 Years of Fermi-LAT Data and the FL16Y Source Catalog","first":"Kim","nauth":3,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[1327184]]. Closest of your papers: [[1421624]] (coupling 0.12, 14 shared references). Closest network paper: [[1376960]] (coupling 0.08, 10 shared references).","score":32.5,"rank":2,"section":"new","parts":[0.45,0.31,0.23,0.0],"abstract":"We investigate dark matter (DM) interpretations of the Galactic Center Excess (GCE) using 17.7 years of Fermi-LAT data and the FL16Y source catalog. We test 80 Galactic diffuse-emission models and include correlated systematic uncertainties from Galactic-plane control regions. We derive combined 95\\% CL annihilation limits from 30 dwarf spheroidal galaxies (dSphs), including $J$-factor uncertainties, and compare the GCE-preferred regions with these limits and AMS-02 antiproton bounds. For self-conjugate DM, we study two-body annihilation, effective $4b$, $4τ$, and $2b2τ$ channels, and cascades through on-shell scalar mediators. For Model X, the best-fitting diffuse-emission model in our template analysis including a DM component, the dSph limits exclude the 68\\% CL GCE regions for $b\\bar b$, $c\\bar c$, light quarks, gluons, and effective $4b$ and $2b2τ$. Parts of the $τ^+τ^-$ and effective $4τ$ regions remain compatible, although their best-fit points exceed these limits. Heavy two-body final states are less constrained but fit the GCE less well. Mediator masses affect both the preferred regions and the constraints. Part of the 68\\% CL $4b$ cascade region remains below the dSph limits for $r=m_{\\rm mediator}/m_{\\rm DM}\\lesssim0.4$. Among the four-body benchmarks, $4τ$ retains a comparatively large preferred region compatible with dSph and antiproton bounds. With the adopted BIG propagation model, antiproton bounds are generally weaker but constrain part of the $4b$ cascade region. Finally, we examine a secluded singlet fermionic DM benchmark with a predominantly four-bottom cascade.","authors":"Sang Hwan Kim, Hae Barg Kang, Seodong Shin","nlinked":74,"nref":79,"src":"INSPIRE","html":true},{"id":"3216186","arxiv":"2610.24063","title":"Testing Leptogenesis via CP asymmetries in Lepton-Number-Violating $W$ Decays at Colliders","first":"Fortin","nauth":5,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[1634858]]. Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1686334]] (coupling 0.06, 8 shared references). Closest network paper: [[1634858]] (coupling 0.12, 40 shared references).","score":30.5,"rank":3,"section":"new","parts":[0.48,0.17,0.35,0.0],"abstract":"In principle, searches for CP asymmetries in rare $W$-boson decays can test low-scale leptogenesis in the GeV-scale type-I seesaw with three quasi-degenerate-in-mass heavy right-handed neutrinos. To investigate this, we focus on the lepton-number-violating heavy-neutrino-mediated decay $W^{\\pm}\\to e^{\\pm} e^{\\pm} (\\bar{q} q')^{\\mp}$, with $(\\bar{q} q')^+ = (\\bar{d}u)^+$ and $(\\bar{q} q')^- = (\\bar{u}d)^-$. We determine the minimum branching ratio required for a CP asymmetry to be observable at colliders with a given statistical significance. We then perform a numerical scan of the presently-allowed parameter space, also solving the density matrix equations for low-scale leptogenesis, and identify regions where, simultaneously, the present baryon asymmetry of the Universe can be achieved and the collider CP asymmetry for the considered decay is observable at HL-LHC and FCC-hh. We find that these regions are sizeable. A future observation of a CP asymmetry in $W^{\\pm}\\to e^{\\pm} e^{\\pm} (\\bar{q} q')^{\\mp}$ within the regions identified here would provide evidence in favour of low-scale leptogenesis as the origin of the matter-antimatter asymmetry of the Universe.","authors":"Jean-François Fortin, Alessandro Granelli, David London, Serguey T. Petcov, Nicolas Sanfaçon","nlinked":127,"nref":128,"src":"INSPIRE","html":true},{"id":"3216300","arxiv":"2610.25423","title":"Exothermic Dark Matter with a Dark Higgs: The LZ 248 keV Event and the Galactic Center Excess","first":"Kim","nauth":3,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3201080]]. Closest of your papers: [[1421624]] (coupling 0.02, 3 shared references). Closest network paper: [[3201080]] (coupling 0.20, 18 shared references).","score":28.3,"rank":4,"section":"new","parts":[0.45,0.05,0.56,0.0],"abstract":"LUX-ZEPLIN (LZ) reported a $248~\\mathrm{keV}$ nuclear-recoil event. Exothermic dark matter can explain it in a dark $U(1)$ model whose dark Higgs generates the dark photon mass and the mass splitting. A computed excited-state fraction gives two branches with dark photon masses near $1$ and $26~\\mathrm{GeV}$ for kinetic mixing $ε=10^{-4}$. INTEGRAL/SPI limits on excited-state decays bound the LZ rate, and cosmic microwave background limits exclude the lighter branch at its likelihood minimum. For a dark Higgs boson near the dark photon mass, the heavier branch agrees with the southern-sky Galactic Center $γ$-ray excess.","authors":"Jinheung Kim, Jongkuk Kim, Pyungwon Ko","nlinked":119,"nref":121,"src":"INSPIRE","html":true},{"id":"3199052","arxiv":"2609.02483","title":"Lepton-flavor violation and muon $(g-2)$ in the flavor-dependent $U(1)_F$ model","first":"Peng","nauth":5,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[1268669]]. Closest of your papers: [[1854224]] (coupling 0.03, 6 shared references). Closest network paper: [[1858425]] (coupling 0.10, 14 shared references).","score":25.6,"rank":5,"section":"replacement","parts":[0.45,0.1,0.27,0.0],"abstract":"Lepton flavor violation (LFV) processes are forbidden in the standard model (SM), hence the observation of LFV transitions would represent a clear signal of new physics beyond the SM. In this work, we investigate the muon anomalous magnetic dipole moments (MDM) and LFV processes $l_{j}^{-}\\to l_{i}^{-}γ$ and $l_{j}^{-}\\to l_{i}^{-}l_{i}^{-}l_{i}^{+}$ in the extension of the SM with $U(1)_F$ local gauge symmetry (FDM). The muon anomalous MDM is one of the most precisely measured quantities in particle physics, which can be used to constrain the contributions from new couplings in the FDM. The newly incorporated $U(1)_F$ charges are correlated with the flavor properties of fermions, hence the newly added Yukawa couplings make contributions to these LFV processes. Considering the latest experimental constraints on the muon anomalous MDM, the new interactions in the FDM can make significant contributions to the LFV processes $l_{j}^{-}\\to l_{i}^{-}γ$ and $l_{j}^{-}\\to l_{i}^{-}l_{i}^{-}l_{i}^{+}$, the predicted branching ratios can well reach the future experimental sensitivity.","authors":"Yu-Ju Peng, Feng-Yan Niu, Qi-Zhen Qin, Zhan Cao, Jin-Lei Yang","nlinked":98,"nref":102,"src":"INSPIRE","html":true},{"id":"3209897","arxiv":"2609.39381","title":"New Observables for Resonant and Non-Resonant New Physics Searches at Colliders","first":"Touchèque","nauth":1,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[1724453]]. Also cites widely used network papers: [[2817040]], [[902365]]. Closest of your papers: [[1746620]] (coupling 0.03, 6 shared references). Closest network paper: [[2665284]] (coupling 0.05, 12 shared references).","score":25.6,"rank":6,"section":"replacement","parts":[0.51,0.08,0.15,0.0],"abstract":"The discovery of the Higgs boson cemented the Standard Model of particle physics (SM) as we know it and observations have so far confirmed SM predictions. Now, too many beyond-the-Standard-Model (BSM) models can be explored to overcome the remaining shortcomings of the SM. As a result, generic models present a useful intermediary step to point towards the next extension of the SM probing multiple Ultraviolet models simultaneously. In this work, two examples are investigated. First, off-shell effects of potential heavy new particles are provided in the Standard Model Effective Field Theory (SMEFT) through higher dimensional operators. In particular, Charge-parity (CP) symmetry violating contributions from Wilson coefficients are ranked by using U(1) global flavour symmetries on CP-odd operators of the Warsaw basis. Asymmetries of simple triple products are proven to be more sensitive than the cross-section to these SMEFT operators and more efficient than most of the usual observables used in experiments. Then, on-shell effects of singlet and octet scalars of SUC(3) are independently searched for in four-top production. The signal consists of the associated production of a scalar with a top quark pair and of pair production in the case of the octet producing boosted top-quark pairs. The processes are generated at next-to-leading order in quantum chromodynamics with a careful renormalisation procedure and the correct selection of loop diagrams. Using improvements in top-jet tagging techniques and in the main background simulation as well as a new technique to select the events, a new particle search is performed to constrain the respective mass and coupling to top quarks of new resonances.","authors":"Julien Touchèque","nlinked":310,"nref":350,"src":"INSPIRE","html":true},{"id":"1734036","arxiv":"1905.03663","title":"Axion RG flows and the holographic dynamics of instanton densities","first":"Hamada","nauth":4,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[1304242]]. Closest of your papers: [[1607572]] (coupling 0.03, 2 shared references). Closest network paper: [[1709434]] (coupling 0.04, 4 shared references).","score":22.0,"rank":7,"section":"replacement","parts":[0.45,0.07,0.11,0.0],"abstract":"Axionic holographic RG flow solutions are studied in the context of general Einstein-Axion-Dilaton theories. A non-trivial axion profile is dual to the (non-perturbative) running of the $θ$-term for the corresponding instanton density operator. It is shown that a non-trivial axion solution is incompatible with a non-trivial (holographic) IR conformal fixed point. Imposing a suitable axion regularity condition allows to select the IR geometry in a unique way. The solutions are found analytically in the asymptotic UV and IR regimes, and it is shown that in those regimes the axion backreaction is always negligible. The axion backreaction may become important in the intermediate region of the bulk. To make contact with the axion probe limit solutions, a systematic expansion of the solution is developed. Several concrete examples are worked out numerically. It is shown that the regularity condition always implies a finite allowed range for the axion source parameter in the UV. This translates into the existence of a finite (but large) number of saddle-points in the large $N_c$ limit. This ties in well with axion-swampland conjectures.","authors":"Yuta Hamada, Elias Kiritsis, Francesco Nitti, Lukas T. Witkowski","nlinked":70,"nref":72,"src":"INSPIRE","html":true},{"id":"3216397","arxiv":"2610.26512","title":"Probing Leptophilic Scalar Dark Matter with SMEFT and Direct Detection","first":"Biondini","nauth":4,"year":2026,"cites":0,"role":"today","note":"Also cites widely used network papers: [[1518747]]. Closest of your papers: [[1746620]] (coupling 0.08, 7 shared references). Closest network paper: [[3122101]] (coupling 0.10, 10 shared references).","score":15.0,"rank":8,"section":"new","parts":[0.06,0.24,0.29,0.0],"abstract":"Heavy dark sectors may evade direct production at current colliders while leaving measurable imprints in precision observables and dark matter searches. We study leptophilic scalar dark matter within the Standard Model Effective Field Theory (SMEFT), considering both real and complex scalar dark matter coupled to vector-like leptonic mediators. We perform the complete one-loop matching of the model onto the dimension-six Warsaw basis and combine the resulting precision constraints with predictions for direct and indirect detection. We compute the relic abundance including coannihilations with the mediator, Sommerfeld enhancement, bound-state formation, and one-loop corrections to scalar dark matter annihilation. We also derive the effective dark matter-photon interactions relevant for nuclear recoils, retaining the full dependence on the dark matter and mediator masses and extending previous results beyond the heavy-mediator limit. We find that global SMEFT fits provide competitive constraints for dark matter masses up to approximately $850$ GeV, while direct detection becomes particularly powerful for compressed spectra. The complex scalar scenario is strongly constrained by the charge-radius interaction, whereas real scalar dark matter remains viable across a substantial region of parameter space. Finally, we show that a modified cosmological expansion history can significantly shift the relic-density-compatible parameter space, thereby changing the complementarity among the different probes.","authors":"Simone Biondini, Chiara Megan Bolloni, Orlando Panella, Lorenzo Tiberi","nlinked":81,"nref":87,"src":"INSPIRE","html":true},{"id":"3157191","arxiv":"2605.16540","title":"ULYSSES the Third: An Odyssey Towards a Unified Python Toolkit for Leptogenesis","first":"Granelli","nauth":5,"year":2026,"cites":0,"role":"repl","note":"Also cites widely used network papers: [[1362180]], [[2817040]], [[1688995]]. Closest of your papers: [[1249404]] (coupling 0.03, 6 shared references). Closest network paper: [[1210691]] (coupling 0.08, 15 shared references).","score":13.1,"rank":9,"section":"replacement","parts":[0.16,0.09,0.22,0.0],"abstract":"We present the third release of $\\texttt{ULYSSES}$, a Python package for the numerical evaluation of the baryon asymmetry generated through leptogenesis. This version includes code implementing state-of-the-art density matrix equations for low-scale leptogenesis with three quasi-degenerate right-handed neutrinos. We extend the validity of the code in this scenario beyond the 100 GeV right-handed neutrino mass scale, into the regime of resonant leptogenesis, by including neutrino production rates valid in both the relativistic and non-relativistic regimes. In addition, in the high-scale vanilla scenario, we provide routines for computing $ΔL = 1$ scattering processes, enabling full phase-space evolution of the right-handed neutrino and lepton asymmetry. A new $\\texttt{--extended}$ parameter interface allows users to pass model-specific inputs beyond the standard leptogenesis runcard without modifying the core infrastructure and demonstrate its use with a toy module that simultaneously solves the vanilla leptogenesis equations and the freeze-in production of dark matter. On top of these improvements, we introduce an alternative parametrisation of the Casas-Ibarra matrix, update the default neutrino oscillation parameters and report cross-checks of the new low-scale leptogenesis module against published benchmarks and independent codes. $\\texttt{ULYSSES}$ is publicly available on $\\href{https://github.com/earlyuniverse/ulysses}{\\texttt{GitHub}}$ and pip-installable from PyPI.","authors":"Alessandro Granelli, Juraj Klarić, Dhruv Pasari, Yuber F. Perez-Gonzalez, Jessica Turner","nlinked":73,"nref":73,"src":"INSPIRE","html":true},{"id":"3216235","arxiv":"2610.24404","title":"Phenomenology of Spontaneous CP-violation in 2HDMs","first":"Mondal","nauth":2,"year":2026,"cites":0,"role":"today","note":"Also cites widely used network papers: [[902365]]. Closest of your papers: [[1116165]] (coupling 0.06, 3 shared references). Closest network paper: [[1473845]] (coupling 0.10, 20 shared references).","score":12.8,"rank":10,"section":"new","parts":[0.06,0.18,0.28,0.0],"abstract":"Spontaneous CP violation (SCPV) provides an attractive possibility for explaining the origin of CP violation and the observed CP-violating phenomena in the quark sector. We investigate SCPV in the two-Higgs-doublet model as one of its simplest realizations, in which the additional Higgs bosons are necessarily non-decoupling and flavor misalignment in the Yukawa sector is required. The non-decoupling Higgs sector predicts sizable deviations from the Standard Model predictions even in the Higgs alignment limit: the decay rates of the discovered Higgs boson into $γγ$ and $Zγ$ can deviate by at least about $-10\\%$ and $-4\\%$, respectively, while the trilinear Higgs self-coupling can receive $\\mathcal{O}(100)\\%$ corrections. We consider a scenario in which the down-type quark and charged-lepton Yukawa matrices are flavor aligned, while flavor-violating interactions are allowed in the up-type quark sector to reproduce the Kobayashi-Maskawa phase. We explore the viable parameter space by imposing theoretical constraints together with experimental constraints from electroweak precision observables, flavor measurements, electric dipole moments, and LHC data. We find that a sizable flavor-violating top-charm Yukawa coupling remains allowed, giving rise to distinctive LHC signatures, including same-sign top-quark and three-top production as well as scalar cascade decays. We also find that the deviation in the trilinear Higgs self-coupling is correlated with the decay patterns of the additional neutral Higgs bosons, providing a connection between precision Higgs measurements and direct searches for the additional Higgs bosons. Our results demonstrate the importance of combining searches for additional Higgs bosons with precision Higgs measurements, complemented by flavor and electric-dipole-moment experiments, to probe SCPV.","authors":"Tanmoy Mondal, Kei Yagyu","nlinked":82,"nref":91,"src":"INSPIRE","html":true},{"id":"3216188","arxiv":"2610.24028","title":"Axion identification in multi-phase models","first":"Lei","nauth":2,"year":2026,"cites":0,"role":"today","note":"Closest of your papers: [[1607572]] (coupling 0.08, 6 shared references). Closest network paper: [[1861353]] (coupling 0.09, 9 shared references).","score":11.8,"rank":11,"section":"new","parts":[0.0,0.23,0.25,0.0],"abstract":"Axion identification in multi-phase models is subtle because local mass eigenstates do not by themselves determine global properties such as the fundamental period and domain-wall number. In this paper, we develop a route to identify the axion in a broad class of multi-phase models, including DFSZ-like theories. The construction involves two reductions: gauge identification and integrating out heavy phase fields. We study these reductions explicitly in two representative two-phase models. Gauge identification reduces the compact field space of the phase fields to a quotient space by identifying points connected by gauge transformations, while integrating out heavy phase fields restricts the low-energy dynamics to nonlinear orbits. Under the stated assumptions and within the validity of the derivative expansion, the physical low-energy field space forms a finite union of $S^1$. The axion is identified as the effective field on an $S^1$ orbit and coincides locally with the lightest mass eigenstate near the vacuum. Its fundamental period and domain-wall number are well-defined and can be determined from the original Lagrangian. Nevertheless, the reduction to a single axion does not capture all properties of topological defects in the original multi-phase theory. In particular, axion strings can retain nontrivial gauge flux, while special defect configurations can involve non-negligible spacetime derivatives of the heavy phase fields and invalidate the single-field reduction. These effects represent fundamental differences between multi-phase and single-phase theories at the level of topological defects.","authors":"Zhen-Yu Lei, Jian-Wei Cui","nlinked":58,"nref":62,"src":"INSPIRE","html":true},{"id":"2817040","arxiv":"","title":"Review of particle physics","first":"Navas","nauth":244,"year":2024,"cites":6488,"role":"other","note":"","score":null},{"id":"1709434","arxiv":"1812.06364","title":"One-loop Dirac neutrino mass and mixed axion-WIMP dark matter","first":"Carvajal","nauth":2,"year":2018,"cites":32,"role":"other","note":"","score":null},{"id":"1116165","arxiv" 2,35,"k"],[0,38,"c"],[2,39,"c"],[7,40,"k"],[36,33,"c"],[42,29,"c"],[32,14,"c"],[14,19,"c"],[2,43,"k"],[10,44,"k"],[1,45,"k"],[0,45,"k"],[1,46,"k"],[6,48,"c"],[11,19,"c"],[43,23,"c"],[5,50,"k"],[23,51,"c"],[23,56,"c"],[7,52,"k"],[42,51,"c"],[9,53,"k"],[49,28,"c"],[52,23,"c"],[43,12,"c"],[35,19,"c"],[20,39,"c"],[54,53,"c"],[42,19,"c"],[5,14,"c"],[9,15,"k"],[42,11,"c"],[37,38,"c"],[3,16,"c"],[42,52,"c"],[16,27,"c"],[47,23,"c"],[12,38,"c"],[40,38,"c"],[46,19,"c"],[8,23,"c"],[46,25,"c"],[1,25,"c"],[32,11,"c"],[12,48,"c"],[0,27,"k"],[4,30,"k"],[43,44,"c"],[4,29,"c"],[45,25,"c"],[40,14,"c"],[55,12,"c"],[47,27,"c"],[15,17,"c"],[8,35,"c"],[16,49,"c"],[28,27,"c"],[12,23,"c"],[55,27,"c"],[42,47,"c"],[50,23,"c"]],"next":[{"arxiv":"2610.25925","id":"3216348","title":"Exploring a low-mass H dibaryon in light of the LZ event: A QCD sum rule study","authors":"Wei-Han Tan, Hua-Xing Chen","score":9.7,"section":"new","rank":12,"parts":[0.06,0.02,0.45,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2690106]] (coupling 0.01, 1 shared references). Closest network paper: [[3201080]] (coupling 0.16, 11 shared references).","abstract":"The LUX-ZEPLIN (LZ) Collaboration recently reported a candidate event consistent with a high-energy nuclear recoil, motivating a possible interpretation by Lee, Takahashi, and Tsai involving the production of an invisible baryon-number-two scalar with a mass near $1.85$ GeV. Motivated by this hypothetical scenario, we investigate the $J^P=0^+$ $uuddss$ hexaquark system using QCD sum rules. We consider five local diquark-diquark-diquark interpolating currents with different scalar and axial-vector diquark combinations, together with a baryon-baryon current constructed from two $Λ$-type baryon currents. The operator product expansions are calculated up to dimension sixteen, and their numerical behaviors are examined under different OPE truncations. Among the currents considered, only the $SU(3)_{\\rm flavor}$-singlet current $J_{SSS}$, consisting of three scalar color-$\\bar{\\mathbf{3}}_C$ diquarks, yields a low-mass solution at $D=12$, with $M_{SSS}=1.85^{+0.19}_{-0.20}$ GeV. Interestingly, scalar color-$\\bar{\\mathbf{3}}_C$ diquarks belong to the flavor $\\bar{\\mathbf{3}}_F$ representation, and their local color-singlet construction has a unique nonvanishing flavor structure, $[ud][ds][su]$, corresponding to $uuddss$. Analogous all-scalar-diquark currents vanish for other flavor configurations, such as $uuuddd$ and $uuudds$. Together with our QCD sum-rule results, this property highlights the special role of the all-scalar-diquark configuration, $[ud][ds][su]$, as a possible deeply bound structure. However, the higher-dimensional OPE contributions exhibit significant truncation dependence, and the low-mass solution remains conditional on the adopted OPE truncation rather than constituting a fully controlled mass prediction."},{"arxiv":"2604.20581","id":"3148099","title":"Flavon assisted low scale leptogenesis","authors":"Yan Shao, Zhen-hua Zhao","score":9.6,"section":"replacement","rank":13,"parts":[0.06,0.12,0.2,0.0],"note":"Also cites widely used network papers: [[779828]]. Closest of your papers: [[922002]] (coupling 0.04, 3 shared references). Closest network paper: [[2762216]] (coupling 0.07, 17 shared references).","abstract":"Low-scale leptogenesis scenarios, such as the resonant leptogenesis, typically require a highly degenerate mass spectrum of right-handed neutrinos (RHNs). This requirement can be circumvented by extending the seesaw framework with a scalar singlet $S$ that couples to RHNs via the $S N^{}_I N^{}_J$ terms (with $I \\neq J$), which opens up new decay channels $N^{}_I \\to N^{}_J S$ and provides additional sources of CP violation, thereby enabling successful leptogenesis at the TeV scale without the need for mass degeneracy. In this work, for the first time, we point out that the flavon fields, which are introduced in many flavor-symmetry neutrino mass models to be responsible for the generation of RHN masses through the acquisition of non-zero vacuum expectation values, serve as ideal candidates for the $S$ field. Taking as an example a flavor-symmetry neutrino mass model that naturally realizes the experimentally allowed TM1 mixing pattern and has the attractive features that only one flavon field plays the role of $S$ and that it couples to only two RHNs, we demonstrate that the observed neutrino masses and mixing angles can be consistently reproduced, while the observed baryon asymmetry can be achieved within a parameter space compatible with current experimental constraints."},{"arxiv":"2512.14651","id":"3093299","title":"Multifield quintessential inflation and Swampland constraints in the IDM","authors":"S. Saoud, M. A. Rbah, R. Sammani, E. H. Saidi, R. Ahl Laamara","score":8.6,"section":"replacement","rank":14,"parts":[0.06,0.12,0.13,0.0],"note":"Also cites widely used network papers: [[902365]]. Closest of your papers: [[1402978]] (coupling 0.04, 5 shared references). Closest network paper: [[1339388]] (coupling 0.05, 5 shared references).","abstract":"We investigate quintessential inflation in the Inert Doublet Model coupled to a light quintessence field through an exponential interaction. In the Einstein frame, the model forms a noncanonical two-field system with a curved field-space geometry and a Starobinsky-like inflationary plateau. We solve the covariant background and perturbation equations and perform a parameter scan of the exponential slope and the number of inflationary e-folds. The scalar amplitude fixes the inflationary normalization independently at each scan point, rather than selecting a particular value of the quintessence coupling. We find that cumulative entropy-to-curvature transfer significantly modifies the scalar spectrum, while the tensor-to-scalar ratio remains compatible with current CMB limits. The scalar spectral index provides the strongest sensitivity to the exponential coupling. Covariant Swampland diagnostics nevertheless reveal a persistent tension with a strong order-unity de Sitter bound."},{"arxiv":"2610.24070","id":"3216204","title":"Breaking the axion abundance-isocurvature relation: Scale invariance and high-scale inflation","authors":"Mariaveronica De Angelis, Javier Rubio","score":6.8,"section":"new","rank":15,"parts":[0.0,0.11,0.2,0.0],"note":"Closest of your papers: [[1607572]] (coupling 0.04, 4 shared references). Closest network paper: [[1955022]] (coupling 0.07, 11 shared references).","abstract":"A QCD axion accounting for dark matter through pre-inflationary misalignment is strongly constrained by CMB isocurvature bounds, which place the classic axion window in tension with high-scale inflation. The tension arises because the same decay constant controls both the relic abundance and the primordial axion fluctuations. We show how this link can be broken in a broad class of scale-invariant models, without introducing any dimensionful parameter into the classical action. Rather than imposing a fixed Peccei-Quinn scale, the axion's kinetic normalisation is set by a dynamical field ratio. The resulting field-space metric controls the abundance through its value today and the primordial fluctuations through its value at horizon crossing. A sufficiently large metric during inflation suppresses isocurvature, allowing high-scale inflation in the classic axion window with an untuned misalignment angle and sub-Planckian decay constants. The exact scale and Peccei-Quinn symmetries also enforce a non-turning inflationary attractor, conserving the super-Hubble curvature perturbation and preserving the single-field adiabatic spectrum. We realise the mechanism in the Higgs-Dilaton model by deforming the Peccei-Quinn kinetic term. The same deformation turns the inflaton sector into an $α$-attractor pinned near the Starobinsky point. This explicit realisation has a super-Planckian present decay constant, which places it in the anthropic window, now reopened at high inflationary scales, with an ultralight QCD axion constrained by black-hole superradiance."},{"arxiv":"2610.25216","id":"3216299","title":"Is there gluonium in the $η^\\prime$? The flavour structure of $η$ and $η^\\prime$ mixing in radiative $V\\to Pγ$ and $P\\to Vγ$ decays","authors":"Rafel Escribano, Emilio Royo","score":6.6,"section":"new","rank":16,"parts":[0.0,0.14,0.12,0.0],"note":"Closest of your papers: [[1607572]] (coupling 0.05, 4 shared references). Closest network paper: [[2703113]] (coupling 0.04, 5 shared references).","abstract":"Radiative $V\\to Pγ$ and $P\\to Vγ$ decays are conventionally described using constituent-quark mass differences and phenomenological wavefunction-overlap factors as sources of flavour-symmetry breaking. We investigate whether the overlap factors can instead be understood as the effect of mixing of the $η$ and $η^\\prime$ with an additional pseudoscalar state, described by an $SO(4)$ rotation among four basis states. A global fit to current data yields a significantly better description than the corresponding three-state limit without overlap factors, while preserving the established $η$-$η^\\prime$ and vector-meson mixing angles, and shows that the additional state mixes predominantly with the non-strange component. The conventional overlap-factor description is recovered exactly as the special case in which this mixing is purely non-strange. The non-strange pattern disfavours both a flavour-singlet admixture, as expected from mixing with a pseudoscalar glueball, and the gluonium scenario considered in previous analyses. Radiative decays therefore provide no compelling evidence for gluonium in the $η^\\prime$, and the overlap factors are better interpreted in terms of a radially excited non-strange state."},{"arxiv":"2610.26750","id":"3216355","title":"Analytic results for the two-loop renormalization constants of Feynman gauge QED","authors":"Gregory S. Adkins, Elias Mitchell, A. Volkan Turan","score":6.3,"section":"new","rank":17,"parts":[0.0,0.14,0.09,0.0],"note":"Closest of your papers: [[2855387]] (coupling 0.06, 3 shared references). Closest network paper: [[2946768]] (coupling 0.03, 3 shared references).","abstract":"The two-loop renormalization constants $Z_m$ and $Z_1\\!=\\!Z_2$ of Feynman gauge quantum electrodynamics (QED) in the on-shell scheme are computed using dimensional regularization. Analytic results are obtained for these constants. In addition, analytic expressions are obtained for their expansion coefficients in the dimensional regularization parameter $ε$ from order $1/ε^2$ through order $ε^5$. The high-order expansion coefficients will be needed for future multiloop calculations in QED and will provide a useful check for multiloop calculations in QCD."},{"arxiv":"2610.25077","id":"3216269","title":"Solar Neutrino Signals and Capture-Annihilation Equilibrium of SU(5) Neutralino Dark Matter","authors":"M. Adeel Ajaib, Abdul Rehman","score":6.2,"section":"new","rank":18,"parts":[0.0,0.11,0.16,0.0],"note":"Closest of your papers: [[2859009]] (coupling 0.04, 3 shared references). Closest network paper: [[3205155]] (coupling 0.05, 3 shared references).","abstract":"Motivated by IceCube solar searches, we investigate neutralino dark matter in supersymmetric SU(5) with nonuniversal gaugino masses. Combining micrOMEGAs relic abundances with DarkSUSY calculations, we develop a consistent picture of solar neutrino and muon signals from thermal neutralino subcomponents. We identify how local abundance, neutralino composition, and capture-annihilation equilibrium shape these signals beyond simple scaling with the dark matter fraction. Integrated fluxes and representative benchmarks connect these predictions to published IceCube reference limits. Our results provide a framework for interpreting solar searches and assessing the signals of subdominant neutralino dark matter."},{"arxiv":"2610.26130","id":"3216365","title":"Short-Distance-Free Leptonic $g-2$","authors":"Siyuan Li, Vladimir Pascalutsa, Maxim Pospelov","score":6.1,"section":"new","rank":19,"parts":[0.0,0.08,0.21,0.0],"note":"Closest of your papers: [[2690106]] (coupling 0.03, 2 shared references). Closest network paper: [[2059568]] (coupling 0.07, 6 shared references).","abstract":"We note that the hadronic contributions to $a_e$ and $a_μ$ are strongly correlated, which potentially allows one to reduce the uncertainties associated with higher-energy contributions (and address the current discrepancy between lattice and data-driven evaluations) by improved measurements of $a_e$ and the fine-structure constant."},{"arxiv":"2607.07295","id":"3178560","title":"Massive Graviton Dark Matter from a Gapped Continuum","authors":"Eugenio Megias, Miguel Prieto, Mariano Quiros","score":5.5,"section":"replacement","rank":20,"parts":[0.06,0.05,0.09,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[926166]] (coupling 0.02, 1 shared references). Closest network paper: [[1210691]] (coupling 0.03, 6 shared references).","abstract":"We consider the possibility of dark matter in a warped extra-dimensional theory in the presence of a linear dilaton background, with a gapped continuum spectrum, in a brane-world cosmological scenario. Firstly, triggered by self-energy radiative corrections, we study the existence of an isolated resonance of massive gravitons, and its realization as a long-lived feebly interacting dark matter candidate, produced by the freeze-in mechanism. This massive graviton is proved to satisfy all theoretical and experimental constraints, in the sub-MeV mass range. We further consider the close relationship between the existence of this component of dark matter and the presence of an inflaton localized on the brane, with a mass around $10^{11}$ GeV and a sub-TeV reheating temperature, in a brane inflationary scenario that allows one to reproduce the most recent cosmological observables. Secondly, the gapped continuum of gravitons, a particular five-dimensional realization of the physics of unparticles, is identified as a holographic fluid which can play the role of holographic dark matter. The production of the holographic fluid goes by an ultraviolet freeze-in mechanism, with an abundance mainly depending on the reheating temperature. Depending on the values of the mass gap and the reheating temperature, one or both components of dark matter can be present."},{"arxiv":"2610.25091","id":"3216281","title":"Summary of Aspen discussions on perturbative uncertainties beyond 7-point variations","authors":"Enzo Canonero, Glen Cowan, Stefano Forte, Joey Huston, Sebastian Jaskiewicz, Manfred Kraus, Christian Preuss, Daniel Reichelt, Peter Skands, Robert Szafron, Yannick Ulrich","score":5.4,"section":"new","rank":21,"parts":[0.06,0.02,0.15,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1455793]] (coupling 0.01, 1 shared references). Closest network paper: [[1494411]] (coupling 0.05, 23 shared references).","abstract":"This writeup elaborates on constructive discussions which took place at the Aspen Center for Physics, Aug - Sep 2024, during the program \"Tightening the gap between scattering amplitudes and events at the LHC at higher orders\". Building on already existing theoretical understanding from the study of scattering amplitudes and resummations at higher orders, we suggest to complement standard 7-point renormalisation- and factorisation-scale variations by additional estimates of missing higher-order terms which are known to be present in the perturbative series. We also summarise a recent proposal for at least one way that non-Gaussian theory uncertainties might be treated within a frequentist framework. This may help to provide more robust and comprehensive uncertainty estimates for experimental and phenomenological applications of perturbative calculations."},{"arxiv":"2610.26761","id":"3216362","title":"Froggatt-Nielsen mechanism with non-invertible symmetry","authors":"Gui-Jun Ding, Stephen F. King, Bu-Yao Qu","score":5.2,"section":"new","rank":22,"parts":[0.0,0.08,0.16,0.0],"note":"Closest of your papers: [[509514]] (coupling 0.03, 2 shared references). Closest network paper: [[2762216]] (coupling 0.06, 12 shared references).","abstract":"We formulate the Froggatt-Nielsen mechanism in the framework of non-invertible symmetries obtained by $\\mathbb{Z}_2$ gauging of $\\mathbb{Z}_N$ or $U(1)$. While the non-invertible selection rules can constrain the texture-zero structure of fermion mass matrices, they do not by themselves determine the magnitudes of the allowed couplings. Introducing a flavon field allows the fusion rules to fix the leading powers of the small parameter $\\varepsilon=\\langle S\\rangle/Λ$, thereby determining both the texture zeros and the orders of magnitude of the nonzero entries up to $\\mathcal{O}(1)$ coefficients. We have constructed explicit quark and lepton models and study their predictions for the fermion mass and mixing hierarchies through analytical estimates and numerical analysis. In particular, a benchmark model with nine texture zeros in the quark sector can well accommodate the quark masses and mixing parameters with non-Hermitian Yukawa matrices. Its lepton sector admits a minimal type-I seesaw realization with normal neutrino mass ordering and one massless neutrino. These results provide a common symmetry framework for fermion mass hierarchies and texture zeros."},{"arxiv":"2610.26175","id":"3216454","title":"Probing the two-pole structure of the $D_0^*(2300)$ with an $SU(3)$ flavor filter","authors":"Ying-Bo He, Liu-Lin Wang, Xiao-Hai Liu, Qiang Zhao","score":5.0,"section":"new","rank":23,"parts":[0.06,0.02,0.13,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2690106]] (coupling 0.01, 1 shared references). Closest network paper: [[1710056]] (coupling 0.05, 16 shared references).","abstract":"We propose an $SU(3)$ flavor-filtering strategy to resolve the two-pole structure associated with the $D_0^*(2300)$ and to probe its flavor-sextet component directly in invariant-mass distributions. In unitarized chiral dynamics, the two poles originate predominantly from different irreducible representations of the coupled $\\mathcal{D}Φ$ system. We show that the strong decays $Υ\\to\\barΞ_{c}^{(\\prime)}Λ(1520)\\mathcal{D}Φ$ and the weak decays $Ξ_{b}^{(\\prime)}\\toπ^-Λ(1520)\\mathcal{D}Φ$ provide approximately antitriplet- and sextet-selective production sources. The predicted $Dπ$, $Dη$, and $D_s\\bar K$ spectra exhibit complementary signatures: the higher pole near $2.45~\\mathrm{GeV}$ generates a characteristic enhancement between the $Dη$ and $D_s\\bar K$ thresholds and a pronounced near-threshold structure in the sextet-favored channels, whereas the lower pole near $2.1~\\mathrm{GeV}$ dominates the antitriplet-favored channels. The contrast between these line shapes directly reflects the flavor representation selected by the corresponding cascade-baryon tag. The $Υ$ modes therefore provide experimentally testable observables for establishing the two-pole nature of the $D_0^*(2300)$ and for identifying a charmed-meson resonance with a dominant flavor-sextet component, while the weak-decay analysis tests the robustness of the line-shape pattern against changes in the production mechanism."},{"arxiv":"2610.21168","id":"3215545","title":"Dark Matter Particle Explorer: Ten-Year On-Orbit Performance and Scientific Outcomes","authors":"Jian-Hua Guo, Chuan Yue, Yun-Long Zhang, Yi-Zhong Fan, Jin Chang","score":4.9,"section":"replacement","rank":24,"parts":[0.06,0.05,0.06,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1746620]] (coupling 0.02, 2 shared references). Closest network paper: [[2817040]] (coupling 0.02, 24 shared references).","abstract":"The Dark Matter Particle Explorer (DAMPE, also known as ``Wukong'') is the first scientific space mission within the framework of the Strategic Pioneer Program on Space Science of the Chinese Academy of Sciences. The main scientific objectives of DAMPE include indirect detection of dark matter, cosmic-ray physics, and high energy gamma-ray astronomy. Thanks to its large geometrical factor and thick imaging calorimeter, DAMPE could effectively detect cosmic-ray electrons (including positrons) and gamma-rays up to 10~TeV, and nuclei up to PeV. Since launched on 17 December 2015 into a Sun-synchronous orbit, DAMPE has been smoothly operating on orbit for more than ten years. Here we present an overview of instrument, on-orbit status, and highlight scientific results of DAMPE, including the measurements of the all-electron energy spectrum and the spectra of protons and other nuclei, and high energy gamma-ray line search."},{"arxiv":"2607.14558","id":"3181036","title":"Spin-Resolved Decay of Axion-Like Particles into Electron--Positron Pairs in Strong Electromagnetic Fields","authors":"Xiaodan Mao, Yue-Yue Chen, Pei-Lun He","score":4.5,"section":"replacement","rank":25,"parts":[0.0,0.06,0.16,0.0],"note":"Closest of your papers: [[2855387]] (coupling 0.02, 3 shared references). Closest network paper: [[1955022]] (coupling 0.05, 8 shared references).","abstract":"We investigate spin-resolved decay of an axion-like particle (ALP) into an electron--positron pair in an intense laser field. Using the Baier--Katkov quasiclassical operator formalism in a constant crossed field, we derive a compact analytic rate retaining finite ALP-mass effects and the lepton spin degrees of freedom. In the massless limit, the spin-summed rate has the same weak- and strong-field asymptotic scalings as the corresponding photon-induced pair-creation rate, while the pseudoscalar coupling induces distinct spin-resolved channels and spin correlations. A finite ALP mass reorganizes the spectrum across the vacuum threshold, producing purely field-induced pair creation below threshold and spin-dependent oscillatory modulations above threshold through the coherent interplay of vacuum and field-assisted contributions. The entanglement of the produced pair reflects the dominant pair-creation mechanism. After the emission angles have been traced out, the reduced spin state near the vacuum threshold in weak fields is nearly maximally entangled and singlet-like. In the strong-field regime, it becomes triplet-like while retaining a concurrence approaching 1/2, whereas deep in the vacuum-dominated above-threshold regime it becomes triplet-like and separable. These results establish spin-resolved spectra and entanglement as characteristic signatures of finite-mass and threshold effects in strong-field ALP decay."},{"arxiv":"2610.26373","id":"3216398","title":"The NLL/NLO$^+$ QCD spectrum from Higgs-plus-charm correlations at the LHC","authors":"Francesco Giovanni Celiberto, Francesca Lonigro","score":4.4,"section":"new","rank":26,"parts":[0.06,0.02,0.09,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1615477]] (coupling 0.01, 2 shared references). Closest network paper: [[1494411]] (coupling 0.03, 20 shared references).","abstract":"We investigate the high-energy behavior of observables sensitive to the production of a Higgs boson in association with a singly charmed hadron at the $\\sqrt{s}=14$ TeV LHC, with light-flavored hadrons considered for comparison. Our reference formalism is the hybrid factorization at NLL/NLO$^+$, where the standard collinear picture is enhanced by the resummation of energy logarithms at the next-to-leading level and beyond. We present a prime phenomenological application of the next-to-leading correction to the singly off-shell Higgs emission function, as implemented in the multimodular JETHAD interface, a core element to test the stability of our high-energy distributions under energy-scale variations and to assess the weight of missing higher-order uncertainties. The resulting natural stability traces our path towards precision studies of Higgs production within high-energy next-to-leading-order QCD."},{"arxiv":"2610.25125","id":"3216298","title":"Where are the higher excited $B$ and $B_s$ mesons with coupled-channel effects?","authors":"Ru-Hui Ni, Jia-Jun Wu, Xian-Hui Zhong","score":4.2,"section":"new","rank":27,"parts":[0.06,0.02,0.07,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2690106]] (coupling 0.01, 1 shared references). Closest network paper: [[1710056]] (coupling 0.03, 8 shared references).","abstract":"Inspired by the newly observed $B_{s0}^*(5700)^0$, whose mass agrees well with our previous unquenched prediction for $B_s(1^3P_0)$ [Phys.~Rev.~D \\textbf{109}, 116006 (2024)], we study the mass spectra and OZI-allowed two-body strong decays of the higher $3S$-, $2P$-, $2D$-, and $1F$-wave $B$ and $B_s$ mesons in the same unquenched quark model. Our results show that coupled-channel effects significantly lower the masses and modify the relative level spacings. The scalar state $B(2^3P_0)$ is strongly affected: its mass is lowered well below the quenched quark model predictions, and it mainly decays into $Bπ$. Furthermore, the mass ordering of the vector states $B(2^3D_1)$ and $B(3^3S_1)$ is reversed, and the lighter $B(2^3D_1)$ state mainly decays into $B_1(5721)π$. To test these results, the $B(2^3P_0)$ and $B(2^3D_1)$ states are worth searching for in the $Bπ$ and $B_1(5721)π$ channels, respectively. In addition, some higher excitations are predicted to be relatively narrow and can be searched for in the $B^{(*)}π$, $B^{(*)}K$, $B_1(5721)π/K$, and $B_2^*(5747)π/K$ channels. These predictions provide useful references for future experimental searches and help clarify the role of coupled-channel effects in the heavy-light meson spectrum."},{"arxiv":"2605.25925","id":"3159246","title":"Spin-dependent interactions and fine structure in the negative-parity singly heavy baryons","authors":"Zhen-Yu Li, Guo-Liang Yu, Zhi-Gang Wang, Jian-Zhong Gu","score":4.1,"section":"replacement","rank":28,"parts":[0.06,0.02,0.07,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2690106]] (coupling 0.01, 1 shared references). Closest network paper: [[1710056]] (coupling 0.02, 8 shared references).","abstract":"In order to meet the high-precision measurement of the current baryon spectroscopy, for the first time, we rigorously analyze the spin-dependent interactions and the fine structure of the negative-parity singly heavy baryons in the relativized quark model, which was previously unfeasible in the three-quark system. This gains access to the exploration of the strong interactions dominated by the non-perturbative QCD, and reveals how the various forms of strong interactions in a baryon compete with each other, affect the evolution of the energy levels, cause the energy level splitting and contribute to the mixing effect responsible for the formation of the fine structures. It is shown that the rigorous calculation can nicely reproduce the data, the averaged deviation between the calculated and experimental energy levels is less than 5 MeV for the negative-parity singly heavy baryons. This confirms the reliability of the calculation and also helps make reasonable assignments for the observed negative-parity baryons. The large amount of data obtained by the rigorous calculations contains a wealth of interaction information and is helpful for both of the theoretical and experimental studies. The key to the rigorous calculation in this work is the proposal of a new method, namely the two-step Gaussian expansion method. This new method not only overcomes the long-standing unresolved problem in the relativized quark model, but also provides an effective approach for the high-precision calculation of other few-body systems such as the compact tetraquarks and pentaquarks, especially for the treatment of spin-orbit interactions and tensor interactions which actually appear ubiquitously in all of quantum many-body systems."},{"arxiv":"2610.25984","id":"3216350","title":"Gravitational Instability of Cold Axion Dark Matter Beyond Minimal Coupling","authors":"Bryan Cordero-Patino, Álvaro Duenas-Vidal, Jorge Segovia","score":4.0,"section":"cross","rank":29,"parts":[0.0,0.04,0.16,0.0],"note":"Closest of your papers: [[1607572]] (coupling 0.02, 1 shared references). Closest network paper: [[1944631]] (coupling 0.06, 5 shared references).","abstract":"Following recent observations of unexpectedly massive galaxies at high redshift by the James Webb Space Telescope, the revision of Dark Matter (DM) models --specifically regarding how DM couples to gravity-- has become a central topic in Cosmology. In this paper, we develop an axion model for Cold Dark Matter (CDM) with a non-minimal coupling to gravity. From this framework, we evaluate the gravitational instability in the hydrodynamic limit. Our results demonstrate how gravitational instabilities depend on the non-minimal coupling parameter, providing a novel tool for aligning with the high-redshift observations from the James Webb Space Telescope."},{"arxiv":"2610.26377","id":"3216396","title":"Pion and $η$ meson gravitational form factors from GPDs at non-zero skewness and distribution amplitudes within the Graviton Soft-Wall model","authors":"Filippo Fornetti, Matteo Rinaldi, Sergio Scopetta","score":3.9,"section":"new","rank":30,"parts":[0.06,0.02,0.05,0.0],"note":"Also cites widely used network papers: [[1688995]]. Closest of your papers: [[1708907]] (coupling 0.01, 1 shared references). Closest network paper: [[813721]] (coupling 0.02, 4 shared references).","abstract":"We present the calculations of the pion and $η$ meson gravitational form factors (GFFs) from the evaluation of generalized parton distribution functions at non-zero skewness within the graviton soft-wall (GSW) model of hadron structure. Results for the pion have been successfully compared with lattice data for both the $A$ and $D$ GFFs. From these quantities, the mechanical properties of the pion, i.e., the pressure, shear-force, normal and tangential force distributions have been also investigated. Finally, we study also the $η$ meson GFFs to predict and observe differences between the pion and $η$ structures in the corresponding mechanical properties within the GSW model."},{"arxiv":"2610.24634","id":"3216260","title":"Common origin of the Belle-BESIII line-shape difference of $Λ_c^+\\barΛ_c^-$, $D_s D_{s1}$ and $D_s D_{s2}^*$ from $e^+ e^-$ annihilation","authors":"Cheng-Xi Liu, Tian-Le Gao, Cheng-Ping Shen, Xiang Liu","score":3.8,"section":"new","rank":31,"parts":[0.06,0.03,0.04,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2690106]] (coupling 0.01, 1 shared references). Closest network paper: [[1710056]] (coupling 0.01, 4 shared references).","abstract":"The longstanding Belle--BESIII discrepancies in the $e^+e^-\\toΛ_c^+\\barΛ_c^-$, $D_sD_{s1}(2536)$, and $D_sD_{s2}^{*}(2573)$ line shapes remain an unresolved puzzle, with enhancements observed by Belle that are absent or much weaker in the BESIII measurements. In this work, we propose a new mechanism based on the radiative production of higher charmonia to explain these differences. Such processes may contribute to Belle's initial-state radiation samples, and the luminosity normalization increases their contribution to the extracted cross sections. With the vector contributions scaled by BESIII data, a pseudoscalar charmonium $η_c(6S)$ contribution can describe the baryonic enhancement, while an introduced $χ_{c2}(5P)$ contribution can describe the enhancements in both meson channels. This mechanism offers a possible common explanation for these differences and, as a bonus, suggests a way to search for missing higher charmonia at Belle II."}],"refs":{"1634858":{"first":"Cai","year":2017,"nauth":4,"title":"Lepton Number Violation: Seesaw Models const M = RAW.meta;
const N = RAW.n.map((a,i)=>({i,...a,out:[],inn:[]}));
const E = RAW.e.map(([s,t,k])=>({s,t,k}));
E.forEach(e=>{N[e.s].out.push(e.t);N[e.t].inn.push(e.s)});
N.forEach(n=>n.deg=n.out.length+n.inn.length);
const ROLE={today:'Listing: new or cross-list',repl:'Listing: replacement',seed:'Your paper',other:'Network paper (other authors)'};
const RANK={today:0,repl:1,seed:2,other:3};
const SEC={new:'New',cross:'Cross-list',replacement:'Replacement'};
const col=n=>`var(--${n.role})`;
const isNew=n=>n.role==='today'||n.role==='repl';
const r=n=>isNew(n)?4+n.score/9:2.6+1.5*Math.log10(1+n.cites)+(n.role==='seed'?1:0);
const auth=n=>n.first+(n.nauth>2?' et al.':n.nauth===2?' + 1':'');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const plain=s=>String(s).replace(/\$/g,'').replace(/\\([a-zA-Z]+)/g,'$1').replace(/[{}^_]/g,'');
const REFS=RAW.refs||{};
// reasons text: [[INSPIRE id]] becomes 'Author Year' with a pop-up (authors, year, title), like the graph's tooltip
const why=s=>esc(s).replace(/\[\[(\d+)\]\]/g,(m,k)=>{const r=REFS[k];return r?`<span class="ref ${r.role}" tabindex="0" data-ref="${k}">${esc(r.first)} ${r.year}</span>`:m});
const tex=el=>{if(window.MathJax&&MathJax.typesetPromise)MathJax.typesetPromise([el]).catch(()=>{})};
const NEWS=N.filter(isNew).sort((a,b)=>a.rank-b.rank);
document.getElementById('eyebrow').innerHTML=`arXiv ${esc(M.cat)} · <a href="${esc(M.url)}" target="_blank" rel="noopener">${esc(M.date)}</a>`;
document.getElementById('dek').textContent=`${M.nrel} of the ${M.nlist} papers in this listing (${M.counts.new} new, ${M.counts.cross} cross-lists, ${M.counts.replacement} replacements) score ${M.threshold} or more for belonging to the reference and citation network of your ${M.nown} papers and the ${M.next} papers by other authors around them. Highest score first.`;
document.getElementById('foot').innerHTML=`<p><b>Score (0–100).</b> 40% direct citations of network papers (each of your papers counts 1, each other network paper 0.6, network papers with over 1,000 citations 0.06; saturating as 1 − e<sup>−x</sup>); 35% bibliographic coupling with your own papers (idf-weighted cosine of INSPIRE-linked reference sets, best match and mean of the top three, 0.30 = full marks); 15% best coupling with the other network papers (0.35 = full marks); 10% authorship (you, or your co-authors).</p>
<p><b>Data.</b> Network: INSPIRE records supplied with the project. Listing papers: INSPIRE records where already harvested (${M.onInspire} of ${M.nlist}); for the rest the reference list was read from the arXiv source and matched to INSPIRE by arXiv number, DOI and texkey. Only links between papers on this page are drawn. Built ${esc(M.built)}.</p>`;
const P=['Direct citations','Coupling to your papers','Coupling to network','Authorship'];
function list(){const box=document.getElementById('list');
  if(!NEWS.length){box.innerHTML=`<div class="empty">No paper in this listing reaches a score of ${M.threshold}.</div>`;document.getElementById('mainnet').hidden=true;return}
  NEWS.forEach(n=>{const d=document.createElement('article');d.className='paper';d.id='p'+n.i;
    d.innerHTML=`<div class="role" style="color:${col(n)}">#${n.rank} · ${esc(SEC[n.section])} · score ${n.score.toFixed(1)}</div>
    <h2>${esc(n.title)}</h2>
    <div class="authors">${esc(n.authors)} · arXiv:${esc(n.arxiv)}</div>
    <p class="abs">${esc(n.abstract)}</p>
    <p class="why">${why(n.note)}</p>
    <div class="row">${n.parts.map((v,j)=>`<span>${P[j]} <span class="mb"><i style="width:${Math.round(v*100)}%"></i></span></span>`).join('')}<span>${n.nlinked} of ${n.nref} references linked to INSPIRE</span><span>refs from ${esc(n.src)}</span></div>
    <div class="links">${n.id?`<a href="https://inspirehep.net/literature/${n.id}" target="_blank" rel="noopener">INSPIRE</a>`:''}<a href="https://arxiv.org/abs/${esc(n.arxiv)}" target="_blank" rel="noopener">arXiv</a><a href="https://arxiv.org/pdf/${esc(n.arxiv)}" target="_blank" rel="noopener">PDF</a>${n.html?`<a href="https://arxiv.org/html/${esc(n.arxiv)}" target="_blank" rel="noopener">HTML (experimental)</a>`:''}<button class="linkbtn" type="button">Show in network</button></div>`;
    d.querySelector('.linkbtn').addEventListener('click',()=>pick(n,true));box.appendChild(d)});
  tex(box)}
let sel=NEWS[0]||null, hover=null, query='', G;
const svg=d3.select('#svg'), tip=document.getElementById('tip');
function draw(){
  if(!NEWS.length)return;
  const RNG=d3.randomLcg(11);
  const W=Math.max(300,document.getElementById('chart').clientWidth), H=W<600?500:480, m={l:16,r:16,t:20,b:34};
  svg.attr('viewBox',`0 0 ${W} ${H}`); svg.selectAll('*').remove();
  const yrs=d3.extent(N,n=>n.year);
  const x=d3.scaleLinear().domain([yrs[0]-.5,yrs[1]+1.2]).range([m.l+8,W-m.r-8]);
  const ticks=x.ticks(W<600?6:12).filter(t=>Number.isInteger(t)&&t<=yrs[1]);
  svg.append('g').attr('class','grid').selectAll('line').data(ticks).join('line').attr('x1',d=>x(d)).attr('x2',d=>x(d)).attr('y1',m.t).attr('y2',H-m.b);
  svg.append('g').attr('class','axis').attr('transform',`translate(0,${H-m.b})`).call(d3.axisBottom(x).tickValues(ticks).tickFormat(d3.format('d')).tickSizeOuter(0));
  const cy=(m.t+H-m.b)/2, xf=n=>isNew(n)?x(yrs[1]+.75):x(n.year);
  const sim=N.map(n=>({n,x:xf(n)+(RNG()-.5)*4,y:cy+(RNG()-.5)*H*.5}));
  const links=E.map(e=>({source:sim[e.s],target:sim[e.t],s:e.s,t:e.t,k:e.k}));
  d3.forceSimulation(sim).force('x',d3.forceX(s=>xf(s.n)).strength(1)).force('y',d3.forceY(cy).strength(.04))
    .force('link',d3.forceLink(links).strength(.03)).force('charge',d3.forceManyBody().strength(-40))
    .force('col',d3.forceCollide(s=>r(s.n)+2)).stop().tick(320);
  sim.forEach(s=>{s.y=Math.max(m.t+8,Math.min(H-m.b-8,s.y));s.x=Math.max(m.l+4,Math.min(W-m.r-4,s.x))});
  G=svg.append('g');
  G.append('g').selectAll('path').data(links).join('path').attr('class',l=>'edge '+l.k)
    .attr('d',l=>{const a=l.source,b=l.target;return `M${a.x},${a.y}Q${(a.x+b.x)/2},${(a.y+b.y)/2-Math.abs(a.x-b.x)*.12} ${b.x},${b.y}`});
  G.append('g').selectAll('circle').data([...sim].sort((a,b)=>RANK[b.n.role]-RANK[a.n.role])).join('circle')
    .attr('class','node').attr('cx',s=>s.x).attr('cy',s=>s.y).attr('r',s=>r(s.n)).attr('fill',s=>col(s.n))
    .on('pointerenter',(ev,s)=>{hover=s.n;showTip(ev,s.n);paint()}).on('pointermove',(ev,s)=>showTip(ev,s.n))
    .on('pointerleave',()=>{hover=null;tip.hidden=true;paint()}).on('click',(ev,s)=>pick(s.n,false));
  const lab=sim.filter(s=>isNew(s.n)||s.n.role==='seed'||s.n.deg>=3);
  const L=lab.map(s=>{const right=s.x>W*.8,t=isNew(s.n)?`#${s.n.rank} ${s.n.first}`:`${s.n.first} ${s.n.year}`,w=t.length*6.2;return{s,t,right,x0:right?s.x-r(s.n)-4-w:s.x+r(s.n)+4,w,y:s.y+4}}).sort((a,b)=>a.y-b.y);
  const placed=[];L.forEach(l=>{let k=0;while(k<40&&placed.some(p=>l.x0<p.x0+p.w&&p.x0<l.x0+l.w&&Math.abs(l.y-p.y)<13)){l.y+=13*(k%2?-1:1)*(1+Math.floor(k/2));k++;l.y=Math.max(m.t+10,Math.min(H-m.b-4,l.y))}placed.push(l)});
  G.append('g').selectAll('text').data(L).join('text').attr('class','nlabel').attr('x',l=>l.right?l.s.x-r(l.s.n)-4:l.s.x+r(l.s.n)+4).attr('y',l=>l.y)
    .attr('text-anchor',l=>l.right?'end':'start').text(l=>l.t);
  paint();
}
function showTip(ev,n){const b=document.getElementById('chart').getBoundingClientRect();tip.hidden=false;tip.textContent=`${auth(n)} (${n.year}) — ${plain(n.title)}`+(isNew(n)?` · score ${n.score}`:'');
  let L=ev.clientX-b.left+12;if(L>b.width-290)L=ev.clientX-b.left-290;tip.style.left=Math.max(4,L)+'px';tip.style.top=(ev.clientY-b.top+12)+'px'}
function paint(){if(!G)return;const f=hover||sel,on=new Set();if(f){on.add(f.i);f.out.forEach(i=>on.add(i));f.inn.forEach(i=>on.add(i))}
  svg.classed('dim',!!f);
  G.selectAll('path.edge').attr('class',l=>'edge '+l.k+(!f?'':l.s===f.i?' hot out':l.t===f.i?' hot in':''));G.selectAll('path.edge.hot').raise();
  G.selectAll('circle').classed('on',s=>on.has(s.n.i)).classed('sel',s=>sel&&s.n.i===sel.i).classed('match',s=>query&&`${s.n.first} ${s.n.title} ${s.n.arxiv} ${s.n.authors||''}`.toLowerCase().includes(query));
  G.selectAll('text.nlabel').classed('on',l=>on.has(l.s.n.i))}
function panel(){const p=document.getElementById('panel'),n=sel;
  if(!n){p.innerHTML='<p>Select a paper in the network.</p>';return}
  const links=`<div class="links">${n.id?`<a href="https://inspirehep.net/literature/${n.id}" target="_blank" rel="noopener">INSPIRE</a>`:''}${n.arxiv?`<a href="https://arxiv.org/abs/${esc(n.arxiv)}" target="_blank" rel="noopener">arXiv</a>`:''}</div>`;
  if(isNew(n)) p.innerHTML=`<div class="role" style="color:${col(n)}">#${n.rank} · ${esc(SEC[n.section])} · score ${n.score.toFixed(1)}</div><h4>${esc(n.title)}</h4>
   <div class="meta">${esc(auth(n))} · arXiv:${esc(n.arxiv)}</div><p>${why(n.note)}</p><div class="links"><a href="#p${n.i}">Back to abstract</a></div>`;
  else p.innerHTML=`<div class="role" style="color:${col(n)}">${esc(ROLE[n.role])}</div><h4>${esc(n.title)}</h4>
   <div class="meta">${esc(auth(n))} · ${n.year}${n.arxiv?' · arXiv:'+esc(n.arxiv):''}</div>
   <div class="stats"><span>${n.cites.toLocaleString()} citations</span><span>${n.inn.filter(i=>isNew(N[i])).length} of the matches link here</span></div>${links}`;
  tex(p)}
function pick(n,scroll){sel=n;panel();paint();document.querySelectorAll('.paper').forEach(el=>el.classList.toggle('sel',el.id==='p'+n.i));if(scroll)document.getElementById('chart').scrollIntoView({behavior:'smooth',block:'nearest'})}
const present=new Set(N.map(n=>n.role));
document.getElementById('legend').innerHTML=['today','repl','seed','other'].filter(k=>present.has(k)).map(k=>`<span><i class="dot" style="background:var(--${k})"></i>${esc(ROLE[k])}</span>`).join('')+'<span style="color:var(--fg-3)">Listing papers: size ∝ score; others: size ∝ log(citations)</span>';
document.getElementById('q').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();paint()});
svg.on('click',ev=>{if(ev.target.tagName!=='circle'){sel=null;panel();paint()}});
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(draw,200)});
function nextList(){const X=RAW.next||[];if(!X.length)return;const box=document.getElementById('nextlist'),more=document.getElementById('more');
  more.hidden=false;more.querySelector('summary').firstChild.textContent=`The next ${X.length} papers by score `;
  document.getElementById('moresub').textContent=`below the threshold of ${M.threshold}, not drawn in the network`;
  box.innerHTML=X.map(n=>`<li><div class="role" style="color:var(--${n.section==='replacement'?'repl':'today'})">#${n.rank} · ${esc(SEC[n.section])} · score ${n.score.toFixed(1)}</div>
    <div class="t">${esc(n.title)}</div><div class="authors">${esc(n.authors)} · arXiv:${esc(n.arxiv)}</div>
    ${n.note?`<p class="why">${why(n.note)}</p>`:''}
    <details class="abs"><summary>Abstract</summary><p class="abs">${esc(n.abstract)}</p></details>
    <div class="links">${n.id?`<a href="https://inspirehep.net/literature/${n.id}" target="_blank" rel="noopener">INSPIRE</a>`:''}<a href="https://arxiv.org/abs/${esc(n.arxiv)}" target="_blank" rel="noopener">arXiv</a><a href="https://arxiv.org/pdf/${esc(n.arxiv)}" target="_blank" rel="noopener">PDF</a></div></li>`).join('');
  more.addEventListener('toggle',()=>{if(more.open)tex(box)})}
const rtip=document.getElementById('reftip');let rcur=null;
function refShow(el){const r=REFS[el.dataset.ref];if(!r)return;rcur=el;rtip.textContent=`${auth(r)} (${r.year}) — ${plain(r.title)}`;rtip.hidden=false;
  const b=el.getBoundingClientRect(),t=rtip.getBoundingClientRect();let L=Math.min(Math.max(8,b.left),innerWidth-t.width-8),T=b.bottom+6;
  if(T+t.height>innerHeight-8)T=b.top-t.height-6;rtip.style.left=L+'px';rtip.style.top=T+'px'}
function refHide(){rtip.hidden=true;rcur=null}
document.addEventListener('pointerover',e=>{const el=e.target.closest('.ref');if(el&&e.pointerType==='mouse')refShow(el)});
document.addEventListener('pointerout',e=>{if(e.target.closest('.ref')&&e.pointerType==='mouse')refHide()});

document.addEventListener('focusin',e=>{const el=e.target.closest('.ref');if(el)refShow(el)});
