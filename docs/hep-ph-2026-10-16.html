<script>
const RAW = {"n":[{"id":"3214429","arxiv":"2610.16968","title":"Self-Interacting Dark Matter: From Particle Physics Theories to Structure Formation Simulations","first":"Rosenlyst","nauth":10,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: Bouzeraib 2026. Also cites widely used network papers: Navas 2024, Arcadi 2017. Closest of your papers: Reig 2018 (coupling 0.04, 6 shared references). Closest network paper: Alekhin 2015 (coupling 0.07, 69 shared references).","score":27.4,"rank":1,"section":"replacement","parts":[0.51,0.12,0.19,0.0],"abstract":"We present a unified theory-to-simulation framework for self-interacting dark matter (SIDM), combining a self-contained introduction to its particle-physics foundations and representative benchmark models with an explicit, systematic mapping to simulation inputs and validated numerical implementations in the moving-mesh code AREPO-2. We characterize representative elementary and composite dark-sector models through their particle content, symmetries, interactions, production mechanisms, and constraints. We then establish an explicit mapping from their microscopic properties to the inputs required for structure-formation simulations, including modifications to cosmological initial conditions, internal-state mass splittings and populations, reaction networks, velocity- and angle-dependent cross sections, dissipative energy loss, and decay rates and recoil kinematics. Building on the efficient, scalable SIDM infrastructure introduced in our companion work, we implement isotropic and anisotropic self-scattering with constant or velocity-dependent cross sections, multi-state and inelastic reactions, and dissipative scattering, as well as a dedicated DM decay module. We validate the implementations through beam-lattice deflection experiments, thermalization and uniform-box decay tests, isolated-halo gravothermal core-collapse simulations, and cosmological box and zoom-in simulations. The tests reproduce analytical predictions and published inelastic and dissipative benchmarks, with agreement across numerical schemes. The resulting framework provides a common reference for researchers across disciplines and a practical route from microscopic dark-sector theories to nonlinear astrophysical predictions beyond standard isotropic, elastic SIDM.","authors":"Martin Rosenlyst, Vinh Tran, Oliver Zier, Xuejian Shen, Mark Vogelsberger, Thejs Brinckmann, Mads T. Frandsen, Jesús Zavala, Frederik Holt Dihver Christensen, Mikkel Theiss Kristensen","nlinked":580,"nref":643,"src":"INSPIRE","html":true},{"id":"3141802","arxiv":"2604.06345","title":"Insights into 1-loop corrections to neutrino low-scale type-I seesaw mechanism","first":"Miele","nauth":4,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: Boucenna 2014. Closest of your papers: Restrepo 2015 (coupling 0.03, 2 shared references). Closest network paper: Longas 2026 (coupling 0.11, 5 shared references).","score":26.3,"rank":2,"section":"replacement","parts":[0.45,0.1,0.31,0.0],"abstract":"The standard type-I seesaw can also be regarded as a low-scale seesaw by using the freedom of the Casas-Ibarra parameterization. In this framework, radiative corrections to the neutrino mass matrix can dominate over the tree-level contribution, so that the tree-level Casas-Ibarra construction no longer solves the equation that determines the physical neutrino masses and mixings. We show how the Casas-Ibarra parametrization can be consistently extended to this loop-corrected equation, by reabsorbing the 1-loop corrections into the right-handed neutrino mass matrix, so that the resulting light neutrino mass matrix is consistent with experimental values. On the other hand, we show that physical processes related to right-handed neutrino propagation, such as heavy neutral lepton searches, do not depend on the 1-loop corrections. Moreover, we show that ${\\rm Br}(μ\\to e γ)$ provides competitive constraints on the parameter space of heavy neutral lepton search experiments for masses above $100$ GeV.","authors":"Gennaro Miele, Stefano Morisi, Eduardo Peinado, Kainat Qamar","nlinked":24,"nref":29,"src":"INSPIRE","html":true},{"id":"3178758","arxiv":"2607.08082","title":"$Z^\\prime$ Portal Dark Matter with Observable $ΔN_{\\rm eff}$","first":"Liu","nauth":3,"year":2026,"cites":0,"role":"repl","note":"Also cites widely used network papers: Arcadi 2017. Closest of your papers: Calle 2019 (coupling 0.06, 11 shared references). Closest network paper: Guo 2025 (coupling 0.15, 18 shared references).","score":15.5,"rank":3,"section":"replacement","parts":[0.06,0.2,0.41,0.0],"abstract":"In the conventional $Z^\\prime$ portal dark matter scenario, the prediction of detectable dark matter $χ$ typically relies on the collider sensitivities of $Z^\\prime$ and direct detection, where the Majorana type right-handed neutrinos are usually assumed. However, if the right-handed neutrinos $ν_R$ are Dirac type, they will contribute to the additional effective number of relativistic species $ΔN_{\\rm eff}$, which brings different detectable predictions for $Z^\\prime$ portal dark matter. In light of the great improvement of $ΔN_{\\rm eff}$ for the upcoming experiments, we investigate the $Z^\\prime$ portal dark matter with Dirac type $ν_R$. Under the $U(1)_{B-L}$ symmetry, this model includes $ν_R$ with $U(1)_{B-L}$ charge $Q_{ν_R}=-1$ and $χ$ with arbitrary $Q_χ$ beyond the SM. Based on the relation in the production of $χ$ and $ν_R$, both the WIMP and FIMP dark matter through the $Z^\\prime$ portal scenario are considered. We perform a comprehensive exploration of the viable parameter space under the constraints from $ΔN_{\\rm eff}$ induced by thermal and non-thermal $ν_R$, perturbative limit, dark matter direct and indirect detection, and collider searches of $Z^\\prime$.","authors":"Ang Liu, Zhi-Long Han, Fei Huang","nlinked":113,"nref":117,"src":"INSPIRE","html":true},{"id":"3215491","arxiv":"2610.20729","title":"Leptogenesis with a GeV-Scale Quasi-Dirac Neutrino","first":"King","nauth":4,"year":2026,"cites":0,"role":"today","note":"Also cites widely used network papers: Davidson 2008, Navas 2024. Closest of your papers: Cárcamo Hernández 2023 (coupling 0.04, 6 shared references). Closest network paper: Ávila 2025 (coupling 0.08, 24 shared references).","score":12.7,"rank":4,"section":"new","parts":[0.11,0.13,0.24,0.0],"abstract":"We discuss leptogenesis in a model with a GeV-scale quasi-Dirac neutral lepton, comprising mainly sterile states, which is accessible to future experiments. In particular, we show that Higgs-decay leptogenesis can naturally arise from the type-I seesaw mechanism with spontaneously broken global lepton number together with a discrete $Z_2$ symmetry, yielding two quasi-degenerate right-handed neutrinos (RHNs) which, to excellent approximation, form a single Dirac neutrino, with a tiny mass splitting as required for resonant enhancement generated by higher-dimensional lepton-number-violating operators. Incorporating finite-temperature effects, we show that the observed baryon asymmetry can be successfully generated through thermal Higgs decays for 0.1-10 GeV mass quasi-Dirac neutrinos, with the CP asymmetry arising from the interplay between the vacuum and thermal contributions to the mass splitting. In the parameter region of successful leptogenesis, the quasi-Dirac neutrino is accessible to future heavy neutral lepton searches at SHiP, MATHUSLA and FCC-ee. In addition, the same symmetry-breaking sector gives rise to unstable domain walls whose annihilation can generate a stochastic gravitational-wave background, providing a complementary probe of the framework.","authors":"Stephen F. King, Soumen Kumar Manna, Rishav Roshan, Arunansu Sil","nlinked":88,"nref":89,"src":"INSPIRE","html":true},{"id":"3132860","arxiv":"2603.20409","title":"The impact of gamma-ray propagation effects on indirect dark matter searches","first":"López","nauth":4,"year":2026,"cites":0,"role":"repl","note":"Also cites widely used network papers: Arcadi 2017. Closest of your papers: Arbeláez 2024 (coupling 0.06, 7 shared references). Closest network paper: Romeri 2020 (coupling 0.07, 3 shared references).","score":11.5,"rank":5,"section":"replacement","parts":[0.06,0.18,0.19,0.0],"abstract":"In this work, we investigate dark matter (DM) detection in the context of weakly interacting massive particles (WIMPs). Upon annihilation, WIMPs generate cascades of secondary particles through various channels, many of which culminate in the production of gamma rays. As these gamma rays travel toward Earth, their spectra are reshaped by interactions with the intervening medium. While current models typically account for attenuation via pair production on the extragalactic background light, they often neglect the fate of the resulting electrons and positrons, specifically subsequent inverse Compton scattering of these secondary particles, which can regenerate high-energy gamma rays. Here, we revisit the predicted gamma-ray fluxes from WIMP annihilation by performing a more detailed treatment of propagation effects. We show that for distant sources and annihilation channels such as $τ^+τ^-$, the full treatments can significantly alter the observed gamma-ray flux, by up to a factor of three orders of magnitude for heavy WIMPs. This has an impact on current dark matter limits derived without taking into account propagation effects, depending on the considered WIMP mass and annihilation channel. Our study demonstrates the importance of a detailed propagation treatment for indirect dark matter searches, and the need to account for such effects in order to obtain accurate, more reliable dark matter signal predictions and exclusion limits.","authors":"Ignacio Martínez López, Rafael Alves Batista, Miguel A. Sánchez-Conde, Antonio Juan Rubio-Montero","nlinked":90,"nref":93,"src":"INSPIRE","html":true},{"id":"3158992","arxiv":"2605.23793","title":"Search for charged long-lived particles at the Future Circular Collider (FCC-ee)","first":"Vashishtha","nauth":5,"year":2026,"cites":0,"role":"repl","note":"Also cites widely used network papers: Navas 2024. Closest of your papers: Dutta 2017 (coupling 0.06, 2 shared references). Closest network paper: Ardila-Tafurth 2026 (coupling 0.06, 2 shared references).","score":11.4,"rank":6,"section":"replacement","parts":[0.06,0.18,0.18,0.0],"abstract":"Long-lived particles (LLPs) have emerged as a compelling signature of physics beyond the standard model, offering unique discovery opportunities at current and future colliders. We present an analysis of charged LLPs leading to signatures with kinked tracks and displaced vertices. Using timing information the search is extended to detector-stable LLPs. We explore the discovery prospects of such particles at the Future Circular Collider~(FCC-ee), a proposed $e^{+}e^{-}$ collider. The clean collision environment of FCC-ee and excellent tracking performance of the IDEA detector enhance the sensitivity to kinked-track signatures, which are considerably more challenging to reconstruct in the high-occupancy environment of hadron colliders. The excellent timing resolution of the timing layer enables us to infer the mass of the detector stable particles. As a benchmark the stau pair production in the gauge mediated supersymmetry breaking (GMSB) within the minimal supersymmetric standard model scenario is considered. In this model the lightest supersymmetric particle is a gravitino and the next-to-lightest supersymmetric particle is the stau, the superpartner of the tau lepton. Discovery sensitivity up to the kinematic limit is obtained for the $ZH$ and $t\\bar{t}$ runs of the planned FCC-ee operation. We demonstrate that a potential discovery would allow for a precise $\\tildeτ$ mass measurement.","authors":"Soumyaa Vashishtha, Mirindra Randriamanantena, Thomas Creuset, Maximilian Goblirsch-Kolb, Isabell Melzer-Pellmann","nlinked":10,"nref":18,"src":"INSPIRE","html":true},{"id":"3215611","arxiv":"2610.21886","title":"Low-Scale See-Saw Mechanism and the Majorana Nature of Heavy Neutrinos","first":"Okawa","nauth":2,"year":2026,"cites":0,"role":"today","note":"Also cites widely used network papers: Navas 2024. Closest of your papers: Restrepo 2013 (coupling 0.04, 6 shared references). Closest network paper: Cai 2017 (coupling 0.09, 19 shared references).","score":11.1,"rank":7,"section":"new","parts":[0.06,0.14,0.25,0.0],"abstract":"We investigate the possibility to determine the Majorana nature of the heavy Majorana neutrinos present in the low-scale type I seesaw mechanism of neutrino mass generation in experiments at $e^+ \\text{-} e^-$ and $μ^+ \\text{-} μ^-$ colliders. This is done on the examples of two specific symmetry-protected seesaw scenarios with two right-handed (RH) singlet neutrinos and one seesaw realization with three RH neutrinos. We use the forward-backward symmetry in the angular distribution of the heavy neutral leptons produced in the $e^+ \\text{-} e^-$ and $μ^+ \\text{-} μ^-$ collisions as an indicator of their Majorana nature. Our results indicate that the experiments at FCCee during its first phase of operation have a remarkable potential not only to discover the heavy neutral leptons associated with the type I seesaw mechanism if they have masses smaller than the $Z^0$-boson mass, but also to probe and provide evidence for their Majorana nature.","authors":"Takuya Okawa, S. T. Petcov","nlinked":51,"nref":53,"src":"INSPIRE","html":true},{"id":"3215496","arxiv":"2610.20774","title":"Signatures of Leptophilic Baryogenesis at Muon Colliders","first":"Davoudiasl","nauth":3,"year":2026,"cites":0,"role":"today","note":"Also cites widely used network papers: Navas 2024. Closest of your papers: Cárcamo Hernández 2023 (coupling 0.05, 3 shared references). Closest network paper: Chen 2022 (coupling 0.07, 6 shared references).","score":10.1,"rank":8,"section":"new","parts":[0.06,0.13,0.21,0.0],"abstract":"The baryon asymmetry of the Universe may be produced in a model with 3 Higgs fields, a Higgs Troika, without the need for a strong first order electroweak phase transition. The couplings of the new Higgs fields to Standard Model fermions are assumed in accord with the \"Spontaneous Flavor Violation (SFV)\" framework, in order to avoid large deviations from flavor physics constraints. We consider a leptophilic version of SFV and outline its potential signatures at future muon colliders, envisioned to be multi-TeV partonic center of momentum machines. Hence, they provide optimal venues to search for the leptophilic Higgs Troika baryogenesis mechanism. The projected reach for signals of the new scalars allows for probing the key components of the baryogenesis model at scales that accommodate cosmological requirements.","authors":"Hooman Davoudiasl, Ian M. Lewis, Miguel A. Soto Alcaraz","nlinked":50,"nref":53,"src":"INSPIRE","html":true},{"id":"922002","arxiv":"1108.0722","title":"Neutrino Masses in $SU(5)\\Times U(1)_F$ with Adjoint Flavons","first":"Nardi","nauth":3,"year":2011,"cites":4,"role":"seed","note":"","score":null},{"id":"1249404","arxiv":"1308.3655","title":"Models with radiative neutrino masses and viable dark matter candidates","first":"Restrepo","nauth":3,"year":2013,"cites":148,"role":"seed","note":"","score":null},{"id":"3122101","arxiv":"2602.17764","title":"Minimal dark matter: Generalized framework and direct-detection sensitivity","first":"Griffith","nauth":4,"year":2026,"cites":4,"role":"other","note":"","score":null},{"id":"3205155","arxiv":"2609.21196","title":"FIMP dark matter in the scotogenic model at low-reheating temperatures","first":"Longas","nauth":3,"year":2026,"cites":1,"role":"other","note":"","score":null},{"id":"1679809","arxiv":"1806.09977","title":"Bound-state dark matter with Majorana neutrinos","first":"Reig","nauth":4,"year":2018,"cites":32,"role":"seed","note":"","score":null},{"id":"1625258","arxiv":"1709.08417", ,[34,37,"c"],[34,47,"c"],[26,27,"c"],[11,26,"c"],[2,13,"k"],[44,9,"c"],[8,14,"c"],[21,44,"c"],[13,17,"c"],[20,9,"c"],[6,27,"k"],[31,37,"c"],[21,9,"c"],[35,9,"c"],[3,34,"k"],[2,36,"k"],[20,34,"c"],[2,17,"c"],[26,17,"c"],[28,9,"c"],[34,44,"c"],[3,43,"k"],[1,44,"c"],[11,42,"c"],[7,45,"k"],[34,14,"c"],[23,42,"c"],[40,14,"c"],[6,37,"c"],[5,46,"k"],[42,37,"c"],[33,14,"c"],[6,9,"k"],[5,20,"k"],[5,22,"k"],[0,24,"k"],[2,26,"k"],[37,14,"c"],[3,31,"k"],[6,32,"k"],[3,33,"k"],[5,38,"k"],[0,40,"k"],[4,41,"k"],[34,17,"c"],[16,22,"c"],[28,37,"c"],[26,47,"c"]],"next":[{"arxiv":"2601.18781","id":"3111426","title":"Another relation among the neutrino mass-squared differences?","authors":"I. Alikhanov","score":8.9,"section":"replacement","rank":9,"parts":[0.06,0.11,0.17,0.0],"note":"Also cites widely used network papers: Navas 2024. Closest of your papers: Klasen 2013 (coupling 0.04, 3 shared references). Closest network paper: Longas 2026 (coupling 0.06, 4 shared references).","abstract":"Determining the absolute neutrino mass scale remains a compelling challenge in particle physics. Establishing precise mathematical connections among the neutrino masses could significantly facilitate this task and shed additional light on the underlying mass-generation mechanism. We highlight the possible existence of a simple algebraic relation between the mass-squared differences, $$\\frac{\\sqrt{Δm^2_{31}}+\\sqrt{Δm^2_{21}}}{\\sqrt{Δm^2_{31}}-\\sqrt{Δm^2_{21}}}=\\sqrt{2},$$ which agrees remarkably well with the best-fit values of recent global analyses of neutrino oscillation data. We then investigate the implications of adopting this relation and how it decreases the number of independent parameters in the neutrino sector. We demonstrate that there are alternative representations well known in quark and charged-lepton physics. Furthermore, we place a tight constraint on the solar neutrino mass splitting, $Δm^2_{21}=(7.445 \\pm 0.062) \\times 10^{-5} \\text{ eV}^2$, and also obtain $Δm^2_{31}=(2.548 \\pm 0.041) \\times 10^{-3} \\text{ eV}^2$. Next-generation reactor and accelerator neutrino experiments are expected to significantly reduce systematic uncertainties. In particular, the Jiangmen Underground Neutrino Observatory (JUNO) will measure these parameters independently of each other at the sub-percent level, thereby providing a stringent and direct test of our results."},{"arxiv":"2610.21989","id":"3215652","title":"Probing the Axion--Photon--Dark Photon Interaction with LHC Mono-Photons and Fermi-LAT Gamma-Ray Lines","authors":"Chuan-Ren Chen, Takaaki Nomura, Van Que Tran","score":8.5,"section":"new","rank":10,"parts":[0.0,0.19,0.13,0.0],"note":"Closest of your papers: von der Pahlen 2016 (coupling 0.06, 4 shared references). Closest network paper: Palacio Cárdenas 2017 (coupling 0.05, 4 shared references).","abstract":"We investigate the axion--photon--dark photon interaction at the LHC and in gamma-ray line searches. By recasting the CMS mono-photon data, we derive a $95\\%$ CL exclusion reaching $g_{aγ'γ}\\simeq4.8\\times10^{-4}\\ {\\rm GeV}^{-1}$ for dark photon masses $m_{γ'}\\lesssim100$ GeV, with sensitivity extending to $m_{γ'}\\simeq2.3$ TeV, where the effective theory approaches its validity limit. This improves upon the existing LEP mono-photon constraint by a factor of $3$ or more, depending on the dark photon mass. The projected HL-LHC sensitivity improves by a further factor of $\\sim2.7$ and extends the reach to $m_{γ'}\\simeq3$ TeV. The same interaction also induces $s$-wave annihilation of axions into $γγ$. If the axion constitutes dark matter, Fermi-LAT gamma-ray line data become more constraining than the LHC for $m_a\\gtrsim160$ GeV at $m_{γ'}=300$ GeV, where the on-shell collider signal is kinematically suppressed. Combining collider and gamma-ray line constraints excludes a thermal relic axion across the axion mass range considered for this benchmark."},{"arxiv":"2610.21041","id":"3215536","title":"Testing the inelastic dark matter interpretation of the LZ event with heavy-element experiments","authors":"Peter W. Graham, Juan P. Luengas, Harikrishnan Ramani, Samuel S. Y. Wong","score":8.4,"section":"new","rank":11,"parts":[0.0,0.03,0.48,0.0],"note":"Closest of your papers: Calle 2021 (coupling 0.01, 1 shared references). Closest network paper: Borah 2026 (coupling 0.17, 14 shared references).","abstract":"We consider the inelastic dark matter interpretation of the recent 248 keV event observed by LZ and identify different experiments that could test it. Details of the underlying model and the ability of complementary experiments to test it depend significantly on the high-velocity tail of the dark matter distribution. We consider several example velocity distributions motivated by the impact of the Large Magellanic Cloud (LMC) in order to map out the effects of this dependence. For example, we illustrate the type of high-velocity tail that would make the thermal Higgsino viable despite stringent constraints from solar neutrinos: Reducing the flux of the tail relative to simulation results improves the Higgsino fit, while extending the tail to higher velocities at fluxes below current simulation resolution evades the solar neutrino bound. This motivates more detailed simulations at higher resolution to understand the tail better. Even if xenon experiments confirm the signal event, complementary experiments are still required to test whether the underlying model is inelastic dark matter and to break degeneracies in the measurement of dark matter parameters such as mass and mass splitting. Heavy-element paleodetectors could cover most of the parameter space relevant to the LZ event. Their use of different elements could determine the dark matter mass and splitting, while their unique sensitivity to the history of the dark matter distribution could test the signal's LMC origin. Luminous detection in large neutrino detectors with heavy-element supplements could directly test the inelastic nature of the signal and measure the mass splitting, while its sensitivity to the radiative decay rate could provide strong evidence for the Higgsino interpretation."},{"arxiv":"2610.20751","id":"3215497","title":"Auditing anapole dark matter: the limits of model independence in dark matter effective field theory","authors":"Duncan K. Adams, Jared Barron, Megan H. McDuffie","score":8.0,"section":"new","rank":12,"parts":[0.06,0.09,0.16,0.0],"note":"Also cites widely used network papers: Tanabashi 2018. Closest of your papers: Restrepo 2019 (coupling 0.03, 5 shared references). Closest network paper: Belyaev 2018 (coupling 0.06, 6 shared references).","abstract":"Effective field theory is a powerful tool for studying the low-energy behavior of dark sector models without explicit dependence on the high-energy physics. However, bottom-up EFT analyses can miss important processes in UV completions that are relevant for dark matter production and detection. In this work we demonstrate explicitly that for Majorana dark matter coupled to the photon by the dimension-six anapole operator, different UV completions make qualitatively different predictions at high energy colliders, in the early universe, and in direct detection experiments. Additionally, we show that competitive, and in some cases, leading constraints on anapole dark matter can be derived by searching for signatures of additional particles in the UV completion rather than direct probes of the DM itself. We argue that the UV completions studied in this work have categorically different phenomenologies and that `model-independent' EFT constraints are not always applicable."},{"arxiv":"2610.21817","id":"3215646","title":"From Non-Thermal to Thermal: Cosmological Imprints of Self-Interacting Secluded Dark Matter","authors":"Koushik Dutta, Deep Ghosh, Ahamadullah Khan","score":7.5,"section":"new","rank":13,"parts":[0.0,0.16,0.13,0.0],"note":"Closest of your papers: Agudelo 2024 (coupling 0.06, 6 shared references). Closest network paper: Chanda 2021 (coupling 0.04, 4 shared references).","abstract":"Dark matter (DM), secluded from the Standard Model (SM), can attain internal thermalization through self-interactions. We investigate the thermalization of a real scalar DM field with a quartic self-coupling, initially produced from the perturbative decay of the coherently oscillating inflaton field during reheating. The thermalization process has been studied numerically by solving Boltzmann equation of the DM momentum distribution function in presence of $2\\rightarrow2$ DM elastic self-scatterings. In the absence of number-changing processes, the thermalized dark sector is characterized by a temperature and a nonzero chemical potential, determined by the inflaton mass and the reheat temperature. We find that if the inflaton mass is greater (smaller) than the reheat temperature, the DM temperature can be greater (smaller) than the SM temperature during Big Bang Nucleosynthesis, without violating any cosmological constraints. This is realized with a negative (positive) chemical potential for the DM temperature greater (smaller) than the SM one. Depending on DM production history, we can achieve the lower limit on the DM mass much below than in warm DM scenarios. The thermalization via self-scatterings tends to suppress the DM co-moving free-streaming length, compared to the non-thermal scenario without any collisions. Consequently, the lower limit on the DM mass weakens approximately by $40\\%$ for a suitable choice of quartic self-coupling than in the non-thermal scenario. We obtain the lower limits on the thermal DM mass to be $2.2\\times10^{-10}$ GeV and $0.47$ GeV for reheat temperatures, $5\\times 10^6$ GeV and $5$ MeV respectively, while the inflaton mass is set at $10^3$ GeV."},{"arxiv":"2610.21879","id":"3215419","title":"One generation of the Standard Model as a quantum error-correcting code","authors":"Shiroman Prakash, K. L. Ramya","score":7.1,"section":"cross","rank":14,"parts":[0.0,0.08,0.28,0.0],"note":"Closest of your papers: Arbelaez 2015 (coupling 0.03, 3 shared references). Closest network paper: Costa 2020 (coupling 0.10, 5 shared references).","abstract":"Together with a right-handed neutrino, the fermions of one generation of the Standard Model are labelled by five bits, a combinatorial structure tied to anomaly cancellation. We make this precise. Anomaly cancellation is the vanishing of a cubic form, the defining property of triorthogonal codes, the quantum error-correcting codes behind magic state distillation. Removing the right-handed neutrino gives a $[[15,1,3]]_p$ code for every prime $p$, including the Bravyi-Kitaev code for $p = 2$. For qutrits it is the unique shortest distance-three triorthogonal code."},{"arxiv":"2610.22105","id":"3215623","title":"From Axion Detection to Dark Matter Astronomy","authors":"Jae Hyeok Chang, Stefano Profumo","score":6.9,"section":"new","rank":15,"parts":[0.0,0.12,0.18,0.0],"note":"Closest of your papers: Ma 2017 (coupling 0.04, 3 shared references). Closest network paper: Carvajal 2021 (coupling 0.06, 7 shared references).","abstract":"A global haloscope network could turn an axion discovery into astronomy of dark matter substructure and transients. We combine interferometric phase, spatial coherence, and spectroscopy to study the formation and evolution of axion substructure through measurements of flow directions and velocity distributions. For tidal streams, a four-site forecast shows how longitudinal and transverse velocity dispersions can be measured jointly. Interpreted with dynamical and population models, these measurements could test axion production scenarios. Extensions to miniclusters, axion stars, and emitted bursts would broaden the astrophysical reach of laboratory detection."},{"arxiv":"2604.20956","id":"3148500","title":"Improving the robustness of the $δ_{CP}$ determination with $ν$SCOPE","authors":"João Paulo Pinheiro, Salvador Urrea","score":6.8,"section":"replacement","rank":16,"parts":[0.06,0.06,0.16,0.0],"note":"Also cites widely used network papers: Davidson 2008. Closest of your papers: Calle 2021 (coupling 0.02, 3 shared references). Closest network paper: Sicking 2019 (coupling 0.06, 9 shared references).","abstract":"The determination of leptonic CP violation is a primary goal of future long-baseline neutrino experiments such as DUNE and T2HK. The extraction of $δ_{\\mathrm{CP}}$ relies on the near-to-far extrapolation and on the assumed knowledge of the cross-section ratios $σ_{ν_e}/σ_{ν_μ}$ and $σ_{\\barν_e}/σ_{\\barν_μ}$, which are typically inferred under theoretical assumptions such as lepton universality and depend on nuclear modeling. In this work, we quantify how much of the sensitivity of DUNE and T2HK arises from these assumptions by performing a model-agnostic, data-driven estimation of systematic uncertainties in $ν_e$ and $\\barν_e$ cross sections. We find that adopting such an agnostic approach can substantially degrade the CP-violation sensitivity, reducing it by nearly $3σ$ at maximal CP violation for DUNE, and $4σ$ for T2HK. We then assess the impact of the proposed $ν$SCOPE experiment, which, through a combination of neutrino tagging and the Narrow-Band Off-Axis technique, can provide percent-level measurements of $σ_{ν_μ}$ and $σ_{\\barν_μ}$ and constrain the ratio $σ_{ν_e}/σ_{ν_μ}$ at the $\\sim 2\\%$ level. We show that including prospective $ν$SCOPE measurements largely restores the lost sensitivity, highlighting that precise external cross-section measurements may be essential for a fully robust determination of $δ_{\\mathrm{CP}}$ and for breaking its degeneracy with nuclear mis-modeling or possible new physics affecting neutrino detection."},{"arxiv":"2606.14263","id":"3168356","title":"A Novel Approach to Short Baseline Oscillation Searches Using Neutrino Tagging with nuSCOPE","authors":"Adrien Blanchet, César Jesús-Valls, Animesh Chatterjee, Stephen Dolan, Pierre Granger, Laura Munteanu","score":6.1,"section":"replacement","rank":17,"parts":[0.06,0.06,0.12,0.0],"note":"Also cites widely used network papers: Navas 2024. Closest of your papers: Blandon 2018 (coupling 0.02, 1 shared references). Closest network paper: Abdallah 2026 (coupling 0.04, 3 shared references).","abstract":"We present the first study of short-baseline neutrino oscillation searches using a tagged neutrino beamline, taking the proposed nuSCOPE facility at CERN as a benchmark. In this Letter we demonstrate that tagged neutrino beams, where the neutrino flavor, energy, and propagation distance are determined with exceptional event-by-event precision, provide a new experimental approach to search for non-standard neutrino oscillations. We evaluate the sensitivity to sterile-neutrino-induced oscillations in the $ν_μ$ disappearance, $ν_μ\\rightarrow ν_e$ appearance, and $ν_e$ disappearance channels, demonstrating the ability to probe multiple flavor transitions and both appearance and disappearance modes within a single experiment. Our results show that tagged beams enable sensitivity improvements to mass-squared splittings spanning several orders of magnitude while substantially reducing the dependence on neutrino flux predictions that limits conventional searches. We find that nuSCOPE can probe a broad region of parameter space motivated by existing anomalies and extend coverage into previously unexplored territory, demonstrating the strong potential of tagged neutrino beams for precision oscillation physics."},{"arxiv":"2610.21897","id":"3215637","title":"Lossy Lorentz boosts at ultra-relativistic energies: Numerical study and source survey of high-energy physics software","authors":"Christian Bierlich","score":6.0,"section":"new","rank":18,"parts":[0.06,0.05,0.13,0.0],"note":"Also cites widely used network papers: Navas 2024. Closest of your papers: Dutta 2017 (coupling 0.02, 1 shared references). Closest network paper: Hashemi 2016 (coupling 0.04, 2 shared references).","abstract":"Most high-energy-physics software packages implement Lorentz boosts for themselves. At sufficiently large boosts, these routines can return finite, plausible-looking four-vectors whose invariant masses and rest-frame properties are no longer accurate. We survey implementations in widely used collider and air-shower software and compare representative algorithms in three numerical tests. We find that the main problem is usually information discarded by the representation, rather than the arithmetic of the boost formula. Information can be lost when a boost is specified only by its velocity, and again when the result is stored only through Cartesian components. Richer boost input prevents the first loss, while retaining light-cone coordinates prevents the second. Ordinary hard processes at present colliders are safe in double precision; the relevant regimes are low-mass systems, highly boosted auxiliary frames, single-precision particle records and air-shower simulations. Extreme scale hierarchies in parton-shower accuracy tests and ultra-heavy particle decays provide still more demanding cases."}],"meta":{"date":"Friday, 16 October 2026","url":"https://arxiv.org/catchup/hep-ph/2026-10-16","cat":"hep-ph","year":2026,"built":"2026-10-23","nown":65,"next":260,"onInspire":68,"threshold":10.0,"nrel":8,"nlist":68,"counts":{"new":31,"cross":12,"replacement":25},"below":[{"arxiv":"2601.18781","title":"Another relation among the neutrino mass-squared differences?","score":8.9},{"arxiv":"2610.21989","title":"Probing the Axion--Photon--Dark Photon Interaction with LHC Mono-Photons and Fermi-LAT Gamma-Ray Lines","score":8.5},{"arxiv":"2610.21041","title":"Testing the inelastic dark matter interpretation of the LZ event with heavy-element experiments","score":8.4},{"arxiv":"2610.20751","title":"Auditing anapole dark matter: the limits of model independence in dark matter effective field theory","score":8.0},{"arxiv":"2610.21817","title":"From Non-Thermal to Thermal: Cosmological Imprints of Self-Interacting Secluded Dark Matter","score":7.5},{"arxiv":"2610.21879","title":"One generation of the Standard Model as a quantum error-correcting code","score":7.1}]}};
const M = RAW.meta;
const N = RAW.n.map((a,i)=>({i,...a,out:[],inn:[]}));
const E = RAW.e.map(([s,t,k])=>({s,t,k}));
E.forEach(e=>{N[e.s].out.push(e.t);N[e.t].inn.push(e.s)});
N.forEach(n=>n.deg=n.out.length+n.inn.length);
const ROLE={today:'Listing: new or cross-list',repl:'Listing: replacement',seed:'Your paper',other:'Network paper (other authors)'};
const RANK={today:0,repl:1,seed:2,other:3};
const SEC={new:'New',cross:'Cross-list',replacement:'Replacement'};
const col=n=>`var(--${n.role})`;
const isNew=n=>n.role==='today'||n.role==='repl';
const r=n=>isNew(n)?4+n.score/9:2.6+1.5*Math.log10(1+n.cites)+(n.role==='seed'?1:0);
const auth=n=>n.first+(n.nauth>2?' et al.':n.nauth===2?' + 1':'');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const plain=s=>String(s).replace(/\$/g,'').replace(/\\([a-zA-Z]+)/g,'$1').replace(/[{}^_]/g,'');
const tex=el=>{if(window.MathJax&&MathJax.typesetPromise)MathJax.typesetPromise([el]).catch(()=>{})};
const NEWS=N.filter(isNew).sort((a,b)=>a.rank-b.rank);
document.getElementById('eyebrow').innerHTML=`arXiv ${esc(M.cat)} · <a href="${esc(M.url)}" target="_blank" rel="noopener">${esc(M.date)}</a>`;
document.getElementById('dek').textContent=`${M.nrel} of the ${M.nlist} papers in this listing (${M.counts.new} new, ${M.counts.cross} cross-lists, ${M.counts.replacement} replacements) score ${M.threshold} or more for belonging to the reference and citation network of your ${M.nown} papers and the ${M.next} papers by other authors around them. Highest score first.`;
document.getElementById('foot').innerHTML=`<p><b>Score (0–100).</b> 40% direct citations of network papers (each of your papers counts 1, each other network paper 0.6, network papers with over 1,000 citations 0.06; saturating as 1 − e<sup>−x</sup>); 35% bibliographic coupling with your own papers (idf-weighted cosine of INSPIRE-linked reference sets, best match and mean of the top three, 0.30 = full marks); 15% best coupling with the other network papers (0.35 = full marks); 10% authorship (you, or your co-authors).</p>
<p><b>Data.</b> Network: INSPIRE records supplied with the project. Listing papers: INSPIRE records where already harvested (${M.onInspire} of ${M.nlist}); for the rest the reference list was read from the arXiv source and matched to INSPIRE by arXiv number, DOI and texkey. Only links between papers on this page are drawn. Built ${esc(M.built)}.</p>`;
const P=['Direct citations','Coupling to your papers','Coupling to network','Authorship'];
function list(){const box=document.getElementById('list');
  if(!NEWS.length){box.innerHTML=`<div class="empty">No paper in this listing reaches a score of ${M.threshold}.</div>`;document.getElementById('mainnet').hidden=true;return}
  NEWS.forEach(n=>{const d=document.createElement('article');d.className='paper';d.id='p'+n.i;
    d.innerHTML=`<div class="role" style="color:${col(n)}">#${n.rank} · ${esc(SEC[n.section])} · score ${n.score.toFixed(1)}</div>
    <h2>${esc(n.title)}</h2>
    <div class="authors">${esc(n.authors)} · arXiv:${esc(n.arxiv)}</div>
    <p class="abs">${esc(n.abstract)}</p>
    <p class="why">${esc(n.note)}</p>
    <div class="row">${n.parts.map((v,j)=>`<span>${P[j]} <span class="mb"><i style="width:${Math.round(v*100)}%"></i></span></span>`).join('')}<span>${n.nlinked} of ${n.nref} references linked to INSPIRE</span><span>refs from ${esc(n.src)}</span></div>
    <div class="links">${n.id?`<a href="https://inspirehep.net/literature/${n.id}" target="_blank" rel="noopener">INSPIRE</a>`:''}<a href="https://arxiv.org/abs/${esc(n.arxiv)}" target="_blank" rel="noopener">arXiv</a><a href="https://arxiv.org/pdf/${esc(n.arxiv)}" target="_blank" rel="noopener">PDF</a>${n.html?`<a href="https://arxiv.org/html/${esc(n.arxiv)}" target="_blank" rel="noopener">HTML (experimental)</a>`:''}<button class="linkbtn" type="button">Show in network</button></div>`;
    d.querySelector('.linkbtn').addEventListener('click',()=>pick(n,true));box.appendChild(d)});
  tex(box)}
let sel=NEWS[0]||null, hover=null, query='', G;
const svg=d3.select('#svg'), tip=document.getElementById('tip');
function draw(){
  if(!NEWS.length)return;
  const RNG=d3.randomLcg(11);
  const W=Math.max(300,document.getElementById('chart').clientWidth), H=W<600?500:480, m={l:16,r:16,t:20,b:34};
  svg.attr('viewBox',`0 0 ${W} ${H}`); svg.selectAll('*').remove();
  const yrs=d3.extent(N,n=>n.year);
  const x=d3.scaleLinear().domain([yrs[0]-.5,yrs[1]+1.2]).range([m.l+8,W-m.r-8]);
  const ticks=x.ticks(W<600?6:12).filter(t=>Number.isInteger(t)&&t<=yrs[1]);
  svg.append('g').attr('class','grid').selectAll('line').data(ticks).join('line').attr('x1',d=>x(d)).attr('x2',d=>x(d)).attr('y1',m.t).attr('y2',H-m.b);
  svg.append('g').attr('class','axis').attr('transform',`translate(0,${H-m.b})`).call(d3.axisBottom(x).tickValues(ticks).tickFormat(d3.format('d')).tickSizeOuter(0));
  const cy=(m.t+H-m.b)/2, xf=n=>isNew(n)?x(yrs[1]+.75):x(n.year);
  const sim=N.map(n=>({n,x:xf(n)+(RNG()-.5)*4,y:cy+(RNG()-.5)*H*.5}));
  const links=E.map(e=>({source:sim[e.s],target:sim[e.t],s:e.s,t:e.t,k:e.k}));
  d3.forceSimulation(sim).force('x',d3.forceX(s=>xf(s.n)).strength(1)).force('y',d3.forceY(cy).strength(.04))
    .force('link',d3.forceLink(links).strength(.03)).force('charge',d3.forceManyBody().strength(-40))
    .force('col',d3.forceCollide(s=>r(s.n)+2)).stop().tick(320);
  sim.forEach(s=>{s.y=Math.max(m.t+8,Math.min(H-m.b-8,s.y));s.x=Math.max(m.l+4,Math.min(W-m.r-4,s.x))});
  G=svg.append('g');
  G.append('g').selectAll('path').data(links).join('path').attr('class',l=>'edge '+l.k)
    .attr('d',l=>{const a=l.source,b=l.target;return `M${a.x},${a.y}Q${(a.x+b.x)/2},${(a.y+b.y)/2-Math.abs(a.x-b.x)*.12} ${b.x},${b.y}`});
  G.append('g').selectAll('circle').data([...sim].sort((a,b)=>RANK[b.n.role]-RANK[a.n.role])).join('circle')
    .attr('class','node').attr('cx',s=>s.x).attr('cy',s=>s.y).attr('r',s=>r(s.n)).attr('fill',s=>col(s.n))
    .on('pointerenter',(ev,s)=>{hover=s.n;showTip(ev,s.n);paint()}).on('pointermove',(ev,s)=>showTip(ev,s.n))
    .on('pointerleave',()=>{hover=null;tip.hidden=true;paint()}).on('click',(ev,s)=>pick(s.n,false));
  const lab=sim.filter(s=>isNew(s.n)||s.n.role==='seed'||s.n.deg>=3);
  const L=lab.map(s=>{const right=s.x>W*.8,t=isNew(s.n)?`#${s.n.rank} ${s.n.first}`:`${s.n.first} ${s.n.year}`,w=t.length*6.2;return{s,t,right,x0:right?s.x-r(s.n)-4-w:s.x+r(s.n)+4,w,y:s.y+4}}).sort((a,b)=>a.y-b.y);
  const placed=[];L.forEach(l=>{let k=0;while(k<40&&placed.some(p=>l.x0<p.x0+p.w&&p.x0<l.x0+l.w&&Math.abs(l.y-p.y)<13)){l.y+=13*(k%2?-1:1)*(1+Math.floor(k/2));k++;l.y=Math.max(m.t+10,Math.min(H-m.b-4,l.y))}placed.push(l)});
  G.append('g').selectAll('text').data(L).join('text').attr('class','nlabel').attr('x',l=>l.right?l.s.x-r(l.s.n)-4:l.s.x+r(l.s.n)+4).attr('y',l=>l.y)
    .attr('text-anchor',l=>l.right?'end':'start').text(l=>l.t);
  paint();
}
function showTip(ev,n){const b=document.getElementById('chart').getBoundingClientRect();tip.hidden=false;tip.textContent=`${auth(n)} (${n.year}) — ${plain(n.title)}`+(isNew(n)?` · score ${n.score}`:'');
  let L=ev.clientX-b.left+12;if(L>b.width-290)L=ev.clientX-b.left-290;tip.style.left=Math.max(4,L)+'px';tip.style.top=(ev.clientY-b.top+12)+'px'}
function paint(){if(!G)return;const f=hover||sel,on=new Set();if(f){on.add(f.i);f.out.forEach(i=>on.add(i));f.inn.forEach(i=>on.add(i))}
  svg.classed('dim',!!f);
  G.selectAll('path.edge').attr('class',l=>'edge '+l.k+(!f?'':l.s===f.i?' hot out':l.t===f.i?' hot in':''));G.selectAll('path.edge.hot').raise();
  G.selectAll('circle').classed('on',s=>on.has(s.n.i)).classed('sel',s=>sel&&s.n.i===sel.i).classed('match',s=>query&&`${s.n.first} ${s.n.title} ${s.n.arxiv} ${s.n.authors||''}`.toLowerCase().includes(query));
  G.selectAll('text.nlabel').classed('on',l=>on.has(l.s.n.i))}
function panel(){const p=document.getElementById('panel'),n=sel;
  if(!n){p.innerHTML='<p>Select a paper in the network.</p>';return}
  const links=`<div class="links">${n.id?`<a href="https://inspirehep.net/literature/${n.id}" target="_blank" rel="noopener">INSPIRE</a>`:''}${n.arxiv?`<a href="https://arxiv.org/abs/${esc(n.arxiv)}" target="_blank" rel="noopener">arXiv</a>`:''}</div>`;
  if(isNew(n)) p.innerHTML=`<div class="role" style="color:${col(n)}">#${n.rank} · ${esc(SEC[n.section])} · score ${n.score.toFixed(1)}</div><h4>${esc(n.title)}</h4>
   <div class="meta">${esc(auth(n))} · arXiv:${esc(n.arxiv)}</div><p>${esc(n.note)}</p><div class="links"><a href="#p${n.i}">Back to abstract</a></div>`;
  else p.innerHTML=`<div class="role" style="color:${col(n)}">${esc(ROLE[n.role])}</div><h4>${esc(n.title)}</h4>
   <div class="meta">${esc(auth(n))} · ${n.year}${n.arxiv?' · arXiv:'+esc(n.arxiv):''}</div>
   <div class="stats"><span>${n.cites.toLocaleString()} citations</span><span>${n.inn.filter(i=>isNew(N[i])).length} of the matches link here</span></div>${links}`;
  tex(p)}
function pick(n,scroll){sel=n;panel();paint();document.querySelectorAll('.paper').forEach(el=>el.classList.toggle('sel',el.id==='p'+n.i));if(scroll)document.getElementById('chart').scrollIntoView({behavior:'smooth',block:'nearest'})}
const present=new Set(N.map(n=>n.role));
document.getElementById('legend').innerHTML=['today','repl','seed','other'].filter(k=>present.has(k)).map(k=>`<span><i class="dot" style="background:var(--${k})"></i>${esc(ROLE[k])}</span>`).join('')+'<span style="color:var(--fg-3)">Listing papers: size ∝ score; others: size ∝ log(citations)</span>';
document.getElementById('q').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();paint()});
svg.on('click',ev=>{if(ev.target.tagName!=='circle'){sel=null;panel();paint()}});
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(draw,200)});
function nextList(){const X=RAW.next||[];if(!X.length)return;const box=document.getElementById('nextlist'),more=document.getElementById('more');
  more.hidden=false;more.querySelector('summary').firstChild.textContent=`The next ${X.length} papers by score `;
  document.getElementById('moresub').textContent=`below the threshold of ${M.threshold}, not drawn in the network`;
  box.innerHTML=X.map(n=>`<li><div class="role" style="color:var(--${n.section==='replacement'?'repl':'today'})">#${n.rank} · ${esc(SEC[n.section])} · score ${n.score.toFixed(1)}</div>
    <div class="t">${esc(n.title)}</div><div class="authors">${esc(n.authors)} · arXiv:${esc(n.arxiv)}</div>
    ${n.note?`<p class="why">${esc(n.note)}</p>`:''}
    <details class="abs"><summary>Abstract</summary><p class="abs">${esc(n.abstract)}</p></details>
    <div class="links">${n.id?`<a href="https://inspirehep.net/literature/${n.id}" target="_blank" rel="noopener">INSPIRE</a>`:''}<a href="https://arxiv.org/abs/${esc(n.arxiv)}" target="_blank" rel="noopener">arXiv</a><a href="https://arxiv.org/pdf/${esc(n.arxiv)}" target="_blank" rel="noopener">PDF</a></div></li>`).join('');
  more.addEventListener('toggle',()=>{if(more.open)tex(box)})}
list();nextList();draw();panel();
window.addEventListener('load',()=>{tex(document.getElementById('list'));tex(document.getElementById('panel'))});
</script>
