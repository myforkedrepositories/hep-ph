<script>
const RAW = {"n":[{"id":"3096843","arxiv":"2601.00436","title":"Anatomy of RHN DM relic in the vanilla scotogenic neutrino mass model","first":"Sahoo","nauth":3,"year":2026,"cites":0,"role":"repl","note":"Cites 5 network papers: [[1501489]], [[1294681]], [[1413755]], [[1493855]], [[1333250]]. Also cites widely used network papers: [[1494411]], [[2817040]]. Closest of your papers: [[1746620]] (coupling 0.07, 9 shared references). Closest network paper: [[3205155]] (coupling 0.13, 13 shared references).","score":51.2,"rank":1,"section":"replacement","parts":[0.96,0.21,0.38,0.0],"abstract":"The scotogeneic neutrino mass models are very popular choices to generate light neutrino masses via radiative mechanism. In these models, the particles running in the loop are distinguished from the standard model due to an imposed $\\mathcal{Z}_2$ symmetry under which the loop particles are odd. Therefore, the lightest particle running in the loop can be a viable dark matter candidate. In this paper, we revisit the minimal scotogenic neutrino mass model and study the anatomy of right handed neutrino (RHN) DM relic, taking into account contributions from self-annihilation, co-annihilation, conversion-driven processes, as well as production via the freeze-in mechanism. We impose the constraints from direct detection and collider searches of DM including anomalous magnetic moment of muon, charged lepton flavor violation and low-energy neutrino oscillation data to show that the lightest RHN can be a viable DM in the mass range: $M_{h}/2\\lesssim M_{\\rm DM}\\lesssim2000 {\\rm GeV}$ (thermal DM) and $0.1 ~{\\rm GeV}\\lesssim M_{\\rm DM}\\lesssim 1000 {\\rm GeV}$ (non-thermal DM), where $M_h$ denotes the Standard Model Higgs mass and $M_{\\rm DM}$ is the RHN dark matter mass. We also find the displaced vertex signatures of long lived particles which can be probed at future colliders.","authors":"Sujit Kumar Sahoo, Narendra Sahu, Vicky Singh Thounaojam","nlinked":72,"nref":72,"src":"INSPIRE","html":true},{"id":"3184726","arxiv":"2607.27325","title":"Seesaw Cosmology","first":"Bernal","nauth":3,"year":2026,"cites":0,"role":"repl","note":"Co-authors of yours: Bernal, Zapata. Cites 1 network paper: [[1210691]]. Also cites widely used network papers: [[779828]], [[2817040]]. Closest of your papers: [[922002]] (coupling 0.04, 4 shared references). Closest network paper: [[3205155]] (coupling 0.07, 7 shared references).","score":38.4,"rank":2,"section":"replacement","parts":[0.51,0.14,0.21,1],"abstract":"We study perturbative reheating in which the inflaton transfers its energy to the Standard Model through right-handed neutrinos (RHNs) responsible for light-neutrino masses via the type-I seesaw mechanism. We refer to the resulting nonstandard thermal history as $seesaw$ $cosmology$. When produced relativistically and sufficiently long lived, the RHNs generate a characteristic sequence of inflaton, relativistic-RHN, nonrelativistic-RHN, and Standard Model radiation domination. We solve the Boltzmann system while retaining the production-time dependence of the nonthermal RHN distribution and its relativistic-to-nonrelativistic transition. The Standard Model temperature rapidly approaches a plateau during inflaton domination and subsequently scales as $a^{-1/4}$ and $a^{-3/8}$ during relativistic- and nonrelativistic-RHN domination, respectively. We investigate the implications of seesaw cosmology for dark-matter production. Direct production through inflaton decays can be enhanced relative to conventional reheating by a factor of order $m_φ/(2m_N)$, while ultraviolet freeze-in exhibits the critical temperature powers $p = 12$ and $20$, leading to potentially large contributions before the final radiation-dominated era. Seesaw cosmology therefore connects neutrino-mass generation, the pre-BBN thermal history and phenomena such as dark-matter production and baryogenesis.","authors":"Nicolás Bernal, Chee Sheng Fong, Óscar Zapata","nlinked":71,"nref":72,"src":"INSPIRE","html":true},{"id":"3217345","arxiv":"2610.29335","title":"Heavy Pseudo-Dirac Doublet Dark Matter and Non-Thermal Leptogenesis in Light of the LZ Event","first":"Ibe","nauth":2,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3201080]]. Closest of your papers: [[2855387]] (coupling 0.05, 5 shared references). Closest network paper: [[3201080]] (coupling 0.17, 12 shared references).","score":30.2,"rank":3,"section":"new","parts":[0.45,0.14,0.47,0.0],"abstract":"Motivated by the recent LZ candidate nuclear-recoil event, we study pseudo-Dirac electroweak doublet dark matter in the mass range $10^2$--$10^4\\,\\mathrm{TeV}$, where bounds from searches for neutrinos produced by dark matter annihilation in the Sun can be evaded. To suppress the excessive thermal relic abundance, we consider freeze-out during inflaton domination followed by entropy production during reheating. We examine whether this cosmological history can also accommodate non-thermal leptogenesis. Our analysis includes dark matter production through the emission of virtual electroweak gauge bosons in right-handed-neutrino decays and through thermalization cascades. Our estimates suggest that the two scenarios can be reconciled if dark matter pair emission in right-handed-neutrino decays is kinematically forbidden and cascade production is sufficiently suppressed. Such a realization, however, requires enhanced CP violation, typically involving fine-tuning in the seesaw mechanism or the right-handed-neutrino mass spectrum.","authors":"Masahiro Ibe, Jun Miyamoto","nlinked":96,"nref":98,"src":"INSPIRE","html":true},{"id":"3217259","arxiv":"2610.28744","title":"The renormalization-group running of neutrino mixing is undetectable","first":"Barenboim","nauth":3,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[1742302]]. Also cites widely used network papers: [[1362180]], [[2817040]]. Closest of your papers: [[1365306]] (coupling 0.02, 3 shared references). Closest network paper: [[649840]] (coupling 0.05, 16 shared references).","score":24.9,"rank":4,"section":"new","parts":[0.51,0.07,0.14,0.0],"abstract":"Quantum corrections make the parameters of a theory depend on an arbitrary renormalization scale, $μ$. The renormalization-group (RG) running of neutrino masses and mixing is a standard tool to relate models defined at a high mass scale to measured values. A growing body of work holds that the running is also directly observable: a neutrino produced or detected at momentum transfer $Q$ would carry the mixing matrix evaluated at $μ= Q$. Proposed signatures include flavor change at zero distance from the source, shifts in the measured CP-violation phase, and an anomalous flavor composition of high-energy astrophysical neutrinos. We show that this premise is incorrect. The mixing is a property of the neutrino itself, fixed by its self-energy on the mass shell, not by the process that produces or detects it. Setting $μ= Q$ is legitimate, but then large logarithms in the self-energy undo the running; the premise incorrectly drops them. Hence, apart from small vertex and box corrections, every experiment measures the same mixing: the running is undetectable. We illustrate this in the Minimal Supersymmetric Standard Model, two seesaw models, and the Standard Model effective field theory. Independently, short-baseline data already limit the change of any one mixing angle between pion decay and detection at $Q$ of a few GeV to below $0.7^\\circ$--$2.4^\\circ$.","authors":"Gabriela Barenboim, Mauricio Bustamante, Qinrui Liu","nlinked":141,"nref":150,"src":"INSPIRE","html":true},{"id":"3217255","arxiv":"2610.28790","title":"New CP-violating sources beyond the reach of EDMs","first":"Keus","nauth":1,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[1287034]]. Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1402978]] (coupling 0.03, 2 shared references). Closest network paper: [[1692605]] (coupling 0.03, 2 shared references).","score":23.9,"rank":5,"section":"new","parts":[0.48,0.09,0.08,0.0],"abstract":"The Standard Model does not contain sufficient amount of CP violation to account for the observed baryon asymmetry of the universe. Beyond Standard Model scenarios that aim to explain this asymmetry introduce new sources of CP violation, but these generically feed into electric dipole moments (EDMs), which are severely constrained by experiment. We indentify a new class of CP-violating sources that cannot generate EDMs directly: EDM operators are C conserving and P violating, whereas CP violation introduced here is, by construction, C violating and P conserving. We give a concrete model realisation accommodating such sources and discuss their relevance for baryogenesis.","authors":"Venus Keus","nlinked":61,"nref":76,"src":"INSPIRE","html":true},{"id":"3124274","arxiv":"2602.23915","title":"Impact of non-standard neutrino-electron interactions on Big Bang Nucleosynthesis","first":"Froustey","nauth":5,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[766759]]. Closest of your papers: [[1755250]] (coupling 0.02, 2 shared references). Closest network paper: [[766759]] (coupling 0.03, 2 shared references).","score":21.3,"rank":6,"section":"replacement","parts":[0.45,0.05,0.09,0.0],"abstract":"Neutrino non-standard interactions (NSI) with electrons, predicted in many extended theoretical models of particle physics, are known to alter the picture of neutrino decoupling from the cosmic plasma. We update previous analyses of neutrino decoupling in the presence of NSI with electrons, extending the parameter space and assessing their impact on the primordial light-element abundances produced during Big Bang Nucleosynthesis (BBN). We show that tracking the NSI-induced modifications of the neutrino distributions is necessary to accurately predict the helium-4 abundance, which cannot be derived from a pure $N_{\\rm eff}$-driven change. BBN therefore provides additional observables that are complementary to $N_{\\rm eff}$. We then derive cosmological constraints on non-universal and flavour-changing NSI parameters, using different dataset combinations, and compare them with bounds from terrestrial experiments. We find that the cosmological limits are significantly less stringent than the terrestrial ones, but they provide an independent probe of neutrino interactions in the early universe.","authors":"Julien Froustey, Stefano Gariazzo, Jaume Moncho, Sergio Pastor, Ofelia Pisanti","nlinked":51,"nref":51,"src":"INSPIRE","html":true},{"id":"3182189","arxiv":"2607.19323","title":"Towards anomaly detection searches for new physics signatures including Higgs bosons with weakly supervised machine learning","first":"Cheng","nauth":8,"year":2026,"cites":0,"role":"repl","note":"Also cites widely used network papers: [[902365]], [[651654]]. Closest of your papers: [[1455793]] (coupling 0.05, 6 shared references). Closest network paper: [[1674879]] (coupling 0.04, 4 shared references).","score":11.3,"rank":7,"section":"replacement","parts":[0.11,0.14,0.12,0.0],"abstract":"The Higgs boson, with its universal coupling to mass, provides a broadly applicable portal to sectors beyond the Standard Model and is therefore a natural anchor for anomaly detection (AD) at collider experiments. The Higgs And X Anomaly Detection (HAXAD) strategy offers a principled approach to searching for such anomalies occurring in association with a Higgs boson by combining machine-learning-based feature embedding, background estimation, and weakly supervised classification. This work extends the previous HAXAD approach towards the level of maturity required for application to recorded collider data. A major addition is the introduction and comparison of two new embedding strategies, which in turn shape the background estimation and classification. In addition, a new inference framework is developed, yielding signal-agnostic and signal-specific cross section limits and thereby completing the statistical machinery needed for future AD analyses built on HAXAD. The set of investigated signal models is also significantly expanded, allowing for the evaluation of sensitivity on a much broader phase space. Improvements to the method increase signal sensitivity with respect to the original method, and when benchmarked against an example cut-based search on the same final state, HAXAD matches or exceeds the best individual cut-based limits for a wide variety of considered signal models. These developments strengthen the case for HAXAD as a viable and compelling AD-based search strategy with novel discovery potential at colliders.","authors":"Chi Lung Cheng, Julia Gonski, Julie Khalilieh Romman, Runze Li, Qibin Liu, Benjamin Nachman, Dennis Noll, Liangyu Wu","nlinked":62,"nref":66,"src":"INSPIRE","html":true},{"id":"3217357","arxiv":"2610.29543","title":"Detectable Dark Matter Freeze-in via Low Reheating","first":"Alagappan","nauth":1,"year":2026,"cites":0,"role":"today","note":"Closest of your papers: [[2855387]] (coupling 0.07, 6 shared references). Closest network paper: [[1605577]] (coupling 0.06, 5 shared references).","score":10.1,"rank":8,"section":"new","parts":[0.0,0.22,0.16,0.0],"abstract":"This work focuses on freeze-in production of dark matter (DM) during low reheating, where the latter arises from the decay of inflatons leading to a non-adiabatic matter-dominated era. Under freeze-in, DM comoving yield is inversely proportional to Hubble, and during matter domination, as Hubble increases, the coupling, keeping the DM interaction with SM, should be enhanced to have relic density $Ω_{DM}\\simeq0.12$, making DM potentially vulnerable to direct detection searches. A renormalizable Yukawa-like Lagrangian is considered for DM interaction with a singlet electron $e$, and a BSM parent particle $P$. With the decay being the dominant freeze-in production channel, the required coupling enhancement is calculated with the aid of freeze-in Boltzmann equation. Dealing with freeze-in, the higher coupling could thermalize the feebly interacting particles, and this places an upper bound on coupling. The coupling has been found to be sensitive to the vacuum energy of the inflaton during the inflationary phase. Keeping this vacuum energy at the upper bound from {\\tt planck}, the model fails to feature any detectable direct detection signals even at a reheating temperature of BBN. The findings of this thesis then show that, only under low reheating and low inflationary vacuum energy, the DM-electron cross sections become high enough to be detectable in near-future direct detection searches. However, the proposed model becomes non-perturbative near the direct detection exclusion limits.","authors":"Sadayappan Alagappan","nlinked":49,"nref":76,"src":"INSPIRE","html":true},{"id":"1294681","arxiv":"1405.1259","title":"FIMP realization of the scotogenic model","first":"Molinaro","nauth":3,"year":2014,"cites":95,"role":"other","note":"","score":null},{"id":"1854224","arxiv":"2103.15328","title":"Phenomenology of the Zee model for Dirac neutrinos and general neutrino interactions","first":"Calle","nauth":3,"year":2021,"cites":6,"role":"seed","note":"","score":null},{"id":"1494411","arxiv":"1610.07922","title":"Handbook of LHC Higgs Cross Sections: 4. Deciphering the Nature of the Higgs Sector","first":"de Florian","nauth":376,"year":2016,"cites":2934,"role":"other","note":"","score":null},{"id":"651654","arxiv":"hep-ph/0406039","title":"R-parity violating supersymmetry","first":"Barbier","nauth":11,"year":2004,"cites":1554,"role":"other","note":"","score":null},{"id":"1615477","arxiv":"1708.03007","title":"Expanding the Reach of Heavy Neutrino Searches at the LHC","first":"Flórez","nauth":5,"year":2017,"cites":27,"role":"seed","note":"","score":null},{"id":"1397652","arxiv":"1510.03509","title":"Dark Matter and Gauge Coupling Unification in Non-SUSY SO(10) Grand Unified Models","fir 6,14,"c"],[14,46,"c"],[0,36,"c"],[31,21,"c"],[6,40,"k"],[2,30,"k"],[18,24,"c"],[16,30,"c"],[34,36,"c"],[1,46,"k"],[1,48,"c"],[43,24,"c"],[0,10,"c"],[17,14,"c"],[17,46,"c"],[22,45,"c"],[1,16,"k"],[0,20,"c"],[16,35,"c"],[0,16,"k"],[26,17,"c"],[16,23,"c"],[24,11,"c"],[15,36,"c"],[45,27,"c"],[0,24,"c"],[10,41,"c"],[4,33,"c"],[45,41,"c"],[20,14,"c"],[0,34,"k"],[32,23,"c"],[34,14,"c"],[24,47,"c"],[40,10,"c"],[16,8,"c"],[26,41,"c"],[45,46,"c"],[2,44,"k"],[6,45,"k"],[1,8,"k"],[37,33,"c"],[2,13,"k"],[30,24,"c"],[2,17,"k"],[18,30,"c"],[32,8,"c"],[35,41,"c"],[34,48,"c"],[1,24,"c"],[7,25,"k"],[34,47,"c"],[35,14,"c"],[34,27,"c"],[34,23,"c"],[18,17,"c"],[1,28,"k"],[6,29,"k"],[16,27,"c"],[43,36,"c"],[26,27,"c"],[21,17,"c"],[43,17,"c"],[37,38,"c"],[18,21,"c"],[16,41,"c"],[24,10,"c"],[4,35,"k"],[34,15,"c"],[24,48,"c"],[34,8,"c"],[40,23,"c"],[1,30,"k"],[45,17,"c"],[16,46,"c"],[27,46,"c"]],"next":[{"arxiv":"2606.31629","id":"3175104","title":"Ultralight dark matter mixed with primordial black holes","authors":"Xing-Yu Yang","score":8.0,"section":"replacement","rank":9,"parts":[0.0,0.17,0.15,0.0],"note":"Closest of your papers: [[2855387]] (coupling 0.05, 5 shared references). Closest network paper: [[2703113]] (coupling 0.05, 6 shared references).","abstract":"Dark matter candidates span many orders of magnitude in mass, from ultralight bosonic fields to massive compact objects. In this work, we connect these two extremes by investigating ultralight dark matter (ULDM) mixed with primordial black holes (PBHs). We study mixed ULDM-PBH halos by separating the continuum PBH contribution from the shot-noise fluctuation generated by discrete PBHs. The continuum contribution enters the averaged Schrödinger-Poisson background, while the discreteness contribution is treated as a perturbation that induces ULDM eigenmode transitions and soliton heating. The two contributions have distinct parametric dependencies: continuum effects scale with PBH fraction, whereas discreteness-driven transition rates scale with the product of PBH fraction and individual PBH mass in the perturbative regime. For a fiducial mixed halo with ULDM particle mass $10^{-22}\\,\\mathrm{eV}$, virial mass of order $10^{10}\\,M_{\\odot}$, and PBH fraction $1\\%$, the continuum PBH component modifies the background density, gravitational potential, and low-lying ULDM eigenvalues only at the sub-percent level. Nevertheless, this percent-level continuum PBH contribution produces a tens-of-percent response in the coherent soliton region, changing the radial mode participation by about $20\\%$. For stellar-mass PBHs, the discrete shot-noise fluctuation induces extremely slow ULDM mode transitions, with the fastest low-lying multiplet transition having a timescale of order $10^9\\,\\mathrm{Gyr}$ for solar-mass PBHs. In this regime, the leading PBH effect is the continuum contribution, while discrete PBH shot noise is dynamically negligible on galactic timescales."},{"arxiv":"2610.29541","id":"3217360","title":"Domain models of turbulent magnetic fields and the spectral shape of ensemble averaged axion-photon conversion","authors":"Oleksandr Khasai, Lidiia Zadorozhna, Denys Malyshev, Oleg Ruchayskiy","score":7.7,"section":"cross","rank":10,"parts":[0.0,0.13,0.21,0.0],"note":"Closest of your papers: [[1607572]] (coupling 0.05, 3 shared references). Closest network paper: [[1955022]] (coupling 0.07, 6 shared references).","abstract":"Axion-like particles are light pseudoscalars that appear in many extensions of the Standard Model and are candidates for dark matter. Through their mixing with photons, they imprint energy dependent modulations on the spectra of astrophysical sources shining through magnetised media. When a distant source shines through the turbulent magnetic field of an intervening galaxy cluster, these modulations are stochastic. It has recently been shown that averaging over an ensemble of such sources instead produces a smooth absorption-like feature. In this work we derive the analytic form of this ensemble averaged signal, previously known only numerically. We further relate the index $a$ of the magnetic field energy spectrum to the index $β$ of the domain size distribution that simulations use to describe the turbulent field. For $1<a<2$ the two indices obey the simple analytic relation $β=3-a$. Any distribution with $β<1$ instead mimics the spectral index $a=2$, which the sharp domain walls impose. For Kolmogorov turbulence, relevant for galaxy clusters, the relation gives $β=4/3$."},{"arxiv":"2610.29598","id":"3217379","title":"Electromagnetic multipoles of Majorana spin-3/2 dark matter particles and implications for direct detection","authors":"Alejandro Ibarra, Onur Yonar","score":7.4,"section":"new","rank":11,"parts":[0.0,0.14,0.17,0.0],"note":"Closest of your papers: [[2855387]] (coupling 0.04, 3 shared references). Closest network paper: [[1413755]] (coupling 0.06, 3 shared references).","abstract":"We investigate the electromagnetic interactions of Majorana spin-3/2 dark matter and their implications for direct detection experiments. We derive model independent constraints on the three electromagnetic multipole moments of the spin-3/2 dark matter allowed by the gauge and Lorentz-invariances from the non-observation of dark matter induced nuclear recoils in direct detection experiments. We then calculate the expected values of the multipole moments in two concrete particle physics scenarios: the gravitino in supergravity models, and a simplified model where a spin-3/2 particle interacts with an electrically charged spin-1/2 fermion and a vector boson."},{"arxiv":"2608.24332","id":"3195678","title":"Exclusive Determination of $|V_{cb}|$ from Semileptonic Decays $B\\to D^{(*)}\\ell ν_{\\ell}$","authors":"Xue-Wen Chen, Bo-Yan Cui, Jia-Wei Zhang, Xue-Chen Zhao, Ya-Hui Chen","score":7.2,"section":"replacement","rank":12,"parts":[0.0,0.12,0.2,0.0],"note":"Closest of your papers: [[1671831]] (coupling 0.05, 6 shared references). Closest network paper: [[1685084]] (coupling 0.07, 11 shared references).","abstract":"We present an updated exclusive determination of the CKM matrix element \\(|V_{cb}|\\) from the semileptonic decays \\(B\\to D^{(*)}\\ell\\barν_{\\ell}\\). Our analysis combines the latest Belle II measurements, updated lattice-QCD calculations of the \\(B\\to D^{(*)}\\) form factors at small hadronic recoil, and correlated large-recoil SCET sum-rule predictions incorporating next-to-leading-order QCD corrections and several power-suppressed contributions. We consider three fit scenarios with progressively enlarged input sets and find that the inclusion of the large-recoil sum-rule constraints substantially reduces the form-factor uncertainties. From the full global fit, we obtain\\(|V_{cb}|=(39.18 \\pm0.47)\\times10^{-3}\\). Using the combined lattice-QCD and LCSR fit, we predict \\(R(D)=0.3069\\pm0.0080,\\qquad R(D^*)=0.2548\\pm0.0043\\), and provide differential decay distributions in the momentum transfer and angular variables for both the muon and tau channels. Comparisons of the individual and correlated predictions for \\(R(D)\\) and \\(R(D^*)\\) with the experimental averages reveal a persistent tension. In particular, our theoretical 68\\% confidence region shows little overlap with the experimental average. All correlations among the fitted parameters are retained in the uncertainty propagation. Our results therefore provide updated Standard Model benchmarks for tests of lepton-flavor universality. Improved lattice-QCD calculations, sum-rule predictions, and Belle II measurements will be essential for determining whether the remaining discrepancies originate from theoretical systematic uncertainties or from physics beyond the Standard Model."},{"arxiv":"2610.29678","id":"3217369","title":"Lorentz-Equivariant Geometric Algebra Transformers for Top-Quark Event Reconstruction","authors":"E. Abasov, L. Dudko, A. Markina, M. Perfilov, P. Volkov, G. Vorotnikov, A. Zaborenko","score":7.1,"section":"new","rank":13,"parts":[0.0,0.14,0.13,0.0],"note":"Closest of your papers: [[1615477]] (coupling 0.05, 1 shared references). Closest network paper: [[1499879]] (coupling 0.05, 1 shared references).","abstract":"Results are presented for Lorentz-equivariant geometric algebra transformers (LGaTr) in three event reconstruction tasks involving top quarks. Geometric algebra provides a common Lorentz-covariant representation of four-momenta and typed physical objects. Performance of LGaTr is evaluated on three different physics tasks - $t\\bar{t}/tWb$ separation, FCNC detection in single top-quark production and universal event reconstruction. LGaTr is outperforming the baseline networks in $tW/t\\bar{t}$ separation and full event reconstruction and is showing comparable or better performance to standard transformer-based networks. The implementation is provided in a companion repository https://github.com/emil2001/top-quark-universal-nets."},{"arxiv":"2610.29181","id":"3217325","title":"Next-to-leading-order QCD corrections to the radiative decays $χ_{bJ}\\to J/ψ+γ$","authors":"Yu-Dong Zhang, Zai-Fu Jiang","score":7.0,"section":"new","rank":14,"parts":[0.06,0.1,0.07,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2855387]] (coupling 0.03, 3 shared references). Closest network paper: [[1667059]] (coupling 0.03, 1 shared references).","abstract":"Within nonrelativistic QCD (NRQCD) factorization, we calculate the next-to-leading-order (NLO) QCD corrections to $χ_{bJ}\\to J/ψ+γ$ with $J=0,1,2$. We determine all six independent helicity amplitudes, including the one-loop corrections to the QED amplitude and the two-loop corrections to the QCD amplitude, and retain the interference between the QED and QCD amplitudes in the decay widths. The NLO corrections substantially enhance the $χ_{b0}$ and $χ_{b1}$ decay widths, while reducing the $χ_{b2}$ decay width by approximately $36\\%$. Including the QED amplitude leads to sizable destructive interference for $χ_{b0}$ and an enhancement for $χ_{b2}$, but has only a small effect on the $χ_{b1}$ decay width. Two treatments of photon fragmentation, based on the NRQCD matrix element and the experimentally determined $J/ψ$ decay constant, yield NLO unpolarized decay widths that agree at the few percent level or better. Using the decay constant scheme at $μ_R=m_b$, we obtain NLO central branching fractions of $1.03\\times10^{-6}$, $1.45\\times10^{-5}$, and $1.99\\times10^{-6}$ for the three channels, respectively. The NLO corrections reduce the renormalization scale dependence, particularly for $χ_{b2}$, although a sizable dependence remains for $χ_{b0}$. At fixed $m_b$, the branching fractions decrease with increasing $r=m_c/m_b$, more strongly for $χ_{b1}$ and $χ_{b2}$ than for $χ_{b0}$. For $pp$ collisions at $\\sqrt{s}=14\\,{\\rm TeV}$ and an integrated luminosity of $100\\,{\\rm fb}^{-1}$, we estimate about $1.9\\times10^4$ and $4.8\\times10^4$ $\\ell^+\\ell^-γ$ events from $χ_{b0}$ and $χ_{b2}$ decays, respectively. Measurements with the existing Belle $Υ(2S)$ sample remain challenging because of the small expected yields. A larger $Υ(2S)$ sample at Belle II would improve the prospects for observing these radiative decays."},{"arxiv":"2610.19256","id":"3215063","title":"Bottom-Charm $[bc]$ Diquark Masses from QCD Laplace Sum-Rules","authors":"T. de Oliveira, D. Harnett, J. Ho, R. T. Kleiv, Siyuan Li, N. Loewen, A. Palameta, T. G. Steele","score":6.3,"section":"replacement","rank":15,"parts":[0.06,0.09,0.05,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2855387]] (coupling 0.04, 4 shared references). Closest network paper: [[2817040]] (coupling 0.02, 24 shared references).","abstract":"Constituent mass predictions for bottom-charm $[bc]$ color-antitriplet diquarks are generated using QCD Laplace sum rules. We calculate the diquark correlator within the operator product expansion to next-to-leading-order (NLO), including terms proportional to the four- and six-dimensional gluon and six-dimensional quark condensates. Existing analytic expressions for the resulting multi-scale master integrals are insufficient for these calculations, so we utilize numerical $D$-dimensional loop integration techniques. The sum rule analyses stabilize in all four channels yielding constituent masses in GeV of: scalar ($0^+$) $(5.60\\pm0.56)$, pseudoscalar ($0^-$) $(6.04\\pm0.60)$, axial vector ($1^+$) $(5.60\\pm0.56)$ and vector ($1^-$) $(5.99\\pm0.60)$. These constituent mass results are discussed in comparison with values used in diquark models of tetraquark hadronic states. We also summarize QCD sum rule predictions for diquark masses for all possible quark-flavor combinations, providing QCD-based criteria for assessing the diquark mass parameters used in constituent diquark models of hadrons."},{"arxiv":"2610.29978","id":"3217463","title":"String phenomenology from the landscape","authors":"Howard Baer, Vernon Barger, Shadman Salam, Kairui Zhang","score":5.9,"section":"new","rank":16,"parts":[0.0,0.11,0.14,0.0],"note":"Closest of your papers: [[770422]] (coupling 0.04, 3 shared references). Closest network paper: [[707996]] (coupling 0.05, 14 shared references).","abstract":"SUSY breaking trilinear terms, known as A-terms, play a key role in supersymmetric phenomenology in that 1. large weak scale values help boost the light Higgs boson mass m_h -> 125 GeV and 2. the same large negative values {\\it decrease} the top-squark contributions to the weak scale, thus making the theory more natural. Their renormalization group evolution also plays a key role in the string landscape in that large values can drive top-squark soft terms to tachyonic values leading to charge-and-color breaking (CCB) minima in the scalar potential. Adjacent to these CCB regions is where m_h -> 125 GeV and where natural parameter space can be found. This is an example of {\\it living dangerously} on the landscape where the draw to large soft terms stops just short of catastrophic minima, but where nature is natural with a Higgs mass near its measured value. In a final panoramic view, we compare the reach of HL-LHC for landscape SUSY via several prominent signatures in the higgsino vs. gaugino mass parameter space for the case of decoupled first/second generation scalars."},{"arxiv":"2607.16904","id":"3181800","title":"The muon collider: expected physics, technological challenges, and the prospects for reusing the 21 km UNK tunnel","authors":"L. V. Dudko","score":5.6,"section":"replacement","rank":17,"parts":[0.0,0.02,0.33,0.0],"note":"Closest of your papers: [[2690106]] (coupling 0.01, 1 shared references). Closest network paper: [[2665284]] (coupling 0.12, 10 shared references).","abstract":"A multi-TeV muon collider is among the main options for the post-LHC energy frontier. Muons radiate about 10^9 times less synchrotron power than electrons of the same energy, so a compact circular collider could combine the energy reach of a 100 TeV-class proton machine with the clean final states of a lepton collider. This review summarizes the expected physics programme, including Higgs couplings and self-coupling, electroweak and top-quark physics, and searches beyond the Standard Model. It also describes the technological challenges: muon production, ionization cooling, rapid acceleration, high-field HTS magnets, the machine-detector interface and the neutrino-flux constraint. None of these technologies has yet been demonstrated at the required performance. Scaling the parameters of the International Muon Collider Collaboration (IMCC), the review examines three ways of reusing the existing 21 km UNK tunnel near Protvino. With the last rapid-cycling synchrotron in the tunnel, the centre-of-mass energy is limited to about 6 TeV. With the collider ring in the tunnel, 11-16 T dipoles give about 14-21 TeV, but the acceleration chain needs a separate 50-73 km tunnel. With both in the tunnel, the reach is about 6-10 TeV at 35-57% of the target luminosity. Non-collider applications of intense muon beams are also discussed."},{"arxiv":"2610.20940","id":"3215507","title":"CT25: the new generation of CTEQ-TEA PDFs","authors":"Alim Ablat, Daniel Adamiak, Aurore Courtoy, Sayipjamal Dulat, Yao Fu, Marco Guzzi, T. J. Hobbs, Joey Huston, Maximiliano Ponce Chavez, Kirtimaan Mohan, Pavel Nadolsky, Tanishq Sharma, Dan Stump, Keping Xie, C. -P. Yuan","score":5.5,"section":"replacement","rank":18,"parts":[0.06,0.05,0.09,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1397629]] (coupling 0.02, 1 shared references). Closest network paper: [[3094526]] (coupling 0.03, 2 shared references).","abstract":"This contribution reviews CT25, a new generation of CTEQ--TEA parton distribution functions (PDFs) for precision QCD. With its first member sets released in 2025, the CT25 family addresses common uses of parton distributions in diverse contexts. We describe the CTEQ--TEA Parton Cloud, an online database of exploratory global fits to precision QCD measurements, from which we select PDF solutions for general- and special-purpose calculations. These solutions are published as complementary error PDF ensembles---the baseline CT25, CT25m, CT25pd, and ensembles with conservative priors---optimized for distinct uses. They implement new approaches to quantifying uncertainties and different treatments of theoretical, parametrization, and nuclear-target uncertainties. In particular, they provide complementary frameworks for exploring PDF uncertainties at large partonic momentum fractions relevant to HL-LHC and EIC studies. Further details will appear in the forthcoming CT25 publication."},{"arxiv":"2610.29069","id":"3217320","title":"Low Primordial Helium as a Probe of Non-Unitary Neutrino Mixing","authors":"Shu-Yuan Guo, Jia-Qi Li","score":5.0,"section":"new","rank":19,"parts":[0.06,0.05,0.06,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2855387]] (coupling 0.02, 2 shared references). Closest network paper: [[3205155]] (coupling 0.02, 2 shared references).","abstract":"The EMPRESS collaboration has reported a primordial helium mass fraction \\(Y_P = 0.2402 \\pm 0.0040\\), which lies more than \\(1σ\\) below the standard Big Bang Nucleosynthesis prediction. Combined with the deuterium abundance and the Planck baryon density, this corresponds to a mild \\(\\sim 2σ\\) tension with the standard value of the effective number of relativistic species, or to a \\(\\sim 2σ\\) indication of a non-zero electron-neutrino degeneracy. We show that it can be explained by non-unitary three-neutrino mixing, a generic feature of seesaw extensions of the Standard Model. Non-unitarity makes the Fermi constant in beta decay exceed that in muon decay, enhancing the neutron-to-proton conversion rate and lowering \\(Y_P\\). A full numerical BBN calculation, combined with the EMPRESS \\(Y_P\\) determination and the deuterium abundance gives the best fit point at \\(α_{22}=0.982\\), while the standard values \\(N_{\\mathrm{eff}}=3.044\\), \\(ξ_e=0\\) remain allowed; the required level of non-unitarity is consistent with current experimental constraints."},{"arxiv":"2610.28742","id":"3217273","title":"Radiative corrections to double-$β$ decay and their impact on experimental analyses","authors":"Jordy de Vries, Emanuele Mereghetti, Saad el Morabit, Stefan Sandner","score":4.4,"section":"new","rank":20,"parts":[0.06,0.03,0.06,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1746620]] (coupling 0.01, 1 shared references). Closest network paper: [[1847652]] (coupling 0.02, 2 shared references).","abstract":"We present a comprehensive study of the $\\mathcal{O}(α)$ radiative corrections to two-neutrino and neutrinoless double-$β$ decay within a heavy-nucleus effective field theory. We compute all virtual and real-emission corrections for intermediate nuclear states of arbitrary excitation energy, including new closed-form expressions for the required one-loop integrals with heavy-nucleus propagators. For excitation energies large compared with the lepton energies, the corrections factorize into the tree-level rate times a universal double-weak Sirlin function, which differs substantially from the sum of two single-$β$ Sirlin functions used so far in the literature. We discuss the impact of the radiative corrections on the analysis of measured spectra in terms of ratios of nuclear matrix elements, $ξ_{31}$, and show that neglecting radiative corrections can significantly bias the extraction. Real-photon emission, not considered in previous analyses, plays a central role and the impact of radiative corrections depends crucially on the detector setup. We provide the photon spectrum, fully differential in the photon energy and direction, and recommend that experiments simulate the photon explicitly. For $0νββ$ decay, the radiative corrections increase the inclusive rate by about $5\\%$, independently of the nuclear matrix elements or the neutrino Majorana mass."},{"arxiv":"2610.29354","id":"3217344","title":"$B_{sJ}(6114)$ as a Higher-Partial-Wave $\\bar{K}^{*}B^{(*)}$ Molecular Candidate","authors":"Shiquan Zhang, Dan Jiang, Yin Huang","score":4.2,"section":"new","rank":21,"parts":[0.06,0.02,0.07,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2690106]] (coupling 0.01, 1 shared references). Closest network paper: [[1710056]] (coupling 0.02, 7 shared references).","abstract":"In 2021, the LHCb Collaboration observed the $B_{sJ}(6114)$ state in the $B^\\pm K^\\mp$ invariant mass spectrum. It is currently the highest-mass bottom-strange state listed by the Particle Data Group (PDG). However, its spin-parity quantum numbers have not yet been experimentally determined, and its internal structure remains under debate. Although several quark-model interpretations have been proposed, including the $1^3D_1$ state and a member of the $1D(2^-,3^-)$ doublet, the possibility of a hadronic molecular structure for this state has not yet been systematically investigated. We investigate the possibility of interpreting \\(B_{sJ}(6114)\\) as a \\(B^{(*)}\\bar{K}^{*}\\) molecular state within the one-boson-exchange model. By solving the Schrödinger equation using the Gaussian expansion method, we study the bound-state properties with different spin-parity assignments, taking into account partial-wave mixing and coupled-channel effects. We further calculate the strong decay widths into the allowed \\(B^{(*)}\\bar{K}\\) channels and compare them with the experimental data. Our results show that the mass spectrum alone cannot uniquely determine the spin-parity of \\(B_{sJ}(6114)\\). However, the decay-width analysis disfavors the \\(J^P=0^+\\), \\(0^-\\), \\(1^+\\), \\(2^+\\), and \\(3^-\\) assignments, while the \\(J^P=1^-\\), \\(2^-\\), and \\(3^+\\) configurations remain compatible with the experimental constraints. Among these possibilities, the \\(J^P=1^-\\) assignment provides the best agreement with the measured decay width. These findings suggest that \\(B_{sJ}(6114)\\) may be a higher-partial-wave \\(B^{(*)}\\bar{K}^{*}\\) molecular state."},{"arxiv":"2610.28704","id":"3217242","title":"Gauge Field Fluctuations Protect the Higgs Vacuum When a Small Universe Begins","authors":"Alan Zhang","score":4.1,"section":"new","rank":22,"parts":[0.0,0.04,0.18,0.0],"note":"Closest of your papers: [[2080612]] (coupling 0.02, 1 shared references). Closest network paper: [[1724445]] (coupling 0.06, 4 shared references).","abstract":"The Standard Model Higgs quartic coupling $λ$ turns negative at high energies. We show that in a small periodic box with antiperiodic fermions, zero-point fluctuations of the constant gauge modes turn the Higgs zero mode into a resonance for $λ<0$, whose width falls exponentially in $|λ|^{-1/2}$. A box lasting $N$ light-crossing times keeps its vacuum with probability above $1/2$ for $λ>λ_c(N)$, which depends on $N$ only logarithmically. For a universe that begins at a Casimir turning point, $λ_c\\approx-0.012$ lies below the Standard Model value $-0.0098$; given a curvature coupling $ξ_H\\gtrsim0.08$, survival has probability above $1/2$ for $m_t<172.96$ GeV and $\\approx0.7$ for current data, and FCC-ee can exclude this beginning if $m_t\\gtrsim173.7$ GeV."},{"arxiv":"2608.03374","id":"3187257","title":"On the nature of fully-charmed four-quark exotic state $X(6900)$ from its photoproduction off nuclei","authors":"E. Ya. Paryev","score":4.1,"section":"replacement","rank":23,"parts":[0.06,0.02,0.08,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2690106]] (coupling 0.01, 1 shared references). Closest network paper: [[1710056]] (coupling 0.03, 13 shared references).","abstract":"The possibility to study the nature of fully-charmed tetraquark state $X(6900)$ from its inclusive photoproduction off nuclei near the kinematic threshold is investigated within the collision model based on the nuclear spectral function. The model accounts for $X(6900)$ production in direct photon--nucleon interactions as well as three different scenarios for its internal structure: compact tetraquark, molecule of the two hidden-charm $J/ψ$ and $ψ(3770)$ mesons and the mixture of both of them. We calculate within these scenarios the absolute and relative excitation functions on $^{12}$C and $^{184}$W nuclei at near-threshold photon energies of 30--40 GeV, the absolute momentum differential cross sections and ratios of them for the $X(6900)$ meson production off these target nuclei at laboratory polar angles of 0$^{\\circ}$--5$^{\\circ}$ and for photon energy of 35 GeV as well as the A-dependences of its transparency ratios at photon energy of 35 GeV. We show that these observables reveal a definite sensitivity to the $X(6900)$ intrinsic structure. Therefore, they might be useful for the determination of this structure from the comparison of them with the experimental data from the future experiments at the upcoming experimental facilities, such as the planned electron-ion colliders in the United States and China."},{"arxiv":"2610.28729","id":"3217270","title":"Cosmological vacuum selection in dynamical symmetry breaking at zero vacuum energy","authors":"Mateusz Duch, Alessandro Strumia","score":3.7,"section":"new","rank":24,"parts":[0.0,0.06,0.11,0.0],"note":"Closest of your papers: [[1854224]] (coupling 0.02, 1 shared references). Closest network paper: [[1589459]] (coupling 0.04, 2 shared references).","abstract":"Coleman-Weinberg models invoke classical scale invariance to forbid scalar masses, but then add a dimensionful constant to cancel the vacuum energy of the broken vacuum. This inconsistency is avoided by special quantum potentials, whose symmetry-breaking vacuum is degenerate with the symmetric one. We compute which vacuum is selected by the thermal history of the universe. While a neutral thermal plasma favours the symmetric phase, a sufficiently large conserved charge asymmetry supports a rotating scalar condensate that evolves toward the broken vacuum as the universe cools, and survives fragmentation."},{"arxiv":"2606.01768","id":"3164237","title":"Semileptonic Decays of $Λ\\to p \\ell^{-} \\barν_{\\ell}$ in the Light-Front Dynamics","authors":"Chong-Chung Lih, Chao-Qiang Geng","score":3.7,"section":"replacement","rank":25,"parts":[0.06,0.03,0.03,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2690106]] (coupling 0.01, 1 shared references). Closest network paper: [[3205155]] (coupling 0.01, 1 shared references).","abstract":"We investigate the exclusive semileptonic decays of $Λ\\to p \\ell^{-} \\barν_{\\ell}~(\\ell=e,μ)$ within the Standard Model using the light-front quark model. The transition form factor behaviors of $Λ\\to p$ are obtained from the effective treatment of nonvalence contributions in addition to the valence ones in the Drell-Yan-West frame due to the Bethe-Salpeter formalism. Based on these form factors, we obtain that the branching ratios of $Λ\\to p e^{-} \\barν_{e}$ and $p μ^{-} \\barν_μ$, including nonvalence contributions, are around $8.32\\times 10^{-4}$ and $1.31\\times 10^{-4}$, which are consistent with the latest measurements from the BESIII Collaboration, respectively. Our results indicate that nonvalence contributions can play a non-negligible role in the semileptonic baryon decays within the light-front framework."},{"arxiv":"2610.12208","id":"3213071","title":"Evidence for Normal Neutrino Ordering with Combined Atmospheric Neutrino Experiments","authors":"Miaochen Jin, Carlos A. Argüelles, Pablo Fernández-Menéndez, Iván Martínez-Soler","score":3.7,"section":"replacement","rank":26,"parts":[0.0,0.06,0.1,0.0],"note":"Closest of your papers: [[1854224]] (coupling 0.02, 3 shared references). Closest network paper: [[2762216]] (coupling 0.04, 10 shared references).","abstract":"We present a combined analysis of the latest publicly available atmospheric neutrino data from Super-Kamiokande including all data-taking stages previous to the gadolinium phase, IceCube-DeepCore, and the six-detection-unit configuration of KM3NeT/ORCA. Our fit uses all event samples simultaneously and treats the systematic uncertainties shared among experiments as fully correlated, while detector-response uncertainties are modeled independently for each experiment. The combined data constrain the atmospheric oscillation parameters to $Δm^2_{31} = 2.44^{+0.06}_{-0.04} \\times 10^{-3}\\,\\mathrm{eV}^2$ and $\\sin^2θ_{23} = 0.52^{+0.03}_{-0.04}$, with a precision of $2.2\\%$ and $6.1\\%$, respectively, which is competitive with current accelerator-based measurements, and independently constrain the $CP$-violating phase to $δ_{CP} = 1.30^{+0.24}_{-0.28}~π$. Finally, comparing the orderings of the neutrino mass spectrum, we find a preference for the normal ordering with $Δχ^2 = 11.0$; further calibrated with pseudoexperiments, we exclude the inverted ordering at $99.95\\%$ confidence level ($3.3σ$). In a joint fit including 207 days of JUNO data, we further exclude the inverted ordering at $Δχ^2 = 15.1$, corresponding to $3.9 σ$."},{"arxiv":"2610.30106","id":"3217465","title":"On Particle Production from Bubble Collisions in the Non-runaway Regime","authors":"Fayez Abu-Ajamieh, Amine Ahriche, Sagar Modak, Nobuchika Okada","score":3.5,"section":"new","rank":27,"parts":[0.0,0.05,0.12,0.0],"note":"Closest of your papers: [[2080612]] (coupling 0.02, 2 shared references). Closest network paper: [[2780204]] (coupling 0.04, 2 shared references).","abstract":"Particle production from bubble collisions during First-Order Phase Transitions (FOPTs) has been studied as an efficient mechanism for baryogenesis and dark matter production, but existing semi-analytical treatments assume runaway bubbles with wall velocity $v_w\\to 1$. We generalize this treatment to arbitrary $v_w< 1$, relevant for scenarios such as electroweak baryogenesis and transitions with significant wall friction. We first extend the analytical trapping-equation approach to finite-thickness boosted kink profiles for both elastic and inelastic collisions, then go beyond this by numerically solving the full Klein-Gordon equation without assuming $SO(1,1)$ symmetry or thin walls, across a broad grid of $v_w$ and potential shapes. We find the analytical generalization underestimates the true efficiency factor by orders of magnitude away from $v_w\\to 1$, and provide new semi-analytic fit functions consisting of a power-law continuum plus a resonance peak, which reproduce the main spectral features of the numerical results across the parameter range studied. Applying these to a toy dark sector model, we show particle production is strongly suppressed as $v_w$ decreases from unity, enhanced for lighter produced particles, and that the relative contribution from the oscillatory peak differs from prior runaway-regime estimates. We also discuss limitations of the trapping equation and the off-shell effective-action truncation underlying this formalism."},{"arxiv":"2609.13438","id":"3203037","title":"Semi-visible Jets from Sneaky Dark Matter","authors":"Deepak Kar, Christiane Scherb, Pedro Schwaller, Sukanya Sinha","score":3.5,"section":"replacement","rank":28,"parts":[0.0,0.08,0.04,0.0],"note":"Closest of your papers: [[796080]] (coupling 0.03, 1 shared references). Closest network paper: [[2815960]] (coupling 0.02, 2 shared references).","abstract":"In this paper, we compare two different ways of generating semi-visible jet signature in non-resonant production mode, and flag the potential advantages of the new generation approach we propose. In addition, we suggest a more efficient matrix element to parton shower matching configuration for this hadronic final state signature. Finally, we perform a reinterpretation study of the ATLAS search for t-channel semi-visible jet production and obtain collider limits on the sneaky DM scenario."}],"refs":{"1605577":{"first":"Borah","year":2017,"nauth":2,"title":"New viable region of an inert Higgs doublet dark matter model with scotogenic extension","role":"other"},"770422":{"first":"de Campos","year":2007,"nauth":7,"title":"Probing bilinear R-parity violating supergravity at the LHC","role":"seed"},"1710056":{"first":"Cerri","year":2018,"nauth":303,"title":"Report from Working Group 4","role":"other"},"1755250":{"first":"Calle","year":2019,"nauth":3,"title":"Dirac neutrino mass generation from a Majorana messenger","role":"seed"},"1692605":{"first":"Gaviria","year":2018,"nauth":3,"title":"Charged lepton flavor violation and electric dipole moments in the inert Zee model","role":"other"},"922002":{"first":"Nardi","year":2011,"nauth":3,"title":"Neutrino Masses in $SU(5)\\Times U(1)_F$ with Adjoint Flavons","role":"seed"},"1955022":{"first":"Carvajal","year":202 function draw(){

  d3.forceSimulation(sim).force('x',d3.forceX(s=>xf(s.n)).strength(1)).force('y',d3.forceY(cy).strength(.04))
