<script>
const RAW = {"n":[{"id":"3218395","arxiv":"2610.31770","title":"Flavored $S_{3}$ Non-Minimal Left-Right Symmetric Model","first":"Gonzalez-Canales","nauth":2,"year":2026,"cites":0,"role":"today","note":"Cites 2 network papers: [[1493855]], [[649548]]. Closest of your papers: [[2690106]] (coupling 0.02, 6 shared references). Closest network paper: [[1634858]] (coupling 0.06, 21 shared references).","score":33.2,"rank":1,"section":"new","parts":[0.7,0.08,0.18,0.0],"abstract":"In this work we investigate fermion masses and flavor mixings in a non-minimal left-right symmetric model endowed with the non-Abelian discrete symmetry $S_3$. The scalar sector contains three Higgs bidoublets, while one left-handed and one right-handed triplet generate Majorana neutrino masses. Assigning the first two fermion families to an $S_3$ doublet and the third family to a singlet, together with a specific alignment of the bidoublet vacuum expectation values, leads to a common and analytically tractable structure for the fermion mass matrices. We study both the pseudomanifest and manifest left-right realizations, in which the fermion mass matrices are complex symmetric and Hermitian, respectively, and derive analytical expressions for the left- and right-handed CKM and PMNS mixing matrices. A numerical likelihood test shows that the model successfully reproduces the observed quark and lepton mixing patterns for both normal and inverted neutrino mass orderings at the level of oscillation data. Remarkably, the manifest scenario emerges as a more restrictive realization of the pseudomanifest one, with the main distinction residing in their CP-phase structure. We further explore the phenomenological consequences for the neutrinoless double-beta decay, the muon anomalous magnetic moment, and the lepton-flavor-violating decay $μ\\to eγ$. The right-handed contribution exhibits the characteristic dependence on the heavy-neutrino and $W_R$ mass scales, while flavor corrections are found to be subleading over most of the allowed parameter space. These results show that an $S_3$ flavor symmetry can simultaneously organize fermion mixing and lead to distinctive low-energy signatures within left-right symmetric theories.","authors":"F. Gonzalez-Canales, Juan Carlos Gómez-Izquierdo","nlinked":98,"nref":109,"src":"INSPIRE","html":true},{"id":"3200948","arxiv":"2609.06750","title":"GUT-induced collider signatures of the LUX-ZEPLIN event","first":"Kotlarski","nauth":3,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[1704332]]. Closest of your papers: [[1746620]] (coupling 0.03, 5 shared references). Closest network paper: [[3201080]] (coupling 0.26, 17 shared references).","score":32.9,"rank":2,"section":"replacement","parts":[0.45,0.1,0.75,0.0],"abstract":"The recent observation of an event with large recoil energy at LUX-ZEPLIN (LZ) has found a possible explanation in terms of the inelastic scattering of a pseudo-Dirac particle, for example, the Higgsino of the MSSM. For pseudo-Dirac dark matter, the mass splitting $δm$ is correlated with the mass of some heavier states. While in the MSSM rough dimensional considerations seem to indicate mass ranges of these heavy particles hopelessly out of reach even at future colliders, we point out that this is not the case in GUT-induced scenarios, with or without supersymmetry. Working in a non-supersymmetric model based on SU(6), we show that the experimentally favored $δm$ implies the presence of a $Z'$ gauge boson with a mass of several TeVs. We derive the predicted $Z'$ signal in the dilepton channel and we confront it with the sensitivity of the HL-LHC and the FCC-$hh$ to $Z'$ resonances. We show that the $Z'$ falls squarely in reach of the discovery potential of both experiments.","authors":"Wojciech Kotlarski, Kamila Kowalska, Enrico Maria Sessolo","nlinked":71,"nref":73,"src":"INSPIRE","html":true},{"id":"3218470","arxiv":"2610.32747","title":"Heavy Sterile Fermions from the Atmosphere: LZ Limits on Neutrino Up-Scattering","first":"Sierra","nauth":4,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3201080]]. Closest network paper: [[3201080]] (coupling 0.16, 11 shared references).","score":24.7,"rank":3,"section":"new","parts":[0.45,0.0,0.44,0.0],"abstract":"The LUX-ZEPLIN (LZ) experiment has recently reported data extending to nuclear-recoil energies of about 270 keV, including a single event at 248 keV in a nearly background-free region, for an exposure of 2.84 tonne-years. We examine this dataset through neutrino up-scattering to a heavy sterile fermion induced by atmospheric neutrinos, mediated by vector, axial-vector, scalar and dipole interactions. Our main result is a set of constraints: using the part of the LZ data where no excess is observed, we obtain new bounds on all four scenarios that probe regions of parameter space not tested before, and show that dark matter detectors can provide competitive limits on neutrino up-scattering for sterile fermion masses above $\\sim 50$ MeV. We also test whether the 248~keV event can be explained in this way while remaining consistent with the absence of events at lower recoil energies. For the scalar, vector and axial mediators this requires couplings at the edge of perturbativity, while the dipole does not provide a good fit, so we conclude that up-scattering is not a compelling explanation of the event.","authors":"D. Aristizabal Sierra, V. De Romeri, D. K. Papoulias, I. M. Shoemaker","nlinked":78,"nref":81,"src":"INSPIRE","html":true},{"id":"3218419","arxiv":"2610.32091","title":"Coherent axion electrodynamics in OSIRIS: a counter-propagating axion-photon parametric instability","first":"Radford","nauth":7,"year":2026,"cites":0,"role":"today","note":"Closest of your papers: [[1607572]] (coupling 0.10, 4 shared references). Closest network paper: [[1955022]] (coupling 0.14, 8 shared references).","score":15.0,"rank":4,"section":"cross","parts":[0.0,0.26,0.39,0.0],"abstract":"We present a coherent axion-electrodynamics extension of the OSIRIS particle-in-cell code and use it to identify and benchmark a parametric axion-photon instability supported by two equal counter-propagating electromagnetic pumps. The module evolves a cell-centered axion field together with a separately stored first-order electromagnetic response on the native staggered OSIRIS grid. Re-examining the previously proposed strictly co-linear branch shows that it is removed when the axion-Maxwell equations are reduced consistently. A closely related standing-wave geometry, however, supports a distinct Floquet instability. We derive the coupled Floquet problem for an equal-amplitude counter-propagating pump pair and obtain a reduced analytic growth rate and cutoff for the dominant long-wavelength envelope branch. For an axion mass-to-pump-frequency ratio of 0.06 and a per-beam vector-potential amplitude of 0.3, simulations at coupling strengths of 0.60, 0.80, and 1.00 reproduce both the growth-rate spectrum and the coupling-dependent instability boundary. The reduced theory predicts envelope-mode cutoffs of 8.44, 10.80, and 13.23, while OSIRIS finds exponential growth through modes 8, 10, and 13, respectively, with the next resolved modes stable. The electromagnetic diagnostics additionally resolve exponentially growing sidebands at twice the pump wavenumber, while the zero-wavenumber electric component exhibits no sustained growth, as expected for the unstable Floquet eigenvector. The agreement provides an end-to-end benchmark of the coherent axion-electromagnetic coupling and demonstrates that parametric growth of the axion field is present in a two-beam pump geometry.","authors":"Miles Radford, Pablo Bilbao, Thomas Grismayer, Luis Silva, Robert Bingham, Subir Sarkar, Gianluca Gregori","nlinked":21,"nref":28,"src":"INSPIRE","html":true},{"id":"3218505","arxiv":"2610.32845","title":"The Galactic Center Gamma-Ray Excess and the Look-Elsewhere Effect","first":"Sands","nauth":2,"year":2026,"cites":0,"role":"today","note":"Closest of your papers: [[1421624]] (coupling 0.12, 10 shared references). Closest network paper: [[1485213]] (coupling 0.07, 8 shared references).","score":13.4,"rank":5,"section":"cross","parts":[0.0,0.3,0.2,0.0],"abstract":"The origin of the excess of GeV gamma-rays in the Milky Way's galactic center observed by Fermi-LAT has been an open question for nearly two decades. The two leading interpretations of this signal are that it is produced either by annihilating dark matter (DM), or arises from unresolved point sources, such as a novel population of millisecond pulsars. In both scenarios, uncertainties and limitations in the modeling of galactic diffuse gamma-ray emission, such as the steady-state approximation of cosmic ray (CR) propagation and assumption of an axisymmetric distribution of CRs, complicate the interpretation of the galactic center excess (GCE). Simulations with full magnetohydrodynamics (MHD) and CR transport can provide a new avenue for understanding the astrophysical phenomena that drive galactic diffuse gamma-ray emission. We utilize MHD simulations of Milky Way analogs with time-dependent, spectrally-resolved CR transport to reconstruct diffuse gamma-ray emission. Comparing instantaneous emission to a time-averaged baseline, we find residuals up to several times larger than the Fermi GCE, with a wide range of spectral shapes and spatial morphologies. At some simulation snapshots, the spectrum and morphology of the residuals resemble the Fermi GCE. Our results suggest that the Fermi GCE may be a manifestation of the look-elsewhere effect- a transient fluctuation in diffuse emission from stellar sources, observed at an inopportune moment- and motivate the development of new Fermi-LAT analysis templates that account for time-dependent CR transport.","authors":"Isabel S. Sands, Philip F. Hopkins","nlinked":37,"nref":42,"src":"INSPIRE","html":true},{"id":"3201080","arxiv":"2609.07800","title":"Inelastic Sing 3,21,"k"],[0,22,"c"],[17,21,"c"]],"next":[{"arxiv":"2610.31717","id":"3218365","title":"In situ enhanced detectability of axions' responses in a microwave cavity","authors":"Li Gao, Suirong He, Hao Zheng, Ni Chen, Xianing Feng, Qingquan Jiang, Jin Li, L. F. Wei","score":9.2,"section":"new","rank":6,"parts":[0.0,0.15,0.25,0.0],"note":"Closest of your papers: [[1607572]] (coupling 0.06, 3 shared references). Closest network paper: [[1709434]] (coupling 0.09, 6 shared references).","abstract":"Microwave cavities in strong magnetic fields are among the most sensitive detectors for axion dark matter detection. Its sensitivity, however, is fundamentally limited by the second order nature of axion photon energy conversion, which yields an extremely weak signal. Here we propose a feasible approach to break this limitation, by pre-exciting the target cavity mode to generate a first order power response signal in situ. The resulting signal amplitude scales linearly with the axion-photon coupling parameter, which is in sharp contrast to the quadratic scaling of conventional schemes, and is detectable via standard quadrature balanced homodyne detection system, even though its phase remains stochastic. Numerical simulations demonstrate that this pre-excited seed field can effectively suppress thermal noise, and thus the detection sensitivity of the system can approach the lower quantum noise limit. Consequently, the sensitivities predicted by the KSVZ and DFSZ models could be surpassed. This proposal might offer a pathway to a major leap in axion dark matter searches, as it is within reach of current technology."},{"arxiv":"2610.31761","id":"3218384","title":"Prospects of Detecting Cosmological Domain Walls in the Cosmic Microwave Background","authors":"Berkin Gürbüz, Robert Brandenberger, Yitian Sun","score":8.3,"section":"cross","rank":7,"parts":[0.0,0.18,0.13,0.0],"note":"Closest of your papers: [[2690106]] (coupling 0.07, 5 shared references). Closest network paper: [[3092811]] (coupling 0.05, 5 shared references).","abstract":"Topological defects are a generic prediction of field theories with spontaneously broken symmetries, and domain walls, the two-dimensional defects left by a broken discrete symmetry, are among the simplest. We study the imprint of dark, purely gravitationally interacting domain walls on the Cosmic Microwave Background (CMB), in the regime where a low symmetry-breaking scale $η$ allows the walls to evade the Zel'dovich overclosure bound while remaining cosmologically relevant. The relativistic repulsion of matter by a planar wall carves out an evacuated void bounded by an overdense shell, and we compute the resulting photon deflection field analytically for walls both aligned with and arbitrarily inclined to the line of sight. The deflection stamps coherent, strongly non-Gaussian distortions onto the temperature sky, with a characteristic two-peak structure set by the relativistic displacement scale and an inclination dependence that vanishes for face-on walls. Because these signatures are localised and anisotropic, they are poorly captured by two-point statistics; we therefore analyse them with a curvelet/wavelet decomposition matched to the wall's geometry, and with simulation-based inference, training a Neural Posterior Estimator (NPE) to recover the scattering redshift $z$, energy scale $η$, and inclination $θ$, and a Neural Ratio Estimator (NRE) to evaluate the likelihood-ratio test statistic for limit-setting. Casting these methods as sensitivity forecasts for a South Pole Telescope-like (SPT) survey, we find that the curvelet and wavelet statistical thresholds populate a common $η\\sim 10-100$ MeV band over the accessible redshift range. The neural-ratio sensitivity curve, which exploits the full map morphology, reaches a factor 1.3-1.9 lower in $η$ at $z \\gtrsim 20$, or $\\sim 2-7$ in the wall tension, landing essentially on the per-resolution-element noise floor."},{"arxiv":"2610.31756","id":"3218535","title":"Soft scalar-field corrections to the topological susceptibility","authors":"Dietrich Bodeker, Rasmus S. K. Nielsen","score":8.1,"section":"new","rank":8,"parts":[0.0,0.13,0.23,0.0],"note":"Closest of your papers: [[1607572]] (coupling 0.05, 3 shared references). Closest network paper: [[2703113]] (coupling 0.08, 7 shared references).","abstract":"We compute the contribution from soft scalar-field fluctuations to the topological susceptibility in SU(2) gauge theory at high temperature. We construct a 3-dimensional effective theory for the scalar field that accounts for the presence of an instanton. In the limit that the scalar selfcoupling $ λ$ is much larger than the square of the gauge coupling $g$ we obtain a correction of order $\\sqrtλ$ relative to the 1-loop result for the topological susceptibility."},{"arxiv":"2603.12314","id":"3129073","title":"Dark Matter, Baryon Number, and Cosmic-Ray Antinuclei","authors":"Caleb Gemmell, Dan Hooper, Seth Koren, Fabrizio Vassallo","score":7.0,"section":"replacement","rank":9,"parts":[0.0,0.09,0.25,0.0],"note":"Closest of your papers: [[2080612]] (coupling 0.03, 2 shared references). Closest network paper: [[1759674]] (coupling 0.09, 7 shared references).","abstract":"Antideuterons and antihelium nuclei in the cosmic-ray spectrum have long been considered a smoking gun signature of dark matter annihilation, making the tentative observation of several such events by AMS highly intriguing. Conventional dark matter models, however, can produce only up to O(1) antideuteron events at AMS and are not capable of generating observable fluxes of antihelium. In this Letter, we propose a class of models in which dark matter annihilates into particles carrying baryon and lepton number, whose subsequent decays produce enhanced fluxes of antinucleons and antinuclei. Such scenarios are motivated by Grand Unified Theories and can lead to an order-of-magnitude or larger enhancement in the resulting antideuteron and antihelium-3 fluxes, providing a means by which to potentially explain the events reported by the AMS Collaboration."},{"arxiv":"2601.14676","id":"3109773","title":"Long-Lived Oscillons as Closed Domain Walls in the $\\mathbb Z_2$-Symmetric Two-Higgs-Doublet Model","authors":"Zhaoyu Meng","score":6.6,"section":"replacement","rank":10,"parts":[0.06,0.09,0.08,0.0],"note":"Also cites widely used network papers: [[902365]]. Closest of your papers: [[2030200]] (coupling 0.03, 2 shared references). Closest network paper: [[1501489]] (coupling 0.03, 1 shared references).","abstract":"Domain walls arising from spontaneous symmetry breaking in the early universe are typically unstable and decay rapidly. However, numerical simulations of the Z2-symmetric two-Higgs-doublet model (2HDM) reveal an unexpected long-lived closed domain wall structure that emerges at late stages of decay, which we identify as a high-amplitude oscillon. Their longevity stems from a potential with two distinct vacua: an interior oscillating in one vacuum and an exterior static in the other. Within a specific parameter regime, radiation is highly suppressed and the lifetime can exceed cosmological timescales. To gain analytical insight into the mechanism, we first consider reduced models with fewer fields (2 and 4 real scalars). These are not approximations to the 2HDM but rather toy models that capture the essential feature of a Z2-symmetric potential with two vacua. Floquet analysis further confirms the stability of these structures under perturbations in both the 4-field toy model and the full 2HDM."},{"arxiv":"2608.28738","id":"3197826","title":"AXIS Could Have Accessed Dark Matter Decays","authors":"Joshua W. Foster, Inci Karaaslan, Gordan Krnjaic, Nimrod Shapir","score":6.1,"section":"replacement","rank":11,"parts":[0.06,0.08,0.07,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2855387]] (coupling 0.02, 2 shared references). Closest network paper: [[3122101]] (coupling 0.03, 2 shared references).","abstract":"The Advanced X-ray Imaging Satellite (AXIS) was a mission concept designed to improve upon the sensitivity and spatial resolution of the Chandra X-ray Observatory and XMM-Newton. Although AXIS was not selected for implementation, the concept study defined a mature instrument design with low-background, arcsecond imaging over the $0.3$-$10$ keV energy range, a large effective area, and a wide field of view. These capabilities provide a useful benchmark for the dark matter decay sensitivity of future X-ray observatories. We estimate the reach of a future AXIS-like instrument for narrow photon lines from decaying keV-scale dark matter, including axion-like particles and sterile neutrinos. For Galactic center observations, we find projected lifetime sensitivities of order $10^{31}$ s, improving upon existing limits by up to an order of magnitude over part of the keV mass range."},{"arxiv":"2512.04199","id":"3089324","title":"Primordial Black Holes from Inflation with a Spectator Field","authors":"Dario L. Lorenzoni, Sarah R. Geller, David I. Kaiser, Evan McDonough","score":5.4,"section":"replacement","rank":12,"parts":[0.06,0.06,0.06,0.0],"note":"Also cites widely used network papers: [[902365]]. Closest of your papers: [[2855387]] (coupling 0.02, 3 shared references). Closest network paper: [[3205155]] (coupling 0.02, 3 shared references).","abstract":"How is the production of primordial black holes (PBHs) in single-field models of inflation impacted by the presence of additional scalar fields? We consider the effect of a spectator field - a free scalar field with sub-Hubble mass and no direct coupling to the inflaton and which makes a subdominant contribution to the total energy density - in the context of single-field models of inflation featuring a transient phase of ultra-slow-roll evolution. Despite the modest title, a spectator field can have a dramatic impact: the slow-roll evolution of the spectator prevents the combined inflaton-and-spectator system from entering into ultra-slow-roll, which naively might be expected to preclude the production of PBHs. However, we demonstrate that the growth of perturbations is maintained or enhanced by the spectator, through the rich interplay of curvature and isocurvature perturbations. We show in a model-independent way that the single-field phase of ultra-slow-roll is replaced by two turns in field space encompassing a phase of tachyonic instability for the isocurvature perturbations and a transfer of power from isocurvature to curvature modes. Furthermore, we highlight a degeneracy between the fine-tuning of the feature in the inflaton potential and the parameters of the spectator, leading to an overall resilience of model predictions to parameter variations. This makes it easier for the underlying PBH model to accommodate both high-precision cosmic microwave background constraints and production of PBHs in the asteroid-mass range."},{"arxiv":"2606.26240","id":"3173063","title":"Constraining Multiple Kinetically Mixed Dark Photons","authors":"Joerg Jaeckel, Sebastian Monath","score":4.9,"section":"replacement","rank":13,"parts":[0.0,0.04,0.24,0.0],"note":"Closest of your papers: [[468209]] (coupling 0.01, 1 shared references). Closest network paper: [[2697223]] (coupling 0.08, 8 shared references).","abstract":"Extra U(1) gauge bosons under which Standard Model particles are uncharged, aka dark photons, are a simple and well-motivated extension of the Standard Model. There could be a single, but also several or even many such dark photons. However, most studies consider only a single dark photon. Here, we want to look at the more general case of multiple dark photons interacting with the Standard Model via kinetic mixing. We consider a range of standard probes, Cavendish experiments, light-shining-through-walls experiments, as well as energy loss in stars. To explore the rather high-dimensional parameter space of the masses and the kinetic mixing matrix, we pursue a statistical approach, considering different distributions for the kinetic mixing parameters."},{"arxiv":"2405.13881","id":"2789241","title":"Natural Inflation with Exponentially Small Tensor-To-Scalar Ratio","authors":"Dario L. Lorenzoni, David I. Kaiser, Evan McDonough","score":4.7,"section":"replacement","rank":14,"parts":[0.0,0.08,0.11,0.0],"note":"Closest of your papers: [[1607572]] (coupling 0.03, 3 shared references). Closest network paper: [[2703113]] (coupling 0.04, 6 shared references).","abstract":"We demonstrate that \"natural inflation\", also known as \"axion inflation\", can be compatible with Planck 2018 measurements of the cosmic microwave background, while predicting an exponentially small tensor-to-scalar ratio, e.g., $r\\sim 10^{-15}$. The strong suppression of $r$ arises from dynamics of the radial component of the complex scalar field, whose phase is the axion. Such tiny values of $r$ remain well below the threshold for detection by CMB-S4 or Simons Observatory B-mode searches. The model is testable with the running $α_s$ of the spectral index, which is within reach of next-generation CMB and large-scale structure experiments, motivating the running as a primary science goal for future experiments."},{"arxiv":"2610.30773","id":"3218076","title":"A Chiral Nelson-Barr Relaxion","authors":"Cristien Arzate, Joshua Iascau","score":3.9,"section":"replacement","rank":15,"parts":[0.0,0.07,0.1,0.0],"note":"Closest of your papers: [[1365306]] (coupling 0.02, 2 shared references). Closest network paper: [[2895281]] (coupling 0.04, 3 shared references).","abstract":"We present the chiral Nelson-Barr relaxion model, an extension of the Nelson-Barr relaxion framework with a gauged chiral $\\mathrm{U}(1)$ symmetry. It includes vector-like quarks to cancel gauge anomalies and a scalar whose vacuum expectation value generates their masses. The chiral symmetry forbids the leading operators responsible for the Nelson-Barr and clockwork quality problems. Right-handed neutrinos generate light-neutrino masses through the type-I seesaw mechanism and permit thermal leptogenesis. For the particular coupling considered, relaxion phenomenology gives $f_{\\mathrm{max}}^{\\mathrm{pheno}}\\sim 4\\times 10^{11}\\ \\mathrm{GeV}$, about eight times the corresponding phenomenological ceiling in the original model. The model can accommodate thermal leptogenesis if its right-handed-neutrino masses and reheating history satisfy the required temperature bounds."},{"arxiv":"2610.32790","id":"3218484","title":"Robustness of the scaled transverse-momentum correlator and the contribution of meson--baryon fluctuations at RHIC energies","authors":"Rutik Manikandhan, Rene Bellwied","score":3.4,"section":"new","rank":16,"parts":[0.06,0.02,0.02,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2690106]] (coupling 0.01, 1 shared references). Closest network paper: [[3205155]] (coupling 0.01, 1 shared references).","abstract":"The search for the QCD critical point relies on identifying non-monotonic signatures in event-by-event fluctuation observables, such as the scaled two-particle transverse-momentum correlator $C_{p_T}$. Using a microscopic transport model (UrQMD), we establish the robustness of $C_{p_T}$ against the variations that distinguish the datasets in the relevant collision energy regime, namely the choice of centrality estimator, finite tracking efficiency, and acceptance, including the difference between collider and fixed-target running. In addition, it has recently been proposed, based on UrQMD yields, that the measured non-monotonicity requires no critical dynamics and instead follows from the event-by-event composition of the final state. We show that this contribution is governed by event-by-event fluctuations in the meson-baryon composition, rather than by the mean yields alone. Using the composition fluctuations obtained from UrQMD, we find that the minimum in the two-component calculation disappears."},{"arxiv":"2610.31745","id":"3218357","title":"FeynFacet: AI agents for analytic NLO QCD","authors":"Zhong-Bo Kang, Werner Vogelsang, Congyue Zhang","score":2.5,"section":"new","rank":17,"parts":[0.0,0.04,0.07,0.0],"note":"Closest of your papers: [[1746620]] (coupling 0.02, 2 shared references). Closest network paper: [[2817040]] (coupling 0.02, 27 shared references).","abstract":"We present FeynFacet, a workflow in which artificial intelligence agents develop and execute programs for analytic next-to-leading-order (NLO) QCD calculations, with the observables and conventions specified by physicists. We use it to derive new analytic hard functions for single-inclusive transverse spin transfer in proton-proton and lepton-proton collisions. The new proton-proton results cover all partonic channels contributing to transverse spin transfer, and the new lepton-proton result is inclusive in the scattered lepton. Within FeynFacet, we use reverse unitarity to represent the on-shell delta functions in real-emission phase-space integrals as cut propagators. Dimensional shifts convert integrals containing evanescent numerators into scalar integrals in higher dimensions. Integration-by-parts identities then reduce the scalar integrals to master integrals, which are evaluated analytically. Gauge invariance, pole cancellation and renormalization-group (RG) evolution provide checks throughout the calculation. We reproduce established single-inclusive hard functions for unpolarized and double longitudinally polarized proton-proton and lepton-proton scattering, and for proton-proton scattering with two transversely polarized beams. We also reproduce the NLO matching coefficients for unpolarized quark and gluon transverse-momentum-dependent parton distributions and the associated soft functions. The new transverse spin-transfer coefficients provide perturbative inputs for extracting quark transversity through spin-dependent fragmentation, including polarized-hyperon production, Collins and dihadron asymmetries in jets, and spin-dependent one- and two-point energy correlators. We make all analytic coefficients and the associated calculation programs publicly available online."},{"arxiv":"2610.32669","id":"3218550","title":"Systematic Study of Neutrino-Nucleus Interactions for the DUNE Experiment","authors":"L. F. B. M. Rodrigues, F. G. Gardim, G. A. Valdiviesso,  .","score":2.4,"section":"new","rank":18,"parts":[0.0,0.04,0.07,0.0],"note":"Closest of your papers: [[2690106]] (coupling 0.01, 1 shared references). Closest network paper: [[2817040]] (coupling 0.02, 20 shared references).","abstract":"The recent generation of high-precision neutrino oscillation experiments, such as the Deep Underground Neutrino Experiment (DUNE), relies on the accurate reconstruction of incident neutrino energy to determine fundamental parameters like Charge-Parity (CP) violation and the neutrino mass hierarchy. The use of Liquid Argon, introduces significant theoretical complexities. This dissertation provides a investigation into neutrino-nucleus scattering phenomenologies, connecting fundamental electroweak theory with computational simulations using the GENIE Monte Carlo event generator. The study evaluates the limitations of traditional frameworks, such as the Relativistic Fermi Gas (RFG) model, specifically addressing the Axial Mass parameter and its impact on the Charged Current Quasi-Elastic (CCQE) channel. By comparing baseline RFG predictions against experimental data from MicroBooNE, this research quantifies the necessity of advanced many-body nuclear frameworks. The implementation of the Local Fermi Gas (LFG) model, Random Phase Approximation (RPA) screening, and the SuperScaling Approximation (SuSAv2) are systematically analyzed to resolve kinematic biases. Additionally, the impact of modernized phenomenological constraints, including the updated $M_A^{RES} = 0.96$ GeV for resonant pion production and the 2021 Bodek-Yang parameter updates for Deep Inelastic Scattering (DIS), is evaluated. Furthermore, this research integrates university extension initiatives by developing and presenting macroscopic 3D-printed educational models, consisting of a Linear Accelerator (LINAC) analog and a scattering experiment, and finally presenting it into the festival \"Mais Ciência Por Favor\"."},{"arxiv":"2610.31881","id":"3218401","title":"Semi-Analytic Predictions for Strong-Lensing Perturbers in Cold and Self-Interacting Dark Matter","authors":"Jonathan Tekverk, Duncan K. Adams, Simon Birrer, Rouven Essig, Daniel Gilman","score":2.1,"section":"cross","rank":19,"parts":[0.0,0.03,0.06,0.0],"note":"Closest of your papers: [[1119599]] (coupling 0.01, 1 shared references). Closest network paper: [[1345338]] (coupling 0.02, 4 shared references).","abstract":"Strong gravitational lensing is sensitive to the abundance and internal structure of dark matter halos, providing a probe of gravothermal evolution in self-interacting dark matter (SIDM). We combine semi-analytic cold dark matter (CDM) subhalo histories with a model for gravothermal evolution in SIDM to generate CDM and SIDM subhalo populations across SIDM parameter space. We predict their projected enclosed masses and deflection-based projected density slopes and compare them with three perturbers inferred through gravitational imaging in PJ011646, SDSS J0946+1006, and JVAS B1938+666. For SIDM model parameters $σ_0/m_χ=147.1$ cm$^2$/g and $w=120$ km/s, SIDM subhalos reproduce all three perturbers more often than CDM subhalos. For PJ011646, we find ~0.6 cored SIDM subhalos per host matching the perturber, compared with ~0.002 in CDM, while core-collapsed subhalos are too steep. For SDSS J0946+1006, we find ~3 core-collapsed and ~0.004 cored SIDM subhalos per host, compared with none in 900 CDM realizations, although baryons, neglected here, may matter for such massive subhalos. For \"detection V\" in JVAS B1938+666, we find ~220 core-collapsed and ~20 cored SIDM subhalos per host within the $2σ$ posterior region, compared with ~0.2 in CDM; the CDM candidates require exceptionally early accretion, at median redshift $z\\sim13$. Simultaneously reproducing all three perturbers requires $w\\gtrsim10^2$ km/s, so that the massive (~$5.6\\times10^{10}M_\\odot$) progenitors of SDSS J0946+1006 candidates can collapse, and is achieved for $σ_0/m_χ\\gtrsim10^2$ cm$^2$/g in the parameter sets studied. Our results show how semi-analytic models can quantify how often subhalos reproduce individual perturbers in different dark matter models, and our modular framework can be readily updated as models of tidal stripping and late-stage gravothermal evolution in SIDM improve. (abridged)"},{"arxiv":"2602.14811","id":"3120608","title":"RG-Invariant Symmetry Ratio for QCD: A Study of $U(1)_A$ and Chiral Symmetry Restoration","authors":"Ting-Wai Chiu, Tung-Han Hsieh","score":2.1,"section":"replacement","rank":20,"parts":[0.0,0.03,0.08,0.0],"note":"Closest of your papers: [[1755250]] (coupling 0.01, 1 shared references). Closest network paper: [[1761212]] (coupling 0.03, 4 shared references).","abstract":"We introduce a renormalization-group-invariant (RGI), scheme-independent symmetry ratio $κ_{AB}$, for the quantitative characterization of symmetry breaking in QCD. As a first application, we employ $κ_{AB}$ to investigate the relative strength of $SU(2)_L \\times SU(2)_R$ chiral symmetry and $U(1)_A$ axial symmetry breaking in $N_f=2+1+1$ lattice QCD using optimal domain-wall fermions at the physical point. Our study covers three lattice spacings and twelve temperatures in the range 164--385~MeV. We examine three independent symmetry-breaking channels in the nonsinglet sector with quark-connected correlators: the $U(1)_A$-sensitive scalar--pseudoscalar channel ($κ_{PS}$), probing the $π$--$δ$ system; the $SU(2)_L \\times SU(2)_R$-sensitive vector--axial-vector channel ($κ_{VA}$), probing the $ρ$--$a_1$ system; and an additional $U(1)_A$-sensitive tensor vector--axial-tensor vector channel ($κ_{TX}$), probing the $ρ_T$--$b_1$ system. At each lattice spacing we observe a clear hierarchy $κ_{PS} > κ_{VA} > κ_{TX}$. Since temperature and lattice spacing are not varied independently in the present ensembles, the lattice-spacing dependence of the hierarchy cannot be isolated, and a controlled continuum extrapolation is deferred to future work."},{"arxiv":"2504.13251","id":"2913858","title":"Resilience of Primordial Black Hole Formation from Inflation with a Light Spectator Field","authors":"Dario L. Lorenzoni, Sarah R. Geller, Zachary Ireland, David I. Kaiser, Evan McDonough, Kyle A. Wittmeier","score":2.0,"section":"replacement","rank":21,"parts":[0.0,0.04,0.05,0.0],"note":"Closest of your papers: [[2855387]] (coupling 0.01, 2 shared references). Closest network paper: [[3205155]] (coupling 0.02, 2 shared references).","abstract":"Scalar fields are ubiquitous in theories of high-energy physics. In the context of cosmic inflation, this suggests the existence of spectator fields, which provide a subdominant source of energy density. We show that spectator fields boost the inflationary production of primordial black holes, with single-field ultra-slow-roll evolution supplanted by a phase of evolution along the spectator direction, and primordial perturbations amplified by the resulting multifield dynamics. This generic mechanism is largely free from the severe fine-tuning that afflicts single-field inflationary PBH models."},{"arxiv":"2610.31873","id":"3218386","title":"A localisation bound for Standard-Model representations in heterotic orbifolds","authors":"Navid Ardakanian","score":1.8,"section":"new","rank":22,"parts":[0.0,0.0,0.12,0.0],"note":"Closest network paper: [[707996]] (coupling 0.04, 5 shared references).","abstract":"In heterotic string compactifications on toroidal orbifolds, the massless states at a twisted fixed point are constrained by the evenness of the sixteen-dimensional gauge lattice. We show that two massless left-chiral states in the same Standard-Model representation, built on the same constructing space-group element and distinct modulo the Weyl group of $SU(3)_c\\times SU(2)_L$, must satisfy $\\sqrt{R}+\\sqrt{R'}\\ge\\sqrt{2}$, where $R$ is the squared length of the part of a state's gauge momentum orthogonal to the Standard-Model Cartan directions. Without left-moving oscillator excitations this reads $R\\ge 1/2$. When $R<1$, $n$ such states, pairwise distinct in the same sense, carry the weights of the fundamental representation of a local $SU(n)$ commuting with the Standard Model, and $n\\le 1/(1-R)$. Since the representation fixes the projected length (at the canonical hypercharge normalisation, $6/5$ for the 10-like $Q$, $u^c$, $e^c$ and $4/5$ for the 5bar-like $d^c$ and lepton doublet), the bound becomes a condition on the sector: a repeated 10-like representation requires a massless budget of at least $17/20$, a repeated 5bar-like one at least $13/20$. In the complete massless spectra of 16,138 models from two orbifold catalogues the multiplicity ceiling is reached at four values of $R$. We exhibit an explicit model on $T^6/(Z_3\\times Z_6)$ whose budget clears the higher threshold and carries a repeated 10-like representation at the multiplicity the bound permits. For the Standard Model embedded through $SU(5)$ in one $E_8$ factor we show that, for that geometry and budget, exactly two inequivalent order-six shift classes admit such a doubling, and among the embeddings over them with the Standard Model intact we find none with three net generations of $Q$, $u^c$ and $e^c$ at once."},{"arxiv":"2610.31759","id":"3218367","title":"Discontinuity at the Pole","authors":"Dominik Haslehner, Elena Kaiser, Javi Serra, Andreas Weiler","score":1.6,"section":"cross","rank":23,"parts":[0.0,0.03,0.04,0.0],"note":"Closest of your papers: [[1365306]] (coupling 0.01, 1 shared references). Closest network paper: [[855266]] (coupling 0.01, 2 shared references).","abstract":"The exchange of a particle whose mass is taken to zero need not reproduce the exchange of a particle that is strictly massless from the outset. We derive a general on-shell diagnostic of the well-known discontinuity between the exchange of a massless particle and the massless limit of a massive-particle exchange, valid for a mediator of arbitrary integer spin S. Our main observation is that this discontinuity can be identified directly at the level of the pole residue. We find that, in four dimensions, the residue is governed by a Chebyshev polynomial in the massless case and by a Legendre polynomial in the massless limit of the massive case. For S = 2, this reproduces the van Dam-Veltman-Zakharov discontinuity. For general S, it provides a simple and compact higher-spin analogue from on-shell factorisation. The discontinuity is probed, in principle, by the leading post-Newtonian correction to the non-relativistic potential between two massive scalar bodies."},{"arxiv":"2610.32028","id":"3218417","title":"Magnetic field effect on neutral color superconductivity as a mechanism to boost the inner magnetic field of magnetars","authors":"Bo Feng","score":1.4,"section":"new","rank":24,"parts":[0.0,0.0,0.09,0.0],"note":"Closest network paper: [[1287034]] (coupling 0.03, 7 shared references).","abstract":"In this paper, we review the impact of a strong magnetic field on the neutral two-flavor color superconducting (2SC) phase of dense quark matter. Using a Nambu-Jona-Lasinio (NJL) model approach in the mean-field approximation, we first solve the gap equations for the diquark condensate $Δ$ and the electric chemical potential $μ_e$ under a uniform external magnetic field, and discuss the coupled evolution of the chiral and diquark order parameters. We then evaluate the field-dependent Meissner masses of the rotationally charged gluons for a wide range of densities and moderate diquark coupling strengths. Combining the \"zero-mode problem\" mechanism with the neutrality condition, we show that the gluon masses become tachyonic even at moderate magnetic-field values, signaling a chromomagnetic instability in density regions where the system was stable at zero field. This instability can be resolved through the restructuring of the ground state with the formation of a gluon vortex condensate. A remarkable consequence of the vortex configuration is the paramagnetic amplification of the in-medium magnetic field: seed fields of the order of $10^{15}$ G can be enhanced by up to two orders of magnitude, reaching $\\sim 10^{17}$ G, precisely the range predicted for magnetar cores. We compare this microscopic mechanism with the conventional dynamo explanation and discuss how it offers a plausible explanation for the extremely high magnetic fields expected to be realized in magnetar interiors."},{"arxiv":"2610.29707","id":"3217378","title":"Probing New Physics with $b \\to u \\ell ν_{\\ell}$ induced decays","authors":"Maria Letizia Di Cuia, Davide Milillo","score":1.1,"section":"replacement","rank":25,"parts":[0.0,0.0,0.07,0.0],"note":"Closest network paper: [[1112993]] (coupling 0.03, 2 shared references).","abstract":"We analyze $B^- \\to μ^- \\barν_μ$, $\\bar{B}^0 \\to π^+ μ^-\\barν_μ$, and $B^- \\to ρ^0 μ^- \\barν_μ$ decays using the data on binned branching fractions recently measured by Belle II Collaboration for the semileptonic modes. We extend the low-energy Hamiltonian governing $b \\to u \\ell \\barν_\\ell$ transitions to include the full set of dimension-six, Lorentz-invariant operators with left-handed neutrinos, consistent with the Standard Model Effective Field Theory (SMEFT) framework. The Wilson coefficients are treated as complex, lepton-flavor-dependent effective couplings. Since the three selected channels are sensitive to different non-standard structures, we perform a combined analysis using Monte Carlo methods to constrain the New Physics couplings for three benchmark values of $|V_{ub}|$. const M = RAW.meta;

  if(!NEWS.length)return;
  const RNG=d3.randomLcg(11);

  svg.append('g').attr('class','grid').selectAll('line').data(ticks).join('line').attr('x1',d=>x(d)).attr('x2',d=>x(d)).attr('y1',m.t).attr('y2',H-m.b);

  const cy=(m.t+H-m.b)/2, xf=n=>isNew(n)?x(yrs[1]+.75):x(n.year);

    .attr('d',l=>{const a=l.source,b=l.target;return `M${a.x},${a.y}Q${(a.x+b.x)/2},${(a.y+b.y)/2-Math.abs(a.x-b.x)*.12} ${b.x},${b.y}`});
  G.append('g').selectAll('circle').data([...sim].sort((a,b)=>RANK[b.n.role]-RANK[a.n.role])).join('circle')
    .attr('class','node').attr('cx',s=>s.x).attr('cy',s=>s.y).attr('r',s=>r(s.n)).attr('fill',s=>col(s.n))

  const placed=[];L.forEach(l=>{let k=0;while(k<40&&placed.some(p=>l.x0<p.x0+p.w&&p.x0<l.x0+l.w&&Math.abs(l.y-p.y)<13)){l.y+=13*(k%2?-1:1)*(1+Math.floor(k/2));k++;l.y=Math.max(m.t+10,Math.min(H-m.b-4,l.y))}placed.push(l)});
  G.append('g').selectAll('text').data(L).join('text').attr('class','nlabel').attr('x',l=>l.right?l.s.x-r(l.s.n)-4:l.s.x+r(l.s.n)+4).attr('y',l=>l.y)
    .attr('text-anchor',l=>l.right?'end':'start').text(l=>l.t);
  paint();
}
function showTip(ev,n){const b=document.getElementById('chart').getBoundingClientRect();tip.hidden=false;tip.textContent=`${auth(n)} (${n.year}) — ${plain(n.title)}`+(isNew(n)?` · score ${n.score}`:'');
  let L=ev.clientX-b.left+12;if(L>b.width-290)L=ev.clientX-b.left-290;tip.style.left=Math.max(4,L)+'px';tip.style.top=(ev.clientY-b.top+12)+'px'}
function paint(){if(!G)return;const f=hover||sel,on=new Set();if(f){on.add(f.i);f.out.forEach(i=>on.add(i));f.inn.forEach(i=>on.add(i))}
  svg.classed('dim',!!f);
  G.selectAll('path.edge').attr('class',l=>'edge '+l.k+(!f?'':l.s===f.i?' hot out':l.t===f.i?' hot in':''));G.selectAll('path.edge.hot').raise();
  G.selectAll('circle').classed('on',s=>on.has(s.n.i)).classed('sel',s=>sel&&s.n.i===sel.i).classed('match',s=>query&&`${s.n.first} ${s.n.title} ${s.n.arxiv} ${s.n.authors||''}`.toLowerCase().includes(query));
  G.selectAll('text.nlabel').classed('on',l=>on.has(l.s.n.i))}
function panel(){const p=document.getElementById('panel'),n=sel;
  if(!n){p.innerHTML='<p>Select a paper in the network.</p>';return}
  const links=`<div class="links">${n.id?`<a href="https://inspirehep.net/literature/${n.id}" target="_blank" rel="noopener">INSPIRE</a>`:''}${n.arxiv?`<a href="https://arxiv.org/abs/${esc(n.arxiv)}" target="_blank" rel="noopener">arXiv</a>`:''}</div>`;
  if(isNew(n)) p.innerHTML=`<div class="role" style="color:${col(n)}">#${n.rank} · ${esc(SEC[n.section])} · score ${n.score.toFixed(1)}</div><h4>${esc(n.title)}</h4>
   <div class="meta">${esc(auth(n))} · arXiv:${esc(n.arxiv)}</div><p>${why(n.note)}</p><div class="links"><a href="#p${n.i}">Back to abstract</a></div>`;
  else p.innerHTML=`<div class="role" style="color:${col(n)}">${esc(ROLE[n.role])}</div><h4>${esc(n.title)}</h4>
   <div class="meta">${esc(auth(n))} · ${n.year}${n.arxiv?' · arXiv:'+esc(n.arxiv):''}</div>
   <div class="stats"><span>${n.cites.toLocaleString()} citations</span><span>${n.inn.filter(i=>isNew(N[i])).length} of the matches link here</span></div>${links}`;
  tex(p)}
function pick(n,scroll){sel=n;panel();paint();document.querySelectorAll('.paper').forEach(el=>el.classList.toggle('sel',el.id==='p'+n.i));if(scroll)document.getElementById('chart').scrollIntoView({behavior:'smooth',block:'nearest'})}
const present=new Set(N.map(n=>n.role));
document.getElementById('legend').innerHTML=['today','repl','seed','other'].filter(k=>present.has(k)).map(k=>`<span><i class="dot" style="background:var(--${k})"></i>${esc(ROLE[k])}</span>`).join('')+'<span style="color:var(--fg-3)">Listing papers: size ∝ score; others: size ∝ log(citations)</span>';
document.getElementById('q').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();paint()});
svg.on('click',ev=>{if(ev.target.tagName!=='circle'){sel=null;panel();paint()}});
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(draw,200)});
function nextList(){const X=RAW.next||[];if(!X.length)return;const box=document.getElementById('nextlist'),more=document.getElementById('more');
  more.hidden=false;more.querySelector('summary').firstChild.textContent=`The next ${X.length} papers by score `;
  document.getElementById('moresub').textContent=`below the threshold of ${M.threshold}, not drawn in the network`;
  box.innerHTML=X.map(n=>`<li><div class="role" style="color:var(--${n.section==='replacement'?'repl':'today'})">#${n.rank} · ${esc(SEC[n.section])} · score ${n.score.toFixed(1)}</div>
    <div class="t">${esc(n.title)}</div><div class="authors">${authors(n.authors)} · arXiv:${esc(n.arxiv)}</div>
    ${n.note?`<p class="why">${why(n.note)}</p>`:''}
    <details class="abs"><summary>Abstract</summary><p class="abs">${esc(n.abstract)}</p></details>
    <div class="links">${n.id?`<a href="https://inspirehep.net/literature/${n.id}" target="_blank" rel="noopener">INSPIRE</a>`:''}<a href="https://arxiv.org/abs/${esc(n.arxiv)}" target="_blank" rel="noopener">arXiv</a><a href="https://arxiv.org/pdf/${esc(n.arxiv)}" target="_blank" rel="noopener">PDF</a></div></li>`).join('');
  more.addEventListener('toggle',()=>{if(more.open)tex(box)})}
const rtip=document.getElementById('reftip');let rcur=null;
function refShow(el){const r=REFS[el.dataset.ref];if(!r)return;rcur=el;rtip.textContent=`${auth(r)} (${r.year}) — ${plain(r.title)}`;rtip.hidden=false;
  const b=el.getBoundingClientRect(),t=rtip.getBoundingClientRect();let L=Math.min(Math.max(8,b.left),innerWidth-t.width-8),T=b.bottom+6;
  if(T+t.height>innerHeight-8)T=b.top-t.height-6;rtip.style.left=L+'px';rtip.style.top=T+'px'}
function refHide(){rtip.hidden=true;rcur=null}
document.addEventListener('pointerover',e=>{const el=e.target.closest('.ref');if(el&&e.pointerType==='mouse')refShow(el)});
document.addEventListener('pointerout',e=>{if(e.target.closest('.ref')&&e.pointerType==='mouse')refHide()});
document.addEventListener('click',e=>{const el=e.target.closest('.ref');if(el)refShow(el);else if(rcur)refHide()});
document.addEventListener('focusin',e=>{const el=e.target.closest('.ref');if(el)refShow(el)});
document.addEventListener('focusout',e=>{if(e.target.closest('.ref'))refHide()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')refHide()});
addEventListener('scroll',()=>{if(rcur)refHide()},{passive:true});
list();nextList();fold();draw();panel();
window.addEventListener('load',()=>{tex(document.getElementById('list'));tex(document.getElementById('panel'));fold();
  if(window.MathJax&&MathJax.startup&&MathJax.startup.promise)MathJax.startup.promise.then(()=>setTimeout(fold,300))});
addEventListener('resize',()=>{clearTimeout(window._ft);window._ft=setTimeout(fold,200)});
</script>
