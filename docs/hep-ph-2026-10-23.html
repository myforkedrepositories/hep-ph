<script>
const RAW = {"n":[{"id":"3217971","arxiv":"2610.30240","title":"Probing Heavy Neutral Leptons through New Gauge Interactions at the Forward Physics Facilities","first":"Burk","nauth":6,"year":2026,"cites":0,"role":"today","note":"Co-authors of yours: Dutta. Cites 1 network paper: [[1634858]]. Closest of your papers: [[1686334]] (coupling 0.04, 4 shared references). Closest network paper: [[2708251]] (coupling 0.07, 17 shared references).","score":29.5,"rank":1,"section":"new","parts":[0.45,0.1,0.2,0.5],"abstract":"We investigate the prospects for improving the heavy neutral lepton (HNL) searches at the far-forward LHC experiments FASER and FASER$ν$, as well as their proposed HL-LHC successors, FASER2 and FASER$ν$2, using new HNL production mechanisms. We consider scenarios in which HNLs couple directly to a new $U(1)$ gauge boson and decay into visible Standard Model final states through mixing with active neutrinos. Focusing on the $U(1)_{B-L}$, $U(1)_{B-3L_τ}$, and $U(1)_B$ gauge extensions as benchmark models, we study HNL production through proton bremsstrahlung and Drell--Yan processes, which probe complementary mediator-mass regimes. We analyze several visible decay channels, including charged leptons, neutral mesons, and other hadrons, and evaluate the projected sensitivities for different neutrino-flavor mixing patterns. We find that these new production mechanisms that differ qualitatively from the conventional picture in which both production and decay are controlled by active-sterile mixing enable the far-forward LHC program to probe previously unexplored regions of HNL parameter space, with the first-ever demonstration of FASER$ν$ having sensitivity to HNLs and FASER2 and FASER$ν$2 offering substantially enhanced sensitivity during the HL-LHC era, even reaching the canonical seesaw prediction for all three lepton flavors. Our results demonstrate that new gauge interactions can substantially enhance HNL production independently of the active-sterile mixing that governs their visible decays, opening complementary opportunities to explore HNLs at the forward physics facilities.","authors":"Francis M. Burk, P. S. Bhupal Dev, Bhaskar Dutta, Tao Han, Aparajitha Karthikeyan, Doojin Kim","nlinked":77,"nref":81,"src":"INSPIRE","html":true},{"id":"3216348","arxiv":"2610.25925","title":"Exploring a low-mass H dibaryon in light of the LZ event: A QCD sum rule study","first":"Tan","nauth":2,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[3201080]]. Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2690106]] (coupling 0.01, 1 shared references). Closest network paper: [[3201080]] (coupling 0.15, 12 shared references).","score":26.2,"rank":2,"section":"replacement","parts":[0.48,0.02,0.42,0.0],"abstract":"The LUX-ZEPLIN (LZ) Collaboration recently reported a candidate event consistent with a high-energy nuclear recoil, motivating a possible interpretation by Lee, Takahashi, and Tsai involving the production of an invisible baryon-number-two scalar with a mass near $1.85$ GeV. Motivated by this hypothetical scenario, we investigate the $J^P=0^+$ $uuddss$ hexaquark system using QCD sum rules. We consider five local diquark-diquark-diquark interpolating currents with different scalar and axial-vector diquark combinations, together with a baryon-baryon current constructed from two $Λ$-type baryon currents. The operator product expansions are calculated up to dimension sixteen, and their numerical behaviors are examined under different OPE truncations. Among the currents considered, only the $SU(3)_{\\rm flavor}$-singlet current $J_{SSS}$, consisting of three scalar color-$\\bar{\\mathbf{3}}_C$ diquarks, yields a low-mass solution at $D=12$, with $M_{SSS}=1.85^{+0.19}_{-0.20}$ GeV. Interestingly, scalar color-$\\bar{\\mathbf{3}}_C$ diquarks belong to the flavor $\\bar{\\mathbf{3}}_F$ representation, and their local color-singlet construction has a unique nonvanishing flavor structure, $[ud][ds][su]$, corresponding to $uuddss$. Analogous all-scalar-diquark currents vanish for other flavor configurations, such as $uuuddd$ and $uuudds$. Together with our QCD sum-rule results, this property highlights the special role of the all-scalar-diquark configuration, $[ud][ds][su]$, as a possible deeply bound structure. However, the higher-dimensional OPE contributions exhibit significant truncation dependence, and the low-mass solution remains conditional on the adopted OPE truncation rather than constituting a fully controlled mass prediction.","authors":"Wei-Han Tan, Hua-Xing Chen","nlinked":98,"nref":101,"src":"INSPIRE","html":true},{"id":"3218042","arxiv":"2610.30534","title":"What if dark matter is composite of least interacting particles?","first":"Fortes","nauth":2,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3122101]]. Closest of your papers: [[2859009]] (coupling 0.05, 3 shared references). Closest network paper: [[3122101]] (coupling 0.04, 3 shared references).","score":25.2,"rank":3,"section":"new","parts":[0.45,0.15,0.12,0.0],"abstract":"In this work, we investigate the possibility that Dark Matter contains particles that interact with known matter only through gravity, the least interacting particles (LIPs). Specifically, we consider the case of a dark Proca vector field, which does not mix in the kinetic term with any of the vector bosons of the Standard Model if a discrete symmetry (Z2 ) is imposed. Breaking this symmetry introduces kinetic mixing. Here, we study two realization mechanisms, namely kinetic mixing with the electromagnetic field after electroweak symmetry breaking (Scenario A) and kinetic mixing with the weak hypercharge gauge field (Scenario B). We also consider generalized kinetic terms that violate parity and time-reversal symmetries.","authors":"Elaine C. F. S. Fortes, Vicente Pleitez","nlinked":29,"nref":43,"src":"INSPIRE","html":true},{"id":"3218090","arxiv":"2610.30981","title":"Construction and phenomenological analysis of dynamical Inverse seesaw neutrino mixing model","first":"Bisht","nauth":4,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[1589459]]. Closest of your papers: [[1686334]] (coupling 0.04, 3 shared references). Closest network paper: [[1625258]] (coupling 0.06, 4 shared references).","score":24.9,"rank":4,"section":"new","parts":[0.45,0.12,0.17,0.0],"abstract":"In this manuscript, a dynamical inverse seesaw neutrino ISS(3+1+1+1) mixing model based on the gauge symmetry $U(1)_{B-L}$ extended by the flavor symmetry $A_{4}\\times Z_{2}$ has been constructed. ISS(3+1+1+1) represents three generations of right-handed neutrinos and an extra three generation of singlets sterile neutrinos, wherein the right-handed neutrinos are triplets under $A_4$ symmetry. Furthermore, the five scalar flavon fields are considered in the model, which reproduce neutrino oscillation data within the NuFIT 6.0 experimental range with statistical $\\text{|pull|}=0.01 σ$. The neutrino mass hierarchy is obtained by minimizing the dynamical $A_4\\times Z_2$ scalar flavon $φ_v$ potential. The effective neutrino mass parameter $m_{ββ}$ for the neutrinoless double beta decay $0vββ$ has been charecterised in the manuscript. The effective neutrino mass parameter spans a finite region in the parameter space rather then being confined to a single point and it is constrained by the KamLAND-Zen excluded band. The model successfully explains active-sterile neutrino mixing and non-unitarity of the PMNS matrix is consistent with the cosmological upper bound. The minimum value of the sum of the active neutrinos' mass turns out to be $m_{i}\\approx 62\\ \\ (99.4)\\ \\text{meV}$ for Normal ordering (Inverted ordering), which lies within the range of both Planck 2018 loose cosmological limit $\\sum m_{i}<120\\ \\text{meV}$ and tighter limit $\\sum m_{i}<72\\ \\text{meV}$ of DESI-2024. Our model immensely favours normal ordering, in agreement with the tighter constraints reported by DESI-2024.","authors":"Manish Singh Bisht, Shuchi Bisht, Mayank Joshi, Navjot Hothi","nlinked":47,"nref":59,"src":"INSPIRE","html":true},{"id":"3218194","arxiv":"2610.31666","title":"Boosted Dark Matter Directionality in Large Liquid Scintillator Detectors","first":"Tse","nauth":5,"year":2026,"cites":0,"role":"today","note":"Co-authors of yours: Choi. Closest of your papers: [[2859009]] (coupling 0.05, 4 shared references). Closest network paper: [[2703113]] (coupling 0.03, 3 shared references).","score":11.2,"rank":5,"section":"new","parts":[0.0,0.14,0.1,0.5],"abstract":"Light dark matter can be boosted by cosmic-ray-dark matter interactions, which opens the possibility of direct-detection searches with large neutrino detectors. We consider the signal produced by boosted dark matter undergoing quasi-elastic scattering off carbon and knocking out a neutron in a large liquid scintillator detector. A distinctive delayed gamma ray from neutron capture can be reconstructed after $\\sim 210$ $μ$s, which is paired up with the prompt signal during neutron propagation. We find that 100 kt$\\cdot$yr of data from the neutron-coincidence channel will be able to probe new parameter space compared to free proton signals found in previous work. We further consider the possibility of utilizing directional information from the displaced vertex associated with the capture of the final-state neutron. However, we find that directional information does not materially improve the sensitivity due to the large nucleon scattering angle.","authors":"Samuel S. H. Tse, Qishan Liu, Kenny C. Y. Ng, Koun Choi, Yu-Feng Li","nlinked":80,"nref":92,"src":"INSPIRE","html":true},{"id":"3201080","arxiv":"2609.07800","title":"Inelastic Singlet-Doublet Fermion Dark Matter in light of the 248 keV LZ event","first":"Borah","nauth":4,"year":2026,"cites":54,"role":"other","note":"","score":null},{"id":"2946768","arxiv":"","title":"Exploring the Frontiers of Standard Model : Neutrinos and Dark Matter, 2021-2025","first":"Suárez Roldán","nauth":1,"year":2025,"cites":0,"role":"other","note":"","score":null},{"id":"2855387","arxiv":"2412.02027","title":"Multicomponent secluded WIMP dark matter and Dirac neutrino masses with an extra Abelian gauge symmetry","first":"Agudelo","nauth":4,"year":2024,"cites":6,"role":"seed","note":"","score":null},{"id":"1625258","arxiv":"1709.08417","title":"Common origin of neutrino mass and dark matter from anomaly cancellation requirements of a $U(1)_{B-L}$ model","first":"Nanda","nauth":2,"year":2017,"cites":50,"role":"other","note":"","score":null},{"id":"2859009","arxiv":"2412.08700","title":"Effective field theory and scalar triplet dark matter","first":"Arbeláez","nauth":5,"year":2024,"cites":0,"role":"seed","note":"","score":null},{"id":"2708251","arxiv":"","title":"Neutrino Masses and Lepton Flavor Physics Beyond the Standard Model","first":"Valiente","nauth":1,"year":2023,"cites":1,"role":"other","note":"","score":null},{"id":"1634858","arxiv":"1711.02180","title":"Lepton Number Violation: Seesaw Models and Their Collider Tests","first":"Cai","nauth":4,"year":2017,"cites":382,"role":"other","note":"","score":null},{"id":"1686334","arxiv":"1808.03352","title":"Two-component dark matter and a massless neutrino in a new $B-L$ model","first":"Bernal","nauth":4,"year":2018,"cites":54,"role":"seed","note":"","score":null},{"id":"1764403","arxiv":"1911.04703","title":"Connecting Light Dirac Neutrinos to a Multi-component Dark Matter Scenario in Gauged $B-L$ Model","first":"Nanda","nauth":2,"year":2019,"cites":55,"role":"other","note":"","score":null},{"id":"3122101","arxiv":"2602.17764","title":"Minimal dark matter: Generalized framework and direct-detection sensitivity","first":"Griffith","nauth":4,"year":2026,"cites":4,"role":"other","note":"","score":null},{"id":"1386494","arxiv":"1508.00706","title":"Radiative linear seesaw model, dark matter, and $U(1)_{B-L}$","first":"Wang","nauth":2,"year":2015,"cites":97,"role":"other","note":"","score":null},{"id":"1742302","arxiv":"1907.00991","title":"Neutrino Non-Standard Interactions: A Status Report","first":"Bhupal Dev","nauth":26,"year":2019,"cites":271,"role":"other","note":"","score":null},{"id":"2817040","arxiv":"","title":"Review of particle physics","first":"Navas","nauth":244,"year":2024,"cites":6488,"role":"other","note":"","score":null},{"id":"1589459","arxiv":"1704.01107","title":"Singlet scalar Dark matter in $U(1)_{B-L}$ models without right-handed neutrinos","first":"Singirala","nauth":3,"year":2017,"cites":39,"role":"other","note":"","score":null},{"id":"2703113","arxiv":"2309.15052","title":"Singlet–doublet Dirac fermion dark matter from Peccei–Quinn symmetry","first":"Longas","nauth":4,"year":2023,"cites":4,"role":"other","note":"","score":null},{"id":"1475692","arxiv":"1607.04029","title":"A new B − L model without right-handed neutrinos","first":"Patra","nauth":3,"year":2016,"cites":59,"role":"other","note":"","score":null}],"e":[[0,15,"k"],[14,17,"c"],[4,19,"k"],[0,12,"k"],[3,20,"k"],[1,5,"c"],[7,17,"c"],[13,20,"c"],[2,7,"k"],[6,12,"c"],[13,12,"c"],[0,10,"k"],[0,11,"c"],[3,13,"k"],[12,20,"c"],[2,14,"c"],[6,19,"c"],[1,17,"c"],[18,20,"c"],[13,8,"c"],[6,7,"c"],[2,9,"k"],[8,18,"c"],[13,15,"c"],[8,20,"c"],[4,9,"k"],[3,12,"k"],[16,11,"c"],[3,18,"c"],[4,6,"k"],[10,11,"c"],[3,8,"k"],[13,18,"c"],[0,16,"k"],[6,17,"c"],[18,15,"c"],[8,15,"c"]],"next":[{"arxiv":"2610.31101","id":"3218111","title":"Saxion Decay and Dark Radiation in the KSVZ Axion Model","authors":"Sidhartha Samtani, Amartya Sengupta","score":9.8,"section":"new","rank":6,"parts":[0.0,0.17,0.27,0.0],"note":"Closest of your papers: [[1607572]] (coupling 0.06, 6 shared references). Closest network paper: [[2703113]] (coupling 0.09, 14 shared references).","abstract":"We calculate the relativistic axion energy density produced by the decay of a curvature-displaced Peccei--Quinn condensate in a quartic KSVZ model. We follow the radial PQ field (the saxion) as it relaxes from its inflationary minimum and determine the surviving condensate abundance from the adiabatic action of its oscillations. We then evolve the condensate through its decay into axions and visible particles to calculate the resulting dark-radiation contribution, expressed as $ΔN_{\\rm eff}$. With one heavy coloured KSVZ fermion and no additional portal interactions included, the axion channel dominates the two tree-level decay modes. Two reference histories yield $ΔN_{\\rm eff}\\simeq0.033$ and $0.12$, with maximum saxion energy fractions below $1\\%$ and $4\\%$, respectively. At fixed quartic coupling, increasing the duration of curvature release reduces the predicted axion radiation density relative to visible radiation by a factor of approximately $28$ while preserving the primordial isocurvature amplitude."},{"arxiv":"2610.30245","id":"3217957","title":"Sequential SBI for Resonance Searches at the LHC","authors":"Henning Bahl, Ranit Das","score":9.6,"section":"new","rank":7,"parts":[0.06,0.14,0.16,0.0],"note":"Also cites widely used network papers: [[902365]]. Closest of your papers: [[1455793]] (coupling 0.04, 7 shared references). Closest network paper: [[1674879]] (coupling 0.05, 6 shared references).","abstract":"Neural simulation-based inference has been shown to extract significantly more information from LHC data than histogram-based analyses. So far, it has mostly been applied to couplings, for which the polynomial structure of the scattering amplitude can be exploited. Masses and widths instead move and deform the signal in phase space, and learning their likelihood requires many event samples covering the continuous theory parameter space. We show how sequential simulation-based inference can address this by iteratively concentrating the simulations where the observed data points. Using a parton-level example with an exact reference likelihood and reconstruction-level analyses of $A\\to ZH\\to \\ell\\ell b\\bar b$ and $Y\\to HH\\to (t\\bar t)(t\\bar t)$, we demonstrate that sequential training produces significantly more accurate and better calibrated likelihoods than single round training with the same amount of training events."},{"arxiv":"2606.07742","id":"3166352","title":"Core Composition Effects on the QCD Axion Mass Limit from Neutron Star Cooling","authors":"Fernando Arias-Aragón, Federico Nola","score":9.3,"section":"replacement","rank":8,"parts":[0.06,0.12,0.19,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1607572]] (coupling 0.04, 5 shared references). Closest network paper: [[2703113]] (coupling 0.07, 11 shared references).","abstract":"Neutron stars are very dense media in which axions may be produced. This has been used to set a limit on the QCD axion mass, usually under the assumption that only neutrons, protons, electrons, and muons appear in the star core. Given the extreme conditions reached within neutron stars, it is reasonable to consider that other particles, such as hyperons and $Δ$ resonances, may appear in the neutron star core. In this work, we study how the limit on the mass of QCD axions, namely KSVZ and DFSZ invisible axions, is altered when different equations of state are used, allowing for heavier particles to appear in the neutron star core. We find that this dependence is in general mild and thus reinforces the reliability of the known limit. Additionally, in the DFSZ scenario, it may drive the limit within the sensitivity window for IAXO. This would allow this experiment to discern the composition of neutron star cores if an axion were to be observed within that window."},{"arxiv":"2610.30507","id":"3218049","title":"ULTRAMAN: A Proposed ultrasound detector for macroscopic dark matter","authors":"Oem Trivedi, Robert J. Scherrer, Alfredo Gurrola","score":8.5,"section":"cross","rank":9,"parts":[0.0,0.06,0.1,0.5],"note":"Co-authors of yours: Gurrola. Closest of your papers: [[1741056]] (coupling 0.02, 1 shared references). Closest network paper: [[1399202]] (coupling 0.04, 1 shared references).","abstract":"We propose ULTRAMAN (ULTRAsound Macro ANalyzer), a passive ultrasound array experiment designed to search for macroscopic dark matter (macros) through coherent acoustic disturbances generated as compact objects traverse a controlled target medium. Unlike existing dark matter detectors that primarily rely on scintillation, ionization, or other signatures of energy deposition, ULTRAMAN exploits the acoustic response of matter to reconstruct individual highly supersonic trajectories using synchronized multielement ultrasound arrays. The framework connects macro stopping power and interaction cross section to the resulting acoustic pressure, while the expected event rate probes the macro mass and abundance. A genuine candidate would appear not as an isolated radio frequency spike, but as a correlated multichannel track consistent with a single highly supersonic passage through the target. Representative macro, nuclearite, axion quark nugget, and primordial black hole benchmarks are shown to occupy distinct regions of the resulting acoustic observable space. Existing ultrasound technology offers a realistic route to an event-level terrestrial search for macroscopic dark matter, with null observations translating into complementary constraints on its parameter space."},{"arxiv":"2512.00166","id":"3088044","title":"Searching for Ultralight Dark Matter with MOLeQuTE: a Massive Optically Levitated Quantum Tabletop Experiment","authors":"Louis Hamaide, Hannah Banks, Peter Barker, Andrew A. Geraci","score":7.4,"section":"replacement","rank":10,"parts":[0.0,0.12,0.23,0.0],"note":"Closest of your papers: [[1607572]] (coupling 0.04, 5 shared references). Closest network paper: [[2703113]] (coupling 0.08, 13 shared references).","abstract":"Many well theoretically motivated models of ultralight dark matter are expected to give rise to feeble oscillatory forces on macroscopic objects. Optically trapped sensors have high force sensitivities but have remained relatively unexplored in this context. In this work we propose a new, tunable, optically trapped sensor specifically designed to detect such forces. Our design features a high-mass ($\\sim$ mg) plate whose high aspect ratio allows its weight to be supported by a vertical beam without excessive heating. We present the first systematic analysis and optimisation of quantum noises in optically trapped systems and show that our setup has the potential to operate at the standard quantum limit with current off-the-shelf technologies. We demonstrate that our sensor could offer unique access to large regions of uncharted parameter space of vector B-L dark matter, with projected sensitivities that could advance existing limits by several orders of magnitude over a broad range of frequencies."},{"arxiv":"2606.23749","id":"3171509","title":"axionbloch: an Open-Source Python Package for Simulating Axion-Induced Spin Dynamics","authors":"Yuzhe Zhang","score":7.2,"section":"replacement","rank":11,"parts":[0.0,0.12,0.19,0.0],"note":"Closest of your papers: [[1607572]] (coupling 0.04, 3 shared references). Closest network paper: [[2703113]] (coupling 0.07, 7 shared references).","abstract":"The interaction of ultralight bosonic dark matter with spins can be interpreted as a pseudomagnetic field acting on normal matter. Such interactions can be modeled as usual magnetic interactions using spin-evolution (Bloch) equations. axionbloch, an open-source Python package for simulating spin dynamics induced by both usual and exotic interactions, is presented. The numerical simulations serve as a tool for deriving axion signal signatures, which are crucial for designing experimental searches and data analysis. Simulations are calibrated against theoretical expectations, ensuring the accuracy of the simulated signals. axionbloch is available at https://github.com/Yuzhe98/AxionBloch, allowing researchers to simulate pseudomagnetic signals under specific configurations of the axion models and experimental setups. The package is documented at http://axionbloch.readthedocs.io/ and includes example scripts for application."},{"arxiv":"2610.31254","id":"3218141","title":"A consistent neutrino determination of the low-energy weak mixing angle","authors":"M. Atzori Corona, M. Cadeddu, N. Cargioli, F. Dordei, L. Ferro, C. Giunti, R. Pavarani, M. Sestu","score":7.0,"section":"new","rank":12,"parts":[0.06,0.1,0.07,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[599285]] (coupling 0.04, 3 shared references). Closest network paper: [[1287034]] (coupling 0.03, 7 shared references).","abstract":"The weak mixing angle, $\\sin^2θ_W$, is a fundamental parameter of the Standard Model and a sensitive probe of electroweak physics across various energy scales. At low momentum transfer, the Standard Model prediction approaches a well-defined low-energy plateau, providing a target for precision tests of the electroweak theory. At the lowest momentum transfer, atomic parity violation (APV) in cesium provides one of the most precise determinations of the weak mixing angle. Here, we review and update the status of this determination and compare it with other available probes. We then consistently reanalyze low-energy neutrino scattering data and combine the resulting determinations from coherent elastic scattering (CE$ν$NS) and neutrino-electron scattering. The complementary sensitivity of these processes to electroweak couplings enables a neutrino-based determination of the low-energy weak mixing angle, accounting for electroweak radiative corrections and relevant theoretical uncertainties. Our global analysis yields $\\sin^2θ_W^{\\rm low}(ν\\,\\text{data}) = 0.233^{+0.007}_{-0.006}$. We assess the consistency and relative impact of the individual neutrino measurements and discuss the prospects for future CE$ν$NS and neutrino-electron scattering experiments to improve the precision of this determination. Our analysis provides an independent test of the Standard Model at low momentum transfer, complementary to that provided by atomic parity violation."},{"arxiv":"2610.31312","id":"3218172","title":"Lepton number and flavor violation mediated by doubly charged scalars at $μ$TRISTAN $μ^+ μ^+$ collider","authors":"Takeshi Fukuyama, Yukihiro Mimura, Yuichi Uesaka","score":6.7,"section":"new","rank":13,"parts":[0.0,0.1,0.21,0.0],"note":"Closest of your papers: [[1249404]] (coupling 0.04, 7 shared references). Closest network paper: [[2665284]] (coupling 0.07, 11 shared references).","abstract":"Charged lepton flavor violation is an important probe of physics beyond the Standard Model. Although $ΔL_μ= -ΔL_e = \\pm 1$ lepton flavor violating (LFV) processes, such as $μ\\to eγ$ and $μ\\to 3e$, are severely constrained experimentally, there is still plenty of room for LFV processes involving lepton number violation (LNV). In this paper, we investigate such processes at a $μ^+μ^+$ collider that remain even if processes with $ΔL_μ= -ΔL_e = \\pm 1$ are forbidden by discrete symmetries. We consider processes induced by doubly charged scalars, which can be either an $SU(2)_L$ singlet or a component of an $SU(2)_L$ triplet. The cross sections of these processes at the collider depend on the representation of the scalar unless the muon beam is unpolarized. In the case of $ΔL_μ= -ΔL_e = 2$, we discuss the combination of the muonium-to-antimuonium transition and the $μ^+μ^+ \\to e^+e^+γ/Z$ processes at the collider, and how the model parameters, such as the scalar couplings and mass, can be determined from experimental measurements. Doubly charged scalars are often utilized in models for generating neutrino masses, and they can also be used to construct models with LNV processes at a muon collider. If neutrino masses are generated at tree level, the LNV processes at the collider are suppressed, and therefore, we consider models that do not induce neutrino masses at tree level. LNV processes, such as $μ^+μ^+ \\to t\\bar b t\\bar b$ and $μ^+μ^+ \\to μ^+ e^- t\\bar b t\\bar b$, are possible in these models. Even if LNV is indicated by searches at hadron colliders, it is worthwhile to pursue these processes as clean LNV signals at a lepton collider."},{"arxiv":"2610.30261","id":"3218006","title":"Variable-phase methods and data for long-range scattering","authors":"Marcos M. Flores, Kalliopi Petraki, Thomas Pignard","score":6.6,"section":"new","rank":14,"parts":[0.0,0.07,0.28,0.0],"note":"Closest of your papers: [[1249404]] (coupling 0.03, 2 shared references). Closest network paper: [[3122101]] (coupling 0.10, 6 shared references).","abstract":"Long-range interactions play an important role in dark-matter phenomenology, affecting the relic abundance, indirect-detection signals, and structure formation on galactic scales. Reliable predictions often require nonperturbative solutions of the Schrödinger equation over broad parameter ranges and many partial waves. We present a numerical framework based on the variable-phase method, which recasts the radial Schrödinger equation as a system of first-order equations and allows both regular and irregular solutions to be computed efficiently. The former determine phase shifts and Sommerfeld factors, while the latter provide additional information relevant for the self-consistent unitarization of contact-like inelastic interactions. We discuss the numerical implementation, integration-domain selection, partial-wave convergence, and comparisons with analytic limits. We release the code together with tables for the Yukawa potential containing phase shifts, Sommerfeld factors, elastic and angularly weighted cross sections, and the irregular-solution information relevant for unitarization. These resources facilitate dark-matter studies without requiring repeated computationally intensive scans."},{"arxiv":"2605.07108","id":"3153509","title":"Search for Sub-GeV Axion-Like Particles at EBES Pilot Run Using 4 GeV Positron Beam at KEK LINAC","authors":"Takahiro Fusayasu, Tomoya Iizawa, Fumihito Ikeda, Akimasa Ishikawa, Masako Iwasaki, Hiroshi Iwase, Takahiro Kawahara, Aoi Masaki, Fusashi Miyahara, Yu Morikawa, Yuichi Okayasu, Toshiyuki Ono, Hidetoshi Otono, Yasuhito Sakaki, Takumi Seino, Yuta Shimasaki, Taikan Suehara, Yosuke Takubo, Shusaku Tsumura, Kosuke Uemura, Yifu Zhang","score":6.6,"section":"replacement","rank":15,"parts":[0.0,0.15,0.1,0.0],"note":"Closest of your papers: [[1607572]] (coupling 0.05, 3 shared references). Closest network paper: [[1944631]] (coupling 0.04, 5 shared references).","abstract":"We report the results of a search for sub-GeV axion-like particles (ALPs) using pilot run data from the Electron Beam-dump Experiment at KEK LINAC Switching Yard 3 (EBES). The data were collected in December 2023 with a 4 GeV positron beam and correspond to $5.7\\times10^{13}$ positrons on target. In the pilot run setup, a tungsten beam dump and a single PbO calorimeter were used. We consider ALP production via the Primakoff process induced by bremsstrahlung photons in the beam dump, followed by the decay $a\\toγγ$. The background was estimated with a data-driven method, and a signal region was defined such that the expected background yield is below 0.1 events. No events were observed after unblinding. Upper limits at the 90% confidence level were derived in the ALP mass-coupling plane, extending the experimental coverage into a region of parameter space not explored by previous searches."},{"arxiv":"2610.30238","id":"3217972","title":"Probing imperfect axions with nuclear clocks","authors":"Salvatore Bottaro, Andrea Caputo, Gilad Perez, Yotam Soreq, Alfredo Stanzione","score":6.5,"section":"new","rank":16,"parts":[0.0,0.11,0.17,0.0],"note":"Closest of your papers: [[1607572]] (coupling 0.04, 4 shared references). Closest network paper: [[2703113]] (coupling 0.06, 9 shared references).","abstract":"We show that $^{229}$Th nuclear clocks can probe departures from the Peccei-Quinn (PQ) solution to the strong CP problem. Explicit PQ breaking or additional CP-violating interactions can shift the minimum of the axion potential and generate CP-violating couplings to matter, inducing a clock response linear in the axion field. We investigate explicit PQ breaking and quark chromo-electric dipole operators as representative realizations of these \\textit{imperfect axion} scenarios, consistent with electric dipole moment constraints. For axion dark matter, the linear signal oscillates at the Compton frequency and can dominate the quadratic response. Even without axion dark matter, the Earth can source a static axion field, enabling fifth-force searches with nuclear clocks."},{"arxiv":"2610.31658","id":"3218200","title":"Neutrino Mass in Left-Right Symmetry: From Majorana Signals to Dirac Predictions","authors":"Vladimir Tello","score":5.7,"section":"new","rank":17,"parts":[0.0,0.07,0.21,0.0],"note":"Closest of your papers: [[1755250]] (coupling 0.02, 5 shared references). Closest network paper: [[1634858]] (coupling 0.07, 24 shared references).","abstract":"We review neutrino mass as a probe of restored parity in left-right symmetric theories, emphasizing the distinct Majorana and Dirac realizations. In the Majorana theory, lepton-number violation connects the seesaw mechanism to neutrinoless double beta decay, heavy-neutrino production and the Keung-Senjanovic process. The Dirac alternative removes these characteristic signals while retaining a relation between left- and right-handed flavor. The right-handed leptonic mixing matrix can then be reconstructed from low-energy data and the spontaneous parity-breaking parameter. Requiring the two lepton Yukawa matrices to admit a common real parity basis turns this reconstruction into a compatibility condition that determines the allowed Dirac phase on each branch. For three generations, this requirement reduces to a single rephasing-invariant CP-odd obstruction, which also governs the right-left modulus mismatch and the relative CP orientation. The small Dirac masses also restrict the parity deformation and its induced strong-CP phase. For compressed mixed-sign neutrino spectra, a tiny parity deformation can nevertheless generate large leptonic CP violation, despite stringent strong-CP constraints. The resulting branch-dependent correlations connect leptonic CP, the absolute neutrino mass and strong CP. We place this construction alongside radiative and unified approaches to predicting leptonic CP violation."},{"arxiv":"2610.30255","id":"3217987","title":"$γ$hosts from the past: reheating neutron stars with supernova-sourced ALPs","authors":"Debajit Bose, Sougata Ganguly, Tanmoy Kumar, Nirmal Raj","score":5.6,"section":"new","rank":18,"parts":[0.0,0.1,0.13,0.0],"note":"Closest of your papers: [[1607572]] (coupling 0.04, 4 shared references). Closest network paper: [[2703113]] (coupling 0.05, 8 shared references).","abstract":"Axion-like particles (ALPs) can be copiously produced in the hot and dense environment of a core-collapse supernova. If their mass is within an order of magnitude of the supernova temperature, a non-negligible fraction of them will remain gravitationally bound to the neutron star remnant. This basin of ALPs can then decay to photons over the lifetime of the neutron star, thereby reheating it. Using the measured luminosities of several neutron stars, we close multiple windows in ALP parameter space while also satisfying the SN 1987A cooling constraint on the ALP-nucleon coupling. In particular, using the 35000 K upper limit on the temperature of the coldest neutron star observed, PSR J2144$-$3933, we derive the strongest upper limits on the ALP-photon coupling for 1$-$400 MeV ALP masses. Ceilings on these limits arising from ALP decays occurring within the neutron star lifetime may be overcome by using younger neutron stars such as the one in Cas A, probing couplings orders of magnitude higher. Observations of a $2000 \\, {\\rm K}$-hot neutron star in infrared observatories such as the James Webb Space Telescope could reach ALP-photon couplings three orders lower and ALP masses one order lower than our current limits."},{"arxiv":"2608.14195","id":"3191224","title":"Probing the Single Production of First-Generation Singlet Vector-like Leptons at Future $e^+e^-$ Colliders","authors":"Yao-Bei Liu, Stefano Moretti","score":5.6,"section":"replacement","rank":19,"parts":[0.0,0.11,0.12,0.0],"note":"Closest of your papers: [[1455793]] (coupling 0.03, 5 shared references). Closest network paper: [[1710078]] (coupling 0.04, 16 shared references).","abstract":"We study the single production of first-generation weak-isosinglet vector-like leptons (VLLs) at future $e^+e^-$ colliders through $e^+e^-\\to e^\\pm E^\\mp$, with the subsequent decays $E^\\pm\\to W^\\pmν_e$, $e^\\pm Z$, and $e^\\pm h$. For the heavy VLL masses considered, the hadronic decays of the $W$ and $Z$ bosons are reconstructed as fat-jets, while the Higgs boson is reconstructed from two resolved $b$-tagged jets at $\\sqrt{s}=1~{\\rm TeV}$ and as a fat-jet at $\\sqrt{s}=1.5~{\\rm TeV}$. Using detector-level Monte Carlo simulations for the 1~TeV ILC and 1.5~TeV CLIC, we perform a baseline cut-based analysis in which the well-defined two-body production kinematics are exploited through a mass-hypothesis-dependent selection on the associated-electron energy. At fixed nominal center-of-mass energy, this observable is in one-to-one correspondence with the VLL recoil mass and therefore provides a common mass-sensitive discriminator for all three decay channels. We derive the $2σ$ exclusion and $5σ$ discovery reaches on the VLL--electron mixing angle $\\sinθ_L$ as functions of the integrated luminosity. For the benchmark points studied, sizeable sensitivity is retained at $m_E=900~{\\rm GeV}$ at the ILC and $m_E=1400~{\\rm GeV}$ at CLIC, while the accessible values of $\\sinθ_L$ extend below the reference electroweak precision bound used in this study. These results demonstrate the complementary potential of direct searches for first-generation singlet VLLs at future lepton colliders."},{"arxiv":"2610.30252","id":"3217999","title":"Neutrino Transition Polarizability","authors":"Matteo Borrello, Michele Tammaro","score":5.5,"section":"new","rank":20,"parts":[0.0,0.07,0.2,0.0],"note":"Closest of your papers: [[1708009]] (coupling 0.02, 2 shared references). Closest network paper: [[3214448]] (coupling 0.07, 7 shared references).","abstract":"We study Neutrino Transition Polarizability, where a light pseudoscalar $φ$ couples active neutrinos to heavy neutral leptons $N$ and interacts with two photons. We consider an effective description of the active - sterile interaction, and a realization within the inverse seesaw mechanism; the coupling to photons is generated by heavy charged states. For $m_N>m_φ$, the decay $N\\toνφ$ can greatly shorten the heavy neutrino lifetime, while $φ\\toγγ$ produces a displaced photon pair. This changes the relevant search strategies, favoring production and decay inside detectors. We discuss existing constraints and estimate the sensitivity of displaced photon searches at DUNE, Belle II, LHCb and FCC-ee, highlighting the complementarity of neutrino scattering and meson and electroweak boson decays."},{"arxiv":"2607.13128","id":"3180741","title":"Dark Energy and Neutrino Flavor from the Weak Axion","authors":"Pedro Bittar, Carlos E. M. Wagner","score":4.9,"section":"replacement","rank":21,"parts":[0.06,0.03,0.1,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1854224]] (coupling 0.01, 1 shared references). Closest network paper: [[2940359]] (coupling 0.03, 9 shared references).","abstract":"Dynamical dark energy offers an alternative to a cosmological constant with distinct observational signatures. However, the small energy density scale, Hubble-sized mass, and Planckian excursions make simple models fine-tuned and unnatural e related to the pole mass of the top quark. By fitting final-state observables in top pair production at current hadron and future lepton colliders, we extract a negative mass difference between the input Pythia mass for the top quark and the pole mass of around $240$-$330$ MeV, consistent with $\\mathcal{O}(Λ_{\\rm QCD})$."},{"arxiv":"2610.30253","id":"3217976","title":"Mass-Varying Dark Matter, Naturally","authors":"Cédric Delaunay, Seung J. Lee, Yuan Yin, Bingrong Yu","score":4.4,"section":"new","rank":23,"parts":[0.0,0.08,0.11,0.0],"note":"Closest of your papers: [[468209]] (coupling 0.03, 2 shared references). Closest network paper: [[1294681]] (coupling 0.04, 2 shared references).","abstract":"Ultralight scalars that vary dark-matter masses require protection from quantum corrections. Cyclic $\\mathbb{Z}_N$ symmetries provide this protection but also suppress variation of the mean mass of equally populated partners. Unsuppressed variation typically requires asymmetric reheating through symmetry-breaking couplings that threaten radiative control. We show that scalar-induced mass splittings built into these constructions can instead bias relic abundances through symmetric interactions. The mechanism applies to thermal and nonthermal relics that reach internal equilibrium after production, and permits mass variation over a broad range of timescales."},{"arxiv":"2610.30360","id":"3218033","title":"Gravitational Waves From an Entangled SO(3) Cosmic String Network","authors":"Mu-Chun Chen, Cameron Moffett-Smith","score":4.4,"section":"new","rank":24,"parts":[0.0,0.08,0.1,0.0],"note":"Closest of your papers: [[2690106]] (coupling 0.03, 2 shared references). Closest network paper: [[2963992]] (coupling 0.03, 4 shared references).","abstract":"Discrete non-Abelian symmetries such as $\\mathrm{A_4}$ are widely used in models of lepton flavor to explain neutrino mass hierarchy and their large mixing. If such a symmetry arises from the spontaneous breaking of a continuous group, cosmic strings can form. We study the breaking $\\mathrm{SO}(3)\\to \\mathrm{A_4}$, for which the strings are classified by the non-Abelian group $π_1(\\mathrm{SO}(3)/\\mathrm{A_4})\\cong \\mathrm{T}'$, the binary tetrahedral group. Because the string fluxes do not commute, colliding strings may reconnect, pass through each other, or become joined by a bridge whose flux can belong to a different string network. We derive the probabilities of these outcomes directly from the group structure; in network models they are usually treated as free parameters. Including them in a multi-network velocity-dependent one-scale model, we find that the correlation length of the networks decreases and their energy density increases relative to Abelian $\\mathrm{U}(1)$ strings of the same tension. The resulting stochastic gravitational-wave background is enhanced by up to nearly three orders of magnitude, showing that the algebraic structure of $π_1$ leaves a direct imprint on the gravitational-wave spectrum."},{"arxiv":"2601.08502","id":"3103941","title":"Decoding Weak Phase Amplitudes in Charmed Baryon Decays","authors":"Zhi-Peng Xing, Jin Sun, Xiao-Gang He","score":4.4,"section":"replacement","rank":25,"parts":[0.06,0.04,0.05,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2690106]] (coupling 0.01, 1 shared references). Closest network paper: [[3205155]] (coupling 0.02, 1 shared references).","abstract":"In this Letter, we present a strategy to decode decay amplitudes with different weak phases in two-body charmed baryon decays, addressing a long-standing challenge to understanding CP violation in this sector. Using SU(3) flavor symmetry, we disentangle the amplitudes defined through $M=λ_s A_s + λ_b A_b$ ($λ_i = V_{ui}V_{ci}^*$), enabling a data-driven determination of their relative hierarchy across Cabibbo-favored, singly, and doubly Cabibbo-suppressed modes. Applying this framework to current data, we find that the ratio $A_   const placed=[];L.forEach(l=>{let k=0;while(k<40&&placed.some(p=>l.x0<p.x0+p.w&&p.x0<l.x0+l.w&&Math.abs(l.y-p.y)<13)){l.y+=13*(k%2?-1:1)*(1+Math.floor(k/2));k++;l.y=Math.max(m.t+10,Math.min(H-m.b-4,l.y))}placed.push(l)});
  G.append('g').selectAll('text').data(L).join('text').attr('class','nlabel').attr('x',l=>l.right?l.s.x-r(l.s.n)-4:l.s.x+r(l.s.n)+4).attr('y',l=>l.y)
    .attr('text-anchor',l=>l.right?'end':'start').text(l=>l.t);
  paint();
}
function showTip(ev,n){const b=document.getElementById('chart').getBoundingClientRect();tip.hidden=false;tip.textContent=`${auth(n)} (${n.year}) — ${plain(n.title)}`+(isNew(n)?` · score ${n.score}`:'');
  let L=ev.clientX-b.left+12;if(L>b.width-290)L=ev.clientX-b.left-290;tip.style.left=Math.max(4,L)+'px';tip.style.top=(ev.clientY-b.top+12)+'px'}
function paint(){if(!G)return;const f=hover||sel,on=new Set();if(f){on.add(f.i);f.out.forEach(i=>on.add(i));f.inn.forEach(i=>on.add(i))}
  svg.classed('dim',!!f);
  G.selectAll('path.edge').attr('class',l=>'edge '+l.k+(!f?'':l.s===f.i?' hot out':l.t===f.i?' hot in':''));G.selectAll('path.edge.hot').raise();
  G.selectAll('circle').classed('on',s=>on.has(s.n.i)).classed('sel',s=>sel&&s.n.i===sel.i).classed('match',s=>query&&`${s.n.first} ${s.n.title} ${s.n.arxiv} ${s.n.authors||''}`.toLowerCase().includes(query));
  G.selectAll('text.nlabel').classed('on',l=>on.has(l.s.n.i))}
function panel(){const p=document.getElementById('panel'),n=sel;
  if(!n){p.innerHTML='<p>Select a paper in the network.</p>';return}
  const links=`<div class="links">${n.id?`<a href="https://inspirehep.net/literature/${n.id}" target="_blank" rel="noopener">INSPIRE</a>`:''}${n.arxiv?`<a href="https://arxiv.org/abs/${esc(n.arxiv)}" target="_blank" rel="noopener">arXiv</a>`:''}</div>`;
  if(isNew(n)) p.innerHTML=`<div class="role" style="color:${col(n)}">#${n.rank} · ${esc(SEC[n.section])} · score ${n.score.toFixed(1)}</div><h4>${esc(n.title)}</h4>
   <div class="meta">${esc(auth(n))} · arXiv:${esc(n.arxiv)}</div><p>${why(n.note)}</p><div class="links"><a href="#p${n.i}">Back to abstract</a></div>`;
  else p.innerHTML=`<div class="role" style="color:${col(n)}">${esc(ROLE[n.role])}</div><h4>${esc(n.title)}</h4>
   <div class="meta">${esc(auth(n))} · ${n.year}${n.arxiv?' · arXiv:'+esc(n.arxiv):''}</div>
   <div class="stats"><span>${n.cites.toLocaleString()} citations</span><span>${n.inn.filter(i=>isNew(N[i])).length} of the matches link here</span></div>${links}`;
  tex(p)}
function pick(n,scroll){sel=n;panel();paint();document.querySelectorAll('.paper').forEach(el=>el.classList.toggle('sel',el.id==='p'+n.i));if(scroll)document.getElementById('chart').scrollIntoView({behavior:'smooth',block:'nearest'})}
const present=new Set(N.map(n=>n.role));
document.getElementById('legend').innerHTML=['today','repl','seed','other'].filter(k=>present.has(k)).map(k=>`<span><i class="dot" style="background:var(--${k})"></i>${esc(ROLE[k])}</span>`).join('')+'<span style="color:var(--fg-3)">Listing papers: size ∝ score; others: size ∝ log(citations)</span>';
document.getElementById('q').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();paint()});
svg.on('click',ev=>{if(ev.target.tagName!=='circle'){sel=null;panel();paint()}});
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(draw,200)});
function nextList(){const X=RAW.next||[];if(!X.length)return;const box=document.getElementById('nextlist'),more=document.getElementById('more');
  more.hidden=false;more.querySelector('summary').firstChild.textContent=`The next ${X.length} papers by score `;
  document.getElementById('moresub').textContent=`below the threshold of ${M.threshold}, not drawn in the network`;
  box.innerHTML=X.map(n=>`<li><div class="role" style="color:var(--${n.section==='replacement'?'repl':'today'})">#${n.rank} · ${esc(SEC[n.section])} · score ${n.score.toFixed(1)}</div>
    <div class="t">${esc(n.title)}</div><div class="authors">${authors(n.authors)} · arXiv:${esc(n.arxiv)}</div>
    ${n.note?`<p class="why">${why(n.note)}</p>`:''}
    <details class="abs"><summary>Abstract</summary><p class="abs">${esc(n.abstract)}</p></details>
    <div class="links">${n.id?`<a href="https://inspirehep.net/literature/${n.id}" target="_blank" rel="noopener">INSPIRE</a>`:''}<a href="https://arxiv.org/abs/${esc(n.arxiv)}" target="_blank" rel="noopener">arXiv</a><a href="https://arxiv.org/pdf/${esc(n.arxiv)}" target="_blank" rel="noopener">PDF</a></div></li>`).join('');
  more.addEventListener('toggle',()=>{if(more.open)tex(box)})}
const rtip=document.getElementById('reftip');let rcur=null;
function refShow(el){const r=REFS[el.dataset.ref];if(!r)return;rcur=el;rtip.textContent=`${auth(r)} (${r.year}) — ${plain(r.title)}`;rtip.hidden=false;
  const b=el.getBoundingClientRect(),t=rtip.getBoundingClientRect();let L=Math.min(Math.max(8,b.left),innerWidth-t.width-8),T=b.bottom+6;
  if(T+t.height>innerHeight-8)T=b.top-t.height-6;rtip.style.left=L+'px';rtip.style.top=T+'px'}
function refHide(){rtip.hidden=true;rcur=null}
document.addEventListener('pointerover',e=>{const el=e.target.closest('.ref');if(el&&e.pointerType==='mouse')refShow(el)});
document.addEventListener('pointerout',e=>{if(e.target.closest('.ref')&&e.pointerType==='mouse')refHide()});
document.addEventListener('click',e=>{const el=e.target.closest('.ref');if(el)refShow(el);else if(rcur)refHide()});
document.addEventListener('focusin',e=>{const el=e.target.closest('.ref');if(el)refShow(el)});
document.addEventListener('focusout',e=>{if(e.target.closest('.ref'))refHide()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')refHide()});
addEventListener('scroll',()=>{if(rcur)refHide()},{passive:true});
list();nextList();fold();draw();panel();
window.addEventListener('load',()=>{tex(document.getElementById('list'));tex(document.getElementById('panel'));fold();
  if(window.MathJax&&MathJax.startup&&MathJax.startup.promise)MathJax.startup.promise.then(()=>setTimeout(fold,300))});
addEventListener('resize',()=>{clearTimeout(window._ft);window._ft=setTimeout(fold,200)});
</script>
