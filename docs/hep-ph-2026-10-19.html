<script>
const RAW = {"n":[{"id":"3215971","arxiv":"2610.23474","title":"Neutrino Anomalies and Tensions: Experimental Status and Theoretical Interpretations","first":"Barčot","nauth":3,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: Bhupal Dev 2019. Also cites widely used network papers: Navas 2024. Closest of your papers: Blandon 2018 (coupling 0.10, 7 shared references). Closest network paper: Abdallah 2026 (coupling 0.10, 14 shared references).","score":32.5,"rank":1,"section":"new","parts":[0.48,0.26,0.27,0.0],"abstract":"Neutrino oscillations successfully describe flavor conversion across a wide range of experiments, yet the origin of several excesses and deficits remains unresolved. This review connects these observations and long-baseline parameter tensions to their proposed physical explanations, clarifying what remains open and how it can be tested. We examine reactor and gallium measurements, accelerator appearance and disappearance searches, and atmospheric constraints, focusing on sterile neutrinos, non-standard interactions, and decoherence in open-system dynamics. For each mechanism, we assess what it modifies, which observations it can address, and which theoretical assumptions and independent constraints limit its viability. Recent results have restricted several interpretations and weakened some earlier tensions; no single extension provides an uncontested account of all observations. We identify the flavor, baseline, energy, and event-topology signatures needed to distinguish competing explanations and assess whether the remaining anomalies require new physics or reflect unresolved flux, interaction, and detector uncertainties.","authors":"Doris Barčot, Raoul Serao, Antonio Capolupo","nlinked":112,"nref":316,"src":"INSPIRE","html":true},{"id":"3216004","arxiv":"2610.23713","title":"Foreground dependence of the 20 GeV Galactic halo gamma-ray excess and its proposed connection to the LUX-ZEPLIN event","first":"Abazajian","nauth":3,"year":2026,"cites":0,"role":"today","note":"Co-authors of yours: Macias. Closest of your papers: Horiuchi 2016 (coupling 0.04, 3 shared references). Closest network paper: Borah 2026 (coupling 0.05, 2 shared references).","score":11.7,"rank":2,"section":"cross","parts":[0.0,0.13,0.13,0.5],"abstract":"We assess the dark matter interpretation of the 20 GeV gamma-ray halo excess reported by Totani and its proposed connection to the LUX-ZEPLIN (LZ) high-energy nuclear-recoil event, which independently favors dark matter masses above about 200 GeV. Using fifteen years of Fermi-LAT data, we reproduce the excess under the original assumptions and test it against 281 Galactic diffuse emission configurations, three descriptions of the Fermi bubbles, four of Loop I, and uniform and X-ray-brightness-weighted eROSITA bubbles templates. A component correlated with a Navarro-Frenk-White (NFW) annihilation template remains with finer spatial binning and the instrumental response included. Outside the Fermi bubbles footprint, it is detected at nominal significances of about 4-16$σ$ over 5.6-130 GeV, falling to 1-7$σ$ when the enlarged boundaries of a recent substructured bubbles model are also excluded. With the substructured model, which improves the fit substantially, the component remains at 7-18$σ$ in four of six representative foreground configurations. However, its amplitude and spectrum depend strongly on the foreground model, and no tested foreground yields a single NFW normalization across the sky, including with additional spatial freedom in the eROSITA bubbles. Simulations show that foreground mismodeling can produce spurious NFW-correlated emission of the observed amplitude, and that residual-derived bubbles templates can bias the recovered spectrum. The 420 GeV $W^+W^-$ spectrum motivated by the LZ connection describes the data for some foreground models but is disfavored by others. These results disfavor interpreting the full excess as annihilation in a smooth NFW halo and weaken the case for a common origin with the LZ event, but they do not exclude a dark matter contribution to the persistent halo-like residual. [abridged]","authors":"Kevork N. Abazajian, Youyou Li, Oscar Macias","nlinked":30,"nref":33,"src":"INSPIRE","html":true},{"id":"3215937","arxiv":"2610.22862","title":"Gauge Interactions Involving New Vector and Pseudoscalar Particles","first":"Xing","nauth":6,"year":2026,"cites":0,"role":"today","note":"Also cites widely used network papers: Davidson 2008. Closest of your papers: Calle 2019 (coupling 0.07, 6 shared references). Closest network paper: Calle Mosquera 2021 (coupling 0.05, 8 shared references).","score":11.1,"rank":3,"section":"new","parts":[0.06,0.19,0.13,0.0],"abstract":"The Vector gauge bosons $Z'$ and axion-like particles (ALPs) $a$ are predicted by the $U(1)_X$ gauge extension and Peccei-Quinn (PQ) models, respectively. We focus on the interactions of the $Z'$ boson and the $a$ particle with the $W^\\pm$ gauge boson, and investigate the production cross section and related kinematic distributions for the $Z'/a\\to W^+W^-$ decay process at hadron colliders. We consider the angular distributions of charged leptons in the final states corresponding to the semileptonic and fully leptonic decays of the $W^\\pm$ boson, separately. The study shows that, in the associated production processes of $Z'/a$ with $W^+$ or $Z$ bosons, the angular distributions of final-state leptons can serve as an important observable for probing new gauge interactions, and can also provide a criterion to distinguish vector particles from pseudoscalar particles.","authors":"Ruiyu Xing, Honglei Li, Zhi-Long Han, Fei Huang, Cui-Juan Lv, Xinyi Zhang","nlinked":55,"nref":57,"src":"INSPIRE","html":true},{"id":"1708009","arxiv":"1812.03908","title":"Non-universal electroweak extensions of the standard model and the scotogenic models","first":"Blandon","nauth":4,"year":2018,"cites":1,"role":"seed","note":"","score":null},{"id":"2817040","arxiv":"","title":"Review of particle physics","first":"Navas","nauth":244,"year":2024,"cites":6488,"role":"other","note":"","score":null},{"id":"1754895","arxiv":"","title":"Searches for new physics with neutrino oscillations in the high precision era","first":"Sicking","nauth":1,"year":2019,"cites":0,"role":"other","note":"","score":null},{"id":"1607572","arxiv":"1706.08240","title":"Anomalous leptonic U(1) symmetry: Syndetic origin of the QCD axion, weak-scale dark matter, and radiative neutrino mass","first":"Ma","nauth":3,"year":2017,"cites":22,"role":"seed","note":"","score":null},{"id":"2062672","arxiv":"","title":"Neutrinos de Dirac y sus implicaciones fenomenológicas","first":"Calle Mosquera","nauth":1,"year":2021,"cites":0,"role":"other","note":"","score":null},{"id":"3201080","arxiv":"2609.07800","title":"Inelastic Singlet-Doublet Fermion Dark Matter in light of the 248 keV LZ event","first":"Borah","nauth":4,"year":2026,"cites":54,"role":"other","note":"","score":null},{"id":"2059568","arxiv":"2203.14983","title":"Dark Matter and (g - 2)$_{μ,e}$ in radiative Dirac neutrino mass models","first":"Chowdhury","nauth":3,"year":2022,"cites":25,"role":"other","note":"","score":null},{"id":"779828","arxiv":"0802.2962","title":"Leptogenesis","first":"Davidson","nauth":3,"year":2008,"cites":1504,"role":"other","note":"","score":null},{"id":"1742302","arxiv":"1907.00991","title":"Neutrino Non-Standard Interactions: A Status Report","first":"Bhupal Dev","nauth":26,"year":2019,"cites":271,"role":"other","note":"","score":null},{"id":"1220579","arxiv":"1302.5298","title":"Scalar dark matter and fermion coannihilations in the radiative seesaw model","first":"Klasen","nauth":5,"year":2013,"cites":55,"role":"seed","note":"","score":null},{"id":"3214448","arxiv":"2610.17207","title":"Implications for new physics solutions to the LSND and MiniBooNE anomalies after MicroBooNE results","first":"Abdallah","nauth":3,"year":2026,"cites":0,"role":"other","note":"","score":null},{"id":"1854224","arxiv":"2103.15328","title":"Phenomenology of the Zee model for Dirac neutrinos and general neutrino interactions","first":"Calle","nauth":3,"year":2021,"cites":6,"role":"seed","note":"","score":null},{"id":"1421624","arxiv":"1602.04788","title":"The Fermi-LAT gamma-ray excess at the Galactic Center in the singlet-doublet fermion dark matter model","first":"Horiuchi","nauth":6,"year":2016,"cites":43,"role":"seed","note":"","score":null},{"id":"1755250","arxiv":"1909.09574","title":"Dirac neutrino mass generation from a Majorana messenger","first":"Calle","nauth":3,"year":2019,"cites":24,"role":"seed","note":"","score":null},{"id":"1625258","arxiv":"1709.08417","title":"Common origin of neutrino mass and dark matter from anomaly cancellation requirements of a $U(1)_{B-L}$ model","first":"Nanda","nauth":2,"year":2017,"cites":50,"role":"other","note":"","score":null}],"e":[[4,10,"c"],[0,5,"k"],[2,6,"k"],[1,8,"k"],[2,10,"c"],[1,12,"k"],[2,14,"k"],[2,16,"k"],[2,17,"k"],[7,14,"c"],[7,17,"c"],[2,7,"k"],[2,9,"k"],[0,11,"c"],[7,16,"c"],[1,15,"k"],[8,15,"c"],[0,4,"c"],[0,13,"k"],[0,3,"k"],[9,14,"c"]],"next":[{"arxiv":"2604.05326","id":"3140648","title":"Gamma-Ray Signatures of Thermal Misalignment Dark Matter","authors":"Koichi Hamaguchi, Ryoichiro Hayakawa, Hiroki Takahashi","score":8.1,"section":"replacement","rank":4,"parts":[0.06,0.12,0.12,0.0],"note":"Also cites widely used network papers: Navas 2024. Closest of your papers: Ma 2017 (coupling 0.04, 3 shared references). Closest network paper: Nagata 2015 (coupling 0.04, 3 shared references).","abstract":"Thermal misalignment is a viable dark matter scenario where the misalignment of a dark matter scalar, feebly coupled to the Standard Model particles, is generated through thermal effects from the primordial plasma. In this framework, the scalar is generically metastable, and its decay can leave observable signatures. In this work, we focus on the case in which the scalar $φ$ is coupled to photons through $φF^{μν} F_{μν}$, and examine its observational signatures. We find that current gamma-ray constraints place a robust upper bound on the scalar mass of $\\mathcal O(1)\\,\\mathrm{GeV}$. We also find that future observations can further probe the parameter region, particularly in the MeV-GeV range, an energy band expected to be explored by various gamma-ray observatories in the coming decades."},{"arxiv":"2610.22530","id":"3215846","title":"Constraints on Decaying Dark Matter with $B=1$ from Fermi-LAT","authors":"Can Kilic, Zhi-Xiang Yang, Taewook Youn","score":7.9,"section":"new","rank":5,"parts":[0.0,0.14,0.19,0.0],"note":"Closest of your papers: Arbeláez 2024 (coupling 0.05, 5 shared references). Closest network paper: Beauchesne 2024 (coupling 0.07, 6 shared references).","abstract":"We investigate the gamma ray signatures of fermionic dark matter that carries one unit of baryon number and decays into three quarks. We compute the expected prompt and secondary gamma-ray spectra for a representative range of final state flavor combinations. By comparing these spectra to Fermi-LAT measurements of the isotropic gamma-ray background, we derive exclusion limits on the lifetime. We observe that depending on the dark matter mass and the flavor of the final state, the lifetime bounds on decays of $B=1$ dark matter can differ by up to a factor of two from those on decays of $B=0$ dark matter. Furthermore, light-quark final states generally yield stronger bounds at lower masses, whereas heavy-quark final states can yield comparable or stronger bounds at masses of tens of TeV and above."},{"arxiv":"2610.22490","id":"3215845","title":"Explaining $b\\to s\\ell^+\\ell^-$ with CKM Unitarity Violation? A No-Go Theorem","authors":"Andreas Crivellin, Matthew Kirk","score":7.1,"section":"new","rank":6,"parts":[0.0,0.13,0.18,0.0],"note":"Closest of your papers: Blandon 2018 (coupling 0.05, 3 shared references). Closest network paper: Aristizabal Sierra 2015 (coupling 0.06, 6 shared references).","abstract":"The deficits w.r.t.~the Standard Model predictions in $B\\to K^{(*)}μ^+μ^-$ and $B_s\\to φμ^+μ^-$ have recently been substantiated by new analyses from LHCb and CMS, as well as improved theoretical predictions, resulting in strong statistical evidence for lepton flavour universal new physics effects. In this letter, we investigate the possibility of generating such an effect through CKM unitarity violation: If the true value of $V_{cb}$, extracted from $B\\to D^{(*)}\\ellν$, were larger due to an NP contamination, this would lead, via the assumed CKM unitarity within the SM, to a smaller value of $V_{ts}$ and thus to reduced theory predictions for $b\\to s\\ell^+\\ell^-$ branching ratios. A sizable correction to the $W$-$c$-$b$ vertex is only possible close to the custodial-protected limit in which $Z$-$b$-$s$ couplings are absent. However, in a model-independent SMEFT analysis, we show that even if $C_{Hq}^{(1)}=-C_{Hq}^{(3)}$ is realized at a high scale, additional custodial-breaking effects appear due to RGE. Therefore, only a fine-tuned region in the parameter space of modified gauge boson couplings, displaying an overcompensation of the CKM unitarity-violating effect, gives a good fit to $b\\to s\\ell^+\\ell^-$ data. The only realistic simple SM extensions to achieve this setup are vector-like quarks. However, we show that they cannot explain the $b\\to s\\ell^+\\ell^-$ anomalies without violating bounds for electroweak precision observables as well as $K^0-\\bar K^0$ and $B_s-\\bar B_s$ mixing."},{"arxiv":"2605.23759","id":"3158991","title":"Correlated $b \\to s$ and $s \\to d$ Rare Semileptonic Transitions in the Standard Model Effective Field Theory","authors":"Nilakshi Das, Rusa Mandal, Praveen S Patil","score":7.1,"section":"replacement","rank":7,"parts":[0.06,0.06,0.18,0.0],"note":"Also cites widely used network papers: Navas 2024. Closest of your papers: Blandon 2018 (coupling 0.02, 1 shared references). Closest network paper: Hati 2018 (coupling 0.06, 7 shared references).","abstract":"The persistent anomalies observed in $b \\to s\\,(\\ell^+\\ell^-,\\,ν\\barν)$ transitions continue to provide strong motivation for exploring possible extensions of the Standard Model (SM). Motivated by these discrepancies, we present a comprehensive analysis of semileptonic flavor changing neutral current processes within the Standard Model Effective Field Theory (SMEFT), encompassing both $b \\to s\\,(μ^+μ^-,\\,ν\\barν)$ and $s \\to d\\,(μ^+μ^-,\\,ν\\barν)$ transitions. We perform a combined fit to $b \\to s\\,(μ^+μ^-,\\,ν\\barν)$ observables, allowing the relevant dimension-six Wilson coefficients to be complex. We find that the four-fermion operators involving left-handed quark and lepton doublets provide the preferred description of the current $b \\to s$ data, while the electroweak operator modifying the $Z$-boson couplings also plays an important role in improving the fit. We show that flavor-universal SMEFT couplings lead to strongly enhanced rare semileptonic kaon decay branching ratios, in conflict with current experimental bounds and thus motivating the implementation of Minimal Flavor Violation. In particular, we demonstrate that flavor-symmetric frameworks based on $U(3)^5$ and $U(2)^5$ naturally restore the required CKM hierarchies and bring the predicted kaon observables into agreement with present data. We further analyze the differential distributions with respect to the dineutrino invariant mass squared $q^2$, as well as the reconstructed variable $q^2_{\\mathrm{rec}}$, in $B \\to K^{(*)}ν\\barν$ decays, demonstrating their sensitivity to different new physics operators. In addition, we investigate the impact of complex Wilson coefficients on $\\mathcal{CP}$ asymmetries in $B \\to K^{(*)}μ^+μ^-$ decays and find that percent-level effects can arise in specific $q^2$ regions."},{"arxiv":"2602.18051","id":"3122094","title":"Dark Photon mediated Inelastic Dark Matter in Cosmology, Astrophysics and Colliders","authors":"Abhishek Roy, Prasenjit Sanyal, Stefano Scopel","score":7.0,"section":"replacement","rank":8,"parts":[0.06,0.08,0.12,0.0],"note":"Also cites widely used network papers: Navas 2024. Closest of your papers: Agudelo 2024 (coupling 0.03, 5 shared references). Closest network paper: de Boer 2023 (coupling 0.04, 5 shared references).","abstract":"We explore the phenomenology of Dark Photon iDM ($A^\\prime$IDM) where the Standard Model (SM) is extended by a dark sector containing an additional $U(1)_D$ gauge symmetry with coupling $α_D$ under which all SM particles are neutral, and that couples to the SM hypercharge gauge boson through a kinetic mixing parameter $ε$. The model contains two Majorana states $χ_1$ and $χ_2$ with $δ=M_{χ_2}-M_{χ_1}>0$ and $χ_1$ the dark matter candidate, and a dark photon $A^{\\prime}$ with mass $M_{A^{\\prime}}$. Our analysis represents an integration of existing ones, where only specific benchmarks of the A'IDM scenario have been discussed. We perform a complete scan of the parameters of the model ($M_{χ_1}$, $δ$, $M_{A^{\\prime}}$, $ε$, $α_D$) and discuss the $χ_1$ relic abundance, its direct and indirect searches, as well as potential signals from astrophysics and accelerators. Our scan shows that $α_D=α_{EM}$ is not disfavored, as some previous analyses, limited to specific benchmarks, may suggest. We also find that when the $χ_1$ relic density matches observation direct and indirect searches are not kinematically accessible. On the other hand we find that the projected luminosity of FASER, a detector searching for Long Lived Particles (LLP) decay at the LHC, can probe or rule out the parameters space of the model for $M_{χ_1}\\lesssim$ 7 GeV, 100 MeV$\\lesssimδ\\lesssim$300 MeV and $M_{A^\\prime}\\lesssim$25 GeV. This range of parameter could be significantly extended by the FASER 2 upgrade proposed for the High-Luminosity phase at the LHC. The parameter space probed by LLP seaches partially overlaps with that probed by $χ_1$ capture in neutron stars."},{"arxiv":"2609.18168","id":"3204465","title":"Constraints from big bang nucleosynthesis and cosmological observations on varying Higgs vacuum expectation value","authors":"Hongrui Feng, Yudong Luo, Toshitaka Kajino, Bao-Hua Sun, Tatsushi Shima","score":6.6,"section":"replacement","rank":9,"parts":[0.06,0.03,0.21,0.0],"note":"Also cites widely used network papers: Navas 2024. Closest of your papers: Agudelo 2024 (coupling 0.01, 2 shared references). Closest network paper: Iocco 2008 (coupling 0.07, 14 shared references).","abstract":"The Higgs vacuum expectation value (VEV) alters both the electroweak and strong interaction rates. We study both effects on big bang nucleosynthesis (BBN) and seek concordance between observed primordial abundances of light elements and cosmological constraints from CMB fluctuations and anisotropies. We find a strong negative correlation between primordial 4He abundance and the Higgs VEV. Consequently, using a 1.58% uplift of the Higgs VEV during BBN from the current value, an agreement can be achieved among the new primordial 4He abundance, observed by the EMPRESS group, Deuterium abundance determined from absorption lines in the Lyman-alpha forest along the line-of-sight of high-redshift quasars, and the lithium abundance on the Spite plateau. This agreement requires a baryon-to-photon ratio different from the CMB determination, indicating the need for nonstandard cosmological evolution between BBN and recombination epochs. We also demonstrate that a 0.2% uplift in the Higgs VEV can partially alleviate the \"cosmic Li problem,\" keeping consistency with the CMB with remaining discrepancy potentially accounted for by stellar depletion mechanisms."},{"arxiv":"2610.22979","id":"3215868","title":"Search for dark photon in association with charged leptons at electron-positron colliders","authors":"Dai-Xing Zhang, Chang-Qi Hu, Chun-Yuan Li, Xiao Liang, Xing-Hua Yang","score":5.3,"section":"new","rank":10,"parts":[0.0,0.09,0.13,0.0],"note":"Closest of your papers: Agudelo 2024 (coupling 0.03, 3 shared references). Closest network paper: de Boer 2023 (coupling 0.05, 4 shared references).","abstract":"The dark photon can serve as a vector portal between the dark sector and the Standard Model via kinetic mixing. In this paper, we investigate the production of an invisible dark photon via the process $e^+ e^- \\to \\ell^+ \\ell^- A'$ with $\\ell=e,μ$, at the Circular Electron Positron Collider (CEPC). The production cross sections for the signal process are calculated, and the kinematic distributions for the signal and background processes are analyzed. We further compute the branching ratio for the invisible decay of the dark photon, and explore the discovery potential of dark photons at the CEPC. It is found that dark photons with masses in the range $1~\\mathrm{GeV} < M_{A'} < 16~\\mathrm{GeV}$ are potentially detectable at the CEPC."},{"arxiv":"2610.23647","id":"3215994","title":"Mass, forces, and the dark sector in a Kaluza-Klein model with 6 compact dimensions","authors":"Manfred M. Vieten","score":5.0,"section":"new","rank":11,"parts":[0.06,0.05,0.06,0.0],"note":"Also cites widely used network papers: Navas 2024. Closest of your papers: Agudelo 2024 (coupling 0.02, 2 shared references). Closest network paper: Longas 2026 (coupling 0.02, 2 shared references).","abstract":"(1) Objective: This study seeks to calculate the meson and baryon masses and to investigate the dynamics within hadrons and lepton pairs by formulating a unified physical framework that, in addition to gravitation, simultaneously incorporates the strong, electromagnetic and weak interactions. (2) Method: A framework inspired by the Standard Model and based on Kaluza-Klein theory is formulated using an extended general-relativistic description in a spacetime of one temporal, three spatial, and six compactified dimensions. The model suggests that excitations, deformations of the 10-dimensional spacetime traveling at light-speed, contribute to mass and distinct spin characteristics in a 4-dimensional setting. Using the electron g-factor, charged-lepton masses, and masses of the proton, neutron, and neutral and charged pion, neutral and charged rho, phi, psi, upsilon mesons, the parameters compactification radius rho, weak interaction coupling alpha_w, strong interaction coupling alpha_s, flavor constants A_i and the antineutrino/neutrino density ratio delta3 are determined and used to compute the masses of the hadrons. (3) Key results: Masses of 102 hadrons are obtained; comparison with data from 71 measurements shows relative errors below 0.05 in 70%, below 0.1 in 89% and below 0.2 in 100%, with a correlation coefficient r=0.997 between the measured and calculated masses. Thirty-one additional hadron masses are predicted, and the model identifies asymmetries in electric and weak forces, as well as distance- and velocity-dependent interactions. (4) Implications: The framework offers testable predictions for hadron spectroscopy, predicts sterile, exclusive gravitationally interacting bosons as dark-matter candidates, states the equations for the elementary forces, and suggests possible connections between force asymmetries and dark energy."},{"arxiv":"2610.23667","id":"3216007","title":"Equiprobability Anomaly Detector Using Angular Distributions","authors":"Alex Whitten, John Cicero, Tae Min Hong","score":4.7,"section":"new","rank":12,"parts":[0.0,0.1,0.09,0.0],"note":"Closest of your papers: von der Pahlen 2016 (coupling 0.03, 5 shared references). Closest network paper: Bentancur Rodríguez 2019 (coupling 0.03, 4 shared references).","abstract":"We use the angular distribution of top quark pairs ($t\\bar{t}$) in the semileptonic final state $b\\bar{b}\\,\\ellνq\\bar{q}'$ to construct an anomaly detector for non-$t\\bar{t}$ events. Wigner $D$ functions expand the distribution with coefficients determined by orthogonal series density estimation. Its equiprobable surfaces bin the events, the non-$t\\bar{t}$ concentrate at low $t\\bar{t}$ density. The separation is quantified by the Kullback-Leibler divergence, which makes connection to variational autoencoders. The performance is comparable to normalizing flows at parton level, but is limited by jet assignments at reconstruction level."},{"arxiv":"2610.23658","id":"3215998","title":"Hidden Sector Relic Abundances from an Effective Planck Mass","authors":"Donald Liveoak, Anshuman Maharana, James D. Wells","score":4.3,"section":"new","rank":13,"parts":[0.0,0.09,0.08,0.0],"note":"Closest of your papers: Arbeláez 2024 (coupling 0.03, 3 shared references). Closest network paper: Griffith 2026 (coupling 0.03, 3 shared references).","abstract":"Hidden sectors are generic in beyond the Standard Model constructions and string compactifications. We consider models featuring hidden sectors that have dark matter candidates. The relic density is set in part by the energy-injecting inflaton branching ratio $B$ to the sector. We develop a general framework to determine the dependence on $B$ for thermalized hidden sectors by defining an effective Planck mass for the Boltzmann equations for the hidden sector degrees of freedom. We apply this framework to several representative examples, including freeze-out/freeze-in WIMPs and multi-component dark matter. We find that the fractional energy density carried by freeze-out relics (in both single and multi-component models) and monopoles produced from second order phase transitions scale as $B^{1/4}$ and thus may lead to an overclosure problem, even with $B \\ll 1$. On the other hand, the energy density of freeze-in relics scales as $B^{5/4}$ and is thus cosmologically irrelevant for sufficiently small $B$. Finally, we discuss the cumulative implications of a large number of hidden sectors."}],"meta":{"date":"Monday, 19 October 2026","url":"https://arxiv.org/catchup/hep-ph/2026-10-19","cat":"hep-ph","year":2026,"built":"2026-10-23","nown":65,"next":260,"onInspire":50,"threshold":10.0,"nrel":3,"nlist":50,"counts":{"new":21,"cross":13,"replacement":16},"below":[{"arxiv":"2604.05326","title":"Gamma-Ray Signatures of Thermal Misalignment Dark Matter","score":8.1},{"arxiv":"2610.22530","title":"Constraints on Decaying Dark Matter with $B=1$ from Fermi-LAT","score":7.9},{"arxiv":"2610.22490","title":"Explaining $b\\to s\\ell^+\\ell^-$ with CKM Unitarity Violation? A No-Go Theorem","score":7.1},{"arxiv":"2605.23759","title":"Correlated $b \\to s$ and $s \\to d$ Rare Semileptonic Transitions in the Standard Model Effective Field Theory","score":7.1},{"arxiv":"2602.18051","title":"Dark Photon mediated Inelastic Dark Matter in Cosmology, Astrophysics and Colliders","score":7.0},{"arxiv":"2609.18168","title":"Constraints from big bang nucleosynthesis and cosmological observations on varying Higgs vacuum expectation value","score":6.6}]}};

    .force('col',d3.forceCollide(s=>r(s.n)+2)).stop().tick(320);

  G.append('g').selectAll('circle').data([...sim].sort((a,b)=>RANK[b.n.role]-RANK[a.n.role])).join('circle')
    .attr('class','node').attr('cx',s=>s.x).attr('cy',s=>s.y).attr('r',s=>r(s.n)).attr('fill',s=>col(s.n))
    .on('pointerenter',(ev,s)=>{hover=s.n;showTip(ev,s.n);paint()}).on('pointermove',(ev,s)=>showTip(ev,s.n))
    .on('pointerleave',()=>{hover=null;tip.hidden=true;paint()}).on('click',(ev,s)=>pick(s.n,false));
  const lab=sim.filter(s=>isNew(s.n)||s.n.role==='seed'||s.n.deg>=3);
  const L=lab.map(s=>{const right=s.x>W*.8,t=isNew(s.n)?`#${s.n.rank} ${s.n.first}`:`${s.n.first} ${s.n.year}`,w=t.length*6.2;return{s,t,right,x0:right?s.x-r(s.n)-4-w:s.x+r(s.n)+4,w,y:s.y+4}}).sort((a,b)=>a.y-b.y);
  const placed=[];L.forEach(l=>{let k=0;while(k<40&&placed.some(p=>l.x0<p.x0+p.w&&p.x0<l.x0+l.w&&Math.abs(l.y-p.y)<13)){l.y+=13*(k%2?-1:1)*(1+Math.floor(k/2));k++;l.y=Math.max(m.t+10,Math.min(H-m.b-4,l.y))}placed.push(l)});
  G.append('g').selectAll('text').data(L).join('text').attr('class','nlabel').attr('x',l=>l.right?l.s.x-r(l.s.n)-4:l.s.x+r(l.s.n)+4).attr('y',l=>l.y)
    .attr('text-anchor',l=>l.right?'end':'start').text(l=>l.t);
  paint();
}
function showTip(ev,n){const b=document.getElementById('chart').getBoundingClientRect();tip.hidden=false;tip.textContent=`${auth(n)} (${n.year}) — ${plain(n.title)}`+(isNew(n)?` · score ${n.score}`:'');

    <div class="t">${esc(n.title)}</div><div class="authors">${esc(n.authors)} · arXiv:${esc(n.arxiv)}</div>
    ${n.note?`<p class="why">${esc(n.note)}</p>`:''}
    <details class="abs"><summary>Abstract</summary><p class="abs">${esc(n.abstract)}</p></details>
    <div class="links">${n.id?`<a href="https://inspirehep.net/literature/${n.id}" target="_blank" rel="noopener">INSPIRE</a>`:''}<a href="https://arxiv.org/abs/${esc(n.arxiv)}" target="_blank" rel="noopener">arXiv</a><a href="https://arxiv.org/pdf/${esc(n.arxiv)}" target="_blank" rel="noopener">PDF</a></div></li>`).join('');
  more.addEventListener('toggle',()=>{if(more.open)tex(box)})}
list();nextList();draw();panel();
window.addEventListener('load',()=>{tex(document.getElementById('list'));tex(document.getElementById('panel'))});
</script>

</body>
</html>
