<script>
const RAW = {"n":[{"id":"3215971","arxiv":"2610.23474","title":"Neutrino Anomalies and Tensions: Experimental Status and Theoretical Interpretations","first":"Barčot","nauth":3,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[1742302]]. Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1708009]] (coupling 0.10, 7 shared references). Closest network paper: [[3214448]] (coupling 0.10, 14 shared references).","score":32.5,"rank":1,"section":"new","parts":[0.48,0.26,0.27,0.0],"abstract":"Neutrino oscillations successfully describe flavor conversion across a wide range of experiments, yet the origin of several excesses and deficits remains unresolved. This review connects these observations and long-baseline parameter tensions to their proposed physical explanations, clarifying what remains open and how it can be tested. We examine reactor and gallium measurements, accelerator appearance and disappearance searches, and atmospheric constraints, focusing on sterile neutrinos, non-standard interactions, and decoherence in open-system dynamics. For each mechanism, we assess what it modifies, which observations it can address, and which theoretical assumptions and independent constraints limit its viability. Recent results have restricted several interpretations and weakened some earlier tensions; no single extension provides an uncontested account of all observations. We identify the flavor, baseline, energy, and event-topology signatures needed to distinguish competing explanations and assess whether the remaining anomalies require new physics or reflect unresolved flux, interaction, and detector uncertainties.","authors":"Doris Barčot, Raoul Serao, Antonio Capolupo","nlinked":112,"nref":316,"src":"INSPIRE","html":true},{"id":"3216004","arxiv":"2610.23713","title":"Foreground dependence of the 20 GeV Galactic halo gamma-ray excess and its proposed connection to the LUX-ZEPLIN event","first":"Abazajian","nauth":3,"year":2026,"cites":0,"role":"today","note":"Co-authors of yours: Macias. Closest of your papers: [[1421624]] (coupling 0.04, 3 shared references). Closest network paper: [[3201080]] (coupling 0.05, 2 shared references).","score":11.7,"rank":2,"section":"cross","parts":[0.0,0.13,0.13,0.5],"abstract":"We assess the dark matter interpretation of the 20 GeV gamma-ray halo excess reported by Totani and its proposed connection to the LUX-ZEPLIN (LZ) high-energy nuclear-recoil event, which independently favors dark matter masses above about 200 GeV. Using fifteen years of Fermi-LAT data, we reproduce the excess under the original assumptions and test it against 281 Galactic diffuse emission configurations, three descriptions of the Fermi bubbles, four of Loop I, and uniform and X-ray-brightness-weighted eROSITA bubbles templates. A component correlated with a Navarro-Frenk-White (NFW) annihilation template remains with finer spatial binning and the instrumental response included. Outside the Fermi bubbles footprint, it is detected at nominal significances of about 4-16$σ$ over 5.6-130 GeV, falling to 1-7$σ$ when the enlarged boundaries of a recent substructured bubbles model are also excluded. With the substructured model, which improves the fit substantially, the component remains at 7-18$σ$ in four of six representative foreground configurations. However, its amplitude and spectrum depend strongly on the foreground model, and no tested foreground yields a single NFW normalization across the sky, including with additional spatial freedom in the eROSITA bubbles. Simulations show that foreground mismodeling can produce spurious NFW-correlated emission of the observed amplitude, and that residual-derived bubbles templates can bias the recovered spectrum. The 420 GeV $W^+W^-$ spectrum motivated by the LZ connection describes the data for some foreground models but is disfavored by others. These results disfavor interpreting the full excess as annihilation in a smooth NFW halo and weaken the case for a common origin with the LZ event, but they do not exclude a dark matter contribution to the persistent halo-like residual. [abridged]","authors":"Kevork N. Abazajian, Youyou Li, Oscar Macias","nlinked":30,"nref":33,"src":"INSPIRE","html":true},{"id":"3215937","arxiv":"2610.22862","title":"Gauge Interactions Involving New Vector and Pseudoscalar Particles","first":"Xing","nauth":6,"year":2026,"cites":0,"role":"today","note":"Also cites widely used network papers: [[779828]]. Closest of your papers: [[1755250]] (coupling 0.07, 6 shared references). Closest network paper: [[2062672]] (coupling 0.05, 8 shared references).","score":11.1,"rank":3,"section":"new","parts":[0.06,0.19,0.13,0.0],"abstract":"The Vector gauge bosons $Z'$ and axion-like particles (ALPs) $a$ are predicted by the $U(1)_X$ gauge extension and Peccei-Quinn (PQ) models, respectively. We focus on the interactions of the $Z'$ boson and the $a$ particle with the $W^\\pm$ gauge boson, and investigate the production cross section and related kinematic distributions for the $Z'/a\\to W^+W^-$ decay process at hadron colliders. We consider the angular distributions of charged leptons in the final states corresponding to the semileptonic and fully leptonic decays of the $W^\\pm$ boson, separately. The study shows that, in the associated production processes of $Z'/a$ with $W^+$ or $Z$ bosons, the angular distributions of final-state leptons can serve as an important observable for probing new gauge interactions, and can also provide a criterion to distinguish vector particles from pseudoscalar particles.","authors":"Ruiyu Xing, Honglei Li, Zhi-Long Han, Fei Huang, Cui-Juan Lv, Xinyi Zhang","nlinked":55,"nref":57,"src":"INSPIRE","html":true},{"id":"3201080","arxiv":"2609.07800","title":"Inelastic Singlet-Doublet Fermion Dark Matter in light of the 248 keV LZ event","first":"Borah","nauth":4,"year":2026,"cites":54,"role":"other","note":"","score":null},{"id":"1755250","arxiv":"1909.09574","title":"Dirac neutrino mass generation from a Majorana messenger","first":"Calle","nauth":3,"year":2019,"cites":24,"role":"seed","note":"","score":null},{"id":"2059568","arxiv":"2203.14983","title":"Dark Matter and (g - 2)$_{μ,e}$ in radiative Dirac neutrino mass models","first":"Chowdhury","nauth":3,"year":2022,"cites":25,"role":"other","note":"","score":null},{"id":"1742302","arxiv":"1907.00991","title":"Neutrino Non-Standard Interactions: A Status Report","first":"Bhupal Dev","nauth":26,"year":2019,"cites":271,"role":"other","note":"","score":null},{"id":"1220579","arxiv":"1302.5298","title":"Scalar dark matter and fermion coannihilations in the radiative seesaw model","first":"Klasen","nauth":5,"year":2013,"cites":55,"role":"seed","note":"","score":null},{"id":"2817040","arxiv":"","title":"Review of particle physics","first":"Navas","nauth":244,"year":2024,"cites":6488,"role":"other","note":"","score":null},{"id":"1607572","arxiv":"1706.08240","title":"Anomalous leptonic U(1) symmetry: Syndetic origin of the QCD axion, weak-scale dark matter, and radiative neutrino mass","first":"Ma","nauth":3,"year":2017,"cites":22,"role":"seed","note":"","score":null},{"id":"1625258","arxiv":"1709.08417","title":"Common origin of neutrino mass and dark matter from anomaly cancellation requirements of a $U(1)_{B-L}$ model","first":"Nanda","nauth":2,"year":2017,"cites":50,"role":"other","note":"","score":null},{"id":"1708009","arxiv":"1812.03908","title":"Non-universal electroweak extensions of the standard model and the scotogenic models","first":"Blandon","nauth":4,"year":2018,"cites":1,"role":"seed","note":"","score":null},{"id":"1421624","arxiv":"1602.04788","title":"The Fermi-LAT gamma-ray excess at the Galactic Center in the singlet-doublet fermion dark matter model","first":"Horiuchi","nauth":6,"year":2016,"cites":43,"role":"seed","note":"","score":null},{"id":"3214448","arxiv":"2610.17207","title":"Implications for new physics solutions to the LSND and MiniBooNE anomalies after MicroBooNE results","first":"Abdallah","nauth":3,"year":2026,"cites":0,"role":"other","note":"","score":null},{"id":"1854224","arxiv":"2103.15328","title":"Phenomenology of the Zee model for Dirac neutrinos and general neutrino interactions","first":"Calle","nauth":3,"year":2021,"cites":6,"role":"seed","note":"","score":null},{"id":"2062672","arxiv":"","title":"Neutrinos de Dirac y sus implicaciones fenomenológicas","first":"Calle Mosquera","nauth":1,"year":2021,"cites":0,"role":"other","note":"","score":null},{"id":"779828","arxiv":"0802.2962","title":"Leptogenesis","first":"Davidson","nauth":3,"year":2008,"cites":1504,"role":"other","note":"","score":null},{"id":"1754895","arxiv":"","title":"Searches for new physics with neutrino oscillations in the high precision era","first":"Sicking","nauth":1,"year":2019,"cites":0,"role":"other","note":"","score":null}],"e":[[2,5,"k"],[15,14,"c"],[3,12,"c"],[1,3,"k"],[8,16,"c"],[2,10,"k"],[0,11,"k"],[5,14,"c"],[0,17,"k"],[2,4,"k"],[0,6,"c"],[1,12,"k"],[2,14,"k"],[15,10,"c"],[2,16,"c"],[2,9,"k"],[1,7,"k"],[0,8,"c"],[15,4,"c"],[0,13,"k"],[2,15,"k"]],"next":[{"arxiv":"2604.05326","id":"3140648","title":"Gamma-Ray Signatures of Thermal Misalignment Dark Matter","authors":"Koichi Hamaguchi, Ryoichiro Hayakawa, Hiroki Takahashi","score":8.1,"section":"replacement","rank":4,"parts":[0.06,0.12,0.12,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1607572]] (coupling 0.04, 3 shared references). Closest network paper: [[1397652]] (coupling 0.04, 3 shared references).","abstract":"Thermal misalignment is a viable dark matter scenario where the misalignment of a dark matter scalar, feebly coupled to the Standard Model particles, is generated through thermal effects from the primordial plasma. In this framework, the scalar is generically metastable, and its decay can leave observable signatures. In this work, we focus on the case in which the scalar $φ$ is coupled to photons through $φF^{μν} F_{μν}$, and examine its observational signatures. We find that current gamma-ray constraints place a robust upper bound on the scalar mass of $\\mathcal O(1)\\,\\mathrm{GeV}$. We also find that future observations can further probe the parameter region, particularly in the MeV-GeV range, an energy band expected to be explored by various gamma-ray observatories in the coming decades."},{"arxiv":"2610.22530","id":"3215846","title":"Constraints on Decaying Dark Matter with $B=1$ from Fermi-LAT","authors":"Can Kilic, Zhi-Xiang Yang, Taewook Youn","score":7.9,"section":"new","rank":5,"parts":[0.0,0.14,0.19,0.0],"note":"Closest of your papers: [[2859009]] (coupling 0.05, 5 shared references). Closest network paper: [[2803592]] (coupling 0.07, 6 shared references).","abstract":"We investigate the gamma ray signatures of fermionic dark matter that carries one unit of baryon number and decays into three quarks. We compute the expected prompt and secondary gamma-ray spectra for a representative range of final state flavor combinations. By comparing these spectra to Fermi-LAT measurements of the isotropic gamma-ray background, we derive exclusion limits on the lifetime. We observe that depending on the dark matter mass and the flavor of the final state, the lifetime bounds on decays of $B=1$ dark matter can differ by up to a factor of two from those on decays of $B=0$ dark matter. Furthermore, light-quark final states generally yield stronger bounds at lower masses, whereas heavy-quark final states can yield comparable or stronger bounds at masses of tens of TeV and above."},{"arxiv":"2610.22490","id":"3215845","title":"Explaining $b\\to s\\ell^+\\ell^-$ with CKM Unitarity Violation? A No-Go Theorem","authors":"Andreas Crivellin, Matthew Kirk","score":7.1,"section":"new","rank":6,"parts":[0.0,0.13,0.18,0.0],"note":"Closest of your papers: [[1708009]] (coupling 0.05, 3 shared references). Closest network paper: [[1353669]] (coupling 0.06, 6 shared references).","abstract":"The deficits w.r.t.~the Standard Model predictions in $B\\to K^{(*)}μ^+μ^-$ and $B_s\\to φμ^+μ^-$ have recently been substantiated by new analyses from LHCb and CMS, as well as improved theoretical predictions, resulting in strong statistical evidence for lepton flavour universal new physics effects. In this letter, we investigate the possibility of generating such an effect through CKM unitarity violation: If the true value of $V_{cb}$, extracted from $B\\to D^{(*)}\\ellν$, were larger due to an NP contamination, this would lead, via the assumed CKM unitarity within the SM, to a smaller value of $V_{ts}$ and thus to reduced theory predictions for $b\\to s\\ell^+\\ell^-$ branching ratios. A sizable correction to the $W$-$c$-$b$ vertex is only possible close to the custodial-protected limit in which $Z$-$b$-$s$ couplings are absent. However, in a model-independent SMEFT analysis, we show that even if $C_{Hq}^{(1)}=-C_{Hq}^{(3)}$ is realized at a high scale, additional custodial-breaking effects appear due to RGE. Therefore, only a fine-tuned region in the parameter space of modified gauge boson couplings, displaying an overcompensation of the CKM unitarity-violating effect, gives a good fit to $b\\to s\\ell^+\\ell^-$ data. The only realistic simple SM extensions to achieve this setup are vector-like quarks. However, we show that they cannot explain the $b\\to s\\ell^+\\ell^-$ anomalies without violating bounds for electroweak precision observables as well as $K^0-\\bar K^0$ and $B_s-\\bar B_s$ mixing."},{"arxiv":"2605.23759","id":"3158991","title":"Correlated $b \\to s$ and $s \\to d$ Rare Semileptonic Transitions in the Standard Model Effective Field Theory","authors":"Nilakshi Das, Rusa Mandal, Praveen S Patil","score":7.1,"section":"replacement","rank":7,"parts":[0.06,0.06,0.18,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1708009]] (coupling 0.02, 1 shared references). Closest network paper: [[1679911]] (coupling 0.06, 7 shared references).","abstract":"The persistent anomalies observed in $b \\to s\\,(\\ell^+\\ell^-,\\,ν\\barν)$ transitions continue to provide strong motivation for exploring possible extensions of the Standard Model (SM). Motivated by these discrepancies, we present a comprehensive analysis of semileptonic flavor changing neutral current processes within the Standard Model Effective Field Theory (SMEFT), encompassing both $b \\to s\\,(μ^+μ^-,\\,ν\\barν)$ and $s \\to d\\,(μ^+μ^-,\\,ν\\barν)$ transitions. We perform a combined fit to $b \\to s\\,(μ^+μ^-,\\,ν\\barν)$ observables, allowing the relevant dimension-six Wilson coefficients to be complex. We find that the four-fermion operators involving left-handed quark and lepton doublets provide the preferred description of the current $b \\to s$ data, while the electroweak operator modifying the $Z$-boson couplings also plays an important role in improving the fit. We show that flavor-universal SMEFT couplings lead to strongly enhanced rare semileptonic kaon decay branching ratios, in conflict with current experimental bounds and thus motivating the implementation of Minimal Flavor Violation. In particular, we demonstrate that flavor-symmetric frameworks based on $U(3)^5$ and $U(2)^5$ naturally restore the required CKM hierarchies and bring the predicted kaon observables into agreement with present data. We further analyze the differential distributions with respect to the dineutrino invariant mass squared $q^2$, as well as the reconstructed variable $q^2_{\\mathrm{rec}}$, in $B \\to K^{(*)}ν\\barν$ decays, demonstrating their sensitivity to different new physics operators. In addition, we investigate the impact of complex Wilson coefficients on $\\mathcal{CP}$ asymmetries in $B \\to K^{(*)}μ^+μ^-$ decays and find that percent-level effects can arise in specific $q^2$ regions."},{"arxiv":"2602.18051","id":"3122094","title":"Dark Photon mediated Inelastic Dark Matter in Cosmology, Astrophysics and Colliders","authors":"Abhishek Roy, Prasenjit Sanyal, Stefano Scopel","score":7.0,"section":"replacement","rank":8,"parts":[0.06,0.08,0.12,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2855387]] (coupling 0.03, 5 shared references). Closest network paper: [[2697223]] (coupling 0.04, 5 shared references).","abstract":"We explore the phenomenology of Dark Photon iDM ($A^\\prime$IDM) where the Standard Model (SM) is extended by a dark sector containing an additional $U(1)_D$ gauge symmetry with coupling $α_D$ under which all SM particles are neutral, and that couples to the SM hypercharge gauge boson through a kinetic mixing parameter $ε$. The model contains two Majorana states $χ_1$ and $χ_2$ with $δ=M_{χ_2}-M_{χ_1}>0$ and $χ_1$ the dark matter candidate, and a dark photon $A^{\\prime}$ with mass $M_{A^{\\prime}}$. Our analysis represents an integration of existing ones, where only specific benchmarks of the A'IDM scenario have been discussed. We perform a complete scan of the parameters of the model ($M_{χ_1}$, $δ$, $M_{A^{\\prime}}$, $ε$, $α_D$) and discuss the $χ_1$ relic abundance, its direct and indirect searches, as well as potential signals from astrophysics and accelerators. Our scan shows that $α_D=α_{EM}$ is not disfavored, as some previous analyses, limited to specific benchmarks, may suggest. We also find that when the $χ_1$ relic density matches observation direct and indirect searches are not kinematically accessible. On the other hand we find that the projected luminosity of FASER, a detector searching for Long Lived Particles (LLP) decay at the LHC, can probe or rule out the parameters space of the model for $M_{χ_1}\\lesssim$ 7 GeV, 100 MeV$\\lesssimδ\\lesssim$300 MeV and $M_{A^\\prime}\\lesssim$25 GeV. This range of parameter could be significantly extended by the FASER 2 upgrade proposed for the High-Luminosity phase at the LHC. The parameter space probed by LLP seaches partially overlaps with that probed by $χ_1$ capture in neutron stars."},{"arxiv":"2609.18168","id":"3204465","title":"Constraints from big bang nucleosynthesis and cosmological observations on varying Higgs vacuum expectation value","authors":"Hongrui Feng, Yudong Luo, Toshitaka Kajino, Bao-Hua Sun, Tatsushi Shima","score":6.6,"section":"replacement","rank":9,"parts":[0.06,0.03,0.21,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2855387]] (coupling 0.01, 2 shared references). Closest network paper: [[795558]] (coupling 0.07, 14 shared references).","abstract":"The Higgs vacuum expectation value (VEV) alters both the electroweak and strong interaction rates. We study both effects on big bang nucleosynthesis (BBN) and seek concordance between observed primordial abundances of light elements and cosmological constraints from CMB fluctuations and anisotropies. We find a strong negative correlation between primordial 4He abundance and the Higgs VEV. Consequently, using a 1.58% uplift of the Higgs VEV during BBN from the current value, an agreement can be achieved among the new primordial 4He abundance, observed by the EMPRESS group, Deuterium abundance determined from absorption lines in the Lyman-alpha forest along the line-of-sight of high-redshift quasars, and the lithium abundance on the Spite plateau. This agreement requires a baryon-to-photon ratio different from the CMB determination, indicating the need for nonstandard cosmological evolution between BBN and recombination epochs. We also demonstrate that a 0.2% uplift in the Higgs VEV can partially alleviate the \"cosmic Li problem,\" keeping consistency with the CMB with remaining discrepancy potentially accounted for by stellar depletion mechanisms."},{"arxiv":"2610.22979","id":"3215868","title":"Search for dark photon in association with charged leptons at electron-positron colliders","authors":"Dai-Xing Zhang, Chang-Qi Hu, Chun-Yuan Li, Xiao Liang, Xing-Hua Yang","score":5.3,"section":"new","rank":10,"parts":[0.0,0.09,0.13,0.0],"note":"Closest of your papers: [[2855387]] (coupling 0.03, 3 shared references). Closest network paper: [[2697223]] (coupling 0.05, 4 shared references).","abstract":"The dark photon can serve as a vector portal between the dark sector and the Standard Model via kinetic mixing. In this paper, we investigate the production of an invisible dark photon via the process $e^+ e^- \\to \\ell^+ \\ell^- A'$ with $\\ell=e,μ$, at the Circular Electron Positron Collider (CEPC). The production cross sections for the signal process are calculated, and the kinematic distributions for the signal and background processes are analyzed. We further compute the branching ratio for the invisible decay of the dark photon, and explore the discovery potential of dark photons at the CEPC. It is found that dark photons with masses in the range $1~\\mathrm{GeV} < M_{A'} < 16~\\mathrm{GeV}$ are potentially detectable at the CEPC."},{"arxiv":"2610.23647","id":"3215994","title":"Mass, forces, and the dark sector in a Kaluza-Klein model with 6 compact dimensions","authors":"Manfred M. Vieten","score":5.0,"section":"new","rank":11,"parts":[0.06,0.05,0.06,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2855387]] (coupling 0.02, 2 shared references). Closest network paper: [[3205155]] (coupling 0.02, 2 shared references).","abstract":"(1) Objective: This study seeks to calculate the meson and baryon masses and to investigate the dynamics within hadrons and lepton pairs by formulating a unified physical framework that, in addition to gravitation, simultaneously incorporates the strong, electromagnetic and weak interactions. (2) Method: A framework inspired by the Standard Model and based on Kaluza-Klein theory is formulated using an extended general-relativistic description in a spacetime of one temporal, three spatial, and six compactified dimensions. The model suggests that excitations, deformations of the 10-dimensional spacetime traveling at light-speed, contribute to mass and distinct spin characteristics in a 4-dimensional setting. Using the electron g-factor, charged-lepton masses, and masses of the proton, neutron, and neutral and charged pion, neutral and charged rho, phi, psi, upsilon mesons, the parameters compactification radius rho, weak interaction coupling alpha_w, strong interaction coupling alpha_s, flavor constants A_i and the antineutrino/neutrino density ratio delta3 are determined and used to compute the masses of the hadrons. (3) Key results: Masses of 102 hadrons are obtained; comparison with data from 71 measurements shows relative errors below 0.05 in 70%, below 0.1 in 89% and below 0.2 in 100%, with a correlation coefficient r=0.997 between the measured and calculated masses. Thirty-one additional hadron masses are predicted, and the model identifies asymmetries in electric and weak forces, as well as distance- and velocity-dependent interactions. (4) Implications: The framework offers testable predictions for hadron spectroscopy, predicts sterile, exclusive gravitationally interacting bosons as dark-matter candidates, states the equations for the elementary forces, and suggests possible connections between force asymmetries and dark energy."},{"arxiv":"2610.23667","id":"3216007","title":"Equiprobability Anomaly Detector Using Angular Distributions","authors":"Alex Whitten, John Cicero, Tae Min Hong","score":4.7,"section":"new","rank":12,"parts":[0.0,0.1,0.09,0.0],"note":"Closest of your papers: [[1455793]] (coupling 0.03, 5 shared references). Closest network paper: [[1746210]] (coupling 0.03, 4 shared references).","abstract":"We use the angular distribution of top quark pairs ($t\\bar{t}$) in the semileptonic final state $b\\bar{b}\\,\\ellνq\\bar{q}'$ to construct an anomaly detector for non-$t\\bar{t}$ events. Wigner $D$ functions expand the distribution with coefficients determined by orthogonal series density estimation. Its equiprobable surfaces bin the events, the non-$t\\bar{t}$ concentrate at low $t\\bar{t}$ density. The separation is quantified by the Kullback-Leibler divergence, which makes connection to variational autoencoders. The performance is comparable to normalizing flows at parton level, but is limited by jet assignments at reconstruction level."},{"arxiv":"2610.23658","id":"3215998","title":"Hidden Sector Relic Abundances from an Effective Planck Mass","authors":"Donald Liveoak, Anshuman Maharana, James D. Wells","score":4.3,"section":"new","rank":13,"parts":[0.0,0.09,0.08,0.0],"note":"Closest of your papers: [[2859009]] (coupling 0.03, 3 shared references). Closest network paper: [[3122101]] (coupling 0.03, 3 shared references).","abstract":"Hidden sectors are generic in beyond the Standard Model constructions and string compactifications. We consider models featuring hidden sectors that have dark matter candidates. The relic density is set in part by the energy-injecting inflaton branching ratio $B$ to the sector. We develop a general framework to determine the dependence on $B$ for thermalized hidden sectors by defining an effective Planck mass for the Boltzmann equations for the hidden sector degrees of freedom. We apply this framework to several representative examples, including freeze-out/freeze-in WIMPs and multi-component dark matter. We find that the fractional energy density carried by freeze-out relics (in both single and multi-component models) and monopoles produced from second order phase transitions scale as $B^{1/4}$ and thus may lead to an overclosure problem, even with $B \\ll 1$. On the other hand, the energy density of freeze-in relics scales as $B^{5/4}$ and is thus cosmologically irrelevant for sufficiently small $B$. Finally, we discuss the cumulative implications of a large number of hidden sectors."},{"arxiv":"2610.23240","id":"3215884","title":"$χ_{c1}(4010)$ as a $D^{*\\pm}D^{\\mp}$ Molecular State: Mass, Decay Constant, and Width","authors":"S. Damen, H. Sundu, J. Y. Süngü","score":3.8,"section":"new","rank":14,"parts":[0.06,0.02,0.04,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2690106]] (coupling 0.01, 1 shared references). Closest network paper: [[1710056]] (coupling 0.01, 5 shared references).","abstract":"The charmonium-like state $χ_{c1}(4010)$, recently observed by the LHCb Collaboration in $B^+ \\to D^{*\\pm}D^{\\mp}K^+$ decays, is investigated as an axial-vector $D^{*\\pm}D^{\\mp}$ molecular state within the QCD sum rule approach. A two-point sum rule incorporating quark, gluon, and mixed vacuum condensates up to dimension $10$ yields the mass and decay constant, $m_{χ_{c1}(4010)} = (4005.89 \\pm 47.15)~\\text{MeV}$ and $f_{χ_{c1}(4010)} = (2.87 \\pm 0.55)\\times 10^{-3}~\\text{GeV}^{4}$, in agreement with the LHCb measurement. Since this mass lies above the $D^{*\\pm}D^{\\mp}$ threshold, the strong coupling constants at the $χ_{c1}(4010)D^{*\\pm}D^{\\mp}$ vertices are extracted from three-point sum rules and used to compute the partial widths of the $D^{*-}D^{+}$ and $D^{*+}D^{-}$ channels. The resulting total width, $Γ_{χ_{c1}(4010)} = (57.64 \\pm 9.64)~\\text{MeV}$, is compatible with experiment within uncertainties. These results support a $D^{*\\pm}D^{\\mp}$ molecular interpretation of $χ_{c1}(4010)$ and offer sum-rule predictions for comparison with future measurements at BESIII, LHCb, and Belle~II."},{"arxiv":"2610.23676","id":"3215999","title":"The pressure of the gluon plasma at $\\mathcal{O}(g_s^6)$, perturbatively","authors":"Mikael Chala, Luis Gil, Javier López Miras","score":3.8,"section":"new","rank":15,"parts":[0.0,0.09,0.04,0.0],"note":"Closest of your papers: [[1397629]] (coupling 0.03, 2 shared references). Closest network paper: [[1730029]] (coupling 0.01, 2 shared references).","abstract":"We determine the four-loop hard-scale matching correction to the pressure of the gluon plasma at high temperature. This result completes the long-standing calculation through $\\mathcal{O}(g_s^6)$, where $g_s$ is the strong coupling. Our result agrees, within uncertainties, with the value obtained in arXiv:1204.6184 by fitting the perturbative series to continuum-extrapolated lattice data, thereby providing the first direct test of the weak-coupling expansion at this order."},{"arxiv":"2605.17563","id":"3157143","title":"Charged-current neutrino opacity within the relativistic Hartree-Fock framework for astrophysical simulations of core-collapse supernovae and binary neutron star mergers","authors":"Kamil Sokołowski, Anil Kumar, Tobias Fischer","score":3.6,"section":"replacement","rank":16,"parts":[0.06,0.02,0.04,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2690106]] (coupling 0.01, 1 shared references). Closest network paper: [[823307]] (coupling 0.01, 2 shared references).","abstract":"Neutrinos and their weak interactions play a vital role in the physics of core-collapse supernovae and binary neutron star mergers. Their description within astrophysical simulations, including the weak rates, is of pivotal importance not only for the prediction of accurate neutrino fluxes and spectra, including the associated conditions relevant to nucleosynthesis, neutrinos are also responsible for heating and cooling of the stellar plasma as well as the transport of lepton number and entropy. In the present article, we develop an essential improvement of the description of the underlying nuclear medium, necessary for the calculations of charged-current weak rates, with the inclusion of explicitly momentum-dependent nuclear interactions. To this end, we introduce the relativistic Hartree-Fock (RHF) approach and the associated momentum-dependent nucleon self-energies. We discuss the resulting neutrino and antineutrino opacities and find large discrepancies comparing the weak rates at the RHF level with those of commonly used relativistic mean-field (RMF) models. In particular, we observe a substantial shift of previously reported large medium-dependent modifications associated with the RMF approach."},{"arxiv":"2610.23606","id":"3215983","title":"Principle of no paradoxical Universe","authors":"Ngo Phuc Duc Loc","score":3.5,"section":"new","rank":17,"parts":[0.0,0.07,0.07,0.0],"note":"Closest of your papers: [[2859009]] (coupling 0.02, 2 shared references). Closest network paper: [[3205155]] (coupling 0.03, 2 shared references).","abstract":"In the standard $Λ\\rm CDM$ model, the Universe will keep expanding forever and its lifetime is infinite. Therefore, even the heaviest supermassive black hole will eventually evaporate and the universal occurrence of the black hole information paradox is unavoidable. However, the recent DESI results seem to indicate that dark energy is dynamical and, more importantly, it is possible that the Universe has a finite lifetime and will experience a ``Big Crunch\" in some billion years from now. In light of this, the lightest confirmed black hole with mass of order one solar mass may not have a chance to evaporate before the Universe ends. Inspired by these observations, we thus raise an intriguing conjecture: Does the Universe choose a configuration such that the ``in-principle\" black hole information paradox can never actually happen in reality? We derive a lower bound on black hole mass as a function of the Universe's lifetime such that the information paradox cannot be realized in nature and some resulting predictions are made. Some profound implications for other related big ideas in physics are briefly discussed."},{"arxiv":"2402.17789","id":"2762625","title":"Reference frame dependence of the periodically oscillating Coulomb field in the Proca theory","authors":"Bogdan Damski","score":3.2,"section":"replacement","rank":18,"parts":[0.0,0.07,0.05,0.0],"note":"Closest of your papers: [[468209]] (coupling 0.03, 1 shared references). Closest network paper: [[1224299]] (coupling 0.02, 1 shared references).","abstract":"The Proca theory of the real massive vector field admits non-equilibrium solutions, where the asymptotic dynamics of its electric field is dominated by the periodically oscillating Coulomb component. We discuss how such field configurations are seen in different reference frames, where we find an intriguing spatial pattern of the vector field of the Proca theory and the electromagnetic field associated with it."},{"arxiv":"2610.23522","id":"3215988","title":"The metric-affine $\\mathring{R}^2$ scalaron: parameter-free inflation","authors":"Christian Dioguardi","score":2.6,"section":"cross","rank":19,"parts":[0.0,0.04,0.07,0.0],"note":"Closest of your papers: [[1755250]] (coupling 0.02, 1 shared references). Closest network paper: [[1768368]] (coupling 0.02, 4 shared references).","abstract":"We present a model of slow-roll inflation in metric-affine gravity, where the connection is independent of the metric. We require that the Einstein-Hilbert term is the only operator that breaks three out of four shift-symmetries of the connection, and impose them on the metric-affine Starobinsky term $αR(Γ)^2$. This replaces it by $α\\mathring{R}^2$, the square of the invariant part of the scalar curvature. The theory propagates only the graviton and one healthy scalar, the metric-affine $\\mathring{R}^2$ scalaron. Its potential approaches a plateau polynomially, $U\\simeq U_0(1-μ^2/χ^2)$, with $μ=\\sqrt{6}\\,M_P$ fixed by the curvature of the connection. Once $α\\simeq2\\times10^{8}$ is set by the scalar amplitude, the model has no free parameters. It predicts $n_s\\simeq1-3/(2N_*)$ and $r\\simeq2\\sqrt3\\,N_*^{-3/2}$ at leading order in $N_*$, and $n_s=0.968$--$0.974$ and $r=0.011$-$0.008$ with exact slow-roll for $N_*=50$-$60$ $e$-folds. These values agree with current data, and $r$ is within reach of the next generation of $B$-mode measurements."},{"arxiv":"2610.23808","id":"3216010","title":"Gravitational Waves as a Probe of Multi-Fluid Cosmologies: General Formalism and the Case of Cosmological Stasis","authors":"Keith R. Dienes, Fazlollah Hajkarim, Lucien Heurtier, Fei Huang, Kuver Sinha, Brooks Thomas, Tao Xu","score":2.6,"section":"cross","rank":20,"parts":[0.0,0.05,0.07,0.0],"note":"Closest of your papers: [[1627633]] (coupling 0.02, 1 shared references). Closest network paper: [[1746210]] (coupling 0.02, 3 shared references).","abstract":"Scalar-induced gravitational waves (SIGWs) provide a powerful probe of the expansion history of the universe prior to the Big Bang. Indeed, the production of such gravity waves depends on the evolution of first-order scalar perturbations within the early universe, while their subsequent propagation depends on the background equation of state. In this paper we extend previous discussions by studying SIGWs in cosmologies containing multiple fluids. As we shall demonstrate, the gravitational-wave signal within such multi-fluid cosmologies is modified in two distinct ways: not only are there new velocity effects which have no single-fluid analogues, but there are also significant alterations to the subsequent redshifting of modes that enter the horizon before the multi-fluid era ends. Thus SIGWs provide a probe of not only the overall expansion rate within such cosmologies, but also their internal multi-fluid composition. As an example, we then consider the case of gravitational waves arising during an epoch of cosmological stasis. During such an epoch, the abundances of energy components with different equations of state remain constant, thereby giving rise to a universe with a constant effective equation of state which nevertheless remains genuinely multi-fluid despite cosmological expansion. Despite their constant equations of state, we find that such stasis cosmologies also give rise to tensor power spectra and present-day gravitational-wave abundances which are significantly different from those expected within a standard radiation-dominated universe."},{"arxiv":"2609.02975","id":"3199445","title":"Probing Quantum Foundations in Long-Baseline Neutrino Oscillations: Wave Packet Approach from MINOS Data to DUNE Predictions","authors":"Baktiar Wasir Farooq, Bipin Singh Koranga, Massimo Blasone","score":2.6,"section":"replacement","rank":21,"parts":[0.0,0.05,0.06,0.0],"note":"Closest of your papers: [[796080]] (coupling 0.02, 1 shared references). Closest network paper: [[3205155]] (coupling 0.02, 1 shared references).","abstract":"We investigate neutrino flavor oscillations in the wave packet formalism, extending the standard planewave treatment to incorporate the finite spatial coherence of neutrino mass eigenstates.We derive the full three flavor oscillation probability with MSW matter effects, decoherence, and localization suppression governed by the wave packet width, benchmarking against MINOS disappearance data and extending to DUNE predictions under the same parameters. To quantify how sharply the oscillation data constrain the wave packet width, we compute the classical Fisher information FC as a function of neutrino energy for both MINOS and DUNE, and show that its sensitivity is concentrated precisely in the low-energy regime where the wave-packet and plane-wave predictions diverge. Beyond the oscillation probability analysis, we compute wave particle entanglement complementarity quantities within a quantum information theoretic framework and explore the complete triality description involving entanglement, predictability, and visibility as functions of neutrino energy for both experiments such as MINOS and DUNE. We show that even when the oscillation probability is numerically indistinguishable from the planewave result, the wave packet structure leaves observable imprints in these triality measures. Our results demonstrate that the wave packet approach provides a theoretically consistent and experimentally motivated framework for probing quantum foundations in long-baseline atmospheric neutrino oscillation experiments."},{"arxiv":"2606.13535","id":"3167900","title":"AgentRivet: an automated system for producing Rivet routines from journal publications","authors":"Antonio J. Costa, Caterina Doglioni, Christian Gütschow, Andrew D. Pilkington, Sukanya Sinha","score":2.6,"section":"replacement","rank":22,"parts":[0.0,0.04,0.07,0.0],"note":"Closest of your papers: [[1615477]] (coupling 0.01, 1 shared references). Closest network paper: [[2665284]] (coupling 0.03, 2 shared references).","abstract":"Particle physics collider experiments provide Rivet routines as part of the analysis preservation strategy for model-independent measurements. Rivet is a C++ toolkit that allow new theoretical models to be compared to the measurements, thus aiding the development and tuning of Monte Carlo event generators as well as searches for physics beyond the Standard Model. However, analysis coverage is known to be incomplete, with only 39% of measurements having documented and publicly available Rivet routines. In this article, we design and implement an automated workflow based on Large Language Models with the goal of providing the missing routines. This multi-step workflow, referred to as AgentRivet, extracts the physics analysis information from published papers and writes the missing Rivet routines, with intermediate code- and physics- reviews as part of an autonomous quality control. We report the results obtained using commercial Large Language Models, provided by OpenAI, Anthropic, and Google, for two recent measurements from the ATLAS and CMS experiments. We find that AgentRivet produces competent Rivet routines with few syntax errors. The physics fidelity of the routines is reasonable and follows the explanations given in the relevant publications. Nevertheless, physics-implementation issues do arise and are investigated using the artefacts produced by AgentRivet. The majority of physics implementation issues arise from subtle-but-ambiguous definitions in the given publication, although some models struggle to implement complex observables even when clear defini     <div class="t">${esc(n.title)}</div><div class="authors">${authors(n.authors)} · arXiv:${esc(n.arxiv)}</div>
    ${n.note?`<p class="why">${why(n.note)}</p>`:''}
    <details class="abs"><summary>Abstract</summary><p class="abs">${esc(n.abstract)}</p></details>
    <div class="links">${n.id?`<a href="https://inspirehep.net/literature/${n.id}" target="_blank" rel="noopener">INSPIRE</a>`:''}<a href="https://arxiv.org/abs/${esc(n.arxiv)}" target="_blank" rel="noopener">arXiv</a><a href="https://arxiv.org/pdf/${esc(n.arxiv)}" target="_blank" rel="noopener">PDF</a></div></li>`).join('');
  more.addEventListener('toggle',()=>{if(more.open)tex(box)})}
const rtip=document.getElementById('reftip');let rcur=null;
function refShow(el){const r=REFS[el.dataset.ref];if(!r)return;rcur=el;rtip.textContent=`${auth(r)} (${r.year}) — ${plain(r.title)}`;rtip.hidden=false;
  const b=el.getBoundingClientRect(),t=rtip.getBoundingClientRect();let L=Math.min(Math.max(8,b.left),innerWidth-t.width-8),T=b.bottom+6;
  if(T+t.height>innerHeight-8)T=b.top-t.height-6;rtip.style.left=L+'px';rtip.style.top=T+'px'}
function refHide(){rtip.hidden=true;rcur=null}
document.addEventListener('pointerover',e=>{const el=e.target.closest('.ref');if(el&&e.pointerType==='mouse')refShow(el)});
document.addEventListener('pointerout',e=>{if(e.target.closest('.ref')&&e.pointerType==='mouse')refHide()});
document.addEventListener('click',e=>{const el=e.target.closest('.ref');if(el)refShow(el);else if(rcur)refHide()});
document.addEventListener('focusin',e=>{const el=e.target.closest('.ref');if(el)refShow(el)});
document.addEventListener('focusout',e=>{if(e.target.closest('.ref'))refHide()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')refHide()});
addEventListener('scroll',()=>{if(rcur)refHide()},{passive:true});
list();nextList();fold();draw();panel();
window.addEventListener('load',()=>{tex(document.getElementById('list'));tex(document.getElementById('panel'));fold();
  if(window.MathJax&&MathJax.startup&&MathJax.startup.promise)MathJax.startup.promise.then(()=>setTimeout(fold,300))});
addEventListener('resize',()=>{clearTimeout(window._ft);window._ft=setTimeout(fold,200)});
</script>
