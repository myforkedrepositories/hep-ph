<script>
const RAW = {"n":[{"id":"3170411","arxiv":"2606.19757","title":"Graviton Floor","first":"Matsuo","nauth":5,"year":2026,"cites":0,"role":"repl","note":"Cites 6 network papers: [[2920754]], [[2661930]], [[3156721]], [[2939091]], [[2840303]], [[2826986]]. Closest of your papers: [[2826987]] (coupling 0.03, 6 shared references). Closest network paper: [[2920754]] (coupling 0.44, 30 shared references). Shared topics: gravitational wave.","score":53.4,"rank":1,"section":"replacement","parts":[0.97,0.11,1,0.0,0.1],"abstract":"It has been observed that the Universe is permeated by the cosmic photon background, ranging from radio waves to gamma rays. We investigate the conversion of the photon background into gravitons in the presence of background magnetic fields in the Milky Way Galaxy and in blazar jets. We find that the resulting graviton background is dominated by the contribution generated in blazar jets. Importantly, this graviton background constitutes a graviton floor for high-frequency gravitational wave detectors searching for new physics, analogous to the neutrino floor.","authors":"Himeka Matsuo, Asuka Ito, Kazunori Kohri, Teruaki Suyama, Ryutaro Tomomatsu","nlinked":68,"nref":73,"src":"INSPIRE","html":true},{"id":"3226290","arxiv":"2611.09775","title":"Uncovering TeV-scale dark matter with Z-fusion at a muon collider","first":"Datta","nauth":3,"year":2026,"cites":0,"role":"today","note":"Cites 2 network papers: [[2914121]], [[3165814]]. Closest of your papers: [[1455793]] (coupling 0.06, 8 shared references). Closest network paper: [[1907141]] (coupling 0.15, 17 shared references). Shared topics: scalar dark matter, dark matter.","score":41.3,"rank":2,"section":"new","parts":[0.7,0.2,0.43,0.0,0.45],"abstract":"We demonstrate the advantage of the $Z$-boson fusion channel at a high-energy, high-luminosity muon collider in eliciting signals of a TeV-scale scalar dark matter (DM) particle. The utility of such a set-up lies in (a)the attainability of high centre-of-mass energy ($\\approx 10 ~\\rm TeV$), (b)the likely availability of large integrated luminosity ($\\gtrsim 10~ab^{-1}$), and (c)the facility for efficient detection of very forward tagged muons. Our analysis is based on the process $μ^+ μ^- \\rightarrow μ^+ μ^-$ + missing energy, driven by $Z$-fusion. We present the results in the context of (i) a scenario characterised by dimension-6 effective couplings, and (ii) an inert doublet model. After filtering each scenario through its associated constraints, we find that it is possible to achieve a signal significance of about 6.7$σ$ in case (i) and about 5.5$σ$ in case (ii), for DM particle masses $\\approx$ 1 TeV and an integrated luminosity of $10 ~ ab^{-1}$.","authors":"Anindya Datta, Jayita Lahiri, Biswarup Mukhopadhyaya","nlinked":57,"nref":57,"src":"INSPIRE","html":true},{"id":"3225621","arxiv":"2611.08583","title":"DarkMatterFM-Registry: A Machine-Readable Registry of Dark-Matter Models Extracted from the arXiv Literature","first":"Zelko","nauth":3,"year":2026,"cites":0,"role":"today","note":"Cites 2 network papers: [[2795517]], [[1647573]]. Closest of your papers: [[3094526]] (coupling 0.05, 4 shared references). Closest network paper: [[1837439]] (coupling 0.11, 3 shared references). Shared topics: dark matter.","score":35.5,"rank":3,"section":"cross","parts":[0.7,0.16,0.33,0.0,0.13],"abstract":"To use a dark-matter model one needs to know what defines it, which observables it affects, which codes and likelihoods evaluate it, and under what assumptions a published bound applies. That information is scattered across tens of thousands of papers. We present DarkMatterFM-Registry, a machine-readable registry of dark-matter models extracted from arXiv full texts by a staged large-language-model (LLM) pipeline: 6,145 structured model cards, validated against a seven-file JSON Schema suite, ranked by expected value for observational follow-up, and enriched for the top ~2,000 with observables, constraints, and theory-to-observable routes. Schema checks pass 97.8% of cards, and an LLM-judged accuracy study on a stratified card sample finds 81% of section verdicts correct, 18% partially correct, and none hallucinated. As a first application we turn the registry into a priority-weighted roadmap of 25 concrete projects the community could build. The roadmap is built by judging every computational step of every enriched model's theory-to-observable routes as available, partial, or missing, and aggregating the resulting typed gaps weighted by model priority. We find that what blocks the most high-priority models is not missing theory but missing shared infrastructure: model files for existing relic-abundance solvers, a general non-cold Boltzmann-code framework, reusable indirect-detection likelihoods, and a Lyman-$α$ forest likelihood for non-cold dark matter (the largest gap for structure-formation probes). The model cards, schemas, roadmap, and ranking are released making the project reproducible and the cards available for the community.","authors":"Ioana A. Zelko, Jo Bovy, Nolan Koblischke","nlinked":18,"nref":24,"src":"INSPIRE","html":true},{"id":"3225739","arxiv":"2611.09478","title":"An interrelation of three neutrino mixing angles","first":"Xing","nauth":1,"year":2026,"cites":0,"role":"today","note":"Cites 2 network papers: [[3193100]], [[2762216]]. Closest of your papers: [[1854224]] (coupling 0.02, 1 shared references). Closest network paper: [[3214449]] (coupling 0.07, 4 shared references).","score":29.4,"rank":4,"section":"new","parts":[0.7,0.06,0.2,0.0,0.0],"abstract":"We conjecture a novel interrelation of three neutrino mixing angles: $θ^{}_{23} = \\left(θ^{}_{12} + θ^{}_{13}\\right)/2 + π/8$, which predicts $θ^{}_{23} = 43.46^{+0.51^\\circ}_{-0.52^\\circ}$ with inputs of the latest JUNO and Daya Bay precision data. A simple ansatz is proposed to derive this phenomenologically favored and experimentally testable angle relation, and present a new expansion of the lepton flavor mixing matrix in powers of a single small parameter as a by-product.","authors":"Zhi-zhong Xing","nlinked":26,"nref":26,"src":"INSPIRE","html":true},{"id":"3225697","arxiv":"2611.09132","title":"Stimulated Axion Decay around Primordial Black Holes and the Diffuse Radio Background","first":"Choi","nauth":3,"year":2026,"cites":0,"role":"today","note":"Co-authors of yours: Choi. Closest of your papers: [[1941263]] (coupling 0.13, 19 shared references). Closest network paper: [[2918603]] (coupling 0.17, 11 shared references). Shared topics: primordial black hole, dark matter.","score":27.9,"rank":5,"section":"new","parts":[0.0,0.38,0.47,0.5,0.43],"abstract":"We study stimulated axion decay in dense axion halos around primordial black holes (PBHs), assuming that both PBHs and axions contribute to dark matter. We construct the axion density profile by matching a hydrogenic soliton-like core dominated by the PBH potential to the $r^{-9/4}$ spike produced by secondary infall. We also impose an inner cutoff at the innermost stable circular orbit. We derive local Boltzmann equations for the number densities of photons and axions, including spontaneous and stimulated decay, inverse decay, photon escape, and axion filling. We solve these equations numerically and with a semi-analytic approximation. Stimulated emission occurs within an inner region where photon amplification overcomes escape. We calculate the photon emission from an individual PBH halo and integrate it over the population of PBHs throughout cosmic history. By requiring the resulting diffuse radio spectrum not to exceed the radio background measured by ARCADE~2, we derive upper bounds on the fraction of dark matter in PBHs. The bounds are strongest at intermediate PBH masses and apply over a wider mass range as the coupling between axions and photons increases.","authors":"Ki-Young Choi, Junghoon Joh, Kenji Kadota","nlinked":49,"nref":57,"src":"INSPIRE","html":false},{"id":"3214173","arxiv":"2610.14806","title":"Gravitational waves from strong first-order phase transitions in an expanding Universe","first":"Zou","nauth":4,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[2657746]]. Closest of your papers: [[2663002]] (coupling 0.01, 2 shared references). Closest network paper: [[3208082]] (coupling 0.18, 11 shared references). Shared topics: gravitational wave.","score":25.7,"rank":6,"section":"replacement","parts":[0.45,0.04,0.52,0.0,0.1],"abstract":"We investigate the gravitational waves generated by first-order phase transitions (PTs) in an expanding Universe. Using a scalar field-fluid coupled model, we perform three-dimensional lattice numerical simulations of slow first-order PTs with strong strength. We observe that the contribution from sound waves to the gravitational wave (GW) signal significantly dominates over that from bubble collisions. The sound wave spectra exhibit two peaks located at the mean bubble separation and the sound-shell width. Rotational modes are generated in the fluid during the bubble collisions, and their magnitude grows with the PT strength ($α$). The effective lifetime of the sound-wave source increases for slower PTs, decreasing for faster PT with larger $β/H$ and rising with smaller $α$. While the simulated amplitude of normalized gravitational waves is of order $\\mathcal{O}(10^{-2})$, in alignment with Minkowski-spacetime results, the resulting GW spectra differ markedly from those scenarios.","authors":"Jintao Zou, Zizhuo Zhao, Yongtao Jia, Ligong Bian","nlinked":70,"nref":75,"src":"INSPIRE","html":true},{"id":"1497719","arxiv":"1611.04526","title":"Extragalactic photon-ALP conversion at CTA energies","first":"Kartavtsev","nauth":3,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[1286910]]. Closest of your papers: [[1597138]] (coupling 0.05, 5 shared references). Closest network paper: [[1286910]] (coupling 0.08, 10 shared references).","score":22.8,"rank":7,"section":"replacement","parts":[0.45,0.11,0.24,0.0,0.0],"abstract":"Magnetic fields in extragalactic space between galaxy clusters may induce conversions between photons and axion-like particles (ALPs), thereby shielding the photons from absorption on the extragalactic background light. For TeV gamma rays, the oscillation length ($l_{\\rm osc}$) of the photon-ALP system becomes inevitably of the same order as the coherence length of the magnetic field ($l$) and the length over which the field changes significantly (transition length $l_{\\rm t}$) due to refraction on background photons. We derive exact statistical evolution equations for the mean and variance of the photon and ALP transfer functions in the non-adiabatic regime ($l_{\\rm osc} \\sim l \\gg l_{\\rm t}$). We also make analytical predictions for the transfer functions in the quasi-adiabatic regime ($l_{\\rm osc} \\ll l, l_{\\rm t}$). Our results are important in light of the upcoming Cherenkov Telescope Array (CTA), and may also be applied to models with non-zero ALP masses.","authors":"A. Kartavtsev, G. Raffelt, H. Vogel","nlinked":89,"nref":90,"src":"INSPIRE","html":true},{"id":"3226303","arxiv":"2611.09797","title":"Kinematic Reconstruction of Top-Quark Pairs Using Analytical and Machine-Learning Methods with CMS Open Data","first":"Aushev","nauth":4,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Closest of your papers: [[1455793]] (coupling 0.04, 3 shared references). Closest network paper: [[1674879]] (coupling 0.05, 3 shared references).","score":21.0,"rank":8,"section":"cross","parts":[0.45,0.1,0.15,0.0,0.0],"abstract":"The reconstruction of the top-quark-pair ($t\\bar{t}$) kinematics in the dilepton $t\\bar{t}$ decay channel is challenging due to the presence of two undetected neutrinos. In this work, existing kinematic reconstruction methods used by the CMS Collaboration are studied using a Monte Carlo sample with $t\\bar{t}$ events from CMS Open Data at a centre-of-mass energy of 7 TeV. An improved version of the loose kinematic reconstruction, LKRv2, is developed by imposing more stringent requirements on the jet-lepton pairing entering the reconstruction. A further modification, LKRv3, exploits the kinematic similarity between the dilepton and neutrino-pair systems and improves the resolution of the reconstructed $t\\bar{t}$ invariant mass relative to the baseline LKR by $7\\%$, with smaller improvements for the transverse momentum and rapidity of $t\\bar{t}$. In addition, two machine-learning (ML) based approaches are developed using a residual multilayer perceptron and a conditional normalizing flow. Relative to LKRv3, they improve the resolution of the invariant mass, transverse momentum and rapidity by approximately $30\\%$, $20\\%$ and $15\\%$, respectively. In particular, a resolution of 30 GeV is achieved for the reconstructed invariant mass of $t\\bar{t}$ near the production threshold. A dedicated generator-level study and a generator-to-detector transfer test demonstrate that the ML approaches learn a genuine physics-driven correction to the $ν\\barν$ approximation, rather than merely exploiting detector-specific effects. These results demonstrate the strong potential of ML-based approaches for improving the reconstruction of dilepton $t\\bar{t}$ events, while identifying the neutrino-pair approximation as an important limitation on the achievable resolution.","authors":"V. Aushev, M. Spitsyn, R. Yermolenko, O. Zenaiev","nlinked":27,"nref":35,"src":"INSPIRE","html":true},{"id":"3225700","arxiv":"2611.09095","title":"Production of hidden-charm molecular candidates with hidden strangeness in $B_s^0$ decays","first":"Su","nauth":4,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Also cites widely used network papers: [[2817040]]. Closest of your papers: [[3184726]] (coupling 0.00, 1 shared references). Closest network paper: [[3193100]] (coupling 0.03, 33 shared references). Shared topics: production mechanism.","score":20.1,"rank":9,"section":"new","parts":[0.48,0.01,0.09,0.0,0.15],"abstract":"We study the production of spin-one $D_{s0}^*(2317)\\bar D_s^*$, $D_{s1}(2460)\\bar D_s^*$, and $D_{s1}(2536)\\bar D_s^*$ molecular candidates in $B_s^0$ decays with an accompanying $η$, providing a complementary probe of their structure and production mechanisms. The meson-loop rescattering amplitudes are constructed from factorized weak sources and heavy-hadron chiral interactions. Constituent couplings are estimated using threshold-dependent compositeness relations, and the associated input uncertainties are propagated to the predicted rates. Opposite-$C$-parity partner hypotheses are included with inherited benchmark parameters. We calculate the branching fractions for two relative signs. Over the cutoff range $2\\leqα\\leq5$, the larger central branching fractions reach several $10^{-6}$ to several $10^{-5}$, suggesting potential accessibility in future experimental measurements.","authors":"Yue Su, Ying-Bo He, Xiao-Yun Wang, Xiao-Hai Liu","nlinked":81,"nref":84,"src":"INSPIRE","html":true},{"id":"3225646","arxiv":"2611.08690","title":"Exact and hybrid neutrino oscillation probabilities via the evolution operator","first":"D'Olivo","nauth":3,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Closest of your papers: [[1854224]] (coupling 0.01, 1 shared references). Closest network paper: [[3214449]] (coupling 0.05, 4 shared references).","score":18.8,"rank":10,"section":"new","parts":[0.45,0.03,0.14,0.0,0.0],"abstract":"We revisit the three-flavor neutrino oscillations in constant-density matter using the evolution matrix expressed in terms of the Lagrange-Sylvester interpolation. Taking advantage of Vieta's formulas for the Hamiltonian of the system, we derive exact closed expressions for the oscillation probabilities $P_{ee}$, $P_{μe}$, and $P_{μτ}$, which are concise and simple, and structurally identical to their vacuum counterparts. The CP-violation contribution, proportional to the Jarlskog invariant $\\mathcal{J}$, appears as a single, clearly separated term. Our approach does not require introducing neutrino mixing in the medium and avoids using a matter-dependent CP-violation phase, facilitating the separation of genuine CP violation from that induced by matter effects. We explicitly verify that, in the limit $V \\to 0$, our expressions for the flavor transition probabilities reduce to the well-known vacuum formulas. The exact structure of the probabilities is preserved if the exact, not very enlightening, trigonometric eigenvalues are replaced by approximate expressions in radicals. We illustrate this hybrid approach with eigenvalues obtained from two successive rotations of the Hamiltonian. For an experiment like DUNE, the hybrid probability values match those of the exact probabilities within absolute errors of about $2\\times 10^{-6}$ in all channels and relative errors less than $0.01 \\%$ for $P_{ee}$, $P_{μe}$, and $P_{μτ}$.","authors":"Juan Carlos D'Olivo, José Arnulfo Herrera Lara, Oscar A. Sampayo","nlinked":40,"nref":41,"src":"INSPIRE","html":true},{"id":"3096105","arxiv":"2512.23282","title":"New Constraints on Cosmic-ray boosted Sub-GeV Dark Matter via Light Mediators","first":"Yu","nauth":6,"year":2026,"cites":0,"role":"repl","note":"Closest of your papers: [[3130296]] (coupling 0.05, 10 shared references). Closest network paper: [[3115426]] (coupling 0.20, 23 shared references). Shared topics: direct detection, direct detection experiment, nuclear recoil, dark matter.","score":18.7,"rank":11,"section":"replacement","parts":[0.0,0.15,0.56,0.0,0.56],"abstract":"Traditional direct detection experiments lack the sensitivity to probe the sub-GeV dark matter (DM), primarily due to the low energy of the expected nuclear recoils. In this work, we investigate cosmic-ray (CR) upscattering as a mechanism to accelerate DM particles to detectable velocities in underground experiments. By analyzing four models of DM-nucleon interactions -- namely scalar, vector, pseudoscalar, and axial-vector mediators -- we derive constraints on the coupling parameters using data from the LZ, XENON, and Borexino experiments, covering mediator mass from $10^{-6}$ to $1$ GeV. As the mediator mass varies, the shift in dominance between momentum transfer and mediator mass leads to a turnover in the constraints around $10^{-2}$--$10^{-3}~\\mathrm{GeV}$. Our results extend the reach of direct detection into the sub-GeV window and clarify the critical role of momentum dependence in light-mediator scenarios.","authors":"Yang Yu, Guan-Sen Wang, Bo Zhang, Tian-Peng Tang, Bing-Yu Su, Lei Feng","nlinked":81,"nref":87,"src":"INSPIRE","html":true},{"id":"3222890","arxiv":"2611.05440","title":"Meson spectra in a screened relativized quark model","first":"Huang","nauth":6,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[3193100]]. Also cites widely used network papers: [[2817040]]. Closest of your papers: [[3184726]] (coupling 0.00, 1 shared references). Closest network paper: [[3214449]] (coupling 0.01, 1 shared references).","score":17.6,"rank":12,"section":"replacement","parts":[0.48,0.01,0.03,0.0,0.0],"abstract":"In this work, we employed the modified Godfrey--Isgur model to systematically investigate the mass spectra of several light, heavy-light, and heavy-heavy meson systems. In this model, a screened potential is employed to phenomenologically account for modifications to the long-range confining interaction associated with unquenched effects. We performed a global refit of the relevant model parameters to a combined set of 90 adopted meson masses spanning all three sectors, ensuring a consistent parameter determination across the different meson systems. Using the resulting parameter set, we calculated the low-lying and highly excited spectra and the corresponding mixed states in different meson families, and compared our results with existing experimental data and other theoretical results. The assignment of several newly observed structures (such as $B_c^*$ and $D_{s1}(2933)$) have also been discussed based on their predicted masses. Overall, the model describes several main spectroscopic features across different flavors and provides mass predictions for highly excited states that have not yet been experimentally established.","authors":"Zhe-Qi Huang, Lei Huang, Xiao-Lei Zhang, Xin-Lei Ge, Hao Chen, Cheng-Qun Pang","nlinked":115,"nref":116,"src":"INSPIRE","html":true},{"id":"3197924","arxiv":"2608.29666","title":"Probability-based Estimates of the Uncalculated N$^5$LO QCD Contribution to the Hadronic $W$-Boson Decay Width","first":"Yang","nauth":4,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[3193100]]. Closest network paper: [[2962229]] (coupling 0.03, 2 shared references).","score":16.9,"rank":13,"section":"replacement","parts":[0.45,0.0,0.07,0.0,0.0],"abstract":"The perturbative QCD corrections to the hadronic decay width of the $W$ boson are currently known up to next-to-next-to-next-to-next-to-leading order ($\\mathrm{N^4LO}$), whereas the exact $\\mathrm{N^5LO}$ correction remains unavailable owing to its formidable computational complexity. In this work, we estimate the $\\mathrm{N^5LO}$ contributions by adopting Bayesian analysis (BA). Before performing the estimation, the Principle of Maximum Conformality (PMC) is employed to improve the precision of the initial scale-dependent perturbative series. Through recursive application of the renormalization group equation, non-conformal terms are absorbed into the strong running coupling, yielding a scheme-independent, scale-invariant perturbative series with improved convergence. The PMC procedure determines an effective coupling $α_s(Q_*)$, with the PMC scale fixed as $Q_* = 100.102~\\mathrm{GeV}$ at next-to-next-to-leading logarithmic accuracy. Based on the improved and more precise series, the $95.5\\%$ BA credible interval yields an uncertainty of $Δδ_\\mathrm{QCD}|_{\\mathrm{PMC, BA}}^{\\mathrm{N^5LO}} = \\pm 1.0\\times 10^{-5}$. The resulting hadronic branching ratio is $\\mathcal{B}(W\\to \\text{hadrons})|_\\mathrm{PMC} = (65.84\\pm 1.54)\\%$, which is consistent with experimental data within reasonable errors.","authors":"Shu-Heng Yang, Jiang Yan, Xing-Gang Wu, Zhi-Fei Wu","nlinked":70,"nref":70,"src":"INSPIRE","html":true},{"id":"3225643","arxiv":"2611.08586","title":"Magic Is in the Eye of the Measure","first":"Shen","nauth":3,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Closest network paper: [[3095306]] (coupling 0.02, 1 shared references).","score":16.5,"rank":14,"section":"cross","parts":[0.45,0.0,0.04,0.0,0.0],"abstract":"Magic, or nonstabilizerness, is the quantum resource behind universal quantum computation. Its applications in high-energy and nuclear physics rely almost exclusively on the stabilizer Rényi entropy (SRE), although magic has no unique measure. For two qubits, we compare the SRE with three measures defined through optimizations over stabilizer states: the min- and max-relative entropies of magic and the logarithmic free robustness. We determine the maximal-magic states of all four measures, with exact proofs, and find that they depend on the measure. In the determination of the weak mixing angle from minimal magic in Møller scattering, the min-relative entropy gives an energy-dependent value that differs from that of the SRE, whereas the max-relative entropy and the logarithmic free robustness give $\\sin^2θ_W=1/4$ at all energies. We trace this difference to the non-analytic structure of the optimization-based measures. Physical conclusions drawn from extremizing magic can thus depend on the measure.","authors":"Zhi-Heng Shen, Zhewei Yin, Hao-Lin Zhang","nlinked":64,"nref":70,"src":"INSPIRE","html":true},{"id":"3176164","arxiv":"2607.00413","title":"Spin Femtoscopy: A Framework for Revealing Genuine Spin Correlations","first":"Zhang","nauth":3,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[3193100]]. Closest network paper: [[3214449]] (coupling 0.02, 1 shared references).","score":16.5,"rank":15,"section":"replacement","parts":[0.45,0.0,0.05,0.0,0.0],"abstract":"Spin correlations are among the most fundamental quantum observables in many-body systems, yet they remain difficult to access experimentally in relativistic heavy-ion collisions. Existing spin measurements, including hyperon polarization and vector-meson spin alignment, have revealed important single-particle spin phenomena, but genuine two-particle spin correlations in the produced hadronic system remain largely unexplored. Here we propose spin femtoscopy, a framework for accessing genuine two-particle spin correlations through spin-resolved femtoscopic measurements. The key principle is that different two-particle spin configurations can give rise to different femtoscopic correlation functions because of quantum statistics and spin-dependent final-state interactions. Using $ΛΛ$ pairs as a proof of principle, we exploit the self-analyzing weak decay of $Λ$ hyperons to construct spin-sensitive femtoscopic correlation functions with different singlet and triplet admixtures. We show that these observables provide experimental access to the spin-state populations of the pair and allow genuine spin correlations to be separated from spin-dependent femtoscopic mixing caused by quantum statistics and final-state interactions. This work extends femtoscopy from a probe of source geometry and final-state interactions to a framework for revealing the quantum spin structure of strongly interacting matter.","authors":"Kehao Zhang, Xuan Wang, Xiaofeng Luo","nlinked":47,"nref":51,"src":"INSPIRE","html":true},{"id":"3097785","arxiv":"2601.01849","title":"Asymmetric Dark Matter from Low-Scale Spontaneous Leptogenesis","first":"Takahashi","nauth":2,"year":2026,"cites":0,"role":"repl","note":"Closest of your papers: [[3130296]] (coupling 0.03, 6 shared references). Closest network paper: [[2692782]] (coupling 0.10, 13 shared references). Shared topics: dark matter mass, direct detection, direct detection experiment, dark matter.","score":13.1,"rank":16,"section":"replacement","parts":[0.0,0.08,0.29,0.0,0.63],"abstract":"We investigate a novel type of asymmetric dark matter (ADM) model in which the dark matter asymmetry and the baryon asymmetry in our universe (BAU) are produced simultaneously via low-scale spontaneous leptogenesis, where the mass scale of right-handed neutrino is much lower than the Davidson-Ibarra bound $M_1 \\ll 10^{9}~\\rm{GeV}$. In our scenario, both asymmetries are predominantly sourced by a dynamical $CP$ phase, namely the majoron. Its kinetic misalignment provides a sufficiently large, time-dependent effective $CP$ phase, allowing efficient asymmetry production even for low-scale right-handed neutrinos. In our framework, the sources of $CP$ violation responsible for the BAU and ADM are correlated with each other, leading to a predictive relation for the dark matter mass. In particular, when the dark matter asymmetry reaches its equilibrium value before freeze-out, the dark matter mass is typically predicted to lie in the range $\\mathcal{O}(0.1)~\\mathrm{GeV} \\lesssim m_χ \\lesssim \\mathcal{O}(100)~\\mathrm{GeV}$, which lies within the sensitivity of direct detection experiments. On the other hand, if the dark matter asymmetry does not reach its equilibrium value due to weak coupling, the allowed mass range extends over a broader interval, $\\mathcal{O}(0.1)~\\mathrm{GeV} \\lesssim m_χ \\lesssim \\mathcal{O}(10)~\\rm{TeV}$.","authors":"Hiroki Takahashi, Juntaro Wada","nlinked":105,"nref":109,"src":"INSPIRE","html":true},{"id":"3225702","arxiv":"2611.09106","title":"Probing Dark Matter via the Migdal Effect in LUX-ZEPLIN Data","first":"Yu","nauth":2,"year":2026,"cites":0,"role":"today","note":"Closest of your papers: [[2794409]] (coupling 0.06, 7 shared references). Closest network paper: [[3207263]] (coupling 0.12, 12 shared references). Shared topics: dark matter.","score":11.4,"rank":17,"section":"cross","parts":[0.0,0.17,0.33,0.0,0.13],"abstract":"Sub-GeV dark matter (DM) particles deposit little energy in conventional direct-detection experiments and are therefore difficult to probe, but the Migdal effect provides an electronic signal from atomic ionization accompanying the recoil. Using the new results of the LUX-ZEPLIN experiment with a 4.2 tonne-year exposure, we evaluate the sensitivity of the Migdal effect to the spin-independent DM--nucleon scattering cross section. For masses between $350~\\mathrm{MeV}$ and $10~\\mathrm{GeV}$, the projected 90\\% upper limits range from $6.5\\times10^{-37}$ to $9.6\\times10^{-42}~\\mathrm{cm^2}$. These limits are then used to constrain the minimal scalar- and vector-mediator DM models. For the light-mediator DM model, the constraint on the coupling reaches $α\\simeq 10^{-12}$, which is stronger than or comparable to the constraints from kaon decays, stellar cooling, and SN1987A.","authors":"Yang Yu, Lei Feng","nlinked":43,"nref":44,"src":"INSPIRE","html":true},{"id":"3225680","arxiv":"2611.09037","title":"Probing flavor-dependent neutrino-dark matter interactions with the flavor composition of high-energy cosmic neutrinos","first":"Choi","nauth":2,"year":2026,"cites":0,"role":"today","note":"Co-authors of yours: Choi. Closest of your papers: [[1365306]] (coupling 0.01, 1 shared references). Closest network paper: [[2707246]] (coupling 0.05, 2 shared references). Shared topics: dark matter density, dark matter.","score":11.2,"rank":18,"section":"new","parts":[0.0,0.03,0.14,0.5,0.31],"abstract":"High-energy astrophysical neutrinos probe non-standard neutrino interactions over cosmological distances. We study flavor-dependent interactions between neutrinos and dark matter (DM) for neutrinos produced inside the dense DM spike surrounding the supermassive black hole of the blazar TXS~0506+056. A flavor-diagonal potential $V_α=A_α\\,ρ_χ(r)$ induced by coherent forward scattering modifies the mixing in the medium, and the flavor-dependent scattering cross section attenuates the neutrino flux along the line of sight. We show that the propagation is adiabatic throughout the spike and the halo, so that the matter eigenstates produced at the source are conserved and only re-projected onto flavors at Earth. Two regimes emerge. For $A\\ll 10^{-38}\\,{\\rm cm^3}$ the mixing is unaffected and the IceCube three-flavor composition limits the cross section to $σ_{νχ}/m_χ\\lesssim 10^{-28}\\,{\\rm cm^2/GeV}$. For larger $A$ the interacting flavor is isolated into a single matter eigenstate at the source; the two remaining eigenstates escape without attenuation, producing a survival plateau that relaxes the limits by up to four orders of magnitude. The sign of the potential can differ between neutrinos and antineutrinos, so that the isolated state connects to different vacuum mass eigenstates for $ν$ and $\\barν$, which leaves a characteristic imprint on the flavor composition even without attenuation. The requirement that the potential induced by the dark matter density around Earth do not affect the observed PMNS matrix, so that the flavor projection at Earth is performed with the local matter mixing, gives A$\\lesssim 10^{-30}\\text{cm} ^3$. The combined constraints are presented in the $(A,σ_{νχ}/m_χ)$ plane and compared with a vector-mediator benchmark.","authors":"Ki-Young Choi, Ankhbayar Tugssaikhan","nlinked":41,"nref":43,"src":"INSPIRE","html":true},{"id":"3225676","arxiv":"2611.08621","title":"Opening up derivative baryon-number-violating operators","first":"Heeck","nauth":2,"year":2026,"cites":0,"role":"today","note":"Closest of your papers: [[2690106]] (coupling 0.08, 6 shared references). Closest network paper: [[2163299]] (coupling 0.10, 8 shared references).","score":11.0,"rank":19,"section":"new","parts":[0.0,0.21,0.3,0.0,0.03],"abstract":"Baryon number violation is our most sensitive probe of physics beyond the Standard Model, typically encoded in higher-dimensional effective operators. Operators involving derivatives are often ignored in phenomenological analyses since they are generically suppressed compared to non-derivative operators. We systematically construct tree-level UV completions of derivative baryon-number-violating operators up to mass dimension 12 in the Standard Model effective field theory (extended by right-handed neutrinos) and show that derivative operators need not be suppressed. Our public code can be used to UV-complete other derivative operators.","authors":"Julian Heeck, Diana Sokhashvili","nlinked":50,"nref":52,"src":"INSPIRE","html":true},{"id":"3225670","arxiv":"2611.08680","title":"A Phase-Transition Portal to Enhanced Dark Matter Annihilation","first":"Huang","nauth":4,"year":2026,"cites":0,"role":"today","note":"Closest of your papers: [[2794409]] (coupling 0.02, 3 shared references). Closest network paper: [[3167588]] (coupling 0.06, 6 shared references). Shared topics: singlet scalar, direct detection, complex scalar, dark matter.","score":10.5,"rank":20,"section":"new","parts":[0.0,0.06,0.18,0.0,0.6],"abstract":"We present a thermal dark matter (DM) scenario in which a phase transition after freeze-out changes both the DM spectrum and the dominant annihilation process, allowing an enhanced present day annihilation rate with suppressed direct detection. We realize this mechanism in a two-Higgs-doublet model extended by a complex scalar singlet, a Majorana fermion, and a heavier Dirac fermion. Before the transition, the Majorana state freezes out through $p$-wave annihilation into singlet scalars. The subsequent transition changes the dark fermion masses and mixing, enabling $s$-wave annihilation through a pseudoscalar portal. The surviving relic differs in mass and composition from the original state. We find relic compatible solutions with present day annihilation rates more than an order of magnitude above the canonical thermal value, without tuning to a mediator resonance, while satisfying direct detection bounds.","authors":"Peisi Huang, Anibal D. Medina, Carlos E. M. Wagner, Kairui Zhang","nlinked":67,"nref":71,"src":"INSPIRE","html":true},{"id":"3189108","arxiv":"2608.08345","title":"Perturbative Dissipation in Minimal Warm Inflation","first":"Chung","nauth":3,"year":2026,"cites":0,"role":"repl","note":"Closest of your papers: [[2663002]] (coupling 0.01, 2 shared references). Closest network paper: [[2753529]] (coupling 0.21, 8 shared references).","score":10.3,"rank":21,"section":"replacement","parts":[0.0,0.04,0.6,0.0,0.0],"abstract":"We present an analysis of the perturbative modes of dissipation in the minimal warm inflation model where an axion-inflaton is coupled to a gluon thermal bath through the axion-gauge coupling. The corresponding friction coefficient, which generically is governed by IR physics, for the processes we consider is dominated by Landau damping of soft space-like gluons and the plasmon decay of hard on shell gluons. Since both of these processes are IR dominated, the friction coefficient becomes sensitive to the non-perturbative magnetic mass scale $m_{g}^{-1} \\sim (αT)^{-1}$ which in turn leads to the friction coefficient's overall linear proportionality to $α$, which is much less suppressed in $α$ powers compared to the well understood term from Chern-Simons (CS) diffusion $(\\propto α^5)$. On the other hand, this contribution to the friction coefficient is suppressed due to slow roll. We show that this can be viewed as a suppression of local spontaneous CPT violation for derivative couplings in general and that time correlations of nonlocal variables which do not fall off at large time separations are what allow an unsuppressed friction coefficient.","authors":"Daniel J. H. Chung, Nidhi Sudhir, Lian-Tao Wang","nlinked":55,"nref":55,"src":"INSPIRE","html":true},{"id":"3193100","arxiv":"","title":"Review of Parti 0,0.04,0.19,0.5,0.0],"note":"Co-authors of yours: Ellis. Closest of your papers: [[1455793]] (coupling 0.01, 1 shared references). Closest network paper: [[3131565]] (coupling 0.06, 5 shared references).","abstract":"The LHC limits on the heavy neutral Higgs bosons of the minimal supersymmetric extension of the Standard Model, which are particularly relevant at low values of the ratio of vacuum expectation values $\\tanβ$, have been obtained in the narrow-width approximation, without including the interference between the pure Higgs signal and the QCD background. We study the interference of the resonant heavy neutral CP-even $H$ and CP-odd $A$ boson contributions with the non-resonant gluon-fusion amplitudes in the processes $gg\\to VV$ with $V=W,Z$, $gg \\to hh$ and $gg\\to Zh$ at low $\\tanβ$, $1\\le \\tanβ\\le 6$. We work at leading order but with the exact top-quark mass dependence, and with the longitudinal $VV$ and $Zh$ amplitudes obtained from the Goldstone-boson equivalence theorem that lead to loop form factors similar to those appearing in $gg\\to hh$. The lineshapes in the four search channels are governed by a simple complex parameter $κ$, the ratio of the resonant to non-resonant amplitudes at the peak. Because the $H$ and $A$ bosons couple weakly to the considered final states, while being broadened by their decays to top quarks, $|κ|$ drops to values of a few for masses of $0.5$--$1$ TeV, even though the total widths remain at the percent level. The interference then increases the signal rates by up to tens of per cent, and distorts their lineshapes. For the present ATLAS (and presumably CMS) Run II exclusion limits, the net effect is nevertheless rather modest, except at the high-mass end of the $H\\to hh$ contour, but it becomes important for the masses that will be probed at the high-luminosity LHC."},{"arxiv":"2611.09893","id":"3226313","title":"Challenges for minimal warm inflation in the Standard Model and beyond","authors":"Anish Ghoshal, Alessandro Strumia","score":8.3,"section":"new","rank":23,"parts":[0.0,0.08,0.38,0.0,0.0],"note":"Closest of your papers: [[1709434]] (coupling 0.03, 4 shared references). Closest network paper: [[2950768]] (coupling 0.13, 7 shared references).","abstract":"A minimal realisation of warm inflation, even within the Standard Model, assumes that the inflaton $φ$ couples via the effective operator $φ\\, G\\tilde G$. We show that the SM solutions are in tension with the plasma calculation (as each sphaleron transition releases an energy much larger than the temperature) and with the assumed effective operator description. Embedding $φ$ as the Goldstone boson of a renormalizable Peccei-Quinn theory requires an anomaly coefficient $\\gtrsim100$, implying a Landau pole for QCD. These tensions are relaxed for more strongly coupled dark gauge sectors."},{"arxiv":"2606.28247","id":"3174157","title":"Cancellation of one-loop time dependence in superhorizon curvature perturbations from all scales","authors":"Keisuke Inomata","score":8.3,"section":"replacement","rank":24,"parts":[0.0,0.09,0.29,0.0,0.14],"note":"Closest of your papers: [[2787890]] (coupling 0.03, 5 shared references). Closest network paper: [[2665331]] (coupling 0.10, 8 shared references). Shared topics: one-loop level.","abstract":"We show the conservation of the superhorizon curvature perturbations at one-loop level in spatially-flat gauge, including contributions from loop wavenumbers on all scales in the decoupling limit, $ε(\\equiv -\\dot H/H^2) \\to 0$. In contrast to previous works, we do not assume a hierarchy $k \\gg q$ between the wavenumber of the loop integral, $k$, and that of the power spectrum, $q$, and we explicitly include the regime $k \\lesssim q$. Taking into account the nonlinear relation between the inflaton fluctuation and the curvature perturbation with the $δN$ formalism, we show that the apparent time dependence of the one-loop curvature power spectrum cancels once all contributions, including boundary terms, are combined consistently."},{"arxiv":"2606.05962","id":"3165425","title":"Probing TeV-scale Majorana neutrinos at a muon-proton collider via a lepton-number-violating fat-jet signature","authors":"Yao-Bei Liu","score":8.1,"section":"replacement","rank":25,"parts":[0.0,0.14,0.26,0.0,0.02],"note":"Closest of your papers: [[3184726]] (coupling 0.05, 6 shared references). Closest network paper: [[2617409]] (coupling 0.09, 17 shared references).","abstract":"We investigate the sensitivity to TeV-scale heavy Majorana neutrinos at a future muon-proton collider with $\\sqrt{s}=5.3$~TeV, based on 1~TeV muon and 7~TeV proton beams. We focus on the lepton-number-violating (LNV) process $μ^- p \\to jN$, followed by $N\\toμ^+W^-\\toμ^+J$, leading to the characteristic final state $jμ^+J$. Here, $j$ denotes the associated light jet from heavy-neutrino production, while $J$ denotes the fat jet originating from the hadronic decay of the highly boosted $W$ boson. This topology provides a clean experimental signature with strongly suppressed Standard Model backgrounds. A comprehensive signal and background analysis is performed using parton showering, fast detector simulation, and dedicated fat-jet reconstruction. We derive the projected $2σ$ exclusion limits on the muon-flavor mixing parameter $|V_{μN}|^2$ for integrated luminosities of $100$~fb$^{-1}$ and $1$~ab$^{-1}$. For heavy-neutrino masses in the range $1~\\mathrm{TeV}\\leq m_N\\leq3~\\mathrm{TeV}$, the projected upper limits on $|V_{μN}|^2$ range from $2.6\\times10^{-6}$ to $5.9\\times10^{-5}$ at $1$~ab$^{-1}$. These results show that a future $μp$ collider can provide competitive and complementary sensitivity to TeV-scale heavy Majorana neutrinos compared with other proposed high-energy facilities."},{"arxiv":"2611.09150","id":"3225691","title":"Chiral Response of QCD Topology across the Thermal Crossover","authors":"Heng-Tong Ding, Jin-Biao Gu, José Javier Hernández Hernández, Sheng-Tai Li, Jia Ni","score":7.3,"section":"cross","rank":26,"parts":[0.0,0.11,0.27,0.0,0.0],"note":"Closest of your papers: [[1941263]] (coupling 0.04, 5 shared references). Closest network paper: [[1963344]] (coupling 0.09, 10 shared references).","abstract":"We introduce a novel relation connecting the light-quark-mass derivative of the topological susceptibility in quantum chromodynamics (QCD) to the connected correlation between the squared topological charge and the integrated light-quark scalar density. This relation gives direct access to the chiral response of QCD topology---the local logarithmic light-quark-mass derivative of the susceptibility---from a single ensemble at fixed quark masses for each temperature, without additional simulations at shifted masses. Applying this relation to $(2+1)$-flavor lattice QCD at $m_π\\simeq220\\,\\mathrm{MeV}$ over temperatures ranging from well below to well above the chiral crossover, we find that the response rises rapidly through the crossover from approximately unity toward two. This evolution corresponds to a change from nearly linear to nearly quadratic dependence of the topological susceptibility on the light-quark mass. Using the chiral response as the exponent of a local power law in the light-quark mass, we determine its effective amplitude from the topological susceptibility. This amplitude exhibits a maximum near the crossover temperature, reflecting the competition between the decreasing topological susceptibility and the increasing chiral response. These results reveal a thermal reorganization of the quark-mass dependence of QCD topology beyond the suppression of topological fluctuations alone."},{"arxiv":"2611.03373","id":"3222389","title":"Towards AI-Agent-Accelerated Research in High-Energy Physics: A Case Study in Monte Carlo Analysis","authors":"Tianqi Gao, Ruobing Jiang, Dawei Fu, Andrew Michael Levin, Qiang Li, Matthew Kenzie","score":7.2,"section":"replacement","rank":27,"parts":[0.0,0.15,0.17,0.0,0.0],"note":"Closest of your papers: [[1455793]] (coupling 0.06, 4 shared references). Closest network paper: [[1674879]] (coupling 0.06, 3 shared references).","abstract":"We investigate how far contemporary LLM-based agents can participate in multistep computational high-energy-physics research under reproducible human supervision. Using a previously published CEPC Bell-observable analysis in $e^+e^- \\to ZH$, $Z \\to q\\bar q$, $H \\to ZZ^* \\to 4μ$ as a case study, we test two capabilities. First, the agent performs an instruction-constrained reproduction: it is explicitly instructed not to use the published numerical results as analysis targets, although no technical information-access barrier is imposed. The analysis definition is fixed before the formal comparison, and the resulting detector-level $I_3$ central values reproduce the four published benchmark points to within about 2% without retuning to those values. Second, the agent is used for an open-ended extension with no target answer supplied. Using 200,000 fast-simulated events, a stage-resolved audit identifies muon isolation as the largest single contribution to the hard-to-detector shift, and subsequent diagnostics connect the effect to angle-dependent isolation efficiency, proximity to the hard $Z \\to q\\bar q$ system, and mixed electromagnetic activity from muon final-state radiation and hadron decays. Throughout, the agent assists with workflow planning, code and configuration inspection, Monte Carlo production, anomaly diagnosis, control construction, statistical analysis, and result organization, while state-changing actions and final interpretation remain under human control. The study shows that the value of AI agents in HEP may lie not only in faster code generation, but in faster scientific iteration, and motivates systematic benchmarking across historical HEP analyses using correctness, human intervention, and researcher-time efficiency as explicit metrics."},{"arxiv":"2611.09788","id":"3226297","title":"Possible Solution to the Gallium Anomaly? Nuclear Transition Densities","authors":"D. Castillo, D. Frycz, J. Menéndez","score":6.1,"section":"cross","rank":28,"parts":[0.06,0.03,0.22,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1597138]] (coupling 0.01, 1 shared references). Closest network paper: [[3214448]] (coupling 0.08, 9 shared references).","abstract":"The gallium anomaly, a 20% deficit in the measured $ν_e$ captures on $^{71}$Ga, remains unexplained. A recent work [Phys. Rev. Lett. 137, 131805 (2026), arXiv:2512.20560] has proposed a solution based on the breakdown of the factorization of lepton and nuclear wavefunctions that underlies the prediction of the cross section, combined with ad hoc Gamow-Teller nuclear transition densities. We test this proposed solution with transition densities calculated within the nuclear shell model (NSM), normalized to the $^{71}$Ge electron-capture half-life and convolved with Dirac-Hartree-Fock-Slater electron wavefunctions. We explore several NSM interactions, bare and effective Gamow-Teller operators, as well as the impact of the valence space. In all cases, we obtain remarkably consistent NSM transition densities. Our factorized and nonfactorized cross sections agree, remaining 20% higher than the measured value. In addition, we use NSM single-nucleon transition densities as ansatz and find that solving the anomaly requires fine-tuned densities, with percent-level cancellations and an overall scale orders of magnitude larger than the calculated NSM ones. We conclude that the gallium anomaly is not solved when using realistic nuclear transition densities."},{"arxiv":"2611.09243","id":"3225727","title":"Roles of $f_0(980)$ and $a_0(980)$ in the process $Λ_c^+ \\to pK_S^0K_S^0$: a clean probe of the $K\\bar K$ final-state interaction","authors":"Li-Na Zhou, Le-Le Wei, Li-Juan Liu, En Wang","score":5.9,"section":"new","rank":29,"parts":[0.06,0.02,0.23,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[3184726]] (coupling 0.01, 1 shared references). Closest network paper: [[3091093]] (coupling 0.08, 5 shared references).","abstract":"Based on the Belle measurement of $Λ_c^+ \\to pK_S^0K_S^0$, we study the contributions of the light scalar mesons $f_0(980)$ and $a_0(980)$, dynamically generated from the $S$-wave pseudoscalar meson--pseudoscalar meson interaction within the chiral unitary approach, to the threshold enhancement in the $K_S^0K_S^0$ invariant mass squared distribution, and examine the possible contribution of the intermediate $Σ(1620)$ resonance in the $pK_S^0$ subsystem. We first argue that the $Λ_c^+ \\to pK_S^0K_S^0$ channel is a cleaner probe of the $K\\bar K$ final-state interaction than the charged channel $Λ_c^+ \\to pK^+K^-$, since the $φ$ and $Λ^*$ contributions are forbidden and the $Σ(1620)$ and $Σ(1660)$ couple weakly to the $\\bar{K}N$ channel. The threshold enhancement in the $K_S^0K_S^0$ invariant mass squared distribution is well described by the $S$-wave $K^0\\bar K^0$ final-state interaction alone, with the $f_0(980)$ contribution dominating while that of $a_0(980)$ is small, supporting the interpretation of $f_0(980)$ as a $K\\bar K$ hadronic molecular state. Future high-precision measurements by Belle~II and the proposed Super Tau-Charm Facility will help test the roles of the $f_0(980)$ and $a_0(980)$ and of the possible $Σ(1620)$ contribution in this process."},{"arxiv":"2611.08585","id":"3225648","title":"Primordial or Post-Inflationary: Distinguishing the Origin of Scale-Dependent Features in the CMB","authors":"Matteo Braglia, Wenzer Qin, Xingang Chen, Tracy R. Slatyer","score":4.9,"section":"cross","rank":30,"parts":[0.0,0.04,0.25,0.0,0.0],"note":"Closest of your papers: [[2964960]] (coupling 0.01, 3 shared references). Closest network paper: [[3117426]] (coupling 0.09, 15 shared references).","abstract":"Physics beyond the Standard Model, whether of primordial or post-inflationary origin, can leave scale-dependent signals in the anisotropies of the Cosmic Microwave Background (CMB). In this work, we study how distinguishable these broad classes of signals are and quantify their level of degeneracy. In this initial investigation, for primordial features, we limit ourselves to those of the ``sharp'' and ``resonant'' kinds; for post-inflationary features, we consider two qualitatively distinct models: exotic energy injection, which deposits energy into the primordial plasma and modifies the global thermodynamic history, and early dark energy (EDE), which affects the CMB through the background expansion and gravitational perturbations. By studying representative examples, we find that while primordial features can leave oscillatory signatures in the CMB power spectrum with essentially arbitrary frequency and running, the post-inflationary models considered here produce qualitatively different patterns that cannot generically reproduce the characteristic running of primordial feature oscillations. We verify these findings first with a principal component analysis, and show using only the most significant principal components that there are no significant degeneracies between the primordial and post-inflationary features considered here, and secondly with a full likelihood analysis, which shows that the resulting posteriors do not change significantly when considering individual classes of models or combinations of primordial/post-inflationary features. While the two post-inflationary models probe distinct physical mechanisms and both are implemented in a simplified, phenomenological fashion, the methods used in this work can be generalized to include more realistic signals or other classes of signals."},{"arxiv":"2607.08817","id":"3179592","title":"Renormalon subtracted nonrelativistic QCD for heavy hadron systems","authors":"Benoît Assi, Andreas S. Kronfeld, Simon Vaiva, Michael L. Wagman","score":4.9,"section":"replacement","rank":31,"parts":[0.06,0.01,0.17,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[3184726]] (coupling 0.00, 1 shared references). Closest network paper: [[3209823]] (coupling 0.06, 7 shared references).","abstract":"We present a renormalon-subtracted formulation of potential nonrelativistic QCD (pNRQCD) for precision spectroscopy of heavy hadron systems, combining variational and Green's function Monte Carlo (VMC/GFMC) methods with static two- and three-body potentials through NNLO in $α_s$ (leading order in $1/m_Q$). Minimal renormalon subtraction (MRS) systematically sums leading factorially growing terms, thereby stabilizing perturbative convergence and reducing renormalization-scale dependence. We tune charm and bottom quark masses to spin-averaged $1S$ quarkonium states and predict $Ω_{ccc}$, $Ω_{ccb}$, $Ω_{cbb}$, and $Ω_{bbb}$ baryon masses, as well as QCD-stable baryons containing top quarks. NNLO MRS results undershoot lattice QCD by 125-175 MeV, a difference we attribute to contributions beyond the static perturbative potentials, including $1/m_Q$ corrections. Applying these methods to unequal-mass fully-heavy tetraquarks, we determine the critical heavy-to-light mass ratio for binding and compute binding energies across the mass-ratio landscape."},{"arxiv":"2511.17500","id":"3085491","title":"How Significant are Cosmological Collider Signals in the Planck Data?","authors":"Petar Suman, Dong-Gang Wang, Wuhyun Sohn, James R. Fergusson, E. P. S. Shellard","score":4.2,"section":"replacement","rank":32,"parts":[0.0,0.03,0.21,0.0,0.0],"note":"Closest of your papers: [[2627241]] (coupling 0.01, 1 shared references). Closest network paper: [[2737356]] (coupling 0.07, 8 shared references).","abstract":"The search for primordial non-Gaussianities (PNG) is theoretically well motivated but remains observationally challenging. Tight constraints with low significance for the standard non-Gaussian shapes suggest that detection may lie beyond the reach of near-future experiments. However, tests of PNG are highly template-dependent. From a theory perspective, a whole new family of bispectrum shapes arise in the cosmological collider program, with distinct signatures of heavy particles during inflation. In this work, we provide a class of simplified collider templates for these particles that encompasses a broader range of masses, sound speeds, and interactions. We propose that, given the current state of observations, the most effective strategy to search for PNG signals is through orthogonalizing the collider templates, such that they are uncorrelated with the tightly constrained single field predictions. Our results show that removing the single-field contribution enhances the signal across all four templates studied. Using the {\\it Modal} pipeline and \\textit{Planck} CMB data, we perform a systematic parameter scan of the (\\textit{orthogonalized}) collider templates with the most significant result reaching $2.4σ$ for spin-0, after taking into account the look-elsewhere effect; indicative results for spin-1 and spin-2 peak around 2$σ$. These results indicate that, with refined collider templates and improved data analysis strategies, there are credible prospects with forthcoming observations to detect PNG {\\it and also} identify the presence of massive particles during inflation."},{"arxiv":"2505.09931","id":"2921492","title":"Observation of quantum entanglement in $Λ\\barΛ$ pair production via electron-positron annihilation","authors":"Junle Pei, Xiqing Hao, Xiaochuan Wang, Tianjun Li","score":4.0,"section":"replacement","rank":33,"parts":[0.06,0.04,0.05,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2787890]] (coupling 0.01, 1 shared references). Closest network paper: [[3179956]] (coupling 0.02, 2 shared references).","abstract":"Quantum entanglement, a profound feature of quantum mechanics where particles share interconnected states regardless of distance, has been extensively studied in low-energy systems like photons and atoms. Exploring entanglement in high-energy particle collisions offers unique opportunities to probe quantum phenomena under extreme conditions. Here we demonstrate the observation of quantum entanglement between lambda and anti-lambda hyperons ($Λ\\barΛ$) produced in electron-positron collisions via the decay of the $J/ψ$ particle. By analyzing the angular correlations of the protons and antiprotons emerging from the subsequent weak decays of the hyperons, we identify clear signatures of entanglement that violate the limits derived for product states. This result confirms that entanglement persists through both the strong interaction production process and the weak decay processes. We further establish a general polar-azimuthal selection rule showing that azimuthal correlations are indispensable for entanglement certification in spin-$1/2$ fermion-antifermion systems. It is also confirmed that a significant majority of these decay events occur at spacelike separation, meaning that no classical signal could connect them. The successful detection of entanglement in this hyperon-antihyperon system establishes a new methodology and platform for measuring quantum properties in relativistic particle physics, complementing traditional approaches and opening avenues for future investigations into decoherence or symmetry violations in high-energy collisions."},{"arxiv":"2605.29479","id":"3223232","title":"Charmonium production at energies available at the CERN Super Proton Synchrotron and Facility for Antiproton and Ion Research","authors":"Taesoo Song, Jiaxing Zhao, Joerg Aichelin, Elena Bratkovskaya","score":3.9,"section":"replacement","rank":34,"parts":[0.06,0.02,0.07,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[860906]] (coupling 0.01, 1 shared references). Closest network paper: [[3209798]] (coupling 0.03, 2 shared references).","abstract":"In this study we apply the Remler formalism to charmonium production at SPS and GSI/FAIR energies in order to investigate the effects of baryon-rich matter on charmonium production and dissociation in heavy-ion collisions within the Parton-Hadron-String Dynamics (PHSD). As a first step the Remler formalism is tested in p+p collisions and then applied to p+A collisions in order to extract the nuclear absorption cross section of charmonium, which is then utilized in heavy-ion collisions. We find that the Remler formalism successfully describes charmonium production in heavy-ion collisions at SPS energies when an in-medium heavy quark potential is implemented, in which $J/ψ$ dissociates near $T_c$. Finally the same formalism is applied to the low CERN/SPS energy and GSI/FAIR energies, where we estimate charmonium production."},{"arxiv":"2509.00672","id":"2965725","title":"Higgs Signal Strength Estimation with Machine Learning under Systematic Uncertainties","authors":"Minxuan He, Claudius Krause, Daohan Wang","score":3.7,"section":"replacement","rank":35,"parts":[0.0,0.04,0.17,0.0,0.0],"note":"Closest of your papers: [[2751074]] (coupling 0.01, 2 shared references). Closest network paper: [[3187354]] (coupling 0.06, 6 shared references).","abstract":"We present a dedicated graph neural network (GNN)-based methodology for the extraction of the Higgs boson signal strength $μ$, incorporating systematic uncertainties. The architecture features two branches: a deterministic GNN that processes kinematic variables unaffected by nuisance parameters, and an uncertainty-aware GNN that handles inputs modulated by systematic effects through gated attention-based message passing. Their outputs are fused to produce classification scores for signal-background discrimination. During training we sample nuisance-parameter configurations and aggregate the loss across them, promoting stability of the classifier under systematic shifts and effectively decorrelating its outputs from nuisance variations. The resulting binned classifier outputs are used to construct a Poisson likelihood, which enables profile likelihood scans over signal strength, with nuisance parameters profiled out via numerical optimization. We validate this framework on the FAIR Universe Higgs Uncertainty Challenge dataset, yielding accurate estimation of signal strength $μ$ and its 68.27\\% confidence interval, achieving competitive coverage and interval widths in large-scale pseudo-experiments. Our code \"Systematics-Aware Graph Estimator\" (SAGE) is publicly available."},{"arxiv":"2611.05872","id":"3222990","title":"Investigations on the low-lying triply charmed pentaquark states in a constituent quark model","authors":"Yue-Mei Yin, Chun-Sheng An, Cheng-Rong Deng","score":3.6,"section":"replacement","rank":36,"parts":[0.06,0.01,0.08,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[3184726]] (coupling 0.00, 1 shared references). Closest network paper: [[3193100]] (coupling 0.03, 32 shared references).","abstract":"In present work, mass spectrum of the low-lying $cccq\\bar{q}$ pentaquarks states with $q\\bar{q}=u\\bar{u}$, $d\\bar{d}$ and $s\\bar{s}$, are investigated employing a constituent quark model, within which the spin-dependent hyperfine interactions are taken to be the instanton-induced interaction and the one-gluon-exchange interaction, respectively. The model parameters are fixed by fitting the mass spectrum of the relative $q\\bar{q}$ and $qqq$ traditional hadrons. The numerical results show that energies for all the obtained states in the two employed models are higher than corresponding meson-baryon channels, consequently, we roughly estimate strong decays of these states using a simple quark rearrangement model, the corresponding partial width ratios for different decay channels are presented."},{"arxiv":"2611.08875","id":"3225675","title":"Twist-3 and flavor-singlet contributions to $γγ\\toπ^{0}η^{(\\prime)}$ and $η^{(\\prime)}η^{(\\prime)}$ in $k_{T}$ factorization","authors":"Cong Wang, Jun-Kang He","score":3.3,"section":"new","rank":37,"parts":[0.06,0.01,0.06,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[3184726]] (coupling 0.00, 1 shared references). Closest network paper: [[3152706]] (coupling 0.02, 2 shared references).","abstract":"We study two-photon production of the pseudoscalar pairs $π^{0}η$, $π^{0}η^{\\prime}$, $ηη$, $ηη^{\\prime}$, and $η^{\\prime}η^{\\prime}$ at center-of-mass energies $2<Q<4\\,\\mathrm{GeV}$ in $k_{T}$ factorization, including the chirally enhanced twist-3 amplitudes and the two-gluon component of the $η^{(\\prime)}$. The twist-3 amplitudes raise the hard cross sections by about an order of magnitude in all five channels. They bring $ηη$ close to the Belle data, while $π^{0}η$ stays 3 to 5 times below and falls too slowly with energy. Varying the two-gluon distribution amplitude within its uncertainty changes the cross sections by about 2% in $π^{0}η$ and $ηη$ but by up to 24% in the $η^{\\prime}$ channels, making them its probe. The hard and handbag mechanisms each give nearly constant ratios $σ(π^{0}η)/σ(π^{0}π^{0})$ and $σ(ηη)/σ(π^{0}π^{0})$, whereas below $3.2\\,\\mathrm{GeV}$ the measured $π^{0}η$ ratio lies above both predictions and the $ηη$ ratio below them. Adding the handbag amplitude coherently, with its modulus fixed by the pion and kaon channels and its phase fitted, reproduces the $π^{0}η$ ratio up to $4\\,\\mathrm{GeV}$ and the $ηη$ ratio below $2.8\\,\\mathrm{GeV}$, and steepens $σ(π^{0}η)$ to a $Q^{-n}$ dependence with $n=9.7\\pm1.6$, against the measured $10.5\\pm1.2\\pm0.5$. The energy dependence of the cross section ratios can thus be understood as the interference of two mechanisms of comparable size."},{"arxiv":"2610.41078","id":"3221063","title":"Pure annihilation decay $B_c^+ \\to ST$ with improved perturbative QCD formalism","authors":"Sheng-Yu Wang, Xin Liu, Zhen-Jun Xiao","score":3.3,"section":"replacement","rank":38,"parts":[0.06,0.01,0.06,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[3184726]] (coupling 0.00, 1 shared references). Closest network paper: [[3193100]] (coupling 0.02, 21 shared references).","abstract":"We study the pure annihilation decay $B_c^+ \\to ST$ for the first time in the standard model with $S$ and $T$ representing the states of the light scalar ($1^3\\!P_0$) and tensor ($1^3\\!P_2$) correspondingly. Utilizing the assignment $q\\bar q$ for light scalars with two-scenarios classification, we calculate the branching ratios of $B_c^+ \\to ST$ with the improved perturbative QCD (iPQCD) formalism at leading order in the strong coupling $α_s$. The large branching ratios around $10^{-6}$ within uncertainties in the Cabibbo-Kobayashi-Maskawa-favored channels, such as $B_c^+ \\to a_0(1450) a_2(1320)$, $B_c^+ \\to a_0(980, 1450)^+ f_2(1270)$, $B_c^+ \\to K_0^*(700, 1430) K_2^*(1430)$, and $B_c^+ \\to f_0(500, 1370, 1500) a_2(1320)^+$, are obtained in the iPQCD formalism, which would be tested at the Large Hadron Collider-beauty detector in the (near) future. The relevant tests to these theoretical predictions of large branching ratios associated with typical relative ratios could provide important opportunities for understanding the QCD dynamics of the involved modes or light scalars, as well as for exploring the reliability of the iPQCD formalism. Moreover, the direct charge-parity violating asymmetries in the decay $B_c^+ \\to ST$ are naturally zero, since only tree-diagram contributions are involved."},{"arxiv":"2605.13983","id":"3155401","title":"Rapid and robust simulation-based inference for kilonovae","authors":"Stephanie M. Brown, Mattia Bulla, Hiranya V. Peiris, Nikhil Sarin, Daniel Mortlock, Stephen Thorp, Gurjeet Jagwani, Stephan Rosswog, Samaya Nissanke","score":3.3,"section":"replacement","rank":39,"parts":[0.0,0.03,0.09,0.0,0.1],"note":"Closest of your papers: [[1869725]] (coupling 0.01, 1 shared references). Closest network paper: [[2753529]] (coupling 0.03, 3 shared references). Shared topics: gravitational wave.","abstract":"With the next generation of both electromagnetic and gravitational wave observatories beginning to come online, rapid analysis methods for kilonova data are becoming increasingly important in astronomy. Traditional Bayesian parameter estimation using Markov chain Monte Carlo (MCMC) is time-consuming and relies on explicit likelihood approximations that can break down when modeling uncertainties are significant. We develop a simulation-based inference (SBI) framework for kilonova parameter estimation using density-estimation likelihood-free inference. The framework uses a Gaussian process emulator trained on $\\sim 1300$ POSSIS simulations. We demonstrate that SBI provides a rapid alternative to MCMC that is robust to likelihood misspecification. The standard Gaussian likelihood approximation fails to capture the non-Gaussian, correlated structure of emulator uncertainty; SBI learns this structure directly from forward simulations. Simulation studies show that the SBI method accurately recovers injected parameters, while the MCMC suffers from systematic bias caused by likelihood misspecification. This problem persists when analyzing AT2017gfo, where a subset of the MCMC posteriors pile up at prior boundaries and the SBI posteriors do not. The SBI framework infers a total ejecta mass of $\\sim 0.087 M_{\\odot}$ dominated by lanthanide-poor ejecta and excludes toroidal and peanut ejecta geometries at the 99th percentile for both components. The SBI framework generates $\\sim 2 \\times 10^{4}$ posterior samples in seconds."},{"arxiv":"2611.09363","id":"3225718","title":"Nucleon-resonance contributions to the $p\\bar{p}\\toη_cη$ reaction","authors":"Wen-Ying Liu, Xiang Liu","score":3.1,"section":"new","rank":40,"parts":[0.06,0.02,0.03,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[3184726]] (coupling 0.01, 1 shared references). Closest network paper: [[2972436]] (coupling 0.01, 2 shared references).","abstract":"Within an effective Lagrangian approach, we investigate the associated charmonium production reaction $p\\bar{p}\\toη_cη$ from threshold up to $\\sqrt{s}=5.00\\,\\mathrm{GeV}$, incorporating intermediate contributions from the ground-state nucleon and the nucleon resonances $N(1535)$, $N(1650)$, $N(1895)$, and $N(1710)$. The effective resonance parameters are constrained by the BESIII measurement of the crossed decay $η_c\\to p\\bar{p}η$ for both the constructive (Solution C) and destructive (Solution D) radiative-interference solutions. Using these decay-constrained parameters, we predict the total and differential Born cross sections for the $p\\bar{p}\\toη_cη$ reaction. We show that coherent resonance exchanges dominate the near-threshold production dynamics and significantly enhance the total cross section compared to the pure nucleon-exchange contribution, which suffers from a strong dynamical cancellation. As the collision energy increases, the rapidly growing nucleon contribution progressively dilutes the resonance terms, reducing the relative difference between the total cross sections for Solutions C and D. Furthermore, while the pure nucleon-exchange amplitude exhibits an exact dynamical zero at $θ=90^\\circ$ due to the pseudoscalar coupling structure, resonance exchanges fill this node in the predicted angular distributions, providing an observable test of the underlying exchange mechanisms. These predictions can be tested in future antiproton annihilation experiments at $\\bar{\\mathrm{P}}\\mathrm{ANDA}$."},{"arxiv":"2611.05463","id":"3222932","title":"Top Spin and CP from Equivariant Transformers","authors":"Henning Bahl, Marco Menen, Antoine Petitjean, Tilman Plehn","score":3.0,"section":"replacement","rank":41,"parts":[0.0,0.05,0.1,0.0,0.0],"note":"Closest of your papers: [[14   svg.append('g').attr('class','grid').selectAll('line').data(ticks).join('line').attr('x1',d=>x(d)).attr('x2',d=>x(d)).attr('y1',m.t).attr('y2',H-m.b);
  svg.append('g').attr('class','axis').attr('transform',`translate(0,${H-m.b})`).call(d3.axisBottom(x).tickValues(ticks).tickFormat(d3.format('d')).tickSizeOuter(0));
  const cy=(m.t+H-m.b)/2, xf=n=>isNew(n)?x(yrs[1]+.75):x(n.year);
  const sim=N.map(n=>({n,x:xf(n)+(RNG()-.5)*4,y:cy+(RNG()-.5)*H*.5}));
  const links=E.map(e=>({source:sim[e.s],target:sim[e.t],s:e.s,t:e.t,k:e.k}));
  d3.forceSimulation(sim).force('x',d3.forceX(s=>xf(s.n)).strength(1)).force('y',d3.forceY(cy).strength(.04))
    .force('link',d3.forceLink(links).strength(.03)).force('charge',d3.forceManyBody().strength(-40))
    .force('col',d3.forceCollide(s=>r(s.n)+2)).stop().tick(320);
  sim.forEach(s=>{s.y=Math.max(m.t+8,Math.min(H-m.b-8,s.y));s.x=Math.max(m.l+4,Math.min(W-m.r-4,s.x))});
  G=svg.append('g');
  G.append('g').selectAll('path').data(links).join('path').attr('class',l=>'edge '+l.k)
    .attr('d',l=>{const a=l.source,b=l.target;return `M${a.x},${a.y}Q${(a.x+b.x)/2},${(a.y+b.y)/2-Math.abs(a.x-b.x)*.12} ${b.x},${b.y}`});
  G.append('g').selectAll('circle').data([...sim].sort((a,b)=>RANK[b.n.role]-RANK[a.n.role])).join('circle')
    .attr('class','node').attr('cx',s=>s.x).attr('cy',s=>s.y).attr('r',s=>r(s.n)).attr('fill',s=>col(s.n))
    .on('pointerenter',(ev,s)=>{hover=s.n;showTip(ev,s.n);paint()}).on('pointermove',(ev,s)=>showTip(ev,s.n))
    .on('pointerleave',()=>{hover=null;tip.hidden=true;paint()}).on('click',(ev,s)=>pick(s.n,false));
  const lab=sim.filter(s=>isNew(s.n)||s.n.role==='seed'||s.n.deg>=3);
  const L=lab.map(s=>{const right=s.x>W*.8,t=isNew(s.n)?`#${s.n.rank} ${s.n.first}`:`${s.n.first} ${s.n.year}`,w=t.length*6.2;return{s,t,right,x0:right?s.x-r(s.n)-4-w:s.x+r(s.n)+4,w,y:s.y+4}}).sort((a,b)=>a.y-b.y);
  const placed=[];L.forEach(l=>{let k=0;while(k<40&&placed.some(p=>l.x0<p.x0+p.w&&p.x0<l.x0+l.w&&Math.abs(l.y-p.y)<13)){l.y+=13*(k%2?-1:1)*(1+Math.floor(k/2));k++;l.y=Math.max(m.t+10,Math.min(H-m.b-4,l.y))}placed.push(l)});
  G.append('g').selectAll('text').data(L).join('text').attr('class','nlabel').attr('x',l=>l.right?l.s.x-r(l.s.n)-4:l.s.x+r(l.s.n)+4).attr('y',l=>l.y)
    .attr('text-anchor',l=>l.right?'end':'start').text(l=>l.t);
  paint();
}
function showTip(ev,n){const b=document.getElementById('chart').getBoundingClientRect();tip.hidden=false;tip.textContent=`${auth(n)} (${n.year}) — ${plain(n.title)}`+(isNew(n)?` · score ${n.score}`:'');
  let L=ev.clientX-b.left+12;if(L>b.width-290)L=ev.clientX-b.left-290;tip.style.left=Math.max(4,L)+'px';tip.style.top=(ev.clientY-b.top+12)+'px'}
function paint(){if(!G)return;const f=hover||sel,on=new Set();if(f){on.add(f.i);f.out.forEach(i=>on.add(i));f.inn.forEach(i=>on.add(i))}
  svg.classed('dim',!!f);
  G.selectAll('path.edge').attr('class',l=>'edge '+l.k+(!f?'':l.s===f.i?' hot out':l.t===f.i?' hot in':''));G.selectAll('path.edge.hot').raise();
  G.selectAll('circle').classed('on',s=>on.has(s.n.i)).classed('sel',s=>sel&&s.n.i===sel.i).classed('match',s=>query&&`${s.n.first} ${s.n.title} ${s.n.arxiv} ${s.n.authors||''}`.toLowerCase().includes(query));
  G.selectAll('text.nlabel').classed('on',l=>on.has(l.s.n.i))}
function panel(){const p=document.getElementById('panel'),n=sel;
  if(!n){p.innerHTML='<p>Select a paper in the network.</p>';return}
  const links=`<div class="links">${n.id?`<a href="https://inspirehep.net/literature/${n.id}" target="_blank" rel="noopener">INSPIRE</a>`:''}${n.arxiv?`<a href="https://arxiv.org/abs/${esc(n.arxiv)}" target="_blank" rel="noopener">arXiv</a>`:''}</div>`;
  if(isNew(n)) p.innerHTML=`<div class="role" style="color:${col(n)}">#${n.rank} · ${esc(SEC[n.section])} · score ${n.score.toFixed(1)}</div><h4>${esc(n.title)}</h4>
   <div class="meta">${esc(auth(n))} · arXiv:${esc(n.arxiv)}</div><p>${why(n.note)}</p><div class="links"><a href="#p${n.i}">Back to abstract</a></div>`;
  else p.innerHTML=`<div class="role" style="color:${col(n)}">${esc(ROLE[n.role])}</div><h4>${esc(n.title)}</h4>
   <div class="meta">${esc(auth(n))} · ${n.year}${n.arxiv?' · arXiv:'+esc(n.arxiv):''}</div>
   <div class="stats"><span>${n.cites.toLocaleString()} citations</span><span>${n.inn.filter(i=>isNew(N[i])).length} of the matches link here</span></div>${links}`;
  tex(p)}
function pick(n,scroll){sel=n;panel();paint();document.querySelectorAll('.paper').forEach(el=>el.classList.toggle('sel',el.id==='p'+n.i));if(scroll)document.getElementById('chart').scrollIntoView({behavior:'smooth',block:'nearest'})}
const present=new Set(N.map(n=>n.role));
document.getElementById('legend').innerHTML=['today','repl','seed','other'].filter(k=>present.has(k)).map(k=>`<span><i class="dot" style="background:var(--${k})"></i>${esc(ROLE[k])}</span>`).join('')+'<span style="color:var(--fg-3)">Listing papers: size ∝ score; others: size ∝ log(citations)</span>';
document.getElementById('q').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();paint()});
svg.on('click',ev=>{if(ev.target.tagName!=='circle'){sel=null;panel();paint()}});
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(draw,200)});
function nextList(){const X=RAW.next||[];if(!X.length)return;const box=document.getElementById('nextlist'),more=document.getElementById('more');
  more.hidden=false;more.querySelector('summary').firstChild.textContent=`The next ${X.length} papers by score `;
  const nmin=M.nextMin;
  document.getElementById('moresub').textContent=`below the threshold of ${M.threshold}${nmin!=null?`: every paper scoring ${nmin} or more, and at least ${M.nextCount} when available`:''}; not drawn in the network`;
  const cut=nmin!=null?X.findIndex(n=>n.score<nmin):-1;
  box.innerHTML=X.map((n,i)=>(i===cut?`<li class="divider">Below ${nmin}: weaker relation (most of these share no specific reference, coupling or topic with your work)</li>`:'')+`<li><div class="role" style="color:var(--${n.section==='replacement'?'repl':'today'})">#${n.rank} · ${esc(SEC[n.section])} · score ${n.score.toFixed(1)}</div>
    <div class="t">${esc(n.title)}</div><div class="authors">${authors(n.authors)} · arXiv:${esc(n.arxiv)}</div>
    ${n.note?`<p class="why">${why(n.note)}</p>`:''}
    <details class="abs"><summary>Abstract</summary><p class="abs">${esc(n.abstract)}</p></details>
    <div class="links">${n.id?`<a href="https://inspirehep.net/literature/${n.id}" target="_blank" rel="noopener">INSPIRE</a>`:''}<a href="https://arxiv.org/abs/${esc(n.arxiv)}" target="_blank" rel="noopener">arXiv</a><a href="https://arxiv.org/pdf/${esc(n.arxiv)}" target="_blank" rel="noopener">PDF</a></div></li>`).join('');
  more.addEventListener('toggle',()=>{if(more.open)tex(box)})}
const rtip=document.getElementById('reftip');let rcur=null;
function refShow(el){const r=REFS[el.dataset.ref];if(!r)return;rcur=el;rtip.textContent=`${auth(r)} (${r.year}) — ${plain(r.title)}`;rtip.hidden=false;
  const b=el.getBoundingClientRect(),t=rtip.getBoundingClientRect();let L=Math.min(Math.max(8,b.left),innerWidth-t.width-8),T=b.bottom+6;
  if(T+t.height>innerHeight-8)T=b.top-t.height-6;rtip.style.left=L+'px';rtip.style.top=T+'px'}
function refHide(){rtip.hidden=true;rcur=null}
document.addEventListener('pointerover',e=>{const el=e.target.closest('.ref');if(el&&e.pointerType==='mouse')refShow(el)});
document.addEventListener('pointerout',e=>{if(e.target.closest('.ref')&&e.pointerType==='mouse')refHide()});
document.addEventListener('click',e=>{const el=e.target.closest('.ref');if(el)refShow(el);else if(rcur)refHide()});
document.addEventListener('focusin',e=>{const el=e.target.closest('.ref');if(el)refShow(el)});
document.addEventListener('focusout',e=>{if(e.target.closest('.ref'))refHide()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')refHide()});
addEventListener('scroll',()=>{if(rcur)refHide()},{passive:true});
// the rest of the day's papers by score: only the title, linked to the arXiv record
function restList(){const X=RAW.rest||[];if(!X.length)return;const d=document.getElementById('rest'),box=document.getElementById('restlist');
  d.hidden=false;d.querySelector('summary').firstChild.textContent=`All other ${X.length} papers in this listing `;
  document.getElementById('restsub').textContent='by score, title only';
  box.innerHTML=X.map(n=>`<li><span class="sc">#${n.rank} · ${n.score.toFixed(1)}</span><a href="https://arxiv.org/abs/${esc(n.arxiv)}" target="_blank" rel="noopener">${esc(n.title)}</a></li>`).join('');
  d.addEventListener('toggle',()=>{if(d.open)tex(box)})}
list();nextList();restList();fold();draw();panel();
window.addEventListener('load',()=>{tex(document.getElementById('list'));tex(document.getElementById('panel'));fold();
  if(window.MathJax&&MathJax.startup&&MathJax.startup.promise)MathJax.startup.promise.then(()=>setTimeout(fold,300))});
addEventListener('resize',()=>{clearTimeout(window._ft);window._ft=setTimeout(fold,200)});
</script>
