<script>
const RAW = {"n":[{"id":"3222983","arxiv":"2611.05747","title":"The Cosmology of Hawking Axions","first":"Hussein","nauth":3,"year":2026,"cites":0,"role":"today","note":"Cites 3 network papers: [[2797745]], [[1837439]], [[2612899]]. Closest of your papers: [[1828504]] (coupling 0.14, 12 shared references). Closest network paper: [[2014592]] (coupling 0.29, 12 shared references). Shared topics: hawking evaporation, primordial black hole, big bang nucleosynthesis.","score":62.1,"rank":1,"section":"new","parts":[0.83,0.42,0.83,0.0,0.76],"abstract":"Since primordial black holes (PBH) are always non-relativistic, their cosmological energy fraction grows relative to that of radiation. Thus, for even a tiny initial PBH abundance, the universe generically enters an epoch of early matter domination, which ends when the PBH evaporate to restore the hot big bang. We consider the possibility that a PBH dominated era yields a population of boosted axion-like particles (ALPs) produced from Hawking evaporation. Eventually these ``Hawking axions\" become non-relativistic and decay to photons, which can affect various cosmological and astrophysical observables. Here we place new constraints on these particles through their impact on big bang nucleosynthesis, cosmic microwave background, large-scale structure, and X-ray observables. Furthermore, if Hawking axions remain relativistic through recombination, then depending on the progenitor PBH mass, they contribute $ΔN_{\\rm eff}\\simeq0.05$-$0.11$, which may be observable with future CMB probes.","authors":"Abdelaziz Hussein, Gordan Krnjaic, Sarunas Verner","nlinked":52,"nref":56,"src":"INSPIRE","html":true},{"id":"3222920","arxiv":"2611.05685","title":"Probing CP Violation in the Complex 2HDMS with a 95 GeV Scalar at Future $e^+e^-$ Colliders","first":"Lahiri","nauth":3,"year":2026,"cites":0,"role":"today","note":"Cites 5 network papers: [[2914121]], [[2874649]], [[2686887]], [[2712207]], [[2666538]]. Closest of your papers: [[3094526]] (coupling 0.03, 5 shared references). Closest network paper: [[2914121]] (coupling 0.45, 44 shared references).","score":50.8,"rank":2,"section":"new","parts":[0.95,0.08,1,0.0,0.0],"abstract":"In this study, we investigate the prospects for probing CP violation in the complex singlet extension of the two-Higgs-doublet model (2HDM) at future electron-positron colliders. In extended scalar sectors, cancellations among different contributions to electric dipole moments (EDMs) can relax the stringent constraints on CP-violating phases, potentially bringing them in the current reach of collider experiments. We consider a scenario in which both the 125 GeV Higgs boson and the additional scalar associated with the reported 95 GeV excess are CP-mixed states. We probe the CP-violating phase of the 95 GeV scalar through its production via Higgsstrahlung and subsequent decay into a tau-lepton pair, using a CP-sensitive forward-backward asymmetry in hadronic and semileptonic tau-decay channels. We estimate the sensitivity at future lepton colliders, namely the ILC, FCC-ee, and CEPC, and investigate the impact of the Standard Model Drell-Yan background. We find that the hadronic channel offers greater sensitivity than the semileptonic channel. We also compare our results with existing constraints and future projections for CP violation in the 125 GeV Higgs sector and briefly discuss the implications for electroweak baryogenesis. Our results highlight the potential of future lepton colliders to probe CP violation in extended scalar sectors while remaining consistent with current EDM constraints.","authors":"Jayita Lahiri, Cheng Li, Gudrid Moortgat-Pick","nlinked":88,"nref":90,"src":"INSPIRE","html":true},{"id":"3222926","arxiv":"2611.05475","title":"Complete set of bounded-from-below conditions for the $A_4$-symmetric three-Higgs-doublet model","first":"Lavoura","nauth":2,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[2793703]]. Closest of your papers: [[1249404]] (coupling 0.05, 3 shared references). Closest network paper: [[2658189]] (coupling 0.13, 9 shared references).","score":25.0,"rank":3,"section":"new","parts":[0.45,0.13,0.36,0.0,0.0],"abstract":"We derive bounded-from-below necessary conditions for the scalar potential of an $A_4$-invariant three-Higgs-doublet model. The field Ansätze that we have used were devised with the help of Claude. Testing our set of conditions on $10^6$ random potentials, that in parallel we minimize by brute force using the Mathematica package StableWein, we find that the set seems to be necessary and sufficient for boundedness-from-below.","authors":"Luís Lavoura, André Milagre","nlinked":36,"nref":37,"src":"INSPIRE","html":true},{"id":"3222948","arxiv":"2611.05501","title":"Indirect probes of heavy neutral leptons through the dipole portal at FCC-ee","first":"Vignaroli","nauth":1,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[2937257]]. Closest of your papers: [[3094526]] (coupling 0.01, 2 shared references). Closest network paper: [[3073459]] (coupling 0.14, 22 shared references).","score":22.5,"rank":4,"section":"new","parts":[0.45,0.03,0.39,0.0,0.0],"abstract":"We study indirect probes of the gauge-invariant dipole portal of Majorana heavy neutral leptons (HNLs) at FCC-ee. Virtual HNLs modify electroweak gauge-boson propagation and lepton couplings through loops with two dipole interactions. We calculate the resulting finite matching corrections and their effects on $Z$-pole observables. For real, flavour-aligned couplings, the local response is specified by four combinations of coupling shifts. Independent local ultraviolet interactions can reproduce all four, making the dipole interpretation dependent on assumptions about those interactions. With improved Standard Model predictions, FCC-ee can probe equal, same-sign hypercharge and weak dipole coefficients as small as $0.14\\,\\mathrm{TeV}^{-2}$ at an HNL mass of 1 TeV. This projection assumes dipole dominance, with independent ultraviolet coefficients set to zero at twice the HNL mass. We quantify how additional ultraviolet contributions can weaken or strengthen the sensitivity. At 1 TeV, the projected reach is competitive with HL-LHC same-sign dilepton searches for Majorana HNLs, while larger masses allow smaller dipole coefficients to be probed within the effective theory's domain of validity. Radiative Higgs decays offer a modest further improvement. The FeynRules, FeynArts and UFO models used in this analysis are publicly available at \\href{https://doi.org/10.5281/zenodo.23667622}{doi:10.5281/zenodo.23667622}.","authors":"Natascia Vignaroli","nlinked":78,"nref":78,"src":"INSPIRE","html":true},{"id":"3222915","arxiv":"2611.05464","title":"Flavour Chains at the TeV Edge","first":"Greljo","nauth":3,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[2051195]]. Closest of your papers: [[2690106]] (coupling 0.02, 2 shared references). Closest network paper: [[3214449]] (coupling 0.05, 7 shared references). Shared topics: vector-like fermion.","score":22.5,"rank":5,"section":"new","parts":[0.45,0.06,0.15,0.0,0.26],"abstract":"We study chains of vector-like fermions that generate the Yukawa hierarchies as products of small mixings, with the Higgs coupled at a single link. Minimal Flavour Protection allows these flavour messengers to live at the TeV scale, while Higgs naturalness offers a reason to place them there: in cosmological solutions based on Higgs criticality, their large multiplicity lowers the critical point of the Higgs potential to the TeV scale. Crucially, the same Higgs interactions induce tree-level shifts in the $Z$ and $W$ couplings of light fermions. Existing LEP and SLD measurements already bound $M_F/|y_F|\\gtrsim 3$ TeV, while a future Tera-$Z$ factory such as FCC-ee could probe up to $100$ TeV. It would test the parameter space most relevant to Higgs naturalness, reaching scenarios with Higgs-mass tuning at the level of $10^{-4}$ or worse in minimal realisations. Longer chains partially alleviate this tuning but do not eliminate it, making a Tera-$Z$ factory a decisive test of the framework.","authors":"Admir Greljo, Xavier Ponce Díaz, Lia Schöneweiß","nlinked":137,"nref":141,"src":"INSPIRE","html":true},{"id":"3223039","arxiv":"2611.06284","title":"A search for sterile neutrinos at ultrahigh energies at the Pierre Auger Observatory","first":"Collaboration","nauth":354,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[2642079]]. Closest of your papers: [[1294681]] (coupling 0.01, 1 shared references). Closest network paper: [[2838981]] (coupling 0.07, 5 shared references).","score":20.0,"rank":6,"section":"cross","parts":[0.45,0.04,0.2,0.0,0.0],"abstract":"We investigate the sensitivity of the Pierre Auger Observatory to sterile neutrinos with masses in the MeV-to-100 MeV range. To this end, we consider a minimal $3+1$ framework in which a single sterile state mixes mainly with the $ν_τ$ flavor through an active--sterile mixing angle $θ_N$ to produce a mass eigenstate $N_1$. At ultrahigh energies, $N_1$ neutrinos can traverse substantial chord lengths through the Earth and interact through their active component, producing $τ$ leptons that may emerge near the surface and decay in the atmosphere, thereby generating detectable air showers. We compute the corresponding exposures with a detailed Monte Carlo simulation of neutrino propagation, interactions, $τ$ energy losses and decay, and derive upper limits at $90\\%$ confidence level on an isotropic diffuse flux of $N_1$ neutrinos. For an $E^{-2}$ spectrum, we obtain $E^2Φ_N\\leq 2\\times10^{-9}\\sin^{-2}θ_N\\,\\mathrm{GeV\\,cm^{-2}\\,sr^{-1}\\,s^{-1}}$ over $0.3$--$200$ EeV for $\\sin^2θ_N\\lesssim10^{-1}$. We further consider $N_1$ neutrinos arising from the decay of a superheavy dark-matter particle. For a benchmark dark-matter mass of $10^{13}$ GeV, we derive constraints on the active--sterile mixing angle and dark-matter lifetime for sterile-neutrino masses of $10$ and $100$ MeV. These results illustrate the potential of the Observatory to probe long-lived weakly interacting particles.","authors":" The Pierre Auger Collaboration, A. Abdul Halim, P. Abreu, M. Aglietta, M. Ahmed, I. Allekotte, K. Almeida Cheminant, R. Aloisio, J. Alvarez-Muñiz, A. Ambrosone, J. Ammerman Yebra, L. Anchordoqui, B. Andrada, L. Andrade Dourado, L. Apollonio, C. Aramo, J. C. Arteaga Velázquez, P. Assis, G. Avila, E. Avocone, A. Bakalova, Y. Balibrea, A. Baluta, F. Barbato, A. Bartz Mocellin, O. Batalla Cruz, J. P. Behler, C. Berat, M. E. Bertaina, M. Bianciotto, P. L. Biermann, V. Binet, K. Bismark, T. Bister, J. Biteau, J. Blazek, J. Blümer, M. Boháčová, D. Boncioli, C. Bonifazi, P. Boril, N. Borodai, J. Brack, P. G. Brichetto Orquera, S. Buitink, A. Bwembya, T. R. Caba Pineda, K. S. Caballero-Mora, S. Cabana-Freire, L. Caccianiga, J. Caraça-Valente, R. Caruso, A. Castellina, F. Catalani, G. Cataldi, L. Cazon, M. Cerda, B. Čermáková, A. Cermenati, K. Cerny, J. A. Chinellato, J. Chudoba, L. Chytka, R. W. Clay, A. C. Cobos Cerutti, R. Colalillo, R. Conceição, G. Consolati, M. Conte, F. Convenga, D. Correia dos Santos, P. J. Costa, C. E. Covault, M. Cristinziani, C. S. Cruz Sanchez, S. Dasso, K. Daumiller, B. R. Dawson, R. M. de Almeida, E. -T. de Boone, B. de Errico, J. de Jesús, S. J. de Jong, J. R. T. de Mello Neto, I. De Mitri, D. de Oliveira Franco, F. de Palma, V. de Souza, E. De Vito, A. Del Popolo, O. Deligny, N. Denner, K. Denner Syrokvas, L. Deval, A. di Matteo, C. Dobrigkeit, J. C. D'Olivo, L. M. Domingues Mendes, T. Dominguez, Y. Dominguez Ballesteros, Q. Dorosti, R. C. dos Anjos, J. Ebr, F. Ellwanger, R. Engel, M. Erdmann, A. Etchegoyen, C. Evoli, H. Falcke, G. Farrar, A. C. Fauth, T. Fehler, F. Feldbusch, A. Fernandes, M. Fernández Alonso, B. Fick, J. M. Figueira, P. Filip, A. Filipčič, B. Flaggs, A. Franco, M. Freitas, T. Fujii, A. Fuster, C. Galea, C. Galelli, B. García, C. Gaudu  kinetic, direct-coupling and adjoint contributions nearly cancel, producing transient positive minima of the first Hubble slow-roll parameter, $ε_1$, without a comparable reduction in field velocity. The scalar spectra, normalized to the cosmic microwave background (CMB) pivot amplitude, develop localized peaks with amplitudes $0.033$--$0.098$. Under Gaussian statistics and the adopted radiation-era collapse prescription, the the primordial black hole (PBH) abundance peaks span masses from $4.52\\times10^{-13}$ to $34.05\\,M_\\odot$. The lightest-mass benchmark reaches $f_{\\rm PBH}\\simeq0.99$, allowing nearly all dark matter within the monochromatic approximation. The accompanying scalar-induced gravitational-wave spectra span peak frequencies from $6.78\\times10^{-10}$ to $5.92\\times10^{-3}\\,\\mathrm{Hz}$, with selected benchmarks lying within the projected sensitivities of future detectors.","authors":"Narges Rashidi","nlinked":56,"nref":56,"src":"INSPIRE","html":true},{"id":"3223100","arxiv":"2611.06750","title":"Inflationary attractors in metric-affine gravity","first":"Andrei","nauth":2,"year":2026,"cites":0,"role":"today","note":"Closest of your papers: [[2663002]] (coupling 0.05, 10 shared references). Closest network paper: [[3185270]] (coupling 0.15, 16 shared references).","score":10.2,"rank":8,"section":"cross","parts":[0.0,0.13,0.42,0.0,0.0],"abstract":"We study single-field slow-roll inflation in metric-affine gravity (MAG). We consider the most general action up to operators linear in curvature and quadratic in the distortion, without propagating torsion and non-metricity. We first impose projective invariance and promote every coefficient to a function of the scalar field. After integrating out the non-dynamical distortion, the net contribution is a correction $k(φ)$ to the scalar kinetic term. We then consider the class of $ξ$-attractors for which the non-minimal couplings and the scalar potential are fixed by a single function $f(φ)$. It is well-known that in the metric formulation the strong-coupling regime is universally the Starobinsky attractor. In the Palatini framework, instead, this attractor is lost and the predictions become model-dependent. Here, we show that the MAG framework restores universality: in the strong coupling limit with finite ratios of the distortion couplings to $ξ$ we have an $α$-attractor, $n_s=1-2/N_*$ and $r=12α/N_*^2$, with $α=1+ζ/(6ξ)$. The ratio $ζ/ξ$ encodes the distortion contribution. Starobinsky and Palatini inflation are recovered as specific limits. Through a numerical parameter scan we show that almost all the healthy points lie on one of the two attractors : either Nieh-Yan-like inflation (studied in a previous work and extended here) or the new MAG $α$-attractor found here. Finally, we explicitly drop projective invariance and analyse the general MAG theory. The same large-field asymptotic structure survives. We conclude that no extra inflationary phenomenology is reached by the non-projectively invariant operators: the $α$-attractor is a general prediction of MAG.","authors":"Ilaria Andrei, Christian Dioguardi","nlinked":101,"nref":106,"src":"INSPIRE","html":true},{"id":"1828504","arxiv":"2011.02510","title":"Gravitational dark matter production: primordial black holes and UV freeze-in","first":"Bernal","nauth":2,"year":2020,"cites":85,"role":"seed","note":"","score":null},{"id":"3179956","arxiv":"2607.09852","title":"Darkly Charged ALPs","first":"Arenaza","nauth":7,"year":2026,"cites":1,"role":"other","note":"","score":null},{"id":"2842114","arxiv":"2410.17544","title":"Gravitational waves from burdened primordial black holes dark matter","first":"Loc","nauth":1,"year":2024,"cites":29,"role":"other","note":"","score":null},{"id":"2767738","arxiv":"2403.07333","title":"Development of generic no-scale inflation","first":"Wu","nauth":4,"year":2024,"cites":1,"role":"other","note":"","score":null},{"id":"2914121","arxiv":"2504.14529","title":"Search for dark matter in ,"c"],[17,37,"c"],[4,9,"k"],[14,34,"c"],[17,28,"c"],[26,17,"c"],[5,13,"k"],[39,34,"c"],[2,16,"k"],[0,28,"c"],[20,44,"c"],[7,29,"k"],[35,28,"c"],[7,33,"k"],[0,34,"k"],[0,35,"k"],[17,45,"c"],[20,12,"c"],[6,38,"k"],[3,9,"k"],[17,34,"c"],[20,19,"c"],[0,8,"k"],[39,45,"c"],[12,44,"c"],[37,8,"c"],[39,18,"c"],[19,30,"c"],[21,13,"c"],[35,45,"c"],[10,38,"c"],[35,18,"c"],[26,8,"c"],[4,22,"c"],[6,24,"k"],[5,25,"k"],[7,27,"k"],[35,34,"c"],[35,37,"c"],[3,31,"c"],[45,8,"c"],[43,19,"c"],[4,36,"k"],[15,42,"c"],[0,39,"c"],[2,40,"k"],[35,8,"c"],[1,44,"c"]],"next":[{"arxiv":"2611.05504","id":"3222939","title":"Gravitational waves flooding the Universe after wall domination","authors":"Sabir Ramazanov, Zhen-Min Zeng","score":8.6,"section":"cross","rank":9,"parts":[0.0,0.11,0.26,0.0,0.13],"note":"Closest of your papers: [[2787890]] (coupling 0.04, 6 shared references). Closest network paper: [[2828434]] (coupling 0.09, 10 shared references). Shared topics: early universe.","abstract":"We discuss a possible early Universe scenario, where radiation era is interrupted by the epoch of domination of domain walls eventually annihilating into particles. During this period the Universe undergoes accelerated expansion, while the comoving correlation length of the domain wall network remains constant. The network serves as a source of tensor modes, which get frozen upon exiting the horizon similarly to the case of inflationary fluctuations. The modes re-enter the horizon during the subsequent stage of radiation domination and since then contribute to the gravitational wave background. The spectral shape of gravitational waves predicted in this scenario is markedly different compared to the case of domain walls remaining sub-dominant all the way till annihilation. These gravitational waves are strong enough to be observed with present-day and future facilities in a broad range of frequencies. In particular, their energy density is sufficient to produce a significant impact on the effective number of neutrino species, unless the duration of wall domination is suitably constrained."},{"arxiv":"2611.05444","id":"3222903","title":"Photon-Counting Readout via Electro-Optic Microwave-to-Optical Transduction for Axion Haloscopes","authors":"Jing Wu, Raphael Cervantes, Doga Murat Kurkcuoglu, Zheshen Zhang, Silvia Zorzetti","score":7.8,"section":"new","rank":10,"parts":[0.0,0.14,0.15,0.0,0.13],"note":"Closest of your papers: [[1941263]] (coupling 0.04, 7 shared references). Closest network paper: [[1758016]] (coupling 0.05, 5 shared references). Shared topics: dark matter.","abstract":"Axion dark matter searches require highly sensitive detection schemes with high scan rate to efficiently explore the parameter space. Building upon the conventional Sikivie haloscope, where axions convert into microwave photons inside a magnetic-field-immersed resonant cavity, we present a photon-counting scheme based on an electro-optic microwave-to-optical transducer. Through a comprehensive theoretical model under realistic experimental constraints, we find that the optimal operating regime employs an overcoupled microwave cavity, trading peak transduction efficiency for reduced transducer noise. Furthermore, combining parameters already demonstrated in existing devices, in a device with optimized extrinsic coupling rates, would yield a scan-rate enhancement of 5-10 relative to quantum-limited homodyne detection. Improvements in quality factors, coupling rates, and thermal management push this enhancement beyond 50. While our quantitative model is benchmarked at 9 GHz, the scheme adapts well to haloscopes across the 5-12 GHz range, where shrinking cavity volumes severely degrade the achievable scan rate. These results demonstrate the potential of electro-optical photon detection as a high-speed detection technique for axion dark matter searches."},{"arxiv":"2611.05474","id":"3222925","title":"Dynamics of self-gravitating halos with decaying dark matter","authors":"Anna Bencke, Marc Kamionkowski, Annika H. G. Peter, Juniper Morales","score":6.5,"section":"cross","rank":11,"parts":[0.0,0.07,0.1,0.0,0.3],"note":"Closest of your papers: [[2787890]] (coupling 0.02, 3 shared references). Closest network paper: [[3214429]] (coupling 0.03, 9 shared references). Shared topics: dark matter particle, dark matter.","abstract":"We study the evolution of self-gravitating spherical dark matter halos composed of dark matter particles that decay to a slightly less massive particle and a massless particle. The small kick velocity imparted to the daughter particle upon decay heats the halo. If the kick velocity is small compared with the characteristic velocity, the halo remains bound but puffs out. We also consider, for the first time, decaying halos with anisotropic initial conditions and find non-negligible effects on the resulting density profile. To simulate the halo evolution, we utilize the recently developed \\texttt{NSphere} code across a broad range of decay times and kick velocities. We train an emulator to provide a mapping between the decay parameters and the relaxed density profile. We discuss how the resulting halo-scale signatures complement existing cosmological constraints on decaying dark matter and can be tested by upcoming surveys."},{"arxiv":"2611.05465","id":"3222896","title":"Probing Heavier-Baryon Oscillations through Light-Baryon Mixing","authors":"Arnau Bas i Beneito, Svjetlana Fajfer, Alexey A. Petrov","score":6.4,"section":"new","rank":12,"parts":[0.0,0.07,0.29,0.0,0.0],"note":"Closest of your papers: [[1222142]] (coupling 0.03, 2 shared references). Closest network paper: [[2053590]] (coupling 0.10, 20 shared references).","abstract":"Motivated by the existing direct limits on $Ξ_b^0$ and $Ξ_c^0$ oscillations, we investigate how Standard Model weak interactions connect baryon-number-violating mixing in heavy neutral baryons to the much more strongly constrained neutron-antineutron and $Λ-\\barΛ$ mixing. We focus on $Ξ_b^0$, $Λ_b^0$, $Ξ_c^0$, and $Ω_c^0$ oscillations and derive indirect constraints on their mass-mixing parameters from existing limits on $n-\\bar n$ oscillations and on $Λ-\\barΛ$ mixing, the latter inferred from dinucleon-decay searches. The weak baryon-to-baryon transition amplitudes are estimated by saturating the relevant hadronic correlators with low-lying intermediate baryons. The required weak vertices are modelled using semileptonic form factors from lattice QCD, quark models, and QCD sum rules. Since these form factors must be continued outside their physical semileptonic domains and the resulting loop integrals depend on a UV cutoff, our results are order-of-magnitude estimates subject to sizeable hadronic uncertainties. For a benchmark cutoff of $10~{\\rm GeV}$, the indirect bounds on the $Ξ_b^0$ and $Ξ_c^0$ mixing parameters are roughly three and five orders of magnitude stronger than the direct LHCb and Belle limits, indicating that light-baryon $|ΔB|=2$ searches can probe heavy-baryon oscillations far beyond present direct sensitivities."},{"arxiv":"2611.06129","id":"3223037","title":"What Does Precision Spectroscopy Actually Constrain about X17 Couplings?","authors":"Raoul Serao, Antonio Capolupo","score":5.8,"section":"new","rank":13,"parts":[0.0,0.02,0.34,0.0,0.0],"note":"Closest of your papers: [[2690106]] (coupling 0.01, 1 shared references). Closest network paper: [[3115042]] (coupling 0.12, 9 shared references).","abstract":"Can precision spectroscopy disentangle the individual couplings of the X17 boson? Within a leading one-body model, we combine electronic and muonic spectroscopy of hydrogen, deuterium and helium with lepton magnetic moments. We show that hydrogen-deuterium comparisons can lose neutron sensitivity through cancellations, while the combined observables restore generic local identifiability without guaranteeing finite individual bounds. The unrestricted fit admits formally unbounded nucleon-coupling directions, some of which violate the assumptions underlying the physical model. Finite-coupling tests nevertheless reveal statistically compatible solutions, with bounds dependent on nuclear responses and physical assumptions. Our results establish what precision measurements genuinely constrain and what additional information is required to extract meaningful limits on X17 couplings."},{"arxiv":"2611.05500","id":"3222924","title":"SMEFT Constraints on Top Electroweak Couplings and a Composite Higgs Interpretation","authors":"Leandro Da Rold, Juan Fernandez","score":5.6,"section":"new","rank":14,"parts":[0.06,0.03,0.17,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[3094526]] (coupling 0.01, 4 shared references). Closest network paper: [[1455732]] (coupling 0.06, 2 shared references).","abstract":"Recent LHC measurements of $tWZ$, $t\\bar t Z$ and single top production provide complementary probes of top quark electroweak interactions. We incorporate these measurements into a global Standard Model effective field theory analysis of 46 independent dimension-six Wilson coefficients at linear order. The updated fit remains compatible with the Standard Model at $95\\%$ CL, and favors negative values of $C_{Hq}^{(-)}\\equiv C_{Hq}^{(1)}-C_{Hq}^{(3)}$ and $C_{Ht}$, with central values suggestive of TeV scale new physics. We also present an effective composite Higgs model based on a two-site description that realizes this pattern of Wilson coefficients through partial compositeness. The model includes custodial symmetry and protection of the $Z\\bar b_L b_L$ coupling. A fermion bitriplet generates the required left-handed shift, and an additional embedding of the right-handed top allows negative contributions to $C_{Ht}$ from both fermion and spin-one exchange. Scanning four right-handed top embeddings, we find parameter regions within the $68\\%$ CL contour that are compatible with electroweak precision data, Higgs coupling measurements and applicable direct searches. The $T$ parameter limits the negative fermionic contribution to $C_{Ht}$, favoring a spin-one contribution of comparable or greater magnitude. Larger $SU(2)_R$ representations extend the reach toward negative $C_{Ht}$, and also enhance four-quark interactions that increase the four-top cross section, in the direction favored by current measurements. The mechanism connects the preferred top electroweak shifts to complementary tests through single production of quarks with electric charge $-4/3$, modified Higgs couplings and four-top production."},{"arxiv":"2611.06769","id":"3223115","title":"Born spreading with consistent shower starting scales in MC@NLO and FxFx merging","authors":"Rikkert Frederix, Paolo Torrielli","score":5.0,"section":"new","rank":15,"parts":[0.0,0.04,0.25,0.0,0.0],"note":"Closest of your papers: [[3094526]] (coupling 0.01, 1 shared references). Closest network paper: [[3206672]] (coupling 0.09, 7 shared references).","abstract":"Negative weights are a major cost in NLO event generation matched to parton showers at the LHC, as they increase the number of events needed for a given statistical precision. Born spreading reduces the fraction of negative-weight $\\mathbb S$ events in MC@NLO by redistributing the Born contribution over the radiation variables. It introduces no bias only if everything that is passed to the parton shower together with $\\mathbb S$ events depends on Born-level quantities alone. We show that the same condition is needed for the MC counterterms to reproduce the first shower emission, independently of how the radiation phase space is integrated. In MadGraph5_aMC@NLO, the $\\mathbb S$-event starting scales did not fully satisfy this condition, which so far prevented the public release of Born spreading. We present a new and consistent construction of the starting scales for ordinary MC@NLO, FxFx merging and MC@NLO-$Δ$, with which Born spreading is now publicly available, including for merged samples. We also study modified formulations of the MC counterterms, and FxFx-merged $W$+jets production with up to two jets at NLO, for which Born spreading reduces the fraction of negative weights after merging without affecting the predictions, and the event samples are generated six times faster than with the former implementation."},{"arxiv":"2611.06755","id":"3223116","title":"Earthquake Forecast via Neutrino Tomography at the DUNE Baseline","authors":"Bipin Singh Koranga, Samrat Vashisht, Vivek Kumar Nautiyal","score":4.9,"section":"new","rank":16,"parts":[0.06,0.05,0.09,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[3184726]] (coupling 0.02, 2 shared references). Closest network paper: [[1796007]] (coupling 0.03, 3 shared references).","abstract":"We investigate the sensitivity of accelerator-based neutrino oscillations to localized electron-density enhancements associated with seismic fault zones along the Fermilab SURF baseline of the Deep Underground Neutrino Experiment (DUNE). Motivated by the reactor antineutrino proposal of Wang, Chen, and Li, we model the anomaly as a uniform-density slab embedded in the surrounding crust and calculate exact three flavour oscillation probabilities using layer by layer evolution. Our results show that localized density enhancements can produce measurable variations in muon-to-electron appearance probabilities for both neutrinos and antineutrinos, with potentially significant relative effects. The predicted variations exhibit weak dependence on the leptonic CP violating phase, suggesting that time-differential measurements may help reduce uncertainties associated with the unknown CP phase. However, the event statistics required for a statistically significant detection substantially exceed those expected during a short-duration precursor interval. Consequently, detecting sufficiently persistent density anomalies may be possible under favourable conditions, whereas short-term earthquake forecasting is not feasible with the nominal DUNE configuration. Our findings establish a theoretical framework for exploring localized Earth-density perturbations through long-baseline neutrino oscillations."},{"arxiv":"2611.05872","id":"3222990","title":"Investigations on the low-lying $cccq\\bar{q}$ resonances in a constituent quark model","authors":"Yue-Mei Yin, mao-jun Yan, Chun-Sheng An, Cheng-Rong Deng","score":3.6,"section":"new","rank":17,"parts":[0.06,0.01,0.08,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[3184726]] (coupling 0.00, 1 shared references). Closest network paper: [[2817040]] (coupling 0.03, 30 shared references).","abstract":"In present work, mass spectrum of the low-lying $cccq\\bar{q}$ pentaquarks states with $q\\bar{q}=u\\bar{u}$, $d\\bar{d}$ and $s\\bar{s}$, are investigated employing a constituent quark model, within which the spin-dependent hyperfine interactions are taken to be the instanton-induced interaction and the one-gluon-exchange interaction, respectively. The model parameters are fixed by fitting the mass spectrum of the relative $q\\bar{q}$ and $qqq$ traditional hadrons. The numerical results show that energies for all the obtained states in the two employed models are higher than corresponding meson-baryon channels, consequently, we roughly estimate strong decays of these states using a simple quark rearrangement model, the corresponding partial width ratios for different decay channels are presented."},{"arxiv":"2611.05469","id":"3222936","title":"Superconducting Qubits as Quantum Targets for Direct Particle Scattering","authors":"Doojin Kim, Kyoungchul Kong, Myeonghun Park","score":3.5,"section":"new","rank":18,"parts":[0.0,0.03,0.08,0.0,0.13],"note":"Closest of your papers: [[2794409]] (coupling 0.01, 1 shared references). Closest network paper: [[3217265]] (coupling 0.03, 3 shared references). Shared topics: dark matter.","abstract":"We introduce a novel approach to particle detection in which a superconducting qubit itself serves as the scattering target and a resolved transition between circuit eigenstates constitutes the observable final state. The scattering amplitude factorizes into the incident-particle current and a finite-momentum electromagnetic transition response of the qubit. This momentum dependence is essential in that the energy transfer is fixed by the microwave-scale level spacing, whereas a nonrelativistic incident particle can transfer a spatial momentum parametrically larger than that energy and thereby resolve the device geometry. For charge-dominated processes, we recast the response as an induced-offset-charge kernel obtained from an auxiliary electrostatic weighting potential, providing a practical route from circuit geometry to a differential scattering cross section. We illustrate the framework with an Xmon-style transmon and photon-mediated scattering of dark matter. The exceptionally small qubit transition threshold opens sensitivity to an eV-to-keV mass regime that is largely unexplored by existing direct-detection experiments."},{"arxiv":"2611.06799","id":"3223105","title":"Ground-State Heavy-Baryon Mass Spectrum in the Relativistic Independent Quark Model","authors":"Divyajyoti Pandey, Kalpalata Dash, Sanjay Kumar Swain","score":3.3,"section":"new","rank":19,"parts":[0.06,0.01,0.05,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[3184726]] (coupling 0.00, 1 shared references). Closest network paper: [[2932612]] (coupling 0.02, 4 shared references).","abstract":"We extend our work to compute the ground-state baryon mass spectrum containing charm and bottom quarks in the relativistic independent quark (RIQ) model with an average flavor--independent confining potential in equally mixed scalar--vector harmonic form. Each quark moves as a Dirac particle inside the potential. The resulting core mass is then corrected perturbatively, accounting for the pion self-energy, pion exchange, and pairwise color--electric and color--magnetic one-gluon exchange. Six input parameters common to every baryon: the potential parameters (confinement strength, the potential offset) and the $u(=d)$, $s$, $c$, and $b$ constituent quark masses are optimized using a few experimentally measured baryon states. The model then uses these optimized parameters to predict the mass spectra of doubly heavy, mixed-$bc$, and triply heavy baryons. We compare our predictions with lattice QCD, relativistic quark model results, and available experimental measurements. Our results are consistent with these model predictions and experimental results."},{"arxiv":"2611.06643","id":"3223096","title":"Quantum field theory treatment of the spin-flavor precession of Dirac neutrinos with diagonal magnetic moments","authors":"Maxim Dvornikov","score":3.3,"section":"new","rank":20,"parts":[0.0,0.0,0.08,0.0,0.21],"note":"Closest network paper: [[2937257]] (coupling 0.03, 1 shared references). Shared topics: neutrino mass.","abstract":"We apply the quantum field theory (QFT) approach to describe the spin-flavor precession of Dirac neutrinos. The magnetic moments matrix of these neutrinos is taken to be diagonal in the mass basis. Neutrino mass eigenstates are considered to be virtual particles in the QFT approach. The neutrino contribution to the matrix element of the overall process, which includes the emission, the propagation and the detection of neutrinos, is contained in the propagators of massive neutrinos. Using the recently derived propagator of a massive neutrino, which exactly accounts for the magnetic moment interaction, we derive the transition probability of the process $ν_{e\\mathrm{L}}\\toν_{μ\\mathrm{L}}$ under the influence of a magnetic field. The result is compared with the prediction of the standard quantum mechanical (QM) approach. We briefly discuss the possibility to derive the QFT corrections to the QM expressions."},{"arxiv":"2611.05463","id":"3222932","title":"Top Spin and CP from Equivariant Transformers","authors":"Henning Bahl, Marco Menen, Antoine Petitjean, Tilman Plehn","score":3.0,"section":"new","rank":21,"parts":[0.0,0.05,0.1,0.0,0.0],"note":"Closest of your papers: [[1455793]] (coupling 0.02, 3 shared references). Closest network paper: [[2621240]] (coupling 0.04, 5 shared references).","abstract":"Measurements of spin correlations and CP are an exciting and challenging part of the precision-LHC program. We first show how L-GATr-slim, as a Lorentz-equivariant transformer, significantly boosts the spin analyzing power for hadronic top quarks. We then show how adding a pseudoscalar channel to its architecture allows us to learn and interpret optimal observables and their CP properties. We demonstrate this for WBF-Higgs production at parton level and top pair production including detector effects."},{"arxiv":"2611.06399","id":"3223060","title":"Planting neutrino SE-EdS: A < 3% accurate clustering approximation for neutrinos and other hot dark matter","authors":"Amol Upadhye, Yvonne Y. Y. Wong","score":2.9,"section":"cross","rank":22,"parts":[0.0,0.02,0.06,0.0,0.13],"note":"Closest of your papers: [[3184726]] (coupling 0.01, 2 shared references). Closest network paper: [[3190962]] (coupling 0.02, 3 shared references). Shared topics: dark matter.","abstract":"The age of the cosmic neutrino is upon us. Aside from their fundamental importance to particle physics and the recent tensions in their mass scale $M_ν= \\sum m_ν$, neutrinos' degeneracies with other cosmological parameters in analyses of scale-dependent cosmic clustering will significantly affect the estimates of these parameters, making accurate, inexpensive, easily-implemented approximations essential tools for theoretical cosmology. We present a new linear approximation, SE-EdS, applicable to non-relativistic neutrinos and other hot dark matter, which is exact in the linear Einstein-de Sitter case, and < 3% accurate for a broad range of flat and non-flat cosmologies characterized by parameters $0.2 \\leq Ω_{m,0} \\leq 1$, $0 \\leq Ω_{ν,0} \\leq 0.018$, $-0.1 \\leq Ω_{K,0} \\leq 0.1$, and $w_0 \\leq -0.6$, at all length scales. This broad coverage in $Ω_{m,0}$ makes SE-EdS ideal for N-body simulations, whose redshift range $z \\lesssim 100$ demands accuracy for time-dependent $Ω_m$ between unity and the preferred late-time values $\\sim 0.3$. SE-EdS may be used to paint neutrinos into simulations in Fourier space, where its < 3% error and neutrinos' $\\leq$ 3% matter fraction guarantees < 0.1% errors in the total matter density contrast, thereby including neutrino effects upon clustering at negligible computational cost. We quantify the approximation's accuracy; extend it to a broad range of cosmologies; and explore its correspondence with higher-order corrections to existing linear response schemes. A simple implementation is available online at https://codeberg.org/upadhye/SE-EdS ."},{"arxiv":"2611.05440","id":"3222890","title":"Meson spectra in a screened relativized quark model","authors":"Zhe-Qi Huang, Lei Huang, Xiao-Lei Zhang, Xin-Lei Ge, Hao Chen, Cheng-Qun Pang","score":2.8,"section":"new","rank":23,"parts":[0.06,0.01,0.03,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[3184726]] (coupling 0.00, 1 shared references). Closest network paper: [[3214449]] (coupling 0.01, 1 shared references).","abstract":"In this work, we employed the modified Godfrey--Isgur model to systematically investigate the mass spectra of several light, heavy-light, and heavy-heavy meson systems. In this model, a screened potential is employed to phenomenologically account for modifications to the long-range confining interaction associated with unquenched effects. We performed a global refit of the relevant model parameters to a combined set of 90 adopted meson masses spanning all three sectors, ensuring a consistent parameter determination across the different meson systems. Using the resulting parameter set, we calculated the low-lying and highly excited spectra and the corresponding mixed states in different meson families, and compared our results with existing experimental data and other theoretical results. The assignment of several newly observed structures (such as $B_c^*$ and $D_{s1}(2933)$) have also been discussed based on their predicted masses. Overall, the model describes several main spectroscopic features across different flavors and provides mass predictions for highly excited states that have not yet been experimentally established."},{"arxiv":"2611.05453","id":"3222912","title":"The Search for the Top Quark","authors":"Paul D. Grannis","score":2.5,"section":"cross","rank":24,"parts":[0.0,0.0,0.16,0.0,0.0],"note":"Closest network paper: [[2778553]] (coupling 0.06, 5 shared references).","abstract":"The discovery of the top quark in 1995 completed the roster of the matter particles, quarks and leptons, expected in the Standard Model and in many of its suggested extensions. However, the top quark does not conform to the pattern set by its sister quarks and has come to be a critical component of the ongoing searches for physics beyond the prevailing paradigm. (Prepared for the Proceedings of the 4th International Symposium on the History of Particle Physics, CERN, Nov. 2025.)"},{"arxiv":"2610.42103","id":"","title":"Charge Pumping Leptogenesis from the Symmetric Mass Generation Phase on a Four-Leg Ladder Lattice","authors":"Runze Chi, Meng Zeng, Tao Xiang, Yi-Zhuang You, Bertrand I. Halperin, Juven Wang","score":2.0,"section":"cross","rank":25,"parts":[0.0,0.03,0.06,0.0,0.0],"note":"Closest of your papers: [[3184726]] (coupling 0.01, 2 shared references). Closest network paper: [[3213062]] (coupling 0.02, 3 shared references).","abstract":"Quantized charge pumping in quantum Hall systems is a bulk topological property, typically manifesting on gapless boundaries as spectral flow through chiral edge modes upon flux insertion. When the boundary is anomaly-free, it can be symmetrically gapped by symmetric mass generation (SMG) interactions. However, the effects on quantized charge pumping at an interacting gapped boundary are unclear. We address this using density-matrix renormalization group simulations of a four-leg ladder quasi-(2+1)d realization of the (1+1)d 3-4-5-0 lattice chiral fermion model with six-fermion interactions at one edge. We find gapless modes near the interacting edge for both weak and strong couplings, but the edge can be in a fully gapped SMG phase at intermediate coupling. We also identify spontaneous breaking of the model's $\\mathbb{Z}_2$ symmetry above a critical interaction strength. Across all three boundary phases, we find quantized charge pumping with the same pumped charge per flux quantum. The spatial distribution of the pumped charge varies between phases. Besides charge pumping, we study how a single injected fermion propagates under open boundary conditions. In the SMG phase, an interaction-induced flavor-mixing current develops at the endpoints of the gapped edge, which is absent in the weak- and strong-coupling limits. This current reveals a charge-redistribution mechanism unique to the SMG phase. Additionally, we propose an analogy between charge pumping in this model and a topological leptogenesis scenario in the (3+1)d Standard Model. The anomaly-free chiral U(1) symmetries of the 3-4-5-0 model play a role analogous to the baryon-minus-lepton symmetry of the Standard Model. In both settings, charge pumping can be associated with a continuous deformation along a classically defined but quantum-anomalous direction, while a discrete subgroup remains an exact quantum symmetry."},{"arxiv":"2611.06213","id":"3223023","title":"Probing Lorentz Symmetry Violation via Hadroproduction in Electroweak Pair Annihilation","authors":"S. Mohammad Moosavi Nejad, Vahid Ekraminasab","score":1.8,"section":"new","rank":26,"parts":[0.0,0.0,0.12,0.0,0.0],"note":"Closest network paper: [[3164308]] (coupling 0.04, 2 shared references).","abstract":"The violation of Lorentz symmetry is anticipated in some theories beyond the Standard Model so various processes have been studied to search for the effects of Lorentz symmetry violation (LSV). High energy collision experiments provide a suitable environment where Lorentz symmetry breaking can be examined. In this work, we study the effect of Lorentz-violating terms on the hadron production process from pair annihilation, including a vectorial nonminimal coupling between the fermions and gauge fields in the Electroweak sector. To be specific, we study the effect of CPT-odd nonminimal Lorentz symmetry violating couplings on the production of bottom flavored mesons through pair annihilation in the Electroweak theory, i.e., $e^+e^-\\to q\\bar{q}\\to B+Jets$. Considering the available data and the analytical result for the tree-level cross section $σ^{LO}(e^+e^-\\to B+Jets)$ in the presence of LSV terms, we determine an upper bound on the purely time-like background 4-vector as strict as $\\le 10^{-3} GeV^{-1}$, in agreement with previous works on similar Lorentz violating couplings."},{"arxiv":"2611.06503","id":"3223063","title":"A Duality Model in Which Dual QCD Becomes Hydrodynamics","authors":"Noriaki Aibara, So Katagiri, Yoshiki Matsuoka, Kazuya Mitsutani, Akio Sugamoto","score":1.7,"section":"new","rank":27,"parts":[0.0,0.0,0.11,0.0,0.0],"note":"Closest network paper: [[3147506]] (coupling 0.04, 2 shared references).","abstract":"Revisiting a duality model in which dual QCD becomes hydrodynamics, or the dual gluon is a fluid, allows us to understand some of the mysteries of QCD, such as the behavior of the quark--gluon plasma (QGP) as a perfect fluid and gluon saturation in the structure function at high energies. This old-fashioned duality converts the gluon action into hydrodynamics described by the 2-form stream function $W^a_{μν}$ with eight colors. All interactions then become current--current interactions of the Nambu--Jona-Lasinio type. The resulting theory admits a strong-coupling expansion about the fluid. This can provide a third method to supplement perturbative QCD and lattice QCD."},{"arxiv":"2611.05051","id":"3223019","title":"A Note On Lattice Definition of Gauge Theories With Chiral Fermions","authors":"Edward Witten","score":1.6,"section":"cross","rank":28,"parts":[0.0,0.03,0.05,0.0,0.0],"note":"Closest of your papers: [[2787890]] (coupling 0.01, 1 shared references). Closest network paper: [[3118148]] (coupling 0.02, 1 shared references).","abstract":"Because of the fermion doubling problem, it has been a longstanding challenge to describe a lattice algorithm for studying four-dimensional gauge theories coupled to chiral fermions. Recently, an algorithm to do so has been described by Craig, extending partial results in the previous literature. Here we describe a variant of this algorithm, based on interpolating a lattice gauge field over the continuum (as in Craig's work) and coupling the interpolated gauge field to continuum chiral fermions. The same variant was also proposed recently by Hsu. In any dimension and for any anomaly-free representation, this approach can be implemented on a computer in principle, but not in practice by Monte Carlo methods because the chiral fermion path integral is not positive."}],"refs":{"1222142":{"first":"Florez","year":2013,"nauth":4,"title":"Baryonic violation of $R$ parity from anomalous $U(1)_H$","role":"seed"},"1828504":{"first":"Bernal","year":2020,"nauth":2,"title":"Gravitational dark matter production: primordial black holes and UV freeze-in","role":"seed"},"2778553":{"first":"Ardu","year":2023,"nauth":1,"title":"Effective Field Theory for Lepton Flavour Violation","role":"other"},"2787890":{"first":"García-Cely","year":2024,"nauth":3,"title":"Dark matter in QCD-like theories with a theta vacuum: Cosmological and astrophysical implications","role":"seed"},"3213062":{"first":"Chung","year":2026,"nauth":1,"title" function panel(){const p=document.getElementById('panel'),n=sel;
  if(!n){p.innerHTML='<p>Select a paper in the network.</p>';return}
  const links=`<div class="links">${n.id?`<a href="https://inspirehep.net/literature/${n.id}" target="_blank" rel="noopener">INSPIRE</a>`:''}${n.arxiv?`<a href="https://arxiv.org/abs/${esc(n.arxiv)}" target="_blank" rel="noopener">arXiv</a>`:''}</div>`;
  if(isNew(n)) p.innerHTML=`<div class="role" style="color:${col(n)}">#${n.rank} · ${esc(SEC[n.section])} · score ${n.score.toFixed(1)}</div><h4>${esc(n.title)}</h4>
   <div class="meta">${esc(auth(n))} · arXiv:${esc(n.arxiv)}</div><p>${why(n.note)}</p><div class="links"><a href="#p${n.i}">Back to abstract</a></div>`;
  else p.innerHTML=`<div class="role" style="color:${col(n)}">${esc(ROLE[n.role])}</div><h4>${esc(n.title)}</h4>
   <div class="meta">${esc(auth(n))} · ${n.year}${n.arxiv?' · arXiv:'+esc(n.arxiv):''}</div>
   <div class="stats"><span>${n.cites.toLocaleString()} citations</span><span>${n.inn.filter(i=>isNew(N[i])).length} of the matches link here</span></div>${links}`;
  tex(p)}
function pick(n,scroll){sel=n;panel();paint();document.querySelectorAll('.paper').forEach(el=>el.classList.toggle('sel',el.id==='p'+n.i));if(scroll)document.getElementById('chart').scrollIntoView({behavior:'smooth',block:'nearest'})}
const present=new Set(N.map(n=>n.role));
document.getElementById('legend').innerHTML=['today','repl','seed','other'].filter(k=>present.has(k)).map(k=>`<span><i class="dot" style="background:var(--${k})"></i>${esc(ROLE[k])}</span>`).join('')+'<span style="color:var(--fg-3)">Listing papers: size ∝ score; others: size ∝ log(citations)</span>';
document.getElementById('q').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();paint()});
svg.on('click',ev=>{if(ev.target.tagName!=='circle'){sel=null;panel();paint()}});
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(draw,200)});
function nextList(){const X=RAW.next||[];if(!X.length)return;const box=document.getElementById('nextlist'),more=document.getElementById('more');
  more.hidden=false;more.querySelector('summary').firstChild.textContent=`The next ${X.length} papers by score `;
  document.getElementById('moresub').textContent=`below the threshold of ${M.threshold}, not drawn in the network`;
  box.innerHTML=X.map(n=>`<li><div class="role" style="color:var(--${n.section==='replacement'?'repl':'today'})">#${n.rank} · ${esc(SEC[n.section])} · score ${n.score.toFixed(1)}</div>
    <div class="t">${esc(n.title)}</div><div class="authors">${authors(n.authors)} · arXiv:${esc(n.arxiv)}</div>
    ${n.note?`<p class="why">${why(n.note)}</p>`:''}
    <details class="abs"><summary>Abstract</summary><p class="abs">${esc(n.abstract)}</p></details>
    <div class="links">${n.id?`<a href="https://inspirehep.net/literature/${n.id}" target="_blank" rel="noopener">INSPIRE</a>`:''}<a href="https://arxiv.org/abs/${esc(n.arxiv)}" target="_blank" rel="noopener">arXiv</a><a href="https://arxiv.org/pdf/${esc(n.arxiv)}" target="_blank" rel="noopener">PDF</a></div></li>`).join('');
  more.addEventListener('toggle',()=>{if(more.open)tex(box)})}
const rtip=document.getElementById('reftip');let rcur=null;
function refShow(el){const r=REFS[el.dataset.ref];if(!r)return;rcur=el;rtip.textContent=`${auth(r)} (${r.year}) — ${plain(r.title)}`;rtip.hidden=false;
  const b=el.getBoundingClientRect(),t=rtip.getBoundingClientRect();let L=Math.min(Math.max(8,b.left),innerWidth-t.width-8),T=b.bottom+6;
  if(T+t.height>innerHeight-8)T=b.top-t.height-6;rtip.style.left=L+'px';rtip.style.top=T+'px'}
function refHide(){rtip.hidden=true;rcur=null}
document.addEventListener('pointerover',e=>{const el=e.target.closest('.ref');if(el&&e.pointerType==='mouse')refShow(el)});
document.addEventListener('pointerout',e=>{if(e.target.closest('.ref')&&e.pointerType==='mouse')refHide()});
document.addEventListener('click',e=>{const el=e.target.closest('.ref');if(el)refShow(el);else if(rcur)refHide()});
document.addEventListener('focusin',e=>{const el=e.target.closest('.ref');if(el)refShow(el)});
document.addEventListener('focusout',e=>{if(e.target.closest('.ref'))refHide()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')refHide()});
addEventListener('scroll',()=>{if(rcur)refHide()},{passive:true});
list();nextList();fold();draw();panel();
window.addEventListener('load',()=>{tex(document.getElementById('list'));tex(document.getElementById('panel'));fold();
  if(window.MathJax&&MathJax.startup&&MathJax.startup.promise)MathJax.startup.promise.then(()=>setTimeout(fold,300))});
addEventListener('resize',()=>{clearTimeout(window._ft);window._ft=setTimeout(fold,200)});
</script>
