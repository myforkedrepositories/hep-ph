<script>
const RAW = {"n":[{"id":"3159193","arxiv":"2605.24473","title":"Freeze-in $SU(2)$ vector dark matter at low reheating temperature","first":"Ghosh","nauth":5,"year":2026,"cites":0,"role":"repl","note":"Cites your papers: [[3130296]]. Cites 8 network papers: [[3138530]], [[3118148]], [[2952952]], [[3033967]], [[2860397]], [[2784023]]…. Also cites widely used network papers: [[2817040]], [[1518747]]. Closest of your papers: [[2856850]] (coupling 0.10, 13 shared references). Closest network paper: [[3159193]] (coupling 1.00, 45 shared references). Shared topics: dm abundance, freeze-in mechanism, observed relic, viable parameter space, relic abundance.","score":68.7,"rank":1,"section":"replacement","parts":[1.0,0.3,1,0.0,0.96],"abstract":"The freeze-in mechanism for dark matter (DM) requires extremely feeble interactions with the Standard Model (SM), preventing thermal equilibrium in the early Universe and typically evading experimental detection. However, for sufficiently low reheating temperatures ($T_{\\rm RH}$), the observed relic abundance can be realized with larger couplings, opening prospects for experimental searches. In this work, we investigate freeze-in production of $SU(2)_{\\rm HS}$ vector dark matter (VDM) in a low-$T_{\\rm RH}$ cosmology. The framework naturally contains three mass-degenerate stable VDM candidates without the need for any additional discrete symmetry. We perform a systematic study of the dark matter phenomenology and identify the parameter space consistent with the observed relic abundance. We work with the approximation of instantaneous reheating and consider the DM abundance to be negligible at $T_{\\rm RH}$. In contrast to conventional freeze-in scenarios, the required DM couplings can be sizable, rendering part of the parameter space already constrained by existing direct searches like PandaX-4T and LZ, while a significant region remains within the reach of future experiments such as DARWIN. Though one can realize the freeze-in mechanism for an abelian $U(1)_X$ vector DM models as well, we find that the non-abelian structure of the $SU(2)_{\\rm HS}$ scenario leads to a distinct feature due to a larger number of dark matter particles, resulting in an enlarged viable parameter space due to the multiplicity of dark matter states.","authors":"Dilip Kumar Ghosh, Sourav Gope, Xiao-Gang He, Xuan Hong, Sk Jeesun","nlinked":45,"nref":45,"src":"INSPIRE","html":true},{"id":"3222983","arxiv":"2611.05747","title":"The Cosmology of Hawking Axions","first":"Hussein","nauth":3,"year":2026,"cites":0,"role":"today","note":"Cites 3 network papers: [[2797745]], [[1837439]], [[2612899]]. Closest of your papers: [[1828504]] (coupling 0.14, 12 shared references). Closest network paper: [[2014592]] (coupling 0.29, 12 shared references). Shared topics: hawking evaporation, primordial black hole, big bang nucleosynthesis.","score":62.7,"rank":2,"section":"new","parts":[0.83,0.43,0.84,0.0,0.8],"abstract":"Since primordial black holes (PBH) are always non-relativistic, their cosmological energy fraction grows relative to that of radiation. Thus, for even a tiny initial PBH abundance, the universe generically enters an epoch of early matter domination, which ends when the PBH evaporate to restore the hot big bang. We consider the possibility that a PBH dominated era yields a population of boosted axion-like particles (ALPs) produced from Hawking evaporation. Eventually these ``Hawking axions\" become non-relativistic and decay to photons, which can affect various cosmological and astrophysical observables. Here we place new constraints on these particles through their impact on big bang nucleosynthesis, cosmic microwave background, large-scale structure, and X-ray observables. Furthermore, if Hawking axions remain relativistic through recombination, then depending on the progenitor PBH mass, they contribute $ΔN_{\\rm eff}\\simeq0.05$-$0.11$, which may be observable with future CMB probes.","authors":"Abdelaziz Hussein, Gordan Krnjaic, Sarunas Verner","nlinked":52,"nref":56,"src":"INSPIRE","html":true},{"id":"3222920","arxiv":"2611.05685","title":"Probing CP Violation in the Complex 2HDMS with a 95 GeV Scalar at Future $e^+e^-$ Colliders","first":"Lahiri","nauth":3,"year":2026,"cites":0,"role":"today","note":"Cites 5 network papers: [[2914121]], [[2874649]], [[2686887]], [[2712207]], [[2666538]]. Closest of your papers: [[3094526]] (coupling 0.03, 5 shared references). Closest network paper: [[2914121]] (coupling 0.45, 44 shared references).","score":50.8,"rank":3,"section":"new","parts":[0.95,0.08,1,0.0,0.0],"abstract":"In this study, we investigate the prospects for probing CP violation in the complex singlet extension of the two-Higgs-doublet model (2HDM) at future electron-positron colliders. In extended scalar sectors, cancellations among different contributions to electric dipole moments (EDMs) can relax the stringent constraints on CP-violating phases, potentially bringing them in the current reach of collider experiments. We consider a scenario in which both the 125 GeV Higgs boson and the additional scalar associated with the reported 95 GeV excess are CP-mixed states. We probe the CP-violating phase of the 95 GeV scalar through its production via Higgsstrahlung and subsequent decay into a tau-lepton pair, using a CP-sensitive forward-backward asymmetry in hadronic and semileptonic tau-decay channels. We estimate the sensitivity at future lepton colliders, namely the ILC, FCC-ee, and CEPC, and investigate the impact of the Standard Model Drell-Yan background. We find that the hadronic channel offers greater sensitivity than the semileptonic channel. We also compare our results with existing constraints and future projections for CP violation in the 125 GeV Higgs sector and briefly discuss the implications for electroweak baryogenesis. Our results highlight the potential of future lepton colliders to probe CP violation in extended scalar sectors while remaining consistent with current EDM constraints.","authors":"Jayita Lahiri, Cheng Li, Gudrid Moortgat-Pick","nlinked":88,"nref":90,"src":"INSPIRE","html":true},{"id":"2974395","arxiv":"2509.23508","title":"Type I + II Seesaw Model in light of the New Neutrino Oscillation Measurements","first":"Aguilar","nauth":6,"year":2026,"cites":0,"role":"repl","note":"Cites 2 network papers: [[2732707]], [[2047160]]. Also cites widely used network papers: [[2817040]]. Closest of your papers: [[731108]] (coupling 0.06, 5 shared references). Closest network paper: [[3154758]] (coupling 0.25, 25 shared references). Shared topics: neutrino oscillation data, lepton flavor violation, neutrino mass, seesaw model.","score":47.1,"rank":4,"section":"replacement","parts":[0.72,0.16,0.72,0.0,0.64],"abstract":"Global analysis of neutrino oscillation data slightly favors normal mass ordering. In this work, we investigate an extended scalar sector that naturally gives rise to a type I + II seesaw mechanism after spontaneous symmetry breaking and explore the interplay between collider physics and lepton flavor violation, adopting normal ordering. In particular, we focus on the rare muon decays $μ\\rightarrow e γ$ and $μ\\rightarrow 3e$ and the same-sign dilepton searches at LHC, a canonical signature of a doubly charged scalar. We conclude that neither the precise value of the sum of the neutrino masses, taken from DESI data that favors $\\sum m_ν=0.07$~eV, nor alternative cosmological fits which prefer a more relaxed limit $\\sum m_ν=0.1$~eV, significantly changes the theoretical prediction for these rare decays. However, we observe an interesting interplay between collider physics and lepton flavor violation. In particular, we find that $μ\\rightarrow 3e$ is more constraining than $μ\\rightarrow eγ$. The $μ\\rightarrow 3e$ decay can yield a lower mass limit of $3$~TeV on the doubly charged scalar, surpassing current LHC constraints in a dominant type II seesaw or in a mixed type I+II scenario. Nevertheless, LFV does not strongly constrain the dominant type I seesaw scenario.","authors":"Maria Aguilar, Juan Carlos Helo, Toshihiko Ota, Farinaldo S. Queiroz, David Suarez, Amanda Rodríguez","nlinked":84,"nref":86,"src":"INSPIRE","html":true},{"id":"3202047","arxiv":"2609.10491","title":"Inelastic Dark Matter and High-Energy Recoil Signatures in LZ","first":"Fan","nauth":4,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[3201080]]. Closest of your papers: [[3146383]] (coupling 0.02, 3 shared references). Closest network paper: [[3202840]] (coupling 0.73, 48 shared references). Shared topics: two-component dark matter, dark matter scenario, nuclear recoil, dark matter, dark matter particle.","score":40.1,"rank":5,"section":"replacement","parts":[0.45,0.05,1,0.0,0.78],"abstract":"We study the inelastic dark matter (iDM) that consists of two-component dark matter particles $(χ_1,χ_2)$ and serves as a minimal extension beyond the commonly used one-component DM models. A distinctive feature of such iDM scattering with the target nuclei is to favorably produce signals at high nuclear recoil (NR) energy region in both exothermic and endothermic processes. In particular, for the exothermic dark matter scenario, the signal does not rely on the tail of the Boltzmann velocity distribution. As a result, the required DM-nucleus scattering cross section is significantly reduced, which in turn helps to substantially relax the stringent constraints imposed by IceCube neutrino searches. Using the inelastic DM-nucleus scattering, we naturally explain the newly reported event excess at high recoil energy with the LUX-ZEPLIN (LZ) experiment.","authors":"Zi-Tong Fan, Hong-Jian He, Yu-Chen Wang, Yue Zhao","nlinked":62,"nref":62,"src":"INSPIRE","html":true},{"id":"3172594","arxiv":"2606.25936","title":"Complementary probes of bilinear R-parity violating SUSY models with a winolike LSP via neutrino oscillations and at the LHC","first":"Choudhury","nauth":2,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[2755988]]. Closest of your papers: [[824906]] (coupling 0.03, 3 shared references). Closest network paper: [[2755988]] (coupling 0.34, 50 shared references). Shared topics: neutrino oscillation data, neutrino mass.","score":37.5,"rank":6,"section":"replacement","parts":[0.45,0.1,0.97,0.0,0.41],"abstract":"In this work, we explore the bilinear R-parity violating Supersymmetry model's parameter space by performing a Markov Chain Monte Carlo scan with neutrino oscillation data, Higgs mass and its coupling strengths, and flavor observables such as $B$-hadron decay branching ratios. From the allowed parameter space, we analyze the decay patterns of wino-like lighter charginos and lightest neutralinos and demonstrate how the branching ratios to different neutrino and charged lepton flavors depend on the neutrino mass hierarchy. Furthermore, we investigate the impact of current LHC bounds and projected future sensitivities from trilepton resonance searches on the allowed parameter space. We show that considering the branching ratio $\\mathrm{Br}(\\widetildeχ_1^{\\pm} \\to Zl^\\pm; l= e,μ,τ) \\sim$23\\%, obtained at the best-fit point, the wino-like mass degenerate $\\widetildeχ_1^{\\pm}/\\widetildeχ_1^0$ are excluded upto 565 GeV from LHC Run-II data. The projected exclusion reach with a similar branching ratio at High-Luminosity LHC (HL-LHC) is around 950 GeV. For a simplified scenario where $\\widetildeχ_1^{\\pm} / \\widetildeχ_1^0$ decays via a $Z$ boson with branching ratios of 1\\%, 50\\%, and 100\\%, wino masses can be excluded up to approximately $600~\\mathrm{GeV}$, $1185~\\mathrm{GeV}$, and $1350~\\mathrm{GeV}$ respectively. Our analysis shows that the HL-LHC can probe a significant portion of the 1$σ$ allowed parameter space by neutrino oscillation measurements and other experimental constraints.","authors":"Arghya Choudhury, Arpita Mondal","nlinked":121,"nref":129,"src":"INSPIRE","html":true},{"id":"3222915","arxiv":"2611.05464","title":"Flavour Chains at the TeV Edge","first":"Greljo","nauth":3,"year":2026,"cites":0,"role":"today","note":"Cites 2 network papers: [[3193100]], [[2051195]]. Closest of your papers: [[2690106]] (coupling 0.02, 2 shared references). Closest network paper: [[3214449]] (coupling 0.05, 7 shared references). Shared topics: vector-like fermion.","score":30.0,"rank":7,"section":"new","parts":[0.7,0.06,0.16,0.0,0.14],"abstract":"We study chains of vector-like fermions that generate the Yukawa hierarchies as products of small mixings, with the Higgs coupled at a single link. Minimal Flavour Protection allows these flavour messengers to live at the TeV scale, while Higgs naturalness offers a reason to place them there: in cosmological solutions based on Higgs criticality, their large multiplicity lowers the critical point of the Higgs potential to the TeV scale. Crucially, the same Higgs interactions induce tree-level shifts in the $Z$ and $W$ couplings of light fermions. Existing LEP and SLD measurements already bound $M_F/|y_F|\\gtrsim 3$ TeV, while a future Tera-$Z$ factory such as FCC-ee could probe up to $100$ TeV. It would test the parameter space most relevant to Higgs naturalness, reaching scenarios with Higgs-mass tuning at the level of $10^{-4}$ or worse in minimal realisations. Longer chains partially alleviate this tuning but do not eliminate it, making a Tera-$Z$ factory a decisive test of the framework.","authors":"Admir Greljo, Xavier Ponce Díaz, Lia Schöneweiß","nlinked":137,"nref":141,"src":"INSPIRE","html":true},{"id":"3222926","arxiv":"2611.05475","title":"Complete set of bounded-from-below conditions for the $A_4$-symmetric three-Higgs-doublet model","first":"Lavoura","nauth":2,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[2793703]]. Closest of your papers: [[1249404]] (coupling 0.05, 3 shared references). Closest network paper: [[2658189]] (coupling 0.13, 9 shared references).","score":25.0,"rank":8,"section":"new","parts":[0.45,0.13,0.36,0.0,0.0],"abstract":"We derive bounded-from-below necessary conditions for the scalar potential of an $A_4$-invariant three-Higgs-doublet model. The field Ansätze that we have used were devised with the help of Claude. Testing our set of conditions on $10^6$ random potentials, that in parallel we minimize by brute force using the Mathematica package StableWein, we find that the set seems to be necessary and sufficient for boundedness-from-below.","authors":"Luís Lavoura, André Milagre","nlinked":36,"nref":37,"src":"INSPIRE","html":true},{"id":"3154219","arxiv":"2605.09571","title":"Einstein-Cartan pseudoscalaron inflation, reheating and nonthermal leptogenesis","first":"Benedetto","nauth":4,"year":2026,"cites":0,"role":"repl","note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[3184726]] (coupling 0.10, 15 shared references). Closest network paper: [[3185270]] (coupling 0.22, 24 shared references). Shared topics: big bang nucleosynthesis.","score":22.8,"rank":9,"section":"replacement","parts":[0.06,0.27,0.62,0.0,0.32],"abstract":"We study the postinflationary dynamics of an Einstein-Cartan-Holst gravity-motivated inflationary scenario, known as Einstein-Cartan pseudoscalaron inflation, coupled to a type-I seesaw extension of the Standard Model with three heavy right-handed Majorana neutrinos. In particular, we show that nonthermal leptogenesis emerges as a necessary and self-consistent mechanism for generating the observed baryon asymmetry of the Universe, mainly because of the universal coupling of the inflaton to the additional heavy Majorana fermions. The resulting framework provides theoretical predictions that are fully compatible with the latest cosmological constraints from the Cosmic Microwave Background, Baryon Acoustic Oscillations, and Big Bang Nucleosynthesis, as well as with neutrino oscillation experiments, for a wide range of the fundamental Barbero-Immirzi model parameter $γ$, which controls the inflationary and postinflationary phases. In particular, for $γ\\sim -1/100$ and a lightest Majorana-neutrino mass $\\gtrsim 10^{13}$ GeV, we find a scalar spectral index $n_s \\sim 0.970$, a tensor-to-scalar ratio $r \\sim 0.004$, for a number of $e$-folds before the end of inflation $N_e \\lesssim 60$, and a baryon-to-entropy ratio $n_B/s \\sim 8.7 \\times 10^{-11}$","authors":"Carlo Di Benedetto, Alessandro Di Marco, Emanuele Orazi, Gianfranco Pradisi","nlinked":142,"nref":144,"src":"INSPIRE","html":true},{"id":"3222948","arxiv":"2611.05501","title":"Indirect probes of heavy neutral leptons through the dipole portal at FCC-ee","first":"Vignaroli","nauth":1,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[2937257]]. Closest of your papers: [[3094526]] (coupling 0.01, 2 shared references). Closest network paper: [[3073459]] (coupling 0.14, 22 shared references).","score":22.5,"rank":10,"section":"new","parts":[0.45,0.03,0.39,0.0,0.0],"abstract":"We study indirect probes of the gauge-invariant dipole portal of Majorana heavy neutral leptons (HNLs) at FCC-ee. Virtual HNLs modify electroweak gauge-boson propagation and lepton couplings through loops with two dipole interactions. We calculate the resulting finite matching corrections and their effects on $Z$-pole observables. For real, flavour-aligned couplings, the local response is specified by four combinations of coupling shifts. Independent local ultraviolet interactions can reproduce all four, making the dipole interpretation dependent on assumptions about those interactions. With improved Standard Model predictions, FCC-ee can probe equal, same-sign hypercharge and weak dipole coefficients as small as $0.14\\,\\mathrm{TeV}^{-2}$ at an HNL mass of 1 TeV. This projection assumes dipole dominance, with independent ultraviolet coefficients set to zero at twice the HNL mass. We quantify how additional ultraviolet contributions can weaken or strengthen the sensitivity. At 1 TeV, the projected reach is competitive with HL-LHC same-sign dilepton searches for Majorana HNLs, while larger masses allow smaller dipole coefficients to be probed within the effective theory's domain of validity. Radiative Higgs decays offer a modest further improvement. The FeynRules, FeynArts and UFO models used in this analysis are publicly available at \\href{https://doi.org/10.5281/zenodo.23667622}{doi:10.5281/zenodo.23667622}.","authors":"Natascia Vignaroli","nlinked":78,"nref":78,"src":"INSPIRE","html":true},{"id":"3223039","arxiv":"2611.06284","title":"A search for sterile neutrinos at ultrahigh energies at the Pierre Auger Observatory","first":"Collaboration","nauth":354,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[2642079]]. Closest of your papers: [[1294681]] (coupling 0.01, 1 shared references). Closest network paper: [[2838981]] (coupling 0.07, 5 shared references).","score":20.0,"rank":11,"section":"cross","parts":[0.45,0.04,0.2,0.0,0.0],"abstract":"We investigate the sensitivity of the Pierre Auger Observatory to sterile neutrinos with masses in the MeV-to-100 MeV range. To this end, we consider a minimal $3+1$ framework in which a single sterile state mixes mainly with the $ν_τ$ flavor through an active--sterile mixing angle $θ_N$ to produce a mass eigenstate $N_1$. At ultrahigh energies, $N_1$ neutrinos can traverse substantial chord lengths through the Earth and interact through their active component, producing $τ$ leptons that may emerge near the surface and decay in the atmosphere, thereby generating detectable air showers. We compute the corresponding exposures with a detailed Monte Carlo simulation of neutrino propagation, interactions, $τ$ energy losses and decay, and derive upper limits at $90\\%$ confidence level on an isotropic diffuse flux of $N_1$ neutrinos. For an $E^{-2}$ spectrum, we obtain $E^2Φ_N\\leq 2\\times10^{-9}\\sin^{-2}θ_N\\,\\mathrm{GeV\\,cm^{-2}\\,sr^{-1}\\,s^{-1}}$ over $0.3$--$200$ EeV for $\\sin^2θ_N\\lesssim10^{-1}$. We further consider $N_1$ neutrinos arising from the decay of a superheavy dark-matter particle. For a benchmark dark-matter mass of $10^{13}$ GeV, we derive constraints on the active--sterile mixing angle and dark-matter lifetime for sterile-neutrino masses of $10$ and $100$ MeV. These results illustrate the potential of the Observatory to probe long-lived weakly interacting particles.","authors":" The Pierre Auger Collaboration, A. Abdul Halim, P. Abreu, M. Aglietta, M. Ahmed, I. Allekotte, K. Almeida Cheminant, R. Aloisio, J. Alvarez-Muñiz, A. Ambrosone, J. Ammerman Yebra, L. Anchordoqui, B. Andrada, L. Andrade Dourado, L. Apollonio, C. Aramo, J. C. Arteaga Velázquez, P. Assis, G. Avila, E. Avocone, A. Bakalova, Y. Balibrea, A. Baluta, F. Barbato, A. Bartz Mocellin, O. Batalla Cruz, J. P. Behler, C. Berat, M. E. Bertaina, M. Bianciotto, P. L. Biermann, V. Binet, K. Bismark, T. Bister, J. Biteau, J. Blazek, J. Blümer, M. Boháčová, D. Boncioli, C. Bonifazi, P. Boril, N. Borodai, J. Brack, P. G. Brichetto Orquera, S. Buitink, A. Bwembya, T. R. Caba Pineda, K. S. Caballero-Mora, S. Cabana-Freire, L. Caccianiga, J. Caraça-Valente, R. Caruso, A. Castellina, F. Catalani, G. Cataldi, L. Cazon, M. Cerda, B. Čermáková, A. Cermenati, K. Cerny, J. A. Chinellato, J. Chudoba, L. Chytka, R. W. Clay, A. C. Cobos Cerutti, R. Colalillo, R. Conceição, G. Consolati, M. Conte, F. Convenga, D. Correia dos Santos, P. J. Costa, C. E. Covault, M. Cristinziani, C. S. Cruz Sanchez, S. Dasso, K. Daumiller, B. R. Dawson, R. M. de Almeida, E. -T. de Boone, B. de Errico, J. de Jesús, S. J. de Jong, J. R. T. de Mello Neto, I. De Mitri, D. de Oliveira Franco, F. de Palma, V. de Souza, E. De Vito, A. Del Popolo, O. Deligny, N. Denner, K. Denner Syrokvas, L. Deval, A. di Matteo, C. Dobrigkeit, J. C. D'Olivo, L. M. Domingues Mendes, T. Dominguez, Y. Dominguez Ballesteros, Q. Dorosti, R. C. dos Anjos, J. Ebr, F. Ellwanger, R. Engel, M. Erdmann, A. Etchegoyen, C. Evoli, H. Falcke, G. Farrar, A. C.  C. Rovero, A. Saftoiu, M. Saharan, F. Salamida, H. Salazar, G. Salina, P. Sampathkumar, N. San Martin, J. D. Sanabria Gomez, F. Sánchez, F. M. Sánchez Rodriguez, E. Santos, F. Sarazin, R. Sarmento, R. Sato, P. Savina, V. Scherini, H. Schieler, M. Schimp, D. Schmidt, O. Scholten, H. Schoorlemmer, P. Schovánek, F. G. Schröder, J. Schulte, T. Schulz, S. J. Sciutto, M. Scornavacche, A. Sedoski, S. Sehgal, S. U. Shivashankara, G. Sigl, K. Simkova, F. Simon, R. Šmída, S. Soares Sippert, P. Sommers, S. Stanič, J. Stasielak, P. Stassi, S. Strähnz, M. Straub, T. Suomijärvi, A. D. Supanitsky, Z. Svozilikova, Z. Szadkowski, F. Tairli, A. Tapia, C. Taricco, C. Timmermans, O. Tkachenko, P. Tobiska, C. J. Todero Peixoto, B. Tomé, A. Travaini, P. Travnicek, C. Trimarelli, M. Tueros, M. Unger, R. Uzeiroska-Geyik, L. Vaclavek, M. Vacula, I. Vaiman, J. F. Valdés Galicia, L. Valore, P. van Dillen, E. Varela, V. Vašíčková, D. Veberič, M. A. Vega Caro, I. D. Vergara Quispe, S. Verpoest, V. Verzi, J. Vicha, L. M. A. Victoria, S. Vorobiov, J. B. Vuta, A. A. Watson, A. Weindl, M. Weitz, L. Wiencke, H. Wilczyński, B. Wundheiler, B. Yue, A. Yushkov, E. Zas, D. Zavrtanik, M. Zavrtanik","nlinked":101,"nref":108,"src":"INSPIRE","html":true},{"id":"3168392","arxiv":"2606.14373","title":"Machine-learned particle flow as a foundation model for collider physics","first":"Mokhtar","nauth":4,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[3193100]]. Closest of your papers: [[1455793]] (coupling 0.01, 1 shared references). Closest network paper: [[2621240]] (coupling 0.06, 4 shared references).","score":19.2,"rank":12,"section":"replacement","parts":[0.45,0.03,0.16,0.0,0.0],"abstract":"The workflow from particle collision to physics analysis passes through a series of reconstruction steps that are traditionally modular and disconnected, with no shared representation linking low-level detector data to high-level analysis tasks. We show that casting event reconstruction as a machine learning problem naturally produces such a shared representation. We repurpose a machine learning model trained for particle-flow reconstruction (MLPF) to perform three distinct analysis tasks: jet flavor identification, jet energy regression, and missing momentum regression. By appending the per-particle latent representations learned during reconstruction as additional input features, we substantially improve over baselines that use conventional particle-level features alone. We further demonstrate that a single linear layer trained using only the latent representations achieves competitive performance against state-of-the-art baseline architectures, and outperforms the baseline for missing momentum regression with approximately 35 times fewer parameters. These results demonstrate that the latent representations learned during reconstruction encode essential physics information needed for downstream analysis, establishing MLPF as a foundation model and offering a concrete step toward an end-to-end pipeline from detector data to physics analysis.","authors":"Farouk Mokhtar, Joosep Pata, Michael Kagan, Javier Duarte","nlinked":38,"nref":49,"src":"INSPIRE","html":true},{"id":"3222890","arxiv":"2611.05440","title":"Meson spectra in a screened relativized quark model","first":"Huang","nauth":6,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Also cites widely used network papers: [[2817040]]. Closest of your papers: [[3184726]] (coupling 0.00, 1 shared references). Closest network paper: [[3214449]] (coupling 0.01, 1 shared references).","score":17.7,"rank":13,"section":"new","parts":[0.48,0.01,0.03,0.0,0.0],"abstract":"In this work, we employed the modified Godfrey--Isgur model to systematically investigate the mass spectra of several light, heavy-light, and heavy-heavy meson systems. In this model, a screened potential is employed to phenomenologically account for modifications to the long-range confining interaction associated with unquenched effects. We performed a global refit of the relevant model parameters to a combined set of 90 adopted meson masses spanning all three sectors, ensuring a consistent parameter determination across the different meson systems. Using the resulting parameter set, we calculated the low-lying and highly excited spectra and the corresponding mixed states in different meson families, and compared our results with existing experimental data and other theoretical results. The assignment of several newly observed structures (such as $B_c^*$ and $D_{s1}(2933)$) have also been discussed based on their predicted masses. Overall, the model describes several main spectroscopic features across different flavors and provides mass predictions for highly excited states that have not yet been experimentally established.","authors":"Zhe-Qi Huang, Lei Huang, Xiao-Lei Zhang, Xin-Lei Ge, Hao Chen, Cheng-Qun Pang","nlinked":108,"nref":110,"src":"INSPIRE","html":true},{"id":"3222201","arxiv":"2611.01533","title":"Resolving the Two-Fold Ambiguity in Tau Momentum Reconstruction via a Self-Consistent Weighting Method","first":"Ping","nauth":1,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[3193100]]. Closest network paper: [[3214449]] (coupling 0.04, 1 shared references).","score":17.5,"rank":14,"section":"replacement","parts":[0.45,0.0,0.11,0.0,0.0],"abstract":"The reconstruction of $τ$ lepton momenta in $e^{+}e^{-} \\to τ^{+}τ^{-}$ processes suffers from a two-fold kinematic ambiguity due to undetected neutrinos. We show that the common practice of retaining both solutions with equal weight systematically biases the extracted angular coefficients: the bias grows with the size of the $\\cos^{2}θ$ modulation of the production distribution $f(\\cosθ)$, but remains resolvable even in the nearly uniform QED limit at the $ψ(2S)$ threshold. We propose a self-consistent weighting method based on a fixed-point theorem: assigning normalized weights $w_{i} = f(\\cosθ_{i})/[f(\\cosθ_{1})+f(\\cosθ_{2})]$ yields a weighted distribution $h(x) = f(x)[1+\\varepsilon(x)]$ with $\\varepsilon(x) \\ll 1$ under a detailed balance condition. Monte Carlo simulations at $\\sqrt{s}=3.686$~GeV and $4.8$~GeV show that the fixed-point iteration converges to the true angular coefficient $α$ within statistical uncertainty, providing a robust framework for angular analysis without event-by-event ambiguity resolution.","authors":"Rong-Gang Ping","nlinked":9,"nref":9,"src":"INSPIRE","html":true},{"id":"3223029","arxiv":"2611.06329","title":"Primordial Black Holes and Induced Gravitational Waves from Inflation with History-Dependent Effective Dissipation","first":"Rashidi","nauth":1,"year":2026,"cites":0,"role":"today","note":"Closest of your papers: [[2663002]] (coupling 0.05, 7 shared references). Closest network paper: [[2767738]] (coupling 0.19, 20 shared references). Shared topics: primordial black hole, dark matter, gravitational wave.","score":17.1,"rank":15,"section":"cross","parts":[0.0,0.14,0.53,0.0,0.49],"abstract":"We study inflation with an exponential factor multiplying the scalar Lagrangian and depending on the accumulated expansion history through a field-dependent coupling. Variation of the complete action on a finite interval yields an adjoint response with a final-time boundary condition. We derive the background and coupled scalar perturbation equations and examine five benchmarks for an exponential plateau potential and a smooth single-window coupling. The kinetic, direct-coupling and adjoint contributions nearly cancel, producing transient positive minima of the first Hubble slow-roll parameter, $ε_1$, without a comparable reduction in field velocity. The scalar spectra, normalized to the cosmic microwave background (CMB) pivot amplitude, develop localized peaks with amplitudes $0.033$--$0.098$. Under Gaussian statistics and the adopted radiation-era collapse prescription, the the primordial black hole (PBH) abundance peaks span masses from $4.52\\times10^{-13}$ to $34.05\\,M_\\odot$. The lightest-mass benchmark reaches $f_{\\rm PBH}\\simeq0.99$, allowing nearly all dark matter within the monochromatic approximation. The accompanying scalar-induced gravitational-wave spectra span peak frequencies from $6.78\\times10^{-10}$ to $5.92\\times10^{-3}\\,\\mathrm{Hz}$, with selected benchmarks lying within the projected sensitivities of future detectors.","authors":"Narges Rashidi","nlinked":56,"nref":56,"src":"INSPIRE","html":true},{"id":"3216260","arxiv":"2610.24634","title":"ISR Reconstruction of Radiative $C=+1$ Charmonia as the Origin of the Belle--BESIII Line-Shape Puzzle","first":"Liu","nauth":4,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[3193100]]. Closest network paper: [[3214449]] (coupling 0.02, 1 shared references).","score":16.5,"rank":16,"section":"replacement","parts":[0.45,0.0,0.05,0.0,0.0],"abstract":"A longstanding disagreement persists between Belle and BESIII over the line shapes of $e^+e^-\\to Λ_c^+\\barΛ_c^-$, $D_sD_{s1}(2536)$, and $D_sD_{s2}^{*}(2573)$ near 4.63 GeV. Belle observes enhancements through initial state radiation that are absent or much weaker at BESIII. We propose that the extra Belle yield arises from radiative production of a $C=+1$ charmonium. Luminosity normalization increases this contribution to the extracted cross sections, so tens of fb can explain the enhancements. Belle II can test this mechanism through full reconstruction and searches for missing charmonia in open charm modes.","authors":"Cheng-Xi Liu, Tian-Le Gao, Cheng-Ping Shen, Xiang Liu","nlinked":44,"nref":45,"src":"INSPIRE","html":true},{"id":"3223100","arxiv":"2611.06750","title":"Inflationary attractors in metric-affine gravity","first":"Andrei","nauth":2,"year":2026,"cites":0,"role":"today","note":"Closest of your papers: [[2663002]] (coupling 0.05, 10 shared references). Closest network paper: [[3185270]] (coupling 0.15, 16 shared references).","score":10.2,"rank":17,"section":"cross","parts":[0.0,0.13,0.42,0.0,0.0],"abstract":"We study single-field slow-roll inflation in metric-affine gravity (MAG). We consider the most general action up to operators linear in curvature and quadratic in the distortion, without propagating torsion and non-metricity. We first impose projective invariance and promote every coefficient to a function of the scalar field. After integrating out the non-dynamical distortion, the net contribution is a correction $k(φ)$ to the scalar kinetic term. We then consider the class of $ξ$-attractors for which the non-minimal couplings and the scalar potential are fixed by a single function $f(φ)$. It is well-known that in the metric formulation the strong-coupling regime is universally the Starobinsky attractor. In the Palatini framework, instead, this attractor is lost and the predictions become model-dependent. Here, we show that the MAG framework restores universality: in the strong coupling limit with finite ratios of the distortion couplings to $ξ$ we have an $α$-attractor, $n_s=1-2/N_*$ and $r=12α/N_*^2$, with $α=1+ζ/(6ξ)$. The ratio $ζ/ξ$ encodes the distortion contribution. Starobinsky and Palatini inflation are recovered as specific limits. Through a numerical parameter scan we show that almost all the healthy points lie on one of the two attractors : either Nieh-Yan-like inflation (studied in a previous work and extended here) or the new MAG $α$-attractor found here. Finally, we explicitly drop projective invariance and analyse the general MAG theory. The same large-field asymptotic structure survives. We conclude that no extra inflationary phenomenology is reached by the non-projectively invariant operators: the $α$-attractor is a general prediction of MAG.","authors":"Ilaria Andrei, Christian Dioguardi","nlinked":101,"nref":106,"src":"INSPIRE","html":true},{"id":"3073459","arxiv":"","title":"Super-weakly coupled particles: phenomenology and neutrino mass models","first":"Beltrán Lloría","nauth":1,"yea ,32,"c"],[6,19,"c"],[0,85,"c"],[85,53,"c"],[63,77,"c"],[43,20,"c"],[88,80,"c"],[4,86,"c"],[40,53,"c"],[2,87,"c"],[50,54,"c"],[88,20,"c"],[21,56,"c"],[25,26,"c"],[27,18,"c"],[71,48,"c"],[84,18,"c"],[4,88,"k"],[43,26,"c"],[50,42,"c"],[50,73,"c"],[50,32,"c"],[20,77,"c"],[80,53,"c"],[87,39,"c"],[0,89,"c"],[13,70,"k"]],"next":[{"arxiv":"2611.05504","id":"3222939","title":"Gravitational waves flooding the Universe after wall domination","authors":"Sabir Ramazanov, Zhen-Min Zeng","score":9.7,"section":"cross","rank":18,"parts":[0.0,0.11,0.26,0.0,0.24],"note":"Closest of your papers: [[2787890]] (coupling 0.04, 6 shared references). Closest network paper: [[2828434]] (coupling 0.09, 10 shared references). Shared topics: early universe, gravitational wave.","abstract":"We discuss a possible early Universe scenario, where radiation era is interrupted by the epoch of domination of domain walls eventually annihilating into particles. During this period the Universe undergoes accelerated expansion, while the comoving correlation length of the domain wall network remains constant. The network serves as a source of tensor modes, which get frozen upon exiting the horizon similarly to the case of inflationary fluctuations. The modes re-enter the horizon during the subsequent stage of radiation domination and since then contribute to the gravitational wave background. The spectral shape of gravitational waves predicted in this scenario is markedly different compared to the case of domain walls remaining sub-dominant all the way till annihilation. These gravitational waves are strong enough to be observed with present-day and future facilities in a broad range of frequencies. In particular, their energy density is sufficient to produce a significant impact on the effective number of neutrino species, unless the duration of wall domination is suitably constrained."},{"arxiv":"2611.05444","id":"3222903","title":"Photon-Counting Readout via Electro-Optic Microwave-to-Optical Transduction for Axion Haloscopes","authors":"Jing Wu, Raphael Cervantes, Doga Murat Kurkcuoglu, Zheshen Zhang, Silvia Zorzetti","score":7.7,"section":"new","rank":19,"parts":[0.0,0.14,0.15,0.0,0.13],"note":"Closest of your papers: [[1941263]] (coupling 0.04, 7 shared references). Closest network paper: [[1758016]] (coupling 0.05, 5 shared references). Shared topics: dark matter.","abstract":"Axion dark matter searches require highly sensitive detection schemes with high scan rate to efficiently explore the parameter space. Building upon the conventional Sikivie haloscope, where axions convert into microwave photons inside a magnetic-field-immersed resonant cavity, we present a photon-counting scheme based on an electro-optic microwave-to-optical transducer. Through a comprehensive theoretical model under realistic experimental constraints, we find that the optimal operating regime employs an overcoupled microwave cavity, trading peak transduction efficiency for reduced transducer noise. Furthermore, combining parameters already demonstrated in existing devices, in a device with optimized extrinsic coupling rates, would yield a scan-rate enhancement of 5-10 relative to quantum-limited homodyne detection. Improvements in quality factors, coupling rates, and thermal management push this enhancement beyond 50. While our quantitative model is benchmarked at 9 GHz, the scheme adapts well to haloscopes across the 5-12 GHz range, where shrinking cavity volumes severely degrade the achievable scan rate. These results demonstrate the potential of electro-optical photon detection as a high-speed detection technique for axion dark matter searches."},{"arxiv":"2611.03373","id":"3222389","title":"Towards AI-Agent-Accelerated Research in High-Energy Physics: A Case Study in Monte Carlo Analysis","authors":"Tianqi Gao, Ruobing Jiang","score":7.2,"section":"replacement","rank":20,"parts":[0.0,0.15,0.17,0.0,0.0],"note":"Closest of your papers: [[1455793]] (coupling 0.06, 4 shared references). Closest network paper: [[1674879]] (coupling 0.06, 3 shared references).","abstract":"We investigate how far contemporary LLM-based agents can participate in multistep computational high-energy-physics research under reproducible human supervision. Using a previously published CEPC Bell-observable analysis in $e^+e^- \\to ZH$, $Z \\to q\\bar q$, $H \\to ZZ^* \\to 4μ$ as a case study, we test two capabilities. First, the agent performs an instruction-constrained reproduction: it is explicitly instructed not to use the published numerical results as analysis targets, although no technical information-access barrier is imposed. The analysis definition is fixed before the formal comparison, and the resulting detector-level $I_3$ central values reproduce the four published benchmark points to within about 2% without retuning to those values. Second, the agent is used for an open-ended extension with no target answer supplied. Using 200,000 fast-simulated events, a stage-resolved audit identifies muon isolation as the largest single contribution to the hard-to-detector shift, and subsequent diagnostics connect the effect to angle-dependent isolation efficiency, proximity to the hard $Z \\to q\\bar q$ system, and mixed electromagnetic activity from muon final-state radiation and hadron decays. Throughout, the agent assists with workflow planning, code and configuration inspection, Monte Carlo production, anomaly diagnosis, control construction, statistical analysis, and result organization, while state-changing actions and final interpretation remain under human control. The study shows that the value of AI agents in HEP may lie not only in faster code generation, but in faster scientific iteration, and motivates systematic benchmarking across historical HEP analyses using correctness, human intervention, and researcher-time efficiency as explicit metrics."},{"arxiv":"2607.00072","id":"3176228","title":"Precision Solar System Dynamics for Ultralight Dark Matter Search","authors":"Jonas Frerick, Hyungjin Kim, Felix Kling","score":6.9,"section":"replacement","rank":21,"parts":[0.0,0.06,0.13,0.0,0.31],"note":"Closest of your papers: [[1828504]] (coupling 0.02, 1 shared references). Closest network paper: [[2719600]] (coupling 0.05, 4 shared references). Shared topics: dark matter density, dark matter.","abstract":"Ultralight dark matter exhibits an order-one density fluctuation at the scale of its wavelength. This density fluctuation exists across the entire dark matter halo and interacts with stars and planets, perturbing their motion via gravitational interactions. We investigate the possibility of using precision solar system dynamics to search for ultralight dark matter. We examine this possibility with interplanetary radio range measurements. We show that the precision of current range measurements can probe ultralight dark matter at masses around $10^{-15}\\,$eV, had its density in the solar system been $10^5$ larger than the so-called local dark matter density. This limit complements other constraints, such as the one from analyses of pulsar timing observations."},{"arxiv":"2611.02007","id":"3222276","title":"Electroweak-Scale Cosmic Magnetism: Magnetogenesis, Baryogenesis, Phase Transitions and Gravitational Waves","authors":"Fayez Abu-Ajamieh","score":6.6,"section":"replacement","rank":22,"parts":[0.0,0.01,0.26,0.0,0.22],"note":"Closest of your papers: [[3094526]] (coupling 0.00, 1 shared references). Closest network paper: [[2134073]] (coupling 0.09, 12 shared references). Shared topics: early universe, gravitational wave.","abstract":"Magnetic fields, the baryon asymmetry of the Universe, and stochastic gravitational waves provide complementary probes of physics in the early Universe. Near the electroweak scale, these phenomena are not necessarily independent. The electroweak anomaly allows hypermagnetic helicity to exchange charge with chiral fermions, sphalerons can change baryon and lepton number, and first-order phase transitions in extensions of the Standard Model can drive plasma motion, magnetogenesis, and gravitational waves. In this review, we explain these connections and examine the literature needed to make quantitative predictions. We begin with the properties of primordial magnetic fields and the electroweak plasma, then discuss the mechanisms that produce magnetic fields, the conversion between helicity and baryon number, magnetic backreaction, and the evolution of the field to the present day. We also review the observational constraints and recent developments, including gauge-invariant descriptions of magnetic flux through the crossover and reconnection-controlled field evolution. Particular attention is given to the assumptions behind commonly used formulas and to the distinction between established results and model-dependent estimates. We argue that the most useful way forward is to predict the baryon abundance, present-day magnetic-field spectrum, and gravitational-wave signal from the same microscopic model, with consistent treatment of the intervening plasma dynamics."},{"arxiv":"2611.05465","id":"3222896","title":"Probing Heavier-Baryon Oscillations through Light-Baryon Mixing","authors":"Arnau Bas i Beneito, Svjetlana Fajfer, Alexey A. Petrov","score":6.4,"section":"new","rank":23,"parts":[0.0,0.07,0.29,0.0,0.0],"note":"Closest of your papers: [[1222142]] (coupling 0.03, 2 shared references). Closest network paper: [[2053590]] (coupling 0.10, 20 shared references).","abstract":"Motivated by the existing direct limits on $Ξ_b^0$ and $Ξ_c^0$ oscillations, we investigate how Standard Model weak interactions connect baryon-number-violating mixing in heavy neutral baryons to the much more strongly constrained neutron-antineutron and $Λ-\\barΛ$ mixing. We focus on $Ξ_b^0$, $Λ_b^0$, $Ξ_c^0$, and $Ω_c^0$ oscillations and derive indirect constraints on their mass-mixing parameters from existing limits on $n-\\bar n$ oscillations and on $Λ-\\barΛ$ mixing, the latter inferred from dinucleon-decay searches. The weak baryon-to-baryon transition amplitudes are estimated by saturating the relevant hadronic correlators with low-lying intermediate baryons. The required weak vertices are modelled using semileptonic form factors from lattice QCD, quark models, and QCD sum rules. Since these form factors must be continued outside their physical semileptonic domains and the resulting loop integrals depend on a UV cutoff, our results are order-of-magnitude estimates subject to sizeable hadronic uncertainties. For a benchmark cutoff of $10~{\\rm GeV}$, the indirect bounds on the $Ξ_b^0$ and $Ξ_c^0$ mixing parameters are roughly three and five orders of magnitude stronger than the direct LHCb and Belle limits, indicating that light-baryon $|ΔB|=2$ searches can probe heavy-baryon oscillations far beyond present direct sensitivities."},{"arxiv":"2611.06129","id":"3223037","title":"What Does Precision Spectroscopy Actually Constrain about X17 Couplings?","authors":"Raoul Serao, Antonio Capolupo","score":5.8,"section":"new","rank":24,"parts":[0.0,0.02,0.34,0.0,0.0],"note":"Closest of your papers: [[2690106]] (coupling 0.01, 1 shared references). Closest network paper: [[3115042]] (coupling 0.12, 9 shared references).","abstract":"Can precision spectroscopy disentangle the individual couplings of the X17 boson? Within a leading one-body model, we combine electronic and muonic spectroscopy of hydrogen, deuterium and helium with lepton magnetic moments. We show that hydrogen-deuterium comparisons can lose neutron sensitivity through cancellations, while the combined observables restore generic local identifiability without guaranteeing finite individual bounds. The unrestricted fit admits formally unbounded nucleon-coupling directions, some of which violate the assumptions underlying the physical model. Finite-coupling tests nevertheless reveal statistically compatible solutions, with bounds dependent on nuclear responses and physical assumptions. Our results establish what precision measurements genuinely constrain and what additional information is required to extract meaningful limits on X17 couplings."},{"arxiv":"2611.05500","id":"3222924","title":"SMEFT Constraints on Top Electroweak Couplings and a Composite Higgs Interpretation","authors":"Leandro Da Rold, Juan Fernandez","score":5.7,"section":"new","rank":25,"parts":[0.06,0.03,0.17,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[3094526]] (coupling 0.01, 4 shared references). Closest network paper: [[1455732]] (coupling 0.06, 2 shared references).","abstract":"Recent LHC measurements of $tWZ$, $t\\bar t Z$ and single top production provide complementary probes of top quark electroweak interactions. We incorporate these measurements into a global Standard Model effective field theory analysis of 46 independent dimension-six Wilson coefficients at linear order. The updated fit remains compatible with the Standard Model at $95\\%$ CL, and favors negative values of $C_{Hq}^{(-)}\\equiv C_{Hq}^{(1)}-C_{Hq}^{(3)}$ and $C_{Ht}$, with central values suggestive of TeV scale new physics. We also present an effective composite Higgs model based on a two-site description that realizes this pattern of Wilson coefficients through partial compositeness. The model includes custodial symmetry and protection of the $Z\\bar b_L b_L$ coupling. A fermion bitriplet generates the required left-handed shift, and an additional embedding of the right-handed top allows negative contributions to $C_{Ht}$ from both fermion and spin-one exchange. Scanning four right-handed top embeddings, we find parameter regions within the $68\\%$ CL contour that are compatible with electroweak precision data, Higgs coupling measurements and applicable direct searches. The $T$ parameter limits the negative fermionic contribution to $C_{Ht}$, favoring a spin-one contribution of comparable or greater magnitude. Larger $SU(2)_R$ representations extend the reach toward negative $C_{Ht}$, and also enhance four-quark interactions that increase the four-top cross section, in the direction favored by current measurements. The mechanism connects the preferred top electroweak shifts to complementary tests through single production of quarks with electric charge $-4/3$, modified Higgs couplings and four-top production."},{"arxiv":"2611.05474","id":"3222925","title":"Dynamics of self-gravitating halos with decaying dark matter","authors":"Anna Bencke, Marc Kamionkowski, Annika H. G. Peter, Juniper Morales","score":5.7,"section":"cross","rank":26,"parts":[0.0,0.07,0.1,0.0,0.22],"note":"Closest of your papers: [[2787890]] (coupling 0.02, 3 shared references). Closest network paper: [[3214429]] (coupling 0.03, 9 shared references). Shared topics: dark matter, dark matter particle.","abstract":"We study the evolution of self-gravitating spherical dark matter halos composed of dark matter particles that decay to a slightly less massive particle and a massless particle. The small kick velocity imparted to the daughter particle upon decay heats the halo. If the kick velocity is small compared with the characteristic velocity, the halo remains bound but puffs out. We also consider, for the first time, decaying halos with anisotropic initial conditions and find non-negligible effects on the resulting density profile. To simulate the halo evolution, we utilize the recently developed \\texttt{NSphere} code across a broad range of decay times and kick velocities. We train an emulator to provide a mapping between the decay parameters and the relaxed density profile. We discuss how the resulting halo-scale signatures complement existing cosmological constraints on decaying dark matter and can be tested by upcoming surveys."},{"arxiv":"2607.02649","id":"3177405","title":"EFT Validity and Truncation Uncertainty from few Nuisance Parameters","authors":"Benoît Assi, Adam Martin, William Shepherd","score":5.7,"section":"replacement","rank":27,"parts":[0.06,0.04,0.17,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[3094526]] (coupling 0.01, 2 shared references). Closest network paper: [[2630211]] (coupling 0.06, 4 shared references).","abstract":"An observable in an Effective Field Theory (EFT) is an expansion in a set of small parameters, no different than any other perturbation series. Truncating such a series expansion leaves the leading dropped term as the dominant source of error, and that term itself contains a calculable portion. We explore the partial calculation of this next-order error, available at dim-6$^2$ in SMEFT with no additional tools needed to simulate it, and explore how to efficiently use that partial calculation to model the next-order uncertainty in full using a minimal number of nuisance parameters. This estimate of the uncertainty of the EFT signal rate naturally imposes EFT validity by ensuring that bounds are driven by kinematic regions where truncation uncertainties are parametrically smaller than the signal. We incorporate the calculable dim-6$^2$ piece into the signal and cover the remaining higher-dimension uncertainty with a small set of nuisance parameters derived from a scan over Wilson-coefficient values. Our algorithm to determine the relevant nuisance parameters and distributions is automation-friendly and applies to arbitrary truncation choices. We then provide multiple examples of its implementation in high-energy collider processes focused on SMEFT truncated at $\\mathcal{O}(Λ^{-2})$, where the dim-6$^2$ piece is used to estimate the full $\\mathcal O(Λ^{-4})$ dependence. In the examples considered here the reduction of nuisance parameters is appreciable, generically reducing the nuisance parameter count by an order of magnitude compared to naive estimates."},{"arxiv":"2605.30404","id":"3162977","title":"Leptonic CP Phase Determination from Fisher Information in T2K and NO$ν$A","authors":"Neetu Raj Singh Chundawat, Luis A. Delgadillo, Yu-Feng Li","score":5.2,"section":"replacement","rank":28,"parts":[0.06,0.03,0.15,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[3184726]] (coupling 0.01, 2 shared references). Closest network paper: [[3158607]] (coupling 0.05, 7 shared references).","abstract":"The precise determination of the leptonic CP phase $δ_{\\rm CP}$ remains one of the central objectives of current and future long-baseline (LBL) neutrino oscillation experiments. Quantum estimation theory provides a natural framework to quantify the ultimate precision limits for estimating physical parameters encoded in quantum states. In this work, we employ the quantum Fisher information to investigate how much information about $δ_{\\rm CP}$ is intrinsically encoded in neutrino states and how efficiently it is extracted in present LBL experiments such as T2K and NO$ν$A. We first analyze the intrinsic quantum sensitivity of neutrino and antineutrino states and demonstrate how matter effects generate a neutrino mass-ordering dependent information structure. To compare the intrinsic information content of the quantum state with the information experimentally accessible through flavor measurements, we compute the event-level Fisher information from reconstructed event spectra using Poisson statistics including backgrounds and systematics. We find that both experiments extract only a small fraction of the total information available in the underlying quantum state. This extraction efficiency becomes particularly suppressed near maximally CP-violating regions, where the reconstructed event spectra exhibit reduced sensitivity to small variations in $δ_{\\rm CP}$. We also apply the same framework to the reactor mixing angle $θ_{13}$, providing a benchmark for comparison with the estimation of $δ_{\\rm CP}$. Our analysis provides a complementary information-theoretic perspective on precise estimation of oscillation parameters in LBL neutrino experiments."},{"arxiv":"2611.06769","id":"3223115","title":"Born spreading with consistent shower starting scales in MC@NLO and FxFx merging","authors":"Rikkert Frederix, Paolo Torrielli","score":5.0,"section":"new","rank":29,"parts":[0.0,0.04,0.25,0.0,0.0],"note":"Closest of your papers: [[3094526]] (coupling 0.01, 1 shared references). Closest network paper: [[3206672]] (coupling 0.09, 7 shared references).","abstract":"Negative weights are a major cost in NLO event generation matched to parton showers at the LHC, as they increase the number of events needed for a given statistical precision. Born spreading reduces the fraction of negative-weight $\\mathbb S$ events in MC@NLO by redistributing the Born contribution over the radiation variables. It introduces no bias only if everything that is passed to the parton shower together with $\\mathbb S$ events depends on Born-level quantities alone. We show that the same condition is needed for the MC counterterms to reproduce the first shower emission, independently of how the radiation phase space is integrated. In MadGraph5_aMC@NLO, the $\\mathbb S$-event starting scales did not fully satisfy this condition, which so far prevented the public release of Born spreading. We present a new and consistent construction of the starting scales for ordinary MC@NLO, FxFx merging and MC@NLO-$Δ$, with which Born spreading is now publicly available, including for merged samples. We also study modified formulations of the MC counterterms, and FxFx-merged $W$+jets production with up to two jets at NLO, for which Born spreading reduces the fraction of negative weights after merging without affecting the predictions, and the event samples are generated six times faster than with the former implementation."},{"arxiv":"2606.12549","id":"3167942","title":"Tachyonic Encore: A universal shift of inflationary observables","authors":"Diogo S. Gorgulho, Margherita Putti, Rodrigo Gonzalez Quaglia, Ema Dimastrogiovanni, Matteo Fasiello, Diederik Roest","score":5.0,"section":"replacement","rank":30,"parts":[0.0,0.04,0.26,0.0,0.0],"note":"Closest of your papers: [[2663002]] (coupling 0.01, 3 shared references). Closest network paper: [[3177342]] (coupling 0.09, 17 shared references).","abstract":"We propose a generic mechanism applicable to single-field inflaton models in which a light axion spectator, initialized near the hilltop of its potential, reshapes inflationary observables through purely gravitational multi-field dynamics. During inflation the axion is frozen and the background follows an effectively single-field trajectory. After inflation ends, the axion rolls, inducing a turn in field space and transient tachyonic phases of the isocurvature mode. The resulting ``tachyonic encore'' occurs entirely on super-horizon scales. These phases generate a nearly scale-invariant enhancement of the curvature power spectrum, suppressing the tensor-to-scalar ratio and shifting the scalar tilt to a weighted combination of adiabatic and entropic tilts at horizon crossing. We show that these effects can reconcile otherwise disfavored inflaton potentials with current CMB constraints. The same dynamics predict local non-Gaussianity, $f_{\\rm NL}^{\\rm loc.}\\sim \\mathcal{O}(1)$, within reach of upcoming surveys."},{"arxiv":"2606.16711","id":"3168812","title":"Revisiting the Lyth bound constraints on inflation from ACT DR6 results","authors":"Rui Yang, Jun Tao, Peng Wang, Mian Zhu","score":5.0,"section":"replacement","rank":31,"parts":[0.0,0.09,0.15,0.0,0.0],"note":"Closest of your papers: [[2663002]] (coupling 0.03, 7 shared references). Closest network paper: [[2951309]] (coupling 0.05, 6 shared references).","abstract":"The Lyth bound asserts that the field excursion of inflaton must be sub-Planckian, thereby imposing an upper bound on the amplitude of the tensor power spectrum in inflationary scenario. This bound is conventionally derived assuming a scale-invariant curvature power spectrum, i.e., $n_s = 1$. However, astrophysical observations confirm a red-tilted spectrum with $n_s < 1$. In light of recent results from the Atacama Cosmology Telescope (ACT) DR6, we revisit these constraints using the newly implied scalar spectral index of $n_s \\simeq 0.9743$. Incorporating the ACT data yields a different upper bound on the tensor-to-scalar ratio $r$, which can potentially exclude inflationary scenarios previously robust under the original Lyth bound with $n_s = 1$. Our result highlights the urgent need to combine theoretical Lyth bound considerations with the most up-to-date astrophysical data."},{"arxiv":"2611.06755","id":"3223116","title":"Earthquake Forecast via Neutrino Tomography at the DUNE Baseline","authors":"Bipin Singh Koranga, Samrat Vashisht, Vivek Kumar Nautiyal","score":4.8,"section":"new","rank":32,"parts":[0.06,0.05,0.08,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[3184726]] (coupling 0.02, 2 shared references). Closest network paper: [[3214449]] (coupling 0.03, 2 shared references).","abstract":"We investigate the sensitivity of accelerator-based neutrino oscillations to localized electron-density enhancements associated with seismic fault zones along the Fermilab SURF baseline of the Deep Underground Neutrino Experiment (DUNE). Motivated by the reactor antineutrino proposal of Wang, Chen, and Li, we model the anomaly as a uniform-density slab embedded in the surrounding crust and calculate exact three flavour oscillation probabilities using layer by layer evolution. Our results show that localized density enhancements can produce measurable variations in muon-to-electron appearance probabilities for both neutrinos and antineutrinos, with potentially significant relative effects. The predicted variations exhibit weak dependence on the leptonic CP violating phase, suggesting that time-differential measurements may help reduce uncertainties associated with the unknown CP phase. However, the event statistics required for a statistically significant detection substantially exceed those expected during a short-duration precursor interval. Consequently, detecting sufficiently persistent density anomalies may be possible under favourable conditions, whereas short-term earthquake forecasting is not feasible with the nominal DUNE configuration. Our findings establish a theoretical framework for exploring localized Earth-density perturbations through long-baseline neutrino oscillations."},{"arxiv":"2512.21761","id":"3095826","title":"Differentiable Principal-Value Inversion for Neural-Network Extraction of Generalized Parton Distributions","authors":"Dima Watkins, Ishara Fernando, Dustin Keller","score":3.9,"section":"replacement","rank":33,"parts":[0.0,0.03,0.05,0.0,0.22],"note":"Closest of your papers: [[1455793]] (coupling 0.01, 1 shared references). Closest network paper: [[3193100]] (coupling 0.02, 14 shared references). Shared topics: discrete symmetry.","abstract":"We present a neural-network method for reconstructing generalized parton distributions (GPDs) from Compton form factors (CFFs). The network represents quark singlet, nonsinglet, and gluon distributions at a common reference scale. Next-to-leading-order QCD evolution and hard-scattering coefficients connect these distributions to CFFs at the measured scales. Discrete symmetries are imposed exactly, and polynomiality is constrained for a finite set of Mellin moments while leaving their allowed coefficients free. In a noiseless closure test with 45 complex-CFF input positions, the reconstructed charge-weighted quark GPD has a relative $L^2$ error of $4.90\\%$ over the evaluation domain. Real- and imaginary-CFF prediction errors at 512 kinematic positions excluded from the fit are $0.75\\%$ and $2.75\\%$. Tests using only real CFFs at 160 experimental coordinates give GPD errors of $0.75\\%$ and $3.05\\%$ for two network initializations with exact inputs; these increase to $32.7\\%$ and $49.2\\%$ for one fixed perturbation at the quoted experimental error scale. For experimentally extracted CFFs, we reconstruct GPDs from the mean of 32 smooth CFF replica functions and from two individual replicas. The resulting GPD shapes depend on both the input fluctuations and the number of optimization iterations. These results demonstrate a working NLO reconstruction method and quantify the contrast between exact-input recovery and reconstruction with uncertain inputs."},{"arxiv":"2512.05031","id":"3089396","title":"CNN on `Top': In Search of Scalable & Lightweight Image-based Jet Taggers","authors":"Rajneil Baruah, Subhadeep Mondal, Sunando Kumar Patra, Satyajit Roy","score":3.8,"section":"replacement","rank":34,"parts":[0.0,0.06,0.14,0.0,0.0],"note":"Closest of your papers: [[1455793]] (coupling 0.02, 3 shared references). Closest network paper: [[2621240]] (coupling 0.05, 5 shared references).","abstract":"While Transformer-based and standard Graph Neural Networks (GNNs) have proven to be the best performers in classifying different types of jets, they require substantial computational power. We explore the scope of using a lightweight and scalable version of EfficientNet architecture, along with global features of the jet. The end product is computationally inexpensive but is capable of competitive performance. We showcase the efficacy of our network in tagging top-quark jets in a sea of other light quark and gluon jets. The work also sheds light on the importance of global features for both the accuracy and the apparent redundancy of the network's complexity."},{"arxiv":"2610.20611","id":"3215209","title":"A global analysis of ${\\bar B}\\to DP$ and ${\\bar B} \\to {\\bar D} P$ decays","authors":"Bhubanjyoti Bhattacharya, Rida Boumris, David London","score":3.7,"section":"replacement","rank":35,"parts":[0.06,0.02,0.07,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[3184726]] (coupling 0.01, 1 shared references). Closest network paper: [[2972436]] (coupling 0.02, 3 shared references).","abstract":"Recently, a fit to the 10 measured branching ratios of ${\\bar B} \\to D P$ decays ($B = \\{B^+, B^0, B_s^0\\}$, $D = \\{D^0, D^+, D_s^+\\}$, $P \\in \\{ π, K\\}$) was performed under the assumption of flavor SU(3) symmetry [SU(3)$_F$]. A terrible fit was found: there was a $> 5σ$ disagreement with the SU(3)$_F$ limit of the Standard Model [SM$_{\\rm{SU(3)}_F}$]. It was also found that this discrepancy can be removed by adding $\\sim 20\\%$ SU(3)$_F$-breaking effects. Now, the ${\\bar B} \\to D^0 P$ amplitudes can contribute to other observables (direct and indirect CP asymmetries) if they interfere with the amplitudes for ${\\bar B} \\to {\\bar D}^0 P$ decays. This happens if the $D^0$ and ${\\bar D}^0$ decay to the same final state (e.g., $K^+ K^-$, $π^+ π^-$, $K^\\pm π^\\mp$, etc.). In this paper, we perform a combined fit of ${\\bar B} \\to D P$ and ${\\bar B} \\to {\\bar D} P$ decays, including all observables. We again find a $> 5σ$ disagreement with the SM$_{\\rm{SU(3)}_F}$, and we find that the data can be explained if $\\sim 60\\%$ SU(3)$_F$-breaking effects are included."},{"arxiv":"2611.05872","id":"3222990","title":"Investigations on the low-lying $cccq\\bar{q}$ resonances in a constituent quark model","authors":"Yue-Mei Yin, mao-jun Yan, Chun-Sheng An, Cheng-Rong Deng","score":3.6,"section":"new","rank":36,"parts":[0.06,0.01,0.08,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[3184726]] (coupling 0.00, 1 shared references). Closest network paper: [[3193100]] (coupling 0.03, 32 shared references).","abstract":"In present work, mass spectrum of the low-lying $cccq\\bar{q}$ pentaquarks states with $q\\bar{q}=u\\bar{u}$, $d\\bar{d}$ and $s\\bar{s}$, are investigated employing a constituent quark model, within which the spin-dependent hyperfine interactions are taken to be the instanton-induced interaction and the one-gluon-exchange interaction, respectively. The model parameters are fixed by fitting the mass spectrum of the relative $q\\bar{q}$ and $qqq$ traditional hadrons. The numerical results show that energies for all the obtained states in the two employed models are higher than corresponding meson-baryon channels, consequently, we roughly estimate strong decays of these states using a simple quark rearrangement model, the corresponding partial width ratios for different decay channels are presented."},{"arxiv":"2606.14349","id":"3168335","title":"Finite-volume effects on smeared spectral densities","authors":"Francesca A. Bresciani, Mattia Bruno, Maxwell T. Hansen","score":3.6,"section":"replacement","rank":37,"parts":[0.06,0.01,0.08,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[3184726]] (coupling 0.00, 1 shared references). Closest network paper: [[3193100]] (coupling 0.03, 25 shared references).","abstract":"Using two distinct approaches, we derive a universal expression for the leading finite-volume effects of the smeared vector-vector spectral density (proportional to the smeared hadronic $R$-ratio) in a periodic cubic spatial volume of side length $L$. First, building on the results of previous work for finite-volume effects on Euclidean two-point functions, we show that the $L$ dependence is exponentially suppressed for a certain class of smearing kernels, and that the leading effects can be expressed universally in terms of the pion form factor. The same representation is then derived starting from the Lellouch-Lüscher-Meyer expression for the spectral decomposition of the correlator. The results may prove useful for controlling the $L \\to \\infty$ extrapolation of smeared spectral densities, in particular by defining a scaling regime in which the finite-volume effects are dominated by the leading terms in a large $L$ expansion and thus can be reliably estimated. To illustrate this point, we also present numerical estimates based on various kernels and models of particle interactions. Despite focusing on the vector channel, our derivation defines a general framework applicable to other cases as well."}],"refs":{"3185270":{"first":"Ma","year":2026,"nauth":3,"title":"Inflation and Reheating by Dynamical Torsion","role":"other"},"1941263":{"first":"Bernal","year":2021,"nauth":4,"title":"ALP dark matter in a primordial black hole dominated universe","role":"seed"},"3214449":{"first":"Landini","year":2026,"nauth":3,"title":"Dark Matter Stability from residual flavour symmetries","role":"other"},"1294681":{"first":"Molinaro","year":2014,"nauth":3,"title":"FIMP realization of the scotogenic model","role":"seed"},"2784023":{"first":"Arcadi","year":2024,"nauth":4,"title":"Higgs portal dark matter freeze-in at stronger coupling: observational benchmarks","role":"other"},"1828504":{"first":"Bernal","year":2020,"nauth":2,"title":"Gravitational dark matter production: primordial black holes and UV freeze-in","role":"seed"},"2014592":{"first":"Masina","year":2022,"nauth":1,"title":"Dark matter from evaporating Black Holes","role":"other"},"3130296":{"first":"Cerdeño","year":2026,"nauth":4,"title":"New benchmarks for direct detection of freeze-in dark matter in vector portal models","role":"seed"},"2663002":{"first":"Barman","year":2023,"nauth":4,"title":"Bremsstrahlung-induced gravitational waves in monomial potentials during reheating","role":"seed"},"1674879":{"first":"Wan","year":2018,"nauth":8,"title":"Searches for Dark Matter via Mono-W Production in Inert Doublet Model at the LHC*","role":"other"},"3159193":{"first":"Ghosh","year":2026,"nauth":5,"title":"Freeze-in <math display=\"inline\"><mi>S<\/mi><mi>U<\/mi><mo stretchy=\"false\">(<\/mo><mn>2<\/mn><mo stretchy=\"false\">)<\/mo><\/math> vector dark matter at low reheating temperature","role":"other"},"1518747":{"first":"Arcadi","year":2017,"nauth":8,"title":"The waning of the WIMP? A review of models, searches, and constraints","role":"other"},"2658189":{"first":"Shao","yea
