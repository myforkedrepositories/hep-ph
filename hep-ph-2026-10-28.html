<script>
const RAW = {"n":[{"id":"3202484","arxiv":"2609.11747","title":"Precise bubble wall velocity in a specific phase transition pattern in the CxSM and beyond","first":"Tang","nauth":3,"year":2026,"cites":0,"role":"repl","note":"Cites 3 network papers: [[2957941]], [[1937352]], [[1863581]]. Closest of your papers: [[1869725]] (coupling 0.01, 1 shared references). Closest network paper: [[2957941]] (coupling 0.29, 30 shared references). Shared topics: relic density, primordial black hole, singlet scalar, dark matter, early universe.","score":50.5,"rank":1,"section":"replacement","parts":[0.83,0.04,0.84,0.0,0.76],"abstract":"The bubble wall velocity is a key quantity in cosmological first-order phase transitions, with important implications for electroweak baryogenesis, gravitational wave signals, the dark matter relic density and primordial black holes formed during the phase transition. However, it is often treated as a free input in phenomenological studies, while a self-consistent determination remains challenging. In this work, taking the complex singlet extension of the Standard Model as an example, we investigate the bubble wall dynamics and velocity in a specific electroweak phase transition pattern where both the Higgs field and the coupled singlet scalar experience friction. The microscopic friction arising from particle interactions with the plasma is evaluated using Boltzmann transport equations, while the macroscopic plasma response is described through hydrodynamic analysis. By applying the steady state force balance condition, we numerically determine the bubble wall velocity for different model parameters. We show that the wall velocity is governed by the competition between the driving force from the effective potential and plasma friction, and that its variation can significantly affect the baryon asymmetry. Our study provides a quantitative investigation of bubble wall dynamics in this overlooked phase transition pattern and its implications for early Universe phenomenology.","authors":"Shihang Tang, Fa Peng Huang, Chikako Idegawa","nlinked":90,"nref":92,"src":"INSPIRE","html":true},{"id":"3219331","arxiv":"2610.36033","title":"Can inflationary axion fluctuations dominate over misalignment?","first":"Lee","nauth":3,"year":2026,"cites":0,"role":"today","note":"Cites 3 network papers: [[2642079]], [[2098321]], [[2737356]]. Also cites widely used network papers: [[1783234]]. Closest of your papers: [[1941263]] (coupling 0.07, 14 shared references). Closest network paper: [[1966379]] (coupling 0.16, 11 shared references). Shared topics: relic abundance, dark matter.","score":47.0,"rank":2,"section":"new","parts":[0.84,0.22,0.45,0.0,0.42],"abstract":"The relic abundance of light stable axion dark matter is usually set by misalignment. We study whether the inflationary fluctuations of the axion can dominate instead, and we follow the modes analytically through an instantaneous transition from de Sitter expansion to radiation domination, neglecting the axion mass during inflation and keeping it afterward. Since the energy density is quadratic in the field, a fluctuation-dominated abundance carries an isocurvature perturbation even when the mean displacement vanishes. For a canonical minimally coupled axion the spectrum is scale invariant, and fluctuation-dominated dark matter exceeds the Planck isocurvature limit by about eight orders of magnitude. An inflaton-dependent kinetic function or a nonminimal coupling to the Ricci scalar tilts the spectrum blue, moving the fluctuation power from CMB scales to small scales. Imposing the Planck limit at the pivot scale, we find that fluctuation-dominated dark matter with a constant kinetic slope requires the spectral tilt $n_η-1\\gtrsim0.27$ and the axion mass $m_η \\gtrsim200 \\rm{GeV}$ at $H_I=10^{10}\\rm{GeV}$, and $n_η-1\\gtrsim0.34$ and $m_η\\gtrsim4.5\\,$keV at $H_I=10^{13}\\rm{GeV}$. A kinetic function with a running slope lowers these masses to $1.4~\\rm{GeV}$ and $0.7\\,$eV, respectively. For the QCD axion, whose oscillations start late, we estimate that any single power-law spectrum blue enough to satisfy the pivot limit gives too little fluctuation abundance, and misalignment dominates.","authors":"Seung J. Lee, Sarunas Verner, Bingrong Yu","nlinked":94,"nref":94,"src":"INSPIRE","html":true},{"id":"3219332","arxiv":"2610.36049","title":"Dark Matter Coherent Freeze-Out Mechanism: A Comprehensive Analysis","first":"Ferrante","nauth":4,"year":2026,"cites":0,"role":"today","note":"Cites 2 network papers: [[3089716]], [[2795517]]. Also cites widely used network papers: [[1783234]]. Closest of your papers: [[1941263]] (coupling 0.04, 8 shared references). Closest network paper: [[3089716]] (coupling 0.09, 7 shared references). Shared topics: observed relic, relic density, dark matter candidate, dark matter model, dark matter.","score":41.1,"rank":3,"section":"new","parts":[0.72,0.13,0.26,0.0,0.82],"abstract":"Both Weakly-Interacting Massive Particle (WIMP) and Axion-Like Particle (ALP) are attractive particle dark matter candidates. In this paper we consider a scenario in which both WIMP and ALP are present. The two species interact via a non-derivative quadratic coupling modeled on the axion-nucleon interaction in QCD. We show that even a small (Planck-suppressed) coupling can drastically modify the cosmological history of both species. In the very early Universe, the ALP field acquires a vacuum expectation value, and the system undergoes an inverse phase transition at a temperature around or below the weak scale. WIMPs may remain in equilibrium far beyond the usual freeze-out time, eventually decoupling via a novel \"coherent freeze-out\" mechanism. WIMP annihilation cross sections several orders of magnitude above the canonical thermal target value can be consistent with the observed relic density in the coherent freeze-out scenario. At the same time, coherent oscillations of the ALP field do not begin until after the phase transition, and the initial conditions for these oscillations are set by the thermal physics of the phase transition. The ALP relic density is then predicted unambiguously in terms of the WIMP mass and coupling. We term this scenario \"ALP miracle\", since the observed relic density is obtained when these parameters are around their natural values, the weak and the Planck scale. The ALP miracle scenario prefers the ALP mass above about $10^{-3}\\,\\mathrm{eV}$, far larger than other popular ALP dark matter models. The ALP miracle parameter space overlaps with a currently allowed region of the QCD axion band, a large fraction of which is expected to be probed by the proposed IAXO experiment.","authors":"Steven Ferrante, Lillian Luo, Maxim Perelstein, Bingrong Yu","nlinked":55,"nref":57,"src":"INSPIRE","html":true},{"id":"3161765","arxiv":"2605.27519","title":"Probing the dynamical inverse seesaw mechanism with low-frequency gravitational waves","first":"Borah","nauth":5,"year":2026,"cites":0,"role":"repl","note":"Cites 2 network papers: [[2828434]], [[2134273]]. Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1249404]] (coupling 0.04, 9 shared references). Closest network paper: [[3190827]] (coupling 0.20, 36 shared references). Shared topics: neutrino mass.","score":39.8,"rank":4,"section":"replacement","parts":[0.72,0.11,0.58,0.0,0.28],"abstract":"We study the possibility of probing the dynamical inverse seesaw mechanism for the origin of light neutrino masses via the detection of stochastic gravitational waves (GW) in the low-frequency regime currently being probed by pulsar timing arrays. As the lepton number-violating term in inverse seesaw typically remains in the sub-MeV ballpark, its dynamical origin naturally brings the possibility of a low-scale first-order phase transition, which can be probed at low-frequency GW experiments. We also find interesting complementarity with heavy neutral lepton searches, as GW experiments remain sensitive to parameter space with small active-sterile mixing, which is out of reach for most particle physics experiments.","authors":"Debasish Borah, Sounak Dutta, Partha Kumar Paul, Indrajit Saha, Narendra Sahu","nlinked":132,"nref":132,"src":"INSPIRE","html":true},{"id":"3219359","arxiv":"2610.36060","title":"Hybrid seesaw from $SU(2)_1 \\times SU(2)_2 \\times U(1)_Y$","first":"Herrero-Brocal","nauth":3,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[2931725]]. Also cites widely used network papers: [[1783234]]. Closest of your papers: [[731108]] (coupling 0.04, 3 shared references). Closest network paper: [[2931725]] (coupling 0.24, 23 shared references). Shared topics: lepton flavor violation, neutrino mass.","score":36.0,"rank":5,"section":"new","parts":[0.48,0.13,0.68,0.0,0.49],"abstract":"We study neutrino mass generation in a model based on the $SU(3)_c \\times SU(2)_1 \\times SU(2)_2 \\times U(1)_Y$ gauge symmetry, in which the Standard Model $SU(2)_L$ arises at low energies as the diagonal subgroup of the two $SU(2)$ factors. The symmetry is enlarged with a global $U(1)_{B-L}$ symmetry, spontaneously broken by the vacuum expectation value of a scalar bidoublet. Light neutrino masses are generated at tree level through a hybrid of the type-III, inverse and linear seesaw mechanisms. A distinctive feature of the construction is the existence of a Nambu-Goldstone boson, the majoron, which transforms non-trivially under the original gauge symmetry while being mostly singlet under the Standard Model gauge group. We explore the phenomenological consequences of this setup, including electroweak precision constraints, the production of the nearly degenerate $W'$ and $Z'$ bosons at colliders and lepton flavor violating decays with a majoron in the final state. The latter constitute the most promising signature of the model.","authors":"Antonio Herrero-Brocal, Javier Perez-Soler, Avelino Vicente","nlinked":58,"nref":62,"src":"INSPIRE","html":true},{"id":"3178731","arxiv":"2607.07794","title":"Universal seesaw mechanism for fermion masses and strong CP problem","first":"Perez","nauth":2,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[1993049]]. Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2690106]] (coupling 0.10, 8 shared references). Closest network paper: [[1993049]] (coupling 0.10, 6 shared references). Shared topics: vector-like fermion, neutrino mass.","score":34.4,"rank":6,"section":"replacement","parts":[0.48,0.28,0.28,0.0,0.48],"abstract":"We propose a framework for fermion mass generation based on a universal seesaw. The Standard Model is extended by an Abelian gauge symmetry acting on right-handed fermions, together with vector-like fermions and scalar fields. The ordinary Yukawa couplings are forbidden, except for the top-quark coupling to the Higgs, which is allowed at the renormalizable level and remains unsuppressed. The charged-fermion hierarchies then arise from mixing with the vector-like sector, and light neutrino masses emerge from a neutral sector Majorana seesaw. CP is exact in the ultraviolet and broken spontaneously by scalar vacuum expectation values. The resulting CP-violating phase is transmitted to the quark sector and generates the CKM phase, while a Nelson-Barr structure, realized through the universal seesaw block form, keeps the physical QCD vacuum angle zero at tree level. Consistency with EDM bounds beyond tree level requires moderately suppressed Yukawa couplings between SM doublets to the vector-like sector. If the leading higher-dimensional operators are unsuppressed, the same requirement can favor a low breaking scale for the new Abelian symmetry. In this regime the vector-like fermions can lie at the TeV scale, with suppressed mixing with the electroweak sector. This framework provides a simple setting in which the hierarchies of charged-fermion masses, neutrino masses, and CP-violating parameters can be accounted for within a common extension of the Standard Model.","authors":"Pavel Fileviez Perez, Clara Murgui","nlinked":38,"nref":40,"src":"INSPIRE","html":true},{"id":"3218194","arxiv":"2610.31666","title":"Boosted Dark Matter Directionality in Large Liquid Scintillator Detectors","first":"Tse","nauth":5,"year":2026,"cites":0,"role":"repl","note":"Co-authors of yours: Choi. Cites 1 network paper: [[2795517]]. Closest of your papers: [[2794409]] (coupling 0.02, 3 shared references). Closest network paper: [[2181757]] (coupling 0.09, 10 shared references). Shared topics: dark matter.","score":27.4,"rank":7,"section":"replacement","parts":[0.45,0.05,0.25,0.5,0.13],"abstract":"Light dark matter can be boosted by cosmic-ray-dark matter interactions, which opens the possibility of direct-detection searches with large neutrino detectors. We consider the signal produced by boosted dark matter undergoing quasi-elastic scattering off carbon and knocking out a neutron in a large liquid scintillator detector. A distinctive delayed gamma ray from neutron capture can be reconstructed after $\\sim 210$ $μ$s, which is paired up with the prompt signal during neutron propagation. We find that 100 kt$\\cdot$yr of data from the neutron-coincidence channel will be able to probe new parameter space compared to free proton signals found in previous work. We further consider the possibility of utilizing directional information from the displaced vertex associated with the capture of the final-state neutron. However, we find that directional information does not materially improve the sensitivity due to the large nucleon scattering angle.","authors":"Samuel S. H. Tse, Qishan Liu, Kenny C. Y. Ng, Koun Choi, Yu-Feng Li","nlinked":80,"nref":91,"src":"INSPIRE","html":true},{"id":"3219356","arxiv":"2610.36030","title":"A Practical Guide to Sensitivity Projections for Beyond the Standard Model Physics","first":"Acanfora","nauth":5,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[2900461]]. Closest of your papers: [[2751074]] (coupling 0.02, 1 shared references). Closest network paper: [[3204120]] (coupling 0.09, 6 shared references). Shared topics: dark sector.","score":23.6,"rank":8,"section":"new","parts":[0.45,0.07,0.26,0.0,0.17],"abstract":"Statistics is a well-established discipline, yet its application can be confusing, particularly in fields where the language of statistics is unfamiliar and when making projections, where real data is not yet available. Both of these factors are commonplace in Beyond the Standard Model physics. In this work, we clarify the distinction between goodness-of-fit tests, which assess the compatibility of an observation with a single hypothesis, and hypothesis tests, which quantify how strongly some data prefer one hypothesis over another. We emphasise that for Beyond the Standard Model sensitivity projections, hypothesis testing should be used. We give detailed examples using both Poisson and multinomially distributed data, deriving exact $p$-values and discussing Monte Carlo and asymptotic approximations. We further demonstrate that for the Asimov data set all the test statistics discussed, for both goodness-of-fit tests and hypothesis tests, can be approximated by Pearson's $χ^2$ statistic, and the difference in approaches comes down to the distribution of the test statistics. We also compare goodness-of-fit and hypothesis test $p$-values in two realistic examples. We (1) consider the reach of a muon collider on heavy spin-1 resonances and (2) provide updated projections for the potential of current and future gamma ray telescopes to probe new dark sectors via the observation of Hawking radiation from the explosion of a black hole. Finally, we discuss the CLs method, the significance and systematic errors.","authors":"Francesca Acanfora, Michael J. Baker, Joaquim Iguaz Juan, Aidan Symons, Andrea Thamm","nlinked":34,"nref":61,"src":"INSPIRE","html":true},{"id":"3219311","arxiv":"2610.36003","title":"Elastic Scattering of Dirac Dark Matter with Charged Leptons through a Scalar Mediator: Analytical Framework, Numerical Stability, and Direct-Detection Bounds","first":"Xuan","nauth":2,"year":2026,"cites":0,"role":"today","note":"Also cites widely used network papers: [[2817040]], [[1518747]]. Closest of your papers: [[2856850]] (coupling 0.08, 7 shared references). Closest network paper: [[3170413]] (coupling 0.16, 7 shared references). Shared topics: yukawa interaction, dark matter model, dark matter.","score":22.9,"rank":9,"section":"new","parts":[0.11,0.25,0.47,0.0,0.44],"abstract":"We investigate a leptophilic simplified dark matter model in which a Dirac fermion χinteracts with Standard Model charged leptons \\ll through a real scalar mediator S. Starting from the low-energy Yukawa interaction Lagrangian in the fermion mass eigenbasis, we derive closed-form tree-level analytical expressions for the invariant scattering amplitude, the spin-averaged squared matrix element, and the differential and total elastic cross sections. To overcome the numerical loss of significance that arises when evaluating the standard antiderivative difference in the heavy-mediator regime, we rearrange the phase-space integral into positive-definite recoil contributions supplemented by convergent power-series expansions. This analytical formulation smoothly connects the light-mediator and heavy-mediator regimes without relying on Effective Field Theory (EFT) contact approximations, allowing us to establish quantitative validity criteria for the contact limit. Finally, we map the microscopic differential cross section onto the reference electron-scattering cross section and evaluate the resulting coupling constraints using experimental data from SENSEI, DAMIC, SuperCDMS, XENON10, and XENON1T.","authors":"Nguyen Nhu Xuan, Vu Toan Thang","nlinked":25,"nref":28,"src":"INSPIRE","html":true},{"id":"3219591","arxiv":"2610.37638","title":"Weighing dark matter particles with gravitational waves","first":"Vicente","nauth":4,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[2795517]]. Closest of your papers: [[2964960]] (coupling 0.02, 3 shared references). Closest network paper: [[2791814]] (coupling 0.05, 4 shared references). Shared topics: dark matter particle, dark matter.","score":22.9,"rank":10,"section":"cross","parts":[0.45,0.06,0.14,0.0,0.31],"abstract":"It is commonly assumed that the mass of dark matter particles cannot be determined from their gravitational effects when dark matter behaves as collisionless matter. Here we show that extreme-mass-ratio inspirals observable by millihertz gravitational-wave observatories such as the Laser Interferometer Space Antenna (LISA) could measure the mass of ultralight dark matter particles in sufficiently dense dark matter spikes. The separation of scales between the two black holes allows ultralight dark matter to form a collisionless density spike around the massive primary while retaining wave effects in its interaction with the stellar-mass companion. We incorporate wave-dependent accretion and dynamical friction into relativistic inspiral waveforms and jointly infer the dark matter particle mass, spike normalisation and binary parameters from simulated LISA signals. For massive black holes at the low-mass end of the LISA population ($M\\sim 10^5 M_\\odot$), our forecasts show that particle masses spanning $10^{-14}-10^{-11}\\,\\mathrm{eV}$ could be measured to within an order of magnitude.","authors":"Rodrigo Vicente, Francisco Duque, Theophanes K. Karydas, Gianfranco Bertone","nlinked":59,"nref":62,"src":"INSPIRE","html":true},{"id":"3212882","arxiv":"2610.11088","title":"Probing CP violation in dark scalar decays at the SHiP experiment","first":"Aoki","nauth":2,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[1678642]]. Closest of your papers: [[3146383]] (coupling 0.03, 2 shared references). Closest network paper: [[3084653]] (coupling 0.10, 20 shared references).","score":22.7,"rank":11,"section":"replacement","parts":[0.45,0.09,0.28,0.0,0.0],"abstract":"We investigate CP violation in the decays of a GeV-scale dark scalar boson into mesons, muons and photons. Both scalar and pseudoscalar couplings to the SM fermions are considered to study how the CP structure of the dark scalar boson can be probed through its decays. The scalar and pseudoscalar interactions predominantly induce decays into two-meson and three-meson final states, respectively. We propose the simultaneous observation of these two classes of decay modes as a probe of CP violation in the dark scalar sector. The expected signal rates at the SHiP and FASER2 experiments are evaluated based on the dark scalar production from heavy-meson decays. We find that the ratio of three-meson to two-meson decay events at SHiP has the potential to probe a wide range of the CP-violating parameter space for dark scalar masses around the GeV scale. We also show that the two-muon and di-photon channels can provide complementary information for the CP violation search.","authors":"Mayumi Aoki, Takashi Shimomura","nlinked":52,"nref":56,"src":"INSPIRE","html":true},{"id":"3219319","arxiv":"2610.36004","title":"Relativistic Elastic Scattering of Cosmic-Ray Boosted Dirac Dark Matter with Charged Leptons through a Scalar Mediator","first":"Xuan","nauth":2,"year":2026,"cites":0,"role":"today","note":"Also cites widely used network papers: [[2817040]], [[1518747]]. Closest of your papers: [[2856850]] (coupling 0.07, 7 shared references). Closest network paper: [[2772591]] (coupling 0.19, 13 shared references). Shared topics: dark matter particle, dark matter.","score":21.3,"rank":12,"section":"new","parts":[0.11,0.2,0.55,0.0,0.3],"abstract":"We investigate the relativistic kinematics, spinor-recoil structure, and direct-detection phenomenology of a Dirac dark matter fermion interacting with SM charged leptons through a real scalar mediator within a low-energy effective Lagrangian in the fermion mass basis. Standard halo direct-detection searches lose sensitivity for sub-MeV dark matter, because the maximum recoil energy falls below detector thresholds. When halo dark matter particles are upscattered to relativistic energies by galactic cosmic-ray electrons (CRE), the momentum transfer in both the astrophysical upscattering stage and the terrestrial detection stage can exceed the fermion mass scales. By decomposing the tree-level $t$-channel cross section into three positive-definite contributions, we separate the static-numerator contribution from the linear and quadratic momentum-transfer spinor-recoil contributions, evaluated via convergent power series that reduce subtractive cancellation at small momentum transfer. For incident large kinetic energies, the spinor-recoil contributions become comparable to and begin to exceed $σ_0$; at substantially higher energies, they enhance the total cross section by several orders of magnitude relative to the static-numerator approximation. Furthermore, retaining the dynamical scalar propagator yields a high-energy cross section that decreases as $1/s$ and satisfies $s$-wave helicity partial-wave unitarity, in contrast to the linear $\\mathcal{O}(s/m_S^4)$ growth of the contact approximation. Applying the exact differential recoil spectra within an effective propagation model for cosmic-ray electron boosted dark matter (CRE-BDM), we derive $90\\%$ C.L. exclusion bounds in the 1 keV -- 10 MeV mass range from Super-Kamiokande, XENONnT, and PandaX-4T, extending experimental sensitivity into the sub-MeV window.","authors":"Nguyen Nhu Xuan, Vu Toan Thang","nlinked":30,"nref":33,"src":"INSPIRE","html":true},{"id":"3219569","arxiv":"2610.37541","title":"On-shell Mass Renormalisation and RG-improved Effective Potential in Vector-like Lepton Models","first":"Daberstiel","nauth":4,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[1993049]]. Closest of your papers: [[1365306]] (coupling 0.01, 1 shared references). Closest network paper: [[2664140]] (coupling 0.10, 18 shared references).","score":20.5,"rank":13,"section":"new","parts":[0.45,0.02,0.28,0.0,0.0],"abstract":"We discuss the on-shell mass renormalisation in a class of six vector-like lepton (VLL) extensions of the Standard Model with seesaw-like contributions to the SM lepton masses. The schemes absorb large radiative corrections to the SM lepton masses arising from mixing between the SM and VLLs with up to $5\\times5$ mixing matrices and allows for efficient computation of observables and the low-scale $\\overline{\\text{MS}}$ values of model parameters. We determine and solve the redundancy-free 2-loop renormalisation-group (RG) equations, compute the RG-improved effective potential and study the vacuum instability scales of each of the VLL models. We find rich phase behaviour and parameter regions that show instability scales as low as $10^5$ GeV as well as regions where the one-loop corrections to the input parameters can lead to a stable vacuum.","authors":"Gregor Daberstiel, Kilian Möhling, Dominik Stöckinger, Hyejung Stöckinger-Kim","nlinked":76,"nref":76,"src":"INSPIRE","html":true},{"id":"3219369","arxiv":"2610.36161","title":"Asymmetric Reheating of a Dark Sector","first":"Cosme","nauth":3,"year":2026,"cites":0,"role":"today","note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1679809]] (coupling 0.07, 3 shared references). Closest network paper: [[3213062]] (coupling 0.16, 23 shared references). Shared topics: dark sector, dark matter.","score":17.6,"rank":14,"section":"new","parts":[0.06,0.2,0.45,0.0,0.28],"abstract":"We study asymmetric post-inflationary reheating in a framework with two sequestered MSSM-like sectors (the ``visible'' and ``dark'' sectors) with different supersymmetry-breaking scales, with dark matter corresponding to the lightest dark baryons. In this setup, independent Affleck-Dine dynamics in the two sectors offers a natural explanation for the comparable abundances of visible and dark matter. We relate the resulting temperature hierarchy to the inflaton's partial decay widths in different kinematical regimes, where it may decay into dark sector particles via 2-, 3- or 4-body processes. The latter case yields the most asymmetric reheating scenario, and we discuss the implications of this regime for the dark sector's thermal history, namely regarding the corresponding strong and weak interactions. While in this kinematical regime the contribution of light dark sector degrees of freedom to $ΔN_{\\rm eff}$ is negligible, we show that it increases significantly in the regime where 3-body decays are possible, particularly near the threshold for dark Higgs pair-production where $ΔN_{\\rm eff}^{\\max} \\simeq 0.078$. The current combined BBN+CMB+BAO bound leaves only a narrow allowed interval of the 2-body decay regime immediately above threshold, while next-generation CMB experiments could probe slightly below it.","authors":"Catarina Cosme, João G. Rosa, Inês Sequeira","nlinked":69,"nref":69,"src":"INSPIRE","html":true},{"id":"3183185","arxiv":"2607.22102","title":"Updated E141 constraints on a long-lived $X_{17}$ vector boson","first":"Celentano","nauth":3,"year":2026,"cites":0,"role":"repl","note":"Closest of your papers: [[3146383]] (coupling 0.04, 3 shared references). Closest network paper: [[3115042]] (coupling 0.23, 15 shared references). Shared topics: minimal model, dark sector.","score":17.0,"rank":15,"section":"replacement","parts":[0.0,0.11,0.65,0.0,0.37],"abstract":"Since its first observation by the ATOMKI experiment in 2018, the $\\rm ^*Be$ anomaly has attracted considerable interest within the dark sector community as it may indicate the existence of a new fundamental particle with a mass of about 16.9 MeV, the $X_{17}$. However, the minimal model describing $X_{17}$ as a new vector boson is severely constrained by null results from legacy beam-dump experiments. Among these, the E141 experiment at SLAC places stringent limits on the $X_{17}$ coupling to electrons $\\varepsilon_e$ in the $5.1\\times10^{-5}\\lesssim \\varepsilon_e\\lesssim1.7\\times10^{-4}$ region. This excludes the possibility of a long-lived $X_{17}$, potentially in contrast with the preliminary estimate of the particle lifetime recently reported by the ATOMKI collaboration. The E141 limits commonly adopted in the literature rely on reinterpretations of the original analysis under solid but simplifying assumptions. While these studies provide a reliable estimate of the experiment's reach, they rely on approximations that were well justified when the boson mass was largely unconstrained. With the $X_{17}$ mass now confined to a narrow region by recent experimental observations, a more refined treatment of the E141 sensitivity becomes necessary. In this work, we revisit the E141 exclusion limits in the $X_{17}$ scenario by performing a dedicated reanalysis that incorporates a more accurate treatment of the experimental setup and signal prediction. We quantify the impact of these refinements on the excluded parameter space and discuss their implications for the compatibility between the E141 constraints and the vector boson interpretation of the ATOMKI anomalies.","authors":"A. Celentano, A. Marini, L. Marsicano","nlinked":51,"nref":56,"src":"INSPIRE","html":true},{"id":"3187139","arxiv":"2608.02498","title":"Axion Inflation: Perturbative control in the strong backreaction regime","first":"Domcke","nauth":4,"year":2026,"cites":0,"role":"today","note":"Closest of your papers: [[1955022]] (coupling 0.01, 1 shared references). Closest network paper: [[3183493]] (coupling 0.42, 30 shared references).","score":15.9,"rank":16,"section":"cross","parts":[0.0,0.03,1,0.0,0.0],"abstract":"We study the strong backreaction regime in axion inflation, in which the friction from Abelian gauge fields generated via the pseudo-scalar interaction $\\fracβ{4 M_p} φF {\\tilde F}$ is comparable to Hubble friction. The non-linear dynamics associated with the gauge fields render this regime phenomenologically particularly interesting, but also notoriously difficult to study with perturbative methods. Quantifying the perturbative control through the direct impact on the spectral backreaction using (i) a first-order gradient-expansion formalism including axion gradients, and (ii) a one-loop in-in calculation, we discover an extended mild backreaction regime at large couplings $β$, with a relatively large, nearly constant particle production parameter $ξ$. In passing, we point out that CMB non-Gaussianity bounds impose a general upper limit on the product of axion gauge field coupling and Hubble parameter during inflation, $βH/M_p < 1.4\\cdot 10^{-3}$, independently of the choice of the axion potential.","authors":"Valerie Domcke, Alexandros Papageorgiou, Marco Peloso, Stefan Sandner","nlinked":59,"nref":59,"src":"INSPIRE","html":true},{"id":"3215611","arxiv":"2610.21886","title":"Low-Scale See-Saw Mechanism and the Majorana Nature of Heavy Neutrinos","first":"Okawa","nauth":2,"year":2026,"cites":0,"role":"repl","note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1249404]] (coupling 0.06, 7 shared references). Closest network paper: [[3072051]] (coupling 0.11, 12 shared references). Shared topics: neutrino mass.","score":15.4,"rank":17,"section":"replacement","parts":[0.06,0.18,0.31,0.0,0.33],"abstract":"We investigate the possibility to determine the Majorana nature of the heavy Majorana neutrinos present in the low-scale type I seesaw mechanism of neutrino mass generation in experiments at $e^+ \\text{-} e^-$ and $μ^+ \\text{-} μ^-$ colliders. This is done on the examples of two specific symmetry-protected seesaw scenarios with two right-handed (RH) singlet neutrinos and one seesaw realization with three RH neutrinos. We use the forward-backward symmetry in the angular distribution of the heavy neutral leptons produced in the $e^+ \\text{-} e^-$ and $μ^+ \\text{-} μ^-$ collisions as an indicator of their Majorana nature. Our results indicate that the experiments at FCCee during its first phase of operation have a remarkable potential not only to discover the heavy neutral leptons associated with the type I seesaw mechanism if they have masses smaller than the $Z^0$-boson mass, but also to probe and provide evidence for their Majorana nature.","authors":"Takuya Okawa, S. T. Petcov","nlinked":56,"nref":58,"src":"INSPIRE","html":true},{"id":"3219367","arxiv":"2610.36163","title":"A GOOFy Three Higgs Doublet Model","first":"Varzielas","nauth":3,"year":2026,"cites":0,"role":"today","note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1402978]] (coupling 0.01, 2 shared references). Closest network paper: [[2972436]] (coupling 0.15, 27 shared references). Shared topics: scalar doublet.","score":13.9,"rank":18,"section":"new","parts":[0.06,0.04,0.44,0.0,0.41],"abstract":"Recent developments in two-Higgs doublet models identified regions of parameter space which are renormalization-group invariant to all orders of perturbation theory but cannot be described by any of the known symmetries of those models. These were dubbed GOOFy symmetries, as they involve scalar doublets and their complex conjugates transforming independently, and imaginary scaling of spacetime coordinates is needed to ensure invariance of kinetic terms. We build a three-Higgs doublet model with a GOOFy symmetry including extensions to the fermion sector. We prove renormalization group invariance through a direct calculation of the model's beta functions and analyse the corresponding phenomenology. The model is shown to be compatible with current LHC observations, displaying interesting features which may be probed in the near future.","authors":"I. de Medeiros Varzielas, P. M. Ferreira, S. Oliveira","nlinked":81,"nref":88,"src":"INSPIRE","html":true},{"id":"3217445","arxiv":"2610.29942","title":"PBR sensitivity to boosted dark matter explanation for the KM3-230213A event","first":"Reno","nauth":121,"year":2026,"cites":0,"role":"repl","note":"Closest of your papers: [[1597138]] (coupling 0.01, 2 shared references). Closest network paper: [[2905773]] (coupling 0.20, 21 shared references). Shared topics: dark matter scenario, dark matter.","score":13.3,"rank":19,"section":"replacement","parts":[0.0,0.03,0.57,0.0,0.39],"abstract":"POEMMA-Balloon with Radio (PBR) is a hybrid fluorescence and optical Cherenkov telescope that is a pathfinder instrument for a future Probe Of Extreme Multi-Messenger Astrophysics (POEMMA), together with a radio instrument, to be flown on a super pressure balloon in Spring 2028. One of its science objectives is follow up of astrophysical event alerts via signals of tau decays in the atmosphere, sourced by Earth-skimming tau neutrinos. The recent report of the KM3NeT Collaboration's muon event with $ E_μ=120^{+110}_{-60}$ PeV sparked searches for beyond the standard model (BSM) physics explanations. Using a specific, boosted dark matter scenario which together with the KM3NeT observation, sets a scale for the fluence of boosted dark matter in this energy range, we assess the capabilities of PBR to constrain or discover such a source for a boosted dark matter energy spectrum above $\\sim 10^8$ GeV. PBR has discovery potential for dark matter energies above $10^9$ GeV, and depending on BSM input parameters, to dark matter energies as low as $1.5\\times 10^8$ GeV. While the analysis is focused on one BSM example, the methodology is applicable to any BSM physics that affects tau production in the Earth.","authors":"M. H. Reno, T. Venters, M. Abrate, J. Adams, J. Alfaro, D. Allard, P. Alldredge, R. Aloisio, R. Ammendola, A. Anastasio, L. Anchordoqui, D. Badoni, J. Baláž, B. Baret, M. Battisti, R. Bellotti, M. Bertaina, M. Betts, S. Blin, M. Boezio, P. Bořil, I. Buckland, J. Burton Heibges, F. Cafagna, R. Caruso, M. Casolino, K. Černý, B. Chamanbahar, N. Cordrey, A. Creusot, A. Cummings, C. De Santis, P. Degarate, N. DeWitt Pierrat, A. Di Giovanni, A. Di Salvo, B. J. DiLella, J. Eser, S. Ferrarese, G. Filippatos, J. Ford, N. Gagalis, P. Gálvez Molina, S. Garbolino, D. Garg, R. Gargiulo, B. Gockel, A. Grelle, C. Guépin, A. Haungs, T. Heibges, J. Hinkel, A. K. Ikehara, J. Krizmanic, L. Kupari, E. H. Lenzing, F. Liberatori, S. Mackovjak, D. Mandát, M. Manfrin, A. Marcelli, L. Marcelli, G. Masciantonio, V. Masone, E. Mayotte, A. Meli, E. Mentzell, M. Mese, S. Meyer, M. Mignone, M. Miller, M. Mongelli, J. Moses, E. Msihid, R. Munini, M. Murdock, A. Novikov, A. V. Olinto, Y. Onel, G. Osteria, B. Panico, E. Parizot, G. Passeggio, T. Paul, M. Pech, K. Peñaló Castillo, F. Perfetto, C. Petta, P. Picozza, L. Piotrowski, Z. Plebaniak, H. Qureshi, E. Reali, F. Reynaud, E. Ricci, M. Ricci, A. Rivetti, A. Roy, F. Sarazin, V. Scherini, P. Schovánek, F. Schroeder, V. Scotti, A. Sotgiu, R. Sparvoli, B. Stillwell, I. Strhárský, J. Szabelski, Y. Takizawa, R. Torres, R. Triggiani, C. Trimarelli, J. Tutt, M. Unger, M. Venugopal, P. von Ballmoos, D. Washington, A. Weindl, L. Wiencke, S. Wissel, A. Yuan","nlinked":109,"nref":119,"src":"INSPIRE","html":true},{"id":"3219430","arxiv":"2610.36591","title":"Warm inflation beyond the Gaussian limit: primordial black holes and induced gravitational waves","first":"Gangopadhyay","nauth":2,"year":2026,"cites":0,"role":"today","note":"Closest of your papers: [[2790381]] (coupling 0.02, 4 shared references). Closest network paper: [[2753529]] (coupling 0.15, 6 shared references). Shared topics: primordial black hole.","score":11.9,"rank":20,"section":"cross","parts":[0.0,0.07,0.44,0.0,0.33],"abstract":"In warm inflation, the primordial fluctuations are driven by random kicks from a hot radiation bath. Two features of these kicks matter: how long the bath remembers them, which shapes the power spectrum, and how their strengths are spread, which controls the rare, extreme fluctuations. In this paper, we investigate how primordial black holes and the accompanying induced gravitational waves can be used to discriminate between these two features. We use a simple model inspired by warm inflation, in which independent kicks of random strength add up to a narrow peak in the power spectrum. At leading order, the induced gravitational wave depends only on the power spectrum and is therefore insensitive to how the kicks are distributed. However, the black holes are very sensitive to these rare large fluctuations. Hence, two baths can yield the same gravitational wave signal while forming black holes at very different rates. A modest kurtosis range of 0.1 to 0.3 enhances black-hole formation by factors of ten to a million at fixed gravitational-wave amplitude, the larger factors for the rarer black holes. Counting peaks rather than all points, or widening the spectrum, lowers the enhancement by at most a factor of about four. In general a change in the power affects both phenomena, while the kurtosis affects only the black hole production.","authors":"Mayukh R. Gangopadhyay, Nilanjana Kumar","nlinked":65,"nref":79,"src":"INSPIRE","html":false},{"id":"3174484","arxiv":"2606.28481","title":"Background-Induced Forces from Quadratically Coupled Ultralight Dark Matter","first":"Bouley","nauth":4,"year":2026,"cites":0,"role":"repl","note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1955022]] (coupling 0.01, 2 shared references). Closest network paper: [[3089716]] (coupling 0.09, 13 shared references). Shared topics: scalar dark matter, dark matter.","score":11.4,"rank":21,"section":"replacement","parts":[0.06,0.03,0.25,0.0,0.46],"abstract":"Quadratically coupled ultralight scalar dark matter behaves as a coherent classical field whose interactions with matter can induce a composition-dependent force through the dark matter background. We present a complete calculation of this background-induced force beyond the spherically symmetric approximation. Using a partial-wave treatment of dark-matter scattering, we determine its angular dependence and derive an analytic description valid even when the dark-matter wavelength is much smaller than the Earth's radius. We show for the first time that Earth screening generates a characteristic frequency-band structure, splitting the signal into multiple sidebands that provide a distinctive experimental signature. We further show that the relative amplitudes of these sidebands vary annually as the satellite's Sun-synchronous orbital plane precesses in step with the Earth's revolution around the Sun, allowing us to construct a complete signal template. As an application of these results, we re-evaluate constraints from the MICROSCOPE mission, which currently provides the strongest laboratory limits on equivalence-principle violations from ultralight dark matter. We further show that proposed space-based equivalence-principle experiments, such as Galileo Galilei and STE-QUEST, can significantly enhance their sensitivity to ultralight scalar dark matter by incorporating the full frequency-band information.","authors":"Thomas Bouley, Xucheng Gan, Hailin Xu, Tien-Tien Yu","nlinked":163,"nref":188,"src":"INSPIRE","html":true},{"id":"2839003","arxiv":"2410.08195","title":"Unusual portals to new exotics, the $W$-gluon portal","first":"Carpenter","nauth":2,"year":2026,"cites":0,"role":"repl","note":"Closest of your papers: [[1663960]] (coupling 0.08, 2 shared references). Closest network paper: [[2630211]] (coupling 0.08, 5 shared references). Shared topics: standard model particle.","score":11.2,"rank":22,"section":"replacement","parts":[0.0,0.2,0.22,0.0,0.2],"abstract":"We explore models where new light exotic (LEX) states interact with the Standard Model (SM) through the $W$-gluon portal, an asymmetric di-boson portal. The complete set of effective operators up to dimension six which couple a single LEX state to at least one $W$ boson and one gluon is considered. Other Standard Model particles may also be present in the interactions. We show that the $W$-gluon portal allows us to access a large array of exotic states in non-trivial representations of SU(3)$_\\text{c}$ and SU(2)$_\\text{L}$. New single production collider modes and phenomenological signatures for these light exotic states at the LHC and $ep$ colliders are discussed.","authors":"Linda M. Carpenter, Katherine Schwind","nlinked":37,"nref":45,"src":"INSPIRE","html":true},{"id":"3219544","arxiv":"2610.37308","title":"Nonradial oscillation modes of axion condensed neutron stars in the Cowling approximation","first":"Gómez-Bañón","nauth":3,"year":2026,"cites":0,"role":"today","note":"Closest of your papers: [[1941263]] (coupling 0.07, 9 shared references). Closest network paper: [[1625119]] (coupling 0.08, 7 shared references).","score":10.1,"rank":23,"section":"new","parts":[0.0,0.22,0.23,0.0,0.0],"abstract":"In light QCD axion models, finite-density corrections to the axion potential can source a nonvanishing axion field inside neutron stars. Extending our previous analysis of radial oscillations, we study the nonradial ($l=2$) oscillation spectrum of such axion condensed neutron stars in the relativistic Cowling approximation, keeping the fluid and axion perturbations fully coupled and dynamical. The condensate modifies the fluid spectrum in two ways: the altered equilibrium structure raises the $f$- and $p$-mode frequencies by up to $\\sim20\\%$, while the dynamical coupling to the axion field partially compensates this shift, almost entirely for the $f$-mode. Fluid modes with frequencies above the axion mass acquire a new damping channel through axion emission. The $f$-mode remains below this threshold for all configurations supporting a condensate, whereas the $p$-modes are damped on timescales that can be as short as $\\sim10$ ms, shorter than their gravitational-wave damping times, except for certain axion masses where the outgoing axion amplitude nearly vanishes. The spectrum also contains a family of strongly damped axion-dominated quasinormal modes, with imaginary parts of order kHz, and a sequence of gravitationally bound axion states analogous to gravitational atom levels. Below the propagation threshold, the bound $p$-modes undergo avoided crossings with these levels, exchanging their fluid- and axion-dominated character.","authors":"Antonio Gómez-Bañón, Pantelis Pnigouras, José A. Pons","nlinked":31,"nref":37,"src":"INSPIRE","html":true},{"id":"1937352","arxiv":"2110.00005","title":"Detailed calculation of primordial black hole formation during first-order cosmological phase transitions","first":"Baker","nauth":4,"year":2021,"cites":87,"role":"other","note":"","score":null},{"id":"1863581","arxiv":"2105.07481","title":"Primordial black holes from first-order cosmological phase transitions","first":"Baker","nauth":4,"year":2021,"cites":145,"role":"other","note":"","score":null},{"id":"2817040","arxiv":"","title":"Review of particle physics","first":"Navas","nauth":244,"year":2024,"cites":6528,"role":"other","note":"","score":null},{"id":"731108","arxiv":"hep-ph/0611082","title":"Lepton masses and mixing without Yukawa hierarchies","first":"Ponce","nauth":2,"year":2006,"cites":14,"role":"seed","note":"","score":null},{"id":"3130296","arxiv":"2603.16863","title":"New benchmarks for direct detection of freeze-in dark matter in vector portal models","first":"Cerdeño","nauth":4,"year":2026,"cites":3,"role":"seed","note":"","score":null},{"id":"1895232","arxiv":"2107.13588","title":"New opportunities for axion dark matter searches in nonstandard cosmological models","first":"Arias","nauth":6,"year":2021,"cites":52,"role":"other","note":"","score":null},{"id":"3146383","arxiv":"2604.15541","title":"Probing inelastic sub-GeV dark matter at the DUNE near detector","first":"Betancur","nauth":3,"year":2026,"cites":1,"role":"seed","note":"","score":null},{"id":"1655573","arxiv":"1802.05713","title":"Simple no-scale model of modulus fixing
