,[25,33,"c"],[88,85,"c"],[107,87,"c"],[55,33,"c"],[1,77,"k"],[67,105,"c"],[56,25,"c"],[40,105,"c"],[56,48,"c"],[17,25,"c"],[94,33,"c"],[5,96,"k"],[7,97,"k"],[100,24,"c"],[109,55,"c"],[19,98,"k"],[2,99,"k"],[3,100,"k"],[77,99,"c"],[3,101,"c"],[109,25,"c"],[39,40,"c"],[88,56,"c"],[20,75,"k"],[89,63,"c"],[17,102,"k"],[74,87,"c"],[1,33,"c"],[5,103,"k"],[13,104,"k"],[8,69,"k"],[23,24,"c"],[65,25,"c"],[70,72,"c"],[8,25,"c"],[8,49,"k"],[21,105,"k"],[48,77,"c"],[5,106,"k"],[8,90,"k"],[48,28,"c"],[54,72,"c"],[10,107,"k"],[13,108,"k"],[3,109,"k"],[65,55,"c"],[18,110,"k"],[54,33,"c"],[79,33,"c"],[95,55,"c"],[2,55,"c"],[16,111,"k"],[1,112,"k"],[16,113,"k"],[75,92,"c"],[5,25,"c"],[89,74,"c"],[48,99,"c"]],"next":[{"arxiv":"2610.37318","id":"3219528","title":"High significance measurement of reactor coherent elastic neutrino-nucleus scattering on germanium by CONUS+","authors":"N. Ackermann, H. Bonet, C. Buck, J. Hakenmüller, G. Heusser, M. Lindner, W. Maneschg, M. Meier, S. Mertens, D. Piani, M. Rank, T. Rink, E. Sánchez García, Y. Shi, L. Schönfeld, I. Stalder, H. Strecker, J. Wendel, J. Woenckhaus","score":9.0,"section":"cross","rank":24,"parts":[0.06,0.09,0.28,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[3130296]] (coupling 0.03, 3 shared references). Closest network paper: [[3095306]] (coupling 0.10, 6 shared references).","abstract":"We report the most precise measurement to date of coherent elastic neutrino-nucleus scattering (CE$ν$NS) from reactor antineutrinos using the CONUS+ high-purity germanium detectors at the Leibstadt nuclear power plant. With an exposure of 1296 kg$\\cdot$days reactor-on, a blind likelihood analysis yields $1555 \\pm 152$ CE$ν$NS events, with a significance of 10.2 $σ$, in agreement with the Standard Model expectation of $1701 \\pm 198$ events within 0.6 standard deviations. The result also determines the weak mixing angle at a momentum transfer of about 10 MeV, $\\sin^2θ_W = 0.225 \\pm 0.022$, consistent with the Standard Model prediction."},{"arxiv":"2610.36044","id":"3219312","title":"An open EFT for dark matter searches with matter-wave interferometers","authors":"Leonardo Badurina, Kathryn M. Zurek","score":8.5,"section":"new","rank":25,"parts":[0.0,0.05,0.08,0.0,0.59],"note":"Closest of your papers: [[2794409]] (coupling 0.02, 2 shared references). Closest network paper: [[2795517]] (coupling 0.03, 27 shared references). Shared topics: mass below, dark sector, dark matter.","abstract":"Matter-wave interferometers (MWIs) are a genuine quantum probe of dark matter (DM), being sensitive to DM-induced phase shifts and loss of contrast. Treating the interferometer as an open quantum system and the dark sector as its environment, we derive an open EFT to study these signatures using the Schwinger-Keldysh formalism. Starting from a microscopic theory, we derive the interferometer's effective action, which we then project onto the many-body worldline sectors relevant for atom interferometers and MWIs employing mesoscopic objects, i.e., composite-particle interferometers (CPIs). This construction clarifies the heavy-probe limit and organizes phase shifts and decoherence as distinct real-time components of the influence action: the retarded kernel controls the causal response of the environment, while the Keldysh kernel controls environmental fluctuations and hence loss of contrast. At leading order, these kernels reduce to: (i) DM bubble diagrams in the case of four-point interactions, and (ii) dressed in-medium mediator propagators in the case of long-range interactions, where the dressing is provided by the DM environment. Within this framework, we study the signatures of elastic spin-independent sub-GeV DM scattering off nucleons and find that: (i) owing to Bose enhancements below the DM wave-particle boundary, ambitious CPIs could probe Higgs-portal DM with mass below 1 eV in an unexplored region of model space; (ii) for DM coupled to nucleons via a light hadrophilic scalar, the DM background can drive the mediator's in-medium mass tachyonic over much of parameter space; outside these regions, CPIs could probe provide powerful probes of light DM."},{"arxiv":"2610.36611","id":"3219436","title":"Quark mixing and CP violation due to torsional interaction","authors":"Arnab Chakraborty, Amitabha Lahiri","score":8.5,"section":"new","rank":26,"parts":[0.06,0.06,0.31,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[3094526]] (coupling 0.02, 3 shared references). Closest network paper: [[2966158]] (coupling 0.11, 5 shared references).","abstract":"The dynamics of fermions in spacetime generates torsion, ultimately leading to a current-current interaction independent of gravity. This torsional four-fermion interaction is generically chiral and non-universal and may have observable consequences. Furthermore, the fermion basis in which this torsional interaction is diagonal may be different from the mass basis and the flavor basis. We work out the structure of the quark sector, where new CKM-like matrices appear as a result of diagonalizing the torsional interaction. CP violation is modified in general due to the appearance of additional phases. We also consider various processes which are affected by it such as kaon decays in particular and show that even when the torsional interaction is taken to be diagonal in the flavor basis, flavor-changing processes are still affected due to the non-universality of the torsional coupling constants. Finally, we discuss rephasing invariants in the presence of the torsional interaction and show how the Jarlskog invariant is modified even when the torsion basis is aligned with the flavor basis."},{"arxiv":"2610.36160","id":"3219381","title":"How particle physics stops ultra-relativistic bubbles and shapes their gravitational waves","authors":"Alessandro Strumia","score":8.0,"section":"new","rank":27,"parts":[0.0,0.06,0.4,0.0,0.02],"note":"Closest of your papers: [[1854224]] (coupling 0.02, 1 shared references). Closest network paper: [[3198665]] (coupling 0.14, 8 shared references).","abstract":"The gravitational-wave spectrum produced by ultra-relativistic bubbles in a first-order cosmological phase transition can be approximated in terms of their energy density as a function of bubble size. Bubble collisions and post-collision classical evolution negligibly change it. The dominant energy loss is particle scattering, often in the Landau--Pomeranchuk--Migdal regime. So the GW spectrum depends on the particle-physics coupling (interpolating between the `envelope' and `bulk flow' limits), on the interaction type (gauge, Yukawa, scalar quartic, ...), and on whether particle number is conserved. Finally, we consider broken global symmetries, which give a mixture of `elastic' and `inelastic' collisions."},{"arxiv":"2610.37039","id":"3219469","title":"Constraining New Physics by Studying Single Top Quark Production","authors":"Maryam Roknabadi, Saeid Paktinat Mehdiabadi, Seyed Mohammad Reza Tabatabaei","score":7.6,"section":"new","rank":28,"parts":[0.06,0.11,0.15,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1854224]] (coupling 0.04, 2 shared references). Closest network paper: [[860420]] (coupling 0.05, 2 shared references).","abstract":"This study introduces a beyond the Standard Model framework by adding a charged scalar particle, H_c, analogous to the charged Higgs in the Two-Higgs-Doublet Model (2HDM), but analyzed without the restrictive constraints typically applied in 2HDM scenarios. To assess the impact of H_c on single top quark production, two approaches are taken. First, variations in the production cross-section via the s- and t-channels are examined under different values of the model parameters, compared to the SM predictions. Second, spin correlations are analyzed, focusing on differences in the spin of the mediated particle between the new model and SM in the single top quark production via the s-channel. Within the framework of the simplified phenomenological model considered here, a significant fraction of the parameter space can be constrained by combining the two approaches."},{"arxiv":"2610.36062","id":"3219366","title":"Late reheating in the era of precision cosmology","authors":"Kensuke Akita, Oleksii Ihnatenko, Maksym Ovchynnikov","score":7.5,"section":"new","rank":29,"parts":[0.0,0.1,0.16,0.0,0.2],"note":"Closest of your papers: [[1941263]] (coupling 0.03, 7 shared references). Closest network paper: [[2967474]] (coupling 0.06, 4 shared references). Shared topics: neutrino mass.","abstract":"We study the minimum cosmic reheating temperature allowed by recent measurements of primordial nuclear abundances and of the cosmic microwave background. We find that reheating by decays of a light particle into electrons and neutrinos is compatible with both at temperatures around 0.4 MeV, an order of magnitude below the bound for purely electromagnetic channels. This scenario has implications for cosmology and laboratory searches. For example, nearly standard neutrino radiation can coexist with a smaller active neutrino mass density at unchanged physical masses, by up to a factor of five for normal ordering. The weaker suppression of clustering changes matter power at the percent level, which forthcoming galaxy surveys and lensing measurements may probe. Late reheating also suppresses sterile neutrino production at mixings within the projected reach of laboratory experiments."},{"arxiv":"2610.36780","id":"3219442","title":"Probing Charged Higgs Bosons through $H^\\pm \\to W^\\pm A$ Decay in the Type-I Two-Higgs Doublet Model","authors":"Abdesslam Arhrib, Mohamed Krab, Tanmoy Mondal, Prasenjit Sanyal","score":7.5,"section":"new","rank":30,"parts":[0.0,0.13,0.24,0.0,0.0],"note":"Closest of your papers: [[3094526]] (coupling 0.04, 10 shared references). Closest network paper: [[2134261]] (coupling 0.08, 11 shared references).","abstract":"A light pseudoscalar lighter than the 125 GeV Higgs boson remains allowed within the type-I Two-Higgs Doublet Model (2HDM), consistent with current collider constraints, including Higgs signal strength measurements and direct searches for additional Higgs bosons. At the Large Hadron Collider (LHC), the light pseudoscalar $A$ can be pair-produced through the undetected decay of the Standard Model-like Higgs boson, $h_{125} \\to AA$, when this channel is kinematically accessible (i.e., $m_A < m_{h_{125}}/2$). For the charged scalar $H^\\pm$, once open, the bosonic decay channel $H^\\pm \\to W^{\\pm(*)} A$ naturally dominates over the fermionic $H^\\pm \\to τ^\\pmν$ and $H^\\pm \\to tb$ channels, while relaxing the existing $H^\\pm$ limits. As a result, we propose searching for the charged Higgs boson through $H^\\pm \\to W^{\\pm(*)} A$ in the $4b+2j+\\ellν$ final state. This channel is particularly sensitive to moderate-to-large $\\tanβ$ values and provides an excellent complementary probe to searches based on fermionic $H^\\pm$ decays at the LHC. Our collider analysis demonstrates that this channel can probe a substantial region of the type-I 2HDM parameter space at the high-luminosity LHC."},{"arxiv":"2508.19358","id":"2964321","title":"Axions and Axion-like particles: collider searches","authors":"Anke Biekötter, Ken Mimasu","score":7.3,"section":"replacement","rank":31,"parts":[0.0,0.1,0.29,0.0,0.0],"note":"Closest of your papers: [[1597138]] (coupling 0.03, 8 shared references). Closest network paper: [[2617409]] (coupling 0.10, 21 shared references).","abstract":"We give an overview of collider searches for Axion-like particles (ALPs). The intention of this review is to give a pedagogical introduction to collider phenomenology of ALPs, and provide a starting point for newcomers, including suitable references to deepen their knowledge. We motivate how ALPs arise from the breaking of approximate global symmetries and describe their interactions across different scales in an effective field theory framework. We further review the dominant production and decay channels for ALPs at high-energy hadron and lepton colliders as well as indirect ways to probe their interactions via precision measurements of Standard Model processes."},{"arxiv":"2610.37210","id":"3219515","title":"Exclusive production of doubly charmed baryon pair at B Factories","authors":"Xiao Liang, Jun Jiang, Chun-Yuan Li, Meng-Li Liu, Xing-Hua Yang, Zong-Guo Si","score":7.2,"section":"new","rank":32,"parts":[0.06,0.02,0.04,0.0,0.41],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2964960]] (coupling 0.01, 1 shared references). Closest network paper: [[3178456]] (coupling 0.01, 2 shared references). Shared topics: detection prospect.","abstract":"The exclusive production of doubly charmed baryon pairs $Ξ_{cc}+\\barΞ_{cc}$ via $e^+e^-$ annihilation at B factories are calculated in the framework of non-relativistic QCD (NRQCD). The total cross sections, theoretical uncertainties, differential distributions and event yields for the BaBar and Belle II experiments are systematically discussed. According to our study, the detection prospects for both experiments are unfavorable."},{"arxiv":"2610.36902","id":"3219454","title":"Nucleon decays into three leptons plus a kaon","authors":"Jin-Han Liang, Xiao-Dong Ma, Xiang Zhao","score":7.1,"section":"new","rank":33,"parts":[0.06,0.04,0.25,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1222142]] (coupling 0.01, 1 shared references). Closest network paper: [[2053590]] (coupling 0.09, 13 shared references).","abstract":"We systematically investigate baryon-number-violating (BNV) nucleon decays into three leptons and a kaon within the framework of low-energy effective field theory (LEFT). We identify all kinematically allowed four-body decay modes involving a $K^+$ or $K^0$ meson and derive their decay widths induced by local dimension-9 operators in terms of the LEFT Wilson coefficients. These results are obtained by classifying the relevant operators, which contain three lepton and three quark fields, including one strange quark, according to their transformation properties under the chiral symmetry group, matching them onto chiral perturbation theory. By reanalyzing existing experimental data, we establish stringent bounds on the partial lifetimes of these four-body decay modes and derive corresponding constraints on the dimension-9 Wilson coefficients. Our results provide a convenient EFT framework for connecting the underlying BNV interactions to experimental searches for these exotic nucleon decays."},{"arxiv":"2508.12392","id":"2961741","title":"Stringy Constraints on Modular Flavor Models","authors":"Keiya Ishiguro, Takafumi Kai, Tatsuo Kobayashi, Hajime Otsuka","score":6.8,"section":"replacement","rank":34,"parts":[0.0,0.07,0.32,0.0,0.0],"note":"Closest of your papers: [[1655573]] (coupling 0.03, 2 shared references). Closest network paper: [[2762216]] (coupling 0.11, 27 shared references).","abstract":"We investigate stringy constraints on moduli spaces in modular flavor models by analyzing moduli-dependent threshold corrections in heterotic string vacua. While moduli play a crucial role in determining the flavor structure of fermions predicted by modular flavor models, the parameter space in which their vacuum expectation values are allowed has not been fully explored. In this work, within the framework of perturbative heterotic string theory on toroidal orbifolds, we derive constraints on the moduli space and study their systematic behavior. We characterize the stringy constraints in terms of the dilaton, the beta-function coefficients, and the ratio between a complex-structure modulus and a Kähler modulus. It is found that the large value of the modulus controlling the flavor structure, i.e., $τ\\simeq i \\infty$, is inconsistent within perturbative string theory, and the self-dual point $τ=i$ is also disfavored in the large volume regime of toroidal backgrounds. In addition, we discuss the phenomenological implications of these stringy constraints."},{"arxiv":"2503.23741","id":"2906211","title":"Classification of Modular Symmetries in Non-Supersymmetric Heterotic String theories","authors":"Shuta Funakoshi, Yuichi Koga, Hajime Otsuka","score":6.6,"section":"replacement","rank":35,"parts":[0.0,0.0,0.25,0.0,0.29],"note":"Closest network paper: [[2762216]] (coupling 0.09, 14 shared references). Shared topics: turn out.","abstract":"We study modular symmetries in non-supersymmetric heterotic string theories on toroidal backgrounds with Wilson line modulus, constructed by stringy Scherk-Schwartz compactification. In particular, we focus on a subgroup of the T-duality group $O(D+16,D,\\mathbb{Z})$ with $D=2$ given by an outer automorphism of the Narain lattice, which can be mapped to the Siegel modular group $\\mathrm{Sp}(4,\\mathbb{Z})$. We classify the modular symmetries and a $CP$-like symmetry on $T^2$ and its orbifolds with symmetric and asymmetric orbifold twists. It turns out that the non-supersymmetric heterotic string theories only enjoy a part of modular symmetries in contrast to supersymmetric ones. Furthermore, the gauge symmetry is maximally enhanced at fixed points of modular symmetries on $T^2$ on which we analyze the vacuum structure of eight-dimensional tachyon-free vacua."},{"arxiv":"2608.00758","id":"3186365","title":"Aspects of the quantization of non-linear electrodynamics in an uniform magnetic background","authors":"M. J. Neves","score":6.5,"section":"replacement","rank":36,"parts":[0.0,0.0,0.31,0.0,0.18],"note":"Closest network paper: [[3164308]] (coupling 0.11, 5 shared references). Shared topics: complex scalar.","abstract":"The canonical and path integral quantization for non-linear electrodynamics in the presence of an external electromagnetic (EM) field are proposed in this work. The EM background field is introduced expanding a general lagrangian of a generic non-linear electrodynamics around the background for small fluctuations of the propagating fields, where we consider up to the quadratic terms in the propagating fields. As consequence, we obtain an electrodynamics linearized by the presence of the external EM field. Thereby, we study the canonical quantization calculating the energy for the ground state of the linearized EM field in terms of an external magnetic field. The microcausality of the model also is discussed through the Pauli-Jordan function. We also define a generating functional for the linearized EM field, in which, in the Coulomb gauge, the Green function of the model is obtained, and we can construct the perturbative formalism like in standard quantum field theory (QFT). As application of the perturbation theory, the effective potential at one loop is calculated for the linearized EM field coupled to a complex scalar field. We apply the results in the case of the Modified Maxwell ED."},{"arxiv":"2510.05198","id":"3064179","title":"Intrinsically Quantum Effects of Axion Dark Matter are Undetectable","authors":"Yunjia Bao, Dhong Yeon Cheong, Nicholas L. Rodd, Joey Takach, Lian-Tao Wang, Kevin Zhou","score":6.1,"section":"replacement","rank":37,"parts":[0.0,0.11,0.1,0.0,0.13],"note":"Closest of your papers: [[1597138]] (coupling 0.04, 6 shared references). Closest network paper: [[2691930]] (coupling 0.04, 6 shared references). Shared topics: dark matter.","abstract":"Is the usual treatment of axion dark matter as a classical field reliable? We show that the answer is subtle: the axion field could well be in a quantum state that has no complete classical description, but realistic detectors cannot tell the difference. To see this, we solve a fully quantum model of axion detection using quantum optics techniques. We show that intrinsically quantum effects are washed out by mode averaging or small amounts of noise, and significantly suppressed by the weakness of the axion coupling. Our work exemplifies that there should always be a classical analog for axion dark matter effects, extends to other wave (ultralight) dark-matter candidates, and gives a general method to compute the effects of exotic dark-matter states."},{"arxiv":"2610.27068","id":"3216791","title":"ASTROLABE: A 3D Particle-Level Surrogate for Cosmology Simulation with Physical Flow Matching","authors":"Ibrahim Elsharkawy, David Curtin, Yonatan Kahn, Neal Weiner","score":6.0,"section":"cross","rank":38,"parts":[0.0,0.03,0.16,0.0,0.28],"note":"Closest of your papers: [[860906]] (coupling 0.01, 1 shared references). Closest network paper: [[2719600]] (coupling 0.06, 6 shared references). Shared topics: dark sector, dark matter.","abstract":"The microphysics of dark matter (DM) is imprinted on cosmological structure across an enormous dynamic range. Nonlinear cosmological observables are most reliably modeled with N-body and hydrodynamic simulations. However, systematic N-body scans over DM theory space are prohibitively expensive. Machine learning emulators provide a possible solution, but are currently limited by either low resolution or only the ability to emulate specific observables. We introduce Astrolabe, a flow-matching-based generative emulator designed to be free of both constraints. Astrolabe acts directly on the 6N phase-space coordinates of N individual particles. With no voxel grid in the output, there is no voxel-resolution ceiling, and in principle any observable can be measured from inference. Astrolabe is computationally tractable via a field-particle hybrid transformer in which every particle cross-attends to multiscale field tokens, so compute and memory are linear in N. Astrolabe incorporates physical flow matching by taking the prior distribution for the flow to be approximate COmoving Lagrangian Acceleration (COLA)-based coordinates rather than unphysical noise, with momentum and mass conservation enforced at all points along flow time. In the Lambda-CDM cases we test, Astrolabe produces realistic fields with accurate power spectra, halo mass functions, velocity profiles, and halo density profiles. We also observe out-of-distribution generalization, with accurate emulation of dark-acoustic oscillation initial conditions. Astrolabe is also capable of being fine-tuned to simulate very large N and we demonstrate this by emulating a TNG50-3-dark simulation at a fraction of the cost. This method represents a first step toward a general and powerful cosmology simulation surrogate, which may eventually permit the inclusion of baryonic physics and a systematic exploration of richer dark sector interactions."},{"arxiv":"2606.18248","id":"3169253","title":"Pushing the Primordial Frontier: Exact Linear Solutions in Multifield Inflation","authors":"Javier Huenupi, Claudio Muñoz, Gonzalo A. Palma, Spyros Sypsas","score":5.6,"section":"replacement","rank":39,"parts":[0.0,0.13,0.11,0.0,0.0],"note":"Closest of your papers: [[1655573]] (coupling 0.05, 7 shared references). Closest network paper: [[2737356]] (coupling 0.04, 10 shared references).","abstract":"We present exact analytic solutions for the linear dynamics of a two-field inflationary system in which the primordial curvature perturbation $ζ$ is coupled to an isocurvature perturbation $σ$ of entropy mass $μ$. The solutions are valid for arbitrary values of $μ$ and the dimensionless interaction strength $λ$. They therefore provide analytic control over the strong mixing regime in which $ζ$ interacts with light isocurvature fields, commonly associated with rapid-turn inflation. As a first application, we derive the amplitude of the primordial power spectrum in closed form, obtaining an expression that interpolates between the weakly mixed, strongly mixed, light-field, and heavy-field regimes. These results open the way to analytic studies of multifield observables beyond the power spectrum, including non-Gaussianity, particle production, and loop corrections."},{"arxiv":"2606.18349","id":"3169586","title":"Ghosts versus Unstable Particles in Quantum Field Theory","authors":"Luca Buoninfante","score":5.5,"section":"replacement","rank":40,"parts":[0.0,0.0,0.37,0.0,0.0],"note":"Closest network paper: [[3202452]] (coupling 0.13, 6 shared references).","abstract":"We elucidate the physical nature of ghosts above the multi-particle threshold by contrasting them with unstable particles in quantum field theory. We first consider the asymptotic formulation, where ordinary positive-norm one-particle states can be unstable and decay, whereas ghosts survive asymptotically without decaying, yet admit no particle interpretation due to interference with the multi-particle component which masks the negative-norm one-particle state. This distinction originates from two different analytic structures of the dressed propagator, whose complex conjugate poles lie on the first or second Riemann sheet in the ghost or ordinary case, respectively. Ghost resonances are, in principle, phenomenologically distinguishable from ordinary ones, being narrower and exhibiting weaker interference between positive- and negative-energy peaks. We then formulate the quantum field theory in a finite interval of time and, working within a suitable approximation for the dressed propagator, find that finite-time effects amplify differences in the resonant behavior and give rise to new features, such as higher peaks in ghost resonances. Distinct temporal regimes are also identified: for times shorter than the inverse width, an approximate free-particle description is valid; at later times interactions and interference dominate, leading to decay or multi-particle masking. This study supports the absence of freely propagating ghost particles in the asymptotic limit."},{"arxiv":"2610.35947","id":"3219314","title":"Clock--WEP Tests of String-Derived Dilaton and Modulus Sectors","authors":"Ahmed Farag Ali","score":5.2,"section":"new","rank":41,"parts":[0.0,0.1,0.14,0.0,0.0],"note":"Closest of your papers: [[2751074]] (coupling 0.03, 2 shared references). Closest network paper: [[2821768]] (coupling 0.05, 2 shared references).","abstract":"String compactifications and runaway-dilaton models can contain light scalar directions. Motion along these directions changes gauge couplings, the QCD scale, quark masses, and Yukawa parameters. A given string-derived sector then predicts low-energy slopes. Its gauge kinetic functions, matter-metric or Yukawa slopes, source charge, scalar trajectory, and scalar range determine a Damour--Donoghue weak-equivalence-principle (WEP) vector and a clock-drift vector. The fit assumes one long-range scalar or an aligned multi-field direction. With that assumption, WEP tests and secular clock drifts probe related projections of the same scalar-slope vector. The minimal two-charge Damour--Donoghue fit uses Ti--Pt MICROSCOPE, Be--Ti torsion-balance, and $^{85}$Rb--$^{87}$Rb atom-interferometer data, then adds the Yb$^+$ E3/E2 secular $α$-drift row. The WEP-only fit gives $D_{\\hat m}=(-6.06\\pm34.91)\\times10^{-12}$ and $D_e=(8.80\\pm46.46)\\times10^{-12}$, with correlation $-0.99958$. The clock input is $\\dotα/α=1.0(1.1)\\times10^{-18}\\,{\\rm yr}^{-1}$. It matches the WEP marginal reach when $|ζ|=2.37\\times10^{-8}\\,{\\rm yr}^{-1}$, with $ζ=\\dot\\varphi/α_E$. For the benchmark $\\dot\\varphi=ξH_0$ and $α_E=10^{-3}α_0$, this gives $ξ/α_0\\simeq0.34$. A model becomes testable after it supplies $r=D_{\\hat m}/D_e$, the scalar amplitude, and $ζ$. The Damour--Piazza--Veneziano runaway-dilaton estimate lies near $η\\sim10^{-12}$ for order-unity $n=2$ parameters, well above the MICROSCOPE-level WEP scale. In the representative-isotope two-charge model, a MICROSCOPE-level Be--Ti-like row would reduce the long WEP axis by a factor $27.8$; a repeated Ti--Pt-like row would barely change it. The calculation tests compactification-level predictions for string-derived dilaton or modulus sectors after the model supplies its low-energy data."},{"arxiv":"2610.37137","id":"3219282","title":"What the Primary Lund Plane Omits: A Model-Stitching Diagnosis of a Jet-Tagger Representation Gap","authors":"Saurabh Rai, Sanmay Ganguly","score":4.7,"section":"new","rank":42,"parts":[0.0,0.05,0.22,0.0,0.0],"note":"Closest of your papers: [[1455793]] (coupling 0.02, 1 shared references). Closest network paper: [[3172592]] (coupling 0.08, 3 shared references).","abstract":"Lund-plane and Particle Transformer (ParT) jet taggers can differ in performance because one representation is weaker, or because a weaker downstream computation reads an adequate one. Standalone performance cannot separate these. Model stitching can: it links the frozen early layers of one network to the frozen late layers of another through a single trained linear map. As a positive control we use an incomplete Lund representation, the primary declustering branch, whose deficit is known independently. Stitched into ParT's downstream, it reaches a background rejection at least as much as its own downstream recovers, yet far below ParT's background rejection: the deficit is representational, not computational. A hypergraph reader over splitting triplets does no better, ruling out higher-order correlations as the cause. The gap is invisible in AUC, which stays within 1\\% of its target value, and appears only in background rejection at low signal efficiency. It localizes to 0.6\\% of background jets, at and above the top mass, with more constituents but fewer primary splittings than typical background. Rebuilding the representation on the full Cambridge/Aachen declustering tree repairs the deficit as predicted: standalone rejection rises, closing 72\\% of the gap. Masking nodes at inference shows the repaired network still relies almost entirely on the primary branch; the secondary splittings make the representation learnable rather than supplying information it reads. Along the primary branch, the widest-angle splitting, near the top and $W$ opening angles, is worth nearly twice a random one. For quark/gluon tagging the primary branch is far less deficient, retaining 77.6\\% of ParT's rejection (46.9\\% for top), and the full tree closes only 33\\% of the gap (72\\% for top)."},{"arxiv":"2610.37627","id":"3219586","title":"Using Higgs Boson Production in Association with Three Jets via Gluon Fusion at the LHC to Investigate the CP Properties of the Higgs Boson","authors":"Arunima Bhattacharya, Francisco Campanario, Michael Kubocz, Terrance Figy, Tunde Kushimo, Ivan Rosario","score":4.6,"section":"new","rank":43,"parts":[0.0,0.1,0.1,0.0,0.0],"note":"Closest of your papers: [[3094526]] (coupling 0.03, 5 shared references). Closest network paper: [[2183252]] (coupling 0.04, 4 shared references).","abstract":"A neutral Higgs boson $Φ$ with general scalar and pseudoscalar couplings and accompanying jets can be efficiently produced via gluon fusion through heavy-quark loops in high-energy hadronic collisions. We present integrated cross sections and kinematic distributions for the production of a generic Higgs boson $Φ$ in association with three jets, $pp \\to Φjjj$, at order $α_{s}^{5}$. We include the full mass dependence of the top- and bottom-quark loop contributions, combined coherently so that their interference is retained. Earlier finite-mass calculations of $Φ+3$ jets with bottom-quark loops and $CP$-odd or $CP$-mixed couplings were restricted to $gg \\to gggΦ$; we include the complete set of partonic subprocesses, and find that the quark-containing channels supply close to one half of the pseudoscalar three-jet cross section at $\\tanβ=1$. In a Type-II two-Higgs-doublet model the bottom-quark loop comes to dominate the rate as $\\tanβ$ is increased, so that the cross section is non-monotonic in $\\tanβ$. Comparing against the heavy-top effective theory and its form-factor-improved version, we show that the effective description fails in the hard tails of the transverse-momentum and dijet-mass distributions, while the third-jet centrality $z^\\star$ and the rapidity separation of the two leading jets are largely insensitive to the heavy-quark treatment. We further study the multi-jet azimuthal correlation $Φ_{2}$, built from the jet momenta on the two sides of the Higgs boson in rapidity, and find that the bottom-quark contribution modifies its shape even for a state of definite $CP$. For a $CP$-mixed state the interference of the two couplings adds a $\\sin2Φ_2$ term, which a simple counting asymmetry isolates and which no $CP$ eigenstate can produce. Numerical results are presented for the LHC at $\\sqrt{s}=13.6~$TeV and $m_Φ=125.2~$GeV."}],"refs":{"1249404":{"first":"Restrepo","year":2013,"nauth":3,"title":"Models with radiative neutrino masses and viable dark matter candidates","role":"seed"},"1679809":{"first":"Reig","year":2018,"nauth":4,"title":"Bound-state dark matter with Majorana neutrinos","role":"seed"},"3172592":{"first":"Li","year":2026,"nauth":3,"title":"Disentangling Dark Gauge Symmetries with Deep Learning on the Lund Jet Plane","role":"other"},"2966158":{"first":"Lee","year":2025,"nauth":2,"title":"Stochastic gravitational waves of torsion from the viewpoint of four-fermion effective theory","role":"other"},"2690106":{"first":"Cárcamo Hernández","year":2023,"nauth":4,"title":"Effective Interactions for the SM Fermion Mass Hierarchy and their Possible UV Realization","role":"seed"},"2630211":{"first":"Cepedello","year":2023,"nauth":4,"title":"SMEFT goes dark: Dark Matter models for four-fermion operators","role":"other"},"3095306":{"first":"Duque","year":2025,"nauth":3,"title":"Uncertainties in the neutrino fog: Studying the isospin-violating dark matter case","role":"other"},"1663960":{"first":"Reig","year":2018,"nauth":4,"title":"Bound-state dark matter and Dirac neutrino masses","role":"seed"},"1854224":{"first":"Calle","year":2021,"nauth":3,"title":"Phenomenology of the Zee model for Dirac neutrinos and general n ":{"first":"Paul","year":2024,"nauth":3,"title":"Thermal leptogenesis, dark matter, and gravitational waves from an extended canonical seesaw scenario","role":"other"},"3146383":{"first":"Betancur","year":2026,"nauth":3,"title":"Probing inelastic sub-GeV dark matter at the DUNE near detector","role":"seed"},"2957941":{"first":"Qiu","year":2025,"nauth":3,"title":"A new source of phase transition gravitational waves: heavy particle braking across bubble walls","role":"other"},"3198665":{"first":"Mukaida","year":2026,"nauth":2,"title":"Gravitational Waves from Reheating beyond Instantaneous Thermalization","role":"other"},"3178456":{"first":"Darricau","year":2026,"nauth":2,"title":"Revisiting cLFV in \"T1-2-A\" scotogenic models: asymmetries in three-body lepton decays","role":"other"},"1869725":{"first":"Yaguna","year":2021,"nauth":2,"title":"Two-component scalar dark matter in Z$_{2n}$ scenarios","role":"seed"},"3204120":{"first":"Mondal","year":2026,"nauth":5,"title":"Vanilla Scotogenic Model at the future Muon Collider","role":"other"},"2856850":{"first":"Bernal","year":2024,"nauth":3,"title":"Probing low-reheating scenarios with minimal freeze-in dark matter","role":"seed"},"2642079":{"first":"Garcia","year":2023,"nauth":3,"title":"Isocurvature constraints on scalar dark matter production from the inflaton","role":"other"},"1863581":{"first":"Baker","year":2021,"nauth":4,"title":"Primordial black holes from first-order cosmological phase transitions","role":"other"},"3170413":{"first":"Goudelis","year":2026,"nauth":4,"title":"Freeze-in at all couplings","role":"other"},"1993049":{"first":"Jana","year":2021,"nauth":3,"title":"Flavor seesaw mechanism","role":"other"},"1955022":{"first":"Carvajal","year":2021,"nauth":4,"title":"Singlet fermion dark matter and Dirac neutrinos from Peccei-Quinn symmetry","role":"seed"}},"meta":{"date":"Wednesday, 28 October 2026","url":"https://arxiv.org/catchup/hep-ph/2026-10-28","cat":"hep-ph","year":2026,"built":"2026-10-28","topics":true,"nown":63,"next":828,"onInspire":95,"threshold":10.0,"nrel":23,"nlist":95,"counts":{"new":45,"cross":14,"replacement":36},"below":[{"arxiv":"2610.37318","title":"High significance measurement of reactor coherent elastic neutrino-nucleus scattering on germanium by CONUS+","score":9.0},{"arxiv":"2610.36044","title":"An open EFT for dark matter searches with matter-wave interferometers","score":8.5},{"arxiv":"2610.36611","title":"Quark mixing and CP violation due to torsional interaction","score":8.5},{"arxiv":"2610.36160","title":"How particle physics stops ultra-relativistic bubbles and shapes their gravitational waves","score":8.0},{"arxiv":"2610.37039","title":"Constraining New Physics by Studying Single Top Quark Production","score":7.6},{"arxiv":"2610.36062","title":"Late reheating in the era of precision cosmology","score":7.5}]}};
const M = RAW.meta;
const N = RAW.n.map((a,i)=>({i,...a,out:[],inn:[]}));
const E = RAW.e.map(([s,t,k])=>({s,t,k}));
E.forEach(e=>{N[e.s].out.push(e.t);N[e.t].inn.push(e.s)});
N.forEach(n=>n.deg=n.out.length+n.inn.length);
const ROLE={today:'Listing: new or cross-list',repl:'Listing: replacement',seed:'Your paper',other:'Network paper (other authors)'};
const RANK={today:0,repl:1,seed:2,other:3};
const SEC={new:'New',cross:'Cross-list',replacement:'Replacement'};
const col=n=>`var(--${n.role})`;
const isNew=n=>n.role==='today'||n.role==='repl';
const r=n=>isNew(n)?4+n.score/9:2.6+1.5*Math.log10(1+n.cites)+(n.role==='seed'?1:0);
const auth=n=>n.first+(n.nauth>2?' et al.':n.nauth===2?' + 1':'');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const plain=s=>String(s).replace(/\$/g,'').replace(/\\([a-zA-Z]+)/g,'$1').replace(/[{}^_]/g,'');
const REFS=RAW.refs||{};
// reasons text: [[INSPIRE id]] becomes 'Author Year' with a pop-up (authors, year, title), like the graph's tooltip
const why=s=>esc(s).replace(/\[\[(\d+)\]\]/g,(m,k)=>{const r=REFS[k];return r?`<span class="ref ${r.role}" tabindex="0" data-ref="${k}">${esc(r.first)} ${r.year}</span>`:m});
const tex=el=>{if(window.MathJax&&MathJax.typesetPromise)MathJax.typesetPromise([el]).then(()=>fold()).catch(()=>{})};
const NEWS=N.filter(isNew).sort((a,b)=>a.rank-b.rank);
document.getElementById('eyebrow').innerHTML=`arXiv ${esc(M.cat)} · <a href="${esc(M.url)}" target="_blank" rel="noopener">${esc(M.date)}</a>`;
document.getElementById('dek').textContent=`${M.nrel} of the ${M.nlist} papers in this listing (${M.counts.new} new, ${M.counts.cross} cross-lists, ${M.counts.replacement} replacements) score ${M.threshold} or more for belonging to the reference and citation network of your ${M.nown} papers and the ${M.next} papers by other authors around them. Highest score first.`;
const T=!!M.topics;   // network file with shared phrases: 35/30/15/10 + 10% shared topics
document.getElementById('foot').innerHTML=`<p><b>Score (0–100).</b> ${T?35:40}% direct citations of network papers (each of your papers counts 1, each other network paper 0.6, network papers with over 1,000 citations 0.06; saturating as 1 − e<sup>−x</sup>); ${T?30:35}% bibliographic coupling with your own papers (idf-weighted cosine of INSPIRE-linked reference sets, best match and mean of the top three, 0.30 = full marks); 15% best coupling with the other network papers (0.35 = full marks); 10% authorship (you, or your co-authors)${T?`; 10% shared topics: technical phrases of two or more words in the title and abstract that your papers and the network use much more often than hep-ph as a whole (each weighted by how much more, saturating as 1 − e<sup>−x/3</sup>)`:''}.</p>
<p><b>Data.</b> Network: INSPIRE records supplied with the project. Listing papers: INSPIRE records where already harvested (${M.onInspire} of ${M.nlist}); for the rest the reference list was read from the arXiv source and matched to INSPIRE by arXiv number, DOI and texkey. Only links between papers on this page are drawn. Built ${esc(M.built)}.</p>`;
const P=['Direct citations','Coupling to your papers','Coupling to network','Authorship','Shared topics'];
const PS=['Citations','Your papers','Network','Authors','Topics'];   // short labels for phones
function list(){const box=document.getElementById('list');
  if(!NEWS.length){box.innerHTML=`<div class="empty">No paper in this listing reaches a score of ${M.threshold}.</div>`;document.getElementById('mainnet').hidden=true;return}
  NEWS.forEach(n=>{const d=document.createElement('article');d.className='paper';d.id='p'+n.i;
    d.innerHTML=`<div class="role" style="color:${col(n)}">#${n.rank} · ${esc(SEC[n.section])} · score ${n.score.toFixed(1)}</div>
    <h2>${esc(n.title)}</h2>
    <div class="authors">${authors(n.authors)} · arXiv:${esc(n.arxiv)}</div>
    <p class="abs">${esc(n.abstract)}</p><button class="linkbtn absmore" type="button" hidden>More</button>
    <p class="why">${why(n.note)}</p>
    <div class="row"><div class="bars">${n.parts.map((v,j)=>`<span><span class="pl">${P[j]}</span><span class="ps">${PS[j]}</span> <span class="mb"><i style="width:${Math.round(v*100)}%"></i></span></span>`).join('')}</div><span>${n.nlinked} of ${n.nref} references linked to INSPIRE · refs from ${esc(n.src)}</span></div>
    <div class="links">${n.id?`<a href="https://inspirehep.net/literature/${n.id}" target="_blank" rel="noopener">INSPIRE</a>`:''}<a href="https://arxiv.org/abs/${esc(n.arxiv)}" target="_blank" rel="noopener">arXiv</a><a href="https://arxiv.org/pdf/${esc(n.arxiv)}" target="_blank" rel="noopener">PDF</a>${n.html?`<a href="https://arxiv.org/html/${esc(n.arxiv)}" target="_blank" rel="noopener" title="arXiv's experimental HTML version">HTML</a>`:''}<button class="linkbtn graphbtn" type="button">Show in network</button></div>`;
    d.querySelector('.graphbtn').addEventListener('click',()=>pick(n,true));
    d.querySelector('.absmore').addEventListener('click',e=>{const o=d.classList.toggle('open');e.target.textContent=o?'Less':'More'});
    box.appendChild(d)});
  toc();tex(box)}
// Phones: long author lists show the first 3 and "et al." (tap to expand); abstracts fold to 3 lines with More.
function authors(s){const a=String(s||'').split(', ');if(a.length<=3)return esc(s);
  return `<span class="au-short">${esc(a.slice(0,3).join(', '))} <button class="aubtn" type="button" aria-label="Show all ${a.length} authors">et al. (+${a.length-3})</button></span><span class="au-full">${esc(s)}</span>`}
document.addEventListener('click',e=>{const b=e.target.closest('.aubtn');if(b)b.closest('.authors').classList.add('open')});
function fold(){document.querySelectorAll('.paper').forEach(d=>{const p=d.querySelector('.abs'),b=d.querySelector('.absmore');
  if(!p||!b||d.classList.contains('open'))return;b.hidden=!(p.scrollHeight>p.clientHeight+2)})}
function toc(){const t=document.getElementById('toc');if(!NEWS.length)return;t.hidden=false;
  const X=RAW.next||[];
  t.innerHTML=`<h3>In this listing</h3><ol>${NEWS.map(n=>`<li><a href="#p${n.i}"><span class="sc${n.role==='repl'?' repl':''}">${n.score.toFixed(0)}</span><span class="tt">${esc(n.title)}</span></a></li>`).join('')}${X.length?`<li class="more-link"><a href="#more"><span class="sc">+${X.length}</span><span class="tt">The next ${X.length} papers by score (folded)</span></a></li>`:''}</ol>`;
  const m=t.querySelector('.more-link a');if(m)m.addEventListener('click',()=>{document.getElementById('more').open=true});tex(t)}
let sel=NEWS[0]||null, hover=null, query='', G;
const svg=d3.select('#svg'), tip=document.getElementById('tip');
function draw(){
  if(!NEWS.length)return;
  const RNG=d3.randomLcg(11);
  const W=Math.max(300,document.getElementById('chart').clientWidth), H=W<600?500:480, m={l:16,r:16,t:20,b:34};
  svg.attr('viewBox',`0 0 ${W} ${H}`); svg.selectAll('*').remove();
  const yrs=d3.extent(N,n=>n.year);
  const x=d3.scaleLinear().domain([yrs[0]-.5,yrs[1]+1.2]).range([m.l+8,W-m.r-8]);
  const ticks=x.ticks(W<600?6:12).filter(t=>Number.isInteger(t)&&t<=yrs[1]);
  svg.append('g').attr('class','grid').selectAll('line').data(ticks).join('line').attr('x1',d=>x(d)).attr('x2',d=>x(d)).attr('y1',m.t).attr('y2',H-m.b);
  svg.append('g').attr('class','axis').attr('transform',`translate(0,${H-m.b})`).call(d3.axisBottom(x).tickValues(ticks).tickFormat(d3.format('d')).tickSizeOuter(0));
  const cy=(m.t+H-m.b)/2, xf=n=>isNew(n)?x(yrs[1]+.75):x(n.year);
  const sim=N.map(n=>({n,x:xf(n)+(RNG()-.5)*4,y:cy+(RNG()-.5)*H*.5}));
  const links=E.map(e=>({source:sim[e.s],target:sim[e.t],s:e.s,t:e.t,k:e.k}));
  d3.forceSimulation(sim).force('x',d3.forceX(s=>xf(s.n)).strength(1)).force('y',d3.forceY(cy).strength(.04))
    .force('link',d3.forceLink(links).strength(.03)).force('charge',d3.forceManyBody().strength(-40))
    .force('col',d3.forceCollide(s=>r(s.n)+2)).stop().tick(320);
  sim.forEach(s=>{s.y=Math.max(m.t+8,Math.min(H-m.b-8,s.y));s.x=Math.max(m.l+4,Math.min(W-m.r-4,s.x))});
  G=svg.append('g');
  G.append('g').selectAll('path').data(links).join('path').attr('class',l=>'edge '+l.k)
    .attr('d',l=>{const a=l.source,b=l.target;return `M${a.x},${a.y}Q${(a.x+b.x)/2},${(a.y+b.y)/2-Math.abs(a.x-b.x)*.12} ${b.x},${b.y}`});
  G.append('g').selectAll('circle').data([...sim].sort((a,b)=>RANK[b.n.role]-RANK[a.n.role])).join('circle')
    .attr('class','node').attr('cx',s=>s.x).attr('cy',s=>s.y).attr('r',s=>r(s.n)).attr('fill',s=>col(s.n))
    .on('pointerenter',(ev,s)=>{hover=s.n;showTip(ev,s.n);paint()}).on('pointermove',(ev,s)=>showTip(ev,s.n))
    .on('pointerleave',()=>{hover=null;tip.hidden=true;paint()}).on('click',(ev,s)=>pick(s.n,false));
  const lab=sim.filter(s=>isNew(s.n)||s.n.role==='seed'||s.n.deg>=3);
  const L=lab.map(s=>{const right=s.x>W*.8,t=isNew(s.n)?`#${s.n.rank} ${s.n.first}`:`${s.n.first} ${s.n.year}`,w=t.length*6.2;return{s,t,right,x0:right?s.x-r(s.n)-4-w:s.x+r(s.n)+4,w,y:s.y+4}}).sort((a,b)=>a.y-b.y);
  const placed=[];L.forEach(l=>{let k=0;while(k<40&&placed.some(p=>l.x0<p.x0+p.w&&p.x0<l.x0+l.w&&Math.abs(l.y-p.y)<13)){l.y+=13*(k%2?-1:1)*(1+Math.floor(k/2));k++;l.y=Math.max(m.t+10,Math.min(H-m.b-4,l.y))}placed.push(l)});
  G.append('g').selectAll('text').data(L).join('text').attr('class','nlabel').attr('x',l=>l.right?l.s.x-r(l.s.n)-4:l.s.x+r(l.s.n)+4).attr('y',l=>l.y)
    .attr('text-anchor',l=>l.right?'end':'start').text(l=>l.t);
  paint();
}
function showTip(ev,n){const b=document.getElementById('chart').getBoundingClientRect();tip.hidden=false;tip.textContent=`${auth(n)} (${n.year}) — ${plain(n.title)}`+(isNew(n)?` · score ${n.score}`:'');
  let L=ev.clientX-b.left+12;if(L>b.width-290)L=ev.clientX-b.left-290;tip.style.left=Math.max(4,L)+'px';tip.style.top=(ev.clientY-b.top+12)+'px'}
function paint(){if(!G)return;const f=hover||sel,on=new Set();if(f){on.add(f.i);f.out.forEach(i=>on.add(i));f.inn.forEach(i=>on.add(i))}
  svg.classed('dim',!!f);
  G.selectAll('path.edge').attr('class',l=>'edge '+l.k+(!f?'':l.s===f.i?' hot out':l.t===f.i?' hot in':''));G.selectAll('path.edge.hot').raise();
  G.selectAll('circle').classed('on',s=>on.has(s.n.i)).classed('sel',s=>sel&&s.n.i===sel.i).classed('match',s=>query&&`${s.n.first} ${s.n.title} ${s.n.arxiv} ${s.n.authors||''}`.toLowerCase().includes(query));
  G.selectAll('text.nlabel').classed('on',l=>on.has(l.s.n.i))}
function panel(){const p=document.getElementById('panel'),n=sel;
  if(!n){p.innerHTML='<p>Select a paper in the network.</p>';return}
  const links=`<div class="links">${n.id?`<a href="https://inspirehep.net/literature/${n.id}" target="_blank" rel="noopener">INSPIRE</a>`:''}${n.arxiv?`<a href="https://arxiv.org/abs/${esc(n.arxiv)}" target="_blank" rel="noopener">arXiv</a>`:''}</div>`;
  if(isNew(n)) p.innerHTML=`<div class="role" style="color:${col(n)}">#${n.rank} · ${esc(SEC[n.section])} · score ${n.score.toFixed(1)}</div><h4>${esc(n.title)}</h4>
   <div class="meta">${esc(auth(n))} · arXiv:${esc(n.arxiv)}</div><p>${why(n.note)}</p><div class="links"><a href="#p${n.i}">Back to abstract</a></div>`;
  else p.innerHTML=`<div class="role" style="color:${col(n)}">${esc(ROLE[n.role])}</div><h4>${esc(n.title)}</h4>
   <div class="meta">${esc(auth(n))} · ${n.year}${n.arxiv?' · arXiv:'+esc(n.arxiv):''}</div>
   <div class="stats"><span>${n.cites.toLocaleString()} citations</span><span>${n.inn.filter(i=>isNew(N[i])).length} of the matches link here</span></div>${links}`;
  tex(p)}
function pick(n,scroll){sel=n;panel();paint();document.querySelectorAll('.paper').forEach(el=>el.classList.toggle('sel',el.id==='p'+n.i));if(scroll)document.getElementById('chart').scrollIntoView({behavior:'smooth',block:'nearest'})}
const present=new Set(N.map(n=>n.role));
document.getElementById('legend').innerHTML=['today','repl','seed','other'].filter(k=>present.has(k)).map(k=>`<span><i class="dot" style="background:var(--${k})"></i>${esc(ROLE[k])}</span>`).join('')+'<span style="color:var(--fg-3)">Listing papers: size ∝ score; others: size ∝ log(citations)</span>';
document.getElementById('q').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();paint()});
svg.on('click',ev=>{if(ev.target.tagName!=='circle'){sel=null;panel();paint()}});
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(draw,200)});
function nextList(){const X=RAW.next||[];if(!X.length)return;const box=document.getElementById('nextlist'),more=document.getElementById('more');
  more.hidden=false;more.querySelector('summary').firstChild.textContent=`The next ${X.length} papers by score `;
  document.getElementById('moresub').textContent=`below the threshold of ${M.threshold}, not drawn in the network`;
  box.innerHTML=X.map(n=>`<li><div class="role" style="color:var(--${n.section==='replacement'?'repl':'today'})">#${n.rank} · ${esc(SEC[n.section])} · score ${n.score.toFixed(1)}</div>
    <div class="t">${esc(n.title)}</div><div class="authors">${authors(n.authors)} · arXiv:${esc(n.arxiv)}</div>
    ${n.note?`<p class="why">${why(n.note)}</p>`:''}
    <details class="abs"><summary>Abstract</summary><p class="abs">${esc(n.abstract)}</p></details>
    <div class="links">${n.id?`<a href="https://inspirehep.net/literature/${n.id}" target="_blank" rel="noopener">INSPIRE</a>`:''}<a href="https://arxiv.org/abs/${esc(n.arxiv)}" target="_blank" rel="noopener">arXiv</a><a href="https://arxiv.org/pdf/${esc(n.arxiv)}" target="_blank" rel="noopener">PDF</a></div></li>`).join('');
  more.addEventListener('toggle',()=>{if(more.open)tex(box)})}
const rtip=document.getElementById('reftip');let rcur=null;
function refShow(el){const r=REFS[el.dataset.ref];if(!r)return;rcur=el;rtip.textContent=`${auth(r)} (${r.year}) — ${plain(r.title)}`;rtip.hidden=false;
  const b=el.getBoundingClientRect(),t=rtip.getBoundingClientRect();let L=Math.min(Math.max(8,b.left),innerWidth-t.width-8),T=b.bottom+6;
  if(T+t.height>innerHeight-8)T=b.top-t.height-6;rtip.style.left=L+'px';rtip.style.top=T+'px'}
function refHide(){rtip.hidden=true;rcur=null}
document.addEventListener('pointerover',e=>{const el=e.target.closest('.ref');if(el&&e.pointerType==='mouse')refShow(el)});
document.addEventListener('pointerout',e=>{if(e.target.closest('.ref')&&e.pointerType==='mouse')refHide()});
document.addEventListener('click',e=>{const el=e.target.closest('.ref');if(el)refShow(el);else if(rcur)refHide()});
document.addEventListener('focusin',e=>{const el=e.target.closest('.ref');if(el)refShow(el)});
document.addEventListener('focusout',e=>{if(e.target.closest('.ref'))refHide()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')refHide()});
addEventListener('scroll',()=>{if(rcur)refHide()},{passive:true});
list();nextList();fold();draw();panel();
window.addEventListener('load',()=>{tex(document.getElementById('list'));tex(document.getElementById('panel'));fold();
  if(window.MathJax&&MathJax.startup&&MathJax.startup.promise)MathJax.startup.promise.then(()=>setTimeout(fold,300))});
addEventListener('resize',()=>{clearTimeout(window._ft);window._ft=setTimeout(fold,200)});
</script>
