<script>
const RAW = {"n":[{"id":"3215998","arxiv":"2610.23658","title":"Hidden Sector Relic Abundances from an Effective Planck Mass","first":"Liveoak","nauth":3,"year":2026,"cites":0,"role":"repl","note":"Cites 3 network papers: [[2795517]], [[1907913]], [[1607216]]. Closest of your papers: [[2856850]] (coupling 0.04, 5 shared references). Closest network paper: [[1907913]] (coupling 0.12, 9 shared references). Shared topics: relic abundance, relic density, dark matter candidate, dark matter.","score":44.9,"rank":1,"section":"replacement","parts":[0.83,0.11,0.34,0.0,0.72],"abstract":"Hidden sectors are generic in beyond the Standard Model constructions and string compactifications. We consider models featuring hidden sectors that have dark matter candidates. The relic density is set in part by the energy-injecting inflaton branching ratio $B$ to the sector. We develop a general framework to determine the dependence on $B$ for thermalized hidden sectors by defining an effective Planck mass for the Boltzmann equations for the hidden sector degrees of freedom. We apply this framework to several representative examples, including freeze-out/freeze-in WIMPs and multi-component dark matter. We find that the fractional energy density carried by freeze-out relics (in both single and multi-component models) and monopoles produced from second order phase transitions scale as $B^{1/4}$ and thus may lead to an overclosure problem, even with $B \\ll 1$. On the other hand, the energy density of freeze-in relics scales as $B^{5/4}$ and is thus cosmologically irrelevant for sufficiently small $B$. Finally, we discuss the cumulative implications of a large number of hidden sectors.","authors":"Donald Liveoak, Anshuman Maharana, James D. Wells","nlinked":51,"nref":54,"src":"INSPIRE","html":true},{"id":"3233626","arxiv":"2611.32925","title":"Multi-Component Axion Dark Matter Revisited and the Role of Ultralight ALPs","first":"Li","nauth":1,"year":2026,"cites":0,"role":"today","note":"Cites 2 network papers: [[3170445]], [[2795517]]. Closest of your papers: [[1941263]] (coupling 0.09, 14 shared references). Closest network paper: [[3179956]] (coupling 0.14, 15 shared references). Shared topics: dm abundance, dark matter.","score":43.7,"rank":2,"section":"new","parts":[0.7,0.27,0.4,0.0,0.53],"abstract":"In this work, we revisit the multi-component axion dark matter (DM) scenario and explore the role of ultralight axion-like particles (ALPs). After briefly reviewing maximal axion mixing, we incorporate a stochastic axion mixing mechanism that generalizes it by relaxing the requirement of a uniform hierarchy among the axion decay constants. We find that, depending on the parameters, either the QCD axion or an ALP can dominate the DM abundance after mixing; once axion mass contributions are included, the heaviest ALPs tend to prevail. In a two-component framework, stochastic mixing significantly enlarges the allowed parameter space for the QCD axion decay constant, enabling the QCD axion to constitute the entirety of cold DM. The corresponding ALP mass range remains largely unconstrained by current experiments and is within reach of future searches. In the multi-component case, a larger ALP population leads to the emergence of more ultralight ALPs with large decay constants. These ultralight ALPs represent compelling targets for upcoming axion searches.","authors":"Hai-Jun Li","nlinked":47,"nref":48,"src":"INSPIRE","html":true},{"id":"3233433","arxiv":"2611.31373","title":"Discovering Warped Extra Dimensions at Next Generation Dark Matter Detectors","first":"Agashe","nauth":4,"year":2026,"cites":0,"role":"today","note":"Cites 2 network papers: [[2771408]], [[2795517]]. Also cites widely used network papers: [[2817040]]. Closest of your papers: [[926166]] (coupling 0.05, 3 shared references). Closest network paper: [[3138530]] (coupling 0.08, 7 shared references). Shared topics: thermal relic, direct detection, indirect detection, dark matter.","score":38.7,"rank":3,"section":"new","parts":[0.72,0.14,0.23,0.0,0.59],"abstract":"The coming years will see what could be the final push in the search for WIMP dark matter (DM), with direct detection reaching into the neutrino fog and indirect detection reaching TeV-scale thermal relics. We study a class of models that these experiments could discover: DM emerging from a warped extra dimension. In the IR, these scenarios appear generically as a $Z'$-type portal. We show that DM with electroweak couplings and TeV scale masses remains viable and discoverable within such a bottom-up context. However, the models require a 20\\% tuning between the DM and $Z'$ masses, a tuning that is relaxed if the DM and $Z'$ are strongly coupled and heavier ($\\sim$$10$ TeV). In fact, it is the strongly-coupled $Z'$-type portal which is UV-completed by the framework of a warped extra-dimensional Grand Unified Theory (GUT), where DM stability is a spin-off of suppressing proton decay, resulting in a $\\sim$$10$ TeV Kaluza-Klein (KK) scale. We identify a variant of this framework where all gauge fields except a baryon-number gauge boson have suppressed couplings to the DM; this model significantly suppresses the direct detection rate, but it remains discoverable through indirect detection. Further, to address the little hierarchy problem associated with $\\sim$$10$ TeV KK scale, inspired by the Super-Composite Higgs, we augment our extra-dimensional GUT setup with supersymmetry. We show that this model also possesses a DM candidate, now with a weakly-coupled and $\\sim$${\\rm TeV}$ mass $Z'$ mediator. In all cases, a near-term discovery remains possible, for instance with the now online Cherenkov Telescope Array Observatory (CTAO), suggesting that our first hint of extra dimensions could emerge from the high-energy sky.","authors":"Kaustubh Agashe, Abhishek Banerjee, Kushan Panchal, Nicholas L. Rodd","nlinked":70,"nref":75,"src":"INSPIRE","html":true},{"id":"3233448","arxiv":"2611.31388","title":"Charge-resolved four-lepton probes of an $eμ$-flavour-violating scalar at FCC-ee","first":"Deka","nauth":3,"year":2026,"cites":0,"role":"today","note":"Cites 3 network papers: [[3193100]], [[2068399]], [[1493855]]. Closest of your papers: [[2690106]] (coupling 0.04, 5 shared references). Closest network paper: [[3190962]] (coupling 0.06, 5 shared references).","score":36.0,"rank":4,"section":"new","parts":[0.83,0.13,0.18,0.0,0.0],"abstract":"We study a real neutral scalar $X$ with a single flavour-off-diagonal coupling $h_{eμ}=h_{μe}\\equiv h$. The coupling induces associated production, $e^+e^-\\to e^\\pmμ^\\mp X$, and the decay $X\\to e^\\pmμ^\\mp$. The resulting four-lepton final state separates into the charge-balanced channel $e^+e^-μ^+μ^-$ and the same-sign same-flavour channels $e^\\pm e^\\pmμ^\\mpμ^\\mp$. The charge-balanced channel receives a large prompt continuum background, while the same-sign category has a small estimated background under our benchmark assumptions. We analyse the two channels at FCC-ee for $\\sqrt{s}=240~\\mathrm{GeV}$ and $\\mathcal{L}=10.8~\\mathrm{ab}^{-1}$, including a detector simulation. The collider sensitivities are compared with the one-coupling constraints from the electron and muon magnetic moments, muonium--antimuonium conversion, and LEP dilepton data. At $m_X=146~\\mathrm{GeV}$, motivated by the largest excess in the CMS $eμ$ resonance search, the expected 95\\% CL reach of the charge-balanced channel, including a 1\\% background uncertainty, is $|h|\\simeq 1.0 \\times 10^{-2}$, while the same-sign channel reaches $|h|\\simeq 1.7 \\times 10^{-3}$, compared with the cesium-based electron-$g-2$ bound $|h|<1.46\\times10^{-2}$. Both channels thus probe couplings below the present bound. The two signal rates are equal before selection; the difference in reach follows from the different backgrounds.","authors":"Kuldeep Deka, Bharti Rawat, Tripurari Srivastava","nlinked":46,"nref":48,"src":"INSPIRE","html":false},{"id":"2907222","arxiv":"2504.01150","title":"Thermal Fermion Propagators and Diagonal HTL Effective Action in the Early Universe","first":"Hataei","nauth":2,"year":2026,"cites":0,"role":"repl","note":"Cites 2 network papers: [[3193100]], [[2802022]]. Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2856850]] (coupling 0.01, 3 shared references). Closest network paper: [[3204438]] (coupling 0.06, 5 shared references). Shared topics: yukawa interaction, early universe.","score":32.2,"rank":5,"section":"replacement","parts":[0.72,0.04,0.18,0.0,0.31],"abstract":"Within the minimally extended Standard Model (MESM), with Dirac neutrinos, we study fermion propagation in the electroweak-symmetric plasma, where the Higgs expectation value vanishes. We show that the zero-temperature mass eigenstates do not coincide with the left-handed fermionic quasiparticles identified by the thermal medium, while the right-handed fermions remain diagonal in this basis. At the leading hard-thermal-loop (HTL) order, the left-handed fermion self-energies form flavor matrices containing the CKM and PMNS mixing structures. Diagonalizing flavor matrices, we show that the two members of each left-handed weak doublet possess identical leading-HTL thermal spectra. The eigenvalues are CP-even and are invariant under weak-basis transformations. In this symmetric-phase thermal basis, the leading HTL fermion propagators and electroweak gauge interactions are diagonal, while the flavor structure is transferred to the Yukawa interactions. We further express the HTL effective Lagrangian in this basis, derive the corresponding dispersion relations, and numerically compare the eigenvalues of the complete leading-HTL matrices with the diagonal thermal coefficients obtained in the broken-phase mass basis. This construction provides a diagonal HTL description of fermionic quasiparticles and a systematic framework for resummation and higher-order corrections in the electroweak-symmetric plasma.","authors":"A. Hataei, S. S. Gousheh","nlinked":70,"nref":80,"src":"INSPIRE","html":true},{"id":"3233421","arxiv":"2611.31364","title":"Enhanced spatial resolution and performance for N-body simulation of self-interacting dark matter","first":"Fischer","nauth":1,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3214429]]. Closest of your papers: [[2964960]] (coupling 0.10, 9 shared references). Closest network paper: [[3214429]] (coupling 0.16, 29 shared references). Shared topics: dark matter.","score":31.7,"rank":6,"section":"cross","parts":[0.45,0.26,0.46,0.0,0.13],"abstract":"Studying the implications of self-interacting dark matter (SIDM) on astrophysical objects often requires simulations. N-body simulations are a standard tool but face a few challenges. One is resolving the mean free path in gravothermally collapsing halos. This is necessary to obtain accurate results and is achieved in state-of-the-art simulations by increasing the number of resolution elements. I aim to formulate a numerical scheme that gives an enhanced spatial resolution compared to those methods and allows increasing the resolution without changing the number of resolution elements. The novel scheme that I present is formulated by discarding the classic approach of using kernel functions and computing interaction probabilities. Instead, pairs of particles always interact if their distance is below a specific threshold. Importantly, this distance threshold depends on their relative velocity and the size of the time step. This new formulation no longer requires some of the computations in state-of-the-art schemes and thus helps to increase the performance. Through a variety of test problems with known solutions, I study the accuracy of the new scheme and demonstrate its advantages over state-of-the-art SIDM formulations. Notably, the scheme reduced the computational costs, making the SIDM computations typically much cheaper than gravity. As a consequence, a typical SIDM simulation of isotropic scattering requires only a few percent of its total computational cost for the self-interactions. In conclusion, the new scheme presents an improvement over previous schemes and helps to address current challenges. Besides the enhanced performance, it allows us to achieve a higher accuracy when simulating gravothermally collapsing SIDM halos.","authors":"Moritz S. Fischer","nlinked":55,"nref":79,"src":"INSPIRE","html":true},{"id":"3233442","arxiv":"2611.31368","title":"Dark vector meson effects on composite dark matter","first":"Abe","nauth":4,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[2740358]]. Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2787890]] (coupling 0.03, 3 shared references). Closest network paper: [[3074282]] (coupling 0.09, 7 shared references). Shared topics: observed relic, relic abundance, dark matter.","score":30.3,"rank":7,"section":"new","parts":[0.48,0.1,0.24,0.0,0.68],"abstract":"We extend previous studies of $\\mathcal{G}$-parity-odd dark pion dark matter in a QCD-like $\\mathrm{SU}(N_c)$ gauge theory with electroweakly interacting dark quarks to include the effects of $ρ$ mesons. We show that vector mesons can substantially affect relic abundance calculations through resonant enhancement, significantly affecting the conditions required to reproduce the observed relic abundance. Electroweak interactions further induce mixing between the dark $ρ$ mesons and Standard Model gauge bosons, opening new decay channels for the dark $ρ$ and modifying the effective interactions of the dark pions. We recast existing ATLAS and CMS searches to constrain the model, and perform a collider phenomenology study targeting the future FCC-hh and muon colliders, focusing on the resonant enhancement of cross sections in the $e^+e^-$, $μ^+μ^-$, and $W^+W^-$ final states for the latter. We show that the FCC-hh could probe $ρ$ mesons whose mass is up to 40 TeV.","authors":"Tomohiro Abe, Ryosuke Sato, Ozan Semin, Takumu Yamanaka","nlinked":79,"nref":79,"src":"INSPIRE","html":true},{"id":"3182810","arxiv":"2607.20843","title":"Dark Monopoles, Bounds on Hidden Sectors, and Cosmological Implications","first":"Liveoak","nauth":3,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[2795517]]. Also cites widely used network papers: [[1783234]], [[1518747]]. Closest of your papers: [[2039411]] (coupling 0.03, 5 shared references). Closest network paper: [[3086375]] (coupling 0.05, 3 shared references). Shared topics: primordial black hole, dark matter model, early universe, dark matter.","score":28.8,"rank":8,"section":"replacement","parts":[0.51,0.09,0.13,0.0,0.61],"abstract":"Hidden sectors are a generic prediction of string theory compactifications and result in a promising landscape for dark matter model building. We consider the case of hidden sector magnetic monopoles produced via a thermal phase transition in the early Universe and subsequently diluted by pair annihilation. We show that for symmetry-breaking scales $\\gtrsim 100\\, \\text{PeV}$, the monopole abundance is unacceptably high, overclosing the Universe. Our bounds are robust against variations in the initial fraction of energy density deposited in the hidden sector, exhibiting only a weak power-law dependence on this quantity. The bound is substantially tightened in the case of multiple hidden sectors. The standard cosmology may only be recovered if one of the following is true: the hidden sector(s) are non-existent, the hidden sectors have no monopoles with symmetry-breaking scale above 100 PeV, the maximum temperature of each monopole-producing hidden sector after reheating is below its symmetry-breaking scale, or the monopole abundance is diluted by an additional physical mechanism (such as early matter domination, the Langacker-Pi mechanism, or capture by primordial black holes).","authors":"Donald Liveoak, Anshuman Maharana, James D. Wells","nlinked":49,"nref":58,"src":"INSPIRE","html":true},{"id":"3233449","arxiv":"2611.31600","title":"Thermodynamic constraints on warm inflation with the Standard Model","first":"Mojahed","nauth":1,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[2950768]]. Closest of your papers: [[1249404]] (coupling 0.05, 11 shared references). Closest network paper: [[2950768]] (coupling 0.16, 14 shared references).","score":26.8,"rank":9,"section":"new","parts":[0.45,0.14,0.46,0.0,0.0],"abstract":"In warm inflation with the Standard Model (SM), an axion-like inflaton dissipates energy into the plasma through QCD sphaleron transitions. Current predictions assume a friction linear in the bias, defined as the free energy released per transition in units of the temperature. The friction, however, has only been simulated at moderate biases in pure SU(2) gauge theory. We show that, during slow roll, energy conservation, the axial anomaly and thermodynamics relate the bias to the quark chemical potentials generated by the transitions, independently of the form of the friction and of the reaction network in the plasma. A bias within the simulated range requires chemical potentials a few times the temperature, which typically lead to Higgs condensation. Conversely, small chemical potentials imply a large bias and, unless the dissipation is very weak, a temperature far above the axion decay constant, which requires a cutoff of the effective description above that temperature. We illustrate that deviations from linearity beyond the simulated range can change the inflationary dynamics qualitatively, so that reliable predictions require a real-time computation of the friction and the noise in QCD at large bias. With high-scale lepton-number violation, the quark chemical potentials also source a $B-L$ asymmetry that exceeds the observed value by many orders of magnitude already during inflation. Finally, we show that the same relation between the bias and the chemical potentials holds for derivative couplings of the inflaton to SM currents. Unless the dissipation is very weak, warm inflation driven by such couplings therefore requires either a temperature far above the decay constant or chemical potentials that typically lead to Higgs condensation.","authors":"Martin A. Mojahed","nlinked":95,"nref":95,"src":"INSPIRE","html":true},{"id":"3233429","arxiv":"2611.31359","title":"Superdaisy Resummation in Theories with Broken Gauge Symmetries","first":"Münzenberg","nauth":2,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Closest of your papers: [[2787890]] (coupling 0.01, 1 shared references). Closest network paper: [[2706040]] (coupling 0.17, 15 shared references).","score":23.5,"rank":10,"section":"new","parts":[0.45,0.02,0.47,0.0,0.0],"abstract":"We extend the partial dressing resummation scheme for the finite-temperature effective potential to the gauge and ghost sectors of spontaneously broken gauge theories and apply the resulting framework to the Standard Model. Going beyond the usual high-temperature treatment, we retain the full mass dependence of the thermal self-energies and determine the scalar, gauge-boson and ghost masses self-consistently from a coupled system of gap equations. The solutions show that corrections beyond the leading $\\mathcal{O}(T^2)$ approximation are particularly relevant for the gauge-boson thermal masses, while they induce a comparatively small shift in the scalar spectrum for the benchmark studied. The self-consistent gauge-boson dressing in the longitudinal sector reduces the barrier in the finite-temperature Higgs effective potential. Implementing the resummation in the transverse sector removes the barrier and would seem to exclude a first-order phase transition in accordance with lattice results. While such resummation is not quantitatively reliable, due to the transverse excitations becoming strongly coupled, the results showcase the crucial role played by transverse modes in determining the nature of the electroweak phase transition.","authors":"Martin Münzenberg, Carlos Tamarit","nlinked":93,"nref":98,"src":"INSPIRE","html":true},{"id":"3233513","arxiv":"2611.32481","title":"On the effective atmospheric-scale $Δm^2$ in neutrino oscillation","first":"Minakata","nauth":1,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Closest of your papers: [[1854224]] (coupling 0.02, 3 shared references). Closest network paper: [[3158607]] (coupling 0.09, 8 shared references).","score":21.5,"rank":11,"section":"new","parts":[0.45,0.07,0.25,0.0,0.0],"abstract":"We discuss an effective two-frequency description of the three-generation neutrino oscillation with the key quantity $Δm^2_{ \\text{effective} }$, which unifies the effects of atmospheric-scale $Δm^2_{31}$-$Δm^2_{32}$ driven oscillations. As a solution to the minimization problem in vacuum, Nunokawa {\\it et al.} obtained $Δm^2_{ \\text{effective} } = Δm^2_{31} - (2E / L) \\arctan \\left\\{ r_{2} \\sin 2Δ_{21} / ( r_{1} + r_{2} \\cos 2Δ_{21} ) \\right\\}$, where $Δ_{21} \\equiv Δm^2_{21} L / (4 E)$ and $r_{i}$ are the mixing-angle dependent constants. Despite the skepticism for the $L/E$ dependence in this formula, we show, in fact, that this is an exact expression, which renders the probability formula also exact. We offer an appealing-to-intuition physical explanation for the $L/E$ dependence that it originates from the nature-designed three generation neutrinos. The way it is buried into $Δm^2_{ \\text{effective} }$ is through the solar-effect renormalization to this quantity. With the physical interpretation of $Δm^2_{ \\text{effective} }$ at hand, we aim at resolving the existing controversies on $Δm^2_{ \\text{effective} }$ in this paper.","authors":"Hisakazu Minakata","nlinked":52,"nref":55,"src":"INSPIRE","html":true},{"id":"3233447","arxiv":"2611.31410","title":"Exotic Portals for Hadronic Processes: The Gluon-Gluon and Gluon-Quark Portals","first":"Schwind","nauth":2,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Closest of your papers: [[1663960]] (coupling 0.04, 1 shared references). Closest network paper: [[2851201]] (coupling 0.05, 3 shared references).","score":21.0,"rank":12,"section":"new","parts":[0.45,0.11,0.14,0.0,0.0],"abstract":"In this work we explore all possible light exotic (LEX) particles which are accessible through the gluon-gluon ($g$-$g$) and gluon-quark ($g$-$q$) phenomenological portals up to effective dimension six. We present effective models for these new states, which are directly accessible through gluon and quark fusion processes, and which are guaranteed decays involving Standard Model (SM) quarks and gluons. We note many accessible states in particularly unusual SU(3)$_\\text{c}$ representations, which contain large Clebsch-Gordan coefficients. We also include some interesting dimension seven operators with highly unusual features. We also consider all potential spin values for our LEX states, looking at Lorentz representations and color selection rules. In this, we find that states in various unusual Lorentz representations are accessible. We also find that certain operator types have restrictions on allowed color representations based on spin.","authors":"Katherine Schwind, Linda M. Carpenter","nlinked":33,"nref":39,"src":"INSPIRE","html":true},{"id":"3233508","arxiv":"2611.32531","title":"Description of the decay $φ\\to π^+π^-$ in the NJL chiral quark model","first":"Volkov","nauth":3,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Closest network paper: [[3147506]] (coupling 0.12, 6 shared references).","score":20.8,"rank":13,"section":"new","parts":[0.45,0.0,0.33,0.0,0.0],"abstract":"The doubly suppressed decay $φ\\to π^+π^-$ is described in the chiral NJL quark model. This decay occurs in violation of the OZI rule and isotopic invariance. Two possible channels are considered. The first channel involves $φ-ω$ mixing and the subsequent decay of $ω\\to π^+π^-$. In the second channel, the decay occurs via an intermediate $ρ$ meson.","authors":"M. K. Volkov, A. A. Pivovarov, K. Nurlan","nlinked":28,"nref":29,"src":"INSPIRE","html":true},{"id":"3174164","arxiv":"2606.28275","title":"Revealing precision bounds on neutrino oscillation parameters with quantum estimation theory","first":"Huang","nauth":4,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[3193100]]. Closest of your papers: [[1854224]] (coupling 0.01, 1 shared references). Closest network paper: [[3214449]] (coupling 0.05, 4 shared references).","score":19.1,"rank":14,"section":"replacement","parts":[0.45,0.04,0.14,0.0,0.0],"abstract":"Quantum estimation theory provides ultimate precision bounds on parameter estimation, independent of experimental setups. In this article, we apply this theoretical framework to neutrino oscillations, aiming to clarify some subtle issues and reveal the maximum achievable precision of oscillation parameters. First, taking the example of two-flavor oscillations, we clarify how the quantum Fisher information (QFI) depends on the choice of bases when the basis transformation itself involves the parameters in question. Then, for three-flavor oscillations, we compute the QFI matrix for electron and muon neutrino states in the flavor basis and derive analytical expressions and numerical results for both diagonal and off-diagonal elements. The implications of off-diagonal correlations for multiparameter estimation are discussed, including the compatibility of optimal measurements, the Holevo bound, and the spectral analysis of the QFI matrix, from which we show that a single neutrino channel leaves exactly two parameter combinations unconstrained. The quantum Cramér-Rao bounds on the precision of oscillation parameters for typical reactor and long-baseline accelerator neutrino experiments are obtained as vacuum, state-level benchmarks, which establish a theoretical reference for the ultimate precision achievable in future neutrino oscillation experiments.","authors":"Jihong Huang, Tommy Ohlsson, Sampsa Vihonen, Shun Zhou","nlinked":33,"nref":38,"src":"INSPIRE","html":true},{"id":"3190000","arxiv":"2608.10301","title":"The near-threshold cross section of $e^+e^- \\to Ω^-\\barΩ^+$: Heavy-flavor rescattering and physics-informed deep learning","first":"Rahmani","nauth":1,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[3193100]]. Closest network paper: [[3091093]] (coupling 0.03, 2 shared references).","score":17.0,"rank":15,"section":"replacement","parts":[0.45,0.0,0.08,0.0,0.0],"abstract":"Recent precision measurements of the $e^+e^- \\to Ω^-\\barΩ^+$ cross section by the BESIII collaboration provide a valuable opportunity to probe complex hadronic rescattering mechanisms. In this work, we investigate a potential structure near the $D_s\\bar{D}_s$ threshold using a coupled-channel framework incorporating $Ω\\barΩ$, $Ξ\\barΞ$, and $D_s\\bar{D}_s$ interactions. The driving potentials are derived from effective Lagrangians respecting heavy quark spin symmetry, chiral symmetry, and hidden local symmetry, and the scattering amplitude is unitarized via the on-shell factorization of the Bethe-Salpeter equation. To go beyond local fits and map theoretical uncertainties, we use a two-step machine-learning framework. First, Simulation-Based Inference with a Mixture Density Network maps the global Bayesian posterior of the effective couplings. Second, to identify the poles, we employ a Cauchy-Riemann Physics-Informed Neural Network (PINN). The network enforces mathematical analyticity by construction, continuing the real-axis determinant into the complex energy plane. At the best fit, no pole is found near the $D_s\\bar D_s$ threshold, while a single physical pole is identified at $M=3.1868$ GeV with $Γ=1.57$ MeV, sitting 158 MeV below the $Ω\\barΩ$ threshold. The corresponding S-matrix residues show an overwhelming coupling to the $Ω\\barΩ$ channel, favoring a dynamically generated $Ω\\barΩ$ bound state, predicted by the model below the measured energy range.","authors":"Sara Rahmani","nlinked":58,"nref":61,"src":"INSPIRE","html":true},{"id":"3228185","arxiv":"2611.16827","title":"A unified reduced-mass parametrization of effective chromoelectric interactions in hadrons","first":"Liu","nauth":3,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[3193100]]. Closest network paper: [[2750604]] (coupling 0.02, 1 shared references).","score":16.6,"rank":16,"section":"replacement","parts":[0.45,0.0,0.05,0.0,0.0],"abstract":"We construct a unified effective mass relation in which a common reduced-mass function describes the flavor dependence of chromoelectric pair contributions, with explicit color factors connecting $q\\bar q$ and $qq$ pairs. After subtracting fixed spin-weighted chromomagnetic contributions, we jointly fit fourteen spin-averaged meson and baryon masses using constituent quark masses and an additive constant shared by both sectors, obtaining a root-mean-square (RMS) residual of 4 MeV. The fitted saturating form connects the nearly saturated light-flavor contribution with increasing attraction in the heavy-flavor region. In the common saturation limit, the leading chromoelectric contribution acts as a common mass shift for each constituent and can be absorbed into effective constituent masses; the residual pair term accounts for the flavor dependence away from saturation. With the chromomagnetic interaction included, this single parameter set reproduces the ground-state meson and baryon spectra and yields predictions for multiply heavy baryons outside the calibration set. By diagonalizing the sum of the chromoelectric and chromomagnetic mass matrices, we further obtain the ground-state spectra of $cc\\bar c\\bar c$, $bb\\bar b\\bar b$, and $bc\\bar b\\bar c$. The fully charmed tensor mass is ${6505}{(9)(9)}$ MeV, close to recent lattice QCD results, while the upper scalar mass of {${6562}{(9)(12)}$} MeV lies in the mass region near $X(6600)$. The tetraquark masses remain relatively stable under the examined variations of the $qq$ chromomagnetic couplings. The relative $S$-wave rearrangement-decay weights obtained from color--spin recoupling can be used to identify favored decay channels under the stated spatial-overlap approximation.","authors":"Wen-Nian Liu, Duo-Jie Jia, Fu-Quan Dou","nlinked":68,"nref":68,"src":"INSPIRE","html":true},{"id":"3127647","arxiv":"2603.07739","title":"Impact of a hot local CP-odd domain with chirality imbalance on the QCD-biased axionic domain-wall interpretation of NANOGrav 15-year data","first":"Zhang","nauth":2,"year":2026,"cites":0,"role":"repl","note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2787890]] (coupling 0.05, 7 shared references). Closest network paper: [[2803557]] (coupling 0.16, 18 shared references). Shared topics: gravitational wave.","score":13.9,"rank":17,"section":"replacement","parts":[0.06,0.14,0.44,0.0,0.1],"abstract":"We investigate the influence of the chirality imbalance with local CP-breaking in hot QCD on the generation of a stochastic gravitational wave background (SGWB) sourced by the axion-like particle (ALP) domain-wall annihilation, induced by the QCD bias $ΔV$. Such a bias at finite $θ$ angle, chiral chemical potential $μ_5$, and temperature $T$ near QCD scale is calculated within a nonlocal Nambu-Jona-Lasinio (NJL) model. We find that the bias $ΔV$ decreases as $θ$ approaches $π/2$ from either zero or $π$, while increases with rising $μ_5$. We confirm that there exists a $(T,θ,μ_5)$ parameter space consistent with the axionic domain-wall interpretation of NANOGrav 15-year data on the nHz gravitational waves. We point out that employing the $θ$-dependent topological susceptibility to quantify the QCD bias at finite $θ$ in the previous study is improper, as it violates the general relation $ΔV(θ)=ΔV(π-θ)$.","authors":"Zhao Zhang, Ruotong Zhao","nlinked":98,"nref":101,"src":"INSPIRE","html":true},{"id":"3168766","arxiv":"2606.15825","title":"Rescuing flavor-symmetry-forbidden leptogenesis within the left-right symmetric framework","first":"Shao","nauth":2,"year":2026,"cites":0,"role":"repl","note":"Closest of your papers: [[1249404]] (coupling 0.04, 6 shared references). Closest network paper: [[2153712]] (coupling 0.09, 13 shared references). Shared topics: dirac neutrino mass, neutrino mass, seesaw model.","score":13.4,"rank":18,"section":"replacement","parts":[0.0,0.11,0.26,0.0,0.63],"abstract":"While the type-I seesaw model provides a unified framework for explaining the origin of neutrino masses and the baryon asymmetry of the Universe, flavor symmetries offer an attractive approach to understanding the observed neutrino mixing pattern. However, in many flavor-symmetry-based type-I seesaw models, either the Dirac neutrino mass matrix $M^{}_{\\rm D}$ or the right-handed-neutrino mass matrix $M^{}_{\\rm R}$ takes an exactly degenerate form, which prevents the conventional leptogenesis mechanism from working. In this paper, without breaking the original flavor structure dictated by the employed flavor symmetries, we investigate whether such forbidden leptogenesis scenarios can be rescued within the framework of the left-right symmetric model. We show that, in these scenarios, the contribution of the Higgs triplet present in the left-right symmetric model to the CP asymmetries of right-handed neutrino decays can successfully reproduce the observed baryon asymmetry. The leptogenesis mechanism proposed here can also be directly applied in more general type-I+II seesaw models.","authors":"Yan Shao, Zhen-hua Zhao","nlinked":64,"nref":67,"src":"INSPIRE","html":true},{"id":"3196199","arxiv":"2608.25069","title":"Energy-independent neutrino dephasing from an ultralight axion-like background","first":"Silva","nauth":2,"year":2026,"cites":0,"role":"repl","note":"Co-authors of yours: Sánchez-Vega. Closest of your papers: [[1597138]] (coupling 0.02, 2 shared references). Closest network paper: [[3089716]] (coupling 0.05, 3 shared references). Shared topics: neutrino mass.","score":10.6,"rank":19,"section":"replacement","parts":[0.0,0.06,0.14,0.5,0.16],"abstract":"We study neutrino oscillations in an ultralight axion-like particle (ALP) dark-matter background with low-energy derivative couplings $g_i$ diagonal in the neutrino mass basis. In vacuum, these couplings generate an additional relative phase set by the field difference between production and detection, which can vary from event to event as the background oscillates. Averaging over these unresolved variations can then reduce the oscillation contrast. When the field changes little during each flight and the spread of induced phases is small, the leading suppression is quadratic in distance and independent of neutrino energy. Matching published reactor damping limits at representative baselines gives scales near $0.83$ and $0.5~\\mathrm{GeV}^{-1}$ for the coupling differences in JUNO and KamLAND, respectively, with $g_2=g_3$ and a local ALP density of $ρ_a=0.4~\\mathrm{GeV}\\,\\mathrm{cm}^{-3}$. These scales vary as $ρ_a^{-1/2}$ and remain nearly mass independent, for instance over $10^{-20}\\lesssim m_a/\\mathrm{eV}\\lesssim10^{-13}$ when the data sample the assumed distribution of the ALP field. We compare two electroweak operators: a dimension-five current involving both neutrinos and charged leptons, constrained by charged-lepton flavor violation, and a dimension-seven operator that selects neutrinos through Higgs fields and allows invisible Higgs decays. For the latter, the Higgs bound on the coupling differences is about two orders of magnitude below the JUNO scale, assuming a single operator valid at the Higgs mass and Standard Model production. At lower energies, we calculate pion and kaon ALP-emission rates and missing-mass spectra and compare them with PIENU and NA62 searches.","authors":"B. A. Couto e Silv "],[56,29,"c"],[33,28,"c"],[13,57,"k"],[43,79,"c"],[5,58,"k"],[28,34,"c"],[8,59,"k"],[67,58,"c"],[13,21,"c"],[52,89,"c"],[5,60,"k"],[79,24,"c"],[16,61,"k"],[87,28,"c"],[54,64,"c"],[16,62,"k"],[83,78,"c"],[89,50,"c"],[11,63,"k"],[17,64,"k"],[79,28,"c"],[18,65,"k"],[47,66,"c"],[60,65,"c"],[77,79,"c"],[1,66,"k"],[77,68,"c"],[6,67,"k"],[68,31,"c"],[1,68,"k"],[15,21,"c"],[72,34,"c"],[7,69,"k"],[84,34,"c"],[89,24,"c"],[29,34,"c"],[58,29,"c"],[16,29,"k"],[37,50,"c"],[3,70,"c"],[89,26,"c"],[10,21,"c"],[2,71,"k"],[18,72,"k"],[86,64,"c"],[20,34,"c"],[41,64,"c"],[54,28,"c"],[3,73,"k"],[87,26,"c"],[37,43,"c"],[0,74,"k"],[25,50,"c"],[40,82,"c"],[84,27,"c"],[60,58,"c"],[74,26,"c"],[1,75,"k"],[79,50,"c"],[33,19,"c"],[32,78,"c"],[24,26,"c"],[38,26,"c"],[8,64,"k"],[13,76,"k"],[4,77,"k"],[0,78,"c"],[0,79,"k"],[11,80,"k"],[4,28,"c"],[67,28,"c"],[67,29,"c"],[90,21,"c"],[7,81,"k"],[17,82,"k"],[79,78,"c"],[79,68,"c"],[25,78,"c"],[34,47,"c"],[9,83,"k"],[0,19,"c"],[1,84,"k"],[69,44,"c"],[19,50,"c"],[2,85,"k"],[3,86,"k"],[6,87,"k"],[1,88,"c"],[21,28,"c"],[9,89,"k"],[45,50,"c"],[1,19,"c"],[2,64,"k"],[11,90,"k"],[65,29,"c"],[19,24,"c"],[10,76,"k"],[54,46,"c"],[78,71,"c"]],"next":[{"arxiv":"2603.22490","id":"3133777","title":"Analyzing Fermionic Dark Matter Scenarios with Anomalous Compact Objects","authors":"Yaiza Cano, Jose Manuel Alarcón","score":9.8,"section":"replacement","rank":20,"parts":[0.0,0.0,0.13,0.0,0.79],"note":"Closest network paper: [[2843822]] (coupling 0.04, 4 shared references). Shared topics: fermionic dark matter, dark matter mass, dark matter scenario, dark matter model, dark matter.","abstract":"In this paper, we consider three compact objects (HESS J1731-347, PSR J1231-1411, XTE J1814-338) with anomalous mass-radius relations to analyze the possibility of their being dark matter admixed neutron stars. We try to infer the properties of the dark matter particles, under the assumption of behaving as a free Fermi gas. The main novelty relies on the use of a baryonic equation of state obtained from first principles over the whole density range, which allows the model dependence of the baryonic part of the calculation to be eliminated. Once the possible dark matter admixed neutron star configurations are obtained, we check their stability and whether it is feasible for a neutron star to capture the necessary dark matter fraction. Our analysis shows that our dark matter model favours the dark matter admixed neutron star hypothesis over the pure baryonic neutron star one, with the most favoured dark matter mass of $m_{DM} = 1$~GeV, although the necessary dark matter content cannot be explained in a standard galactic environment."},{"arxiv":"2511.05976","id":"3081345","title":"An anomaly-free leptophilic $U(1)'_{\\ell}$ completion of the Standard Model","authors":"Seyit Okan Kara","score":9.3,"section":"replacement","rank":21,"parts":[0.0,0.12,0.18,0.0,0.3],"note":"Closest of your papers: [[1803365]] (coupling 0.04, 3 shared references). Closest network paper: [[2693482]] (coupling 0.06, 3 shared references). Shared topics: singlet scalar.","abstract":"We investigate an anomaly-free, family-universal leptophilic $U(1)'_{\\ell}$ extension of the Standard Model (SM), in which quarks are neutral under the new gauge symmetry and mixed gauge anomalies are canceled by an SM-vector-like exotic lepton family. A complex singlet scalar breaks $U(1)'_{\\ell}$, generating the new gauge-boson mass and contributions to the exotic fermion masses. The residual $Z_6$ gauge symmetry contains a $Z_2$ subgroup protecting the lightest exotic fermion. The specified field content permits Dirac but forbids Majorana masses for ordinary neutrinos, while the exotic neutral sector contains four mixed Majorana states. We calculate the exotic fermion spectrum and tree-level $Z_\\ell$ decay widths. For $M_{Z_\\ell}=900$ GeV and $g_{\\rm eff}=0.10$, opening neutral Majorana-pair channels reduces the combined charged-lepton branching fraction by approximately 10.3% in the first benchmark. A restricted 5041-point scan over two neutral-sector mixing parameters yields reductions of 5.6%--10.8%. Using leading-order CalcHEP calculations, we investigate the resonance signatures in $μ^+μ^-\\toμ^+μ^-$ and $μ^+μ^-\\to e^+e^-$. At $\\sqrt{s}=900$ GeV, the exotic decay channels suppress the visible resonance cross sections by approximately 19.6% and 20.9% for the two benchmarks, respectively. The absolute differential cross sections exhibit similar suppression, while the normalized angular distributions remain nearly unchanged. We also discuss radiatively generated gauge-kinetic mixing, complementary precision observables, and renormalization-group consistency. These results establish a quantitative connection between the anomaly-canceling exotic fermion spectrum and visible leptonic resonance signals, without constituting experimental exclusion limits."},{"arxiv":"2607.08248","id":"3178755","title":"Probing Quadratically Coupled Ultralight Dark Matter with the Laser Interferometer Space Antenna","authors":"Xucheng Gan, Hyungjin Kim, Anna-Malin Lemke, Andrea Mitridate","score":9.2,"section":"replacement","rank":22,"parts":[0.0,0.04,0.19,0.0,0.5],"note":"Closest of your papers: [[1828504]] (coupling 0.01, 1 shared references). Closest network paper: [[3089716]] (coupling 0.07, 9 shared references). Shared topics: dark matter mass, standard model particle, dark matter.","abstract":"Ultralight dark matter can interact with Standard Model particles via gravitational and non-gravitational interactions. Through such interactions, it can leave distinctive signals in gravitational-wave experiments. In this work, we investigate signals induced by ultralight dark matter quadratically coupled to the Standard Model in the future space-borne gravitational-wave detector, the Laser Interferometer Space Antenna (LISA). Due to the quadratic nature of the coupling, dark matter signals appear at two distinct frequencies: the frequency corresponding to twice the dark matter mass, and frequencies below the typical dark matter kinetic energy. We analyze both contributions and show that LISA can surpass current constraints from terrestrial and astrophysical probes in certain mass ranges. We also find that dark matter signals in LISA are free from screening effects which significantly limit the sensitivity of terrestrial experiments."},{"arxiv":"2611.32906","id":"3233600","title":"Dark Matter Assisted Axion-Magnetic Resonance","authors":"Chen Sun, Si-Yu Wu, Seokhoon Yun","score":8.9,"section":"new","rank":23,"parts":[0.0,0.15,0.21,0.0,0.13],"note":"Closest of your papers: [[1941263]] (coupling 0.05, 9 shared references). Closest network paper: [[2810207]] (coupling 0.07, 17 shared references). Shared topics: dark matter.","abstract":"An oscillating axion dark matter (DM) background can enhance the conversion of another relativistic axion into photons when traversing a magnetic field. The DM background rotates photon polarization relative the magnetic orientation, which compensates the photon's and the propagating axion's dispersion relation mismatch. We relate this mechanism to Axion Magnetic Resonance (AMR) and apply it to stellar axions in the starburst galaxy M82. We analyze its enhancement to the resulting X-ray signals while accounting for the finite magnetic domain size, dark matter coherence length, DM density morphology, plasma profiles, and the detector response. We derive strong constraints using existing X-ray data from NuSTAR. We show that this resonant conversion can lead to $\\mathcal O(10^2)$ enhancement in the photon-axion conversion probability, improving the upper limits on axion's photon coupling over part of the mass range where ordinary conversion is suppressed. We also show that this type of resonance predicts distinctive features in the hard X-ray spectrum, which is moderately favored by the data over the background only model, yet it is currently still consistent with statistical fluctuations."},{"arxiv" dijet photoproduction data from DESY HERA I and II, finding good agreement within theoretical uncertainties, and provide predictions for both electron-proton and electron-gold collisions at the upcoming BNL EIC, illustrating its potential to further constrain both photon and nuclear parton distribution functions."},{"arxiv":"2611.31332","id":"3233416","title":"Massless neutrinos in a left-right symmetric universe","authors":"Loriano Bonora","score":7.4,"section":"new","rank":26,"parts":[0.0,0.13,0.23,0.0,0.0],"note":"Closest of your papers: [[731108]] (coupling 0.05, 2 shared references). Closest network paper: [[1863322]] (coupling 0.08, 3 shared references).","abstract":"This comment is a comment stimulated by the 1957 Goldhaber et al. experiment, that detected a massless left-handed electron neutrino with negative helicity. The standard description of this neutrino is by means of a Weyl spinor. It is shown below that this description is incomplete, and in fact one needs a massless Dirac spinor to comply with the requirements of quantum field theory. A Dirac spinor is composed of two Weyl spinors. This in turn raises the necessity to explain the fate of the right-handed electron neutrino, partner of the Goldhaber et al. experiment's one. A possible explanation for its invisibility is suggested here in terms of a left-right symmetric extension of the standard model."},{"arxiv":"2611.32729","id":"3233616","title":"A Gauge Pathway to an Ultralight Axion through a Hidden Portal","authors":"Claudio Corianø`","score":6.4,"section":"new","rank":27,"parts":[0.0,0.11,0.21,0.0,0.0],"note":"Closest of your papers: [[1941263]] (coupling 0.04, 5 shared references). Closest network paper: [[2969908]] (coupling 0.07, 6 shared references).","abstract":"We study a gauge realization of an ultralight axion with a hidden $SU(2)$ interaction, an Abelian vector portal, a charged Higgs and a Stückelberg field. The vector absorbs one scalar combination and leaves a physical phase. Its normalization is fixed by the Higgs and Stückelberg scales, while hidden confinement generates its mass. Keeping this phase ultralight requires an additional symmetry: the displayed gauge charges alone allow large phase-dependent scalar interactions. We quantify the suppression required of these interactions. Pure-$SU(2)$ lattice results relate the susceptibility to physical confinement scales; one- and two-loop running illustrate the dependence on the chosen high-energy coupling. We derive the coherent radiation-era density and exhibit an initial angle giving the reference dark-matter abundance for $F_χ\\simeq10^{17}\\,\\GeV$ and zero-temperature mass $m_{χ,0}=3\\times10^{-20}\\,\\eV$. We follow the confined population through number-changing and number-conserving limits and bound its energy contribution. An illustrative inflaton background satisfies the stated vacuum and isocurvature tests, conditional on control of a large portal correction to its potential. Its cold hidden history requires a hidden-to-visible reheating fraction near $5\\times10^{-12}$, whose microscopic origin remains an input. A second, gauge-anomaly-free model gives the same physical phase scale using two charged Higgs singlets. These constructions specify conditional cosmological examples and the additional protection and reheating mechanisms needed to complete them."},{"arxiv":"2611.32905","id":"3233628","title":"TeV Gamma-Ray Transparency Bounds on Neutrinos and Axions","authors":"Shengyi Liu, Hyeonseok Seong, Chen Sun, Seokhoon Yun","score":5.7,"section":"new","rank":28,"parts":[0.0,0.07,0.23,0.0,0.0],"note":"Closest of your papers: [[1597138]] (coupling 0.03, 3 shared references). Closest network paper: [[2937257]] (coupling 0.08, 6 shared references).","abstract":"Multi-TeV gamma rays propagating over cosmological distances measure the extragalactic background light (EBL) through attenuation by electron--positron pair production. This is particularly valuable in the infrared, where the EBL ,{"arxiv":"2608.07270","id":"3188679","title":"Magnetic Catalysis and Fermion Mass Generation in de Sitter Spacetime","authors":"Kohei Fujikura, Toshifumi Noumi, Shintetsu Yamazaki","score":5.3,"section":"replacement","rank":30,"parts":[0.0,0.0,0.35,0.0,0.0],"note":"Closest network paper: [[3183493]] (coupling 0.12, 9 shared references).","abstract":"We consider the dynamics of a charged fermion in de Sitter space in the presence of a uniform background magnetic field, and discuss magnetic catalysis of chiral symmetry breaking using the Nambu--Jona-Lasinio (NJL) model. We evaluate the mode functions of the charged fermion field in this background by imposing the Bunch--Davies vacuum condition. The gap equation is solved in the mean-field approximation. We derive analytic expressions for the gap in several limiting regimes, such as the large-magnetic-field and large-curvature limits. We find that the curvature effect restores chiral symmetry, whereas the magnetic field enhances chiral symmetry breaking through the conventional mechanism of magnetic catalysis. The phase structure associated with chiral symmetry breaking is revealed by numerical calculations."},{"arxiv":"2611.31393","id":"3233452","title":"When heavy vectors meet top partners: HVTP, a unified framework for composite Higgs searches","authors":"Natascia Vignaroli","score":4.0,"section":"new","rank":31,"parts":[0.0,0.04,0.18,0.0,0.0],"note":"Closest of your papers: [[3094526]] (coupling 0.01, 3 shared references). Closest network paper: [[2864372]] (coupling 0.06, 7 shared references).","abstract":"Vector resonances and top partners are characteristic new states of composite Higgs models: they belong to the same strongly coupled sector, and partial compositeness ties their interactions to the mixings that generate the top mass. Experimental searches, however, usually treat them separately. We provide a common framework for both and release HVTP (Heavy Vectors and Top Partners), a public UFO model for MadGraph in which an electroweak triplet, a hypercharge vector and a colour octet couple to a custodial top-partner multiplet, with all couplings obtained from the exact diagonalisation of the mass matrices. The models and the inputs of our results are available at https://doi.org/10.5281/zenodo.24345218. We translate the latest LHC searches at 13 and 13.6 TeV into the parameter space of the model. In natural scenarios the top partners, which are directly tied to the Higgs mass and to the residual tuning, are lighter than the vector resonances; the vectors then decay mostly into partners and become broad: the standard searches lose much of their sensitivity, while the vectors produce partner pairs at rates that can exceed QCD production. For example, at our benchmark points, with partners near their present limits and an electroweak triplet at about 4 TeV, 73-83% of the triplet decays contain partners, and vector-mediated production reaches up to three times the QCD rate. At the HL-LHC this region can be probed by resonance searches extended to large widths and by partner-pair searches that include resonant production; the latter also reveal the partner spectrum. Composite Higgs models with a non-minimal coset generally also contain a pseudoscalar, which can alter the standard decays of the top partners; we include it in the extension HVTP_eta."},{"arxiv":"2611.17253","id":"3228229","title":"Monopole catalysis with massive fermions: the fate of the twisted sector","authors":"Valentin V. Khoze","score":4.0,"section":"replacement","rank":32,"parts":[0.0,0.05,0.17,0.0,0.0],"note":"Closest of your papers: [[695291]] (coupling 0.02, 1 shared references). Closest network paper: [[3150177]] (coupling 0.06, 5 shared references).","abstract":"In the massless limit a fermion scattering on the minimal $SU(5)$ monopole in the lowest partial wave produces an outgoing state with half-integer fermion number in every flavour. This state lives in a twisted sector of the Hilbert space and is now understood as an ordinary fermion attached to a topological line running back to the monopole. In the Standard Model fermion masses and confinement destroy the line at distances greater than the inverse mass scales, causing the twisted state to decay into physical asymptotic states with integer fermion numbers. We study this decay for an incoming lepton or quark of one generation. The cross-section in this partial wave saturates the unitarity bound, $σ=π/p^2$, and the energy of the outgoing state is shared among the four fermion flavours with a broad Dirichlet distribution, which sets the thresholds and the kinematics. Conservation laws allow exactly two decay channels for each incoming fermion, the helicity flip and its $(B+L)$-violating partner. For an incoming electron the $(B+L)$-violating channel is anti-nucleon synthesis, and we determine the branching ratios in two limits: the two channels are equally likely at high energy, and only the helicity flip remains at low energy, below the anti-nucleon threshold. In between we model the energy dependence. For a quark in a slow proton the $(B+L)$-violating channel is catalysed proton decay, which has no threshold and occurs with a probability close to one. Callan's statistical interpretation of the fractional state emerges in a sharper form: the state is not a superposition of two final states with equal weights, but a single state that decays into them with energy-dependent probabilities, equal only at high energy."},{"arxiv":"2607.07140","id":"3178408","title":"Hadronic and partonic composition of QCD matter across the crossover","authors":"Artemiy Lysenko, Mark I. Gorenstein, Marek Gazdzicki, Roman Poberezhniuk, Volodymyr Vovchenko","score":4.0,"section":"replacement","rank":33,"parts":[0.06,0.04,0.06,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2787890]] (coupling 0.01, 1 shared references). Closest network paper: [[3147506]] (coupling 0.02, 2 shared references).","abstract":"We construct a phenomenological equation of state of strongly interacting matter at zero chemical potentials that provides a unified description of lattice QCD thermodynamics in terms of hadronic and partonic degrees of freedom in the temperature range $T=100$-$510$ MeV. The hadronic phase is described by the quantum van der Waals hadron resonance gas, extended by excluded-volume repulsion between mesons, while the quark-gluon plasma is modeled as an ideal gas of quarks and gluons supplemented with a phenomenological interaction term proportional to $T^3$. The two regimes are connected by a smooth crossover switching function. We determine the four model parameters - the meson hard-core radius, the strength of the partonic interaction term, and two parameters of the switching function - by fitting to lattice QCD results for the trace anomaly. In this model, hadronic contributions remain significant up to about $200$ MeV, well above the QCD chiral crossover. We also quantify the crossing contributions generated by the temperature dependence of the switching function. The switching temperature and the hadronic and partonic contributions depend on the chosen equations of state and switching function. The lattice thermodynamic data do not uniquely determine the microscopic composition of QCD matter."},{"arxiv":"2611.31445","id":"3233457","title":"Quarkonium Energy Correlators in Proton-Proton Collisions: Analytic Calculation and Angular-Momentum Hierarchy","authors":"June-Haak Ee, Christopher Lee, Bianka Meçaj, Hugo Pereira Da Costa, Bade Sayki","score":3.8,"section":"new","rank":34,"parts":[0.06,0.03,0.05,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[3094526]] (coupling 0.01, 2 shared references). Closest network paper: [[2815960]] (coupling 0.02, 2 shared references).","abstract":"We present the first complete leading-order (LO) analytic calculation of the quarkonium energy correlator (QEC) in $pp$ collisions, for the color-singlet ${}^3S_1^{[1]}$ and the color-octet ${}^1S_0^{[8]}$, ${}^3S_1^{[8]}$, and ${}^3P_J^{[8]}$ channels of $J/ψ$ production. Instead of the high-$p_T$ fragmentation approximation, the calculation retains the full kinematics of the recoil parton, inverts the map from transverse momentum to the rest-frame angle in closed form, and is validated by \\textsc{HELAC-onia} in shape and absolute normalization. We also give the analytic counterpart of the $p_T$-weighted variant of the correlator. The LO shape of each channel is organized by the total angular momentum $J$ of the $c\\bar c$ pair, as a consequence of the tree-level selection rule that forbids two on-shell gluons from forming a $J=1$ state. This hierarchy is compressed in the central sPHENIX acceptance and exposed by the wider forward coverage at the LHC. In the distribution normalized to the total cross section, much though not all of the scale uncertainty cancels, leaving promising distinctions in the QEC shapes between different $J/ψ$ production channels. The discriminating power of the QEC can be further improved by next-to-leading-order calculations and by utilizing QECs in simultaneous fits with the $p_T$ spectrum and polarization measurements."},{"arxiv":"2611.33105","id":"3233653","title":"Triple-Higgs production: a window on the Higgs potential and anomalous top-Higgs couplings","authors":"John M. Campbell, Giuseppe De Laurentis, R. Keith Ellis, Michelle Gensmann, Ulrich Haisch, Luca Panizzi, Andreas Papaefstathiou, Gilberto Tetlalmatzi-Xolocotzi","score":3.5,"section":"new","rank":35,"parts":[0.0,0.06,0.12,0.0,0.0],"note":"Closest of your papers: [[3094526]] (coupling 0.02, 4 shared references). Closest network paper: [[2845027]] (coupling 0.04, 6 shared references).","abstract":"We present a comprehensive study of triple-Higgs production within the $κ$-framework as a probe of the Higgs potential and anomalous top-Higgs couplings. At leading order, we derive compact parametrisations of the inclusive $gg\\to3h$ cross section in terms of the trilinear and quartic Higgs self-coupling modifiers $κ_3$ and $κ_4$, the top-quark Yukawa coupling modifier $κ_t$, and the anomalous two-top-two-Higgs and two-top-three-Higgs coupling modifiers $κ_{2t}$ and $κ_{3t}$. These parametrisations allow for a fast and accurate interpretation of current and future LHC measurements. Applying them to LHC Run 2 data and high-luminosity LHC projections, we quantify the impact of $κ_t$, $κ_{2t}$, and $κ_{3t}$ on the constraints on $κ_3$ and $κ_4$, and derive the first direct constraint on $κ_{3t}$ from existing LHC data. We further show that parameter points yielding nearly identical inclusive rates can give rise to different kinematic distributions, demonstrating the potential of differential measurements to resolve degeneracies and enhance the sensitivity of future triple-Higgs searches."},{"arxiv":"2611.23381","id":"3230761","title":"Non-Perturbative Moduli Stabilization with Sp$(4,\\mathbb Z)$ Modular Symmetry","authors":"Miguel Hernandez-Segura, Xiang-Gan Liu, Hans Peter Nilles, Saul Ramos-Sanchez","score":3.5,"section":"cross","rank":36,"parts":[0.0,0.0,0.23,0.0,0.0],"note":"Closest network paper: [[2762216]] (coupling 0.08, 13 shared references).","abstract":"We study the stabilization of the three complex moduli associated with Sp$(4,\\mathbb Z)$ modular symmetry by gaugino condensation in $\\mathcal N=1$ supergravity models from heterotic string theory, where one-loop threshold corrections fix both the modular weight and the singularity structure of the superpotential. We determine, for each threshold class, the complete parametrization of the consistent superpotential relying on Sp$(4,\\mathbb Z)$ basic modular-invariant ratios and their syzygies, generalizing the insufficient SL$(2,\\mathbb Z)$-inspired techniques based solely on polynomials of its absolute invariants. This structure supports a rich landscape of supersymmetric Minkowski vacua. Unlike in the SL$(2,\\mathbb Z)$ case, higher-order zeros produce continuous surfaces and curves of supersymmetric Minkowski vacua, while, among the six isolated fixed points, only those with $S_4$ and $D_{12}$ residual symmetries can stabilize all three moduli. We also construct isolated vacua away from fixed points, some of which lie at the moduli values preferred by genus-two modular flavor fits, and examine the suppression of the geometric moduli masses near an enhanced-symmetry point."},{"arxiv":"2611.31401","id":"3233444","title":"Nuclear deep-inelastic scattering as a BSM probe via SMEFT","authors":"Supratim Das Bakshi, T. J. Hobbs, Brandon Kriesten","score":3.4,"section":"new","rank":37,"parts":[0.0,0.0,0.23,0.0,0.0],"note":"Closest network paper: [[2163299]] (coupling 0.08, 5 shared references).","abstract":"Searches for New Physics at the energy frontier have motivated theoretical development of model-independent methods to constrain interactions beyond the Standard Model (BSM) like the Standard Model Effective Field Theory (SMEFT), as well as associated phenomenological analyses. While these approaches are powerful, they are also afflicted by the large space of higher-dimensional operators and the challenge of possible degeneracies among these operators. To help ameliorate these difficulties, processes beyond those at hadron colliders, including deep-inelastic scattering (DIS), have been identified and studied for their ability to contribute added constraining power. In this work, we extend such investigations to charged-lepton DIS involving heavy nuclei, for which we explore the systematics of SMEFT effects for a series of representative cases. In particular, we point out that nuclear effects can reshuffle the luminosities governing partons entering SMEFT-corrected hard interactions, such that the nucleus can serve as an expanded laboratory to explore SMEFT effects complementary to free-nucleon DIS. In particular, we find that nuclear DIS possesses significant constraining power over flavor-isovector SMEFT operator combinations, with reduced nPDF dependence; similarly, improved control over nPDFs would further enhance the SMEFT reach of nuclear DIS observables. We explore projections for future (proposed) facilities like the EIC, LHeC, and FCC-eh, finding that improvements to nuclear parton distribution functions (nPDFs) can further sharpen the reach of nuclear DIS."},{"arxiv":"2611.33071","id":"3233652","title":"The Sensitivity of Higgs Factories to the Minimal Supersymmetric Standard Model via Precision Measurements","authors":"Kamal Maayergi, Devin G. E. Walker, Michael Fagundes-Rocha, Michael E. Peskin","score":3.2,"section":"new","rank":38,"parts":[0.0,0.03,0.15,0.0,0.0],"note":"Closest of your papers: [[1803365]] (coupling 0.01, 1 shared references). Closest network paper: [[2090218]] (coupling 0.05, 2 shared references).","abstract":"Precision measurements of Higgs boson couplings at future Higgs factories provide an indirect probe of new particles at mass scales beyond the reach of the high luminosity run of the Large Hadron Collider (HL-LHC). We study this sensitivity in the Minimal Supersymmetric Standard Model (MSSM), focusing on radiative corrections to the third-generation Yukawa couplings. In particular, supersymmetric threshold corrections to the bottom Yukawa coupling and, in a smaller parameter region, to the tau Yukawa coupling, can remain significant even for multi-TeV superpartner masses. We perform a numerical survey of the MSSM parameter space, using a Markov Chain Monte Carlo, in order to identify models consistent with a 125 GeV Higgs boson and exhibiting potentially observable Higgs-coupling deviations. We find that precision measurements of the bottom Yukawa coupling can probe heavy Higgs masses of order 2-3 TeV and retain sensitivity to gluinos, Higgsinos, and bottom squarks with masses above 5 TeV. The corresponding sensitivity in the τ Yukawa coupling is also present but more limited in parameter space. These results illustrate the characteristic pattern of Higgs-coupling deviations predicted by the MSSM. They demonstrate that precision Higgs measurements can provide sensitivity to supersymmetric physics well beyond the expected direct-search reach of the HL-LHC."},{"arxiv":"2611.28194","id":"3232073","title":"HEP-Ex-Bench: Evaluating Agentic Performance in High Energy Physics Experiment Data Analyses with Sealed Worlds","authors":"Andrzej Novák, Yiyang Zhao, Dolores Garcia, Eric A. Moreno, Jeffrey Krupa, Víctor Bresó-Pla, Samuel Bright-Thonney, Lukas Heinrich, Michael Kagan, Philip Harris","score":2.2,"section":"cross","rank":39,"parts":[0.0,0.02,0.1,0.0,0.0],"note":"Closest of your papers: [[3130296]] (coupling 0.01, 1 shared references). Closest network paper: [[2658297]] (coupling 0.03, 5 shared references).","abstract":"Agentic systems are increasingly being explored for automating experimental high-energy physics measurements, but the correctness of their results can today be reliably evaluated only via extensive expert review. To address this, we propose a method to perform detailed quantitative evaluations of agent-driven analyses through the use of blind analysis and injection tests, which are critical in a typical expert review. Agents develop a data analysis pipeline on a public dataset, while the evaluation is performed on programmatically generated sealed private datasets where signals are injected and simulation settings varied within realistic detector uncertainties. By requiring agents to provide a single workflow that is evaluated across these \"sealed worlds\", we are able to test the accuracy and robustness of the workflows. We demonstrate the approach on four tasks built from CMS open data and present it as a way to reliably benchmark scientific work in experimental high-energy physics. At the time of writing, the best-performing model, Gemini 4 Argon, reaches 60% of the score of the expert reference analyses on average, ahead of GPT 6   G=svg.append('g');
  G.append('g').selectAll('path').data(links).join('path').attr('class',l=>'edge '+l.k)
    .attr('d',l=>{const a=l.source,b=l.target;return `M${a.x},${a.y}Q${(a.x+b.x)/2},${(a.y+b.y)/2-Math.abs(a.x-b.x)*.12} ${b.x},${b.y}`});
  G.append('g').selectAll('circle').data([...sim].sort((a,b)=>RANK[b.n.role]-RANK[a.n.role])).join('circle')
    .attr('class','node').attr('cx',s=>s.x).attr('cy',s=>s.y).attr('r',s=>r(s.n)).attr('fill',s=>col(s.n))
    .on('pointerenter',(ev,s)=>{hover=s.n;showTip(ev,s.n);paint()}).on('pointermove',(ev,s)=>showTip(ev,s.n))
    .on('pointerleave',()=>{hover=null;tip.hidden=true;paint()}).on('click',(ev,s)=>pick(s.n,false));
  const lab=sim.filter(s=>isNew(s.n)||s.n.role==='seed'||s.n.deg>=3);
  const L=lab.map(s=>{const right=s.x>W*.8,t=isNew(s.n)?`#${s.n.rank} ${s.n.first}`:`${s.n.first} ${s.n.year}`,w=t.length*6.2;return{s,t,right,x0:right?s.x-r(s.n)-4-w:s.x+r(s.n)+4,w,y:s.y+4}}).sort((a,b)=>a.y-b.y);
  const placed=[];L.forEach(l=>{let k=0;while(k<40&&placed.some(p=>l.x0<p.x0+p.w&&p.x0<l.x0+l.w&&Math.abs(l.y-p.y)<13)){l.y+=13*(k%2?-1:1)*(1+Math.floor(k/2));k++;l.y=Math.max(m.t+10,Math.min(H-m.b-4,l.y))}placed.push(l)});
  G.append('g').selectAll('text').data(L).join('text').attr('class','nlabel').attr('x',l=>l.right?l.s.x-r(l.s.n)-4:l.s.x+r(l.s.n)+4).attr('y',l=>l.y)
    .attr('text-anchor',l=>l.right?'end':'start').text(l=>l.t);
  paint();
}
function showTip(ev,n){const b=document.getElementById('chart').getBoundingClientRect();tip.hidden=false;tip.textContent=`${auth(n)} (${n.year}) — ${plain(n.title)}`+(isNew(n)?` · score ${n.score}`:'');
  let L=ev.clientX-b.left+12;if(L>b.width-290)L=ev.clientX-b.left-290;tip.style.left=Math.max(4,L)+'px';tip.style.top=(ev.clientY-b.top+12)+'px'}
function paint(){if(!G)return;const f=hover||sel,on=new Set();if(f){on.add(f.i);f.out.forEach(i=>on.add(i));f.inn.forEach(i=>on.add(i))}
  svg.classed('dim',!!f);
  G.selectAll('path.edge').attr('class',l=>'edge '+l.k+(!f?'':l.s===f.i?' hot out':l.t===f.i?' hot in':''));G.selectAll('path.edge.hot').raise();
  G.selectAll('circle').classed('on',s=>on.has(s.n.i)).classed('sel',s=>sel&&s.n.i===sel.i).classed('match',s=>query&&`${s.n.first} ${s.n.title} ${s.n.arxiv} ${s.n.authors||''}`.toLowerCase().includes(query));
  G.selectAll('text.nlabel').classed('on',l=>on.has(l.s.n.i))}
function panel(){const p=document.getElementById('panel'),n=sel;
  if(!n){p.innerHTML='<p>Select a paper in the network.</p>';return}
  const links=`<div class="links">${n.id?`<a href="https://inspirehep.net/literature/${n.id}" target="_blank" rel="noopener">INSPIRE</a>`:''}${n.arxiv?`<a href="https://arxiv.org/abs/${esc(n.arxiv)}" target="_blank" rel="noopener">arXiv</a>`:''}</div>`;
  if(isNew(n)) p.innerHTML=`<div class="role" style="color:${col(n)}">#${n.rank} · ${esc(SEC[n.section])} · score ${n.score.toFixed(1)}</div><h4>${esc(n.title)}</h4>
   <div class="meta">${esc(auth(n))} · arXiv:${esc(n.arxiv)}</div><p>${why(n.note)}</p><div class="links"><a href="#p${n.i}">Back to abstract</a></div>`;
  else p.innerHTML=`<div class="role" style="color:${col(n)}">${esc(ROLE[n.role])}</div><h4>${esc(n.title)}</h4>
   <div class="meta">${esc(auth(n))} · ${n.year}${n.arxiv?' · arXiv:'+esc(n.arxiv):''}</div>
   <div class="stats"><span>${n.cites.toLocaleString()} citations</span><span>${n.inn.filter(i=>isNew(N[i])).length} of the matches link here</span></div>${links}`;
  tex(p)}
function pick(n,scroll){sel=n;panel();paint();document.querySelectorAll('.paper').forEach(el=>el.classList.toggle('sel',el.id==='p'+n.i));if(scroll)document.getElementById('chart').scrollIntoView({behavior:'smooth',block:'nearest'})}
const present=new Set(N.map(n=>n.role));
document.getElementById('legend').innerHTML=['today','repl','seed','other'].filter(k=>present.has(k)).map(k=>`<span><i class="dot" style="background:var(--${k})"></i>${esc(ROLE[k])}</span>`).join('')+'<span style="color:var(--fg-3)">Listing papers: size ∝ score; others: size ∝ log(citations)</span>';
document.getElementById('q').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();paint()});
svg.on('click',ev=>{if(ev.target.tagName!=='circle'){sel=null;panel();paint()}});
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(draw,200)});
function nextList(){const X=RAW.next||[];if(!X.length)return;const box=document.getElementById('nextlist'),more=document.getElementById('more');
  more.hidden=false;more.querySelector('summary').firstChild.textContent=`The next ${X.length} papers by score `;
  const nmin=M.nextMin;
  document.getElementById('moresub').textContent=`below the threshold of ${M.threshold}${nmin!=null?`: every paper scoring ${nmin} or more, and at least ${M.nextCount} when available`:''}; not drawn in the network`;
  const cut=nmin!=null?X.findIndex(n=>n.score<nmin):-1;
  box.innerHTML=X.map((n,i)=>(i===cut?`<li class="divider">Below ${nmin}: weaker relation (most of these share no specific reference, coupling or topic with your work)</li>`:'')+`<li><div class="role" style="color:var(--${n.section==='replacement'?'repl':'today'})">#${n.rank} · ${esc(SEC[n.section])} · score ${n.score.toFixed(1)}</div>
    <div class="t">${esc(n.title)}</div><div class="authors">${authors(n.authors)} · arXiv:${esc(n.arxiv)}</div>
    ${n.note?`<p class="why">${why(n.note)}</p>`:''}
    <details class="abs"><summary>Abstract</summary><p class="abs">${esc(n.abstract)}</p></details>
    <div class="links">${n.id?`<a href="https://inspirehep.net/literature/${n.id}" target="_blank" rel="noopener">INSPIRE</a>`:''}<a href="https://arxiv.org/abs/${esc(n.arxiv)}" target="_blank" rel="noopener">arXiv</a><a href="https://arxiv.org/pdf/${esc(n.arxiv)}" target="_blank" rel="noopener">PDF</a></div></li>`).join('');
  more.addEventListener('toggle',()=>{if(more.open)tex(box)})}
const rtip=document.getElementById('reftip');let rcur=null;
function refShow(el){const r=REFS[el.dataset.ref];if(!r)return;rcur=el;rtip.textContent=`${auth(r)} (${r.year}) — ${plain(r.title)}`;rtip.hidden=false;
  const b=el.getBoundingClientRect(),t=rtip.getBoundingClientRect();let L=Math.min(Math.max(8,b.left),innerWidth-t.width-8),T=b.bottom+6;
  if(T+t.height>innerHeight-8)T=b.top-t.height-6;rtip.style.left=L+'px';rtip.style.top=T+'px'}
function refHide(){rtip.hidden=true;rcur=null}
document.addEventListener('pointerover',e=>{const el=e.target.closest('.ref');if(el&&e.pointerType==='mouse')refShow(el)});
document.addEventListener('pointerout',e=>{if(e.target.closest('.ref')&&e.pointerType==='mouse')refHide()});
document.addEventListener('click',e=>{const el=e.target.closest('.ref');if(el)refShow(el);else if(rcur)refHide()});
document.addEventListener('focusin',e=>{const el=e.target.closest('.ref');if(el)refShow(el)});
document.addEventListener('focusout',e=>{if(e.target.closest('.ref'))refHide()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')refHide()});
addEventListener('scroll',()=>{if(rcur)refHide()},{passive:true});
// the rest of the day's papers by score: only the title, linked to the arXiv record
function restList(){const X=RAW.rest||[];if(!X.length)return;const d=document.getElementById('rest'),box=document.getElementById('restlist');
  d.hidden=false;d.querySelector('summary').firstChild.textContent=`All other ${X.length} papers in this listing `;
  document.getElementById('restsub').textContent='by score, title only';
  box.innerHTML=X.map(n=>`<li><span class="sc">#${n.rank} · ${n.score.toFixed(1)}</span><a href="https://arxiv.org/abs/${esc(n.arxiv)}" target="_blank" rel="noopener">${esc(n.title)}</a></li>`).join('');
  d.addEventListener('toggle',()=>{if(d.open)tex(box)})}
list();nextList();restList();fold();draw();panel();
window.addEventListener('load',()=>{tex(document.getElementById('list'));tex(document.getElementById('panel'));fold();
  if(window.MathJax&&MathJax.startup&&MathJax.startup.promise)MathJax.startup.promise.then(()=>setTimeout(fold,300))});
addEventListener('resize',()=>{clearTimeout(window._ft);window._ft=setTimeout(fold,200)});
</script>
