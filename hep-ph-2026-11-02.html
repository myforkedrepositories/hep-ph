<script>
const RAW = {"n":[{"id":"3221005","arxiv":"2610.40766","title":"Hints of self-interacting dark matter from strong gravitational lensing","first":"Gilman","nauth":6,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[1842151]]. Closest of your papers: [[2964960]] (coupling 0.11, 11 shared references). Closest network paper: [[3113487]] (coupling 0.25, 33 shared references). Shared topics: dark matter mass, indirect detection, dark sector, dark matter.","score":41.6,"rank":1,"section":"cross","parts":[0.45,0.3,0.7,0.0,0.63],"abstract":"An analysis of 29 quadruply imaged quasars hints at dark matter halo densities consistent with gravothermal core collapse, a key prediction of self-interacting dark matter. We interpret this evidence through elastic Yukawa scattering, combining lensing with upper limits on the cross-section strength from galaxy clusters and Milky Way satellite evaporation. Favored models have dark matter masses of $20$-$80\\,{\\rm GeV}$, MeV-scale mediators, and Yukawa-potential strengths near $10^{-3}$, yielding cross-sections of $10^2$--$10^4 \\, {\\rm cm^2\\,g^{-1}}$ at $10\\,{\\rm km\\,s^{-1}}$. Cosmological, direct and indirect detection bounds on MeV-scale mediators motivate a neutrinophilic scalar dilepton that decays invisibly without Higgs mixing. These results demonstrate how inferences on core collapse constrain dark sector physics.","authors":"Daniel Gilman, Kalliopi Petraki, Thomas Pignard, James Gurian, Alex Kusenko, Anna Nierenberg","nlinked":83,"nref":109,"src":"INSPIRE","html":true},{"id":"3220987","arxiv":"2610.40775","title":"On the Role of Gravity in Supercooled Phase Transitions","first":"Cutrona","nauth":2,"year":2026,"cites":0,"role":"today","note":"Cites 2 network papers: [[1937352]], [[2657746]]. Closest of your papers: [[2787890]] (coupling 0.03, 5 shared references). Closest network paper: [[2747842]] (coupling 0.15, 30 shared references). Shared topics: primordial black hole.","score":37.1,"rank":2,"section":"new","parts":[0.7,0.09,0.44,0.0,0.33],"abstract":"Theories with radiative mass generation and radiative symmetry breaking (RSB) lead to first-order phase transitions (FOPTs) and the production of gravitational waves (GWs) as well as primordial black holes if supercooling lasts long enough. Here we investigate the role of gravity in supercooled FOPTs that occur in the RSB scenario. We use a model-independent approach that is valid when a quantity (which we explicitly determine and is computable once the model is specified) is small enough. Eventually, the curvature of spacetime becomes relevant if the FOPT does not complete in the case in which gravity is ignored. We also include the effect on the FOPT of the non-minimal couplings with coefficients of zero mass dimension. Depending on such non-minimal couplings, gravity can enhance or reduce the region of parameter space where the phase transition completes. Observable consequences of the role of gravity on the FOPT that can be probed by current and future GW detectors are then worked out and we explore the possibility that the background of GWs detected by pulsar timing arrays is produced by FOPTs in the RSB scenario. We also estimate the number of e-folds that elapse when the field playing the role of the order parameter is trapped in the false vacuum, which provides important information for cosmology.","authors":"Filippo Cutrona, Alberto Salvio","nlinked":77,"nref":87,"src":"INSPIRE","html":true},{"id":"3118629","arxiv":"2602.11085","title":"Sterile neutrino dark matter in conformal Majoron models","first":"Gonçalves","nauth":5,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[1421898]]. Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1597138]] (coupling 0.06, 7 shared references). Closest network paper: [[2954192]] (coupling 0.13, 11 shared references). Shared topics: neutrino mass and mixing, dm abundance, viable parameter space, relic density, relic abundance.","score":37.0,"rank":3,"section":"replacement","parts":[0.48,0.17,0.36,0.0,0.97],"abstract":"We study sterile neutrino dark matter (DM) in a classically conformal U(1)' extension of the Standard Model with three right-handed neutrinos and a Majoron-like singlet scalar that generate the observed pattern of active neutrino masses and mixing via the type-I seesaw mechanism. Working in the regime of strongly suppressed active-sterile mixing, we show that the observed DM abundance can be produced through freeze-in from feeble interactions mediated by the heavy Z' and the conformal scalar. We solve the Boltzmann equation for the nonthermal phase-space distribution and confront the scenario with Lyman-$α$ and strong gravitational lensing data by computing the matter power spectrum. For keV-mass sterile neutrinos we identify the viable parameter space consistent with the inferred relic density and structure-formation and X-ray bounds, including regions compatible with a tentative 3.5 keV line. If a second sterile state is long-lived, late decays can realize a two-component setup that alleviates the $S_8$ tension. However, explanations of the 3.5 keV line and the $S_8$ tension are incompatible with the strong-lensing limit from JWST if the neutrinos saturate the relic abundance. In a highly fine-tuned variant of the model, the 220 PeV KM3NeT event can also be explained by invoking the decay of a superheavy sterile neutrino.","authors":"João Gonçalves, Danny Marfatia, António P. Morais, Vinícius Oliveira, Roman Pasechnik","nlinked":73,"nref":77,"src":"INSPIRE","html":true},{"id":"2969618","arxiv":"2509.11906","title":"Enhanced Cosmic-Ray Cooling in AGN from Dark Matter Deep Inelastic Scattering","first":"Li","nauth":5,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[2012895]]. Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2856850]] (coupling 0.04, 8 shared references). Closest network paper: [[3115426]] (coupling 0.12, 17 shared references). Shared topics: dm mass, dark matter.","score":29.4,"rank":4,"section":"replacement","parts":[0.48,0.13,0.35,0.0,0.34],"abstract":"The diffusion of high-energy cosmic rays (CRs) through the dark matter (DM) spikes of active galactic nuclei entails significant energy loss via interactions with DM. While previous studies of sub-GeV DM have focused on elastic scattering, this process becomes insufficient at higher proton energies and DM masses. In this work, we investigate the CR-DM deep inelastic scattering (DIS) as mediated by a vector portal. We calculate the DIS contribution to the CR energy loss rate and derive stringent exclusion limits on the CR-DM scattering cross-section for DM masses between $10^{-6}$ GeV and $1$ GeV. For higher CR energies and mediator masses, the resulting CR cooling timescales are reduced by orders of magnitude after involving the DIS contribution, producing stringent constraints that surpass most of current experimental limits.","authors":"Linjie Li, Chih-Ting Lu, Arvind Kumar Mishra, Liangliang Su, Lei Wu","nlinked":122,"nref":127,"src":"INSPIRE","html":true},{"id":"2854105","arxiv":"2411.19196","title":"Dark axion portal at $Z$ boson factories","first":"Jodłowski","nauth":1,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[1678642]]. Closest of your papers: [[1597138]] (coupling 0.01, 1 shared references). Closest network paper: [[3154646]] (coupling 0.05, 5 shared references). Shared topics: dark matter.","score":20.2,"rank":5,"section":"replacement","parts":[0.45,0.03,0.16,0.0,0.13],"abstract":"Dark axion portal connects an axion-like-particle (ALP), which can be the QCD axion, with the SM by the coupling to a photon and a dark photon, leading to a rich and distinct phenomenology related to dark matter, astrophysics, and cosmology. We note that due to the gauge invariance, the $Z$ boson-dark photon-ALP coupling should also be generated with sizable strength, and we study its phenomenological consequences at $Z$ boson factories: LEP, FCC-ee, and forward physics detectors at the LHC and FPF@FCC - FASER and MATHUSLA. Due to the large number of $Z$ bosons produced, DAP particles can be efficiently produced and detected by semi-visible displaced decays of the heavier DS species to $γ$+inv. or $f^+ f^-$+inv., and via missing energy signature with zero or one photon. Because of the complementarity of the two approaches, we find great prospects in exploring both short and long-lived lifetime regimes of DAP, especially when the heavier dark species has mass above $0.1\\,$GeV.","authors":"Krzysztof Jodłowski","nlinked":33,"nref":33,"src":"INSPIRE","html":true},{"id":"3221086","arxiv":"2610.40781","title":"Leaking Sound Waves: Gravitational Waves From Dark Sectors Weakly Coupled to the Standard Model","first":"Finetti","nauth":3,"year":2026,"cites":0,"role":"today","note":"Closest of your papers: [[2787890]] (coupling 0.10, 7 shared references). Closest network paper: [[3128752]] (coupling 0.20, 22 shared references). Shared topics: dark sector.","score":18.4,"rank":6,"section":"cross","parts":[0.0,0.26,0.57,0.0,0.19],"abstract":"First-order phase transitions in a dark sector can produce an observable stochastic gravitational-wave background, and many models predicting such signals in current and future experiments have been explored. For moderately strong transitions, hydrodynamical simulations suggest that sound waves generated by the expansion and collisions of true-vacuum bubbles are the dominant source of gravitational waves. It is often assumed that these sound waves propagate only within the dark-sector fluid, while the impact of the visible sector is neglected. In this paper, we investigate the effects of a weak coupling between the dark and visible fluids on the resulting gravitational-wave signal. We adopt a phenomenological hydrodynamical description of two ultra-relativistic fluids, parametrizing their interactions without specifying an underlying microscopic model. We focus on the regime in which the coupling can be neglected during the phase transition but becomes relevant during the subsequent, longer-lasting period of sound wave propagation. Within this framework, we analytically show that, even if the bubble expansion initially affects only the dark fluid, sound waves can subsequently be induced in the visible sector. Using the sound-shell model, we find that, despite the additional sound waves generated in the visible sector, the total gravitational-wave signal sourced by both fluids is generally suppressed compared to the case of a completely decoupled dark sector. This suppression becomes more pronounced for larger interaction rates and a larger ratio of relativistic degrees of freedom in the visible sector to those in the dark sector. The coupling also modifies the shape of the gravitational-wave spectrum.","authors":"Marco Finetti, Helena Kolešová, Daniil Krichevskiy","nlinked":45,"nref":50,"src":"INSPIRE","html":true},{"id":"3220971","arxiv":"2610.40793","title":"Layered Wire-Grid Haloscope for Millielectronvolt Axions and Dark Photons","first":"Caputo","nauth":1,"year":2026,"cites":0,"role":"today","note":"Also cites widely used network papers: [[1783234]]. Closest of your papers: [[1941263]] (coupling 0.11, 18 shared references). Closest network paper: [[2116098]] (coupling 0.12, 16 shared references).","score":16.4,"rank":7,"section":"new","parts":[0.06,0.31,0.34,0.0,0.0],"abstract":"We propose MADGRID (Millielectronvolt Axions and Dark photons with layered GRIDs), a few wire grids in front of a mirror, tuned by their spacing, forming an epsilon-near-zero slab that radiates through its face into external optics. Unlike wire-plasma haloscopes, the signal need not cross the lossy medium to reach an antenna, and metal grids replace the disks of dielectric haloscopes. A 1 m$^2$ array in 10 T could probe axion-photon couplings below the CAST bound up to 1.4 meV with kinetic-inductance detectors, and KSVZ couplings over 0.8-3.9 meV with future photon counters. Without a magnet, it could probe dark photon mixings down to $3.4\\times10^{-16}$.","authors":"Andrea Caputo","nlinked":92,"nref":123,"src":"INSPIRE","html":true},{"id":"3221629","arxiv":"2610.41575","title":"Phase transition dynamics of Abelian-Higgs vortices in the oscillating axion background","first":"Kitajima","nauth":2,"year":2026,"cites":0,"role":"today","note":"Also cites widely used network papers: [[1783234]]. Closest of your papers: [[1941263]] (coupling 0.08, 13 shared references). Closest network paper: [[2691930]] (coupling 0.09, 14 shared references). Shared topics: dark matter.","score":13.9,"rank":8,"section":"new","parts":[0.06,0.22,0.27,0.0,0.13],"abstract":"We investigate the effect of an oscillating axion background on thermally induced vortex-antivortex production in the Abelian-Higgs model. Through its coupling to the gauge field, the axion sources an electromagnetic response in the presence of vortex magnetic flux, modifying the dynamics of the vortices. We study this system using Langevin lattice simulations with dissipation and stochastic noise. It is shown that the phase transition dynamics of Abelian-Higgs vortices, namely the pair creation of vortex and antivortex under thermal fluctuations, can be significantly modified in the oscillating axion background. We find that the axion background shifts the rapid increase in the vortex density to lower temperature. In particular, this transition temperature becomes smaller as the oscillation frequency of the axion increases. The temperature dependence of the correlation length is also modified. These features provide a new experimental approach for the axion dark matter using superconducting devices.","authors":"Naoya Kitajima, Shota Nakagawa","nlinked":61,"nref":71,"src":"INSPIRE","html":true},{"id":"3191617","arxiv":"2608.15240","title":"Prospects for Direct Detection of Ultralight Dark Matter candidates in deci-Hz Band with IndIGO-D","first":"Hoque","nauth":3,"year":2026,"cites":0,"role":"repl","note":"Closest of your papers: [[1941263]] (coupling 0.06, 12 shared references). Closest network paper: [[2810207]] (coupling 0.07, 23 shared references). Shared topics: dark matter candidate, direct detection, dark matter.","score":13.6,"rank":9,"section":"replacement","parts":[0.0,0.19,0.21,0.0,0.49],"abstract":"We investigate the sensitivity of IndIGO-D, a proposed space-based decihertz gravitational-wave interferometer, to different classes of ultralight dark matter. IndIGO-D will probe the $\\sim0.01$--$10~\\mathrm{Hz}$ frequency band between those accessible to current ground- and future space-based gravitational-wave interferometers, providing access to ultralight dark-matter masses beyond the reach of existing instruments. We consider two complementary signatures: interferometric displacements induced by coherently oscillating scalar (dilaton), vector (dark-photon, $U(1)_B$ and $U(1)_{B-L}$ gauge groups), and tensor fields with masses $m_{\\rm DM}\\sim10^{-17}$--$10^{-14}~\\mathrm{eV}$; and changes in laser polarization induced by pseudoscalar axion dark matter at higher masses, around $m_a\\sim10^{-12}~\\mathrm{eV}$. For the dilatons, dark photons and tensors, we compute the expected sensitivities using two pipelines -- cross-correlation and BSD excess-power -- assuming L-shaped and triangular interferometer layouts and three representative noise power spectral densities (S1, S2, S3), each for two years of continuous observation. We find that the projected sensitivities agree to within a factor of order unity across the search pipelines and interferometer geometries. In particular, we show that IndIGO-D could open previously unconstrained coupling parameter space for vector and tensor dark matter across $m_{\\rm DM}\\sim10^{-16}$--$10^{-14}~\\mathrm{eV}$, bridging the sensitivity of space- and ground-based experiments. For axion dark matter, we demonstrate that a complementary detection for laser light polarization shifts, limited primarily by photon shot noise, could probe the axion-photon coupling $g_{aγ}$ at masses around $m_a\\sim10^{-12}~\\mathrm{eV}$ at a level potentially better than that of other future experiments without degrading sensitivity to gravitational waves.","authors":"Md. Emanuel Hoque, Andrew L. Miller, Arunava Mukherjee","nlinked":99,"nref":114,"src":"INSPIRE","html":true},{"id":"3221112","arxiv":"2610.41953","title":"Topological Multi-Natural Inflation","first":"Chai","nauth":2,"year":2026,"cites":0,"role":"today","note":"Closest of your papers: [[2039411]] (coupling 0.03, 2 shared references). Closest network paper: [[2630195]] (coupling 0.06, 6 shared references). Shared topics: region consistent, complex scalar.","score":12.3,"rank":10,"section":"new","parts":[0.0,0.08,0.18,0.0,0.73],"abstract":"We investigate topological inflation in minimal multi-natural inflation, in which the axion potential consists of two cosine terms. Focusing on the high-scale regime, we perform a systematic parameter scan for representative ratios of the two periods and identify regions consistent with current constraints on the scalar spectral index and tensor-to-scalar ratio, including those from the Atacama Cosmology Telescope. The interplay of the two harmonics allows departures from the quartic hilltop limit and accommodates the higher spectral index favored by recent cosmological data combinations. We characterize the hilltop and near-inflection-point branches and analyze the associated vacuum structure and domain-wall properties. We also discuss a symmetry-breaking origin of the required domain walls when the inflaton is the angular component of a complex scalar field. We identify regions in which the observational constraints and the adopted criteria for topological inflation are simultaneously satisfied, including regions with a sub-Planckian axion decay constant. Our results show that the observational tension encountered in the minimal quartic double-well model need not extend to topological inflation in a minimal multi-natural axion potential.","authors":"Siao Yang Chai, Fuminobu Takahashi","nlinked":26,"nref":29,"src":"INSPIRE","html":true},{"id":"3221665","arxiv":"2610.41823","title":"Primordial black holes and gravitational waves from aligned axion inflation","first":"Ijaz","nauth":1,"year":2026,"cites":0,"role":"today","note":"Closest of your papers: [[2790381]] (coupling 0.04, 8 shared references). Closest network paper: [[3158142]] (coupling 0.11, 29 shared references). Shared topics: primordial black hole.","score":11.7,"rank":11,"section":"cross","parts":[0.0,0.12,0.33,0.0,0.33],"abstract":"We study the production of primordial black holes (PBHs) and scalar-induced gravitational waves (SIGWs) in aligned axion inflation through the transition between two stages of inflation. The first stage proceeds along a metastable trajectory and ends when this trajectory loses stability, causing the fields to turn towards the attractor of the second inflationary stage. During the transition, coupled adiabatic--entropy evolution produces a localized enhancement of the curvature power spectrum. We compute the PBH abundance from this spectrum assuming Gaussian primordial curvature perturbations and using the nonlinear compaction-function formalism with a spectrum-dependent collapse threshold and critical collapse. Representative benchmark solutions yield asteroid-mass PBHs with a potentially significant dark-matter abundance, together with an associated SIGW background.","authors":"Nadir Ijaz","nlinked":117,"nref":118,"src":"INSPIRE","html":true},{"id":"3113487","arxiv":"2601.23264","title":"MARVELously Dark: the density profile evolution of dwarf halos in velocity-dependent SIDM","first":"Engelhardt","nauth":9,"year":2026,"cites":8,"role":"other","note":"","score":null},{"id":"2116098","arxiv":"2207.07677","title":"Dark matter axions in the early universe with a period of increasing temperature","first":"Arias","naut "],[6,14,"k"],[49,52,"c"],[0,22,"k"],[38,27,"c"],[43,17,"c"],[6,24,"k"],[2,26,"k"],[57,42,"c"],[54,24,"c"],[9,32,"k"],[25,14,"c"],[47,12,"c"],[5,37,"k"],[45,36,"c"],[5,35,"k"],[21,27,"c"],[24,55,"c"],[51,14,"c"],[29,33,"c"],[52,19,"c"],[57,19,"c"],[3,52,"c"],[6,55,"k"],[5,40,"k"],[25,45,"c"],[40,37,"c"],[7,39,"k"],[1,57,"k"],[10,21,"k"],[40,42,"c"],[13,48,"c"],[56,52,"c"],[3,28,"c"],[9,30,"k"],[3,33,"k"],[47,14,"c"],[1,35,"k"],[31,42,"c"],[2,36,"c"],[8,24,"k"],[1,42,"c"],[10,31,"k"],[4,43,"k"],[31,41,"c"],[6,47,"k"],[49,47,"c"],[0,48,"k"],[50,36,"c"],[7,54,"k"],[49,18,"c"],[12,14,"c"],[7,47,"k"],[4,56,"k"],[39,19,"c"],[0,11,"k"],[19,55,"c"],[7,17,"k"],[25,51,"c"],[37,47,"c"],[8,14,"k"],[10,25,"k"],[10,27,"k"],[11,48,"c"],[13,52,"c"],[1,31,"k"],[31,44,"c"],[37,49,"c"],[2,34,"k"],[0,35,"k"],[5,38,"k"],[1,40,"k"],[14,19,"c"],[43,52,"c"],[10,44,"k"],[8,45,"k"],[47,19,"c"],[2,17,"k"],[0,46,"c"],[4,50,"c"],[10,51,"k"],[3,53,"k"],[12,19,"c"],[48,35,"c"],[6,19,"c"],[6,18,"k"]],"next":[{"arxiv":"2610.41473","id":"3221608","title":"Probing dark sector with decihertz gravitational wave observations of compact binary inspirals in IndIGO-D","authors":"Divya Tahelyani, Abhishek Sharma, Anand S. Sengupta, Arpan Bhattacharyya","score":9.9,"section":"cross","rank":12,"parts":[0.0,0.04,0.3,0.0,0.43],"note":"Closest of your papers: [[2751074]] (coupling 0.01, 2 shared references). Closest network paper: [[2843822]] (coupling 0.10, 9 shared references). Shared topics: yukawa interaction, dark sector, dark matter.","abstract":"We investigate the potential of decihertz gravitational-wave (GW) observations of compact-binary inspirals to probe atomic dark matter (aDM) and its interactions through an ultralight massive dark photon. We consider a scenario in which neutron stars accumulate DM charged under a dark Abelian massive vector mediator, leading to an additional long-range Yukawa interaction between compact objects and associated dipolar radiation. In this framework, the GW waveform acquires characteristic corrections parameterized by the Yukawa coupling strength $α$, the dipole-radiation parameter $γ$, and a parameter related to the mediator mass $μ$. These corrections include a leading $-1$ post-Newtonian dipole contribution and finite-mediator-mass effects. We relate the aDM corrections to existing parameterized tests of general relativity and perform Bayesian parameter-estimation analyses for simulated binary neutron star (BNS) and neutron star-black hole (NSBH) systems incorporating the modified binary inspiral in a proposed space-based decihertz detector, named IndIGO-D. For a GW170817-like BNS with nonzero aDM couplings chosen near current observational bounds, we find that the dark-photon rest energy can be inferred with a $90\\%$ credible uncertainty of $O(10^{-20})\\,\\mathrm{eV}$, conditional on a detectable dark-sector contribution. Analyses with weaker dark-sector interactions $(α\\lesssim O(10^{-8}))$ show that the mediator mass remains unconstrained when both the Yukawa coupling and dipole-radiation contribution are negligible, but can be measured even for a negligible Yukawa coupling if the dipole-radiation contribution is sufficiently strong. Our results demonstrate that future decihertz GW observatories can serve as powerful laboratories for testing dark-sector physics and probing dark matter interactions in compact binaries through precision GW measurements."},{"arxiv":"2610.40821","id":"3221049","title":"The Yottascale at Tera-$Z$: Petascale SUSY?","authors":"Lukas Allwicher, Francisco N. C. Dahab, Christophe Grojean, Gabriel M. Salla, Lucine Tabatt","score":9.3,"section":"new","rank":13,"parts":[0.06,0.12,0.25,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1394206]] (coupling 0.04, 4 shared references). Closest network paper: [[2053590]] (coupling 0.09, 17 shared references).","abstract":"As experimental and theoretical advances are made, the paradigm of grand unification faces growing challenges. In light of what has been learned at the LHC, from Higgs mass measurement and direct searches for supersymmetry, we contrast the current theoretical predictions in a simplified supersymmetric grand unified theory against present and future experimental precision, focussing on threshold corrections and renormalisation group effects above the electroweak scale. More precisely, the theoretical precision is juxtaposed to the experimental one. Especially, the impact of a future Tera-$Z$ factory such as FCC-ee is examined, while also considering the expected future improvement of proton decay constraints. We find that the improvement on the measurement of the gauge couplings expected at Tera-$Z$ will yield sensitivity to higher loop orders in the evolution of the couplings up to the Yottascale, calling for further theoretical efforts. In a minimal $\\rm{SU}(5)$ scenario with nearly degenerate SUSY spectrum, we study the impact of the proton decay constraint on the SUSY scale, comparing 2- and 3-loop analyses. While the 2-loop results point to a SUSY scale around 1 PeV, the 3-loop analysis seems to exclude the model entirely. This follows from the fact that at 1-loop in the GUT threshold corrections, the mass of the colour-triplet Higgs is completely determined by the IR parameters. This \\textit{IR determination} is not accidental, but rooted in the group structure and breaking of the GUT theory."},{"arxiv":"2508.09579","id":"2960176","title":"Neutrino mass predictions with metaheuristic optimization under $A_4$ modular symmetry","authors":"Muhammad Waheed Aslam, Abrar Ahmad Zafar, Muhammad Naeem Aslam, Amina magdich, Yamen El Touati, Ahmed A. Hamoud","score":7.7,"section":"replacement","rank":14,"parts":[0.0,0.05,0.23,0.0,0.27],"note":"Closest of your papers: [[1607572]] (coupling 0.02, 1 shared references). Closest network paper: [[3121627]] (coupling 0.08, 10 shared references). Shared topics: neutrino mass.","abstract":"The current research aims to conduct an exhaustive investigation of the neutrino mass model based on $A_4$ discrete non-abelian modular symmetry, specifically in the context of the linear seesaw mechanism, where the conventional type I seesaw mechanism is extended, with particular attention given to the optimization of the parameters using incomprehensible but intelligible-in-time logics optimization algorithm (ILA), a metaheuristic optimization. Unlike other approaches to discrete flavor symmetry, the modular approach to flavor dynamics is found to significantly reduce the number and complexity of flavon fields required to give realistic textures to fermion masses. The key predictions include neutrino masses, $U_\\text{PMNS}$ matrices, effective neutrino masses for neutrinoless double beta decay, beta decay, Dirac and Majorana CP violation phases for normal (NO) and inverted mass ordering (IO), offering testable implications. The working efficiency of the ILA optimization technique is also estimated. The optimized neutrino oscillation parameters are well consistent with recent experimental data. Our analysis also aligns with Planck cosmological constraints on the sum of neutrino masses $0.06<Σm<0.12\\ \\text{eV}$."},{"arxiv":"2610.04909","id":"3211566","title":"The Phenomenology of the Dark Dimension and Non-Supersymmetric Strings","authors":"Cumrun Vafa","score":7.5,"section":"replacement","rank":15,"parts":[0.0,0.0,0.09,0.0,0.61],"note":"Closest network paper: [[3092194]] (coupling 0.03, 3 shared references). Shared topics: dark matter mass, neutrino mass, dark sector, dark matter.","abstract":"Swampland principles, combined with the smallness of dark energy $Λ$, lead to the dark dimension scenario, with one extra dimension of micron size. We review this scenario and its predictions: KK graviton dark matter (or the KK tower of the quintessence field into which the gravitons convert), neutrino masses tied to $Λ^{1/4}$ via a bulk $B-L$ gauge symmetry, QCD axion decay constant $f_a\\sim Λ^{1/ ass, and $\\mathcal{D}$ are analysed as well. Our analysis reveals that the ratio of inner- to outer-horizon probabilities, $P_{\\rm BH}^{-}/P_{\\rm BH}^{+}$, changes drastically from being unity as the source departs away from being in the extremal limit defined by $α$ ($\\to 1$ for extremal case). Furthermore, black hole formation probabilities are found to be highly suppressed for higher values of $\\mathcal{D}$, particularly for the source mass, $m \\lesssim Λ_{\\mathcal{D}}$, e.g., for $α= 0.5$, the ratio, $P_{\\rm BH}^{+}(\\mathcal{D} = 5)/P_{\\rm BH}^{+}(\\mathcal{D}=10)$ turn out to be approximately $2.95\\times10^3$, $117$, and $3.35$ respectively for $m/Λ_{\\mathcal{D}} = 0.5, 1$ and $2$, with $Λ_{\\mathcal{D}}$ being the reduced gravity scale associated with $\\mathcal{D}$ spatial-dimensions."},{"arxiv":"2610.38973","id":"3220354","title":"Running cosmological constant in light of recent CMB-BAO data","authors":"A. Racioppi, M. Vijar","score":6.3,"section":"replacement","rank":17,"parts":[0.0,0.11,0.2,0.0,0.0],"note":"Closest of your papers: [[2663002]] (coupling 0.04, 7 shared references). Closest network paper: [[2669389]] (coupling 0.07, 11 shared references).","abstract":"We revisit single-field slow-roll inflation driven by a running cosmological constant, i.e. a cosmological constant receiving a logarithmic radiative correction, in light of the latest CMB-BAO data. The relative radiative correction $δ$ is treated as a free parameter of the model and allowed to be positive or negative. For positive $δ$, the predictions interpolate between a logarithmic regime and a linear inflation one. Compatibility with CMB-only data is confined to a narrow stripe near the $2σ$ border where $δ$ is relatively large. On the other hand, the predictions fit easily within the constraints including BAO data in a wide range of parameters. For negative $δ$, the slow-roll approximation breaks down at small field values and the predictions are excluded by data. However, once the effective mass contribution inside the logarithmic correction is taken into account, the negative $δ$ potential develops a local maximum and behaves like a hilltop model, achieving compatibility with CMB-only data, while agreement with CMB-BAO data is possible only at $2σ$."},{"arxiv":"2610.39215","id":"3220407","title":"Nucleon Wave Functions from QCD Vacuum Topology","authors":"Wei-Yang Liu, Ismail Zahed","score":6.1,"section":"replacement","rank":18,"parts":[0.11,0.04,0.06,0.0,0.0],"note":"Also cites widely used network papers: [[1688995]], [[2817040]]. Closest of your papers: [[1692605]] (coupling 0.01, 2 shared references). Closest network paper: [[3152706]] (coupling 0.02, 2 shared references).","abstract":"Instantons, as topologically nontrivial gauge field configurations, provide a microscopic mechanism for chiral symmetry breaking and the $U_A(1)$ anomaly in QCD. Within the instanton liquid model (ILM), instantons generate multi-fermion interactions governed by their density and size. Using this framework, we develop a microscopic description of the nucleon based on instanton-induced quark--quark correlations. We derive the diquark interaction kernels arising from single instantons and instanton--anti-instanton molecules, revealing a strong attraction in the scalar channel and weaker correlations in the spin-one channels. Embedding these interactions in a covariant, permutation-symmetric Bethe--Salpeter--Faddeev equation yields a nucleon mass $m_N=939.53~{\\rm MeV}$, with a predominantly scalar-diquark component ($98\\%$) and a small axial-vector admixture ($2\\%$) around the mass pole. Despite its small weight, the small admixture generates substantial spin--isospin interference, yielding an axial charge $g_A=1.265$, close to experiment. The resulting covariant amplitude is analytically continued to the light front to obtain the leading three-quark wave function. The corresponding unpolarized, helicity, and transversity parton distributions, along with their QCD-evolved moments, provide a direct connection to lattice QCD calculations and global-fit analyses. Our results show that the topology of the QCD vacuum organizes not only the nucleon mass and spin structure, but also its leading valence partonic content, providing a microscopic foundation for a more complete description including confinement and higher Fock components."},{"arxiv":"2610.22224","id":"3215657","title":"The hadronic-vacuum-polarization contribution to the muon anomalous magnetic moment in isospin-symmetric lattice QCD with twisted-mass fermions","authors":"C. Alexandrou, S. Bacchio, A. De Santis, A. Evangelista, J. Finkenrath, R. Frezzotti, G. Gagliardi, M. Garofalo, N. Kalntis, B. Kostrzewa, V. Lubicz, L. Maio, F. Margari, F. Pittler, S. Romiti, F. Sanfilippo, C. Schneider, S. Simula, N. Tantalo, C. Urbach, U. Wenger","score":6.0,"section":"replacement","rank":19,"parts":[0.0,0.06,0.29,0.0,0.0],"note":"Closest of your papers: [[2690106]] (coupling 0.02, 4 shared references). Closest network paper: [[2706495]] (coupling 0.10, 14 shared references).","abstract":"We present a lattice-QCD calculation of the leading-order hadronic-vacuum-polarization (HVP) contribution to the anomalous magnetic moment of the muon in isospin-symmetric QCD. We employ the gauge configurations generated by the Extended Twisted Mass Collaboration (ETMC) with $N_f = 2 + 1 + 1$ flavors of Wilson-clover twisted-mass quarks at four lattice spacings and at values of the quark-mass parameters matching the definition of isospin-symmetric QCD given in the FLAG review 2024 and in the 2025 edition of the Muon $g-2$ Theory Initiative White Paper (WP25). After retuning the simulation parameters to precisely match these two definitions of isospin-symmetric QCD, and after carrying out an extrapolation to the continuum limit based on the data at lattice spacings $a \\simeq 0.049, 0.057, 0.068$ and $0.079$~fm, and spatial lattice sizes up to $L \\simeq 7.7$~fm, we obtain $a_μ^{\\rm HVP, FLAG}(\\rm{iso}) = (720.0 \\pm 6.9) \\times 10^{-10}$ and $a_μ^{\\rm HVP, WP25}(\\rm{iso}) = (714.8 \\pm 7.4) \\times 10^{-10}$. Our results, which have a relative uncertainty of about $1 \\%$, agree well with the corresponding determinations by other lattice groups. After adding to our determination of $a_μ^{\\rm HVP, WP25}(\\rm{iso})$ the leading isospin-breaking corrections provided in the WP25, namely $a_μ^{\\rm HVP, WP25}({\\rm IB}) = 0.1(3.4)\\times 10^{-10}$, we obtain for the full HVP the value $a_μ^{\\rm HVP}= (714.9 \\pm 8.1)\\times 10^{-10}$. This result translates into a Standard Model prediction for the muon anomalous magnetic moment that is fully consistent with the latest result by the Fermilab Muon $g-2$ experiment and strengthens the tension between lattice QCD and data-driven (pre-CMD3) dispersive determinations."},{"arxiv":"2610.40749","id":"3220958","title":"Combinatorial Residual Network: a decay-chain-aware classifier without explicit jet assignment","authors":"John Alison, Patrick Bryant, Alejandro Gomez Espinosa, Christian Guinto-Brody, Aniket Khanal, Chuyuan Liu, Sindhu Murthy, Guanglei Zhao","score":5.6,"section":"cross","rank":20,"parts":[0.0,0.1,0.17,0.0,0.0],"note":"Closest of your papers: [[1455793]] (coupling 0.04, 4 shared references). Closest network paper: [[2621240]] (coupling 0.06, 5 shared references).","abstract":"Final states with several jets from the decays of heavy particles pose a combinatorial problem, since the jets must be assigned, at least implicitly, to their parent particles. We describe the Combinatorial Residual Network (CoReNet), a classifier that encodes the assumed decay chain of the final state in its architecture. CoReNet builds its event representation level by level along the decay hierarchy, evaluates every jet assignment hypothesis with weights shared across objects, and combines the hypotheses with learned weights using residual networks. The exchange symmetries of the decay are built into the construction, the size of the network does not depend on the number of hypotheses, and the network is trained with the classification loss alone, without generator-level jet assignments. The architecture was developed for the $b\\bar{b}b\\bar{b}$ final state and has been used in several CMS searches. On fast-simulation samples of Higgs boson pair production in the $b\\bar{b}b\\bar{b}$ final state against QCD multijet production, CoReNet with 1508 trainable parameters performs well above kinematic baselines and trains in minutes on a single GPU. Its hypothesis weights select the truth-matched jet pairing in most of the signal events in which it is defined, although no assignment target is used in training. Since only the encoded decay chain is specific to the final state, the construction carries over to other topologies, which we test with $HH \\to b\\bar{b}W^+W^-$ against semileptonic $t\\bar{t}$. There, encoding the decay chain of the background as well as that of the signal further improves the classification, at a cost of about $10^3$ parameters. In both final states its performance is comparable to that of a state-of-the-art transformer-based network more than two orders of magnitude larger. The implementation is publicly available at https://github.com/cms-cmu/CoReNet."},{"arxiv":"2208.01640","id":"2131795","title":"Searching for Ultra-Light Axions with Twisted Cavity Resonators of Anyon Rotational Symmetry with Bulk Modes of Non-Zero Helicity","authors":"J. F. Bourhill, E. C. I. Paterson, M. Goryachev, M. E. Tobar","score":5.4,"section":"replacement","rank":21,"parts":[0.0,0.12,0.13,0.0,0.0],"note":"Closest of your papers: [[1941263]] (coupling 0.04, 6 shared references). Closest network paper: [[2969908]] (coupling 0.05, 4 shared references).","abstract":"Möbius-ring resonators stem from a well-studied geometrical structure with a one-sided topology, the Möbius strip, and have been shown to exhibit fermion rotational symmetry with respect to an untwisted ring resonator, which exhibits boson rotational symmetry [1]. Here, we present twisted hollow resonators with equilateral triangular cross-sections, leading to cavities with anyon rotational symmetry. Unlike conventional cavity resonators, these structures permit bulk resonant modes with a non-zero complex electromagnetic overlap $\\mathcal C_p=\\int_V\\mathbf{E}_p\\cdot\\mathbf{B}_p^*\\,dτ$. The real and imaginary parts of this overlap couple to different observable quadratures. Although the negative-frequency component of a real axion field is immaterial for haloscopes employing a static DC magnetic field, it must be retained for a pumped resonator because the complex forms of Maxwell's equations differ for positive and negative frequencies and produce distinct upper and lower mixing branches. Retaining both branches shows that the real overlap produces amplitude-modulated sidebands, whereas the imaginary helicity of the modes studied here produces phase-modulated sidebands through the axion-photon chiral anomaly. A sensitive ultra-light dark-matter experiment may therefore be realised with an ultra-stable oscillator and a phase-sensitive readout. The sensitivity curves calculated here require the assumed noise floor to be interpreted as phase-modulation noise rather than amplitude-modulation noise, and consequently require sufficiently low residual oscillator phase noise at the axion Fourier frequency. The scheme removes the usual requirement for an external magnetic field and permits superconducting resonators with reduced surface loss and enhanced axion sensitivity."},{"arxiv":"2603.28805","id":"3137663","title":"Determining G with Laser Spectroscopy to 38 ppb","authors":"Noah Bray-Ali","score":5.3,"section":"replacement","rank":22,"parts":[0.0,0.08,0.18,0.0,0.0],"note":"Closest of your papers: [[1597138]] (coupling 0.03, 3 shared references). Closest network paper: [[2691930]] (coupling 0.06, 4 shared references).","abstract":"A precision measurement is proposed to determine, in a couple hours of integration time, the axion Compton frequency using a modest power (3 mW) tunable external cavity diode laser at 2458 nm as input to drive a free space tabletop Mach Zehnder interferometer whose sensing arm passes the expanded beam waist (3 mm) light beam through a 1 T strong, 40 cm long dipole magnetic field created by a custom built permanent magnet assembly with a large but achievable (6 mm) gap between poles. As the laser frequency is slowly modulated at 1 kHz through a 600 MHz wide window that is well within the 30 GHz fine tuning range of the laser, a small but readily observable modulation appears in the dark port optical power of the dark fringe phase locked interferometer due to photons converting into axions within the light beam as it passes through the magnetic field. Measuring the axion Compton frequency, around 122 THz, where the dark port power modulation peaks, to within the linewidth of the laser, about 1 MHz, then determines G to 38 parts per billion (ppb), a roughly 600 fold improvement, through a relation between the axion Compton frequency and G, involving h, c, and nucleon masses."},{"arxiv":"2610.41175","id":"3220989","title":"Toward a Three-Body Holonomy Standard Model","authors":"Tadashi Yoshikawa","score":5.0,"section":"new","rank":23,"parts":[0.0,0.08,0.17,0.0,0.03],"note":"Closest of your papers: [[2690106]] (coupling 0.03, 1 shared references). Closest network paper: [[3174530]] (coupling 0.06, 3 shared references).","abstract":"We propose a phenomenological framework toward a Three-Body Holonomy Standard Model in which the number three is selected by the minimal primitive cyclic structure of a democratic many-body interaction network. The resulting threefold holonomy information is assumed to survive in $(3+1)$ dimensions as an internal three-state space. A Lorentz-invariant six-fermion interaction provides a candidate microscopic origin of the internal cyclic correlations, with their matching to Wilson holonomy left as a dynamical requirement. The parity-related holonomy sectors of the underlying $(1+1)$-dimensional Dirac system motivate left- and right-handed internal structures and a trinification-like $SU(3)_C\\times SU(3)_L\\times SU(3)_R$ gauge completion. Vertical holonomy selects a $2+1$ splitting, while spontaneous left-right vacuum misalignment provides a possible route to chiral symmetry breaking. Horizontal holonomy organizes the three-family mass structure, with heavy-fermion mixing generating effective flavor and CP-violating patterns. Although a complete ultraviolet derivation remains open, the framework provides a unified scenario connecting primitive three-body dynamics to gauge symmetry, symmetry breaking, and fermion flavor."},{"arxiv":"2610.41960","id":"3221694","title":"Neutrino Oscillation in a Static Dihole Geometry","authors":"Rogério Capobianco, Rafael C. R. de Lima","score":5.0,"section":"cross","rank":24,"parts":[0.0,0.05,0.1,0.0,0.2],"note":"Closest of your papers: [[1220579]] (coupling 0.01, 2 shared references). Closest network paper: [[3117426]] (coupling 0.04, 4 shared references). Shared topics: neutrino mass.","abstract":"We investigate neutrino flavor oscillations in the static equal-mass Majumdar-Papapetrou dihole geometry, restricting the propagation to the symmetry plane. Within the null approximation, we derive the leading contribution to the neutrino phase and numerically evaluate the geodesic integrals. For two neutrino flavors, interference between different trajectories introduces a dependence on the individual neutrino masses and on the neutrino mass ordering for nonmaximal mixing. We analyze the transition probability in different spacetime configurations possessing two light rings, a merged light ring (critical configuration), and no light rings in the equatorial plane. In the weak-lensing regime, the transition probability generally increases with the black holes' individual masses, while variations in the half-separation produce no qualitative change in the transition probability. In stronger-lensing configurations, variations in both the mass and half-separation modify the heights and positions of the extrema, with no monotonic increase or decrease in the transition probability. For the critical and no-light-ring configurations studied, we identify three zero-winding trajectories connecting the source and detector, including one passing near the symmetry axis. The probability remains oscillatory, and its oscillatory pattern depends strongly on the neutrino energy."},{"arxiv":"2610.40866","id":"3221023","title":"Phenomenological Chiral Effective Field Theory for Neutrino Event Generators","authors":"Zara Graham-Jones, Mareen Hoppe, Joshua Isaacson, Shirley Weishi Li, Miša Toman","score":4.8,"section":"new","rank":25,"parts":[0.06,0.03,0.13,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[3094526]] (coupling 0.01, 3 shared references). Closest network paper: [[1863322]] (coupling 0.05, 4 shared references).","abstract":"Single-pion production is a crucial interaction channel for accelerator-based neutrino experiments, which rely on neutrino event generators for its cross sections. However, no model implemented in current generators provides a consistent and systematically improvable description of the resonance region. In this work, we develop a phenomenological chiral effective field theory model of pion production, built from nucleons, pions, and the $Δ(1232)$ with consistent, spin 3/2, gauge-invariant couplings, and we implement it in a fully automated pipeline from the Lagrangian to events using FeynRules, UFO 2.0, and Sherpa. We validate our results with pion photoproduction data and compare against neutrino bubble chamber, MINERvA, T2K, MicroBooNE, MiniBooNE, and electron-carbon scattering data. The framework can be systematically improved by extending the Lagrangian with higher-order operators and additional degrees of freedom, and by refitting couplings and form factors as new data become available. Combined with nuclear model interfaces, our approach opens a path to resonance-region predictions that meet the needs of next-generation experiments."},{"arxiv":"2606.10668","id":"3167071","title":"$Λ$(1520) as a probe of resonance-driven deuteron formation at the LHC","authors":"Sushanta Tripathy, Peter Christiansen","score":4.6,"section":"replacement","rank":26,"parts":[0.06,0.02,0.05,0.0,0.11],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[3146383]] (coupling 0.01, 1 shared references). Closest network paper: [[3170413]] (coupling 0.02, 2 shared references). Shared topics: production mechanism.","abstract":"Light nuclei such as deuterons are produced abundantly in high-energy proton-proton and nuclear collisions despite their tiny binding energies. Their production mechanism remains unresolved, as both nucleon coalescence and statistical thermal models reproduce inclusive LHC yields. We propose a direct invariant-mass observable that discriminates between these scenarios using the long-lived $Λ(1520) \\to {\\rm pK}$ resonance. If decay protons coalesce into deuterons, the produced nuclei remain correlated with the kaon, allowing the resonance peak to be reconstructed experimentally through proxy masses, $M_{\\rm (d/2)K}$, formed from kaons and half the deuteron four-momentum. Using Thermal-FIST and PYTHIA with a deuteron coalescence afterburner, we show that a $M_{\\rm (d/2)K}$ peak emerges only in the coalescence scenario. This observable provides a direct experimental probe of resonance-fed deuteron production and of late-stage coalescence dynamics in high-energy collisions."},{"arxiv":"2610.40895","id":"3221019","title":"Stars Can Quench Superradiance Around Supermassive Black Holes","authors":"Yu Cheng, Andrea Caputo, Giovanni Maria Tomaselli, Samuel J. Witte","score":4.1,"section":"new","rank":27,"parts":[0.0,0.02,0.22,0.0,0.0],"note":"Closest of your papers: [[1709434]] (coupling 0.01, 1 shared references). Closest network paper: [[2669622]] (coupling 0.08, 10 shared references).","abstract":"Light scalar fields trigger an instability around rotating black holes which drives the rapid growth of high-density bound states on astrophysically short timescales---a phenomenon known as black hole superradiance. This process is usually tacitly assumed to happen independent of the local environment. Around supermassive black holes, however, orbiting stars and compact objects act as a perturbation that drains energy from the cloud, potentially preventing its formation altogether. In this work, we quantify under what conditions this happens, focusing on bound-free state transitions. We first compute the rate of energy dissipation due to gravitational interactions, finding that the superradiance growth rate almost always dominates the environmental depletion. The two rates are, however, close enough that the conclusion could be overturned once bound-bound transitions are included. Also, the environment dissipates the cloud faster than gravitational-wave emission, implying that stellar environments must be accounted for in a variety of indirect search strategies. We then investigate the impact of the scalar's quadratic couplings to nucleons and electromagnetism, showing that these interactions can greatly enhance energy dissipation, preventing the cloud's formation. This work highlights the importance of accounting for the local environment in studies of superradiance around intermediate and supermassive black holes."},{"arxiv":"2607.23737","id":"3183562","title":"Radiative decays of $J/ψ,\\,ψ(2S)\\rightarrowγη^{(\\prime)}$ in perturbative QCD with relativistic corrections","authors":"Jun-Kang He, Chao-Jie Fan, Cong Wang","score":4.1,"section":"replacement","rank":28,"parts":[0.06,0.01,0.11,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[3184726]] (coupling 0.00, 1 shared references). Closest network paper: [[2625199]] (coupling 0.04, 4 shared references).","abstract":"We present the first calculation of the radiative decays $J/ψ,ψ(2S)\\rightarrowγη^{(\\prime)}$ in perturbative QCD that includes the order-$q^{2}$ relativistic corrections in all three short-distance contributions, namely the quark-antiquark, two-gluon, and QED contributions. The amplitudes are found to be remarkably insensitive to the light-cone distribution amplitude and to the light-quark mass, a robustness that persists through order $q^{2}$ and makes the predictions correspondingly reliable. The relativistic correction enhances the $J/ψ$ branching ratios by roughly a factor of 2, narrowing their shortfall from experiment, whereas for the $ψ(2S)$ it is about twice as large as for the $J/ψ$ and the low-order expansion converges poorly. In two representative $η$--$η^{\\prime}$ mixing schemes, the ratio $\\mathcal{R}_{1S}=\\mathcal{B}(γη^{\\prime})/\\mathcal{B}(γη)$ proves sharply sensitive to the mixing angle and favors the smaller of the two. The predicted $ψ(2S)$ rates lie well above the data in both channels, already at leading order, and most severely for the anomalously small $γη$ channel. Such a discrepancy suggests that a mechanism beyond the hard perturbative process is at work. As a physically motivated attempt, we explore the $η_{c}$-mixing contribution, which adds coherently to the perturbative one and is comparable to it in the $γη$ channel, and find that the interference can bring the $ψ(2S)$ rates into agreement with the data, although its extraction is limited by a strong sensitivity to the mixing parameters."},{"arxiv":"2605.07095","id":"3153576","title":"Baryon Bethe-Salpeter Equation in Minkowski-Space QCD$_2$","authors":"Satvir Kaur, Sreeraj Nair, Chandan Mondal, Jiangshan Lan, Xingbo Zhao, J. P. B. C. de Melo, Tobias Frederico","score":3.6,"section":"replacement","rank":29,"parts":[0.06,0.01,0.08,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[3184726]] (coupling 0.00, 1 shared references). Closest network paper: [[2658297]] (coupling 0.03, 4 shared references).","abstract":"We study the three-quark ladder Bethe--Salpeter equation in Minkowski-space QCD$_2$ in the light-cone gauge. Using the quasi-potential expansion, we project the baryon equation onto the light front and show that, at leading order in the valence truncation, the resulting mass-squared eigenvalue equation is equivalent to the Bars--Durgut equation. We also derive the endpoint power-law behavior of the valence wave function in terms of the quark mass and coupling, closely paralleling the original 't Hooft analysis for mesons. The resulting three-quark equation is solved numerically for $N_c=3$, and the ground-state baryon mass is found to be in reasonable agreement with previous light-cone quantization results in QCD$_2$, suggesting that the valence sector provides the dominant contribution to the ground state. The excited-state spectrum further yields a Regge trajectory that captures the overall trend of the experimental nucleon spectrum, and we compute selected structure observables, including parton distribution functions, double distribution amplitudes, and coordinate-space densities. This framework provides a useful confining test bed for Minkowski-space bound-state methods and for future developments toward confining formulations in 3+1 dimensions beyond the valence truncation."},{"arxiv":"2610.41504","id":"3221623","title":"Quantum Popcorn: the shape of a phase transition bubble","authors":"Kfir Blum, Ipak Fadakar, Omri Rosner, Guilherme L. Pimentel","score":3.3,"section":"new","rank":30,"parts":[0.0,0.0,0.22,0.0,0.0],"note":"Closest network paper: [[2928725]] (coupling 0.08, 8 shared references).","abstract":"A quantum tunneling event in field theory is usually depicted as the materialization of a spherical bubble of true vacuum. The bubble appears at rest, and its profile is the time-symmetric slice of Coleman's bounce, the Euclidean solution that controls the decay rate. However, the bubble is spherical only in the leading semiclassical approximation: at the next order the configuration is a Gaussian ensemble of fluctuations around the bounce. We derive the wave functional of the field on the nucleation slice from the half-bounce path integral, and use it to compute the root-mean-square quadrupole moment of a bubble at nucleation. The relative deformation of the bubble wall radius $R$ is $δR/R\\sim(\\hbar/S_b)^{1/2}$, with $S_b$ the bounce action. Thus $δR/R\\sim0.1$ for a typical cosmological phase transition with $S_b/\\hbar\\sim100$."},{"arxiv":"2512.18866","id":"3094759","title":"Partial Next-to-Next-to-Leading-Order Corrections to the $B \\to π$ Form Factors from Light-Cone Sum Rules","authors":"Yong-Kang Huang, Dong-Hao Li, Cai-Dian Lü, Bo-Xuan Shi, Hui-Xin Yu","score":3.3,"section":"replacement","rank":31,"parts":[0.06,0.01,0.07,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[3184726]] (coupling 0.00, 1 shared references). Closest network paper: [[2817040]] (coupling 0.02, 26 shared references).","abstract":"By incorporating the available leading-power results at $\\mathcal{O}(α_s)$ and next-to-leading-power corrections at tree level, we compute the $\\mathcal{O}(α_s^2β_0)$ contribution to the $B\\toπ$ form factors in the large-recoil region using the light-cone sum rule approach with $B$-meson light-cone distribution amplitudes. We find that the QCD corrections at $\\mathcal{O}(α_s^2β_0)$ contribute approximately $+6.1\\%$ compared to the tree-level result. Combining the light-cone sum rule predictions in the large-recoil region, lattice QCD results in the small-recoil region, we perform a combined fit for the $B\\toπ$ form factors across the full kinematic range. Utilizing these form factors, we update the branching ratios, lepton-flavor-universality ratio $R_π$, forward-backward asymmetry $\\mathcal{A}_{\\rm FB}$, flat term $\\mathcal{F}_{\\rm H}$ and polarization asymmetry $\\mathcal{A}_{λ_\\ell}$ of $B\\toπμ\\barν_μ$ and $B\\toπτ\\barν_τ$ decays. We also extract the Cabibbo-Kobayashi-Maskawa matrix element $|V_{ub}| = 3.73(14) \\times 10^{-3}$. We find that the resulting shifts are generally small and remain within the uncertainties of previous analyses."}],"refs":{"3174530":{"first":"Wang","year":2026,"nauth":3,"title":"Gravitational waves from graviton bremsstrahlung in scalar leptoquark decays","role":"other"},"1941263":{"first":"Bernal","year":2021,"nauth":4,"title":"ALP dark matter in a primordial black hole dominated universe","role":"seed"},"3113487":{"first":"Engelhardt","year":2026,"nauth":9,"title":"MARVELously Dark: the density profile evolution of dwarf halos in velocity-dependent SIDM","role":"other"},"1863322":{"first":"Demir","year":2021,"nauth":3,"title":"Type-3/2 seesaw mechanism","role":"other"},"3117426":{"first":"Yin","year":2026,"nauth":3,"title":"Primordial Black Hole Abundance from Reionization","role":"other"},"1688995":{"first":"Tanabashi","year":2018,"nauth":231,"title":"Review of Particle Physics","role":"other"},"2658297":{"first":"Alguero","year":2022,"nauth":1,"title":"Beyond the Standard Model : phenomenology and LHC constraints of exotic dark matter","role":"other"},"2810207":{"first":"Gan","year":2024,"nauth":1,"title":"The Hidden Universe Odyssey: From Theoretical Foundations to Cosmological Detections","role":"other"},"1421898":{"first":"Drewes","year":2016,"nauth":136,"title":"A White Paper on keV Sterile Neutrino Dark Matter","role":"other"},"2954192":{"first":"Chen","year":2025,"nauth":4,"title":"Multiple populations of the same sterile neutrino as dark matter","role":"other"},"2751074":{"first":"Yaguna","year":2024,"nauth":2,"title":"Singlet Dirac dark matter streamlined","role":"seed"},"2630195":{"first":"Ghoshal","year":2023,"nauth":3,"title":"Measuring inflaton couplings via dark radiation as <math display=\"inli     .attr('d',l=>{const a=l.source,b=l.target;return `M${a.x},${a.y}Q${(a.x+b.x)/2},${(a.y+b.y)/2-Math.abs(a.x-b.x)*.12} ${b.x},${b.y}`});
  G.append('g').selectAll('circle').data([...sim].sort((a,b)=>RANK[b.n.role]-RANK[a.n.role])).join('circle')
    .attr('class','node').attr('cx',s=>s.x).attr('cy',s=>s.y).attr('r',s=>r(s.n)).attr('fill',s=>col(s.n))
    .on('pointerenter',(ev,s)=>{hover=s.n;showTip(ev,s.n);paint()}).on('pointermove',(ev,s)=>showTip(ev,s.n))
    .on('pointerleave',()=>{hover=null;tip.hidden=true;paint()}).on('click',(ev,s)=>pick(s.n,false));
  const lab=sim.filter(s=>isNew(s.n)||s.n.role==='seed'||s.n.deg>=3);
  const L=lab.map(s=>{const right=s.x>W*.8,t=isNew(s.n)?`#${s.n.rank} ${s.n.first}`:`${s.n.first} ${s.n.year}`,w=t.length*6.2;return{s,t,right,x0:right?s.x-r(s.n)-4-w:s.x+r(s.n)+4,w,y:s.y+4}}).sort((a,b)=>a.y-b.y);
  const placed=[];L.forEach(l=>{let k=0;while(k<40&&placed.some(p=>l.x0<p.x0+p.w&&p.x0<l.x0+l.w&&Math.abs(l.y-p.y)<13)){l.y+=13*(k%2?-1:1)*(1+Math.floor(k/2));k++;l.y=Math.max(m.t+10,Math.min(H-m.b-4,l.y))}placed.push(l)});
  G.append('g').selectAll('text').data(L).join('text').attr('class','nlabel').attr('x',l=>l.right?l.s.x-r(l.s.n)-4:l.s.x+r(l.s.n)+4).attr('y',l=>l.y)
    .attr('text-anchor',l=>l.right?'end':'start').text(l=>l.t);
  paint();
}
function showTip(ev,n){const b=document.getElementById('chart').getBoundingClientRect();tip.hidden=false;tip.textContent=`${auth(n)} (${n.year}) — ${plain(n.title)}`+(isNew(n)?` · score ${n.score}`:'');
  let L=ev.clientX-b.left+12;if(L>b.width-290)L=ev.clientX-b.left-290;tip.style.left=Math.max(4,L)+'px';tip.style.top=(ev.clientY-b.top+12)+'px'}
function paint(){if(!G)return;const f=hover||sel,on=new Set();if(f){on.add(f.i);f.out.forEach(i=>on.add(i));f.inn.forEach(i=>on.add(i))}
  svg.classed('dim',!!f);
  G.selectAll('path.edge').attr('class',l=>'edge '+l.k+(!f?'':l.s===f.i?' hot out':l.t===f.i?' hot in':''));G.selectAll('path.edge.hot').raise();
  G.selectAll('circle').classed('on',s=>on.has(s.n.i)).classed('sel',s=>sel&&s.n.i===sel.i).classed('match',s=>query&&`${s.n.first} ${s.n.title} ${s.n.arxiv} ${s.n.authors||''}`.toLowerCase().includes(query));
  G.selectAll('text.nlabel').classed('on',l=>on.has(l.s.n.i))}
function panel(){const p=document.getElementById('panel'),n=sel;
  if(!n){p.innerHTML='<p>Select a paper in the network.</p>';return}
  const links=`<div class="links">${n.id?`<a href="https://inspirehep.net/literature/${n.id}" target="_blank" rel="noopener">INSPIRE</a>`:''}${n.arxiv?`<a href="https://arxiv.org/abs/${esc(n.arxiv)}" target="_blank" rel="noopener">arXiv</a>`:''}</div>`;
  if(isNew(n)) p.innerHTML=`<div class="role" style="color:${col(n)}">#${n.rank} · ${esc(SEC[n.section])} · score ${n.score.toFixed(1)}</div><h4>${esc(n.title)}</h4>
   <div class="meta">${esc(auth(n))} · arXiv:${esc(n.arxiv)}</div><p>${why(n.note)}</p><div class="links"><a href="#p${n.i}">Back to abstract</a></div>`;
  else p.innerHTML=`<div class="role" style="color:${col(n)}">${esc(ROLE[n.role])}</div><h4>${esc(n.title)}</h4>
   <div class="meta">${esc(auth(n))} · ${n.year}${n.arxiv?' · arXiv:'+esc(n.arxiv):''}</div>
   <div class="stats"><span>${n.cites.toLocaleString()} citations</span><span>${n.inn.filter(i=>isNew(N[i])).length} of the matches link here</span></div>${links}`;
  tex(p)}
function pick(n,scroll){sel=n;panel();paint();document.querySelectorAll('.paper').forEach(el=>el.classList.toggle('sel',el.id==='p'+n.i));if(scroll)document.getElementById('chart').scrollIntoView({behavior:'smooth',block:'nearest'})}
const present=new Set(N.map(n=>n.role));
document.getElementById('legend').innerHTML=['today','repl','seed','other'].filter(k=>present.has(k)).map(k=>`<span><i class="dot" style="background:var(--${k})"></i>${esc(ROLE[k])}</span>`).join('')+'<span style="color:var(--fg-3)">Listing papers: size ∝ score; others: size ∝ log(citations)</span>';
document.getElementById('q').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();paint()});
svg.on('click',ev=>{if(ev.target.tagName!=='circle'){sel=null;panel();paint()}});
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(draw,200)});
function nextList(){const X=RAW.next||[];if(!X.length)return;const box=document.getElementById('nextlist'),more=document.getElementById('more');
  more.hidden=false;more.querySelector('summary').firstChild.textContent=`The next ${X.length} papers by score `;
  document.getElementById('moresub').textContent=`below the threshold of ${M.threshold}, not drawn in the network`;
  box.innerHTML=X.map(n=>`<li><div class="role" style="color:var(--${n.section==='replacement'?'repl':'today'})">#${n.rank} · ${esc(SEC[n.section])} · score ${n.score.toFixed(1)}</div>
    <div class="t">${esc(n.title)}</div><div class="authors">${authors(n.authors)} · arXiv:${esc(n.arxiv)}</div>
    ${n.note?`<p class="why">${why(n.note)}</p>`:''}
    <details class="abs"><summary>Abstract</summary><p class="abs">${esc(n.abstract)}</p></details>
    <div class="links">${n.id?`<a href="https://inspirehep.net/literature/${n.id}" target="_blank" rel="noopener">INSPIRE</a>`:''}<a href="https://arxiv.org/abs/${esc(n.arxiv)}" target="_blank" rel="noopener">arXiv</a><a href="https://arxiv.org/pdf/${esc(n.arxiv)}" target="_blank" rel="noopener">PDF</a></div></li>`).join('');
  more.addEventListener('toggle',()=>{if(more.open)tex(box)})}
const rtip=document.getElementById('reftip');let rcur=null;
function refShow(el){const r=REFS[el.dataset.ref];if(!r)return;rcur=el;rtip.textContent=`${auth(r)} (${r.year}) — ${plain(r.title)}`;rtip.hidden=false;
  const b=el.getBoundingClientRect(),t=rtip.getBoundingClientRect();let L=Math.min(Math.max(8,b.left),innerWidth-t.width-8),T=b.bottom+6;
  if(T+t.height>innerHeight-8)T=b.top-t.height-6;rtip.style.left=L+'px';rtip.style.top=T+'px'}
function refHide(){rtip.hidden=true;rcur=null}
document.addEventListener('pointerover',e=>{const el=e.target.closest('.ref');if(el&&e.pointerType==='mouse')refShow(el)});
document.addEventListener('pointerout',e=>{if(e.target.closest('.ref')&&e.pointerType==='mouse')refHide()});
document.addEventListener('click',e=>{const el=e.target.closest('.ref');if(el)refShow(el);else if(rcur)refHide()});
document.addEventListener('focusin',e=>{const el=e.target.closest('.ref');if(el)refShow(el)});
document.addEventListener('focusout',e=>{if(e.target.closest('.ref'))refHide()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')refHide()});
addEventListener('scroll',()=>{if(rcur)refHide()},{passive:true});
list();nextList();fold();draw();panel();
window.addEventListener('load',()=>{tex(document.getElementById('list'));tex(document.getElementById('panel'));fold();
  if(window.MathJax&&MathJax.startup&&MathJax.startup.promise)MathJax.startup.promise.then(()=>setTimeout(fold,300))});
addEventListener('resize',()=>{clearTimeout(window._ft);window._ft=setTimeout(fold,200)});
</script>
