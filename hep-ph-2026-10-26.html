<script>
const RAW = {"n":[{"id":"3218470","arxiv":"2610.32747","title":"Heavy Sterile Fermions from the Atmosphere: LZ Limits on Neutrino Up-Scattering","first":"Sierra","nauth":4,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3201080]]. Closest of your papers: [[3130296]] (coupling 0.01, 2 shared references). Closest network paper: [[3202840]] (coupling 0.36, 28 shared references).","score":34.3,"rank":1,"section":"new","parts":[0.45,0.04,1,0.0],"abstract":"The LUX-ZEPLIN (LZ) experiment has recently reported data extending to nuclear-recoil energies of about 270 keV, including a single event at 248 keV in a nearly background-free region, for an exposure of 2.84 tonne-years. We examine this dataset through neutrino up-scattering to a heavy sterile fermion induced by atmospheric neutrinos, mediated by vector, axial-vector, scalar and dipole interactions. Our main result is a set of constraints: using the part of the LZ data where no excess is observed, we obtain new bounds on all four scenarios that probe regions of parameter space not tested before, and show that dark matter detectors can provide competitive limits on neutrino up-scattering for sterile fermion masses above $\\sim 50$ MeV. We also test whether the 248~keV event can be explained in this way while remaining consistent with the absence of events at lower recoil energies. For the scalar, vector and axial mediators this requires couplings at the edge of perturbativity, while the dipole does not provide a good fit, so we conclude that up-scattering is not a compelling explanation of the event.","authors":"D. Aristizabal Sierra, V. De Romeri, D. K. Papoulias, I. M. Shoemaker","nlinked":78,"nref":81,"src":"INSPIRE","html":true},{"id":"3218471","arxiv":"2610.32599","title":"Gauge-field energy density in inflationary kinetic-coupling models: QFT regularization versus horizon cutoffs","first":"Naidenko","nauth":3,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[2974439]]. Closest of your papers: [[2663002]] (coupling 0.02, 4 shared references). Closest network paper: [[3183493]] (coupling 0.34, 38 shared references).","score":34.3,"rank":2,"section":"cross","parts":[0.45,0.05,0.97,0.0],"abstract":"Coupling gauge fields to the inflaton can amplify their quantum fluctuations during inflation, with potential applications to a range of cosmological phenomena. A central challenge is to define finite and physically meaningful observables, such as the gauge-field energy density. In this work, we study an Abelian gauge field kinetically coupled to the inflaton through $f^2(φ)F_{μν}F^{μν}$ in a de Sitter background with $f\\propto a^{γ_1}$, and compare conventional quantum-field-theoretic regularization with horizon-cutoff prescriptions. Using a hard physical-momentum cutoff and dimensional regularization, we derive the ultraviolet divergences in closed form and fix the remaining one-parameter finite-part ambiguity by requiring the coupling-induced total energy density to be nonnegative. We then examine five horizon-cutoff prescriptions based on characteristic scales of the mode equations. Their predictions depend sensitively on the choice of horizon scale and, for weak gauge-field production, can deviate substantially from the regularized result; for the adopted finite-part prescription, the minimal horizon agrees best with the regularized total energy density. As $|γ_1|\\to 2$, where infrared modes dominate, the relative deviation of all prescriptions from the regularized result vanishes, independently of the finite-part prescription. Outside this regime, the separate electric and magnetic contributions, which can become negative after regularization, are not reliably reproduced by any of the horizon-cutoff prescriptions.","authors":"A. O. Naidenko, O. O. Sobol, S. I. Vilchinskii","nlinked":142,"nref":145,"src":"INSPIRE","html":true},{"id":"3200948","arxiv":"2609.06750","title":"GUT-induced collider signatures of the LUX-ZEPLIN event","first":"Kotlarski","nauth":3,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[3165814]]. Closest of your papers: [[3094526]] (coupling 0.04, 7 shared references). Closest network paper: [[3202840]] (coupling 0.28, 21 shared references).","score":34.1,"rank":3,"section":"replacement","parts":[0.45,0.12,0.8,0.0],"abstract":"The recent observation of an event with large recoil energy at LUX-ZEPLIN (LZ) has found a possible explanation in terms of the inelastic scattering of a pseudo-Dirac particle, for example, the Higgsino of the MSSM. For pseudo-Dirac dark matter, the mass splitting $δm$ is correlated with the mass of some heavier states. While in the MSSM rough dimensional considerations seem to indicate mass ranges of these heavy particles hopelessly out of reach even at future colliders, we point out that this is not the case in GUT-induced scenarios, with or without supersymmetry. Working in a non-supersymmetric model based on SU(6), we show that the experimentally favored $δm$ implies the presence of a $Z'$ gauge boson with a mass of several TeVs. We derive the predicted $Z'$ signal in the dilepton channel and we confront it with the sensitivity of the HL-LHC and the FCC-$hh$ to $Z'$ resonances. We show that the $Z'$ falls squarely in reach of the discovery potential of both experiments.","authors":"Wojciech Kotlarski, Kamila Kowalska, Enrico Maria Sessolo","nlinked":71,"nref":73,"src":"INSPIRE","html":true},{"id":"3089324","arxiv":"2512.04199","title":"Primordial Black Holes from Inflation with a Spectator Field","first":"Lorenzoni","nauth":4,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[1803656]]. Closest of your papers: [[2826987]] (coupling 0.04, 9 shared references). Closest network paper: [[2077646]] (coupling 0.10, 15 shared references).","score":26.4,"rank":4,"section":"replacement","parts":[0.45,0.12,0.29,0.0],"abstract":"How is the production of primordial black holes (PBHs) in single-field models of inflation impacted by the presence of additional scalar fields? We consider the effect of a spectator field - a free scalar field with sub-Hubble mass and no direct coupling to the inflaton and which makes a subdominant contribution to the total energy density - in the context of single-field models of inflation featuring a transient phase of ultra-slow-roll evolution. Despite the modest title, a spectator field can have a dramatic impact: the slow-roll evolution of the spectator prevents the combined inflaton-and-spectator system from entering into ultra-slow-roll, which naively might be expected to preclude the production of PBHs. However, we demonstrate that the growth of perturbations is maintained or enhanced by the spectator, through the rich interplay of curvature and isocurvature perturbations. We show in a model-independent way that the single-field phase of ultra-slow-roll is replaced by two turns in field space encompassing a phase of tachyonic instability for the isocurvature perturbations and a transfer of power from isocurvature to curvature modes. Furthermore, we highlight a degeneracy between the fine-tuning of the feature in the inflaton potential and the parameters of the spectator, leading to an overall resilience of model predictions to parameter variations. This makes it easier for the underlying PBH model to accommodate both high-precision cosmic microwave background constraints and production of PBHs in the asteroid-mass range.","authors":"Dario L. Lorenzoni, Sarah R. Geller, David I. Kaiser, Evan McDonough","nlinked":124,"nref":130,"src":"INSPIRE","html":true},{"id":"2913858","arxiv":"2504.13251","title":"Resilience of Primordial Black Hole Formation from Inflation with a Light Spectator Field","first":"Lorenzoni","nauth":6,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[1803656]]. Closest of your papers: [[1824064]] (coupling 0.03, 7 shared references). Closest network paper: [[2077646]] (coupling 0.10, 14 shared references).","score":25.2,"rank":5,"section":"replacement","parts":[0.45,0.09,0.28,0.0],"abstract":"Scalar fields are ubiquitous in theories of high-energy physics. In the context of cosmic inflation, this suggests the existence of spectator fields, which provide a subdominant source of energy density. We show that spectator fields boost the inflationary production of primordial black holes, with single-field ultra-slow-roll evolution supplanted by a phase of evolution along the spectator direction, and primordial perturbations amplified by the resulting multifield dynamics. This generic mechanism is largely free from the severe fine-tuning that afflicts single-field inflationary PBH models.","authors":"Dario L. Lorenzoni, Sarah R. Geller, Zachary Ireland, David I. Kaiser, Evan McDonough, Kyle A. Wittmeier","nlinked":107,"nref":117,"src":"INSPIRE","html":true},{"id":"3218395","arxiv":"2610.31770","title":"Flavored $S_{3}$ Non-Minimal Left-Right Symmetric Model","first":"Gonzalez-Canales","nauth":2,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[1493855]]. Closest of your papers: [[2690106]] (coupling 0.02, 6 shared references). Closest network paper: [[2031580]] (coupling 0.08, 25 shared references).","score":24.0,"rank":6,"section":"new","parts":[0.45,0.07,0.23,0.0],"abstract":"In this work we investigate fermion masses and flavor mixings in a non-minimal left-right symmetric model endowed with the non-Abelian discrete symmetry $S_3$. The scalar sector contains three Higgs bidoublets, while one left-handed and one right-handed triplet generate Majorana neutrino masses. Assigning the first two fermion families to an $S_3$ doublet and the third family to a singlet, together with a specific alignment of the bidoublet vacuum expectation values, leads to a common and analytically tractable structure for the fermion mass matrices. We study both the pseudomanifest and manifest left-right realizations, in which the fermion mass matrices are complex symmetric and Hermitian, respectively, and derive analytical expressions for the left- and right-handed CKM and PMNS mixing matrices. A numerical likelihood test shows that the model successfully reproduces the observed quark and lepton mixing patterns for both normal and inverted neutrino mass orderings at the level of oscillation data. Remarkably, the manifest scenario emerges as a more restrictive realization of the pseudomanifest one, with the main distinction residing in their CP-phase structure. We further explore the phenomenological consequences for the neutrinoless double-beta decay, the muon anomalous magnetic moment, and the lepton-flavor-violating decay $μ\\to eγ$. The right-handed contribution exhibits the characteristic dependence on the heavy-neutrino and $W_R$ mass scales, while flavor corrections are found to be subleading over most of the allowed parameter space. These results show that an $S_3$ flavor symmetry can simultaneously organize fermion mixing and lead to distinctive low-energy signatures within left-right symmetric theories.","authors":"F. Gonzalez-Canales, Juan Carlos Gómez-Izquierdo","nlinked":98,"nref":109,"src":"INSPIRE","html":true},{"id":"3218419","arxiv":"2610.32091","title":"Coherent axion electrodynamics in OSIRIS: a counter-propagating axion-photon parametric instability","first":"Radford","nauth":7,"year":2026,"cites":0,"role":"today","note":"Also cites widely used network papers: [[1783234]]. Closest of your papers: [[1941263]] (coupling 0.12, 9 shared references). Closest network paper: [[2969908]] (coupling 0.14, 7 shared references).","score":21.1,"rank":7,"section":"cross","parts":[0.06,0.36,0.41,0.0],"abstract":"We present a coherent axion-electrodynamics extension of the OSIRIS particle-in-cell code and use it to identify and benchmark a parametric axion-photon instability supported by two equal counter-propagating electromagnetic pumps. The module evolves a cell-centered axion field together with a separately stored first-order electromagnetic response on the native staggered OSIRIS grid. Re-examining the previously proposed strictly co-linear branch shows that it is removed when the axion-Maxwell equations are reduced consistently. A closely related standing-wave geometry, however, supports a distinct Floquet instability. We derive the coupled Floquet problem for an equal-amplitude counter-propagating pump pair and obtain a reduced analytic growth rate and cutoff for the dominant long-wavelength envelope branch. For an axion mass-to-pump-frequency ratio of 0.06 and a per-beam vector-potential amplitude of 0.3, simulations at coupling strengths of 0.60, 0.80, and 1.00 reproduce both the growth-rate spectrum and the coupling-dependent instability boundary. The reduced theory predicts envelope-mode cutoffs of 8.44, 10.80, and 13.23, while OSIRIS finds exponential growth through modes 8, 10, and 13, respectively, with the next resolved modes stable. The electromagnetic diagnostics additionally resolve exponentially growing sidebands at twice the pump wavenumber, while the zero-wavenumber electric component exhibits no sustained growth, as expected for the unstable Floquet eigenvector. The agreement provides an end-to-end benchmark of the coherent axion-electromagnetic coupling and demonstrates that parametric growth of the axion field is present in a two-beam pump geometry.","authors":"Miles Radford, Pablo Bilbao, Thomas Grismayer, Luis Silva, Robert Bingham, Subir Sarkar, Gianluca Gregori","nlinked":21,"nref":28,"src":"INSPIRE","html":true},{"id":"3218505","arxiv":"2610.32845","title":"The Galactic Center Gamma-Ray Excess and the Look-Elsewhere Effect","first":"Sands","nauth":2,"year":2026,"cites":0,"role":"today","note":"Closest of your papers: [[1421624]] (coupling 0.11, 10 shared references). Closest network paper: [[2674992]] (coupling 0.19, 8 shared references).","score":17.6,"rank":8,"section":"cross","parts":[0.0,0.28,0.53,0.0],"abstract":"The origin of the excess of GeV gamma-rays in the Milky Way's galactic center observed by Fermi-LAT has been an open question for nearly two decades. The two leading interpretations of this signal are that it is produced either by annihilating dark matter (DM), or arises from unresolved point sources, such as a novel population of millisecond pulsars. In both scenarios, uncertainties and limitations in the modeling of galactic diffuse gamma-ray emission, such as the steady-state approximation of cosmic ray (CR) propagation and assumption of an axisymmetric distribution of CRs, complicate the interpretation of the galactic center excess (GCE). Simulations with full magnetohydrodynamics (MHD) and CR transport can provide a new avenue for understanding the astrophysical phenomena that drive galactic diffuse gamma-ray emission. We utilize MHD simulations of Milky Way analogs with time-dependent, spectrally-resolved CR transport to reconstruct diffuse gamma-ray emission. Comparing instantaneous emission to a time-averaged baseline, we find residuals up to several times larger than the Fermi GCE, with a wide range of spectral shapes and spatial morphologies. At some simulation snapshots, the spectrum and morphology of the residuals resemble the Fermi GCE. Our results suggest that the Fermi GCE may be a manifestation of the look-elsewhere effect- a transient fluctuation in diffuse emission from stellar sources, observed at an inopportune moment- and motivate the development of new Fermi-LAT analysis templates that account for time-dependent CR transport.","authors":"Isabel S. Sands, Philip F. Hopkins","nlinked":37,"nref":42,"src":"INSPIRE","html":true},{"id":"3218401","arxiv":"2610.31881","title":"Semi-Analytic Predictions for Strong-Lensing Perturbers in Cold and Self-Interacting Dark Matter","first":"Tekverk","nauth":5,"year":2026,"cites":0,"role":"today","note":"Closest of your papers: [[2964960]] (coupling 0.12, 16 shared references). Closest network paper: [[3113487]] (coupling 0.14, 23 shared references).","score":16.4,"rank":9,"section":"cross","parts":[0.0,0.3,0.39,0.0],"abstract":"Strong gravitational lensing is sensitive to the abundance and internal structure of dark matter halos, providing a probe of gravothermal evolution in self-interacting dark matter (SIDM). We combine semi-analytic cold dark matter (CDM) subhalo histories with a model for gravothermal evolution in SIDM to generate CDM and SIDM subhalo populations across SIDM parameter space. We predict their projected enclosed masses and deflection-based projected density slopes and compare them with three perturbers inferred through gravitational imaging in PJ011646, SDSS J0946+1006, and JVAS B1938+666. For SIDM model parameters $σ_0/m_χ=147.1$ cm$^2$/g and $w=120$ km/s, SIDM subhalos reproduce all three perturbers more often than CDM subhalos. For PJ011646, we find ~0.6 cored SIDM subhalos per host matching the perturber, compared with ~0.002 in CDM, while core-collapsed subhalos are too steep. For SDSS J0946+1006, we find ~3 core-collapsed and ~0.004 cored SIDM subhalos per host, compared with none in 900 CDM realizations, although baryons, neglected here, may matter for such massive subhalos. For \"detection V\" in JVAS B1938+666, we find ~220 core-collapsed and ~20 cored SIDM subhalos per host within the $2σ$ posterior region, compared with ~0.2 in CDM; the CDM candidates require exceptionally early accretion, at median redshift $z\\sim13$. Simultaneously reproducing all three perturbers requires $w\\gtrsim10^2$ km/s, so that the massive (~$5.6\\times10^{10}M_\\odot$) progenitors of SDSS J0946+1006 candidates can collapse, and is achieved for $σ_0/m_χ\\gtrsim10^2$ cm$^2$/g in the parameter sets studied. Our results show how semi-analytic models can quantify how often subhalos reproduce individual perturbers in different dark matter models, and our modular framework can be readily updated as models of tidal stripping and late-stage gravothermal evolution in SIDM improve. (abridged)","authors":"Jonathan Tekverk, Duncan K. Adams, Simon Birrer, Rouven Essig, Daniel Gilman","nlinked":131,"nref":139,"src":"INSPIRE","html":true},{"id":"3218365","arxiv":"2610.31717","title":"In situ enhanced detectability of axions' responses in a microwave cavity","first":"Gao","nauth":8,"year":2026,"cites":0,"role":"today","note":"Closest of your papers: [[1941263]] (coupling 0.09, 8 shared references). Closest network paper: [[2739891]] (coupling 0.11, 8 shared references).","score":14.6,"rank":10,"section":"new","parts":[0.0,0.28,0.31,0.0],"abstract":"Microwave cavities in strong magnetic fields are among the most sensitive detectors for axion dark matter detection. Its sensitivity, however, is fundamentally limited by the second order nature of axion photon energy conversion, which yields an extremely weak signal. Here we propose a feasible approach to break this limitation, by pre-exciting the target cavity mode to generate a first order power response signal in situ. The resulting signal amplitude scales linearly with the axion-photon coupling parameter, which is in sharp contrast to the quadratic scaling of conventional schemes, and is detectable via standard quadrature balanced homodyne detection system, even though its phase remains stochastic. Numerical simulations demonstrate that this pre-excited seed field can effectively suppress thermal noise, and thus the detection sensitivity of the system can approach the lower quantum noise limit. Consequently, the sensitivities predicted by the KSVZ and DFSZ models could be surpassed. This proposal might offer a pathway to a major leap in axion dark matter searches, as it is within reach of current technology.","authors":"Li Gao, Suirong He, Hao Zheng, Ni Chen, Xianing Feng, Qingquan Jiang, Jin Li, L. F. Wei","nlinked":25,"nref":33,"src":"INSPIRE","html":true},{"id":"3218535","arxiv":"2610.31756","title":"Soft scalar-field corrections to the topological susceptibility","first":"Bodeker","nauth":2,"year":2026,"cites":0,"role":"today","note":"Closest o ,[28,20,"c"],[10,19,"k"],[6,21,"k"],[41,30,"c"],[21,12,"c"],[19,26,"c"],[46,12,"c"],[45,11,"c"],[40,33,"c"],[21,29,"c"],[2,34,"k"],[3,35,"k"],[1,36,"k"],[40,20,"c"],[19,53,"c"],[7,39,"k"],[33,40,"c"],[33,20,"c"],[30,29,"c"],[8,44,"k"],[46,33,"c"],[21,20,"c"],[41,21,"c"],[31,41,"c"],[46,40,"c"],[1,48,"c"],[19,22,"c"],[30,20,"c"],[14,47,"c"],[19,50,"c"],[3,20,"c"],[40,12,"c"],[2,23,"k"],[32,30,"c"],[10,26,"k"],[33,12,"c"],[2,28,"c"],[22,26,"c"],[28,32,"c"],[41,29,"c"],[43,11,"c"],[3,41,"k"],[52,39,"c"],[30,12,"c"],[10,21,"k"],[32,21,"c"],[9,45,"k"],[8,54,"k"],[19,12,"c"],[18,29,"c"],[7,24,"k"],[3,25,"k"],[2,27,"k"],[46,32,"c"],[3,29,"k"],[23,47,"c"],[54,44,"c"],[9,30,"k"],[32,33,"c"],[6,32,"k"],[51,54,"c"],[8,38,"k"],[23,28,"c"],[40,21,"c"],[6,19,"k"],[10,43,"k"],[43,12,"c"],[4,35,"k"],[6,26,"k"],[4,31,"k"],[50,26,"c"],[9,21,"k"],[10,50,"k"],[8,51,"k"],[46,21,"c"],[22,50,"c"],[0,23,"k"],[9,22,"k"],[6,13,"k"],[1,16,"k"],[5,17,"k"],[4,18,"k"],[32,12,"c"],[42,44,"c"],[12,53,"c"],[40,30,"c"],[21,30,"c"],[33,30,"c"],[3,31,"k"],[4,20,"c"],[10,33,"k"],[47,39,"c"],[38,54,"c"],[44,12,"c"],[7,37,"k"],[53,26,"c"],[9,40,"k"],[32,40,"c"],[35,21,"c"],[12,22,"c"],[8,42,"k"],[9,46,"k"],[13,19,"c"],[37,39,"c"],[2,47,"k"],[5,49,"k"],[33,21,"c"],[7,52,"k"],[6,53,"k"],[0,47,"c"],[29,20,"c"]],"next":[{"arxiv":"2610.31761","id":"3218384","title":"Prospects of Detecting Cosmological Domain Walls in the Cosmic Microwave Background","authors":"Berkin Gürbüz, Robert Brandenberger, Yitian Sun","score":9.7,"section":"cross","rank":12,"parts":[0.0,0.15,0.29,0.0],"note":"Closest of your papers: [[2690106]] (coupling 0.06, 5 shared references). Closest network paper: [[2828434]] (coupling 0.10, 10 shared references).","abstract":"Topological defects are a generic prediction of field theories with spontaneously broken symmetries, and domain walls, the two-dimensional defects left by a broken discrete symmetry, are among the simplest. We study the imprint of dark, purely gravitationally interacting domain walls on the Cosmic Microwave Background (CMB), in the regime where a low symmetry-breaking scale $η$ allows the walls to evade the Zel'dovich overclosure bound while remaining cosmologically relevant. The relativistic repulsion of matter by a planar wall carves out an evacuated void bounded by an overdense shell, and we compute the resulting photon deflection field analytically for walls both aligned with and arbitrarily inclined to the line of sight. The deflection stamps coherent, strongly non-Gaussian distortions onto the temperature sky, with a characteristic two-peak structure set by the relativistic displacement scale and an inclination dependence that vanishes for face-on walls. Because these signatures are localised and anisotropic, they are poorly captured by two-point statistics; we therefore analyse them with a curvelet/wavelet decomposition matched to the wall's geometry, and with simulation-based inference, training a Neural Posterior Estimator (NPE) to recover the scattering redshift $z$, energy scale $η$, and inclination $θ$, and a Neural Ratio Estimator (NRE) to evaluate the likelihood-ratio test statistic for limit-setting. Casting these methods as sensitivity forecasts for a South Pole Telescope-like (SPT) survey, we find that the curvelet and wavelet statistical thresholds populate a common $η\\sim 10-100$ MeV band over the accessible redshift range. The neural-ratio sensitivity curve, which exploits the full map morphology, reaches a factor 1.3-1.9 lower in $η$ at $z \\gtrsim 20$, or $\\sim 2-7$ in the wall tension, landing essentially on the per-resolution-element noise floor."},{"arxiv":"2606.26240","id":"3173063","title":"Constraining Multiple Kinetically Mixed Dark Photons","authors":"Joerg Jaeckel, Sebastian Monath","score":9.1,"section":"replacement","rank":13,"parts":[0.0,0.16,0.24,0.0],"note":"Closest of your papers: [[3146383]] (coupling 0.05, 5 shared references). Closest network paper: [[2697223]] (coupling 0.08, 8 shared references).","abstract":"Extra U(1) gauge bosons under which Standard Model particles are uncharged, aka dark photons, are a simple and well-motivated extension of the Standard Model. There could be a single, but also several or even many such dark photons. However, most studies consider only a single dark photon. Here, we want to look at the more general case of multiple dark photons interacting with the Standard Model via kinetic mixing. We consider a range of standard probes, Cavendish experiments, light-shining-through-walls experiments, as well as energy loss in stars. To explore the rather high-dimensional parameter space of the masses and the kinetic mixing matrix, we pursue a statistical approach, considering different distributions for the kinetic mixing parameters."},{"arxiv":"2405.13881","id":"2789241","title":"Natural Inflation with Exponentially Small Tensor-To-Scalar Ratio","authors":"Dario L. Lorenzoni, David I. Kaiser, Evan McDonough","score":8.7,"section":"replacement","rank":14,"parts":[0.0,0.14,0.25,0.0],"note":"Closest of your papers: [[1941263]] (coupling 0.05, 11 shared references). Closest network paper: [[2797744]] (coupling 0.09, 11 shared references).","abstract":"We demonstrate that \"natural inflation\", also known as \"axion inflation\", can be compatible with Planck 2018 measurements of the cosmic microwave background, while predicting an exponentially small tensor-to-scalar ratio, e.g., $r\\sim 10^{-15}$. The strong suppression of $r$ arises from dynamics of the radial component of the complex scalar field, whose phase is the axion. Such tiny values of $r$ remain well below the threshold for detection by CMB-S4 or Simons Observatory B-mode searches. The model is testable with the running $α_s$ of the spectral index, which is within reach of next-generation CMB and large-scale structure experiments, motivating the running as a primary science goal for future experiments."},{"arxiv":"2608.28738","id":"3197826","title":"AXIS Could Have Accessed Dark Matter Decays","authors":"Joshua W. Foster, Inci Karaaslan, Gordan Krnjaic, Nimrod Shapir","score":8.5,"section":"replacement","rank":15,"parts":[0.06,0.07,0.24,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[793723]] (coupling 0.02, 1 shared references). Closest network paper: [[2954192]] (coupling 0.08, 5 shared references).","abstract":"The Advanced X-ray Imaging Satellite (AXIS) was a mission concept designed to improve upon the sensitivity and spatial resolution of the Chandra X-ray Observatory and XMM-Newton. Although AXIS was not selected for implementation, the concept study defined a mature instrument design with low-background, arcsecond imaging over the $0.3$-$10$ keV energy range, a large effective area, and a wide field of view. These capabilities provide a useful benchmark for the dark matter decay sensitivity of future X-ray observatories. We estimate the reach of a future AXIS-like instrument for narrow photon lines from decaying keV-scale dark matter, including axion-like particles and sterile neutrinos. For Galactic center observations, we find projected lifetime sensitivities of order $10^{31}$ s, improving upon existing limits by up to an order of magnitude over part of the keV mass range."},{"arxiv":"2610.30773","id":"3218076","title":"A Chiral Nelson-Barr Relaxion","authors":"Cristien Arzate, Joshua Iascau","score":6.2,"section":"replacement","rank":16,"parts":[0.0,0.06,0.26,0.0],"note":"Closest of your papers: [[1365306]] (coupling 0.02, 2 shared references). Closest network paper: [[1863157]] (coupling 0.09, 7 shared references).","abstract":"We present the chiral Nelson-Barr relaxion model, an extension of the Nelson-Barr relaxion framework with a gauged chiral $\\mathrm{U}(1)$ symmetry. It includes vector-like quarks to cancel gauge anomalies and a scalar whose vacuum expectation value generates their masses. The chiral symmetry forbids the leading operators responsible for the Nelson-Barr and clockwork quality problems. Right-handed neutrinos generate light-neutrino masses through the type-I seesaw mechanism and permit thermal leptogenesis. For the particular coupling considered, relaxion phenomenology gives $f_{\\mathrm{max}}^{\\mathrm{pheno}}\\sim 4\\times 10^{11}\\ \\mathrm{GeV}$, about eight times the corresponding phenomenological ceiling in the original model. The model can accommodate thermal leptogenesis if its right-handed-neutrino masses and reheating history satisfy the required temperature bounds."},{"arxiv":"2610.32543","id":"3218456","title":"Analytic two-loop corrections to top-quark pair production at hadron colliders","authors":"Federico Buccioni, Christoph Nega, Benjamin Sauer, Lorenzo Tancredi, Fabian J. Wagner","score":5.7,"section":"new","rank":17,"parts":[0.0,0.0,0.05,0.5],"note":"Co-authors of yours: Wagner. Closest network paper: [[2817040]] (coupling 0.02, 20 shared references).","abstract":"We present the complete two-loop QCD amplitudes for the production of a top-quark pair in the quark--antiquark annihilation and gluon-fusion channels in analytic form up to order $\\mathcal{O}(\\varepsilon^2)$. Our analysis maintains full dependence on the top-quark mass and on the number of colours. The amplitudes are expressed in terms of 417 master integrals, which we compute by means of differential equations in $\\varepsilon$-factorised form. Their calculation involves several elliptic curves and a hyperelliptic curve of genus two, which makes top-quark pair production an ideal arena for recent methods to construct canonical bases beyond polylogarithms. To the best of our knowledge, this is the first scattering amplitude in which iterated integrals related to a genus-two surface survive in the finite remainder in four space-time dimensions. We provide high-precision series expansions at the threshold and combine them with the numerical solution of the differential equations in a code that evaluates the UV-renormalised infrared-finite remainders at arbitrary points of the physical phase space."},{"arxiv":"2603.12314","id":"3129073","title":"Dark Matter, Baryon Number, and Cosmic-Ray Antinuclei","authors":"Caleb Gemmell, Dan Hooper, Seth Koren, Fabrizio Vassallo","score":5.5,"section":"replacement","rank":18,"parts":[0.0,0.05,0.25,0.0],"note":"Closest of your papers: [[3130296]] (coupling 0.02, 3 shared references). Closest network paper: [[1759674]] (coupling 0.09, 7 shared references).","abstract":"Antideuterons and antihelium nuclei in the cosmic-ray spectrum have long been considered a smoking gun signature of dark matter annihilation, making the tentative observation of several such events by AMS highly intriguing. Conventional dark matter models, however, can produce only up to O(1) antideuteron events at AMS and are not capable of generating observable fluxes of antihelium. In this Letter, we propose a class of models in which dark matter annihilates into particles carrying baryon and lepton number, whose subsequent decays produce enhanced fluxes of antinucleons and antinuclei. Such scenarios are motivated by Grand Unified Theories and can lead to an order-of-magnitude or larger enhancement in the resulting antideuteron and antihelium-3 fluxes, providing a means by which to potentially explain the events reported by the AMS Collaboration."},{"arxiv":"2610.31759","id":"3218367","title":"Discontinuity at the Pole","authors":"Dominik Haslehner, Elena Kaiser, Javi Serra, Andreas Weiler","score":5.4,"section":"cross","rank":19,"parts":[0.0,0.04,0.26,0.0],"note":"Closest of your papers: [[2627241]] (coupling 0.01, 1 shared references). Closest network paper: [[2639544]] (coupling 0.09, 5 shared references).","abstract":"The exchange of a particle whose mass is taken to zero need not reproduce the exchange of a particle that is strictly massless from the outset. We derive a general on-shell diagnostic of the well-known discontinuity between the exchange of a massless particle and the massless limit of a massive-particle exchange, valid for a mediator of arbitrary integer spin S. Our main observation is that this discontinuity can be identified directly at the level of the pole residue. We find that, in four dimensions, the residue is governed by a Chebyshev polynomial in the massless case and by a Legendre polynomial in the massless limit of the massive case. For S = 2, this reproduces the van Dam-Veltman-Zakharov discontinuity. For general S, it provides a simple and compact higher-spin analogue from on-shell factorisation. The discontinuity is probed, in principle, by the leading post-Newtonian correction to the non-relativistic potential between two massive scalar bodies."},{"arxiv":"2610.31873","id":"3218386","title":"A localisation bound for Standard-Model representations in heterotic orbifolds","authors":"Navid Ardakanian","score":4.8,"section":"new","rank":20,"parts":[0.0,0.06,0.18,0.0],"note":"Closest of your papers: [[695291]] (coupling 0.02, 1 shared references). Closest network paper: [[606952]] (coupling 0.06, 3 shared references).","abstract":"In heterotic string compactifications on toroidal orbifolds, the massless states at a twisted fixed point are constrained by the evenness of the sixteen-dimensional gauge lattice. We show that two massless left-chiral states in the same Standard-Model representation, built on the same constructing space-group element and distinct modulo the Weyl group of $SU(3)_c\\times SU(2)_L$, must satisfy $\\sqrt{R}+\\sqrt{R'}\\ge\\sqrt{2}$, where $R$ is the squared length of the part of a state's gauge momentum orthogonal to the Standard-Model Cartan directions. Without left-moving oscillator excitations this reads $R\\ge 1/2$. When $R<1$, $n$ such states, pairwise distinct in the same sense, carry the weights of the fundamental representation of a local $SU(n)$ commuting with the Standard Model, and $n\\le 1/(1-R)$. Since the representation fixes the projected length (at the canonical hypercharge normalisation, $6/5$ els with fewer fields (2 and 4 real scalars). These are not approximations to the 2HDM but rather toy models that capture the essential feature of a Z2-symmetric potential with two vacua. Floquet analysis further confirms the stability of these structures under perturbations in both the 4-field toy model and the full 2HDM."},{"arxiv":"2608.00158","id":"3186832","title":"Extra-dimensional Origins of Chemical Potentials at the Cosmological Collider","authors":"Raman Sundrum, Zhaohui Xu","score":4.2,"section":"replacement","rank":22,"parts":[0.0,0.05,0.16,0.0],"note":"Closest of your papers: [[1941263]] (coupling 0.02, 3 shared references). Closest network paper: [[2737356]] (coupling 0.06, 11 shared references).","abstract":"We study the realization of the chemical potential mechanism in cosmological collider physics in a robust class of inflationary models arising from multiple higher-dimensional gauge fields. The rolling inflaton background corresponds to an electric field in the extra dimension in which charged particles are produced analogously to the Schwinger mechanism, while neutral particles can be produced through non-minimal interactions. We show that particles heavier than the inflationary Hubble scale can be created without Boltzmann suppression in both cases. In particular, charged Kaluza-Klein excitations can be created through minimal gauge interactions. We construct realistic models along these lines consistent with both theoretical and experimental constraints."},{"arxiv":"2610.32947","id":"3218517","title":"The renormalization of the shell-model neutrinoless double-beta decay operator starting from effective field theory at next-to-next-to-leading order","authors":"S. L. Lyu, U. Carusone, G. De Gregorio, N. Itaco, L. Coraggio","score":4.1,"section":"cross","rank":23,"parts":[0.0,0.0,0.27,0.0],"note":"Closest network paper: [[2788951]] (coupling 0.10, 9 shared references).","abstract":"This paper is the continuation of a previous study, where shell-model calculations of the matrix elements for the neutrinoless double-beta decay were performed within a fully-consistent framework, starting from expressions of the nuclear Hamiltonian and decay operators which have been derived through chiral perturbation theory. The decays under our investigation are those involving 48Ca, 76Ge, and 82Se, as in our earlier analyses of electroweak nuclear decays with Hamiltonians and operators derived within effective field theory. In this work we focus on perturbative properties of the chiral expansion of the decay operator, namely in assessing the weight of terms beyond the leading order on the nuclear matrix elements of medium-mass candidates. To this end, we have constructed effective shell-model decay operators starting from two-body currents up to next-to-next-to-leading order and, for the first time, we introduce for nuclei of experimental interest contributions of the three-body current operators, which emerge at next-to-next-to-next-to-leading order of the chiral perturbation theory. Our investigation is aimed to evaluate the theoretical uncertainties affecting the calculated nuclear matrix elements of the neutrinoless double-beta decay, by conjugating the estimate of the inaccuracy related to the finiteness of the degrees of freedom of the nuclear model and the truncation of the chiral expansion of the decay operator."},{"arxiv":"2610.32790","id":"3218484","title":"Robustness of the scaled transverse-momentum correlator and the contribution of meson--baryon fluctuations at RHIC energies","authors":"Rutik Manikandhan, Rene Bellwied","score":3.9,"section":"new","rank":24,"parts":[0.06,0.01,0.08,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[3184726]] (coupling 0.00, 1 shared references). Closest network paper: [[3147506]] (coupling 0.03, 2 shared references).","abstract":"The search for the QCD critical point relies on identifying non-monotonic signatures in event-by-event fluctuation observables, such as the scaled two-particle transverse-momentum correlator $C_{p_T}$. Using a microscopic transport model (UrQMD), we establish the robustness of $C_{p_T}$ against the variations that distinguish the datasets in the relevant collision energy regime, namely the choice of centrality estimator, finite tracking efficiency, and acceptance, including the difference between collider and fixed-target running. In addition, it has recently been proposed, based on UrQMD yields, that the measured non-monotonicity requires no critical dynamics and instead follows from the event-by-event composition of the final state. We show that this contribution is governed by event-by-event fluctuations in the meson-baryon composition, rather than by the mean yields alone. Using the composition fluctuations obtained from UrQMD, we find that the minimum in the two-component calculation disappears."},{"arxiv":"2610.32669","id":"3218550","title":"Systematic Study of Neutrino-Nucleus Interactions for the DUNE Experiment","authors":"L. F. B. M. Rodrigues, F. G. Gardim, G. A. Valdiviesso,  .","score":2.6,"section":"new","rank":25,"parts":[0.0,0.04,0.08,0.0],"note":"Closest of your papers: [[860906]] (coupling 0.01, 1 shared references). Closest network paper: [[1489221]] (coupling 0.03, 2 shared references).","abstract":"The recent generation of high-precision neutrino oscillation experiments, such as the Deep Underground Neutrino Experiment (DUNE), relies on the accurate reconstruction of incident neutrino energy to determine fundamental parameters like Charge-Parity (CP) violation and the neutrino mass hierarchy. The use of Liquid Argon, introduces significant theoretical complexities. This dissertation provides a investigation into neutrino-nucleus scattering phenomenologies, connecting fundamental electroweak theory with computational simulations using the GENIE Monte Carlo event generator. The study evaluates the limitations of traditional frameworks, such as the Relativistic Fermi Gas (RFG) model, specifically addressing the Axial Mass parameter and its impact on the Charged Current Quasi-Elastic (CCQE) channel. By comparing baseline RFG predictions against experimental data from MicroBooNE, this research quantifies the necessity of advanced many-body nuclear frameworks. The implementation of the Local Fermi Gas (LFG) model, Random Phase Approximation (RPA) screening, and the SuperScaling Approximation (SuSAv2) are systematically analyzed to resolve kinematic biases. Additionally, the impact of modernized phenomenological constraints, including the updated $M_A^{RES} = 0.96$ GeV for resonant pion production and the 2021 Bodek-Yang parameter updates for Deep Inelastic Scattering (DIS), is evaluated. Furthermore, this research integrates university extension initiatives by developing and presenting macroscopic 3D-printed educational models, consisting of a Linear Accelerator (LINAC) analog and a scattering experiment, and finally presenting it into the festival \"Mais Ciência Por Favor\"."},{"arxiv":"2602.14811","id":"3120608","title":"RG-Invariant Symmetry Ratio for QCD: A Study of $U(1)_A$ and Chiral Symmetry Restoration","authors":"Ting-Wai Chiu, Tung-Han Hsieh","score":2.6,"section":"replacement","rank":26,"parts":[0.0,0.03,0.09,0.0],"note":"Closest of your papers: [[2787890]] (coupling 0.01, 1 shared references). Closest network paper: [[1489994]] (coupling 0.03, 4 shared references).","abstract":"We introduce a renormalization-group-invariant (RGI), scheme-independent symmetry ratio $κ_{AB}$, for the quantitative characterization of symmetry breaking in QCD. As a first application, we employ $κ_{AB}$ to investigate the relative strength of $SU(2)_L \\times SU(2)_R$ chiral symmetry and $U(1)_A$ axial symmetry breaking in $N_f=2+1+1$ lattice QCD using optimal domain-wall fermions at the physical point. Our study covers three lattice spacings and twelve temperatures in the range 164--385~MeV. We examine three independent symmetry-breaking channels in the nonsinglet sector with quark-connected correlators: the $U(1)_A$-sensitive scalar--pseudoscalar channel ($κ_{PS}$), probing the $π$--$δ$ system; the $SU(2)_L \\times SU(2)_R$-sensitive vector--axial-vector channel ($κ_{VA}$), probing the $ρ$--$a_1$ system; and an additional $U(1)_A$-sensitive tensor vector--axial-tensor vector channel ($κ_{TX}$), probing the $ρ_T$--$b_1$ system. At each lattice spacing we observe a clear hierarchy $κ_{PS} > κ_{VA} > κ_{TX}$. Since temperature and lattice spacing are not varied independently in the present ensembles, the lattice-spacing dependence of the hierarchy cannot be isolated, and a controlled continuum extrapolation is deferred to future work."},{"arxiv":"2610.28115","id":"3216901","title":"Information geometry of DGLAP evolution","authors":"Sergey Bondarenko, Alex Prygarin","score":2.0,"section":"replacement","rank":27,"parts":[0.0,0.03,0.07,0.0],"note":"Closest of your papers: [[3094526]] (coupling 0.01, 1 shared references). Closest network paper: [[2658297]] (coupling 0.02, 4 shared references).","abstract":"Quark and gluon splittings shift proton momentum toward smaller fractions with increasing resolution. Momentum conservation makes the summed momentum-weighted quark and gluon densities, when nonnegative, a probability distribution. We apply information geometry, the geometry of probability distributions, to this probabilistic form of Dokshitzer-Gribov-Lipatov-Altarelli-Parisi evolution. We evaluate, to our knowledge for the first time, the speed at which the shape of the proton's momentum distribution changes, measured by how well distributions at neighboring resolutions can be told apart statistically. At leading order, with one-loop splitting functions and running coupling, five fixed quark flavors, nonnegative quark and gluon densities and sufficiently regular inputs, we obtain a closed-form lower bound on this speed. Once the coupling is specified, three numbers of the input (the distribution at the starting resolution) fix the bound at every scale without computing the evolved distribution. For three of the five model inputs at four scales from 2 GeV to 10 TeV, the squared bound is at least 94.8 percent of the squared speed. The bound is reached when the distribution's relative rate of change is linear in the logarithm of the inverse momentum fraction. For these three model inputs at the four scales, the relative rate of change is close to this linear form in mean square weighted by momentum."},{"arxiv":"2610.31745","id":"3218357","title":"FeynFacet: AI agents for analytic NLO QCD","authors":"Zhong-Bo Kang, Werner Vogelsang, Congyue Zhang","score":1.5,"section":"new","rank":28,"parts":[0.0,0.01,0.07,0.0],"note":"Closest of your papers: [[1693823]] (coupling 0.00, 1 shared references). Closest network paper: [[3170413]] (coupling 0.03, 3 shared references).","abstract":"We present FeynFacet, a workflow in which artificial intelligence agents develop and execute programs for analytic next-to-leading-order (NLO) QCD calculations, with the observables and conventions specified by physicists. We use it to derive new analytic hard functions for single-inclusive transverse spin transfer in proton-proton and lepton-proton collisions. The new proton-proton results cover all partonic channels contributing to transverse spin transfer, and the new lepton-proton result is inclusive in the scattered lepton. Within FeynFacet, we use reverse unitarity to represent the on-shell delta functions in real-emission phase-space integrals as cut propagators. Dimensional shifts convert integrals containing evanescent numerators into scalar integrals in higher dimensions. Integration-by-parts identities then reduce the scalar integrals to master integrals, which are evaluated analytically. Gauge invariance, pole cancellation and renormalization-group (RG) evolution provide checks throughout the calculation. We reproduce established single-inclusive hard functions for unpolarized and double longitudinally polarized proton-proton and lepton-proton scattering, and for proton-proton scattering with two transversely polarized beams. We also reproduce the NLO matching coefficients for unpolarized quark and gluon transverse-momentum-dependent parton distributions and the associated soft functions. The new transverse spin-transfer coefficients provide perturbative inputs for extracting quark transversity through spin-dependent fragmentation, including polarized-hyperon production, Collins and dihadron asymmetries in jets, and spin-dependent one- and two-point energy correlators. We make all analytic coefficients and the associated calculation programs publicly available online."},{"arxiv":"2610.32656","id":"3218548","title":"Neutrino-Nucleus Scattering Simulation Using GENIE Event Generator","authors":"L. F. B. M. Rodrigues, F. G. Gardim, G. A. Valdiviesso,  .","score":1.4,"section":"new","rank":29,"parts":[0.0,0.0,0.09,0.0],"note":"Closest network paper: [[1858197]] (coupling 0.03, 1 shared references).","abstract":"The Deep Underground Neutrino Experiment (DUNE) relies on the precise reconstruction of incident neutrino energy to extract oscillation parameters. The use of Liquid Argon introduces significant theoretical complexities due to nuclear effects. This work evaluates neutrino-nucleus scattering models using the GENIE Monte Carlo event generator. We demonstrate the limitations of the Relativistic Fermi Gas (RFG) model in the Charged Current Quasi-Elastic (CCQE) channel and its reliance on an inflated Axial Mass to match experimental data from MicroBooNE. We show that transitioning to advanced many-body frameworks, specifically the Local Fermi Gas (LFG) supplemented with Random Phase Approximation (RPA), is needed. Additionally, we evaluate the impact of the 2021 Bodek-Yang parameter updates on Deep Inelastic Scattering (DIS), concluding that modernized constraints are a prerequisite for mitigating systematic biases in DUNE."},{"arxiv":"2610.29707","id":"3217378","title":"Probing New Physics with $b \\to u \\ell ν_{\\ell}$ induced decays","authors":"Maria Letizia Di Cuia, Davide Milillo","score":1.4,"section":"replacement","rank":30,"parts":[0.0,0.0,0.09,0.0],"note":"Closest network paper: [[1881670]] (coupling 0.03, 1 shared references).","abstract":"We analyze $B^- \\to μ^- \\barν_μ$, $\\bar{B}^0 \\to π^+ μ^-\\barν_μ$, and $B^- \\to ρ^0 μ^- \\barν_μ$ decays using the data on binned branching fractions recently measured by Belle II Collaboration for the semileptonic modes. We extend the low-energy Hamiltonian governing $b \\to u \\ell \\barν_\\ell$ transitions to include the full set of dimension-six, Lorentz-invariant operators with left-handed neutrinos, consistent with the Standard Model Effective Field Theory (SMEFT) framework. The Wilson coefficients are treated as complex, lepton-flavor-dependent effective couplings. Since the three selected channels are sensitive to different non-standard structures, we perform a combined analysis using Monte Carlo methods to constrain the New Physics couplings for three benchmark values of $|V_{ub}|$. We find that, while the Standard Model remains broadly compatible with the data, some of the couplings show a mild preference for non-zero values."},{"arxiv":"2610.32387","id":"3218447","title":"Higher-twist hadronic tensor in deep inelastic scattering with massive quarks","authors":"W. Yang, Y. Yang, X. Wang","score":1.1,"section":"new","rank":31,"parts":[0.0,0.0,0.08,0.0],"note":"Closest network paper: [[2077212]] (coupling 0.03, 2 shared references).","abstract":"In this paper, we calculate the inclusive deep inelastic scattering (DIS) with finite quark masses up to twist-4 accuracy based on collinear expansion method. The collinear expansion method not only naturally leads to gauge-invariant correlation functions and parton distribution functions, but also yields a remarkably compact expression for the hadronic tensor. The resulting hadronic tensor can be organized according to the corresponding power behavior in $1/Q$. In particular, the explicit quark-mass dependence gives rise to additional power-suppressed contributions and the ratio $m/Q$ can be counted as a twist-3 contribution in the power expansion. As an application, we further investigate the role of transversity in inclusive DIS with a transversely polarized target. We find that the transversity distribution appears explicitly in the quark-quark correlation function and gives rise to a contribution proportional to $m~h_{1T}/Q$. However, this contribution is exactly cancelled in the hadronic tensor by the one arising from the corresponding quark-gluon-quark correlation function. This cancellation shows that, within the one-photon-exchange approximation, the mass-induced transversity term cancels in the complete twist-3 hadronic tensor, and no net transversity contribution remains at twist-3 accuracy in inclusive DIS. We complement this analytical study with numerical estimates of the $g_T$-related twist-3 asymmetry, comparing predictions with and without the mass-dependent $x\\rightarrowχ$ rescaling at the same measured $x$. The results show that these kinematic mass effects become more important at lower $Q^2$ and larger $x$."}],"refs":{"2077212":{"first":"Dcruz","year":2022,"nauth":2,"title":"<math display=\"inline\"><mi>W<\/mi><\/math> boson mass shift, dark matter, and <math display=\"inline\"><mo stretchy=\"false\">(<\/mo><mi>g<\/mi><mo>-<\/mo><mn>2<\/mn><msub><mo stretchy=\"false\">)<\/mo><mo>ℓ<\/mo><\/msub><\/math> in a scotogenic-Zee model","role":"other"},"1941263":{"first":"Bernal","year":2021,"nauth":4,"title":"ALP dark matter in a primordial black hole dominated universe","role":"seed"},"3113487":{"first":"Engelhardt","year":2026,"nauth":9,"title":"MARVELously Dark: the density profile evolution of dwarf halos in velocity-dependent SIDM","role":"other"},"2817040":{"first":"Navas","year":2024,"nauth":244,"title":"Review of particle physics","rol const M = RAW.meta;

document.getElementById('foot').innerHTML=`<p><b>Score (0–100).</b> 40% direct citations of network papers (each of your papers counts 1, each other network paper 0.6, network papers with over 1,000 citations 0.06; saturating as 1 − e<sup>−x</sup>); 35% bibliographic coupling with your own papers (idf-weighted cosine of INSPIRE-linked reference sets, best match and mean of the top three, 0.30 = full marks); 15% best coupling with the other network papers (0.35 = full marks); 10% authorship (you, or your co-authors).</p>
<p><b>Data.</b> Network: INSPIRE records supplied with the project. Listing papers: INSPIRE records where already harvested (${M.onInspire} of ${M.nlist}); for the rest the reference list was read from the arXiv source and matched to INSPIRE by arXiv number, DOI and texkey. Only links between papers on this page are drawn. Built ${esc(M.built)}.</p>`;

function list(){const box=document.getElementById('list');

// Phones: long author lists show the first 3 and "et al." (tap to expand); abstracts fold to 3 lines with More.
function authors(s){const a=String(s||'').split(', ');if(a.length<=3)return esc(s);
  return `<span class="au-short">${esc(a.slice(0,3).join(', '))} <button class="aubtn" type="button" aria-label="Show all ${a.length} authors">et al. (+${a.length-3})</button></span><span class="au-full">${esc(s)}</span>`}
document.addEventListener('click',e=>{const b=e.target.closest('.aubtn');if(b)b.closest('.authors').classList.add('open')});
function fold(){document.querySelectorAll('.paper').forEach(d=>{const p=d.querySelector('.abs'),b=d.querySelector('.absmore');
  if(!p||!b||d.classList.contains('open'))return;b.hidden=!(p.scrollHeight>p.clientHeight+2)})}
function toc(){const t=document.getElementById('toc');if(!NEWS.length)return;t.hidden=false;
  const X=RAW.next||[];
  t.innerHTML=`<h3>In this listing</h3><ol>${NEWS.map(n=>`<li><a href="#p${n.i}"><span class="sc${n.role==='repl'?' repl':''}">${n.score.toFixed(0)}</span><span class="tt">${esc(n.title)}</span></a></li>`).join('')}${X.length?`<li class="more-link"><a href="#more"><span class="sc">+${X.length}</span><span class="tt">The next ${X.length} papers by score (folded)</span></a></li>`:''}</ol>`;
  const m=t.querySelector('.more-link a');if(m)m.addEventListener('click',()=>{document.getElementById('more').open=true});tex(t)}

function draw(){
  if(!NEWS.length)return;
  const RNG=d3.randomLcg(11);
  const W=Math.max(300,document.getElementById('chart').clientWidth), H=W<600?500:480, m={l:16,r:16,t:20,b:34};
  svg.attr('viewBox',`0 0 ${W} ${H}`); svg.selectAll('*').remove();
  const yrs=d3.extent(N,n=>n.year);
  const x=d3.scaleLinear().domain([yrs[0]-.5,yrs[1]+1.2]).range([m.l+8,W-m.r-8]);
  const ticks=x.ticks(W<600?6:12).filter(t=>Number.isInteger(t)&&t<=yrs[1]);
  svg.append('g').attr('class','grid').selectAll('line').data(ticks).join('line').attr('x1',d=>x(d)).attr('x2',d=>x(d)).attr('y1',m.t).attr('y2',H-m.b);
  svg.append('g').attr('class','axis').attr('transform',`translate(0,${H-m.b})`).call(d3.axisBottom(x).tickValues(ticks).tickFormat(d3.format('d')).tickSizeOuter(0));
  const cy=(m.t+H-m.b)/2, xf=n=>isNew(n)?x(yrs[1]+.75):x(n.year);
  const sim=N.map(n=>({n,x:xf(n)+(RNG()-.5)*4,y:cy+(RNG()-.5)*H*.5}));
  const links=E.map(e=>({source:sim[e.s],target:sim[e.t],s:e.s,t:e.t,k:e.k}));
  d3.forceSimulation(sim).force('x',d3.forceX(s=>xf(s.n)).strength(1)).force('y',d3.forceY(cy).strength(.04))
    .force('link',d3.forceLink(links).strength(.03)).force('charge',d3.forceManyBody().strength(-40))
    .force('col',d3.forceCollide(s=>r(s.n)+2)).stop().tick(320);
  sim.forEach(s=>{s.y=Math.max(m.t+8,Math.min(H-m.b-8,s.y));s.x=Math.max(m.l+4,Math.min(W-m.r-4,s.x))});
  G=svg.append('g');
  G.append('g').selectAll('path').data(links).join('path').attr('class',l=>'edge '+l.k)
    .attr('d',l=>{const a=l.source,b=l.target;return `M${a.x},${a.y}Q${(a.x+b.x)/2},${(a.y+b.y)/2-Math.abs(a.x-b.x)*.12} ${b.x},${b.y}`});
  G.append('g').selectAll('circle').data([...sim].sort((a,b)=>RANK[b.n.role]-RANK[a.n.role])).join('circle')
    .attr('class','node').attr('cx',s=>s.x).attr('cy',s=>s.y).attr('r',s=>r(s.n)).attr('fill',s=>col(s.n))
    .on('pointerenter',(ev,s)=>{hover=s.n;showTip(ev,s.n);paint()}).on('pointermove',(ev,s)=>showTip(ev,s.n))
    .on('pointerleave',()=>{hover=null;tip.hidden=true;paint()}).on('click',(ev,s)=>pick(s.n,false));
  const lab=sim.filter(s=>isNew(s.n)||s.n.role==='seed'||s.n.deg>=3);
  const L=lab.map(s=>{const right=s.x>W*.8,t=isNew(s.n)?`#${s.n.rank} ${s.n.first}`:`${s.n.first} ${s.n.year}`,w=t.length*6.2;return{s,t,right,x0:right?s.x-r(s.n)-4-w:s.x+r(s.n)+4,w,y:s.y+4}}).sort((a,b)=>a.y-b.y);
  const placed=[];L.forEach(l=>{let k=0;while(k<40&&placed.some(p=>l.x0<p.x0+p.w&&p.x0<l.x0+l.w&&Math.abs(l.y-p.y)<13)){l.y+=13*(k%2?-1:1)*(1+Math.floor(k/2));k++;l.y=Math.max(m.t+10,Math.min(H-m.b-4,l.y))}placed.push(l)});
  G.append('g').selectAll('text').data(L).join('text').attr('class','nlabel').attr('x',l=>l.right?l.s.x-r(l.s.n)-4:l.s.x+r(l.s.n)+4).attr('y',l=>l.y)
    .attr('text-anchor',l=>l.right?'end':'start').text(l=>l.t);
  paint();
}
function showTip(ev,n){const b=document.getElementById('chart').getBoundingClientRect();tip.hidden=false;tip.textContent=`${auth(n)} (${n.year}) — ${plain(n.title)}`+(isNew(n)?` · score ${n.score}`:'');
  let L=ev.clientX-b.left+12;if(L>b.width-290)L=ev.clientX-b.left-290;tip.style.left=Math.max(4,L)+'px';tip.style.top=(ev.clientY-b.top+12)+'px'}
function paint(){if(!G)return;const f=hover||sel,on=new Set();if(f){on.add(f.i);f.out.forEach(i=>on.add(i));f.inn.forEach(i=>on.add(i))}
  svg.classed('dim',!!f);
  G.selectAll('path.edge').attr('class',l=>'edge '+l.k+(!f?'':l.s===f.i?' hot out':l.t===f.i?' hot in':''));G.selectAll('path.edge.hot').raise();
  G.selectAll('circle').classed('on',s=>on.has(s.n.i)).classed('sel',s=>sel&&s.n.i===sel.i).classed('match',s=>query&&`${s.n.first} ${s.n.title} ${s.n.arxiv} ${s.n.authors||''}`.toLowerCase().includes(query));
  G.selectAll('text.nlabel').classed('on',l=>on.has(l.s.n.i))}
function panel(){const p=document.getElementById('panel'),n=sel;
  if(!n){p.innerHTML='<p>Select a paper in the network.</p>';return}

  if(isNew(n)) p.innerHTML=`<div class="role" style="color:${col(n)}">#${n.rank} · ${esc(SEC[n.section])} · score ${n.score.toFixed(1)}</div><h4>${esc(n.title)}</h4>
   <div class="meta">${esc(auth(n))} · arXiv:${esc(n.arxiv)}</div><p>${why(n.note)}</p><div class="links"><a href="#p${n.i}">Back to abstract</a></div>`;
  else p.innerHTML=`<div class="role" style="color:${col(n)}">${esc(ROLE[n.role])}</div><h4>${esc(n.title)}</h4>
   <div class="meta">${esc(auth(n))} · ${n.year}${n.arxiv?' · arXiv:'+esc(n.arxiv):''}</div>
   <div class="stats"><span>${n.cites.toLocaleString()} citations</span><span>${n.inn.filter(i=>isNew(N[i])).length} of the matches link here</span></div>${links}`;
  tex(p)}
function pick(n,scroll){sel=n;panel();paint();document.querySelectorAll('.paper').forEach(el=>el.classList.toggle('sel',el.id==='p'+n.i));if(scroll)document.getElementById('chart').scrollIntoView({behavior:'smooth',block:'nearest'})}
const present=new Set(N.map(n=>n.role));
document.getElementById('legend').innerHTML=['today','repl','seed','other'].filter(k=>present.has(k)).map(k=>`<span><i class="dot" style="background:var(--${k})"></i>${esc(ROLE[k])}</span>`).join('')+'<span style="color:var(--fg-3)">Listing papers: size ∝ score; others: size ∝ log(citations)</span>';
document.getElementById('q').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();paint()});
svg.on('click',ev=>{if(ev.target.tagName!=='circle'){sel=null;panel();paint()}});
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(draw,200)});
function nextList(){const X=RAW.next||[];if(!X.length)return;const box=document.getElementById('nextlist'),more=document.getElementById('more');
  more.hidden=false;more.querySelector('summary').firstChild.textContent=`The next ${X.length} papers by score `;
  document.getElementById('moresub').textContent=`below the threshold of ${M.threshold}, not drawn in the network`;
  box.innerHTML=X.map(n=>`<li><div class="role" style="color:var(--${n.section==='replacement'?'repl':'today'})">#${n.rank} · ${esc(SEC[n.section])} · score ${n.score.toFixed(1)}</div>
    <div class="t">${esc(n.title)}</div><div class="authors">${authors(n.authors)} · arXiv:${esc(n.arxiv)}</div>
    ${n.note?`<p class="why">${why(n.note)}</p>`:''}
    <details class="abs"><summary>Abstract</summary><p class="abs">${esc(n.abstract)}</p></details>
    <div class="links">${n.id?`<a href="https://inspirehep.net/literature/${n.id}" target="_blank" rel="noopener">INSPIRE</a>`:''}<a href="https://arxiv.org/abs/${esc(n.arxiv)}" target="_blank" rel="noopener">arXiv</a><a href="https://arxiv.org/pdf/${esc(n.arxiv)}" target="_blank" rel="noopener">PDF</a></div></li>`).join('');
  more.addEventListener('toggle',()=>{if(more.open)tex(box)})}
const rtip=document.getElementById('reftip');let rcur=null;
function refShow(el){const r=REFS[el.dataset.ref];if(!r)return;rcur=el;rtip.textContent=`${auth(r)} (${r.year}) — ${plain(r.title)}`;rtip.hidden=false;
  const b=el.getBoundingClientRect(),t=rtip.getBoundingClientRect();let L=Math.min(Math.max(8,b.left),innerWidth-t.width-8),T=b.bottom+6;
  if(T+t.height>innerHeight-8)T=b.top-t.height-6;rtip.style.left=L+'px';rtip.style.top=T+'px'}
function refHide(){rtip.hidden=true;rcur=null}
document.addEventListener('pointerover',e=>{const el=e.target.closest('.ref');if(el&&e.pointerType==='mouse')refShow(el)});
document.addEventListener('pointerout',e=>{if(e.target.closest('.ref')&&e.pointerType==='mouse')refHide()});
document.addEventListener('click',e=>{const el=e.target.closest('.ref');if(el)refShow(el);else if(rcur)refHide()});
document.addEventListener('focusin',e=>{const el=e.target.closest('.ref');if(el)refShow(el)});
document.addEventListener('focusout',e=>{if(e.target.closest('.ref'))refHide()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')refHide()});
addEventListener('scroll',()=>{if(rcur)refHide()},{passive:true});
list();nextList();fold();draw();panel();
window.addEventListener('load',()=>{tex(document.getElementById('list'));tex(document.getElementById('panel'));fold();
  if(window.MathJax&&MathJax.startup&&MathJax.startup.promise)MathJax.startup.promise.then(()=>setTimeout(fold,300))});
addEventListener('resize',()=>{clearTimeout(window._ft);window._ft=setTimeout(fold,200)});
</script>
