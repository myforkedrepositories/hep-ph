<script>
const RAW = {"n":[{"id":"3230675","arxiv":"2611.22807","title":"Millicharged Fermions as Dark Matter: Theoretical Modeling and Experimental Detection","first":"Naydenov","nauth":1,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[1421898]]. Closest of your papers: [[2856850]] (coupling 0.08, 13 shared references). Closest network paper: [[2688651]] (coupling 0.26, 40 shared references). Shared topics: fermionic dark matter, dark matter.","score":38.1,"rank":1,"section":"new","parts":[0.45,0.23,0.73,0.0,0.44],"abstract":"Fermions with a small effective charge, $\\qeff\\ll1$, arise from kinetic mixing between an unbroken (or nearly unbroken) dark $U(1)'$ and electromagnetism, or from a genuinely fractional charge. Millicharged particles (mCPs) inherit the Pauli-exclusion constraints on fermionic dark matter (DM) in galaxies, while adding a long-range plasma phenomenology absent for neutral candidates. This review connects three strands: (i) the symmetry structure, cosmology and astrophysical bounds of millicharged fermions, comparing kinetic-mixing and fractional-charge realizations; (ii) the role of mCPs in galactic halo formation and dynamics, and when they fit the Ruffini--Argüelles--Rueda (RAR) self-gravitating core--halo model; and (iii) experimental techniques for detecting mCPs trapped on Earth, arriving from the galactic halo, or emitted by the Sun. We show that a collisionless halo of keV--MeV millicharged fermions requires $α'\\lesssim7\\times10^{-13}$--$2\\times10^{-10}$, depending on mass and velocity, orders of magnitude below the coupling needed for thermal freeze-out via $χ\\barχ\\to A'A'$ in the Milky Way and dwarf galaxies. A RAR halo made of the mCP itself thus needs non-thermal production, a charge-symmetric plasma and very small dark coupling, whereas a sub-dominant mCP component can be added without changing the halo. We close with open theoretical and experimental challenges and a summary of the allowed mCP parameter space.","authors":"Momchil Naydenov","nlinked":124,"nref":126,"src":"INSPIRE","html":true},{"id":"3083432","arxiv":"2511.10731","title":"Keeping It Renormalizable: Minimal Baryogenesis induced Asymmetric Dark Matter","first":"Escudero","nauth":3,"year":2026,"cites":0,"role":"repl","note":"Cites 2 network papers: [[1907141]], [[2795517]]. Closest of your papers: [[1764733]] (coupling 0.02, 3 shared references). Closest network paper: [[2107164]] (coupling 0.08, 6 shared references). Shared topics: scalar doublet, dark matter scenario, direct detection, direct detection experiment, dark matter.","score":37.6,"rank":2,"section":"replacement","parts":[0.7,0.08,0.22,0.0,0.75],"abstract":"Many asymmetric dark matter scenarios have been proposed to date. Among them, perhaps the most motivated ones are those in which the dark matter asymmetry is induced from the baryon/lepton asymmetries via chemical equilibration without any new sources of CP violation. However, most of the models put forward along these lines have been excluded by now and/or are based on complicated setups. In this letter, we present a new, simple, and viable scenario. It assumes only two new fields: a scalar singlet and an inert scalar doublet, and is based only on renormalizable interactions, that slowly generate the dark matter asymmetry from the Standard Model Higgs asymmetry. The successful asymmetry transfer requires small (but technically natural) couplings which in turn make the model CP conserving in practice. The model allows for the direct detection of dark matter in the upcoming generation of experiments, and the inert doublet is predicted to be light enough to be potentially produced and observed at the LHC and future colliders, $46\\,{\\rm GeV}<m_{H'}<580\\,{\\rm GeV}$. Quite remarkably, the mass and lifetime of the inert doublet may be inferred from direct detection experiments, indicating long-lived compressed electroweak states that can be searched for at the HL-LHC.","authors":"Miguel Escudero, Thomas Hambye, Chandan Hati","nlinked":38,"nref":42,"src":"INSPIRE","html":true},{"id":"3188142","arxiv":"2608.05304","title":"GOOFy-compatible 3HDMs and beyond","first":"Varzielas","nauth":2,"year":2026,"cites":0,"role":"repl","note":"Cites 2 network papers: [[2658189]], [[2815355]]. Closest of your papers: [[1294681]] (coupling 0.01, 2 shared references). Closest network paper: [[2932612]] (coupling 0.21, 44 shared references).","score":34.5,"rank":3,"section":"replacement","parts":[0.7,0.03,0.6,0.0,0.0],"abstract":"Beyond conventional Higgs-family and general CP transformations, one may also consider a broader class of non-standard \"GOOFy\" transformations, in which the scalar fields and their conjugates are assigned related but inequivalent transformations. Although these transformations are not symmetries of a full Lagrangian in the conventional sense, some nevertheless stabilise the scalar potential. Their impact on the quadratic sector has not yet been systematically classified. We develop a sign-orbit technique to determine the bilinear structures compatible with these transformations. Applied to three-Higgs-doublet models, and formulated so as to extend to larger multi-Higgs sectors, the method shows that a non-vanishing GOOFy-compatible quadratic sector exists only when two independent conditions are met: the underlying group admits a non-trivial sign character, and that character is realised within the tensor product of the scalar representation and its conjugate. As a key consequence, we demonstrate that the renormalisation-group stability of the $r_0 \\to -r_0$ manifold in isolation is not a generic feature of multi-Higgs potentials, but rather a direct consequence of special algebraic properties of $SU(2)$. These results provide a classification of the admissible GOOFy quadratic structures and their invariant bilinear subspaces, highlighting the algebraic obstructions to their renormalisation-group stability.","authors":"I. de Medeiros Varzielas, A. Kunčinas","nlinked":74,"nref":79,"src":"INSPIRE","html":true},{"id":"3230213","arxiv":"2611.21737","title":"Thermal Composite Dark Matter at LZ","first":"Buttazzo","nauth":5,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[2795517]]. Closest of your papers: [[2794409]] (coupling 0.03, 4 shared references). Closest network paper: [[3202840]] (coupling 0.19, 13 shared references). Shared topics: dark matter mass, thermal relic, dark matter candidate, dark matter.","score":33.3,"rank":4,"section":"new","parts":[0.45,0.1,0.53,0.0,0.65],"abstract":"We show that stable fermionic resonances of Composite Higgs models provide a thermal inelastic Dark Matter interpretation of the high-energy nuclear-recoil event LZ230616. Their stability follows from an exact accidental parity of the strong sector. Annihilation channels from composite interactions link the thermal relic mass to the strong coupling, allowing masses well beyond the pure electroweak prediction. We identify three scenarios in which the neutral states form a split pseudo-Dirac pair, distinguished by the origin of the inelastic coupling to the $Z$ boson. In the pure electroweak regime, the pair consists of the neutral components of a complex Higgsino-like doublet. Its unsuppressed inelastic $Z$ coupling requires Dark Matter masses above 20 TeV. In the pure strong regime, the suppressed $Z$ coupling of neutral states with vanishing hypercharge arises from strong interactions alone, allowing for smaller splittings and TeV-scale masses. In the third regime, which interpolates between the previous two, the neutral components of multiplets with different hypercharge are mixed. This enhances their inelastic coupling, accommodating the LZ event for masses of a few TeV and splittings around 300 keV, with mixing angles of order $10^\\circ$. All three cases provide a thermal Dark Matter candidate able to explain the LZ event, consistently with the solar-capture bounds, the LZ high-energy sideband, and gamma-ray indirect searches.","authors":"Dario Buttazzo, Andrea Di Lecce, Roberto Franceschini, Giulio Marino, Paolo Panci","nlinked":70,"nref":72,"src":"INSPIRE","html":true},{"id":"3227632","arxiv":"2611.14593","title":"Strongly supercooled first-order phase transitions: monopole abundance, entropy production and homogeneity consistency","first":"Zhang","nauth":3,"year":2026,"cites":0,"role":"repl","note":"Cites 2 network papers: [[2747842]], [[2657746]]. Closest of your papers: [[3130296]] (coupling 0.01, 2 shared references). Closest network paper: [[3128752]] (coupling 0.08, 16 shared references). Shared topics: early universe, gravitational wave.","score":31.4,"rank":5,"section":"replacement","parts":[0.7,0.04,0.24,0.0,0.23],"abstract":"We investigate whether monopole production in the early universe from a first-order phase transition in a unified gauge theory can be significantly suppressed if the phase transition is subject to strong supercooling but still completes successfully. This is facilitated by adopting a Gaussian nucleation model and assuming the false vacuum energy released is transferred to sectors which behave effectively as radiation in terms of cosmological evolution. We distinguish three criteria of phase-transition completion: the comoving measure completion (CMC) characterized by the eventual vanishing of the false-vacuum fraction (FVF), the physical volume completion (PVC) characterized by the eventual vanishing of the physical volume of false vacuum, and the asymptotic thermodynamic completion (ATC), which refers to the finiteness of total entropy production. Assuming an idealized Friedmann-Lemaître-Robertson-Walker (FLRW) cosmology, it is shown that the three criteria share exactly the same completion boundary, away from which they are completely equivalent. It is further shown that monopole abundance can be arbitrarily suppressed for parameter points approaching the completion boundary from the successful side. Nevertheless, for parameter points too close to the completion boundary, justification of the self-consistency of a homogeneous FLRW cosmology is difficult. We propose the use of the Hubble-scale FVF root-mean-square fluctuation to diagnose the homogeneity consistency issue, and find that arbitrarily strong suppression of monopole abundance relative to a reasonable Kibble estimate is not justifiable in terms of homogeneity consistency. These findings also have implications for gravitational wave production in strongly supercooled phase transitions.","authors":"Chen Zhang, Yue Niu, Xin Zhang","nlinked":119,"nref":124,"src":"INSPIRE","html":true},{"id":"3230165","arxiv":"2611.21714","title":"21 cm Cosmology of Boosted Dark Matter","first":"Lee","nauth":4,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[2051195]]. Closest of your papers: [[3146383]] (coupling 0.03, 6 shared references). Closest network paper: [[3138516]] (coupling 0.09, 10 shared references). Shared topics: dark matter mass, dark matter.","score":26.0,"rank":6,"section":"new","parts":[0.45,0.08,0.25,0.0,0.39],"abstract":"The formation history of low-mass halos is sensitive to the properties of dark matter. At low redshift, nonlinear evolution and baryonic processes can obscure this information. The 21 cm signal provides access to a high-redshift stage of structure formation, when the abundance and clustering of low-mass halos retain direct sensitivity to the mass and interactions of dark matter. Boosted dark matter (BDM) realizes this possibility through a two-component scenario in which the annihilation of the heavier component converts part of the mass difference into kinetic energy of the lighter component. Self-interactions redistribute this energy and generate pressure support, suppressing small-scale density perturbations even for dark matter masses in the MeV range. We calculate the global 21 cm brightness temperature and its power spectrum in BDM cosmology. The reduced abundance of low-mass halos delays the global absorption feature and shifts the characteristic redshift evolution of the power spectrum. We assess the projected sensitivity of SKA1-Low to these signatures. The sensitivity is strongest at intermediate light-component fractions, where both components remain sufficiently abundant for self-heating to affect structure formation. For $σ_{\\rm self1}/m_1\\simeq0.1\\,{\\rm cm^2\\,g^{-1}}$, models with $0.2\\lesssim r_1\\lesssim0.7$ can be distinguished from the fiducial $Λ$CDM prediction at the $95\\%$ confidence level under the optimistic forecast. We compare our results with existing direct-detection bounds from SENSEI and prospects for BDM searches at large-volume neutrino experiments, including Super-/Hyper-Kamiokande, JUNO, and DUNE. This comparison highlights the unique and complementary role of high-redshift surveys in testing BDM models.","authors":"Min Sub Lee, Jeong Han Kim, Kyoungchul Kong, Jong-Chul Park","nlinked":129,"nref":137,"src":"INSPIRE","html":true},{"id":"3230276","arxiv":"2611.22266","title":"Gravitational waves from cosmological first-order phase transitions with fluctuation-induced friction","first":"Chen","nauth":3,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[1863581]]. Closest of your papers: [[2663002]] (coupling 0.02, 2 shared references). Closest network paper: [[3208082]] (coupling 0.16, 8 shared references). Shared topics: gravitational wave.","score":25.2,"rank":7,"section":"cross","parts":[0.45,0.06,0.44,0.0,0.1],"abstract":"We study gravitational-wave production in a cosmological first-order phase transition with fluctuation-induced friction using three-dimensional lattice simulations of two coupled scalar fields. Kinetic and gradient energy in the additional field $s$ accumulates near the expanding bubble walls of $φ$ and affects their motion. The contribution from $s$ exceeds that from $φ$ at the spectral peak and has a slope similar to that of the bulk flow model over a finite interval above the peak. In the high-wave-number (UV) direction, $φ$ dominates and the total spectrum develops a broad feature. For the larger coupling, slowly contracting false vacuum remnants persist long after bubble merger.","authors":"Jun-Ye Chen, Dongdong Wei, Zong-Kuan Guo","nlinked":34,"nref":39,"src":"INSPIRE","html":true},{"id":"3187901","arxiv":"2608.04990","title":"Thermal Alignment as a Pathway to Axion Dark Matter","first":"Khan","nauth":6,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[3089716]]. Also cites widely used network papers: [[1783234]]. Closest of your papers: [[1955022]] (coupling 0.04, 8 shared references). Closest network paper: [[1963344]] (coupling 0.06, 11 shared references). Shared topics: dark matter.","score":25.1,"rank":8,"section":"replacement","parts":[0.48,0.14,0.18,0.0,0.13],"abstract":"We study the relic energy of an axion whose homogeneous displacement is damped by a thermal gauge plasma. Dissipation is accompanied by thermal fluctuations. To calculate the energy at decoupling, we retain the covariance between the axion field and its velocity. For linear Langevin dynamics, positivity of the noise covariance provides a finite-interval lower bound on the energy generated by the bath, independently of the initial state. We consider a renormalizable $SU(2)_h\\times SU(3)_\\ell$ theory in which a scalar transition separates the early topological susceptibility and Chern--Simons diffusion from the confining potential acting at late times. With the specified scalar history and a local plasma response, fluctuations generated during the final cooling interval carry energy comparable to the coherent-only dark matter benchmark. The relic-density integral extends over finite momenta and cannot be inferred from the homogeneous topological diffusion rate. We also include the chiral-condensate term in the scalar free energy. For the chirally broken benchmark, this term removes the stationary high-temperature solution of the polynomial potential. Thus, a consistent microscopic realization requires both an assessment of thermal axion production and scalar phases that remain stationary in the full free energy.","authors":"Imtiaz Khan, G. Mustafa, Chengxun Yuan, Farkhod Botirov, Ahmadjon Abdujabbarov, Farruh Atamurotov","nlinked":59,"nref":62,"src":"INSPIRE","html":true},{"id":"3206248","arxiv":"2609.26767","title":"Tachyonic particle production in strongly supercooled phase transitions","first":"Kulejewski","nauth":3,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[2657746]]. Closest of your papers: [[2787890]] (coupling 0.03, 5 shared references). Closest network paper: [[3128752]] (coupling 0.16, 26 shared references).","score":25.1,"rank":9,"section":"replacement","parts":[0.45,0.08,0.45,0.0,0.02],"abstract":"In strongly supercooled cosmological phase transitions, which generically lead to strong, observable gravitational-wave backgrounds, the scalar field typically transitions to a value well below the minimum of its potential. We study particle production caused by the subsequent evolution of the field. Because some modes feature temporarily tachyonic masses, they can be efficiently produced, and a significant fraction of the energy density released in the phase transition can get converted to particles rather than gradient energy. This has consequences for the shape and amplitude of the gravitational-wave spectrum caused by the interactions in bubbles and sources a new, high-frequency signal.","authors":"Mateusz Kulejewski, Bogumila Swiezewska, Jorinde van de Vis","nlinked":90,"nref":93,"src":"INSPIRE","html":true},{"id":"3230189","arxiv":"2611.21728","title":"Plugging the Pion Chimney","first":"Blinov","nauth":3,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Also cites widely used network papers: [[1783234]]. Closest of your papers: [[1709434]] (coupling 0.04, 5 shared references). Closest network paper: [[2617409]] (coupling 0.07, 12 shared references).","score":23.4,"rank":10,"section":"new","parts":[0.48,0.12,0.2,0.0,0.0],"abstract":"Heavy QCD axions and other gluon-coupled axion-like particles (ALPs) with masses from MeV to GeV are well motivated and have been searched for extensively. However, a window around the neutral pion mass, the so-called pion chimney, has escaped every search. There the ALP mixes strongly with the $π^0$ and therefore shares its experimental signatures. We show that the chimney can be closed with existing LHC data. The key point is that mixing changes the lifetimes of the two mass eigenstates but does not make them equal, and at LHC energies the states are boosted enough for the lifetime to decide whether they escape the detector or decay inside it. The ATLAS monojet search constrains the first case and the ATLAS inclusive photon measurement the second, and together they exclude the chimney up to the cutoff of the ALP effective theory. Above the cutoff, LHC searches for the colored states of the simplest ultraviolet completions exclude the rest. We also show that the bound from the $K^+$ width does not reach the chimney, because an ALP passes the same selection as a $π^0$, and we derive an independent, purely kinematic constraint from the measured $π^\\pm$-$π^0$ mass splitting.","authors":"Nikita Blinov, Andrew M. Evans, Shirley Weishi Li","nlinked":58,"nref":60,"src":"INSPIRE","html":true},{"id":"3168819","arxiv":"2606.16204","title":"Dark Matter Attenuation inside the Earth: A Boltzmann Equation Approach","first":"Xing","nauth":2,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[3115426]]. Closest of your papers: [[3146383]] (coupling 0.01, 1 shared references). Closest network paper: [[2181757]] (coupling 0.11, 7 shared references). Shared topics: dark matter.","score":22.8,"rank":11,"section":"replacement","parts":[0.45,0.04,0.31,0.0,0.13],"abstract":"For strongly interacting or boosted dark matter, propagation through the Earth can involve sizable scattering and energy loss, reshaping the underground flux in energy, direction, and normalization. Scattered particles may still fall within the detector acceptance, so the detector-side signal depends on phase-space transport from the Earth's surface to the underground detector. In this work, we formulate this transport problem with the Boltzmann equation. Its integral solution organizes successive scattering effects as a deterministic expansion in scattering orders. We analyze the transport equation in flat-Earth and spherical-Earth geometries, and apply the method to Dirac dark matter with an isoscalar vector interaction. The iterative solution agrees well with the Monte Carlo spectra.","authors":"Chuan-Yang Xing, Chen Xia","nlinked":39,"nref":42,"src":"INSPIRE","html":true},{"id":"2909892","arxiv":"2504.06656","title":"Machine Learning in the Hunt for Charged Higgs Bosons at Gamma-Gamma Colliders in the Type III Two Higgs Doublet Model","first":"Quddus","nauth":4,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[2874649]]. Also cites widely used network papers: [[2817040]]. Closest of your papers: [[3094526]] (coupling 0.03, 4 shared references). Closest network paper: [[2686887]] (coupling 0.05, 5 shared references).","score":21.3,"rank":12,"section":"replacement","parts":[0.48,0.08,0.13,0.0,0.0],"abstract":"We study charged Higgs boson pair production, $γγ\\to H^{+}H^{-}$, in the Type-III Two-Higgs-Doublet Model (2HDM-III) for $100\\leq M_{H^{\\pm}}\\leq190~\\text{GeV}$ at a $γγ$ collider with $\\sqrt{s}=3~\\text{TeV}$ and $\\mathcal{L}_{int}=3000~\\text{fb}^{-1}$. Two benchmark points, BP1 ($\\tanβ=10$, $\\cos(β-α)=-0.2$) and BP2 ($\\tanβ=20$, $\\cos(β-α)=-0.1$), are chosen in agreement with theoretical constraints, flavor-physics data and the signal strengths of the $125~\\text{GeV}$ Higgs boson. The total width of $H^{\\pm}$ is $10^{-4}$--$10^{-1}~\\text{GeV}$, i.e. a narrow resonance, and $\\mathrm{BR}(H^{+}\\toτν_τ)$ falls from $4.6\\times10^{-3}$ (BP1) and $2.9\\times10^{-4}$ (BP2) at $100~\\text{GeV}$ to $1.8\\times10^{-4}$ and $1.2\\times10^{-5}$ at $190~\\text{GeV}$. The $τν_τ$ and $tb$ final states are analyzed with four TMVA classifiers (BDT, MLP, Likelihood and LikelihoodD) using $1.0\\times10^{5}$ generated events per process. For $171$ signal and $604$ background events, the MLP and BDT reach AUC values of $0.934$ and $0.933$ and maximum significances $S/\\sqrt{S+B}$ of $9.86$ and $9.82$, compared with $0.870$ and $8.54$ for LikelihoodD and $0.815$ and $7.55$ for Likelihood. The preselection cuts raise the significance by only $0.09$--$0.91\\%$, depending on the classifier. The quoted significances are statistical; systematic uncertainties are not included.","authors":"Abdul Quddus, Ijaz Ahmed, Jamil Muhammad, M. A. Arroyo-Ure","nlinked":35,"nref":42,"src":"INSPIRE","html":true},{"id":"3162383","arxiv":"2605.29132","title":"Residual Nonextensivity from WIMP Freeze-Out: A Phenomenological Memory Channel","first":"Gonzalez","nauth":1,"year":2026,"cites":0,"role":"repl","note":"Closest of your papers: [[2663002]] (coupling 0.11, 7 shared references). Closest network paper: [[2664596]] (coupling 0.10, 7 shared references). Shared topics: dark matter abundance, interacting massive particle, weakly interacting massive particle, dark matter.","score":20.5,"rank":13,"section":"replacement","parts":[0.0,0.34,0.29,0.0,0.6],"abstract":"In this work we formulate the thermal decoupling, or freeze-out, of weakly interacting massive particle dark matter within a dynamical Tsallis framework. The parameter $q_χ$ is promoted to a function of $x=m_χ/T$, describing a relaxation toward extensivity that need not be completed before chemical decoupling. We adopt a sectorial approximation during freeze-out, with an extensive Standard Model bath, and specify the statistical weights and effective kinetic closure used for the dark matter abundance. The total derivatives of the equilibrium density contain the variation of $q_χ$, which changes the rate at which the abundance must evolve to follow its instantaneous reference state. The residual value $q_χ^{\\rm fo}$ then provides the input for a phenomenological memory channel into the electron-positron and neutrino sectors, while photons remain extensive. We derive the corresponding chain rule terms in the radiation energy and entropy balances and formulate the photon-reheating problem without assuming that comoving electromagnetic entropy is automatically conserved when $q$ varies. The resulting construction connects the freeze-out history with the neutrino-to-photon temperature ratio and $N_{\\rm eff}$. We discuss the physical motivation, closure assumptions, and conditions under which this description can be used, without presenting numerical results or observational fits.","authors":"Matias P. Gonzalez","nlinked":21,"nref":28,"src":"INSPIRE","html":true},{"id":"3230319","arxiv":"2611.22421","title":"Top-Quark Physics after Evidence for Toponium","first":"Baer","nauth":2,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Closest of your papers: [[1655573]] (coupling 0.02, 3 shared references). Closest network paper: [[3193100]] (coupling 0.07, 121 shared references).","score":20.3,"rank":14,"section":"new","parts":[0.45,0.06,0.19,0.0,0.0],"abstract":"The top quark decays before it hadronizes, and toponium, the t\\bar t bound state, was long thought unobservable as a resonance. CMS and ATLAS each report an excess of top-quark pairs at threshold, above five standard deviations over fixed-order quantum chromodynamics (QCD), and CMS confirms it in a second decay channel. Its angular distributions match the color-singlet pseudoscalar quasi-bound state η_t of nonrelativistic QCD, although an additional pseudoscalar boson is not excluded and higher-order fixed-order QCD accounts for part of the enhancement. We review the theory, ATLAS's nominal Green's-function signal model, and the measurements, whose cross sections range from about 3 to 13 pb. Part of the spread comes from the signal model and part persists between analyses using the same model. We discuss consequences for entanglement, the top mass, and heavy-pseudoscalar searches. We then review the top-quark program, from mass definitions to electroweak precision, flavor, the charge-conjugation and parity (CP) structure of the top Yukawa coupling, supersymmetry, multi-top production, and effective field theory. We close with prospects at the High-Luminosity LHC and future colliders, where an e^+e^- threshold scan can determine the top-quark mass in a short-distance scheme to a few tens of MeV.","authors":"Howard Baer, Vernon Barger","nlinked":268,"nref":740,"src":"INSPIRE","html":true},{"id":"3230207","arxiv":"2611.21736","title":"Active Galactic Nuclei as Beyond the Standard Model Laboratories: a White Paper","first":"Herrera","nauth":20,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[2795517]]. Closest of your papers: [[2964960]] (coupling 0.00, 2 shared references). Closest network paper: [[2791814]] (coupling 0.04, 6 shared references). Shared topics: dark matter.","score":19.3,"rank":15,"section":"new","parts":[0.45,0.02,0.12,0.0,0.13],"abstract":"Multi-messenger and multi-wavelength observations of Active Galactic Nuclei (AGN) can provide otherwise inaccessible knowledge about physics Beyond the Standard Model (BSM), and may even lead to its discovery. Realizing this potential hinges on two parallel efforts: advancing our understanding of AGN and of the dark matter around them, and identifying the BSM signatures that are at once promising and robust against the gaps in that understanding. These fields have attracted growing interest in recent years, also motivated by the IceCube association of neutrinos to individual AGN, yet we have only begun to explore their cross-fertilization. This white paper offers a new perspective on this interdisciplinary endeavor. It concisely reviews the state of the art in each field and at their interface, and identifies the key open questions that must be addressed to strengthen our prospects for learning about BSM physics with AGN.","authors":"Gonzalo Herrera, Filippo Sala, Piero Ullio, Misty C. Bentz, Carlos Blanco, Roberto Caiozzo, Marina Cermeño, Matteo Cerruti, James M. Cline, Andrea Giovanni De Marchi, Pierfrancesco Di Cintio, Alessandro Granelli, R. Andrew Gustafson, Bradley J. Kavanagh, Cristina Lagunas Gualda, Kohta Murase, Takuya Okawa, Xavier Rodrigues, Lorenzo Ubaldi, Gabrijela Zaharijas","nlinked":211,"nref":233,"src":"INSPIRE","html":true},{"id":"3230697","arxiv":"2611.22945","title":"Universal Mass Equation for Equal-Quantum Excited-States Sets~III","first":"Roper","nauth":2,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Also cites widely used network papers: [[2817040]]. Closest of your papers: [[3184726]] (coupling 0.01, 1 shared references). Closest network paper: [[2750604]] (coupling 0.03, 1 shared references).","score":18.9,"rank":16,"section":"new","parts":[0.48,0.02,0.09,0.0,0.0],"abstract":"Using our simple logarithmic Universal Mass Equation, we considered heavy non-$q\\bar{q}$ meson states. PDG2026 reported a series of mesons with quantum numbers not allowed for standard $q\\bar{q}$ states. Using LQCD predictions, we evaluated a scalar $0^{++}$ and tensor $2^{++}$ glueball series for which predictions are available. This approach allows us to predict heavy states that require future experimental studies. Additionally, we consider the possible misidentification of some meson states.","authors":"L. David Roper, Igor Strakovsky","nlinked":32,"nref":35,"src":"INSPIRE","html":true},{"id":"3191828","arxiv":"2608.16266","title":"Amplified Isospin Breaking from Coupled-Channel Dynamics Near Threshold","first":"Dong","nauth":5,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[3193100]]. Closest network paper: [[3193100]] (coupling 0.05, 50 shared references).","score":17.9,"rank":17,"section":"replacement","parts":[0.45,0.0,0.14,0.0,0.0],"abstract":"We identify the dynamical origin of amplified isospin breaking in near-threshold states. Using a pole-residue-based measure defined directly from the pole couplings, rather than from decay observables that are also affected by different final-state kinematics, we show that threshold proximity of the pole alone is insufficient: large isospin breaking requires a sizable interaction in the companion isospin channel. In particular, the isospin-violating pole-coupling ratio vanishes when the companion-channel interaction is switched off, even at finite threshold splitting. Applied to the $X(3872)$, the observed large isospin breaking points to a nearby partner pole, $W_{c1}$, as predicted in previous studies. As a concrete realization of the previously discussed leading/shadow-pole interchange, we find that the $W_{c1}$ pole, which predominantly affects the line shapes near the charged threshold in the physical case, does not evolve into the pure $I=1$ eigenstate in the isospin limit; instead, that eigenstate is continuously connected to a more distant shadow pole.","authors":"Xiang-Kun Dong, Feng-Kun Guo, Christoph Hanhart, Teng Ji, Ulf-G. Meißner","nlinked":87,"nref":90,"src":"INSPIRE","html":true},{"id":"3213034","arxiv":"2610.11937","title":"Reassessing the $X(2370)$ in $J/ψ\\toγK_S^0K_S^0π^0$ beyond the one-dimensional mass projections","first":"Dong","nauth":4,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[3193100]]. Closest network paper: [[3193100]] (coupling 0.02, 20 shared references).","score":16.7,"rank":18,"section":"replacement","parts":[0.45,0.0,0.06,0.0,0.0],"abstract":"The BESIII Collaboration recently extracted the properties of the $X(2370)$ from a fit to the one-dimensional $K_S^0K_S^0π^0$ invariant-mass spectrum in $J/ψ\\toγK_S^0K_S^0π^0$. The intermediate two-body structures visible in the mass correlations, including the $K_0^*(1430)$ bands, require a coherent treatment of cross-channel interference when interpreting the enhancement near 2.3 GeV. We reassess the need for an additional $X(2370)$ contribution by fitting the published data using an effective coupled-channel framework with an approximate detection efficiency depending on the three-body invariant mass. The three-body parent amplitude is parameterized using a $K$-matrix that describes scattering among several quasi-two-body channels. The seven- and eight-bare-state models give similar mass distributions. Adding the eighth bare state lowers the Poisson deviance by 1.22% and produces an additional pole at $E=(2419-i152)$ MeV, substantially broader than the $X(2370)$ mass-width reference. This pole is model-dependent, and its identification with the $X(2370)$ is not clear. The present analysis does not establish the need for an additional $X(2370)$ contribution in $J/ψ\\toγK_S^0K_S^0π^0$, thereby weakening the flavor-singlet argument based on the suppression of $K^*\\bar K$ relative to the total $K\\bar Kπ$ contribution. A more comprehensive experimental amplitude analysis, incorporating coherent interference, mass and angular correlations, and detector effects across related decay channels, is needed to establish the role and decay properties of the $X(2370)$.","authors":"Xiang-Kun Dong, Teng Ji, Meike Küßner, Ulf-G. Meiß ner","nlinked":69,"nref":71,"src":"INSPIRE","html":true},{"id":"3230240","arxiv":"2611.21807","title":"On the Structure of the Nuclear-Clock Isotope $^{229}$Th Beyond Quadratic Order","first":"Baruch","nauth":10,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Closest network paper: [[3227657]] (coupling 0.01, 1 shared references).","score":16.4,"rank":19,"section":"new","parts":[0.45,0.0,0.04,0.0,0.0],"abstract":"Precision measurements of the exceptionally low-energy nuclear transition of $^{229}$Th, offer an extraordinary sensitivity to a variety of new light fields. However, interpreting such measurements requires nuclear-structure information beyond what is currently constrained by spectroscopy. We develop a systematic description of the electric multipole interactions governing the hyperfine structure of ${}^{229}$Th, including the hexadecapole contribution, and perform a symmetry-based analysis of the resulting hyperfine splittings in crystalline environments. Hyperfine spectroscopy generally constrains combinations of nuclear moments and crystal-field gradients, leading to degeneracies when higher multipole interactions are allowed. We then combine experimental nuclear observables, particle-rotor relations, and a deformed-Fermi charge-density model to investigate the electromagnetic contribution to the nuclear clock's sensitivity to variations in the fine-structure constant. We find that higher-order nuclear deformation and state-dependent differences in the radial charge distribution of the clock states can substantially alter the predicted sensitivity, introducing large uncertainties that are not constrained by existing measurements. Our results highlight the importance of combining nuclear and solid-state theory with complementary measurements, including spectroscopy of higher-spin states, to constrain the nuclear structure and improve predictions of the clock's sensitivity to new physics. Our symmetry-based analysis also provides a framework for using hyperfine spectroscopy to investigate local defect symmetries in crystalline hosts.","authors":"Chaja Baruch, Doron Gazit, Hans-Werner Hammer, Fiona Kirk, Joachim Kopp, Gil Paz, Ekkehard Peik, Gilad Perez, Yotam Soreq, Konstantin Springmann","nlinked":53,"nref":74,"src":"INSPIRE","html":true},{"id":"3230198","arxiv":"2611.21764","title":"$B\\to K a$ decays in QCD factorization and revised bounds on ALP couplings","first":"Banerjee","nauth":3,"year":2026,"cites":0,"role":"today","note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1607572]] (coupling 0.03, 3 shared references). Closest network paper: [[2617409]] (coupling 0.12, 12 shared references). Shared topics: mass below.","score":13.7,"rank":20,"section":"new","parts":[0.06,0.1,0.33,0.0,0.38],"abstract":"Rare flavor-changing processes such as $B\\to K a$ offer sensitive probes of axion-like particles (ALPs) for masses below a few GeV. We study this process in the framework of QCD factorization and ALP effective theory, in which the ALP couples to the Standard Model (SM) fermions through shift-invariant derivative interactions. In contrast to previous studies, where flavor violation arises solely from flavor-changing ALP couplings, we also include the contributions proportional to flavor-conserving ALP couplings, in which the flavor change is mediated by the weak interactions of the SM. Based on this analysis, we derive upper bounds on both flavor-changing and flavor-conserving ALP couplings at low energies. Then we consider the UV scenario of a \"minimally flavor-violating ALP\", which features flavor-universal ALP-fermion couplings at very high energies, and evaluate the resulting constraints on the UV couplings.","authors":"Upalaparna Banerjee, Cristhian Calderon, Matthias Neubert","nlinked":38,"nref":40,"src":"INSPIRE","html":true},{"id":"3230674","arxiv":"2611.22890","title":"Scalar inelastic scattering of pseudo-Majorana dark matter through a radion portal","first":"Leng","nauth":4,"year":2026,"cites":0,"role":"today","note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1955022]] (coupling 0.02, 3 shared references). Closest network paper: [[3215109]] (coupling 0.08, 6 shared references). Shared topics: relic abundance, thermal relic, dark matter.","score":13.4,"rank":21,"section":"new","parts":[0.06,0.06,0.24,0.0,0.6],"abstract":"We investigate a radion portal for pseudo-Majorana dark matter as an interpretation of the high-recoil event LZ230616. In contrast to the familiar pseudo-Dirac regime, the pseudo-Majorana structure allows a dominant scalar transition while suppressing elastic scattering. Endothermic kinematics remove low-energy recoils, while the nuclear response shapes the surviving high-recoil spectrum. Combining the accepted LZ event count with the Born-level thermal relic abundance yields a reference solution with $m_χ=1$ TeV, $δ=340$ keV, and $m_r=30$ GeV. This solution lies within the published LZ spin-independent $\\mathcal{O}_1^s$ interval and remains compatible with existing OPAL and CMS constraints, while a simplified HL-LHC diphoton projection could probe it. Solar neutrino searches offer a complementary test. The benchmark's energetic-daughter proxy rates are comparable in magnitude to the rate scales reconstructed from IceCube's direct $b\\bar{b}$ and $τ^+τ^-$ templates. An illustrative IceCube-Gen2 rescaling suggests future sensitivity, while a model-specific assessment requires the radion-cascade neutrino spectra and detector response.","authors":"Ruifeng Leng, Kirtimaan A. Mohan, Keping Xie, Hong-Hao Zhang","nlinked":68,"nref":71,"src":"INSPIRE","html":true},{"id":"3230187","arxiv":"2611.21729","title":"Supernova Bounds on Neutrino Dipole Moments from a Modern Perspective","first":"Fiorillo","nauth":4,"year":2026,"cites":0,"role":"today","note":"Closest of your papers: [[1597138]] (coupling 0.02, 3 shared references). Closest network paper: [[2937257]] (coupling 0.23, 26 shared references).","score":11.5,"rank":22,"section":"new","parts":[0.0,0.06,0.65,0.0,0.0],"abstract":"Neutrinos may have nonstandard magnetic dipole moments $μ_ν$. In the dense cores of supernovae (SNe), these would convert part of the neutrinos into sterile, right-handed states through the electromagnetic fluctuations of the charged plasma. The streaming sterile neutrinos with 100-MeV energies can convert back to standard neutrinos in the Galactic magnetic field, leading to a high-energy neutrino flux unobserved from the historical SN 1987A. We reassess the production rates, including scattering on both protons and electrons, and, building upon advances in SN simulations and in the description of the Milky Way magnetic field, we revisit the bounds on magnetic dipole moments. We find for Dirac electron neutrinos $μ_{ν_e} \\lesssim 4.8 \\times 10^{-13} μ_B$, superseding all existing terrestrial and astrophysical constraints.","authors":"Damiano F. G. Fiorillo, Martina La Rosa, Federico Testagrossa, Edoardo Vitagliano","nlinked":160,"nref":172,"src":"INSPIRE","html":true},{"id":"2918215","arxiv":"2505.01492","title":"Photo- and Hadrodisintegration constraints on massive relics decaying into neutrinos","first":"Bianco","nauth":6,"year":2026,"cites":0,"role":"repl","note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[3130296]] (coupling 0.02, 3 shared references). Closest network paper: [[2831966]] (coupling 0.15, 10 shared references). Shared topics: early universe.","score":11.5,"rank":23,"section":"replacement","parts":[0.06,0.05,0.43,0.0,0.14],"abstract":"We perform a detailed study of the cosmological constraints on the decay of a relic particle $φ$ into neutrinos, $φ\\rightarrow ν\\barν$, in particular those arising from the observed light-element abundances in the early Universe. We focus on the late-time disintegration of the light elements previously synthesised during BBN. Several processes are relevant, including final-state radiation associated with the decay, as well as subsequent interactions of the injected neutrinos with the thermal background neutrinos or between themselves. All processes generically contribute to the production of electromagnetic and often also hadronic material and may therefore induce late-time photodisintegration and hadrodisintegration reactions, i.e.~the destruction of light elements that have previously been formed during BBN. Here, we examine this scenario with a Monte-Carlo inspired probabilistic approach rather than Boltzmann techniques, taking into account all of these different reactions as well as their interplay. We find the resulting constraints to be very significant, covering a broad range of previously unexplored masses and lifetimes of the relic source particle.","authors":"Sara Bianco, Paul Frederik Depta, Jonas Frerick, Thomas Hambye, Marco Hufnagel, Kai Schmidt-Hoberg","nlinked":62,"nref":64,"src":"INSPIRE","html":true},{"id":"3230677","arxiv":"2611.23015","title":"A Universal Axion in a Twin-QCD Sector","first":"Raby","nauth":2,"year":2026,"cites":0,"role":"today","note":"Closest of your papers: [[1941263]] (coupling 0.03, 4 shared references). Closest network paper: [[2739891]] (coupling 0.05, 5 shared references). Shared topics: observed dark matter, early universe, dark matter.","score":10.7,"rank":24,"section":"new","parts":[0.0,0.1,0.15,0.0,0.53],"abstract":"Dark matter may consist of multiple components with distinct particle-physics origins. We investigate a scenario in which a universal axion couples to both visible and twin QCD, with twin baryons providing a possible dominant dark-matter component. The presence of a second strongly interacting sector can substantially enhance the axion mass while preserving its role in resolving the strong-CP problem, provided the physical vacuum angles are appropriately aligned. For a representative uniformly rescaled twin spectrum with a confinement scale five times that of ordinary QCD, the axion mass is enhanced by approximately a factor of 25. Using lattice-informed QCD results and a two-temperature description of the early universe, we investigate the cosmological evolution and relative abundances of the dark-sector components. In a representative conditional numerical benchmark, axions account for a small percentage of the observed dark matter, while twin baryons could constitute the remainder for a suitable primordial baryon asymmetry. We also examine the implications for additional relativistic species, strong-CP alignment, and the interactions of stable twin matter. Our results provide a quantitative framework for exploring mixed axion--twin-baryon dark matter and identify the particle-physics and cosmological conditions necessary for a viable realization, including constraints from the thermal history and formation of cosmic structure.","authors":"Stuart Raby, Scott Watson","nlinked":19,"nref":20,"src":"INSPIRE","html":true},{"id":"1963344","arxiv":"2111.03677","title":"QCD Axion Kinetic Misalignment without Prejudice","first":"Barman","nauth":4,"year":2021,"cites":36,"role":"other","note":"","score":null},{"id":"2922810","arxiv":"2505.13093","title":"Fermionic sub-GeV dark matter from evaporating primordial black holes at DarkSide-50","first":"Agnes","nauth":128,"year":2025,"cites":4,"role":"other","note":"","score":null},{"id":"2815960","arxiv":"2408.03364","title":"Long-lived particle phenomenology in one-loop neutrino mass models with dark matter","first":"Arbeláez","nauth":5,"year":2024,"cites":4,"role":"other","note":"","score":null},{"id":"1421898","arxiv":"1602.04816","title":"A White Paper on keV Sterile Neutrino Dark Matter","first":"Drewes","nauth":136,"year":2016,"cites":739,"role":"other","note":"","score":null},{"id":"2627241","arxiv":"2301.11345","title":"Gravitational wave from graviton Bremsstrahlung during reheating","first":"Barman","nauth":4,"year":2023,"cites":74,"role":"seed","note":"","score":null},{"id":"3187354","arxiv":"2608.03975","title":"Mono-X Signal Characterization from Two-component Dark Matter Using a Convolutional Neural Network","first":"Costa","nauth":3,"year":2026,"cites":1,"role":"other","note":"","score":null},{"id":"2181757","arxiv":"2211.07477","title":"Search for boosted keV-MeV light dark matter particles from evaporating primordial black holes at the CDEX-10 experiment","first":"Zhang","nauth":84,"year":2022,"cites":24,"role":"other","note":"","score":null},{"id":"3208082","arxiv":"2609.31495","title":"High-frequency gravitational waves from microscopic particle-graviton assoc ank":25,"parts":[0.0,0.11,0.26,0.0,0.24],"note":"Closest of your papers: [[2787890]] (coupling 0.04, 6 shared references). Closest network paper: [[2828434]] (coupling 0.09, 10 shared references). Shared topics: early universe, gravitational wave.","abstract":"We discuss a possible early Universe scenario, where radiation era is interrupted by the epoch of domination of domain walls eventually annihilating into particles. During this period the Universe undergoes accelerated expansion, while the comoving correlation length of the domain wall network remains constant. The network serves as a source of tensor modes, which get frozen upon exiting the horizon similarly to the case of inflationary fluctuations. The modes re-enter the horizon during the subsequent stage of radiation domination and since then contribute to the gravitational wave background. The period of wall domination is manifested in the spectral shape of gravitational waves via a distinctive plateau replacing a peak, which is characteristic for the scenario with sub-dominant walls. The gravitational waves are strong enough to be observed with present-day and future facilities in a broad range of frequencies. In particular, their energy density is sufficient to produce a significant impact on the effective number of neutrino species, unless the duration of wall domination is suitably constrained."},{"arxiv":"2606.01966","id":"3164302","title":"Reinterpreting the ATLAS HHH$\\to 6b$ Search with CheckMATE and Rivet: Validation, TRSM Benchmarks, and HL-LHC Prospects","authors":"Tomasz Procter, Krzysztof Rolbiecki, Andrzej Siódmok","score":9.1,"section":"replacement","rank":26,"parts":[0.0,0.12,0.18,0.0,0.26],"note":"Closest of your papers: [[1455793]] (coupling 0.04, 5 shared references). Closest network paper: [[3170413]] (coupling 0.06, 5 shared references). Shared topics: singlet scalar.","abstract":"We present an implementation in CheckMATE and Rivet of the ATLAS collaboration search for triple Higgs boson production in a six $b$-jets final state. The search relies on event selection using a deep neural network and a statistical model based on the HS3 format. Owing to a rich validation material provided by ATLAS, we perform a thorough validation of neural network input features and exclusion limits in the Standard Model and its extension with two additional singlet scalar fields (TRSM). Finally, we discuss expected performance of the search at the High Luminosity LHC in several scenarios of systematic uncertainty. We present projected exclusion limits for a set of TRSM benchmark models beyond those considered by ATLAS."},{"arxiv":"2611.21719","id":"3230164","title":"Feebly-Interacting Particle Searches","authors":"Jonathan L. Feng","score":8.4,"section":"new","rank":27,"parts":[0.0,0.06,0.33,0.0,0.16],"note":"Closest of your papers: [[3146383]] (coupling 0.02, 2 shared references). Closest network paper: [[3115042]] (coupling 0.12, 5 shared references). Shared topics: dark matter.","abstract":"In the last several years, feebly-interacting particles (FIPs) have moved from \"exotica\" to the mainstream of particle physics. This development is fueled by three motivations: FIPs are one of two broad possibilities for new particles, FIPs are as well motivated by dark matter as WIMPs, and FIPs are connected to important problems in particle physics. I review these motivations and then briefly highlight recent progress in a few areas, including axion-like particles, dark photons and other gauge bosons, the X17 anomaly, quirks, and the Forward Physics Facility."},{"arxiv":"2606.30910","id":"3175030","title":"Phenomenology of Long-Lived Dark Photons and Axion-Like Particles in a Mixed Portal Framework","authors":"Caglar Zorbilmez, Beyhan Tatar, Azmi Ali Altintas, Cihan Bayindir, Fatih Ozaydin","score":8.2,"section":"replacement","rank":28,"parts":[0.06,0.09,0.2,0.0,0.04],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1941263]] (coupling 0.03, 3 shared references). Closest network paper: [[2835155]] (coupling 0.07, 9 shared references).","abstract":"We investigate the phenomenology of a dark photon \\(A'\\) and an axion-like particle (ALP) ,\\(a\\), connected through a mixed portal framework which simultaneously allows the conventional visible decay $(A'\\rightarrow f\\bar f)$ and the exotic cascade process $(A'\\rightarrow aγ\\rightarrow3γ)$. We derive the relevant decay widths, branching ratios, and Lorentz-boosted decay lengths, and introduce a dominance parameter \\(D=Γ(A'\\to aγ)/Γ_{\\rm SM}\\) to distinguish Standard Model-dominated and cascade-dominated regions, with the transition occurring at $(D=1)$. A detailed analysis of both light $(0.1\\leq m_{A'}\\leq10~{\\rm GeV})$ and heavy $(10\\leq m_{A'}\\leq100~{\\rm GeV})$ dark-photon scenarios shows that the exotic channel can substantially modify the expected dark-photon signatures, transforming otherwise long-lived or detector-stable states into experimentally accessible displaced multi-photon events. In addition, the ALP sector itself may exhibit long-lived particle behavior, leading to distinct displaced diphoton signatures. Our results show that mixed dark-photon-ALP portals offer a rich LLP phenomenology that can be explored at future high-luminosity lepton colliders such as the FCC-ee."},{"arxiv":"2611.23028","id":"3230730","title":"Imprints of Non-local Top-Higgs Interaction on Loop Induced Higgs Processes","authors":"Avik Banerjee, Rohan Pramanick, Tirtha Sankar Ray","score":8.1,"section":"new","rank":29,"parts":[0.0,0.09,0.23,0.0,0.2],"note":"Closest of your papers: [[1832796]] (coupling 0.03, 3 shared references). Closest network paper: [[1455732]] (coupling 0.08, 3 shared references). Shared topics: yukawa interaction.","abstract":"A composite Higgs arising from an underlying strong sector generally has non-local interactions with the elementary sector, formulated in terms of momentum-dependent form factors. We construct the minimal Ball-Chiu-type vertices consistent with gauge-invariant non-local $\\bar{t}th$ couplings containing Wilson lines, where recursive Ward-Takahashi identities connect the Yukawa interaction to higher-order contact interactions. For a symmetric monopole form factor motivated by lowest-resonance dominance, we compute the top-loop contributions to $gg \\to h$ and $h \\to γγ$ amplitudes in closed form, and demonstrate a logarithmically enhanced deviation from the Standard Model. Current measurements at the LHC exclude the characteristic new physics scale below 3.6 TeV at $2σ$, while future colliders could extend the sensitivity to approximately 8 TeV."},{"arxiv":"2611.21813","id":"3230266","title":"Probing $τ$ lepton dipole moments at multi-TeV muon colliders","authors":"Dario Buttazzo, Gabriele Levati, Yang Ma, Fabio Maltoni, Paride Paradisi, ZeQiang Wang","score":8.0,"section":"new","rank":30,"parts":[0.06,0.05,0.31,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2690106]] (coupling 0.02, 3 shared references). Closest network paper: [[2665284]] (coupling 0.11, 12 shared references).","abstract":"We investigate the sensitivity of future multi-TeV muon colliders to the electromagnetic and weak dipole moments of the $τ$ lepton within the dimension-six Standard Model Effective Field Theory. We consider $τ^+τ^-$ production through $μ^+μ^-$ annihilation and vector-boson scattering, electroweak-boson-associated $τ$ production, and the radiative Higgs decay $H\\toτ^+τ^-γ$. At high energies, the dipole-induced contributions quadratic in the Wilson coefficients become particularly important, with associated Higgs production, $μ^+μ^-\\toτ^+τ^-H$, providing the strongest sensitivity through energy-enhanced contact interactions. The remaining channels offer complementary probes of the underlying dipole operators. For a $10$~TeV muon collider with an integrated luminosity of $10\\,\\mathrm{ab}^{-1}$, we obtain combined sensitivities at the nominal $95\\%$ confidence level of $|Δa_τ|<1.2\\times10^{-5}$, $|d_τ|<6.6\\times10^{-20}\\,e\\,\\mathrm{cm}$, $|Δa_τ^Z|<1.8\\times10^{-5}$, and $|d_τ^Z|<1.0\\times10^{-19}\\,e\\,\\mathrm{cm}$. Compared with FCC-ee projections, the muon collider offers substantially stronger sensitivity to the electric dipole moments, while both facilities offer complementary probes of magnetic dipole moments. These results motivate further studies incorporating realistic detector effects and systematic uncertainties."},{"arxiv":"2602.15100","id":"3120990","title":"Dispersive analysis of the $\\boldsymbol{φ\\to γπ^0 π^0}$ process","authors":"Bai-Long Hoid, Igor Danilkin, Marc Vanderhaeghen","score":6.8,"section":"replacement","rank":31,"parts":[0.06,0.06,0.2,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2690106]] (coupling 0.02, 4 shared references). Closest network paper: [[2706495]] (coupling 0.07, 8 shared references).","abstract":"We present an analysis of the radiative decay $φ\\to γπ^0 π^0$ in a dispersive framework, where the two-pion subsystem undergoes strong final-state interactions that cover the $f_0(500)$ and $f_0(980)$ regions. We employ a coupled-channel Muskhelishvili-Omnès framework that allows for a consistent treatment of two scalar resonances and crossed-channel singularities induced by the Born and vector-meson exchanges. We explicitly verify the equivalence between the modified and standard Muskhelishvili-Omnès representations for vector-meson pole contributions when the isoscalar Omnès matrix is chosen asymptotically bounded, and we adopt the standard representation in decay kinematics. This yields, for the first time, a parameter-free dispersive prediction for the kaon Born rescattering, which provides a dominant contribution. To obtain a good fit to the KLOE and SND data, we employ a once-subtracted coupled-channel dispersion relation with heavier left-hand cut contributions and two unknown subtraction constants. The results demonstrate the consistency among the data for $ππ$ scattering, $γγ$ fusion, and $φ$ radiative decay, thereby validating the underlying dispersive formalism and the input used for the hadronic Omnès matrix and left-hand cuts."},{"arxiv":"2611.21741","id":"3230212","title":"Smuggling baryon asymmetry through strong washout","authors":"Kåre Fridell, Michal Malinský, Javier Perez-Soler","score":6.7,"section":"new","rank":32,"parts":[0.0,0.08,0.26,0.0,0.04],"note":"Closest of your papers: [[3184726]] (coupling 0.03, 5 shared references). Closest network paper: [[2051136]] (coupling 0.09, 15 shared references).","abstract":"We propose a scheme in which a primordial net baryon number generated at or around the unification scale may survive subsequent strong washout phases associated with active sphalerons and interactions of right-handed neutrinos inherent to thermal leptogenesis. A simple realization of this, namely, a long-lived scalar population injecting the net $B-L$ it carries into the Standard Model matter sector late enough to be safe from a strong washout, is constructed and studied in the context of a simple Pati-Salam scalar sector with a heavy $SU(4)_C$ sextet scalar."},{"arxiv":"2212.06862","id":"2614193","title":"Global Fit of Modified Quark Couplings to EW Gauge Bosons and Vector-Like Quarks in Light of the Cabibbo Angle Anomaly","authors":"Andreas Crivellin, Matthew Kirk, Teppei Kitahara, Federico Mescia","score":6.7,"section":"replacement","rank":33,"parts":[0.0,0.12,0.21,0.0,0.0],"note":"Closest of your papers: [[2690106]] (coupling 0.04, 6 shared references). Closest network paper: [[1847652]] (coupling 0.08, 11 shared references).","abstract":"There are two tensions related to the Cabibbo angle of the CKM matrix. First, the determinations of $V_{us}$ from $K_{μ2}$, $K_{\\ell3}$, and $τ$ decays disagree at the $3σ$ level. Second, using the average of these results in combination with $β$ decays (including super-allowed $β$ decays and neutron decay), a deficit in first-row CKM unitarity with a significance of again about $3σ$ is found. These discrepancies, known as the Cabibbo Angle anomaly, can in principle be solved by modifications of $W$ boson couplings to quarks. However, due to $SU(2)_L$ invariance, $Z$ couplings to quarks are also modified and flavour changing neutral currents can occur. In order to consistently assess the agreement of a new physics hypothesis with data, we perform a combined analysis for all dimension-six Standard Model Effective Field Theory operators that generate modified $W$ couplings to first and second generation quarks. We then study models with vector-like quarks, which are prime candidates for a corresponding UV completion as they can affect $W$-quark couplings at tree level, and we perform a global fit including flavour observables (in particular loop effects in $ΔF=2$ processes). We find that the best fit can be obtained for the $SU(2)_L$ doublet vector-like quark $Q$ as it can generate right-handed $W$-$u$-$d$ and $W$-$u$-$s$ couplings as preferred by data."},{"arxiv":"2607.04132","id":"3177568","title":"Left-right symmetry breaking in $E_6^L\\times E_6^R$ occurs only in spacetime -- with possible implications for strong $CP$","authors":"Tejinder P. Singh","score":6.7,"section":"replacement","rank":34,"parts":[0.0,0.07,0.17,0.0,0.21],"note":"Closest of your papers: [[1607572]] (coupling 0.02, 3 shared references). Closest network paper: [[2736974]] (coupling 0.06, 18 shared references). Shared topics: dark sector.","abstract":"Two-sided octonionic $E_6^L\\times E_6^R$ unification trinifies each factor and so carries two colour groups: the visible $SU(3)_c$ and a second $SU(3)_{c'}$ which, gauged like the first, would colour the charged lepton and must be suppressed by hand. We argue no such device is needed: the left-right symmetry acts in spacetime, not internally -- in the gravi-weak reading $SU(2)_R$ is the gravitational frame group and the exchange is ordinary parity on the Dirac field; a spacetime operation cannot double the internal colour. Colour is single and vector-like, $SU(3)_{c'}=SU(3)_c$, and the electron is a colour singlet. The right sector contributes one colour-blind datum, $\\sqrt m$ (values: the exceptional-Jordan trace split, an input; $N_R$ fixes only the colour representation). An anomaly no-go shows that no gauged $U(1)$ on the visible fermions can carry the $\\sqrt m$ pattern: the dark-electromagnetic $U(1)_{\\rm dem}$ carries the parity mirror of electric charge on the dark sector, the visible fermions are dem-neutral, and no visible fifth force is predicted. Hypercharge is recovered as the consistency relation $Y=Q-T^3_L$, $Q=N/3$. As an application, parity restricts the QCD angle to $\\{0,π\\}$; $θ_{\\rm QCD}=0$ is selected, not derived, by matching to the sign content of the quark mass determinant, whose phase vanishes because the flavour rotors have real determinant. Hence $\\barθ=0$ at tree level, conditional on the gravi-weak identification, with a nonzero CKM phase. Loop stability is open: the two-loop $\\barθ$ of the minimal universal-seesaw parity model arises from scalar exchange, so the absence of a gauged $W_R$ here does not remove its mechanism, which the Higgs-bridge sector shares. We tag throughout what is derived, what is input, and what is open."},{"arxiv":"2611.04110","id":"3222553","title":"Holographic spin alignment of vector mesons in a spinning black-hole background","authors":"Fei Wang, Zi-qiang Zhang","score":6.2,"section":"replacement","rank":35,"parts":[0.06,0.09,0.11,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[636564]] (coupling 0.03, 2 shared references). Closest network paper: [[634308]] (coupling 0.04, 4 shared references).","abstract":"Holographic predictions for vector-meson spin alignment may depend on the background geometry and on the meson model. We examine the opposite polarization preferences observed for charmonium and light vector mesons by placing \\(J/ψ\\) and \\(φ\\) in one soft-wall model on the planar limit of a five-dimensional equal-spin Myers--Perry AdS black hole. Spectral functions and spin alignment are computed within the same current-correlator framework; the nonrotating results of Sheng et al. [Phys. Rev. D 110, 056047 (2024)] are recovered at \\(a=0\\). At \\(T=0.15~\\mathrm{GeV}\\), \\(J/ψ\\) retains a clear resonance peak, whereas \\(φ\\) shows no narrow peak and instead behaves as a broad distribution consistent with unstable \\(s\\bar{s}\\) pairs. For \\(J/ψ\\) along \\(z\\), rotation enhances the positive deviation of \\(ρ_{00}^{h}\\) from \\(1/3\\) at low and intermediate momenta but suppresses it at high momenta; along \\(x\\), the effect is small. For \\(φ\\), rotation enhances the negative deviation, more along \\(z\\) than along \\(x\\). The opposite helicity-frame signs and the opposing azimuthal and rapidity trends of the global alignment provide a reference for interpreting data: trends inconsistent with these would challenge the simplest single homogeneous rotating-medium interpretation. We distinguish model-dependent numerical details from qualitative features stable within this model class."},{"arxiv":"2611.23220","id":"3230739","title":"Complete Cosmological Collider Signatures from Right-handed Neutrino Loops","authors":"Linghao Song, Jingtao You, Ming Cheng, Hong-Jian He, Xingang Chen","score":5.9,"section":"new","rank":36,"parts":[0.0,0.11,0.14,0.0,0.04],"note":"Closest of your papers: [[3184726]] (coupling 0.04, 5 shared references). Closest network paper: [[2737356]] (coupling 0.05, 9 shared references).","abstract":"We study the complete cosmological collider (CC) signatures from right-handed neutrino loops with chemical-potential enhancement. These CC signals are induced by the inflaton-right-handed-neutrino interaction and can be extracted in the collinear squeezed configuration, which allows the right-handed-neutrino triangle loop to be factorized into the hard and soft parts. We precisely compute the soft part of the fermion loop for the first time by using the complete mode functions and the full loop integral, and treat the hard part as a tree-level subdiagram. We subtract the large-momentum asymptotic terms of the soft loop integrand and retain their finite contributions to the oscillation. We then evaluate the full spinor-helicity and Schwinger-Keldysh sums to obtain a finite, closed analytic formula for the complex clock coefficient. We further derive a compact formula for the leading CC signals in the large-chemical-potential expansion. We analyze the structure of the soft-part contribution by examining the sum of residues of the Mellin poles of the fermion propagators. For this, we demonstrate that the first local pole on each soft line contributes half of the asymptotic coefficient on one Schwinger-Keldysh path and the remaining local poles on the second soft line supply the other half."},{"arxiv":"2607.00079","id":"3176240","title":"QFT as a set of ODEs: higher dimensions","authors":"Fabiana De Cesare, Manuel Loparco","score":5.6,"section":"replacement","rank":37,"parts":[0.0,0.0,0.37,0.0,0.0],"note":"Closest network paper: [[2030477]] (coupling 0.13, 17 shared references).","abstract":"Correlation functions of local operators in Quantum Field Theory (QFT) in Anti-de Sitter space (AdS) are completely fixed by the QFT data: the set of scaling dimensions $Δ_i$ and OPE coefficients $C_{ijk}$ of the boundary operators, and the bulk-boundary (BOE) coefficients $b^{\\hatΦ}_i$ encoding how bulk fields decompose into boundary operators. In this work, we generalize the ordinary differential equations (ODEs) that govern the variation of the QFT data under a bulk relevant deformation, originally derived for AdS$_2$ \\cite{Loparco:2026fki}, to the cases of AdS$_3$ and AdS$_4$. We demonstrate that these flow equations natively capture the mechanism of merger-annihilation when a boundary operator hits marginality, as well as level repulsion when different $Δ_i$'s approach each other. Furthermore, we address the practical implementation of the framework: we propose substituting the ODE for the OPE coefficients with the crossing equation for greater efficiency, and we observe that Padé approximants dramatically improve the convergence of the sums over boundary operators, at least in free theories. Altogether, these advances lay the groundwork for the future application of the flow equations to the study of strongly coupled QFTs in AdS and their flat space limits."},{"arxiv":"2605.09000","id":"3154211","title":"Optimizing Yukawa couplings to suppress Dimension-five Proton Decay in $SU(5)$ GUT","authors":"Naoyuki Haba, Junpei Ikemoto, Yasuhiro Shimizu, Toshifumi Yamada","score":5.2,"section":"replacement","rank":38,"parts":[0.0,0.05,0.24,0.0,0.0],"note":"Closest of your papers: [[1394206]] (coupling 0.02, 1 shared references). Closest network paper: [[2053590]] (coupling 0.08, 10 shared references).","abstract":"The minimal supersymmetric $SU(5)$ grand unified theory (GUT) provides a highly compelling framework for physics beyond the Standard Model (SM). However, it suffers from a severe phenomenological challenge: rapid proton decay mediated by colored-Higgsino exchange via dimension-five operators. Resolving this issue often requires adjustments to the Yukawa couplings and the potential sectors, generating a vast and complex parameter space where traditional brute-force numerical scans are rendered computationally intractable due to the curse of dimensionality. In this paper, we overcome this limitation by applying machine learning optimization techniques. We investigate a supersymmetric $SU(5)$ model extended with $\\mathbf{45}$ and $\\overline{\\mathbf{45}}$ Higgs representations, defining a loss function based on the partial decay width of $p \\to K^+ \\barν$. Utilizing the Adam optimizer, we systematically explore the 33-dimensional parameter space to identify regions that suppress proton decay. Furthermore, we vary $\\tan β$ to thoroughly investigate whether the optimized proton lifetime can consistently exceed the stringent experimental lower bound of $5.9 \\times 10^{33}$ years established by the Super-Kamiokande collaboration."},{"arxiv":"2611.23082","id":"3230713","title":"Probing Lorentz-violating electrodynamics with CMB polarization. II. Updated constraints and forecasts for the Simons Observatory and LiteBIRD","authors":"Margherita Lembo, Luca Caloni, Martina Gerbino, Serena Giardiello, Giulia Gubitosi, Massimiliano Lattanzi, Luca Pagano, Nicolò Raffuzzi","score":4.9,"section":"cross","rank":39,"parts":[0.0,0.1,0.14,0.0,0.0],"note":"Closest of your papers: [[2627241]] (coupling 0.03, 6 shared references). Closest network paper: [[2895271]] (coupling 0.05, 7 shared references).","abstract":"We update the constraints on Lorentz-violating electrodynamics from the polarization of the cosmic microwave background (CMB). Within the minimal Standard Model Extension, we consider the renormalizable CPT-odd and CPT-even operators of the photon sector, which source cosmic birefringence and circular polarization, respectively. Combining Planck, Atacama Cosmology Telescope (ACT) and South Pole Telescope (SPT) temperature and $E$-mode data with $B$-mode measurements from BICEP/Keck, SPT-3G D1 and SPTpol, we constrain the CPT-odd coefficients to $|k^{(3)}_{(V)00}|<7.75\\times10^{-45}$ GeV and $|\\mathbf{k_{AF}}|<3.82\\times10^{-45}$ GeV at 95% credible level. These are the strongest bounds to date from any probe, and are driven by the SPT-3G D1 $B$-mode data. For the first time in this type of analysis, we also include the Planck PR4 $EB$ spectrum, which yields a mild preference for a non-zero $|k^{(3)}_{(V)00}|$. For the CPT-even coefficient, we find $k_{F,E+B}<5.99\\times10^{-32}$. Including the latest circular polarization measurements from the Cosmology Large Angular Scale Surveyor (CLASS) tightens this bound by about 7%. This is the first time that CMB circular polarization data contribute to constraining this coefficient. Finally, we forecast the sensitivity of the Simons Observatory (SO) and LiteBIRD. With linear polarization only, the two experiments are complementary, with SO tightening the CPT-even bound by about 30% and LiteBIRD the CPT-odd ones by 40 to 45%. Exploiting the sensitivity to circular polarization provided by the non-idealities of its half-wave plate, LiteBIRD could also improve the CPT-even bound by more than an order of magnitude."},{"arxiv":"2611.22719","id":"3230360","title":"Effects of QCD Equation of State on Cosmological Parameters and Stochastic Gravitational-Waves Spectrum","authors":"André V. Giannini, Victor P. Gonçalves, Samuel M. Sanches","score":4.6,"section":"cross","rank":40,"parts":[0.0,0.04,0.12,0.0,0.16],"note":"Closest of your papers: [[1755250]] (coupling 0.01, 1 shared references). Closest network paper: [[3191566]] (coupling 0.04, 3 shared references). Shared topics: early universe.","abstract":"We investigate the thermodynamic evolution of the early Universe across the QCD crossover and up to the electroweak (EW) scale, emphasizing the systematic impact of the QCD equation of state (EoS) and electroweak degrees of freedom on thermodynamic variables, cosmological parameters, and gravitational-wave observables. Using the HotQCD EoS as a baseline, we employ Gaussian Process (GP) regression to generate ensembles of 1000 thermodynamically consistent EoS samples, each extrapolated to high temperatures with and without EW contributions. For each ensemble, we solve the Friedmann equations to obtain the expansion history and compute gravitational-wave (GW) observables, including the instantaneous spectral tilt $n_{gw}(f)$ and the normalized GW energy density $Ω_{gw}(f)/Ω_{gw}^{\\rm rad}$. We find that including the EW sector is the dominant effect across all observables, outweighing differences among QCD baseline models that share the same lattice calibration. In particular, EW contributions drive the EoS toward the radiation-dominated limit earlier, reduce excursions of the speed of sound toward the causality bound, suppress transient fluctuations in the Hubble and kinematic parameters near $t \\sim 10^{-5}$ s, and qualitatively change the GW spectrum from a strongly frequency-dependent signal to a flat, suppressed plateau. These results demonstrate that accurate modeling of the electroweak sector is essential for an unbiased extraction of QCD-era physics from the stochastic gravitational-wave background."},{"arxiv":"2601.02887","id":"3097502","title":"Study of $CP$ violation in $Λ_b^0\\rightarrow N^*M$ decays with the final-state rescattering mechanism","authors":"Hui-Qiang Shang, Tian-Liang Feng, Jing Gao, Qin Qin, Fu-Sheng Yu","score":4.6,"section":"replacement","rank":41,"parts":[0.06,0.03,0.12,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1663960]] (coupling 0.01, 1 shared references). Closest network paper: [[2074575]] (coupling 0.04, 9 shared references).","abstract":"In this work, we investigate the charmless nonleptonic two-body $Λ_b$ decays within the framework of final-state rescattering mechanism. Using this framework, we evaluate the relevant hadronic triangle diagrams by performing the loop integrations, retaining both their absorptive and dispersive parts. Based on the established formalism, we analyze the $Λ_b \\to N^*(1535,1520)M$ decay processes with $M =K_S, K^*_0(700)$, $f_0(500,980), ρ(770), \\bar{K}^{*0}$, $φ$, and predict various physical observables, such as their branching ratios, direct and partial-wave $CP$ asymmetries, as well as decay asymmetry parameters. These two-body decay processes are expected to contribute primarily to the subsequent four-body decay channels, such as $Λ_b^0 \\to p\\,π^-\\,π^+\\,π^-$, whose $CP$ asymmetry measurements will be accessible at the LHCb experiment."},{"arxiv":"2611.16807","id":"3228196", certainties (energy resolution and flux normalization) and models environmental backgrounds from cosmic-ray muon spallation and $^{222}$Rn contamination. We adopt a shape-driven analysis strategy with a floating overall normalization, so that the discovery power relies on the spectral distortion rather than on the absolute event rate. In a realistic scenario with 90% spallation rejection efficiency, informed by the Super-Kamiokande experience and recent JUNO analyses, residual spallation backgrounds prevent either signal from reaching $5σ$ significance within 20 years of exposure. For the hep flux, we present a detailed sensitivity study to both its discovery and its precision, and quantify how the required spallation veto efficiency and recoil energy threshold jointly determine the achievable significance for both signals. At the adopted thresholds, discovery-level sensitivity for both signals requires approximately 99% spallation rejection over a 20-year exposure."},{"arxiv":"2611.21810","id":"3230223","title":"Probing scalar-mediated Lorentz violation with hydrogen masers and spin-precession of molecules","authors":"Djuna Croon, Tanmay Kumar Poddar","score":4.0,"section":"new","rank":43,"parts":[0.0,0.04,0.19,0.0,0.0],"note":"Closest of your papers: [[1692605]] (coupling 0.01, 1 shared references). Closest network paper: [[3164308]] (coupling 0.07, 3 shared references).","abstract":"We propose using hydrogen maser spectroscopy and molecular spin-precession experiments, traditionally employed in precision frequency measurements and searches for the electron electric dipole moment, as complementary probes of light scalar-mediated, spin-dependent fifth forces. We investigate their sensitivity to Lorentz-violating interactions mediated by scalars with masses ranging from $\\mathcal{O}(10^{-4}~μ\\mathrm{eV})$ to $\\mathcal{O}(10~\\mathrm{keV})$. While hydrogen maser spectroscopy and molecular spin-precession measurements probe different combinations of Lorentz-violating couplings, we find that the strongest projected sensitivities can be achieved using spin-precession of ultracold molecules, benefiting from their extended coherence times. These experimental approaches provide access to previously unexplored regions of parameter space, probing interaction ranges extending from centimeter to sub-angstrom scales. Our proposals highlight the potential of precision atomic and molecular experiments to search for new spin-dependent scalar-mediated interactions and violations of fundamental spacetime symmetries."},{"arxiv":"2508.18022","id":"2963617","title":"Precision Measurements of the Electroweak Mixing Angle in the Region of the Z pole at the Large Hadron Collider","authors":"Arie Bodek, Hyon-San Seo, Un-Ki Yang","score":3.9,"section":"replacement","rank":44,"parts":[0.06,0.02,0.08,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1421624]] (coupling 0.01, 1 shared references). Closest network paper: [[2864372]] (coupling 0.03, 3 shared references).","abstract":"In the Standard Model (SM), the effective leptonic weak mixing angle $\\sin^2θ^\\ell_{\\rm eff}$ can be predicted to very high accuracy by using the experimental values of the mass of the Z boson ($M_Z$), the Fermi constant, the fine structure constant, the mass of Higgs boson, the quark masses, and the value of the Quantum Chromodynamics (QCD) strong coupling ($α_s$) at $M_Z$. Therefore, deviations of measurements from SM predictions can be indications of new physics. With recent advances in experimental and analysis techniques, measurements of $\\sin^2θ^\\ell_{\\rm eff}$ at the Large Hadron Collider (LHC), extracted from the forward-backward asymmetry ($A_{\\rm FB}$) in Drell-Yan dilepton events, are now competitive with previously published measurements at $e^+e^-$ collider experiments. We report on a more precise extraction of the effective leptonic weak mixing angle via an updated analysis of the CMS Drell-Yan $A_{\\rm FB}$
