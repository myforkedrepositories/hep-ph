<script>
const RAW = {"n":[{"id":"3228759","arxiv":"2611.18337","title":"Gravitational production of dark QED by the trace anomaly","first":"Cléry","nauth":3,"year":2026,"cites":0,"role":"today","note":"Co-authors of yours: Cléry. Cites 8 network papers: [[3089042]], [[2726622]], [[2737356]], [[2164553]], [[2046345]], [[1998966]]…. Closest of your papers: [[2039411]] (coupling 0.10, 13 shared references). Closest network paper: [[1966379]] (coupling 0.16, 13 shared references). Shared topics: observed relic, relic abundance, fermionic dark matter, dark sector, dark matter.","score":63.8,"rank":1,"section":"new","parts":[0.99,0.29,0.46,0.5,0.84],"abstract":"We revisit the production of fermionic dark matter $χ$ through the graviton portal, sourced by inflaton annihilation at the end of inflation. Because the production rate is helicity-suppressed, $\\propto m_χ^2$, the dark fermion must be very heavy to account for the observed relic abundance, $m_χ\\gtrsim 10^{10}$ GeV, with the exact bound set by the reheating temperature $T_{\\rm RH}$. Here we examine how interactions within the dark sector could modify this result. As a toy model, we consider dark QED, in which $χ$ couples to a light dark photon. We first show that, as a consequence of classical conformal invariance, bremsstrahlung of a dark photon does not lift the helicity suppression for light fermions. We then show that the trace anomaly of dark QED, which affects the coupling of the graviton to dark photons, can produce light dark fermions via a Dalitz process. This allows to extend the fermionic dark mass range possibly down to $m_χ\\sim 10^7$~GeV, depending on $T_{\\rm RH}$ and the dark QED coupling. We also determine under which conditions the hidden sector reaches thermal equilibrium and derive a lower bound on the temperature ratio at reheating $(T'/T)_{\\rm RH}$ as function of the dark QED coupling and the reheating temperature.","authors":"Simon Cléry, Aliaksei Kachanovich, Michel HG Tytgat","nlinked":64,"nref":65,"src":"INSPIRE","html":true},{"id":"3184942","arxiv":"2607.28564","title":"Dark Matter Constraints from Small-Scale Cosmic Structure","first":"Nadler","nauth":3,"year":2026,"cites":0,"role":"repl","note":"Cites 2 network papers: [[2935629]], [[1803656]]. Closest of your papers: [[2964960]] (coupling 0.08, 28 shared references). Closest network paper: [[3214429]] (coupling 0.13, 103 shared references). Shared topics: dark matter model, dark matter.","score":39.7,"rank":2,"section":"replacement","parts":[0.7,0.23,0.36,0.0,0.29],"abstract":"Small-scale cosmic structure provides a powerful test of the fundamental nature of dark matter. A wide range of dark matter models impact matter clustering on small scales, including warm, fuzzy, and (self-)interacting dark matter. In these scenarios, dark matter physics such as free-streaming, wave interference, and self/Standard Model interactions alter the abundance and internal structure of dark matter halos. Cosmological and astrophysical probes of small-scale structure---including dwarf galaxies, strong lensing, the Lyman-$α$ forest, stellar streams, and high-redshift galaxies---are therefore sensitive to these effects. Here, we review dark matter constraints provided by small-scale structure, focusing on observables that probe scales smaller than $\\sim 1~\\mathrm{Mpc}$, which define the frontier of current measurements. We summarize how these constraints have been translated to limits on microphysical dark matter models, and we discuss key modeling uncertainties and observational systematics. Finally, we highlight the growing importance of probe combination and simulation-based inference for this field, and we overview upcoming observational facilities that will sharpen small-scale structure tests of dark matter physics.","authors":"Ethan O. Nadler, Keir K. Rogers, Alex Drlica-Wagner","nlinked":758,"nref":896,"src":"INSPIRE","html":true},{"id":"3228760","arxiv":"2611.18060","title":"Probing Dirac Heavy Neutral Leptons through EFT-Induced Meson Decays","first":"Gade","nauth":4,"year":2026,"cites":0,"role":"today","note":"Cites 2 network papers: [[3193100]], [[1678642]]. Also cites widely used network papers: [[1362180]]. Closest of your papers: [[3094526]] (coupling 0.02, 5 shared references). Closest network paper: [[3073459]] (coupling 0.21, 47 shared references).","score":35.9,"rank":3,"section":"new","parts":[0.72,0.06,0.61,0.0,0.0],"abstract":"We investigate dimension-six operators involving pairs of Dirac-type heavy neutral leptons (HNLs) at beam-dump and far-forward experiments. In the $ν$SMEFT framework, lepton-number-conserving four-fermion operators couple HNL pairs to quarks and induce two and three-body charm and bottom meson decays. We study the $c\\to u$, $b\\to d$, and $b\\to s$ transitions at FASER2, FACET, SHiP, and two FPF@FCC configurations. HNL production depends on the cut-off scale $Λ$, while the lifetime depends on the active-sterile mixing $|V_{eN}|^2$. Sizable production can therefore coexist with the small mixing needed for HNLs to reach distant detectors. We project sensitivities in the $(M_N,|V_{eN}|^2)$ and $(M_N,Λ)$ planes, accounting for two and three-body decays and constraints from invisible and semivisible meson decays. SHiP is particularly sensitive to $c\\to u$, while the larger FCC-LLP2 configuration probes $b\\to d, s$. We find that EFT-induced pair production extends long-lived HNL searches to very small mixing and complements other probes of the $ν$SMEFT heavy-neutrino sector.","authors":"Sai Gade, Sanjoy Mandal, Manimala Mitra, Sushant K. Raut","nlinked":131,"nref":140,"src":"INSPIRE","html":true},{"id":"3228689","arxiv":"2611.17604","title":"Resonant Trapping of Neutrinophilic Dark Matter in Supernovae","first":"Cappiello","nauth":3,"year":2026,"cites":0,"role":"today","note":"Cites 2 network papers: [[2926248]], [[3096515]]. Closest of your papers: [[1709434]] (coupling 0.01, 2 shared references). Closest network paper: [[2926248]] (coupling 0.15, 13 shared references). Shared topics: dark matter.","score":33.3,"rank":4,"section":"new","parts":[0.7,0.04,0.42,0.0,0.13],"abstract":"Supernova cooling provides some of the strongest constraints on light particles beyond the Standard Model, including sub-GeV dark matter (DM). While sufficiently large couplings to the Standard Model sector can trap these particles inside the supernova or cause them to decay before escaping, there typically exists an intermediate range of couplings in which their efficient production and subsequent escape lead to excessive energy loss, resulting in stringent constraints on new light particles. In this work, we demonstrate for the first time that, for certain types of DM-neutrino interactions, resonantly enhanced $s$-channel scattering with neutrinos can efficiently trap DM inside the supernova and can fundamentally alter the conventional supernova cooling constraints. In particular, we show that for mediator masses comparable to the supernova core temperature, this resonant scattering can prevent a substantial fraction of the produced DM from freely escaping, thereby significantly weakening, or even evading, the usual supernova cooling constraints on such models.","authors":"Christopher V. Cappiello, P. S. Bhupal Dev, Amol V. Patwardhan","nlinked":65,"nref":68,"src":"INSPIRE","html":true},{"id":"3228722","arxiv":"2611.17411","title":"HydróDex: gotta match 'em all!","first":"Barni","nauth":2,"year":2026,"cites":0,"role":"today","note":"Cites 2 network papers: [[2657746]], [[1863581]]. Closest of your papers: [[2787890]] (coupling 0.01, 1 shared references). Closest network paper: [[2957941]] (coupling 0.18, 24 shared references).","score":32.8,"rank":5,"section":"cross","parts":[0.7,0.02,0.52,0.0,0.0],"abstract":"We present a comprehensive hydrodynamic classification of stationary fluid profiles in first-order phase transitions within the constant-sound-speed model, a physically motivated extension of the standard bag model that allows the sound speeds in front of and behind the wall, $c_+$ and $c_-$, to differ. Solving the matching conditions at the bubble wall and evolving the profile in the surrounding plasma, we systematically identify and classify all the possible stationary solutions. The classification recovers all previously known direct and inverse detonation, deflagration, and hybrid solutions, while revealing a new class of stationary configurations, termed mixed hybrids, featuring rarefaction waves on both sides of the wall and oppositely directed fluid flows. For a sufficiently pronounced hierarchy $c_+ > c_-$, the classification in terms of the wall velocity $ξ_w$ and the asymptotic strength parameter $α_N$ further exhibits degenerate regions in parameter space, where multiple distinct stationary profiles correspond to the same physical inputs $(ξ_w,α_N)$. This non-uniqueness arises as the parametrization discards thermodynamic information and is resolved once the underlying microphysics is specified. We also compute the kinetic-energy budget and the associated acoustic gravitational-wave spectra within the sound-shell model, finding that mixed-hybrid solutions, despite their oppositely directed flows, introduce no additional spectral feature, and their spectra can be closely mimicked by ordinary direct or inverse hybrids with very different fluid profiles. Finally, we release HydróDex, a public code that implements the complete hydrodynamic classification, fluid-profile construction, kinetic-energy budget, and gravitational-wave calculation.","authors":"Giulio Barni, Eric Madge","nlinked":127,"nref":158,"src":"INSPIRE","html":true},{"id":"3228814","arxiv":"2611.17401","title":"Baryon and lepton asymmetries across the cosmic QCD transition: effects of a 3D first-order surface","first":"Formaggio","nauth":8,"year":2026,"cites":0,"role":"today","note":"Cites 2 network papers: [[2657746]], [[1863581]]. Closest of your papers: [[1824064]] (coupling 0.03, 4 shared references). Closest network paper: [[1892885]] (coupling 0.05, 6 shared references). Shared topics: primordial black hole.","score":32.6,"rank":6,"section":"new","parts":[0.7,0.08,0.15,0.0,0.35],"abstract":"We investigate the cosmological QCD phase transition by calculating the cosmic trajectories from the five equations that impose the conservation of the baryon and lepton asymmetries, the charge neutrality of the Universe, and $β$ equilibrium. We perform the calculation using for the first time the four-dimensional $(T, μ_B, μ_Q, μ_S)$ Constant Entropy Contour equation of state, which for $μ_S = 0$ ($β$-equilibrium) features a critical line and a first-order phase transition (FOPT) surface in the three-dimensional $(T, μ_B, μ_Q)$ space. We first show that, within the standard cosmological scenario with baryon asymmetry $b_{\\text{obs}}=8.65\\cdot 10^{-11}$, the lepton asymmetries alone can never induce a FOPT. We then explore the non-standard cosmological scenario with large values of $b$ and find that reaching a FOPT requires $b\\gtrsim0.028$ during the QCD epoch. Such a value is compatible with observations only if the baryon asymmetry is diluted to $b_{\\text{obs}}$ after the transition, which a period of little inflation would provide with $N\\approx6.5$ $e$-folds of expansion. Finally, we study the phenomenological imprints on the equation of state and primordial black hole (PBH) formation, showing that pion condensation at large lepton asymmetries drives $c_s^2 > 1/3$ and shifts the PBH peak to sub-solar masses ($0.3-0.8\\,M_\\odot$), while the large-$b$ FOPT yields a narrow spike around $4.2\\,M_\\odot$.","authors":"Lorenzo Formaggio, Francesco Di Clemente, Tristan Gyure, Hitansh Shah, Roman Poberezhniuk, Alessandro Drago, Volodymyr Vovchenko, Claudia Ratti","nlinked":70,"nref":79,"src":"INSPIRE","html":true},{"id":"3212886","arxiv":"2610.11346","title":"Photon evolution through light-particle conversion in stochastic magnetic fields: Kramers--Kronig relations and universality","first":"Chiba","nauth":3,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[2661930]]. Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1941263]] (coupling 0.05, 3 shared references). Closest network paper: [[2920754]] (coupling 0.11, 4 shared references).","score":25.9,"rank":7,"section":"replacement","parts":[0.48,0.14,0.32,0.0,0.0],"abstract":"We study photon conversion into light particles, such as dilatons, axions, and gravitons, induced by background magnetic fields, and formulate the resulting evolution in terms of the Stokes parameters. We show that photon conversion reduces to an effective non-unitary evolution of the photon sector. In the perturbative regime, the Hermitian and anti-Hermitian parts of the effective photon Hamiltonian are related through Kramers--Kronig relations, revealing that the changes in the Stokes parameters are not independent. We apply this general framework to photon evolution in Gaussian stochastic magnetic fields with possible helicity, and derive the ensemble-averaged evolution of the Stokes parameters. We find that two nonzero contributions arise even in the absence of magnetic helicity, which respectively correspond to the overall attenuation of all the Stokes parameters and to an irrelevant overall phase. We also find that magnetic helicity gives rise to two additional contributions, one of which changes the circular polarization while the other induces a rotation of linear polarization. These contributions form two Kramers--Kronig pairs. In particular, photon conversion induced by magnetic helicity is accompanied by both circular-polarization and birefringent responses. The same structure appears in dilaton-photon, axion-photon, and graviton-photon systems, revealing universality of photon conversion in magnetic fields.","authors":"Wataru Chiba, Ryusuke Jinno, Kimihiro Nomura","nlinked":21,"nref":22,"src":"INSPIRE","html":true},{"id":"2862329","arxiv":"2412.16282","title":"The Sound of Dark Sectors in Pulsar Timing Arrays","first":"Banik","nauth":4,"year":2026,"cites":0,"role":"repl","note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2787890]] (coupling 0.07, 9 shared references). Closest network paper: [[2928725]] (coupling 0.41, 63 shared references). Shared topics: dark sector, gravitational wave.","score":25.3,"rank":8,"section":"replacement","parts":[0.06,0.18,1,0.0,0.28],"abstract":"A phase transition in the dark sector (DS) presents a promising explanation for the stochastic gravitational wave (GW) signals detected in recent observations by Pulsar Timing Arrays (PTAs). Instead of focusing solely on fitting data with phenomenological parameters, we systematically delineate simple, underlying DS models at the microscopic, Lagrangian level and uncover the conditions required to yield the GW spectrum observed by PTAs. Within this framework, the characteristic scale of the dark sector is $O$(MeV), with complementary tests at future energy- and intensity-frontier experiments.","authors":"Amitayus Banik, Yanou Cui, Yu-Dai Tsai, Yuhsin Tsai","nlinked":118,"nref":128,"src":"INSPIRE","html":true},{"id":"3228807","arxiv":"2611.18019","title":"Metastable vortex string decay in a brane picture","first":"Chitose","nauth":3,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[2825297]]. Closest of your papers: [[2787890]] (coupling 0.03, 5 shared references). Closest network paper: [[2825297]] (coupling 0.10, 12 shared references).","score":22.7,"rank":9,"section":"new","parts":[0.45,0.08,0.3,0.0,0.0],"abstract":"We describe the decay of a metastable string as a bounce in a brane configuration. We consider a particular $\\mathcal N=1$ supersymmetric $\\mathrm{U}(2)$ gauge theory with cascade Higgsing $\\mathrm{U}(2)\\to \\mathrm{U}(1)^2 \\to \\mathrm{U}(1)$, where the vortex string can break by creating a pair of 't Hooft-Polyakov monopole and anti-monopole. The theory is engineered in a Type IIA brane setup, where the metastable string is realized as a D2-brane stretched between NS5- and D4-branes. The string breaks when the endpoints of the D2-brane, moving along the NS5- and D4-branes, meet so that the D2-brane shrinks to nothing. We check that the tension of the D2-brane reproduces that of the vortex string obtained numerically in the field theory, with the ratio approaching one in the limit where the vortex string becomes BPS. Within the thin-wall approximation, we derive the bounce action from the Dirac-Born-Infeld action of the D2-brane and find that it agrees with that of the field theory, with the monopole mass given by the area swept by the D2-brane. As a consistency check, we numerically construct a bounce solution of the D2-brane equation of motion under simplifying assumptions, whose action agrees with the thin-wall result in the regime where our description is reliable.","authors":"Akifumi Chitose, Hajime Fukuda, Kantaro Ohmori","nlinked":67,"nref":72,"src":"INSPIRE","html":true},{"id":"2903314","arxiv":"2503.17727","title":"The Large Hadron electron Collider as a bridge project for CERN","first":"Ahmadova","nauth":43,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[3193100]]. Also cites widely used network papers: [[1688995]], [[2817040]]. Closest of your papers: [[1832796]] (coupling 0.02, 3 shared references). Closest network paper: [[2617409]] (coupling 0.04, 7 shared references).","score":21.4,"rank":10,"section":"replacement","parts":[0.51,0.06,0.1,0.0,0.0],"abstract":"The LHeC is the project for delivering electron-nucleon collisions at CERN using the HL-LHC beams. An Energy Recovery Linac in racetrack configuration will provide 50 GeV electrons to achieve centre-of-mass energies around 1\\,TeV/nucleon and instantaneous luminosities around $10^{34}$\\,m$^{-2}$s$^{-1}$. The LHeC program elaborated in the CDR of 2021 included a phase with concurrent operation of electron-hadron and hadron-hadron collisions, followed by a standalone phase of electron-hadron collisions only. In view of the current HL-LHC schedule, in this paper we have examined the possibilities of a program after the regular HL-LHC program with only electron-proton operation. In this operation mode, the LHeC would serve as an impactful bridge project between major colliders at CERN. The standalone physics program comprises electroweak, Higgs, top-quark, BSM and strong-interaction physics. In addition, it empowers the physics analyses at the HL-LHC by retrofitting measurements and searches with significantly more precise knowledge of the proton structure and $α_s$. The accelerator technology deployed in the Energy Recovery Linac for the LHeC is a major stepping-stone for the performance, cost reduction and training for future colliders. The capital investments in the LHeC electron accelerator can be reused in a cost-efficient way as the injector for the FCC-ee. Finally, data from the LHeC are essential to enable the physics potential of any new high-energy hadron collider. The operational plan of 6 years easily fits in the period between two major colliders at CERN. Similar to the LHeC empowering the HL-LHC physics program, the FCC-eh would be an impactful addition to the FCC physics program.","authors":"F. Ahmadova, K. André, N. Armesto, G. Azuelos, O. Behnke, M. Boonekamp, M. Bonvini, D. Britzger, O. Brüning, T. A. Bud, A. M. Cooper-Sarkar, J. D'Hondt, M. D'Onofrio, O. Fischer, L. Forthomme, F. Giuli, C. Gwenlan, E. Hammou, B. Holzer, H. Khanpour, U. Klein, P. Kostka, T. Lappi, H. Mäntysaari, B. Mellado, P. R. Newman, F. I. Olness, J. A. Osborne, Y. Papaphilippou, H. Paukkunen, K. Piotrzkowski, A. Polini, J. Rojo, M. Schott, S. Schumann, C. Schwanenberger, A. M. Staśto, A. Stocchi, S. Tentori, M. Tevio, C. Wang, K. Wichmann, Y. Yamazaki","nlinked":135,"nref":163,"src":"INSPIRE","html":true},{"id":"3228750","arxiv":"2611.17922","title":"Improved Bounds on the Dark Matter-Neutrino Cross Section using LSBGs","first":"Suezaki","nauth":2,"year":2026,"cites":0,"role":"today","note":"Co-authors of yours: Horiuchi. Closest of your papers: [[1824064]] (coupling 0.07, 6 shared references). Closest network paper: [[3113487]] (coupling 0.10, 16 shared references). Shared topics: dark matter mass, dark matter, dark matter particle.","score":20.1,"rank":11,"section":"new","parts":[0.0,0.2,0.3,0.5,0.45],"abstract":"We derive new constraints on the interaction cross section between dark matter and neutrinos ($σ_{νχ}$) that improve upon existing limits. We adopt a mechanism where neutrinos emitted from core-collapse supernovae transfer their energy to the dark matter halo via elastic scattering, transitioning a centrally cusped profile to a flat-cored profile. We apply this mechanism to Low Surface Brightness Galaxies (LSBGs), which are characterized by their relatively large sizes, low stellar densities, and measurements of dark matter cores. We improve upon previous methods so that each dark matter particle is counted at most once, which weakens existing limits, e.g., from the Fornax dSph by a factor of $\\sim 50$. Applying our new method to LSBGs, we derive an upper limit of $σ_{νχ}< 8.5 \\times 10^{-25}\\,\\rm cm^2$ for a dark matter mass of $m_χ=1\\,\\rm GeV$ at a typical supernova neutrino energy of $E_ν=15\\,\\rm MeV$. This constraint is approximately three orders of magnitude stronger than the Fornax limit derived with the same method and slightly stronger than the bound from the dark matter diffused supernova neutrino background (DMDSNB).","authors":"Akari Suezaki, Shunsaku Horiuchi","nlinked":68,"nref":74,"src":"INSPIRE","html":true},{"id":"3198364","arxiv":"2609.00121","title":"Neutrino Electroweak Couplings and the Neutrino Fog at Belle II","first":"Lima","nauth":4,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[3193100]]. Closest of your papers: [[3130296]] (coupling 0.01, 2 shared references). Closest network paper: [[2736974]] (coupling 0.06, 17 shared references).","score":19.3,"rank":12,"section":"replacement","parts":[0.45,0.04,0.16,0.0,0.0],"abstract":"The mono-photon process $e^+e^- \\to γ+\\mathrm{invisible}$ at Belle II probes both invisible new states and the electroweak couplings of neutrinos. In this work, we study the process $e^+e^- \\to γν\\barν$, finding that Belle II with the full expected dataset can determine the neutrino-sensitive effective weak mixing angle to a 3.6$\\%$ relative statistical precision, competitive with existing neutrino probes at other energy scales. Polarized beams, as proposed for the Chiral Belle upgrade, separate the neutral- and charged-current contributions and provide independent access to each, giving a handle on the chiral structure of the neutrino gauge interactions. The same process is an irreducible background to dark boson searches, producing a neutrino fog once the luminosity exceeds 1 ab$^{-1}$.","authors":"Carlos Henrique de Lima, David McKeen, Afif Omar, Douglas Tuckler","nlinked":85,"nref":92,"src":"INSPIRE","html":true},{"id":"3228817","arxiv":"2611.17849","title":"LHC Based Antimuon-Nucleus Collider LH$μ$C: Nucleus Options","first":"Canbay","nauth":8,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Closest of your papers: [[3130296]] (coupling 0.01, 1 shared references). Closest network paper: [[2942039]] (coupling 0.05, 3 shared references).","score":18.8,"rank":13,"section":"cross","parts":[0.45,0.03,0.15,0.0,0.0],"abstract":"Nucleus options of the LH$μ$C, an antimuon-hadron collider based on the LHC, are presented. Ultra-cold $μ^+$ beams, based on the technology of the J-PARC muon $g-2$/EDM experiment as proposed for $μ$TRISTAN, are accelerated to 1 TeV in either a $μ$TRISTAN-type booster or a booster housed in the LH$e$C energy-recovery-linac tunnel, and collide with LHC nucleus beams in a 3 km main ring tangential to the LHC. Collisions with Pb, Xe, O and Ne beams provide centre-of-mass energies from 13.1 to 47.9 TeV, i.e. about 3.3 TeV per nucleon. Luminosities and beam-beam tune shifts are evaluated with the AloHEP software. For $μ$-Pb collisions, the luminosity reaches $2.7\\times10^{30}$ ($2.2\\times10^{30}$) cm$^{-2}$s$^{-1}$ with the $μ$TRISTAN-type (ERL-based) booster, i.e. $5.6\\times10^{32}$ ($4.5\\times10^{32}$) cm$^{-2}$s$^{-1}$ per nucleon, which a Brinkmann-Dohlus dynamic focusing scheme could increase by a factor of 2-3. The physics potential is discussed, including an extension of the kinematic reach by a factor of about 20 with respect to the LH$e$C, access to parton saturation at perturbative scales, nuclear parton distributions, photon-induced processes and charged-current flavour separation.","authors":"Ali Can Canbay, Burak Dagli, Arda Goroglu, Yigitali Karaca, Umit Kaya, Bora Ketenoglu, Saleh Sultansoy, Frank Zimmermann","nlinked":32,"nref":35,"src":"INSPIRE","html":true},{"id":"3228729","arxiv":"2611.18306","title":"Towards an improved understanding of $a_1$ and $a_2$ transition form factors","first":"Schäfer","nauth":1,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Closest of your papers: [[2690106]] (coupling 0.02, 1 shared references). Closest network paper: [[3132089]] (coupling 0.03, 3 shared references).","score":18.4,"rank":14,"section":"new","parts":[0.45,0.04,0.09,0.0,0.0],"abstract":"The isovector axial-vector and tensor meson states $a_1$ and $a_2$ have garnered interest in the last years since they appear as intermediate states in the hadronic light-by-light (HLbL) scattering contribution to $(g-2)_μ$. Their dynamical behaviour including their transition form factors is poorly understood to this day, which also affects the uncertainty budget of the HLbL contribution. In order to improve the situation, we construct the $a_1$ and $a_2$ as resonances in the $ρπ$ system, which allows us to express the relevant amplitudes in terms of known form factors and properties of the resonances. With this, we aim to obtain a phenomenologically well motivated parameterisation of the transition form factors built from the general principles of analyticity, unitarity, and crossing symmetry.","authors":"Hannah Schäfer","nlinked":30,"nref":32,"src":"INSPIRE","html":true},{"id":"3190356","arxiv":"2608.11620","title":"Constraints on ultralight bosons from merging binary and remnant black holes observed during the second and third parts of the fourth LIGO-Virgo-KAGRA observing run","first":"Collaboration","nauth":1811,"year":2026,"cites":0,"role":"repl","note":"Co-authors of yours: Romano, Xu. Closest of your papers: [[1941263]] (coupling 0.01, 2 shared references). Closest network paper: [[2669622]] (coupling 0.14, 20 shared references). Shared topics: gravitational wave.","score":18.2,"rank":15,"section":"replacement","parts":[0.0,0.04,0.41,1,0.1],"abstract":"We present constraints on ultralight bosons using binary black hole mergers observed in the second and third parts of the fourth LIGO-Virgo-KAGRA observing run. Directed searches are conducted for long-transient gravitational waves from ultralight vector boson clouds around merger remnants, using a hidden-Markov-model (HMM) tracking scheme. We target the remnant black holes formed in the binary coalescences that produced GW250114 and GW250207. We find no evidence for such signals from either target. Estimating our search sensitivity at a threshold corresponding to a 1% false alarm probability, we thus disfavor vector boson masses in the range of $[2.80, 3.95]\\times 10^{-13}$ eV with greater than 90% confidence. In addition, we derive constraints on ultralight scalar and vector bosons from the inferred high spins of the constituent black holes in three binaries, using events GW240515, GW241113, and GW241225_08. The excluded mass ranges in this approach depend on the assumed black-hole ages. At $10^5$ years, corresponding to typical dynamically formed binaries, we exclude scalar and vector bosons in the ranges $[1.39, 6.94]\\times 10^{-13}$ eV and $[0.32, 14.4]\\times 10^{-13}$ eV at 90% confidence, respectively.","authors":" The LIGO Scientific Collaboration,  the Virgo Collaboration,  the KAGRA Collaboration, A. G. Abac, A. Abe, I. Abouelfettouh, F. Acernese, K. Ackley, A. Adam, S. Adhicary, D. Adhikari, R. X. Adhikari, V. K. Adkins, S. Afroz, A. Agapito, D. Agarwal, M. Agathos, N. Aggarwal, S. Aggarwal, O. D. Aguiar, I. -L. Ahrend, L. Aiello, A. Ain, P. Ajith, T. Akutsu, L. Albers, W. Ali, S. Al-Kershi, C. Allene, A. Allocca, S. Al-Shammari, J. A. Alvarez, S. Alvarez-Lopez, W. Amar, O. Amarasinghe, A. Amato, F. Amicucci, C. Amra, A. B. Anand, C. Anand, A. Ananyeva, S. B. Anderson, W. G. Anderson, M. Andia, M. Ando, F. Andrade-Oliveira, M. Andrés-Carcasona, J. L. Andrey, T. Andrić, J. Anglin, J. Anna, J. M. Antelis, S. Antier, T. Aoki, M. Aoumi, E. Z. Appavuravther, E. A. Appelt, S. Appert, S. K. Apple, K. Arai, A. Araya, M. C. Araya, F. Arciprete, J. S. Areeda, N. Aritomi, F. Armato, S. Armstrong, N. Arnaud, M. Arogeti, S. M. Aronson, K. G. Arun, G. Ashton, Y. Aso, L. Asprea, M. Assiduo, S. Assis de Souza Melo, S. M. Aston, P. Astone, P. S. Aswathi, F. Attadio, F. Aubin, K. AultONeal, G. Avallone, N. Avdeev, E. A. Avila, S. Babak, C. Badger, S. Bae, S. Bagnasco, S. Baimukhametova, L. Baiotti, T. Baka, K. A. Baker, T. Baker, G. Balbi, G. Baldi, N. Baldicchi, M. Ball, G. Ballardin, M. Ballelli, S. W. Ballmer, S. Banagiri, B. Banerjee, D. Bankar, T. M. Baptiste, P. Baral, M. Baratti, J. C. Barayoga, K. Baric, B. C. Barish, D. Barker, N. Barman, F. Barone, B. Barr, M. Barrios, L. Barsotti, M. Barsuglia, D. Barta, M. A. Barton, I. Bartos, A. Basalaev, R. Bassiri, A. Basti, M. Bawaj, J. C. Bayley, A. C. Baylor, P. A. Baynard, M. Bazzan, V. M. Bedakihale, F. Beirnaert, M. Bejger, A. S. Bell, C. Bellani, D. S. Bellie, D. Beltran-Martinez, E. Benedetti, W. Benoit, I. Bentara, M. Ben Yaala, S. Bera, F. Bergamin, B. K. Berger, M. Beroiz, I. Berry, D. Bersanetti, T. Bertheas, A. Bertolini, J. Betzwieser, . E. Wade, M. Wade, K. J. Wagner, L. Wallace, R. -Z. Wan, H. Wang, P. Wang, W. H. Wang, Y. F. Wang, Z. Wang, R. L. Ward, J. Warner, M. Was, T. Washimi, N. Y. Washington, D. Watarai, B. Weaver, S. A. Webster, N. L. Weickhardt, M. Weinert, A. J. Weinstein, R. Weiss, L. Wen, K. Wette, C. Wheeler, J. T. Whelan, B. F. Whiting, E. G. Wickens, D. Wilken, B. M. Williams, D. Williams, M. J. Williams, N. S. Williams, J. L. Willis, B. Willke, M. Wils, L. Wimmer, C. W. Winborn, A. Wingfield, J. Winterflood, C. C. Wipf, G. Woan, N. E. Wolfe, H. T. Wong, I. C. F. Wong, T. Wouters, J. L. Wright, M. Wright, B. Wu, C. Wu, D. S. Wu, H. Wu, K. Wu, Z. Wu, E. Wuchner, D. M. Wysocki, V. A. Xu, Y. Xu, N. Yadav, H. Yamamoto, K. Yamamoto, T. S. Yamamoto, T. Yamamoto, R. Yamazaki, T. Yan, H. Yang, K. Z. Yang, Y. Yang, Z. Yarbrough, J. Yébana Carrilero, A. B. Yelikar, X. Yin, J. Yokoyama, T. Yokozawa, M. Yoshihara, S. Yuan, H. Yuzurihara, M. Zanatta, M. Zanolin, M. Zeeshan, T. Zelenova, J. -P. Zendri, M. Zeoli, M. Zerrad, M. Zevin, H. Zhang, J. Zhang, L. Zhang, N. Zhang, R. Zhang, T. Zhang, C. Zhao, J. Zhao, Yue Zhao, Yuhang Zhao, L. -M. Zheng, Y. Zheng, L. Zhizhong, H. Zhong, H. Zhou, H. O. Zhu, X. -J. Zhu, Z. -H. Zhu, Z. Zhu, D. Z. Zieba, A. B. Zimmerman, L. Zimmermann, M. E. Zucker","nlinked":110,"nref":127,"src":"INSPIRE","html":true},{"id":"3228839","arxiv":"2611.18224","title":"Light baryon masses from the modified Taylor coupling","first":"Miramontes","nauth":3,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Closest network paper: [[3227657]] (coupling 0.01, 1 shared references).","score":16.3,"rank":16,"section":"new","parts":[0.45,0.0,0.03,0.0,0.0],"abstract":"We present a calculation of the positive-parity baryon octet and decuplet spectra, using a non-perturbative interaction governed by the modified Taylor effective charge and complemented by explicit flavour-dependent contributions. The framework transitions seamlessly from the mesonic domain, where it was first established, to the baryonic sector, requiring no further parameter optimization. By solving the relativistic three-body Faddeev equation, we extract both the ground-state masses and amplitudes for the corresponding baryonic configurations. The resulting spectrum reproduces experimental data within a few percent. Additionally, we derive the evolution of the nucleon and $Δ$ masses as functions of the pion mass, contrast our findings directly against lattice-QCD benchmarks, and evaluate the propagation of the lattice uncertainties into the computed hadronic observables.","authors":"A. S. Miramontes, J. Papavassiliou, H. Sanchis-Alepuz","nlinked":82,"nref":84,"src":"INSPIRE","html":true},{"id":"3081352","arxiv":"2511.06049","title":"Phenomenology of the Minimal Scale Invariant Two-Higgs-Doublet Model","first":"Baouche","nauth":2,"year":2026,"cites":0,"role":"repl","note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1692605]] (coupling 0.01, 1 shared references). Closest network paper: [[1918535]] (coupling 0.09, 15 shared references). Shared topics: viable parameter space, singlet scalar.","score":12.6,"rank":17,"section":"replacement","parts":[0.06,0.04,0.25,0.0,0.54],"abstract":"We perform a comprehensive phenomenological analysis of the Scale Invariant Two-Higgs-Doublet Model (\\textit{SI2HDM}). In this minimal framework, electroweak symmetry breaking is triggered radiatively without the need for an additional real singlet scalar. After imposing stringent theoretical and experimental constraints, including electroweak precision tests and $B^0_d \\to μ^+μ^-$ flavor bounds, we identify a highly constrained viable parameter space that accommodates two distinct scenarios: the light-dilaton ($50~\\textrm{GeV} \\le m_η< m_h$) and purely radiative Higgs mass (PRHM, $m_η> m_h$) scenarios. Within this viable space, the charged Higgs mass is constrained to $140 \\le m_{H^\\pm} \\le 600~\\textrm{GeV}$ while the CP-odd scalar mass spans $400 \\le m_{A^0} \\le 600~\\textrm{GeV}$. This tight parameter space renders the model highly predictive: radiative corrections suppress the trilinear Higgs self-couplings, reducing the di-Higgs production cross section at the 13~TeV LHC by $55\\%-70\\%$ in the light-dilaton scenario and up to $60\\%$ in the PRHM scenario compared to the Standard Model prediction. These results highlight the predictive power and testability of the \\textit{SI2HDM} as a minimal framework for radiatively driven electroweak symmetry breaking.","authors":"Nabil Baouche, Amine Ahriche","nlinked":86,"nref":88,"src":"INSPIRE","html":true},{"id":"3184886","arxiv":"2607.28214","title":"Domain walls through different cosmologies","first":"Dankovsky","nauth":4,"year":2026,"cites":0,"role":"repl","note":"Closest of your papers: [[2787890]] (coupling 0.03, 5 shared references). Closest network paper: [[2828434]] (coupling 0.08, 9 shared references). Shared topics: gw background, early universe, gravitational wave.","score":11.0,"rank":18,"section":"replacement","parts":[0.0,0.1,0.22,0.0,0.46],"abstract":"We study properties of domain walls (DWs) arising in the model with a double well potential assuming different early universe cosmologies: from dust through stiff matter domination to the limit of effective Minkowski space. Using lattice simulations we demonstrate that evolution of DW networks exhibits an approximate universality with respect to the cosmological equation of state (EoS). Namely, the wall area inside a given large volume is mainly determined by the particle horizon, while details of cosmic expansion play a subdominant role. As it follows, particle horizon rather than the inverse Hubble rate is pivotal in DW evolution defining the network correlation length and hence its phenomenology, e.g., the characteristic wavelength of emitted gravitational waves (GWs). Formation of closed DWs is shown to be very sensitive to the cosmological EoS and hence violate the universality, but their contribution to the total network is too small to change the overall picture. The universality breaking is also observed in the spectral properties of GWs from annihilating (biased) DWs: i) the IR slope of the spectrum depends on the EoS parameter; ii) there is a plateau in the UV part of the spectrum, which gets more pronounced as one stiffens the EoS. However, the dependence on the EoS is rather weak in the near peak region, which is most relevant from the viewpoint of pulsar timing arrays and other searches for the stochastic GW background. For a selection of primordial cosmologies, we provide fitting formulae for the spectra near the peak.","authors":"I. Dankovsky, D. Gorbunov, S. Ramazanov, A. Vikman","nlinked":56,"nref":57,"src":"INSPIRE","html":true},{"id":"2944572","arxiv":"2507.07171","title":"Little Red Dots from Small-Scale Primordial Black Hole Clustering","first":"Zhang","nauth":3,"year":2026,"cites":0,"role":"repl","note":"Closest of your papers: [[2964960]] (coupling 0.02, 2 shared references). Closest network paper: [[3125346]] (coupling 0.08, 10 shared references). Shared topics: primordial black hole, early universe, gravitational wave.","score":10.4,"rank":19,"section":"replacement","parts":[0.0,0.07,0.23,0.0,0.49],"abstract":"The James Webb Space Telescope (JWST) observations have identified a class of compact galaxies at high redshifts ($4 \\lesssim z \\lesssim 8$), dubbed \"little red dots\" (LRDs). The supermassive black holes (SMBHs) of $10^{5-8}{\\rm\\,M}_{\\odot}$ in LRDs favor a heavy-seed origin. We propose a mechanism for their formation: Clusters of primordial black holes, formed through long-short mode coupling on small scales in the early Universe, undergo sequential mergers over extended timescales. This mechanism can evade cosmic microwave background distortions and result in heavy-seed SMBHs via runaway mergers. We employ Monte Carlo simulations to solve the Smoluchowski coagulation equation and determine the runaway merging timescale. The resulting stochastic gravitational wave background offers a distinctive signature of this process, and our model suggests highly spinning SMBHs at their formation if they inherit the spin residual of the cluster from tidal fields.","authors":"Borui Zhang, Wei-Xiang Feng, Haipeng An","nlinked":124,"nref":152,"src":"INSPIRE","html":true},{"id":"3228846","arxiv":"2611.17432","title":"Many-body Response to Spin-Independent and Spin-Dependent Dark Matter Scattering in a Superfluid Helium-3 Target","first":"Ting","nauth":28,"year":2026,"cites":0,"role":"today","note":"Closest of your papers: [[1764733]] (coupling 0.03, 3 shared references). Closest network paper: [[3095306]] (coupling 0.08, 3 shared references). Shared topics: dm mass, dark matter.","score":10.1,"rank":20,"section":"new","parts":[0.0,0.11,0.22,0.0,0.36],"abstract":"The QUEST-DMC experiment employs an ultra-low-temperature superfluid $^3$He target in an effort to detect sub-GeV dark matter (DM). The low-momentum scattering of such light DM is sensitive to the many-body structure of superfluid $^3$He, making it necessary to account for the collective behaviour of the medium. We present a first-principles calculation of the DM scattering rate in this inherently quantum many-body medium for both spin-independent and spin-dependent interactions. The leading consequence of this many-body behaviour is a kinematic enhancement of the scattering rate arising from the Fermi-Dirac statistics of the ultra-low-temperature target. Accounting for this extends the projected reach to lower DM masses for both spin-independent and spin-dependent interactions under the benchmark detector assumptions considered here. The resulting sensitivity improvement becomes increasingly pronounced as the detector threshold drops into the sub-eV regime. It is negligible at the conventional readout threshold of approximately $31$ eV, but becomes significant at the $0.51$ eV benchmark threshold for SQUID-based readout. Specifically, at this threshold, incorporating the many-body response extends the higher-energy recoil tail and improves the projected low-mass reach by approximately $2.5\\%$ relative to the single-atom approximation. This improvement becomes more pronounced at lower thresholds. Reaching a threshold of $5$ meV could further extend the sensitivity of QUEST-DMC into the realm of sub-MeV DM.","authors":"A. Ting, N. Darvishi, S. Autti, L. Bloomfield, A. Casey, N. Eng, P. Franchini, R. P. Haley, P. J. Heikkinen, A. Jennings, A. Kemp, E. Leason, J. March-Russell, J. Monroe, D. Münstermann, M. T. Noble, J. R. Prance, X. Rojas, T. Salmon, J. Saunders, J. Smirnov, R. Smith, M. D. Thompson, A. Thomson, V. Tsepelin, S. M. West, L. Whitehead, D. E. Zmeev","nlinked":28,"nref":32,"src":"INSPIRE","html":true},{"id":"3215016","arxiv":"2610.18974","title":"Exothermic dark-photon dark matter and the LZ high-recoil event: finite-reheating constraints","first":"Deka","nauth":1,"year":2026,"cites":4,"role":"other","note":"","score":null},{"id":"2828434","arxiv":"2409.08828","title":"Thermal leptogenesis, dark matter, and gravitational waves from an extended canonical seesaw scenario","first":"Paul","nauth":3,"year":2024,"cites":20,"role":"other","note":"","score":null},{"id":"3193100","arxiv":"","title":"Review of Particle Physics","first":"Takahashi","nauth":259,"year":2026,"cites":493,"role":"other","note":"","score":null},{"id":"3113487","arxiv":"2601.23264","title":"MARVELously Dark: the density profile evolution of dwarf halos in velocity-dependent SIDM","first":"Engelhardt","nauth":9,"year":2026,"cites":9,"role":"other","note":"","score":null},{"id":"1362180","arxiv":"1504.04855","title":"A facility to Search for Hidden Particles at the CERN SPS: the SHiP physics case","first":"Alekhin","nauth":85,"year":2015,"cites":1035,"role":"other","note":"","score":null},{"id":"2862278","arxiv":"2412.17141","title":"Prospecting bipartite dark matter through gravitational waves","first":"Borah", itivity of future NINJA-like experiment at J-PARC to eV-scale sterile neutrinos within the 3+1 framework. We perform a phenomenological feasibility study using the $ν_μ\\rightarrow ν_e$ appearance, $ν_μ\\rightarrow ν_μ$ and $ν_e \\rightarrow ν_e$ disappearance channels, focusing on possible future configurations of the detector located at different floors of the NM building (B2, SS, and GROUND), corresponding to different off-axis angles. Our analysis is based on a simplified and effective detector response, in which events are classified into electron-like and muon-like topologies and constant benchmark selection efficiencies are applied. We explore different exposure scenarios and assess the impact of analysis choices such as upper energy cuts. We include systematic uncertainties corresponding to normalization for signal and background rates and study the robustness of our results with respect to variations in the assumed energy resolution, and vary efficiencies for key backgrounds such as muon misidentification from charge current and neutral current interactions. Finally, we examine the effects of combining data from multiple detector locations. We find that the SS floor provides the strongest constraints on the active-sterile mixing parameters, while the B2 and GROUND configurations offer constraints comparable to the current bounds for probed mass-squared differences. Our results indicate that a NINJA-like detector, optimized for sufficient statistics and benchmark identification performance, has the potential to provide competitive constraints on light sterile neutrino scenarios in its future runs."},{"arxiv":"2611.17408","id":"3228660","title":"Positivity Bounds, Negative Running, and the Weak Gravity Conjecture","authors":"Jaime Fernandez","score":7.5,"section":"new","rank":22,"parts":[0.0,0.0,0.37,0.0,0.2],"note":"Closest network paper: [[3092194]] (coupling 0.13, 13 shared references). Shared topics: yukawa interaction.","abstract":"We study causality and unitarity constraints at one loop on a low-energy effective theory containing a photon, a massless scalar coupled to it through dilaton-like interactions, and a light neutral Dirac fermion with a Yukawa coupling to the scalar. In this setup, non-gravitational loop effects induced by the Yukawa interaction can drive the coefficient of the four-photon $(F_{μν}F^{μν})^2$ operator negative at low energies, apparently violating the tree-level positivity bound. Nevertheless, we find that these negative values are consistent with one-loop constraints from causality and unitarity, thanks to the low-energy contribution from the massless scalar to the relevant dispersion relation. We also examine the implications of this negative running for the Weak Gravity Conjecture in the magnetic limit of Einstein--Maxwell--dilaton black holes, since the RG-evolved Wilson coefficients can a priori shift the extremality condition towards the subextremal region. We find, however, that this shift is obstructed by the fermion mass induced by the same Yukawa coupling, which prevents the fermion from contributing to the running of the relevant operators down to the low-energy scales required to make the black holes subextremal. Finally, we discuss the relevance of negative running to loop-level positivity bounds in the SMEFT and to light-by-light scattering in the presence of a light scalar."},{"arxiv":"2611.17422","id":"3228697","title":"The Full-Shape Analysis of the Fading Dark Sector Model","authors":"Georges Obied, Cumrun Vafa, David H. Wu","score":7.3,"section":"cross","rank":23,"parts":[0.0,0.0,0.19,0.0,0.45],"note":"Closest network paper: [[3223723]] (coupling 0.07, 14 shared references). Shared topics: dark matter density, dark sector, dark matter.","abstract":"We analyze the Fading Dark Sector (FDS) model, which is motivated by string theory and in which the fading of the dark sector is driven by a scalar field. The model is specified by two $O(1)$ numbers $(c,c')$ that parametrize the logarithmic derivatives of the dark energy and dark matter densities with respect to the field in Planck units. In previous work, we showed that this model provides a good fit to the DESI BAO, CMB, and SN datasets. Here, we extend that analysis to include the DESI DR1 full-shape galaxy power spectrum, which adds information about the time evolution of cosmic structure and provides an independent consistency check of the FDS model. We find that, when the DESI DR1 full-shape data are combined with CMB+DESI DR2 BAO+DES-Dovekie, the FDS model outperforms the Chevallier-Polarski-Linder (CPL) $w_0$-$w_a$ parameterization by $Δχ^2_{\\rm MAP}=-4$ at equal parameter count and is preferred over $Λ$CDM at $4.1σ$. The inferred values of $(c,c')$ with the full-shape data are unchanged from our previous analysis, so this improvement indicates that FDS makes a prediction for the growth of structure that captures the observed growth history better than the $w_0$-$w_a$ parameterization."},{"arxiv":"2512.04954","id":"3089299","title":"Amortized Inference of Multi-Modal Posteriors using Likelihood-Weighted Normalizing Flows","authors":"Rajneil Baruah","score":6.3,"section":"replacement","rank":24,"parts":[0.06,0.06,0.16,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[3094526]] (coupling 0.02, 2 shared references). Closest network paper: [[3090323]] (coupling 0.06, 2 shared references).","abstract":"We present a technique for posterior estimation using Normalizing Flows trained with likelihood-weighted importance sampling, the special case of neural importance sampling in which the proposal is the prior. This approach allows for the efficient inference of theoretical parameters in high-dimensional inverse problems without the need for posterior training samples. We implement the method on multi-modal benchmark tasks in 2D and 3D to check for the efficacy. A critical observation of our study is the impact of the base distribution on the hree dimensional light cone structure."},{"arxiv":"2509.13488","id":"2970547","title":"Nonlinear evolution of the spin-2 black hole superradiant instability","authors":"Taillte May, William E. East","score":6.2,"section":"replacement","rank":26,"parts":[0.0,0.02,0.37,0.0,0.0],"note":"Closest of your papers: [[1709434]] (coupling 0.01, 1 shared references). Closest network paper: [[2669622]] (coupling 0.13, 14 shared references).","abstract":"Massive spin-2 fields, which arise in proposed extensions of the standard model of particle physics and general relativity, give rise to a superradiant instability around spinning black holes. We study the nonlinear evolution of this instability in quadratic gravity, where quadratic curvature terms are added to the Einstein-Hilbert action. In this theory, we find that as the massive spin-2 field grows, the black hole's spin increases, accelerating the growth rate, and eventually leading to a superextremal horizon. This sharply contrasts with the spin-down and eventual saturation that occurs due to the backreaction of the superradiant instability of a minimally coupled massive spin-0 or spin-1 field."},{"arxiv":"2604.18685","id":"3147498","title":"Extremely high-energy bremsstrahlung in matter","authors":"Peter Arnold, Joshua Bautista, Omar Elgedawy, Shahin Iqbal","score":6.1,"section":"replacement","rank":27,"parts":[0.06,0.03,0.22,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[3184726]] (coupling 0.01, 1 shared references). Closest network paper: [[2164775]] (coupling 0.08, 3 shared references).","abstract":"The theory of bremsstrahlung $e \\to eγ$ by extremely high energy electrons passing through ordinary matter has been qualitatively incomplete. We revisit the suppression of bremsstrahlung by the Landau-Pomeranchuk-Migdal (LPM) effect, here accounting for quantum disruption of that effect from pair production. Our analysis covers the full range of ultra-relativistic electron and photon energies (subject to a few simplifying approximations)."},{"arxiv":"2611.17344","id":"3228650","title":"Rank-One Ultralight Dark Matter Response in a Full-Tensor Gravity Gradiometer","authors":"John J. Oh, Ho Jung Paik","score":5.9,"section":"cross","rank":28,"parts":[0.0,0.03,0.24,0.0,0.13],"note":"Closest of your papers: [[3130296]] (coupling 0.01, 1 shared references). Closest network paper: [[2051205]] (coupling 0.08, 4 shared references). Shared topics: dark matter.","abstract":"A full-tensor superconducting gravity gradiometer whose four test masses carry two compositions in a $2+2$ pattern acquires a composition-dependent channel for dilaton-coupled ultralight dark matter. The reconstructed response is the rank-one tensor $\\K=\\gv_φ(t)\\otimes\\qv$, with the axis of $\\qv$ fixed in advance by the material assignment, and obeys the parameter-free null condition $\\K(\\mathbf{I}-\\Pq)=0$, which no gravity gradient or platform rotation alone can satisfy; it vanishes for a single composition. For copper and lead, the sensitivity reaches $d_{\\hat m}-d_g\\simeq3.4\\times10^{-8}$, and $4.9\\times10^{-10}$ with upgraded accelerometers."},{"arxiv":"2611.17345","id":"3228654","title":"Composition-dependent ultralight dark matter detection with a tetrahedral superconducting gravity gradiometer","authors":"John J. Oh, Ho Jung Paik","score":5.8,"section":"cross","rank":29,"parts":[0.0,0.03,0.24,0.0,0.13],"note":"Closest of your papers: [[3130296]] (coupling 0.01, 1 shared references). Closest network paper: [[2051205]] (coupling 0.08, 4 shared references). Shared topics: dark matter.","abstract":"Tetrahedral superconducting gravity gradiometers designed as full-tensor gravitational-wave detectors, such as the ground-based mSOGRO design and the proposed lunar LANGO observatory, reconstruct the acceleration-gradient tensor from four test masses. We show that giving the four test masses two compositions in a $2+2$ arrangement adds a composition-dependent ultralight dark matter (ULDM) channel to that same tensor readout, with no separate dark-matter sensor and no dark-matter-specific readout. A coherently oscillating scalar accelerates each mass in proportion to its dilaton charge, and the tensor reconstruction leaves the charges only in a mean, rejected with the common mode, and a single vector $\\qv$ proportional to the charge contrast $Δ\\abaralpha_{AB}$ between the two materials. The response is the rank-one tensor $\\K_{\\ULDM}(t)=\\gv_φ(t)\\otimes\\qv$, whose amplitude is set by the halo, independent of $m_φ$. The axis of $\\qv$ is fixed in advance by the material assignment, so the response obeys the null condition $\\K_{\\ULDM}(\\mathbf{I}-\\Pq)=0$ at every instant, for any $\\gv_φ$ including a virialized field with a stochastic gradient---an exact tensor discriminator against gravitational-wave signals; for a single composition $\\qv=0$. With the gravitational-wave noise model, the coupling sensitivity for copper and lead test masses reaches $d_{\\hat m}-d_g\\simeq3.4\\times10^{-8}$ for the baseline instrument and $4.9\\times10^{-10}$ with upgraded accelerometers. The rank-one factorization and the null condition are summarized in a companion Letter; the present paper gives the derivations and the detector-level analysis."},{"arxiv":"2611.17402","id":"3228655","title":"Microscopic Realizability of Non-unique Bubble Hydrodynamics","authors":"Giulio Barni, Eric Madge","score":5.4,"section":"new","rank":30,"parts":[0.0,0.0,0.36,0.0,0.0],"note":"Closest network paper: [[3128752]] (coupling 0.13, 15 shared references).","abstract":"First-order phase transitions drive fluid motion that induces energy transport and gravitational-wave production. The flows are usually classified in terms of the wall velocity and the transition strength. We show that this description fails when the two phases have unequal sound speeds $c_\\pm$. New mixed-hybrid profiles may appear, and for a strong hierarchy, $c_+\\gg c_-$, where the phase behind the wall is much softer, heating or cooling ahead of the wall allow for the coexistence of distinct stationary flows at the same wall velocity and transition strength. This ambiguity is removed once thermodynamic normalization and entropy production are specified. We identify microscopic settings that realize these sound-speed hierarchies. In thermal plasmas it requires exponentially large mass-to-temperature ratios, whereas at finite density a conserved charge removes this obstruction, making dense matter its natural arena."},{"arxiv":"2609.16753","id":"3203931","title":"Probing local charm-baryon formation with hadron-anchored energy correlators","authors":"Robert Vertesi","score":5.3,"section":"replacement","rank":31,"parts":[0.06,0.07,0.09,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1455793]] (coupling 0.02, 2 shared references). Closest network paper: [[2621240]] (coupling 0.03, 3 shared references).","abstract":"We introduce the hadron-anchored energy correlator (HAEC), a jet-restricted realization of the fragmentation and semi-inclusive energy correlators, which measures the angular distribution of jet energy around a given hadron to access the local environment in which it is formed. We study the HAEC of $\\mathrm{D}^{0}$- and $Λ_{\\mathrm{c}}^{+}$-tagged jets in pp collisions at $\\sqrt{s}=13$ TeV with PYTHIA 8, comparing hadronization without junctions to two color-reconnection scenarios with junction formation. The small-angle region of the correlator is dominated by strong-decay feed-down: the soft pion of $\\mathrm{D}^{*+}\\to\\mathrm{D}^{0}π^{+}$ produces a kinematic edge at $θ\\,\\langle p_{\\mathrm{T}}^{\\mathrm{jet}}\\rangle = (0.65~\\mathrm{GeV}/c)/\\langle z_{h}\\rangle$, identical in all scenarios, which standard $\\mathrm{D}^{*+}$ reconstruction removes. The feed-down-cleaned correlator shows that at low momentum fraction $z_{h}$ the energy around a $Λ_{\\mathrm{c}}^{+}$ is spread to larger cated simultaneous $m_b$ and $q_T$ factorization. It involves new next-to-leading-power $m_b$ and $q_T$ dependent beam and soft functions, and the corresponding bare factorization theorem suffers - as expected - from endpoint divergences. We use soft-collinear effective theory to explicitly compute all amplitudes with a $b$-quark loop and an additional real soft or collinear emission. Our results provide important insight into the nontrivial structure of the endpoint divergences and show how their expected cancellation happens in the sum of all amplitudes separately for soft and collinear emissions. Interestingly, we find that at this order the endpoint-divergent contributions have a separable dependence on $q_T$ and $m_b$, providing strong motivation that in the future their cancellations can be made manifest in the factorized cross section. As an important further cross check we show that the sum of all SCET amplitudes correctly reproduces the full-QCD one-emission amplitudes expanded in the relevant soft or collinear limit, which also requires nontrivial contributions involving massive Glauber quarks in the effective-theory calculation."},{"arxiv":"2603.05857","id":"3127320","title":"Two Higgs Doublet Model from Six-Dimensional Gauge Theory","authors":"Kento Akamatsu, Takuya Hirose, Nobuhito Maru, Akio Nago","score":4.6,"section":"replacement","rank":33,"parts":[0.0,0.03,0.12,0.0,0.2],"note":"Closest of your papers: [[1402978]] (coupling 0.01, 1 shared references). Closest network paper: [[2134261]] (coupling 0.04, 3 shared references). Shared topics: yukawa interaction.","abstract":"We investigate a two-Higgs-doublet model (2HDM) based on a six-dimensional $SU(4)$ gauge theory compactified on $T^2/Z_2$. The six-dimensional gauge symmetry ensures that the tree-level Higgs potential is CP conserving and $Z_2$ symmetric, while the Yukawa interactions of bulk fermions are naturally aligned, suppressing tree-level flavor-changing neutral currents. The $SU(4)$ charge embedding accommodates the quark electric charges, while the group-theoretical enhancement of the Yukawa coupling in the sixth-rank totally symmetric representation leads to the tree level relation $m_t\\simeq 2m_W$. We show that electroweak symmetry breaking can be realized and the observed SM Higgs boson mass can be reproduced through appropriate choices of the brane-localized gauge kinetic term coefficient and the bulk matter content. We also obtain predictions for the masses of the additional Higgs bosons. Furthermore, we show that the torus geometry affects both the Higgs mass spectrum and the couplings of the CP-even Higgs bosons to electroweak gauge bosons. Finally, we identify parameter regions in which the additional Higgs mass spectra are consistent with the ATLAS and CMS measurements of the W-boson mass within the approximation based on the scalar-sector contribution to $Δρ$."},{"arxiv":"2611.18136","id":"3228720","title":"Quantum tomography of Higgsstrahlung: Higgs boson self-coupling and $Z$ boson anomalous couplings","authors":"Clelia Altomonte, Marco Fabbrichesi, Niko Koivunen, Luca Marzola, Daniele Rizzo","score":4.0,"section":"new","rank":34,"parts":[0.0,0.06,0.15,0.0,0.0],"note":"Closest of your papers: [[2751074]] (coupling 0.02, 2 shared references). Closest network paper: [[2940264]] (coupling 0.05, 5 shared references).","abstract":"The Higgs boson self-coupling enters the Higgsstrahlung process $e^+e^-\\to ZH$ at one loop. The three diagrams that carry it project onto two Lorentz structures: the tree-level one, which rescales the rate, and that of the CP-even anomalous coupling $b_Z$, which changes the polarization of the final-state $Z$ boson. To assess how well quantum state tomography constrains the $hZZ$ anomalous couplings and the trilinear coupling at FCC-ee, we compute the helicity density matrix of the $Z$ boson, for an effective vertex that also includes a CP-odd anomalous coupling $\\tilde b_Z$, together with its complete one-loop correction in the Standard Model. With these corrections and no other new physics in the effective vertex, quantum state tomography determines $κ_λ$ to $\\pm 3.9$, or $\\pm 2.9$ with the full angular information, independently of the rate and of the normalization of the vertex, and not far from the limit $δκ_λ\\simeq 1$ set by the quantum Fisher information. Without assumptions on the new physics, quantum tomography directly bounds the anomalous couplings at the $10^{-3}$ level, improving on the existing projections. The density matrix also characterizes the $Z$ boson as a qutrit. At $365$ GeV its state in the central region is pure enough to violate the Klyachko--Can--Binicioğlu--Shumovsky contextuality inequality, $\\mathbb{CNTXT}_5 = 2.06$ at $θ= π/2$ against the non-contextual bound $2$. We also quantify the purity and the amount of magic of the $Z$ boson state, using the mana, the stabilizer Rényi entropy and the robustness of magic for the latter. At fixed angle, purity, contextuality and magic are robust against anomalous couplings of the size probed by the tomography. The inclusive state, instead, is neither contextual in this test nor magic in the helicity basis."},{"arxiv":"2401.15542","id":"2752479","title":"Exploring Optimal Transport for Event-Level Anomaly Detection at the Large Hadron Collider","authors":"Nathaniel Craig, Jessica N. Howard, Hancheng Li","score":3.8,"section":"replacement","rank":35,"parts":[0.0,0.08,0.1,0.0,0.0],"note":"Closest of your papers: [[1455793]] (coupling 0.03, 3 shared references). Closest network paper: [[2016443]] (coupling 0.03, 4 shared references).","abstract":"Anomaly detection is a promising, model-agnostic strategy to find physics beyond the Standard Model. State-of-the-art machine learning methods offer impressive performance on anomaly detection tasks, but interpretability, resource, and memory concerns motivate considering a wide range of alternatives. We explore using the 2-Wasserstein distance from optimal transport theory, both as an anomaly score and as the input to interpretable machine learning methods, for event-level anomaly detection at the Large Hadron Collider. The choice of ground space plays a key role in optimizing performance. We comment on the feasibility of implementing these methods in the L1 trigger system."},{"arxiv":"2611.17945","id":"3228815","title":"$B \\to D$ form factors from light-cone sum rules","authors":"Yang Qu, Jin-Peng Jiang, Yue-Long Shen","score":3.4,"section":"new","rank":36,"parts":[0.06,0.02,0.06,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2964960]] (coupling 0.01, 1 shared references). Closest network paper: [[3193100]] (coupling 0.02, 20 shared references).","abstract":"We present a light-cone sum rule (LCSR) analysis of the $B\\to D$ transition form factors $f_+^{BD}(q^2)$ and $f_0^{BD}(q^2)$ in the large-recoil region, including the next-to-leading-power corrections at tree level. The non-perturbative input is provided by the leading-twist $D$-meson distribution amplitude determined from lattice QCD in the heavy-quark large-momentum effective theory (HQLaMET) framework, which enters together with the twist-three and twist-four distribution amplitudes of the $D$ meson fixed by the QCD equations of motion. A combined fit to the LCSR results at $q^2\\lesssim2$~GeV$^2$ and to the FNAL/MILC and HPQCD lattice data at $q^2\\gtrsim8.5$~GeV$^2$, performed in the model-independent Boyd-Grinstein-Lebed (BGL) parametrisation, allows us to obtain the form factors over the whole physical range and to extract $|V_{cb}|$ from the semileptonic $B\\to D\\ellν$ decay as well as the lepton-flavour universality ratio $R(D)$."},{"arxiv":"2507.13734","id":"2950780","title":"Form factors and phenomenology of $\\boldsymbol{B_{(s)}}$ and $\\boldsymbol{D_{(s)}}$ semileptonic decays to $\\boldsymbolη$ and $\\boldsymbol{η^\\prime}$","authors":"Blaženka Melić, Méril Reboud","score":3.3,"section":"replacement","rank":37,"parts":[0.06,0.01,0.06,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[3184726]] (coupling 0.00, 1 shared references). Closest network paper: [[3193100]] (coupling 0.02, 23 shared references).","abstract":"Motivated by more precise recent measurements of the $B \\to η\\ell ν$ and $D_{(s)} \\to η^{(\\prime)}\\ell ν$ decays, we employ state-of-the-art parametrizations to describe the $B_{(s)}, D_{(s)} \\to η^{(\\prime)}$ form factors across the full $q^2$ range, fitting them to the latest light-cone sum rule results. Using these results, we compute the branching ratios for all relevant decays and compare them with experimental data, finding good agreement. Additionally, we examine the validity and precision of the extracted $η$-$η'$ mixing angle in the context of heavy meson decays. By combining our predictions for the $B, D, D_s \\to η^{(\\prime)}$ form factors with recent semileptonic decay measurements, we extract the CKM elements $|V_{ub}|$, $V_{cs}$, and $V_{cd}$. We also provide tests of the lepton flavour universality in the $B, D, D_s \\to η^{(\\prime)} \\ell ν$ decays and present results for the forward-backwards asymmetries in these decays. Our findings indicate that the extracted values are becoming comparable in precision to those obtained from more conventional semileptonic decay analyses."},{"arxiv":"2611.18202","id":"3228788","title":"Next-to-Next-to-Next-to-Leading-Order Prediction for the Radiative $B_{u}^- \\to γ\\ell^{-} \\bar ν_{\\ell}$ Decay","authors":"Yong-Kang Huang, Yao Ji, Bo-Xuan Shi, Xing Wang, Yu-Ming Wang, Yu-Xiang Wei","score":3.1,"section":"new","rank":38,"parts":[0.0,0.0,0.07,0.0,0.21],"note":"Closest network paper: [[3170413]] (coupling 0.02, 2 shared references). Shared topics: turn out.","abstract":"We accomplish for the first time the three-loop computation of the photonic radiative jet function in soft-collinear effective theory, which constitutes the last missing and most difficult ingredient for the complete next-to-next-to-next-to-leading-order QCD prediction of the simplest radiative $B_{u}^- \\to γ\\ell^{-} \\bar ν_{\\ell}$ decay with an energetic photon at leading power. Importantly, the most prominent three-loop contribution to the radiative bottom-meson decay form factors turns out to arise from the newly determined QCD correction to the jet function rather than from the recently obtained hard correction. We further demonstrate explicitly that our full three-loop calculation of these non-hadronic radiative $B$-meson decay form factors appear to be highly beneficial for an improved extraction of the fundamental shape parameter $λ_B$ of the leading-twist $B$-meson light-cone distribution amplitude."},{"arxiv":"2611.17467","id":"3228677","title":"Geometric Bounds on Axion-Photon Couplings in Non-Supersymmetric Heterotic Compactifications","authors":"Yuichi Koga, Hajime Otsuka","score":3.0,"section":"new","rank":39,"parts":[0.0,0.05,0.1,0.0,0.0],"note":"Closest of your papers: [[1941263]] (coupling 0.02, 2 shared references). Closest network paper: [[3179956]] (coupling 0.04, 2 shared references).","abstract":"We study the photon couplings of QCD axions and axion-like particles in non-supersymmetric heterotic string theory on Calabi-Yau threefolds with line bundles. After the Stückelberg mechanism and anomaly matching are taken into account, the QCD axion direction is determined by the QCD axion-coupling coefficients together with the axion kinetic matrix. We focus on the electromagnetic-to-color axion coupling ratio, $E/N$. When the physical electromagnetic and QCD axion-coupling vectors are proportional with the ratio fixed by the gauge levels, the QCD axion has $E/N=8/3$ for $k_3=k_2=1$ and $k_Y=5/3$, independently of the axion kinetic matrix. It is found that direct flux breaking of the visible $SO(16)_{\\rm v}$ can produce independent QCD and electromagnetic axion-coupling vectors for the same level assignment. The Hermitian Yang function toc(){const t=document.getElementById('toc');if(!NEWS.length)return;t.hidden=false;
  const X=RAW.next||[];
  t.innerHTML=`<h3>In this listing</h3><ol>${NEWS.map(n=>`<li><a href="#p${n.i}"><span class="sc${n.role==='repl'?' repl':''}">${n.score.toFixed(0)}</span><span class="tt">${esc(n.title)}</span></a></li>`).join('')}${X.length?`<li class="more-link"><a href="#more"><span class="sc">+${X.length}</span><span class="tt">The next ${X.length} papers by score (folded)</span></a></li>`:''}</ol>`;
  const m=t.querySelector('.more-link a');if(m)m.addEventListener('click',()=>{document.getElementById('more').open=true});tex(t)}
let sel=NEWS[0]||null, hover=null, query='', G;
const svg=d3.select('#svg'), tip=document.getElementById('tip');
function draw(){
  if(!NEWS.length)return;
  const RNG=d3.randomLcg(11);
  const W=Math.max(300,document.getElementById('chart').clientWidth), H=W<600?500:480, m={l:16,r:16,t:20,b:34};
  svg.attr('viewBox',`0 0 ${W} ${H}`); svg.selectAll('*').remove();
  const yrs=d3.extent(N,n=>n.year);
  const x=d3.scaleLinear().domain([yrs[0]-.5,yrs[1]+1.2]).range([m.l+8,W-m.r-8]);
  const ticks=x.ticks(W<600?6:12).filter(t=>Number.isInteger(t)&&t<=yrs[1]);
  svg.append('g').attr('class','grid').selectAll('line').data(ticks).join('line').attr('x1',d=>x(d)).attr('x2',d=>x(d)).attr('y1',m.t).attr('y2',H-m.b);
  svg.append('g').attr('class','axis').attr('transform',`translate(0,${H-m.b})`).call(d3.axisBottom(x).tickValues(ticks).tickFormat(d3.format('d')).tickSizeOuter(0));
  const cy=(m.t+H-m.b)/2, xf=n=>isNew(n)?x(yrs[1]+.75):x(n.year);
  const sim=N.map(n=>({n,x:xf(n)+(RNG()-.5)*4,y:cy+(RNG()-.5)*H*.5}));
  const links=E.map(e=>({source:sim[e.s],target:sim[e.t],s:e.s,t:e.t,k:e.k}));
  d3.forceSimulation(sim).force('x',d3.forceX(s=>xf(s.n)).strength(1)).force('y',d3.forceY(cy).strength(.04))
    .force('link',d3.forceLink(links).strength(.03)).force('charge',d3.forceManyBody().strength(-40))
    .force('col',d3.forceCollide(s=>r(s.n)+2)).stop().tick(320);
  sim.forEach(s=>{s.y=Math.max(m.t+8,Math.min(H-m.b-8,s.y));s.x=Math.max(m.l+4,Math.min(W-m.r-4,s.x))});
  G=svg.append('g');
  G.append('g').selectAll('path').data(links).join('path').attr('class',l=>'edge '+l.k)
    .attr('d',l=>{const a=l.source,b=l.target;return `M${a.x},${a.y}Q${(a.x+b.x)/2},${(a.y+b.y)/2-Math.abs(a.x-b.x)*.12} ${b.x},${b.y}`});
  G.append('g').selectAll('circle').data([...sim].sort((a,b)=>RANK[b.n.role]-RANK[a.n.role])).join('circle')
    .attr('class','node').attr('cx',s=>s.x).attr('cy',s=>s.y).attr('r',s=>r(s.n)).attr('fill',s=>col(s.n))
    .on('pointerenter',(ev,s)=>{hover=s.n;showTip(ev,s.n);paint()}).on('pointermove',(ev,s)=>showTip(ev,s.n))
    .on('pointerleave',()=>{hover=null;tip.hidden=true;paint()}).on('click',(ev,s)=>pick(s.n,false));
  const lab=sim.filter(s=>isNew(s.n)||s.n.role==='seed'||s.n.deg>=3);
  const L=lab.map(s=>{const right=s.x>W*.8,t=isNew(s.n)?`#${s.n.rank} ${s.n.first}`:`${s.n.first} ${s.n.year}`,w=t.length*6.2;return{s,t,right,x0:right?s.x-r(s.n)-4-w:s.x+r(s.n)+4,w,y:s.y+4}}).sort((a,b)=>a.y-b.y);
  const placed=[];L.forEach(l=>{let k=0;while(k<40&&placed.some(p=>l.x0<p.x0+p.w&&p.x0<l.x0+l.w&&Math.abs(l.y-p.y)<13)){l.y+=13*(k%2?-1:1)*(1+Math.floor(k/2));k++;l.y=Math.max(m.t+10,Math.min(H-m.b-4,l.y))}placed.push(l)});
  G.append('g').selectAll('text').data(L).join('text').attr('class','nlabel').attr('x',l=>l.right?l.s.x-r(l.s.n)-4:l.s.x+r(l.s.n)+4).attr('y',l=>l.y)
    .attr('text-anchor',l=>l.right?'end':'start').text(l=>l.t);
  paint();
}
function showTip(ev,n){const b=document.getElementById('chart').getBoundingClientRect();tip.hidden=false;tip.textContent=`${auth(n)} (${n.year}) — ${plain(n.title)}`+(isNew(n)?` · score ${n.score}`:'');
  let L=ev.clientX-b.left+12;if(L>b.width-290)L=ev.clientX-b.left-290;tip.style.left=Math.max(4,L)+'px';tip.style.top=(ev.clientY-b.top+12)+'px'}
function paint(){if(!G)return;const f=hover||sel,on=new Set();if(f){on.add(f.i);f.out.forEach(i=>on.add(i));f.inn.forEach(i=>on.add(i))}
  svg.classed('dim',!!f);
  G.selectAll('path.edge').attr('class',l=>'edge '+l.k+(!f?'':l.s===f.i?' hot out':l.t===f.i?' hot in':''));G.selectAll('path.edge.hot').raise();
  G.selectAll('circle').classed('on',s=>on.has(s.n.i)).classed('sel',s=>sel&&s.n.i===sel.i).classed('match',s=>query&&`${s.n.first} ${s.n.title} ${s.n.arxiv} ${s.n.authors||''}`.toLowerCase().includes(query));
  G.selectAll('text.nlabel').classed('on',l=>on.has(l.s.n.i))}
function panel(){const p=document.getElementById('panel'),n=sel;
  if(!n){p.innerHTML='<p>Select a paper in the network.</p>';return}
  const links=`<div class="links">${n.id?`<a href="https://inspirehep.net/literature/${n.id}" target="_blank" rel="noopener">INSPIRE</a>`:''}${n.arxiv?`<a href="https://arxiv.org/abs/${esc(n.arxiv)}" target="_blank" rel="noopener">arXiv</a>`:''}</div>`;
  if(isNew(n)) p.innerHTML=`<div class="role" style="color:${col(n)}">#${n.rank} · ${esc(SEC[n.section])} · score ${n.score.toFixed(1)}</div><h4>${esc(n.title)}</h4>
   <div class="meta">${esc(auth(n))} · arXiv:${esc(n.arxiv)}</div><p>${why(n.note)}</p><div class="links"><a href="#p${n.i}">Back to abstract</a></div>`;
  else p.innerHTML=`<div class="role" style="color:${col(n)}">${esc(ROLE[n.role])}</div><h4>${esc(n.title)}</h4>
   <div class="meta">${esc(auth(n))} · ${n.year}${n.arxiv?' · arXiv:'+esc(n.arxiv):''}</div>
   <div class="stats"><span>${n.cites.toLocaleString()} citations</span><span>${n.inn.filter(i=>isNew(N[i])).length} of the matches link here</span></div>${links}`;
  tex(p)}
function pick(n,scroll){sel=n;panel();paint();document.querySelectorAll('.paper').forEach(el=>el.classList.toggle('sel',el.id==='p'+n.i));if(scroll)document.getElementById('chart').scrollIntoView({behavior:'smooth',block:'nearest'})}
const present=new Set(N.map(n=>n.role));
document.getElementById('legend').innerHTML=['today','repl','seed','other'].filter(k=>present.has(k)).map(k=>`<span><i class="dot" style="background:var(--${k})"></i>${esc(ROLE[k])}</span>`).join('')+'<span style="color:var(--fg-3)">Listing papers: size ∝ score; others: size ∝ log(citations)</span>';
document.getElementById('q').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();paint()});
svg.on('click',ev=>{if(ev.target.tagName!=='circle'){sel=null;panel();paint()}});
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(draw,200)});
function nextList(){const X=RAW.next||[];if(!X.length)return;const box=document.getElementById('nextlist'),more=document.getElementById('more');
  more.hidden=false;more.querySelector('summary').firstChild.textContent=`The next ${X.length} papers by score `;
  const nmin=M.nextMin;
  document.getElementById('moresub').textContent=`below the threshold of ${M.threshold}${nmin!=null?`: every paper scoring ${nmin} or more, and at least ${M.nextCount} when available`:''}; not drawn in the network`;
  const cut=nmin!=null?X.findIndex(n=>n.score<nmin):-1;
  box.innerHTML=X.map((n,i)=>(i===cut?`<li class="divider">Below ${nmin}: weaker relation (most of these share no specific reference, coupling or topic with your work)</li>`:'')+`<li><div class="role" style="color:var(--${n.section==='replacement'?'repl':'today'})">#${n.rank} · ${esc(SEC[n.section])} · score ${n.score.toFixed(1)}</div>
    <div class="t">${esc(n.title)}</div><div class="authors">${authors(n.authors)} · arXiv:${esc(n.arxiv)}</div>
    ${n.note?`<p class="why">${why(n.note)}</p>`:''}
    <details class="abs"><summary>Abstract</summary><p class="abs">${esc(n.abstract)}</p></details>
    <div class="links">${n.id?`<a href="https://inspirehep.net/literature/${n.id}" target="_blank" rel="noopener">INSPIRE</a>`:''}<a href="https://arxiv.org/abs/${esc(n.arxiv)}" target="_blank" rel="noopener">arXiv</a><a href="https://arxiv.org/pdf/${esc(n.arxiv)}" target="_blank" rel="noopener">PDF</a></div></li>`).join('');
  more.addEventListener('toggle',()=>{if(more.open)tex(box)})}
const rtip=document.getElementById('reftip');let rcur=null;
function refShow(el){const r=REFS[el.dataset.ref];if(!r)return;rcur=el;rtip.textContent=`${auth(r)} (${r.year}) — ${plain(r.title)}`;rtip.hidden=false;
  const b=el.getBoundingClientRect(),t=rtip.getBoundingClientRect();let L=Math.min(Math.max(8,b.left),innerWidth-t.width-8),T=b.bottom+6;
  if(T+t.height>innerHeight-8)T=b.top-t.height-6;rtip.style.left=L+'px';rtip.style.top=T+'px'}
function refHide(){rtip.hidden=true;rcur=null}
document.addEventListener('pointerover',e=>{const el=e.target.closest('.ref');if(el&&e.pointerType==='mouse')refShow(el)});
document.addEventListener('pointerout',e=>{if(e.target.closest('.ref')&&e.pointerType==='mouse')refHide()});
document.addEventListener('click',e=>{const el=e.target.closest('.ref');if(el)refShow(el);else if(rcur)refHide()});
document.addEventListener('focusin',e=>{const el=e.target.closest('.ref');if(el)refShow(el)});
document.addEventListener('focusout',e=>{if(e.target.closest('.ref'))refHide()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')refHide()});
addEventListener('scroll',()=>{if(rcur)refHide()},{passive:true});
// the rest of the day's papers by score: only the title, linked to the arXiv record
function restList(){const X=RAW.rest||[];if(!X.length)return;const d=document.getElementById('rest'),box=document.getElementById('restlist');
  d.hidden=false;d.querySelector('summary').firstChild.textContent=`All other ${X.length} papers in this listing `;
  document.getElementById('restsub').textContent='by score, title only';
  box.innerHTML=X.map(n=>`<li><span class="sc">#${n.rank} · ${n.score.toFixed(1)}</span><a href="https://arxiv.org/abs/${esc(n.arxiv)}" target="_blank" rel="noopener">${esc(n.title)}</a></li>`).join('');
  d.addEventListener('toggle',()=>{if(d.open)tex(box)})}
list();nextList();restList();fold();draw();panel();
window.addEventListener('load',()=>{tex(document.getElementById('list'));tex(document.getElementById('panel'));fold();
  if(window.MathJax&&MathJax.startup&&MathJax.startup.promise)MathJax.startup.promise.then(()=>setTimeout(fold,300))});
addEventListener('resize',()=>{clearTimeout(window._ft);window._ft=setTimeout(fold,200)});
</script>
