<script>
const RAW = {"n":[{"id":"3218087","arxiv":"2610.30984","title":"At the Highest-Frequency Frontier: Thermal Gravitational Waves from Supernovae","first":"Xu","nauth":3,"year":2026,"cites":0,"role":"today","note":"Co-authors of yours: Xu. Cites 2 network papers: [[2921206]], [[2843535]]. Closest of your papers: [[2627241]] (coupling 0.11, 9 shared references). Closest network paper: [[3156721]] (coupling 0.23, 10 shared references).","score":55.1,"rank":1,"section":"new","parts":[0.7,0.35,0.67,0.5],"abstract":"Core-collapse supernovae can be powerful sources of high-frequency gravitational waves (GWs) as the extreme temperatures and densities in the core allow a considerable number of gravitons to be produced thermally. We present the first systematic calculation of the thermal GW spectrum of a core-collapse supernova. By evaluating the dominant emission channels---including electron and proton photoproduction ($γe^{-}\\to he^{-}$, $γp\\to h\\,p$) and gravitational bremsstrahlung ($e^{-}p\\to e^{-}p\\,h$, $e^{-}e^{-}\\to e^{-}e^{-}h$)---we find that a core-collapse supernova generates a total thermal GW luminosity of $1.27\\times10^{26}$ W, approximately 18 orders of magnitude larger than that of the Sun. The thermal GW spectrum peaks at energies of $\\mathcal{O}(0.1\\,{\\rm GeV})$, extending the predicted spectrum of known GW sources to an unprecedented high-frequency regime. Our results provide a benchmark thermal GW spectrum at the high-frequency frontier.","authors":"Xun-Jie Xu, Yong Xu, Qiqin Yin","nlinked":30,"nref":39,"src":"INSPIRE","html":true},{"id":"3218111","arxiv":"2610.31101","title":"Saxion Decay and Dark Radiation in the KSVZ Axion Model","first":"Samtani","nauth":2,"year":2026,"cites":0,"role":"today","note":"Cites 3 network papers: [[3157216]], [[2797744]], [[1895232]]. Also cites widely used network papers: [[1783234]]. Closest of your papers: [[1941263]] (coupling 0.07, 17 shared references). Closest network paper: [[2154677]] (coupling 0.12, 21 shared references).","score":46.8,"rank":2,"section":"new","parts":[0.84,0.23,0.34,0.0],"abstract":"We calculate the relativistic axion energy density produced by the decay of a curvature-displaced Peccei--Quinn condensate in a quartic KSVZ model. We follow the radial PQ field (the saxion) as it relaxes from its inflationary minimum and determine the surviving condensate abundance from the adiabatic action of its oscillations. We then evolve the condensate through its decay into axions and visible particles to calculate the resulting dark-radiation contribution, expressed as $ΔN_{\\rm eff}$. With one heavy coloured KSVZ fermion and no additional portal interactions included, the axion channel dominates the two tree-level decay modes. Two reference histories yield $ΔN_{\\rm eff}\\simeq0.033$ and $0.12$, with maximum saxion energy fractions below $1\\%$ and $4\\%$, respectively. At fixed quartic coupling, increasing the duration of curvature release reduces the predicted axion radiation density relative to visible radiation by a factor of approximately $28$ while preserving the primordial isocurvature amplitude.","authors":"Sidhartha Samtani, Amartya Sengupta","nlinked":105,"nref":105,"src":"INSPIRE","html":true},{"id":"3088044","arxiv":"2512.00166","title":"Searching for Ultralight Dark Matter with MOLeQuTE: a Massive Optically Levitated Quantum Tabletop Experiment","first":"Hamaide","nauth":4,"year":2026,"cites":0,"role":"repl","note":"Cites 2 network papers: [[2737356]], [[2795517]]. Also cites widely used network papers: [[1783234]]. Closest of your papers: [[1941263]] (coupling 0.06, 16 shared references). Closest network paper: [[2810207]] (coupling 0.08, 30 shared references).","score":38.4,"rank":3,"section":"replacement","parts":[0.72,0.18,0.22,0.0],"abstract":"Many well theoretically motivated models of ultralight dark matter are expected to give rise to feeble oscillatory forces on macroscopic objects. Optically trapped sensors have high force sensitivities but have remained relatively unexplored in this context. In this work we propose a new, tunable, optically trapped sensor specifically designed to detect such forces. Our design features a high-mass ($\\sim$ mg) plate whose high aspect ratio allows its weight to be supported by a vertical beam without excessive heating. We present the first systematic analysis and optimisation of quantum noises in optically trapped systems and show that our setup has the potential to operate at the standard quantum limit with current off-the-shelf technologies. We demonstrate that our sensor could offer unique access to large regions of uncharted parameter space of vector B-L dark matter, with projected sensitivities that could advance existing limits by several orders of magnitude over a broad range of frequencies.","authors":"Louis Hamaide, Hannah Banks, Peter Barker, Andrew A. Geraci","nlinked":128,"nref":162,"src":"INSPIRE","html":true},{"id":"3216348","arxiv":"2610.25925","title":"Exploring a low-mass H dibaryon in light of the LZ event: A QCD sum rule study","first":"Tan","nauth":2,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[3201080]]. Also cites widely used network papers: [[2817040]]. Closest of your papers: [[3184726]] (coupling 0.00, 1 shared references). Closest network paper: [[3202840]] (coupling 0.25, 23 shared references).","score":30.5,"rank":4,"section":"replacement","parts":[0.48,0.01,0.72,0.0],"abstract":"The LUX-ZEPLIN (LZ) Collaboration recently reported a candidate event consistent with a high-energy nuclear recoil, motivating a possible interpretation by Lee, Takahashi, and Tsai involving the production of an invisible baryon-number-two scalar with a mass near $1.85$ GeV. Motivated by this hypothetical scenario, we investigate the $J^P=0^+$ $uuddss$ hexaquark system using QCD sum rules. We consider five local diquark-diquark-diquark interpolating currents with different scalar and axial-vector diquark combinations, together with a baryon-baryon current constructed from two $Λ$-type baryon currents. The operator product expansions are calculated up to dimension sixteen, and their numerical behaviors are examined under different OPE truncations. Among the currents considered, only the $SU(3)_{\\rm flavor}$-singlet current $J_{SSS}$, consisting of three scalar color-$\\bar{\\mathbf{3}}_C$ diquarks, yields a low-mass solution at $D=12$, with $M_{SSS}=1.85^{+0.19}_{-0.20}$ GeV. Interestingly, scalar color-$\\bar{\\mathbf{3}}_C$ diquarks belong to the flavor $\\bar{\\mathbf{3}}_F$ representation, and their local color-singlet construction has a unique nonvanishing flavor structure, $[ud][ds][su]$, corresponding to $uuddss$. Analogous all-scalar-diquark currents vanish for other flavor configurations, such as $uuuddd$ and $uuudds$. Together with our QCD sum-rule results, this property highlights the special role of the all-scalar-diquark configuration, $[ud][ds][su]$, as a possible deeply bound structure. However, the higher-dimensional OPE contributions exhibit significant truncation dependence, and the low-mass solution remains conditional on the adopted OPE truncation rather than constituting a fully controlled mass prediction.","authors":"Wei-Han Tan, Hua-Xing Chen","nlinked":98,"nref":101,"src":"INSPIRE","html":true},{"id":"3218194","arxiv":"2610.31666","title":"Boosted Dark Matter Directionality in Large Liquid Scintillator Detectors","first":"Tse","nauth":5,"year":2026,"cites":0,"role":"today","note":"Co-authors of yours: Choi. Cites 1 network paper: [[2795517]]. Closest of your papers: [[2794409]] (coupling 0.02, 3 shared references). Closest network paper: [[2181757]] (coupling 0.09, 10 shared references).","score":28.7,"rank":5,"section":"new","parts":[0.45,0.05,0.25,0.5],"abstract":"Light dark matter can be boosted by cosmic-ray-dark matter interactions, which opens the possibility of direct-detection searches with large neutrino detectors. We consider the signal produced by boosted dark matter undergoing quasi-elastic scattering off carbon and knocking out a neutron in a large liquid scintillator detector. A distinctive delayed gamma ray from neutron capture can be reconstructed after $\\sim 210$ $μ$s, which is paired up with the prompt signal during neutron propagation. We find that 100 kt$\\cdot$yr of data from the neutron-coincidence channel will be able to probe new parameter space compared to free proton signals found in previous work. We further consider the possibility of utilizing directional information from the displaced vertex associated with the capture of the final-state neutron. However, we find that directional information does not materially improve the sensitivity due to the large nucleon scattering angle.","authors":"Samuel S. H. Tse, Qishan Liu, Kenny C. Y. Ng, Koun Choi, Yu-Feng Li","nlinked":80,"nref":92,"src":"INSPIRE","html":true},{"id":"3218042","arxiv":"2610.30534","title":"What if dark matter is composite of least interacting particles?","first":"Fortes","nauth":2,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[2795517]]. Closest of your papers: [[3146383]] (coupling 0.07, 7 shared references). Closest network paper: [[2974439]] (coupling 0.07, 5 shared references).","score":27.7,"rank":6,"section":"new","parts":[0.45,0.19,0.19,0.0],"abstract":"In this work, we investigate the possibility that Dark Matter contains particles that interact with known matter only through gravity, the least interacting particles (LIPs). Specifically, we consider the case of a dark Proca vector field, which does not mix in the kinetic term with any of the vector bosons of the Standard Model if a discrete symmetry (Z2 ) is imposed. Breaking this symmetry introduces kinetic mixing. Here, we study two realization mechanisms, namely kinetic mixing with the electromagnetic field after electroweak symmetry breaking (Scenario A) and kinetic mixing with the weak hypercharge gauge field (Scenario B). We also consider generalized kinetic terms that violate parity and time-reversal symmetries.","authors":"Elaine C. F. S. Fortes, Vicente Pleitez","nlinked":29,"nref":43,"src":"INSPIRE","html":true},{"id":"3130266","arxiv":"2603.15734","title":"Crowdsourcing Gravitational Waves from Superradiant Axions","first":"Ellis","nauth":4,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[2915943]]. Closest of your papers: [[1941263]] (coupling 0.04, 11 shared references). Closest network paper: [[2669622]] (coupling 0.11, 20 shared references).","score":26.8,"rank":7,"section":"replacement","parts":[0.45,0.12,0.31,0.0],"abstract":"Black hole superradiance is a powerful probe of ultralight axions. If nature contains a boson with a mass of order $10^{-12}\\,$eV, $\\textit{mere vacuum fluctuations}$ will lead to its efficient production around spinning stellar mass black holes, forming a gravitational atom that both drains the black hole spin and decays to produce near-monochromatic gravitational waves. Existing superradiance constraints derive primarily from spin measurements of a handful of identified black holes. Here we instead present a detailed study of the population level effect: gravitational waves arising from both the 100 million black holes in the Milky Way and the stochastic signal from axion clouds throughout the universe. We study the impact of a broad range of systematic uncertainties on the black hole properties and compute the projected axion sensitivity for LIGO, as well as the future instruments Einstein Telescope, Cosmic Explorer, and a high-frequency Magnetic Weber Bar. We demonstrate that LIGO can robustly probe axion masses from roughly $10^{-13}\\,$eV to $4 \\times 10^{-12}\\,$eV. If the black hole population extends to masses slightly below $5\\,M_{\\odot}$ - as hinted for by LIGO inspiral observations - LIGO would approach $10^{-11}\\,$eV. Under that same assumption we show that a future high-frequency detector could push considerably higher, potentially beyond $10^{-10}\\,$eV in the most optimistic scenarios, reaching towards the lowest masses within the projected sensitivity of axion dark matter searches.","authors":"Sebastian A. R. Ellis, Orion Ning, Nicholas L. Rodd, Jan Schütte-Engel","nlinked":170,"nref":182,"src":"INSPIRE","html":true},{"id":"3218200","arxiv":"2610.31658","title":"Neutrino Mass in Left-Right Symmetry: From Majorana Signals to Dirac Predictions","first":"Tello","nauth":1,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[2715897]]. Closest of your papers: [[3184726]] (coupling 0.03, 7 shared references). Closest network paper: [[2031580]] (coupling 0.08, 22 shared references).","score":24.7,"rank":8,"section":"new","parts":[0.45,0.09,0.22,0.0],"abstract":"We review neutrino mass as a probe of restored parity in left-right symmetric theories, emphasizing the distinct Majorana and Dirac realizations. In the Majorana theory, lepton-number violation connects the seesaw mechanism to neutrinoless double beta decay, heavy-neutrino production and the Keung-Senjanovic process. The Dirac alternative removes these characteristic signals while retaining a relation between left- and right-handed flavor. The right-handed leptonic mixing matrix can then be reconstructed from low-energy data and the spontaneous parity-breaking parameter. Requiring the two lepton Yukawa matrices to admit a common real parity basis turns this reconstruction into a compatibility condition that determines the allowed Dirac phase on each branch. For three generations, this requirement reduces to a single rephasing-invariant CP-odd obstruction, which also governs the right-left modulus mismatch and the relative CP orientation. The small Dirac masses also restrict the parity deformation and its induced strong-CP phase. For compressed mixed-sign neutrino spectra, a tiny parity deformation can nevertheless generate large leptonic CP violation, despite stringent strong-CP constraints. The resulting branch-dependent correlations connect leptonic CP, the absolute neutrino mass and strong CP. We place this construction alongside radiative and unified approaches to predicting leptonic CP violation.","authors":"Vladimir Tello","nlinked":92,"nref":94,"src":"INSPIRE","html":true},{"id":"3218033","arxiv":"2610.30360","title":"Gravitational Waves From an Entangled SO(3) Cosmic String Network","first":"Chen","nauth":2,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[2969254]]. Closest of your papers: [[2690106]] (coupling 0.03, 2 shared references). Closest network paper: [[2737686]] (coupling 0.06, 8 shared references).","score":23.2,"rank":9,"section":"new","parts":[0.45,0.07,0.18,0.0],"abstract":"Discrete non-Abelian symmetries such as $\\mathrm{A_4}$ are widely used in models of lepton flavor to explain neutrino mass hierarchy and their large mixing. If such a symmetry arises from the spontaneous breaking of a continuous group, cosmic strings can form. We study the breaking $\\mathrm{SO}(3)\\to \\mathrm{A_4}$, for which the strings are classified by the non-Abelian group $π_1(\\mathrm{SO}(3)/\\mathrm{A_4})\\cong \\mathrm{T}'$, the binary tetrahedral group. Because the string fluxes do not commute, colliding strings may reconnect, pass through each other, or become joined by a bridge whose flux can belong to a different string network. We derive the probabilities of these outcomes directly from the group structure; in network models they are usually treated as free parameters. Including them in a multi-network velocity-dependent one-scale model, we find that the correlation length of the networks decreases and their energy density increases relative to Abelian $\\mathrm{U}(1)$ strings of the same tension. The resulting stochastic gravitational-wave background is enhanced by up to nearly three orders of magnitude, showing that the algebraic structure of $π_1$ leaves a direct imprint on the gravitational-wave spectrum.","authors":"Mu-Chun Chen, Cameron Moffett-Smith","nlinked":51,"nref":52,"src":"INSPIRE","html":true},{"id":"3216271","arxiv":"2610.24905","title":"A Casimir turning point as the beginning of a small flat universe","first":"Zhang","nauth":1,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[2726622]]. Closest of your papers: [[2663002]] (coupling 0.01, 3 shared references). Closest network paper: [[2046345]] (coupling 0.06, 9 shared references).","score":21.4,"rank":10,"section":"replacement","parts":[0.45,0.02,0.17,0.0],"abstract":"We study a flat three-torus universe whose contraction is turned around by the negative Casimir energy of Standard Model fields. The trace anomaly forbids conformal matter alone to turn an anisotropic universe around, so matter with $w<1/3$, most cheaply a positive potential, must supply the negative trace; with antiperiodic fermions the Standard Model supplies the negative energy, and the universe turns at an edge of 722 reduced Planck lengths. The turning point can hold only about five quanta of the lowest modes, whereas a reheating coupling in a time-symmetric past would produce radiation exceeding the Casimir energy by at least $10^{94}$, so we read the turn as a beginning rather than a bounce. Negative Casimir energy cannot hold the shape of the torus: its shape state can be real at most once, and for a real Gaussian state survival of the shape on both branches with $90\\%$ probability requires that moment to lie within $0.35$ Hubble times of the turn. The natural state, real at the turn, freezes the torus into a nearly rectangular box whose sides typically differ by $16$--$18\\%$. The microwave background can read this fossil only if the shortest cycle lies between $0.985$ and about $1.04$ last-scattering diameters. At the turn the Higgs quartic coupling is negative, yet zero-point fluctuations of the gauge zero modes keep the Higgs zero mode near the origin with probability above one half for a top-quark pole mass below $172.96$ GeV, given a curvature coupling $ξ_H\\gtrsim0.08$; a pole mass above $173.7$ GeV, within reach of FCC-ee, would exclude this beginning.","authors":"Alan Zhang","nlinked":161,"nref":175,"src":"INSPIRE","html":true},{"id":"3171509","arxiv":"2606.23749","title":"axionbloch: an Open-Source Python Package for Simulating Axion-Induced Spin Dynamics","first":"Zhang","nauth":1,"year":2026,"cites":0,"role":"repl","note":"Closest of your papers: [[1941263]] (coupling 0.10, 12 shared references). Closest network paper: [[2691930]] (coupling 0.11, 12 shared references).","score":14.5,"rank":11,"section":"replacement","parts":[0.0,0.29,0.3,0.0],"abstract":"The interaction of ultralight bosonic dark matter with spins can be interpreted as a pseudomagnetic field acting on normal matter. Such interactions can be modeled as usual magnetic interactions using spin-evolution (Bloch) equations. axionbloch, an open-source Python package for simulating spin dynamics induced by both usual and exotic interactions, is presented. The numerical simulations serve as a tool for deriving axion signal signatures, which are crucial for designing experimental searches and data analysis. Simulations are calibrated against theoretical expectations, ensuring the accuracy of the simulated signals. axionbloch is available at https://github.com/Yuzhe98/AxionBloch, allowing researchers to simulate pseudomagnetic signals under specific configurations of the axion models and experimental setups. The package is documented at http://axionbloch.readthedocs.io/ and includes example scripts for application.","authors":"Yuzhe Zhang","nlinked":44,"nref":56,"src":"INSPIRE","html":true},{"id":"3218072","arxiv":"2610.30640","title":"Yukawa textures due to selection rules in magnetized orbifold models","first":"Kobayashi","nauth":5,"year":2026,"cites":0,"role":"today","note":"Closest of your papers: [[695291]] (coupling 0.01, 1 shared references). Closest network paper: [[3144122]] (coupling 0.31, 22 shared references).","score":14.3,"rank":12,"section":"new","parts":[0.0,0.03,0.88,0.0],"abstract":"We study systematically Yukawa textures, which can be derived from magnetized $T^2/\\mathbf{Z}_2$ and $T^2/\\mathbf{Z}_4$ orbifold models with various magnetic fluxes and Scherk-Schwarz phases. Remarkably, the nearest neighbor interaction pattern as well as the diagonal Yukawa matrix is statistically favorable in $T^2/\\mathbf{Z}_2$ orbifold models. Also, in $T^2/\\mathbf{Z}_4$ orbifold models, selection rules are nontrivial and lead to textures, which cannot be derived from group-theoretical symmetries.","authors":"Tatsuo Kobayashi, Tomoyasu Kori, Shuhei Miyamoto, Riku Nakano, Haruki Uchida","nlinked":69,"nref":69,"src":"INSPIRE","html":true},{"id":"3217987","arxiv":"2610.30255","title":"$γ$hosts from the past: reheating neutron stars with supernova-sourced ALPs","first":"Bose","nauth":4,"year":2026,"cites":0,"role":"today","note":"Also cites widely used network papers: [[1783234]]. Closest of your papers: [[1941263]] (coupling 0.04, 11 shared references). Closest network paper: [[2843822]] (coupling 0.16, 17 shared references).","score":13.8,"rank":13,"section":"new","parts":[0.06,0.14,0.45,0.0],"abstract":"Axion-like particles (ALPs) can be copiously produced in the hot and dense environment of a core-collapse supernova. If their mass is within an order of magnitude of the supernova temperature, a non-negligible fraction of them will remain gravitationally bound to the neutron star remnant. This basin of ALPs can then decay to photons over the lifetime of the neutron star, thereby reheating it. Using the measured luminosities of several neutron stars, we close multiple windows in ALP parameter space while also satisfying the SN 1987A cooling constraint on the ALP-nucleon coupling. In particular, using the 35000 K upper limit on the temperature of the coldest neutron star observed, PSR J2144$-$3933, we derive the strongest upper limits on the ALP-photon coupling for 1$-$400 MeV ALP masses. Ceilings on these limits arising from ALP decays occurring within the neutron star lifetime may be overcome by using younger neutron stars such as the one in Cas A, probing couplings orders of magnitude higher. Observations of a $2000 \\, {\\rm K}$-hot neutron star in infrared observatories such as the James Webb Space Telescope could reach ALP-photon couplings three orders lower and ALP masses one order lower than our current limits.","authors":"Debajit Bose, Sougata Ganguly, Tanmoy Kumar, Nirmal Raj","nlinked":120,"nref":126,"src":"INSPIRE","html":true},{"id":"3191224","arxiv":"2608.14195","title":"Probing the Single Production of First-Generation Singlet Vector-like Leptons at Future $e^+e^-$ Colliders","first":"Liu","nauth":2,"year":2026,"cites":0,"role":"repl","note":"Closest of your papers: [[1455793]] (coupling 0.03, 5 shared references). Closest network paper: [[2664140]] (coupling 0.22, 44 shared references).","score":12.8,"rank":14,"section":"replacement","parts":[0.0,0.09,0.63,0.0],"abstract":"We study the single production of first-generation weak-isosinglet vector-like leptons (VLLs) at future $e^+e^-$ colliders through $e^+e^-\\to e^\\pm E^\\mp$, with the subsequent decays $E^\\pm\\to W^\\pmν_e$, $e^\\pm Z$, and $e^\\pm h$. For the heavy VLL masses considered, the hadronic decays of the $W$ and $Z$ bosons are reconstructed as fat-jets, while the Higgs boson is reconstructed from two resolved $b$-tagged jets at $\\sqrt{s}=1~{\\rm TeV}$ and as a fat-jet at $\\sqrt{s}=1.5~{\\rm TeV}$. Using detector-level Monte Carlo simulations for the 1~TeV ILC and 1.5~TeV CLIC, we perform a baseline cut-based analysis in which the well-defined two-body production kinematics are exploited through a mass-hypothesis-dependent selection on the associated-electron energy. At fixed nominal center-of-mass energy, this observable is in one-to-one correspondence with the VLL recoil mass and therefore provides a common mass-sensitive discriminator for all three decay channels. We derive the $2σ$ exclusion and $5σ$ discovery reaches on the VLL--electron mixing angle $\\sinθ_L$ as functions of the integrated luminosity. For the benchmark points studied, sizeable sensitivity is retained at $m_E=900~{\\rm GeV}$ at the ILC and $m_E=1400~{\\rm GeV}$ at CLIC, while the accessible values of $\\sinθ_L$ extend below the reference electroweak precision bound used in this study. These results demonstrate the complementary potential of direct searches for first-generation singlet VLLs at future lepton colliders.","authors":"Yao-Bei Liu, Stefano Moretti","nlinked":105,"nref":106,"src":"INSPIRE","html":true},{"id":"3166352","arxiv":"2606.07742","title":"Core Composition Effects on the QCD Axion Mass Limit from Neutron Star Cooling","first":"Arias-Aragón","nauth":2,"year":2026,"cites":0,"role":"repl","note":"Also cites widely used network papers: [[1783234]], [[2817040]]. Closest of your papers: [[1941263]] (coupling 0.04, 13 shared references). Closest network paper: [[2822193]] (coupling 0.06, 14 shared references).","score":12.1,"rank":15,"section":"replacement","parts":[0.11,0.14,0.18,0.0],"abstract":"Neutron stars are very dense media in which axions may be produced. This has been used to set a limit on the QCD axion mass, usually under the assumption that only neutrons, protons, electrons, and muons appear in the star core. Given the extreme conditions reached within neutron stars, it is reasonable to consider that other particles, such as hyperons and $Δ$ resonances, may appear in the neutron star core. In this work, we study how the limit on the mass of QCD axions, namely KSVZ and DFSZ invisible axions, is altered when different equations of state are used, allowing for heavier particles to appear in the neutron star core. We find that this dependence is in general mild and thus reinforces the reliability of the known limit. Additionally, in the DFSZ scenario, it may drive the limit within the sensitivity window for IAXO. This would allow this experiment to discern the composition of neutron star cores if an axion were to be observed within that window.","authors":"Fernando Arias-Aragón, Federico Nola","nlinked":114,"nref":126,"src":"INSPIRE","html":true},{"id":"3218006","arxiv":"2610.30261","title":"Variable-phase methods and data for long-range scattering","first":"Flores","nauth":3,"year":2026,"cites":0,"role":"today","note":"Closest of your papers: [[1249404]] (coupling 0.03, 2 shared references). Closest network paper: [[1842151]] (coupling 0.17, 10 shared references).","score":10.3,"rank":16,"section":"new","parts":[0.0,0.08,0.49,0.0],"abstract":"Long-range interactions play an important role in dark-matter phenomenology, affecting the relic abundance, indirect-detection signals, and structure formation on galactic scales. Reliable predictions often require nonperturbative solutions of the Schrödinger equation over broad parameter ranges and many partial waves. We present a numerical framework based on the variable-phase method, which recasts the radial Schrödinger equation as a system of first-order equations and allows both regular and irregular solutions to be computed efficiently. The former determine phase shifts and Sommerfeld factors, while the latter provide additional information relevant for the self-consistent unitarization of contact-like inelastic interactions. We discuss the numerical implementation, integration-domain selection, partial-wave convergence, and comparisons with analytic limits. We release the code together with tables for the Yukawa potential containing phase shifts, Sommerfeld factors, elastic and angularly weighted cross sections, and the irregular-solution information relevant for unitarization. These resources facilitate dark-matter studies without requiring repeated computationally intensive scans.","authors":"Marcos M. Flores, Kalliopi Petraki, Thomas Pignard","nlinked":38,"nref":42,"src":"INSPIRE","html":true},{"id":"1955022","arxiv":"2110.15167","title":"Singlet fermion dark matter and Dirac neutrinos fr "],[55,68,"c"],[16,35,"c"],[80,70,"c"],[21,68,"c"],[31,63,"c"],[67,34,"c"],[43,33,"c"],[25,35,"c"],[72,64,"c"],[62,34,"c"],[65,68,"c"],[12,42,"k"],[57,39,"c"],[10,65,"k"],[37,35,"c"],[1,66,"k"],[0,67,"k"],[57,49,"c"],[3,68,"c"],[14,68,"c"],[4,69,"k"],[6,70,"c"],[8,71,"k"],[2,42,"k"],[15,72,"k"],[0,73,"k"],[12,35,"c"],[13,74,"k"],[45,18,"c"],[66,35,"c"],[66,46,"c"],[22,46,"c"],[78,46,"c"],[2,75,"k"],[7,76,"k"],[4,77,"k"],[52,83,"c"],[10,78,"k"],[22,51,"c"],[63,25,"c"],[66,23,"c"],[15,79,"k"],[29,25,"c"],[80,42,"c"],[25,57,"c"],[81,30,"c"],[6,80,"k"],[82,25,"c"],[13,81,"k"],[44,63,"c"],[51,17,"c"],[14,22,"k"],[2,35,"c"],[23,36,"c"],[5,82,"k"],[38,39,"c"],[0,83,"k"],[1,84,"c"],[72,79,"c"],[57,38,"c"]],"next":[{"arxiv":"2608.04801","id":"3187944","title":"Isochrone fitting of Galactic globular clusters - IX. Tip of the red-giant branch for 27 clusters and constraints on new particle physics","authors":"G. A. Gontcharov, A. M. Kudashov, O. S. Ryutina, S. V. Troitsky","score":9.0,"section":"replacement","rank":17,"parts":[0.06,0.08,0.27,0.0],"note":"Also cites widely used network papers: [[1783234]]. Closest of your papers: [[1941263]] (coupling 0.02, 6 shared references). Closest network paper: [[3146899]] (coupling 0.09, 17 shared references).","abstract":"Red-giant evolution is sensitive to non-standard channels of energy loss in stellar cores and therefore provides a probe of new physics. Such losses increase the luminosity of the tip of the red-giant branch (TRGB), the brightest point reached by a red giant in the color-magnitude diagram. Previous analyses of TRGB luminosities in globular clusters placed stringent bounds on the axion-electron coupling g_{ae}, but were limited by observational and theoretical uncertainties. To obtain a homogeneous and systematically controlled constraint, we use new parameters and TRGB estimates for 27 globular clusters, derived from Stetson, Hubble Space Telescope, and Gaia photometry, together with cluster-specific MESA calculations. Our primary likelihood uses 24 clusters after excluding three hot-flasher systems and explicitly accounts for stellar variability in identifying the brightest RGB stars. Finite sampling of the upper RGB is described by the full conditional distribution, and shared observational and stellar-physics uncertainties are retained as correlated nuisance parameters. The observed TRGB is fainter than the standard-cooling prediction by 0.078 (+0.036,-0.037) mag; to avoid an artificially strong bound from this downward fluctuation, we use the power-constrained profile likelihood method and obtain g_{ae}<6.4e-14 (95% CL). Sensitivity estimates for the neutrino magnetic dipole moment and for millicharged particles are also presented."},{"arxiv":"2610.30240","id":"3217971","title":"Probing Heavy Neutral Leptons through New Gauge Interactions at the Forward Physics Facilities","authors":"Francis M. Burk, P. S. Bhupal Dev, Bhaskar Dutta, Tao Han, Aparajitha Karthikeyan, Doojin Kim","score":8.9,"section":"new","rank":18,"parts":[0.0,0.13,0.29,0.0],"note":"Closest of your papers: [[1686334]] (coupling 0.04, 4 shared references). Closest network paper: [[2617409]] (coupling 0.10, 17 shared references).","abstract":"We investigate the prospects for improving the heavy neutral lepton (HNL) searches at the far-forward LHC experiments FASER and FASER$ν$, as well as their proposed HL-LHC successors, FASER2 and FASER$ν$2, using new HNL production mechanisms. We consider scenarios in which HNLs couple directly to a new $U(1)$ gauge boson and decay into visible Standard Model final states through mixing with active neutrinos. Focusing on the $U(1)_{B-L}$, $U(1)_{B-3L_τ}$, and $U(1)_B$ gauge extensions as benchmark models, we study HNL production through proton bremsstrahlung and Drell--Yan processes, which probe complementary mediator-mass regimes. We analyze several visible decay channels, including charged leptons, neutral mesons, and other hadrons, and evaluate the projected sensitivities for different neutrino-flavor mixing patterns. We find that these new production mechanisms that differ qualitatively from the conventional picture in which both production and decay are controlled by active-sterile mixing enable the far-forward LHC program to probe previously unexplored regions of HNL parameter space, with the first-ever demonstration of FASER$ν$ having sensitivity to HNLs and FASER2 and FASER$ν$2 offering substantially enhanced sensitivity during the HL-LHC era, even reaching the canonical seesaw prediction for all three lepton flavors. Our results demonstrate that new gauge interactions can substantially enhance HNL production independently of the active-sterile mixing that governs their visible decays, opening complementary opportunities to explore HNLs at the forward physics facilities."},{"arxiv":"2610.30245","id":"3217957","title":"Sequential SBI for Resonance Searches at the LHC","authors":"Henning Bahl, Ranit Das","score":7.6,"section":"new","rank":19,"parts":[0.0,0.12,0.24,0.0],"note":"Closest of your papers: [[1455793]] (coupling 0.04, 7 shared references). Closest network paper: [[3187354]] (coupling 0.08, 7 shared references).","abstract":"Neural simulation-based inference has been shown to extract significantly more information from LHC data than histogram-based analyses. So far, it has mostly been applied to couplings, for which the polynomial structure of the scattering amplitude can be exploited. Masses and widths instead move and deform the signal in phase space, and learning their likelihood requires many event samples covering the continuous theory parameter space. We show how sequential simulation-based inference can address this by iteratively concentrating the simulations where the observed data points. Using a parton-level example with an exact reference likelihood and reconstruction-level analyses of $A\\to ZH\\to \\ell\\ell b\\bar b$ and $Y\\to HH\\to (t\\bar t)(t\\bar t)$, we demonstrate that sequential training produces significantly more accurate and better calibrated likelihoods than single round training with the same amount of training events."},{"arxiv":"2610.31254","id":"3218141","title":"A consistent neutrino determination of the low-energy weak mixing angle","authors":"M. Atzori Corona, M. Cadeddu, N. Cargioli, F. Dordei, L. Ferro, C. Giunti, R. Pavarani, M. Sestu","score":7.4,"section":"new","rank":20,"parts":[0.06,0.07,0.16,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1854224]] (coupling 0.03, 2 shared references). Closest network paper: [[3095306]] (coupling 0.06, 5 shared references).","abstract":"The weak mixing angle, $\\sin^2θ_W$, is a fundamental parameter of the Standard Model and a sensitive probe of electroweak physics across various energy scales. At low momentum transfer, the Standard Model prediction approaches a well-defined low-energy plateau, providing a target for precision tests of the electroweak theory. At the lowest momentum transfer, atomic parity violation (APV) in cesium provides one of the most precise determinations of the weak mixing angle. Here, we review and update the status of this determination and compare it with other available probes. We then consistently reanalyze low-energy neutrino scattering data and combine the resulting determinations from coherent elastic scattering (CE$ν$NS) and neutrino-electron scattering. The complementary sensitivity of these processes to electroweak couplings enables a neutrino-based determination of the low-energy weak mixing angle, accounting for electroweak radiative corrections and relevant theoretical uncertainties. Our global analysis yields $\\sin^2θ_W^{\\rm low}(ν\\,\\text{data}) = 0.233^{+0.007}_{-0.006}$. We assess the consistency and relative impact of the individual neutrino measurements and discuss the prospects for future CE$ν$NS and neutrino-electron scattering experiments to improve the precision of this determination. Our analysis provides an independent test of the Standard Model at low momentum transfer, complementary to that provided by atomic parity violation."},{"arxiv":"2610.31312","id":"3218172","title":"Lepton number and flavor violation mediated by doubly charged scalars at $μ$TRISTAN $μ^+ μ^+$ collider","authors":"Takeshi Fukuyama, Yukihiro Mimura, Yuichi Uesaka","score":7.0,"section":"new","rank":21,"parts":[0.0,0.11,0.2,0.0],"note":"Closest of your papers: [[1249404]] (coupling 0.04, 7 shared references). Closest network paper: [[2665284]] (coupling 0.07, 11 shared references).","abstract":"Charged lepton flavor violation is an important probe of physics beyond the Standard Model. Although $ΔL_μ= -ΔL_e = \\pm 1$ lepton flavor violating (LFV) processes, such as $μ\\to eγ$ and $μ\\to 3e$, are severely constrained experimentally, there is still plenty of room for LFV processes involving lepton number violation (LNV). In this paper, we investigate such processes at a $μ^+μ^+$ collider that remain even if processes with $ΔL_μ= -ΔL_e = \\pm 1$ are forbidden by discrete symmetries. We consider processes induced by doubly charged scalars, which can be either an $SU(2)_L$ singlet or a component of an $SU(2)_L$ triplet. The cross sections of these processes at the collider depend on the representation of the scalar unless the muon beam is unpolarized. In the case of $ΔL_μ= -ΔL_e = 2$, we discuss the combination of the muonium-to-antimuonium transition and the $μ^+μ^+ \\to e^+e^+γ/Z$ processes at the collider, and how the model parameters, such as the scalar couplings and mass, can be determined from experimental measurements. Doubly charged scalars are often utilized in models for generating neutrino masses, and they can also be used to construct models with LNV processes at a muon collider. If neutrino masses are generated at tree level, the LNV processes at the collider are suppressed, and therefore, we consider models that do not induce neutrino masses at tree level. LNV processes, such as $μ^+μ^+ \\to t\\bar b t\\bar b$ and $μ^+μ^+ \\to μ^+ e^- t\\bar b t\\bar b$, are possible in these models. Even if LNV is indicated by searches at hadron colliders, it is worthwhile to pursue these processes as clean LNV signals at a lepton collider."},{"arxiv":"2605.07108","id":"3153509","title":"Search for Sub-GeV Axion-Like Particles at EBES Pilot Run Using 4 GeV Positron Beam at KEK LINAC","authors":"Takahiro Fusayasu, Tomoya Iizawa, Fumihito Ikeda, Akimasa Ishikawa, Masako Iwasaki, Hiroshi Iwase, Takahiro Kawahara, Aoi Masaki, Fusashi Miyahara, Yu Morikawa, Yuichi Okayasu, Toshiyuki Ono, Hidetoshi Otono, Yasuhito Sakaki, Takumi Seino, Yuta Shimasaki, Taikan Suehara, Yosuke Takubo, Shusaku Tsumura, Kosuke Uemura, Yifu Zhang","score":7.0,"section":"replacement","rank":22,"parts":[0.0,0.13,0.16,0.0],"note":"Closest of your papers: [[1941263]] (coupling 0.04, 5 shared references). Closest network paper: [[2895324]] (coupling 0.06, 5 shared references).","abstract":"We report the results of a search for sub-GeV axion-like particles (ALPs) using pilot run data from the Electron Beam-dump Experiment at KEK LINAC Switching Yard 3 (EBES). The data were collected in December 2023 with a 4 GeV positron beam and correspond to $5.7\\times10^{13}$ positrons on target. In the pilot run setup, a tungsten beam dump and a single PbO calorimeter were used. We consider ALP production via the Primakoff process induced by bremsstrahlung photons in the beam dump, followed by the decay $a\\toγγ$. The background was estimated with a data-driven method, and a signal region was defined such that the expected background yield is below 0.1 events. No events were observed after unblinding. Upper limits at the 90% confidence level were derived in the ALP mass-coupling plane, extending the experimental coverage into a region of parameter space not explored by previous searches."},{"arxiv":"2610.30723","id":"3218077","title":"Decoherence of the quantum superradiant cloud from graviton emission","authors":"Lingyun Fu, Hidetoshi Omiya, Takahiro Tanaka, Hui-Yu Zhu","score":6.9,"section":"cross","rank":23,"parts":[0.0,0.02,0.41,0.0],"note":"Closest of your papers: [[1709434]] (coupling 0.01, 1 shared references). Closest network paper: [[2669622]] (coupling 0.14, 16 shared references).","abstract":"Black hole superradiance amplifies vacuum fluctuations into a macroscopic cloud of a massive bosonic field around a rotating black hole. Under free evolution, the quantum cloud is a two-mode squeezed state that remains entangled even at large occupation numbers, while its growing component admits a classical statistical description. In this work, we study how graviton emission changes the quantum state of the cloud. We find that graviton emission suppresses interference between cloud configurations with different amplitudes, but leaves interference between configurations that differ only by an overall sign unchanged. For typical configurations realized under vacuum fluctuations, the suppression becomes significant when the expected number of emitted gravitons is of order unity.We also show that, at larger occupation numbers, all first and second moments can be reproduced by a statistical mixture of coherent states. For the astrophysical black holes, both changes occur much before the spin-down of the black hole becomes significant."},{"arxiv":"2610.30253","id":"3217976","title":"Mass-Varying Dark Matter, Naturally","authors":"Cédric Delaunay, Seung J. Lee, Yuan Yin, Bingrong Yu","score":6.7,"section":"new","rank":24,"parts":[0.0,0.1,0.22,0.0],"note":"Closest of your papers: [[2856850]] (coupling 0.03, 5 shared references). Closest network paper: [[3089716]] (coupling 0.08, 5 shared references).","abstract":"Ultralight scalars that vary dark-matter masses require protection from quantum corrections. Cyclic $\\mathbb{Z}_N$ symmetries provide this protection but also suppress variation of the mean mass of equally populated partners. Unsuppressed variation typically requires asymmetric reheating through symmetry-breaking couplings that threaten radiative control. We show that scalar-induced mass splittings built into these constructions can instead bias relic abundances through symmetric interactions. The mechanism applies to thermal and nonthermal relics that reach internal equilibrium after production, and permits mass variation over a broad range of timescales."},{"arxiv":"2610.30981","id":"3218090","title":"Construction and phenomenological analysis of dynamical Inverse seesaw neutrino mixing model","authors":"Manish Singh Bisht, Shuchi Bisht, Mayank Joshi, Navjot Hothi","score":6.7,"section":"new","rank":25,"parts":[0.0,0.12,0.16,0.0],"note":"Closest of your papers: [[1686334]] (coupling 0.04, 3 shared references). Closest network paper: [[1625258]] (coupling 0.06, 4 shared references).","abstract":"In this manuscript, a dynamical inverse seesaw neutrino ISS(3+1+1+1) mixing model based on the gauge symmetry $U(1)_{B-L}$ extended by the flavor symmetry $A_{4}\\times Z_{2}$ has been constructed. ISS(3+1+1+1) represents three generations of right-handed neutrinos and an extra three generation of singlets sterile neutrinos, wherein the right-handed neutrinos are triplets under $A_4$ symmetry. Furthermore, the five scalar flavon fields are considered in the model, which reproduce neutrino oscillation data within the NuFIT 6.0 experimental range with statistical $\\text{|pull|}=0.01 σ$. The neutrino mass hierarchy is obtained by minimizing the dynamical $A_4\\times Z_2$ scalar flavon $φ_v$ potential. The effective neutrino mass parameter $m_{ββ}$ for the neutrinoless double beta decay $0vββ$ has been charecterised in the manuscript. The effective neutrino mass parameter spans a finite region in the parameter space rather then being confined to a single point and it is constrained by the KamLAND-Zen excluded band. The model successfully explains active-sterile neutrino mixing and non-unitarity of the PMNS matrix is consistent with the cosmological upper bound. The minimum value of the sum of the active neutrinos' mass turns out to be $m_{i}\\approx 62\\ \\ (99.4)\\ \\text{meV}$ for Normal ordering (Inverted ordering), which lies within the range of both Planck 2018 loose cosmological limit $\\sum m_{i}<120\\ \\text{meV}$ and tighter limit $\\sum m_{i}<72\\ \\text{meV}$ of DESI-2024. Our model immensely favours normal ordering, in agreement with the tighter constraints reported by DESI-2024."},{"arxiv":"2610.30238","id":"3217972","title":"Probing imperfect axions with nuclear clocks","authors":"Salvatore Bottaro, Andrea Caputo, Gilad Perez, Yotam Soreq, Alfredo Stanzione","score":6.4,"section":"new","rank":26,"parts":[0.0,0.11,0.17,0.0],"note":"Closest of your papers: [[1941263]] (coupling 0.03, 9 shared references). Closest network paper: [[1783234]] (coupling 0.06, 24 shared references).","abstract":"We show that $^{229}$Th nuclear clocks can probe departures from the Peccei-Quinn (PQ) solution to the strong CP problem. Explicit PQ breaking or additional CP-violating interactions can shift the minimum of the axion potential and generate CP-violating couplings to matter, inducing a clock response linear in the axion field. We investigate explicit PQ breaking and quark chromo-electric dipole operators as representative realizations of these \\textit{imperfect axion} scenarios, consistent with electric dipole moment constraints. For axion dark matter, the linear signal oscillates at the Compton frequency and can dominate the quadratic response. Even without axion dark matter, the Earth can source a static axion field, enabling fifth-force searches with nuclear clocks."},{"arxiv":"2610.30250","id":"3218007","title":"Continuous Measurement of Quantum Axion Dark Matter","authors":"Yunjia Bao, Dhong Yeon Cheong, Nicholas L. Rodd, Joey Takach, Lian-Tao Wang, Kevin Zhou","score":6.4,"section":"new","rank":27,"parts":[0.0,0.13,0.12,0.0],"note":"Closest of your papers: [[1597138]] (coupling 0.05, 7 shared references). Closest network paper: [[1895232]] (coupling 0.04, 7 shared references).","abstract":"We provide a fully quantum-mechanical description of the continuous measurement of wavelike dark matter. Our focus is cavity haloscopes, although our results inform a broad range of axion searches. We extend the input-output formalism by treating the axion as a quantum field, finding how its quantum state is imprinted onto higher-order moments of observables of the outgoing transmission-line modes. We further develop a novel measurement-record formalism, which computes the joint probability distribution of all measurement outcomes and is well suited to studying the axion in the time domain. With it, we compute the exact axion-induced number distribution for the first time, demonstrating that it is not Poisson. We argue that virialized axion dark matter is expected to be in a Gaussian quantum state, and show that number or quadrature measurements can distinguish this from the predictions of a coherent state or even a Bose-Einstein condensate. Finally, we show that intrinsically quantum effects, such as those from Fock or squeezed axion states, are far too weak to detect."},{"arxiv":"2610.31370","id":"3218163","title":"RIDDLE: Revealing Irregularities through Distributional Discrepancies in Latent-space via Stein-Witness Estimation","authors":"Ali Eren Simsek","score":6.3,"section":"new","rank":28,"parts":[0.0,0.06,0.28,0.0],"note":"Closest of your papers: [[1455793]] (coupling 0.02, 1 shared references). Closest network paper: [[3187354]] (coupling 0.10, 2 shared references).","abstract":"RIDDLE is a new method for resonant anomaly detection that uses a scalar Stein-witness function to identify discrepancies between unlabeled signal-region events and a background distribution inferred from dijet-mass sidebands. The witness is optimized in a latent representation of auxiliary jet observables against a differentiable background reference, without requiring an explicit signal model. The method is evaluated using simulated LHC Olympics dijet events and compared with idealized and supervised benchmarks that share the same statistical construction but have access to additional signal or background information. RIDDLE demonstrates strong signal--background discrimination comparable to the idealized benchmark, while largely preserving the background dijet-mass spectrum under anomaly-score selection. Tests incorporating additional angular information and deliberately mass-correlated features further demonstrate the method's robustness under the studied conditions. Together, these results highlight the potential of RIDDLE as a robust, data-driven approach for enhanced resonance searches that combines effective anomaly discrimination with background-shape preservation."},{"arxiv":"2610.30773","id":"3218076","title":"A Chiral Nelson-Barr Relaxion","authors":"Cristien Arzate, Joshua Iascau","score":6.2,"section":"new","rank":29,"parts":[0.0,0.06,0.26,0.0],"note":"Closest of your papers: [[1365306]] (coupling 0.02, 2 shared references). Closest network paper: [[1863157]] (coupling 0.09, 7 shared references).","abstract":"We present the chiral Nelson-Barr relaxion model, an extension of the Nelson-Barr relaxion framework with a gauged chiral $\\mathrm{U}(1)$ symmetry. It includes vector-like quarks to cancel gauge anomalies and a scalar whose vacuum expectation value generates their masses. The chiral symmetry forbids the leading operators responsible for the Nelson-Barr and clockwork quality problems. Right-handed neutrinos generate light-neutrino masses through the type-I seesaw mechanism and permit thermal leptogenesis. For the particular coupling considered, relaxion phenomenology gives $f_{\\mathrm{max}}^{\\mathrm{pheno}}\\sim 4\\times 10^{11}\\ \\mathrm{GeV}$, about eight times the corresponding phenomenological ceiling in the original model. The model can accommodate thermal leptogenesis if its right-handed-neutrino masses and reheating history satisfy the required temperature bounds."},{"arxiv":"2610.30507","id":"3218049","title":"ULTRAMAN: A Proposed ultrasound detector for macroscopic dark matter","authors":"Oem Trivedi, Robert J. Scherrer, Alfredo Gurrola","score":5.5,"section":"cross","rank":30,"parts":[0.0,0.07,0.21,0.0],"note":"Closest of your papers: [[3094526]] (coupling 0.02, 1 shared references). Closest network paper: [[1998852]] (coupling 0.07, 3 shared references).","abstract":"We propose ULTRAMAN (ULTRAsound Macro ANalyzer), a passive ultrasound array experiment designed to search for macroscopic dark matter (macros) through coherent acoustic disturbances generated as compact objects traverse a controlled target medium. Unlike existing dark matter detectors that primarily rely on scintillation, ionization, or other signatures of energy deposition, ULTRAMAN exploits the acoustic response of matter to reconstruct individual highly supersonic trajectories using synchronized multielement ultrasound arrays. The framework connects macro stopping power and interaction cross section to the resulting acoustic pressure, while the expected event rate probes the macro mass and abundance. A genuine candidate would appear not as an isolated radio frequency spike, but as a correlated multichannel track consistent with a single highly supersonic passage through the target. Representative macro, nuclearite, axion quark nugget, and primordial black hole benchmarks are shown to occupy distinct regions of the resulting acoustic observable space. Existing ultrasound technology offers a realistic route to an event-level terrestrial search for macroscopic dark matter, with null observations translating into complementary constraints on its parameter space."},{"arxiv":"2610.30252","id":"3217999","title":"Neutrino Transition Polarizability","authors":"Matteo Borrello, Michele Tammaro","score":5.2,"section":"new","rank":31,"parts":[0.0,0.06,0.21,0.0],"note":"Closest of your papers: [[1249404]] (coupling 0.02, 5 shared references). Closest network paper: [[3214448]] (coupling 0.07, 7 shared references).","abstract":"We study Neutrino Transition Polarizability, where a light pseudoscalar $φ$ couples active neutrinos to heavy neutral leptons $N$ and interacts with two photons. We consider an effective description of the active - sterile interaction, and a realization within the inverse seesaw mechanism; the coupling to photons is generated by heavy charged states. For $m_N>m_φ$, the decay $N\\toνφ$ can greatly shorten the heavy neutrino lifetime, while $φ\\toγγ$ produces a displaced photon pair. This changes the relevant search strategies, favoring production and decay inside detectors. We discuss existing constraints and estimate the sensitivity of displaced photon searches at DUNE, Belle II, LHCb and FCC-ee, highlighting the complementarity of neutrino scattering and meson and electroweak boson decays."},{"arxiv":"2610.30338","id":"3218104","title":"Machine Learning Neutrino-Nucleus Cross Sections II: More Leptons","authors":"Daniel C. Hackett, Joshua Isaacson, Shirley Weishi Li, Karla Tame-Narvaez, Michael L. Wagman","score":5.1,"section":"new","rank":32,"parts":[0.0,0.05,0.22,0.0],"note":"Closest of your papers: [[2751074]] (coupling 0.02, 1 shared references). Closest network paper: [[2721859]] (coupling 0.08, 4 shared references).","abstract":"Neutrino-nucleus cross sections are essential inputs for long-baseline neutrino oscillation experiments, yet remain challenging to model with high precision. Recent work demonstrated that fully black-box data-driven cross-section models cannot accurately generalize between near- and far-detector fluxes, but imposing Standard-Model symmetries via structure-function parameterizations provides a well-posed learning problem in a simplified DUNE-inspired muon-neutrino disappearance analysis. Here, we extend this framework to multiple lepton flavors and both neutrino and antineutrino beam modes, incorporating the electron appearance channel and enabling a simultaneous determination of $\\sin^2θ_{23}$, $Δm^2_{31}$, and the CP-violating phase $δ_{\\rm CP}$. We find that the learned cross section model recovers the injected oscillation parameters without significant bias, with constraints comparable to those obtained using the exact underlying cross section. Flux uncertainties have more significant effects in the multi-channel case, and incorporating flux nuisance parameters into the learning problem is required for accurate results. Our results demonstrate that this data-driven approach can be extended to the multi-channel measurements needed for long-baseline neutrino oscillation analyses."},{"arxiv":"2607.13128","id":"3180741","title":"Dark Energy and Neutrino Flavor from the Weak Axion","authors":"Pedro Bittar, Carlos E. M. Wagner","score":5.0,"section":"replacement","rank":33,"parts":[0.06,0.02,0.12,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1854224]] (coupling 0.01, 1 shared references). Closest network paper: [[3131952]] (coupling 0.04, 6 shared references).","abstract":"Dynamical dark energy offers an alternative to a cosmological constant with distinct observational signatures. However, the small energy density scale, Hubble-sized mass, and Planckian excursions make simple models fine-tuned and unnatural. In this work, we show that a weak version of the axion, identified with the phase field of the anomalous $U(1)_{B+L}$ of the Standard Model, can generate the scale hierarchies expected for dark energy. The axion potential is controlled by sources of explicit baryon and lepton number violation and is radiatively stable. We show that the leading contribution comes from two inequivalent Weinberg operators, one $B+L$-conserving and one $B+L$-violating, which generate the axion potential. We propose a flavor selection rule in the lepton sector that simultaneously removes the quadratic divergence and dominant temperature-dependent contributions to the effective potential. The resulting potential first appears at quartic order in the axion-dependent neutrino masses and, depending on the flavor model and PMNS parameters, its amplitude is parametrically close to the dark-energy density. Since the scale of dark energy is sensitive to changes in the neutrino parameters, improved measurements of $m_{ββ}$, the sum of neutrino masses, $δ_{\\rm CP}$ and $θ_{23}$ can favor certain models. Cosmologically, the field behaves as thawing quintessence, stays frozen by Hubble friction until late times and never enters the adiabatic regime."},{"arxiv":"2610.31441","id":"3218217","title":"Gravitational Wave Diffractive Images Reveal the Structure of Astrophysical Objects","authors":"Han Gil Choi, Sunghoon Jung, Volodymyr Takhistov","score":4.7,"section":"cross","rank":34,"parts":[0.0,0.06,0.17,0.0],"note":"Closest of your papers: [[2790381]] (coupling 0.02, 5 shared references). Closest network paper: [[2918603]] (coupling 0.06, 6 shared references).","abstract":"Scattering patterns encode the structure of extended objects, as demonstrated by charged particle scattering on atomic nuclei. Gravitational wave (GW) diffraction offers an analogous probe of otherwise invisible mass distributions. At linear order in the lens potential we derive expressions relating the central diffractive image contribution to a gravitationally lensed GW waveform to the Fourier transform of the projected lens density. For finite mass lenses this contribution takes the form of a point mass Born amplitude multiplied by a normalized mass form factor, analogous to that in nuclear scattering. As the frequency of GWs from a merging compact binary source evolves the signal samples this form factor across spatial scales, imprinting lens structure through interference with the primary image. Using full numerical wave optics calculations we quantify the observational reach for extended dark matter objects, primordial black holes halo-dressed by dark matter halos and superradiance clouds of ultralight bosons around black holes. For the considered source populations, five year observations with next generation detectors can distinguish extended lenses from point masses, probing dark matter fractions down to $\\mathcal{O}(10^{-5})$, and halo-dressed primordial black holes from matched bare black holes, probing primordial black hole dark matter fractions down to $\\mathcal{O}(10^{-6})$. For sufficiently close source-lens configurations, scalar superradiance clouds can produce distinguishable diffraction signatures for boson masses of approximately $10^{-17}-10^{-12}~\\mathrm{eV}$. These results provide a framework for characterizing extended dark matter and compact object astrophysical environments."},{"arxiv":"2610.30510","id":"3218051","title":"Same Events, Weaker Bound: Model Dependence in Magellanic Microlensing Limits on Primordial Black Holes","authors":"David Morales-Zapien, Lucas Brown, Stefano Profumo","score":4.6,"section":"cross","rank":35,"parts":[0.0,0.06,0.17,0.0],"note":"Closest of your papers: [[1832796]] (coupling 0.02, 4 shared references). Closest network paper: [[2904988]] (coupling 0.06, 4 shared references).","abstract":"OGLE microlensing of the Magellanic Clouds sets the leading bounds on primordial black holes (PBHs) as dark matter from $10^{-8}$ to $10^{3}\\,M_\\odot$. Holding the detected events and survey efficiencies fixed, we show that changes to the Milky Way halo, the stellar lens populations and the Large Magellanic Cloud halo, each motivated by recent data, weaken the published strict 20-year bound by up to $\\simeq6$, and by over an order of magnitude in an extreme stress test. With primordial clustering, the planetary-mass bound weakens by a factor $3.4$--$6$. We strongly recommend that compact-object dark matter limits be quoted together with their modeling assumptions and, generally, be derived under conservative assumptions."},{"arxiv":"2610.31103","id":"3218131","title":"Interpreting the top quark mass using simulations of top-flavoured mesons","authors":"Alexander Lind","score":4.5,"section":"new","rank":36,"parts":[0.06,0.03,0.07,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[3146383]] (coupling 0.01, 1 shared references). Closest network paper: [[1861144]] (coupling 0.02, 1 shared references).","abstract":"Active work is being done on the issue of the interpretation of the top quark mass in terms of well-defined theoretical definitions. This work considers this issue by simulating fictitious heavy-light top-flavoured mesons with a fixed mass in Pythia 8.3. Within Heavy Quark Effective Theory, the mass of the top mesons can be related to the pole mass of the top quark. By fitting final-state observables in top pair production at current hadron and future lepton colliders, we extract a negative mass difference between the input Pythia mass for the top quark and the pole mass of around $240$-$330$ MeV, consistent with $\\mathcal{O}(Λ_{\\rm QCD})$."}],"refs":{"2810207":{"first":"Gan","year":2024,"nauth":1,"title":"The Hidden Universe Odyssey: From Theoretical Foundations to Cosmological Detections","role":"other"},"2794409":{"first":"Domínguez","year":2024,"nauth":3,"title":"Reopening the <math display=\"inline\"><mi>Z<\/mi><\/math> portal with semi-annihilations","role":"seed"},"2664140":{"first":"D'Agnolo","year":2023,"nauth":4,"title":"The two scales of new physics in Higgs couplings","role":"other"},"2795517":{"first":"Cirelli","year":2024,"nauth":3,"title":"Dark Matter","role":"other"},"2046345":{"first":"Clery","year":2022,"nauth":5,"title":"Gravitational portals with nonminimal couplings","role":"other"},"2663002":{"first":"Barman","year":2023,"nauth":4,"title":"Bremsstrahlung-induced gravitational waves in monomial potentials during reheating","role":"seed"},"2843822":{"first":"Basumatary","year":2024,"nauth":3,"title":"Beyond Hawking evaporation of black holes formed by dark matter in compact stars","ro const ROLE={today:'Listing: new or cross-list',repl:'Listing: replacement',seed:'Your paper',other:'Network paper (other authors)'};
const RANK={today:0,repl:1,seed:2,other:3};
const SEC={new:'New',cross:'Cross-list',replacement:'Replacement'};
const col=n=>`var(--${n.role})`;
const isNew=n=>n.role==='today'||n.role==='repl';
const r=n=>isNew(n)?4+n.score/9:2.6+1.5*Math.log10(1+n.cites)+(n.role==='seed'?1:0);
const auth=n=>n.first+(n.nauth>2?' et al.':n.nauth===2?' + 1':'');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const plain=s=>String(s).replace(/\$/g,'').replace(/\\([a-zA-Z]+)/g,'$1').replace(/[{}^_]/g,'');
const REFS=RAW.refs||{};
// reasons text: [[INSPIRE id]] becomes 'Author Year' with a pop-up (authors, year, title), like the graph's tooltip
const why=s=>esc(s).replace(/\[\[(\d+)\]\]/g,(m,k)=>{const r=REFS[k];return r?`<span class="ref ${r.role}" tabindex="0" data-ref="${k}">${esc(r.first)} ${r.year}</span>`:m});
const tex=el=>{if(window.MathJax&&MathJax.typesetPromise)MathJax.typesetPromise([el]).then(()=>fold()).catch(()=>{})};
const NEWS=N.filter(isNew).sort((a,b)=>a.rank-b.rank);
document.getElementById('eyebrow').innerHTML=`arXiv ${esc(M.cat)} · <a href="${esc(M.url)}" target="_blank" rel="noopener">${esc(M.date)}</a>`;
document.getElementById('dek').textContent=`${M.nrel} of the ${M.nlist} papers in this listing (${M.counts.new} new, ${M.counts.cross} cross-lists, ${M.counts.replacement} replacements) score ${M.threshold} or more for belonging to the reference and citation network of your ${M.nown} papers and the ${M.next} papers by other authors around them. Highest score first.`;
document.getElementById('foot').innerHTML=`<p><b>Score (0–100).</b> 40% direct citations of network papers (each of your papers counts 1, each other network paper 0.6, network papers with over 1,000 citations 0.06; saturating as 1 − e<sup>−x</sup>); 35% bibliographic coupling with your own papers (idf-weighted cosine of INSPIRE-linked reference sets, best match and mean of the top three, 0.30 = full marks); 15% best coupling with the other network papers (0.35 = full marks); 10% authorship (you, or your co-authors).</p>
<p><b>Data.</b> Network: INSPIRE records supplied with the project. Listing papers: INSPIRE records where already harvested (${M.onInspire} of ${M.nlist}); for the rest the reference list was read from the arXiv source and matched to INSPIRE by arXiv number, DOI and texkey. Only links between papers on this page are drawn. Built ${esc(M.built)}.</p>`;
const P=['Direct citations','Coupling to your papers','Coupling to network','Authorship'];
const PS=['Citations','Your papers','Network','Authors'];   // short labels for phones
function list(){const box=document.getElementById('list');
  if(!NEWS.length){box.innerHTML=`<div class="empty">No paper in this listing reaches a score of ${M.threshold}.</div>`;document.getElementById('mainnet').hidden=true;return}
  NEWS.forEach(n=>{const d=document.createElement('article');d.className='paper';d.id='p'+n.i;
    d.innerHTML=`<div class="role" style="color:${col(n)}">#${n.rank} · ${esc(SEC[n.section])} · score ${n.score.toFixed(1)}</div>
    <h2>${esc(n.title)}</h2>
    <div class="authors">${authors(n.authors)} · arXiv:${esc(n.arxiv)}</div>
    <p class="abs">${esc(n.abstract)}</p><button class="linkbtn absmore" type="button" hidden>More</button>
    <p class="why">${why(n.note)}</p>
    <div class="row"><div class="bars">${n.parts.map((v,j)=>`<span><span class="pl">${P[j]}</span><span class="ps">${PS[j]}</span> <span class="mb"><i style="width:${Math.round(v*100)}%"></i></span></span>`).join('')}</div><span>${n.nlinked} of ${n.nref} references linked to INSPIRE · refs from ${esc(n.src)}</span></div>
    <div class="links">${n.id?`<a href="https://inspirehep.net/literature/${n.id}" target="_blank" rel="noopener">INSPIRE</a>`:''}<a href="https://arxiv.org/abs/${esc(n.arxiv)}" target="_blank" rel="noopener">arXiv</a><a href="https://arxiv.org/pdf/${esc(n.arxiv)}" target="_blank" rel="noopener">PDF</a>${n.html?`<a href="https://arxiv.org/html/${esc(n.arxiv)}" target="_blank" rel="noopener" title="arXiv's experimental HTML version">HTML</a>`:''}<button class="linkbtn graphbtn" type="button">Show in network</button></div>`;
    d.querySelector('.graphbtn').addEventListener('click',()=>pick(n,true));
    d.querySelector('.absmore').addEventListener('click',e=>{const o=d.classList.toggle('open');e.target.textContent=o?'Less':'More'});
    box.appendChild(d)});
  toc();tex(box)}
// Phones: long author lists show the first 3 and "et al." (tap to expand); abstracts fold to 3 lines with More.
function authors(s){const a=String(s||'').split(', ');if(a.length<=3)return esc(s);
  return `<span class="au-short">${esc(a.slice(0,3).join(', '))} <button class="aubtn" type="button" aria-label="Show all ${a.length} authors">et al. (+${a.length-3})</button></span><span class="au-full">${esc(s)}</span>`}
document.addEventListener('click',e=>{const b=e.target.closest('.aubtn');if(b)b.closest('.authors').classList.add('open')});
function fold(){document.querySelectorAll('.paper').forEach(d=>{const p=d.querySelector('.abs'),b=d.querySelector('.absmore');
  if(!p||!b||d.classList.contains('open'))return;b.hidden=!(p.scrollHeight>p.clientHeight+2)})}
function toc(){const t=document.getElementById('toc');if(!NEWS.length)return;t.hidden=false;
  const X=RAW.next||[];
  t.innerHTML=`<h3>In this listing</h3><ol>${NEWS.map(n=>`<li><a href="#p${n.i}"><span class="sc${n.role==='repl'?' repl':''}">${n.score.toFixed(0)}</span><span class="tt">${esc(n.title)}</span></a></li>`).join('')}${X.length?`<li class="more-link"><a href="#more"><span class="sc">+${X.length}</span><span class="tt">The next ${X.length} papers by score (folded)</span></a></li>`:''}</ol>`;
  const m=t.querySelector('.more-link a');if(m)m.addEventListener('click',()=>{document.getElementById('more').open=true});tex(t)}
let sel=NEWS[0]||null, hover=null, query='', G;
const svg=d3.select('#svg'), tip=document.getElementById('tip');
function draw(){
  if(!NEWS.length)return;
  const RNG=d3.randomLcg(11);
  const W=Math.max(300,document.getElementById('chart').clientWidth), H=W<600?500:480, m={l:16,r:16,t:20,b:34};
  svg.attr('viewBox',`0 0 ${W} ${H}`); svg.selectAll('*').remove();
  const yrs=d3.extent(N,n=>n.year);
  const x=d3.scaleLinear().domain([yrs[0]-.5,yrs[1]+1.2]).range([m.l+8,W-m.r-8]);
  const ticks=x.ticks(W<600?6:12).filter(t=>Number.isInteger(t)&&t<=yrs[1]);
  svg.append('g').attr('class','grid').selectAll('line').data(ticks).join('line').attr('x1',d=>x(d)).attr('x2',d=>x(d)).attr('y1',m.t).attr('y2',H-m.b);
  svg.append('g').attr('class','axis').attr('transform',`translate(0,${H-m.b})`).call(d3.axisBottom(x).tickValues(ticks).tickFormat(d3.format('d')).tickSizeOuter(0));
  const cy=(m.t+H-m.b)/2, xf=n=>isNew(n)?x(yrs[1]+.75):x(n.year);
  const sim=N.map(n=>({n,x:xf(n)+(RNG()-.5)*4,y:cy+(RNG()-.5)*H*.5}));
  const links=E.map(e=>({source:sim[e.s],target:sim[e.t],s:e.s,t:e.t,k:e.k}));
  d3.forceSimulation(sim).force('x',d3.forceX(s=>xf(s.n)).strength(1)).force('y',d3.forceY(cy).strength(.04))
    .force('link',d3.forceLink(links).strength(.03)).force('charge',d3.forceManyBody().strength(-40))
    .force('col',d3.forceCollide(s=>r(s.n)+2)).stop().tick(320);
  sim.forEach(s=>{s.y=Math.max(m.t+8,Math.min(H-m.b-8,s.y));s.x=Math.max(m.l+4,Math.min(W-m.r-4,s.x))});
  G=svg.append('g');
  G.append('g').selectAll('path').data(links).join('path').attr('class',l=>'edge '+l.k)
    .attr('d',l=>{const a=l.source,b=l.target;return `M${a.x},${a.y}Q${(a.x+b.x)/2},${(a.y+b.y)/2-Math.abs(a.x-b.x)*.12} ${b.x},${b.y}`});
  G.append('g').selectAll('circle').data([...sim].sort((a,b)=>RANK[b.n.role]-RANK[a.n.role])).join('circle')
    .attr('class','node').attr('cx',s=>s.x).attr('cy',s=>s.y).attr('r',s=>r(s.n)).attr('fill',s=>col(s.n))
    .on('pointerenter',(ev,s)=>{hover=s.n;showTip(ev,s.n);paint()}).on('pointermove',(ev,s)=>showTip(ev,s.n))
    .on('pointerleave',()=>{hover=null;tip.hidden=true;paint()}).on('click',(ev,s)=>pick(s.n,false));
  const lab=sim.filter(s=>isNew(s.n)||s.n.role==='seed'||s.n.deg>=3);
  const L=lab.map(s=>{const right=s.x>W*.8,t=isNew(s.n)?`#${s.n.rank} ${s.n.first}`:`${s.n.first} ${s.n.year}`,w=t.length*6.2;return{s,t,right,x0:right?s.x-r(s.n)-4-w:s.x+r(s.n)+4,w,y:s.y+4}}).sort((a,b)=>a.y-b.y);
  const placed=[];L.forEach(l=>{let k=0;while(k<40&&placed.some(p=>l.x0<p.x0+p.w&&p.x0<l.x0+l.w&&Math.abs(l.y-p.y)<13)){l.y+=13*(k%2?-1:1)*(1+Math.floor(k/2));k++;l.y=Math.max(m.t+10,Math.min(H-m.b-4,l.y))}placed.push(l)});
  G.append('g').selectAll('text').data(L).join('text').attr('class','nlabel').attr('x',l=>l.right?l.s.x-r(l.s.n)-4:l.s.x+r(l.s.n)+4).attr('y',l=>l.y)
    .attr('text-anchor',l=>l.right?'end':'start').text(l=>l.t);
  paint();
}
function showTip(ev,n){const b=document.getElementById('chart').getBoundingClientRect();tip.hidden=false;tip.textContent=`${auth(n)} (${n.year}) — ${plain(n.title)}`+(isNew(n)?` · score ${n.score}`:'');
  let L=ev.clientX-b.left+12;if(L>b.width-290)L=ev.clientX-b.left-290;tip.style.left=Math.max(4,L)+'px';tip.style.top=(ev.clientY-b.top+12)+'px'}
function paint(){if(!G)return;const f=hover||sel,on=new Set();if(f){on.add(f.i);f.out.forEach(i=>on.add(i));f.inn.forEach(i=>on.add(i))}
  svg.classed('dim',!!f);
  G.selectAll('path.edge').attr('class',l=>'edge '+l.k+(!f?'':l.s===f.i?' hot out':l.t===f.i?' hot in':''));G.selectAll('path.edge.hot').raise();
  G.selectAll('circle').classed('on',s=>on.has(s.n.i)).classed('sel',s=>sel&&s.n.i===sel.i).classed('match',s=>query&&`${s.n.first} ${s.n.title} ${s.n.arxiv} ${s.n.authors||''}`.toLowerCase().includes(query));
  G.selectAll('text.nlabel').classed('on',l=>on.has(l.s.n.i))}
function panel(){const p=document.getElementById('panel'),n=sel;
  if(!n){p.innerHTML='<p>Select a paper in the network.</p>';return}
  const links=`<div class="links">${n.id?`<a href="https://inspirehep.net/literature/${n.id}" target="_blank" rel="noopener">INSPIRE</a>`:''}${n.arxiv?`<a href="https://arxiv.org/abs/${esc(n.arxiv)}" target="_blank" rel="noopener">arXiv</a>`:''}</div>`;
  if(isNew(n)) p.innerHTML=`<div class="role" style="color:${col(n)}">#${n.rank} · ${esc(SEC[n.section])} · score ${n.score.toFixed(1)}</div><h4>${esc(n.title)}</h4>
   <div class="meta">${esc(auth(n))} · arXiv:${esc(n.arxiv)}</div><p>${why(n.note)}</p><div class="links"><a href="#p${n.i}">Back to abstract</a></div>`;
  else p.innerHTML=`<div class="role" style="color:${col(n)}">${esc(ROLE[n.role])}</div><h4>${esc(n.title)}</h4>
   <div class="meta">${esc(auth(n))} · ${n.year}${n.arxiv?' · arXiv:'+esc(n.arxiv):''}</div>
   <div class="stats"><span>${n.cites.toLocaleString()} citations</span><span>${n.inn.filter(i=>isNew(N[i])).length} of the matches link here</span></div>${links}`;
  tex(p)}
function pick(n,scroll){sel=n;panel();paint();document.querySelectorAll('.paper').forEach(el=>el.classList.toggle('sel',el.id==='p'+n.i));if(scroll)document.getElementById('chart').scrollIntoView({behavior:'smooth',block:'nearest'})}
const present=new Set(N.map(n=>n.role));
document.getElementById('legend').innerHTML=['today','repl','seed','other'].filter(k=>present.has(k)).map(k=>`<span><i class="dot" style="background:var(--${k})"></i>${esc(ROLE[k])}</span>`).join('')+'<span style="color:var(--fg-3)">Listing papers: size ∝ score; others: size ∝ log(citations)</span>';
document.getElementById('q').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();paint()});
svg.on('click',ev=>{if(ev.target.tagName!=='circle'){sel=null;panel();paint()}});
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(draw,200)});
function nextList(){const X=RAW.next||[];if(!X.length)return;const box=document.getElementById('nextlist'),more=document.getElementById('more');
  more.hidden=false;more.querySelector('summary').firstChild.textContent=`The next ${X.length} papers by score `;
  document.getElementById('moresub').textContent=`below the threshold of ${M.threshold}, not drawn in the network`;
  box.innerHTML=X.map(n=>`<li><div class="role" style="color:var(--${n.section==='replacement'?'repl':'today'})">#${n.rank} · ${esc(SEC[n.section])} · score ${n.score.toFixed(1)}</div>
    <div class="t">${esc(n.title)}</div><div class="authors">${authors(n.authors)} · arXiv:${esc(n.arxiv)}</div>
    ${n.note?`<p class="why">${why(n.note)}</p>`:''}
    <details class="abs"><summary>Abstract</summary><p class="abs">${esc(n.abstract)}</p></details>
    <div class="links">${n.id?`<a href="https://inspirehep.net/literature/${n.id}" target="_blank" rel="noopener">INSPIRE</a>`:''}<a href="https://arxiv.org/abs/${esc(n.arxiv)}" target="_blank" rel="noopener">arXiv</a><a href="https://arxiv.org/pdf/${esc(n.arxiv)}" target="_blank" rel="noopener">PDF</a></div></li>`).join('');
  more.addEventListener('toggle',()=>{if(more.open)tex(box)})}
const rtip=document.getElementById('reftip');let rcur=null;
function refShow(el){const r=REFS[el.dataset.ref];if(!r)return;rcur=el;rtip.textContent=`${auth(r)} (${r.year}) — ${plain(r.title)}`;rtip.hidden=false;
  const b=el.getBoundingClientRect(),t=rtip.getBoundingClientRect();let L=Math.min(Math.max(8,b.left),innerWidth-t.width-8),T=b.bottom+6;
  if(T+t.height>innerHeight-8)T=b.top-t.height-6;rtip.style.left=L+'px';rtip.style.top=T+'px'}
function refHide(){rtip.hidden=true;rcur=null}
document.addEventListener('pointerover',e=>{const el=e.target.closest('.ref');if(el&&e.pointerType==='mouse')refShow(el)});
document.addEventListener('pointerout',e=>{if(e.target.closest('.ref')&&e.pointerType==='mouse')refHide()});
document.addEventListener('click',e=>{const el=e.target.closest('.ref');if(el)refShow(el);else if(rcur)refHide()});
document.addEventListener('focusin',e=>{const el=e.target.closest('.ref');if(el)refShow(el)});
document.addEventListener('focusout',e=>{if(e.target.closest('.ref'))refHide()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')refHide()});
addEventListener('scroll',()=>{if(rcur)refHide()},{passive:true});
list();nextList();fold();draw();panel();
window.addEventListener('load',()=>{tex(document.getElementById('list'));tex(document.getElementById('panel'));fold();
  if(window.MathJax&&MathJax.startup&&MathJax.startup.promise)MathJax.startup.promise.then(()=>setTimeout(fold,300))});
addEventListener('resize',()=>{clearTimeout(window._ft);window._ft=setTimeout(fold,200)});
</script>
