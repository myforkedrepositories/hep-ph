3,46,"c"],[97,149,"c"],[166,41,"c"],[28,126,"k"],[135,166,"c"],[14,46,"c"],[123,60,"c"],[133,119,"c"],[7,129,"k"],[87,165,"c"],[151,161,"c"],[159,36,"c"],[141,105,"c"],[1,135,"k"],[104,128,"c"],[135,144,"c"],[1,138,"c"],[33,139,"k"],[135,96,"c"],[153,156,"c"],[170,166,"c"],[40,105,"c"],[108,40,"c"],[0,143,"k"],[9,145,"c"],[29,147,"k"],[22,46,"c"],[145,97,"c"],[144,155,"c"],[32,142,"k"],[140,169,"c"],[75,114,"c"],[149,60,"c"],[56,121,"c"],[19,83,"k"],[28,54,"k"],[34,154,"k"],[75,41,"c"],[102,168,"c"],[1,156,"c"],[129,157,"c"],[164,50,"c"],[118,112,"c"],[91,37,"c"],[166,155,"c"],[44,117,"c"],[84,154,"c"],[171,37,"c"],[135,170,"c"],[25,161,"k"],[65,90,"c"],[44,132,"c"],[124,149,"c"],[44,125,"c"],[94,152,"c"],[127,121,"c"],[57,37,"c"],[1,166,"c"],[4,168,"c"],[66,137,"c"],[143,112,"c"],[156,117,"c"],[90,59,"c"],[166,138,"c"],[63,60,"c"],[151,109,"c"],[20,46,"c"],[117,169,"c"],[12,46,"c"],[106,128,"c"],[39,156,"c"],[44,78,"c"],[8,176,"k"],[60,169,"c"],[39,78,"c"],[136,102,"c"]],"next":[{"arxiv":"2611.02824","id":"3222349","title":"Axion Emission Controlled by Ion Motion in Relativistic Beam-Plasma Filamentation","authors":"Zhi-Bo Zhang, Pei-Lun He, Zheng Gong, Yue-Yue Chen","score":9.1,"section":"new","rank":37,"parts":[0.06,0.14,0.18,0.0,0.0],"note":"Also cites widely used network papers: [[1783234]]. Closest of your papers: [[1941263]] (coupling 0.05, 8 shared references). Closest network paper: [[1758016]] (coupling 0.06, 7 shared references).","abstract":"The interaction between relativistic electron beams and plasma can generate magnetic fields with strengths of $\\sim 10^4$ T far exceeding conventional magnets, which offers a promising environment for producing weakly coupled particles. Using particle-in-cell simulations incorporating an axion-emission model, we show that a 10-GeV electron beam traversing dense plasma emits a forward-collimated axion beam during the ion-mediated nonlinear stage of current filamentation instability. Although the electron-driven linear instability seeds the filaments, ion motion governs their subsequent expansion and coalescence. This evolution reinjects cold-core electrons into large-amplitude orbits in phase space, where they repeatedly cross the strong-field flanks of neighboring magnetic vortices, thereby enhancing axion emission. At a background-plasma density of $\\sim 10^{21}\\mathrm{cm}^{-3}$, suppressing ion motion reduces the axion yield by a factor of 14.5. Our results demonstrate that ion dynamics play a crucial role in characterizing the emission of weakly coupled particles induced by relativistic filamentation instabilities, suggesting a new beam-driven method for probing the axion-electron interaction at accelerators."},{"arxiv":"2507.23747","id":"2955882","title":"Features of Charged Lepton Flavor Violation in an $A_4$ Symmetric Neutrino Mass Model","authors":"Pravesh Chndra Awasthi, Jai More, Akhila Kumar Pradhan, Kumar Rao, Purushottam Sahu, S. Uma Sankar","score":8.4,"section":"replacement","rank":38,"parts":[0.0,0.06,0.2,0.0,0.37],"note":"Closest of your papers: [[2690106]] (coupling 0.02, 2 shared references). Closest network paper: [[2068399]] (coupling 0.07, 9 shared references). Shared topics: lepton flavor violation, neutrino mass.","abstract":"Neutrino flavour oscillations imply that there must be charged lepton flavour violation (CLFV) also. Different neutrino mass models predict different patterns of CLFV decays. Neutrino mass generation through standard see-saw mechanisms leads to the prediction that the branching ratios of meson CLFV decays will always be smaller than the corresponding radiative CLFV decays. In this work, we analyse an interesting neutrino mass model, based on $A_4$ symmetry, in which the symmetry and the symmetry-breaking pattern lead the neutrino mixing matrix to be of tri-bimaximal (TBM) form. In this model, we find that the meson CLFV decay amplitudes are not correlated to the corresponding radiative CLFV amplitudes, unlike in the case of see-saw models. The branching ratios of radiative CLFV decays are predicted to be negligibly small in this model, but those of the meson CLFV decays can be large enough to be observable in the near future."},{"arxiv":"2607.15020","id":"3181075","title":"High resolution Lyman-α forest constraints on dark matter-neutrino scattering","authors":"Markus R. Mosbech, Olga Garcia-Gallego, Vid Iršič, Matteo Viel, Julien Lesgourgues","score":8.4,"section":"replacement","rank":39,"parts":[0.0,0.1,0.28,0.0,0.13],"note":"Closest of your papers: [[2964960]] (coupling 0.03, 6 shared references). Closest network paper: [[3096515]] (coupling 0.10, 12 shared references). Shared topics: dark matter.","abstract":"We present new constraints on models of dark matter interacting with neutrino, based on high-resolution Lyman-$α$ forest data. We perform a suite of full hydrodynamical simulations of these models, spanning a range of interaction strengths and thermal histories. We train an emulator on the simulation results. A Monte Carlo Markov Chain analysis yields an upper limit on the interaction strength of $u_{νχ} \\leq1.5\\times10^{-8}$ (95% C.L.), which is the strongest direct bound to date on such interactions. Our results exclude previous hints of non-zero interactions presented in the literature. We furthermore compare our results to those obtained by mapping warm dark matter constraints to other models with suppressed small-scale structure, and find that these methods would overestimate the constraining power for this model."},{"arxiv":"2502.00445","id":"2874730","title":"Electroweak baryogenesis from charged current anomalies in $B$ meson decays","authors":"Peter Athron, Michael J. Ramsey-Musolf, Cristian Sierra, Yongcheng Wu","score":7.4,"section":"replacement","rank":40,"parts":[0.06,0.06,0.23,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1869725]] (coupling 0.02, 1 shared references). Closest network paper: [[2051136]] (coupling 0.08, 17 shared references).","abstract":"We demonstrate for the first time that new physics explaining the long standing charged $B$ meson anomalies, $R(D^{(*)})$, can be the source of CP violation that explains the observed baryon asymmetry of the universe (BAU). We consider the general two Higgs doublet model with complex Yukawa couplings and compute the BAU in the semiclassical formalism, using a novel analytic approximation for the latter. After imposing constraints from both flavor observables and the electron electric dipole moment (eEDM), and assuming the occurrence of a sufficiently strong first order electroweak phase transition, we find that the observed BAU can be generated for benchmark points within the region favored by the global flavor fit. Reaching the observed BAU relies on optimized values of the phase transition parameters, which we treat as inputs. These scenarios, which explain both $R(D^{(*)})$ and the BAU, can be probed with future eEDM experiments and Higgs factories measurements."},{"arxiv":"2611.00306","id":"3221785","title":"Proposal for the resolution of the disagreement between DAMA and other Underground Dark Matter Experiments","authors":"C. D. Froggatt, H. B. Nielsen","score":7.3,"section":"new","rank":41,"parts":[0.0,0.07,0.2,0.0,0.22],"note":"Closest of your papers: [[3094526]] (coupling 0.03, 1 shared references). Closest network paper: [[1862804]] (coupling 0.07, 2 shared references). Shared topics: dark matter, dark matter particle.","abstract":"It is a great mystery still needing a solution that the underground experiments looking for dark matter disagree, in tIt is a great mystery still needing a solution that the underground experiments looking for dark matter disagree, in the sense that DAMA/LIBRA has found dark matter with a confidence level of several standard deviations, while neither the xenon based experiments nor even the experiments using the same target material NaI(Tl) as DAMA see the same amount of dark matter. We propose to solve this enigma by postulating that the dark matter gets excited during its passage through the mountain shielding from outer space down to the experimental halls; the DAMA experiment is namely about twice as deep as the ANAIS and COSINE-100 experiments, so that there is longer passage time for DAMA, which thus gets more excited dark matter particles. The xenon-scintillator experiments have their strong limits for dark matter making itself felt via nucleus recoils, and thus we can just assume that the excited dark matter mainly emits e.g. electrons, and the xenon-experiments would hardly see such dark matter. The single event recently seen by LUX/ZEPPELIN could be due to a low rate of nucleus emission in addition to the hypothesised electrons."},{"arxiv":"2611.03373","id":"3222389","title":"Towards AI-Agent-Accelerated Research in High-Energy Physics: A Case Study in Monte Carlo Analysis","authors":"Tianqi Gao, Ruobing Jiang","score":7.2,"section":"new","rank":42,"parts":[0.0,0.15,0.17,0.0,0.0],"note":"Closest of your papers: [[1455793]] (coupling 0.06, 4 shared references). Closest network paper: [[1674879]] (coupling 0.06, 3 shared references).","abstract":"We investigate how far contemporary LLM-based agents can participate in multistep computational high-energy-physics research under reproducible human supervision. Using a previously published CEPC Bell-observable analysis in $e^+e^- \\to ZH$, $Z \\to q\\bar q$, $H \\to ZZ^* \\to 4μ$ as a case study, we test two capabilities. First, the agent performs an instruction-constrained reproduction: it is explicitly instructed not to use the published numerical results as analysis targets, although no technical information-access barrier is imposed. The analysis definition is fixed before the formal comparison, and the resulting detector-level $I_3$ central values reproduce the four published benchmark points to within about 2% without retuning to those values. Second, the agent is used for an open-ended extension with no target answer supplied. Using 200,000 fast-simulated events, a stage-resolved audit identifies muon isolation as the largest single contribution to the hard-to-detector shift, and subsequent diagnostics connect the effect to angle-dependent isolation efficiency, proximity to the hard $Z \\to q\\bar q$ system, and mixed electromagnetic activity from muon final-state radiation and hadron decays. Throughout, the agent assists with workflow planning, code and configuration inspection, Monte Carlo production, anomaly diagnosis, control construction, statistical analysis, and result organization, while state-changing actions and final interpretation remain under human control. The study shows that the value of AI agents in HEP may lie not only in faster code generation, but in faster scientific iteration, and motivates systematic benchmarking across historical HEP analyses using correctness, human intervention, and researcher-time efficiency as explicit metrics."},{"arxiv":"2607.26184","id":"3184298","title":"Lepton-Number Violation in Higgs Effective Field Theory: Complete Operator Basis and Type-II Seesaw Matching","authors":"Zizhou Ge, Huayang Song, Xia Wan","score":6.9,"section":"replacement","rank":43,"parts":[0.0,0.04,0.29,0.0,0.12],"note":"Closest of your papers: [[1249404]] (coupling 0.02, 3 shared references). Closest network paper: [[2163299]] (coupling 0.10, 8 shared references). Shared topics: seesaw model.","abstract":"We construct a complete and nonredundant basis of lepton-number-violating (LNV) operators in the Higgs effective field theory (HEFT) through $\\mathcal{O}(p^4)$, including their full flavor multiplicities. Using a complex dressed spurion that encodes the $B-L$ charge, we classify the $ΔL=2$ and $ΔL=4$ sectors, including baryon-number-violating operators, and independently validate the counting using Hilbert-series methods. As a concrete application, we present the first complete tree-level matching of the type-II seesaw model onto HEFT through $\\mathcal{O}(p^4)$, covering the bosonic, lepton-number-conserving, and LNV sectors. Using the nonlinear field representation and primary-HEFT power counting, we retain the full dependence of the matching coefficients on the independent scalar masses, the neutral-scalar mixing, and the doublet and triplet vacuum expectation values. We compare our results with the corresponding real-triplet matching and a broken-phase effective field theory. We further discuss implications for LNV processes, Higgs physics, and electroweak observables."},{"arxiv":"2611.02007","id":"3222276","title":"Electroweak-Scale Cosmic Magnetism: Magnetogenesis, Baryogenesis, Phase Transitions and Gravitational Waves","authors":"Fayez Abu-Ajamieh","score":6.6,"section":"new","rank":44,"parts":[0.0,0.01,0.26,0.0,0.22],"note":"Closest of your papers: [[3094526]] (coupling 0.00, 1 shared references). Closest network paper: [[2134073]] (coupling 0.09, 12 shared references). Shared topics: early universe, gravitational wave.","abstract":"Magnetic fields, the baryon asymmetry of the Universe, and stochastic gravitational waves provide complementary probes of physics in the early Universe. Near the electroweak scale, these phenomena are not necessarily independent. The electroweak anomaly allows hypermagnetic helicity to exchange charge with chiral fermions, sphalerons can change baryon and lepton number, and first-order phase transitions in extensions of the Standard Model can drive plasma motion, magnetogenesis, and gravitational waves. In this review, we explain these connections and examine the literature needed to make quantitative predictions. We begin with the properties of primordial magnetic fields and the electroweak plasma, then discuss the mechanisms that produce magnetic fields, the conversion between helicity and baryon number, magnetic backreaction, and the evolution of the field to the present day. We also review the observational constraints and recent developments, including gauge-invariant descriptions of magnetic flux through the crossover and reconnection-controlled field evolution. Particular attention is given to the assumptions behind commonly used formulas and to the distinction between established results and model-dependent estimates. We argue that the most useful way forward is to predict the baryon abundance, present-day magnetic-field spectrum, and gravitational-wave signal from the same microscopic model, with consistent treatment of the intervening plasma dynamics."},{"arxiv":"2611.02987","id":"3222372","title":"Machine-learning discovery potential for a heavy Higgs boson in $e^+e^-\\to ZH$ at a future lepton collider","authors":"Majid Hashemi","score":6.4,"section":"new","rank":45,"parts":[0.0,0.09,0.25,0.0,0.0],"note":"Closest of your papers: [[1455793]] (coupling 0.03, 3 shared references). Closest network paper: [[2686887]] (coupling 0.09, 8 shared references).","abstract":"A study of the discovery potential for a CP-even heavy neutral Higgs boson $H$ is presented in the Type-I two-Higgs-doublet model (2HDM) at a future $e^+e^-$ collider with $\\sqrt{s}=500~\\mathrm{GeV}$, focusing on the process $e^+e^-\\to ZH$ with $H\\to WW$, and with $Z\\to\\ell\\ell$ or $Z\\toνν$. The final states are four jets plus two leptons ($4j2\\ell$) and four jets plus missing transverse momentum ($4j2ν$). Both a Boosted Decision Tree (BDT) and a Deep Neural Network (DNN) were trained on the same inputs. The BDT was found to be substantially faster in training and inference without any loss of performance, and it is therefore the classifier used in the interpretation. Three strategies are compared: a cut-based analysis, a one-dimensional BDT selection trained per mass point, and a two-dimensional (BDT $\\times$ $m_H$) template analysed with a profile likelihood. The 2D template improves the expected discovery significance by a factor of $2.5$--$3.6$ in the $4j2\\ell$ channel and by a factor of $5$--$18$ in the $4j2ν$ channel relative to the cut-based analysis, with the largest gains at high $m_H$ where the cut-based mass window loses efficiency. We translate the expected exclusions into $95\\%$ CL upper limits on $σ\\times$ BR and discuss the implications for the Type-I 2HDM parameter space."},{"arxiv":"2611.01997","id":"3222274","title":"Boundedness from below in the real Weinberg three-Higgs-doublet model","authors":"Fayez Abu-Ajamieh","score":6.3,"section":"new","rank":46,"parts":[0.0,0.08,0.25,0.0,0.0],"note":"Closest of your papers: [[1803365]] (coupling 0.03, 1 shared references). Closest network paper: [[2815355]] (coupling 0.09, 4 shared references).","abstract":"We study the boundedness-from-below (BFB) conditions of the quartic potential in the real Weinberg three-Higgs-doublet model (3HDM). Unlike an analysis restricted to neutral Higgs fields, a complete stability test must also allow for charge-breaking directions. We show that the problem can be reduced to a finite set of 28 stationary configurations, 14 neutral and 14 charged, each of which can be treated using a linear system of size at most four. The main simplification comes from the one-dimensional kernel of the Gram matrix for charged configurations, while the phase equations reduce to two possibilities: aligned phases or phases forming a closed triangle. We further show how to deal exactly with singular choices of the couplings by introducing an auxiliary deformation and taking an algebraic limit. For rational couplings, the normalized minimum is rational and an attaining field configuration can be constructed algebraically. We discuss analytical examples, exact checks, and comparisons with numerical minimization and StableWein. Our result applies to arbitrary real quartic couplings; it does not cover complex phase coefficients or settle the full-potential stability problem when the quartic is flat."},{"arxiv":"2611.02559","id":"3222326","title":"Thermal Festina Lente","authors":"Fayez Abu-Ajamieh, Nobuchika Okada, Roman Pasechnik, Victoria Venken, Zhi-Wei Wang","score":6.2,"section":"cross","rank":47,"parts":[0.0,0.11,0.19,0.0,0.0],"note":"Closest of your papers: [[3184726]] (coupling 0.03, 8 shared references). Closest network paper: [[2802615]] (coupling 0.07, 7 shared references).","abstract":"According to the Festina Lente bound, particles charged under a $U(1)$ gauge field cannot be too light. Otherwise, the largest charged black holes of de Sitter space would discharge in a way that leads to a crunching singularity in violation of cosmic censorship. The Festina Lente bound has previously been extended to also include a background of thermal radiation, but where vacuum energy still dominates cosmic evolution, which imposes a maximal temperature $T\\leq T_{\\max}=(cV/σ)^{1/4}$. We extend this analysis by accounting for thermal enhancement of the discharge process and making the analysis more quantitative. The result is a bound $m\\gtrsim\\ell (cV/σ)^{1/4}$ on the masses of charged particles. Here, $\\ell$ is a term that depends logarithmically on the gauge coupling and particle charge. At weak coupling this leads to a significantly stronger constraint than the $\\sqrt{gq}$ scaling of the original Festina Lente bound. As a result, the present vacuum energy requires every particle of charge $10^{-26}\\lesssim gq\\lesssim e$ to be heavier than $0.03$--$0.2$ eV, provided its gauge boson is lighter than the Hubble scale. An unbroken gauged $B-L$ with Dirac neutrinos gives $m_{ν,{\\rm lightest}}\\gtrsim10$--$43$ meV for $10^{-29}\\lesssim g_{B-L}\\lesssim10^{-24}$, in tension with the DESI DR2 limit once $g_{B-L}\\gtrsim7\\times10^{-28}$. The same limit bounds a neutrino millicharge to $ε_ν\\lesssim2\\times10^{-27}$. We also revisit the Standard Model effective field theory constraints from the electroweak phase transition. During slow-roll inflation the Standard Model electron violates the bound over the whole range of Hubble rates allowed by the CMB tensor limit and by nucleosynthesis, unless the photon is Higgsed, its coupling is suppressed, or one considers very fine-tuned versions of Higgs inflation."},{"arxiv":"2606.18088","id":"3169264","title":"Ultra-High-Energy Cosmic Ray Boosted Relic Neutrinos","authors":"Jiajie Zhang, Jiajun Liao","score":6.2,"section":"replacement","rank":48,"parts":[0.06,0.02,0.13,0.0,0.15],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[3130296]] (coupling 0.01, 1 shared references). Closest network paper: [[3095306]] (coupling 0.05, 5 shared references). Shared topics: neutrino mass.","abstract":"Ultra-high-energy cosmic rays (UHECRs) can boost relic neutrinos to high energies through Standard Model (SM) neutral-current interactions, providing an indirect probe of the cosmic neutrino background (C$ν$B). In this work, we perform a systematic study of the diffuse UHECR-boosted C$ν$B flux including elastic neutrino--nucleon scattering (ES), coherent elastic neutrino--nucleus scattering (COH), incoherent neutrino--nucleus scattering (INCOH), baryon-resonance production (RES), and deep inelastic scattering (DIS). For the UHECR flux, we use mixed-composition spectra obtained from the UHECR propagation code PriNCe and from the H3a and H4a implementations of the Hillas model, together with SFR, QSO, and GRB source evolution models. We find a clear hierarchy of scattering channels as a function of boosted neutrino energy. The coherent scattering dominates at low-energy neutrino flux for heavy nuclear components, while ES and INCOH become important once individual nucleons are resolved. The RES channel gives a non-negligible contribution in the high-energy region, and DIS appears only at the highest energies and is most visible for the H4a case. Using current IceCube and Pierre Auger Observatory data, we obtain upper limits on the C$ν$B overdensity. Our results show that reliable predictions of the UHECR-boosted C$ν$B signal require a combined treatment of the relevant SM scattering channels, UHECR composition, source evolution, and the neutrino mass spectrum."},{"arxiv":"2611.03476","id":"3222435","title":"Higgs pair production and Higgs potential in arbitrary renormalisable extensions of the Higgs sector","authors":"Henning Bahl, Johannes Braathen, Martin Gabelmann, Kateryna Radchenko Serdula, Georg Weiglein","score":5.8,"section":"new","rank":49,"parts":[0.0,0.03,0.33,0.0,0.0],"note":"Closest of your papers: [[2751074]] (coupling 0.01, 1 shared references). Closest network paper: [[2845027]] (coupling 0.12, 12 shared references).","abstract":"Higgs self-interactions are crucial for probing the up to now largely unknown form of the Higgs potential that is realised in nature. Higgs boson pair production at the (High-Luminosity) LHC is of prime importance in this context as it provides experimental access to the trilinear Higgs self-interaction that enters at leading order in this process. The predictions for the trilinear Higgs self-couplings and the shape of the Higgs potential can vastly differ from the predictions of the Standard Model (SM) as a consequence of physics beyond the SM (BSM). If additional particles are relatively light (but in agreement with all existing experimental and theoretical constraints), their effects may not necessarily be accurately described by established effective field theory methods. Because of the potentially large modifications compared to the SM predictions the di-Higgs process has a high sensitivity for probing BSM physics. In order to enable the comparison between experiment and theory for a wide range of BSM models, automatised predictions for double Higgs production are in order. In this contribution to the LHC Higgs Working Group Report 5 we present \\texttt{anyHH}, a novel tool for calculating the Higgs boson pair production cross-section in gluon fusion, which is the dominant production process for two Higgs bosons at the (HL-)LHC, for arbitrary renormalisable extensions of the Higgs sector."},{"arxiv":"2603.24655","id":"3136382","title":"Neutrino and electromagnetic signatures from Superluminous Supernovae: a case study for SN 2017egm","authors":"Mainak Mukhopadhyay, Shigeo S. Kimura, Indrek Vurm, Brian D. Metzger","score":5.8,"section":"replacement","rank":50,"parts":[0.0,0.0,0.1,0.0,0.42],"note":"Closest network paper: [[2838981]] (coupling 0.04, 4 shared references). Shared topics: detection prospect.","abstract":"Superluminous supernovae (SLSNe) are rare transients that are $\\sim 10 - 100$ times more luminous than ordinary stellar explosions, reaching peak optical luminosities $\\sim 10^{44} - 10^{45}$ erg s$^{-1}$. The energy source powering SLSNe remains uncertain. In this work, we explore the multi-wavelength and multi-messenger signatures of the scenario in which SLSNe are powered by a newly born millisecond magnetar. We model the dynamical evolution and emission from the coupled system comprised of the magnetar, wind, nebula, and supernova ejecta, consistently evaluating the pair multiplicity of the wind and nebula regions, and the bulk wind Lorentz factor governing the $e^+ - e^-$ injection spectra in the nebula. We compute the thermal and non-thermal electromagnetic signatures, neutrino signatures, and investigate their detection prospects. For SN 2017egm, the nearest observed SLSNe, our prediction for high-energy gamma rays matches the recent detection by Fermi LAT. For neutrinos, using SN 2017egm a canonical SLSNe, we find that in the era of the Vera C. Rubin Observatory, a stacking analysis with upcoming neutrino observatories can lead to $3σ$ detection significance of neutrino events from a population of SLSNe within a decade of operation."},{"arxiv":"2611.02049","id":"3222112","title":"Reinforcement Learning in High-Energy Physics: A Survey from Accelerator Control to Theory Exploration","authors":"Luca Anzalone","score":5.7,"section":"cross","rank":51,"parts":[0.06,0.05,0.14,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[3094526]] (coupling 0.02, 5 shared references). Closest network paper: [[3090323]] (coupling 0.05, 6 shared references).","abstract":"Reinforcement learning (RL) is a machine learning paradigm in which an agent learns a decision-making policy by interacting with an environment, guided by a scalar reward rather than explicit supervision. Supervised and unsupervised learning have become indispensable tools in high-energy physics (HEP), but they learn from fixed datasets, whereas many HEP tasks are closed-loop decisions: the data an algorithm observes depend on its choices, the feedback is sparse or delayed, and the objective is often measured on a real machine or in a stochastic simulation, not by a differentiable model. This survey reviews the application of RL to such tasks: accelerator control and feedback, data quality monitoring, jet grooming, clustering, and representation, charged particle tracking, beyond-the-Standard-Model (BSM) and string model building, detector design, trigger control, analysis, and formal quantum field theory computation. It provides a self-contained introduction to the underlying RL methods, from model-free and model-based to multi-agent, offline, inverse, and bandit approaches, reviews each domain against its traditional methods, and summarizes the head-to-head comparisons. The applications range from policies deployed on real accelerators and evaluated on recorded collision data to exploratory studies in formal theory. RL is most advantageous for repeated tasks with a fast simulator, decisions inside fast control loops, operation under faults and corrupted measurements, physics-based rewards in place of labels, and sequential discrete constructions with a reusable policy, while Bayesian optimization, genetic algorithms, and differentiable methods remain competitive elsewhere. We conclude with the open challenges that recur across domains, including reward design, sim-to-real transfer, safety, the lack of shared benchmarks, and the statistical validity of policy-driven decisions."},{"arxiv":"2611.01662","id":"3188825","title":"Holographic study of the scalar meson $K_0^*(1430)$ with dynamical longitudinal confinement","authors":"Osra Hemmati, Reza Khosravi","score":5.4,"section":"new","rank":52,"parts":[0.11,0.02,0.05,0.0,0.0],"note":"Also cites widely used network papers: [[1688995]], [[2817040]]. Closest of your papers: [[1455793]] (coupling 0.01, 1 shared references). Closest network paper: [[3202432]] (coupling 0.02, 1 shared references).","abstract":"Within the framework of light-front holographic QCD, where transverse confinement is inherently realized through holography, the structure and mass spectrum of the light scalar meson $K_0^{*}(1430)$ are investigated by employing the invariant mass ansatz and enhancing the model with a longitudinal confinement potential (specifically, the 't Hooft equation and the analytically solvable LMZV potential). The combined transverse and longitudinal confinement dynamics lead to more reliable calculations of key observables, including decay constants, parton distribution function, $ξ$-moments, and twist-$2$ and twist-$3$ distribution amplitudes. Transition form factors for the semileptonic decay $B \\rightarrow K_0^{*} \\ell^+ \\ell^-$ are computed from these amplitudes, yielding predictions for differential branching ratios and longitudinal lepton polarization asymmetries as functions of $q^2$. The results are compared with other theoretical models, offering valuable insights into the non-perturbative dynamics of QCD. The predicted observables provide theoretically motivated benchmarks for future experimental investigations of $B\\rightarrow K_0^*(1430)\\ell^+\\ell^-$ decays at LHCb and Belle II."},{"arxiv":"2611.03340","id":"3222414","title":"Axion polarimetry with parametric readout: photon-number conversion and sensitivity limits","authors":"Antonio Capolupo, Gabriele Pisacane, Raoul Serao","score":5.2,"section":"cross","rank":53,"parts":[0.0,0.08,0.19,0.0,0.0],"note":"Closest of your papers: [[2039411]] (coupling 0.02, 5 shared references). Closest network paper: [[3115042]] (coupling 0.07, 7 shared references).","abstract":"We propose a bias-assisted active photon-number conversion scheme for axion-induced polarization rotation in a four-port optical ring cavity with parametric readout. A calibrated real polarization rotation applied \\emph{before} the final optical parametric oscillator (OPO) converts the otherwise quadratic response of the summed output photon number into a linear signal. We derive the resulting photon moments and the extracted-field covariance, retaining the four-port optical transfer, finite axion coherence and linewidth. Our principal phenomenological result is a prospective low-mass sensitivity window at $m_a=10^{-18}$--$10^{-16}\\,\\mathrm{eV}$, extending below the published exclusion bounds included in our comparison, notably the NuSTAR M82 limits. This is a conditional noise-equivalent projection, using the adopted $A/σ_A=1$ stochastic-power criterion and a parameterized technical-noise budget, not a confidence-level exclusion forecast. As a separate readout result, OPO-based total counting reduces the noise-equivalent coupling by approximately $5\\%$ relative to matched selective attenuation in a favorable higher-frequency band; $5\\%$ internal loss together with a $0.10$-rad pump-phase offset leaves a $3.5\\%$ advantage in the stated example. A coherent input with only the final OPO retains this high-frequency benefit, whereas optimized coherent polarimetry remains more sensitive in the baseline. Our results identify both the operating principle of active number conversion and the stability requirements for a future implementation."},{"arxiv":"2608.26532","id":"3196829","title":"Atomic structure calculations for constraining new electron-electron forces","authors":"Cameron J. West, Benjamin M. Roberts","score":4.6,"section":"replacement","rank":54,"parts":[0.06,0.05,0.08,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1941263]] (coupling 0.01, 3 shared references). Closest network paper: [[3090922]] (coupling 0.03, 6 shared references).","abstract":"We present a general approach for calculating new electron-electron interactions with atomic structure theory, include dominant many-body effects, and extract bounds for parity-odd cases. The procedure is valid for any mediator mass and improves previous calculations by including many-body corrections to the new interaction through the time-dependent Hartree-Fock method. Bounds on coupling strengths are then extracted for scalar-pseudoscalar and vector-axial vector interactions by comparison with experimental atomic electric dipole moments and parity non-conserving (PNC) transitions respectively. In the latter case, our calculations rule out any coupling-mass ratio |g^e_V g^e_A|/m_X^2 greater than 10^-11 MeV^-2 above m_X ~ 10 MeV, covering a previously unconstrained mass region. We also report an updated calculation of the regular (Standard Model) electron-electron Z^0 exchange contribution to the 6s-7s PNC transition amplitude E_PNC in cesium."},{"arxiv":"2611.00205","id":"3221753","title":"Lightest and heaviest nuclei as keys to the origin of ultrahigh energy cosmic rays","authors":"Anna M. Suliga, Glennys R. Farrar","score":4.4,"section":"cross","rank":55,"parts":[0.06,0.01,0.13,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[3184726]] (coupling 0.00, 1 shared references). Closest network paper: [[3130305]] (coupling 0.05, 4 shared references).","abstract":"The origin of ultrahigh energy cosmic rays (UHECRs) has been a long-standing mystery. A unique feature of UHECRs originating in binary neutron star mergers (BNSMs) is two distinct populations of light elements -- those directly accelerated in the jets, and photo-disintegration products of massive nuclei accelerated in the bulk outflow. We show that Pierre Auger Observatory spectrum and composition data confirm the existence of the predicted two populations at $\\geq \\!7.2σ$ significance, having rigidity ($R\\equiv E/Ze$) cutoffs agreeing with prior estimates. The data also favor 5-10% of UHECRs originating as r-process nuclei, a signature of a BNSM origin. Our results provide strong evidence that UHECRs are produced by merging neutron stars, and show how UHECRs and UHE-neutrinos elucidate otherwise inaccessible aspects of neutron star mergers."},{"arxiv":"2506.08083","id":"2933166","title":"Perturbative Kähler Moduli Inflation","authors":"Mishaal Hai, Ahmed Rakin Kamal, Noshin Ferdous Shamma, Md Shaikot Jahan Shuvo","score":4.4,"section":"replacement","rank":56,"parts":[0.0,0.1,0.09,0.0,0.0],"note":"Closest of your papers: [[1655573]] (coupling 0.04, 3 shared references). Closest network paper: [[2821768]] (coupling 0.03, 3 shared references).","abstract":"In this work, we present two classes of inflationary models in the framework of type IIB string theory. The inflatons correspond to blow-up Kähler modulus arising from compactifying type IIB string theory on a Calabi-Yau. Using perturbative corrections, we first highlight a procedure for stabilising more than one Kähler modulus. For the case of two Kähler moduli, we explicitly construct two classes of inflationary potentials within the Kähler cone which satisfy both EFT and cosmological constraints. The first class of models, arising from moduli redefinition of the blow-up mode, garners a potential of the form $V(φ)=V_{0}(1+C_{1} φ^{2/3})$ align with CMB data with tensor-to-scalar ratio $r\\lesssim 10^{-2}$. The second class of models, which have been recently proposed as loop blow-up inflation, have a form $V(φ)=V_{0}(1+C_{2}φ^{-2/3})$, also agrees with CMB data with tensor-to-scalar ratio $r\\lesssim 10^{-8}$. Our work differs from the original loop blow-up inflation in terms of stabilization mechanism and subsequently the tensor-to-scala function paint(){if(!G)return;const f=hover||sel,on=new Set();if(f){on.add(f.i);f.out.forEach(i=>on.add(i));f.inn.forEach(i=>on.add(i))}
  svg.classed('dim',!!f);
  G.selectAll('path.edge').attr('class',l=>'edge '+l.k+(!f?'':l.s===f.i?' hot out':l.t===f.i?' hot in':''));G.selectAll('path.edge.hot').raise();
  G.selectAll('circle').classed('on',s=>on.has(s.n.i)).classed('sel',s=>sel&&s.n.i===sel.i).classed('match',s=>query&&`${s.n.first} ${s.n.title} ${s.n.arxiv} ${s.n.authors||''}`.toLowerCase().includes(query));
  G.selectAll('text.nlabel').classed('on',l=>on.has(l.s.n.i))}
function panel(){const p=document.getElementById('panel'),n=sel;
  if(!n){p.innerHTML='<p>Select a paper in the network.</p>';return}
  const links=`<div class="links">${n.id?`<a href="https://inspirehep.net/literature/${n.id}" target="_blank" rel="noopener">INSPIRE</a>`:''}${n.arxiv?`<a href="https://arxiv.org/abs/${esc(n.arxiv)}" target="_blank" rel="noopener">arXiv</a>`:''}</div>`;
  if(isNew(n)) p.innerHTML=`<div class="role" style="color:${col(n)}">#${n.rank} · ${esc(SEC[n.section])} · score ${n.score.toFixed(1)}</div><h4>${esc(n.title)}</h4>
   <div class="meta">${esc(auth(n))} · arXiv:${esc(n.arxiv)}</div><p>${why(n.note)}</p><div class="links"><a href="#p${n.i}">Back to abstract</a></div>`;
  else p.innerHTML=`<div class="role" style="color:${col(n)}">${esc(ROLE[n.role])}</div><h4>${esc(n.title)}</h4>
   <div class="meta">${esc(auth(n))} · ${n.year}${n.arxiv?' · arXiv:'+esc(n.arxiv):''}</div>
   <div class="stats"><span>${n.cites.toLocaleString()} citations</span><span>${n.inn.filter(i=>isNew(N[i])).length} of the matches link here</span></div>${links}`;
  tex(p)}
function pick(n,scroll){sel=n;panel();paint();document.querySelectorAll('.paper').forEach(el=>el.classList.toggle('sel',el.id==='p'+n.i));if(scroll)document.getElementById('chart').scrollIntoView({behavior:'smooth',block:'nearest'})}
const present=new Set(N.map(n=>n.role));
document.getElementById('legend').innerHTML=['today','repl','seed','other'].filter(k=>present.has(k)).map(k=>`<span><i class="dot" style="background:var(--${k})"></i>${esc(ROLE[k])}</span>`).join('')+'<span style="color:var(--fg-3)">Listing papers: size ∝ score; others: size ∝ log(citations)</span>';
document.getElementById('q').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();paint()});
svg.on('click',ev=>{if(ev.target.tagName!=='circle'){sel=null;panel();paint()}});
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(draw,200)});
function nextList(){const X=RAW.next||[];if(!X.length)return;const box=document.getElementById('nextlist'),more=document.getElementById('more');
  more.hidden=false;more.querySelector('summary').firstChild.textContent=`The next ${X.length} papers by score `;
  const nmin=M.nextMin;
  document.getElementById('moresub').textContent=`below the threshold of ${M.threshold}${nmin!=null?`: every paper scoring ${nmin} or more, and at least ${M.nextCount} when available`:''}; not drawn in the network`;
  const cut=nmin!=null?X.findIndex(n=>n.score<nmin):-1;
  box.innerHTML=X.map((n,i)=>(i===cut?`<li class="divider">Below ${nmin}: weaker relation (most of these share no specific reference, coupling or topic with your work)</li>`:'')+`<li><div class="role" style="color:var(--${n.section==='replacement'?'repl':'today'})">#${n.rank} · ${esc(SEC[n.section])} · score ${n.score.toFixed(1)}</div>
    <div class="t">${esc(n.title)}</div><div class="authors">${authors(n.authors)} · arXiv:${esc(n.arxiv)}</div>
    ${n.note?`<p class="why">${why(n.note)}</p>`:''}
    <details class="abs"><summary>Abstract</summary><p class="abs">${esc(n.abstract)}</p></details>
    <div class="links">${n.id?`<a href="https://inspirehep.net/literature/${n.id}" target="_blank" rel="noopener">INSPIRE</a>`:''}<a href="https://arxiv.org/abs/${esc(n.arxiv)}" target="_blank" rel="noopener">arXiv</a><a href="https://arxiv.org/pdf/${esc(n.arxiv)}" target="_blank" rel="noopener">PDF</a></div></li>`).join('');
  more.addEventListener('toggle',()=>{if(more.open)tex(box)})}
const rtip=document.getElementById('reftip');let rcur=null;
function refShow(el){const r=REFS[el.dataset.ref];if(!r)return;rcur=el;rtip.textContent=`${auth(r)} (${r.year}) — ${plain(r.title)}`;rtip.hidden=false;
  const b=el.getBoundingClientRect(),t=rtip.getBoundingClientRect();let L=Math.min(Math.max(8,b.left),innerWidth-t.width-8),T=b.bottom+6;
  if(T+t.height>innerHeight-8)T=b.top-t.height-6;rtip.style.left=L+'px';rtip.style.top=T+'px'}
function refHide(){rtip.hidden=true;rcur=null}
document.addEventListener('pointerover',e=>{const el=e.target.closest('.ref');if(el&&e.pointerType==='mouse')refShow(el)});
document.addEventListener('pointerout',e=>{if(e.target.closest('.ref')&&e.pointerType==='mouse')refHide()});
document.addEventListener('click',e=>{const el=e.target.closest('.ref');if(el)refShow(el);else if(rcur)refHide()});
document.addEventListener('focusin',e=>{const el=e.target.closest('.ref');if(el)refShow(el)});
document.addEventListener('focusout',e=>{if(e.target.closest('.ref'))refHide()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')refHide()});
addEventListener('scroll',()=>{if(rcur)refHide()},{passive:true});
list();nextList();fold();draw();panel();
window.addEventListener('load',()=>{tex(document.getElementById('list'));tex(document.getElementById('panel'));fold();
  if(window.MathJax&&MathJax.startup&&MathJax.startup.promise)MathJax.startup.promise.then(()=>setTimeout(fold,300))});
addEventListener('resize',()=>{clearTimeout(window._ft);window._ft=setTimeout(fold,200)});
</script>
