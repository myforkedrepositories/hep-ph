<script>
const RAW = {"n":[{"id":"3221793","arxiv":"2611.00232","title":"Interacting scalar-fermion two-component dark matter in a gauged $\\boldsymbol{U(1)_{B-L}}$ model","first":"Neto","nauth":3,"year":2026,"cites":0,"role":"today","note":"Co-authors of yours: Yaguna. Cites your papers: [[1686334]], [[1764733]], [[2614919]], [[1803365]], [[1990302]]. Cites 14 network papers: [[3130997]], [[2864372]], [[3131565]], [[3086782]], [[2918610]], [[2913509]]…. Also cites widely used network papers: [[1518747]]. Closest of your papers: [[1990302]] (coupling 0.14, 13 shared references). Closest network paper: [[2843521]] (coupling 0.14, 15 shared references). Shared topics: two-component dark matter, discrete symmetry, neutrino mass, yukawa interaction, dark matter model.","score":68.4,"rank":1,"section":"new","parts":[1.0,0.44,0.41,0.5,0.9],"abstract":"We propose an interacting two-component dark matter model based on a gauged $U(1)_{B-L}$ extension of the Standard Model, which also accommodates neutrino masses through the type-I seesaw mechanism. The dark sector consists of a Dirac fermion $χ$ and a complex scalar $S$, which can both be stable without imposing an additional discrete symmetry and are directly coupled by a gauge-invariant Yukawa interaction. The resulting conversion, semi-conversion, and semi-annihilation processes lead to a genuinely coupled freeze-out. After imposing collider and dark matter constraints, we identify viable solutions away from the $Z'$ resonance for both mass hierarchies, $m_S > m_χ$ and $m_S < m_χ$. Despite the strong direct-detection constraints, part of the surviving parameter space remains within the reach of next-generation experiments.","authors":"Jacinto P. Neto, Farinaldo S. Queiroz, Carlos E. Yaguna","nlinked":66,"nref":70,"src":"INSPIRE","html":true},{"id":"3221883","arxiv":"2611.00930","title":"From Kination to Detection: Scotogenic Scalar Dark Matter","first":"Chun","nauth":4,"year":2026,"cites":0,"role":"today","note":"Cites your papers: [[1220579]]. Cites 17 network papers: [[2958466]], [[1846923]], [[3062873]], [[2100409]], [[3165814]], [[2638716]]…. Also cites widely used network papers: [[2817040]]. Closest of your papers: [[3094526]] (coupling 0.09, 13 shared references). Closest network paper: [[2962467]] (coupling 0.23, 24 shared references). Shared topics: scotogenic model, singlet fermion, scalar dark matter, relic abundance, dark matter mass.","score":62.2,"rank":2,"section":"new","parts":[1.0,0.26,0.66,0.0,0.96],"abstract":"We investigate scalar dark matter in the scotogenic model during an early kination-dominated epoch. The enhanced expansion rate causes earlier freeze-out and increases the relic abundance, opening viable dark matter masses from approximately $200~\\mathrm{GeV}$ to $1~\\mathrm{TeV}$ while reducing the need for co-annihilation with a nearly degenerate singlet fermion. Current indirect searches strongly constrain the $(100-200)~\\mathrm{GeV}$ region, whereas much of the surviving parameter space can be probed by CTA and next-generation direct detection experiments. The viable spectra also lead to complementary collider signatures, including missing transverse energy, displaced leptons, and disappearing charged tracks, providing promising tests at the HL-LHC and future lepton colliders.","authors":"Eung Jin Chun, Ranjeet Kumar, Sanjoy Mandal, Abhishek Roy","nlinked":97,"nref":101,"src":"INSPIRE","html":true},{"id":"3221889","arxiv":"2611.01158","title":"Exothermic Higgs portal: from LUX-ZEPLIN recoil to Gamma Rays","first":"Roy","nauth":2,"year":2026,"cites":0,"role":"today","note":"Cites 3 network papers: [[3215016]], [[3202840]], [[3201080]]. Also cites widely used network papers: [[1518747]]. Closest of your papers: [[1764733]] (coupling 0.03, 5 shared references). Closest network paper: [[3202840]] (coupling 0.51, 54 shared references). Shared topics: relic abundance, thermal relic, dark matter particle, complex scalar, dark matter.","score":54.7,"rank":3,"section":"new","parts":[0.84,0.1,1,0.0,0.72],"abstract":"We show that a minimal extension of the Standard Model (SM) by a single complex scalar $φ$ provides a viable inelastic exothermic, thermal relic, interpretation of the recently reported nuclear-recoil candidate from LUX-ZEPLIN (LZ). The mass terms and Higgs-portal interactions split $φ$ into two nearly degenerate real scalars, $φ_{1,2}$. For mass-splitting of a few hundred keV, $φ_2$ is cosmologically long-lived and the two states have comparable relic abundances. Taking $φ_{1,2}$ masses to be $\\sim100\\,$GeV, with off-diagonal Higgs coupling fixed by relic abundance, the exothermic down-scattering yields an order-one event expectation for the LZ exposure, without relying on the high-velocity tail of the dark matter velocity distribution required in endothermic scenarios. This scenario can be tested using different nuclear targets and with indirect dark matter searches: $φ_2\\toφ_1γγ$ decays give a broad sub-MeV photon continuum that can be probed by INTEGRAL/SPI and COSI; $φ_1φ_2$ annihilation produces a GeV-scale continuum, extending up to $\\sim$100 GeV, that is probed by Fermi-LAT observations of dwarf galaxies; current CMB constraints are satisfied and annihilation among dark matter particles captured in the Sun is strongly suppressed. Next-generation experiments could probe correlated scattering, decay, and annihilation signatures of this thermal Higgs-portal scenario.","authors":"Subhojit Roy, Jure Zupan","nlinked":153,"nref":159,"src":"INSPIRE","html":true},{"id":"3213780","arxiv":"2610.13930","title":"The LZ inelastic splitting as a probe of anomaly mediation","first":"Lee","nauth":2,"year":2026,"cites":0,"role":"repl","note":"Cites 5 network papers: [[3217265]], [[3215016]], [[3207263]], [[1982681]], [[1647573]]. Closest of your papers: [[1655573]] (coupling 0.04, 4 shared references). Closest network paper: [[3202840]] (coupling 0.21, 19 shared references). Shared topics: observed relic, relic abundance, dark matter.","score":52.2,"rank":4,"section":"replacement","parts":[0.95,0.11,0.6,0.0,0.65],"abstract":"The LZ 248 keV recoil candidate admits an interpretation in terms of pseudo-Dirac dark matter with a mixing-suppressed inelastic $Z$ interaction. In the MSSM, the Higgsino limit conflicts with the adopted solar-neutrino bound, while a gaugino realization requires an unprotected mass degeneracy. We realize such spectra in the MRSSM, where an $R$-symmetric Dirac bino produces the required $Z$ transition and wino coannihilation supplies the observed relic abundance. We impose the Higgs and gauge coupling relations of $N=2$ supersymmetry at a high scale and evolve them to low energy. With the remaining model parameters held fixed, we obtain spectra spanning roughly 300-850 GeV that satisfy the adopted constraints and have a small diagonal axial current. If anomaly mediation dominates the Majorana splitting, its local scale is tens of MeV for splittings of a few hundred keV. A five-dimensional warped construction generates this scale through Goldberger-Wise stabilization and a loop correction to the no-scale Kähler potential. The spectra remain testable through elastic scattering, solar neutrinos and long-lived charged states.","authors":"Seung J. Lee, Taewook Youn","nlinked":117,"nref":117,"src":"INSPIRE","html":true},{"id":"3221862","arxiv":"2611.00873","title":"How tightly can PBH abundance information constrain scalar-induced gravitational waves?","first":"Yu","nauth":3,"year":2026,"cites":0,"role":"today","note":"Closest of your papers: [[2826987]] (coupling 0.03, 3 shared references). Closest network paper: [[2972398]] (coupling 0.22, 24 shared references). Shared topics: primordial black hole.","score":15.0,"rank":5,"section":"cross","parts":[0.0,0.08,0.63,0.0,0.33],"abstract":"Primordial black hole (PBH) abundances and scalar-induced gravitational waves (SIGWs) probe the same primordial fluctuations through different physical weights. We examine the predictive power of precise synthetic information on absolute PBH abundances over a finite stellar-mass interval, together with an exact total abundance and external population bounds. For Gaussian perturbations under a fixed quantum chromodynamics (QCD) formation prescription, two smooth, symmetric lognormal spectra satisfy the same abundance conditions while producing nonproportional leading-order SIGW spectra. The two spectra differ by about 20% when averaged over the lower of two adjacent nanohertz windows but by nearly a factor of 60 in the higher-frequency window, so the difference cannot be represented by a single rescaling of the gravitational-wave background. Peak position and width compensate with amplitude in the abundance calculation, while the higher-frequency window draws almost all its energy from scalar-mode pairs with both wavenumbers above the primordial peak. Under the principal abundance benchmark, local finite-width components yield larger contrasts at a fixed nanohertz frequency through distinct mode couplings under both the QCD and stochastic peak-curvature formation prescriptions. For a separately generated population, extending mass information over most of its abundance restricts the lognormal peak-position and width compensation and reduces the higher-window contrast, while the unequal window responses persist. These results show why joint PBH-SIGW inference must propagate primordial shapes compatible with the PBH abundance information rather than assign one tensor template to a single abundance fit.","authors":"Boliang Yu, Ruixin Zhou, Zi-Yu Tang","nlinked":47,"nref":51,"src":"INSPIRE","html":true},{"id":"3221869","arxiv":"2611.01305","title":"Lightest-mass suppression and weaker Majorana cancellation in Froggatt--Nielsen textures","first":"Yu","nauth":2,"year":2026,"cites":0,"role":"today","note":"Closest of your papers: [[1222142]] (coupling 0.09, 5 shared references). Closest network paper: [[1263385]] (coupling 0.09, 7 shared references). Shared topics: majorana mass.","score":12.4,"rank":6,"section":"new","parts":[0.0,0.23,0.25,0.0,0.17],"abstract":"The effective Majorana mass is the length of a sum of three complex electron-flavour contributions. A mass-generation model determines both their sizes and how they cancel. We compare direct effective coefficients with a three-right-handed-neutrino seesaw measure at fixed Froggatt--Nielsen charges and common lepton conditions. In the normal-ordering benchmark truncated-normal ensemble, seesaw generation lowers the lightest-mass median by a factor of 3.2 while raising the effective-mass median by 13\\%. A comparison reweighted to a common lightest-mass distribution locates nearly all of the coherent mean-square increase in weaker destructive solar-pair interference. In a fixed-amplitude phase-exchange control, the response follows the conditional phase law. A second texture exposes the competing spectral effect: smaller amplitudes can outweigh weaker cancellation in the original mean square. The interference information also affects how a prediction can be used. Replacing induced phases by independent uniform phases at unchanged posterior masses and electron weights raises the benchmark direct median by 29\\%. The matrix ensemble therefore predicts a joint arrangement of amplitudes and phases whose coherent information is lost when only masses and electron-flavour weights are retained.","authors":"Boliang Yu, Ruixin Zhou","nlinked":25,"nref":33,"src":"INSPIRE","html":true},{"id":"3083489","arxiv":"2511.11100","title":"Thermal Leptogenesis in $SO(10)\\times U(1)_A$ SUSY GUT","first":"Maekawa","nauth":3,"year":2026,"cites":0,"role":"repl","note":"Closest of your papers: [[3184726]] (coupling 0.04, 7 shared references). Closest network paper: [[2851262]] (coupling 0.12, 11 shared references). Shared topics: neutrino mass.","score":11.2,"rank":7,"section":"replacement","parts":[0.0,0.11,0.35,0.0,0.26],"abstract":"We investigate thermal leptogenesis within a supersymmetric grand unified theory (SUSY GUT) based on the $SO(10) \\times U(1)_A$ symmetry, where both the doublet--triplet splitting problem and the unrealistic Yukawa relations are resolved under the natural assumption that all symmetry-allowed interactions appear with $\\mathcal{O}(1)$ coefficients. In this framework, the structures of the Dirac neutrino Yukawa couplings and right-handed neutrino masses are determined entirely by the symmetry. The baryon asymmetry of the Universe is computed taking into account the flavor effects, Higgs asymmetry contributions, and the impact of the second-lightest right-handed neutrino. While the predicted asymmetry is too small when all $\\mathcal{O}(1)$ coefficients of the Dirac neutrino Yukawa couplings are set to unity, a moderate enhancement factor $r_1 \\sim 5.4$ for the lightest right-handed neutrino mass reproduces the observed baryon asymmetry without spoiling low-energy neutrino data. This corresponds to a suppressed lightest neutrino mass, $m_{ν_1} \\sim (1/r_1) \\times (\\text{symmetry-determined value})$, typically $m_{ν_1} \\sim 4.5 \\times 10^{-4}\\,\\text{eV}$. We further explore cases where the $\\mathcal{O}(1)$ coefficients of the Dirac neutrino Yukawa couplings are $\\pm 1$, and find that roughly half of them successfully generate the observed baryon asymmetry for $r_1\\leq 11$. Moreover, the others yield results of the correct order of magnitude, although they do not generate the observed Baryon asymmetry. These findings demonstrate that thermal leptogenesis is realized in this $SO(10)\\times U(1)_A$ SUSY GUT, establishing a link between the observed baryon asymmetry and predictions for the lightest neutrino mass.","authors":"Nobuhiro Maekawa, Kei Shibata, Masato Yamanaka","nlinked":52,"nref":54,"src":"INSPIRE","html":true},{"id":"3221761","arxiv":"2611.00200","title":"Tests of an EP-Preserving Wake Force","first":"Banerjee","nauth":2,"year":2026,"cites":0,"role":"today","note":"Closest of your papers: [[1709434]] (coupling 0.02, 1 shared references). Closest network paper: [[3089716]] (coupling 0.12, 8 shared references). Shared topics: scalar dark matter, dark matter.","score":10.7,"rank":8,"section":"new","parts":[0.0,0.04,0.33,0.0,0.46],"abstract":"A universal quadratic coupling of ultralight scalar dark matter to ordinary matter preserves the weak equivalence principle for unscreened point particles. A finite test body is nevertheless not a passive probe: it distorts the scalar field that accelerates it. We show that this field distortion produces a differential acceleration between concentric test masses, even when their microscopic coupling is universal. We calculate this signal including how each test mass distorts the field acting on the other, deriving the weak-screening limit and extending the calculation to stronger screening using concentric spherical layers. Applying the model to MICROSCOPE, we find differential signals in both its equivalence-principle sensor SUEP, whose test masses have different compositions, and its reference sensor SUREF, whose test masses have the same composition. We combine both sensors with the dark matter wake near Earth to recast the published MICROSCOPE measurements. Within this model, existing measurements probe scalar masses up to approximately $8 \\times 10^{-9}\\,$eV and couplings below the supernova bound. An analysis using the additional frequency components of the scalar signal could extend the mass reach and probe couplings below the BBN bound.","authors":"Abhishek Banerjee, Dawid Brzeminski","nlinked":35,"nref":41,"src":"INSPIRE","html":true},{"id":"3124690","arxiv":"2603.00901","title":"New axion bounds derived from the 100-parsec Gaia DR3 white dwarf luminosity function","first":"Alberino","nauth":5,"year":2026,"cites":0,"role":"repl","note":"Also cites widely used network papers: [[1783234]]. Closest of your papers: [[1941263]] (coupling 0.05, 9 shared references). Closest network paper: [[2969908]] (coupling 0.09, 8 shared references).","score":10.3,"rank":9,"section":"replacement","parts":[0.06,0.15,0.24,0.0,0.0],"abstract":"The axion, a well-motivated hypothetical particle arising in extensions of the Standard Model, can be produced copiously within the hot, compact cores of white dwarf stars. The shape of the white dwarf luminosity function (WDLF) is a powerful tool for constraining theoretical particles that would imply an additional cooling channel in white dwarfs. In this work, and for the first time, we use the 100-parsec Gaia DR3 white dwarf sample and compare it with theoretical predictions. We have simulated synthetic populations of white dwarfs using a population synthesis code based on Monte Carlo techniques, incorporating realistic observational errors, and based on state-of-the-art white dwarf models that incorporate the anomalous cooling caused by the presence of axions. Axion bremsstrahlung emission rates were implemented using the latest theoretical calculations. We find that, for the brightest white dwarfs in the sample ($M_{\\mathrm{Bol}} < 10$), the $χ^2$ statistic is largely insensitive to the assumed stellar formation rate (SFR), which is typically the dominant uncertainty in modeling the Galactic-disk WDLF. The resulting $χ^2$ analysis disfavors a sizable additional cooling contribution. This conclusion contrasts with earlier studies in which axion-electron couplings in the range $0.7 \\times 10^{-13} < g_{ae} < 2.1 \\times 10^{-13}$ provided mildly improved fits to the Galactic-disk WDLF. We attribute the discrepancy to simplifying assumptions in previous modeling and to the substantially improved observational quality of the 100-pc Gaia DR3 sample. We obtain the upper limit $g_{ae} < 1.68 \\times 10^{-13}$ ($95\\%$ C.L.), which is among the strongest available.","authors":"Martín L. Alberino, Marcelo M. Miller Bertolami, María E. Camisassa, Andrea Caputo, Santiago Torres","nlinked":54,"nref":98,"src":"INSPIRE","html":true},{"id":"2614919","arxiv":"2212.0748 306","id":"3221785","title":"Proposal for the resolution of the disagreement between DAMA and other Underground Dark Matter Experiments","authors":"C. D. Froggatt, H. B. Nielsen","score":8.0,"section":"new","rank":10,"parts":[0.0,0.07,0.2,0.0,0.3],"note":"Closest of your papers: [[3094526]] (coupling 0.03, 1 shared references). Closest network paper: [[1862804]] (coupling 0.07, 2 shared references). Shared topics: dark matter particle, dark matter.","abstract":"It is a great mystery still needing a solution that the underground experiments looking for dark matter disagree, in tIt is a great mystery still needing a solution that the underground experiments looking for dark matter disagree, in the sense that DAMA/LIBRA has found dark matter with a confidence level of several standard deviations, while neither the xenon based experiments nor even the experiments using the same target material NaI(Tl) as DAMA see the same amount of dark matter. We propose to solve this enigma by postulating that the dark matter gets excited during its passage through the mountain shielding from outer space down to the experimental halls; the DAMA experiment is namely about twice as deep as the ANAIS and COSINE-100 experiments, so that there is longer passage time for DAMA, which thus gets more excited dark matter particles. The xenon-scintillator experiments have their strong limits for dark matter making itself felt via nucleus recoils, and thus we can just assume that the excited dark matter mainly emits e.g. electrons, and the xenon-experiments would hardly see such dark matter. The single event recently seen by LUX/ZEPPELIN could be due to a low rate of nucleus emission in addition to the hypothesised electrons."},{"arxiv":"2502.00445","id":"2874730","title":"Electroweak baryogenesis from charged current anomalies in $B$ meson decays","authors":"Peter Athron, Michael J. Ramsey-Musolf, Cristian Sierra, Yongcheng Wu","score":7.4,"section":"replacement","rank":11,"parts":[0.06,0.06,0.23,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1869725]] (coupling 0.02, 1 shared references). Closest network paper: [[2051136]] (coupling 0.08, 17 shared references).","abstract":"We demonstrate for the first time that new physics explaining the long standing charged $B$ meson anomalies, $R(D^{(*)})$, can be the source of CP violation that explains the observed baryon asymmetry of the universe (BAU). We consider the general two Higgs doublet model with complex Yukawa couplings and compute the BAU in the semiclassical formalism, using a novel analytic approximation for the latter. After imposing constraints from both flavor observables and the electron electric dipole moment (eEDM), and assuming the occurrence of a sufficiently strong first order electroweak phase transition, we find that the observed BAU can be generated for benchmark points within the region favored by the global flavor fit. Reaching the observed BAU relies on optimized values of the phase transition parameters, which we treat as inputs. These scenarios, which explain both $R(D^{(*)})$ and the BAU, can be probed with future eEDM experiments and Higgs factories measurements."},{"arxiv":"2610.35818","id":"3219126","title":"Holographic Approaches to Hadron Structure","authors":"Luigi Cappiello, Anton Rebhan, Shigeki Sugimoto","score":6.9,"section":"replacement","rank":12,"parts":[0.06,0.04,0.09,0.0,0.24],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[636564]] (coupling 0.01, 2 shared references). Closest network paper: [[2858283]] (coupling 0.03, 5 shared references). Shared topics: minimal model.","abstract":"We give an introduction to and an overview of holographic approaches to QCD and hadron structure. After an introduction to the string-theoretic foundations of holographic QCD, we review the predictions of top-down and bottom-up models for the phenomenology of mesons, baryons, and glueballs. We focus on the top-down model following from probe flavor branes in the Witten model of low-energy Yang-Mills theory and, in the more phenomenological approach of bottom-up models, mostly on minimal models based on five-dimensional anti-de Sitter space, which also implement global symmetries and their anomalies consistently, but allow the high-energy behavior to better match real QCD."},{"arxiv":"2603.24655","id":"3136382","title":"Neutrino and electromagnetic signatures from Superluminous Supernovae: a case study for SN 2017egm","authors":"Mainak Mukhopadhyay, Shigeo S. Kimura, Indrek Vurm, Brian D. Metzger","score":5.7,"section":"replacement","rank":13,"parts":[0.0,0.0,0.11,0.0,0.41],"note":"Closest network paper: [[2838981]] (coupling 0.04, 4 shared references). Shared topics: detection prospect.","abstract":"Superluminous supernovae (SLSNe) are rare transients that are $\\sim 10 - 100$ times more luminous than ordinary stellar explosions, reaching peak optical luminosities $\\sim 10^{44} - 10^{45}$ erg s$^{-1}$. The energy source powering SLSNe remains uncertain. In this work, we explore the multi-wavelength and multi-messenger signatures of the scenario in which SLSNe are powered by a newly born millisecond magnetar. We model the dynamical evolution and emission from the coupled system comprised of the magnetar, wind, nebula, and supernova ejecta, consistently evaluating the pair multiplicity of the wind and nebula regions, and the bulk wind Lorentz factor governing the $e^+ - e^-$ injection spectra in the nebula. We compute the thermal and non-thermal electromagnetic signatures, neutrino signatures, and investigate their detection prospects. For SN 2017egm, the nearest observed SLSNe, our prediction for high-energy gamma rays matches the recent detection by Fermi LAT. For neutrinos, using SN 2017egm a canonical SLSNe, we find that in the era of the Vera C. Rubin Observatory, a stacking analysis with upcoming neutrino observatories can lead to $3σ$ detection significance of neutrino events from a population of SLSNe within a decade of operation."},{"arxiv":"2506.08083","id":"2933166","title":"Perturbative Kähler Moduli Inflation","authors":"Mishaal Hai, Ahmed Rakin Kamal, Noshin Ferdous Shamma, Md Shaikot Jahan Shuvo","score":4.5,"section":"replacement","rank":14,"parts":[0.0,0.1,0.09,0.0,0.0],"note":"Closest of your papers: [[1655573]] (coupling 0.04, 3 shared references). Closest network paper: [[2821768]] (coupling 0.03, 3 shared references).","abstract":"In this work, we present two classes of inflationary models in the framework of type IIB string theory. The inflatons correspond to blow-up Kähler modulus arising from compactifying type IIB string theory on a Calabi-Yau. Using perturbative corrections, we first highlight a procedure for stabilising more than one Kähler modulus. For the case of two Kähler moduli, we explicitly construct two classes of inflationary potentials within the Kähler cone which satisfy both EFT and cosmological constraints. The first class of models, arising from moduli redefinition of the blow-up mode, garners a potential of the form $V(φ)=V_{0}(1+C_{1} φ^{2/3})$ align with CMB data with tensor-to-scalar ratio $r\\lesssim 10^{-2}$. The second class of models, which have been recently proposed as loop blow-up inflation, have a form $V(φ)=V_{0}(1+C_{2}φ^{-2/3})$, also agrees with CMB data with tensor-to-scalar ratio $r\\lesssim 10^{-8}$. Our work differs from the original loop blow-up inflation in terms of stabilization mechanism and subsequently the tensor-to-scalar ratio."},{"arxiv":"2611.00349","id":"3221811","title":"Top quark couplings at the muon collider","authors":"Nicolás Urcelay, Antonio O. Bouzas, F. Larios","score":4.0,"section":"new","rank":15,"parts":[0.0,0.05,0.17,0.0,0.0],"note":"Closest of your papers: [[1455793]] (coupling 0.02, 3 shared references). Closest network paper: [[2115290]] (coupling 0.06, 5 shared references).","abstract":"We present an overview of the sensitivity of a muon collider to the flavor-diagonal electroweak couplings of the top quark, using dimension-six operators of the Warsaw basis. Of the nine fermion-boson operators involving the top quark, the bounds on three are not competitive with existing limits, and we focus on the remaining six. We estimate individual $95\\%$ CL limits on the corresponding Wilson coefficients at $\\sqrt{s} = 3$, $6$, $10$, and $14$~TeV from $2σ$ statistical cross-section uncertainties, and assess the effect of an assumed systematic uncertainty. We consider six top-quark production modes: $t\\bar t$, $t \\bar t h$, $t \\bar t ν\\bar ν$, $t \\bar t μ^+ μ^-$, single-top $t\\bar b μ^- \\bar ν_μ$, and single-top-plus-Higgs, the last three for several rapidity coverages of the final-state muons. The $s$-channel $t\\bar t$ and $t\\bar t h$ processes give the strongest sensitivity to the electroweak dipole couplings, with allowed intervals narrower than the current LHC ones by factors of about $3$ to $6$ at $\\sqrt{s} = 3$ and $6$ TeV, and by an order of magnitude or more at $10$ and $14$ TeV. The left- and right-handed $ttZ$ couplings, as well as the Yukawa $tth$ couplings (for $\\sqrt{s} \\geq 6$ TeV), are best probed in $t \\bar t ν\\bar ν$ production, while the right-handed $tbW$ coupling is best probed in single-top production. For the $ttZ$ and $tbW$ couplings, the limits improve on the current LHC bounds by factors from about $1.5$ to more than an order of magnitude. Our results agree with previous analyses of the Yukawa and the dipole couplings, and provide a roadmap for more in-depth studies."},{"arxiv":"2603.12032","id":"3128760","title":"Assessing the robustness of amortized simulation-based inference to transient noise in gravitational-wave ringdowns","authors":"Song-Tao Liu, Tian-Yang Sun, Yu-Xin Wang, Yong-Xin Zhang, Shang-Jie Jin, Jing-Fei Zhang, Xin Zhang","score":3.5,"section":"replacement","rank":16,"parts":[0.0,0.03,0.15,0.0,0.02],"note":"Closest of your papers: [[1869725]] (coupling 0.01, 1 shared references). Closest network paper: [[3177521]] (coupling 0.05, 8 shared references).","abstract":"Gravitational waves (GW) emitted by binary systems allow us to perform precision tests of general relativity in the strong field regime. Ringdown signals allow for probing black hole mass and spin with high precision in GW astronomy. With improvements in current and next-generation GW detectors, developing likelihood-free parameter inference methods is crucial. This is especially important when facing challenges such as non-standard noise, partial data, or incomplete signal models that prevent the use of analytical likelihood functions. In this work, we propose an amortized simulation-based inference strategy to estimate ringdown parameters directly. Specifically, our method is based on amortized neural posterior estimation, which trains a neural density estimator of the posterior for all data segments within the prior range. The results show that our trained amortized network achieves valid confidence coverage and yields posteriors in agreement with established Markov-chain methods at moderate signal-to-noise ratios. At higher signal-to-noise ratios, the recovered posteriors agree with the Markov-chain results in location, although the amplitude posterior is broader. The network provides inference speeds that are orders of magnitude faster. Furthermore, we evaluate the robustness of the method against transient noise contamination. Our results indicate that the timing of glitch injection significantly affects estimation bias, in particular when the glitch contaminates the early, high-amplitude portion of the signal. This study not only provides an efficient and statistically validated inference framework under the tested conditions for ringdown analysis but also lays a foundation for developing robust data-processing pipelines for future GW astronomy in realistic noise environments."},{"arxiv":"1808.00420","id":"1684711","title":"A Fresh Look at the Calculation of Tunneling Actions including Gravitational Effects","authors":"J. R. Espinosa","score":3.3,"section":"replacement","rank":17,"parts":[0.0,0.0,0.22,0.0,0.0],"note":"Closest network paper: [[1937352]] (coupling 0.08, 3 shared references).","abstract":"Recently, the calculation of tunneling actions, that control the exponential suppression of the decay of metastable vacua, has been reformulated as an elementary variational problem in field space. This paper extends this formalism to include the effect of gravity. Considering tunneling potentials $V_t(φ)$ that go from the false vacuum $φ_+$ to some $φ_0$ on the stable basin of the scalar potential $V(φ)$, the tunneling action is the minimum of the functional $S_E[V_t]=6 π^2m_P^4\\int_{φ_+}^{φ_0}(D+V_t')^2/(V_t^2D)dφ$, where $D\\equiv [(V_t')^2+6(V-V_t)V_t/m_P^2]^{1/2}$, $V_t'=dV_t/dφ$ and $m_P$ is the reduced Planck mass. This one-line simple result applies equally to AdS, Minkowski or dS vacua decays and reproduces the Hawking-Moss action in the appropriate cases. This formalism provides new handles for the theoretical understanding of different features of vacuum decay in the presence of gravity."},{"arxiv":"2611.00234","id":"3221563","title":"Localized anomaly detection with a calorimeter normalizing flow","authors":"Raunav Mendiratta, Jason Weitz, Javier Duarte","score":3.1,"section":"cross","rank":18,"parts":[0.0,0.0,0.2,0.0,0.0],"note":"Closest network paper: [[3187354]] (coupling 0.07, 3 shared references).","abstract":"Normalizing flows trained as fast calorimeter simulators also give the likelihood of each shower, which can serve as an anomaly score. Because this likelihood sums over every voxel, a signal confined to a few voxels can be lost in the fluctuations of the rest of the shower. For example, in a public benchmark dataset in which a long-lived neutral particle decays to two photons, the CaloFlow likelihood used in previous work selects less than 5% of the signal at a background efficiency of $10^{-3}$ when the particle has the largest simulated mass and decays at or just behind the front face of the calorimeter. In this work, we define a regional anomaly score by summing the squared latent coordinates of the same flow within small detector regions around the point where the particle enters the calorimeter, with the threshold set using background showers alone. At the same background efficiency, this regional anomaly score selects more than 95% of the signal. The per-coordinate likelihood terms, summed over the same regions, perform equally well, but the squared latent coordinates have a known distribution for background showers and clearly illustrate when a shower departs from it. Therefore, normalizing flows may be sensitive to new physics, even if the global likelihood is not."},{"arxiv":"2611.01117","id":"3221884","title":"LH$μ$C Concept: Energy-Frontier Antimuon-Proton Collisions at CERN","authors":"Arda Goroglu, Saleh Sultansoy","score":3.0,"section":"cross","rank":19,"parts":[0.0,0.04,0.12,0.0,0.0],"note":"Closest of your papers: [[1294681]] (coupling 0.01, 2 shared references). Closest network paper: [[3204120]] (coupling 0.04, 3 shared references).","abstract":"The concept of the LH$μ$C, an energy-frontier antimuon-proton collider based on the HL-LHC, is presented. After recalling why energy-frontier lepton-hadron colliders are indispensable as QCD explorers and reviewing the history of muon-proton collider proposals, two ways of realising $μp$ collisions at the LHC are compared: with muon-collider beams and with ultra-cold $μ^+$ beams as proposed for $μ$TRISTAN. For the latter, a $μ$TRISTAN-type booster and the re-use of the LHeC energy-recovery-linac tunnel are discussed; colliding 1 TeV antimuons with 7 TeV protons gives $\\sqrt{s}=5.3$ TeV and peak luminosities of $8.8\\times10^{33}$ and $7.2\\times10^{33}$ cm$^{-2}$s$^{-1}$, respectively. The detector concept and the physics potential, including searches for colour-octet muons and R-parity-violating squarks, are discussed together with the main challenges."},{"arxiv":"2611.00133","id":"3221736","title":"Unitarity and Positivity Constraints on C- or P-odd Anomalous Quartic Couplings","authors":"Oscar J. P. Éboli, Álvaro Lozano-Onrubia, Samuel Rosende Herrero","score":2.2,"section":"new","rank":20,"parts":[0.0,0.02,0.11,0.0,0.0],"note":"Closest of your papers: [[1679809]] (coupling 0.01, 1 shared references). Closest network paper: [[2630211]] (coupling 0.04, 4 shared references).","abstract":"In this work, we provide a comprehensive study of partial-wave unitarity and positivity constraints in the dimension-eight genuine anomalous quartic gauge coupling (aQGC) sector of the Standard Model Effective Field Theory (SMEFT). We extend previous partial-wave unitarity analyses to include all C- or P-odd operators, thereby completing the coverage of the full basis of 34 operators. We also derive an analytical set of necessary forward-limit positivity bounds that include all CP-odd Wilson coefficients. We demonstrate that non-vanishing CP-odd Wilson coefficients require non-vanishing contributions from the CP-even sector to satisfy the derived positivity conditions. Combining the positivity conditions with partial-wave unitarity, we obtain stronger bounds on twenty-three of the thirty-four Wilson coefficients in this sector of the SMEFT."},{"arxiv":"2611.00918","id":"3221847","title":"Sensitivity of the IceCube atmospheric muon rate to decadal trends in the effective atmospheric temperature","authors":"Tanvi Krishnan, Gabriela Barenboim, Carlos A. Argüelles","score":2.1,"section":"new","rank":21,"parts":[0.0,0.0,0.14,0.0,0.0],"note":"Closest network paper: [[2796272]] (coupling 0.05, 2 shared references).","abstract":"Decadal changes in the Antarctic stratosphere, generally associated with ozone recovery and shifts in polar circulation, are of broad geophysical interest. However, independent long-term measurements of the atmosphere above the Antarctic interior are scarce. We assess whether the atmospheric muon rate recorded by IceCube could constrain decadal changes in the effective atmospheric temperature, $T_\\mathrm{eff}$, a weighted average of temperature through the atmosphere that is most sensitive to the stratosphere. Using public atmospheric reanalysis data and records of cosmic-ray, solar, and geomagnetic variability, we reproduce the measured seasonal response of the IceCube muon rate. We then test whether the same response applies to long-term temperature changes with a different vertical temperature profile. The limiting requirement is detector stability rather than counting statistics: an unmodeled muon rate drift of $1\\%\\,\\mathrm{decade^{-1}}$ would mimic a temperature trend of $2.8\\,\\mathrm{K\\,decade^{-1}}$. The long-term rate must therefore be stable to approximately $0.3\\%\\,\\mathrm{decade^{-1}}$. Within this budget, snow accumulation contributions can be constrained. For a 14-year record, atmospheric variability gives a one-sided 95% CL statistical sensitivity of $1.6\\,\\mathrm{K\\,decade^{-1}}$. Given this sensitivity, the $\\sim0.9\\,\\mathrm{K\\,decade^{-1}}$ cooling indicated by the 2011-2025 atmospheric records would become distinguishable after approximately 30 years of measurement."},{"arxiv":"2605.02541","id":"3151188","title":"Detectability of Magnetar-Induced Vacuum Birefringence with IXPE and eXTP","authors":"Fayez Abu-Ajamieh","score":2.1,"section":"replacement","rank":22,"parts":[0.0,0.0,0.14,0.0,0.0],"note":"Closest network paper: [[3164308]] (coupling 0.05, 3 shared references).","abstract":"We analyze the prospects of quantitatively detecting vacuum birefringence from magnetars using the IXPE and eXTP experiments. We adopt a realistic spatially-varying magnetic field profile for magnetars and use the one-loop refractive indices, without expanding in $B/B_{\\rm c}$, to calculate the differential time delay and accumulated phase between the two photon polarization eigenmodes. Including the extended magnetosphere enhances the time delay by a factor of 1.2--1.7 relative to a constant-field estimate and can yield delays approaching the microsecond scale for the strongest catalogued magnetar fields. We also study the evolution of the polarization state in a varying projected magnetic field using the Stokes-vector precession equation, derive the corresponding adiabaticity condition and polarization-limiting radius, and recover the fixed-eigenaxis expressions used in our catalog analysis as a controlled limit. We calculate the Stokes parameters for all known magnetars and investigate their observability with IXPE and eXTP, including the effects of instrumental response and energy averaging. We find that both experiments can be sensitive to magnetar vacuum birefringence under favorable conditions, with 1RXS J170849.0$-$400910 being the most promising candidates. A quantitative prediction for an individual magnetar, however, additionally requires a source-specific treatment of the emission mechanism, viewing geometry, plasma environment, and magnetospheric scattering, which we do not tackle in this study."},{"arxiv":"2305.05624","id":"2658150","title":"Spontaneous Mutations from Terahertz Proton Tunneling","authors":"Noah Bray-Ali","score":2.1,"section":"replacement","rank":23,"parts":[0.0,0.0,0.14,0.0,0.0],"note":"Closest network paper: [[2933568]] (coupling 0.05, 1 shared references).","abstract":"Protons in the bonds between base pairs of the double helix store the code of life by breaking the dyad symmetry that swaps the sense strand with its complementary partner. When these bonds break during replication and transcription, pairs of protons switch sides, restoring dyad symmetry and destroying genetic information. The observed rate of such spontaneous mutations is obtained in the sudden approximation for bond breaking provided protons in bonds between bases tunnel across the gap with terahertz frequency."},{"arxiv":"2611.00141","id":"3221746","title":"The Standard Model with Non-Anticommuting $γ_5$ in the BMHV Scheme","authors":"Paul Kühler, Dominik Stöckinger, Matthias Weißwange","score":1.8,"section":"new","rank":24,"parts":[0.0,0.0,0.12,0.0,0.0],"note":"Closest network paper: [[2940264]] (coupling 0.04, 5 shared references).","abstract":"The Breitenlohner-Maison/'t Hooft-Veltman (BMHV) scheme provides a treatment of $γ_5$ in dimensional regularisation (DReg) that is guaranteed to be self-consistent at all orders, but it breaks gauge and BRST invariance at the regularised level, which must be restored by suitable counterterms. We present the complete 1-loop renormalisation of the full Standard Model in the BMHV scheme in general $R_ξ$-gauge, including all singular and all finite symmetry-restoring counterterms. We further analyse the impact of evanescent gauge interactions, which allow the photon and gluon currents to be treated either 4- or $D$-dimensionally. We show that QCD always contributes to the symmetry breaking, so that the Standard Model must be treated as a whole, and we recommend a purely 4-dimensional treatment of electroweak gauge interactions. Our results provide a necessary step towards multi-loop electroweak precision calculations with a fully consistent treatment of $γ_5$."},{"arxiv":"2611.00201","id":"3221773","title":"Quantum simulation of real-time Yukawa dynamics with qubits and qumodes","authors":"Jack Y. Araz, Jeffrey Forshaw, Ross Jenkinson","score":1.8,"section":"cross","rank":25,"parts":[0.0,0.02,0.07,0.0,0.0],"note":"Closest of your papers: [[2751074]] (coupling 0.01, 1 shared references). Closest network paper: [[2753529]] (coupling 0.02, 2 shared references).","abstract":"Real-time quantum simulation of field theories offers access to scattering and decay dynamics, circumventing the limitations of Euclidean lattice methods. However, representing bosonic fields on qubits requires a finite-dimensional approximation and can entail costly multi-qubit operations. Hybrid qubit-qumode architectures avoid this by encoding bosonic fields directly in oscillators. We formulate scattering in the (1+1)-dimensional Yukawa theory for such a device, with staggered fermions on qubits and the scalar on qumodes. Trapped ions are a natural candidate, with the fermions on the internal states of the ions and the scalar on their collective motion, so that the Yukawa coupling becomes a native spin-dependent displacement. Emulating the device with tensor networks, we study the decay of a single scalar particle and fermion-antifermion scattering around the resonance region, using observables that can be measured on the device natively. We compare the results with those obtained using lattice perturbation theory. The emulation is able to resolve corrections beyond the Dyson summation of the one-loop self-energy."},{"arxiv":"2611.00198","id":"3221765","title":"Hidden Neutrino Active Galaxy Candidates: Prospects for Catalog and Stacking Searches with IceCube, IceCube-Gen2, and KM3NeT","authors":"Mainak Mukhopadhyay, Jose Alonso Carpio, Heer Patel, Ali Kheirandish, Kohta Murase","score":1.7,"section":"cross","rank":26,"parts":[0.0,0.0,0.11,0.0,0.0],"note":"Closest network paper: [[2796272]] (coupling 0.04, 6 shared references).","abstract":"In high-energy neutrino astrophysics, the identification of high-energy neutrino sources is a central goal, and jet-quiet active galactic nuclei (AGNs) have emerged as promising candidates. For this purpose, we present a theory-guided, intrinsic X-ray selected sample of hidden neutrino AGN candidates consisting of $28$ X-ray bright AGNs (X-HiNAC), combining the {\\em Swift}/BAT and BASS surveys with dedicated {\\em NuSTAR} observations and spectral analyses. We compile their intrinsic X-ray fluxes, spectral properties, luminosity distances, and supermassive black hole masses, to provide a coherent sample for neutrino source searches. The sample is physically motivated but remains model independent given that the neutrino flux is proportional to the intrinsic X-ray flux. Using the magnetically powered corona model, we also demonstrate the prospects for individual-source and stacking searches with IceCube-Gen2 and KM3NeT. We identify promising individual targets and find that stacking the remaining sources, excluding NGC 1068, could yield a $5σ$ detection within $\\sim 5-15$ years under favorable model assumptions at the current and upcoming neutrino observatories. We highlight systematic uncertainties in the adopted source parameters, particularly the black hole masses, for which different measurement techniques can yield estimates differing by up to an order of magnitude. Such uncertainties can significantly affect the predicted neutrino emission, motivating more precise black hole mass measurements and improved broadband X-ray observations. Our findings motivate improved multiwavelength characterization of nearby AGNs and provide a guide for investigating their role as high-energy neutrino sources."},{"arxiv":"2610.07818","id":"3212179","title":"Fully charmed tetraquarks on the Lattice with controlled errors","authors":"Zhenyu Zhang, Bing-Nan Lu, Qian Wang, Qiang Zhao","score":1.7,"section":"replacement","rank":27,"parts":[0.0,0.02,0.07,0.0,0.0],"note":"Closest of your papers: [[2751074]] (coupling 0.01, 1 shared references). Closest network paper: [[2817040]] (coupling 0.02, 25 shared references).","abstract":"We introduce the lattice quark potential model (LQPM), which discretizes the nonrelativistic quark potential model on a periodic cubic lattice and diagonalizes the resulting many-body Hamiltonian exactly. Unlike variational approaches, which provide only upper bounds on the energy, LQPM removes this variational bias, and its remaining finite-volume uncertainty is removed by extrapolation. Formulated directly in coordinate space, the method is indifferent to the specific form of the potential and accommodates arbitrary interactions, such as including three-body forces and spin-orbit and tensor couplings, that are difficult to treat in conventional few-body approaches. As a benchmark, the charmonium and $Ω_{ccc}$ spectra are reproduced within a few MeV of experiment. For the fully charmed tetraquark $cc\\bar{c}\\bar{c}$, we obtain three resonances $J^P = 0^+, 1^+,$ and $2^+$ ground states above the $η_c η_c$, $η_c J/ψ$, $J/ψJ/ψ$ thresholds, respectively. Our results establish exact lattice diagonalization as a controlled, systematically improvable, and broadly applicable route to multiquark spectroscopy, providing a quantitative benchmark for the strong interaction and valuable guidance for future experimental searches for exotic hadrons."},{"arxiv":"2611.01093","id":"3221865","title":"New Scaling Relations for Nucleons in Three-Nucleon Short-Range Correlations","authors":"Misak M. Sargsian, Ilay Wischnevsky Shlush","score":1.6,"section":"cross","rank":28,"parts":[0.0,0.0,0.11,0.0,0.0],"note":"Closest network paper: [[2788951]] (coupling 0.04, 3 shared references).","abstract":"The search for three nucleon short range correlations~(3N- SRCs) in nuclei is one of the intensive areas of research in high density nuclear physics. It is in part motivated by the prediction of the above two-solar mass neutron stars based on 3N short-range forces and the subsequent observation of such stars. The 3N-SRCs serve as a \"laboratory\" for probing the dynamics of largely unknown irreducible 3N-forces. However, the identification of 3N-SRCs in high energy nuclear processes is still elusive making the prospects of their investigation problematic. In this work we introduced new dynamical parameters for 2N- and 3N- SRCs, $β_{2N}$ and $β_{3N}$ respectively, which characterize the strength of SRCs beyond combinatorial counting of nucleons in SRCs. For 2N-SRCs the introduction of $β_{2N}$ parameter resulted in a previously known and experimentally verified relation for proton and neutron momentum distributions in 2N-SRCS. For 3N-SRCs the $β_{3N}$ parameter allowed to factorize momentum distributions of nucleons in the correlation resulting in a prediction of a new scaling relation between proton and neutron momentum distributions in 3N SRCs. This relation, if valid gives a new venue for identification of 3N-SRCs in electro-nuclear processes. Even though the obtained scaling relation is relevant in the relativistic domain, the possibility of separating center of mass motion of SRCs on the light-front allows to check the validity of predicted scaling using non-relativistic ab-initio wave functions. We found surprisingly reasonable confirmation of our prediction analyzing ab-initio wave functions of nuclei in the range $3\\le A\\le 12$. This indicates the robustness of the scaling relation and opens up a new direction in searching for 3N-SRCs experimentally."},{"arxiv":"2604.00960","id":"3138534","title":"Stability analysis and double critical phenomenon in the Einstein-Maxwell-scalar theory","authors":"Zi-Qiang Zhao, Mei-Ling Yan, Zhang-Yu Nie, Jing-Fei Zhang, Xin Zhang","score":1.6,"section":"replacement","rank":29,"parts":[0.0,0.04,0.02,0.0,0.0],"note":"Closest of your papers: [[636564]] (coupling 0.01, 1 shared references). Closest network paper: [[634308]] (coupling 0.01, 1 shared references).","abstract":"We investigate the dynamical stability and phase transition behavior in a holographic superfluid model incorporating higher-order self-interaction terms $λ|ψ|^4$, $τ|ψ|^6$, and a non-minimal coupling $h(ψ)=e^{α|ψ|^2}$. Thermodynamic and dynamical stability analyzes show that the thermodynamic stability and dynamical stability of the system are consistent. Phase diagram analysis reveals rich critical and supercritical phenomena. For fixed $λ<0$ and $α$, increasing $τ$ shrinks the first-order phase transition region to a critical point and then enters the supercritical region. When varying $α$, the system can exhibit no critical point and, most notably, a double critical phenomenon in which, as $α$ increases, the system first enters the supercritical region and then re-enters the first-order phase transition region. This double critical phenomenon driven by a single parameter is reported for the first time in holographic superfluid models, revealing a complex nonmonotonic coupling effect between the non-minimal coupling and higher-order interaction terms."}],"refs":{"1263385":{"first":"Velásquez","year":2013,"nauth":1,"title":"Phenomenology of supersymmetric models with anomalous symmetries $U(1)_{H}$","role":"other"},"1862804":{"first":"de Boer","year":2021,"nauth":5,"title":"Indirect detection constraints on the scotogenic dark matter model","role":"other"},"2958466":{"first":"Bélanger","year":2025,"nauth":4,"title":"Illuminating scalar dark matter co-scattering in EFT with monophoton signatures","role":"other"},"2638716":{"first":"Chun","year":2023,"nauth":4,"title":"Fermionic dark matter in Dynamical Scotogenic Model","role":"other"},"1869725":{"first":"Yaguna","year":2021,"nauth":2,"title":"Two-component scalar dark matter in Z$_{2n}$ scenarios","role":"seed"},"2115290":{"first":"Liu","year":2022,"nauth":4,"title":"Unraveling the Scotogenic model at muon collider","role":"other"},"2843521":{"first":"Abkenar","year":2024,"nauth":3,"title":"Spin trio: A dark matter scenario","role":"other"},"3207263":{"first":"Kalita","year":2026,"nauth":1,"title":"Limits on Primordial Black Hole Evaporation from LUX-ZEPLIN","role":"other"},"2962467":{"first":"Roy","year":2025,"nauth":2,"title":"Scrutinizing fermionic Dark Matter in scotogenic model with low reheating temperature","role":"other"},"1655573":{"first":"Ellis","year":2018,"nauth":4,"title":"Simple no-scale model of modulus fixing and inflation","role":"seed"},"3184726":{"first":"Bernal","year":2026,"nauth":3,"title":"Seesaw Cosmology","role":"seed"},"3165814":{"first":"Belanger","year":2026,"nauth":7,"title":"micrOMEGAs 7: Beyond standard cosmology","role":"other"},"3094526":{"first":"Ardila-Tafurth","year":2025,"nauth":5,"title":"Feasibility t const PS=['Citations','Your papers','Network','Authors','Topics'];   // short labels for phones
function list(){const box=document.getElementById('list');
  if(!NEWS.length){box.innerHTML=`<div class="empty">No paper in this listing reaches a score of ${M.threshold}.</div>`;document.getElementById('mainnet').hidden=true;return}
  NEWS.forEach(n=>{const d=document.createElement('article');d.className='paper';d.id='p'+n.i;
    d.innerHTML=`<div class="role" style="color:${col(n)}">#${n.rank} · ${esc(SEC[n.section])} · score ${n.score.toFixed(1)}</div>
    <h2>${esc(n.title)}</h2>
    <div class="authors">${authors(n.authors)} · arXiv:${esc(n.arxiv)}</div>
    <p class="abs">${esc(n.abstract)}</p><button class="linkbtn absmore" type="button" hidden>More</button>
    <p class="why">${why(n.note)}</p>
    <div class="row"><div class="bars">${n.parts.map((v,j)=>`<span><span class="pl">${P[j]}</span><span class="ps">${PS[j]}</span> <span class="mb"><i style="width:${Math.round(v*100)}%"></i></span></span>`).join('')}</div><span>${n.nlinked} of ${n.nref} references linked to INSPIRE · refs from ${esc(n.src)}</span></div>
    <div class="links">${n.id?`<a href="https://inspirehep.net/literature/${n.id}" target="_blank" rel="noopener">INSPIRE</a>`:''}<a href="https://arxiv.org/abs/${esc(n.arxiv)}" target="_blank" rel="noopener">arXiv</a><a href="https://arxiv.org/pdf/${esc(n.arxiv)}" target="_blank" rel="noopener">PDF</a>${n.html?`<a href="https://arxiv.org/html/${esc(n.arxiv)}" target="_blank" rel="noopener" title="arXiv's experimental HTML version">HTML</a>`:''}<button class="linkbtn graphbtn" type="button">Show in network</button></div>`;
    d.querySelector('.graphbtn').addEventListener('click',()=>pick(n,true));
    d.querySelector('.absmore').addEventListener('click',e=>{const o=d.classList.toggle('open');e.target.textContent=o?'Less':'More'});
    box.appendChild(d)});
  toc();tex(box)}
// Phones: long author lists show the first 3 and "et al." (tap to expand); abstracts fold to 3 lines with More.
function authors(s){const a=String(s||'').split(', ');if(a.length<=3)return esc(s);
  return `<span class="au-short">${esc(a.slice(0,3).join(', '))} <button class="aubtn" type="button" aria-label="Show all ${a.length} authors">et al. (+${a.length-3})</button></span><span class="au-full">${esc(s)}</span>`}
document.addEventListener('click',e=>{const b=e.target.closest('.aubtn');if(b)b.closest('.authors').classList.add('open')});
function fold(){document.querySelectorAll('.paper').forEach(d=>{const p=d.querySelector('.abs'),b=d.querySelector('.absmore');
  if(!p||!b||d.classList.contains('open'))return;b.hidden=!(p.scrollHeight>p.clientHeight+2)})}
function toc(){const t=document.getElementById('toc');if(!NEWS.length)return;t.hidden=false;
  const X=RAW.next||[];
  t.innerHTML=`<h3>In this listing</h3><ol>${NEWS.map(n=>`<li><a href="#p${n.i}"><span class="sc${n.role==='repl'?' repl':''}">${n.score.toFixed(0)}</span><span class="tt">${esc(n.title)}</span></a></li>`).join('')}${X.length?`<li class="more-link"><a href="#more"><span class="sc">+${X.length}</span><span class="tt">The next ${X.length} papers by score (folded)</span></a></li>`:''}</ol>`;
  const m=t.querySelector('.more-link a');if(m)m.addEventListener('click',()=>{document.getElementById('more').open=true});tex(t)}
let sel=NEWS[0]||null, hover=null, query='', G;
const svg=d3.select('#svg'), tip=document.getElementById('tip');
function draw(){
  if(!NEWS.length)return;
  const RNG=d3.randomLcg(11);
  const W=Math.max(300,document.getElementById('chart').clientWidth), H=W<600?500:480, m={l:16,r:16,t:20,b:34};
  svg.attr('viewBox',`0 0 ${W} ${H}`); svg.selectAll('*').remove();
  const yrs=d3.extent(N,n=>n.year);
  const x=d3.scaleLinear().domain([yrs[0]-.5,yrs[1]+1.2]).range([m.l+8,W-m.r-8]);
  const ticks=x.ticks(W<600?6:12).filter(t=>Number.isInteger(t)&&t<=yrs[1]);
  svg.append('g').attr('class','grid').selectAll('line').data(ticks).join('line').attr('x1',d=>x(d)).attr('x2',d=>x(d)).attr('y1',m.t).attr('y2',H-m.b);
  svg.append('g').attr('class','axis').attr('transform',`translate(0,${H-m.b})`).call(d3.axisBottom(x).tickValues(ticks).tickFormat(d3.format('d')).tickSizeOuter(0));
  const cy=(m.t+H-m.b)/2, xf=n=>isNew(n)?x(yrs[1]+.75):x(n.year);
  const sim=N.map(n=>({n,x:xf(n)+(RNG()-.5)*4,y:cy+(RNG()-.5)*H*.5}));
  const links=E.map(e=>({source:sim[e.s],target:sim[e.t],s:e.s,t:e.t,k:e.k}));
  d3.forceSimulation(sim).force('x',d3.forceX(s=>xf(s.n)).strength(1)).force('y',d3.forceY(cy).strength(.04))
    .force('link',d3.forceLink(links).strength(.03)).force('charge',d3.forceManyBody().strength(-40))
    .force('col',d3.forceCollide(s=>r(s.n)+2)).stop().tick(320);
  sim.forEach(s=>{s.y=Math.max(m.t+8,Math.min(H-m.b-8,s.y));s.x=Math.max(m.l+4,Math.min(W-m.r-4,s.x))});
  G=svg.append('g');
  G.append('g').selectAll('path').data(links).join('path').attr('class',l=>'edge '+l.k)
    .attr('d',l=>{const a=l.source,b=l.target;return `M${a.x},${a.y}Q${(a.x+b.x)/2},${(a.y+b.y)/2-Math.abs(a.x-b.x)*.12} ${b.x},${b.y}`});
  G.append('g').selectAll('circle').data([...sim].sort((a,b)=>RANK[b.n.role]-RANK[a.n.role])).join('circle')
    .attr('class','node').attr('cx',s=>s.x).attr('cy',s=>s.y).attr('r',s=>r(s.n)).attr('fill',s=>col(s.n))
    .on('pointerenter',(ev,s)=>{hover=s.n;showTip(ev,s.n);paint()}).on('pointermove',(ev,s)=>showTip(ev,s.n))
    .on('pointerleave',()=>{hover=null;tip.hidden=true;paint()}).on('click',(ev,s)=>pick(s.n,false));
  const lab=sim.filter(s=>isNew(s.n)||s.n.role==='seed'||s.n.deg>=3);
  const L=lab.map(s=>{const right=s.x>W*.8,t=isNew(s.n)?`#${s.n.rank} ${s.n.first}`:`${s.n.first} ${s.n.year}`,w=t.length*6.2;return{s,t,right,x0:right?s.x-r(s.n)-4-w:s.x+r(s.n)+4,w,y:s.y+4}}).sort((a,b)=>a.y-b.y);
  const placed=[];L.forEach(l=>{let k=0;while(k<40&&placed.some(p=>l.x0<p.x0+p.w&&p.x0<l.x0+l.w&&Math.abs(l.y-p.y)<13)){l.y+=13*(k%2?-1:1)*(1+Math.floor(k/2));k++;l.y=Math.max(m.t+10,Math.min(H-m.b-4,l.y))}placed.push(l)});
  G.append('g').selectAll('text').data(L).join('text').attr('class','nlabel').attr('x',l=>l.right?l.s.x-r(l.s.n)-4:l.s.x+r(l.s.n)+4).attr('y',l=>l.y)
    .attr('text-anchor',l=>l.right?'end':'start').text(l=>l.t);
  paint();
}
function showTip(ev,n){const b=document.getElementById('chart').getBoundingClientRect();tip.hidden=false;tip.textContent=`${auth(n)} (${n.year}) — ${plain(n.title)}`+(isNew(n)?` · score ${n.score}`:'');
  let L=ev.clientX-b.left+12;if(L>b.width-290)L=ev.clientX-b.left-290;tip.style.left=Math.max(4,L)+'px';tip.style.top=(ev.clientY-b.top+12)+'px'}
function paint(){if(!G)return;const f=hover||sel,on=new Set();if(f){on.add(f.i);f.out.forEach(i=>on.add(i));f.inn.forEach(i=>on.add(i))}
  svg.classed('dim',!!f);
  G.selectAll('path.edge').attr('class',l=>'edge '+l.k+(!f?'':l.s===f.i?' hot out':l.t===f.i?' hot in':''));G.selectAll('path.edge.hot').raise();
  G.selectAll('circle').classed('on',s=>on.has(s.n.i)).classed('sel',s=>sel&&s.n.i===sel.i).classed('match',s=>query&&`${s.n.first} ${s.n.title} ${s.n.arxiv} ${s.n.authors||''}`.toLowerCase().includes(query));
  G.selectAll('text.nlabel').classed('on',l=>on.has(l.s.n.i))}
function panel(){const p=document.getElementById('panel'),n=sel;
  if(!n){p.innerHTML='<p>Select a paper in the network.</p>';return}
  const links=`<div class="links">${n.id?`<a href="https://inspirehep.net/literature/${n.id}" target="_blank" rel="noopener">INSPIRE</a>`:''}${n.arxiv?`<a href="https://arxiv.org/abs/${esc(n.arxiv)}" target="_blank" rel="noopener">arXiv</a>`:''}</div>`;
  if(isNew(n)) p.innerHTML=`<div class="role" style="color:${col(n)}">#${n.rank} · ${esc(SEC[n.section])} · score ${n.score.toFixed(1)}</div><h4>${esc(n.title)}</h4>
   <div class="meta">${esc(auth(n))} · arXiv:${esc(n.arxiv)}</div><p>${why(n.note)}</p><div class="links"><a href="#p${n.i}">Back to abstract</a></div>`;
  else p.innerHTML=`<div class="role" style="color:${col(n)}">${esc(ROLE[n.role])}</div><h4>${esc(n.title)}</h4>
   <div class="meta">${esc(auth(n))} · ${n.year}${n.arxiv?' · arXiv:'+esc(n.arxiv):''}</div>
   <div class="stats"><span>${n.cites.toLocaleString()} citations</span><span>${n.inn.filter(i=>isNew(N[i])).length} of the matches link here</span></div>${links}`;
  tex(p)}
function pick(n,scroll){sel=n;panel();paint();document.querySelectorAll('.paper').forEach(el=>el.classList.toggle('sel',el.id==='p'+n.i));if(scroll)document.getElementById('chart').scrollIntoView({behavior:'smooth',block:'nearest'})}
const present=new Set(N.map(n=>n.role));
document.getElementById('legend').innerHTML=['today','repl','seed','other'].filter(k=>present.has(k)).map(k=>`<span><i class="dot" style="background:var(--${k})"></i>${esc(ROLE[k])}</span>`).join('')+'<span style="color:var(--fg-3)">Listing papers: size ∝ score; others: size ∝ log(citations)</span>';
document.getElementById('q').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();paint()});
svg.on('click',ev=>{if(ev.target.tagName!=='circle'){sel=null;panel();paint()}});
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(draw,200)});
function nextList(){const X=RAW.next||[];if(!X.length)return;const box=document.getElementById('nextlist'),more=document.getElementById('more');
  more.hidden=false;more.querySelector('summary').firstChild.textContent=`The next ${X.length} papers by score `;
  document.getElementById('moresub').textContent=`below the threshold of ${M.threshold}, not drawn in the network`;
  box.innerHTML=X.map(n=>`<li><div class="role" style="color:var(--${n.section==='replacement'?'repl':'today'})">#${n.rank} · ${esc(SEC[n.section])} · score ${n.score.toFixed(1)}</div>
    <div class="t">${esc(n.title)}</div><div class="authors">${authors(n.authors)} · arXiv:${esc(n.arxiv)}</div>
    ${n.note?`<p class="why">${why(n.note)}</p>`:''}
    <details class="abs"><summary>Abstract</summary><p class="abs">${esc(n.abstract)}</p></details>
    <div class="links">${n.id?`<a href="https://inspirehep.net/literature/${n.id}" target="_blank" rel="noopener">INSPIRE</a>`:''}<a href="https://arxiv.org/abs/${esc(n.arxiv)}" target="_blank" rel="noopener">arXiv</a><a href="https://arxiv.org/pdf/${esc(n.arxiv)}" target="_blank" rel="noopener">PDF</a></div></li>`).join('');
  more.addEventListener('toggle',()=>{if(more.open)tex(box)})}
const rtip=document.getElementById('reftip');let rcur=null;
function refShow(el){const r=REFS[el.dataset.ref];if(!r)return;rcur=el;rtip.textContent=`${auth(r)} (${r.year}) — ${plain(r.title)}`;rtip.hidden=false;
  const b=el.getBoundingClientRect(),t=rtip.getBoundingClientRect();let L=Math.min(Math.max(8,b.left),innerWidth-t.width-8),T=b.bottom+6;
  if(T+t.height>innerHeight-8)T=b.top-t.height-6;rtip.style.left=L+'px';rtip.style.top=T+'px'}
function refHide(){rtip.hidden=true;rcur=null}
document.addEventListener('pointerover',e=>{const el=e.target.closest('.ref');if(el&&e.pointerType==='mouse')refShow(el)});
document.addEventListener('pointerout',e=>{if(e.target.closest('.ref')&&e.pointerType==='mouse')refHide()});
document.addEventListener('click',e=>{const el=e.target.closest('.ref');if(el)refShow(el);else if(rcur)refHide()});
document.addEventListener('focusin',e=>{const el=e.target.closest('.ref');if(el)refShow(el)});
document.addEventListener('focusout',e=>{if(e.target.closest('.ref'))refHide()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')refHide()});
addEventListener('scroll',()=>{if(rcur)refHide()},{passive:true});
list();nextList();fold();draw();panel();
window.addEventListener('load',()=>{tex(document.getElementById('list'));tex(document.getElementById('panel'));fold();
  if(window.MathJax&&MathJax.startup&&MathJax.startup.promise)MathJax.startup.promise.then(()=>setTimeout(fold,300))});
addEventListener('resize',()=>{clearTimeout(window._ft);window._ft=setTimeout(fold,200)});
</script>
