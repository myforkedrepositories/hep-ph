<script>
const RAW = {"n":[{"id":"3221793","arxiv":"2611.00232","title":"Interacting scalar-fermion two-component dark matter in a gauged $\\boldsymbol{U(1)_{B-L}}$ model","first":"Neto","nauth":3,"year":2026,"cites":0,"role":"today","note":"Co-authors of yours: Yaguna. Cites your papers: [[1686334]], [[1990302]], [[1803365]], [[1764733]], [[2614919]]. Cites 14 network papers: [[3086782]], [[2864372]], [[3130997]], [[3131565]], [[2918610]], [[2913509]]…. Also cites widely used network papers: [[1518747]]. Closest of your papers: [[1990302]] (coupling 0.14, 13 shared references). Closest network paper: [[3221793]] (coupling 1.00, 66 shared references). Shared topics: two-component dark matter, discrete symmetry, complex scalar, yukawa interaction, dark sector.","score":77.6,"rank":1,"section":"new","parts":[1.0,0.45,1,0.5,0.9],"abstract":"We propose an interacting two-component dark matter model based on a gauged $U(1)_{B-L}$ extension of the Standard Model, which also accommodates neutrino masses through the type-I seesaw mechanism. The dark sector consists of a Dirac fermion $χ$ and a complex scalar $S$, which can both be stable without imposing an additional discrete symmetry and are directly coupled by a gauge-invariant Yukawa interaction. The resulting conversion, semi-conversion, and semi-annihilation processes lead to a genuinely coupled freeze-out. After imposing collider and dark matter constraints, we identify viable solutions away from the $Z'$ resonance for both mass hierarchies, $m_S > m_χ$ and $m_S < m_χ$. Despite the strong direct-detection constraints, part of the surviving parameter space remains within the reach of next-generation experiments.","authors":"Jacinto P. Neto, Farinaldo S. Queiroz, Carlos E. Yaguna","nlinked":66,"nref":70,"src":"INSPIRE","html":true},{"id":"3221883","arxiv":"2611.00930","title":"From Kination to Detection: Scotogenic Scalar Dark Matter","first":"Chun","nauth":4,"year":2026,"cites":0,"role":"today","note":"Cites your papers: [[1220579]]. Cites 17 network papers: [[2958466]], [[1846923]], [[3062873]], [[2100409]], [[2962467]], [[2638716]]…. Also cites widely used network papers: [[2817040]]. Closest of your papers: [[3094526]] (coupling 0.09, 13 shared references). Closest network paper: [[3221883]] (coupling 1.00, 97 shared references). Shared topics: scotogenic model, singlet fermion, relic abundance, scalar dark matter, dark matter mass.","score":67.4,"rank":2,"section":"new","parts":[1.0,0.26,1,0.0,0.96],"abstract":"We investigate scalar dark matter in the scotogenic model during an early kination-dominated epoch. The enhanced expansion rate causes earlier freeze-out and increases the relic abundance, opening viable dark matter masses from approximately $200~\\mathrm{GeV}$ to $1~\\mathrm{TeV}$ while reducing the need for co-annihilation with a nearly degenerate singlet fermion. Current indirect searches strongly constrain the $(100-200)~\\mathrm{GeV}$ region, whereas much of the surviving parameter space can be probed by CTA and next-generation direct detection experiments. The viable spectra also lead to complementary collider signatures, including missing transverse energy, displaced leptons, and disappearing charged tracks, providing promising tests at the HL-LHC and future lepton colliders.","authors":"Eung Jin Chun, Ranjeet Kumar, Sanjoy Mandal, Abhishek Roy","nlinked":97,"nref":101,"src":"INSPIRE","html":true},{"id":"3221889","arxiv":"2611.01158","title":"Exothermic Higgs portal: from LUX-ZEPLIN recoil to Gamma Rays","first":"Roy","nauth":2,"year":2026,"cites":0,"role":"today","note":"Cites 3 network papers: [[3215016]], [[3202840]], [[3201080]]. Also cites widely used network papers: [[1518747]]. Closest of your papers: [[1764733]] (coupling 0.03, 5 shared references). Closest network paper: [[3202840]] (coupling 0.51, 54 shared references). Shared topics: relic abundance, thermal relic, complex scalar, dark matter, dark matter particle.","score":54.6,"rank":3,"section":"new","parts":[0.84,0.1,1,0.0,0.72],"abstract":"We show that a minimal extension of the Standard Model (SM) by a single complex scalar $φ$ provides a viable inelastic exothermic, thermal relic, interpretation of the recently reported nuclear-recoil candidate from LUX-ZEPLIN (LZ). The mass terms and Higgs-portal interactions split $φ$ into two nearly degenerate real scalars, $φ_{1,2}$. For mass-splitting of a few hundred keV, $φ_2$ is cosmologically long-lived and the two states have comparable relic abundances. Taking $φ_{1,2}$ masses to be $\\sim100\\,$GeV, with off-diagonal Higgs coupling fixed by relic abundance, the exothermic down-scattering yields an order-one event expectation for the LZ exposure, without relying on the high-velocity tail of the dark matter velocity distribution required in endothermic scenarios. This scenario can be tested using different nuclear targets and with indirect dark matter searches: $φ_2\\toφ_1γγ$ decays give a broad sub-MeV photon continuum that can be probed by INTEGRAL/SPI and COSI; $φ_1φ_2$ annihilation produces a GeV-scale continuum, extending up to $\\sim$100 GeV, that is probed by Fermi-LAT observations of dwarf galaxies; current CMB constraints are satisfied and annihilation among dark matter particles captured in the Sun is strongly suppressed. Next-generation experiments could probe correlated scattering, decay, and annihilation signatures of this thermal Higgs-portal scenario.","authors":"Subhojit Roy, Jure Zupan","nlinked":153,"nref":159,"src":"INSPIRE","html":true},{"id":"3213780","arxiv":"2610.13930","title":"The LZ inelastic splitting as a probe of anomaly mediation","first":"Lee","nauth":2,"year":2026,"cites":0,"role":"repl","note":"Cites 5 network papers: [[3207263]], [[3215016]], [[3217265]], [[1982681]], [[1647573]]. Closest of your papers: [[1655573]] (coupling 0.04, 4 shared references). Closest network paper: [[3202840]] (coupling 0.21, 19 shared references). Shared topics: observed relic, relic abundance, dark matter.","score":52.5,"rank":4,"section":"replacement","parts":[0.95,0.11,0.6,0.0,0.68],"abstract":"The LZ 248 keV recoil candidate admits an interpretation in terms of pseudo-Dirac dark matter with a mixing-suppressed inelastic $Z$ interaction. In the MSSM, the Higgsino limit conflicts with the adopted solar-neutrino bound, while a gaugino realization requires an unprotected mass degeneracy. We realize such spectra in the MRSSM, where an $R$-symmetric Dirac bino produces the required $Z$ transition and wino coannihilation supplies the observed relic abundance. We impose the Higgs and gauge coupling relations of $N=2$ supersymmetry at a high scale and evolve them to low energy. With the remaining model parameters held fixed, we obtain spectra spanning roughly 300-850 GeV that satisfy the adopted constraints and have a small diagonal axial current. If anomaly mediation dominates the Majorana splitting, its local scale is tens of MeV for splittings of a few hundred keV. A five-dimensional warped construction generates this scale through Goldberger-Wise stabilization and a loop correction to the no-scale Kähler potential. The spectra remain testable through elastic scattering, solar neutrinos and long-lived charged states.","authors":"Seung J. Lee, Taewook Youn","nlinked":117,"nref":117,"src":"INSPIRE","html":true},{"id":"3216363","arxiv":"2610.26237","title":"Gravitational Dark Matter Production in Einstein-Cartan Theory","first":"Mudrunka","nauth":2,"year":2026,"cites":0,"role":"repl","note":"Cites 2 network papers: [[1998966]], [[1846588]]. Closest of your papers: [[1828504]] (coupling 0.08, 4 shared references). Closest network paper: [[2121121]] (coupling 0.17, 11 shared references). Shared topics: fermion dark matter, dark matter abundance, dark matter.","score":45.6,"rank":5,"section":"replacement","parts":[0.7,0.23,0.49,0.0,0.67],"abstract":"Introducing torsion into General Relativity leads to new four-point interactions for fermions. These are universal and must also affect any fermion dark matter. We improve existing calculations of dark matter production through the Einstein-Cartan theory four-fermion interaction by also considering the s-channel graviton exchange as another contributing process. The effect on both the total cross section as well as the momentum-dependent Boltzmann equation collision term is calculated and discussed. We also introduce the Holst term, which generally modifies the four-fermion interaction coupling constant as well as introduces two new four-fermion interactions, and discuss and compute its effect on the total produced dark matter abundance.","authors":"Kamil Mudrunka, Kazunori Nakayama","nlinked":30,"nref":30,"src":"INSPIRE","html":true},{"id":"3222307","arxiv":"2611.02500","title":"Matching $ν$2HDM onto $ν$SMEFT up to one-loop accuracy","first":"Duan","nauth":5,"year":2026,"cites":0,"role":"today","note":"Cites 3 network papers: [[1867944]], [[2087215]], [[2715897]]. Also cites widely used network papers: [[2817040]]. Closest of your papers: [[3094526]] (coupling 0.03, 11 shared references). Closest network paper: [[2163299]] (coupling 0.21, 24 shared references). Shared topics: scalar doublet.","score":44.9,"rank":6,"section":"new","parts":[0.84,0.09,0.59,0.0,0.39],"abstract":"The neutrinophilic two-Higgs-doublet model ($ν$2HDM) represents one of the most economical extensions of the Standard Model (SM) while still giving rise to a rich phenomenology. In this work, we carry out a full tree-level and one-loop matching of this ultraviolet completion onto the SM Effective Field Theory extended with right-handed neutrinos ($ν$SMEFT), including all operators up to mass dimension six. This is achieved by integrating out the heavy scalar doublet at a scale well above the electroweak scale. For the matching procedure, we employ the functional method in combination with the naive dimensional regularization and modified minimal subtraction schemes. After converting from the Green's basis to the minimal, non-redundant Warsaw-extended basis, the effects of high-scale new physics are encoded in the Wilson coefficients of both physical and evanescent operators in the $ν$SMEFT. These coefficients are given in terms of the $ν$2HDM parameters prior to spontaneous symmetry breaking. Our final expressions at the high-energy matching scale are provided as ancillary files on \\href{https://github.com/dufewe/v2HDM-to-vSMEFT}{GitHub}. This setup forms the foundation for forthcoming systematic and global analyses of the $ν$2HDM parameter space using effective field theory techniques.","authors":"Wen-Feng Duan, Xuan-Zhen He, Xin-Qiang Li, Ya-Dong Yang, Xing-Bo Yuan","nlinked":201,"nref":201,"src":"INSPIRE","html":true},{"id":"3222430","arxiv":"2611.03429","title":"DBI Softens Stiff-Phase Gravitational-Wave Spectra","first":"López","nauth":3,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[1803656]]. Closest of your papers: [[2663002]] (coupling 0.09, 14 shared references). Closest network paper: [[2857387]] (coupling 0.11, 8 shared references). Shared topics: viable parameter space, big bang nucleosynthesis, gravitational wave.","score":34.8,"rank":7,"section":"cross","parts":[0.45,0.26,0.33,0.0,0.62],"abstract":"We investigate the effect of non-canonical kinetic terms on the present-day density spectrum of primordial gravitational waves (GWs), by considering the dynamics of a scalar field governed by the Dirac--Born--Infeld (DBI) action and a runaway potential. The field, responsible for a period of inflation, subsequently enters a kinetically dominated regime, where the DBI structure reduces the equation-of-state parameter relative to the canonical kination result $w=1$, thereby softening the blue tilt of the GW spectrum. Simultaneously, the energy density of the field redshifts at a slower rate, delaying radiation domination and prolonging the stiff phase. The interplay between these two effects can lead to a potentially observable GW signal that would otherwise remain beyond the reach of future experiments in the canonical case. We test our predictions by numerically solving the background and perturbations, from inflation until radiation domination, and find viable parameter space compatible with cosmic microwave background and Big Bang Nucleosynthesis constraints.","authors":"Samuel Sánchez López, Eemeli Tomberg, Juan C. Bueno Sánchez","nlinked":99,"nref":103,"src":"INSPIRE","html":true},{"id":"2663065","arxiv":"2305.16781","title":"Looking forward to inelastic DM with electromagnetic form factors at FASER and beam dump experiments","first":"Jodłowski","nauth":1,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[1678642]]. Also cites widely used network papers: [[1362180]], [[1518747]]. Closest of your papers: [[3146383]] (coupling 0.05, 7 shared references). Closest network paper: [[3148080]] (coupling 0.20, 16 shared references). Shared topics: dark matter.","score":32.0,"rank":8,"section":"replacement","parts":[0.51,0.13,0.58,0.0,0.13],"abstract":"Inelastic Dark Matter (iDM) is an interesting thermal DM scenario that can pose challenges for conventional detection methods. However, recent studies demonstrated that iDM coupled to a photon by electric or magnetic dipole moments can be effectively constrained by intensity frontier experiments using the displaced single-photon decay signature. In this work, we show that by utilizing additional signatures for such models, the sensitivity reach can be increased towards the short-lived regime, $γcτ\\sim O(1)\\,$m, which can occur in the region of the parameter space relevant to successful thermal freeze-out. These processes are secondary iDM production taking place by upscattering in front of the decay vessel and electron scattering. Additionally, we consider dimension-6 scenarios of photon-coupled iDM - the anapole moment and the charge radius operator - where the leading decay of the heavier iDM state is $χ_1 \\to χ_0 e^+ e^-$, resulting in a naturally long-lived $χ_1$. We find that the decays of $χ_1$ at FASER2, MATHUSLA, and SHiP will constrain these models more effectively than the scattering signature considered for the elastic coupling case, while secondary production yields similar constraints as the scattering.","authors":"Krzysztof Jodłowski","nlinked":86,"nref":90,"src":"INSPIRE","html":true},{"id":"2769482","arxiv":"2403.11177","title":"$T_7$ Flavor Symmetry gym: The Key to Unlocking the Neutrino Mass Puzzle","first":"Aslam","nauth":2,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[2715897]]. Closest of your papers: [[1607572]] (coupling 0.03, 1 shared references). Closest network paper: [[2809427]] (coupling 0.09, 8 shared references). Shared topics: dirac neutrino mass, discrete symmetry, neutrino mass.","score":29.0,"rank":9,"section":"replacement","parts":[0.45,0.08,0.25,0.0,0.7],"abstract":"Recent research has indicated that the Standard Model (SM), while historically highly effective, is found to be insufficient due to its prediction of zero mass for neutrinos. With the exception of a few, the majority of the parameters related to neutrinos have been determined by neutrino oscillation experiments with excellent precision. Experiments on neutrino oscillation and neutrino mixing have shown that neutrinos are massive. To fill in gaps, discrete symmetries are becoming more common alongside continuous symmetries while describing the observed pattern of neutrino mixing. Here, we present a $T_7$ flavor symmetry to explain the masses of charged leptons and neutrinos. The light neutrino mass matrix is derived using seesaw mechanism of type I, which involves the Dirac neutrino mass matrix as well as the right-handed neutrino mass matrix. For normal and inverted mass hierarchy, we estimate the Pontecorvo-Maki-Nakagawa-Sakata matrix ($U_{PMNS}$), three mixing angles, $θ_{12}$, $θ_{23}$ and $θ_{13}$, the masses of three neutrinos, effective Majorana neutrino mass parameter $\\langle m_{ee} \\rangle$ and the other model parameters by using a powerful meta-heuristic and population-based optimization algorithm, i.e. particle swarm optimization (PSO).","authors":"Muhammad Waheed Aslam, Abrar Ahmad Zafar","nlinked":57,"nref":95,"src":"INSPIRE","html":true},{"id":"3147125","arxiv":"2604.17869","title":"Probing Cosmic-Ray-Boosted and Supernova-Sourced Sub-GeV Dark Matter with Paleo-Detectors","first":"Chu","nauth":3,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[2795517]]. Also cites widely used network papers: [[1518747]]. Closest of your papers: [[3130296]] (coupling 0.03, 5 shared references). Closest network paper: [[3115426]] (coupling 0.07, 7 shared references). Shared topics: dark matter mass, nuclear recoil, dark matter, dark matter particle.","score":28.2,"rank":10,"section":"replacement","parts":[0.48,0.09,0.2,0.0,0.55],"abstract":"Astrophysical dark matter particles with masses well below GeV-scale can be difficult to detect using conventional nuclear recoil experiments due to their low velocities in our Milky Way halo. Elastic scattering with high-energy cosmic rays or thermal production inside core-collapse supernovae can accelerate sub-GeV DM to (semi-)relativistic velocities, producing nuclear recoil energies above the keV threshold that paleo-detectors can record over geological timescales. Using olivine as the target with 100$\\,$g$\\cdot$Gyr exposure, we compute track length distributions from such (semi-)relativistic dark matter fluxes, incorporating all major backgrounds (neutrinos, uranium-chain neutrons, thorium recoils) with a statistical analysis on an Asimov dataset. We derive 95 C.L. projected sensitivity of paleo-detectors to the DM-nucleon cross section for dark matter masses between a few MeV and hundreds of MeV. Our results show that paleo-detectors are able to probe large parameter regions that are not covered by current and near-future experiments designed to detect dark matter and neutrinos. In particular, paleo-detectors offer a unique ability to record the dark matter flux from Galactic supernova events over geological times. Such cumulative exposure enables sensitivity gains of a few orders of magnitude compared to conventional experiments.","authors":"Xiaoyong Chu, Yue-Lin Sming Tsai, Mei-Wen Yang","nlinked":86,"nref":95,"src":"INSPIRE","html":true},{"id":"3165419","arxiv":"2606.05406","title":"Muon-induced di-tau production as a probe of new physics","first":"Das","nauth":4,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[3193100]]. Also cites widely used network papers: [[2817040]]. Closest of your papers: [[3130296]] (coupling 0.03, 7 shared references). Closest network paper: [[2942039]] (coupling 0.06, 10 shared references). Shared topics: direct detection, dark sector, dark matter.","score":26.7,"rank":11,"section":"replacement","parts":[0.48,0.09,0.17,0.0,0.45],"abstract":"The muon trident process, which involves coherent scattering to produce tau pairs, is a powerful tool for constraining dark sectors. We propose to explore this channel using future high-energy muon beams with the dedicated active-target detector, High-Energy Muon Electronic Research Apparatus (HEMERA). The detector would complement muon beam-dump searches by resolving prompt signatures and could operate from preparatory facilities involving an individual muon beam of the full Muon Collider. We illustrate its capabilities for a leptophilic scalar with Yukawa-like couplings that can mediate thermal dark matter production. With $10^{18}$ incident TeV-scale muons, even a compact 10 kg silicon-based HEMERA will extend current $B$-factory and $(g-2)_μ$ bounds by over an order of magnitude in coupling strength. In the leptophilic thermal dark matter paradigm, this search offers a way to probe dark sector targets beyond the neutrino floor of dark matter direct detection. This provides an additional compelling motivation for the development of high-energy muon beam infrastructure.","authors":"Sudipta Das, Luke Kupari, Mary Hall Reno, Sebastian Trojanowski","nlinked":106,"nref":113,"src":"INSPIRE","html":true},{"id":"3189977","arxiv":"2608.10104","title":"Precision tests of SM and new physics with the COHERENT Ge-mini and TEXONO data","first":"Ahmed","nauth":5,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[1421898]]. Also cites widely used network papers: [[2817040]]. Closest of your papers: [[3130296]] (coupling 0.06, 8 shared references). Closest network paper: [[2937257]] (coupling 0.11, 12 shared references).","score":25.9,"rank":12,"section":"replacement","parts":[0.48,0.15,0.3,0.0,0.0],"abstract":"A comprehensive numerical analysis of the latest germanium based coherent elastic neutrino nucleus scattering (CE$ν$NS) data from the COHERENT Ge-mini and TEXONO experiments has been conducted to test the Standard Model (SM) and search for new physics. By combining CE$ν$NS and E$ν$ES signals with a consistent treatment of detector effects and systematic uncertainties, we obtain a low energy determination of the weak mixing angle from COHERENT Ge-mini, in agreement with the SM prediction. We derive novel constraints on neutrino electromagnetic properties, including the magnetic moment, millicharge, charge radius, and anapole moment, with TEXONO providing particularly competitive bounds. Inclusion of E$ν$ES significantly improves the sensitivity to the neutrino millicharge by up to three orders of magnitude. We also investigated light scalar and vector mediators, finding striking complementarity between reactor and stopped pion sources across different mediator mass regimes. Finally, we put bounds on sterile neutral lepton production through transition dipole, scalar, and vector portals, probing masses from the sub-MeV to tens of MeV scale. Our results demonstrate that current germanium based CE$ν$NS experiments provide a powerful low energy laboratory for precision electroweak tests and complementary probes of a broad class of physics beyond the SM.","authors":"Tousib Ahmed, Ayan Chattaraj, Anirban Majumdar, Newton Nath, Rahul Srivastava","nlinked":144,"nref":155,"src":"INSPIRE","html":true},{"id":"3222204","arxiv":"2611.01634","title":"Electroweak Thermal Histories in the Minimal Type-II Seesaw Model with a Renormalization Group-Improved Effective Potential","first":"Chiang","nauth":1,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Closest of your papers: [[1249404]] (coupling 0.03, 5 shared references). Closest network paper: [[3167588]] (coupling 0.14, 13 shared references). Shared topics: seesaw model.","score":25.2,"rank":13,"section":"new","parts":[0.45,0.08,0.39,0.0,0.12],"abstract":"We study electroweak thermal histories in the minimal type-II seesaw model with a renormalization group-improved finite-temperature effective potential. The commonly used criterion $v_c/T_c>1$, with $v_c$ the broken-phase field at the critical temperature $T_c$, applied to every first-order degeneracy of the neutral-field phase structure in our survey, does not identify a strong electroweak phase transition. Treating those degeneracies as completed transitions would assign them a gravitational-wave signal they have not been shown to produce. Transitions that do nucleate, percolate and complete are found for the model. They are weak and fast, too weak on the standard sphaleron estimate to protect a baryon asymmetry from washout. Their sound wave spectra lie far below the sensitivity of planned space detectors. Their properties depend strongly on the renormalization group improvement and on the renormalization scale.","authors":"Cheng-Wei Chiang","nlinked":85,"nref":93,"src":"INSPIRE","html":true},{"id":"3219126","arxiv":"2610.35818","title":"Holographic Approaches to Hadron Structure","first":"Cappiello","nauth":3,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[3193100]]. Also cites widely used network papers: [[2817040]]. Closest of your papers: [[636564]] (coupling 0.01, 2 shared references). Closest network paper: [[2858283]] (coupling 0.03, 5 shared references). Shared topics: minimal model.","score":21.5,"rank":14,"section":"replacement","parts":[0.48,0.04,0.09,0.0,0.21],"abstract":"We give an introduction to and an overview of holographic approaches to QCD and hadron structure. After an introduction to the string-theoretic foundations of holographic QCD, we review the predictions of top-down and bottom-up models for the phenomenology of mesons, baryons, and glueballs. We focus on the top-down model following from probe flavor branes in the Witten model of low-energy Yang-Mills theory and, in the more phenomenological approach of bottom-up models, mostly on minimal models based on five-dimensional anti-de Sitter space, which also implement global symmetries and their anomalies consistently, but allow the high-energy behavior to better match real QCD.","authors":"Luigi Cappiello, Anton Rebhan, Shigeki Sugimoto","nlinked":382,"nref":615,"src":"INSPIRE","html":false},{"id":"3214084","arxiv":"2610.14170","title":"Solutions of Roy equations for variable pion mass","first":"Colangelo","nauth":1,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[3193100]]. Closest network paper: [[3193100]] (coupling 0.03, 34 shared references). Shared topics: mass below.","score":21.0,"rank":15,"section":"replacement","parts":[0.45,0.0,0.1,0.0,0.38],"abstract":"The Roy equations for the $S$ and $P$ waves are solved for pion masses below the physical value in the region between threshold and $s_A=0.84\\GeV^2$. The analysis is based on the assumption that the phenomenological input above $s_A$ can be used essentially unchanged. Moreover, for $M_π\\le M_{π,\\mathrm{phys}}$, the chiral perturbation theory predictions for the two $S$-wave scattering lengths provide a very reliable additional input to the Roy equations. The outcome is an accurate description of the $S$ and $P$ partial waves as the light-quark masses decrease towards the chiral limit. As a test of the approach, we evaluate the first few threshold parameters of the $S$, $P$, and $D$ waves via Wanders' sum rules and find excellent agreement with chiral perturbation theory across the entire range $0 \\le M_π\\le M_{π,\\mathrm{phys}}$. We further solve the Roy equations for pion masses above the physical value (up to $240\\MeV$) and show that the resulting solutions agree well with existing lattice data at $M_π=239\\MeV$. The present work paves the way for analyses of lattice data that fully incorporate the constraints of analyticity, unitarity, and crossing symmetry, and provides the basis for an accurate study of the dependence of the $σ$ and $ρ$ resonances on the light-quark masses, both of which will be addressed in future work.","authors":"Gilberto Colangelo","nlinked":81,"nref":86,"src":"INSPIRE","html":true},{"id":"3221811","arxiv":"2611.00349","title":"Top quark couplings at the muon collider","first":"Urcelay","nauth":3,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Closest of your papers: [[1455793]] (coupling 0.02, 3 shared references). Closest network paper: [[2115290]] (coupling 0.06, 5 shared references).","score":19.8,"rank":16,"section":"new","parts":[0.45,0.05,0.17,0.0,0.0],"abstract":"We present an overview of the sensitivity of a muon collider to the flavor-diagonal electroweak couplings of the top quark, using dimension-six operators of the Warsaw basis. Of the nine fermion-boson operators involving the top quark, the bounds on three are not competitive with existing limits, and we focus on the remaining six. We estimate individual $95\\%$ CL limits on the corresponding Wilson coefficients at $\\sqrt{s} = 3$, $6$, $10$, and $14$~TeV from $2σ$ statistical cross-section uncertainties, and assess the effect of an assumed systematic uncertainty. We consider six top-quark production modes: $t\\bar t$, $t \\bar t h$, $t \\bar t ν\\bar ν$, $t \\bar t μ^+ μ^-$, single-top $t\\bar b μ^- \\bar ν_μ$, and single-top-plus-Higgs, the last three for several rapidity coverages of the final-state muons. The $s$-channel $t\\bar t$ and $t\\bar t h$ processes give the strongest sensitivity to the electroweak dipole couplings, with allowed intervals narrower than the current LHC ones by factors of about $3$ to $6$ at $\\sqrt{s} = 3$ and $6$ TeV, and by an order of magnitude or more at $10$ and $14$ TeV. The left- and right-handed $ttZ$ couplings, as well as the Yukawa $tth$ couplings (for $\\sqrt{s} \\geq 6$ TeV), are best probed in $t \\bar t ν\\bar ν$ production, while the right-handed $tbW$ coupling is best probed in single-top production. For the $ttZ$ and $tbW$ couplings, the limits improve on the current LHC bounds by factors from about $1.5$ to more than an order of magnitude. Our results agree with previous analyses of the Yukawa and the dipole couplings, and provide a roadmap for more in-depth studies.","authors":"Nicolás Urcelay, Antonio O. Bouzas, F. Larios","nlinked":48,"nref":49,"src":"INSPIRE","html":true},{"id":"3215015","arxiv":"2610.18961","title":"Measuring $V_{cb}$ at electron-proton colliders","first":"Marzocca","nauth":1,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[3193100]]. Closest of your papers: [[1455793]] (coupling 0.03, 3 shared references). Closest network paper: [[2815960]] (coupling 0.04, 3 shared references).","score":19.8,"rank":17,"section":"replacement","parts":[0.45,0.08,0.11,0.0,0.0],"abstract":"We study the prospects for an independent determination of $V_{cb}$ from bottom-tagged charged-current deep-inelastic scattering at future electron-proton colliders: the EIC, LHeC, and FCC-eh. The transition $e^- c \\to ν_e b$ probes $|V_{cb}|^2$ through a process with different theoretical and experimental uncertainties from semileptonic $B$ decays. We fit ratios of $b$-tagged charged-current event counts over flavour-inclusive ones in kinematic bins, including correlated parton-distribution and flavour-tag calibration uncertainties, and floating the other CKM parameters. With projected parton distributions and tagging performance motivated by existing studies, we find a potential relative sensitivity in $|V_{cb}|$ of about $0.8\\%$ at the LHeC with $1\\,\\rm{ab}^{-1}$ of integrated luminosity and $0.7\\%$ at FCC-eh with $2\\,\\rm{ab}^{-1}$. The corresponding EIC sensitivity is instead at the level of $20 - 30 \\%$, depending on the configuration. The LHeC could thus provide a high-energy determination competitive with low-energy ones, but with substantially different dominant systematic uncertainties, on the timescale of its proposed operation between the HL-LHC and FCC-ee. We identify precise flavour-tag calibration and control of the kinematic response as the main requirements for realising this potential sensitivity.","authors":"David Marzocca","nlinked":36,"nref":40,"src":"INSPIRE","html":true},{"id":"3222243","arxiv":"2611.01683","title":"Accounting for correlations in the $ωπ$ spectral function and its implication on the leading model dependent contribution to the $τ^- \\to π^-π^0 ν_τγ$ decay","first":"Arellano","nauth":4,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Closest of your papers: [[3094526]] (coupling 0.01, 1 shared references). Closest network paper: [[3074282]] (coupling 0.03, 2 shared references).","score":18.1,"rank":18,"section":"new","parts":[0.45,0.03,0.1,0.0,0.0],"abstract":"The $ωπ$ spectral function, measured in the decay $τ^- \\to π^-ων_τ$ by the CLEO Collaboration, is described in the vector meson dominance approach. We sample the parameter space using a Metropolis Monte-Carlo algorithm and generate a set of parameters of the corresponding form factor, explicitly accounting for the correlation among them. We show the improvement in the uncertainty region of the spectral function with respect to neglecting correlations. We test the conserved vector current hypothesis by showing the agreement of the spectral function with the expected from the measurement of the cross section of $e^+e^- \\to ωπ$ by the SND experiment, and the consistency of the branching ratio of the $τ^- \\to π^-ων_τ$ decay with the value reported by the Particle Data Group. As an application, we consider the $ω$-channel of the $τ^- \\to π^-π^0ν_τγ$ process, the leading model dependent contribution in the vector meson dominance approach. We compute the contribution to the long distance electromagnetic correction function $G_\\text{EM}(t)$, of the pure $ω$-channel and its interference with the structure independent part. We show that the uncertainties, using the set of correlated parameters, are largely reduced with respect to neglecting correlations. The implication on the isospin symmetry breaking correction to the muon magnetic dipole moment estimation from tau data is found to be consistent with previous results but with improved precision.","authors":"Leonardo Esparza Arellano, Fabiola Elena Fortuna Montecillo, Antonio Rojas Ramos, Genaro Toledo Sánchez","nlinked":52,"nref":61,"src":"INSPIRE","html":true},{"id":"3222418","arxiv":"2611.03375","title":"Polarization in $Λ\\to pμ^-\\barν_μ$ as a probe of CP-violating new physics","first":"Salam","nauth":2,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Closest network paper: [[3217357]] (coupling 0.05, 4 shared references).","score":17.9,"rank":19,"section":"new","parts":[0.45,0.0,0.14,0.0,0.0],"abstract":"We investigate the normal $μ$ polarization in the hyperon decay $Λ\\to pμ^-\\barν_μ$ as a probe of new physics that violates CP, since this polarization vanishes at tree level in the Standard Model. Using an effective Lagrangian and lattice QCD form factors, we compute its sensitivity to the imaginary parts of the couplings. With the present bounds from kaon decays and the Large Hadron Collider, one coupling at a time, this sensitivity gives an effect below the Standard Model contribution from the electromagnetic final-state interaction. Only a pseudoscalar coupling with a particular phase can exceed this contribution, by several times. The final-state interaction gives the same polarization in $Λ$ and $\\barΛ$ decays, so the difference between the two decays isolates the new physics effect.","authors":"Qazi Maaz Us Salam, Ishtiaq Ahmed","nlinked":63,"nref":67,"src":"INSPIRE","html":true},{"id":"3222201","arxiv":"2611.01533","title":"Resolving the Two-Fold Ambiguity in Tau Momentum Reconstruction via a Self-Consistent Weighting Method","first":"Ping","nauth":1,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Closest network paper: [[3214449]] (coupling 0.04, 1 shared references).","score":17.5,"rank":20,"section":"new","parts":[0.45,0.0,0.11,0.0,0.0],"abstract":"The reconstruction of $τ$ lepton momenta in $e^{+}e^{-} \\to τ^{+}τ^{-}$ processes suffers from a two-fold kinematic ambiguity due to undetected neutrinos. We show that the common practice of retaining both solutions with equal weight systematically biases the extracted angular coefficients: the bias grows with the size of the $\\cos^{2}θ$ modulation of the production distribution $f(\\cosθ)$, but remains resolvable even in the nearly uniform QED limit at the $ψ(2S)$ threshold. We propose a self-consistent weighting method based on a fixed-point theorem: assigning normalized weights $w_{i} = f(\\cosθ_{i})/[f(\\cosθ_{1})+f(\\cosθ_{2})]$ yields a weighted distribution $h(x) = f(x)[1+\\varepsilon(x)]$ with $\\varepsilon(x) \\ll 1$ under a detailed balance condition. Monte Carlo simulations at $\\sqrt{s}=3.686$~GeV and $4.8$~GeV show that the fixed-point iteration converges to the true angular coefficient $α$ within statistical uncertainty, providing a robust framework for angular analysis without event-by-event ambiguity resolution.","authors":"Rong-Gang Ping","nlinked":9,"nref":9,"src":"INSPIRE","html":true},{"id":"3183654","arxiv":"2607.24550","title":"Decay constants of the two-pole $D_0^*(2300)$","first":"Yuan","nauth":3,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[3193100]]. Closest network paper: [[3193100]] (coupling 0.03, 33 shared references).","score":17.3,"rank":21,"section":"replacement","parts":[0.45,0.0,0.1,0.0,0.0],"abstract":"The nature of the scalar charmed meson $D_0^*(2300)$ remains one of the most intriguing questions in hadron spectroscopy. A prominent interpretation is a two-pole structure generated by the coupled channels $Dπ$, $Dη$, $D_s\\bar K$, and $Dη'$, in which the lower pole couples mainly to $Dπ$ and the higher pole to $D_s\\bar K$. Following this picture, we calculate the decay constants of these two poles using the effective Lagrangian approach. The resulting values, $f_{D_0^*}^{(\\mathrm{lower})}=68.46^{+0.93}_{-1.25}\\,\\mathrm{MeV}$ and $f_{D_0^*}^{(\\mathrm{higher})}=90.51^{+5.91}_{-11.64}\\,\\mathrm{MeV}$, are substantially smaller than those predicted by conventional $c\\bar q$ excited-state scenarios. This difference suggests that decay constants can serve as a sensitive probe to discriminate between different internal structures of the $D_0^*(2300)$. As a phenomenological application, we further predict the branching fractions for the Cabibbo-favored decays $B_s \\to D_s D_0^*$, $Λ_b \\to Λ_c D_0^*$, and $Ξ_b \\to Ξ_c D_0^*$ within the factorization approach. These predictions provide crucial tests to validate the two-pole interpretation of the $D_0^*(2300)$.","authors":"Qi-Wei Yuan, Jia-Ting Zhang, Ming-Zhu Liu","nlinked":75,"nref":78,"src":"INSPIRE","html":true},{"id":"3222258","arxiv":"2611.01768","title":"Heavy-meson molecules with dynamical pions","first":"Chen","nauth":4,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Closest network paper: [[3193100]] (coupling 0.03, 26 shared references).","score":17.0,"rank":22,"section":"new","parts":[0.45,0.0,0.08,0.0,0.0],"abstract":"We investigate heavy-meson molecules by treating the pion as a dynamical degree of freedom. We construct an energy-independent Hamiltonian that couples the two- and three-body Fock spaces. The two-body sector contains a pseudoscalar meson and a vector meson $H_1H_2^{*}$, while the three-body sector consists of two pseudoscalar mesons and a pion $H_1H_2 π$. The $H^*$ self-energy, the $H_1H_2^{*}$ pion-exchange interaction, and the $H_1H_2π$ three-body propagation are consistently generated through the coupling between the two Fock sectors. We use the Gaussian expansion and complex scaling methods to solve the coupled Schrödinger equation. Previous approaches usually reduce three-body effects to energy-dependent two-body kernels and solve the equations iteratively. Our approach obtains the poles by solving a single linear generalized eigenvalue problem. The eigenvectors also provide explicit wave functions in both Fock sectors, allowing a qualitative analysis of channel weights and spatial structure. We benchmark the framework in $T_{cc}^{+}$ and $X(3872)$. The benchmark results are consistent with the current experimental pole determinations. We then apply this formalism to the $BBπ$, $B\\bar{B}π$, $DBπ$ and $D\\bar{B}π$ systems. We predict one isoscalar bound state in each of these systems. The $DBπ$ and $D\\bar{B}π$ systems also contain resonances lying below and above their three-body threshold, respectively. We propose complementary searches for these resonances through $DB^*\\to DBγ$ and $D\\bar Bπ$. This coupled Fock-space framework can be readily extended to other few-body systems in which unstable constituents can decay and change the particle number.","authors":"Yan-Ke Chen, Liang-Zhen Wen, Lu Meng, Shi-Lin Zhu","nlinked":69,"nref":73,"src":"INSPIRE","html":true},{"id":"3221900","arxiv":"2611.01154","title":"Behavior of the zero modes in the Light-front for pseudo scalar particles: pion case","first":"melo","nauth":1,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Closest network paper: [[3127309]] (coupling 0.03, 5 shared references).","score":16.9,"rank":23,"section":"new","parts":[0.45,0.0,0.08,0.0,0.0],"abstract":"Light-front Quantum Field Theory (LFQFT) stands as an optimal framework for delving into the intricate substructure of hadronic bound states. In this study, we employ a Light-Front Constituent Quark Model (LFCQM) to investigate the pion's internal structure. This model has previously demonstrated significant success in describing the properties of pseudoscalar mesons. A crucial consideration within the light-front formalism is the dependence on the chosen reference frame, stemming from the explicit breaking of covariance. Herein, we meticulously analyze the contribution of zero modes to the pion's electromagnetic current. Subsequently, we explore the impact of these zero modes on observable quantities, including electromagnetic form factors, the pion's electromagnetic radius, and its weak decay constant, $f_π$. Furthermore, we comprehensively investigate the behavior of zero modes and their dependence on both the momentum transfer, $Q^2$, and the model's intrinsic parameters, such as constituent quark masses ($m_{(q,\\bar{q})}$) and the regulator mass ($m_R$). Our findings reveal a substantial dependence of light-front zero modes on the specific frame employed for the calculation of the electromagnetic current. Interestingly, we observe that the maximal contribution of the zero mode occurs at a specific four-momentum transfer, denoted as $Q^2 = -q^2 = q_Z^{2(Max.)}$.","authors":"J. Pacheco B. C. de melo","nlinked":76,"nref":82,"src":"INSPIRE","html":true},{"id":"3222284","arxiv":"2611.02185","title":"Extrapolation and explainability in hadron mass predictions with machine learning","first":"Yuksel","nauth":3,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Closest network paper: [[3193100]] (coupling 0.02, 21 shared references).","score":16.8,"rank":24,"section":"new","parts":[0.45,0.0,0.07,0.0,0.0],"abstract":"In this work, we study the predictive performance of four machine learning (ML) models for hadron masses, with particular attention to extrapolation beyond the conventional hadrons represented in the training data. Calculations are performed using a multilayer perceptron (MLP), eXtreme Gradient Boosting (XGBoost), Light Gradient Boosting Machine (LightGBM), and Gaussian process regression (GPR). ML models are trained on conventional hadrons, using features that describe valence quark content and quantum numbers. Then, we evaluate their performance on test sets and on a separate extrapolation set of 39 states, including exotic candidates and heavy baryons, none of which appear in the training or test sets. We find that the MLP achieves the lowest extrapolation Root Mean Square Error (RMSE) on the $30$ states with measured masses at $294.2 \\pm 57.9$~MeV, roughly one-third that of the other models. We also show that the MLP reproduces the overall mass scale of nine unobserved doubly heavy baryons predicted by theoretical calculations, although it underestimates the doubly bottom masses. We use SHapley Additive exPlanations (SHAP) analysis and show that heavy quark content is the most significant factor in the MLP's mass predictions, with the remaining features contributing differently across hadron types. Our results quantify the extrapolation accuracy of ML models for hadron masses and identify the features that drive the MLP predictions.","authors":"Esra Yuksel, Huseyin Bahtiyar, Derya Soydaner","nlinked":53,"nref":76,"src":"INSPIRE","html":true},{"id":"3221864","arxiv":"2611.00666","title":"Exploring the properties of low-lying excited $Ξ_c$ and $Ξ_c'$ baryons","first":"Wang","nauth":4,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Closest network paper: [[3214449]] (coupling 0.01, 1 shared references).","score":16.3,"rank":25,"section":"new","parts":[0.45,0.0,0.04,0.0,0.0],"abstract":"Motivated by the rapidly accumulating experimental data, we systematically calculate the $Ξ_c$ and $Ξ_c'$ mass spectra for the $1S$-, $1P$-, and $1D$-wave states and investigate the strong decay properties of the $1P$- and $1D$-wave states, thereby interpreting the internal structure of the currently controversial excited states and providing useful guidance for future experimental searches. The main conclusions are summarized as follows. $Ξ_c(2790)$ and $Ξ_c(2815)$ can be well explained as $Ξ_c1P\\big|J^P=1/2^-,1\\big\\rangle_λ$ and $Ξ_c1P\\big|J^P=3/2^-,1\\big\\rangle_λ$, respectively. $Ξ_c(2882)$ may correspond to $Ξ_c1P\\big|J^P=1/2^-,0\\big\\rangle_ρ$ or $Ξ_c1P\\big|J^P=1/2^-,1\\big\\rangle_ρ$; under this interpretation, $Ξ_cπ$ and $Ξ_c'π$ would be promising channels for its detection. $Ξ_c(2923)$ might be assigned to $Ξ_c'1P\\big|J^P=3/2^-,1\\big\\rangle_λ$, but further confirmation is required. $Ξ_c(2939)$ is very likely to be $Ξ_c'1P\\big|J^P=3/2^-,2\\big\\rangle_λ$ and has a good potential to be observed in the final states $Ξ_cπ$ and $Ξ_c'^{*}π$. $Ξ_c(2965)$ can be explained as $Ξ_c'1P\\big|J^P=5/2^-,2\\big\\rangle_λ$ and $Ξ_cπ$ decay channel is a promising additional mode for future experimental searches. $Ξ_c(3055)$ and $Ξ_c(3080)$ can be assigned as the quark configurations $Ξ_c1D\\big|J^P=3/2^+,2\\big\\rangle_{λλ}$ and $Ξ_c1D\\big|J^P=5/2^+,2\\big\\rangle_{λλ}$, respectively. $Ξ_c(3123)$ is possibly state $Ξ_c'1D\\big|J^P=1/2^+,1\\big\\rangle_{λλ}$ or $Ξ_c'1D\\big|J^P=5/2^+,3\\big\\rangle_{λλ}$, with the latter being more favorable. Decay channels $Λ/ΣD$ are very likely to serve as a criterion for distinguishing between these two possible candidates.","authors":"Yi-Heng Wang, Xin-Yu Chang, Hui-Hua Zhong, Li-Ye Xiao","nlinked":78,"nref":92,"src":"INSPIRE","html":true},{"id":"3221862","arxiv":"2611.00873","title":"How tightly can PBH abundance information constrain scalar-induced gravitational waves?","first":"Yu","nauth":3,"year":2026,"cites":0,"role":"today","note":"Closest of your papers: [[2826987]] (coupling 0.03, 3 shared references). Closest network paper: [[2972398]] (coupling 0.22, 24 shared references). Shared topics: primordial black hole, gravitational wave.","score":15.9,"rank":26,"section":"cross","parts":[0.0,0.08,0.63,0.0,0.41],"abstract":"Primordial black hole (PBH) abundances and scalar-induced gravitational waves (SIGWs) probe the same primordial fluctuations through different physical weights. We examine the predictive power of precise synthetic information on absolute PBH abundances over a finite stellar-mass interval, together with an exact total abundance and external population bounds. For Gaussian perturbations under a fixed quantum chromodynamics (QCD) formation prescription, two smooth, symmetric lognormal spectra satisfy the same abundance conditions while producing nonproportional leading-order SIGW spectra. The two spectra differ by about 20% when averaged over the lower of two adjacent nanohertz windows but by nearly a factor of 60 in the higher-frequency window, so the difference cannot be represented by a single rescaling of the gravitational-wave background. Peak position and width compensate with amplitude in the abundance calculation, while the higher-frequency window draws almost all its energy from scalar-mode pairs with both wavenumbers above the primordial peak. Under the principal abundance benchmark, local finite-width components yield larger contrasts at a fixed nanohertz frequency through distinct mode couplings under both the QCD and stochastic peak-curvature formation prescriptions. For a separately generated population, extending mass information over most of its abundance restricts the lognormal peak-position and width compensation and reduces the higher-window contrast, while the unequal window responses persist. These results show why joint PBH-SIGW inference must propagate primordial shapes compatible with the PBH abundance information rather than assign one tensor template to a single abundance fit.","authors":"Boliang Yu, Ruixin Zhou, Zi-Yu Tang","nlinked":47,"nref":51,"src":"INSPIRE","html":true},{"id":"3207923","arxiv":"2609.31406","title":"Topological Geometry of Neutrino Mass and Mixing","first":"Arrieta-Diaz","nauth":1,"year":2026,"cites":0,"role":"repl","note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[3094526]] (coupling 0.04, 9 shared references). Closest network paper: [[3148101]] (coupling 0.10, 12 shared references). Shared topics: neutrino mass and mixing, neutrino mass.","score":15.7,"rank":27,"section":"replacement","parts":[0.06,0.11,0.28,0.0,0.62],"abstract":"This work presents an analytical, parameter-free derivation of the lepton mixing matrix and active neutrino mass spectrum from an icosahedral $A_5$ flavor manifold coupled to the three-generation Iwahori-Hecke algebra $H_3(q)$. Partitioning the icosahedral vertex curvature across the six fundamental Weyl chambers of $H_3(q)$ fixes an elementary angular defect $Δ_{AD} = π/18$, unifying ultra-high-energy mass generation and low-energy flavor mixing as dual realizations of a single geometric invariant. At the topological braiding threshold $μ\\sim M_0$, the right-handed Majorana scale $M_0$ breaks scale invariance and drives the five-dimensional Temperley-Lieb quotient into its hyperbolic regime with loop modulus $d'_{AD} = 2\\coshΔ_{AD}$, where Quantum Yang-Baxter Baxterization projects the algebraic roots onto a hierarchical heavy spectrum $M_1 > M_2 > M_3 > 0$. Integrating out and inverting these states via a flavor-isotropic Seesaw mechanism Type-I locks in the normal mass hierarchy with $m_1 \\approx 3.64$ meV, $\\sum_i m_i \\approx 63.5$ meV, and $m_β\\approx 9.45$ meV. Simultaneously, probability conservation requires analytic continuation onto the compact unitary circle, factorizing the mixing matrix into the $A_5$ Golden Ratio baseline, a unitary boundary twist generated by the longest Coxeter involution, and a discrete Majorana parity matrix. This geometry yields $θ_{13} = 8.49^\\circ$, $θ_{12} = 32.11^\\circ$, $θ_{23} = 45^\\circ$, and maximal Dirac CP violation, $δ_{CP} = \\pm π/2$, while discrete $SO(3)$ parities quantize the relative Majorana phases, $α_{13} = -π, α_{23} = 0$, preventing $0νββ$ decay cancellation, $m_{ββ} \\approx 1.14$ meV, and suppressing renormalization group drift to $\\dotθ_{ij} \\sim 10^{-7}$ rad.","authors":"Enrique Arrieta-Diaz","nlinked":76,"nref":102,"src":"INSPIRE","html":true},{"id":"3081344","arxiv":"2511.06355","title":"Flavor from Consistency: Qualified-Axion, Anomaly Cancellation, and Emergent Unification","first":"Ahn","nauth":1,"year":2026,"cites":0,"role":"repl","note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1655573]] (coupling 0.06, 5 shared references). Closest network paper: [[2822193]] (coupling 0.09, 16 shared references). Shared topics: neutrino mass.","score":13.2,"rank":28,"section":"replacement","parts":[0.06,0.19,0.27,0.0,0.15],"abstract":"We present a framework for flavored grand unification theory (flavored-GUT) in string-derived supergravity based on $G_{\\rm SM}\\times SL(2,\\mathbb{Z})\\times U(1)_X\\times U(1)_{B-L}$, where gravity is intrinsically incorporated. We show that anomaly cancellation and Standard Model gauge coupling unification act as fundamental consistency conditions that determine the flavor structure, rather than treating flavor as an independent input. Mixed $SL(2,\\mathbb{Z})$, $U(1)_{X}$, $U(1)_{B-L}$, and gravitational anomalies are shown to vanish, with the anomalies induced by K{ä}hler transformations matched by those from chiral rotations of gauginos. For nontrivial $SL(2,\\mathbb{Z})$ transformations of SM fermions, the anomaly-free conditions impose strong constraints on the quark and lepton flavor structures while leaving the strong CP phase unchanged. Quark and lepton mass hierarchies, mixing patterns, and the flavored Peccei-Quinn sector emerge from the same underlying structure. The consistency conditions fix the $U(1)_X$ breaking scale, identified with the Froggatt-Nielsen cutoff scale, thereby determining the QCD axion decay constant and predicting the axion mass $m_a=3.35\\times10^{-8}$ eV, while simultaneously constraining the supersymmetry-breaking scale of ${\\cal O}(10)$TeV and the seesaw scale. We show that the moduli are stabilized and that gauge-invariance-induced quantized nonperturbative indices are constrained by vacuum stability. Furthermore, we demonstrate that the fundamental consistency conditions dynamically realizes a qualified QCD axion. Our results establish a predictive framework connecting flavor physics, anomaly cancellation, SM gauge coupling unification, neutrino mass generation, gravitational dynamics, and axion physics, without invoking a conventional simple unified gauge group.","authors":"Yang Hwan Ahn","nlinked":115,"nref":134,"src":"INSPIRE","html":true},{"id":"3222416","arxiv":"2611.03315","title":"The search for the Higgs Boson and the EBH mechanism","first":"Ellis","nauth":1,"year":2026,"cites":0,"role":"today","note":"Co-authors of yours: Ellis. Closest of your papers: [[1655573]] (coupling 0.04, 3 shared references). Closest network paper: [[1966767]] (coupling 0.08, 19 shared references).","score":12.0,"rank":29,"section":"cross","parts":[0.0,0.11,0.24,0.5,0.0],"abstract":"The searches for the Higgs boson at LEP and the Tevatron between 1980 and 2000 are set in the context of the underlying theory of spontaneous symmetry breaking and early phenomenological studies. The evolution of direct searches at LEP and the Tevatron are reviewed, as well as indirect constraints from precision electroweak data. Finally, the state of play in 2000 is summarised, together with the perspectives it offered for later searches.","authors":"John Ellis","nlinked":78,"nref":100,"src":"INSPIRE","html":true},{"id":"2780030","arxiv":"2404.14917","title":"Particle Swarm Optimization Based Analysis to Unlocking the Neutrino Mass Puzzle using $A_{4}\\times Z_{3}\\times Z_{10}$ Flavor Symmetry","first":"Aslam","nauth":7,"year":2026,"cites":0,"role":"repl","note":"Closest of your papers: [[731108]] (coupling 0.03, 3 shared references). Closest network paper: [[2874212]] (coupling 0.11, 10 shared references). Shared topics: discrete symmetry, neutrino mass.","score":11.5,"rank":30,"section":"replacement","parts":[0.0,0.09,0.31,0.0,0.41],"abstract":"New research has highlighted a shortfall in the Standard Model (SM) because it predicts neutrinos to have zero mass. However, recent experiments on neutrino oscillation have revealed that the majority of neutrino parameters indeed indicate their significant mass. In response, scientists are increasingly incorporating discrete symmetries alongside continuous ones for the observed patterns of neutrino mixing. In this study, we have examined a model within $SU(2)_L \\times U(1)_Y \\times A_{4}\\times S_2\\times Z_{10} \\times Z_{3}$ symmetry to estimate the neutrino masses using particle swarm optimization technique for both mass hierarchy of neutrino. This model employed a hybrid seesaw mechanism, a combination of seesaw mechanism of type-I and type-II, to establish the effective Majorana neutrino mass matrix. After calculating the mass eigenvalues and lepton mixing matrix upto second order perturbation theory in this framework, this study seeks to investigate the scalar potential for vacuum expectation values (VEVs), optimize the parameters, $U_{PMNS}$ matrix, neutrino masses: , effective neutrino mass parameters: , are predicted for both mass hierarchy through particle swarm optimization (PSO), showing strong agreement with recent experimental findings. The Dirac CP-violating phase $δ$ is measured to be $-π/2$.","authors":"M. W. Aslam, A. A. Zafar, M. N. Aslam, A. A Bhatti, T. Hussain, M. Iqbal, Mohammed S. Abdo","nlinked":70,"nref":104,"src":"INSPIRE","html":true},{"id":"3221869","arxiv":"2611.01305","title":"Lightest-mass suppression and weaker Majorana cancellation in Froggatt--Nielsen textures","first":"Yu","nauth":2,"year":2026,"cites":0,"role":"today","note":"Closest of your papers: [[1222142]] (coupling 0.09, 5 shared references). Closest network paper: [[1263385]] (coupling 0.09, 7 shared references).","score":11.3,"rank":31,"section":"new","parts":[0.0,0.23,0.25,0.0,0.06],"abstract":"The effective Majorana mass is the length of a sum of three complex electron-flavour contributions. A mass-generation model determines both their sizes and how they cancel. We compare direct effective coefficients with a three-right-handed-neutrino seesaw measure at fixed Froggatt--Nielsen charges and common lepton conditions. In the normal-ordering benchmark truncated-normal ensemble, seesaw generation lowers the lightest-mass median by a factor of 3.2 while raising the effective-mass median by 13\\%. A comparison reweighted to a common lightest-mass distribution locates nearly all of the coherent mean-square increase in weaker destructive solar-pair interference. In a fixed-amplitude phase-exchange control, the response follows the conditional phase law. A second texture exposes the competing spectral effect: smaller amplitudes can outweigh weaker cancellation in the original mean square. The interference information also affects how a prediction can be used. Replacing induced phases by independent uniform phases at unchanged posterior masses and electron weights raises the benchmark direct median by 29\\%. The matrix ensemble therefore predicts a joint arrangement of amplitudes and phases whose coherent information is lost when only masses and electron-flavour weights are retained.","authors":"Boliang Yu, Ruixin Zhou","nlinked":25,"nref":33,"src":"INSPIRE","html":true},{"id":"3221761","arxiv":"2611.00200","title":"Tests of an EP-Preserving Wake Force","first":"Banerjee","nauth":2,"year":2026,"cites":0,"role":"today","note":"Closest of your papers: [[1709434]] (coupling 0.02, 1 shared references). Closest network paper: [[3089716]] (coupling 0.11, 8 shared references). Shared topics: scalar dark matter, dark matter.","score":10.4,"rank":32,"section":"new","parts":[0.0,0.04,0.32,0.0,0.43],"abstract":"A universal quadratic coupling of ultralight scalar dark matter to ordinary matter preserves the weak equivalence principle for unscreened point particles. A finite test body is nevertheless not a passive probe: it distorts the scalar field that accelerates it. We show that this field distortion produces a differential acceleration between concentric test masses, even when their microscopic coupling is universal. We calculate this signal including how each test mass distorts the field acting on the other, deriving the weak-screening limit and extending the calculation to stronger screening using concentric spherical layers. Applying the model to MICROSCOPE, we find differential signals in both its equivalence-principle sensor SUEP, whose test masses have different compositions, and its reference sensor SUREF, whose test masses have the same composition. We combine both sensors with the dark matter wake near Earth to recast the published MICROSCOPE measurements. Within this model, existing measurements probe scalar masses up to approximately $8 \\times 10^{-9}\\,$eV and couplings below the supernova bound. An analysis using the additional frequency components of the scalar signal could extend the mass reach and probe couplings below the BBN bound.","authors":"Abhishek Banerjee, Dawid Brzeminski","nlinked":35,"nref":41,"src":"INSPIRE","html":true},{"id":"3159161","arxiv":"2605.24121","title":"Solar axions from nuclear transitions","first":"Kumar","nauth":2,"year":2026,"cites":0,"role":"repl","note":"Also cites widely used network papers: [[1783234]]. Closest of your papers: [[1941263]] (coupling 0.06, 11 shared references). Closest network paper: [[2822193]] (coupling 0.07, 9 shared references).","score":10.4,"rank":33,"section":"replacement","parts":[0.06,0.18,0.19,0.0,0.0],"abstract":"We investigate the possibility of detecting 14.4~keV and 9.4~keV solar axions and axion-like particles that could be produced in the M1 nuclear transitions of $^{57}\\mathrm{Fe}$ and $^{83}\\mathrm{Kr}$, respectively. To do so, we used data from soft X-ray observations of the quiet Sun collected by the Solar X-ray Monitor (XSM) on board India's Chandrayaan-2 lunar mission. We observe that although the effective axion-nucleon couplings for $^{83}\\mathrm{Kr}$ and $^{57}\\mathrm{Fe}$ differ only slightly, their fluxes differ by nearly three orders of magnitude. Consequently, the limit on $|g_{aN}^{\\rm eff} \\times g_{aγγ}|$ and only $g_{aγγ}$ vs. $m_a$ provide more than one order of magnitude stronger constraint for Fe than for Kr.","authors":"Tanmoy Kumar, Newton Nath","nlinked":69,"nref":80,"src":"INSPIRE","html":true},{"id":"3083489","arxiv":"2511.11100","title":"Thermal Leptogenesis in $SO(10)\\times U(1)_A$ SUSY GUT","first":"Maekawa","nauth":3,"year":2026,"cites":0,"role":"repl","note":"Closest of your papers: [[3184726]] (coupling 0.04, 7 shared references). Closest network paper: [[2851262]] (coupling 0.12, 11 shared references). Shared topics: neutrino mass.","score":10.3,"rank":34,"section":"replacement","parts":[0.0,0.11,0.35,0.0,0.18],"abstract":"We investigate thermal leptogenesis within a supersymmetric grand unified theory (SUSY GUT) based on the $SO(10) \\times U(1)_A$ symmetry, where both the doublet--triplet splitting problem and the unrealistic Yukawa relations are resolved under the natural assumption that all symmetry-allowed interactions appear with $\\mathcal{O}(1)$ coefficients. In this framework, the structures of the Dirac neutrino Yukawa couplings and right-handed neutrino masses are determined entirely by the symmetry. The baryon asymmetry of the Universe is computed taking into account the flavor effects, Higgs asymmetry contributions, and the impact of the second-lightest right-handed neutrino. While the predicted asymmetry is too small when all $\\mathcal{O}(1)$ coefficients of the Dirac neutrino Yukawa couplings are set to unity, a moderate enhancement factor $r_1 \\sim 5.4$ for the lightest right-handed neutrino mass reproduces the observed baryon asymmetry without spoiling low-energy neutrino data. This corresponds to a suppressed lightest neutrino mass, $m_{ν_1} \\sim (1/r_1) \\times (\\text{symmetry-determined value})$, typically $m_{ν_1} \\sim 4.5 \\times 10^{-4}\\,\\text{eV}$. We further explore cases where the $\\mathcal{O}(1)$ coefficients of the Dirac neutrino Yukawa couplings are $\\pm 1$, and find that roughly half of them successfully generate the observed baryon asymmetry for $r_1\\leq 11$. Moreover, the others yield results of the correct order of magnitude, although they do not generate the observed Baryon asymmetry. These findings demonstrate that thermal leptogenesis is realized in this $SO(10)\\times U(1)_A$ SUSY GUT, establishing a link between the observed baryon asymmetry and predictions for the lightest neutrino mass.","authors":"Nobuhiro Maekawa, Kei Shibata, Masato Yamanaka","nlinked":52,"nref":54,"src":"INSPIRE","html":true},{"id":"3124690","arxiv":"2603.00901","title":"New axion bounds derived from the 100-parsec Gaia DR3 white dwarf luminosity function","first":"Alberino","nauth":5,"year":2026,"cites":0,"role":"repl","note":"Also cites widely used network papers: [[1783234]]. Closest of your papers: [[1941263]] (coupling 0.05, 9 shared references). Closest network paper: [[2969908]] (coupling 0.08, 8 shared references).","score":10.3,"rank":35,"section":"replacement","parts":[0.06,0.15,0.24,0.0,0.0],"abstract":"The axion, a well-motivated hypothetical particle arising in extensions of the Standard Model, can be produced copiously within the hot, compact cores of white dwarf stars. The shape of the white dwarf luminosity function (WDLF) is a powerful tool for constraining theoretical particles that would imply an additional cooling channel in white dwarfs. In this work, and for the first time, we use the 100-parsec Gaia DR3 white dwarf sample and compare it with theoretical predictions. We have simulated synthetic populations of white dwarfs using a population synthesis code based on Monte Carlo techniques, incorporating realistic observational errors, and based on state-of-the-art white dwarf models that incorporate the anomalous cooling caused by the presence of axions. Axion bremsstrahlung emission rates were implemented using the latest theoretical calculations. We find that, for the brightest white dwarfs in the sample ($M_{\\mathrm{Bol}} < 10$), the $χ^2$ statistic is largely insensitive to the assumed stellar formation rate (SFR), which is typically the dominant uncertainty in modeling the Galactic-disk WDLF. The resulting $χ^2$ analysis disfavors a sizable additional cooling contribution. This conclusion contrasts with earlier studies in which axion-electron couplings in the range $0.7 \\times 10^{-13} < g_{ae} < 2.1 \\times 10^{-13}$ provided mildly improved fits to the Galactic-disk WDLF. We attribute the discrepancy to simplifying assumptions in previous modeling and to the substantially improved observational quality of the 100-pc Gaia DR3 sample. We obtain the upper limit $g_{ae} < 1.68 \\times 10^{-13}$ ($95\\%$ C.L.), which is among the strongest available.","authors":"Martín L. Alberino, Marcelo M. Miller Bertolami, María E. Camisassa, Andrea Caputo, Santiago Torres","nlinked":54,"nref":98,"src":"INSPIRE","html":true},{"id":"2974343","arxiv":"2509.22892","title":"BCS superconductivity in the presence of wave dark matter","first":"ChoeJo","nauth":5,"year":2026,"cites":0,"role":"repl","note":"Closest of your papers: [[1597138]] (coupling 0.02, 2 shared references). Closest network paper: [[3089716]] (coupling 0.07, 6 shared references). Shared topics: scalar dark matter, yukawa interaction, dark matter.","score":10.0,"rank":36,"section":"replacement","parts":[0.0,0.05,0.2,0.0,0.55],"abstract":"As particle physics and condensed matter physics continue to expand their boundaries, emerging intersections between the two fields suggest well-motivated frontiers for physics models. In particular, dark matter, which is cosmologically predicted to form the background to our ordinary matter, can affect the physics of materials in a fundamental sense. In this work, we investigate the scenario in which relic ultralight wave dark matter alters the superconductor Hamiltonian via a sinusoidal source term. The Yukawa interaction with the scalar dark matter changes the effective electron mass, inducing periodic perturbations of macroscopic observables such as the superconducting order parameter, whose size could be important in future experiments. We provide here the actual calculations for this scenario on the superconducting resonators, calculating the modulation size depending on the dark matter parameters.","authors":"YeolLin ChoeJo, Yechan Kim, Hye-Sung Lee, Jiheon Lee, Jaeok Yi","nlinked":62,"nref":78,"src":"INSPIRE","html":true},{"id":"2740358","arxiv":"2312.14894","title":"micrOMEGAs 6.0: N-component dark matter","first":"Alguero","nauth":8,"year":2023,"cites":254,"role":"other","note":"","score":null},{"id":"2817040","arxiv":"","title":"Review of particle physics","first":"Navas","nauth":244,"year":2024,"cites":6609,"role":"other","note":"","score":null},{"id":"1903588","arxiv":"2108.05103","title":"Revisiting the scotogenic model with scalar dark matter","first":"Ávila","nauth":3,"year":2021,"cites":24,"role":"other","note":"","score":null},{"id":"2614919","arxiv":"2212.07488","title":"The Z$_{7}$ model of three-component scalar dark matter","first":"Bélanger","nauth":4,"year":2022,"cites":32,"role":"seed","note":"","score":null},{"id":"2121121","arxiv":"2207.11218","title":"Higgs boson induced reheating and ultraviolet frozen-in dark matter","first":"Ahmed","nauth":3,"year":2022,"cites":49,"role":"other","note":"","score":null},{"id":"1413755","arxiv":"1601.01163","title":"D
