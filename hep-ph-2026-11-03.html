<script>
const RAW = {"n":[{"id":"3221793","arxiv":"2611.00232","title":"Interacting scalar-fermion two-component dark matter in a gauged $\\boldsymbol{U(1)_{B-L}}$ model","first":"Neto","nauth":3,"year":2026,"cites":0,"role":"today","note":"Co-authors of yours: Yaguna. Cites your papers: [[1803365]], [[1686334]], [[1764733]], [[1990302]], [[2614919]]. Cites 14 network papers: [[3086782]], [[3130997]], [[2864372]], [[3131565]], [[2918610]], [[2913509]]…. Also cites widely used network papers: [[1518747]]. Closest of your papers: [[1990302]] (coupling 0.14, 13 shared references). Closest network paper: [[3221793]] (coupling 1.00, 66 shared references). Shared topics: two-component dark matter, discrete symmetry, neutrino mass, yukawa interaction, dark matter model.","score":77.6,"rank":1,"section":"new","parts":[1.0,0.45,1,0.5,0.91],"abstract":"We propose an interacting two-component dark matter model based on a gauged $U(1)_{B-L}$ extension of the Standard Model, which also accommodates neutrino masses through the type-I seesaw mechanism. The dark sector consists of a Dirac fermion $χ$ and a complex scalar $S$, which can both be stable without imposing an additional discrete symmetry and are directly coupled by a gauge-invariant Yukawa interaction. The resulting conversion, semi-conversion, and semi-annihilation processes lead to a genuinely coupled freeze-out. After imposing collider and dark matter constraints, we identify viable solutions away from the $Z'$ resonance for both mass hierarchies, $m_S > m_χ$ and $m_S < m_χ$. Despite the strong direct-detection constraints, part of the surviving parameter space remains within the reach of next-generation experiments.","authors":"Jacinto P. Neto, Farinaldo S. Queiroz, Carlos E. Yaguna","nlinked":66,"nref":70,"src":"INSPIRE","html":true},{"id":"3221883","arxiv":"2611.00930","title":"From Kination to Detection: Scotogenic Scalar Dark Matter","first":"Chun","nauth":4,"year":2026,"cites":0,"role":"today","note":"Cites your papers: [[1220579]]. Cites 17 network papers: [[2958466]], [[1846923]], [[3062873]], [[2100409]], [[3165814]], [[2962467]]…. Also cites widely used network papers: [[2817040]]. Closest of your papers: [[3094526]] (coupling 0.09, 13 shared references). Closest network paper: [[3221883]] (coupling 1.00, 97 shared references). Shared topics: scotogenic model, singlet fermion, scalar dark matter, relic abundance, dark matter mass.","score":67.4,"rank":2,"section":"new","parts":[1.0,0.26,1,0.0,0.96],"abstract":"We investigate scalar dark matter in the scotogenic model during an early kination-dominated epoch. The enhanced expansion rate causes earlier freeze-out and increases the relic abundance, opening viable dark matter masses from approximately $200~\\mathrm{GeV}$ to $1~\\mathrm{TeV}$ while reducing the need for co-annihilation with a nearly degenerate singlet fermion. Current indirect searches strongly constrain the $(100-200)~\\mathrm{GeV}$ region, whereas much of the surviving parameter space can be probed by CTA and next-generation direct detection experiments. The viable spectra also lead to complementary collider signatures, including missing transverse energy, displaced leptons, and disappearing charged tracks, providing promising tests at the HL-LHC and future lepton colliders.","authors":"Eung Jin Chun, Ranjeet Kumar, Sanjoy Mandal, Abhishek Roy","nlinked":97,"nref":101,"src":"INSPIRE","html":true},{"id":"3221889","arxiv":"2611.01158","title":"Exothermic Higgs portal: from LUX-ZEPLIN recoil to Gamma Rays","first":"Roy","nauth":2,"year":2026,"cites":0,"role":"today","note":"Cites 3 network papers: [[3215016]], [[3202840]], [[3201080]]. Also cites widely used network papers: [[1518747]]. Closest of your papers: [[1764733]] (coupling 0.03, 5 shared references). Closest network paper: [[3202840]] (coupling 0.51, 54 shared references). Shared topics: relic abundance, thermal relic, dark matter particle, complex scalar, dark matter.","score":54.7,"rank":3,"section":"new","parts":[0.84,0.1,1,0.0,0.73],"abstract":"We show that a minimal extension of the Standard Model (SM) by a single complex scalar $φ$ provides a viable inelastic exothermic, thermal relic, interpretation of the recently reported nuclear-recoil candidate from LUX-ZEPLIN (LZ). The mass terms and Higgs-portal interactions split $φ$ into two nearly degenerate real scalars, $φ_{1,2}$. For mass-splitting of a few hundred keV, $φ_2$ is cosmologically long-lived and the two states have comparable relic abundances. Taking $φ_{1,2}$ masses to be $\\sim100\\,$GeV, with off-diagonal Higgs coupling fixed by relic abundance, the exothermic down-scattering yields an order-one event expectation for the LZ exposure, without relying on the high-velocity tail of the dark matter velocity distribution required in endothermic scenarios. This scenario can be tested using different nuclear targets and with indirect dark matter searches: $φ_2\\toφ_1γγ$ decays give a broad sub-MeV photon continuum that can be probed by INTEGRAL/SPI and COSI; $φ_1φ_2$ annihilation produces a GeV-scale continuum, extending up to $\\sim$100 GeV, that is probed by Fermi-LAT observations of dwarf galaxies; current CMB constraints are satisfied and annihilation among dark matter particles captured in the Sun is strongly suppressed. Next-generation experiments could probe correlated scattering, decay, and annihilation signatures of this thermal Higgs-portal scenario.","authors":"Subhojit Roy, Jure Zupan","nlinked":153,"nref":159,"src":"INSPIRE","html":true},{"id":"3222307","arxiv":"2611.02500","title":"Matching $ν$2HDM onto $ν$SMEFT up to one-loop accuracy","first":"Duan","nauth":5,"year":2026,"cites":0,"role":"today","note":"Cites 3 network papers: [[1867944]], [[2087215]], [[2715897]]. Also cites widely used network papers: [[2817040]]. Closest of your papers: [[3094526]] (coupling 0.03, 11 shared references). Closest network paper: [[2163299]] (coupling 0.21, 24 shared references). Shared topics: scalar doublet.","score":45.6,"rank":4,"section":"new","parts":[0.84,0.09,0.59,0.0,0.45],"abstract":"The neutrinophilic two-Higgs-doublet model ($ν$2HDM) represents one of the most economical extensions of the Standard Model (SM) while still giving rise to a rich phenomenology. In this work, we carry out a full tree-level and one-loop matching of this ultraviolet completion onto the SM Effective Field Theory extended with right-handed neutrinos ($ν$SMEFT), including all operators up to mass dimension six. This is achieved by integrating out the heavy scalar doublet at a scale well above the electroweak scale. For the matching procedure, we employ the functional method in combination with the naive dimensional regularization and modified minimal subtraction schemes. After converting from the Green's basis to the minimal, non-redundant Warsaw-extended basis, the effects of high-scale new physics are encoded in the Wilson coefficients of both physical and evanescent operators in the $ν$SMEFT. These coefficients are given in terms of the $ν$2HDM parameters prior to spontaneous symmetry breaking. Our final expressions at the high-energy matching scale are provided as ancillary files on \\href{https://github.com/dufewe/v2HDM-to-vSMEFT}{GitHub}. This setup forms the foundation for forthcoming systematic and global analyses of the $ν$2HDM parameter space using effective field theory techniques.","authors":"Wen-Feng Duan, Xuan-Zhen He, Xin-Qiang Li, Ya-Dong Yang, Xing-Bo Yuan","nlinked":201,"nref":201,"src":"INSPIRE","html":true},{"id":"3222430","arxiv":"2611.03429","title":"DBI Softens Stiff-Phase Gravitational-Wave Spectra","first":"López","nauth":3,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[1803656]]. Closest of your papers: [[2663002]] (coupling 0.09, 14 shared references). Closest network paper: [[2857387]] (coupling 0.11, 8 shared references). Shared topics: viable parameter space, big bang nucleosynthesis.","score":34.1,"rank":5,"section":"cross","parts":[0.45,0.27,0.33,0.0,0.55],"abstract":"We investigate the effect of non-canonical kinetic terms on the present-day density spectrum of primordial gravitational waves (GWs), by considering the dynamics of a scalar field governed by the Dirac--Born--Infeld (DBI) action and a runaway potential. The field, responsible for a period of inflation, subsequently enters a kinetically dominated regime, where the DBI structure reduces the equation-of-state parameter relative to the canonical kination result $w=1$, thereby softening the blue tilt of the GW spectrum. Simultaneously, the energy density of the field redshifts at a slower rate, delaying radiation domination and prolonging the stiff phase. The interplay between these two effects can lead to a potentially observable GW signal that would otherwise remain beyond the reach of future experiments in the canonical case. We test our predictions by numerically solving the background and perturbations, from inflation until radiation domination, and find viable parameter space compatible with cosmic microwave background and Big Bang Nucleosynthesis constraints.","authors":"Samuel Sánchez López, Eemeli Tomberg, Juan C. Bueno Sánchez","nlinked":99,"nref":103,"src":"INSPIRE","html":true},{"id":"3221862","arxiv":"2611.00873","title":"How tightly can PBH abundance information constrain scalar-induced gravitational waves?","first":"Yu","nauth":3,"year":2026,"cites":0,"role":"today","note":"Closest of your papers: [[2826987]] (coupling 0.03, 3 shared references). Closest network paper: [[2972398]] (coupling 0.22, 24 shared references). Shared topics: primordial black hole.","score":15.0,"rank":6,"section":"cross","parts":[0.0,0.08,0.63,0.0,0.33],"abstract":"Primordial black hole (PBH) abundances and scalar-induced gravitational waves (SIGWs) probe the same primordial fluctuations through different physical weights. We examine the predictive power of precise synthetic information on absolute PBH abundances over a finite stellar-mass interval, together with an exact total abundance and external population bounds. For Gaussian perturbations under a fixed quantum chromodynamics (QCD) formation prescription, two smooth, symmetric lognormal spectra satisfy the same abundance conditions while producing nonproportional leading-order SIGW spectra. The two spectra differ by about 20% when averaged over the lower of two adjacent nanohertz windows but by nearly a factor of 60 in the higher-frequency window, so the difference cannot be represented by a single rescaling of the gravitational-wave background. Peak position and width compensate with amplitude in the abundance calculation, while the higher-frequency window draws almost all its energy from scalar-mode pairs with both wavenumbers above the primordial peak. Under the principal abundance benchmark, local finite-width components yield larger contrasts at a fixed nanohertz frequency through distinct mode couplings under both the QCD and stochastic peak-curvature formation prescriptions. For a separately generated population, extending mass information over most of its abundance restricts the lognormal peak-position and width compensation and reduces the higher-window contrast, while the unequal window responses persist. These results show why joint PBH-SIGW inference must propagate primordial shapes compatible with the PBH abundance information rather than assign one tensor template to a single abundance fit.","authors":"Boliang Yu, Ruixin Zhou, Zi-Yu Tang","nlinked":47,"nref":51,"src":"INSPIRE","html":true},{"id":"3221869","arxiv":"2611.01305","title":"Lightest-mass suppression and weaker Majorana cancellation in Froggatt--Nielsen textures","first":"Yu","nauth":2,"year":2026,"cites":0,"role":"today","note":"Closest of your papers: [[1222142]] (coupling 0.09, 5 shared references). Closest network paper: [[1263385]] (coupling 0.09, 7 shared references). Shared topics: majorana mass.","score":12.4,"rank":7,"section":"new","parts":[0.0,0.23,0.25,0.0,0.17],"abstract":"The effective Majorana mass is the length of a sum of three complex electron-flavour contributions. A mass-generation model determines both their sizes and how they cancel. We compare direct effective coefficients with a three-right-handed-neutrino seesaw measure at fixed Froggatt--Nielsen charges and common lepton conditions. In the normal-ordering benchmark truncated-normal ensemble, seesaw generation lowers the lightest-mass median by a factor of 3.2 while raising the effective-mass median by 13\\%. A comparison reweighted to a common lightest-mass distribution locates nearly all of the coherent mean-square increase in weaker destructive solar-pair interference. In a fixed-amplitude phase-exchange control, the response follows the conditional phase law. A second texture exposes the competing spectral effect: smaller amplitudes can outweigh weaker cancellation in the original mean square. The interference information also affects how a prediction can be used. Replacing induced phases by independent uniform phases at unchanged posterior masses and electron weights raises the benchmark direct median by 29\\%. The matrix ensemble therefore predicts a joint arrangement of amplitudes and phases whose coherent information is lost when only masses and electron-flavour weights are retained.","authors":"Boliang Yu, Ruixin Zhou","nlinked":25,"nref":33,"src":"INSPIRE","html":true},{"id":"3222416","arxiv":"2611.03315","title":"The search for the Higgs Boson and the EBH mechanism","first":"Ellis","nauth":1,"year":2026,"cites":0,"role":"today","note":"Co-authors of yours: Ellis. Closest of your papers: [[1655573]] (coupling 0.04, 3 shared references). Closest network paper: [[1966767]] (coupling 0.09, 19 shared references).","score":12.2,"rank":8,"section":"cross","parts":[0.0,0.12,0.24,0.5,0.0],"abstract":"The searches for the Higgs boson at LEP and the Tevatron between 1980 and 2000 are set in the context of the underlying theory of spontaneous symmetry breaking and early phenomenological studies. The evolution of direct searches at LEP and the Tevatron are reviewed, as well as indirect constraints from precision electroweak data. Finally, the state of play in 2000 is summarised, together with the perspectives it offered for later searches.","authors":"John Ellis","nlinked":78,"nref":100,"src":"INSPIRE","html":true},{"id":"3221761","arxiv":"2611.00200","title":"Tests of an EP-Preserving Wake Force","first":"Banerjee","nauth":2,"year":2026,"cites":0,"role":"today","note":"Closest of your papers: [[1709434]] (coupling 0.02, 1 shared references). Closest network paper: [[3089716]] (coupling 0.12, 8 shared references). Shared topics: scalar dark matter, dark matter.","score":10.7,"rank":9,"section":"new","parts":[0.0,0.04,0.33,0.0,0.46],"abstract":"A universal quadratic coupling of ultralight scalar dark matter to ordinary matter preserves the weak equivalence principle for unscreened point particles. A finite test body is nevertheless not a passive probe: it distorts the scalar field that accelerates it. We show that this field distortion produces a differential acceleration between concentric test masses, even when their microscopic coupling is universal. We calculate this signal including how each test mass distorts the field acting on the other, deriving the weak-screening limit and extending the calculation to stronger screening using concentric spherical layers. Applying the model to MICROSCOPE, we find differential signals in both its equivalence-principle sensor SUEP, whose test masses have different compositions, and its reference sensor SUREF, whose test masses have the same composition. We combine both sensors with the dark matter wake near Earth to recast the published MICROSCOPE measurements. Within this model, existing measurements probe scalar masses up to approximately $8 \\times 10^{-9}\\,$eV and couplings below the supernova bound. An analysis using the additional frequency components of the scalar signal could extend the mass reach and probe couplings below the BBN bound.","authors":"Abhishek Banerjee, Dawid Brzeminski","nlinked":35,"nref":41,"src":"INSPIRE","html":true},{"id":"3222204","arxiv":"2611.01634","title":"Electroweak Thermal Histories in the Minimal Type-II Seesaw Model with a Renormalization Group-Improved Effective Potential","first":"Chiang","nauth":1,"year":2026,"cites":0,"role":"today","note":"Closest of your papers: [[1249404]] (coupling 0.03, 5 shared references). Closest network paper: [[3167588]] (coupling 0.14, 13 shared references). Shared topics: seesaw model.","score":10.3,"rank":10,"section":"new","parts":[0.0,0.08,0.39,0.0,0.21],"abstract":"We study electroweak thermal histories in the minimal type-II seesaw model with a renormalization group-improved finite-temperature effective potential. The commonly used criterion $v_c/T_c>1$, with $v_c$ the broken-phase field at the critical temperature $T_c$, applied to every first-order degeneracy of the neutral-field phase structure in our survey, does not identify a strong electroweak phase transition. Treating those degeneracies as completed transitions would assign them a gravitational-wave signal they have not been shown to produce. Transitions that do nucleate, percolate and complete are found for the model. They are weak and fast, too weak on the standard sphaleron estimate to protect a baryon asymmetry from washout. Their sound wave spectra lie far below the sensitivity of planned space detectors. Their properties depend strongly on the renormalization group improvement and on the renormalization scale.","authors":"Cheng-Wei Chiang","nlinked":85,"nref":93,"src":"INSPIRE","html":true},{"id":"1263385","arxiv":"1311.0891","title":"Phenomenology of supersymmetric models with anomalous symmetries $U(1)_{H}$","first":"Velásquez","nauth":1,"year":2013,"cites":0,"role":"other","note":"","score":null},{"id":"1989085","arxiv":"2112.06847","title":"Singlet-doublet self-interacting dark matter and radiative ne s widely used network papers: [[1783234]]. Closest of your papers: [[1941263]] (coupling 0.05, 8 shared references). Closest network paper: [[1758016]] (coupling 0.07, 7 shared references).","abstract":"The interaction between relativistic electron beams and plasma can generate magnetic fields with strengths of $\\sim 10^4$ T far exceeding conventional magnets, which offers a promising environment for producing weakly coupled particles. Using particle-in-cell simulations incorporating an axion-emission model, we show that a 10-GeV electron beam traversing dense plasma emits a forward-collimated axion beam during the ion-mediated nonlinear stage of current filamentation instability. Although the electron-driven linear instability seeds the filaments, ion motion governs their subsequent expansion and coalescence. This evolution reinjects cold-core electrons into large-amplitude orbits in phase space, where they repeatedly cross the strong-field flanks of neighboring magnetic vortices, thereby enhancing axion emission. At a background-plasma density of $\\sim 10^{21}\\mathrm{cm}^{-3}$, suppressing ion motion reduces the axion yield by a factor of 14.5. Our results demonstrate that ion dynamics play a crucial role in characterizing the emission of weakly coupled particles induced by relativistic filamentation instabilities, suggesting a new beam-driven method for probing the axion-electron interaction at accelerators."},{"arxiv":"2611.00306","id":"3221785","title":"Proposal for the resolution of the disagreement between DAMA and other Underground Dark Matter Experiments","authors":"C. D. Froggatt, H. B. Nielsen","score":8.0,"section":"new","rank":12,"parts":[0.0,0.07,0.2,0.0,0.3],"note":"Closest of your papers: [[3094526]] (coupling 0.03, 1 shared references). Closest network paper: [[1862804]] (coupling 0.07, 2 shared references). Shared topics: dark matter particle, dark matter.","abstract":"It is a great mystery still needing a solution that the underground experiments looking for dark matter disagree, in tIt is a great mystery still needing a solution that the underground experiments looking for dark matter disagree, in the sense that DAMA/LIBRA has found dark matter with a confidence level of several standard deviations, while neither the xenon based experiments nor even the experiments using the same target material NaI(Tl) as DAMA see the same amount of dark matter. We propose to solve this enigma by postulating that the dark matter gets excited during its passage through the mountain shielding from outer space down to the experimental halls; the DAMA experiment is namely about twice as deep as the ANAIS and COSINE-100 experiments, so that there is longer passage time for DAMA, which thus gets more excited dark matter particles. The xenon-scintillator experiments have their strong limits for dark matter making itself felt via nucleus recoils, and thus we can just assume that the excited dark matter mainly emits e.g. electrons, and the xenon-experiments would hardly see such dark matter. The single event recently seen by LUX/ZEPPELIN could be due to a low rate of nucleus emission in addition to the hypothesised electrons."},{"arxiv":"2611.03373","id":"3222389","title":"Towards AI-Agent-Accelerated Research in High-Energy Physics: A Case Study in Monte Carlo Analysis","authors":"Tianqi Gao, Ruobing Jiang","score":7.1,"section":"new","rank":13,"parts":[0.0,0.15,0.17,0.0,0.0],"note":"Closest of your papers: [[1455793]] (coupling 0.06, 4 shared references). Closest network paper: [[1674879]] (coupling 0.06, 3 shared references).","abstract":"We investigate how far contemporary LLM-based agents can participate in multistep computational high-energy-physics research under reproducible human supervision. Using a previously published CEPC Bell-observable analysis in $e^+e^- \\to ZH$, $Z \\to q\\bar q$, $H \\to ZZ^* \\to 4μ$ as a case study, we test two capabilities. First, the agent performs an instruction-constrained reproduction: it is explicitly instructed not to use the published numerical results as analysis targets, although no technical information-access barrier is imposed. The analysis definition is fixed before the formal comparison, and the resulting detector-level $I_3$ central values reproduce the four published benchmark points to within about 2% without retuning to those values. Second, the agent is used for an open-ended extension with no target answer supplied. Using 200,000 fast-simulated events, a stage-resolved audit identifies muon isolation as the largest single contribution to the hard-to-detector shift, and subsequent diagnostics connect the effect to angle-dependent isolation efficiency, proximity to the hard $Z \\to q\\bar q$ system, and mixed electromagnetic activity from muon final-state radiation and hadron decays. Throughout, the agent assists with workflow planning, code and configuration inspection, Monte Carlo production, anomaly diagnosis, control construction, statistical analysis, and result organization, while state-changing actions and final interpretation remain under human control. The study shows that the value of AI agents in HEP may lie not only in faster code generation, but in faster scientific iteration, and motivates systematic benchmarking across historical HEP analyses using correctness, human intervention, and researcher-time efficiency as explicit metrics."},{"arxiv":"2611.02987","id":"3222372","title":"Machine-learning discovery potential for a heavy Higgs boson in $e^+e^-\\to ZH$ at a future lepton collider","authors":"Majid Hashemi, Faezeh Nasirzadeh","score":6.4,"section":"new","rank":14,"parts":[0.0,0.09,0.25,0.0,0.0],"note":"Closest of your papers: [[1455793]] (coupling 0.03, 3 shared references). Closest network paper: [[2686887]] (coupling 0.09, 8 shared references).","abstract":"We study the discovery potential for a CP-even heavy neutral Higgs boson $H$ in the Type-I two-Higgs-doublet model (2HDM) at a future $e^+e^-$ collider with $\\sqrt{s}=500~\\mathrm{GeV}$, focusing on the process $e^+e^-\\to ZH$ with $H\\to WW$, and with $Z\\to\\ell\\ell$ or $Z\\toνν$. The final states are four jets plus two leptons ($4j2\\ell$) and four jets plus missing transverse momentum ($4j2ν$). We compare a cut-based analysis with two multivariate strategies: a one-dimensional Boosted Decision Tree (BDT) trained per mass point, and a two-dimensional (BDT $\\times$ $m_H$) template analysed with a profile likelihood. The 2D template improves the expected discovery significance by a factor of $2.5$--$3.6$ in the $4j2\\ell$ channel and by a factor of $5$--$18$ in the $4j2ν$ channel relative to the cut-based analysis, with the largest gains at high $m_H$ where the cut-based mass window loses efficiency. We translate the expected exclusions into $95\\%$ CL upper limits on $σ\\times$ BR and discuss the implications for the Type-I 2HDM parameter space."},{"arxiv":"2611.01997","id":"3222274","title":"Boundedness from below in the real Weinberg three-Higgs-doublet model","authors":"Fayez Abu-Ajamieh","score":6.3,"section":"new","rank":15,"parts":[0.0,0.08,0.25,0.0,0.0],"note":"Closest of your papers: [[1803365]] (coupling 0.03, 1 shared references). Closest network paper: [[2815355]] (coupling 0.09, 4 shared references).","abstract":"We study the boundedness-from-below (BFB) conditions of the quartic potential in the real Weinberg three-Higgs-doublet model (3HDM). Unlike an analysis restricted to neutral Higgs fields, a complete stability test must also allow for charge-breaking directions. We show that the problem can be reduced to a finite set of 28 stationary configurations, 14 neutral and 14 charged, each of which can be treated using a linear system of size at most four. The main simplification comes from the one-dimensional kernel of the Gram matrix for charged configurations, while the phase equations reduce to two possibilities: aligned phases or phases forming a closed triangle. We further show how to deal exactly with singular choices of the couplings by introducing an auxiliary deformation and taking an algebraic limit. For rational couplings, the normalized minimum is rational and an attaining field configuration can be constructed algebraically. We discuss analytical examples, exact checks, and comparisons with numerical minimization and StableWein. Our result applies to arbitrary real quartic couplings; it does not cover complex phase coefficients or settle the full-potential stability problem when the quartic is flat."},{"arxiv":"2611.02559","id":"3222326","title":"Thermal Festina Lente","authors":"Fayez Abu-Ajamieh, Nobuchika Okada, Roman Pasechnik, Victoria Venken, Zhi-Wei Wang","score":6.2,"section":"cross","rank":16,"parts":[0.0,0.11,0.19,0.0,0.0],"note":"Closest of your papers: [[3184726]] (coupling 0.03, 8 shared references). Closest network paper: [[2802615]] (coupling 0.07, 7 shared references).","abstract":"According to the Festina Lente bound, particles charged under a $U(1)$ gauge field cannot be too light. Otherwise, the largest charged black holes of de Sitter space would discharge in a way that leads to a crunching singularity in violation of cosmic censorship. The Festina Lente bound has previously been extended to also include a background of thermal radiation, but where vacuum energy still dominates cosmic evolution, which imposes a maximal temperature $T\\leq T_{\\max}=(cV/σ)^{1/4}$. We extend this analysis by accounting for thermal enhancement of the discharge process and making the analysis more quantitative. The result is a bound $m\\gtrsim\\ell (cV/σ)^{1/4}$ on the masses of charged particles. Here, $\\ell$ is a term that depends logarithmically on the gauge coupling and particle charge. At weak coupling this leads to a significantly stronger constraint than the $\\sqrt{gq}$ scaling of the original Festina Lente bound. As a result, the present vacuum energy requires every particle of charge $10^{-26}\\lesssim gq\\lesssim e$ to be heavier than $0.03$--$0.2$ eV, provided its gauge boson is lighter than the Hubble scale. An unbroken gauged $B-L$ with Dirac neutrinos gives $m_{ν,{\\rm lightest}}\\gtrsim10$--$43$ meV for $10^{-29}\\lesssim g_{B-L}\\lesssim10^{-24}$, in tension with the DESI DR2 limit once $g_{B-L}\\gtrsim7\\times10^{-28}$. The same limit bounds a neutrino millicharge to $ε_ν\\lesssim2\\times10^{-27}$. We also revisit the Standard Model effective field theory constraints from the electroweak phase transition. During slow-roll inflation the Standard Model electron violates the bound over the whole range of Hubble rates allowed by the CMB tensor limit and by nucleosynthesis, unless the photon is Higgsed, its coupling is suppressed, or one considers very fine-tuned versions of Higgs inflation."},{"arxiv":"2611.03476","id":"3222435","title":"Higgs pair production and Higgs potential in arbitrary renormalisable extensions of the Higgs sector","authors":"Henning Bahl, Johannes Braathen, Martin Gabelmann, Kateryna Radchenko Serdula, Georg Weiglein","score":5.8,"section":"new","rank":17,"parts":[0.0,0.03,0.33,0.0,0.0],"note":"Closest of your papers: [[2751074]] (coupling 0.01, 1 shared references). Closest network paper: [[2845027]] (coupling 0.12, 12 shared references).","abstract":"Higgs self-interactions are crucial for probing the up to now largely unknown form of the Higgs potential that is realised in nature. Higgs boson pair production at the (High-Luminosity) LHC is of prime importance in this context as it provides experimental access to the trilinear Higgs self-interaction that enters at leading order in this process. The predictions for the trilinear Higgs self-couplings and the shape of the Higgs potential can vastly differ from the predictions of the Standard Model (SM) as a consequence of physics beyond the SM (BSM). If additional particles are relatively light (but in agreement with all existing experimental and theoretical constraints), their effects may not necessarily be accurately described by established effective field theory methods. Because of the potentially large modifications compared to the SM predictions the di-Higgs process has a high sensitivity for probing BSM physics. In order to enable the comparison between experiment and theory for a wide range of BSM models, automatised predictions for double Higgs production are in order. In this contribution to the LHC Higgs Working Group Report 5 we present \\texttt{anyHH}, a novel tool for calculating the Higgs boson pair production cross-section in gluon fusion, which is the dominant production process for two Higgs bosons at the (HL-)LHC, for arbitrary renormalisable extensions of the Higgs sector."},{"arxiv":"2611.02007","id":"3222276","title":"Electroweak-Scale Cosmic Magnetism: Magnetogenesis, Baryogenesis, Phase Transitions and Gravitational Waves","authors":"Fayez Abu-Ajamieh","score":5.7,"section":"new","rank":18,"parts":[0.0,0.01,0.26,0.0,0.13],"note":"Closest of your papers: [[3094526]] (coupling 0.00, 1 shared references). Closest network paper: [[2134073]] (coupling 0.09, 12 shared references). Shared topics: early universe.","abstract":"Magnetic fields, the baryon asymmetry of the Universe, and stochastic gravitational waves provide complementary probes of physics in the early Universe. Near the electroweak scale, these phenomena are not necessarily independent. The electroweak anomaly allows hypermagnetic helicity to exchange charge with chiral fermions, sphalerons can change baryon and lepton number, and first-order phase transitions in extensions of the Standard Model can drive plasma motion, magnetogenesis, and gravitational waves. In this review, we explain these connections and examine the literature needed to make quantitative predictions. We begin with the properties of primordial magnetic fields and the electroweak plasma, then discuss the mechanisms that produce magnetic fields, the conversion between helicity and baryon number, magnetic backreaction, and the evolution of the field to the present day. We also review the observational constraints and recent developments, including gauge-invariant descriptions of magnetic flux through the crossover and reconnection-controlled field evolution. Particular attention is given to the assumptions behind commonly used formulas and to the distinction between established results and model-dependent estimates. We argue that the most useful way forward is to predict the baryon abundance, present-day magnetic-field spectrum, and gravitational-wave signal from the same microscopic model, with consistent treatment of the intervening plasma dynamics."},{"arxiv":"2611.02049","id":"3222112","title":"Reinforcement Learning in High-Energy Physics: A Survey from Accelerator Control to Theory Exploration","authors":"Luca Anzalone","score":5.7,"section":"cross","rank":19,"parts":[0.06,0.05,0.14,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[3094526]] (coupling 0.02, 5 shared references). Closest network paper: [[3090323]] (coupling 0.05, 6 shared references).","abstract":"Reinforcement learning (RL) is a machine learning paradigm in which an agent learns a decision-making policy by interacting with an environment, guided by a scalar reward rather than explicit supervision. Supervised and unsupervised learning have become indispensable tools in high-energy physics (HEP), but they learn from fixed datasets, whereas many HEP tasks are closed-loop decisions: the data an algorithm observes depend on its choices, the feedback is sparse or delayed, and the objective is often measured on a real machine or in a stochastic simulation, not by a differentiable model. This survey reviews the application of RL to such tasks: accelerator control and feedback, data quality monitoring, jet grooming, clustering, and representation, charged particle tracking, beyond-the-Standard-Model (BSM) and string model building, detector design, trigger control, analysis, and formal quantum field theory computation. It provides a self-contained introduction to the underlying RL methods, from model-free and model-based to multi-agent, offline, inverse, and bandit approaches, reviews each domain against its traditional methods, and summarizes the head-to-head comparisons. The applications range from policies deployed on real accelerators and evaluated on recorded collision data to exploratory studies in formal theory. RL is most advantageous for repeated tasks with a fast simulator, decisions inside fast control loops, operation under faults and corrupted measurements, physics-based rewards in place of labels, and sequential discrete constructions with a reusable policy, while Bayesian optimization, genetic algorithms, and differentiable methods remain competitive elsewhere. We conclude with the open challenges that recur across domains, including reward design, sim-to-real transfer, safety, the lack of shared benchmarks, and the statistical validity of policy-driven decisions."},{"arxiv":"2611.01662","id":"3188825","title":"Holographic study of the scalar meson $K_0^*(1430)$ with dynamical longitudinal confinement","authors":"Osra Hemmati, Reza Khosravi","score":5.4,"section":"new","rank":20,"parts":[0.11,0.02,0.05,0.0,0.0],"note":"Also cites widely used network papers: [[1688995]], [[2817040]]. Closest of your papers: [[1455793]] (coupling 0.01, 1 shared references). Closest network paper: [[3202432]] (coupling 0.02, 1 shared references).","abstract":"Within the framework of light-front holographic QCD, where transverse confinement is inherently realized through holography, the structure and mass spectrum of the light scalar meson $K_0^{*}(1430)$ are investigated by employing the invariant mass ansatz and enhancing the model with a longitudinal confinement potential (specifically, the 't Hooft equation and the analytically solvable LMZV potential). The combined transverse and longitudinal confinement dynamics lead to more reliable calculations of key observables, including decay constants, parton distribution function, $ξ$-moments, and twist-$2$ and twist-$3$ distribution amplitudes. Transition form factors for the semileptonic decay $B \\rightarrow K_0^{*} \\ell^+ \\ell^-$ are computed from these amplitudes, yielding predictions for differential branching ratios and longitudinal lepton polarization asymmetries as functions of $q^2$. The results are compared with other theoretical models, offering valuable insights into the non-perturbative dynamics of QCD. The predicted observables provide theoretically motivated benchmarks for future experimental investigations of $B\\rightarrow K_0^*(1430)\\ell^+\\ell^-$ decays at LHCb and Belle II."},{"arxiv":"2611.03340","id":"3222414","title":"Axion polarimetry with parametric readout: photon-number conversion and sensitivity limits","authors":"Antonio Capolupo, Gabriele Pisacane, Raoul Serao","score":5.2,"section":"cross","rank":21,"parts":[0.0,0.08,0.19,0.0,0.0],"note":"Closest of your papers: [[2039411]] (coupling 0.02, 5 shared references). Closest network paper: [[3115042]] (coupling 0.07, 7 shared references).","abstract":"We propose a bias-assisted active photon-number conversion scheme for axion-induced polarization rotation in a four-port optical ring cavity with parametric readout. A calibrated real polarization rotation applied \\emph{before} the final optical parametric oscillator (OPO) converts the otherwise quadratic response of the summed output photon number into a linear signal. We derive the resulting photon moments and the extracted-field covariance, retaining the four-port optical transfer, finite axion coherence and linewidth. Our principal phenomenological result is a prospective low-mass sensitivity window at $m_a=10^{-18}$--$10^{-16}\\,\\mathrm{eV}$, extending below the published exclusion bounds included in our comparison, notably the NuSTAR M82 limits. This is a conditional noise-equivalent projection, using the adopted $A/σ_A=1$ stochastic-power criterion and a parameterized technical-noise budget, not a confidence-level exclusion forecast. As a separate readout result, OPO-based total counting reduces the noise-equivalent coupling by approximately $5\\%$ relative to matched selective attenuation in a favorable higher-frequency band; $5\\%$ internal loss together with a $0.10$-rad pump-phase offset leaves a $3.5\\%$ advantage in the stated example. A coherent input with only the final OPO retains this high-frequency benefit, whereas optimized coherent polarimetry remains more sensitive in the baseline. Our results identify both the operating principle of active number conversion and the stability requirements for a future implementation."},{"arxiv":"2611.00205","id":"3221753","title":"Lightest and heaviest nuclei as keys to the origin of ultrahigh energy cosmic rays","authors":"Anna M. Suliga, Glennys R. Farrar","score":4.5,"section":"cross","rank":22,"parts":[0.06,0.01,0.14,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[3184726]] (coupling 0.00, 1 shared references). Closest network paper: [[3130305]] (coupling 0.05, 4 shared references).","abstract":"The origin of ultrahigh energy cosmic rays (UHECRs) has been a long-standing mystery. A unique feature of UHECRs originating in binary neutron star mergers (BNSMs) is two distinct populations of light elements -- those directly accelerated in the jets, and photo-disintegration products of massive nuclei accelerated in the bulk outflow. We show that Pierre Auger Observatory spectrum and composition data confirm the existence of the predicted two populations at $\\geq \\!7.2σ$ significance, having rigidity ($R\\equiv E/Ze$) cutoffs agreeing with prior estimates. The data also favor 5-10% of UHECRs originating as r-process nuclei, a signature of a BNSM origin. Our results provide strong evidence that UHECRs are produced by merging neutron stars, and show how UHECRs and UHE-neutrinos elucidate otherwise inaccessible aspects of neutron star mergers."},{"arxiv":"2611.03218","id":"3222396","title":"Probing aQGCs from dimension-eight operators via neutral triboson production at muon colliders","authors":"Parimah Hosseini, Sara Khatibi, Hananeh Sadat Modirzadeh","score":4.3,"section":"new","rank":23,"parts":[0.0,0.04,0.2,0.0,0.0],"note":"Closest of your papers: [[3094526]] (coupling 0.01, 2 shared references). Closest network paper: [[2115290]] (coupling 0.07, 5 shared references).","abstract":"We investigate the sensitivity of a future high-energy muon collider to neutral anomalous quartic gauge couplings (aQGCs) through neutral triboson production processes, specifically $μ^+μ^- \\to γγγ$, $γγZ$, $γZZ$, and $ZZZ$. Within the Standard Model Effective Field Theory (SMEFT) framework, we focus on genuine dimension-eight transverse operators ($\\mathcal{O}_{T_0}$--$\\mathcal{O}_{T_9}$). The analysis is performed at prospective center-of-mass energies of $\\sqrt{s} = 3\\text{ TeV}$ and $10\\text{ TeV}$ with integrated luminosities of $1\\text{ ab}^{-1}$ and $10\\text{ ab}^{-1}$, respectively. Employing an optimized cut-and-count analysis and a $χ^2$ statistical framework incorporating a $5\\%$ systematic uncertainty, we derive projected 95\\% confidence level bounds on the corresponding Wilson coefficients. Our results demonstrate that the triphoton channel yields the most stringent constraints, particularly for the $f_{T_8}$ and $f_{T_9}$ coefficients, while channels involving $Z$ bosons exhibit reduced sensitivity owing to leptonic branching ratio suppressions. Furthermore, we report constraints on the $f_{T_3}$ and $f_{T_4}$ coefficients, established here for the first time in this neutral triboson context, highlighting the powerful physics reach of multi-TeV muon colliders in probing electroweak gauge sector interactions."},{"arxiv":"2611.00349","id":"3221811","title":"Top quark couplings at the muon collider","authors":"Nicolás Urcelay, Antonio O. Bouzas, F. Larios","score":4.0,"section":"new","rank":24,"parts":[0.0,0.05,0.17,0.0,0.0],"note":"Closest of your papers: [[1455793]] (coupling 0.02, 3 shared references). Closest network paper: [[2115290]] (coupling 0.06, 5 shared references).","abstract":"We present an overview of the sensitivity of a muon collider to the flavor-diagonal electroweak couplings of the top quark, using dimension-six operators of the Warsaw basis. Of the nine fermion-boson operators involving the top quark, the bounds on three are not competitive with existing limits, and we focus on the remaining six. We estimate individual $95\\%$ CL limits on the corresponding Wilson coefficients at $\\sqrt{s} = 3$, $6$, $10$, and $14$~TeV from $2σ$ statistical cross-section uncertainties, and assess the effect of an assumed systematic uncertainty. We consider six top-quark production modes: $t\\bar t$, $t \\bar t h$, $t \\bar t ν\\bar ν$, $t \\bar t μ^+ μ^-$, single-top $t\\bar b μ^- \\bar ν_μ$, and single-top-plus-Higgs, the last three for several rapidity coverages of the final-state muons. The $s$-channel $t\\bar t$ and $t\\bar t h$ processes give the strongest sensitivity to the electroweak dipole couplings, with allowed intervals narrower than the current LHC ones by factors of about $3$ to $6$ at $\\sqrt{s} = 3$ and $6$ TeV, and by an order of magnitude or more at $10$ and $14$ TeV. The left- and right-handed $ttZ$ couplings, as well as the Yukawa $tth$ couplings (for $\\sqrt{s} \\geq 6$ TeV), are best probed in $t \\bar t ν\\bar ν$ production, while the right-handed $tbW$ coupling is best probed in single-top production. For the $ttZ$ and $tbW$ couplings, the limits improve on the current LHC bounds by factors from about $1.5$ to more than an order of magnitude. Our results agree with previous analyses of the Yukawa and the dipole couplings, and provide a roadmap for more in-depth studies."},{"arxiv":"2611.03046","id":"3222377","title":"BESIII $X(3790)$ enhancement as a reflection of higher charmed mesons","authors":"Peng-Yu Sun, Tian-Le Gao, Xiang Liu","score":3.1,"section":"new","rank":25,"parts":[0.06,0.02,0.03,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[3184726]] (coupling 0.01, 1 shared references). Closest network paper: [[2817040]] (coupling 0.01, 8 shared references).","abstract":"In this work, we show that the $X(3790)$ reported by the BESIII Collaboration is unlikely to be a genuine resonance, a conclusion that follows from the incompleteness of the BESIII experimental analysis. Although BESIII included the established charmed mesons that couple to $Dπ$, as listed by the Particle Data Group, and incorporated their reflections in the $D^0D^-$ invariant mass spectrum, this fit to the experimental data does not exhaust the charmed mesons that can contribute to the $D^0D^-$ invariant mass spectrum through reflections, as can be explicitly seen from a theoretical charmed-meson spectroscopy. We find that a predicted charmed meson, either $D(3\\,{}^3S_1)$ or $D(2\\,{}^3D_1)$, can play a crucial role in mimicking the $X(3790)$ structure through the corresponding reflection. This warrants caution in interpreting the $X(3790)$ as a genuine resonance. Moreover, such an interpretation is not supported by most theoretical studies of $D\\bar{D}$ hadronic molecules and compact $c\\bar{c}d\\bar{u}$ tetraquarks currently available."},{"arxiv":"2611.02770","id":"3222321","title":"Strong vertex $N N ρ$ in dense medium","authors":"M. Shekari Tousi, K. Azizi","score":3.1,"section":"new","rank":26,"parts":[0.06,0.02,0.04,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[3184726]] (coupling 0.01, 1 shared references). Closest network paper: [[3081871]] (coupling 0.01, 1 shared references).","abstract":"We investigate the strong coupling form factors associated with the $NNρ$ interaction vertex in nuclear matter using the QCD sum rule framework. These form factors are calculated incorporating the in-medium modifications of the relevant condensates and operators into the operator product expansion (OPE) for the first time. We analyze the behavior of the strong form factors as functions of the momentum transfer squared and density of medium and evaluate the corresponding strong couplings at the on-shell point of the $ρ$ meson at nuclear saturation density. Then we extend the analyses to get information at higher densities. Our results provide complementary information on the in-medium $NNρ$ interaction and may be useful for phenomenological, experimental and observational studies of dense hadronic matter."},{"arxiv":"2611.00234","id":"3221563","title":"Localized anomaly detection with a calorimeter normalizing flow","authors":"Raunav Mendiratta, Jason Weitz, Javier Duarte","score":3.1,"section":"cross","rank":27,"parts":[0.0,0.0,0.21,0.0,0.0],"note":"Closest network paper: [[3187354]] (coupling 0.07, 3 shared references).","abstract":"Normalizing flows trained as fast calorimeter simulators also give the likelihood of each shower, which can serve as an anomaly score. Because this likelihood sums over every voxel, a signal confined to a few voxels can be lost in the fluctuations of the rest of the shower. For example, in a public benchmark dataset in which a long-lived neutral particle decays to two photons, the CaloFlow likelihood used in previous work selects less than 5% of the signal at a background efficiency of $10^{-3}$ when the particle has the largest simulated mass and decays at or just behind the front face of the calorimeter. In this work, we define a regional anomaly score by summing the squared latent coordinates of the same flow within small detector regions around the point where the particle enters the calorimeter, with the threshold set using background showers alone. At the same background efficiency, this regional anomaly score selects more than 95% of the signal. The per-coordinate likelihood terms, summed over the same regions, perform equally well, but the squared latent coordinates have a known distribution for background showers and clearly illustrate when a shower departs from it. Therefore, normalizing flows may be sensitive to new physics, even if the global likelihood is not."},{"arxiv":"2611.01117","id":"3221884","title":"LH$μ$C Concept: Energy-Frontier Antimuon-Proton Collisions at CERN","authors":"Arda Goroglu, Saleh Sultansoy","score":3.0,"section":"cross","rank":28,"parts":[0.0,0.04,0.12,0.0,0.0],"note":"Closest of your papers: [[1294681]] (coupling 0.01, 2 shared references). Closest network paper: [[3204120]] (coupling 0.04, 3 shared references).","abstract":"The concept of the LH$μ$C, an energy-frontier antimuon-proton collider based on the HL-LHC, is presented. After recalling why energy-frontier lepton-hadron colliders are indispensable as QCD explorers and reviewing the history of muon-proton collider proposals, two ways of realising $μp$ collisions at the LHC are compared: with muon-collider beams and with ultra-cold $μ^+$ beams as proposed for $μ$TRISTAN. For the latter, a $μ$TRISTAN-type booster and the re-use of the LHeC energy-recovery-linac tunnel are discussed; colliding 1 TeV antimuons with 7 TeV protons gives $\\sqrt{s}=5.3$ TeV and peak luminosities of $8.8\\times10^{33}$ and $7.2\\times10^{33}$ cm$^{-2}$s$^{-1}$, respectively. The detector concept and the physics potential, including searches for colour-octet muons and R-parity-violating squarks, are discussed together with the main challenges."},{"arxiv":"2611.03407","id":"3222427","title":"Non-Global and Super-Leading Logarithms in Higgs Production through Vector Boson Fusion","authors":"Thomas Becher, Patrick Hager, Matthias Neubert, Nicolas Schalch, Josua Scholze, Dominik Schwienbacher","score":2.3,"section":"new","rank":29,"parts":[0.0,0.04,0.08,0.0,0.0],"note":"Closest of your papers: [[1455793]] (coupling 0.01, 2 shared references). Closest network paper: [[2817040]] (coupling 0.03, 30 shared references).","abstract":"We present the first combined phenomenological study of non-global and super-leading logarithms in vector-boson-fusion Higgs production and its QCD-induced Higgs-plus-dijet background. A veto on radiation between the widely separated tagging jets provides a natural setting to investigate correlated soft emission and Glauber-induced violations of color coherence. We resum the leading non-global logarithms with the leading-color parton shower framework Marzili and the super-leading series with Glauber exchanges at $N_c=3$. Combining the two resummed contributions, we study their impact on gap cross sections and on the relative suppression of signal and background."},{"arxiv":"2611.01948","id":"3222268","title":"Gravitational form factors of the baryon octet and flavor dependence in an NJL quark--diquark model","authors":"Yiwei Qiu, Zhibo Liu, Congcong Zhang","score":2.3,"section":"new","rank":30,"parts":[0.0,0.0,0.15,0.0,0.0],"note":"Closest network paper: [[3147506]] (coupling 0.05, 4 shared references).","abstract":"We calculate the gravitational form factors of the baryon octet in a proper-time-regulated Nambu--Jona-Lasinio quark--diquark model using the total energy--momentum tensor. The momentum, angular-momentum and stress form factors reveal different flavor dependences, and the momentum and stress slope radii follow distinct hierarchies. With the diquark pole inputs taken from the hadron-spectrum calculation, the $Σ$ is more compact than the nucleon in its momentum response but more extended in its normalized stress response; it also has the smallest magnitude of the forward stress form factor. This combination of weaker forward strength and larger normalized extent persists under separate variations of the scalar and axial-vector diquark couplings. Along a self-consistent flavor-breaking path the initially degenerate radii split, and the sampled $Σ$--nucleon stress-radius ordering changes while the momentum ordering does not. The metric continuation and external pole inputs further change these hierarchies. Together, the octet form factors show how flavor breaking and scalar and axial-vector correlations affect momentum and stress differently."}],"refs":{"3094526":{"first":"Ardila-Tafurth","year":2025,"nauth":5,"title":"Feasibility to probe the dynamical scotogenic model at the LHC","role":"seed"},"3086782":{"first":"Amiri","year":2025,"nauth":3,"title":"Freeze-in at Low Reheating and Direct Detection of Fermion Dark Matter","role":"other"},"1803365":{"first":"Bélanger","year":2020,"nauth":4,"title":"The Z$_{5}$ model of two-component dark matter","role":"seed"},"1758016":{"first":"Peinado","year":2019,"nauth":4,"title":"Dirac neutrinos from Peccei–Quinn symmetry: A fresh look at the axion","role":"other"},"1655573":{"first":"Ellis","year":2018,"nauth":4,"title":"Simple no-scale model of modulus fixing and inflation","role":"seed"},"3204120":{"first":"Mondal","year":2026,"nauth":5,"title":"Vanilla Scotogenic Model at the future Muon Collider","role":"other"},"2751074":{"first":"Yaguna","year":2024,"nauth":2,"title":"Singlet Dirac dark matter streamlined","role":"seed"},"2958466":{"first":"Bélanger","year":2025,"nauth":4,"title":"Illuminating scalar dark matter co-scattering in EFT with monophoton signatures","role":"other"},"2715897":{"first":"Chauhan","year":2023,"nauth":9,"title":"Phenomenology of lepton masses and mixing with discrete flavor symmetries","role":"other"},"2826987":{"first":"Barman","year":2024,"nauth":3,"title":"Constraining burdened PBHs with gravitational waves","role":"seed"},"3221793":{"first":"Neto","year":2026,"nauth":3,"title":"Interacting scalar-fermion two-component dark matter in a gauged $\\boldsymbol{U(1)_{B-L}}$ model","role":"other"},"3081871":{"first":"Mastache","year":2025,"nauth":2,"title":"Spectral distortions in the decaying QCD dark matter scenario","role":"other"},"3165814":{"first":"Belanger","year":2026,"nauth":7,"title":"micrOMEGAs 7: Beyond standard cosmology","role":"other"},"168 cotogenic model","role":"other"}},"meta":{"date":"Tuesday, 03 November 2026","url":"https://arxiv.org/catchup/hep-ph/2026-11-03","cat":"hep-ph","year":2026,"built":"2026-11-05","topics":true,"nown":63,"next":831,"onInspire":68,"threshold":10.0,"nrel":10,"nlist":70,"counts":{"new":51,"cross":19,"replacement":0},"below":[{"arxiv":"2611.02824","title":"Axion Emission Controlled by Ion Motion in Relativistic Beam-Plasma Filamentation","score":9.3},{"arxiv":"2611.00306","title":"Proposal for the resolution of the disagreement between DAMA and other Underground Dark Matter Experiments","score":8.0},{"arxiv":"2611.03373","title":"Towards AI-Agent-Accelerated Research in High-Energy Physics: A Case Study in Monte Carlo Analysis","score":7.1},{"arxiv":"2611.02987","title":"Machine-learning discovery potential for a heavy Higgs boson in $e^+e^-\\to ZH$ at a future lepton collider","score":6.4},{"arxiv":"2611.01997","title":"Boundedness from below in the real Weinberg three-Higgs-doublet model","score":6.3},{"arxiv":"2611.02559","title":"Thermal Festina Lente","score":6.2}]}};
const M = RAW.meta;
const N = RAW.n.map((a,i)=>({i,...a,out:[],inn:[]}));
const E = RAW.e.map(([s,t,k])=>({s,t,k}));
E.forEach(e=>{N[e.s].out.push(e.t);N[e.t].inn.push(e.s)});
N.forEach(n=>n.deg=n.out.length+n.inn.length);
const ROLE={today:'Listing: new or cross-list',repl:'Listing: replacement',seed:'Your paper',other:'Network paper (other authors)'};
const RANK={today:0,repl:1,seed:2,other:3};
const SEC={new:'New',cross:'Cross-list',replacement:'Replacement'};
const col=n=>`var(--${n.role})`;
const isNew=n=>n.role==='today'||n.role==='repl';
const r=n=>isNew(n)?4+n.score/9:2.6+1.5*Math.log10(1+n.cites)+(n.role==='seed'?1:0);
const auth=n=>n.first+(n.nauth>2?' et al.':n.nauth===2?' + 1':'');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const plain=s=>String(s).replace(/\$/g,'').replace(/\\([a-zA-Z]+)/g,'$1').replace(/[{}^_]/g,'');
const REFS=RAW.refs||{};
// reasons text: [[INSPIRE id]] becomes 'Author Year' with a pop-up (authors, year, title), like the graph's tooltip
const why=s=>esc(s).replace(/\[\[(\d+)\]\]/g,(m,k)=>{const r=REFS[k];return r?`<span class="ref ${r.role}" tabindex="0" data-ref="${k}">${esc(r.first)} ${r.year}</span>`:m});
const tex=el=>{if(window.MathJax&&MathJax.typesetPromise)MathJax.typesetPromise([el]).then(()=>fold()).catch(()=>{})};
const NEWS=N.filter(isNew).sort((a,b)=>a.rank-b.rank);
document.getElementById('eyebrow').innerHTML=`arXiv ${esc(M.cat)} · <a href="${esc(M.url)}" target="_blank" rel="noopener">${esc(M.date)}</a>`;
document.getElementById('dek').textContent=`${M.nrel} of the ${M.nlist} papers in this listing (${M.counts.new} new, ${M.counts.cross} cross-lists, ${M.counts.replacement} replacements) score ${M.threshold} or more for belonging to the reference and citation network of your ${M.nown} papers and the ${M.next} papers by other authors around them. Highest score first.`;
const T=!!M.topics;   // network file with shared phrases: 35/30/15/10 + 10% shared topics
document.getElementById('foot').innerHTML=`<p><b>Score (0–100).</b> ${T?35:40}% direct citations of network papers (each of your papers counts 1, each other network paper 0.6, network papers with over 1,000 citations 0.06; saturating as 1 − e<sup>−x</sup>); ${T?30:35}% bibliographic coupling with your own papers (idf-weighted cosine of INSPIRE-linked reference sets, best match and mean of the top three, 0.30 = full marks); 15% best coupling with the other network papers (0.35 = full marks); 10% authorship (you, or your co-authors)${T?`; 10% shared topics: technical phrases of two or more words in the title and abstract that your papers and the network use much more often than hep-ph as a whole (each weighted by how much more, saturating as 1 − e<sup>−x/3</sup>)`:''}.</p>
<p><b>Data.</b> Network: INSPIRE records supplied with the project. Listing papers: INSPIRE records where already harvested (${M.onInspire} of ${M.nlist}); for the rest the reference list was read from the arXiv source and matched to INSPIRE by arXiv number, DOI and texkey. Only links between papers on this page are drawn. Built ${esc(M.built)}.</p>`;
const P=['Direct citations','Coupling to your papers','Coupling to network','Authorship','Shared topics'];
const PS=['Citations','Your papers','Network','Authors','Topics'];   // short labels for phones
function list(){const box=document.getElementById('list');
  if(!NEWS.length){box.innerHTML=`<div class="empty">No paper in this listing reaches a score of ${M.threshold}.</div>`;document.getElementById('mainnet').hidden=true;return}
  NEWS.forEach(n=>{const d=document.createElement('article');d.className='paper';d.id='p'+n.i;
    d.innerHTML=`<div class="role" style="color:${col(n)}">#${n.rank} · ${esc(SEC[n.section])} · score ${n.score.toFixed(1)}</div>
    <h2>${esc(n.title)}</h2>
    <div class="authors">${authors(n.authors)} · arXiv:${esc(n.arxiv)}</div>
    <p class="abs">${esc(n.abstract)}</p><button class="linkbtn absmore" type="button" hidden>More</button>
    <p class="why">${why(n.note)}</p>
    <div class="row"><div class="bars">${n.parts.map((v,j)=>`<span><span class="pl">${P[j]}</span><span class="ps">${PS[j]}</span> <span class="mb"><i style="width:${Math.round(v*100)}%"></i></span></span>`).join('')}</div><span>${n.nlinked} of ${n.nref} references linked to INSPIRE · refs from ${esc(n.src)}</span></div>
    <div class="links">${n.id?`<a href="https://inspirehep.net/literature/${n.id}" target="_blank" rel="noopener">INSPIRE</a>`:''}<a href="https://arxiv.org/abs/${esc(n.arxiv)}" target="_blank" rel="noopener">arXiv</a><a href="https://arxiv.org/pdf/${esc(n.arxiv)}" target="_blank" rel="noopener">PDF</a>${n.html?`<a href="https://arxiv.org/html/${esc(n.arxiv)}" target="_blank" rel="noopener" title="arXiv's experimental HTML version">HTML</a>`:''}<button class="linkbtn graphbtn" type="button">Show in network</button></div>`;
    d.querySelector('.graphbtn').addEventListener('click',()=>pick(n,true));
    d.querySelector('.absmore').addEventListener('click',e=>{const o=d.classList.toggle('open');e.target.textContent=o?'Less':'More'});
    box.appendChild(d)});
  toc();tex(box)}
// Phones: long author lists show the first 3 and "et al." (tap to expand); abstracts fold to 3 lines with More.
function authors(s){const a=String(s||'').split(', ');if(a.length<=3)return esc(s);
  return `<span class="au-short">${esc(a.slice(0,3).join(', '))} <button class="aubtn" type="button" aria-label="Show all ${a.length} authors">et al. (+${a.length-3})</button></span><span class="au-full">${esc(s)}</span>`}
document.addEventListener('click',e=>{const b=e.target.closest('.aubtn');if(b)b.closest('.authors').classList.add('open')});
function fold(){document.querySelectorAll('.paper').forEach(d=>{const p=d.querySelector('.abs'),b=d.querySelector('.absmore');
  if(!p||!b||d.classList.contains('open'))return;b.hidden=!(p.scrollHeight>p.clientHeight+2)})}
function toc(){const t=document.getElementById('toc');if(!NEWS.length)return;t.hidden=false;
  const X=RAW.next||[];
  t.innerHTML=`<h3>In this listing</h3><ol>${NEWS.map(n=>`<li><a href="#p${n.i}"><span class="sc${n.role==='repl'?' repl':''}">${n.score.toFixed(0)}</span><span class="tt">${esc(n.title)}</span></a></li>`).join('')}${X.length?`<li class="more-link"><a href="#more"><span class="sc">+${X.length}</span><span class="tt">The next ${X.length} papers by score (folded)</span></a></li>`:''}</ol>`;
  const m=t.querySelector('.more-link a');if(m)m.addEventListener('click',()=>{document.getElementById('more').open=true});tex(t)}
let sel=NEWS[0]||null, hover=null, query='', G;
const svg=d3.select('#svg'), tip=document.getElementById('tip');
function draw(){
  if(!NEWS.length)return;
  const RNG=d3.randomLcg(11);
  const W=Math.max(300,document.getElementById('chart').clientWidth), H=W<600?500:480, m={l:16,r:16,t:20,b:34};
  svg.attr('viewBox',`0 0 ${W} ${H}`); svg.selectAll('*').remove();
  const yrs=d3.extent(N,n=>n.year);
  const x=d3.scaleLinear().domain([yrs[0]-.5,yrs[1]+1.2]).range([m.l+8,W-m.r-8]);
  const ticks=x.ticks(W<600?6:12).filter(t=>Number.isInteger(t)&&t<=yrs[1]);
  svg.append('g').attr('class','grid').selectAll('line').data(ticks).join('line').attr('x1',d=>x(d)).attr('x2',d=>x(d)).attr('y1',m.t).attr('y2',H-m.b);
  svg.append('g').attr('class','axis').attr('transform',`translate(0,${H-m.b})`).call(d3.axisBottom(x).tickValues(ticks).tickFormat(d3.format('d')).tickSizeOuter(0));
  const cy=(m.t+H-m.b)/2, xf=n=>isNew(n)?x(yrs[1]+.75):x(n.year);
  const sim=N.map(n=>({n,x:xf(n)+(RNG()-.5)*4,y:cy+(RNG()-.5)*H*.5}));
  const links=E.map(e=>({source:sim[e.s],target:sim[e.t],s:e.s,t:e.t,k:e.k}));
  d3.forceSimulation(sim).force('x',d3.forceX(s=>xf(s.n)).strength(1)).force('y',d3.forceY(cy).strength(.04))
    .force('link',d3.forceLink(links).strength(.03)).force('charge',d3.forceManyBody().strength(-40))
    .force('col',d3.forceCollide(s=>r(s.n)+2)).stop().tick(320);
  sim.forEach(s=>{s.y=Math.max(m.t+8,Math.min(H-m.b-8,s.y));s.x=Math.max(m.l+4,Math.min(W-m.r-4,s.x))});
  G=svg.append('g');
  G.append('g').selectAll('path').data(links).join('path').attr('class',l=>'edge '+l.k)
    .attr('d',l=>{const a=l.source,b=l.target;return `M${a.x},${a.y}Q${(a.x+b.x)/2},${(a.y+b.y)/2-Math.abs(a.x-b.x)*.12} ${b.x},${b.y}`});
  G.append('g').selectAll('circle').data([...sim].sort((a,b)=>RANK[b.n.role]-RANK[a.n.role])).join('circle')
    .attr('class','node').attr('cx',s=>s.x).attr('cy',s=>s.y).attr('r',s=>r(s.n)).attr('fill',s=>col(s.n))
    .on('pointerenter',(ev,s)=>{hover=s.n;showTip(ev,s.n);paint()}).on('pointermove',(ev,s)=>showTip(ev,s.n))
    .on('pointerleave',()=>{hover=null;tip.hidden=true;paint()}).on('click',(ev,s)=>pick(s.n,false));
  const lab=sim.filter(s=>isNew(s.n)||s.n.role==='seed'||s.n.deg>=3);
  const L=lab.map(s=>{const right=s.x>W*.8,t=isNew(s.n)?`#${s.n.rank} ${s.n.first}`:`${s.n.first} ${s.n.year}`,w=t.length*6.2;return{s,t,right,x0:right?s.x-r(s.n)-4-w:s.x+r(s.n)+4,w,y:s.y+4}}).sort((a,b)=>a.y-b.y);
  const placed=[];L.forEach(l=>{let k=0;while(k<40&&placed.some(p=>l.x0<p.x0+p.w&&p.x0<l.x0+l.w&&Math.abs(l.y-p.y)<13)){l.y+=13*(k%2?-1:1)*(1+Math.floor(k/2));k++;l.y=Math.max(m.t+10,Math.min(H-m.b-4,l.y))}placed.push(l)});
  G.append('g').selectAll('text').data(L).join('text').attr('class','nlabel').attr('x',l=>l.right?l.s.x-r(l.s.n)-4:l.s.x+r(l.s.n)+4).attr('y',l=>l.y)
    .attr('text-anchor',l=>l.right?'end':'start').text(l=>l.t);
  paint();
}
function showTip(ev,n){const b=document.getElementById('chart').getBoundingClientRect();tip.hidden=false;tip.textContent=`${auth(n)} (${n.year}) — ${plain(n.title)}`+(isNew(n)?` · score ${n.score}`:'');
  let L=ev.clientX-b.left+12;if(L>b.width-290)L=ev.clientX-b.left-290;tip.style.left=Math.max(4,L)+'px';tip.style.top=(ev.clientY-b.top+12)+'px'}
function paint(){if(!G)return;const f=hover||sel,on=new Set();if(f){on.add(f.i);f.out.forEach(i=>on.add(i));f.inn.forEach(i=>on.add(i))}
  svg.classed('dim',!!f);
  G.selectAll('path.edge').attr('class',l=>'edge '+l.k+(!f?'':l.s===f.i?' hot out':l.t===f.i?' hot in':''));G.selectAll('path.edge.hot').raise();
  G.selectAll('circle').classed('on',s=>on.has(s.n.i)).classed('sel',s=>sel&&s.n.i===sel.i).classed('match',s=>query&&`${s.n.first} ${s.n.title} ${s.n.arxiv} ${s.n.authors||''}`.toLowerCase().includes(query));
  G.selectAll('text.nlabel').classed('on',l=>on.has(l.s.n.i))}
function panel(){const p=document.getElementById('panel'),n=sel;
  if(!n){p.innerHTML='<p>Select a paper in the network.</p>';return}
  const links=`<div class="links">${n.id?`<a href="https://inspirehep.net/literature/${n.id}" target="_blank" rel="noopener">INSPIRE</a>`:''}${n.arxiv?`<a href="https://arxiv.org/abs/${esc(n.arxiv)}" target="_blank" rel="noopener">arXiv</a>`:''}</div>`;
  if(isNew(n)) p.innerHTML=`<div class="role" style="color:${col(n)}">#${n.rank} · ${esc(SEC[n.section])} · score ${n.score.toFixed(1)}</div><h4>${esc(n.title)}</h4>
   <div class="meta">${esc(auth(n))} · arXiv:${esc(n.arxiv)}</div><p>${why(n.note)}</p><div class="links"><a href="#p${n.i}">Back to abstract</a></div>`;
  else p.innerHTML=`<div class="role" style="color:${col(n)}">${esc(ROLE[n.role])}</div><h4>${esc(n.title)}</h4>
   <div class="meta">${esc(auth(n))} · ${n.year}${n.arxiv?' · arXiv:'+esc(n.arxiv):''}</div>
   <div class="stats"><span>${n.cites.toLocaleString()} citations</span><span>${n.inn.filter(i=>isNew(N[i])).length} of the matches link here</span></div>${links}`;
  tex(p)}
function pick(n,scroll){sel=n;panel();paint();document.querySelectorAll('.paper').forEach(el=>el.classList.toggle('sel',el.id==='p'+n.i));if(scroll)document.getElementById('chart').scrollIntoView({behavior:'smooth',block:'nearest'})}
const present=new Set(N.map(n=>n.role));
document.getElementById('legend').innerHTML=['today','repl','seed','other'].filter(k=>present.has(k)).map(k=>`<span><i class="dot" style="background:var(--${k})"></i>${esc(ROLE[k])}</span>`).join('')+'<span style="color:var(--fg-3)">Listing papers: size ∝ score; others: size ∝ log(citations)</span>';
document.getElementById('q').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();paint()});
svg.on('click',ev=>{if(ev.target.tagName!=='circle'){sel=null;panel();paint()}});
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(draw,200)});
function nextList(){const X=RAW.next||[];if(!X.length)return;const box=document.getElementById('nextlist'),more=document.getElementById('more');
  more.hidden=false;more.querySelector('summary').firstChild.textContent=`The next ${X.length} papers by score `;
  document.getElementById('moresub').textContent=`below the threshold of ${M.threshold}, not drawn in the network`;
  box.innerHTML=X.map(n=>`<li><div class="role" style="color:var(--${n.section==='replacement'?'repl':'today'})">#${n.rank} · ${esc(SEC[n.section])} · score ${n.score.toFixed(1)}</div>
    <div class="t">${esc(n.title)}</div><div class="authors">${authors(n.authors)} · arXiv:${esc(n.arxiv)}</div>
    ${n.note?`<p class="why">${why(n.note)}</p>`:''}
    <details class="abs"><summary>Abstract</summary><p class="abs">${esc(n.abstract)}</p></details>
    <div class="links">${n.id?`<a href="https://inspirehep.net/literature/${n.id}" target="_blank" rel="noopener">INSPIRE</a>`:''}<a href="https://arxiv.org/abs/${esc(n.arxiv)}" target="_blank" rel="noopener">arXiv</a><a href="https://arxiv.org/pdf/${esc(n.arxiv)}" target="_blank" rel="noopener">PDF</a></div></li>`).join('');
  more.addEventListener('toggle',()=>{if(more.open)tex(box)})}
const rtip=document.getElementById('reftip');let rcur=null;
function refShow(el){const r=REFS[el.dataset.ref];if(!r)return;rcur=el;rtip.textContent=`${auth(r)} (${r.year}) — ${plain(r.title)}`;rtip.hidden=false;
  const b=el.getBoundingClientRect(),t=rtip.getBoundingClientRect();let L=Math.min(Math.max(8,b.left),innerWidth-t.width-8),T=b.bottom+6;
  if(T+t.height>innerHeight-8)T=b.top-t.height-6;rtip.style.left=L+'px';rtip.style.top=T+'px'}
function refHide(){rtip.hidden=true;rcur=null}
document.addEventListener('pointerover',e=>{const el=e.target.closest('.ref');if(el&&e.pointerType==='mouse')refShow(el)});
document.addEventListener('pointerout',e=>{if(e.target.closest('.ref')&&e.pointerType==='mouse')refHide()});
document.addEventListener('click',e=>{const el=e.target.closest('.ref');if(el)refShow(el);else if(rcur)refHide()});
document.addEventListener('focusin',e=>{const el=e.target.closest('.ref');if(el)refShow(el)});
document.addEventListener('focusout',e=>{if(e.target.closest('.ref'))refHide()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')refHide()});
addEventListener('scroll',()=>{if(rcur)refHide()},{passive:true});
list();nextList();fold();draw();panel();
window.addEventListener('load',()=>{tex(document.getElementById('list'));tex(document.getElementById('panel'));fold();
  if(window.MathJax&&MathJax.startup&&MathJax.startup.promise)MathJax.startup.promise.then(()=>setTimeout(fold,300))});
addEventListener('resize',()=>{clearTimeout(window._ft);window._ft=setTimeout(fold,200)});
</script>
