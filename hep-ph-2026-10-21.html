<script>
const RAW = {"n":[{"id":"3216809","arxiv":"2610.27105","title":"The Electron-Recoil Response Tail and the LZ High-Energy Event Background","first":"Bandyopadhyay","nauth":3,"year":2026,"cites":0,"role":"today","note":"Cites 4 network papers: [[3207263]], [[3202840]], [[3201794]], [[3201080]]. Closest of your papers: [[2751074]] (coupling 0.02, 3 shared references). Closest network paper: [[3202840]] (coupling 0.53, 52 shared references).","score":53.5,"rank":1,"section":"cross","parts":[0.91,0.06,1,0.0],"abstract":"We reconstruct the continuum electron-recoil contribution to the LZ background expectation from the collaboration's released simulation configuration. The released model specifies a definite response tail, but the published calibration information supplies no bound on how far the physical tail may depart from it at the probabilities the expectation depends on. Distributions reproducing the executable model's mean, variance, and standardised skewness exactly, and its event-conditioned 10, 50, and 90\\% \\(N_e\\) quantiles to about one per cent, differ in the relevant tail probability by more than five orders of magnitude. The ladder is short: a tail agreeing with that central characterisation to 0.14\\% in the quantiles lifts the electron-recoil contribution out of the negligible range, and one agreeing to 0.47\\% makes it comparable to the entire background quoted for the comparison region. We go on to identify the measurements that would settle it.","authors":"Triparno Bandyopadhyay, Rajarajeswari Ramasamy, Nishitha TP","nlinked":126,"nref":136,"src":"INSPIRE","html":true},{"id":"3216762","arxiv":"2610.27089","title":"Self-interacting dark matter from radiative bound-state-formation feedback","first":"Flores","nauth":3,"year":2026,"cites":0,"role":"today","note":"Cites 3 network papers: [[3214429]], [[1842147]], [[1842151]]. Closest of your papers: [[2964960]] (coupling 0.03, 4 shared references). Closest network paper: [[1842151]] (coupling 0.31, 17 shared references).","score":50.2,"rank":2,"section":"new","parts":[0.83,0.09,0.9,0.0],"abstract":"Observations of galactic structure motivate sizable dark-matter self-interactions at low velocities, naturally realized through light force mediators. Such mediators can also make inelastic processes very efficient. Unitarity then requires their absorptive contributions to the two-particle self-energy kernel to be resummed, which in turn feeds back into both the elastic and inelastic scattering amplitudes. We study the feedback of radiative bound-state formation on elastic scattering and its implications for self-interacting dark matter. We focus on capture processes through emission of a charged scalar; such transitions are particularly efficient because the scattering and bound states are governed by different effective potentials, a feature also shared by radiative capture through emission of a non-Abelian gauge boson. We show that their feedback can generate sizable elastic scattering relevant for halo dynamics, even when the baseline elastic amplitude vanishes. Notably, the generated elastic cross section can grow toward low velocities, resembling long-range scattering. A companion paper examines the feedback from annihilation processes.","authors":"Marcos M. Flores, Kalliopi Petraki, Thomas Pignard","nlinked":47,"nref":50,"src":"INSPIRE","html":true},{"id":"3216851","arxiv":"2610.27131","title":"Illuminating Light Dark Matter with Fixed-Target Experiments","first":"Gray","nauth":1,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[1607216]]. Also cites widely used network papers: [[1518747]]. Closest of your papers: [[3146383]] (coupling 0.16, 29 shared references). Closest network paper: [[3216851]] (coupling 1.00, 258 shared references).","score":49.8,"rank":3,"section":"new","parts":[0.48,0.44,1,0.0],"abstract":"Astronomical and cosmological observations provide overwhelming evidence for a non-luminous matter component, dark matter (DM), whose particle nature remains unknown. Experimental searches for non-gravitational DM interactions have largely targeted DM with GeV-TeV masses via nuclear recoils, yielding no discovery thus far. DM in the MeV-GeV mass range, however, is theoretically motivated, reproducing the observed relic abundance while remaining invisible to nuclear recoil searches. Such light DM is better probed via electron recoils or at fixed-target experiments. This thesis advances the theoretical and statistical toolkit for light DM searches at fixed-target experiments, spanning model building, statistical inference, global fits, and signal simulation. We survey the landscape of fixed-target searches for light DM, focusing on the Light Dark Matter eXperiment (LDMX). We also simulate DM signatures at the next-generation experiment SHiP to assess its sensitivity. Within minimal DM models, we present a likelihood-based statistical framework for LDMX using the full two-dimensional recoil electron distribution, spanning exclusion, discovery, parameter estimation, and model comparison in frequentist and Bayesian formulations. This establishes the discovery potential of LDMX, and we quantify the direct detection exposure needed to independently confirm a potential signal. Beyond this paradigm, we perform global fits of scalar and fermionic light DM, combining cosmological, astrophysical, and laboratory constraints. We then extend fixed-target searches to spin-1 DM and higher electromagnetic moment dark photons, yielding rich signatures with strong complementarity to other probes. Finally, we go beyond standard nuclear modelling of dark photon production, incorporating elastic nuclear form factors and spectral functions from many-body ab initio methods in place of analytic treatments.","authors":"Taylor R. Gray","nlinked":258,"nref":294,"src":"INSPIRE","html":true},{"id":"3216990","arxiv":"2610.27270","title":"Correlations in oscillation data and their impact on neutrino mixing models","first":"Gluza","nauth":3,"year":2026,"cites":0,"role":"today","note":"Cites 3 network papers: [[2762216]], [[2153712]], [[2715897]]. Closest of your papers: [[1679809]] (coupling 0.03, 2 shared references). Closest network paper: [[2715897]] (coupling 0.20, 52 shared references).","score":45.0,"rank":4,"section":"new","parts":[0.83,0.09,0.57,0.0],"abstract":"With increasing precision of neutrino experiments, complete correlation among the oscillation parameters will scrutinize theoretical neutrino mass and mixing models. Using available 1D--3D global-fit datasets, we construct a multidimensional $\\tildeχ^2$ function that provides a conservative estimate of the full six-dimensional parameter correlations. In our approach, we delineate the model-constrained parameter space by combining the interpolated experimental data with the analytical relations implied by a given mixing scheme. We identify $\\tildeχ^2_{\\text{min}}$, corresponding to the optimal agreement attainable for parameter points satisfying the model. Applying this framework to several schemes ($\\text{TM}_{1,2}$, $\\mu1,2$--$\\tau1,2$) yields generally better fits for IO than for NO, with the $\\mu1$--$\\tau1$ scheme under IO providing the best overall fit. While $\\mu1,2$--$\\tau1,2$ and $\\text{TM}_1$ schemes perform significantly better than $\\text{TM}_2$, the latter is excluded at $>3σ$ C.L. using NuFIT~v6.1 data. We further evaluate the implications of these correlation-respecting constraints on the effective neutrino mass observables relevant to tritium $β$-decay ($m_β$) and neutrinoless double $β$-decay ($m_{ββ}$). The proposed approach can be readily extended to test any theoretical framework that predicts algebraic relations among neutrino oscillation parameters, and we provide a GitHub starter kit.","authors":"Janusz Gluza, Biswajit Karmakar, Szymon Zięba","nlinked":79,"nref":86,"src":"INSPIRE","html":true},{"id":"3216783","arxiv":"2610.27056","title":"Annihilation feedback on elastic scattering in self-interacting dark matter","first":"Petraki","nauth":2,"year":2026,"cites":0,"role":"today","note":"Cites 2 network papers: [[3214429]], [[1842151]]. Closest of your papers: [[2964960]] (coupling 0.07, 7 shared references). Closest network paper: [[1842147]] (coupling 0.17, 10 shared references).","score":42.9,"rank":5,"section":"new","parts":[0.7,0.22,0.49,0.0],"abstract":"Sizable dark-matter self-interactions, motivated by observations of galactic structure, often arise from the exchange of light force mediators. Light mediators can render scattering nonperturbative and make inelastic processes important. Unitarity, via the optical theorem, implies that elastic and inelastic interactions cannot be treated independently: inelasticity induces absorptive contributions to the two-particle self-energy kernel that determines the elastic amplitude, while the resulting incoming-state dynamics also modifies the inelastic amplitudes. We study the feedback of dark-matter annihilation on elastic scattering in the presence of a long-range force. Although annihilation is a short-distance process, it can be strongly enhanced by such a force. We find that its feedback becomes significant near Sommerfeld resonances, where it suppresses the low-velocity growth of the baseline elastic cross section. Near baseline elastic-scattering zeros, it may instead generate a nonzero elastic floor required by unitarity. A companion paper studies the feedback of radiative bound-state formation on elastic scattering, which can generate sizable self-interactions.","authors":"Kalliopi Petraki, Thomas Pignard","nlinked":59,"nref":65,"src":"INSPIRE","html":true},{"id":"3216872","arxiv":"2610.28014","title":"Two-Component Dark Matter and Strongly First-Order Electroweak Phase Transition via a Two-Step Mechanism in the Inert Doublet plus Real Singlet Model","first":"Naik","nauth":2,"year":2026,"cites":0,"role":"today","note":"Cites 2 network papers: [[2862278]], [[822544]]. Closest of your papers: [[2794409]] (coupling 0.06, 13 shared references). Closest network paper: [[2862278]] (coupling 0.18, 51 shared references).","score":42.6,"rank":6,"section":"new","parts":[0.7,0.2,0.51,0.0],"abstract":"We study a two-component dark matter model in which a real singlet scalar and an inert doublet scalar are simultaneously present alongside the Standard Model, each stabilized by an independent discrete symmetry. The real singlet undergoes a strong first-order transition at high temperature, establishing an intermediate phase with a non-zero singlet vacuum expectation value, which in turn generates the barrier required for the Higgs field to complete a strongly first-order electroweak transition at a lower temperature. This two-step mechanism naturally enforces the condition $v_c/T_c \\geq 1$, the sphaleron washout-avoidance criterion necessary for electroweak baryogenesis. The gravitational wave spectrum from both steps is computed; the second step produces a decihertz signal, peaking near $0.08$--$0.34~\\mathrm{Hz}$ across the viable parameter space and $0.14$--$0.22~\\mathrm{Hz}$ at the benchmark points, that reaches the sensitivity of DECIGO for the strongest transitions and of BBO more widely, while the first remains sub-threshold for all planned detectors. At the coupling values required to drive the phase transition, the singlet is generically underabundant as a thermal relic, so the inert doublet carries the dominant fraction of the observed relic density. Confronting the model with current constraints, we find that the LUX-ZEPLIN 2024 result excludes the entire electroweak-phase-transition-viable parameter space of the singlet sector across the full mass range, even after rescaling by the singlet relic fraction, establishing a complete no-go for the singlet as a viable thermal dark matter candidate in this framework.","authors":"Deeksha Dattaram Naik, Arnab Chaudhuri","nlinked":116,"nref":116,"src":"INSPIRE","html":true},{"id":"3181044","arxiv":"2607.15098","title":"Inelastic Scattering Effects on Attenuation of Boosted Dark Matter","first":"Gu","nauth":4,"year":2026,"cites":0,"role":"repl","note":"Cites 2 network papers: [[3074282]], [[1894389]]. Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2856850]] (coupling 0.05, 8 shared references). Closest network paper: [[3115426]] (coupling 0.18, 18 shared references).","score":41.8,"rank":7,"section":"replacement","parts":[0.72,0.16,0.51,0.0],"abstract":"Earth attenuation is crucial for interpreting direct-detection constraints on boosted dark matter (DM), since scatterings with terrestrial nuclei can significantly modify the flux and energy spectrum reaching underground detectors. At boosted energies, inelastic nuclear channels beyond ordinary elastic scattering can become relevant, including quasi-elastic scattering, deep-inelastic scattering, and resonant scattering. In this work, we incorporate the resonant scattering of boosted dark matter (DM) off nuclei into the Earth-attenuation framework, in combination with the elastic, quasi-elastic, and deep-inelastic channels. We find that, in the heavy-mediator regime, resonant scattering can give a non-negligible contribution to the attenuation of boosted DM. Using the latest PandaX-4T data, we derive new constraints on the spin-independent boosted DM-nucleon cross section $\\barσ_n$.","authors":"Guanhua Gu, Liangliang Su, Lei Wu, Jin Min Yang","nlinked":76,"nref":79,"src":"INSPIRE","html":true},{"id":"3216948","arxiv":"2610.28252","title":"Probing a heavy neutral lepton in a radiative neutrino model at a muon collider","first":"Bamwidhi","nauth":4,"year":2026,"cites":0,"role":"today","note":"Cites 3 network papers: [[3201794]], [[3190962]], [[1607799]]. Closest of your papers: [[1415059]] (coupling 0.04, 1 shared references). Closest network paper: [[2115290]] (coupling 0.08, 6 shared references).","score":41.0,"rank":8,"section":"new","parts":[0.83,0.12,0.22,0.0],"abstract":"We investigate direct and Higgs-mediated production of a Dirac heavy neutral lepton in a radiative neutrino-mass model at a future $3~\\mathrm{TeV}$ muon collider. We consider heavy neutral lepton masses in the window $m_Z<m_N<m_h$, where the decays $N\\to\\ell W$ and $N\\toνZ$ can proceed with on-shell weak bosons. We consider both direct production, $μ^+μ^-\\to Nν$, and Higgs-mediated production through $μ^+μ^-\\toν_μ\\barν_μh$, $h\\to Nν$. Both channels lead to the common $\\ell^\\pm jj+p_{\\mathrm T}^{\\mathrm{miss}}$ final state. We perform a detector-level analysis with an integrated luminosity of $1~\\mathrm{ab}^{-1}$, assuming unpolarized muon beams, and derive median expected $95\\%$ confidence-level upper limits on the visible signal cross section ranging from approximately $0.027$ to $0.113~\\mathrm{fb}$, corresponding to limits on the mixing strength parameter $|U_{μN}|^2$ ranging from $6.7\\times10^{-6}$ to $8.3\\times10^{-5}$ for six benchmark points. The Higgs-mediated production channel contributes $\\sim15$--$72\\%$ of the signal after the common event selection, but improves the expected limits by $\\sim0.18$--$1.19\\%$ within the common classifier and binning scheme. This small improvement reflects the classifier-score distribution of the Higgs-mediated events. The limits on $|U_{μN}|^2$ account for the benchmark-specific flavor mixings and assume an independent $10\\%$ background uncertainty in each classifier-score bin.","authors":"Isaac Bamwidhi, Mohamed Belfkir, Mohamed Amin Loualidi, Salah Nasri","nlinked":39,"nref":41,"src":"INSPIRE","html":true},{"id":"3158574","arxiv":"2605.22245","title":"Probing freeze-in dark matter using Bose-Einstein condensate in neutron star","first":"Ghosh","nauth":2,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[1607216]]. Closest of your papers: [[3130296]] (coupling 0.03, 7 shared references). Closest network paper: [[2843822]] (coupling 0.26, 28 shared references).","score":32.7,"rank":9,"section":"replacement","parts":[0.45,0.1,0.75,0.0],"abstract":"Neutron star (NS) is one of the most promising astrophysical targets to probe non-gravitational interaction of dark matter (DM) with visible matter. Their compactness makes them an ideal object which can capture particle DM efficiently over its lifetime using the DM-nucleon scattering cross-section. If DM particles are bosonic, then the captured DM population may form a Bose-Einstein condensate at the center of the NS, increasing the DM density significantly. In this work, we study the phenomenology of such scenario with enhanced DM annihilation rate due to the increased density in a condensate. The enhanced DM annihilation makes the NS surface `hotter' than in the standard cooling scenario. We show that the annihilation rate is enhanced by a factor of $\\mathcal{O}(10^{15}-10^{20})$ if DM forms a condensate without large self-interaction, and DM with freeze-in value annihilation cross-section can heat up the NS to higher temperatures, bringing it within the reach of James Webb Space Telescope. It also allows us to probe DM-nucleon scattering cross section within the neutrino fog regime which will complement the terrestrial direct detection searches. Moreover, the enhanced annihilation from the condensate changes the lower limits on s-wave DM annihilation cross-section for capture-annihilation equilibrium and the formation of a black hole inside the NS. Finally, we show an example of a scalar DM model where such small annihilation and DM-nucleon scattering cross sections can generically arise.","authors":"Deep Ghosh, Anirban Das","nlinked":104,"nref":116,"src":"INSPIRE","html":true},{"id":"3216784","arxiv":"2610.27082","title":"Cosmic birefringence from a stiff axion field and its cosmological implications","first":"Minotti","nauth":6,"year":2026,"cites":0,"role":"today","note":"Co-authors of yours: Taoso. Cites 1 network paper: [[3081453]]. Closest of your papers: [[2826987]] (coupling 0.03, 4 shared references). Closest network paper: [[2972398]] (coupling 0.08, 11 shared references).","score":29.4,"rank":10,"section":"new","parts":[0.45,0.09,0.22,0.5],"abstract":"We propose a model in which the observed cosmic microwave background birefringence arises from the interaction of photons with a stiff ($w=1$) pseudo-scalar field that today contributes a subdominant fraction of the total energy density, distinct from both dark matter and dark energy. Big Bang Nucleosynthesis constrains the cosmological density of the stiff field, leading to a lower bound for its coupling with photons, $g_{φγ} > 8.9 \\times 10^{-14}\\,\\mathrm{GeV}^{-1}$. Photon conversion in cluster-hosted quasars sets an upper bound, $g_{φγ} < 5.0 \\times 10^{-13}\\,\\mathrm{GeV}^{-1}$. Therefore, there is a narrow window for the discovery of this cosmological component that can be explored in the forthcoming years with astrophysical axion searches. Moreover, we show that this scenario leads to gravitational-wave signals that can be tested with planned experiments.","authors":"Andrea Minotti, Yunzhi Wu, Tiziano Zanzarella, Nicolao Fornengo, Marco Regis, Marco Taoso","nlinked":62,"nref":68,"src":"INSPIRE","html":true},{"id":"3216962","arxiv":"2610.28068","title":"Constraints on Dark Matter Annihilation from Starlight-Induced Inverse Compton Emission in Omega Centauri","first":"Wang","nauth":3,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[2795517]]. Also cites widely used network papers: [[1518747]]. Closest of your papers: [[2964960]] (coupling 0.03, 4 shared references). Closest network paper: [[2740358]] (coupling 0.06, 4 shared references).","score":25.1,"rank":11,"section":"cross","parts":[0.48,0.09,0.18,0.0],"abstract":"The search for the particle identity of dark matter (DM) remains one of the foremost challenges in modern physics. In this work, we derive new constraints on the DM annihilation cross section $\\langleσv\\rangle$ by considering the inverse Compton (IC) scattering of DM annihilation injected $e^+e^-$ off the starlight radiation field in Omega Centauri. As a likely remnant core of a dwarf galaxy, Omega Centauri provides a dense stellar environment that enhances the predict IC signal. Using multi-wavelength observations from Chandra and Fermi-LAT, we establish upper limits on $\\langleσv\\rangle$ over a wide DM mass range from MeV to TeV. Notably, in the tens-of-MeV range, our results surpass existing constraints by approximately two orders of magnitude, exceeding $\\langleσv\\rangle \\sim 10^{-31}~{\\rm cm^3\\,s^{-1}}$. At several GeV to the TeV DM masses range, our constraints also remain stronger than existing limits. Our results demonstrate that starlight induced IC emission is an important component for indirect DM searches in dense stellar systems, establishing Omega Centauri as a powerful probe of the nature of DM.","authors":"Guan-Sen Wang, Xu Pan, Lei Feng","nlinked":75,"nref":87,"src":"INSPIRE","html":true},{"id":"3216929","arxiv":"2610.28267","title":"$\\mathbb{Z}_3$ and $S_3$ gaugings of $\\mathbb{Z}_N\\times\\mathbb{Z}'_N$ non-invertible symmetries: quark texture zeros and phenomenology","first":"Jiang","nauth":3,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[2762216]]. Closest of your papers: [[2690106]] (coupling 0.01, 1 shared references). Closest network paper: [[3144122]] (coupling 0.11, 7 shared references).","score":23.5,"rank":12,"section":"new","parts":[0.45,0.02,0.31,0.0],"abstract":"We investigate texture zeros in the quark Yukawa matrices arising from the $\\mathbb{Z}_3$ and $S_3$ gauging of $\\mathbb{Z}_N\\times\\mathbb{Z}'_N$, associated with the non-invertible $Δ(3N^2)$ and $Δ(6N^2)$ symmetries, respectively. We construct the equivalence classes and their fusion rules and use them as selection rules for the Yukawa interactions. We systematically classify the full-rank quark Yukawa textures generated by the two gaugings for $N=2,3,4,$ and $5$. The two gaugings yield the same texture spectrum for $N=2$ and $N=4$, whereas the $S_3$ gauging produces additional textures for $N=3$ and $N=5$. We further analyze the most restrictive texture pairs compatible with quark data and find that there are at most nine zeros in these texture pairs. For up- and down-quark mass matrices with a total of nine texture zeros, one sector is allowed to contain six zeros while the other contains three, or one contains five zeros while the other contains four. The former case has been studied in previous works. We perform numerical fits for the latter and find it consistent with experimental data. Some viable textures also admit real quark-mass determinants while retaining a physical CKM phase, suggesting a possible connection to the strong CP problem.","authors":"Zheng Jiang, Bu-Yao Qu, Gui-Jun Ding","nlinked":60,"nref":61,"src":"INSPIRE","html":true},{"id":"3216894","arxiv":"2610.27987","title":"Displaced e+e- Signatures from an X17-Mediated Inelastic Dark-Sector Cascade","first":"Serao","nauth":2,"year":2026,"cites":0,"role":"today","note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[3146383]] (coupling 0.12, 11 shared references). Closest network paper: [[3115042]] (coupling 0.21, 15 shared references).","score":22.5,"rank":13,"section":"new","parts":[0.06,0.32,0.6,0.0],"abstract":"We investigate displaced electron-positron signatures from an inelastic dark sector mediated by a light vector boson associated with the X17 anomaly. A heavy neutral fermion decays into a lighter stable state and the mediator, whose subsequent decay produces a single visible vertex after two stages of neutral propagation. We calculate the decay width, displacement distribution, lepton kinematics, and production rate in electro-positron collisions, including vector polarization. At Belle II, stronger dark-sector couplings increase production but require finely adjusted masses to preserve a macroscopic decay length. We quantify off-shell contributions and assess the validity of the two-body approximation. We show that the electron-positron pair cannot satisfy simultaneously the moment and opening-angle cuts of an existing search proposal for the configuration studied. Less restrictive selections allow nonzero kinematic acceptance. Our results clarify the experimental requirements for searching these signatures at Belle II.","authors":"Raoul Serao, Antonio Capolupo","nlinked":61,"nref":68,"src":"INSPIRE","html":true},{"id":"3216768","arxiv":"2610.27059","title":"A Natural Dark Matter-Dark Energy Interaction from Axion-Monopole Dynamics","first":"Bagherian","nauth":4,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3150177]]. Closest network paper: [[3150177]] (coupling 0.03, 3 shared references).","score":19.4,"rank":14,"section":"new","parts":[0.45,0.0,0.09,0.0],"abstract":"We propose a natural framework for interacting dark matter and dark energy based on axion-monopole dynamics in a dark gauge sector. Dark matter is composed of dark 't Hooft-Polyakov monopoles, while dark energy is an ultralight axion whose coupling to the dark gauge field induces an axion-dependent dyon mass through the Witten effect. This generates a direct dark matter-dark energy interaction. We show that generic models with a significant dark matter-dark energy coupling suffer from a naturalness problem: the Coleman-Weinberg potential induced by the interaction is typically much larger than the dark energy scale. In our model, the corrections arise from a monodromy tower of dyon states, allowing them to be exponentially suppressed. In the minimal setup, the interaction strength is predicted to be $\\sim 0.1\\%$, below the sensitivity of current observations. We discuss scenarios in which cosmological population of higher-charge dyons can enhance the interaction to the percent level, producing an apparent phantom dark energy equation of state. We further show that the parameter space of the axion-monopole model preferred by fitting the Dark Energy Spectroscopic Instrument (DESI) results can also naturally explain the cosmic birefringence with a small anomaly coefficient.","authors":"Hengameh Bagherian, Matthew Reece, Lian-Tao Wang, Huangyu Xiao","nlinked":107,"nref":107,"src":"INSPIRE","html":true},{"id":"3216963","arxiv":"2610.28144","title":"Polarization signatures of mixed scalar - pseudoscalar ALP - photon couplings in intense laser pulses","first":"Kadir","nauth":5,"year":2026,"cites":0,"role":"today","note":"Also cites widely used network papers: [[1783234]], [[2817040]]. Closest of your papers: [[1941263]] (coupling 0.08, 10 shared references). Closest network paper: [[2691930]] (coupling 0.08, 9 shared references).","score":16.4,"rank":15,"section":"new","parts":[0.11,0.25,0.22,0.0],"abstract":"We investigate photon-to-axion-like-particle (ALP) conversion in a finite, linearly polarized laser pulse for a single ALP field with simultaneous scalar-type and pseudoscalar-type couplings to photons. Varying the collision angle between the strong pulse and the probe provides a continuous kinematic scan of the resonant ALP mass. For fixed kinematics in this setting, the scalar-type and pseudoscalar-type ALP conversion amplitudes interfere coherently, making both the photon-to-ALP conversion probability and the polarization rotation depend on the difference between the probe polarization angle $α$ and the coupling angle $θ_g$. Conversion is maximal at $|α-θ_g|=90^\\circ$, where the polarization rotation vanishes, while the rotation magnitude peaks at $α-θ_g=45^\\circ$ modulo $90^\\circ$, where conversion is half-maximal. These complementary polarization-angle dependences provide polarization-resolved signatures of mixed scalar--pseudoscalar photon couplings.","authors":"Musajan Kadir, Hong-Hao Fan, Ying Wu, Qi-Rong Wang, Bai-Song Xie","nlinked":44,"nref":45,"src":"INSPIRE","html":true},{"id":"3216775","arxiv":"2610.27057","title":"Probing Lepton Flavor Violation at FCC-ee","first":"Allwicher","nauth":10,"year":2026,"cites":0,"role":"today","note":"Co-authors of yours: Leal. Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1854224]] (coupling 0.04, 5 shared references). Closest network paper: [[2068399]] (coupling 0.11, 19 shared references).","score":16.0,"rank":16,"section":"new","parts":[0.06,0.11,0.32,0.5],"abstract":"We investigate the prospects for probing Lepton Flavor Violation (LFV) at FCC-ee within the Standard Model Effective Field Theory (SMEFT) framework. The approximately $2 \\times 10^{11}$ $τ$-lepton pairs expected at the $Z$-pole run of FCC-ee could improve current limits on the branching fractions of $τ\\to3\\ell$ and $τ\\to\\ellγ$ ($\\ell=e,μ$) by factors ranging from 30 to 800, depending on the specific channel. We compare the resulting new-physics reach with that obtained from searches for $Z \\to τ\\ell$ and $h \\to τ\\ell$, which have so far received greater attention in studies of LFV at future $e^+e^-$ colliders. We find that $τ$ decays can surpass both the current and the projected sensitivity of $Z\\toτ\\ell$ searches to the same LFV interactions, while probing a broader range of SMEFT operators. We further show that, for LFV Yukawa-like interactions, direct searches for $h\\toτ\\ell$ provide the strongest sensitivity. By contrast, for semileptonic operators that radiatively induce LFV Higgs decays, this hierarchy can be reversed, with $τ$ decays providing the leading probe.","authors":"L. Allwicher, R. Bartocci, M. Cepeda, C. Cornella, L. P. S. Leal, A. Lusiani, C. Martin Perez, P. Paradisi, E. Scantamburlo, O. Sumensari","nlinked":72,"nref":74,"src":"INSPIRE","html":true},{"id":"3074263","arxiv":"2510.23695","title":"New Bounds on Heavy QCD Axions from Big Bang Nucleosynthesis","first":"Jung","nauth":4,"year":2026,"cites":0,"role":"repl","note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1941263]] (coupling 0.04, 12 shared references). Closest network paper: [[2685273]] (coupling 0.17, 23 shared references).","score":13.8,"rank":17,"section":"replacement","parts":[0.06,0.12,0.48,0.0],"abstract":"We study Big Bang Nucleosynthesis (BBN) constraints on heavy QCD axions. BBN offers a powerful probe of new physics that modifies the neutron-to-proton ratio during the process, thanks to the precisely measured primordial Helium-4 abundance. A heavy QCD axion provides an attractive target for this probe, because not only is it a well-motivated hypothetical particle by the strong CP problem, but also it dominantly decays to hadrons if kinematically allowed. A range of its lifetime is thus excluded where the hadronic decays would significantly alter the neutron-to-proton ratio. We compute axion-induced modification of the neutron-to-proton ratio, and obtain robust upper bounds on the axion lifetimes, as low as 0.017 s for the axion mass higher than 300 MeV. Remarkably, this is stronger than projected future CMB bounds via $N_{\\rm eff}$. Our bounds are largely insensitive to uncertainties in hadronic cross sections and the axion's branching fractions into various hadrons, as well as to the precise value of the initial axion abundance. We also incorporate, for the first time, several key improvements, such as scattering processes by energetic $K_L$ and secondary hadrons, that can also be important for studying general hadronic injections during BBN, not limited to those from axion decays.","authors":"Tae Hyun Jung, Takemichi Okui, Kohsaku Tobioka, Jiabao Wang","nlinked":133,"nref":141,"src":"INSPIRE","html":true},{"id":"3216834","arxiv":"2610.27236","title":"Searching for Dense Perturbers in Cold Dark Matter Simulations","first":"Zhang","nauth":4,"year":2026,"cites":0,"role":"today","note":"Closest of your papers: [[2964960]] (coupling 0.07, 9 shared references). Closest network paper: [[3214429]] (coupling 0.10, 26 shared references).","score":11.0,"rank":18,"section":"cross","parts":[0.0,0.19,0.29,0.0],"abstract":"Recently, several low-mass, dense perturbers have been inferred from astrophysical observations of gravitational lensing, stellar streams, and satellite galaxies. If interpreted as dark matter subhalos, their inner densities exceed the predictions of the standard cold dark matter (CDM) model. We systematically investigate this tension using a CDM-only zoom-in simulation of a Milky Way analog. We analyze more than 5000 subhalos with masses down to $10^6\\,M_\\odot$ and reconstruct their inner density profiles using a tidal truncation model. The simulated subhalos are then compared with the observed compact perturbers in terms of their density profiles, enclosed masses, concentrations, and projected cylindrical masses. None of the simulated CDM subhalos is sufficiently dense to reproduce the inferred mass distributions of the observed perturbers. We further examine the redshift evolution of subhalo concentrations and derive a fitting function to characterize this evolution. Our findings motivate further investigations into exceptionally rare formation histories that could produce such dense perturbers, as well as the possibility of physics beyond the standard CDM model.","authors":"Xingyu Zhang, Hai-Bo Yu, Demao Kong, Ethan O. Nadler","nlinked":98,"nref":105,"src":"INSPIRE","html":true},{"id":"3071695","arxiv":"2510.18338","title":"Direct Detection of Leptophobic Dark Matter with Electronic Collective Excitations","first":"Gong","nauth":5,"year":2026,"cites":0,"role":"repl","note":"Closest of your papers: [[2856850]] (coupling 0.06, 9 shared references). Closest network paper: [[2181757]] (coupling 0.10, 12 shared references).","score":10.4,"rank":19,"section":"replacement","parts":[0.0,0.17,0.28,0.0],"abstract":"Some new-generation dark matter detection experiments are primarily designed to search for the dark matter-electron interactions, but they can also be utilized to probe models in which dark matter couples exclusively to nucleon via the quantum effects. The hadronic loop-induced interactions can directly excite plasmons in semiconductors, thereby providing an additional channel for detecting the leptophobic dark matter. In this work, we investigate plasmon excitations in silicon detectors induced by boosted dark matter and cosmic-ray up-scattering dark matter via the hadronic loop process. By analyzing the available experimental data, we derive new exclusion limits on the leptophobic dark matter-nucleon scattering cross section in the sub-MeV mass range.","authors":"Yuanlin Gong, Yifan Hu, Ning Liu, Liangliang Su, Bin Zhu","nlinked":122,"nref":128,"src":"INSPIRE","html":true},{"id":"1415059","arxiv":"","title":"A model with a viable dark matter candidate and massive neutrinos","first":"Restrepo","nauth":4,"year":2015,"cites":2,"role":"seed","note":"","score":null},{"id":"1686334","arxiv":"1808.03352","title":"Two-component dark matter and a massless neutrino in a new $B-L$ model","first":"Bernal","nauth":4,"year":2018,"cites":54,"role":"seed","note":"","score":null},{"id":"2794409","arxiv":"2406.01729","title":"Reopening the <math display=\"inline\"><mi>Z<\/mi><\/math> portal with semi-annihilations","first":"Domínguez","nauth":3,"year":2024,"cites":2,"role":"seed","note":"","score":null},{"id":"2817040","arxiv":"","title":"Review of particle physics","first":"Navas","nauth":244,"year":2024,"cites":6512,"role":"other","note":"","score":null},{"id":"2862278","arxiv":"2412.17141","title":"Prospecting bipartite dark matter through gravitational waves","first":"Borah","nauth":3,"year":2024,"cites":19,"role":"other","note":"","score":null},{"id":"3146383","arxiv":"2604.15541","title":"Probing inelastic sub-GeV dark matter at the DUNE near detector","first":"Betancur","nauth":3,"year":2026,"cites":1,"role":"seed","note":"","score":null},{"id":"3130296","arxiv":"2603.16863","title":"New benchmarks for direct detection of freeze-in dark matter in vector portal models","first":"Cerdeño","nauth":4,"year":2026,"cites":3,"role":"seed","note":"","score":null},{"id" 04, 4 shared references). Closest network paper: [[2617409]] (coupling 0.12, 11 shared references).","abstract":"We study the mono-photon signature $μ^+μ^-\\toγa\\toγν\\barν$ at $3$ and $10\\TeV$ muon colliders, with integrated luminosities of $1$ and $10\\,\\mathrm{ab}^{-1}$, in a two-coupling axion-like-particle (ALP) simplified model. Five benchmarks spanning $m_a=100$--$1000\\GeV$ are generated at $g_{aγγ}=0.01\\TeV^{-1}$ and flavor-universal pseudoscalar neutrino couplings $y_ν=0.1$ or $0.3$, giving invisible branching fractions above 99.995\\% and mono-photon cross sections of $0.00854$--$0.01217\\,\\mathrm{fb}$. Assuming a 1\\% background normalization uncertainty, a cut-based photon-line selection gives projected 95\\% sensitivity to $g_{aγγ}\\simeq0.039$--$0.045\\TeV^{-1}$ at $3\\TeV$ and $0.0137$--$0.0140\\TeV^{-1}$ at $10\\TeV$. A ROOT/TMVA gradient-boosted decision tree with validation-fixed thresholds reaches held-out AUC values of $0.9967$--$0.9993$ and $g_{95}=0.0192$--$0.0400\\TeV^{-1}$ at $3\\TeV$ and $0.0122$--$0.0144\\TeV^{-1}$ at $10\\TeV$. Because only 2-41 irreducible-background test events populate the optimized classifier tails, the mass--coupling contours are reported as projected expected sensitivities rather than profile-likelihood or CL$_s$ exclusions. A separate appendix records a phenomenological, parton-level HNL diphoton feasibility study; it is not used to claim detector-level sensitivity or exclusion.} \\keywords{Axion-like particles, muon collider, mono-photon, diphoton, heavy neutral leptons, neutrinos, multivariate analysis, effective field theory"},{"arxiv":"2610.27346","id":"3216856","title":"Pretraining on boosted boson decays for polarization tagging of hadronic $W$ bosons","authors":"Saptaparna Bhattacharya","score":6.8,"section":"cross","rank":21,"parts":[0.0,0.1,0.22,0.0],"note":"Closest of your papers: [[1455793]] (coupling 0.04, 4 shared references). Closest network paper: [[2621240]] (coupling 0.08, 7 shared references).","abstract":"Longitudinally polarized weak bosons probe the unitarization of vector-boson scattering. At large boosts, longitudinal and transverse $W$ bosons produce jets with the same mass and two-prong structure, distinguished only by the decay angle. Longitudinal bosons are rare: they occur in only 0.3% of $W$+jet events at these large boosts. We ask where the polarization information of a boosted $W$ boson lies and how much a tagger can recover. Requiring both decay quarks within the jet truncates the decay-angle distribution at an edge set by $m/(p_T R)$, which we show bounds any hadronic polarization tagger. Within this acceptance, the decay angle carries essentially all the polarization information of a jet in $W$+jet events. Polarized samples are costly to simulate for vector-boson scattering, so we pretrain a point-edge transformer on $10^7$ unpolarized jets of boosted bosons, top quarks and QCD and test how much it recovers from few labels. Fine-tuned on 783 labeled jets per class with its transformer blocks kept fixed, the network pretrained to classify these jets improves on training from scratch, but generic pretraining on a broad mix of jets and a boosted decision tree on substructure observables do as well. The best taggers recover most, but not all, of the separation the decay angle allows, and student networks with a few hundred times fewer parameters, trained by knowledge distillation, match their teacher. More information lies outside the jet. The production angle, reconstructed with the recoiling jet, improves every tagger. In diboson production and vector-boson scattering at matrix-element level, the production kinematics carry more information than the decay angles of both bosons. Trading the generality of a jet tagger for an event-level tagger trained on the process thus brings significant gains, which measurements of longitudinal vector-boson scattering could exploit."},{"arxiv":"2610.28198","id":"3216999","title":"Soft Breaking Naturalness in Majorana Fermion Loop induced Scalar and Majoron Amplitudes","authors":"Mussawir Khan, Wei Chao, Yu Gao","score":6.1,"section":"new","rank":22,"parts":[0.0,0.09,0.2,0.0],"note":"Closest of your papers: [[1365306]] (coupling 0.03, 2 shared references). Closest network paper: [[2901490]] (coupling 0.07, 5 shared references).","abstract":"Majorana fermion loops contribute a shift-symmetry violating effective potential to the coupled scalar field. When the Majorana fermion is light, a larger number of symmetry violating insertions let the loop contribution to grow increasingly infrared sensitive to the Majorana mass. With explicit calculations, we calculate the symmetry violating amplitudes, show that the scalar potential's natural scales serve as nonzero kinematic matching points which remove the superficial sensitivity to the symmetry-violating Majorana mass, continuously restoring the shift symmetry in agreement with 't Hooft naturalness. In the spontaneous broken phase, the scalar radial vacuum expectation value readily ensures the infrared safety of symmetry violating Majorana fermion loops, and all $n$-point Majoron functions develop a leading linear dependence on the symmetry violating parameter in the soft breaking limit, which matches the expansion of the Coleman-Weinberg determinant."},{"arxiv":"2610.27182","id":"3216973","title":"Jets as differential probes of hot QCD matter","authors":"João M. Silva","score":6.0,"section":"new","rank":23,"parts":[0.06,0.03,0.18,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1455793]] (coupling 0.01, 3 shared references). Closest network paper: [[3198665]] (coupling 0.06, 11 shared references).","abstract":"Ultra-relativistic heavy-ion collisions create short-lived droplets of deconfined, hot QCD matter whose evolution connects far-from-equilibrium early dynamics to the hydrodynamic quark-gluon plasma. High-energy jets, produced in early hard scatterings and modified by this evolving medium, provide multi-scale probes of its microscopic properties. This thesis develops perturbative QCD tools to extract information about hot QCD matter from its imprint on differential jet substructure observables. Our framework is the BDMPS-Z description of high-energy partons propagating through stochastic colour fields. We first study anisotropic QCD matter by replacing the usual scalar broadening parameter with direction-dependent transverse momentum broadening. This relates anisotropic corrections to medium-induced splittings to spin information and azimuthal patterns in final-state energy flow. Energy correlators are then used as observables sensitive to these effects, including heavy-flavour EECs, azimuthally differential EECs and clover projections designed to isolate leading anisotropy-induced harmonics. We also examine how energy loss affects the interpretation of jet substructure modifications. Quantile matching defines reconstructed energy loss as a population-level shift between vacuum and medium-modified jet spectra. We further develop energy-loss functions, which encode the distribution of energy retained by jet-originated hadrons, and show how their moments enter multi-point projected energy correlators. Finally, we go beyond single $1\\to2$ medium-induced splittings by studying spin-induced correlations between successive emissions and higher-point energy correlators including contributions from medium response. The results show that differential jet substructure can probe directional properties of QCD matter and multi-point dynamics of jets propagating through it."},{"arxiv":"2608.16107","id":"3191716","title":"Unfolding the low-energy reactor neutrino flux from CE$ν$NS data with a finite Dirac sum","authors":"Muping Chen, Graciela Gelmini, Danny Marfatia, Koichiro Yasuda","score":5.9,"section":"replacement","rank":24,"parts":[0.06,0.02,0.19,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[3184726]] (coupling 0.01, 1 shared references). Closest network paper: [[3217265]] (coupling 0.07, 5 shared references).","abstract":"We present a novel method to analyze coherent elastic neutrino--nucleus scattering (CE$ν$NS) data to extract the reactor antineutrino spectrum below the inverse beta decay threshold of 1.8 MeV, where it remains unmeasured. Adapting halo-independent analysis techniques developed for direct dark matter detection, we show how to obtain a best-fit and a pointwise confidence band for the integrated neutrino flux, without assuming a parametric form or smoothness prior for the spectrum. In our approach, which follows from convex geometry arguments, the differential neutrino rate is written as a linear combination of Dirac delta functions -- a finite Dirac sum (FDS) -- with a maximum number of terms determined by the number of data points. We apply our \"FDS method\" to mock CE$ν$NS data for a low-threshold Ge detector and compare it with Tikhonov-regularized unfolding."},{"arxiv":"2610.26908","id":"3216736","title":"Floquet Instability of Photon-Axion Conversion","authors":"Yuuki Sugiyama, Kazushige Ueda","score":5.7,"section":"new","rank":25,"parts":[0.0,0.08,0.2,0.0],"note":"Closest of your papers: [[1607572]] (coupling 0.02, 3 shared references). Closest network paper: [[2661930]] (coupling 0.07, 3 shared references).","abstract":"The discovery of axions would provide evidence for physics beyond the Standard Model. In this work, we investigate axion-photon conversion in the presence of a background magnetic field with simultaneous spatial and temporal periodicity. By performing a Lorentz transformation, the coupled axion-photon system is mapped onto a time-periodic linear system that can be analyzed using Floquet theorem. We find unstable modes associated with resonant crossing between Floquet replicas. The resulting complex Floquet exponents lead to exponentially growing modes, which we identify as a Floquet instability. Then, we determine the parameter regions in which this instability appears in a perturbative analysis. We further show that the Floquet instability enhances the axion-field amplitude generated from an initial photon field. Our results demonstrate that spatiotemporally periodic magnetic backgrounds provide a distinct mechanism for modifying axion-photon conversion through Floquet instability."},{"arxiv":"2610.28207","id":"3216968","title":"Hadronization in QCD and Fragmentation Functions","authors":"Ignacio Borsa, Marco Stratmann","score":5.7,"section":"new","rank":26,"parts":[0.06,0.01,0.21,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[3184726]] (coupling 0.00, 1 shared references). Closest network paper: [[2817040]] (coupling 0.07, 153 shared references).","abstract":"The hadronization of quarks and gluons is reviewed within the framework of collinear parton-to-hadron fragmentation functions closely associated with the notion of factorization in hard scattering processes in QCD. The state-of-the-art in calculating both the scale evolution of fragmentation functions and the partonic cross sections pertinent to their determination from data up to next-to-next-to-leading order accuracy is presented. Potential improvements up to next-to-next-to-leading logarithmic order are outlined as well. All relevant experimental data sets for single-inclusive pion, kaon, and unidentified charged hadron production are listed. The most recent sets of fragmentation functions and their uncertainties extracted from these data in global QCD analyses utilizing various different strategies are presented and compared to each other."},{"arxiv":"2606.30222","id":"3174554","title":"Multiparameter Quantum Estimation and Degeneracy Structure in Three-Flavor Neutrino Oscillations","authors":"Bhavna Yadav, Amir Subba, Yu Shi","score":5.7,"section":"replacement","rank":27,"parts":[0.0,0.1,0.14,0.0],"note":"Closest of your papers: [[1220579]] (coupling 0.04, 3 shared references). Closest network paper: [[3148101]] (coupling 0.05, 4 shared references).","abstract":"We investigate three-flavor neutrino oscillations within the framework of quantum estimation theory using the quantum Fisher information matrix (QFIM). We analyze all six independent elements of the QFIM for the parameters $θ_{23}$, $δ_{\\mathrm{CP}}$, and $Δm^2_{31}$, together with the corresponding quantum Cramér--Rao bounds and normalized parameter correlations. To connect the intrinsic quantum sensitivity of the neutrino state with experimentally accessible information, we further compare the QFI with the classical Fisher information (CFI) associated with flavor-probability measurements. We find that the difference between the quantum and classical information bounds is strongly dependent on the oscillation parameter and $L/E$, demonstrating that the efficiency with which the available quantum information is accessed depends on the measurement. We also investigate probability-degenerate solutions in the $(θ_{23},δ_{\\mathrm{CP}})$ parameter space. Although different parameter sets can produce identical $ν_μ\\rightarrowν_e$ appearance probabilities at specific $L/E$ values, their corresponding quantum states can remain distinct, as demonstrated by the quantum fidelity. The QFIM differences further reveal distinct local quantum-information geometries for these probability-degenerate solutions, while the corresponding CFIM differences show a parameter and $L/E$ dependent degree of distinguishability accessible through the flavor-probability measurement. Our results demonstrate that QFI and CFI provide complementary information for neutrino parameter estimation, with the QFIM serving as a measurement-independent quantum benchmark and the CFI characterizing the information accessible through a specified measurement."},{"arxiv":"2610.26893","id":"3216748","title":"Aspects of Anomalies: Fermion Family Constraints, Gravitational Form Factors and Scattering Amplitudes","authors":"Dario Melle","score":5.4,"section":"new","rank":28,"parts":[0.0,0.1,0.12,0.0],"note":"Closest of your papers: [[731108]] (coupling 0.04, 5 shared references). Closest network paper: [[2972391]] (coupling 0.04, 7 shared references).","abstract":"Quantum anomalies play two complementary roles in quantum field theory: as consistency conditions that constrain the field content of a theory, and as dynamical effects encoded in the analytic structure of correlation functions. This thesis explores both. In the first part, we study the 331 model, in which gauge anomalies cancel across families rather than within each one. Combined with QCD asymptotic freedom, this fixes the number of fermion generations to three. We analyze the model's symmetry breaking, scalar and flavor sectors, and its TeV-scale Landau pole. We then study the collider phenomenology of its exotic quarks, showing that the pair production of heavy quarks decaying into doubly-charged vector bileptons gives a clean same-sign dimuon plus b-jets signature, observable at a 100 TeV collider but not at the LHC. Finally, we introduce the left-right symmetric 33311 extension, which preserves the family-number constraint and avoids proton decay. In the second part, we use conformal field theory in momentum space to study the chiral, gravitational and conformal anomalies. We construct a complete off-shell parametrization of the non-Abelian TJJ correlator in perturbative QCD, identifying the dilaton-like anomaly pole. For the AVV, ATT and TJJ vertices, we prove mass-independent anomaly sum rules for the spectral density, showing that the anomaly pole is not an asymptotic particle state. We apply the TJJ insertion to the pion gravitational form factors at large momentum transfer with Sudakov resummation: the anomaly feeds mainly into the D-term and the trace form factor, improving agreement with lattice QCD. Lastly, sewing two anomaly vertices through graviton exchange, we show that the trace anomaly activates a gauge-invariant scalar gravitational channel, giving a double-copy-like structure in photon and graviton scattering."},{"arxiv":"2610.27996","id":"3216889","title":"Partial reconstruction of the decay $B_{s}^{0}\\rightarrow φ(K^{+}K^{-})η' (π^{+}π^{-}η)$","authors":"Jeremiah D. Juevesano, Marlon P. Brade, Dennis C. Arogancia, Jan Mickelle V. Maratas","score":5.3,"section":"new","rank":29,"parts":[0.06,0.04,0.09,0.0],"note":"Also cites widely used network papers: [[1688995]]. Closest of your papers: [[1708907]] (coupling 0.01, 1 shared references). Closest network paper: [[1903588]] (coupling 0.03, 2 shared references).","abstract":"The decay $B_s^0 \\to φ(K^+K^-)η'(π^+π^-η)$ is of particular interest in flavour physics because in the Standard Model it proceeds predominantly through the quark transition $\\bar{b} \\to \\bar{s}s\\bar{s}$. However, the reconstruction of this decay is experimentally challenging due to the presence of the neutral $η$ particle, which significantly reduces the overall reconstruction efficiency. In this study, the feasibility of using the partial reconstruction technique to reconstruct the invariant mass of the $B_s^0$ meson without explicitly detecting the $η$ particle is investigated. Monte Carlo simulated events corresponding to an FCC-ee environment are used, and the effects of detector momentum and vertex resolutions on the reconstruction performance are examined. The results show that improved vertex resolution substantially improves the global reconstructed mass response and partial-reconstruction efficiency, while improvements in momentum resolution are manifested primarily through a narrowing of the fitted central DCB component. These findings suggest that future high-luminosity $e^+e^-$ colliders such as FCC-ee could effectively exploit the partial reconstruction technique to study rare decay modes containing undetected neutral particles."},{"arxiv":"2610.28147","id":"3216898","title":"Probing the $τ$ anomalous magnetic and electric dipole moments in photon-induced $γγ\\toτ^+τ^-$ production at the FCC-hh","authors":"A. Senol, H. Denizli, M. Köksal","score":5.2,"section":"new","rank":30,"parts":[0.0,0.09,0.14,0.0],"note":"Closest of your papers: [[1455793]] (coupling 0.03, 4 shared references). Closest network paper: [[3170413]] (coupling 0.05, 5 shared references).","abstract":"The sensitivity of the FCC-hh to the anomalous magnetic moment $a_τ$ and the electric dipole moment $d_τ$ of the $τ$ lepton is studied in photon-induced $γγ\\toτ^+τ^-$ production with both $τ$ leptons decaying hadronically. Central exclusive (elastic) signal events, in which both protons remain intact, are generated with MadGraph5_aMC@NLO using a FeynRules UFO model of the anomalous $γττ$ vertex merged with the TauDecay model, so that the $τ$ decays and their spin correlations are included in the matrix element. Single- and double-dissociative production is estimated with SuperChic and added to the elastic signal with its own coupling dependence and with normalisation and shape uncertainties of 25%. Pythia 8 decays the unstable hadrons in the signal, decays the $τ$ leptons and simulates the parton shower and hadronisation in the backgrounds, and hadronises the dissociated protons. Signal and backgrounds are passed through the Delphes simulation of the FCC-hh detector. Hadronic $τ$ decays are reconstructed from particle-flow tracks and photons with an algorithm based on the hadrons-plus-strips approach, with an efficiency of 73.4% within the acceptance. Requiring no additional tracks from the $τ$ vertices retains part of the dissociative contribution and reduces the Drell-Yan and $γγ\\to WW$ backgrounds to 0.9% of the SM yield. The couplings are constrained from the shape of the total transverse mass distribution. For a centre-of-mass energy of 84 TeV and 30 ab$^{-1}$, the expected 95% CL limits are $-3.38\\times10^{-4} < a_τ< 3.36\\times10^{-4}$ and $|d_τ| < 1.88\\times10^{-18}\\,e\\,$cm, about an order of magnitude beyond the current bounds. Results are also given for FCC-hh scenarios between 72 and 120 TeV and for an optimistic detector parametrisation."},{"arxiv":"2610.12208","id":"3213071","title":"Evidence for Normal Neutrino Ordering with Combined Atmospheric Neutrino Experiments","authors":"Miaochen Jin, Carlos A. Argüelles, Pablo Fernández-Menéndez, Iván Martínez-Soler","score":4.9,"section":"cross","rank":31,"parts":[0.0,0.07,0.16,0.0],"note":"Closest of your papers: [[1455793]] (coupling 0.02, 2 shared references). Closest network paper: [[3158607]] (coupling 0.06, 5 shared references).","abstract":"We present a combined analysis of the latest publicly available atmospheric neutrino data from Super-Kamiokande including all data-taking stages previous to the gadolinium phase, IceCube-DeepCore, and the six-detection-unit configuration of KM3NeT/ORCA. Our fit uses all event samples simultaneously and treats the systematic uncertainties shared among experiments as fully correlated, while detector-response uncertainties are modeled independently for each experiment. The combined data constrain the atmospheric oscillation parameters to $Δm^2_{31} = 2.44^{+0.06}_{-0.04} \\times 10^{-3}\\,\\mathrm{eV}^2$ and $\\sin^2θ_{23} = 0.52^{+0.03}_{-0.04}$, with a precision of $2.2\\%$ and $6.1\\%$, respectively, which is competitive with current accelerator-based measurements, and independently constrain the $CP$-violating phase to $δ_{CP} = 1.30^{+0.24}_{-0.28}~π$. Finally, comparing the orderings of the neutrino mass spectrum, we find a preference for the normal ordering with $Δχ^2 = 11.0$; further calibrated with pseudoexperiments, we exclude the inverted ordering at $99.95\\%$ confidence level ($3.3σ$). In a joint fit including 207 days of JUNO data, we further exclude the inverted ordering at $Δχ^2 = 15.1$, corresponding to $3.9 σ$."},{"arxiv":"2610.27015","id":"3216766","title":"$Λ_b \\to Λ\\ell^+\\ell^-$ and $Λ_b \\to Λ^{\\ast} \\ell^+\\ell^-$ decays with polarized leptons","authors":"Diganta Das, Vedant Parekh, Ria Sain, Dargi Shameer","score":4.7,"section":"new","rank":32,"parts":[0.0,0.0,0.31,0.0],"note":"Closest network paper: [[3203506]] (coupling 0.11, 9 shared references).","abstract":"We present an analysis of lepton polarization observables in the rare flavor-changing neutral current decays $Λ_b \\to Λ\\ell^+\\ell^-$ and $Λ_b \\to Λ^*\\ell^+\\ell^-$. These decays are driven by the quark-level transition $b \\to s\\ell^+\\ell^-$ and are sensitive to short-distance physics within and beyond the Standard Model. We work within an effective Hamiltonian framework and derive single lepton polarization asymmetries, double lepton polarization asymmetries, and polarized forward-backward asymmetries using the helicity method. The observables are expressed in terms of transversity amplitudes and evaluated using state-of-the-art lattice QCD form factors. We analyze the $q^2$ dependence of several observables for both the ground-state $Λ$ and the excited $Λ^*(1520)$ final states and discuss sensitivities of the observables to chiral structure of the effective operators and complex Wilson coefficients."},{"arxiv":"2610.27106","id":"3216611","title":"This is SParTA: A modular, efficient and scalable transformer architecture for jet-tagging","authors":"Rajneil Baruah, Subhadeep Mondal, Sunando Kumar Patra, Satyajit Roy","score":3.9,"section":"new","rank":33,"parts":[0.0,0.04,0.16,0.0],"note":"Closest of your papers: [[1455793]] (coupling 0.02, 2 shared references). Closest network paper: [[2621240]] (coupling 0.06, 5 shared references).","abstract":"We present the Sparse Particle-interaction Transformer Architecture (SParTA), a modular, scalable, and efficient transformer for jet tagging at high-energy colliders. Exploiting the steeply falling transverse-momentum ($p_T$) spectrum of jet constituents, SParTA factorizes constituent processing into two topological regimes. Ordered by descending $p_T$, only the $N$ hardest constituents (the hard core) participate in quadratic $O(N^2)$ differential interaction attention driven by pairwise physical and learned relational features. The remaining soft constituents are integrated via linear $O(lN)$ cross-attention to the hard core, preserving soft-radiation and color-flow information while avoiding the $O(l^2)$ memory bottleneck of full self-attention over all $l$ constituents. Pairwise interaction features are computed dynamically in-network from constituent four-momenta and conditioned on global jet-level substructure observables. On the quark-gluon tagging benchmark, a 300K-parameter SParTA model achieves an AUC of 92.02% and accuracy of 85.06%, matching the 2.14M-parameter Particle Transformer (ParT) at one-seventh the parameter count and outperforming IAFormer by 21% in background rejection at 30% signal efficiency. On the boosted top-tagging benchmark, SParTA outperforms ParT and ParticleNet with 511K parameters, while we analyze the architectural trade-offs relative to fully dense multi-layer interaction networks."},{"arxiv":"2610.27748","id":"3216865","title":"Parameter dependence of the mapping of the mean-field Ising model onto QCD in the first-order phase transition regime","authors":"Xue Pan, Yuepeng Li","score":3.8,"section":"cross","rank":34,"parts":[0.0,0.08,0.07,0.0],"note":"Closest of your papers: [[2787890]] (coupling 0.03, 2 shared references). Closest network paper: [[2807770]] (coupling 0.02, 2 shared references).","abstract":"We map the mean-field Ising equation of state onto the QCD phase diagram and investigate how scaling parameters alter the metastable and unstable regions, as well as the symmetrized pressure and density along an isotherm on the QCD $T-μ_B$ phase plane. We find that, for both the conventional mapping scheme and the scheme valid in the small-quark-mass limit, increasing the scaling parameters $w$ and $ρ$ narrows the metastable and unstable regions. In the small-quark-mass-limit scheme, larger $w$ and $ρ$ reduce both the Ising-symmetrized pressure and density. For the conventional scheme, increasing $w$ reduces these quantities, while increasing $ρ$ raises the Ising-symmetrized pressure and has only a small effect on the density."},{"arxiv":"2608.23788","id":"3195634","title":"Photon and gluon gravitational form factors of proton in QCD","authors":"Z. Asmaee, K. Azizi","score":3.8,"section":"replacement","rank":35,"parts":[0.06,0.01,0.07,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[3184726]] (coupling 0.00, 1 shared references). Closest network paper: [[3206672]] (coupling 0.02, 2 shared references).","abstract":"The energy momentum tensor allows us to probe the internal gravitational structure of the proton. The corresponding gravitational form factors contain information about its different contributions. In this work, we investigate the photon and gluon gravitational form factors of the proton within the QCD sum rule approach. Four independent gravitational form factors are computed in the range $0<Q^2<2\\ \\mathrm{GeV}^2$. The mass and scalar radii of the photon and gluon sectors are obtained in the forward limit. We find that the gluon mass radius is smaller than the photon mass radius. These results may be useful for future lattice QCD calculations and phenomenological studies."},{"arxiv":"2610.28408","id":"3216981","title":"Hybrid Stars with Different Amount of Quark Matter","authors":"Milena Albino, Tuhin Malik, Márcio Ferreira, Constança Providência","score":3.6,"section":"cross","rank":36,"parts":[0.0,0.04,0.14,0.0],"note":"Closest of your papers: [[1679809]] (coupling 0.01, 1 shared references). Closest network paper: [[3147506]] (coupling 0.05, 3 shared references).","abstract":"In a previous work, we explored the possibility of neutron stars with large quark cores. Through Bayesian inference, we obtained large sets of equations of state imposing constraints regarding the properties of nuclear matter, mass-radius data from NICER, the GW170817 data from Virgo-LIGO collaboration, perturbative QCD and causality. We also imposed that the maximum mass neutron star (NS$\\text{max}$) must have a large quark core. In this work, we obtain a new set of equations of state (SmallQ set) with the same constraints as before. However, we relaxed the last constraint, imposing only that NS$\\text{max}$ must have quark core, regardless of its size. We compare the results with the set from our previous paper constrained by NICER and GW170817 observations NJL-GW. For both sets, we use the Relativistic Mean Field model with nonlinear meson interactions for the hadron phase and the Nambu--Jona-Lasinio model with four- and eight-quark interaction terms for the quark phase. The SmallQ set has higher values of phase transition density, with 3 -- 4.5 $ρ_0$, compared to the NJL-GW, with 2 -- 2.5 $ρ_0$. The new set describes NSs with smaller radius and smaller tidal deformability, and is more compatible with NICER and GW170817 data. A difference in the quark matter composition is observed, with a larger quark strange fraction occurring in the SmallQ set. Within this set, $2 M_\\odot$ NSs may contain little to no quark matter. It is shown that there is a non negligible fraction of EOS whose mass-radius curve presents a positive slope for 1.8 $M_\\odot$ stars, while for nucleonic stars this fraction is negligible and for hyperonic stars the slope is always negative."},{"arxiv":"2610.27843","id":"3216900","title":"Flavor decomposition of electromagnetic multipole moments in $[q_1q_2][\\bar q_3 \\bar c]$ tetraquarks: Light-quark analogs of $T_{cs1}(2900)^0$ with $J^P = 1^+$","authors":"Ulaş Özdem","score":3.5,"section":"new","rank":37,"parts":[0.06,0.01,0.05,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[3184726]] (coupling 0.00, 1 shared references). Closest network paper: [[2817040]] (coupling 0.02, 19 shared references).","abstract":"We present a systematic study of the magnetic dipole and electric quadrupole moments of compact $[q_1 q_2][\\bar q_3 \\bar c]$ tetraquark states with quantum numbers $J^P = 1^+$, in the diquark--antidiquark picture and within the light-cone QCD sum rule framework. By performing a flavor decomposition across all admissible $u/d$ configurations, we show that the charm-quark contribution to the electromagnetic moments vanishes algebraically at the operator level -- a structural feature of the specific spin organization adopted here, in which the heavy antiquark resides in a pseudoscalar antidiquark, distinct from the dynamical $1/m_c$ suppression operative in alternative compact constructions and in hadronic molecules. The magnetic moments follow a coherent light-flavor pattern -- positive for $uu$-, negative for $dd$-, and suppressed for mixed-flavor diquarks -- and the quadrupole moments are non-zero throughout, corresponding, in the customary geometrical interpretation, to intrinsically deformed charge distributions. We further identify the dimensionless multipole ratio $\\mathcal{D}/μ$ as a structural observable, independent of the normalization of the interpolating current, which probes the relative geometry of the spin-current and charge distributions complementary to the absolute moments. Taken together, the algebraic decoupling of the charm contribution and the operator-level distinction it implies among different singly-heavy tetraquark architectures constitute methodological signatures that discriminate among the corresponding internal organizations and, to the extent that a physical candidate is dominated by one of them, among compact and molecular interpretations."},{"arxiv":"2608.29947","id":"3197961","title":"Bose-Einstein condensation and dark radiation production from bosonic warm dark matter","authors":"Zhijian Zhang","score":3.5,"section":"replacement","rank":38,"parts":[0.0,0.06,0.1,0.0],"note":"Closest of your papers: [[793723]] (coupling 0.02, 3 shared references). Closest network paper: [[3214429]] (coupling 0.03, 10 shared references).","abstract":"We investigate the quantum statistical effects of bosonic warm dark matter (BWDM) in a microscopic model in which dark radiation (DR) is produced through the annihilation process $χχ\\rightarrowφφ$ mediated by a Yukawa interaction. By decomposing the BWDM phase-space distribution into thermal and Bose--Einstein condensed components, we derive the thermally averaged annihilation cross sections for the thermal--thermal, thermal--condensate, and condensate--condensate channels, including the Sommerfeld enhancement. We find that, for the relatively small scalar DR masses considered here, the thermal--condensate channel remains subdominant. The transition between the thermal--thermal dominated and condensate--condensate dominated regimes is characterized by a critical condensate fraction $r_{\\rm c}$, which depends mainly on the BWDM mass and the scalar DR mass. For condensate fractions above this critical value, the condensate--condensate channel can dominate the present-day annihilation rate. We further constrain the BWDM parameter space using the observational upper bound on the additional effective number of relativistic species, $ΔN_{\\mathrm{eff}}$."},{"arxiv":"2609.00932","id":"3198510","title":"Investigating three-body resonances in $ααΩ/Ω_{ccc}$ clusters within the $^{9}_{Ω/Ω_{ccc}}{\\mathrm{Be}}$ nucleus","authors":"Hao Zhou, Xiang Liu","score":3.5,"section":"replacement","rank":39,"parts":[0.06,0.01,0.06,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[3184726]] (coupling 0.00, 1 shared references). Closest network paper: [[3209823]] (coupling 0.02, 2 shared references).","abstract":"We investigate the bound and resonant states of the $α+α+Ω$ and $α+α+Ω_{ccc}$ three-body systems, corresponding to $^{9}_Ω{\\mathrm{Be}}$ and $^{9}_{Ω_{ccc}}{\\mathrm{Be}}$, within the Gaussian expansion method combined with the complex scaling method. The $αΩ$ and $αΩ_{ccc}$ interactions ar   const placed=[];L.forEach(l=>{let k=0;while(k<40&&placed.some(p=>l.x0<p.x0+p.w&&p.x0<l.x0+l.w&&Math.abs(l.y-p.y)<13)){l.y+=13*(k%2?-1:1)*(1+Math.floor(k/2));k++;l.y=Math.max(m.t+10,Math.min(H-m.b-4,l.y))}placed.push(l)});
  G.append('g').selectAll('text').data(L).join('text').attr('class','nlabel').attr('x',l=>l.right?l.s.x-r(l.s.n)-4:l.s.x+r(l.s.n)+4).attr('y',l=>l.y)
    .attr('text-anchor',l=>l.right?'end':'start').text(l=>l.t);
  paint();
}
function showTip(ev,n){const b=document.getElementById('chart').getBoundingClientRect();tip.hidden=false;tip.textContent=`${auth(n)} (${n.year}) — ${plain(n.title)}`+(isNew(n)?` · score ${n.score}`:'');
  let L=ev.clientX-b.left+12;if(L>b.width-290)L=ev.clientX-b.left-290;tip.style.left=Math.max(4,L)+'px';tip.style.top=(ev.clientY-b.top+12)+'px'}
function paint(){if(!G)return;const f=hover||sel,on=new Set();if(f){on.add(f.i);f.out.forEach(i=>on.add(i));f.inn.forEach(i=>on.add(i))}
  svg.classed('dim',!!f);
  G.selectAll('path.edge').attr('class',l=>'edge '+l.k+(!f?'':l.s===f.i?' hot out':l.t===f.i?' hot in':''));G.selectAll('path.edge.hot').raise();
  G.selectAll('circle').classed('on',s=>on.has(s.n.i)).classed('sel',s=>sel&&s.n.i===sel.i).classed('match',s=>query&&`${s.n.first} ${s.n.title} ${s.n.arxiv} ${s.n.authors||''}`.toLowerCase().includes(query));
  G.selectAll('text.nlabel').classed('on',l=>on.has(l.s.n.i))}
function panel(){const p=document.getElementById('panel'),n=sel;
  if(!n){p.innerHTML='<p>Select a paper in the network.</p>';return}
  const links=`<div class="links">${n.id?`<a href="https://inspirehep.net/literature/${n.id}" target="_blank" rel="noopener">INSPIRE</a>`:''}${n.arxiv?`<a href="https://arxiv.org/abs/${esc(n.arxiv)}" target="_blank" rel="noopener">arXiv</a>`:''}</div>`;
  if(isNew(n)) p.innerHTML=`<div class="role" style="color:${col(n)}">#${n.rank} · ${esc(SEC[n.section])} · score ${n.score.toFixed(1)}</div><h4>${esc(n.title)}</h4>
   <div class="meta">${esc(auth(n))} · arXiv:${esc(n.arxiv)}</div><p>${why(n.note)}</p><div class="links"><a href="#p${n.i}">Back to abstract</a></div>`;
  else p.innerHTML=`<div class="role" style="color:${col(n)}">${esc(ROLE[n.role])}</div><h4>${esc(n.title)}</h4>
   <div class="meta">${esc(auth(n))} · ${n.year}${n.arxiv?' · arXiv:'+esc(n.arxiv):''}</div>
   <div class="stats"><span>${n.cites.toLocaleString()} citations</span><span>${n.inn.filter(i=>isNew(N[i])).length} of the matches link here</span></div>${links}`;
  tex(p)}
function pick(n,scroll){sel=n;panel();paint();document.querySelectorAll('.paper').forEach(el=>el.classList.toggle('sel',el.id==='p'+n.i));if(scroll)document.getElementById('chart').scrollIntoView({behavior:'smooth',block:'nearest'})}
const present=new Set(N.map(n=>n.role));
document.getElementById('legend').innerHTML=['today','repl','seed','other'].filter(k=>present.has(k)).map(k=>`<span><i class="dot" style="background:var(--${k})"></i>${esc(ROLE[k])}</span>`).join('')+'<span style="color:var(--fg-3)">Listing papers: size ∝ score; others: size ∝ log(citations)</span>';
document.getElementById('q').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();paint()});
svg.on('click',ev=>{if(ev.target.tagName!=='circle'){sel=null;panel();paint()}});
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(draw,200)});
function nextList(){const X=RAW.next||[];if(!X.length)return;const box=document.getElementById('nextlist'),more=document.getElementById('more');
  more.hidden=false;more.querySelector('summary').firstChild.textContent=`The next ${X.length} papers by score `;
  document.getElementById('moresub').textContent=`below the threshold of ${M.threshold}, not drawn in the network`;
  box.innerHTML=X.map(n=>`<li><div class="role" style="color:var(--${n.section==='replacement'?'repl':'today'})">#${n.rank} · ${esc(SEC[n.section])} · score ${n.score.toFixed(1)}</div>
    <div class="t">${esc(n.title)}</div><div class="authors">${authors(n.authors)} · arXiv:${esc(n.arxiv)}</div>
    ${n.note?`<p class="why">${why(n.note)}</p>`:''}
    <details class="abs"><summary>Abstract</summary><p class="abs">${esc(n.abstract)}</p></details>
    <div class="links">${n.id?`<a href="https://inspirehep.net/literature/${n.id}" target="_blank" rel="noopener">INSPIRE</a>`:''}<a href="https://arxiv.org/abs/${esc(n.arxiv)}" target="_blank" rel="noopener">arXiv</a><a href="https://arxiv.org/pdf/${esc(n.arxiv)}" target="_blank" rel="noopener">PDF</a></div></li>`).join('');
  more.addEventListener('toggle',()=>{if(more.open)tex(box)})}
const rtip=document.getElementById('reftip');let rcur=null;
function refShow(el){const r=REFS[el.dataset.ref];if(!r)return;rcur=el;rtip.textContent=`${auth(r)} (${r.year}) — ${plain(r.title)}`;rtip.hidden=false;
  const b=el.getBoundingClientRect(),t=rtip.getBoundingClientRect();let L=Math.min(Math.max(8,b.left),innerWidth-t.width-8),T=b.bottom+6;
  if(T+t.height>innerHeight-8)T=b.top-t.height-6;rtip.style.left=L+'px';rtip.style.top=T+'px'}
function refHide(){rtip.hidden=true;rcur=null}
document.addEventListener('pointerover',e=>{const el=e.target.closest('.ref');if(el&&e.pointerType==='mouse')refShow(el)});
document.addEventListener('pointerout',e=>{if(e.target.closest('.ref')&&e.pointerType==='mouse')refHide()});
document.addEventListener('click',e=>{const el=e.target.closest('.ref');if(el)refShow(el);else if(rcur)refHide()});
document.addEventListener('focusin',e=>{const el=e.target.closest('.ref');if(el)refShow(el)});
document.addEventListener('focusout',e=>{if(e.target.closest('.ref'))refHide()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')refHide()});
addEventListener('scroll',()=>{if(rcur)refHide()},{passive:true});
list();nextList();fold();draw();panel();
window.addEventListener('load',()=>{tex(document.getElementById('list'));tex(document.getElementById('panel'));fold();
  if(window.MathJax&&MathJax.startup&&MathJax.startup.promise)MathJax.startup.promise.then(()=>setTimeout(fold,300))});
addEventListener('resize',()=>{clearTimeout(window._ft);window._ft=setTimeout(fold,200)});
</script>
