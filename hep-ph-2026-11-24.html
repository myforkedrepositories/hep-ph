<script>
const RAW = {"n":[{"id":"3232197","arxiv":"2611.28217","title":"WIMPs as FIMPs: the Inert Doublet Model and low-temperature reheating","first":"Bélanger","nauth":5,"year":2026,"cites":0,"role":"today","note":"Co-authors of yours: Bélanger, Bernal, Pukhov. Cites your papers: [[3130296]], [[2856850]]. Cites 29 network papers: [[3159193]], [[3170413]], [[3127262]], [[3206196]], [[3167584]], [[3138530]]…. Also cites widely used network papers: [[2817040]], [[1518747]]. Closest of your papers: [[2856850]] (coupling 0.18, 29 shared references). Closest network paper: [[3232197]] (coupling 1.00, 78 shared references). Shared topics: during reheating, relic abundance, interacting massive particle, weakly interacting massive particle, early universe.","score":84.6,"rank":1,"section":"new","parts":[1.0,0.53,1,1,0.87],"abstract":"Weakly Interacting Massive Particles (WIMPs) are conventionally assumed to acquire their dark matter relic abundance through thermal freeze-out. However, this association relies on assumptions concerning the thermal history of the early Universe. We revisit the Inert Doublet Model (IDM), a representative WIMP framework in which dark matter interacts with the Standard Model through electroweak gauge interactions, even when its Higgs-portal coupling vanishes. We demonstrate that sufficiently low reheating temperatures can prevent chemical equilibrium, allowing a genuine WIMP to acquire its relic abundance through freeze-in rather than freeze-out. Considering both instantaneous and finite-duration reheating, we identify different production histories, including freeze-out during radiation domination, freeze-out during reheating, and freeze-in with potentially significant annihilation backreactions. These scenarios open regions of the IDM parameter space that would otherwise be excluded by dark matter overabundance. Our results demonstrate that WIMPs can behave as FIMPs, depending on the thermal history of the Universe.","authors":"Geneviève Bélanger, Nicolás Bernal, Andreas Goudelis, Alexander Pukhov, Thomas Reggio","nlinked":78,"nref":78,"src":"INSPIRE","html":true},{"id":"3233342","arxiv":"2611.30799","title":"Fermionic dark linear seesaw with an anomalous Majoron","first":"Batra","nauth":3,"year":2026,"cites":0,"role":"today","note":"Cites your papers: [[3094526]], [[1365306]]. Cites 23 network papers: [[3190925]], [[3178456]], [[3092811]], [[3152380]], [[2931725]], [[3193100]]…. Also cites widely used network papers: [[1362180]], [[1783234]]. Closest of your papers: [[3094526]] (coupling 0.08, 22 shared references). Closest network paper: [[2656226]] (coupling 0.36, 54 shared references). Shared topics: interacting massive particle, weakly interacting massive particle, neutrino mass, dark matter.","score":62.5,"rank":2,"section":"new","parts":[1.0,0.23,1,0.0,0.56],"abstract":"We propose a minimal fermionic realisation of the $\\textit{dark}$ linear seesaw with spontaneous breaking of lepton number. The small lepton-number-violating parameter responsible for linear-seesaw neutrino masses is generated radiatively by a $\\textit{dark}$ sector consisting of a singlet and a doublet fermion, together with scalar singlets. The global U(1)$_L$ symmetry is broken to a residual $\\mathcal{Z}_2$ under which the $\\textit{dark}$ sector is odd. This breaking yields a Majoron $J$ and makes the lightest $\\textit{dark}$ particle stable. The charged $\\textit{dark}$ fermion acquires its mass solely from U(1)$_L$ breaking and thus induces an anomalous Majoron coupling to photons. Current bounds on this coupling exclude a massless Majoron for TeV-scale U(1)$_L$ breaking. We add a linear term that breaks lepton number softly and gives the Majoron a GeV-scale mass. Such a Majoron decays into two photons and can be probed at beam-dump experiments. We study the dark matter phenomenology, focusing on the case where the stable particle is a fermionic weakly interacting massive particle. We analyse how the framework can be tested through charged-lepton flavour-violating decays such as $μ\\to eγ$, which receive contributions from both the $\\textit{dark}$ and the seesaw sectors. Moreover, both sectors enhance the Majoron couplings to charged leptons, so that the Majoron-emitting decays $τ\\to \\ell J$ ($\\ell = e,μ$) typically exceed $τ\\to \\ellγ$ by orders of magnitude and can probe parameter space beyond the reach of $μ\\to eγ$.","authors":"A. Batra, H. B. Câmara, F. R. Joaquim","nlinked":211,"nref":227,"src":"INSPIRE","html":true},{"id":"3232220","arxiv":"2611.28223","title":"Scotogenic dark matter from gauged $L_μ+L_τ$","first":"Echeverria-Puentes","nauth":6,"year":2026,"cites":0,"role":"today","note":"Cites 8 network papers: [[3193100]], [[2697223]], [[2623114]], [[1717279]], [[1790924]], [[1493855]]…. Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1692605]] (coupling 0.04, 5 shared references). Closest network paper: [[2963992]] (coupling 0.14, 21 shared references). Shared topics: scotogenic model, relic abundance, scalar dark matter, thermal relic, interacting massive particle.","score":53.6,"rank":3,"section":"new","parts":[0.99,0.12,0.4,0.0,0.94],"abstract":"In this work, we introduce the first scotogenic model based on a gauged $L_μ + L_τ$ symmetry whose spontaneous breaking by two units leaves a remnant matter parity $M_P$. The resulting light active neutrinos are of Majorana nature and the lightest electrically neutral state mediating the scotogenic loop is stabilized by $M_P$ and can be identified as a weakly interacting massive particle dark matter candidate. We analyze the phenomenology of a predominantly singlet-like CP-even scalar dark matter candidate and the representative regions of parameter space compatible with the observed thermal relic abundance. The $Z'$ boson is compatible with a broad range of parameters relevant for dark matter. In particular, electroweak precision constraints do not lead to significant tensions for kinetic mixing values up to $ε\\sim 10^{-2}$. We discuss the implications of existing searches for leptophilic gauge bosons and the conditions under which visible and invisible collider signatures become relevant.","authors":"J. Echeverria-Puentes, Sergey Kovalenko, Pablo San Martin Sartori, Carlos A. Vaquera-Araujo, Yoxara Villamizar, Jilberto Zamora Saa","nlinked":61,"nref":63,"src":"INSPIRE","html":true},{"id":"3232180","arxiv":"2611.28224","title":"TeV-Scale Leptogenesis in the Linear Seesaw Framework","first":"Hernández","nauth":4,"year":2026,"cites":0,"role":"today","note":"Co-authors of yours: Valle. Cites 5 network papers: [[3183927]], [[3193100]], [[2134261]], [[1846923]], [[1929060]]. Closest of your papers: [[1679809]] (coupling 0.02, 2 shared references). Closest network paper: [[3092811]] (coupling 0.13, 14 shared references). Shared topics: scalar doublet, neutrino mass.","score":51.3,"rank":4,"section":"new","parts":[0.95,0.08,0.37,0.5,0.52],"abstract":"The linear seesaw mechanism relates the smallness of neutrino masses to the mass splitting within a quasi-Dirac pair of heavy neutrinos, thereby providing a natural framework for realising resonant leptogenesis at low energies. We investigate this possibility within its simplest effective realisation, in which neutrino masses are mediated by a quasi-Dirac pair at the TeV scale. We estimate the generation of the baryon asymmetry in the purely flavoured and strong-washout regimes, identifying phenomenologically viable parameter regions and benchmark scenarios in which the heavy-neutrino decays are dominated either by the SM Higgs doublet or by a second, leptophilic scalar doublet responsible for neutrino mass generation. We find viable leptogenesis solutions both near and away from the resonant maximum and discuss complementary phenomenological probes of the framework.","authors":"A. E. Cárcamo Hernández, J. Echeverria-Puentes, Stephen F. King, José W. F. Valle","nlinked":54,"nref":55,"src":"INSPIRE","html":true},{"id":"3232408","arxiv":"2611.30113","title":"Superheavy gravitational dark matter from runaway bubble collisions","first":"Chiang","nauth":2,"year":2026,"cites":0,"role":"today","note":"Cites 5 network papers: [[3208082]], [[2737356]], [[2046345]], [[1998966]], [[1846588]]. Closest of your papers: [[1828504]] (coupling 0.07, 7 shared references). Closest network paper: [[3208082]] (coupling 0.20, 9 shared references). Shared topics: dark matter.","score":49.5,"rank":5,"section":"new","parts":[0.95,0.21,0.58,0.0,0.13],"abstract":"A stable particle that couples only through gravity is pair-produced in collisions of runaway bubble walls by graviton exchange. For a transition of duration $1/β$, a Dirac fermion reaches the yield $Y_X\\simeq6.8\\times10^{-3}(H/β)(T_{\\rm reh}/M_{\\rm P})^3$, where $H$ is the Hubble rate of the vacuum energy, $T_{\\rm reh}$ the reheating temperature and $M_{\\rm P}$ the reduced Planck mass. The yield is flat up to masses near $(H/β)M_{\\rm P}/ν^2$, where $ν$ of order one sets the wall-field excursion. Gravity alone then gives dark matter up to about $10^{17}$~GeV at reheating temperatures far below its mass, where freeze-in fails.","authors":"Cheng-Wei Chiang, Van Que Tran","nlinked":60,"nref":64,"src":"INSPIRE","html":true},{"id":"3085047","arxiv":"2511.15793","title":"How Bright in Gravitational Waves are Millisecond Pulsars for the Galactic Center GeV Gamma-Ray Excess? A Systematic Study and Implications for Dark Matter","first":"Lei","nauth":3,"year":2026,"cites":0,"role":"repl","note":"Cites 2 network papers: [[1327184]], [[2795517]]. Closest of your papers: [[1421624]] (coupling 0.12, 21 shared references). Closest network paper: [[3130997]] (coupling 0.17, 19 shared references). Shared topics: dark matter, gravitational wave.","score":42.8,"rank":6,"section":"replacement","parts":[0.7,0.3,0.48,0.0,0.21],"abstract":"The existence of dark matter (DM) is supported by various macroscopic observations, but its microscopic nature remains elusive. The Galactic Center GeV gamma-ray excess (GCE) has been a leading candidate signal for particle DM annihilation. However, an unresolved population of millisecond pulsars (MSPs) in the bulge provides the alternative explanation for the excess. Identifying these MSPs in electromagnetic bands is difficult due to source confusion, pulse broadening, and extinction. Gravitational waves (GWs) provide a complementary probe: a steadily rotating, non-axisymmetric MSP emits a nearly monochromatic GW signal in the sensitive band of ground-based detectors, with amplitude set by its ellipticity. In this work, we systematically investigate the GW emission from the MSP population proposed to explain the GCE and its detectability with current and future detectors. We consider three major scenarios for the origin of ellipticity and model the population properties of these MSPs. We also consider both isolated MSPs and MSPs in binary systems, as well as Doppler effects in the detection. We find that while the signal is below the reach of current interferometers, next-generation detectors such as the Einstein Telescope (ET) and Cosmic Explorer (CE) may detect a fraction of those MSPs, offering a novel test of the MSP interpretation of the GCE. Future directed searches toward the Galactic Center may either uncover this long-sought MSP population or place stringent constraints on bulge MSP properties. Continued improvements in detector sensitivity will provide increasingly stringent tests of the MSP interpretation, with growing power to distinguish between the astrophysical and DM interpretations of the GCE.","authors":"Ming-Yu Lei, Bei Zhou, Xiaoyuan Huang","nlinked":148,"nref":160,"src":"INSPIRE","html":true},{"id":"3232361","arxiv":"2611.29659","title":"Pseudoscalar Yukawa Preheating via Effective Action Approach","first":"Li","nauth":4,"year":2026,"cites":0,"role":"today","note":"Cites 2 network papers: [[2797795]], [[2826995]]. Closest of your papers: [[2627241]] (coupling 0.05, 5 shared references). Closest network paper: [[2956181]] (coupling 0.10, 12 shared references). Shared topics: yukawa interaction.","score":34.9,"rank":7,"section":"new","parts":[0.7,0.14,0.29,0.0,0.19],"abstract":"In this work, we investigate helicity-dependent fermion production driven by a pseudoscalar Yukawa interaction within the one-loop effective action framework. By integrating out the fermionic fields and employing the Schwinger proper time representation, we derive an analytical expression for the fermion pair production probability near each zero crossing of the oscillating inflaton field. We further introduce a helicity transfer matrix to describe the evolution of fermionic modes through successive non-adiabatic production events. For an undamped inflaton background, the temporal symmetry around successive zero crossings leads to the cancellation of helicity-mixing contributions after an even number of events, preventing the accumulation of helicity asymmetry. We then extend the analysis to a damped oscillatory background, in which the decreasing inflaton amplitude breaks this temporal symmetry and modifies the transfer matrix at each crossing. The resulting non-commuting transfer matrices produce a persistent helical spectrum, as demonstrated by the probabilities as a function of momentum obtained after successive scattering events. A comparison with scalar Yukawa preheating further confirms the role of helicity mixing in generating the helical asymmetry induced by pseudoscalar mechanism. These results establish an effective action framework for studying helicity asymmetry during fermionic preheating and provide insight into the influence of the inflaton's dynamical evolution on particle production.","authors":"Xi-Bin Li, De-Tian Zhao, Ke Fu, Jun-Yang Jiao","nlinked":75,"nref":82,"src":"INSPIRE","html":true},{"id":"3220170","arxiv":"2610.38531","title":"Inelastic Kinetic Decoupling in WIMP Leptogenesis: A Minimal $Z_4$ Model","first":"Liu","nauth":2,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[2141293]]. Closest of your papers: [[2614919]] (coupling 0.03, 3 shared references). Closest network paper: [[2141293]] (coupling 0.12, 14 shared references). Shared topics: relic abundance, dark matter abundance, indirect detection, dark matter.","score":30.1,"rank":8,"section":"replacement","parts":[0.45,0.08,0.35,0.0,0.66],"abstract":"We study a minimal $Z_4$-symmetric extension of the Standard Model in which a singlet Dirac fermion $χ$ constitutes dark matter, whose annihilations generate a lepton asymmetry through WIMP leptogenesis. Kinetic equilibrium is maintained mainly by the inelastic conversion $χL\\leftrightarrow\\barχΨ$. Compared with the near elastic regime, a sizable mass gap suppresses the conversion rate more rapidly as the Universe cools. This naturally drives kinetic decoupling to earlier times, even away from resonance. Starting from the full inelastic collision operator, we derive an effective momentum transfer rate for kinetic decoupling. We then solve the coupled Boltzmann equations for the dark matter abundance, its temperature $T_χ$, and the $B-L$ asymmetry. Early kinetic decoupling can significantly modify the relic abundance, although near resonance this modification can be reduced by annihilation-induced heating. The $B-L$ asymmetry can be affected when asymmetry production overlaps with a substantial departure from kinetic equilibrium. In our scan, the largest deviations occur mainly for $x_{\\rm lep}\\gtrsim x_{\\rm cd}$. After imposing our constraints, asymmetry production typically ends before chemical decoupling, leaving the final asymmetry essentially unchanged. For indirect detection, we generate the photon spectrum with Pythia and evaluate the Fermi-LAT dwarf spheroidal likelihood.","authors":"An Liu, Hong-Hao Zhang","nlinked":57,"nref":62,"src":"INSPIRE","html":true},{"id":"3233338","arxiv":"2611.30780","title":"Light on GeV-scale seesaw","first":"Bertuzzo","nauth":3,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Closest of your papers: [[1249404]] (coupling 0.05, 7 shared references). Closest network paper: [[2835155]] (coupling 0.18, 21 shared references).","score":28.8,"rank":9,"section":"new","parts":[0.45,0.15,0.5,0.0,0.09],"abstract":"The next generation of beam-dump and accelerator-neutrino experiments will probe GeV-scale sterile neutrinos with unprecedented sensitivity. However, the tiny active-sterile mixing predicted by the minimal seesaw mechanism is expected to remain out of reach. Oscillation data require at least two sterile neutrinos, $N_1$ and $N_2$, which may couple to the photon through a transition dipole. Such a coupling can radically change the picture, both by strongly enhancing sterile-neutrino production and by opening new decay channels. We identify charged-lepton pairs produced by an off-shell photon as the most promising experimental signature. We show that the seesaw band can be probed by the T2K near detector for sterile-neutrino masses $m_N\\lesssim 500$ MeV, and by SHiP for $m_N\\lesssim 5$ GeV. For a sufficiently large dipole, $d\\gtrsim (10~\\mathrm{TeV})^{-1}$, SHiP can selectively measure decay channels that require nonzero active-sterile mixing. This would give rise to a distinctive hierarchy of signatures, providing a direct test of the seesaw mechanism.","authors":"Enrico Bertuzzo, Michele Frigerio, Salvador Urrea","nlinked":49,"nref":51,"src":"INSPIRE","html":true},{"id":"3232191","arxiv":"2611.28211","title":"Revealing Dark Matter in the Dark-Electron Rate of Xenon Detectors","first":"Santos-Olmsted","nauth":4,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[913031]]. Closest of your papers: [[3130296]] (coupling 0.07, 12 shared references). Closest network paper: [[3086375]] (coupling 0.08, 9 shared references). Shared topics: dm mass, dark matter.","score":28.7,"rank":10,"section":"new","parts":[0.45,0.19,0.24,0.0,0.36],"abstract":"There is high interest in improving experimental sensitivity to sub-GeV dark matter (DM) that scatters with electrons, as compelling theoretical models seem within reach. At the lowest DM masses, most of the expected signal lies in the single-electron regime, but so do large backgrounds. Xenon experiments therefore either do not yet search there at all or, as in XENONnT, apply cuts so severe that only $\\sim$$10^{-4}$ of the exposure is retained, with sensitivity set by the criterion $S \\lesssim B$, where those are the signal and background counts. We advocate that xenon detectors instead utilize most of their dark-electron rate (i.e., the total raw electron hit rate) and perform an annual-modulation search, for which the sensitivity scales as $S \\lesssim \\sqrt{B}$. Modern DAQs already record this rate, continuously in triggerless systems such as the XENONnT and PandaX-4T DAQs, and within trigger windows in LZ, so no new hardware is required. Using measured dark-electron rates, we estimate the sensitivity of XENONnT, LZ, PandaX-4T, PandaX-xT, and XLZD. We find that dramatic gains in sensitivity are possible, motivating new analyses of present and future xenon data.","authors":"Lillian Santos-Olmsted, Rebecca K. Leane, Carlos Blanco, John F. Beacom","nlinked":87,"nref":98,"src":"INSPIRE","html":true},{"id":"3232193","arxiv":"2611.28230","title":"Higgs-portal dark matter beyond kinetic equilibrium","first":"Arcadi","nauth":5,"year":2026,"cites":0,"role":"today","note":"Closest of your papers: [[2751074]] (coupling 0.09, 5 shared references). Closest network paper: [[2784023]] (coupling 0.29, 11 shared references). Shared topics: relic abundance, direct detection, indirect detection, dark matter model, dark matter.","score":27.6,"rank":11,"section":"new","parts":[0.0,0.27,0.83,0.0,0.71],"abstract":"We revisit the scalar, vector, and fermion Higgs-portal dark matter models in the resonant regime without assuming kinetic equilibrium during the freeze-out. We compute the relic abundance by solving the full momentum-dependent Boltzmann equation and compare the results with the standard momentum-averaged treatment. We find that the standard treatment significantly underestimates the relic abundance below the resonance, apart from the fermionic case with a purely scalar portal coupling where the difference is negligible. The deviation from the standard treatment is largest for fermionic models with pseudoscalar interactions, corresponding to factor of 10 in terms of the coupling that reproduces the correct relic abundance. For the scalar and vector cases the corresponding difference is up to a factor of 2. We confront the resulting parameter space with the latest constraints from direct and indirect detection, as well as collider experiments. We find the full momentum-dependent results systematically strengthen the direct detection constraints.","authors":"Giorgio Arcadi, Michele Benaco, Mattia Di Mauro, Sami Nurmi, Kimmo Tuominen","nlinked":33,"nref":33,"src":"INSPIRE","html":true},{"id":"2953484","arxiv":"2507.17438","title":"CMB constraints on $U(1)$ axion warm inflation","first":"Alaei","nauth":3,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[1803656]]. Closest of your papers: [[2663002]] (coupling 0.03, 7 shared references). Closest network paper: [[3183493]] (coupling 0.20, 18 shared references).","score":27.1,"rank":12,"section":"replacement","parts":[0.45,0.1,0.56,0.0,0.0],"abstract":"In this work, we propose a model of warm inflation driven by axion-like particles interacting with $U(1)$ gauge fields, with implications for the early universe's thermal evolution. By extending traditional warm inflation models, we introduce a dissipation mechanism through the thermal fluctuations of electromagnetic fields, leading to a non-trivial back-reaction on the inflaton's dynamics. Our results are consistent with CMB observations, even for a natural sub-Plankian Axion decay constant $f\\leq M_{\\rm Pl}$. We present precise constraints on the model's free parameters, using CAMB and CosmoMC codes. These findings offer new insights into the thermal history of the universe and the nature of inflationary dynamics.","authors":"Asma Alaei, Sukannya Bhattacharya, Vahid Kamali","nlinked":93,"nref":98,"src":"INSPIRE","html":true},{"id":"3233390","arxiv":"2611.31142","title":"A proposal for an LHC search for baryon number violation in complementarity with trilepton nucleon decay searches","first":"Bhoonah","nauth":5,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[2053590]]. Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2690106]] (coupling 0.03, 5 shared references). Closest network paper: [[1861353]] (coupling 0.16, 11 shared references).","score":26.6,"rank":13,"section":"new","parts":[0.48,0.09,0.45,0.0,0.0],"abstract":"We investigate the compatibility of existing limits on trilepton nucleon decay by the Super-Kamiokande (Super-K) experiment with Baryon Number Violation (BNV) at the TeV scale and motivate a dedicated search using existing data at the LHC. Working within an effective field theory framework, we derive model-independent constraints on higher-dimensional operators associated with $B - L/3$ conserving texture of BNV. We demonstrate that existing Super-K limits on loop-level trilepton nucleon decay provide significantly stronger constraints compared to tree-level charm-baryon decays induced by these operators. These constraints translate into bounds of $O(1-30)$ TeV on the BNV scale, leaving open the possibility of an LHC search for $B - L/3$ type BNV. Motivated by this complementarity, we investigate the collider phenomenology of a representative UV completion featuring an $s$-channel diquark resonance that decays into a leptoquark--dilepton pair, producing a distinctive final state containing an anti-top quark, two charged anti-leptons, and missing transverse energy. Our results indicate that, although same-sign dilepton searches by ATLAS and CMS already place indirect constraints on this model, a dedicated analysis based on the selection cuts we develop significantly extends the reach for our chosen benchmarks. In particular, using only Run 2 data, we demonstrate complementary reach to limits on trilepton nucleon decay searches set by the Super-K experiment and to the projected reach of Hyper-Kamiokande. The selection cuts are applicable beyond our representative model.","authors":"Amit Bhoonah, Francis M. Burk, Da Liu, Tong Ou, Deepak Sathyan","nlinked":76,"nref":78,"src":"INSPIRE","html":true},{"id":"3230948","arxiv":"2611.24241","title":"Search for Heavy Charged Higgs Bosons in Boosted Top and Bottom Quark Final States at a 1.4 TeV Future Lepton Collider","first":"Hashemi","nauth":1,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[822544]]. Closest of your papers: [[3094526]] (coupling 0.05, 6 shared references). Closest network paper: [[2183252]] (coupling 0.09, 8 shared references).","score":24.1,"rank":14,"section":"replacement","parts":[0.45,0.14,0.27,0.0,0.0],"abstract":"The discovery potential for heavy charged Higgs bosons $H^\\pm$ decaying into a top-bottom quark pair is investigated at a future $e^+e^-$ collider operating at $\\sqrt{s}=1.4~\\mathrm{TeV}$. The study considers charged Higgs masses between 200 and 600 GeV within all four Yukawa types of the two-Higgs-doublet model (2HDM). The boosted $tb$ final state is explored using complementary cut-based and machine-learning analyses based on boosted decision trees (BDT). The expected signal significance and sensitivity contours in the $(m_{H^\\pm},\\tanβ)$ plane are obtained for each Yukawa type. The resulting sensitivity extends to regions of the 2HDM parameter space beyond the projected reach of the High-Luminosity LHC (HL-LHC), demonstrating the complementary potential of a future high-energy lepton collider to probe heavy charged Higgs bosons.","authors":"Majid Hashemi","nlinked":51,"nref":54,"src":"INSPIRE","html":true},{"id":"3208833","arxiv":"2609.34324","title":"Relic Neutrinos Probing Small Scale Primordial Non-Gaussianity","first":"Gavhale","nauth":4,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[1803656]]. Closest of your papers: [[2663002]] (coupling 0.05, 6 shared references). Closest network paper: [[3081871]] (coupling 0.08, 7 shared references).","score":23.7,"rank":15,"section":"replacement","parts":[0.45,0.15,0.22,0.0,0.0],"abstract":"Relic neutrinos retain a record of electromagnetic entropy production after neutrino decoupling, probing primordial modes erased from the primary CMB. We derive the cubic photon number source from acoustic damping and its leading folded sensitive bispectrum window, with neutrino decoupling, thermalization, and acoustic coherence combined in a single response kernel. For excited initial states, this kernel filters the physical folded profile and yields a sharpness dependent transmission condition, directly connecting small scale primordial non-Gaussianity to relic neutrino capture rates.","authors":"Suraj Gavhale, Shin'ichi Nojiri, Sergei D. Odintsov, Oem Trivedi","nlinked":63,"nref":68,"src":"INSPIRE","html":true},{"id":"3229395","arxiv":"2611.18794","title":"Nonperturbative lattice simulation of the nucleation rate in thermal first-order phase transitions","first":"Zhou","nauth":2,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[2657746]]. Closest of your papers: [[2787890]] (coupling 0.02, 4 shared references). Closest network paper: [[2706040]] (coupling 0.14, 12 shared references).","score":23.3,"rank":16,"section":"replacement","parts":[0.45,0.05,0.39,0.0,0.0],"abstract":"We present a nonperturbative lattice study of vacuum decay through bubble nucleation in a three-dimensional real scalar field theory at finite temperature. The vacuum decay rate is computed by combining an expanded-ensemble multicanonical hybrid Monte Carlo approach, which samples the critical bubble configurations, with real-time Langevin dynamics, which follows the subsequent bubble evolution. We extrapolate the nucleation rate to the continuum limit and compare it with the corresponding one-loop perturbative prediction, finding a discrepancy of about 6.6%.","authors":"Jing Zhou, Ligong Bian","nlinked":83,"nref":91,"src":"INSPIRE","html":true},{"id":"3065817","arxiv":"2510.08514","title":"Effects of dark dipole radiation on eccentric supermassive black hole binary inspirals","first":"Chen","nauth":2,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[2677659]]. Closest of your papers: [[2787890]] (coupling 0.03, 6 shared references). Closest network paper: [[2904482]] (coupling 0.09, 10 shared references). Shared topics: gravitational wave.","score":22.7,"rank":17,"section":"replacement","parts":[0.45,0.07,0.26,0.0,0.1],"abstract":"The final-parsec problem has long posed a central challenge in understanding the merger of supermassive black hole binaries. In this paper, we investigate a scenario in which a dark scalar or vector field is sourced by eccentric binaries, leading to accelerated mergers through additional dipole radiation, and thereby extending the range of masses for which the binary can merge within a Hubble time. The Newtonian-order radiation fluxes from an eccentric charged Keplerian binary are derived using general results for localized periodic sources in flat spacetime. We find that dipole radiation, although insufficient to fully resolve the final-parsec problem, can alter the low-frequency spectrum of the stochastic gravitational wave background from supermassive black hole binary inspirals. We construct a simplified model for the spectrum and perform a Bayesian analysis using the current pulsar timing array data.","authors":"Mu-Chun Chen, Yan Cao","nlinked":95,"nref":102,"src":"INSPIRE","html":true},{"id":"3197882","arxiv":"2608.29259","title":"Fermion mass hierarchies in a three-generation Clifford model","first":"Zhou","nauth":2,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[3193100]]. Closest of your papers: [[2690106]] (coupling 0.01, 2 shared references). Closest network paper: [[2932612]] (coupling 0.07, 13 shared references). Shared topics: yukawa interaction.","score":21.9,"rank":18,"section":"replacement","parts":[0.45,0.03,0.21,0.0,0.2],"abstract":"We examine whether an algebraic model of three fermion generations based on the complex Clifford algebra $\\mathbb C\\ell(10)$, in which an $S_3$ family symmetry relates the generations, can reproduce the observed mass hierarchies of the charged leptons and down quarks. Taking the internal Gram matrix as the fermion kinetic metric, we show that the original Yukawa interaction, with complex coefficients, gives precisely those ordered mass triples $0\\leq m_1\\leq m_2\\leq m_3$ for which $m_3\\leq m_1+2m_2$. This restriction excludes the observed hierarchies in both sectors and persists when the right-acting Higgs operator is allowed to range over the full Clifford algebra. This obstruction motivates a second Yukawa contraction in which a projector, constructed from the difference between an internal charge operator and its family average, acts from the left. The resulting interaction preserves the gauge and family symmetries and uses the same three Higgs doublets. With both contractions present, there is a fixed coupling ratio at which the two successive mass ratios in a single sector become arbitrarily large along a real vacuum path. Separately, a rational interval calculation establishes that one real Higgs vacuum, with different coupling ratios in the two sectors, reproduces the chosen running masses of the charged leptons and down quarks. A softly broken three-doublet potential realises this vacuum as a global minimum at tree level. The additional neutral scalars have flavour-changing couplings, and their exchange at a common mass of $2000\\,\\mathrm{TeV}$ satisfies the neutral-meson mixing criterion and the $μ\\to3e$ contact-interaction test considered here.","authors":"Ye Zhou, Niels Gresnigt","nlinked":49,"nref":60,"src":"INSPIRE","html":true},{"id":"3233334","arxiv":"2611.30877","title":"Unbinned Likelihoods for Probability Densities with Poles","first":"Reboud","nauth":3,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Closest of your papers: [[2751074]] (coupling 0.02, 1 shared references). Closest network paper: [[2753529]] (coupling 0.07, 3 shared references).","score":20.4,"rank":19,"section":"cross","parts":[0.45,0.05,0.21,0.0,0.0],"abstract":"Unbinned likelihood fits to detector-level data become prohibitively expensive when narrow resonances interfere with a nonresonant amplitude. The convolution of the truth-level probability density with the detector resolution must then resolve the resonances, whose widths are much smaller than the resolution. We propose a simple approach that subtracts one simple-pole term per resonance from the probability density. This term captures the resonant contribution in closed form, and the smooth remainder is convolved numerically on a grid whose spacing is set by the resolution alone. The approach applies to multidimensional densities and to densities known only on the real axis. Using two benchmark problems, we quantify the accuracy, computational cost, and statistical impact of the approach. We emphasise that the subtraction is a general approach to the computational problems of unbinned likelihoods in the presence of poles in their probability density and that it is applicable to a wide variety of problems in experimental particle physics.","authors":"Méril Reboud, Danny van Dyk, Matteo Verzeletti","nlinked":30,"nref":42,"src":"INSPIRE","html":true},{"id":"3233341","arxiv":"2611.30764","title":"Fate of Vainshtein Screening for UV/IR Mixing with a $P(X)$ Higgs Classicalizer","first":"Berteaux","nauth":2,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Closest of your papers: [[3094526]] (coupling 0.03, 7 shared references). Closest network paper: [[2183252]] (coupling 0.05, 8 shared references).","score":20.3,"rank":20,"section":"new","parts":[0.45,0.08,0.14,0.0,0.0],"abstract":"Classicalization is a non-Wilsonian framework in which an effective field theory self-completes above its strong-coupling scale by generating semiclassical objects that decay into many soft quanta, thereby realizing ultraviolet-infrared mixing. A key requirement of this mechanism is that the force carrier be lighter than the strong-coupling scale. A natural application would be to embed classicalization in the electroweak Higgs sector to address the little hierarchy problem. In this work, we investigate whether Higgs classicalization can occur within the $P(X)$ class of gauged k-essence and k-chameleon models. For classicalization to occur, the theory must support Vainshtein screening around a sharply localized source. Our results show that it fails to do so, even when one attempts to engineer a symbiosis with chameleon screening through a gauge kinetic function, owing to a strong-coupling breakdown inside the screening region. These $P(X)$ theories therefore fail to provide a suitable framework for Higgs classicalization. Nevertheless, we emphasize that our results, obtained for a specific class of models, should not be interpreted as a no-go theorem for Higgs classicalization.","authors":"Eléana Berteaux, Florian Nortier","nlinked":116,"nref":116,"src":"INSPIRE","html":true},{"id":"3233360","arxiv":"2611.31130","title":"The Sensitivity of Gamma-Ray Searches for Dark Matter Annihilation in Milky Way Dwarf Galaxies: the LSST Era and Beyond","first":"Chavez","nauth":6,"year":2026,"cites":0,"role":"today","note":"Closest of your papers: [[1421624]] (coupling 0.10, 13 shared references). Closest network paper: [[2674992]] (coupling 0.18, 10 shared references). Shared topics: indirect detection, dark matter, dark matter particle.","score":18.9,"rank":21,"section":"cross","parts":[0.0,0.26,0.5,0.0,0.37],"abstract":"We forecast the sensitivity of gamma-ray searches to dark matter annihilation in Milky Way satellite dwarf galaxies using BabyBison, a Monte Carlo pipeline combining cosmological satellite simulations and observational selection functions with a joint likelihood analysis of gamma-ray data. Although LSST is expected to substantially expand the catalog of known satellite galaxies, we find that these discoveries are likely to produce only modest improvements in the resulting dark matter annihilation constraints, typically below 20\\%. Much more substantial gains are possible, however, in relatively rare realizations that contain yet-to-be-discovered satellites with large $J$-factors. These results reinforce the fact that indirect detection analyses using the population of dwarf galaxies are typically driven in large part by a small number of high-$J$-factor systems rather than by the total satellite count. We present projections for the sensitivity of Fermi-LAT and the proposed Advanced Particle-astrophysics Telescope (APT) to dark matter annihilation, finding that a complete census of the Milky Way dwarf sample could enable such instruments to probe dark matter with masses up to the TeV scale. We also investigate the dark matter discovery potential of these instruments and project their ability to measure the properties of an annihilating dark matter particle.","authors":"Ilumi Chavez, Aditya Ghosh, Chris Kelso, Dan Hooper, Alex Drlica-Wagner, Ethan O. Nadler","nlinked":60,"nref":83,"src":"INSPIRE","html":true},{"id":"3232418","arxiv":"2611.30321","title":"Dark matter mass fraction in axion stars","first":"Dmitriev","nauth":4,"year":2026,"cites":0,"role":"today","note":"Closest of your papers: [[1941263]] (coupling 0.06, 4 shared references). Closest network paper: [[3170380]] (coupling 0.24, 14 shared references). Shared topics: dark matter mass, dark matter.","score":18.8,"rank":22,"section":"cross","parts":[0.0,0.15,0.69,0.0,0.39],"abstract":"QCD axion dark matter is fragmented into small mass miniclusters of high density. With the natural parameters of miniclusters, the time for Bose-Einstein condensation is less than the age of the Universe, which leads to the formation of Bose stars inside these structures. Recently, the problem of the subsequent growth of Bose stars was solved analytically (Dmitriev et al, Phys. Rev. Lett. 132, 091001 (2024)). We use this solution to determine present day mass fraction of dark matter in Bose stars and their mass function.","authors":"A. S. Dmitriev, D. G. Levkov, A. G. Panin, I. I. Tkachev","nlinked":35,"nref":37,"src":"INSPIRE","html":true},{"id":"3232365","arxiv":"2611.29717","title":"Magic Production and the Fundamental Forces of Nature","first":"Chen","nauth":2,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Closest network paper: [[3091093]] (coupling 0.06, 3 shared references).","score":18.3,"rank":23,"section":"new","parts":[0.45,0.0,0.17,0.0,0.0],"abstract":"Quantum magic is a resource for universal quantum computation and may also provide a probe of fundamental interactions. We study its production in forward scattering of two distinct Standard Model fermions in the chirality basis. In the single-mediator-exchange approximation, magic production vanishes for gluon, photon, W-boson, Higgs-boson, and graviton exchange. For Z-boson exchange in purely leptonic scattering, it also vanishes at $\\sin^2θ_W = 1/4$, close to the phenomenological value. By contrast, Z-boson exchange involving elementary quarks generally produces nonzero magic. These patterns raise the question of whether the construction of the fundamental forces encodes, at least in some channels, a tendency to suppress magic production.","authors":"Jiunn-Wei Chen, Yu-Hao Li","nlinked":29,"nref":30,"src":"INSPIRE","html":true},{"id":"3192747","arxiv":"2608.18949","title":"Three-body forces in the quark model","first":"Baek","nauth":7,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[3193100]]. Also cites widely used network papers: [[2817040]]. Closest of your papers: [[3184726]] (coupling 0.00, 1 shared references). Closest network paper: [[3193100]] (coupling 0.02, 65 shared references).","score":17.9,"rank":24,"section":"replacement","parts":[0.48,0.01,0.06,0.0,0.0],"abstract":"We review the connection between constituent-quark Hamiltonians and QCD and investigate the long-standing difficulty of describing meson and baryon spectra with one common two-body interaction. A Hamiltonian calibrated to ground-state mesons leaves systematic baryon mass residuals, largest in the light-quark sector and decreasing toward heavier flavors. We show that a short-range, color-spin-dependent connected three-quark interaction substantially reduces this incompatibility. Mass-scaled finite-range profiles yield high-accuracy baryon spectra, whereas flavor-independent common-range profiles do not remove the residual flavor pattern. The result is tested on additional ground-state baryons outside the calibration set and through meson--baryon compatibility analyses across several alternative quark-model Hamiltonians. We also benchmark radial and orbital excitations to identify the regime in which a static compact valence Hamiltonian remains reliable, and provide explicit color-spin matrix elements for two- and three-body operators in baryons and multiquark configurations. Within the tested valence-space representations, the results indicate that a mass-dependent short-range connected three-quark interaction provides the missing contribution required for a consistent simultaneous description of meson and baryon ground-state spectra.","authors":"Jongheon Baek, Aaron Park, Emiko Hiyama, Sungsik Noh, Hyeongock Yun, Kyong Chol Han, Su Houng Lee","nlinked":351,"nref":395,"src":"INSPIRE","html":true},{"id":"2724864","arxiv":"2311.12158","title":"The Chiral Lagrangian of CP-Violating Axion-Like Particles","first":"Luzio","nauth":3,"year":2026,"cites":0,"role":"repl","note":"Also cites widely used network papers: [[1783234]]. Closest of your papers: [[1941263]] (coupling 0.08, 16 shared references). Closest network paper: [[2617409]] (coupling 0.17, 27 shared references).","score":17.0,"rank":25,"section":"replacement","parts":[0.06,0.25,0.5,0.0,0.0],"abstract":"We discuss the construction of the most general CP-violating chiral Lagrangian for an axion-like particle (ALP). Starting with an effective Lagrangian containing light quarks and gluons, we provide its matching onto a chiral effective Lagrangian at $\\mathcal{O}(p^2)$ described in terms of mesons and baryons, identifying the correspondence between the Jarlskog invariants of the two theories. After deriving the ALP interactions with mesons and baryons, we analyse a few relevant phenomenological implications such as the permanent electric dipole moments of nucleons and the CP-violating ALP and kaon decays.This work provides the necessary tools for further phenomenological analyses connecting low-energy observables with the couplings of the underlying ultraviolet complete theory.","authors":"Luca Di Luzio, Gabriele Levati, Paride Paradisi","nlinked":83,"nref":84,"src":"INSPIRE","html":true},{"id":"3177552","arxiv":"2607.04679","title":"Possibility of the antibottom-strange molecular pentaquarks near $ BΣ$ and $ B^*Σ$ thresholds","first":"Zhao","nauth":2,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[3193100]]. Closest network paper: [[2817040]] (coupling 0.03, 28 shared references).","score":17.0,"rank":26,"section":"replacement","parts":[0.45,0.0,0.08,0.0,0.0],"abstract":"The molecular states in coupled channel system of $B_s^0N- BΛ- B^*Λ- BΣ- B^*Σ$ are investigated within one-boson-exchange model that includes $S$-$D$ wave mixing and a tunable short-range $δ(r)$ term. Bound, resonant, and virtual states are searched by analytically continuing the $S$ matrix in the complex energy plane. In the single-channel analysis, the $ BΣ$ and $ B^*Σ$ systems with $J^P=1/2^-$ and $3/2^-$ are found to be attractive and form three bound states with reasonable cutoff region, corresponding to $1/2^-( BΣ)$, $1/2^-( B^*Σ)$, and $3/2^-( B^*Σ)$ . When coupled-channel dynamics is included, these states evolve into near-threshold poles that produce enhancements in the $B_s^0N$, $ BΛ$, and $ B^*Λ$ invariant mass spectra. The pole below the $ B^*Σ$ threshold in the $J^P=1/2^-$ system depends strongly on the treatment of the short-range $δ(r)$ term and becomes a virtual state when this contribution is removed, while the other two resonant poles and their line shapes are only moderately affected. The influences of $B^{(*)}Σ^*$ channels on these states are also investigated. For representative parameter region, the predicted masses of these states lie in the $6.44-6.70$ GeV region and have widths of a few to several MeV. The pole coupling and partial-width analyses indicate that the invariant mass spectrum of the $B_s^0N$ and $ B^{(*)}Λ$ channels are the best place to hunt the predicted states. These results support the existence of near-threshold molecular pentaquark $P_{ \\bar b s}$ and provide useful guidance in future experimental searches.","authors":"Jian-Kang Zhao, Nijiati Yalikun","nlinked":78,"nref":83,"src":"INSPIRE","html":true},{"id":"3232226","arxiv":"2611.28492","title":"Timelike electric dipole form factors of the baryon octet: short-distance kernels and baryonic rescattering","first":"Geng","nauth":3,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Closest network paper: [[3178456]] (coupling 0.02, 1 shared references).","score":16.5,"rank":27,"section":"new","parts":[0.45,0.0,0.05,0.0,0.0],"abstract":"We calculate the leading-twist contribution of quark electric dipole moments (EDMs) to the timelike form factors of the baryon octet at the $J/ψ$ mass using lattice light-cone distribution amplitudes. For a strange-quark EDM $d_s$, the short-distance $Σ/Λ$ ratio is $-0.080^{+0.037}_{-0.098}$ over the lattice input ranges. This range lies above the nonrelativistic quark-model value $-1/3$. In the meson-exchange model, kaon exchange feeds the large $Ξ$ source into the $Σ$ channel and makes the $Σ$ and $Λ$ form factors comparable in magnitude. The short-distance $Λ$ form factor is about $5\\times10^{-4}d_s$. The BESIII measurement then gives $|d_s|<1.3\\times10^{-15}\\,e\\,\\mathrm{cm}$ at 95% confidence level. With rescattering at a $1\\,\\mathrm{GeV}$ cutoff, joint fits to projected $Λ$, $Σ^+$ and $Ξ$ sensitivities lower the $Λ$-only upper limits by more than 25% at BESIII and the Super Tau-Charm Facility. Renormalization-scale variation changes the projected limits by about a factor of two.","authors":"Chao-Qiang Geng, Xiang-Nan Jin, Chia-Wei Liu","nlinked":60,"nref":61,"src":"INSPIRE","html":true},{"id":"3232291","arxiv":"2611.28691","title":"Study of the $N^*(1535)$ and $N^*(1650)$ resonances from $πN$ $S_{11}$ scattering data and lattice QCD spectra","first":"Li","nauth":4,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Closest network paper: [[3227657]] (coupling 0.02, 1 shared references).","score":16.5,"rank":28,"section":"new","parts":[0.45,0.0,0.04,0.0,0.0],"abstract":"We investigate two of the lowest-lying odd-parity nucleon resonances, $N^*(1535)$ and $N^*(1650)$, within a nonperturbative Hamiltonian framework (NPHF). The coupled-channel model contains two three-quark bare states with total quark spins $1/2$ and $3/2$, together with four meson-baryon channels: $πN$, $ηN$, $KΛ$, and $KΣ$. Constraints from SU(3) flavor symmetry and the bare-state spin wave functions are imposed on the bare-state-channel vertices and the channel-channel Weinberg-Tomozawa interactions. This substantially reduces the number of free parameters. We combine fits to infinite-volume $πN$ $S_{11}$ scattering data with finite-volume lattice QCD spectra. We use Hamiltonian eigenvectors to analyze the model-basis compositions. A contamination function then compares the resulting operator-mixing pattern with lattice correlation-matrix eigenvectors. Within the scenarios considered, both bare states and coupled-channel interactions play important roles in describing the two resonances. From our combined infinite and finite volume analysis, in contrast to conventional quark-model expectations, the spin-$1/2$ bare state is heavier than the spin-$3/2$ bare state. The contamination analysis is consistent with the associated operator assignment and with a recent analysis of the relativistic wavefunctions associated with these states. The symmetry-constrained NPHF provides a unified description of the two $S_{11}$ resonances. The combined analysis also constrains their model interpretation.","authors":"Zhi-Xuan Li, Derek B. Leinweber, Anthony W. Thomas, Jia-Jun Wu","nlinked":51,"nref":52,"src":"INSPIRE","html":false},{"id":"3232885","arxiv":"2511.22949","title":"Solving the Domain Wall Problem: Primordial Magnetic Fields as a Dynamical Solution","first":"Zhao","nauth":4,"year":2026,"cites":0,"role":"repl","note":"Also cites widely used network papers: [[1783234]]. Closest of your papers: [[1941263]] (coupling 0.06, 11 shared references). Closest network paper: [[2065390]] (coupling 0.07, 7 shared references). Shared topics: dark matter abundance, dark matter, gravitational wave.","score":14.8,"rank":29,"section":"replacement","parts":[0.06,0.18,0.21,0.0,0.41],"abstract":"To prevent overclosing the Universe, stable domain walls must decay-a problem typically addressed by breaking the Peccei-Quinn symmetry with a bias term. In this Letter, we present a novel mechanism in which a helical primordial magnetic field provides a spatially inhomogeneous Chern-Simons source that drives the axion field. We validate this mechanism through three-dimensional lattice simulations of the evolving domain-wall network, demonstrating its efficacy in inducing decay. Our quantitative analysis reveals that the correlation length of the primordial magnetic field is a crucial determinant of the decay rate of the network and the properties of the emitted axions and gravitational waves. In particular, the axion emitted from the decaying domain-wall network can contribute to the dark matter abundance, and the associated gravitational-wave signal lies in the frequency range probed by pulsar timing array experiments.","authors":"Zizhuo Zhao, Yuefeng Di, Ligong Bian, Jing Shu","nlinked":88,"nref":92,"src":"INSPIRE","html":true},{"id":"3232234","arxiv":"2611.29197","title":"Quantifying the Impact of Galactic Dark Matter Halo Models on LZ Results","first":"Shao","nauth":5,"year":2026,"cites":0,"role":"today","note":"Closest of your papers: [[2794409]] (coupling 0.08, 9 shared references). Closest network paper: [[3207263]] (coupling 0.16, 16 shared references). Shared topics: dark matter.","score":14.6,"rank":30,"section":"new","parts":[0.0,0.22,0.45,0.0,0.13],"abstract":"Most dark matter direct-detection limits are reported under the assumption of an isotropic, Maxwellian Standard Halo Model. However, the Milky Way's stellar halo exhibits substantial radial anisotropy, while cosmological simulations predict scale-dependent anisotropy in the dark matter velocity distribution. We investigate how departures from isotropy affect the interpretation of LZ results in two complementary regimes: background-dominated elastic-scattering searches and the recently reported 248 keV nuclear-recoil candidate, which we study using a background-free single-event approximation. For elastic scattering, we use the self-consistent isotropic, Osipkov-Merritt, axisymmetric, and triaxial halo models of Belli et al. and translate the published limits through the ratio of predicted event counts, applying a common escape-speed truncation in the Galactic frame. At WIMP masses above approximately 40 GeV, the resulting limits lie within about $\\pm 30\\%$ of the isotropic reference. Below approximately 15 GeV, the model envelope broadens to as much as an order of magnitude, reflecting sensitivity to the high-velocity tail. For the 248 keV event, the accessible inelastic mass splitting is likewise controlled by this tail. Some anisotropic models extend the allowed kinematic region towards splittings at which solar-neutrino constraints on a Higgsino interpretation become ineffective, although kinematic accessibility alone does not establish viability at the fixed Higgsino cross section. These results show that halo-model dependence is modest at high WIMP masses but becomes essential near kinematic thresholds.","authors":"Jialiang Shao, Andrea Addazi, Xinran Wang, Guanwen Fang, Yi-Fu Cai","nlinked":58,"nref":76,"src":"INSPIRE","html":true},{"id":"3174545","arxiv":"2606.28717","title":"Chirality Observables in Vector-Like Lepton Doublet Pair Production with Polarized Beams at a 3 TeV Lepton Collider","first":"Sagheer","nauth":3,"year":2026,"cites":0,"role":"repl","note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1455793]] (coupling 0.08, 5 shared references). Closest network paper: [[2710594]] (coupling 0.11, 6 shared references).","score":13.4,"rank":31,"section":"replacement","parts":[0.06,0.22,0.31,0.0,0.0],"abstract":"We study how pair production of a mass-degenerate weak-isodoublet vector-like lepton (VLL) depends on longitudinal beam polarization at the 3~TeV Compact Linear Collider (CLIC), for VLL masses of 1.1--1.4~TeV and mixing in the tau sector. The charged pair $e^+e^-\\toτ'\\barτ'$ proceeds through photon and $Z$ exchange, the neutral pair $e^+e^-\\toν'\\barν'$ through $Z$ exchange alone. For the baseline electron polarization $P_{e^-}=-0.8$, the tree-level rates at $\\mvll=1.2$~TeV are 15.77~fb (charged) and 4.75~fb (neutral). For an optional positron polarization $P_{e^+}=+0.3$, the left--right configuration $(-0.8,+0.3)$ raises the two rates by factors of 1.95 and 1.38 relative to unpolarized beams. The charged--neutral rate contrast reaches $D_σ=0.546$ there, compared with $0.08$ for the opposite configuration, and the observed left--right asymmetries are 0.57 (charged) and 0.12 (neutral). These normalized quantities are independent of the VLL mass at Born level because both channels share the same phase-space factor. Unpolarized rates at a 3~TeV muon collider coincide with the unpolarized CLIC rates to within 0.2\\%, as expected from lepton universality. A counting estimate gives a Gaussian separation of the two asymmetries of $Z_A\\simeq9$ for a visible fraction of $10^{-1}$ and $Z_A\\simeq2.7$--$2.9$ for $10^{-2}$ at $1~{\\rm ab}^{-1}$. All results are tree-level, fixed-energy, production-level quantities; initial-state radiation, beamstrahlung, detector effects and backgrounds are not included, and no exclusion or discovery reach is claimed.","authors":"Haroon Sagheer, Ijaz Ahmed, Jamil Muhammad","nlinked":27,"nref":28,"src":"INSPIRE","html":true},{"id":"3232396","arxiv":"2611.30098","title":"Plasma-enabled magnet-free LSW search for eV-scale axions with laser-stimulated regeneration","first":"An","nauth":10,"year":2026,"cites":0,"role":"today","note":"Closest of your papers: [[1941263]] (coupling 0.08, 11 shared references). Closest network paper: [[1625119]] (coupling 0.13, 11 shared references).","score":12.8,"rank":32,"section":"new","parts":[0.0,0.23,0.38,0.0,0.0],"abstract":"In conventional light-shining-through-a-wall (LSW) experiments, strong magnetic fields mediate the conversion of photons into axions and their subsequent reconversion into photons. At eV-scale axion masses, however, photon--axion phase mismatch causes these conversions to lose coherence, substantially reducing the experimental sensitivity. We propose a magnet-free LSW scheme that addresses this limitation via plasma-based axion generation and laser-stimulated regeneration. At low laser intensity, a two-color dispersion-matched source generates axions in a narrow mass range set by the plasma dispersion. At relativistic laser intensity, a single-pulse plasma-broadened source generates axions over a broad mass range, as shown by particle-in-cell simulations. The Fourier spectrum of the source term $\\mathbf{E}\\cdot\\mathbf{B}$ broadens around the laser branch, consistent with mixing between the laser and low-frequency plasma waves. For axion detection behind the wall, a counter-propagating laser stimulates axion decay into a detectable signal photon and a second photon emitted into the laser mode, with the laser frequency chosen to satisfy phase matching. For representative parameters, the requirement of at least one regenerated photon yields projected upper limits on the axion-photon coupling on the order $10^{-7}\\,\\mathrm{GeV}^{-1}$ over $m_a=0.1$--$1\\,\\mathrm{eV}$.","authors":"Xiangyan An, Min Chen, Yipeng Wu, Boyuan Li, Wenchao Yan, Peng Yuan, Binbin Yan, Feng Liu, Zhengming Sheng, Jie Zhang","nlinked":45,"nref":47,"src":"INSPIRE","html":true},{"id":"3195704","arxiv":"2608.24791","title":"Probing Dirac Dark Matter in Composite Higgs Models with Xenon and Argon targets","first":"Belyakova","nauth":2,"year":2026,"cites":0,"role":"repl","note":"Closest of your papers: [[1589847]] (coupling 0.01, 2 shared references). Closest network paper: [[3178478]] (coupling 0.06, 8 shared references). Shared topics: observed dm relic, dm relic, relic abundance, direct detection, dark matter.","score":12.4,"rank":33,"section":"replacement","parts":[0.0,0.04,0.16,0.0,0.88],"abstract":"Recent advancements in direct detection (DD) experiments stimulate the investigation of the interactions of dark matter (DM) with nucleons and nuclei. In the framework of Composite Higgs Models (CHMs) the lightest Dirac composite particle (LDCP) can be stable composing a significant fraction ξof the observed DM relic abundance. We consider the elastic scattering of the LDCP on nucleons as well as on xenon (Xe) and argon (Ar) nuclei within the CHMs in which the LDCP magnetic moment, its mass and its coupling to the Higgs doublet are suppressed by an approximate U(1) symmetry. The LDCP with non-zero magnetic dipole moment can result in a substantial enhancement of the differential event rate in the DD experiments at low recoil energies of nuclei. Assuming ξ\\ge 0.1, we identify the region of the parameter space where such enhancement may be potentially observable. In addition we specify some observables that can be useful in discriminating between the DM fermions with non-zero magnetic moment and other types of dark matter particles which don't have similar electromagnetic properties.","authors":"M. G. Belyakova, R. Nevzorov","nlinked":139,"nref":143,"src":"INSPIRE","html":true},{"id":"3232175","arxiv":"2611.28054","title":"Early Evolution of Strange Quark Stars Admixed with Fermionic Dark Matter","first":"Sahoo","nauth":2,"year":2026,"cites":0,"role":"today","note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2794409]] (coupling 0.02, 5 shared references). Closest network paper: [[3159193]] (coupling 0.05, 9 shared references). Shared topics: fermionic dark matter, dm mass, dark matter.","score":11.6,"rank":34,"section":"cross","parts":[0.06,0.05,0.14,0.0,0.6],"abstract":"We study strange quark stars admixed with fermionic dark matter (DM) in three quasistatic stages of their early evolution: the neutrino-trapped stage, the heated stage after deleptonization, and the cold stage. Quark matter is described by the MIT bag model at finite temperature with thermal gluons, a repulsive vector interaction, and, in the first stage, trapped neutrinos. The DM is modeled as a cold, asymmetric gas of fermions with masses $m_χ= 0.3$, $1$, and $3$ GeV, with and without a repulsive self-interaction, and interacts with the quark matter only through gravity. Using the two-fluid Tolman-Oppenheimer-Volkoff equations, we compute the structure, the maximum masses, and the tidal deformability of the stars in each stage for DM mass fractions $F_D$ up to $5\\%$, and we follow individual stars at fixed numbers of baryons and DM particles. The effect of DM is nearly the same in the three stages: for $m_χ= 1$ GeV and $F_D = 5\\%$, DM lowers the maximum mass by about $8\\%$ and the tidal deformability of a $1.4\\,M_\\odot$ star by about $26\\%$ in each stage, whereas the stage itself changes these quantities by only a few percent. Heavy DM forms a compact core; for $m_χ= 3$ GeV without self-interaction, the mass limit of this core can set the maximum mass of the star. Light DM can form an extended halo, which does not increase the maximum mass for the fractions considered. For $m_χ= 1$ GeV and $F_D = 5\\%$, DM lowers the largest baryon mass of a newborn star by about $0.23\\,M_\\odot$, but this limit increases from the neutrino-trapped to the cold stage in all cases considered, so that DM does not cause a delayed collapse to a black hole. In our model, pulsars of about $2\\,M_\\odot$ require a stiff quark equation of state and restrict the DM fraction to a few percent unless the DM is light.","authors":"Rajasmita Sahoo, Mrutunjaya Bhuyan","nlinked":86,"nref":90,"src":"INSPIRE","html":true},{"id":"3142500","arxiv":"2604.07481","title":"Axionlike Particles and Lepton Flavor Violation in Muonic Atoms","first":"Kumar","nauth":2,"year":2026,"cites":0,"role":"repl","note":"Closest of your papers: [[2690106]] (coupling 0.03, 5 shared references). Closest network paper: [[3178456]] (coupling 0.08, 9 shared references). Shared topics: lepton flavor violation, dark sector.","score":10.6,"rank":35,"section":"replacement","parts":[0.0,0.11,0.23,0.0,0.4],"abstract":"We explore the potential of the Mu2e experiment to probe the lepton-flavor-violating process $μ^- e^- \\to e^- e^-$ in a muonic atom within a simplified axion-like particle (ALP) framework featuring flavor-violating $e$-$μ$ couplings and a flavor-diagonal pseudoscalar coupling to electrons, which also allows for possible invisible ALP decays into a dark sector. We compute the ALP-mediated contribution to the transition rate and show that, at fixed couplings, the branching ratio increases for lighter mediators and scales as $(Z-1)^3$, favoring heavier nuclei. We compare the model against constraints from $μ\\to eγ$, $μ\\to 3e$, $μ\\to eγγ$, $μ\\to e+\\mathrm{inv}$, and muonium-antimuonium conversion, as well as from the anomalous magnetic moments of the electron and muon. Additional astrophysical and beam-dump limits on the electron coupling are also discussed. A key result is that $Δa_e$ provides one of the most stringent probes of the parameter space and, in the global scan, excludes the largest fraction of sampled points. After applying the laboratory constraints used in the scan, the viable branching ratio for $μ^- e^- \\to e^- e^-$ in aluminum drops to at most $\\mathcal{O}(10^{-20})$, while the resonant region $2m_e<m_a<m_μ-m_e$ is much more heavily suppressed. The highest achievable values are closely tied to $\\mathcal{B}(μ\\to 3e)$ near its current limit, indicating that the upcoming Mu3e experiment will explore the most promising region relevant for this muonic-atom signal. Our analysis shows that, although a light ALP can parametrically enhance $μ^- e^- \\to e^- e^-$ at fixed couplings, existing bounds -- especially $Δa_e$, $μ\\to 3e$, $μ\\to eγ$, and muonium oscillations -- severely limit the observable rate.","authors":"Girish Kumar, Alexey A. Petrov","nlinked":87,"nref":95,"src":"INSPIRE","html":true},{"id":"3232233","arxiv":"2611.28630","title":"Strong First-Order Phase Transition in a Pseudo-Nambu-Goldstone Boson Model","first":"Nakai","nauth":3,"year":2026,"cites":0,"role":"today","note":"Closest of your papers: [[2787890]] (coupling 0.04, 5 shared references). Closest network paper: [[2924315]] (coupling 0.13, 21 shared references). Shared topics: early universe.","score":10.2,"rank":36,"section":"new","parts":[0.0,0.11,0.37,0.0,0.14],"abstract":"We propose a novel, calculable model for realizing strong first-order phase transitions in the early Universe, in which the phase transition occurs along a pseudo-Nambu-Goldstone boson (pNGB) direction. The model involves two scalar fields whose interactions exhibit collective symmetry breaking, protecting the pNGB potential from quadratically divergent radiative corrections induced by these interactions. This structure allows strong first-order phase transitions to be realized without severe parameter tuning while maintaining perturbative control. We investigate the finite-temperature effective potential and bubble nucleation dynamics, identifying parameter regions where strong first-order phase transitions can successfully complete. The strength and characteristic time scale of the transitions are evaluated, and the resulting gravitational-wave (GW) spectra are computed. The predicted GW signals can fall within the sensitivity ranges of planned GW experiments.","authors":"Yuichiro Nakai, Masanori Tanaka, Yaoduo Wang","nlinked":61,"nref":66,"src":"INSPIRE","html":true},{"id":"3146383","arxiv":"2604.15541","title":"Probing inelastic sub-GeV dark matter at the DUNE near detector","first":"Betancur","nauth":3,"year":2026,"cites":1,"role":"seed","note":"","score":null},{"id":"2658189","arxiv":"2305.05207","title":"Symmetries for the 4HDM: extensions of cyclic groups","first":"Shao","nauth":2,"year":2023,"cites":11,"role":"other","note":"","score":null},{"id":"2963992","arxiv":"2508.18713","title":"<math display=\"inline\"><msub><mi>Z<\/mi><mn>4<\/mn><\/msub><\/math> scotogenic model with a Higgs portal","first":"Jobu","nauth":2,"year":2025,"cites":3,"role":"other","note":"","score":null},{"id":"3167584","arxiv":"2606.12408","title":"When direct detection constrains reheating temperature: Freeze-in with stronger couplings and inflaton-seeded freeze-in","first":"Bertou","nauth":5,"year":2026,"cites":5,"role":"other","note":"","score":null},{"id":"3152380","arxiv":"2605.04824",
