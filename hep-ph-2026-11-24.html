parameters studied, the density normalization grows approximately in proportion to $N^2-1$, while non-minimal-charge components remain subdominant."},{"arxiv":"2610.37318","id":"3219528","title":"Precision measurement of coherent elastic neutrino-nucleus scattering at a nuclear reactor by CONUS+","authors":"N. Ackermann, H. Bonet, C. Buck, J. Hakenmüller, G. Heusser, M. Lindner, W. Maneschg, M. Meier, S. Mertens, D. Piani, M. Rank, T. Rink, E. Sánchez García, Y. Shi, L. Schönfeld, I. Stalder, H. Strecker, J. Wendel, J. Woenckhaus","score":8.9,"section":"replacement","rank":38,"parts":[0.06,0.09,0.27,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[3130296]] (coupling 0.03, 3 shared references). Closest network paper: [[3095306]] (coupling 0.09, 6 shared references).","abstract":"We report the most precise measurement to date of coherent elastic neutrino-nucleus scattering (CE$ν$NS) from reactor antineutrinos, using the CONUS+ germanium detectors at the Leibstadt nuclear power plant. With an exposure of 1296 kg$\\cdot$days reactor-on, a blind likelihood analysis yields a signal with high statistical significance, corresponding to $1565 \\pm 155$ CE$ν$NS events, in agreement with the Standard Model expectation of $1701 \\pm 198$ events within 0.5 $σ$. The flux-averaged cross section is $(0.57 \\pm 0.09)\\times10^{-40}$ cm$^{2}$, and the weak mixing angle at a momentum transfer of about 10 MeV is $\\sin^2θ_W = 0.226 \\pm 0.022$."},{"arxiv":"2611.30434","id":"3232445","title":"Effect of dark matter and scalar-cut potential on the macroscopic properties of neutron stars: A chiral quark mean field approach","authors":"Hrishika P, Arvind Kumar","score":8.0,"section":"new","rank":39,"parts":[0.0,0.04,0.15,0.0,0.45],"note":"Closest of your papers: [[3146383]] (coupling 0.01, 4 shared references). Closest network paper: [[2843822]] (coupling 0.05, 6 shared references). Shared topics: fermionic dark matter, dark matter.","abstract":"We investigate the effects of fermionic dark matter (DM) and scalar-cut potential ($U_{\\text{cut}}(φ)$) on the equation of state (EOS) and macroscopic properties of neutron stars. The baryonic matter consists of neutrons, protons, electrons, and muons under the $β$-equilibrium and is described within the chiral SU(3) quark mean-field (CQMF) model. In this framework, quarks are confined within baryons, whose properties are modified through the exchange of scalar fields $σ$, $ζ$, and $δ$, and vector fields $ω$ and $ρ$. The DM is modelled as a self-interacting fermionic fluid with scalar $\\varphi_D$ and vector $V_D^μ$ mediators. The baryonic and DM fluids interact only through gravity and are treated within a two-fluid Tolman-Oppenheimer-Volkoff formalism. We examine the resulting mass-radius relation and tidal deformability, along with the gravitational redshift, to investigate the effects of DM on neutron star structure and observable properties. The inclusion of $U_{\\text{cut}}(φ)$ stiffens the EOS, whereas increasing the DM fraction generally softens the EOS and modifies the mass-radius relation, tidal deformability, and gravitational redshift. The magnitude and nature of these modifications depend on the DM particle mass and mediator interactions, which determine whether the resulting configurations exhibit compact DM cores or extended DM halos."},{"arxiv":"2611.30638","id":"3233321","title":"Towards a Global CE$ν$NS Picture","authors":"Heerak Banerjee, Philipp Eller","score":7.6,"section":"new","rank":40,"parts":[0.06,0.06,0.25,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1955022]] (coupling 0.02, 3 shared references). Closest network paper: [[3092207]] (coupling 0.09, 17 shared references).","abstract":"We present a general framework for extracting and interpreting the Coherent Elastic Neutrino-Nucleus Scattering (CE$ν$NS) differential cross-section from experimental data. A generalized parametric basis, constructed from common kinematic terms recurring in generalized neutrino interaction models, is employed to numerically constrain the shape and normalization of the observed CE$ν$NS response. The framework was applied to the COHERENT CsI and liquid argon datasets using Bayesian inference, yielding normalization constraints comparable to those reported by the Collaboration while providing additional constraints on the correlated spectral shape. A combined analysis was also performed, exploiting the complementary sensitivities of the two datasets to constrain features of the differential cross-section that are less accessible to either dataset individually. The framework has been implemented in the open-source Julia package Newtrinos.jl, which supports modular forward modeling, parallel computation, and automatic differentiation."},{"arxiv":"2606.16754","id":"3168717","title":"Modern Determination of Pion and Kaon Fragmentation Functions from SIA and High-Precision COMPASS SIDIS Multiplicities","authors":" HAPS Collaboration, Maryam Soleymaninia, Hamzeh Khanpour, Hubert Spiesberger, Majid Azizi, Michael Klasen, Hadi Hashamipour","score":7.5,"section":"replacement","rank":41,"parts":[0.0,0.03,0.11,0.5,0.0],"note":"Co-authors of yours: Klasen. Closest of your papers: [[3094526]] (coupling 0.01, 1 shared references). Closest network paper: [[2817040]] (coupling 0.04, 36 shared references).","abstract":"We present two separate determinations of charged-pion and charged-kaon fragmentation functions (FFs), denoted HAPS-PiFF1.0 and HAPS-KaFF1.0, at next-to-leading order (NLO) and within a next-to-next-to-leading-order (NNLO) perturbative QCD setup. The analysis combines single-inclusive electron-positron annihilation (SIA) data with charge-separated semi-inclusive deep-inelastic-scattering (SIDIS) multiplicities from HERMES and COMPASS. A central goal of this work is to incorporate the modern COMPASS SIDIS input, namely the COMPASS 2025 proton-target multiplicities and the COMPASS 2026 revised isoscalar-target multiplicities, into a common charged-pion and charged-kaon FF analysis and to assess their role in the resulting flavor separation. The revised isoscalar data supersede the earlier COMPASS measurements used in previous global fits. The charge-separated pion multiplicities provide important constraints on favored and unfavored light-quark fragmentation, while the kaon measurements enhance the sensitivity to light-quark, unfavored, and strange-to-kaon fragmentation channels. In both analyses, the gluon FF remains indirectly constrained in the present SIA+SIDIS framework and should be interpreted with appropriate caution. The extractions are carried out using the publicly available MontBlanc framework, and the resulting HAPS-PiFF1.0 and HAPS-KaFF1.0 replica sets are provided in the standard LHAPDF format."},{"arxiv":"2611.29939","id":"3232371","title":"Ionization of gravitational atoms by a companion-sourced Yukawa potential","authors":"Yi Wang, Jiayi Yao","score":7.3,"section":"cross","rank":42,"parts":[0.0,0.0,0.3,0.0,0.27],"note":"Closest network paper: [[2791814]] (coupling 0.11, 4 shared references). Shared topics: yukawa interaction, gravitational wave.","abstract":"Superradiant instabilities around rotating black holes can produce clouds of ultralight bosons bound by the black hole's gravitational field. A binary companion can ionize these clouds by driving transitions into continuum states in the black hole's 1/r gravitational potential, extracting energy and angular momentum from the orbit. We investigate how a companion-sourced Yukawa interaction modifies this process. At weak coupling, the interference term between the gravitational and Yukawa transition amplitudes provides the leading correction to the ionization power. For the orbital frequencies here, an attractive interaction enhances continuum ionization and accelerates the inspiral, whereas a repulsive interaction has the opposite effect. At larger coupling, the pure Yukawa contribution to the ionization power becomes increasingly important and can compete with the gravitational contribution, particularly for lighter mediators. Comparing continuum ionization with off-resonant bound-state mixing, we find that continuum ionization can halt superradiant growth at a substantially smaller Yukawa coupling. At their respective critical couplings, the Yukawa interaction provides the dominant contribution to cloud depletion in both channels. Finally, we calculate the phase correction to gravitational waves due to continuum ionization and characterize how the chirp-rate response varies with frequency near the thresholds at which successive orbital harmonics open continuum-ionization channels."},{"arxiv":"2610.27346","id":"3216856","title":"Pretraining on boosted boson decays for polarization tagging of hadronic $W$ bosons","authors":"Saptaparna Bhattacharya","score":6.3,"section":"replacement","rank":43,"parts":[0.0,0.1,0.22,0.0,0.0],"note":"Closest of your papers: [[1455793]] (coupling 0.04, 4 shared references). Closest network paper: [[2621240]] (coupling 0.08, 7 shared references).","abstract":"Longitudinally polarized weak bosons probe the unitarization of vector-boson scattering. At large boosts, longitudinal and transverse $W$ bosons produce jets with the same mass and two-prong structure, distinguished only by the decay angle. Longitudinal bosons are rare in $W$+jet events at these large boosts. We ask where the polarization information of a boosted $W$ boson lies and how much a tagger can recover. Requiring both decay quarks within the jet truncates the decay-angle distribution at an edge set by $m/(p_T R)$, which, as we show, bounds any hadronic polarization tagger. Within this acceptance, the decay angle carries nearly all the polarization information of a jet in $W$+jet events. Whether pretraining retains the decay angle is not obvious, so we pretrain a point-edge transformer on $10^7$ unpolarized boosted-boson, top-quark and QCD jets and fine-tune it with $10^3$ to $5\\times10^4$ labeled jets per class. With the fewest labels, a boosted decision tree on substructure observables performs best; with the most labels, the strongest networks come within 0.003 in AUC of the ideal decay-angle tagger. Pretraining saves a factor of about two to three in labels, and our boson pretraining improves on a generic one by a few thousandths in AUC, more with frozen transformer blocks. Student networks with a few hundred times fewer parameters, distilled with unlabeled jets, match their teacher. More information lies outside the jet. The production angle, reconstructed with the recoiling jet, improves every tagger. In diboson production and vector-boson scattering at matrix-element level, the production kinematics carry more information than the decay angles of both bosons. Trading the generality of a jet tagger for an event-level tagger trained on the process thus brings large gains, which measurements of longitudinal vector-boson scattering could exploit."},{"arxiv":"2005.13341","id":"1798033","title":"Precise predictions for double-Higgs production via vector-boson fusion","authors":"Frédéric A. Dreyer, Alexander Karlberg, Jean-Nicolas Lang, Mathieu Pellen","score":6.0,"section":"replacement","rank":44,"parts":[0.0,0.06,0.29,0.0,0.0],"note":"Closest of your papers: [[1455793]] (coupling 0.02, 2 shared references). Closest network paper: [[1857582]] (coupling 0.10, 8 shared references).","abstract":"Theoretical predictions with next-to-next-to-leading order (NNLO) QCD accuracy combined with the next-to-leading order (NLO) electroweak (EW) corrections are presented for differential observables of the double-Higgs production process via vector-boson fusion. While the QCD corrections were previously known, the EW ones are computed here for the first time. The numerical results are obtained for a realistic experimental set-up at the LHC and are presented in the form of fiducial cross sections and differential distributions. Within this setup we find that the VBF approximation employed in the NNLO QCD correction is accurate at the sub-percent level. We find that the NLO EW corrections within the fiducial volume are $-4.8\\%$, making them of almost the same order as the NLO QCD corrections. In some kinematic regions they can grow as large as $-30\\%$ making them the dominant radiative corrections. When the EW corrections are combined with the NNLO QCD corrections we find a total correction of $-14.8\\%$. The results presented here thus comprise the state-of-the-art theoretical predicition for the double-Higgs production via vector-boson fusion, which will be of value to the high-luminosity programme at the LHC."},{"arxiv":"2604.09732","id":"3144005","title":"Toward Neutrino and Dark Matter Detection with Ancient Minerals: TEM Study of Heavy-Ion Tracks in Olivine","authors":"Andrew Calabrese-Day, Emilie LaVoie-Ingram, Kathryn Ream, Hannah Ross, Joshua Spitz, Patrick Stengel, Kai Sun, Alexander Takla","score":5.8,"section":"replacement","rank":45,"parts":[0.0,0.0,0.01,0.0,0.56],"note":"Closest network paper: [[2795517]] (coupling 0.00, 1 shared references). Shared topics: interacting massive particle, weakly interacting massive particle, nuclear recoil, dark matter.","abstract":"Solar, supernova, and atmospheric neutrinos, and possibly weakly interacting massive particle (WIMP) dark matter, have been interacting in the Earth beneath our feet for billions of years. The ''paleo-detector'' technique seeks to detect and characterize the induced crystalline defects from these events, in particular from energetic nuclear recoils, which in some minerals can be preserved on these timescales. Such defects can manifest as nuclear recoil tracks, on the order of a few nanometers wide and extending up to hundreds of microns in length, which can be detected with nanoscale-resolution microscopy. In order to test the feasibility of the paleo-detector technique and to study the formation and morphology of track defects in promising mineral candidates like olivine, we use ion irradiation to artificially implant tracks to effectively mimic astrophysical particle interactions. We present a study of heavy-ion track width as a function of depth, which we relate to ion energy, in an olivine crystal irradiated with 15 MeV Au$^{+5}$ using scanning transmission electron microscopy (STEM). Unlike previous studies, which measure tracks at the surface of the irradiated sample, we instead take measurements at various target depths via focused ion-beam sectioning of the irradiated sample. No etching techniques are used to enhance the tracks. In addition, we provide a comparison to predictions from simulations using SRIM software and previous results with a variety of ion species and energies. Notably, we find that a significant change in track continuity across the energy range studied (0.4-12.9 MeV) is indicative of the transition between electronic and nuclear stopping power dominance, consistent with the simulations' predictions. Overall, the tracks produced in olivine indicate that this mineral is an attractive candidate for paleo-detection, with robust track creation at the MeV scale."},{"arxiv":"2611.28742","id":"3232274","title":"Evolution and Prospects of Higgs Boson Searches Beyond the Standard Model","authors":"Andre Sopczak","score":5.6,"section":"new","rank":46,"parts":[0.0,0.07,0.23,0.0,0.0],"note":"Closest of your papers: [[3094526]] (coupling 0.02, 4 shared references). Closest network paper: [[2686887]] (coupling 0.08, 10 shared references).","abstract":"The search for Higgs bosons Beyond the Standard Model (BSM) began intensively at the Large Electron-Positron (LEP) collider (1989-2000), continued at the Tevatron (2001-2011), and entered a new era with the start of the Large Hadron Collider (LHC) in 2010. While the discovery of a Higgs boson in 2012 established the Standard Model mechanism of electroweak symmetry breaking, it also opened a wide landscape of open questions that motivate ongoing BSM Higgs searches. This review traces the evolution of these searches across experiments, highlighting both experimental techniques and underlying theoretical ideas in an accessible manner. Emphasis is placed on how different collider environments shaped search strategies and how seemingly subtle experimental effects, such as small excesses, non-standard decay topologies, or suppressed couplings, can provide insight into the possible structure of extended Higgs sectors. By connecting historical developments with current analyses and future prospects, this article aims not only to summarise results but also to provide students and newcomers with intuitive insight into how Higgs searches are designed, interpreted, and continuously refined. It illustrates how experimental challenges translate into physics opportunities, thereby inviting the next generation of researchers to contribute to one of the central questions in particle physics: whether the Higgs sector is minimal or part of a more complex structure."},{"arxiv":"2611.31011","id":"3233213","title":"Lorentz symmetry in self-supervised representation learning","authors":"Andreas Hermansen, Tobias Golling, Slava Voloshynovskiy","score":5.6,"section":"new","rank":47,"parts":[0.0,0.11,0.15,0.0,0.0],"note":"Closest of your papers: [[1455793]] (coupling 0.04, 4 shared references). Closest network paper: [[3187354]] (coupling 0.05, 4 shared references).","abstract":"Self-supervised learning (SSL) and explicit physical inductive biases have driven major advances in jet tagging, yet they are typically pursued along separate tracks. In this work, we unify both paradigms by integrating the Lorentz-equivariant Geometric Algebra Transformer slim (L-GATr-slim) architecture with the LeJEPA framework for representation learning. Pre-training on 100 million jets from the JetClass dataset, we optimize towards a latent space, which is invariant across physics-motivated jet augmentations. We demonstrate that enforcing Lorentz symmetry in the latent space is critical for representation quality and that this can be achieved either architecturally or learned via kinematic augmentations. With a standard non-invariant Transformer backbone, LeJEPA outperforms established autoregressive, masked particle modelling, and self-distillation baselines in linear- and MLP-probe accuracy, with L-GATr-slim providing further complementary gains. Across downstream benchmarks, our pre-trained models consistently outperform baselines trained from scratch or through different pre-training objectives."},{"arxiv":"2611.28214","id":"3232169","title":"Vector boson scattering in composite Higgs models","authors":"Rosy Caliri, Manuel Kunkel, Werner Porod","score":5.0,"section":"new","rank":48,"parts":[0.0,0.1,0.14,0.0,0.0],"note":"Closest of your papers: [[1455793]] (coupling 0.04, 5 shared references). Closest network paper: [[2665284]] (coupling 0.05, 6 shared references).","abstract":"Vector boson scattering is a powerful tool to test the mechanism of electroweak symmetry breaking. We focus on Composite Higgs models with an underlying fermionic description and assume that only one pseudo Nambu-Goldstone boson contributes to electroweak symmetry breaking, which we identify as the Higgs state of the Standard Model. In these scenarios, LHC data imply lower bounds on the predicted resonances below 2 TeV depending on the scenario. Using $WZjj$ production as a benchmark, we demonstrate that the tails of various distributions nevertheless show significant deviations from Standard Model predictions. This holds in particular for the case of longitudinally polarised vector bosons."},{"arxiv":"2611.28037","id":"3217634","title":"Photomeson-threshold origin of the TeV break in astrophysical neutrinos: Spectrum, flavor, resolved sources, and the ultrahigh-energy landscape","authors":"Vernon Barger","score":5.0,"section":"cross","rank":49,"parts":[0.0,0.01,0.31,0.0,0.0],"note":"Closest of your papers: [[2787444]] (coupling 0.00, 1 shared references). Closest network paper: [[2905773]] (coupling 0.11, 8 shared references).","abstract":"IceCube observes a break near 30 TeV in the diffuse astrophysical neutrino spectrum. We interpret it as the photomeson ($pγ$) threshold. Accelerated protons interact with the soft x rays of accreting black holes through the $Δ(1232)$ resonance. One kinematic relation sets the break energy from the target field's lowest photon energy, the seed scale $\\varepsilon_0$. The measured break fixes $\\varepsilon_0\\simeq0.13$ keV and supplies the low-energy suppression no sum of falling power laws can produce. Building on the $Δ(1232)$ identification of Khatee Zathul, Fang, Halzen, and Hooper and the single-source-class photo-pion fit of Winter, Fiorillo, and Buson, we give closed-form relations that invert the four broken-power-law parameters to the source physics with no remaining freedom, namely, $γ_2=s$ and $γ_1=s-(α_x-1)$ ($s$, $α_x$ the proton and target photon indices), and $E_{\\rm br}\\propto[(1+\\bar z)\\varepsilon_0]^{-1}$. The break width bounds the total smearing to $σ_s\\le0.235$ dex (68% CL), no broader than redshift alone must make it, and the seed scale is the same across sources to within a factor $\\lesssim$1.5, which mean-spectrum fits do not provide. Below-break neutrinos are predicted to come on average from higher redshifts than those above. The threshold also fixes the flavor and $ν/\\barν$ composition, including the energy-dependent $\\barν_e$ fraction and the Glashow-resonance discriminator of Winter et al., matching current flavor data. Inverted source by source, the relation gives each resolved IceCube source its target photon scale, from the keV coronae of NGC 1068 and PKS 1424+240 to the $\\sim$20 eV jet of TXS 0506+056. That two-decade spread means they cannot supply the homogeneous break, which requires a separate, fainter population. KM3-230213A points to a warm-dust target, $\\varepsilon_0\\simeq0.02$ eV, unless cosmogenic."},{"arxiv":"2611.28208","id":"3232156","title":"Bring Your Own Instanton: Monopole Catalysis from Sourced SU(2) Instantons","authors":"Csaba Csáki, Larissa Kiriliuk, Zhihan Liu, Rotem Ovadia","score":4.8,"section":"cross","rank":50,"parts":[0.0,0.03,0.27,0.0,0.0],"note":"Closest of your papers: [[2787890]] (coupling 0.01, 1 shared references). Closest network paper: [[3150177]] (coupling 0.09, 9 shared references).","abstract":"We show that Rubakov-Callan catalysis of proton decay in the field of a 't Hooft-Polyakov monopole proceeds through \"sourced SU(2) instantons\", which are novel topological gauge configurations sourced by fermions and carrying unit instanton number. Unlike vacuum BPST instantons, these sourced instantons do not give rise to exponentially suppressed rates. We relate the winding number to the number of fermionic zero modes, suggesting an underlying index theorem for sourced instantons. We also calculate the closed-form expression for the leading-order correlator for fermion insertions both outside and inside the monopole core. Our results indicate that Rubakov-Callan catalysis is an IR effect where the scattering fermions do not reach the monopole core."},{"arxiv":"2611.28199","id":"3232185","title":"A Transformer-based Method for Neutrino Event Generator Reweighting","authors":"Andrew Cudd, Roger G. Huang, Benjamin Nachman, Vinicius Mikuni, Callum Wilkinson","score":4.6,"section":"cross","rank":51,"parts":[0.06,0.04,0.09,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[3146383]] (coupling 0.01, 1 shared references). Closest network paper: [[3097570]] (coupling 0.03, 3 shared references).","abstract":"The ability to test the effects of different neutrino event generators on simulation-based analyses is currently bottlenecked by the computational cost of propagating simulated events through expensive detector simulations. One way to circumvent this limitation is to reweight events produced with one generator to replicate the predictions of another. However, existing methods for doing this in neutrino physics tend to be limited to only a few observables at a time. We present a transformer-based architecture that can reweight between neutrino event generators based on nearly the entire particle stack, providing reweighted events that are valid over a greatly expanded phase space. We present results with events generated from multiple GENIE configurations and NuWro as examples, and we introduce an energy distance-based metric for evaluating the results in a multidimensional, unbinned manner. Our results show promising performance for realistic applications and provide a method for comparing the performance of different reweighting techniques."},{"arxiv":"2307.07578","id":"2677653","title":"Soft photon corrections in $B \\to K^{(\\ast)} \\ell^+ \\ell^-$ and $Λ_b \\to Λ^{(\\ast)} \\ell^+ \\ell^-$ decays","authors":"Debajyoti Choudhury, Diganta Das, Jaydeb Das","score":4.3,"section":"replacement","rank":52,"parts":[0.0,0.01,0.26,0.0,0.0],"note":"Closest of your papers: [[2690106]] (coupling 0.01, 1 shared references). Closest network paper: [[1986767]] (coupling 0.09, 10 shared references).","abstract":"We calculate QED corrections to the semileptonic decays $H_1\\to H_2\\ell^+\\ell^-$ where $\\ell=e, μ$ and $H_{1,2}$ are hadrons. The soft and/or collinear divergences are regulated in a gauge-invariant manner and demonstrably cancel, leaving behind a finite residue that depends on the (infrared) momentum cutoff below which a photon is considered to be indistinguishable. On resumming, the said sensitivity reduces drastically, {\\em i.e.}, for the NLL result as compared to the NLO one. The overall correction is negative and its magnitude is larger for a lighter lepton. The corrections are presented for $B\\to K^{(*)}$ and, for the first time, for $Λ_b\\toΛ^{(*)}$ decays. Given that QED final-state radiation is routinely incorporated in experimental Monte Carlo simulations, for example through PHOTOS, our results provide an important theoretical framework for assessing the accuracy and limitations of these simulations and their impact on LFU observables such as $R_{K^{(*)}}$."},{"arxiv":"2611.29328","id":"3232273","title":"Neutron lifetime puzzle and Dicke coherence in spontaneous decays","authors":"Z. K. Silagadze","score":4.2,"section":"new","rank":53,"parts":[0.0,0.01,0.05,0.0,0.31],"note":"Closest of your papers: [[2787444]] (coupling 0.00, 1 shared references). Closest network paper: [[2936613]] (coupling 0.02, 1 shared references). Shared topics: big bang nucleosynthesis.","abstract":"The long-standing discrepancy between beam and bottle measurements of the free-neutron lifetime---known as the neutron lifetime puzzle---remains an open anomaly in nuclear and particle physics. Here, we investigate whether collective quantum synchronization via macroscopic Dicke superradiance can influence free-neutron decay or mediate the relaxation of hypothetical excited neutron states. We show that superradiance is fundamentally obstructed in standard three-body weak beta decay by continuous final-state phase space and fermionic antisymmetrization, and remains inactive in terrestrial ultracold neutron traps due to low particle densities, even within the Koch--Hummel excited-neutron model. Extending this analysis to the primordial plasma prior to Big Bang nucleosynthesis, we demonstrate that rapid $e^\\pm$ collisional dephasing and intense thermal photon backgrounds prevent a superradiant purge and instead enforce thermal detailed balance. Consequently, across the entire parameter space unconstrained by terrestrial experiments, an excited neutron state inevitably thermalizes before weak freeze-out, increasing the effective neutron statistical weight and severely overproducing primordial $^4\\text{He}$, thereby excluding the standard realization of the Koch--Hummel hypothesis."},{"arxiv":"2611.28140","id":"3232166","title":"Regge-eikonal description of high-energy proton-proton elastic scattering: a single-channel Gaussian benchmark confronted with TOTEM data at $\\sqrt{s}=13$ TeV","authors":"Ji Li","score":4.2,"section":"cross","rank":54,"parts":[0.0,0.05,0.17,0.0,0.0],"note":"Closest of your papers: [[2751074]] (coupling 0.02, 1 shared references). Closest network paper: [[2753529]] (coupling 0.06, 2 shared references).","abstract":"A single-Pomeron Regge Born amplitude with a Gaussian dependence on the momentum transfer is eikonalized in impact-parameter space, and the resulting single-channel, purely absorptive amplitude is evaluated in closed form. The total, elastic and inelastic cross sections and the forward slope are expressed through the entire exponential integral Ein(a) and a related series $I_1(a)$, and the closed forms are verified against direct numerical integration and against the weak-coupling Born limit. Two parameter choices are confronted with the TOTEM measurements at $\\sqrt{s}=13$ TeV. With the Donnachie-Landshoff trajectory and a normalization fixed at 7 TeV, the model gives $σ_{tot}=139.2$ mb against the measured $110.6\\pm3.4$ mb and places the first diffractive zero at $|t|=0.244$ GeV$^2$ against the measured dip at 0.47 GeV$^2$. Calibration of the two parameters to the measured $σ_{tot}$ and $σ_{el}/σ_{tot}$ describes the differential cross section to within five per cent for $|t|\\lesssim0.1$ GeV$^2$, but places the zero at 0.315 GeV$^2$ and overestimates the cross section at the measured dip by more than an order of magnitude. A single Gaussian opacity therefore cannot simultaneously accommodate the integrated cross sections and the position of the diffractive dip. Restoring the signature phase gives $ρ=0.098$, in agreement with the TOTEM and ATLAS measurements, and fills the zero without moving it; a two-component opacity reduces the excess at the dip from a factor of 15 to a factor of 2 without reproducing the dip-bump structure and the large-$|t|$ tail simultaneously; a two-channel Good-Walker eikonal on a Gaussian profile moves the minimum further away from the measured dip."},{"arxiv":"2611.29526","id":"3232323","title":"Package feyn.gle for drawing Feynman diagrams, version 1.2","authors":"Andrey Grozin","score":4.0,"section":"new","rank":55,"parts":[0.0,0.0,0.27,0.0,0.0],"note":"Closest network paper: [[1866376]] (coupling 0.09, 2 shared references).","abstract":"As compared to the previous version, there is one backward-incompatible change and many new kinds of lines and other objects."},{"arxiv":"2611.29122","id":"3232258","title":"Measuring the Neutrino Mass with $^{241}$Pu","authors":"Mustafa Anaam, Nicolo de Groot, Inge van Rens","score":3.7,"section":"cross","rank":56,"parts":[0.0,0.0,0.14,0.0,0.16],"note":"Closest network paper: [[2775479]] (coupling 0.05, 1 shared references). Shared topics: neutrino mass.","abstract":"Tritium has long been the isotope of choice for measurements of the absolute neutrino mass. Its low nuclear mass leads to substantial recoil energy, limiting measurements with both molecular tritium ($T_2$) and atomic tritium bound to a substrate. With a beta-decay endpoint energy and half-life similar to those of tritium, but a much larger nuclear mass, $^{241}$Pu may offer an interesting alternative. Its principal challenge is background from the beta decay of $^{237}$U. We discuss strategies for suppressing this background and compare the projected neutrino-mass sensitivities of $^{241}$Pu and tritium as a function of the background suppression."}],"rest":[{"arxiv":"2611.24372","title":"$X(2370)$ without exceptionalism from reanalyzing $J/ψ\\to γ+ 3P$ data","score":3.6,"section":"replacement","rank":57},{"arxiv":"2609.02537","title":"Analysis of the two-body strong decays of the hidden-charm pentaquark states in QCD sum rules","score":3.5,"section":"replacement","rank":58},{"arxiv":"1812.07006","title":"Chiral QCD phase in equilibrium with Hadron Gas and the lo   const links=`<div class="links">${n.id?`<a href="https://inspirehep.net/literature/${n.id}" target="_blank" rel="noopener">INSPIRE</a>`:''}${n.arxiv?`<a href="https://arxiv.org/abs/${esc(n.arxiv)}" target="_blank" rel="noopener">arXiv</a>`:''}</div>`;
  if(isNew(n)) p.innerHTML=`<div class="role" style="color:${col(n)}">#${n.rank} · ${esc(SEC[n.section])} · score ${n.score.toFixed(1)}</div><h4>${esc(n.title)}</h4>
   <div class="meta">${esc(auth(n))} · arXiv:${esc(n.arxiv)}</div><p>${why(n.note)}</p><div class="links"><a href="#p${n.i}">Back to abstract</a></div>`;
  else p.innerHTML=`<div class="role" style="color:${col(n)}">${esc(ROLE[n.role])}</div><h4>${esc(n.title)}</h4>
   <div class="meta">${esc(auth(n))} · ${n.year}${n.arxiv?' · arXiv:'+esc(n.arxiv):''}</div>
   <div class="stats"><span>${n.cites.toLocaleString()} citations</span><span>${n.inn.filter(i=>isNew(N[i])).length} of the matches link here</span></div>${links}`;
  tex(p)}
function pick(n,scroll){sel=n;panel();paint();document.querySelectorAll('.paper').forEach(el=>el.classList.toggle('sel',el.id==='p'+n.i));if(scroll)document.getElementById('chart').scrollIntoView({behavior:'smooth',block:'nearest'})}
const present=new Set(N.map(n=>n.role));
document.getElementById('legend').innerHTML=['today','repl','seed','other'].filter(k=>present.has(k)).map(k=>`<span><i class="dot" style="background:var(--${k})"></i>${esc(ROLE[k])}</span>`).join('')+'<span style="color:var(--fg-3)">Listing papers: size ∝ score; others: size ∝ log(citations)</span>';
document.getElementById('q').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();paint()});
svg.on('click',ev=>{if(ev.target.tagName!=='circle'){sel=null;panel();paint()}});
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(draw,200)});
function nextList(){const X=RAW.next||[];if(!X.length)return;const box=document.getElementById('nextlist'),more=document.getElementById('more');
  more.hidden=false;more.querySelector('summary').firstChild.textContent=`The next ${X.length} papers by score `;
  const nmin=M.nextMin;
  document.getElementById('moresub').textContent=`below the threshold of ${M.threshold}${nmin!=null?`: every paper scoring ${nmin} or more, and at least ${M.nextCount} when available`:''}; not drawn in the network`;
  const cut=nmin!=null?X.findIndex(n=>n.score<nmin):-1;
  box.innerHTML=X.map((n,i)=>(i===cut?`<li class="divider">Below ${nmin}: weaker relation (most of these share no specific reference, coupling or topic with your work)</li>`:'')+`<li><div class="role" style="color:var(--${n.section==='replacement'?'repl':'today'})">#${n.rank} · ${esc(SEC[n.section])} · score ${n.score.toFixed(1)}</div>
    <div class="t">${esc(n.title)}</div><div class="authors">${authors(n.authors)} · arXiv:${esc(n.arxiv)}</div>
    ${n.note?`<p class="why">${why(n.note)}</p>`:''}
    <details class="abs"><summary>Abstract</summary><p class="abs">${esc(n.abstract)}</p></details>
    <div class="links">${n.id?`<a href="https://inspirehep.net/literature/${n.id}" target="_blank" rel="noopener">INSPIRE</a>`:''}<a href="https://arxiv.org/abs/${esc(n.arxiv)}" target="_blank" rel="noopener">arXiv</a><a href="https://arxiv.org/pdf/${esc(n.arxiv)}" target="_blank" rel="noopener">PDF</a></div></li>`).join('');
  more.addEventListener('toggle',()=>{if(more.open)tex(box)})}
const rtip=document.getElementById('reftip');let rcur=null;
function refShow(el){const r=REFS[el.dataset.ref];if(!r)return;rcur=el;rtip.textContent=`${auth(r)} (${r.year}) — ${plain(r.title)}`;rtip.hidden=false;
  const b=el.getBoundingClientRect(),t=rtip.getBoundingClientRect();let L=Math.min(Math.max(8,b.left),innerWidth-t.width-8),T=b.bottom+6;
  if(T+t.height>innerHeight-8)T=b.top-t.height-6;rtip.style.left=L+'px';rtip.style.top=T+'px'}
function refHide(){rtip.hidden=true;rcur=null}
document.addEventListener('pointerover',e=>{const el=e.target.closest('.ref');if(el&&e.pointerType==='mouse')refShow(el)});
document.addEventListener('pointerout',e=>{if(e.target.closest('.ref')&&e.pointerType==='mouse')refHide()});
document.addEventListener('click',e=>{const el=e.target.closest('.ref');if(el)refShow(el);else if(rcur)refHide()});
document.addEventListener('focusin',e=>{const el=e.target.closest('.ref');if(el)refShow(el)});
document.addEventListener('focusout',e=>{if(e.target.closest('.ref'))refHide()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')refHide()});
addEventListener('scroll',()=>{if(rcur)refHide()},{passive:true});
// the rest of the day's papers by score: only the title, linked to the arXiv record
function restList(){const X=RAW.rest||[];if(!X.length)return;const d=document.getElementById('rest'),box=document.getElementById('restlist');
  d.hidden=false;d.querySelector('summary').firstChild.textContent=`All other ${X.length} papers in this listing `;
  document.getElementById('restsub').textContent='by score, title only';
  box.innerHTML=X.map(n=>`<li><span class="sc">#${n.rank} · ${n.score.toFixed(1)}</span><a href="https://arxiv.org/abs/${esc(n.arxiv)}" target="_blank" rel="noopener">${esc(n.title)}</a></li>`).join('');
  d.addEventListener('toggle',()=>{if(d.open)tex(box)})}
list();nextList();restList();fold();draw();panel();
window.addEventListener('load',()=>{tex(document.getElementById('list'));tex(document.getElementById('panel'));fold();
  if(window.MathJax&&MathJax.startup&&MathJax.startup.promise)MathJax.startup.promise.then(()=>setTimeout(fold,300))});
addEventListener('resize',()=>{clearTimeout(window._ft);window._ft=setTimeout(fold,200)});
</script>
