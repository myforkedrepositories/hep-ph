<script>
const RAW = {"n":[{"id":"3187965","arxiv":"2608.05150","title":"The QCD Axion and Neutrino Masses","first":"Debnath","nauth":3,"year":2026,"cites":0,"role":"repl","note":"Cites 4 network papers: [[2697191]], [[1615480]], [[1286910]], [[1489994]]. Also cites widely used network papers: [[1783234]]. Closest of your papers: [[1955022]] (coupling 0.12, 16 shared references). Closest network paper: [[1861353]] (coupling 0.20, 22 shared references). Shared topics: observed dark matter, neutrino mass, dark matter.","score":58.4,"rank":1,"section":"replacement","parts":[0.91,0.38,0.58,0.0,0.62],"abstract":"The strong CP problem and the origin of neutrino masses are among the clearest motivations for physics beyond the Standard Model. The Peccei-Quinn mechanism offers an elegant dynamical solution to the strong CP problem, predicting the QCD axion, while neutrino masses point to new degrees of freedom or interactions beyond the Standard Model. We explore the possibility that these two phenomena arise from a common origin by identifying the Peccei-Quinn symmetry-breaking scale with the scale responsible for neutrino mass generation. We perform a systematic and unified analysis of this connection in both DFSZ and KSVZ realizations of the Peccei-Quinn mechanism, considering the Type-I, Type-II, and Type-III seesaw mechanisms, the Zee radiative model, and the colored seesaw. For each scenario, we determine the axion couplings to photons and neutrinos and examine their phenomenological consequences. A robust prediction of all the frameworks considered is the existence of axion-neutrino couplings. We show that these interactions can significantly affect the axion decays. If the QCD axion makes up the observed dark matter, these couplings also lead to a large monochromatic neutrino flux from axion decays, opening a complementary path to test these theories in future neutrino experiments.","authors":"Hridoy Debnath, Pavel Fileviez Perez, Grace Miller","nlinked":68,"nref":76,"src":"INSPIRE","html":true},{"id":"","arxiv":"2610.39057","title":"Linking a 152 GeV diphoton excess to dark matter and gravitational waves in the singlet-extended 2HDM","first":"Dong","nauth":5,"year":2026,"cites":0,"role":"today","note":"Cites 4 network papers: [[2914121]], [[2874649]], [[2686887]], [[2740358]]. Closest of your papers: [[1692605]] (coupling 0.05, 7 shared references). Closest network paper: [[2924315]] (coupling 0.21, 49 shared references). Shared topics: observed dm relic, dm relic, relic density, complex scalar, dark matter.","score":54.7,"rank":2,"section":"new","parts":[0.91,0.17,0.61,0.0,0.86],"abstract":"We investigate the diphoton excesses near $152~\\mathrm{GeV}$ accompanied by missing transverse momentum (MET) in the Type-I two-Higgs-doublet model extended by a complex scalar singlet, whose imaginary component serves as a pseudo-Nambu-Goldstone dark matter (DM) candidate $χ$. The signal arises from the cascade process $gg\\to h_3\\to h_2h_2\\toγγχχ$, where $h_2$ is the scalar resonance near $152~\\mathrm{GeV}$ and $h_3$ is a heavier CP-even scalar. After imposing the theoretical and experimental constraints, we identify parameter regions that accommodate at least one of the Low-MET and High-MET excesses within $1σ$ and simultaneously reproduce the observed DM relic density within an assumed $10\\%$ theoretical uncertainty. A subset of these samples supports first-order electroweak phase transitions with substantial supercooling. For a three-year observation, selected samples yield gravitational-wave signals with signal-to-noise ratios (SNRs) above $10$ at LISA, TianQin, DECIGO, and BBO. A representative benchmark that accommodates both excesses within their respective $1σ$ intervals and satisfies the relic-density requirement yields a three-year BBO SNR of approximately $173$.","authors":"Yabo Dong, Jun Fan, Kun Wang, Haijun Yang, Jingya Zhu","nlinked":117,"nref":117,"src":"arXiv source","html":true},{"id":"3220161","arxiv":"2610.38397","title":"Gravitational Dark Matter Production from Spectator Field in $R^2$-Higgs Inflation","first":"Samanta","nauth":3,"year":2026,"cites":0,"role":"today","note":"Cites 3 network papers: [[3103226]], [[2098321]], [[2737356]]. Closest of your papers: [[3184726]] (coupling 0.02, 2 shared references). Closest network paper: [[2790912]] (coupling 0.17, 14 shared references). Shared topics: observed relic, relic density, relic abundance, dark matter.","score":45.8,"rank":3,"section":"cross","parts":[0.83,0.05,0.49,0.0,0.77],"abstract":"We investigate the cosmological gravitational dark matter production of spectator field $χ$ in the multifield $R^2$-Higgs inflation. The spectator field $χ$ couples to gravity only through a non-minimal coupling $ξ_χχ^2R$ and serves as a dark matter (DM) candidate. Working consistently in the Einstein frame, we derive the equation of motion of the background fields and fluctuations at linear order using the doubly covariant formalism. We show the dark matter production and the subsequent comoving relic abundance heavily depend on this effective mass of the field $χ$. Specifically, we find that there exists cancellation regions in the effective mass-squared of $χ$, which ensures the correct relic abundance is achieved. Further, we show that the preheating from Higgs and Goldstone may play critical role in accounting the observed relic density.","authors":"Arnab Samanta, Rajesh Mondal, Tanmoy Modak","nlinked":46,"nref":47,"src":"INSPIRE","html":true},{"id":"2969567","arxiv":"2509.12007","title":"Dark Parton Shower Effects for Cosmic Ray Boosted Dark Matter","first":"Chen","nauth":6,"year":2026,"cites":0,"role":"repl","note":"Cites 3 network papers: [[2851201]], [[850629]], [[2795517]]. Also cites widely used network papers: [[1518747]]. Closest of your papers: [[3146383]] (coupling 0.05, 9 shared references). Closest network paper: [[3172592]] (coupling 0.17, 21 shared references). Shared topics: direct detection, dark sector, dark matter.","score":45.7,"rank":4,"section":"replacement","parts":[0.84,0.15,0.49,0.0,0.42],"abstract":"We investigate the effects of dark parton showers on the direct detection of cosmic-ray boosted dark matter (CRDM), focusing on a dark-photon-mediated model with fermionic dark matter--electron interactions. Using a Monte Carlo framework to incorporate Sudakov form factors and kinematic dipole recoil schemes, we simulate the evolution of the CRDM energy spectrum under dark sector splitting. Our results reveal that dark parton showering induces an energy-dependent reshaping of the CRDM flux, particularly characterized by a depletion of the high-energy flux. For a dark matter (DM) mass of 1 keV and a coupling of $g_D=3$, the CRDM flux can be enhanced by up to a factor of 1.12 in the $\\mathcal{O}(10^{-2} \\sim 1)$ MeV energy range for $2m_χ\\lesssim m_{A^\\prime} \\lesssim 10^{-2}$ MeV, whereas it is suppressed by more than 50% at energies around 100 MeV for $m_{A^\\prime} \\lesssim 10^{-3}$ MeV. We then translate these effects into experimental sensitivities for PandaX-4T, Super-Kamiokande, and JUNO. For $m_{A^\\prime} = 10^{-3}$ MeV and $g_D=3$, the bounds on the kinetic mixing parameter $ε^2$ are relaxed by factors of 1.02, 1.6, and 1.4, respectively. Incorporating the effects of DM parton distribution functions (PDFs) at neutrino detectors alongside dark parton shower effects further relaxes these bounds.","authors":"Zirong Chen, Shao-Feng Ge, Jinmian Li, Junle Pei, Feng Yang, Cong Zhang","nlinked":171,"nref":176,"src":"INSPIRE","html":true},{"id":"3111415","arxiv":"2601.18147","title":"Radiative generation of chiral vector operators in $b\\to s ν\\barν$ transition","first":"Yan","nauth":4,"year":2026,"cites":0,"role":"repl","note":"Cites 3 network papers: [[2813804]], [[2069870]], [[1744787]]. Closest of your papers: [[1708907]] (coupling 0.01, 1 shared references). Closest network paper: [[2813804]] (coupling 0.33, 29 shared references).","score":44.0,"rank":5,"section":"replacement","parts":[0.83,0.02,0.94,0.0,0.0],"abstract":"The recent Belle II evidence for $B^+ \\to K^+ ν\\barν$, combined with a suppressed branching fraction ratio $R \\equiv Br(B^0 \\to K^{*0} ν\\barν) / Br(B^+ \\to K^+ ν\\barν)$, necessitates new physics contributing to both left- and right-handed vector operators. We perform a systematic topological classification of one-loop completions that radiatively generate both operators without tree-level mediation, and construct two minimal benchmark scenarios: a scalar-rich model and a fermion-rich model. Evaluating these frameworks under specific benchmark mass schemes and four distinct flavor structures, we find a generic anti-correlation where enhancing one decay channel typically suppresses the other. A notable exception is a decoupled flavor configuration within the scalar-rich model, which yields simultaneous constructive interference, reducing $R$ by $4.22\\%$ while satisfying all complementary flavor bounds. Under a universal coupling assumption, the scalar-rich model yields exact cancellation in the charged mode, highlighting the non-trivial interplay between flavor structure and loop-generated Wilson coefficients.","authors":"Xin-Shuai Yan, Wen-Feng Liu, Qin Chang, Ya-Dong Yang","nlinked":91,"nref":94,"src":"INSPIRE","html":true},{"id":"","arxiv":"2610.40275","title":"Going off the (momentum) grid: A simple implementation of noncold relics in linear Boltzmann solvers","first":"Nasiri","nauth":3,"year":2026,"cites":0,"role":"today","note":"Cites 4 network papers: [[2935629]], [[2797745]], [[2098321]], [[2795517]]. Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2686856]] (coupling 0.02, 3 shared references). Closest network paper: [[3081713]] (coupling 0.07, 10 shared references). Shared topics: dark matter.","score":38.0,"rank":6,"section":"cross","parts":[0.91,0.06,0.19,0.0,0.13],"abstract":"Linear Boltzmann solvers typically evolve the perturbations of noncold relics, such as massive neutrinos or hot subcomponents of the dark matter, on a momentum grid, often switching to a fluid approximation on small scales for efficiency. We implement in CLASS the Dispersive Fluid Approximation (DFA), a fluid scheme that captures the scale-dependent sound speed of these species. Within the standard ncdm module, the DFA significantly outperforms the default CLASS fluid approximation in the cross and neutrino power spectra, and reduces errors in the cold dark matter power spectrum by up to an order of magnitude, while adding only 1-4% to the total runtime. We also present the first open-source implementation of the Generalized Boltzmann Hierarchy (GBH), which simplifies the implementation of noncold relics by integrating out the momentum dependence of their perturbations altogether. Combined with the DFA and tested on massive neutrinos, the GBH reproduces the matter power spectrum to better than permille accuracy and cosmological parameter constraints to better than 0.05 sigma, at a computational cost comparable to that of the standard implementation. We argue that the GBH is particularly well suited to non-thermal relics whose distribution function varies with time or across parameter space. Our implementation of both the DFA and the GBH in CLASS is publicly available at https://github.com/aradn97/class_GBH.","authors":"Arad Nasiri, Murali Saravanan, Caio B. de S. Nascimento","nlinked":126,"nref":143,"src":"arXiv source","html":true},{"id":"3169228","arxiv":"2606.17617","title":"Synergy between CSST and future gravitational-wave detectors: Probing primordial black holes by cross-correlating dark sirens with galaxies","first":"Du","nauth":4,"year":2026,"cites":0,"role":"repl","note":"Cites 2 network papers: [[3137685]], [[2915943]]. Closest of your papers: [[2826987]] (coupling 0.04, 6 shared references). Closest network paper: [[3137685]] (coupling 0.07, 10 shared references). Shared topics: primordial black hole.","score":34.0,"rank":7,"section":"replacement","parts":[0.7,0.11,0.21,0.0,0.31],"abstract":"Gravitational-wave (GW) events and galaxies both trace the cosmic matter distribution, but the mergers of astrophysical black holes and primordial black holes (PBHs) are expected to populate different environments and therefore to cluster with different biases. The GW clustering bias is thus a statistical observable that can separate the two populations. We assess how well this can be done by cross-correlating the photometric galaxy survey of the Chinese Space-station Survey Telescope (CSST) with mock GW catalogs from two future detector networks: the third-generation ET2CE network (the Einstein Telescope and two Cosmic Explorer detectors) and the multi-band BDET2CE network, which adds the space-based baseline Decihertz Interferometer Gravitational-Wave Observatory. We find that CSST combined with 10 years of ET2CE observations can reveal a PBH contribution once its fraction in the total merger rate exceeds about $40\\%$, while the much sharper sky localization of BDET2CE lowers this threshold to about $20\\%$. The improvement comes from recovering the small-scale clustering information that localization errors would otherwise erase. These results show that combining future GW detector networks with CSST galaxy clustering offers a promising and largely independent route to identifying PBHs statistically.","authors":"Ya-Nan Du, Ji-Yu Song, Jing-Fei Zhang, Xin Zhang","nlinked":122,"nref":123,"src":"INSPIRE","html":true},{"id":"3208476","arxiv":"2609.31833","title":"Neutrino Direct Simulation Monte Carlo: Accurate modeling of out-of-equilibrium decaying cosmological relics","first":"Akita","nauth":4,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[2895271]]. Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2663002]] (coupling 0.07, 10 shared references). Closest network paper: [[2967474]] (coupling 0.14, 12 shared references). Shared topics: big bang nucleosynthesis.","score":32.4,"rank":8,"section":"replacement","parts":[0.48,0.23,0.4,0.0,0.27],"abstract":"We consider nonstandard cosmologies in which decaying relics inject energy at MeV temperatures, driving neutrinos out of equilibrium. The subsequent neutrino evolution shapes predictions for the cosmic radiation density and primordial light element abundances. Earlier work introduced Neutrino Direct Simulation Monte Carlo ($ν$DSMC), which describes neutrino transport through Monte Carlo sampling of particle interactions. Here, we extend this method by jointly evolving the relic population, neutrino spectra, electromagnetic plasma, and cosmic expansion, and coupling this evolution to Big Bang nucleosynthesis. The framework includes direct and inverse decays of the relic, neutrino flavor conversion, quantum statistics, and pion production by energetic neutrinos. To reveal the physical impact of these effects and independently test $ν$DSMC, we compare several approaches to neutrino evolution across a range of nonstandard cosmological scenarios. We find excellent agreement with independent solutions of quantum kinetic or quasi-classical Boltzmann equations. Compared with these calculations, $ν$DSMC includes a broader range of physical processes and is substantially faster for strongly nonthermal neutrino populations. This makes broad, robust parameter scans for nonstandard cosmologies practical. We show that when departures from thermal equilibrium are large, approximations that average over neutrino momenta can give qualitatively incorrect predictions, including the wrong sign of the change in the effective number of neutrino species and substantially incorrect primordial nuclear abundances. We conclude that the extended $ν$DSMC framework enables reliable cosmological tests of new physics by following neutrino thermalization and its observable consequences.","authors":"Kensuke Akita, Miguel Escudero, Oleksii Ihnatenko, Maksym Ovchynnikov","nlinked":77,"nref":87,"src":"INSPIRE","html":true},{"id":"3220223","arxiv":"2610.38745","title":"Searching for Dark Photons and ALPs using Gamma-rays from Nuclear Reactors","first":"Angel","nauth":4,"year":2026,"cites":0,"role":"today","note":"Cites 2 network papers: [[2771408]], [[2795517]]. Also cites widely used network papers: [[1783234]], [[1688995]], [[1518747]]. Closest of your papers: [[1955022]] (coupling 0.03, 5 shared references). Closest network paper: [[3090922]] (coupling 0.06, 11 shared references).","score":31.5,"rank":9,"section":"new","parts":[0.75,0.1,0.16,0.0,0.0],"abstract":"Nuclear reactors are intense sources of MeV gamma rays, produced in fission, radiative neutron capture and the de-excitation of fission products. Building on earlier phenomenological studies, we present a detector-independent description of the production of light, weakly coupled particles by reactor gamma rays and of their detection through scattering, absorption and decay in a nearby detector. We consider kinetically mixed dark photons, produced and detected through Compton-like processes, and axion-like particles (ALPs) coupled to photons, electrons and nucleons, produced through Primakoff conversion, Compton-like scattering and magnetic nuclear transitions such as the $2.23~\\mathrm{MeV}$ line of $p(n,γ)d$. As a concrete application, we derive the projected sensitivities of the CONUS+ germanium experiment at the Leibstadt reactor and of a conceivable $100$-kg CONUS100 upgrade. For sub-MeV dark photons, CONUS+ and CONUS100 reach kinetic mixings of $ε\\simeq1.65\\times10^{-5}$ and $1.2\\times10^{-5}$, respectively, for $0.5~\\mathrm{keV}\\lesssim m_{A'}\\lesssim0.5~\\mathrm{MeV}$. For ALPs, we show that CONUS100 can probe an unexplored region of parameter space at MeV masses, in particular through $a\\to e^+e^-$ decays of ALPs emitted in the deuteron line, assuming a energy window extended to $10~\\mathrm{MeV}$.","authors":"Lucia Angel, Manfred Lindner, Farinaldo S. Queiroz, Bilge S. Solak","nlinked":61,"nref":67,"src":"INSPIRE","html":true},{"id":"3220170","arxiv":"2610.38531","title":"Inelastic Kinetic Decoupling in WIMP Leptogenesis: A Minimal $Z_4$ Model","first":"Liu","nauth":2,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[2141293]]. Closest of your papers: [[2614919]] (coupling 0.03, 3 shared references). Closest network paper: [[2141293]] (coupling 0.12, 14 shared references). Shared topics: relic abundance, dark matter abundance, indirect detection, dark matter.","score":30.4,"rank":10,"section":"new","parts":[0.45,0.08,0.35,0.0,0.69],"abstract":"We study a minimal $Z_4$-symmetric extension of the Standard Model in which a singlet Dirac fermion $χ$ constitutes dark matter, whose annihilations generate a lepton asymmetry through WIMP leptogenesis. Kinetic equilibrium is maintained mainly by the inelastic conversion $χL\\leftrightarrow\\barχΨ$. Compared with the near elastic regime, a sizable mass gap suppresses the conversion rate more rapidly as the Universe cools. This naturally drives kinetic decoupling to earlier times, even away from resonance. Starting from the full inelastic collision operator, we derive an effective momentum transfer rate for kinetic decoupling. We then solve the coupled Boltzmann equations for the dark matter abundance, its temperature $T_χ$, and the $B-L$ asymmetry. Early kinetic decoupling can significantly modify the relic abundance, although near resonance this modification can be reduced by annihilation-induced heating. The $B-L$ asymmetry can be affected when asymmetry production overlaps with a substantial departure from kinetic equilibrium. In our scan, the largest deviations occur mainly for $x_{\\rm lep}\\gtrsim x_{\\rm cd}$. After imposing our constraints, asymmetry production typically ends before chemical decoupling, leaving the final asymmetry essentially unchanged. For indirect detection, we generate the photon spectrum with Pythia and evaluate the Fermi-LAT dwarf spheroidal likelihood.","authors":"An Liu, Hong-Hao Zhang","nlinked":56,"nref":61,"src":"INSPIRE","html":true},{"id":"","arxiv":"2610.39752","title":"Dwarf Galaxy Reticulum II's MeerKAT L-Band Observation: Constraining WIMP Dark Matter","first":"Badenhorst","nauth":8,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[2795517]]. Also cites widely used network papers: [[1518747]]. Closest of your papers: [[2751074]] (coupling 0.03, 5 shared references). Closest network paper: [[2795033]] (coupling 0.08, 11 shared references). Shared topics: interacting massive particle, weakly interacting massive particle, dark matter.","score":28.0,"rank":11,"section":"cross","parts":[0.48,0.1,0.22,0.0,0.48],"abstract":"The nature of dark matter remains one of the most profound open questions in modern physics, with weakly interacting massive particles (WIMPs) among the leading candidates proposed to account for the observed anomalies across cosmic scales. If WIMPs annihilate or decay in the dense dark matter haloes of nearby galaxies, the resulting high-energy electrons/positrons can produce synchrotron radiation in the presence of ambient magnetic fields, yielding a potentially detectable radio signature. Dwarf spheroidal galaxies are particularly promising targets for indirect dark matter searches due to their high mass-to-light ratios and low astrophysical foreground contamination. While radio observations have been widely used to constrain WIMP properties in these systems, the resulting limits remain highly sensitive to poorly constrained magnetic field assumptions. Here we utilize L-band ($1.3$--$1.5$ GHz) observations from the MeerKAT array directed towards dwarf galaxy Reticulum II and measure the surface brightness profile across the dwarf galaxy. Combining these measurements with theoretical models of WIMP annihilation and yield 95% confidence level upper limits on the WIMP annihilation cross-section $\\langleσv\\rangle \\lesssim 10^{-26}$ cm$^3$ s$^{-1}$ for masses $m_χ\\sim 10$-$200$ GeV (with the assumed uniform magnetic field model and diffusion constant). As next-generation radio facilities such as the Square Kilometre Array come online, robust characterisation of magnetic environments in dwarf galaxies will be essential to fully exploit their sensitivity to the particle nature of dark matter.","authors":"Phillip Badenhorst, Michael Sarkis, Yin-Zhe Ma, Wen-Qing Guo, Geoff Beck, Qiang Yuan, Gyula I. G. Jozsa, Steven G. Murray","nlinked":53,"nref":73,"src":"arXiv source","html":true},{"id":"3157770","arxiv":"2605.20162","title":"Dark Matter Interpretation of the Super-Kamiokande Antineutrino Excess and Predictions for JUNO","first":"Granelli","nauth":3,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[2795517]]. Closest of your papers: [[2964960]] (coupling 0.02, 4 shared references). Closest network paper: [[3083722]] (coupling 0.10, 16 shared references). Shared topics: dark matter candidate, dark sector, dark matter.","score":26.3,"rank":12,"section":"replacement","parts":[0.45,0.06,0.27,0.0,0.46],"abstract":"Super-Kamiokande has reported a small excess of electron antineutrino events in the 20 MeV energy range, in the search for the diffuse supernova neutrino background. We interpret this signal as a possible indication of dark matter that annihilates dominantly into neutrinos, pointing to a thermal dark matter candidate with $s$-wave annihilation and with mass in the tens of MeV range. This mass scale naturally fits into rich dark sector extensions of the Standard Model. Neutrino experiments, including JUNO, will be able to test this hypothesis in the coming years.","authors":"Alessandro Granelli, Silvia Pascoli, Salvador Rosauro-Alcaraz","nlinked":88,"nref":97,"src":"INSPIRE","html":true},{"id":"3159206","arxiv":"2605.25300","title":"A D_5 Model of Quarks with Explicit CP Violation","first":"Fu","nauth":2,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[2715897]]. Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2751074]] (coupling 0.02, 1 shared references). Closest network paper: [[2932612]] (coupling 0.07, 13 shared references).","score":21.7,"rank":13,"section":"replacement","parts":[0.48,0.06,0.19,0.0,0.0],"abstract":"The hierarchy of fermion masses and mixings lacks a self-consistent theoretical explanation at the dynamical or symmetry level, and the origin of CP violation remains unclear. These two issues have long been major challenges in particle physics. In this paper, we investigate the quark sector of a four-Higgs-doublet model with an exact D_5 symmetry. Within the framework of explicit CP violation, we consider the most general real vacuum, and perform a numerical fit of the quark mass spectrum and the CKM matrix using a Differential Evolution. We demonstrate that the model achieves an excellent overall goodness of fit with χ^2 = 6.97, and the Jarlskog invariant J_{CP} = 3.144 \\times 10^{-5} agrees with the experimental value within 0.19σ. This indicates that the new source of CP violation provided by the model is consistent to generate the observed CP violation in the quark sector. Moreover, the hierarchies inherent in the vacuum expectation values and the quark Yukawa couplings naturally explain the observed hierarchy of the quark masses and mixing parameters.","authors":"Dong-Ping Fu, Michihisa Takeuchi","nlinked":43,"nref":49,"src":"INSPIRE","html":true},{"id":"","arxiv":"2610.39858","title":"Spontaneous CP violation and leptogenesis in minimal flavour models","first":"Câmara","nauth":3,"year":2026,"cites":0,"role":"today","note":"Closest of your papers: [[3184726]] (coupling 0.05, 11 shared references). Closest network paper: [[3088651]] (coupling 0.31, 87 shared references). Shared topics: neutrino mass, majorana mass.","score":21.6,"rank":14,"section":"new","parts":[0.0,0.17,0.88,0.0,0.34],"abstract":"We consider a type-I seesaw framework extended by a scalar singlet whose vacuum expectation value (VEV) breaks CP spontaneously. The singlet VEV phase provides a common origin for low-energy leptonic CP violation and the high energy CP violation needed to generate the observed baryon asymmetry of the Universe (BAU) through leptogenesis. We identify two minimal flavour models based on a discrete $\\mathcal{Z}_4$ symmetry, whose neutrino flavour structure is encoded entirely in the heavy Majorana mass matrix. Both models predict $δ\\simeq 3π/2$, a definite octant for the atmospheric $θ_{23}$ mixing angle, and lower bounds of approximately $60~\\mathrm{meV}$ ($50~\\mathrm{meV}$) on the lightest neutrino mass and the effective Majorana mass $m_{ββ}$ for normal (inverted) ordering, within reach of future neutrinoless double-beta decay searches. We study scalar-singlet assisted leptogenesis in the non-resonant regime, including new decay, scattering, and washout processes involving the heavy scalars, as well as their contributions to the CP asymmetries. By solving the unflavoured Boltzmann equations, we identify the regions of parameter space in which the minimal flavour models successfully account for the observed BAU.","authors":"H. B. Câmara, F. R. Joaquim, J. R. Rocha","nlinked":118,"nref":118,"src":"arXiv source","html":true},{"id":"3220105","arxiv":"2610.37987","title":"Baryon-Number Violating $Λ_c$ Decays from Light-Cone Sum Rules","first":"Mohamed","nauth":1,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[2053590]]. Closest of your papers: [[3130296]] (coupling 0.02, 2 shared references). Closest network paper: [[2051136]] (coupling 0.05, 6 shared references).","score":19.8,"rank":15,"section":"new","parts":[0.45,0.07,0.14,0.0,0.0],"abstract":"Baryon-number-violating decays with missing energy probe new interactions connecting Standard-Model quarks to light invisible fermions. Such signatures can arise from dimension-six operators coupling three quarks to an SM-singlet fermion $χ$, which escapes detection. With a suitable baryon-number assignment for $χ$, total baryon number is conserved while its violation is apparent in the visible sector. We study the exclusive decays $Λ_c\\toπ\\barχ$ and $Λ_c\\to K\\barχ$, determining the required form factors using light-cone sum rules with pion and kaon distribution amplitudes. The calculation includes leading-order two-particle contributions up to twist four and factorisable four-particle terms. Two $Λ_c$ interpolating currents are employed to assess the current dependence. Using single-operator benchmarks based on collider bounds, we obtain branching fractions of order $10^{-7}$ over sizeable parts of the physical region, with uncertainty envelopes reaching $10^{-6}$ in some scenarios. These are indicative estimates within the retained light-cone expansion. We compare with existing chiral-perturbation-theory and QCD-factorisation estimates and discuss experimental prospects. Future data from STCF and Belle II could probe part of the predicted range, while FCC-ee could reach smaller branching fractions.","authors":"Ali Mohamed","nlinked":36,"nref":37,"src":"INSPIRE","html":false},{"id":"3220076","arxiv":"2610.37852","title":"Core-collapse universality for inelastic self-interacting dark matter halos","first":"Batteas","nauth":9,"year":2026,"cites":0,"role":"today","note":"Closest of your papers: [[2964960]] (coupling 0.08, 12 shared references). Closest network paper: [[3214429]] (coupling 0.20, 53 shared references). Shared topics: dark matter.","score":17.9,"rank":16,"section":"cross","parts":[0.0,0.26,0.58,0.0,0.13],"abstract":"We study the gravothermal collapse of inelastic dark matter halos with velocity-dependent elastic and dissipative self-interactions. Within the gravothermal fluid framework, we derive the effective cooling rate for dark matter upscattering to an excited state followed by decay back to the ground state, with emitted states carrying off energy from the halo. We solve the gravothermal fluid equations numerically to simulate spherically symmetric halos over the core-growing and collapse phases of their evolution. While halos with purely elastic self-interactions have universal evolution trajectories, inelastic dark matter halos exhibit much more diversity in their evolution. Nevertheless, inelastic halo dynamics contain a hidden parametric universality from which we derive a semi-analytic formula for calculating the halo collapse time for arbitrary velocity-dependent elastic and inelastic cross sections without the need for simulations.","authors":"Evan Batteas, Alexander Brisebois, Maheen Hemani, Maximilian Heyne, J. Leo Kim, Lukas Lehmann, Laura Sagunski, Aster Schnell, Sean Tulin","nlinked":87,"nref":98,"src":"INSPIRE","html":true},{"id":"","arxiv":"2610.40064","title":"At the EDGES of MADness: phenomenology of relic millicharged atomic dark matter","first":"Vanzan","nauth":3,"year":2026,"cites":0,"role":"today","note":"Closest of your papers: [[2856850]] (coupling 0.04, 5 shared references). Closest network paper: [[2688651]] (coupling 0.12, 16 shared references). Shared topics: viable region, dark matter abundance, dark sector, dark matter.","score":15.5,"rank":17,"section":"cross","parts":[0.0,0.11,0.34,0.0,0.72],"abstract":"Millicharged dark matter lives in a corner of parameter space that has been considerably shrinking over the past decades, due to constraints from cosmology, astrophysical systems, and ground-based experiments. A particularly interesting probe is the 21-cm absorption signal at Cosmic Dawn, which attracted interest in light of the EDGES claim: the reported excess absorption can be explained by millicharged dark matter with a fractional electric charge of~$10^{-6} \\lesssim ε\\lesssim 10^{-4}$, but it must be a subpercent of the total dark matter abundance to remain consistent with the cosmic microwave background (CMB). We show that very low fractions of millicharged dark matter naturally arise from atomic dark matter: a dark sector model that replicates the physics of standard atomic hydrogen. Dark ions undergo the process of dark recombination, leaving a relic ionized component that, in the presence of kinetic mixing, is naturally millicharged. We modify the cosmological Boltzmann solver CLASS to incorporate this scenario, and we investigate the parameter space of millicharged atomic dark matter (MAD) that is allowed by CMB, large-scale structure, and supernovae data. We find there are cosmologically viable regions of MAD parameter space that are consistent with laboratory and astrophysical bounds and also overlap with the EDGES-defined window. Although the EDGES result is likely not a Cosmic Dawn signal, MAD leaves distinctive cosmological signatures, accessible to upcoming 21-cm observations.","authors":"Eleonora Vanzan, Kimberly K. Boddy, Ely D. Kovetz","nlinked":77,"nref":78,"src":"arXiv source","html":true},{"id":"","arxiv":"2610.39930","title":"Sleptons Masses in the Minimal Supersymmetric $SU(3)_{C}\\times SU(3)_{L}\\times U(1)_{N}$ Model","first":"Rodriguez","nauth":1,"year":2026,"cites":0,"role":"today","note":"Closest of your papers: [[731108]] (coupling 0.14, 7 shared references). Closest network paper: [[1960293]] (coupling 0.10, 5 shared references).","score":15.4,"rank":18,"section":"new","parts":[0.0,0.37,0.29,0.0,0.0],"abstract":"We present the mass spectrum of the sleptons in the Minimal Supersymmetric $SU(3)_{C}\\times SU(3)_{L}\\times U(1)_{N}$ Model, when all the usual neutral scalars fields obtain vacuum expectation values. In this model, we can define $R$-Parity conservation, where our superpotential respect the invariance of the quantum number ${\\cal F} \\equiv B+L$, where $B$ is the baryon number while $L$ is the total lepton number.","authors":"M. C. Rodriguez","nlinked":43,"nref":51,"src":"arXiv source","html":true},{"id":"2959031","arxiv":"2508.08238","title":"Closing the Mass Window for Stupendously Large Black Holes","first":"Gerlach","nauth":4,"year":2026,"cites":0,"role":"repl","note":"Closest of your papers: [[1941263]] (coupling 0.04, 7 shared references). Closest network paper: [[2747842]] (coupling 0.16, 30 shared references). Shared topics: primordial black hole, dark matter.","score":14.0,"rank":19,"section":"replacement","parts":[0.0,0.11,0.45,0.0,0.4],"abstract":"We show that primordial black holes (PBHs) in the $\\textit{Stupendously Large Black Hole}$ mass range ($M \\gtrsim 10^{11}\\,M_\\odot$) produce isocurvature perturbations exceeding current $\\textit{Planck}$ Cosmic Microwave Background limits, thereby excluding them as a significant dark matter component.","authors":"Christopher Gerlach, Yann Gouttenoire, Antonio J. Iovino, Nicholas Leister","nlinked":78,"nref":82,"src":"INSPIRE","html":true},{"id":"3168770","arxiv":"2606.16099","title":"LIGO, LISA and Ultralight Axion-like Dark Matter","first":"Krauss","nauth":1,"year":2026,"cites":0,"role":"repl","note":"Closest of your papers: [[1955022]] (coupling 0.08, 7 shared references). Closest network paper: [[2739891]] (coupling 0.11, 8 shared references). Shared topics: dark matter.","score":13.7,"rank":20,"section":"replacement","parts":[0.0,0.25,0.33,0.0,0.13],"abstract":"Interferometric searches for axion-like dark matter (ALP DM) via the induced photon birefringence in a coherent background have been proposed and analyzed by several authors over the past decade, with tabletop experiments (LIDA, ADBC, DANCE) reporting first results and detailed calculations available for both ground-based (LIGO, GEO600 via DarkGEO) and space-based (LISA, TianQin, Taiji, BBO via Gué et al. and Yao et al.) gravitational-wave detectors. We revisit this class of measurements within the framework of Krauss (2019), and provide a detailed treatment of the interplay between the DM coherence length $λ_{\\rm coh}$, the interferometer arm length $L$, and the detector transfer function, with attention to the distinct suppression regimes $λ_{\\rm coh} > L$ (cancellation) and $λ_{\\rm coh} < L$ (random walk). For LIGO the sensitivity is set by the Fabry-Pérot arm cavity response peaking sharply near the cavity free spectral range, reproducing the results of Nagano et al.; the naive single-pass estimate substantially overstates the reach and cannot be applied directly. For LISA, with the polarization-sensitive modification proposed by Gué et al. or Yao et al., the natural mass range $m_a \\sim 4\\times10^{-19}$--$4\\times10^{-16}$ eV (LISA science band) is accessible and the projected reach $g_{aγγ}\\lesssim {\\rm few}\\times 10^{-13}$ GeV$^{-1}$ (realistic optical-metrology noise) improves on the CAST bound over most of the band by up to about two orders of magnitude. We discuss directional signatures from the Galactic DM wind, both annual and sidereal, as a discrimination tool for candidate signals. Local DM substructure with anisotropic velocity dispersion can shift and enhance the reach in specific mass windows.","authors":"Lawrence M. Krauss","nlinked":18,"nref":20,"src":"INSPIRE","html":true},{"id":"","arxiv":"2610.40629","title":"A Lighter QCD-Axion from Small Instantons","first":"Bera","nauth":3,"year":2026,"cites":0,"role":"today","note":"Closest of your papers: [[1941263]] (coupling 0.08, 14 shared references). Closest network paper: [[1783234]] (coupling 0.13, 36 shared references).","score":13.2,"rank":21,"section":"new","parts":[0.0,0.26,0.36,0.0,0.0],"abstract":"We propose models where the QCD axion mass can be much smaller than the standard expectation. We show that this is possible in models where both QCD and the Standard Model flavor structure get modified in the ultraviolet (UV). In these models, both the axion mass and the up-quark Yukawa can receive sizeable non-perturbative contributions from instantons in the UV. If both these effects are carefully taken into account, the QCD axion is not necessarily heavier than usual expectations and can, in fact, be much lighter. We show that if small instanton contributions account for a large fraction of the up-quark Yukawa, the QCD axion can be lighter than standard expectations whereas it is heavier otherwise. We propose two different models where this condition is realised: (1) one where the QCD gauge group emerges as a subgroup from a product of $SU(3)$ groups in the UV; and (2) a composite Higgs model that also implements partial compositeness. In both these models the QCD axion can lie not only in the region to the right of the QCD axion band but also far to its left. This is especially relevant for a range of proposed haloscope and helioscope experiments that will probe a region mostly to the left of the QCD band.","authors":"Sourav Bera, Susobhan Chattopadhyay, Rick S. Gupta","nlinked":68,"nref":77,"src":"arXiv source","html":true},{"id":"2878706","arxiv":"2502.07539","title":"Neutralino dark matter in gauge mediation","first":"Takeuchi","nauth":3,"year":2026,"cites":0,"role":"repl","note":"Closest of your papers: [[1655573]] (coupling 0.04, 3 shared references). Closest network paper: [[2744388]] (coupling 0.07, 14 shared references). Shared topics: dark matter scenario, dark matter candidate, direct detection, direct detection experiment, dark matter.","score":13.2,"rank":22,"section":"replacement","parts":[0.0,0.11,0.19,0.0,0.7],"abstract":"We explore the potential of neutralino dark matter within the framework of gauge-mediated supersymmetry (SUSY) breaking. Gauge mediation offers an advantage over gravity mediation, as SUSY CP/flavor problems are avoided more easily, leading to significantly milder fine-tuning for electroweak symmetry-breaking compared to gravity mediation. In our models, the lightest neutralino, as the lightest SUSY particle (LSP), is a viable dark matter candidate, assuming a gravitino mass of $\\mathcal{O}(100)~\\mathrm{TeV}$. The models are formulated in five-dimensional space-time, where the SUSY breaking field and the matter fields are placed on separate branes to avoid issues related to flavor and CP violation, and the radion is stabilized by a supersymmetric Goldberger--Wise mechanism. Four distinct neutralino dark matter scenarios are studied: bino-wino coannihilation, higgsino dark matter, wino dark matter, and entropy-diluted bino dark matter. For each case, we determine the allowed parameter spaces and evaluate their consistency with existing experimental limits. Additionally, we examine the potential for testing these models through future investigations at the High-Luminosity Large Hadron Collider (HL-LHC) and through dark matter direct detection experiments.","authors":"Michihisa Takeuchi, Norimi Yokozaki, Junhao Zhu","nlinked":73,"nref":77,"src":"INSPIRE","html":true},{"id":"3152725","arxiv":"2605.05295","title":"Ultraviolet completion of Starobinsky inflation","first":"Antoniadis","nauth":3,"year":2026,"cites":0,"role":"repl","note":"Closest of your papers: [[1655573]] (coupling 0.13, 9 shared references). Closest network paper: [[2898434]] (coupling 0.07, 5 shared references).","score":12.8,"rank":23,"section":"replacement","parts":[0.0,0.33,0.2,0.0,0.0],"abstract":"We construct an $N=1$ supergravity action whose bosonic part contains an arbitrary function of the scalar curvature, the so-called $F(R)$ gravity. As in $R+R^2$ supergravity, it can be described in terms of two chiral superfields of no-scale supergravity: one contains the scalaron which plays the role of the Starobinsky inflaton and the other contains the goldstone fermion of spontaneously broken supersymmetry during the inflation plateau. Its (complex) scalar component acquires a non-tachyonic mass in the presence of the string dilaton and can be set to zero, together with the pseudoscalar partner of the scalaron, so that the scalar potential is reduced to the one of $F(R)$ gravity. In a perturbative expansion in powers of $R$, one obtains a small deformation of the Starobinsky cosmological model that solves the problem of initial conditions within the validity of the effective field theory, below the scale of tower of states predicted by the swampland distance conjecture. We also show that a particular example of an underlying microscopic theory with such properties is provided by a four-dimensional heterotic string model containing the Standard Model of particle physics.","authors":"Ignatios Antoniadis, Chrysoula Markou, Dimitri V. Nanopoulos","nlinked":59,"nref":62,"src":"INSPIRE","html":true},{"id":"3220257","arxiv":"2610.38734","title":"Neutrino electromagnetic properties after the first $pp$ solar neutrino observation at XENONnT","first":"Romeri","nauth":4,"year":2026,"cites":0,"role":"today","note":"Closest of your papers: [[3130296]] (coupling 0.07, 11 shared references). Closest network paper: [[3095306]] (coupling 0.12, 11 shared references). Shared topics: dark matter.","score":12.3,"rank":24,"section":"new","parts":[0.0,0.2,0.34,0.0,0.13],"abstract":"The XENONnT Collaboration has recently reported the first measurement of low-energy solar neutrinos through elastic neutrino-electron scattering in a dark matter detector, opening a new window on Standard Model predictions and on neutrino electromagnetic properties. We analyze these data to extract the $pp$ neutrino flux normalization and the weak mixing angle at low momentum transfer ($\\sim 0.1$ MeV). We also derive bounds on the neutrino charge radii, magnetic moments, and millicharges, as well as on the sterile-neutrino dipole portal. Since the $pp$-flux determination displays a mild excess, we further investigate the role of the $^{14}$C background in the fit and assess how it affects the extracted parameters. Our results show that dark matter detectors now offer a probe of neutrino physics that is complementary to dedicated precision experiments.","authors":"Valentina De Romeri, Dimitrios K. Papoulias, Federica Pompa, Christoph A. Ternes","nlinked":103,"nref":111,"src":"INSPIRE","html":true},{"id":"","arxiv":"2610.39881","title":"Looking for gravitational waves with orbital dynamics: GUEST mission and the $μ$Hz band of Gravitational Waves","first":"Blas","nauth":1,"year":2026,"cites":0,"role":"today","note":"Closest of your papers: [[2787890]] (coupling 0.04, 4 shared references). Closest network paper: [[2771132]] (coupling 0.09, 6 shared references). Shared topics: primordial black hole, dark matter, early universe.","score":11.8,"rank":25,"section":"cross","parts":[0.0,0.1,0.27,0.0,0.48],"abstract":"`Adding colour'' to the gravitational-wave sky by probing unexplored frequency bands has the potential to unveil new and unexpected phenomena in the Universe. The microhertz band, between pulsar timing arrays and LISA, is a particularly attractive target: it should host the extension of the signal recently found by pulsar timing arrays (if it is generated by a family of sources of gravitational waves), and it may harbour signals from the early Universe, primordial black holes or dark matter. In these proceedings, we review how the orbits of gravitationally bound systems act as resonant detectors of microhertz gravitational waves and ultra-light dark matter. We then describe GUEST (Gravitational Universe Exploration with Satellite Tracking), a mission concept recently proposed to the ESA F-class call, consisting of two dense passive spheres covered with retroreflectors, placed in highly eccentric Earth orbits and tracked by a global laser-ranging network.","authors":"Diego Blas","nlinked":29,"nref":30,"src":"arXiv source","html":true},{"id":"3154143","arxiv":"2605.08501","title":"Lepton Flavor Violating Higgs decays at the Compact Linear Collider","first":"Garay","nauth":3,"year":2026,"cites":0,"role":"repl","note":"Closest of your papers: [[1402978]] (coupling 0.08, 4 shared references). Closest network paper: [[2069870]] (coupling 0.06, 5 shared references). Shared topics: lepton flavor violation.","score":11.6,"rank":26,"section":"replacement","parts":[0.0,0.21,0.18,0.0,0.28],"abstract":"Lepton flavor violating Higgs decays could appear in scenarios beyond the Standard Model of particle physics. In this article, we study the sensitivity of a future Compact Linear Collider (CLIC) to such processes, namely, $h\\rightarrow eμ$, $h\\rightarrowτμ$, and $h\\rightarrow eτ$. In the absence of any observation, 95\\% CL\\ upper limits in the region of $10^{-4}$ to $10^{-5}$ could be placed on the branching fractions of these processes, assuming integrated luminosities of $4$\\,ab$^{-1}$ at $\\sqrt{s}=1.4$ TeV and $5$\\,ab$^{-1}$ at $\\sqrt{s}=3$ TeV.","authors":"Francisca Garay, Gabriel Vega, Philipp Roloff","nlinked":49,"nref":55,"src":"INSPIRE","html":true},{"id":"3215097","arxiv":"2610.19440","title":"Magnetically Charged Black Holes from Grand Unified Theory","first":"Vachaspati","nauth":2,"year":2026,"cites":0,"role":"repl","note":"Closest of your papers: [[2690106]] (coupling 0.01, 1 shared references). Closest network paper: [[3085475]] (coupling 0.07, 4 shared references). Shared topics: hawking evaporation, discrete symmetry.","score":10.5,"rank":27,"section":"replacement","parts":[0.0,0.03,0.2,0.0,0.65],"abstract":"Grand Unified models of particle physics inevitably give rise to magnetic monopoles. Often the model will also contain a weakly broken discrete symmetry that leads to the formation of biased domain walls that survive for a limited period in cosmology. For a range of the discrete symmetry breaking parameter, domain walls can collapse to form magnetically charged extremal black holes lighter than $\\simeq 1\\, {\\rm kg}$ but these are not expected to survive until the present epoch due to Hawking evaporation and Schwinger pair production of monopoles. If the parameter is smaller still, the black holes may be astrophysical, with mass greater than $10^{15}\\, {\\rm g}$ and with sub-extremal magnetic charge: $Q \\simeq 10^8$ (for our canonical choice of parameters). The cosmological energy density in residual magnetic monopoles depends on the discrete symmetry breaking parameter and for sufficiently small values of the parameter, the magnetic monopole density can satisfy all observational constraints.","authors":"Tanmay Vachaspati, Anja Wachowitz","nlinked":37,"nref":37,"src":"INSPIRE","html":true},{"id":"3198462","arxiv":"2609.00692","title":"Flavor-Violating Higgs and Top Decays in the Type 1B Flavorful Two-Higgs-Doublet Model with a Twist","first":"Hou","nauth":6,"year":2026,"cites":0,"role":"repl","note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1402978]] (coupling 0.06, 3 shared references). Closest network paper: [[2940264]] (coupling 0.07, 8 shared references).","score":10.4,"rank":28,"section":"replacement","parts":[0.06,0.18,0.19,0.0,0.0],"abstract":"We study flavor-violating decays of the SM-like Higgs boson and rare top decays in the Type 1B realization of the flavorful two-Higgs-doublet model with a twist, focusing on $h\\to sb$, $h\\to db$, $h\\to uc$, $h\\toμτ$, $h\\to eτ$, $h\\to eμ$, $t\\to ch$, and $t\\to uh$. We present the relevant amplitude and branching-ratio formulae, include one-loop vertex corrections, and impose constraints from Higgs signal-strength measurements, electroweak precision tests, meson mixing, $B\\to X_sγ$, direct HFV searches and CLFV constraints, including $μ-e$ conversion. The surviving parameter space favors $\\mathrm{BR}(h\\to sb)\\gg\\mathrm{BR}(h\\to db)$, $\\mathrm{BR}(t\\to ch)\\gg\\mathrm{BR}(t\\to uh)$, and $\\mathrm{BR}(h\\toμτ)\\gg\\mathrm{BR}(h\\to eτ)\\sim\\mathrm{BR}(h\\to eμ)$ in the lepton sector. One-loop effects usually preserve these hierarchies, but can modify individual channels through different mechanisms: sizable destructive tree--loop interference can reduce $h\\to sb$ enough to yield rare $\\mathrm{BR}_{\\mathrm{1L}}(h\\to db)>\\mathrm{BR}_{\\mathrm{1L}}(h\\to sb)$ points, whereas the large relative corrections found in rare top decays mainly reflect strong SM-like alignment suppressing the tree-level amplitudes.","authors":"Ti-Bin Hou, Zheng Li, Yu-Ju Peng, Jin-Lei Yang, Hao-Ran Ma, Tai-Fu Feng","nlinked":48,"nref":48,"src":"INSPIRE
