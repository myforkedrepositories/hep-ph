the low energy limit. Gravitational baryogenesis depends on $\\dot{R}$ and requires $\\dot{R} <0$. This condition is satisfied for the GB and GR regimes. However, $\\dot{R}>0$ for the RS regime and successful baryogenesis requires either that the decoupling temperature occurs during the GB regime or that the Universe makes a direct transition from the GB regime to the GR regime. The GB baryon asymmetry $η(T)$ is proportional to $μ(1+w)(1-w)(1+1/β)$, where $μ$ is the energy scale $μ\\equiv 1/l$ associated with the bulk curvature scale $l$, $β\\equiv 4 αμ^{2}$, where $α$ is the GB coupling, and $w$ is the equation of state parameter $p=w ρ$. Studies of inflation in GB-braneworld cosmology place constraints on the allowed ranges of the parameters $μ$ and $β$. Guided by these, the asymmetry has been calculated for ranges of $(μ, β, w)$ and it is found that the observed values can be obtained for a value of $β$ within the range $(10^{-2} - 10^{-3})$ for $μ=10^{12}$ GeV, and within the range $(10^{-1}- 10^{-2})$ for $μ=10^{13}$ GeV. All values of $η$ for $μ=10^{14}$ are too high. In contrast to GR where $η$ is zero for a radiation dominated Universe ($w=1/3$), it is non-zero in GB braneworld cosmology."},{"arxiv":"2610.37764","id":"3220077","title":"Circular Axion String Loop Simulations: Field Theory and Effective Description","authors":"Mathieu Kaltschmidt, Javier Redondo, Ivan Rybak, Kenichi Saikawa, Iker Sanz-González","score":9.7,"section":"new","rank":30,"parts":[0.0,0.09,0.34,0.0,0.18],"note":"Closest of your papers: [[1941263]] (coupling 0.03, 5 shared references). Closest network paper: [[2154677]] (coupling 0.12, 15 shared references). Shared topics: complex scalar.","abstract":"An accurate description of axion strings and their radiation is crucial for understanding their cosmological implications. Motivated by the differing conclusions of previous works, we study a simple, controlled setup: the collapse of an initially static circular loop in a Minkowski background. We compare field-theory simulations of the conventional complex scalar and high-tension Klaer--Moore models with solutions of the renormalised Nambu--Goto--Kalb--Ramond (NGKR) equation of motion, covering the range $3 \\lesssim \\mathcal{T} \\lesssim 100$ in dimensionless string tension. Both the field theory and NGKR approach the Nambu--Goto (NG) limit with corrections scaling as $1/\\mathcal{T}$. However, the leading correction to the halving-time is $20-35\\%$ larger in NGKR than in the field-theory simulations over the same range of tensions, while for large tensions the value agrees with an independent perturbative calculation to $0.2\\%$. The late-time axion spectrum agrees with NGKR in the infrared, but the collapse generates additional structure in the ultraviolet part of the spectrum, which we attribute to different events such as an outgoing wave front that carries a sizable fraction of the energy or the rebound of the initial loop. These results provide a useful benchmark for a more accurate understanding of axion radiation from cosmological string networks."},{"arxiv":"2610.38932","id":"","title":"Hunting for Long-Lived ALPs in Top Events via Displaced Dielectron Pairs at the LHC","authors":"Juliette Alimena, Freya Blekman, Cesare Cazzaniga, Xabier Cid Vidal, Jeremi Niedziela, Lovisa Rygaard, Rosalia Soto Rey","score":9.7,"section":"new","rank":31,"parts":[0.0,0.07,0.22,0.0,0.43],"note":"Closest of your papers: [[1455793]] (coupling 0.02, 2 shared references). Closest network paper: [[3095771]] (coupling 0.08, 4 shared references). Shared topics: mass below.","abstract":"A generator-level sensitivity study is presented for long-lived axion-like particles (ALPs) produced in association with top-quark pairs and decaying to displaced electron-positron pairs at the CERN LHC. The prompt objects from the top quark-antiquark system provide independent handles for event selection, allowing the event to be selected independently of the displaced electron pair and extending the search to ALP masses below the dimuon threshold. A search strategy motivated by the CMS detector is developed for ALP masses between 17 MeV and 10 GeV and proper decay lengths between 0.1 mm and 1 m. Expected upper limits at 95% confidence level are computed for $σ(pp\\to t\\bar t a)\\times\\mathcal{B}(a\\to e^+e^-)$ as a function of the ALP mass and proper decay length. In the most sensitive region of the parameter space considered, values of the cross section times branching fraction of order $10^{-3}$ pb can be probed for an integrated luminosity of 500 fb$^{-1}$ at $\\sqrt{s}=13$ TeV. These projections do not include detector-level displaced-electron reconstruction or instrumental backgrounds."},{"arxiv":"2507.22124","id":"2955520","title":"Supernova cooling from neutrino-devouring dark matter","authors":"Yugen Lin, Chih-Ting Lu, Ningqiang Song","score":9.6,"section":"replacement","rank":32,"parts":[0.0,0.05,0.12,0.0,0.64],"note":"Closest of your papers: [[1607572]] (coupling 0.01, 1 shared references). Closest network paper: [[3161778]] (coupling 0.04, 6 shared references). Shared topics: fermionic dark matter, direct detection, direct detection experiment, dark matter.","abstract":"Supernova cooling provides a powerful probe of physics beyond the Standard Model (SM), in particular for new, light states interacting feebly with SM particles. In this \\textit{Letter}, we investigate for the first time the production of fermionic dark matter (DM) via the neutrino-devouring process inside a core-collapse supernova, which contributes to the excessive cooling of the supernova. By incorporating state-of-the-art supernova simulation data and the full time evolution information, we derive stringent and robust limits on DM interactions, which can improve upon direct detection limits by several orders of magnitude. We exclude the cross sections down to $10^{-51}-10^{-58}$~cm$^2$ in the keV-MeV mass range for DM-electron scattering, and $10^{-49}-10^{-56}$~cm$^2$ in the 0.1-100~MeV mass range for DM-nucleon scattering, supplemented by complementary constraints from cosmology, astrophysics, colliders and direct detection experiments in the larger cross section regime. We also close almost the entire window in which fermionic DM constitutes $\\mathcal{O}(1)$ fraction of DM due to its coupling to electrons in the keV-MeV mass range."},{"arxiv":"2605.04621","id":"3152356","title":"Molien--Weyl Singlet Counting and BFSS$_2$--Factorization in Gaussian Matrix Quantum Mechanics","authors":"Badis Ydri","score":9.1,"section":"replacement","rank":33,"parts":[0.0,0.15,0.31,0.0,0.0],"note":"Closest of your papers: [[636564]] (coupling 0.05, 3 shared references). Closest network paper: [[606952]] (coupling 0.11, 9 shared references).","abstract":"We study the singlet-sector structure of mass-deformed BFSS$_{d+1}$ matrix quantum mechanics by combining the large--\\(d\\) Gaussian reduction with the Molien--Weyl projection. The Gaussian reduction captures the bulk matrix dynamics through a gauged harmonic oscillator, while the Molien--Weyl integral imposes the Gauss law and reorganizes the physical Hilbert space into holonomy-projected singlet excitations. We show that the very-low-temperature bosonic singlet spectrum is universally controlled by the quadratic Gram operators \\(\\Tr(X_aX_b)\\), whose number is \\(d(d+1)/2\\). For \\(N=2\\), this result is established by explicit residue computations and character methods; for \\(N>2\\), it is supported by the character analysis. Thus the infrared spectrum begins as a collection of BFSS$_2$--like Gram towers, although higher invariant structures generally modify the full partition function. We also give a Hamiltonian derivation of the exceptional exact factorization at \\((d,N)=(2,2)\\), where the BFSS$_3$ singlet partition function equals the cube of the BFSS$_2$ one for all temperatures. This rigidity is special to the \\(SU(2)\\) invariant tensor structure and distinguishes exact singlet factorization from the possibility of smooth deconfinement--like holonomy crossovers at finite $N$. Finally, we extend the Gram-counting picture to supersymmetric BFSS/BMN models and indicate how the Molien--Weyl formulation can benchmark Monte Carlo simulations in both \\(X_a\\)-space and holonomy space."},{"arxiv":"2610.40020","id":"","title":"Phenomenological implications of cosmic (super)strings with time-varying tension","authors":"Anastasios Avgoustidis, Edmund J. Copeland, Adam Moss, Juhan Raidal, Filippo Revello, Gonzalo Villa","score":8.5,"section":"cross","rank":34,"parts":[0.0,0.08,0.32,0.0,0.13],"note":"Closest of your papers: [[2787890]] (coupling 0.03, 6 shared references). Closest network paper: [[2825297]] (coupling 0.11, 16 shared references). Shared topics: early universe.","abstract":"Cosmic strings and cosmic superstrings could have formed in the early universe. In a particular class of models, the tension associated with these defects is time dependent, either because the strings themselves are composed of evolving moduli fields, or because they are directly coupled to evolving scalar fields leading to an effective time dependence in the string tension. Here we take seriously the possibility of this time dependence and investigate the phenomenological consequences of such an evolution, comparing the results to the more traditional case of a fixed time independent tension. In particular, for five different time varying models, motivated by different possible forms of evolution of the string tension, we evaluate their Gravitational Wave (GW) contributions as well as their impact on the Cosmic Microwave Background (CMB). Performing an MCMC analysis of the models we find there are indeed interesting spectral signatures in the GW emission at frequencies between the current PTA and interferometer data, but the signatures are not unique to these strings, making them hard to pin down using current data. However, we do find cosmic strings with evolving tension fit the GW data as well as other favoured models."},{"arxiv":"2610.38705","id":"3220224","title":"How natural are Froggatt-Nielsen Models?","authors":"Gero von Gersdorff, Lucas Modesto","score":7.9,"section":"new","rank":35,"parts":[0.06,0.11,0.17,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1222142]] (coupling 0.04, 3 shared references). Closest network paper: [[2762216]] (coupling 0.06, 9 shared references).","abstract":"The Froggatt-Nielsen (FN) mechanism aims at a natural explanation of the surprising hierarchical structure of the masses and mixings of Standard Model quarks and leptons. We test this claimed naturalness against various known and some original measures of fine-tuning, including various local measures as well as Bayes fac- tors. The FN models serve as a fruitful laboratory for testing and comparing these measures. We find that the standard Barbieri-Giudice metric is overestimating nat- uralness in many cases, as it does not sufficiently account for the failure of a model to be realized at order-one parameter values, even though the latter are favoured by an appropriate prior distribution. As a side product of our study, we present simple geometric expressions for the posterior distributions of the parameters on the manifold of best-fit values."},{"arxiv":"2610.39579","id":"","title":"Cosmological constraints on extra radiation and early dark energy with lepton asymmetry and varying quark masses","authors":"Yo Toda","score":7.7,"section":"cross","rank":36,"parts":[0.0,0.03,0.16,0.0,0.42],"note":"Closest of your papers: [[1755250]] (coupling 0.01, 2 shared references). Closest network paper: [[2051195]] (coupling 0.06, 23 shared references). Shared topics: big bang nucleosynthesis, neutrino mass.","abstract":"We investigate cosmological constraints on extra radiation and axionlike early dark energy (EDE), allowing primordial lepton asymmetry or light-quark-mass variation during big bang nucleosynthesis (BBN). We combine Planck CMB, DESI DR2 BAO, Pantheon+ supernovae, and primordial helium and deuterium measurements. When both extra radiation and lepton asymmetry are allowed, we obtain $N_{\\rm eff}=3.27\\pm0.16$, $ξ=0.017\\pm0.011$, and $H_0=69.24\\pm0.92\\,{\\rm km\\,s^{-1}\\,Mpc^{-1}}$. A positive lepton asymmetry compensates the helium increase caused by extra radiation, allowing a higher inferred Hubble constant even with the LBT helium measurement, which agrees with standard BBN. For EDE, primordial-abundance measurements instead restrict the higher baryon densities associated with larger EDE fractions, which reduce the predicted deuterium abundance. Allowing lepton asymmetry does not relax this restriction. In contrast, a positive light-quark-mass variation increases deuterium and compensates this reduction, permitting larger EDE fractions and a higher inferred Hubble constant. The same variation leaves the extra-radiation constraint nearly unchanged. We also find that allowing lepton asymmetry relaxes the 95\\% upper limit on the summed neutrino mass from $0.0640\\,{\\rm eV}$ to $0.0777\\,{\\rm eV}$ in the extra-radiation model."},{"arxiv":"2610.39473","id":"","title":"Cosmological axion-photon interactions with a nonminimal dark gauge sector","authors":"Hao Jiao, Dong-Won Jung, Nils A. Nilsson","score":7.6,"section":"cross","rank":37,"parts":[0.0,0.15,0.21,0.0,0.0],"note":"Closest of your papers: [[1941263]] (coupling 0.05, 8 shared references). Closest network paper: [[2810207]] (coupling 0.07, 16 shared references).","abstract":"We study the cosmological evolution of radiation and dark radiation with nonminimal axion-photon-dark photon couplings. The Chern-Simons-type axion-gauge field interactions between the dark and visible sectors can induce energy conversion between photons and dark photons as well as polarization rotation during the propagation of radiation, leading to CMB spectral distortions and cosmic birefringence. Using the observed CMB monopole spectrum, we constrain the photon-dark photon energy conversion fraction, which is determined by the coupling constants and the evolution of the axion field. We further show that the parity-odd mixing interaction $φF\\tilde{B}$ can partially relax the constraints on the standard axion-photon coupling, $φF\\tilde{F}$, derived from the current observational limits of the cosmic birefringence angle."},{"arxiv":"2605.08338","id":"3154205","title":"Revisiting predictions for cosmic-ray antinucleon fluxes from Galactic Dark Matter","authors":"Lorenzo Stefanuto, Mattia Di Mauro, Fiorenza Donato, Nicolao Fornengo, Jordan Koechler, David Maurin","score":7.5,"section":"replacement","rank":38,"parts":[0.0,0.11,0.2,0.0,0.13],"note":"Closest of your papers: [[860906]] (coupling 0.04, 3 shared references). Closest network paper: [[2795517]] (coupling 0.07, 41 shared references). Shared topics: dark matter.","abstract":"The data on cosmic antiprotons have reached an outstanding precision on energies spanning from GeV to hundreds of TeV, thanks to the space-based AMS-02 experiment. The balloon-borne GAPS experiment, which just completed its first Antarctic flight, will address antiproton and antideuteron fluxes well below GeV energies. Antinuclei in cosmic rays, as well as being produced by spallation reactions between cosmic-ray nuclei and the atoms of the interstellar medium, may hide contributions from exotic sources, such as particle dark matter annihilation in the Galaxy. In this paper, we present predictions for cosmic antiproton, antideuteron and antihelium fluxes both from secondary and dark matter origin. We use state-of-the-art production spectra, nuclear coalescence for antinuclei, and Galactic propagation models to derive upper limits on the dark matter annihilation cross-section from AMS-02 antiproton data in different propagation scenarios (BIG and QUAINT). We quantify the impact of future GAPS data, showing that its sensitivity to sub-GV antiprotons could improve the $\\langleσv\\rangle$ constraints by up to an order of magnitude for light DM ($m_χ \\lesssim 50$ GeV). For heavier antinuclei, the detection perspective with existing and upcoming experiments are derived for those scenarios consistent with AMS-02 antiproton flux. The detectability of such signals strongly depends on the experiment, the propagation model, and the hadronization tuning. Our analysis underscores the complementarity of antinuclei channels for indirect DM searches and the critical role of low-energy windows in constraining light DM candidates."},{"arxiv":"2610.39173","id":"","title":"Stable Electroweak Strings and Nambu Monopoles Nested at Inert-Higgs Interfaces","authors":"Muneto Nitta","score":7.2,"section":"new","rank":39,"parts":[0.0,0.12,0.24,0.0,0.0],"note":"Closest of your papers: [[2690106]] (coupling 0.04, 3 shared references). Closest network paper: [[1674879]] (coupling 0.09, 7 shared references).","abstract":"Electroweak $Z$ strings are generally unstable, and their Nambu-monopole endpoints lack topological protection in the bulk. Using degenerate inert and inert-like Higgs vacua as a solvable reference, we show that their interface supports both defects. The analytic interface carries a normalizable $SU(2)$ relative-orientation field. Its effective theory supports locally stable unit-flux $Z$ strings in a one-vacuum phase and fractional $Z$ strings in a two-vacuum phase. The fractional string carries an $S^2$ orientation field; a Nambu monopole is a second kink between symmetry-related, equal-tension $Z$ strings. We identify phases in which Nambu monopoles are confined or deconfined within the interface: in the confined phase, their $Z$ flux is concentrated into fractional strings, whereas in the deconfined phase, the monopole becomes a vortex within the interface and its $Z$ flux spreads radially through the interface. The electromagnetic magnetic field extends outside the interface in both phases. We determine analytic string profiles, effective-theory stability regions, and the unchanged electromagnetic magnetic charge across this confinement transition."},{"arxiv":"2610.38463","id":"3220160","title":"Gauge-parameter cancellation and finite form factors in one-loop quark scattering in the refined Gribov-Zwanziger framework","authors":"Wan Wu","score":6.9,"section":"new","rank":40,"parts":[0.0,0.07,0.33,0.0,0.0],"note":"Closest of your papers: [[1365306]] (coupling 0.02, 1 shared references). Closest network paper: [[3170413]] (coupling 0.12, 4 shared references).","abstract":"We calculate the one-loop amplitude for distinct-flavor massless quark scattering in a local BRST-invariant refined Gribov-Zwanziger theory with minimally coupled quarks. The constraint determinant and two dynamical quark flavors are included in the action and in the loop sum. Retaining the refined Gribov-Zwanziger masses in the free field matrix, we combine the mixed self-energy insertion, complete vertex and box corrections, and external-leg residues. The difference between a general linear covariant gauge and a reference gauge vanishes symbolically after removal of the Stueckelberg regulator in the specified dimensional prescription. We separate ultraviolet and infrared poles, retaining contributions hidden by scaleless integrals and by the order of mass and dimensional limits. Local modified-minimal-subtraction counterterms close the ultraviolet poles, and the remaining infrared poles cancel in the stated nonzero-mass domain. The finite answer is supplied as eight color-spin form factors over a thirty-entry scalar integral inventory, with all 144 finite-function coefficients provided electronically. The result defines a partonic amplitude on a specified analytic branch; it does not assume colored asymptotic states or establish an inclusive next-to-leading-order cross section."},{"arxiv":"2610.39757","id":"","title":"HWF Analysis of TRN Black Holes","authors":"Ashfaque Ahmad, Sudhir Kumar Gupta, Abbas Ali","score":6.7,"section":"cross","rank":41,"parts":[0.0,0.03,0.22,0.0,0.27],"note":"Closest of your papers: [[2790381]] (coupling 0.01, 1 shared references). Closest network paper: [[2021634]] (coupling 0.08, 8 shared references). Shared topics: turn out.","abstract":"We extend the horizon wave-function (HWF) formalism to a spherically symmetric, charged, spinless quantum source in $\\mathcal{D} + 1$ dimensional spacetime geometry and construct the HWFs associated with inner- as well as outer-horizons of the Tangherlini--Reissner--Nordström (TRN) black hole. The corresponding black hole formation probabilities, $P_{\\rm BH}^{\\pm}$, are also calculated and their sensitivities due to various source parameters including charge, mass, and $\\mathcal{D}$ are analysed as well. Our analysis reveals that the ratio of inner- to outer-horizon probabilities, $P_{\\rm BH}^{-}/P_{\\rm BH}^{+}$, changes drastically from being unity as the source departs away from being in the extremal limit defined by $α$ ($\\to 1$ for extremal case). Furthermore, black hole formation probabilities are found to be highly suppressed for higher values of $\\mathcal{D}$, particularly for the source mass, $m \\lesssim Λ_{\\mathcal{D}}$, e.g., for $α= 0.5$, the ratio, $P_{\\rm BH}^{+}(\\mathcal{D} = 5)/P_{\\rm BH}^{+}(\\mathcal{D}=10)$ turn out to be approximately associated with $\\mathcal{D}$ spatial-dimensions."},{"arxiv":"2511.05839","id":"3081446","title":"Probing Extragalactic Ultralight Axion Dark Matter with Decade-Long Blazar Optical Polarimetry of 1ES 1959+650","authors":"Qiu-Ju Huang, Bao Wang, Jun-Jie Wei, Xue-Feng Wu","score":6.7,"section":"replacement","rank":42,"parts":[0.0,0.1,0.15,0.0,0.13],"note":"Closest of your papers: [[1941263]] (coupling 0.03, 7 shared references). Closest network paper: [[2810207]] (coupling 0.05, 15 shared references). Shared topics: dark matter.","abstract":"Axions or axion-like particles (ALPs) are well-motivated dark matter (DM) candidates whose coupling to photons induces periodic oscillations in the polarization angle of astrophysical light. This work reports the first search for such a signature using 10 years of optical polarimetric monitoring of the blazar 1ES~1959+650. No statistically significant periodicity is detected, determined by a Lomb-Scargle periodogram combined with Monte Carlo analysis. Assuming a central DM density in the host galaxy, this null result places tight upper limits on the ALP-photon coupling constant at $g_{aγ}<(1.3\\times10^{-13}-6.0\\times10^{-10})\\,\\mathrm{GeV}^{-1}$ across a broad ALP mass range of $m_a \\sim (1.4\\times10^{-23}-5.2\\times10^{-20})\\,\\mathrm{eV}$. Assuming a soliton-core DM density, we obtain upper limits of $ g_{aγ}< (2.5\\times10^{-13}-6.2\\times10^{-13})\\,\\mathrm{GeV}^{-1} $ over the same ALP mass range. Our constraints surpass those from Very Long Baseline Array polarimetry of active galactic jets and from polarimetric data of the European Pulsar Timing Array, and are competitive with those from long-term Galactic pulsar timing of PSR J0437-4715 over the same ALP mass window. These results establish long-term blazar polarimetry as a competitive and complementary approach for probing axion-like DM on extragalactic scales."},{"arxiv":"2512.12023","id":"3092736","title":"Melting LHC detectors: A novel search for stopped long-lived particles","authors":"Julia L. Gonski, Peter W. Graham, Surjeet Rajendran, Harikrishnan Ramani, Samuel S. Y. Wong","score":6.6,"section":"replacement","rank":43,"parts":[0.06,0.09,0.13,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1394206]] (coupling 0.03, 3 shared references). Closest network paper: [[2616081]] (coupling 0.05, 9 shared references).","abstract":"Particles at the TeV scale with lifetimes of a year or longer could have been abundantly produced at the LHC yet escaped detection because of backgrounds, and could still be trapped within detector materials. With gluinos in split supersymmetry as a working example, we show that these trapped particles can be recovered from detector materials once prepared in liquid form, for example, by melting silicon detectors, extracting liquid argon from the electromagnetic calorimeter, or constructing a large water pool near ATLAS or CMS. These liquid samples can then be processed using iterative centrifugation followed by mass spectrometry, enabling single-particle sensitivity in macroscopic samples. This method can potentially discover gluinos up to 3 TeV in mass at the HL-LHC. It can also improve upon existing limits for other long-lived particles. For example, it can discover the stop up to 2 TeV, and will also be sensitive to integer-charged particles in the TeV range."},{"arxiv":"2610.38973","id":"","title":"Running cosmological constant in light of recent CMB-BAO data","authors":"A. Racioppi, M. Vijar","score":6.3,"section":"cross","rank":44,"parts":[0.0,0.11,0.2,0.0,0.0],"note":"Closest of your papers: [[2663002]] (coupling 0.04, 7 shared references). Closest network paper: [[2669389]] (coupling 0.07, 11 shared references).","abstract":"We revisit single-field slow-roll inflation driven by a running cosmological constant, i.e. a cosmological constant receiving a logarithmic radiative correction, in light of the latest CMB-BAO data. The relative radiative correction $δ$ is treated as a free parameter of the model and allowed to be positive or negative. For positive $δ$, the predictions interpolate between a logarithmic regime and a linear inflation one. Compatibility with CMB-only data is confined to a narrow stripe near the $2σ$ border where $δ$ is relatively large. On the other hand, the predictions fit easily within the constraints including BAO data in a wide range of parameters. For negative $δ$, the slow-roll approximation breaks down at small field values and the predictions are excluded by data. However, once the effective mass contribution inside the logarithmic correction is taken into account, the negative $δ$ potential develops a local maximum and behaves like a hilltop model, achieving compatibility with CMB-only data, while agreement with CMB-BAO data is possible only at $2σ$."},{"arxiv":"2610.40354","id":"","title":"Two-peak gravitational wave spectra from supercooled two-field phase transitions","authors":"Daniel Araújo, João Gonçalves, Danny Marfatia","score":6.2,"section":"new","rank":45,"parts":[0.0,0.09,0.22,0.0,0.02],"note":"Closest of your papers: [[1854224]] (coupling 0.03, 1 shared references). Closest network paper: [[3191566]] (coupling 0.08, 4 shared references).","abstract":"We study the gravitational wave (GW) spectrum generated by supercooled first-order phase transitions in two-field conformal models. We construct three representative toy models that capture the essential features of these models, derive analytical criteria for the existence of two-step transitions, and show how the two-field dynamics generate a genuine two-peak GW spectrum. We identify regions of parameter space in which two-peak GW spectra are observable at LISA and the Einstein Telescope. By way of illustration, we apply our analysis to a realistic conformal dark SU(3) model."},{"arxiv":"2610.39215","id":"","title":"Nucleon Wave Functions from QCD Vacuum Topology","authors":"Wei-Yang Liu, Ismail Zahed","score":6.1,"section":"new","rank":46,"parts":[0.11,0.04,0.06,0.0,0.0],"note":"Also cites widely used network papers: [[1688995]], [[2817040]]. Closest of your papers: [[1692605]] (coupling 0.01, 2 shared references). Closest network paper: [[3152706]] (coupling 0.02, 2 shared references).","abstract":"Instantons, as topologically nontrivial gauge field configurations, provide a microscopic mechanism for chiral symmetry breaking and the $U_A(1)$ anomaly in QCD. Within the instanton liquid model (ILM), instantons generate multi-fermion interactions governed by their density and size. Using this framework, we develop a microscopic description of the nucleon based on instanton-induced quark--quark correlations. We derive the diquark interaction kernels arising from single instantons and instanton--anti-instanton molecules, revealing a strong attraction in the scalar channel and weaker correlations in the spin-one channels. Embedding these interactions in a covariant, permutation-symmetric Bethe--Salpeter--Faddeev equation yields a nucleon mass $m_N=939.53~{\\rm MeV}$, with a predominantly scalar-diquark component ($98\\%$) and a small axial-vector admixture ($2\\%$) around the mass pole. Despite its small weight, the small admixture generates substantial spin--isospin interference, yielding an axial charge $g_A=1.265$, close to experiment. The resulting covariant amplitude is analytically continued to the light front to obtain the leading three-quark wave function. The corresponding unpolarized, helicity, and transversity parton distributions, along with their QCD-evolved moments, provide a direct connection to lattice QCD calculations and global-fit analyses. Our results show that the topology of the QCD vacuum organizes not only the nucleon mass and spin structure, but also its leading valence partonic content, providing a microscopic foundation for a more complete description including confinement and higher Fock components."},{"arxiv":"2607.08833","id":"3179630","title":"Flavorful Interactions of AGN Neutrinos with Dark Matter Spike","authors":"S. Abbaslu, Y. Farzan, A. Maleki","score":6.1,"section":"replacement","rank":47,"parts":[0.0,0.0,0.12,0.0,0.44],"note":"Closest network paper: [[3070028]] (coupling 0.04, 4 shared references). Shared topics: neutrino mass, dark matter particle, dark matter.","abstract":"IceCube-Gen2 is going to make the dream of precise flavor ratio measurement for high energy cosmic neutrinos a reality. Motivated by this prospect, we build a model for the interaction of neutrinos with the dark matter and study the impact of the neutrino interaction with the dark matter spike around active galactic nuclei on the neutrino flavor ratio measurement. We show that, under certain circumstances, the flavor measurement by IceCube-Gen2 may discriminate between this model and the standard expectation, $(ν_e^\\oplus:ν_μ^\\oplus:ν_τ^\\oplus)\\simeq (1/3:1/3:1/3)$, as well as the prediction for a damped muon source. We discuss how we can derive information about the spike as well as about the characteristics of the dark matter particles composing it by combining the flavor ratio measurements with the results of the terrestrial experiments determining the neutrino mass ordering and a potential deviation from the standard model predictions in the measurements of the tau decay modes."},{"arxiv":"2610.38178","id":"3220136","title":"Vector- and tensor-meson resonance contributions to $χ_{cJ}\\to PPV$ decays","authors":"Yuan-Guo Xu, Qin-Ze Song, Bo Lan, Ru-Min Wang","score":5.8,"section":"new","rank":48,"parts":[0.0,0.0,0.05,0.5,0.0],"note":"Co-authors of yours: Xu. Closest network paper: [[3214449]] (coupling 0.02, 1 shared references).","abstract":"Light vector- and tensor-meson resonance contributions to the three-body decays $χ_{cJ}\\to P_1P_2V$ are studied in a quasi-two-body framework combined with SU(3) flavor relations for the two-body subprocesses, covering both the $χ_{c0,1,2}\\to VV\\to P_1P_2V$ and $χ_{c1,2}\\to TP\\to P_1P_2V$. Both the narrow-width approximation (NWA) and the finite-width effects (FWE) treatment are considered, the latter being essential for tensor subdecays that are kinematically closed at the nominal mass and contribute only through the high-mass tail of the resonance. The predicted resonance bands span several orders of magnitude, with the largest ones in the $ππρ$, $πK\\bar K^{*}$, and $K\\bar Kφ$ final states, whereas the $K\\bar Kω$ and $η'KK^{*}$ channels are dominated by the tensor band and thus provide a clean window onto the $T\\to PV$ tensor resonances. The band-by-band strengths and their ordering are intended as priors and channel priorities for future invariant-mass and amplitude analyses, and can be compared with the measured totals of several channels."}],"refs":{"1674879":{"first":"Wan","year":2018,"nauth":8,"title":"Searches for Dark Matter via Mono-W Production in Inert Doublet Model at the LHC*","role":"other"},"2826987":{"first":"Barman","year":2024,"nauth":3,"title":"Constraining burdened PBHs with gravitational waves","role":"seed"},"2924315":{"first":"Borah","year":2025,"nauth":2,"title":"Unveiling the inert Triplet desert region with a pNGB Dark Matter and its Gravitational Wave signatures","role":"other"},"1783234":{"first":"Di Luzio","year":2020,"nauth":4,"title":"The landscape of QCD axion models","role":"other"},"2051136":{"first":"Barrow","year":2022,"nauth":19,"title":"Theories and Experiments for Testable Baryogenesis Mechanisms: A Snowmass White Paper","role":"other"},"2069870":{"first":"Li","year":2022,"nauth":4,"title":"Scotogenic Dirac neutrino mass models embedded with leptoquarks: one pathway to address the flavor anomalies and the neutrino masses together","role":"other"},"2686887":{"first":"Dutta","year":2023,"nauth":6,"title":"Dark matter phenomenology in 2HDMS in light of the 95 GeV excess","role":"other"},"1744787":{"first":"Centelles Chuliá","year":2019,"nauth":4,"title":"Systematic classification of two loop $d$ = 4 Dirac neutrino mass models and the Diracness-dark matter stability connection","role":"other"},"1688995":{"first":"Tanabashi","year":2018,"nauth":231,"title":"Review of Particle Physics","role":"other"},"3103226":{"first":"Laverda","year":2026,"nauth":3,"title":"Tachyonic gravitational dark matter production after inflation","role":"other"},"1455793":{"first":"von der Pahlen","year":2016,"nauth":4,"title":"Radiative Type III Seesaw Model and its collider phenomenology","role":"seed"},"2762216":{"first":"Ding","year":2024,"nauth":2,"title":"The symmetry approach to quark and lepton masses and mixing","role":"other"},"2964960":{"first":"García-C const plain=s=>String(s).replace(/\$/g,'').replace(/\\([a-zA-Z]+)/g,'$1').replace(/[{}^_]/g,'');
const REFS=RAW.refs||{};
// reasons text: [[INSPIRE id]] becomes 'Author Year' with a pop-up (authors, year, title), like the graph's tooltip
const why=s=>esc(s).replace(/\[\[(\d+)\]\]/g,(m,k)=>{const r=REFS[k];return r?`<span class="ref ${r.role}" tabindex="0" data-ref="${k}">${esc(r.first)} ${r.year}</span>`:m});
const tex=el=>{if(window.MathJax&&MathJax.typesetPromise)MathJax.typesetPromise([el]).then(()=>fold()).catch(()=>{})};
const NEWS=N.filter(isNew).sort((a,b)=>a.rank-b.rank);
document.getElementById('eyebrow').innerHTML=`arXiv ${esc(M.cat)} · <a href="${esc(M.url)}" target="_blank" rel="noopener">${esc(M.date)}</a>`;
document.getElementById('dek').textContent=`${M.nrel} of the ${M.nlist} papers in this listing (${M.counts.new} new, ${M.counts.cross} cross-lists, ${M.counts.replacement} replacements) score ${M.threshold} or more for belonging to the reference and citation network of your ${M.nown} papers and the ${M.next} papers by other authors around them. Highest score first.`;
const T=!!M.topics;   // network file with shared phrases: 35/30/15/10 + 10% shared topics
document.getElementById('foot').innerHTML=`<p><b>Score (0–100).</b> ${T?35:40}% direct citations of network papers (each of your papers counts 1, each other network paper 0.6, network papers with over 1,000 citations 0.06; saturating as 1 − e<sup>−x</sup>); ${T?30:35}% bibliographic coupling with your own papers (idf-weighted cosine of INSPIRE-linked reference sets, best match and mean of the top three, 0.30 = full marks); 15% best coupling with the other network papers (0.35 = full marks); 10% authorship (you, or your co-authors)${T?`; 10% shared topics: technical phrases of two or more words in the title and abstract that your papers and the network use much more often than hep-ph as a whole (each weighted by how much more, saturating as 1 − e<sup>−x/3</sup>)`:''}.</p>
<p><b>Data.</b> Network: INSPIRE records supplied with the project. Listing papers: INSPIRE records where already harvested (${M.onInspire} of ${M.nlist}); for the rest the reference list was read from the arXiv source and matched to INSPIRE by arXiv number, DOI and texkey. Only links between papers on this page are drawn. Built ${esc(M.built)}.</p>`;
const P=['Direct citations','Coupling to your papers','Coupling to network','Authorship','Shared topics'];
const PS=['Citations','Your papers','Network','Authors','Topics'];   // short labels for phones
function list(){const box=document.getElementById('list');
  if(!NEWS.length){box.innerHTML=`<div class="empty">No paper in this listing reaches a score of ${M.threshold}.</div>`;document.getElementById('mainnet').hidden=true;return}
  NEWS.forEach(n=>{const d=document.createElement('article');d.className='paper';d.id='p'+n.i;
    d.innerHTML=`<div class="role" style="color:${col(n)}">#${n.rank} · ${esc(SEC[n.section])} · score ${n.score.toFixed(1)}</div>
    <h2>${esc(n.title)}</h2>
    <div class="authors">${authors(n.authors)} · arXiv:${esc(n.arxiv)}</div>
    <p class="abs">${esc(n.abstract)}</p><button class="linkbtn absmore" type="button" hidden>More</button>
    <p class="why">${why(n.note)}</p>
    <div class="row"><div class="bars">${n.parts.map((v,j)=>`<span><span class="pl">${P[j]}</span><span class="ps">${PS[j]}</span> <span class="mb"><i style="width:${Math.round(v*100)}%"></i></span></span>`).join('')}</div><span>${n.nlinked} of ${n.nref} references linked to INSPIRE · refs from ${esc(n.src)}</span></div>
    <div class="links">${n.id?`<a href="https://inspirehep.net/literature/${n.id}" target="_blank" rel="noopener">INSPIRE</a>`:''}<a href="https://arxiv.org/abs/${esc(n.arxiv)}" target="_blank" rel="noopener">arXiv</a><a href="https://arxiv.org/pdf/${esc(n.arxiv)}" target="_blank" rel="noopener">PDF</a>${n.html?`<a href="https://arxiv.org/html/${esc(n.arxiv)}" target="_blank" rel="noopener" title="arXiv's experimental HTML version">HTML</a>`:''}<button class="linkbtn graphbtn" type="button">Show in network</button></div>`;
    d.querySelector('.graphbtn').addEventListener('click',()=>pick(n,true));
    d.querySelector('.absmore').addEventListener('click',e=>{const o=d.classList.toggle('open');e.target.textContent=o?'Less':'More'});
    box.appendChild(d)});
  toc();tex(box)}
// Phones: long author lists show the first 3 and "et al." (tap to expand); abstracts fold to 3 lines with More.
function authors(s){const a=String(s||'').split(', ');if(a.length<=3)return esc(s);
  return `<span class="au-short">${esc(a.slice(0,3).join(', '))} <button class="aubtn" type="button" aria-label="Show all ${a.length} authors">et al. (+${a.length-3})</button></span><span class="au-full">${esc(s)}</span>`}
document.addEventListener('click',e=>{const b=e.target.closest('.aubtn');if(b)b.closest('.authors').classList.add('open')});
function fold(){document.querySelectorAll('.paper').forEach(d=>{const p=d.querySelector('.abs'),b=d.querySelector('.absmore');
  if(!p||!b||d.classList.contains('open'))return;b.hidden=!(p.scrollHeight>p.clientHeight+2)})}
function toc(){const t=document.getElementById('toc');if(!NEWS.length)return;t.hidden=false;
  const X=RAW.next||[];
  t.innerHTML=`<h3>In this listing</h3><ol>${NEWS.map(n=>`<li><a href="#p${n.i}"><span class="sc${n.role==='repl'?' repl':''}">${n.score.toFixed(0)}</span><span class="tt">${esc(n.title)}</span></a></li>`).join('')}${X.length?`<li class="more-link"><a href="#more"><span class="sc">+${X.length}</span><span class="tt">The next ${X.length} papers by score (folded)</span></a></li>`:''}</ol>`;
  const m=t.querySelector('.more-link a');if(m)m.addEventListener('click',()=>{document.getElementById('more').open=true});tex(t)}
let sel=NEWS[0]||null, hover=null, query='', G;
const svg=d3.select('#svg'), tip=document.getElementById('tip');
function draw(){
  if(!NEWS.length)return;
  const RNG=d3.randomLcg(11);
  const W=Math.max(300,document.getElementById('chart').clientWidth), H=W<600?500:480, m={l:16,r:16,t:20,b:34};
  svg.attr('viewBox',`0 0 ${W} ${H}`); svg.selectAll('*').remove();
  const yrs=d3.extent(N,n=>n.year);
  const x=d3.scaleLinear().domain([yrs[0]-.5,yrs[1]+1.2]).range([m.l+8,W-m.r-8]);
  const ticks=x.ticks(W<600?6:12).filter(t=>Number.isInteger(t)&&t<=yrs[1]);
  svg.append('g').attr('class','grid').selectAll('line').data(ticks).join('line').attr('x1',d=>x(d)).attr('x2',d=>x(d)).attr('y1',m.t).attr('y2',H-m.b);
  svg.append('g').attr('class','axis').attr('transform',`translate(0,${H-m.b})`).call(d3.axisBottom(x).tickValues(ticks).tickFormat(d3.format('d')).tickSizeOuter(0));
  const cy=(m.t+H-m.b)/2, xf=n=>isNew(n)?x(yrs[1]+.75):x(n.year);
  const sim=N.map(n=>({n,x:xf(n)+(RNG()-.5)*4,y:cy+(RNG()-.5)*H*.5}));
  const links=E.map(e=>({source:sim[e.s],target:sim[e.t],s:e.s,t:e.t,k:e.k}));
  d3.forceSimulation(sim).force('x',d3.forceX(s=>xf(s.n)).strength(1)).force('y',d3.forceY(cy).strength(.04))
    .force('link',d3.forceLink(links).strength(.03)).force('charge',d3.forceManyBody().strength(-40))
    .force('col',d3.forceCollide(s=>r(s.n)+2)).stop().tick(320);
  sim.forEach(s=>{s.y=Math.max(m.t+8,Math.min(H-m.b-8,s.y));s.x=Math.max(m.l+4,Math.min(W-m.r-4,s.x))});
  G=svg.append('g');
  G.append('g').selectAll('path').data(links).join('path').attr('class',l=>'edge '+l.k)
    .attr('d',l=>{const a=l.source,b=l.target;return `M${a.x},${a.y}Q${(a.x+b.x)/2},${(a.y+b.y)/2-Math.abs(a.x-b.x)*.12} ${b.x},${b.y}`});
  G.append('g').selectAll('circle').data([...sim].sort((a,b)=>RANK[b.n.role]-RANK[a.n.role])).join('circle')
    .attr('class','node').attr('cx',s=>s.x).attr('cy',s=>s.y).attr('r',s=>r(s.n)).attr('fill',s=>col(s.n))
    .on('pointerenter',(ev,s)=>{hover=s.n;showTip(ev,s.n);paint()}).on('pointermove',(ev,s)=>showTip(ev,s.n))
    .on('pointerleave',()=>{hover=null;tip.hidden=true;paint()}).on('click',(ev,s)=>pick(s.n,false));
  const lab=sim.filter(s=>isNew(s.n)||s.n.role==='seed'||s.n.deg>=3);
  const L=lab.map(s=>{const right=s.x>W*.8,t=isNew(s.n)?`#${s.n.rank} ${s.n.first}`:`${s.n.first} ${s.n.year}`,w=t.length*6.2;return{s,t,right,x0:right?s.x-r(s.n)-4-w:s.x+r(s.n)+4,w,y:s.y+4}}).sort((a,b)=>a.y-b.y);
  const placed=[];L.forEach(l=>{let k=0;while(k<40&&placed.some(p=>l.x0<p.x0+p.w&&p.x0<l.x0+l.w&&Math.abs(l.y-p.y)<13)){l.y+=13*(k%2?-1:1)*(1+Math.floor(k/2));k++;l.y=Math.max(m.t+10,Math.min(H-m.b-4,l.y))}placed.push(l)});
  G.append('g').selectAll('text').data(L).join('text').attr('class','nlabel').attr('x',l=>l.right?l.s.x-r(l.s.n)-4:l.s.x+r(l.s.n)+4).attr('y',l=>l.y)
    .attr('text-anchor',l=>l.right?'end':'start').text(l=>l.t);
  paint();
}
function showTip(ev,n){const b=document.getElementById('chart').getBoundingClientRect();tip.hidden=false;tip.textContent=`${auth(n)} (${n.year}) — ${plain(n.title)}`+(isNew(n)?` · score ${n.score}`:'');
  let L=ev.clientX-b.left+12;if(L>b.width-290)L=ev.clientX-b.left-290;tip.style.left=Math.max(4,L)+'px';tip.style.top=(ev.clientY-b.top+12)+'px'}
function paint(){if(!G)return;const f=hover||sel,on=new Set();if(f){on.add(f.i);f.out.forEach(i=>on.add(i));f.inn.forEach(i=>on.add(i))}
  svg.classed('dim',!!f);
  G.selectAll('path.edge').attr('class',l=>'edge '+l.k+(!f?'':l.s===f.i?' hot out':l.t===f.i?' hot in':''));G.selectAll('path.edge.hot').raise();
  G.selectAll('circle').classed('on',s=>on.has(s.n.i)).classed('sel',s=>sel&&s.n.i===sel.i).classed('match',s=>query&&`${s.n.first} ${s.n.title} ${s.n.arxiv} ${s.n.authors||''}`.toLowerCase().includes(query));
  G.selectAll('text.nlabel').classed('on',l=>on.has(l.s.n.i))}
function panel(){const p=document.getElementById('panel'),n=sel;
  if(!n){p.innerHTML='<p>Select a paper in the network.</p>';return}
  const links=`<div class="links">${n.id?`<a href="https://inspirehep.net/literature/${n.id}" target="_blank" rel="noopener">INSPIRE</a>`:''}${n.arxiv?`<a href="https://arxiv.org/abs/${esc(n.arxiv)}" target="_blank" rel="noopener">arXiv</a>`:''}</div>`;
  if(isNew(n)) p.innerHTML=`<div class="role" style="color:${col(n)}">#${n.rank} · ${esc(SEC[n.section])} · score ${n.score.toFixed(1)}</div><h4>${esc(n.title)}</h4>
   <div class="meta">${esc(auth(n))} · arXiv:${esc(n.arxiv)}</div><p>${why(n.note)}</p><div class="links"><a href="#p${n.i}">Back to abstract</a></div>`;
  else p.innerHTML=`<div class="role" style="color:${col(n)}">${esc(ROLE[n.role])}</div><h4>${esc(n.title)}</h4>
   <div class="meta">${esc(auth(n))} · ${n.year}${n.arxiv?' · arXiv:'+esc(n.arxiv):''}</div>
   <div class="stats"><span>${n.cites.toLocaleString()} citations</span><span>${n.inn.filter(i=>isNew(N[i])).length} of the matches link here</span></div>${links}`;
  tex(p)}
function pick(n,scroll){sel=n;panel();paint();document.querySelectorAll('.paper').forEach(el=>el.classList.toggle('sel',el.id==='p'+n.i));if(scroll)document.getElementById('chart').scrollIntoView({behavior:'smooth',block:'nearest'})}
const present=new Set(N.map(n=>n.role));
document.getElementById('legend').innerHTML=['today','repl','seed','other'].filter(k=>present.has(k)).map(k=>`<span><i class="dot" style="background:var(--${k})"></i>${esc(ROLE[k])}</span>`).join('')+'<span style="color:var(--fg-3)">Listing papers: size ∝ score; others: size ∝ log(citations)</span>';
document.getElementById('q').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();paint()});
svg.on('click',ev=>{if(ev.target.tagName!=='circle'){sel=null;panel();paint()}});
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(draw,200)});
function nextList(){const X=RAW.next||[];if(!X.length)return;const box=document.getElementById('nextlist'),more=document.getElementById('more');
  more.hidden=false;more.querySelector('summary').firstChild.textContent=`The next ${X.length} papers by score `;
  document.getElementById('moresub').textContent=`below the threshold of ${M.threshold}, not drawn in the network`;
  box.innerHTML=X.map(n=>`<li><div class="role" style="color:var(--${n.section==='replacement'?'repl':'today'})">#${n.rank} · ${esc(SEC[n.section])} · score ${n.score.toFixed(1)}</div>
    <div class="t">${esc(n.title)}</div><div class="authors">${authors(n.authors)} · arXiv:${esc(n.arxiv)}</div>
    ${n.note?`<p class="why">${why(n.note)}</p>`:''}
    <details class="abs"><summary>Abstract</summary><p class="abs">${esc(n.abstract)}</p></details>
    <div class="links">${n.id?`<a href="https://inspirehep.net/literature/${n.id}" target="_blank" rel="noopener">INSPIRE</a>`:''}<a href="https://arxiv.org/abs/${esc(n.arxiv)}" target="_blank" rel="noopener">arXiv</a><a href="https://arxiv.org/pdf/${esc(n.arxiv)}" target="_blank" rel="noopener">PDF</a></div></li>`).join('');
  more.addEventListener('toggle',()=>{if(more.open)tex(box)})}
const rtip=document.getElementById('reftip');let rcur=null;
function refShow(el){const r=REFS[el.dataset.ref];if(!r)return;rcur=el;rtip.textContent=`${auth(r)} (${r.year}) — ${plain(r.title)}`;rtip.hidden=false;
  const b=el.getBoundingClientRect(),t=rtip.getBoundingClientRect();let L=Math.min(Math.max(8,b.left),innerWidth-t.width-8),T=b.bottom+6;
  if(T+t.height>innerHeight-8)T=b.top-t.height-6;rtip.style.left=L+'px';rtip.style.top=T+'px'}
function refHide(){rtip.hidden=true;rcur=null}
document.addEventListener('pointerover',e=>{const el=e.target.closest('.ref');if(el&&e.pointerType==='mouse')refShow(el)});
document.addEventListener('pointerout',e=>{if(e.target.closest('.ref')&&e.pointerType==='mouse')refHide()});
document.addEventListener('click',e=>{const el=e.target.closest('.ref');if(el)refShow(el);else if(rcur)refHide()});
document.addEventListener('focusin',e=>{const el=e.target.closest('.ref');if(el)refShow(el)});
document.addEventListener('focusout',e=>{if(e.target.closest('.ref'))refHide()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')refHide()});
addEventListener('scroll',()=>{if(rcur)refHide()},{passive:true});
list();nextList();fold();draw();panel();
window.addEventListener('load',()=>{tex(document.getElementById('list'));tex(document.getElementById('panel'));fold();
  if(window.MathJax&&MathJax.startup&&MathJax.startup.promise)MathJax.startup.promise.then(()=>setTimeout(fold,300))});
addEventListener('resize',()=>{clearTimeout(window._ft);window._ft=setTimeout(fold,200)});
</script>
