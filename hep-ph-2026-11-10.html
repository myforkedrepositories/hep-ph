<script>
const RAW = {"n":[{"id":"3214429","arxiv":"2610.16968","title":"Self-Interacting Dark Matter: From Particle Physics Theories to Structure Formation Simulations","first":"Rosenlyst","nauth":10,"year":2026,"cites":0,"role":"repl","note":"Cites your papers: [[2964960]]. Cites 8 network papers: [[3209823]], [[3128103]], [[3070028]], [[3209798]], [[1969598]], [[2795517]]…. Also cites widely used network papers: [[2817040]], [[1518747]]. Closest of your papers: [[2964960]] (coupling 0.15, 47 shared references). Closest network paper: [[3214429]] (coupling 0.99, 595 shared references). Shared topics: production mechanism, dark matter.","score":65.9,"rank":1,"section":"replacement","parts":[1.0,0.45,1,0.0,0.25],"abstract":"We establish a unified theory-to-simulation framework for self-interacting dark matter (SIDM) that integrates three components: (i) a comprehensive, self-contained treatment of its particle-physics foundations and a broad range of model classes; (ii) a systematic, quantitative mapping from microscopic dark-sector physics to structure-formation simulation inputs through explicit expressions and numerical prescriptions; and (iii) the development, implementation, and validation of a broad suite of SIDM algorithms and a dedicated DM decay module in the moving-mesh code AREPO-2. Under (i), we detail the particle content, symmetries, interactions, production mechanisms, and constraints of a broad landscape of elementary and composite SIDM models, and present representative viable benchmark models. Under (ii), the mapping specifies cosmological initial conditions, internal-state masses and populations, reaction networks, velocity- and angle-dependent cross sections, dissipative energy loss, and decay rates and recoil kinematics. We then apply this mapping to a broad range of SIDM model classes. Under (iii), we implement and validate SIDM algorithms with constant and velocity-dependent cross sections, covering isotropic and anisotropic scattering, multi-state elastic and inelastic reactions, and dissipative processes, alongside a dedicated DM decay module in AREPO-2. We validate the implementations through beam-lattice deflection, thermalization and decay tests, isolated-halo gravothermal core-collapse simulations, and cosmological box and zoom-in simulations. The results recover analytical predictions and published benchmarks and demonstrate agreement across numerical schemes. Our theory-to-simulation framework serves as a cross-disciplinary reference and a practical bridge between SIDM particle physics and simulations of nonlinear structure formation.","authors":"Martin Rosenlyst, Vinh Tran, Oliver Zier, Xuejian Shen, Mark Vogelsberger, Thejs Brinckmann, Mads T. Frandsen, Jesús Zavala, Frederik Holt Dihver Christensen, Mikkel Theiss Kristensen","nlinked":600,"nref":661,"src":"INSPIRE","html":true},{"id":"3226582","arxiv":"2611.12148","title":"SuperWIMPs in the Kination Era: Imprints on $N_{\\rm eff}$ and CMB Spectral Distortions","first":"Bélanger","nauth":2,"year":2026,"cites":0,"role":"today","note":"Co-authors of yours: Bélanger. Cites your papers: [[2856850]], [[1294681]]. Cites 17 network papers: [[3221883]], [[3086782]], [[3206196]], [[3205155]], [[1982681]], [[3165814]]…. Closest of your papers: [[1294681]] (coupling 0.05, 10 shared references). Closest network paper: [[2962467]] (coupling 0.14, 25 shared references). Shared topics: scotogenic model, singlet fermion, relic density, dark matter candidate, early universe.","score":60.4,"rank":2,"section":"new","parts":[1.0,0.18,0.41,0.5,0.9],"abstract":"We investigate how the late-time decays of unstable particles into dark matter and neutrinos can leave measurable imprints on both cosmological observables and collider experiments. We study this mechanism within the scotogenic model, where the lightest singlet fermion $N_1$ serves as the dark matter candidate and is produced via the late decay of the lightest inert doublet scalar via the superWIMP mechanism. By incorporating a kination-dominated era in the early Universe, the altered expansion rate allows to match the observed $N_1$ relic density in parameter regions that would be underabundant in standard cosmology. The energy exchange between the injected neutrinos and photons resulting from the late-time decay can produce CMB spectral $μ$-distortions, detectable shifts in the effective number of relativistic species $N_{\\rm eff}$, or both simultaneously. Concentrating on the lightest component of inert doublet scalars with masses between $200$ and $500~\\text{GeV}$, we find that these cosmological signals are accompanied by complementary signatures accessible at the LHC. Although our analysis is derived within the scotogenic framework, our findings apply more broadly to scenarios in which the unstable particle undergoes late-time out-of-equilibrium decay to produce dark matter and non-thermal neutrinos, offering how future CMB measurements and collider searches can jointly probe dark matter production and the early Universe's thermal history.","authors":"Geneviève Bélanger, Abhishek Roy","nlinked":118,"nref":121,"src":"INSPIRE","html":true},{"id":"3226331","arxiv":"2611.10204","title":"Real Intermediate States in Dark Matter Freeze-In from First Principles: Single Mediator","first":"Brirup","nauth":4,"year":2026,"cites":0,"role":"today","note":"Co-authors of yours: Klasen. Cites 5 network papers: [[3165814]], [[2784023]], [[2795517]], [[1647573]], [[1607216]]. Also cites widely used network papers: [[1518747]]. Closest of your papers: [[1832796]] (coupling 0.05, 13 shared references). Closest network paper: [[2682393]] (coupling 0.15, 21 shared references). Shared topics: relic density, dark matter.","score":54.2,"rank":3,"section":"new","parts":[0.95,0.17,0.44,0.5,0.43],"abstract":"We investigate the treatment of real intermediate states (RIS) in freeze-in production of $s$-channel Dark Matter (DM) with unstable mediators, as such models feature a double-counting issue when decay and annihilation collision terms are simply added within the semi-classical Boltzmann approach and a finite width is used for the regularization of the resonance. While several ad-hoc RIS-subtraction schemes are available to mitigate this problem, a first-principles treatment in this context is so far missing. We therefore start from the Closed-Time-Path (CTP) formulation of non-equilibrium Quantum Field Theory and present a CTP-based description of $s$-channel freeze-in pair production of a single scalar, fermion or vector DM species. In addition to being intrinsically free of non-unitary overcounting, the CTP ansatz also has the advantage of systematically capturing thermal corrections known to be important for DM freeze-in. Separate evolution equations assuming a single scalar or vector mediator in thermal equilibrium with the surrounding bath are presented. The exact propagators of the unstable mediators are approximated by resumming one particle irreducible (1PI) self-energy diagrams generated by bath particles and are evaluated with their full mass and momentum dependence in contrast to the commonly adopted Hard Thermal Loop limit. The CTP relic densities are compared numerically with those obtained using the most common RIS-subtraction schemes for two example $s$-channel freeze-in models, demonstrating the phenomenological relevance of a consistent RIS treatment.","authors":"Jannis Brirup, Adrian Finke, Michael Klasen, Luca Paolo Wiggering","nlinked":123,"nref":124,"src":"INSPIRE","html":true},{"id":"3226588","arxiv":"2611.12234","title":"Constraints on the Real Singlet Scalar Dark Matter Model from Higgs Self-Couplings","first":"Luo","nauth":5,"year":2026,"cites":0,"role":"today","note":"Cites 4 network papers: [[3127262]], [[3193100]], [[2784023]], [[2771408]]. Closest of your papers: [[1832796]] (coupling 0.07, 10 shared references). Closest network paper: [[2841884]] (coupling 0.07, 10 shared references). Shared topics: viable parameter space, scalar dark matter, relic density, dark matter mass, dark matter scenario.","score":50.8,"rank":4,"section":"new","parts":[0.91,0.22,0.2,0.0,0.96],"abstract":"Taking the real singlet scalar dark matter model as a representative test case, we examine the constraints imposed on the model's parameter space by Higgs trilinear coupling measurements and perturbative unitarity requirements. For the low dark matter mass regime, the constraining strength delivered by the current highest-precision $κ_3$ measurement is notably inferior to the exclusion limit derived from perturbative unitarity requirements, while the perturbative unitarity bound itself remains considerably less restrictive than the constraints extracted from the extant experimental upper limit on the Higgs invisible decay branching ratio $\\mathrm{BR}_{\\mathrm{inv}} \\leq 0.107$. Both the coupling modifiers $κ_3$ and $κ_4$ exhibit a well-defined decoupling behavior, with their respective magnitudes monotonically decreasing as the dark matter mass $m_S$ increases. As a direct consequence, the corrections to both couplings asymptotically approach zero for dark matter masses in excess of 60 TeV, when the parameter $a_2$ remains within its perturbative validity domain. Neither existing collider measurements of the Higgs trilinear coupling nor measurements targeted for planned future collider facilities possess the requisite sensitivity to impose more stringent constraints on the model's viable parameter space than the well-established bounds derived from experimental probes of dark matter relic density, invisible Higgs decay signatures, dark matter direct detection, and dark matter indirect detection. Nevertheless, under the scenario that the experimental measurement uncertainty of $κ_3$ reaches the $\\mathcal{O}(0.1\\%)$ scale or lower, non-negligible constraints acting on a subset of the large mass parameter space associated with the WIMP dark matter scenario can be expected.","authors":"Hao-Yu Luo, Kun-Peng Chen, Han Hu, Yun Wei, Ming Zhong","nlinked":66,"nref":69,"src":"INSPIRE","html":true},{"id":"3226853","arxiv":"2611.10090","title":"Gravitational Production of Non-minimally Coupled Vector Dark Matter in Warm Inflation","first":"Sereewat","nauth":1,"year":2026,"cites":0,"role":"today","note":"Cites 6 network papers: [[2726622]], [[2753529]], [[1913998]], [[2737356]], [[1998966]], [[1846588]]. Closest of your papers: [[2039411]] (coupling 0.04, 5 shared references). Closest network paper: [[2950768]] (coupling 0.20, 13 shared references). Shared topics: dark matter.","score":48.0,"rank":5,"section":"cross","parts":[0.97,0.13,0.58,0.0,0.13],"abstract":"We study the purely gravitational production of a massive vector dark matter with a non-minimal coupling to the Einstein tensor, $ξG_{μν}X^μX^ν$, in warm inflation. The background, $V=λφ^4$ with a dissipation coefficient linear in temperature, is constrained by CMB observations and parametrized by the dissipation ratio $10^{-4}\\le Q_0\\le1$. We consider both unavoidable production channels: freeze-in from the Standard Model bath through graviton exchange, and cosmological gravitational particle production (CGPP). For freeze-in, we compute the scattering amplitudes including the contact interaction induced by $ξ$, which enhances the production of light dark matter through the longitudinal mode and suppresses that of heavy dark matter through destructive interference. For CGPP, the slow-roll parameter is not small during warm inflation, which enhances the production of light dark matter by up to three orders of magnitude relative to cold inflation. Combining both channels, CGPP excludes most of the light freeze-in branch, leaving $m_X\\lesssim2.4\\times10^{-5}$ GeV, a narrow window around $10^{10}$ GeV for strong dissipation, and $m_X\\gtrsim10^{14}$--$10^{15}$ GeV. Only the heavy branch remains viable for all $|ξ|\\lesssim1$.","authors":"Phongsakorn Sereewat","nlinked":37,"nref":38,"src":"INSPIRE","html":true},{"id":"3205957","arxiv":"2609.24914","title":"Luminosity Signatures of Dark Sector Particles from Black Hole Evaporation in Neutron Stars","first":"Dalianis","nauth":2,"year":2026,"cites":0,"role":"repl","note":"Cites 2 network papers: [[2894898]], [[2838690]]. Also cites widely used network papers: [[1783234]]. Closest of your papers: [[1941263]] (coupling 0.05, 9 shared references). Closest network paper: [[2843822]] (coupling 0.15, 14 shared references). Shared topics: hawking evaporation, dark sector, standard model particle, dark matter.","score":43.3,"rank":6,"section":"replacement","parts":[0.72,0.14,0.43,0.0,0.76],"abstract":"Microscopic black holes may form at the centers of neutron stars through the accumulation and collapse of dark matter. While Standard Model particles produced by Hawking evaporation are efficiently absorbed by the dense stellar medium, sufficiently weakly interacting and long-lived particles can escape and subsequently decay into high-energy neutrinos, photons, or charged particles, providing an indirect probe of Hawking radiation. We examine the joint energy--angular distribution of these secondary particles, incorporating mediator propagation, energy-dependent decay, and relativistic decay kinematics. For relativistic mediators, the normalized energy-integrated angular profile becomes approximately independent of the black hole temperature, with its characteristic extent controlled primarily by the combination $cτ_S/D$ of the mediator lifetime and source distance, as the boost enhancement of the decay length is compensated by relativistic beaming. We demonstrate the viability of this mechanism and illustrate its phenomenology with gravitationally coupled scalars, axion-like particles (ALPs), dark photons, and heavy neutral leptons. Comparing with monochromatic mediator production from dark matter annihilation, we find that the energy-integrated angular profiles can be nearly degenerate, while the energy spectra and energy-resolved angular distributions remain distinct. Although the predicted signals may lie beyond the reach of current observatories, these complementary spectral and angular signatures provide potential targets for future high-energy neutrino and gamma-ray searches.","authors":"Ioannis Dalianis, Anastasios Irakleous","nlinked":84,"nref":88,"src":"INSPIRE","html":true},{"id":"3226389","arxiv":"2611.10218","title":"$B\\to$ invisible decays as probes of light new physics","first":"Novoa-Brunet","nauth":1,"year":2026,"cites":0,"role":"today","note":"Cites 2 network papers: [[2813804]], [[2740358]]. Closest of your papers: [[1832796]] (coupling 0.02, 2 shared references). Closest network paper: [[2813804]] (coupling 0.22, 11 shared references). Shared topics: observed dark matter, dark matter abundance, dark matter.","score":41.5,"rank":7,"section":"new","parts":[0.7,0.05,0.63,0.0,0.6],"abstract":"Rare $B$ decays with missing energy probe heavy particles contributing to $b\\to sν\\barν$ and new light states produced on shell. We discuss both possibilities in light of the Belle II excess in $B^+\\to K^+\\Emiss$. Fits to the missing-mass distribution favour a two-body contribution near $2.1\\,\\GeV$, while scalar and fermion pairs of masses around $0.4$-$0.6\\,\\GeV$ remain viable alternatives. Extracting their couplings would profit from additional measurements, including the $B\\to K^*\\Emiss$ rate and longitudinal $K^*$ polarization, together with invisible $B_s$ decays which constrain scalar-pair interactions. We discuss how an aligned Higgsed $U(1)'$ model can realize the single-vector explanation through a vector-like top partner. Loop-induced electroweak mixing makes visible $Z'$ decays unavoidable, requiring an additional invisible channel to evade dimuon searches. We show that a light dark fermion can provide this channel and also account for the observed dark matter abundance through resonant thermal annihilation.","authors":"Martín Novoa-Brunet","nlinked":28,"nref":28,"src":"INSPIRE","html":true},{"id":"3226515","arxiv":"2611.11694","title":"Nanohertz gravitational waves and asymmetric dark matter from a supercooled dark sector phase transition","first":"Cho","nauth":2,"year":2026,"cites":0,"role":"today","note":"Co-authors of yours: Choi. Cites 1 network paper: [[3193100]]. Closest of your papers: [[2787890]] (coupling 0.06, 9 shared references). Closest network paper: [[3128752]] (coupling 0.13, 26 shared references). Shared topics: mass arise, relic abundance, big bang nucleosynthesis, complex scalar, dark sector.","score":41.0,"rank":8,"section":"new","parts":[0.45,0.18,0.36,0.5,0.93],"abstract":"We study the connection between asymmetric dark matter and nanohertz gravitational waves from a supercooled first-order phase transition in a classically conformal dark sector. The dark sector contains a real scalar, a complex scalar and a Dirac fermion, whose mass arises from radiative symmetry breaking. An additional Affleck--Dine condensate generates a fermion asymmetry and heats the dark bath before nucleation. The conserved dark charge fixes the asymmetry between fermions and antifermions, while entropy production during delayed visible-sector reheating dilutes the relic and determines the redshift of the gravitational-wave spectrum. We calculate the thermal nucleation rate in a three-dimensional effective theory with finite-density corrections, next-to-leading-order contributions and fluctuation determinants (NLOdet). We follow the coupled thermal evolution of the dark and visible sectors. For a benchmark chosen to match the observed dark-matter abundance, the transition completes at MeV-scale temperatures and produces a nanohertz signal under the adopted dynamical and thermal assumptions. We compare the predicted collision-dominated gravitational-wave spectra with free-spectrum posteriors from pulsar timing arrays. For a benchmark point and variations of the dark-sector parameters, the gravitational-wave spectra and dark matter relic abundances are compared, and compatibility with Big Bang nucleosynthesis is assessed.","authors":"Wonsub Cho, Ki-Young Choi","nlinked":104,"nref":104,"src":"INSPIRE","html":true},{"id":"3226324","arxiv":"2611.10114","title":"Collider-observable curvaton","first":"Cyncynates","nauth":2,"year":2026,"cites":0,"role":"today","note":"Cites 2 network papers: [[3089716]], [[1678642]]. Also cites widely used network papers: [[1362180]]. Closest of your papers: [[2751074]] (coupling 0.03, 4 shared references). Closest network paper: [[2944101]] (coupling 0.08, 11 shared references). Shared topics: viable parameter space.","score":34.8,"rank":9,"section":"new","parts":[0.72,0.09,0.22,0.0,0.39],"abstract":"We study a technically natural realization of the curvaton mechanism, in which decay is mediated through the superrenormalizable interaction with the Higgs. We compute the quantum and thermal corrections to the curvaton potential and show that they remain under control throughout its cosmological evolution. For high inflationary scales, the curvaton dissipates through off-shell processes in the Standard Model plasma. The viable parameter space is broad, and the region in which the curvaton mass and dimensionful Higgs-portal coupling are closest in scale lies within the discovery reach of proposed searches for light Higgs-mixed scalars.","authors":"David Cyncynates, Takuya Okawa","nlinked":104,"nref":110,"src":"INSPIRE","html":true},{"id":"3177610","arxiv":"2607.05309","title":"Parametric Resonance of Higgsed Vector Dark Matter: Inflationary Initial Conditions and Sourced Displacements","first":"Khan","nauth":5,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[2642079]]. Closest of your papers: [[3184726]] (coupling 0.04, 5 shared references). Closest network paper: [[2974439]] (coupling 0.14, 11 shared references). Shared topics: production mechanism, dark matter.","score":28.2,"rank":10,"section":"replacement","parts":[0.45,0.13,0.39,0.0,0.25],"abstract":"Parametric resonance in a Higgsed Abelian sector provides an efficient mechanism for producing vector dark matter, but its viability depends crucially on the origin of the initial dark-Higgs displacement that seeds the resonance. In this work, we investigate this initial-condition problem in a weakly coupled Abelian-Higgs theory with potential $V=λ_4(φ^2-v^2)^2/4$, using the calibrated nonlinear broad-resonance relic map together with a stochastic inflationary analysis of the dark-Higgs condensate. We show that a minimal light-spectator realization fails under standard inflationary duration: while broad resonance and isocurvature constraints require \\( φ_0/H_I \\gtrsim 3.3\\times10^4, \\) the stochastic equilibrium and finite-duration random walk produce only \\( φ/H_I=\\mathcal O(1). \\) This large displacement mismatch is robust against order-of-magnitude variations in the resonance efficiency and broadness threshold, establishing a model-independent obstruction to the stochastic branch. We then identify a distinct classically sourced branch, generated by a negative Hubble-induced mass, in which the condensate tracks a time-dependent minimum, \\( φ_0=κH_*/\\sqrt{λ_4}, \\) and the radial fluctuation remains heavy during inflation. In this case, the fixed-$e/λ_D$ relic scaling shifts from \\( m_X\\propto λ_4^{5/8}H_I^{-3/2} \\) to \\( m_X\\propto κ^{-3/2}λ_4 H_*^{-3/2}. \\) We derive the simultaneous consistency conditions for this sourced branch, including broad resonance, adiabatic tracking, perturbativity, sub-Planckian displacement, thermal non-erasure, spectator backreaction, and control of inflationary vector fluctuations. Our results establish that Higgsed-vector resonance is not merely a dark-matter production mechanism, but a sensitive probe of the inflationary and reheating dynamics that determine its initial conditions.","authors":"Imtiaz Khan, Salvatore Capozziello, G. Mustafa, Niamat Ullah, Farruh Atamurotov","nlinked":66,"nref":76,"src":"INSPIRE","html":true},{"id":"3226573","arxiv":"2611.11983","title":"Axion-Photon Conversion in Variable-Domain Magnetic Fields and the Highest-Energy Photons from GRB 221009A","first":"Garai","nauth":3,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Also cites widely used network papers: [[1783234]]. Closest of your papers: [[1941263]] (coupling 0.08, 15 shared references). Closest network paper: [[2691930]] (coupling 0.08, 13 shared references).","score":27.5,"rank":11,"section":"new","parts":[0.48,0.24,0.23,0.0,0.0],"abstract":"We investigate photon-ALP conversion as a simultaneous explanation of the ultra-high-energy photons observed from GRB 221009A by LHAASO and of the $\\sim300$ TeV photon reported by Carpet-3. We model the magnetic field of the host galaxy as a set of domains with randomly oriented field directions and variable domain lengths, and propagate the photon-ALP system through the host galaxy, the intergalactic medium and the Milky Way. Fitting the combined LHAASO and Carpet-3 spectra, we find that a broad distribution of domain lengths raises the photon survival probability at the highest energies and accommodates the Carpet-3 point with photon-ALP conversion alone. The best fit, $m_a=3.85\\times10^{-7}$~eV and $g_{aγ}=3.07\\times10^{-11}\\,\\mathrm{GeV}^{-1}$, lies below the CAST bound, and parts of the $1σ$ and $2σ$ regions are also compatible with it.","authors":"Rick Sundar Garai, Tanmoy Kumar, Sourov Roy","nlinked":65,"nref":76,"src":"INSPIRE","html":true},{"id":"3226667","arxiv":"2611.12625","title":"A singlet framework for the mu problem and type-II seesaw in a generalized NMSSM","first":"Du","nauth":3,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[2740358]]. Closest of your papers: [[3094526]] (coupling 0.03, 8 shared references). Closest network paper: [[2094416]] (coupling 0.07, 9 shared references). Shared topics: relic abundance, dark matter.","score":26.1,"rank":12,"section":"new","parts":[0.45,0.1,0.19,0.0,0.45],"abstract":"We study a generalized NMSSM in which a gauge singlet links the Higgs bilinear to the type-II seesaw scale. The singlet vacuum expectation value contributes to $μ_{\\rm eff}$ and generates the supersymmetric mass of a vectorlike triplet pair. Integrating out the triplets gives the Weinberg operator, and their gauge charges admit a possible messenger interpretation. Large cancellation between the bare $μ_0$ term and the singlet VEV generated bilinear Higgs term that keeps $μ_{\\rm eff}$ near the soft scale is still natural in the supersymmetric limit (by the supersymmetric non-renormalization theorem), although the concrete value of $μ_{\\rm eff}$ also depends slightly on the soft SUSY breaking parameters and finite threshold matching. The studied bino-like and singlino-like neutralino solutions accommodate triplet input scales approaching $10^{15}$ GeV together with electroweak-to-TeV dark matter. Representative spectra consistent with heavy-Higgs funnels or coannihilation with gluinos or winos yield allowed relic abundances while satisfying direct-detection constraints.","authors":"Xiaokang Du, Yusi Pan, Fei Wang","nlinked":86,"nref":90,"src":"INSPIRE","html":true},{"id":"3148045","arxiv":"2604.20340","title":"Exact baryon-meson relation for $b \\to s ν\\barν$","first":"Kitahara","nauth":3,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[3193100]]. Closest of your papers: [[2964960]] (coupling 0.00, 1 shared references). Closest network paper: [[2813804]] (coupling 0.22, 20 shared references).","score":25.5,"rank":13,"section":"replacement","parts":[0.45,0.01,0.62,0.0,0.0],"abstract":"We derive an exact relation among the normalized branching fractions of $Λ_b \\to Λν\\barν$ and $B \\to K^{(\\ast)} ν\\barν$, within the lepton-number-conserving effective Hamiltonian in which only active neutrinos contribute to the invisible final state. Although the effective Hamiltonian contains 18 independent Wilson coefficients, the three normalized rates depend on only two independent combinations of them, leading to an exact algebraic relation. Remarkably, the central values of the coefficients of this baryon-meson relation are close to $1/4$ and $3/4$, which appear in the heavy-to-heavy $b\\to c$ semileptonic sum rule among the branching fractions of $Λ_b \\to Λ_c τ\\barν$ and $B \\to D^{(\\ast)}τ\\barν$. Once the decay rate of $B \\to K^{\\ast} ν\\barν$ is measured, the decay rate of $Λ_b \\to Λν\\barν$ can be determined in a model-independent manner for new-physics scenarios involving only active neutrino interactions, thereby providing a clean target prediction for future experiments. This clearly demonstrates that observables in baryonic and mesonic $b \\to s ν\\barν$ transitions will serve as a compact consistency test and a powerful probe for discriminating among new-physics scenarios.","authors":"Teppei Kitahara, Manas Kumar Mohapatra, Kota Sasaki","nlinked":78,"nref":79,"src":"INSPIRE","html":true},{"id":"3187937","arxiv":"2608.05096","title":"High energy probes of Higgs self-coupling via $W$ boson fusion at future lepton colliders","first":"Subba","nauth":4,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[3193100]]. Closest of your papers: [[3094526]] (coupling 0.05, 7 shared references). Closest network paper: [[2183252]] (coupling 0.10, 9 shared references).","score":24.5,"rank":14,"section":"replacement","parts":[0.45,0.15,0.28,0.0,0.0],"abstract":"We investigate the sensitivity to the Higgs self-coupling through $W$ boson fusion di-Higgs production at CLIC with a center-of-mass energy of $\\sqrt{s}=3$~TeV. We study the interplay between the Higgs self-coupling modifier ($κ_λ$) and Higgs-gauge boson coupling modifiers ($κ_{V}$ and $κ_{2V}$) within the $κ$ framework. To enhance the separation between signal and background, we develop a graph neural network (GNN) based classifier that achieves a signal significance of $\\mathscr{Z}\\approx 20~σ$ at $5~\\mathrm{ab}^{-1}$, substantially exceeding projected HL-LHC sensitivity. Our results demonstrate that high-energy lepton colliders, combined with graph-based machine learning, provide excellent sensitivity to the Higgs self-coupling and offer a powerful probe of new physics in the electroweak sector, potentially disentangling underlying SMEFT-like and HEFT-like structures.","authors":"Amir Subba, Hrishikesh Deka, Subhaditya Bhattacharya, Abhik Sarkar","nlinked":41,"nref":47,"src":"INSPIRE","html":true},{"id":"3172549","arxiv":"2606.25027","title":"Fermion mass relations in one-parameter modular models","first":"Chuliá","nauth":5,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[2762216]]. Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1249404]] (coupling 0.02, 1 shared references). Closest network paper: [[3154793]] (coupling 0.13, 9 shared references).","score":24.0,"rank":15,"section":"replacement","parts":[0.48,0.05,0.38,0.0,0.0],"abstract":"Modular flavour symmetries provide a possible organizing principle for the Standard Model Yukawa sector, by replacing generic couplings with a potentially small number of modular forms controlled by a single complex modulus. We study the extreme limit of this idea: One-Parameter Models, in which each charged-fermion mass matrix is fixed by a single modular invariant contraction. We develop a systematic method to construct such models, showing that the One-Parameter Model requirement is already highly constraining at the level of possible fermion hierarchies. In a concrete realization, the charged-lepton and down-quark sectors are controlled by the common modulus, leading to exact mass relations at the flavour scale, $m_s^5 = 2\\sqrt{2}\\,m_d^3m_b^2, \\qquad m_μ^3 = \\sqrt{2}\\,m_e m_τ^2, \\qquad m_s^2m_τ= \\sqrt{2}\\,m_e m_b^2$. We show that, once renormalization-group evolution and selective supersymmetric threshold effects are included, these high-scale relations can be made compatible with low-energy charged-fermion data. Our results provide a working proof of principle for One-Parameter Models and point towards a possible route to the flavour puzzle through highly constrained constructions.","authors":"Salvador Centelles Chuliá, Xueqi Li, Xiang-Gan Liu, Omar Medina, J. T. Penedo","nlinked":28,"nref":29,"src":"INSPIRE","html":true},{"id":"3226343","arxiv":"2611.10075","title":"Phenomenological explorations of a quasi-degenerate $Z'$ boson","first":"Kim","nauth":5,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Closest of your papers: [[1755250]] (coupling 0.02, 2 shared references). Closest network paper: [[2864372]] (coupling 0.05, 3 shared references).","score":20.1,"rank":16,"section":"new","parts":[0.45,0.06,0.16,0.0,0.0],"abstract":"We do a general model-independent phenomenological analysis of the curious case of a $Z'$ boson with mass close to that of the Standard Model (SM) $Z$ boson. From tree-level calculation alone we show that presence of such a quasi-degenerate or `practically' degenerate $Z'$ boson affects both the cross-section and forward-backward asymmetry of the process $e^+ e^- \\to f \\bar{f}$ where $f$ (with $f\\neq e^-$) can be a lepton or quark. Most importantly the effect on forward-backward asymmetry is found to be more prominent away from the $Z$-pole. We provide constraints on such a $Z'$ from the measurement of $N_ν$, the number of light neutrino species.","authors":"C. S. Kim, Donghun Lee, Gyeonghyun Min, Sechul Oh, Dibyakrupa Sahoo","nlinked":47,"nref":48,"src":"INSPIRE","html":true},{"id":"3226664","arxiv":"2611.12630","title":"Angular analysis of the purely baryonic decays $Λ_b^0\\to n p\\bar p$ and $Λ_b^0\\toΛp\\bar p$","first":"Geng","nauth":2,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Also cites widely used network papers: [[2817040]]. Closest of your papers: [[3184726]] (coupling 0.01, 1 shared references). Closest network paper: [[3214449]] (coupling 0.02, 1 shared references).","score":18.4,"rank":17,"section":"new","parts":[0.48,0.02,0.06,0.0,0.0],"abstract":"An angular analysis of the purely baryonic decays $Λ_b^0\\to np\\bar p$ and $Λ_b^0\\toΛp\\bar p$ is presented within a phenomenological generalized-factorization model. Within this model, two current contributions leading to the same final state are combined coherently. Pair-angle distributions, forward-backward hemisphere asymmetries, and Legendre moments are calculated in both channels, together with the polarization of the produced $Λ$ for an unpolarized parent. For the neutron channel, the full-region forward-backward asymmetries are $4.46\\times10^{-4}$ in the $n\\bar p$ frame and $0.856$ in the $p\\bar p$ frame at $N_c^{\\mathrm{eff}}=3$ and zero additional relative phase. From mass-bin integration, the small first asymmetry is found to arise from compensation between signed contributions from different regions. In the $Λ$ channel, the angular distributions are modified by the selection $m(p\\bar p)<2.85\\,\\mathrm{GeV}$, and the rate-weighted longitudinal polarization along the $Λ$ flight direction is shifted from $-0.803$ to $-0.954$. These results show how angular and spin observables depend on the relative current contributions and the selected phase-space region. The model-dependent analysis is intended as a first step toward understanding the dynamics of these decays and as a basis for further theoretical studies and comparisons with measurements.","authors":"Chao-Qiang Geng, Chao Han","nlinked":29,"nref":30,"src":"INSPIRE","html":true},{"id":"3226486","arxiv":"2611.11472","title":"Short-range dynamics of $X(3872)$ and $T_{cc}(3875)^+$ in a coupled-channel framework","first":"Peng","nauth":3,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Closest network paper: [[3193100]] (coupling 0.04, 44 shared references).","score":17.3,"rank":18,"section":"new","parts":[0.45,0.0,0.1,0.0,0.0],"abstract":"We study the short-range dynamics in the coupled-channel description of the $S$-wave $D \\bar{D}^*$ and $DD^*$ systems for $X(3872)$ and $T_{cc}(3875)^+$, respectively. Contact interactions are related through scalar- and vector-meson exchange saturation, while pion exchange is included explicitly with its local term subtracted. The coupled Lippmann-Schwinger equations incorporate the self-energy of the unstable $D^*$ mesons, thereby accounting for the three-body $D \\bar{D} π$ ($D Dπ$) dynamics. Fixing the contact interaction from the $T_{cc}(3875)^+$ pole, we trace the predicted $X(3872)$ pole as the local magnetic dipole term from vector-meson exchange is varied. Retaining this term in full produces the shallowest poles, which remain approximately $5$--$12~\\mathrm{MeV}$ below the observed $X(3872)$ mass. It is found that the pion exchange has a moderate effect on the binding energy and a stronger effect on the isospin violation for the $X(3872)$ state. The residual tension between the pure-molecular bound descriptions of $X(3872)$ and $T_{cc}(3875)^+$ is analyzed with the Feshbach projection. This analysis indicates a $DD^*$ interaction weaker than that implied by the purely molecular fits, and shows that the $T_{cc}(3875)^+$ state instead arises from the mixing of the $DD^{*}$ channel with a compact $cc\\bar{u}\\bar{d}$ state. We further examine the spatial structure using Born--Oppenheimer effective field theory. For separation radii of $0.5$--$1.5~\\mathrm{fm}$, the combined charmonium and short-distance tetraquark weight in $X(3872)$ is $3.0$--$9.7\\%$, while the short-distance weight in $T_{cc}(3875)^+$ is $1.3$--$14.4\\%$. These results favor retaining the local vector-exchange contribution within the saturation framework and motivate a joint treatment of molecular and compact dynamics for the $T_{cc}(3875)^+$.","authors":"Fang-Zheng Peng, Li-Sheng Geng, Ju-Jun Xie","nlinked":124,"nref":126,"src":"INSPIRE","html":true},{"id":"3226580","arxiv":"2611.12253","title":"NLO QCD corrections to $W^{+}$-boson decays into doubly heavy baryons","first":"Ma","nauth":4,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Closest network paper: [[2940264]] (coupling 0.03, 3 shared references).","score":16.9,"rank":19,"section":"new","parts":[0.45,0.0,0.07,0.0,0.0],"abstract":"The next-to-leading-order (NLO) QCD corrections have been investigated for the production of doubly heavy baryons via the inclusive $W^{+}$-boson decays $W^{+}\\toΞ_{cc}+\\bar{c}+\\bar{s}+X$ and $W^{+}\\toΞ_{bc}+\\bar{b}+\\bar{s}+X$ within the nonrelativistic QCD framework. The decay widths, the kinematic distributions, and the uncertainties induced by the heavy-quark masses and the renormalization scale have been analyzed for both the color-antitriplet ($\\bar{\\mathbf{3}}$) and the color-sextet ($\\mathbf{6}$) $S$-wave states. With the central input parameters $m_{c}=1.8~\\mathrm{GeV}$ and $m_{b}=5.1~\\mathrm{GeV}$, the $K$ factors are $2.27$ for $Ξ_{cc}$ and $2.95$ for $Ξ_{bc}$, i.e., the NLO corrections increase the corresponding LO widths by about $127\\%$ and $195\\%$, which shows that the NLO corrections are indispensable for quantitative predictions. The individual-channel $K$ factors range from $1.94$ to $5.53$, with the largest one occurring for $Ξ_{bc}$ in the $[{}^{3}S_{1}]_{\\mathbf{6}}$ channel. The distributions show that the NLO corrections enhance the low invariant-mass region and shift the baryon energy spectrum toward smaller energy fractions. With $Γ_{W}=2.085~\\mathrm{GeV}$, the inclusive branching ratios are $8.86\\times10^{-5}$ and $3.63\\times10^{-6}$ for $Ξ_{cc}$ and $Ξ_{bc}$, respectively, which provide an NLO benchmark for future experimental searches.","authors":"Hong-Hao Ma, Xu-Chang Zheng, Juan-Juan Niu, Xing-Gang Wu","nlinked":75,"nref":77,"src":"INSPIRE","html":true},{"id":"3226659","arxiv":"2611.12673","title":"Amplitudes separation and strong-electromagnetic phases determination in the $\\boldsymbol{J/ψ}$ decays into baryon-antibaryon pairs","first":"Alice","nauth":31,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Closest network paper: [[3214449]] (coupling 0.02, 1 shared references).","score":16.7,"rank":20,"section":"new","parts":[0.45,0.0,0.06,0.0,0.0],"abstract":"We extract the relative phase between strong and electromagnetic amplitudes of the decays of a vector charmonium into spin-$1/2$ baryon-antibaryon pairs. Starting from a flavour-SU(3) effective Lagrangian with vector and tensor currents, we construct a parametrization in terms of partial waves coefficients. The electric and magnetic phases, the phase of the integrated complex overlap and the effective rate angle are derived from the same source amplitudes. We retain two possible solutions and both of them describe the scalar $Σ^+\\barΣ^-$ scan phase within its uncertainty, while presenting tension with several electric-magnetic production phases.","authors":"Chiara Alice, Antonio Amoroso, Matteo Barbagiovanni, Monica Bertani, Diego Bettoni, Fabrizio Bianchi, Alberto Bortone, Damiano Cabiati, Alessandro Calcaterra, Gianluigi Cibinetto, Fabio Cossio, Marco Destefanis, Francesca De Mori, Emma Di Fiore, Luciano Fava, Sara Garbolino, Isabella Garzia, Michela Greco, Marco Maggiora, Simonetta Marcello, Federico Matias Melendi, Giulio Mezzadri, Piero Patteri, Simone Pacetti, Angelo Rivetti, Manuel Dionisio Da Rocha Rolo, Francesco Rosini, Marco Scodeggio, Stefano Sosio, Stefano Spataro, Umberto Zarantonello","nlinked":28,"nref":28,"src":"INSPIRE","html":true},{"id":"3211572","arxiv":"2610.05209","title":"The decay $η_c\\to p\\bar pη$ with meson--baryon final-state interactions","first":"Song","nauth":3,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[3193100]]. Closest network paper: [[3091093]] (coupling 0.02, 1 shared references).","score":16.7,"rank":21,"section":"replacement","parts":[0.45,0.0,0.06,0.0,0.0],"abstract":"We study the decay \\(η_c\\to p\\bar{p}η\\) by combining the SU(3) flavor structure of the primary production with final-state interactions in the \\(pη\\) and \\(\\bar{p}η\\) subsystems, using the chiral unitary approach. The low-energy \\(S_{11}\\) dynamics, including the dynamically generated \\(N^*(1535)\\), is incorporated into the complete coupled-channel amplitude, and a phenomenological \\(N^*(1895)\\) contribution is included coherently. The \\(pη\\) and \\(\\bar{p}η\\) invariant-mass distributions are well described, and the \\(p\\bar{p}\\) distribution is predicted as a kinematic reflection of the \\(ηN\\) dynamics. The results support the dynamical interpretation of the \\(N^*(1535)\\) and suggest possible additional \\(S_{11}\\) strength near \\(1.9\\)~GeV.","authors":"Jing Song, Yu-Shan Ren, Eulogio Oset","nlinked":29,"nref":33,"src":"INSPIRE","html":true},{"id":"3226402","arxiv":"2611.10259","title":"Evidence for quark+quark pairing in proton formation","first":"Xing","nauth":4,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Closest network paper: [[3074282]] (coupling 0.02, 2 shared references).","score":16.6,"rank":22,"section":"new","parts":[0.45,0.0,0.06,0.0,0.0],"abstract":"The question of pairing between quarks inside baryons is addressed by calculating the fragmentation functions that describe production of nucleons (protons and neutrons) in high-energy collisions and comparing attendant predictions with phenomenological global fits to available data and directly with data on hadron multiplicities. The fragmentation functions are obtained from nucleon parton distribution functions using the Drell-Levy-Yan relation and subsequently solving a coupled set of pion, kaon, and nucleon jet cascade equations. Strong empirical evidence is found for the presence of diquark correlations. In comparison with global fits, $d$ (down) quark to proton fragmentation ($d\\to p$) exhibits the clearest signals. The strongest evidence is found in comparisons with the momentum-dependent proton multiplicity distribution: FFs built from a proton wave function that contains diquark correlations deliver a $z$-profile that is fully consistent with available data, whereas that obtained from a no-pairing wave function is disfavoured by data at the $9σ$ level.","authors":"Hui-Yu Xing, Dan-Dan Cheng, Craig D. Roberts, Jose Rodriguez-Quintero","nlinked":78,"nref":83,"src":"INSPIRE","html":true},{"id":"3226466","arxiv":"2611.11246","title":"Direct Light-Cone Reconstruction of the $B$-Meson Shape Function in HQET","first":"Xiong","nauth":5,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Closest network paper: [[3111443]] (coupling 0.02, 1 shared references).","score":16.6,"rank":23,"section":"new","parts":[0.45,0.0,0.06,0.0,0.0],"abstract":"The $B$-meson shape function encodes the nonperturbative residual-momentum dynamics of the heavy quark within heavy quark effective theory (HQET). From a Wilsonian perspective, HQET provides a natural framework for lattice calculations when the heavy quark mass is comparable to or exceeds the inverse lattice spacing. Motivated by this observation, we introduce a $B$-meson quasi-shape function directly in HQET and calculate its one-loop matching to the light-cone shape function, avoiding an intermediate matching step involving a full-QCD light-cone distribution. We determine the one-loop renormalization kernels and matching coefficients in both the $\\overline{\\mathrm{MS}}$ and regularization-independent momentum-subtraction (RI/MOM) schemes for the quasi-shape function, while keeping the light-cone shape function in the $\\overline{\\mathrm{MS}}$ scheme. The matching coefficients are obtained at leading power in the large-$v^z$ expansion and are independent of the infrared regulator. Our results provide the perturbative ingredients for a direct lattice HQET determination of the $B$-meson shape function.","authors":"Ao-Sheng Xiong, Shu-Man Hu, Ji Xu, Fu-Sheng Yu, Shuai Zhao","nlinked":47,"nref":47,"src":"INSPIRE","html":true},{"id":"2890845","arxiv":"2502.12461","title":"Phenomenological revisit of the $B$ ${\\to}$ $ππ$ decays by incorporating soft color-octet contributions","first":"Yang","nauth":3,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[3193100]]. Closest network paper: [[3193100]] (coupling 0.02, 25 shared references).","score":16.6,"rank":24,"section":"replacement","parts":[0.45,0.0,0.05,0.0,0.0],"abstract":"Motivated by the long-standing ``$ππ$ puzzle'' in nonleptonic $B$ decays, we revisit the $B$ ${\\to}$ $ππ$ decays within the QCD factorization (QCDF) framework, now incorporating the soft color-octet matrix element (COME) contributions, an ingredient that has been largely overlooked in earlier QCDF studies. A comprehensive phenomenological analysis is performed under three distinct scenarios, with the free parameters determined via fits to the available experimental data using the $χ^{2}$ method. The goodness-of-fit is very poor for Scenario S1, which corresponds to the traditional QCDF case without the soft COME contributions, and for Scenario S2, which includes the soft COME contributions but omits the weak annihilation (WA) contributions. Scenario S3, in which both the COME and WA contributions are included simultaneously, achieves an excellent overall fit. In Scenario S3, the QCDF approach can accommodate almost all $B$ ${\\to}$ $ππ$ observables in a consistent and satisfactory manner, and the fitted parameters $ρ_{A}$ $<$ $1$ (WA) and $ρ_{c}$ ${\\sim}$ $0.3$ (soft COME) are in good agreement with the QCDF power counting scheme and the factorization hypothesis.","authors":"Yueling Yang, Bingbing Yang, Junfeng Sun","nlinked":117,"nref":121,"src":"INSPIRE","html":true},{"id":"3226436","arxiv":"2611.10816","title":"Flavor decomposition of the nucleon axial and tensor charges from lattice QCD","first":"Alexandrou","nauth":7,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Closest network paper: [[3214449]] (coupling 0.02, 1 shared references).","score":16.5,"rank":25,"section":"cross","parts":[0.45,0.0,0.04,0.0,0.0],"abstract":"We determine the nucleon axial and tensor charges using four ensembles of twisted-mass clover-improved fermions with approximately equal physical volumes of about 5.5~fm and four lattice spacings, $ a=0.05$~fm, 0.06~fm, 0.07~fm, and 0.08~fm. The mass of the degenerate up and down, strange and charm quarks are tuned to approximately their physical values. We compute both connected and disconnected contributions to determine the isovector and isoscalar charges and their flavour decomposition. For the nucleon isovector axial charge we find $g_A^{u-d}=1.263(34)(26)$, in agreement with the experimental value. For the isoscalar axial charge we find $g_A^{u+d}=0.458(16)(1)$, while for the corresponding tensor charges we find $g_T^{u-d}=0.951(21)(5)$ and $g_T^{u+d}=0.556(16)(5)$.","authors":"C. Alexandrou, S. Bacchio, M. Di Carlo, A. Evangelista, C. Iona, F. Pittler, G. Spanoudes","nlinked":57,"nref":59,"src":"INSPIRE","html":true},{"id":"3226339","arxiv":"2611.10036","title":"Magnetohydrodynamic spectra and line invariants in the presence of axions","first":"Akhmetiev","nauth":3,"year":2026,"cites":0,"role":"today","note":"Also cites widely used network papers: [[1783234]]. Closest of your papers: [[1941263]] (coupling 0.11, 10 shared references). Closest network paper: [[2969908]] (coupling 0.09, 6 shared references).","score":15.4,"rank":26,"section":"cross","parts":[0.06,0.31,0.26,0.0,0.0],"abstract":"A new form of the mean-field equations for magnetic fields, which accounts for the interaction with axions, is studied. It is shown that the asymptotic ergodic invariants of magnetic field lines play a key role in the evolution of magnetic fields, which determine the type of the magnetohydrodynamic spectrum of the solutions.","authors":"P. M. Akhmetiev, M. S. Dvornikov, A. Yu. Smirnov","nlinked":29,"nref":61,"src":"INSPIRE","html":true},{"id":"3143488","arxiv":"2604.08700","title":"Axion Quality in Warped Extra-Dimension","first":"Choi","nauth":3,"year":2026,"cites":0,"role":"repl","note":"Co-authors of yours: Choi. Also cites widely used network papers: [[1783234]]. Closest of your papers: [[1597138]] (coupling 0.05, 9 shared references). Closest network paper: [[3213062]] (coupling 0.07, 9 shared references).","score":15.0,"rank":27,"section":"replacement","parts":[0.06,0.16,0.21,0.5,0.0],"abstract":"We investigate the axion quality problem in warped extra-dimensional models in which the QCD axion arises as the Wilson-line mode of a five-dimensional $U(1)$ gauge field compactified on an $S^1/\\mathbb{Z}_2$ orbifold. Higher-dimensional gauge invariance severely constrains possible sources of Peccei--Quinn symmetry breaking, implying that non-QCD contributions to the axion potential are predominantly generated by nonlocal effects mediated by $U(1)$-charged fields propagating along the compact dimension. We systematically compute these contributions and examine how both the warped geometry and the orbifold fixed points (branes) affect the resulting axion quality. Finally, we classify the parametric suppression of the induced axion potential, thereby identifying the conditions under which warped extra-dimensional axions can achieve sufficiently high quality.","authors":"Kiwoon Choi, Chang Hyeon Lee, Chang Sub Shin","nlinked":82,"nref":82,"src":"INSPIRE","html":true},{"id":"3226684","arxiv":"2611.12765","title":"Quality time in extra dimensions: axion quality and radion cosmology","first":"Biswas","nauth":3,"year":2026,"cites":0,"role":"today","note":"Closest of your papers: [[1941263]] (coupling 0.06, 12 shared references). Closest network paper: [[2691930]] (coupling 0.07, 11 shared references). Shared topics: observed dark matter, dark matter abundance, dark matter.","score":14.6,"rank":28,"section":"new","parts":[0.0,0.18,0.21,0.0,0.6],"abstract":"Higher-form symmetries can protect extra-dimensional axions, but additional symmetry breaking can still spoil the solution to the strong CP problem. We focus on electrically charged matter and magnetic gauging in a five-dimensional circle compactification where the axion arises from an Abelian gauge field and the radius is dynamical. We discuss two mechanisms for stabilising the radius/radion using Casimir energy from fields neutral under the Abelian gauge field, with and without an additional periodic scalar winding around the compact circle. Both admit Minkowski and de Sitter minima. At the Minkowski minima (with radion masses of $100$--$170\\,\\mathrm{TeV}$), electrically charged matter induces a residual strong CP angle of order $10^{-17}$ and shifts the radius negligibly. Magnetic gauging remains compatible after including its additional degree of freedom in the Casimir spectrum, provided its coupling is sufficiently small. We observe that increasing the radius suppresses charged-matter breaking relative to QCD but increases magnetic breaking contribution. We also determine the radion decay channels, including the graviphoton, and study reheating from a possible radion-dominated era without scalar winding or magnetic gauging. For a non-minimal Higgs-curvature coupling $ξ=7$, the visible-sector reheating temperature is about $85\\,\\mathrm{MeV}$ with a dark-radiation contribution of $ΔN_{\\rm eff}\\approx0.02$. The entropy released during radion decay dilutes the axion abundance, allowing axions with $f_a=10^{14}\\,\\mathrm{GeV}$ and an initial misalignment angle $\\vartheta_i\\approx0.43$ to account for the entire observed dark matter abundance. For the same decay constant, reproducing this abundance in radiation domination requires $\\vartheta_i\\approx0.065$.","authors":"Falguni Biswas, Yeshan Juberi, Ahmed Rakin Kamal","nlinked":78,"nref":78,"src":"INSPIRE","html":true},{"id":"3226457","arxiv":"2611.11241","title":"An $SU(5)$ GUT with non-holomorphic modular $S'_4$ symmetry: fermion masses, mixing and leptogenesis","first":"Zhang","nauth":2,"year":2026,"cites":0,"role":"today","note":"Closest of your papers: [[3184726]] (coupling 0.02, 5 shared references). Closest network paper: [[3167577]] (coupling 0.23, 23 shared references). Shared topics: neutrino mass.","score":14.1,"rank":29,"section":"new","parts":[0.0,0.06,0.67,0.0,0.23],"abstract":"A non-supersymmetric $SU(5)$ grand unified model is constructed based on the non-holomorphic modular $S'_4$ flavor symmetry, supplemented by a global Peccei--Quinn $U(1)_{PQ}$ symmetry that constrains the Yukawa couplings. Constructed from polyharmonic Maaß forms, these couplings allow the model to reproduce the observed charged-fermion masses and mixing as well as the neutrino oscillation parameters for both normal ordering (NO) and inverted ordering (IO), with all Pull values satisfying $|\\mathcal{P}| < 0.8$. The model further yields specific predictions for yet-unmeasured parameters, including the absolute neutrino masses, the Dirac CP phase, the Majorana phases, and the effective Majorana mass $m_{ββ}$. We then study thermal leptogenesis by solving the density matrix equations. For a given benchmark point, the final baryon asymmetry depends solely on the single free parameter $b$ that sets the right-handed neutrino mass scale, and an appropriate choice of this parameter reproduces the observed value $η_B \\simeq 6.12 \\times 10^{-10}$. Finally, the correlation between this scale parameter and specific low-energy observables provides a potential bridge between the fermion flavor structure and early-Universe cosmology.","authors":"Xianshuo Zhang, Yakefu Reyimuaji","nlinked":91,"nref":100,"src":"INSPIRE","html":true},{"id":"3092472","arxiv":"2512.11486","title":"CANTON-$μ$ Proposal: A Next-Generation Muon $g-2$ Measurement at Sub-0.1 ppm Precision","first":"Zhang","nauth":13,"year":2026,"cites":0,"role":"repl","note":"Co-authors of yours: Xu. Closest of your papers: [[2690106]] (coupling 0.03, 5 shared references). Closest network paper: [[2706495]] (coupling 0.13, 19 shared references).","score":13.2,"rank":30,"section":"replacement","parts":[0.0,0.08,0.38,0.5,0.0],"abstract":"We propose a next-generation precision measurement of the muon anomalous magnetic moment (muon g-2) at the High Intensity Heavy-Ion Accelerator Facility (HIAF) in Huizhou, China. We refer to this proposed experimental programme as CANTON-$μ$ (Coherent Anomalous magNetic momenT ObservatioN with muon). HIAF's intense, pulsed GeV-scale muon beams, particularly for negative muons, provide a promising basis for this programme. Building on two previously proposed storage-ring concepts, this work develops HIAF-specific experimental schemes that relax the conventional magic-momentum constraint and allow greater flexibility in the choice of beam momentum. We assess the expected muon intensity at HIAF and the corresponding statistical sensitivity. For each scheme, we identify its distinctive systematic effects, examine feasible control strategies, and propose quantitative systematic-uncertainty targets. Together, the statistical projections and systematic-uncertainty targets indicate prospective total precisions of 0.1 ppm in Phase-I, comparable to the current Fermilab precision, with the potential to reach the 0.05 ppm level in Phase-II following the planned HIAF upgrade. At the ultimate projected precision, the measurement would provide a stringent test of the Standard Model and probe new physics at multi-TeV scales. A focus on negative-muon measurements would enable direct comparison with existing high-precision positive-muon results and strengthen tests of CPT symmetry in the muon sector within the Standard-Model Extension, with a projected sensitivity at the $10^{-24}$ GeV level, an order of magnitude beyond current limits.","authors":"Ce Zhang, Yu Xu, On Kim, Bingzhi Li, Zejia Lu, Saskia Charity, Guodong Shen, Liangwen Chen, Fedor Ignatov, Liang Li, Qiang Li, Xueheng Zhang, Zhiyu Sun","nlinked":152,"nref":165,"src":"INSPIRE","html":true},{"id":"3227077","arxiv":"2611.10753","title":"Search sensitivity for type-III seesaw heavy leptons in simulated \\texorpdfstring{$pp$}{pp} collisions at \\texorpdfstring{$\\sqrt{s}=13.6$}{sqrt(s)=13.6} TeV at the LHC","first":"Elsayed","nauth":2,"year":2026,"cites":0,"role":"today","note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1249404]] (coupling 0.07, 9 shared references). Closest network paper: [[2617409]] (coupling 0.10, 13 shared references).","score":12.3,"rank":31,"section":"new","parts":[0.06,0.2,0.28,0.0,0.0],"abstract":"A search for the pair production of TeV-scale heavy leptons as predicted by the type-III seesaw mechanism is presented. The analysis is based on a simulated signal and Standard Model background data corresponding to an integrated luminosity of $500~\\mathrm{fb}^{-1}$ of proton-proton collisions at $\\sqrt{s}=13.6$ TeV. The ATLAS detector response is modeled with Delphes. Events are categorized based on the number of final state leptons and large-$R$ jets into nine mutually exclusive search channels. Multivariate analysis techniques are employed to separate the signal from the Standard Model backgrounds. Under the flavor-democratic mixing scenario ($\\mathcal{B}_e=\\mathcal{B}_μ=\\mathcal{B}_τ=1/3$), the expected 95\\% confidence level upper exclusion limit on the heavy lepton mass is approximately $1.6$ TeV.","authors":"A. M. M. Elsayed, Yusheng Wu","nlinked":52,"nref":70,"src":"INSPIRE","html":true},{"id":"3127633","arxiv":"2603.06934","title":"Lepton Mixing from a Lattice Flavon Model: A Two-Branch Octant-delta Prediction","first":"Barger","nauth":1,"year":2026,"cites":0,"role":"repl","note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[3184726]] (coupling 0.04, 5 shared references). Closest network paper: [[2762216]] (coupling 0.12, 24 shared references). Shared topics: neutrino mass.","score":12.2,"rank":32,"section":"replacement","parts":[0.06,0.11,0.36,0.0,0.15],"abstract":"We extend the single-flavon $B$-lattice Froggatt-Nielsen (FN) framework, previously applied to quark masses and CKM mixing, to the lepton sector. The same $B$-lattice power structure ($ε\\equiv 1/B\\simeq 0.19$) generates charged-lepton mass hierarchies and a normal-ordered neutrino spectrum; large neutrino mixing angles require an additional mu-tau reflection symmetry of the neutrino mass matrix, which fixes the atmospheric angle to $45^\\circ$ and the neutrino-sector Dirac phase to $δ_ν=270^\\circ$ exactly while leaving the reactor angle, generated at $\\mathcal{O}(ε)$, free. The Pontecorvo-Maki-Nakagawa-Sakata (PMNS) matrix factorizes as $U_{\\rm PMNS}=U_e^\\dagger U_ν$, with near-tribimaximal $U_ν$ corrected by small charged-lepton rotations whose $12$ and $23$ phases are aligned. A single interference relation expresses the observed Dirac phase $δ$ as the maximal neutrino phase shifted by a calculable charged-lepton correction, and correlates the sign of that shift with the atmospheric octant; this produces a two-branch prediction in the $(θ_{23},δ)$ plane: a lower-octant branch with $θ_{23}\\approx 44^\\circ$, $δ\\approx 260^\\circ$, and an upper-octant branch with $θ_{23}\\approx 46^\\circ$, $δ\\approx 275^\\circ$. The lower octant contains the strict single-source point of the flavon phase. Both branches place $δ$ within about $15^\\circ$ of $270^\\circ$, i.e., near-maximal leptonic CP violation, favored by T2K; a Dirac phase in the first or second quadrant, or more than about $40^\\circ$ from maximal, would exclude the framework. The Jarlskog invariant $J_{\\rm CP}\\simeq -0.033$ is nearly branch-independent; only precision measurements of the atmospheric octant and Dirac phase at DUNE, Hyper-Kamiokande, IceCube, and JUNO can distinguish the two branches.","authors":"Vernon Barger","nlinked":40,"nref":43,"src":"INSPIRE","html":true},{"id":"3226560","arxiv":"2611.11458","title":"After the Higgs: Looking for the Universe Behind the Particle","first":"Sanz","nauth":1,"year":2026,"cites":0,"role":"today","note":"Closest of your papers: [[3094526]] (coupling 0.10, 10 shared references). Closest network paper: [[2860407]] (coupling 0.08, 6 shared references).","score":12.1,"rank":33,"section":"new","parts":[0.0,0.29,0.23,0.0,0.0],"abstract":"Fourteen years after its discovery, the Higgs boson has changed roles. It was once the object of the search, but today it is an instrument with which we interrogate Nature's vacuum, test quantum field theory and look for new principles. This shift comes at a time when, unlike before the Higgs discovery, we have no theoretical argument guaranteeing new physics within experimental reach. At the same time, securing long-term support for fundamental science is becoming increasingly challenging. I revisit the path from a theoretically motivated discovery to a precision programme, explain why the Higgs is such an unusual quantum field, and argue that this same peculiarity makes it a gateway to cosmology and other sectors. I then turn to a less technical question: how should a field plan for exploration when no theorem guarantees the next discovery? My answer is to pursue precision without pretending to know in advance which measurement will matter, sustain a diverse experimental portfolio, protect theoretical risk-taking, and make the public case for fundamental exploration on its own terms.","authors":"Veronica Sanz","nlinked":29,"nref":30,"src":"INSPIRE","html":true},{"id":"3225702","arxiv":"2611.09106","title":"Probing Dark Matter via the Migdal Effect in LUX-ZEPLIN Data","first":"Yu","nauth":2,"year":2026,"cites":0,"role":"today","note":"Closest of your papers: [[2794409]] (coupling 0.06, 7 shared references). Closest network paper: [[3207263]] (coupling 0.12, 12 shared references). Shared topics: dark matter.","score":11.4,"rank":34,"section":"cross","parts":[0.0,0.17,0.33,0.0,0.13],"abstract":"Sub-GeV dark matter (DM) particles deposit little energy in conventional direct-detection experiments and are therefore difficult to probe, but the Migdal effect provides an electronic signal from atomic ionization accompanying the recoil. Using the new results of the LUX-ZEPLIN experiment with a 4.2 tonne-year exposure, we evaluate the sensitivity of the Migdal effect to the spin-independent DM--nucleon scattering cross section. For masses between $350~\\mathrm{MeV}$ and $10~\\mathrm{GeV}$, the projected 90\\% upper limits range from $6.5\\times10^{-37}$ to $9.6\\times10^{-42}~\\mathrm{cm^2}$. These limits are then used to constrain the minimal scalar- and vector-mediator DM models. For the light-mediator DM model, the constraint on the coupling reaches $α\\simeq 10^{-12}$, which is stronger than or comparable to the constraints from kaon decays, stellar cooling, and SN1987A.","authors":"Yang Yu, Lei Feng","nlinked":43,"nref":44,"src":"INSPIRE","html":true},{"id":"3224015","arxiv":"2611.07331","title":"Algebraic classification of single-field inflationary dynamics","first":"Gong","nauth":2,"year":2026,"cites":0,"role":"today","note":"Closest of your papers: [[1655573]] (coupling 0.07, 5 shared references). Closest network paper: [[3076170]] (coupling 0.14, 9 shared references).","score":11.3,"rank":35,"section":"cross","parts":[0.0,0.18,0.39,0.0,0.0],"abstract":"We develop an algebraic classification of canonical single-field inflationary dynamics using an exact depressed cubic equation for the inflaton velocity. Its root structure identifies a branch-swap boundary distinct from the limiting boundary of downhill motion, where ultra-slow-roll inflation naturally emerges. Independently, the conservation of momentum conjugate to the comoving curvature perturbation in the long-wavelength limit provides a criterion for the growth or decay of the gauge-invariant difference between comoving and uniform-density curvature perturbations. Combining these criteria, we construct a unified dynamical chart in terms of the Hubble and potential slow-roll parameters, illustrating its applicability to constant-roll inflation and simple toy models. Our classification shifts the emphasis from assigning models to fixed categories toward understanding the dynamical regimes traversed by inflationary trajectories and their implications for primordial perturbations.","authors":"Jinn-Ouk Gong, Wei-Chen Lin","nlinked":25,"nref":26,"src":"INSPIRE","html":true},{"id":"3200925","arxiv":"2609.06734","title":"Inverse-seesaw and inflationary scale relations in a supersymmetric 331 model from an SU(6) GUT model","first":"Khan","nauth":2,"year":2026,"cites":0,"role":"repl","note":"Closest of your papers: [[731108]] (coupling 0.07, 5 shared references). Closest network paper: [[2875244]] (coupling 0.10, 10 shared references).","score":10.7,"rank":36,"section":"replacement","parts":[0.0,0.22,0.28,0.0,0.0],"abstract":"We propose a $N=1$ supersymmetric $SU(6)$ theory with an intermediate $(SU(3)_C\\times SU(3)_L\\times U(1)_X)$ phase, in which common fields and operators relate the neutrinos, gauge mediation, unification, and symmetry-breaking sectors. The antisymmetric Dirac matrix of the inverse-seesaw sector has rank two, yielding one vanishing light-neutrino mass at leading order. A higher-dimensional symmetry-breaking correction lifts this zero mode through its projection onto the left and right null vectors of the Dirac matrix, leading to a quartic suppression in the ratio of the intermediate and ultraviolet scales. Complete unified messenger multiplets preserve the relative one-loop gauge coupling evolution while modifying the unified coupling. When the same supersymmetry-breaking spurion generates the singlet lepton-number-violating parameter, an analytical relation emerges between the messenger scale, the lepton-number mediator scale, and the unified coupling. The two-loop gauge evolution remains perturbative for the assumed heavy-threshold spectrum. In the inflationary sector, the scalar-amplitude normalization determines the coupling governing both the inflationary potential and the radial scalar mass in the broken vacuum. The physical scalar directions transverse to the inflaton are stable within the neutral supergravity subspace, while the combined inflationary and gauge-mediated conditions imply a significant sensitivity of the symmetry-breaking vacuum. An examination of the allowed operators shows that additional ultraviolet conditions are required to obtain the observed active-neutrino mixing, suppress competing lepton-number-violating terms, and complete the heavy-field spectrum. Our analysis establishes the analytical scale relations among the neutrino, messenger, unification, and inflationary sectors and identifies the conditions necessary for their simultaneous realization.","authors":"Imtiaz Khan, Tianjun Li","nlinked":84,"nref":84,"src":"INSPIRE","html":true},{"id":"3226592","arxiv":"2611.12363","title":"Naturalness in the Past from a Time-Dependent Supersymmetry Scale","first":"Gherghetta","nauth":3,"year":2026,"cites":0,"role":"today","note":"Closest of your papers: [[1655573]] (coupling 0.05, 3 shared references). Closest network paper: [[3089716]] (coupling 0.04, 3 shared references). Shared topics: relic abundance, early universe, gravitational wave.","score":10.5,"rank":37,"section":"new","parts":[0.0,0.12,0.11,0.0,0.51],"abstract":"We consider the possibility that electroweak naturalness may be epoch dependent. In no-scale supergravity, a rolling quintessence modulus can control the supersymmetry-breaking scale, allowing superpartners to be much lighter in the early universe while remaining heavy today. Fifth-force and varying-constant effects can be suppressed via correlated modular weights in the visible-sector Kähler metric and modulus-dependent superpotential Yukawa couplings, while radiative stability of the quintessence potential requires additional tuning of the field-dependent vacuum energy. The resulting effective theory has distinctive implications for early-universe phase transitions, relic abundances, and gravitational waves.","authors":"Tony Gherghetta, Kunio Kaneta, Wenqi Ke","nlinked":41,"nref":43,"src":"INSPIRE","html":true},{"id":"3214429","arxiv":"2610.16968","title":"Self-Interacting Dark Matter: From Particle Physics Theories to Structure Formation Simulations","first":"Rosenlyst","nauth":10,"year":2026,"cites":2,"role":"other","note":"","score":null},{"id":"2762216","arxiv":"2402.16963","title":"The symmetry approach to quark and lepton masses and mixing","first":"Ding","nauth":2,"year":2024,"cites":74,"role":"other","note":"","score":null},{"id":"2787890","arxiv":"2405.10367","title":"Dark matter in QCD-like theories with a theta vacuum: Cosmological and astrophysical implications","first":"García-Cely","nauth":3,"year":2024,"cites":19,"role":"seed","note":"","score":null},{"id":"1783234","arxiv":"2003.01100","title":"The landscape of QCD axion models","first":"Di Luzio","nauth":4,"year":2020,"cites":1235,"role":"other","note":"","score":null},{"id":"3216233","arxiv":"2610.24547","title":"Ultra-relativistic freeze-out of fermion dark matter through a heavy scalar mediator","first":"Yang","nauth":5,"year":2026,"cites":0,"role":"other","note":"","score":null},{"id":"1286910","arxiv":"1403.5760","title":"The Quest for an Intermediate-Scale Accidental Axion and Further ALPs","first":"Dias","nauth":5,"year":2014,"cites":178,"role":"other","note":"","score":null},{"id":"2843822","arxiv":"2410.22702","title":"Beyond Hawking evaporation of black holes formed by dark matter in compact stars","first":"Basumatary","nauth":3,"year":2024,"cites":32,"role":"other","note":"","score":null},{"id":"2836474","arxiv":"2410.00491","title":"Long-lived sterile neutrinos from an axionlike particle at Belle II","first":"Wang","nauth":3,"year":2024,"cites":10,"role":"other","note":"","score":null},{"id":"2856850","arxiv":"2412.04550","title":"Probing low-reheating scenarios with minimal freeze-in d
