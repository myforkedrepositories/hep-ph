"c"],[133,54,"c"],[133,141,"c"],[3,136,"c"],[3,137,"k"],[46,132,"c"],[112,75,"c"],[47,97,"c"],[45,130,"c"],[15,139,"k"],[20,48,"c"],[18,48,"c"],[7,143,"k"],[46,141,"c"],[0,57,"c"],[109,143,"c"],[133,63,"c"],[64,162,"c"],[1,153,"c"],[108,129,"c"],[49,103,"c"],[55,91,"c"],[147,75,"c"],[162,103,"c"],[163,39,"c"],[72,126,"c"],[120,63,"c"],[25,142,"k"],[58,134,"c"],[172,92,"c"],[45,96,"c"],[30,55,"k"],[45,81,"c"],[60,81,"c"],[74,81,"c"],[102,45,"c"],[124,122,"c"],[16,48,"c"],[174,126,"c"],[142,40,"c"],[130,132,"c"],[37,75,"c"],[135,151,"c"],[68,132,"c"],[157,151,"c"],[114,96,"c"],[103,81,"c"],[151,81,"c"],[132,141,"c"],[109,173,"c"],[110,149,"c"],[146,69,"c"],[106,75,"c"],[81,75,"c"],[110,75,"c"],[10,40,"c"],[45,71,"c"],[7,48,"c"],[88,96,"c"],[4,174,"k"],[104,51,"c"],[165,132,"c"],[125,132,"c"],[153,54,"c"],[152,105,"c"],[38,111,"c"],[136,132,"c"],[60,96,"c"]],"next":[{"arxiv":"2604.02958","id":"3139158","title":"Applying self-organizing maps to nonresonant searches","authors":"Vaidehi Tikhe, N. Kirutheeka, Sourabh Dube","score":9.7,"section":"replacement","rank":38,"parts":[0.06,0.13,0.25,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1455793]] (coupling 0.05, 2 shared references). Closest network paper: [[2710594]] (coupling 0.09, 4 shared references).","abstract":"An excess of events seen in a nonresonant search at a collider can be difficult to ascribe to a specific hypothesis from amongst several competing ones. We explore a novel approach of applying self-organizing maps to such an excess to uniquely identify a hypothesis. We use a search for vector-like leptons in a trilepton final state to outline the method. We define an approach combining the inherent clustering of these maps and elements of supervised learning. We compare the performance of this approach with a multiclassifying neural network. We find that the method using self-organizing maps competes well (despite not using any standard model processes in the training), and provides additional tools that would help characterize any observed excesses in searches."},{"arxiv":"2606.07106","id":"3165826","title":"Joint probes of dark matter annihilation from neutrino detectors and CMB targets","authors":"Ruifeng Leng, Shao-Ping Li","score":8.8,"section":"replacement","rank":39,"parts":[0.0,0.13,0.25,0.0,0.13],"note":"Closest of your papers: [[2627241]] (coupling 0.04, 7 shared references). Closest network paper: [[3081701]] (coupling 0.09, 9 shared references). Shared topics: dark matter.","abstract":"Dark matter (DM) annihilation into neutrinos provides a promising observational channel targeted by current and forthcoming neutrino detectors. However, the detection of such neutrino fluxes alone cannot uniquely determine their astrophysical or cosmological origin, such as the recent observations from Super-Kamiokande that hint at a small excess of electron antineutrino events. We propose that the effective number of neutrino species and the spectral distortion of the cosmic microwave background (CMB) can serve as complementary observables to probe neutrino signatures from DM annihilation. Using a simple model-independent analysis, we determine the detection windows of these cosmic observables that overlap with the experimental sensitivities from the Super-Kamiokande, Jiangmen Underground Neutrino Observatory, Hyper-Kamiokande, and the Deep Underground Neutrino Experiment, showing that joint probes of large DM annihilation to neutrinos with MeV-GeV masses can be achieved by neutrino detectors and CMB experiments."},{"arxiv":"2605.07972","id":"3153711","title":"It Just Takes Two: Scaling Amortized Inference to Large Sets","authors":"Antoine Wehenkel, Michael Kagan, Lukas Heinrich, Chris Pollard","score":8.8,"section":"replacement","rank":40,"parts":[0.0,0.11,0.36,0.0,0.0],"note":"Closest of your papers: [[1294681]] (coupling 0.04, 2 shared references). Closest network paper: [[3187354]] (coupling 0.13, 2 shared references).","abstract":"Neural posterior estimation has emerged as a powerful tool for amortized inference, with growing adoption across scientific and applied domains. In many of these applications, the conditioning variable is a set of observations whose elements depend not only on the target but also on unknown factors shared across the set. Optimal inference therefore requires treating the set jointly, which in turn requires training the estimator at the deployment set size -- a regime where memory and compute quickly become prohibitive. We introduce a simple, theoretically grounded strategy that decouples representation learning from posterior modeling. Our method trains a mean-pool Deep Set on sets of size at most two, producing an encoder that generalizes to arbitrary set sizes. The inference head is then finetuned on pre-aggregated embeddings, making training cost essentially independent of the deployment set size N. Across scalar, image, multi-view 3D, molecular, and high-dimensional conditional generation benchmarks with N in the thousands, our approach matches or outperforms standard baselines at a fraction of the compute."},{"arxiv":"2601.07269","id":"3103110","title":"Atmospheric Mass-Squared Splitting at Sub-Percent Precision as a $CPT$ Symmetry Probe","authors":"T. V. Ngoc, S. Cao, P. T. Quyen","score":8.4,"section":"replacement","rank":41,"parts":[0.06,0.13,0.16,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1854224]] (coupling 0.05, 3 shared references). Closest network paper: [[1861353]] (coupling 0.06, 3 shared references).","abstract":"In this paper, we present an one of the most sensitive test of $CPT$ symmetry in the leptonic sector by probing the atmospheric neutrino mass-squared splittings, $Δm^2_{31}$ and $Δ\\overline{m}^2_{31}$, using simulated data from on-going reactor-based JUNO and future accelerator-based DUNE and Hyper-Kamiokande experiments. Our study focuses on the potential neutrino-antineutrino mass asymmetry $δ_{ν\\overlineν}(Δm^2_{31}) = Δm^2_{31} - Δ\\overline{m}^2_{31}$, achieving unprecedented precision by exploiting the high statistics and reduced systematic uncertainties of these facilities. The combined analysis yields a projected sensitivity to $CPT$ violation at the level of $\\sim 1.7\\times 10^{-5}~\\text{eV}^2$ at $3σ$ confidence level. These results highlight the crucial role of multi-experiment synergies in testing fundamental symmetries of nature. The work also investigates impact of potential bias on the (anti-)neutrino mass-splitting measurement due to the neutrino interactions with accelerator-based neutrino experiments, and conclude that it must be improved by at least $39\\%$ compared to T2K simulated-benchmark to achieve a sub-percent precision probe of $CPT$ violation."},{"arxiv":"2611.11211","id":"3226463","title":"The first-order phase transitions and gravitational waves from an effective theory inspired by four-stack intersecting D6-brane models","authors":"Haotian Huangfu, Tianjun Li, Qi Sun, Rui Sun, Wenxing Zhang","score":8.1,"section":"new","rank":42,"parts":[0.0,0.05,0.29,0.0,0.22],"note":"Closest of your papers: [[2790381]] (coupling 0.02, 3 shared references). Closest network paper: [[2928725]] (coupling 0.10, 17 shared references). Shared topics: early universe, gravitational wave.","abstract":"First-order phase transitions in the early Universe can generate stochastic gravitational-wave backgrounds in frequency bands targeted by proposed deci-Hz observatories. We study the gravitational-wave consequences of the right-handed gauge symmetry breaking $SU(2)_{R_1}\\times SU(2)_{R_2}\\to SU(2)_R$ in a Pati-Salam effective theory inspired by four-stack intersecting D6-brane models. The ultraviolet construction fixes the gauge structure and particle multiplicities, while the scalar masses and quartic couplings are treated as renormalized inputs below the supersymmetry-breaking scale. Using a one-loop finite-temperature potential with ring resummation, we follow a strongly supercooled transition at the few-TeV scale through nucleation, percolation, completion, and reheating. The leading-order friction diagnostic does not support a runaway wall, so sound waves dominate the gravitational-wave signal, with turbulence as a sub-leading contribution; the finite acoustic lifetime suppresses the peak. For the fast-wall reference case, the spectrum peaks at $f_{\\rm peak}=0.611$ Hz with $h^2Ω_{\\rm GW,peak}=1.232\\times10^{-11}$, in the deci-Hz band targeted by DECIGO and BBO. We present its dependence on the wall speed, renormalization scale, and thermal screening, together with a noise-only comparison for several proposed detector configurations."},{"arxiv":"2608.01496","id":"3186414","title":"Search for active-sterile neutrino transitions using Pierre Auger Observatory data","authors":" The Pierre Auger Collaboration, A. Abdul Halim, P. Abreu, M. Aglietta, M. Ahmed, I. Allekotte, K. Almeida Cheminant, R. Aloisio, J. Alvarez-Muñiz, A. Ambrosone, J. Ammerman Yebra, L. Anchordoqui, B. Andrada, L. Andrade Dourado, L. Apollonio, C. Aramo, J. C. Arteaga Velázquez, P. Assis, G. Avila, E. Avocone, A. Bakalova, Y. Balibrea, A. Baluta, F. Barbato, A. Bartz Mocellin, O. Batalla Cruz, J. P. Behler, C. Berat, M. E. Bertaina, M. Bianciotto, P. L. Biermann, V. Binet, K. Bismark, T. Bister, J. Biteau, J. Blazek, J. Blümer, M. Boháčová, D. Boncioli, C. Bonifazi, N. Borodai, J. Brack, P. G. Brichetto Orquera, S. Buitink, A. Bwembya, T. R. Caba Pineda, K. S. Caballero-Mora, S. Cabana-Freire, L. Caccianiga, J. Caraça-Valente, R. Caruso, A. Castellina, F. Catalani, G. Cataldi, L. Cazon, M. Cerda, B. Čermáková, A. Cermenati, K. Cerny, J. A. Chinellato, J. Chudoba, L. Chytka, R. W. Clay, A. C. Cobos Cerutti, R. Colalillo, R. Conceição, A. Condorelli, G. Consolati, M. Conte, F. Convenga, D. Correia dos Santos, P. J. Costa, C. E. Covault, M. Cristinziani, C. S. Cruz Sanchez, S. Dasso, K. Daumiller, B. R. Dawson, R. M. de Al c-moment-induced transitions between active and heavy sterile neutrinos. Such dipole portal interactions can enhance neutrino-nucleon cross sections above a kinematic threshold set by the sterile neutrino mass, leading to observable modifications of neutrino detection rates at ultrahigh energies (UHE). We estimate the impact of these interactions on both down-going and Earth-skimming neutrino detection channels, the contrasting responses of which enable discrimination between an enhanced neutrino flux and a modified interaction cross section. Using the non-observation of UHE neutrino candidates, we derive neutrino-flux-dependent constraints with 90% confidence-level on the transition magnetic moment for sterile neutrino masses in the range 1 TeV-100 TeV. Under the assumed flux scenarios, the resulting flavor-independent limits extend existing bounds into previously unexplored parameter space."},{"arxiv":"2611.10662","id":"3226415","title":"Self-bound quantum dark fermion stars: saturation, a coupling-capped maximum mass, and tidal signatures of a vector dark sector","authors":"Ilidio Lopes","score":7.2,"section":"cross","rank":44,"parts":[0.0,0.05,0.17,0.0,0.3],"note":"Closest of your papers: [[2787890]] (coupling 0.02, 2 shared references). Closest network paper: [[2051205]] (coupling 0.06, 4 shared references). Shared topics: dark sector, dark matter.","abstract":"I show that a dark sector whose fermions couple to both a scalar and a vector mediator saturates in close analogy with nuclear matter: the energy per particle develops a minimum at finite density, cold dark matter of this kind is self-bound, and its stars, computed here in full general relativity, possess the sharp surfaces of strange quark stars. Saturation makes the maximum stellar mass a property of the Lagrangian rather than an inheritance of the Chandrasekhar scaling: it rises eightfold across the saturation window, which a critical vector coupling closes, so the theory caps its own maximum mass, at iple structures in the experimental mass region, the total wavefunction must also be an eigenstate of the SU(3) flavor operator. Under this condition, two structures emerge with masses lying in the same region as the experimentally observed signals in the $J/ψ\\,Λ$ spectrum. In addition, two states are predicted below the $J/ψ\\,Λ$ threshold but above the $η_c\\,Λ$ one, which would not contribute to that channel. If only the $I = 0$ condition is imposed, a single structure is obtained, with a mass below the $J/ψ\\,Λ$ threshold."},{"arxiv":"2610.40354","id":"3220608","title":"Two-peak gravitational wave spectra from supercooled two-field phase transitions","authors":"Daniel Araújo, João Gonçalves, Danny Marfatia","score":7.0,"section":"replacement","rank":46,"parts":[0.0,0.09,0.22,0.0,0.1],"note":"Closest of your papers: [[1854224]] (coupling 0.03, 1 shared references). Closest network paper: [[3191566]] (coupling 0.08, 4 shared references). Shared topics: gravitational wave.","abstract":"We study the gravitational wave (GW) spectrum generated by supercooled first-order phase transitions in two-field conformal models. We construct three representative toy models that capture the essential features of these models, derive analytical criteria for the existence of two-step transitions, and show how the two-field dynamics generate a genuine two-peak GW spectrum. We identify regions of parameter space in which two-peak GW spectra are observable at LISA and the Einstein Telescope. By way of illustration, we apply our analysis to a realistic conformal dark SU(3) model."},{"arxiv":"2608.17409","id":"3192060","title":"Density-induced dark-baryon conversion in $Δ-$admixed hypernuclear neutron stars","authors":"Niyar Prabhat Kalita, Vivek Baruah Thapa, Bhanu Prakash Pant, Anil Kumar, Partha Konar","score":6.9,"section":"replacement","rank":47,"parts":[0.0,0.0,0.33,0.0,0.2],"note":"Closest network paper: [[2843822]] (coupling 0.11, 12 shared references). Shared topics: dark sector.","abstract":"We investigate density-induced conversion of neutrons into a neutral dark baryon $χ$ in cold, charge-neutral, $β$-equilibrated neutron-star matter containing hyperons and all $Δ(1232)$ quartet. The hadronic sector is modeled within a density-dependent covariant density-functional framework using the DDME2 parametrization. A scalar Higgs portal is included as a possible interaction channel between the visible and dark sectors, although its mean-field contribution is negligible for the couplings adopted here. Unlike fixed dark-matter admixture models or scenarios in which nucleon-to-DM conversion is driven by Higgs exchange, the $χ$ abundance is determined self-consistently from chemical equilibrium and baryon-number conservation. We find that hyperons and $Δ$ resonances alter the neutron chemical potential, delay the onset of $χ$, and suppress its abundance relative to nucleonic matter. This competition induces characteristic changes in the equation of state, particle fractions, sound speed, and adiabatic index. For $m_χ=1250$, $1300$, and $1400$ MeV, the maximum masses of the complete $N+Y+Δ+χ$ configurations are $1.806$, $1.899$ and $2.024,M_\\odot$, respectively, indicating that the massive-pulsar constraint disfavors the lighter dark-baryon benchmarks. The radial profiles further show that for $m_χ=1400$ MeV, $χ$ is confined to the inner core of the most massive stars, while canonical configurations remain essentially unaffected. Thus, the stellar modifications arise primarily from conversion-induced rearrangement of the equilibrium composition rather than from Higgs-mediated interactions. These results highlight the importance of treating conventional non-nucleonic degrees of freedom and density-generated dark baryons on an equal footing when assessing the astrophysical viability of dark-sector extensions of dense matter."},{"arxiv":"2611.10273","id":"3226319","title":"Constraints on quirks from a Geant4-based reinterpretation of the CMS search for heavy stable charged particles","authors":"Tamas Almos Vami","score":6.8,"section":"new","rank":48,"parts":[0.0,0.13,0.19,0.0,0.01],"note":"Closest of your papers: [[1455793]] (coupling 0.05, 3 shared references). Closest network paper: [[3095771]] (coupling 0.07, 3 shared references).","abstract":"Quirks are new heavy fermions with electroweak charges that are also bound by a confining force whose scale $Λ$ is far below their mass. A produced pair therefore stays connected by a macroscopic string. We reinterpret the CMS search for heavy stable charged particles in 101 fb$^{-1}$ of 13 TeV proton-proton collisions for Drell-Yan produced quirks. The quirk dynamics is simulated with Geant4 in a parametric CMS-like detector, and the event selection is emulated and combined with the public likelihoods. The emulation reproduces the published limits on a heavy charged lepton within 11%. For an $SU(2)$-doublet quirk with one (two) infracolors, masses up to 870 (970) GeV are excluded for $Λ\\lesssim70$ eV, where the quirks behave as independent heavy stable charged particles. For $Λ\\gtrsim10$ keV, where the pair moves as one doubly ionizing object, the limit is 280 (320) GeV. In between, the quirks turn around inside the detector and the search has no sensitivity. For the $SU(2)$-singlet benchmark of the FASER search, with two infracolors, the limits reach 990 GeV below 100 eV, where FASER has no sensitivity, and 300 GeV above 10 keV, beyond the FASER exclusion of 175 GeV."},{"arxiv":"2611.11254","id":"3226467","title":"Probing the Supersymmetric Grand Unified Theories with Anomaly Mediation at the Future Proton-Proton Colliders and Hyper-Kamiokande Experiment","authors":"Waqas Ahmed, Tianjun Li, Shabbar Raza","score":6.8,"section":"new","rank":49,"parts":[0.0,0.12,0.21,0.0,0.0],"note":"Closest of your papers: [[1655573]] (coupling 0.04, 3 shared references). Closest network paper: [[2744388]] (coupling 0.07, 16 shared references).","abstract":"With the grand desert hypothesis, we investigate the Supersymmetric (SUSY) Grand Unified Theories (GUTs) with the minimal anomaly mediated supersymmetry breaking (AMSB) as a continuation of our program of studying SUSY GUTs at the future 100 TeV proton-proton Collider such as $\\rm FCC_{hh}$ and SppC as well as proton-decay experiment such as Hyper-Kamiokande experiment. We show that for the GUT scale $M_{GUT} \\ge 0.84 \\times 10^{16}$ GeV, the upper mass bounds on the gluino and first two generation squarks are 8 TeV and 6 TeV, respectively. Therefore, the gluino and first two generation squarks can be probed at the $\\rm FCC_{hh}$ and SppC. In addition, we discuss the mass spectra for the colored sparticles, sleptons, pseudo-scalar Higgs and electroweakinos. We also shed light on the possible search strategies of gluino and winos at the future 100 TeV colliders. Moreover, for $\\rm M_{\\rm GUT} \\le 0.84 \\times 10^{16}$ GeV, the proton lifetime for dimension-six proton decay via heavy gauge boson exchange is less than or around $5 \\times 10^{34}$ years, and thus we can probe it at the Hyper-Kamiokande experiment. To be concrete, we present a couple of benchmark points representing the above two mentioned GUT conditions on $\\rm M_{\\rm GUT}$."},{"arxiv":"2607.26124","id":"3184310","title":"Gravitational Waves from Multiple Cosmic Superstrings and the Overshoot Problem","authors":"Luca Brunelli, Michele Cicoli, Muhammad Hassan, Seyed Ehsan Qoreishi, Francisco Gil Pedro","score":6.2,"section":"replacement","rank":50,"parts":[0.0,0.08,0.18,0.0,0.11],"note":"Closest of your papers: [[1655573]] (coupling 0.03, 2 shared references). Closest network paper: [[2821768]] (coupling 0.06, 4 shared references). Shared topics: gravitational wave.","abstract":"Post inflationary string cosmology can feature an initial population of multiple species of cosmic superstrings whose tension is controlled by a modulus rolling over a steep potential toward a late-time minimum. We perform a full analysis of the associated dynamical system, finding that overshooting the minimum is prevented by the friction of a radiation background of gravitational waves produced from the early decay of effective strings arising from NS5- and D3-branes wrapped around internal cycles. On the other hand, fundamental strings survive longer and decay when the modulus is oscillating around the minimum and they have about $1/3$ of the total energy density. The spectrum of gravitational waves generated by the decays of these multiple cosmic superstrings, even if diluted by a late epoch of modulus domination, can still result in a high-frequency, multi-peaked signal, offering an observational signature of generic features of string theory."},{"arxiv":"2611.12105","id":"3226562","title":"Theoretical constraints on beyond Standard Model extensions of the Higgs potential","authors":"Javier E. Pena-Vico, Carlos Quezada-Calonge, Juan J. Sanz-Cillero","score":6.1,"section":"new","rank":51,"parts":[0.0,0.12,0.17,0.0,0.0],"note":"Closest of your papers: [[2794409]] (coupling 0.04, 4 shared references). Closest network paper: [[2686887]] (coupling 0.06, 6 shared references).","abstract":"A fundamental requirement for the consistency of quantum field theories is that their Higgs potential is lower-bounded, such that no direction in the $Φ$ field space leads to $V(Φ)\\to \\, -\\infty$. This work presents a comprehensive analysis of the various theoretical constraints on potentials in extended Higgs sectors, highlighting their relative impact and restrictiveness. We illustrate our study on the potential parameters with two particular Higgs sector extensions: the Real Singlet Extension (RSE) and the Two-Higgs-Doublet Model (2HDM), separating $\\mathbb{Z}_{2}$-conserving and $\\mathbb{Z}_{2}$-violating cases. In order to do this, we derive and compare these conditions to other studies found in the literature. Additionally, we developed a publicly available code capable of testing positivity conditions in complex potentials, including particularly challenging cases such as the general $\\mathbb{Z}_2$-violating 2HDM. Finally, we apply those restrictions to the physical parameters and deduce an upper and a lower bound on the masses of new heavy scalars."},{"arxiv":"2607.03840","id":"3177520","title":"Neutron stars with an agnostic Dark sector: Core and Halo configurations from a two-fluid approach","authors":"Asit karan, Tuhin Malik, Asim Kumar Saha, Constança Providência, Ritam Mallick","score":6.1,"section":"replacement","rank":52,"parts":[0.0,0.01,0.14,0.0,0.38],"note":"Closest of your papers: [[2787444]] (coupling 0.00, 1 shared references). Closest network paper: [[2843822]] (coupling 0.05, 6 shared references). Shared topics: dark sector, dark matter, dark matter particle.","abstract":"The study of dark matter admixed neutron stars has the potential to advance our understanding of dark matter particle candidates. However, the large parameter space of dark matter particle masses restricts a systematic, model-independent study. In this analysis, we employ agnostic hadronic and dark-matter equations of state to construct dark-matter-admixed neutron stars within a two-fluid formalism. Dark matter is characterized solely by its low-density equation of state and mass and is modeled as a Fermi gas, while hadronic matter is anchored at low and high densities by chiral effective field theory and perturbative quantum chromodynamics calculations. A speed-of-sound parametrization describes the intermediate- and high-density regimes of both hadronic and dark matter, enabling an agnostic treatment of the dark matter equation of state that is constrained only by thermodynamic consistency and does not favor softer or stiffer behavior. Within this agnostic framework, we find that dark matter does not generically compactify the star: light dark matter forms extended halos that raise the tidal deformability, while heavy dark matter forms compact cores that lower it. Consequently, the dominant observational constraint shifts from gravitational-wave tidal deformability for light, halo-dominated models to NICER mass-radius data for heavy, core-dominated models. Using current data at $1σ$, we constrain the dark matter fraction to $f_{\\mathrm{DM}} \\lesssim 0.11$ for light dark matter. By treating the medium- and high-density dark matter equation of state agnostically within a fermionic framework, our approach yields conservative and broadly applicable bounds on the dark matter content of neutron stars. Neutron stars with similar masses but very different tidal deformabilities could be a smoking-gun signature of dark matter in neutron stars."},{"arxiv":"2611.12282","id":"3226591","title":"A Self-Interacting Dark-Matter Route to Supermassive Kerr Black Holes via Super-Eddington Bondi Accretion: Mass-Spin Evolution","authors":"Chian-Shu Chen, Feng-Li Lin","score":5.8,"section":"new","rank":53,"parts":[0.0,0.04,0.13,0.0,0.25],"note":"Closest of your papers: [[1824064]] (coupling 0.02, 1 shared references). Closest network paper: [[2923472]] (coupling 0.05, 3 shared references). Shared topics: early universe, dark matter.","abstract":"Recent JWST observations motivate mechanisms for rapid black-hole growth in the early Universe. Extending our previous Schwarzschild study, we show that critical relativistic Bondi accretion of repulsively self-interacting dark matter remains an efficient super-Eddington channel for Kerr black holes with rotating inflow. Within a stationary equatorial quasi-spherical framework, smooth critical solutions exist over a finite range of inflow angular momentum set by the Kerr marginally bound capture values. Rotation changes the sonic structure and accretion efficiency, while the critical density cancellation and dark-sector/halo matching retain their Schwarzschild form. The resulting rapid growth persists until the finite halo supply becomes limiting. Because the inflow also carries angular momentum, stellar-mass seeds can grow and spin up simultaneously; illustrative population evolutions therefore provide a joint mass--spin route to early supermassive Kerr black holes."},{"arxiv":"2607.06042","id":"3178058","title":"Background-independent one-loop renormalization of tensor and scalar primordial spectra","authors":"Guillermo Ballesteros, Jesús Gambín Egea, Flavio Riccardi","score":5.4,"section":"replacement","rank":54,"parts":[0.0,0.04,0.28,0.0,0.0],"note":"Closest of your papers: [[2039411]] (coupling 0.01, 2 shared references). Closest network paper: [[2665331]] (coupling 0.10, 7 shared references).","abstract":"We present a background-independent renormalization framework for one-loop primordial spectra. We apply it to two observables: the scalar-induced tensor spectrum sourced by a minimally coupled spectator field, and the scalar spectrum generated by potential self-interactions. In both cases, the UV part of the loops is isolated and, using the universal WKB behavior of the internal modes, the UV poles are extracted analytically and absorbed into local counterterms without having to specify either the background evolution or the full dynamics of the field running in the loop. This yields finite model-independent expressions for the renormalized spectra amenable to numerical analysis."},{"arxiv":"2611.12749","id":"3226646","title":"A possible signature of neutrino spin precession in the J-PARC muon $g-2$ experiment","authors":"S. Carneiro, F. C. Sobrinho","score":5.0,"section":"new","rank":55,"parts":[0.0,0.04,0.25,0.0,0.0],"note":"Closest of your papers: [[2690106]] (coupling 0.01, 1 shared references). Closest network paper: [[2873857]] (coupling 0.09, 4 shared references).","abstract":"We examine a possible signature of the neutrino angular-momentum contribution to the muon magnetic anomaly measurement in the J-PARC E34 experiment. In previous papers we argued that the angular momentum carried by the unobserved neutrino pair may leave an uncertainty in the anomaly inferred from the time modulation of detected positrons. At Fermilab the highly relativistic muons make the forward-emission approximation suitable for this estimate. The lower muon momentum at J-PARC requires the decay kinematics to be treated explicitly. We integrate the longitudinal momentum of the neutrino pair using the positron energy distribution and asymmetry derived from the theoretical weak-decay spectrum, and the same event-counting weight $N(E)A(E)$ is employed for both experiments. For positron energies between $1.5$ and $2.9$ GeV at Fermilab and between $200$ and $275$ MeV at J-PARC, the proposed correction is smaller at J-PARC by $0.415\\pm0.176$ ppm, when the most optimistic E34 precision is assumed. The expected difference amounts to $2.36$ standard deviations if the future measurement is centred on this value. The calculation thus identifies an experimental comparison which may test the proposed effect independently of the hadronic contribution to the Standard Model prediction. We also examine the possibility of testing the effect by comparing measurements at two different muon momenta. With a fixed positron energy threshold of 200 MeV, the maximum sensitivity is obtained at a muon beam energy of 245 MeV. The predicted difference relative to the nominal J-PARC configuration has significance of $4.88σ$ for the most optimistic experimental sensitivity."},{"arxiv":"2611.10465","id":"3226471","title":"NuSTEC Review: Current Experimental and Theoretical Challenges of Neutrino-Nucleus Scattering","authors":"A. P. Furmanski, J. G. Morfín, L. Alvarez-Ruso, A. M. Ankowski, A. Ashkenazi, M. Sajjad Athar, S. Dolan, S. Dytman, S. Gardiner, R. González-Jiménez, R. J. Hill, M. Hostert, J. Isaacson, N. Jachowicz, M. Kabirnezhad, T. Katori, S. R. Klein, F. Kling, M. Martini, G. D. Megias, B. A. Messerly, K. Niewczas, A. Nikolakopoulos, J. Nowak, J. M. Paley, V. Pandey, A. Papadopoulou, L. Pickering, N. Rocco, J. T. Sobczyk, J. E. Sobczyk, C. Thorpe, C. Wret","score":5.0,"section":"cross","rank":56,"parts":[0.0,0.04,0.25,0.0,0.0],"note":"Closest of your papers: [[3146383]] (coupling 0.01, 4 shared references). Closest network paper: [[3214448]] (coupling 0.09, 30 shared references).","abstract":"The precise measurement of neutrino properties is among the highest priorities in fundamental particle physics, involving many experimental and theoretical efforts worldwide. Since the experiments rely on the interactions of neutrinos in the nuclear environment, the planned advances in the scope and precision of these experiments require a commensurate effort in understanding and modeling the hadronic and nuclear physics of these interactions, as incorporated in neutrino event generators. This modeling is essential to every phase of the experimental analyses, and the theoretical uncertainties play an important role in interpreting experimental results. In this Review of current challenges, we summarize the open questions in neutrino-nucleus interactions at GeV-scale energies, and discuss in detail the potential impacts of these unknowns on the measurement of neutrino properties, using the determination of oscillation parameters as a central example. After an Executive Summary and a concise Overview of the issues, we address how the neutrino event generators treat these challenges, how electron-nucleus interactions can help understanding these challenges and the important unanswered questions for each underlying physics process---from quasi-elastic to deep-inelastic scattering. Across every topic, we find that current challenges can be met only through active support and collaboration among specialists in strong interactions and electroweak physics, including theorists and experimentalists from both the nuclear and high-energy physics communities."},{"arxiv":"2611.12373","id":"3226590","title":"Magnetic moments of the $Σ_c$ and $Σ_b$ baryons from external-field QCD sum rules","authors":"Halil Mutuk","score":4.6,"section":"new","rank":57,"parts":[0.06,0.02,0.14,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[3184726]] (coupling 0.01, 1 shared references). Closest network paper: [[3217357]] (coupling 0.05, 3 shared references).","abstract":"We compute the magnetic moments of the $Σ_c$ and $Σ_b$ isotriplets with external-field QCD sum rules. The heavy-quark propagator is kept with its full mass dependence and with its couplings to the photon, to soft gluons and to both simultaneously, and the magnetic sum rule is normalized by the mass sum rule of the same interpolating field, which removes the residue and gives the baryon masses within a few percent. The quark-condensate magnetic susceptibility $χ$, which otherwise dominates the uncertainty, is fixed by the proton magnetic moment computed with the same interpolating field; the neutron moment then follows to about $5\\%$. Uncertainties from the QCD inputs are evaluated with a Monte Carlo analysis, and those from the interpolating field, the Borel window, the scale of the heavy-quark mass, the calibration and the normalization are added. With $\\overline{\\rm MS}$ heavy-quark masses we obtain $μ_{Σ_c^{++}}=2.37\\pm0.65$, $μ_{Σ_c^{+}}=0.50\\pm0.15$, $μ_{Σ_c^{0}}=-1.39\\pm0.37$, $μ_{Σ_b^{+}}=2.16\\pm0.65$, $μ_{Σ_b^{0}}=0.55\\pm0.16$ and $μ_{Σ_b^{-}}=-1.06\\pm0.32$ in nuclear magnetons; at this order the results depend sizably on the heavy-quark mass scheme. The moments are carried by the light diquark; the heavy-quark contribution, whose separation depends on the interpolating field, is $-0.13\\pm0.02\\,μ_N$ for $Σ_c$ and $+0.013\\pm0.003\\,μ_N$ for $Σ_b$."}],"rest":[{"arxiv":"2605.21908","title":"Semileptonic sum rules in heavy-to-light charm decays","score":4.6,"section":"replacement","rank":58},{"arxiv":"2607.14986","title":"Relativistic corrections and high-energy resummation for exclusive heavy quarkonium photoproduction","score":4.6,"section":"replacement","rank":59},{"arxiv":"2606.11713","title":"Revisiting the Axi function showTip(ev,n){const b=document.getElementById('chart').getBoundingClientRect();tip.hidden=false;tip.textContent=`${auth(n)} (${n.year}) — ${plain(n.title)}`+(isNew(n)?` · score ${n.score}`:'');
  let L=ev.clientX-b.left+12;if(L>b.width-290)L=ev.clientX-b.left-290;tip.style.left=Math.max(4,L)+'px';tip.style.top=(ev.clientY-b.top+12)+'px'}
function paint(){if(!G)return;const f=hover||sel,on=new Set();if(f){on.add(f.i);f.out.forEach(i=>on.add(i));f.inn.forEach(i=>on.add(i))}
  svg.classed('dim',!!f);
  G.selectAll('path.edge').attr('class',l=>'edge '+l.k+(!f?'':l.s===f.i?' hot out':l.t===f.i?' hot in':''));G.selectAll('path.edge.hot').raise();
  G.selectAll('circle').classed('on',s=>on.has(s.n.i)).classed('sel',s=>sel&&s.n.i===sel.i).classed('match',s=>query&&`${s.n.first} ${s.n.title} ${s.n.arxiv} ${s.n.authors||''}`.toLowerCase().includes(query));
  G.selectAll('text.nlabel').classed('on',l=>on.has(l.s.n.i))}
function panel(){const p=document.getElementById('panel'),n=sel;
  if(!n){p.innerHTML='<p>Select a paper in the network.</p>';return}
  const links=`<div class="links">${n.id?`<a href="https://inspirehep.net/literature/${n.id}" target="_blank" rel="noopener">INSPIRE</a>`:''}${n.arxiv?`<a href="https://arxiv.org/abs/${esc(n.arxiv)}" target="_blank" rel="noopener">arXiv</a>`:''}</div>`;
  if(isNew(n)) p.innerHTML=`<div class="role" style="color:${col(n)}">#${n.rank} · ${esc(SEC[n.section])} · score ${n.score.toFixed(1)}</div><h4>${esc(n.title)}</h4>
   <div class="meta">${esc(auth(n))} · arXiv:${esc(n.arxiv)}</div><p>${why(n.note)}</p><div class="links"><a href="#p${n.i}">Back to abstract</a></div>`;
  else p.innerHTML=`<div class="role" style="color:${col(n)}">${esc(ROLE[n.role])}</div><h4>${esc(n.title)}</h4>
   <div class="meta">${esc(auth(n))} · ${n.year}${n.arxiv?' · arXiv:'+esc(n.arxiv):''}</div>
   <div class="stats"><span>${n.cites.toLocaleString()} citations</span><span>${n.inn.filter(i=>isNew(N[i])).length} of the matches link here</span></div>${links}`;
  tex(p)}
function pick(n,scroll){sel=n;panel();paint();document.querySelectorAll('.paper').forEach(el=>el.classList.toggle('sel',el.id==='p'+n.i));if(scroll)document.getElementById('chart').scrollIntoView({behavior:'smooth',block:'nearest'})}
const present=new Set(N.map(n=>n.role));
document.getElementById('legend').innerHTML=['today','repl','seed','other'].filter(k=>present.has(k)).map(k=>`<span><i class="dot" style="background:var(--${k})"></i>${esc(ROLE[k])}</span>`).join('')+'<span style="color:var(--fg-3)">Listing papers: size ∝ score; others: size ∝ log(citations)</span>';
document.getElementById('q').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();paint()});
svg.on('click',ev=>{if(ev.target.tagName!=='circle'){sel=null;panel();paint()}});
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(draw,200)});
function nextList(){const X=RAW.next||[];if(!X.length)return;const box=document.getElementById('nextlist'),more=document.getElementById('more');
  more.hidden=false;more.querySelector('summary').firstChild.textContent=`The next ${X.length} papers by score `;
  const nmin=M.nextMin;
  document.getElementById('moresub').textContent=`below the threshold of ${M.threshold}${nmin!=null?`: every paper scoring ${nmin} or more, and at least ${M.nextCount} when available`:''}; not drawn in the network`;
  const cut=nmin!=null?X.findIndex(n=>n.score<nmin):-1;
  box.innerHTML=X.map((n,i)=>(i===cut?`<li class="divider">Below ${nmin}: weaker relation (most of these share no specific reference, coupling or topic with your work)</li>`:'')+`<li><div class="role" style="color:var(--${n.section==='replacement'?'repl':'today'})">#${n.rank} · ${esc(SEC[n.section])} · score ${n.score.toFixed(1)}</div>
    <div class="t">${esc(n.title)}</div><div class="authors">${authors(n.authors)} · arXiv:${esc(n.arxiv)}</div>
    ${n.note?`<p class="why">${why(n.note)}</p>`:''}
    <details class="abs"><summary>Abstract</summary><p class="abs">${esc(n.abstract)}</p></details>
    <div class="links">${n.id?`<a href="https://inspirehep.net/literature/${n.id}" target="_blank" rel="noopener">INSPIRE</a>`:''}<a href="https://arxiv.org/abs/${esc(n.arxiv)}" target="_blank" rel="noopener">arXiv</a><a href="https://arxiv.org/pdf/${esc(n.arxiv)}" target="_blank" rel="noopener">PDF</a></div></li>`).join('');
  more.addEventListener('toggle',()=>{if(more.open)tex(box)})}
const rtip=document.getElementById('reftip');let rcur=null;
function refShow(el){const r=REFS[el.dataset.ref];if(!r)return;rcur=el;rtip.textContent=`${auth(r)} (${r.year}) — ${plain(r.title)}`;rtip.hidden=false;
  const b=el.getBoundingClientRect(),t=rtip.getBoundingClientRect();let L=Math.min(Math.max(8,b.left),innerWidth-t.width-8),T=b.bottom+6;
  if(T+t.height>innerHeight-8)T=b.top-t.height-6;rtip.style.left=L+'px';rtip.style.top=T+'px'}
function refHide(){rtip.hidden=true;rcur=null}
document.addEventListener('pointerover',e=>{const el=e.target.closest('.ref');if(el&&e.pointerType==='mouse')refShow(el)});
document.addEventListener('pointerout',e=>{if(e.target.closest('.ref')&&e.pointerType==='mouse')refHide()});
document.addEventListener('click',e=>{const el=e.target.closest('.ref');if(el)refShow(el);else if(rcur)refHide()});
document.addEventListener('focusin',e=>{const el=e.target.closest('.ref');if(el)refShow(el)});
document.addEventListener('focusout',e=>{if(e.target.closest('.ref'))refHide()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')refHide()});
addEventListener('scroll',()=>{if(rcur)refHide()},{passive:true});
// the rest of the day's papers by score: only the title, linked to the arXiv record
function restList(){const X=RAW.rest||[];if(!X.length)return;const d=document.getElementById('rest'),box=document.getElementById('restlist');
  d.hidden=false;d.querySelector('summary').firstChild.textContent=`All other ${X.length} papers in this listing `;
  document.getElementById('restsub').textContent='by score, title only';
  box.innerHTML=X.map(n=>`<li><span class="sc">#${n.rank} · ${n.score.toFixed(1)}</span><a href="https://arxiv.org/abs/${esc(n.arxiv)}" target="_blank" rel="noopener">${esc(n.title)}</a></li>`).join('');
  d.addEventListener('toggle',()=>{if(d.open)tex(box)})}
list();nextList();restList();fold();draw();panel();
window.addEventListener('load',()=>{tex(document.getElementById('list'));tex(document.getElementById('panel'));fold();
  if(window.MathJax&&MathJax.startup&&MathJax.startup.promise)MathJax.startup.promise.then(()=>setTimeout(fold,300))});
addEventListener('resize',()=>{clearTimeout(window._ft);window._ft=setTimeout(fold,200)});
</script>
