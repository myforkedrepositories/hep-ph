name: hep-ph network pages

# Builds docs/ (served by GitHub Pages): one ranked hep-ph listing per announcement day for the
# last 5 days, matched against the INSPIRE citation network of author 991924, plus docs/index.html.
on:
  schedule:
    # One late run per weekday: 21:17 Bogotá Monday-Friday (02:17 UTC Tuesday-Saturday). By then the
    # day's listing, announced the evening before, is on INSPIRE with its references.
    - cron: "17 2 * * 2-6"
  workflow_dispatch:
    inputs:
      rebuild_network:
        description: "Rebuild the INSPIRE network file even if it is recent"
        type: boolean
        default: false
  push:
    branches: [main]   # generated pages are committed on main only (PR branches would conflict)
    paths: ["tools/**", ".github/workflows/hep-ph-pages.yml"]

permissions:
  contents: write

concurrency:
  group: hep-ph-pages-${{ github.ref }}
  cancel-in-progress: false

env:
  AUTHOR: "991924"
  NETWORK: data/inspire/network_991924.json

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the citation network (hep-network-builder)
        run: |
          stale=$(python3 - <<'EOF'
          import json, os, datetime
          p = os.environ["NETWORK"]
          if not os.path.exists(p): print("yes")
          else:
              b = datetime.date.fromisoformat(json.load(open(p))["built"])
              print("yes" if (datetime.date.today() - b).days > 30 else "no")
          EOF
          )
          if [ "$stale" = "yes" ] || [ "${{ inputs.rebuild_network }}" = "true" ]; then
            python3 -I tools/build_network.py --author-recid "$AUTHOR" --max-authors 10 --out "$NETWORK.tmp"
            mv "$NETWORK.tmp" "$NETWORK"
          else
            echo "network file is recent; keeping it"
          fi

      - name: Build the daily pages and the index (hep-ph-network-match)
        run: python3 -I tools/build_site.py --network "$NETWORK" --site docs --days 5 --include-today

      - name: Commit the site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add docs "$NETWORK"
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Update hep-ph network pages ($(date -u +%Y-%m-%d))"
          # Another run (or a merge) may have pushed generated files meanwhile: merge it, keeping
          # this run's version of any conflicting file, and push again.
          for i in 1 2 3; do
            git push origin HEAD:${{ github.ref_name }} && exit 0
            git fetch origin ${{ github.ref_name }}
            git merge --no-edit -X ours origin/${{ github.ref_name }}
          done
          exit 1
