fermionic theory spaces. Extending the construction of Craig and Sutherland, we compare a nearest-neighbour chain, a non-local graph with distance-suppressed links, and a sparse Petersen-type graph, for Dirac and Majorana neutrinos. Strong site disorder suppresses boundary propagation through localisation. When the heavy mass matrix instead has a dominant approximately uniform diagonal, light masses can arise from cancellations in its inverse. A path expansion makes the dependence on graph connectivity explicit. Our benchmark ensembles display broad mixing distributions for some flavour couplings and peaked distributions for others, particularly with weak site disorder and structured flavour input. These observations do not establish a Haar distribution at strong disorder or a statistical preference over neutrino anarchy at weak disorder. The results identify conditions under which disorder can preserve structured mixing, while leaving its quantitative explanatory advantage to a controlled ensemble comparison."},{"arxiv":"2610.33593","id":"3218847","title":"A Tool-Grounded AI Agent for Gauge Coupling Unification and Proton Decay","authors":"Shaikh Saad","score":8.4,"section":"new","rank":31,"parts":[0.0,0.11,0.35,0.0,0.0],"note":"Closest of your papers: [[1249404]] (coupling 0.03, 8 shared references). Closest network paper: [[1861353]] (coupling 0.12, 12 shared references).","abstract":"We present proton_agent, a tool-grounded AI agent that enables natural-language interaction with computational tools for gauge coupling unification and proton decay in grand unified theories. The agent translates user requests into computational tasks, selects and executes the appropriate tools, and interprets their outputs. All numerical calculations, model evaluations, experimental comparisons, parameter scans, and visualizations are handled by a deterministic scientific backend to ensure numerical accuracy and reproducibility. A central objective of this framework is to enable fully local deployment using free and open-source LLMs, while retaining compatibility with commercial LLM APIs. The framework computes one- and two-loop gauge beta coefficients for user-defined scalar and fermion multiplets and performs gauge coupling evolution through the Standard Model and various intermediate symmetry-breaking stages of $SO(10)$, including $SU(3)_C \\times SU(2)_L \\times SU(2)_R \\times U(1)_{B-L}$, $SU(3)_C \\times SU(2)_L \\times U(1)_R \\times U(1)_{B-L}$, $SU(4)_C \\times SU(2)_L \\times U(1)_R$, and $SU(4)_C \\times SU(2)_L \\times SU(2)_R$. For proton decay, the framework evaluates gauge-mediated dimension-six contributions in non-supersymmetric $SU(5)$ and $SO(10)$, as well as dressed dimension-five contributions in their supersymmetric counterparts. It supports benchmark calculations for user-specified parameter points, random and grid-based parameter scans, Markov-chain Monte Carlo exploration, comparisons with experimental limits, and publication-ready two- and three-dimensional visualizations. We describe the agent architecture, demonstrate its capabilities through representative benchmark calculations and regression tests, and discuss its current physics scope."},{"arxiv":"2610.35818","id":"3219126","title":"Holographic Approaches to Hadron Structure","authors":"Luigi Cappiello, Anton Rebhan, Shigeki Sugimoto","score":6.9,"section":"new","rank":32,"parts":[0.06,0.04,0.09,0.0,0.24],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[636564]] (coupling 0.01, 2 shared references). Closest network paper: [[2858283]] (coupling 0.03, 5 shared references). Shared topics: minimal model.","abstract":"We give an introduction to and an overview of holographic approaches to QCD and hadron structure. After an introduction to the string-theoretic foundations of holographic QCD, we review the predictions of top-down and bottom-up models for the phenomenology of mesons, baryons, and glueballs. We focus on the top-down model following from probe flavor branes in the Witten model of low-energy Yang-Mills theory and, in the more phenomenological approach of bottom-up models, on minimal models based on five-dimensional anti-de Sitter space."},{"arxiv":"2607.08175","id":"3178722","title":"Transformer-based machine learning using low-level calorimeter signals for collimated photon identification at collider experiments","authors":"Gabriel Matos, Lauren Larson, Abhilasha Dave, Maria Bressan, Azal Amer, Cindy Liu, Nikiforos Nikiforou, Jonathan Long, Timothy Andeen, John Parsons, Julia Gonski","score":6.5,"section":"replacement","rank":33,"parts":[0.0,0.12,0.19,0.0,0.0],"note":"Closest of your papers: [[1597138]] (coupling 0.04, 8 shared references). Closest network paper: [[1625119]] (coupling 0.07, 8 shared references).","abstract":"Electromagnetic calorimeters provide essential information for reconstructing and selecting both Standard Model (SM) and potential beyond the SM physics events at high-energy particle colliders. The fine-grained segmentation of modern calorimeters captures rich information about the internal structure of particle showers, much of which is discarded by conventional high-level reconstruction methods. In this work, we leverage calorimeter cell-level information to classify highly collimated diphoton signatures, arising from the decay of light axion-like particles, from isolated single-photon showers. We systematically compare a range of machine learning architectures, spanning high-level, shower shape variable-based approaches and direct cell-level methods. Cell-level machine learning shows significantly superior classification ability, with a Transformer in particular representing the best performance among six different architectures studied, and an MLP Mixer representing a resource-constrained alternative for potential real-time, trigger-level applications. Beyond classification, the Transformer model developed enables direct invariant mass regression from calorimeter cells, improving the characterization of light resonances and providing an additional handle in reducing the $π^0$ and $η$ fake photon backgrounds. These results demonstrate that cell-level machine learning methods can extend calorimeter-based particle identification and performance well beyond the capabilities of current conventional techniques."},{"arxiv":"2610.33152","id":"3218788","title":"A Low Scale for Quark-Lepton Unification","authors":"Lawrence J. Hall, Claudio Andrea Manzari, Clara Murgui","score":6.2,"section":"new","rank":34,"parts":[0.06,0.05,0.19,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1413755]] (coupling 0.02, 2 shared references). Closest network paper: [[3204120]] (coupling 0.07, 10 shared references).","abstract":"The measured fermion masses may be pointing to the scale of quark-lepton unification. Studying the renormalization-group evolution of the Standard Model Yukawa couplings, we find that $y_τ=y_b$ and $y_μ=3y_s$ occur at nearly the same scale, around $10^6$ GeV, while the first generation reaches the Georgi-Jarlskog relation $y_e\\simeq y_d/3$ at order $10^8$ GeV and can arise from the same Clebsch structure through a simple hierarchical flavor texture. This pattern naturally suggests low-scale Pati-Salam symmetry. We show that flavor mixing and finite threshold corrections preserve this picture. If the electron mass has an independent origin, the two heavier-generation relations can be realized in theories with a unification scale as low as $(5$-$7)\\times10^5$ GeV. We identify two simple theories that accommodate all three relations and in which the measured masses fix the flavor structure. The first unifies all three generations at $4.6^{+1.2}_{-0.9}\\times10^6$ GeV; the second, with symmetric Yukawa matrices, at $1.5^{+0.7}_{-0.5}\\times10^7$ GeV, and predicts $|V_{cb}|=0.042\\pm0.002$. Their shared light-family texture fixes the relevant vector-leptoquark couplings, making $μ\\to e$ conversion in nuclei a direct test of unification: upcoming searches will probe part of the region selected by the two theories, and proposed facilities could cover it completely."},{"arxiv":"2610.33611","id":"3218852","title":"Spectroscopy of the SU(2) scalar-fermion-gauge system under the influence of the Brout-Englert-Higgs effect","authors":"Axel Maas, Sofie Martins, Georg Wieland","score":6.2,"section":"cross","rank":35,"parts":[0.0,0.0,0.14,0.0,0.41],"note":"Closest network paper: [[3091093]] (coupling 0.05, 4 shared references). Shared topics: scalar doublet.","abstract":"We investigate the ground state spectrum of a dynamical scalar-fermion-gauge system with an SU(2) gauge group, a scalar doublet, and two degenerate generations of vectorial fermions under the influence of the Brout-Englert-Higgs effect. To this end, we employ lattice methods using the HiRep code. We study the dependence of the system on the (bare) fermion mass and find that the spectrum remains unaffected, up to trivial fermion mass effects. The results are in line with a weakly coupled theory exhibiting the Fröhlich-Morchio-Strocchi mechanism."},{"arxiv":"2601.01579","id":"3097802","title":"Unraveling Dirac Magnetic Monopoles with Muon Beams at TeV Energies Using Machine Learning","authors":"M. Tayyab Javaid, Haroon Sagheer, M. Danial Farooq, Ijaz Ahmed, Jamil Muhammad","score":6.2,"section":"replacement","rank":36,"parts":[0.0,0.05,0.31,0.0,0.0],"note":"Closest of your papers: [[1663960]] (coupling 0.02, 1 shared references). Closest network paper: [[2115290]] (coupling 0.11, 6 shared references).","abstract":"The focus of this paper is the production of magnetic monopoles via the Drell-Yan and photon-fusion mechanisms to generate velocity-dependent scalar, fermionic, and vector monopoles of spin angular momentum 0, 1/2, 1, respectively at a future muon collider. A computational study compares the monopole pair-production cross-sections for both methods at various center-of-mass energies ($\\sqrt{s}$) with different magnetic dipole moments. The comparison of kinematic distributions of monopoles at the generator and reconstructed level is demonstrated for both DY and PF mechanisms. We demonstrate the observability of magnetic monopoles against the most relevant Standard Model background using multivariate analysis techniques. Specifically, we apply three different classifiers based on neural networks, e.g., Boosted Decision Trees, Multilayer Perceptrons, and Likelihood methods, to evaluate their effectiveness. Our results highlight the efficiency and robustness of these approaches in distinguishing magnetic monopole signals from background noise. Quantitatively, our analysis shows that the Photon-Fusion mechanism significantly dominates at high energies; for a spin-1/2 monopole with a mass of 1.5 TeV at $\\sqrt{s}=30$ TeV, the PF cross-section (13.33 Pb) is approximately 30 times larger than the Drell-Yan process (0.44 Pb). Furthermore, the Boosted Decision Tree (BDT) classifier outperforms other methods, reaching a signal efficiency of 0.97 and a statistical significance of 22.80 at an optimal cut of 0.042, with an AUC value of 0.989, underscoring the high discovery potential for magnetic monopoles in multi-TeV muon collisions."},{"arxiv":"2610.35124","id":"3219013","title":"Relating Dark Dimension Size with Dark Energy via 5D Quintessence Potential and Casimir Energy","authors":"Rashmikanta Mantry, Kazuyuki Furuuchi","score":5.9,"section":"cross","rank":37,"parts":[0.0,0.05,0.13,0.0,0.27],"note":"Closest of your papers: [[3184726]] (coupling 0.01, 3 shared references). Closest network paper: [[2936613]] (coupling 0.04, 3 shared references). Shared topics: turn out.","abstract":"We explore effective field theory (EFT) realizations of the dark dimension (DD) scenario in which the size of the DD is determined by the competition between a 5D quintessence potential and the Casimir energy. When only contributions from massless fields are considered, the Casimir energy does not have a typical energy scale, and the 4D dark energy (DE) scale is set by the height of the 5D quintessence potential. The simple 5D model we first study has an attractive feature that the size of the DD is related to the 4D vacuum energy (VE), as outlined above. However, it turns out that the 4D VE thus obtained cannot work as the 4D DE in the standard cosmological setting. One of the discrepancies between the VE and the DE manifests in the radion dependence of the effective 4D Newton's gravitational constant. This leads us to explore a 5D model in which the 4D Einstein-Hilbert (EH) action is dominantly induced by quantum effects, leaving the radion dependence of the 4D Newton's constant subdominant. This model leads to an attractive cosmological model, realizing the mechanism explained in the beginning. We also explore a 6D model with the total internal volume fixed, to make the 4D Newton's constant independent of the radion. We first study a scenario in which the sizes of the 5th and the 6th dimensions are of the same order. In this scenario, the physical origin of the size of the DD is left to its UV completion. Next, we turn to a scenario in which there is a large hierarchy between the sizes of the 5th and the 6th dimensions. In this scenario, the energy scale of the 5D quintessence potential turns out to be much higher than the energy scale of the 4D DE as inferred from the cosmological observations, so we need to subtract a constant term in 4D to tune the 4D DE. This prevents us from obtaining the scaling relation for the DE expected in the dSDC."},{"arxiv":"2610.33729","id":"3218865","title":"Exploring the Limits: Neutrino Mass and Interacting Dark Sector in the DESI Era","authors":"Weiqiang Yang, Sibo Zhang, Supriya Pan, Luis A. Anchordoqui, Eleonora Di Valentino","score":5.2,"section":"new","rank":38,"parts":[0.0,0.02,0.07,0.0,0.34],"note":"Closest of your papers: [[2751074]] (coupling 0.01, 2 shared references). Closest network paper: [[2895271]] (coupling 0.02, 5 shared references). Shared topics: neutrino mass, dark sector.","abstract":"We constrain three interacting dark matter--dark energy scenarios using cosmic microwave background measurements, DESI DR2 baryon acoustic oscillations, and the PantheonPlus, Union3, and DES-Dovekie Type Ia supernova compilations. We consider interacting vacuum energy and interacting dark energy with a constant equation of state in the phantom and quintessence regimes, analyzing each scenario with either a fixed total neutrino mass or a freely varying effective neutrino mass. When the positivity prior is relaxed, all three scenarios favor negative effective neutrino masses for every dataset combination. Although some combinations permit small positive masses, none of the 95\\% confidence intervals reaches the minimum mass required by neutrino oscillation experiments. Allowing the effective neutrino mass to vary produces significances for a nonzero coupling reaching approximately $3σ$, but the preferred masses remain negative. These results demonstrate that the interaction and constant dark energy equations of state considered here fail to resolve the DESI neutrino-mass tension."},{"arxiv":"2610.34540","id":"3218964","title":"Axions from Betelgeuse: Probing Axion Couplings with $^{23}\\rm{Na}$ and $^{55}\\rm{Mn}$","authors":"Nicholas A. M. Revel, Baldeep Grewal, Anupam Ray, Aaron C. Vincent","score":4.9,"section":"new","rank":39,"parts":[0.06,0.07,0.06,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1941263]] (coupling 0.02, 3 shared references). Closest network paper: [[2134073]] (coupling 0.02, 3 shared references).","abstract":"We investigate axion-like particle (ALP) production in the interior of Betelgeuse via nuclear de-excitation of thermally populated excited states of $^{23}$Na and $^{55}$Mn. As these ALPs propagate to Earth, they can produce photons either through their conversion in the Galactic magnetic field or through their decay. Using INTEGRAL-ISGRI and NuSTAR observations, we search for these photon signals, find no significant excess, and derive 95% CL exclusion limits on the ALP couplings. For magnetic-field conversion of ALPs, the $^{23}\\mathrm{Na}$ ($^{55}\\mathrm{Mn}$) line observed with INTEGRAL-ISGRI constrains $|g_{aγ}g_{ap}| < 4.1\\times10^{-21}$ ($6.9\\times10^{-19}$) $\\mathrm{GeV}^{-1}$ for $m_a < 10^{-10} \\mathrm{eV}$. For ALP decays, the $^{23}\\mathrm{Na}$ ($^{55}\\mathrm{Mn}$) line observed with INTEGRAL-ISGRI (NuSTAR) constrains $|g_{aγ}g_{ap}|$ down to $3.0\\times10^{-22}$ ($2.9\\times10^{-19}$) $\\mathrm{GeV}^{-1}$ at $m_a \\simeq 400$ ($83$) keV, weakening in both cases as $m_a^{-3/2}$ for lower ALP masses, and as $m_a^{-2}$ for $^{23}$Na below $m_a \\sim 1$ keV, with sensitivity extending to $m_a \\simeq 440.2$ ($124$) keV. Although our $^{23}\\mathrm{Na}$-based limits are the strongest for both channels, their larger transition energy makes them more sensitive to the precise evolutionary stage of Betelgeuse, whereas the $^{55}\\mathrm{Mn}$-based limits are considerably more robust against such uncertainties."},{"arxiv":"2610.33153","id":"3218786","title":"Muon Tridents at FASER and NA64$μ$: Motivation, Predictions, and Prospects for Precision Measurements","authors":"Reinaldo Francener, Victor P. Goncalves, Felix Kling, Gabriel Rabelo-Soares","score":4.8,"section":"new","rank":40,"parts":[0.06,0.05,0.09,0.0,0.0],"note":"Also cites widely used network papers: [[1688995]]. Closest of your papers: [[3130296]] (coupling 0.02, 2 shared references). Closest network paper: [[3217357]] (coupling 0.03, 3 shared references).","abstract":"The intense flux of high-energy muons produced in the far-forward region of $pp$ collisions at the LHC provides a unique opportunity to study rare electromagnetic interactions at TeV energies. In this work, we investigate the muon trident scattering in muon-nucleus interactions at the FASER experiment, which is expected to have recorded more than $10^5$ such events. The theoretical description of the process is reviewed and improved. Predictions for the total event rates and differential distributions expected during Run~3 of the LHC are presented, taking into account realistic detector acceptance and the main background contributions. The dependence of the predictions on the treatment of the nuclear form factors and the impact of higher-order QED effects such as Coulomb corrections are investigated. Our results indicate that the muon trident process can be measured for the first time at TeV energies using FASER's spectrometer, with a projected precision on the cross-section at the percent level. We also extended our analysis to the NA64$μ$ experiment and showed that, together with FASER, these experiments can probe the energy dependence of the muon trident cross-section over a broad unexplored energy range."},{"arxiv":"2608.19277","id":"3193587","title":"Effective flavor interaction for the charged-lepton mass hierarchy and the Koide relation","authors":"Olivier Rousselle","score":4.8,"section":"replacement","rank":41,"parts":[0.0,0.08,0.17,0.0,0.0],"note":"Closest of your papers: [[824906]] (coupling 0.03, 1 shared references). Closest network paper: [[2149989]] (coupling 0.06, 1 shared references).","abstract":"This article proposes a dynamical framework to address the charged-lepton mass hierarchy and derive the empirical Koide formula. We postulate a $U(3)_F$ flavor symmetry at the high-energy scale, where a heavy dynamical flavon field couples to the electroweak Higgs sector via an effective operator. As the universe cools, spontaneous symmetry breaking of the flavor group occurs following the pattern $U(3)_F \\to U(1)^3_F$. Subsequently, the electroweak symmetry breaking at the Fermi scale generates the charged-lepton mass matrix. The phenomenological values of these masses are determined in the infrared regime, where the effective potential governing the flavon VEV undergoes a dynamical vacuum alignment.The stable minimum of this potential enforces an algebraic equipartition between the flavor-singlet and flavor-octet invariants ($I_{(0)} = I_{(8)}$). This geometric equilibrium yields the Koide mass ratio ($Q=2/3$), successfully identifying the dynamically generated eigenvalues with the physical pole masses of the electron, muon, and tau."},{"arxiv":"2610.33662","id":"3218857","title":"Relativistic corrections to $Υ(1S,2S)\\rightarrowγη^{(\\prime)}$ in perturbative QCD","authors":"Cong Wang, Chao-Jie Fan, Jun-Kang He","score":4.6,"section":"new","rank":42,"parts":[0.06,0.01,0.14,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[3184726]] (coupling 0.00, 1 shared references). Closest network paper: [[2625199]] (coupling 0.05, 4 shared references).","abstract":"We calculate the radiative decays $Υ(1S),Υ(2S)\\rightarrowγη^{(\\prime)}$ in perturbative quantum chromodynamics through order $q^{2}$ in the relativistic expansion, including the quark-content, two-gluon, and electromagnetic contributions. The quark contribution dominates, with substantial constructive electromagnetic interference and a strongly suppressed gluon contribution. The annihilation rates depend weakly on the tested light-cone distribution amplitudes and light-quark masses. Relativistic corrections reduce the $Υ(1S)$ rates by a few percent but enhance the $Υ(2S)$ rates by approximately $17\\%$--$30\\%$. The ratio of the $γη^{\\prime}$ and $γη$ branching fractions is sensitive to the light-meson mixing parameters, with predictions differing by about a factor of $5$ between two representative schemes. At a scale of half the quarkonium mass, however, the $Υ(1S)\\rightarrowγη^{\\prime}$ central predictions in the two mixing schemes exceed the experimental upper limit by factors of approximately $5$ and $7$. We also examine the heavy-pseudoscalar admixtures in the light mesons. The $η_c$ contribution is small, whereas $η_b$ mixing can substantially modify the rates through interference. Destructive interference alleviates the discrepancy. With the scale set to the quarkonium mass, the prediction in the mixing scheme inferred from transition form factors is compatible with the upper limit within the input uncertainty."},{"arxiv":"2610.34882","id":"3219001","title":"Explaining the universal Hagedorn temperature in string models of hadrons with fixed endpoints or baryon junctions","authors":"Yuki Fujimoto","score":4.3,"section":"new","rank":43,"parts":[0.06,0.01,0.12,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[3184726]] (coupling 0.00, 1 shared references). Closest network paper: [[2821768]] (coupling 0.04, 3 shared references).","abstract":"We derive the mass formulas and more accurate asymptotic expressions for the densities of states for string models of hadrons with one fixed heavy endpoint or a baryon junction. We show that strings with one fixed endpoint have the same Hagedorn temperature as ordinary open strings at the same tension and number of polarizations, despite the different Regge slopes of heavy-light and light mesons. This provides a microscopic explanation for the universality of the Hagedorn temperature recently found phenomenologically. We also find that the baryon-junction and quark-diquark pictures share this Hagedorn temperature and yield the same asymptotic mass dependence of the density of states, differing only by an overall normalization. The observed baryon mass spectrum provides little discrimination between the two pictures, although the baryon-junction model has a larger discrepancy with the observed Regge slopes."},{"arxiv":"2608.01764","id":"3186845","title":"Jet-by-jet fluctuations of the energy-energy correlator: hadronization, decays, and medium effects","authors":"Jingyu Zhang","score":4.3,"section":"replacement","rank":44,"parts":[0.0,0.06,0.17,0.0,0.0],"note":"Closest of your papers: [[1455793]] (coupling 0.02, 2 shared references). Closest network paper: [[2621240]] (coupling 0.06, 5 shared references).","abstract":"Energy correlators probe how the strong interaction shapes the energy distribution within jets. Here, we study the jet-by-jet fluctuations of the energy-energy correlator (EEC). Each jet's EEC is described by a vector of densities in angular shells. Using an ensemble of these vectors, we construct the covariance matrix $C$ and Pearson correlation matrix $R$ to quantify fluctuation amplitudes and correlations between angular shells. Reconstructed jets in CMS Open Data at $\\sqrt{s}=7$ TeV show positive correlations between nearby outer-angle bins and negative correlations between separated angular regions. We compare PYTHIA jets at the parton, undecayed-hadron, and final-particle stages to identify correlations already present in the shower and study how hadronization and decays reshape the angular fluctuations. PYTHIA is then coupled to linear Boltzmann transport (LBT) to study medium effects on jet-by-jet EEC fluctuations and their angular correlations. These results open a route to probing the stochastic evolution of QCD jets through jet-by-jet EEC fluctuations."},{"arxiv":"2610.35620","id":"3219103","title":"Threshold effects of inelastic neutrino-dark-matter scattering in AGN spikes","authors":"Cheng-Wei Chiang, Van Que Tran","score":4.0,"section":"new","rank":45,"parts":[0.0,0.04,0.1,0.0,0.13],"note":"Closest of your papers: [[2787890]] (coupling 0.01, 2 shared references). Closest network paper: [[2926248]] (coupling 0.04, 3 shared references). Shared topics: dark matter.","abstract":"High-energy neutrinos from active galactic nuclei provide a powerful probe of dark matter (DM) spikes surrounding supermassive black holes. While elastic neutrino-DM scattering mediated by a light particle produces little net attenuation due to regeneration, inelastic scattering, $νχ_1\\toνχ_2$, introduces a nonzero minimum energy loss, $E_{\\rm th}$. We show that this threshold prevents the near-cancellation between attenuation and regeneration, producing a distinctive spectral deficit above $E_{\\rm th}$ accompanied by a pile-up below it. Solving the full neutrino cascade, including repeated scattering and secondary neutrinos from excited-state decays, we demonstrate that this feature persists for both narrow and broad energy-transfer kernels. Using public IceCube data for NGC 1068 and an unbinned likelihood analysis with a freely fitted intrinsic power-law spectrum, we derive upper limits on the asymptotic optical depth of $τ_0<26-39$ for a narrow kernel (kernel width $ε=0.01$) over $E_{\\rm th}=0.24-3.0$ TeV and $τ_0<20-26$ for a broad kernel ($ε=0.36$) over $E_{\\rm th}=0.24-2.4$ TeV, at the nominal $90\\%$ confidence level. An intrinsic high-energy cutoff weakens the narrow-kernel limits by factors of $2.2-7.4$ and the broad-kernel limits by factors of $2.0-5.0$. We further investigate DM velocity effects and combine NGC 1068 with CGCG 420-015 and TXS 0506+056 to extend the threshold reach. In a vector-mediator realization, an optimistic adiabatic DM spike can yield constraints on the neutrino coupling competitive with laboratory bounds for broad energy-transfer kernels."},{"arxiv":"2610.35156","id":"3219029","title":"$Δ(1232)$ isobars and neutrino opacities in hot dense matter","authors":"Subha Mitra, Bharat Kumar","score":3.7,"section":"cross","rank":46,"parts":[0.06,0.03,0.04,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2751074]] (coupling 0.01, 1 shared references). Closest network paper: [[2753529]] (coupling 0.01, 1 shared references).","abstract":"We calculated the diffusion mean free paths of electron neutrinos and antineutrinos in hot, neutrino-trapped matter containing $Δ(1232)$ isobars, as found in proto-neutron stars and neutron star merger remnants. We included charged-current absorption with the $NΔ$ weak vertex of weak pion production, neutral-current scattering on all baryons and three-body antineutrino absorption on electron--baryon pairs, with relativistic mean-field kinematics. The reaction $\\barν_e+e^-+n\\toΔ^-$ dominates the antineutrino opacity whenever the neutron and electron chemical potentials exceed the in-medium $Δ^-$ rest energy, even where the $Δ$ population is negligible. At two to four times saturation density, where the reaction is open, it shortens the antineutrino mean free path from \\nubarLamNucMin--\\nubarLamNucMax~m to \\nubarLamDMin--\\nubarLamDMax~cm. Because antineutrinos are scarce at high lepton fraction, this changes lepton-number diffusion only at low lepton fraction, by up to \\DtwoRedHi\\% at these densities and by a factor of \\DtwoRedLow\\ at 1.5 times saturation density. For electron neutrinos, absorption on the $Δ^-$ and, at low lepton fraction, the opening of nucleonic absorption shorten the mean free path by factors of up to \\nuRatioYLthreeMax\\ at lepton fraction 0.3 and up to about \\nuRatioYLoneMax\\ at lepton fraction 0.1. We also showed that, for a given axial coupling, the spin of the $Δ$ reduces its Gamow--Teller strength per particle from 3 to $5/3$."},{"arxiv":"2610.34947","id":"3218998","title":"Exact flavor conservation at the quark level in causal clusters: strange particles, protons and light nuclei in small collision systems","authors":"Paolo Castorina, Helmut Satz","score":3.5,"section":"new","rank":47,"parts":[0.06,0.02,0.05,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[3146383]] (coupling 0.01, 1 shared references). Closest network paper: [[3170413]] (coupling 0.02, 2 shared references).","abstract":"The suppression of strange hadrons in pp and p--Pb collisions at the LHC, including the $φ$ meson, has recently been described by the exact conservation of strangeness imposed on the quarks of a causally connected cluster before hadronization. Here we extend this approach to the light flavors. The numbers of up and down quarks and antiquarks are conserved in the same cluster, and the suppression of a baryon or a nucleus depends only on how many light quarks of each flavor it contains. With the strangeness sector fixed by the previous analysis, a single constant, the ratio $r$ of light to strange quark abundances, determines the multiplicity dependence of protons, deuterons, He and hypertriton in pp and p--Pb collisions. Including the finite size of the nuclei, one obtains a very good fit of the data for $r=3.76\\pm0.38$, i.e.\\ strange quarks about 0.27 times as abundant as light quarks per flavor, close to the value known from string fragmentation"},{"arxiv":"2610.35285","id":"3219039","title":"Probing the Collins effect at photon-photon colliders","authors":"Simone Anedda, Carlo Flore, Francesco Murgia, Cristian Pisano","score":3.3,"section":"new","rank":48,"parts":[0.06,0.02,0.06,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[3184726]] (coupling 0.01, 1 shared references). Closest network paper: [[3141748]] (coupling 0.02, 2 shared references).","abstract":"We propose to study the Collins effect in the production of almost back-to-back unpolarized hadrons (mainly charged pions) by looking at their azimuthal distributions around the jet thrust-axis in the process $γγ\\to h_1h_2X$. The quasi-real photons in the initial state can be emitted either by two scattering leptons or two charged heavy nuclei in ultra-peripheral collisions. We provide numerical estimates for kinematic configurations in principle accessible at the Future Circular Collider and at the planned experiments on ultra-peripheral collisions at the LHC. We find that the corresponding asymmetries can be sizable, even up to around 10-15%. The proposed measurements would thus shed light on the fragmentation mechanism of quarks into hadrons and, in principle, would allow one to distinguish among different existing models for the Collins functions."},{"arxiv":"2610.34741","id":"3218975","title":"\"Inevitable'' nonstrange tetraquark states and $ρρ$ interaction","authors":"Yanyue Pan, Yuying Hao, Shirui Zhao, Hongxia Huang, Jialun Ping","score":3.2,"section":"new","rank":49,"parts":[0.06,0.02,0.05,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[3184726]] (coupling 0.01, 1 shared references). Closest network paper: [[3209823]] (coupling 0.02, 1 shared references).","abstract":"Investigation of the interaction between two $ρ$ mesons with $IJ=00, 02, 11, 20$ and $22$ is conducted systematically in the framework of the quark delocalization color screening model. The results show that there is a strong attractive potential between two $ρ$ mesons, which makes it easier for these two mesons to form bound states. The largest binding energies occur for $IJ=02$ and $IJ=00$ with values over a hundred MeV, while the $IJ=20$ state is the least bound and has a binding energy of only a few MeV. Moreover, the results of intercluster distances favor a molecular interpretation of these states. The interaction analysis reveals that the $ρρ$ and $ΔΔ$ interactions share certain similarities. Drawing inspiration from the $d^*$ dibaryon prediction and from decay-property analyses, we suggest that the $ρρ$ with $IJ=02$ may be the most promising candidate of the ``inevitable'' nonstrange tetraquark state, which deserves experimental search."}],"refs":{"2964960":{"first":"García-Cely","year":2025,"nauth":4,"title":"Pion dark matter in a θ vacuum: a thermal relic with sharp velocity-dependent self-interactions","role":"seed"},"1960293":{"first":"Benavides","year":2021,"nauth":5,"title":"Systematic study of the SU(3)$_{c}$ ⊗SU(3)$_{L}$ ⊗ U(1)$_{X}$ local gauge symmetry","role":"other"},"2926248":{"first":"Dev","year":2025,"nauth":5,"title":"Opening up new parameter space for sterile neutrino dark matter","role":"other"},"1678642":{"first":"Curtin","year":2018,"nauth":88,"title":"Long-Lived Part   let L=ev.clientX-b.left+12;if(L>b.width-290)L=ev.clientX-b.left-290;tip.style.left=Math.max(4,L)+'px';tip.style.top=(ev.clientY-b.top+12)+'px'}
function paint(){if(!G)return;const f=hover||sel,on=new Set();if(f){on.add(f.i);f.out.forEach(i=>on.add(i));f.inn.forEach(i=>on.add(i))}
  svg.classed('dim',!!f);
  G.selectAll('path.edge').attr('class',l=>'edge '+l.k+(!f?'':l.s===f.i?' hot out':l.t===f.i?' hot in':''));G.selectAll('path.edge.hot').raise();
  G.selectAll('circle').classed('on',s=>on.has(s.n.i)).classed('sel',s=>sel&&s.n.i===sel.i).classed('match',s=>query&&`${s.n.first} ${s.n.title} ${s.n.arxiv} ${s.n.authors||''}`.toLowerCase().includes(query));
  G.selectAll('text.nlabel').classed('on',l=>on.has(l.s.n.i))}
function panel(){const p=document.getElementById('panel'),n=sel;
  if(!n){p.innerHTML='<p>Select a paper in the network.</p>';return}
  const links=`<div class="links">${n.id?`<a href="https://inspirehep.net/literature/${n.id}" target="_blank" rel="noopener">INSPIRE</a>`:''}${n.arxiv?`<a href="https://arxiv.org/abs/${esc(n.arxiv)}" target="_blank" rel="noopener">arXiv</a>`:''}</div>`;
  if(isNew(n)) p.innerHTML=`<div class="role" style="color:${col(n)}">#${n.rank} · ${esc(SEC[n.section])} · score ${n.score.toFixed(1)}</div><h4>${esc(n.title)}</h4>
   <div class="meta">${esc(auth(n))} · arXiv:${esc(n.arxiv)}</div><p>${why(n.note)}</p><div class="links"><a href="#p${n.i}">Back to abstract</a></div>`;
  else p.innerHTML=`<div class="role" style="color:${col(n)}">${esc(ROLE[n.role])}</div><h4>${esc(n.title)}</h4>
   <div class="meta">${esc(auth(n))} · ${n.year}${n.arxiv?' · arXiv:'+esc(n.arxiv):''}</div>
   <div class="stats"><span>${n.cites.toLocaleString()} citations</span><span>${n.inn.filter(i=>isNew(N[i])).length} of the matches link here</span></div>${links}`;
  tex(p)}
function pick(n,scroll){sel=n;panel();paint();document.querySelectorAll('.paper').forEach(el=>el.classList.toggle('sel',el.id==='p'+n.i));if(scroll)document.getElementById('chart').scrollIntoView({behavior:'smooth',block:'nearest'})}
const present=new Set(N.map(n=>n.role));
document.getElementById('legend').innerHTML=['today','repl','seed','other'].filter(k=>present.has(k)).map(k=>`<span><i class="dot" style="background:var(--${k})"></i>${esc(ROLE[k])}</span>`).join('')+'<span style="color:var(--fg-3)">Listing papers: size ∝ score; others: size ∝ log(citations)</span>';
document.getElementById('q').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();paint()});
svg.on('click',ev=>{if(ev.target.tagName!=='circle'){sel=null;panel();paint()}});
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(draw,200)});
function nextList(){const X=RAW.next||[];if(!X.length)return;const box=document.getElementById('nextlist'),more=document.getElementById('more');
  more.hidden=false;more.querySelector('summary').firstChild.textContent=`The next ${X.length} papers by score `;
  document.getElementById('moresub').textContent=`below the threshold of ${M.threshold}, not drawn in the network`;
  box.innerHTML=X.map(n=>`<li><div class="role" style="color:var(--${n.section==='replacement'?'repl':'today'})">#${n.rank} · ${esc(SEC[n.section])} · score ${n.score.toFixed(1)}</div>
    <div class="t">${esc(n.title)}</div><div class="authors">${authors(n.authors)} · arXiv:${esc(n.arxiv)}</div>
    ${n.note?`<p class="why">${why(n.note)}</p>`:''}
    <details class="abs"><summary>Abstract</summary><p class="abs">${esc(n.abstract)}</p></details>
    <div class="links">${n.id?`<a href="https://inspirehep.net/literature/${n.id}" target="_blank" rel="noopener">INSPIRE</a>`:''}<a href="https://arxiv.org/abs/${esc(n.arxiv)}" target="_blank" rel="noopener">arXiv</a><a href="https://arxiv.org/pdf/${esc(n.arxiv)}" target="_blank" rel="noopener">PDF</a></div></li>`).join('');
  more.addEventListener('toggle',()=>{if(more.open)tex(box)})}
const rtip=document.getElementById('reftip');let rcur=null;
function refShow(el){const r=REFS[el.dataset.ref];if(!r)return;rcur=el;rtip.textContent=`${auth(r)} (${r.year}) — ${plain(r.title)}`;rtip.hidden=false;
  const b=el.getBoundingClientRect(),t=rtip.getBoundingClientRect();let L=Math.min(Math.max(8,b.left),innerWidth-t.width-8),T=b.bottom+6;
  if(T+t.height>innerHeight-8)T=b.top-t.height-6;rtip.style.left=L+'px';rtip.style.top=T+'px'}
function refHide(){rtip.hidden=true;rcur=null}
document.addEventListener('pointerover',e=>{const el=e.target.closest('.ref');if(el&&e.pointerType==='mouse')refShow(el)});
document.addEventListener('pointerout',e=>{if(e.target.closest('.ref')&&e.pointerType==='mouse')refHide()});
document.addEventListener('click',e=>{const el=e.target.closest('.ref');if(el)refShow(el);else if(rcur)refHide()});
document.addEventListener('focusin',e=>{const el=e.target.closest('.ref');if(el)refShow(el)});
document.addEventListener('focusout',e=>{if(e.target.closest('.ref'))refHide()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')refHide()});
addEventListener('scroll',()=>{if(rcur)refHide()},{passive:true});
list();nextList();fold();draw();panel();
window.addEventListener('load',()=>{tex(document.getElementById('list'));tex(document.getElementById('panel'));fold();
  if(window.MathJax&&MathJax.startup&&MathJax.startup.promise)MathJax.startup.promise.then(()=>setTimeout(fold,300))});
addEventListener('resize',()=>{clearTimeout(window._ft);window._ft=setTimeout(fold,200)});
</script>
