<script>
const RAW = {"n":[{"id":"3214429","arxiv":"2610.16968","title":"Self-Interacting Dark Matter: From Particle Physics Theories to Structure Formation Simulations","first":"Rosenlyst","nauth":10,"year":2026,"cites":0,"role":"repl","note":"Cites your papers: [[2964960]]. Cites 6 network papers: [[3128103]], [[3070028]], [[1969598]], [[2795517]], [[1846588]], [[1607216]]. Also cites widely used network papers: [[2817040]], [[1518747]]. Closest of your papers: [[2964960]] (coupling 0.15, 47 shared references). Closest network paper: [[3214429]] (coupling 1.00, 595 shared references). Shared topics: dark matter, production mechanism.","score":65.4,"rank":1,"section":"replacement","parts":[0.99,0.45,1,0.0,0.23],"abstract":"We establish a unified theory-to-simulation framework for self-interacting dark matter (SIDM) that integrates three components: (i) a comprehensive, self-contained treatment of its particle-physics foundations and a broad range of model classes; (ii) a systematic, quantitative mapping from microscopic dark-sector physics to structure-formation simulation inputs through explicit expressions and numerical prescriptions; and (iii) the development, implementation, and validation of a broad suite of SIDM algorithms and a dedicated DM decay module in the moving-mesh code AREPO-2. Under (i), we detail the particle content, symmetries, interactions, production mechanisms, and constraints of a broad landscape of elementary and composite SIDM models, and present representative viable benchmark models. Under (ii), the mapping specifies cosmological initial conditions, internal-state masses and populations, reaction networks, velocity- and angle-dependent cross sections, dissipative energy loss, and decay rates and recoil kinematics. We then apply this mapping to a broad range of SIDM model classes. Under (iii), we implement and validate SIDM algorithms with constant and velocity-dependent cross sections, covering isotropic and anisotropic scattering, multi-state elastic and inelastic reactions, and dissipative processes, alongside a dedicated DM decay module in AREPO-2. We validate these implementations through beam-lattice deflection experiments, thermalization and uniform-box decay tests, isolated-halo gravothermal core-collapse simulations, and cosmological box and zoom-in simulations. These tests recover analytical predictions, establish agreement across numerical schemes, and reproduce published benchmarks. Our theory-to-simulation framework serves as a cross-disciplinary reference and a practical bridge between SIDM particle physics and simulations of nonlinear structure formation.","authors":"Martin Rosenlyst, Vinh Tran, Oliver Zier, Xuejian Shen, Mark Vogelsberger, Thejs Brinckmann, Mads T. Frandsen, Jesús Zavala, Frederik Holt Dihver Christensen, Mikkel Theiss Kristensen","nlinked":595,"nref":656,"src":"INSPIRE","html":true},{"id":"3219721","arxiv":"2610.35444","title":"Probing the singlet-triplet scotogenic model with lepton flavor violation, gravitational waves and dark matter","first":"Li","nauth":4,"year":2026,"cites":0,"role":"today","note":"Cites 11 network papers: [[2871910]], [[2689316]], [[1746620]], [[2940359]], [[1862804]], [[1456154]]…. Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1413755]] (coupling 0.08, 12 shared references). Closest network paper: [[2689316]] (coupling 0.20, 29 shared references). Shared topics: scotogenic model, scalar dark matter, viable parameter space, lepton flavor violation, neutrino mass.","score":60.4,"rank":2,"section":"new","parts":[1.0,0.25,0.56,0.0,0.94],"abstract":"We perform a comprehensive phenomenological analysis of neutrino masses, lepton-flavor violation, gravitational-wave signature induced by the first-order electroweak phase transition, and scalar dark matter within the framework of the singlet--triplet scotogenic model. We derive general analytical expressions for the one-loop Wilson coefficients of the penguin and box contributions to lepton-flavor-violating processes, considering generic scalar and fermion mediators. These general results are then applied to the singlet--triplet scotogenic model to calculate the branching ratios of $μ\\to eγ$ and $μ\\to e\\overline{e}e$, as well as the coherent $μ$--$e$ conversion rate. We systematically investigate the lepton-flavor-violation phenomenology and the constraints from current and future experiments. It is found that the coupling $λ_5$ plays a key role in connecting neutrino masses, lepton flavor violation, and dark matter direct detection. We also study the finite-temperature effective potential and the gravitational-wave signatures of the resulting first-order phase transition. By analyzing the thermal history of the model, we identify the viable parameter space allowing for a first-order electroweak phase transition in the early Universe and find that the portal parameters $λ_1^Ω$ and $μ_1$ play a crucial role in determining the transition strength. The corresponding stochastic gravitational-wave spectra can be probed by future gravitational-wave observatories. As a representative example, we identify a benchmark point that simultaneously satisfies the current constraints from lepton-flavor-violation and dark-matter experiments and generates a stochastic gravitational-wave spectrum that may be probed by the Laser Interferometer Space Antenna, the Big Bang Observer, and the Ultimate Deci-hertz Interferometer Gravitational-wave Observatory.","authors":"Shi-Yu Li, Jun-Nan Lu, Yang Zhang, Gui-Jun Ding","nlinked":118,"nref":134,"src":"INSPIRE","html":true},{"id":"3217357","arxiv":"2610.29543","title":"Detectable Dark Matter Freeze-in via Low Reheating","first":"Alagappan","nauth":1,"year":2026,"cites":0,"role":"repl","note":"Cites your papers: [[2856850]]. Cites 3 network papers: [[2935590]], [[2673377]], [[2795517]]. Closest of your papers: [[3130296]] (coupling 0.07, 11 shared references). Closest network paper: [[3217357]] (coupling 1.00, 49 shared references). Shared topics: relic density, direct detection, dark matter.","score":60.1,"rank":3,"section":"replacement","parts":[0.94,0.22,1,0.0,0.55],"abstract":"This work focuses on freeze-in production of dark matter (DM) during low reheating, where the latter arises from the decay of inflatons leading to a non-adiabatic matter-dominated era. Under freeze-in, DM comoving yield is inversely proportional to Hubble, and during matter domination, as Hubble increases, the coupling, keeping the DM interaction with SM, should be enhanced to have relic density $Ω_{DM}\\simeq0.12$, making DM potentially vulnerable to direct detection searches. A renormalizable Yukawa-like Lagrangian is considered for DM interaction with a singlet electron $e$, and a BSM parent particle $P$. With the decay being the dominant freeze-in production channel, the required coupling enhancement is calculated with the aid of freeze-in Boltzmann equation. Dealing with freeze-in, the higher coupling could thermalize the feebly interacting particles, and this places an upper bound on coupling. The coupling has been found to be sensitive to the vacuum energy of the inflaton during the inflationary phase. Keeping this vacuum energy at the upper bound from {\\tt planck}, the model fails to feature any detectable direct detection signals even at a reheating temperature of BBN. The findings of this thesis then show that, only under low reheating and low inflationary vacuum energy, the DM-electron cross sections become high enough to be detectable in near-future direct detection searches. However, the proposed model becomes non-perturbative near the direct detection exclusion limits.","authors":"Sadayappan Alagappan","nlinked":49,"nref":76,"src":"INSPIRE","html":true},{"id":"3212986","arxiv":"2610.12443","title":"A scalar-extended ${\\rm U(1)_{L_μ-L_τ}}$ explanation of the LUX-ZEPLIN 248 keV excess","first":"Pradhan","nauth":2,"year":2026,"cites":0,"role":"repl","note":"Cites 5 network papers: [[3207263]], [[3202840]], [[2841884]], [[2795517]], [[2740358]]. Closest of your papers: [[3130296]] (coupling 0.04, 8 shared references). Closest network paper: [[3202840]] (coupling 0.29, 31 shared references). Shared topics: observed dark matter, viable parameter space, dm mass, complex scalar, nuclear recoil.","score":57.6,"rank":4,"section":"replacement","parts":[0.95,0.11,0.84,0.0,0.84],"abstract":"The recently observed dark matter (DM) nuclear recoil event at an energy of $248 \\pm 23\\,(\\text{stat.}) \\pm 23\\,(\\text{syst.})\\,\\text{keV}$ at the LUX-ZEPLIN (LZ) experiment, favoring an inelastic scattering interpretation, has motivated various beyond the Standard Model (BSM) scenarios aimed at explaining the observed excess. In particular, this provides an opportunity to probe models that naturally accommodate inelastic DM scattering. In this work, we explore one such possibility by extending the $\\rm U(1)_{L_μ-L_τ}$ model with two complex scalar fields, $Φ$ and $S$, carrying charges $-1$ and $+2$, respectively, under the $\\rm U(1)_{L_μ-L_τ}$ gauge symmetry. These charge assignments allow a trilinear interaction between the two scalar fields, which is crucial for generating the DM mass splitting. Following the spontaneous breaking of the $\\rm U(1)_{L_μ-L_τ}$ symmetry, with $S$ acquiring a vacuum expectation value and generating a mass for the BSM gauge boson $Z_{μτ}$, the real and imaginary components of $Φ$ acquire a mass splitting. This naturally gives rise to an inelastic DM scattering scenario that can accommodate the LZ excess. We perform a likelihood-based assessment of the sensitivity of the model parameters to the observed event while consistently accounting for other relevant phenomenological constraints. Finally, we discuss the prospects for probing the viable parameter space at future experiments.","authors":"Dipankar Pradhan, Abhik Sarkar","nlinked":151,"nref":151,"src":"INSPIRE","html":true},{"id":"3219000","arxiv":"2610.34880","title":"Light top-flavoured dark matter in dark SMEFT: one-loop matching and phenomenology","first":"Gao","nauth":5,"year":2026,"cites":0,"role":"today","note":"Cites 2 network papers: [[2795517]], [[2740358]]. Also cites widely used network papers: [[1518747]]. Closest of your papers: [[3130296]] (coupling 0.03, 12 shared references). Closest network paper: [[2813804]] (coupling 0.15, 18 shared references). Shared topics: relic abundance, thermal relic, indirect detection, dm mass, dark matter.","score":42.2,"rank":5,"section":"new","parts":[0.72,0.1,0.42,0.0,0.77],"abstract":"We study light top-flavoured dark matter (DM) below the electroweak (EW) scale within the dark Standard Model effective field theory (DSMEFT). We perform the one-loop matching of the DSMEFT onto the dark low-energy effective field theory (DLEFT) at the EW scale for all relevant operators that couple scalar, fermionic or vector DM, as well as axion-like particles, exclusively to third-generation quarks. After QCD evolution to the relevant low-energy scales, we match the DLEFT onto the non-relativistic EFT for DM-nucleus scattering. This EFT chain provides a unified framework for phenomenological studies of rare $B$- and $K$-meson decays with missing energy, direct and indirect detection, and the thermal relic abundance. Interpreting the Belle II excess in $B^+\\to K^+ν\\barν$ as a decay into DM, we find that only the DSMEFT operators contributing at tree level can accommodate it with $O(1)$ couplings for a new-physics scale of $1\\,\\mathrm{TeV}$. The decay $B^0\\to K^{*0}+\\mathrm{inv}$ provides the strongest constraint over large portions of the Belle II-favoured parameter space, while $K^+\\toπ^++\\mathrm{inv}$ can dominate at low and $B_s\\to\\mathrm{inv}$, $B^+\\toπ^++\\mathrm{inv}$ and $Υ(1S)\\to\\mathrm{inv}$ become important at high DM masses, respectively. Direct-detection searches by CRESST-III and DarkSide-50 are competitive for operators involving scalar quark currents and, depending on the operator, exclude the Belle~II-favoured band for $m_{\\mathrm{DM}}\\gtrsim1$-$2\\,\\mathrm{GeV}$. We also perform detailed analyses of the thermal relic abundance and the indirect-detection constraints from the CMB and Fermi-LAT.","authors":"Meng-Chao Gao, Xin-Qiang Li, Ya-Dong Yang, Xing-Bo Yuan, Xin Zhang","nlinked":166,"nref":177,"src":"INSPIRE","html":true},{"id":"3190347","arxiv":"2608.11522","title":"How to Identify a Majoron: Effective Field Theories of Spontaneous Lepton Number Breaking","first":"Biggio","nauth":5,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[2617409]]. Also cites widely used network papers: [[1783234]], [[2817040]]. Closest of your papers: [[1249404]] (coupling 0.04, 11 shared references). Closest network paper: [[2617409]] (coupling 0.36, 70 shared references). Shared topics: complex scalar.","score":39.3,"rank":6,"section":"replacement","parts":[0.51,0.13,1,0.0,0.25],"abstract":"We revisit the traditional type~I, II, and III seesaw mechanisms in the presence of a complex scalar field charged under a global $U(1)$ symmetry that can be identified with lepton number and the Peccei-Quinn symmetry. After symmetry breaking, the radial mode becomes heavy while the angular mode appears as an axionlike particle, traditionally dubbed the Majoron. We construct the effective field theory obtained after integrating out the heavy states and analyze two matching orders: first removing the radial mode and then the seesaw fields, and vice versa. Both procedures yield the same low-energy Lagrangian containing only Standard Model fields and the Majoron. Because a single vacuum expectation value fixes the mediator masses, the radial mode, and every Majoron coupling, these models predict relations among observables rather than their individual size, and it is these relations that are testable. Indeed, the invisible Higgs width is locked to the universal suppression of the Higgs couplings, while the Majoron-lepton coupling is fixed by the measured nonunitarity of the leptonic mixing matrix, and the two independently give comparable lower bounds on the same lepton-number-breaking scale, of the order of $1$--$10$~TeV. Neutrinoless double beta decay with Majoron emission, by contrast, has no sensitivity in this class of models. The framework is, thus, falsifiable even when the new states lie far beyond experimental reach.","authors":"Carla Biggio, Marta Fuentes Zamoro, Xu Li, Luca Merlo, Luca Ottonello","nlinked":186,"nref":200,"src":"INSPIRE","html":true},{"id":"3218866","arxiv":"2610.33725","title":"Direct Detection of Millicharged Particles from Evaporating Primordial Black Holes","first":"Mondal","nauth":1,"year":2026,"cites":0,"role":"today","note":"Cites 2 network papers: [[1894389]], [[2795517]]. Closest of your papers: [[3146383]] (coupling 0.01, 2 shared references). Closest network paper: [[2139934]] (coupling 0.12, 8 shared references). Shared topics: hawking evaporation, primordial black hole, direct detection.","score":38.2,"rank":7,"section":"new","parts":[0.7,0.04,0.35,0.0,0.74],"abstract":"We investigate the direct detection of millicharge particles produced via Hawking evaporation of neutral primordial black holes (PBHs). As they travel through the Galactic magnetic field and then Earth's overburden, they lose energy before reaching an underground detector. Using electron recoil signals, we obtain constraints on the mass and charge parameter space for XENONnT, JUNO and Super-K for evolved PBH populations with initial mass $ M_i=10^{15}~\\rm g$ and $ M_i=8\\times10^{15}~\\rm g$ with initial abundances $f_i^{\\rm PBH}=3.9\\times10^{-7}$ and $f_i^{\\rm PBH}=3.7\\times10^{-4}$, respectively. In the relevant parameter space, this model can provide strong constraints in the high mass region.","authors":"Biprajit Mondal","nlinked":43,"nref":46,"src":"INSPIRE","html":true},{"id":"3117687","arxiv":"2602.07423","title":"Relic density and astrophysical signatures of MeV scale bound state dark matter","first":"Prasad","nauth":2,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[2771408]]. Also cites widely used network papers: [[1518747]]. Closest of your papers: [[1415059]] (coupling 0.08, 1 shared references). Closest network paper: [[1842151]] (coupling 0.11, 5 shared references). Shared topics: scalar dark matter, relic density, relic abundance, dark matter mass, indirect detection.","score":37.2,"rank":8,"section":"replacement","parts":[0.48,0.21,0.31,0.0,0.94],"abstract":"We study a strongly interacting complex scalar dark matter candidate, $χ$, interacting through an attractive potential mediated by a dark radiation $Φ$. Such interactions allow $χ$ to form bound states: SIMPonium. We systematically investigate the bound-state dynamics of this dark sector, including the formation and decay of SIMPonium and its impact on the thermal evolution of dark matter. We performed Monte Carlo simulations to compute the relic abundances of both free and bound state dark matter. We find that a successful freeze out of the dark sector requires a free dark matter yield of $Y_χ\\sim 10^{-9}$ and SIMPonium yield of $Y_B \\sim 10^{-13}$. The constraints from $ΔN_{\\rm eff}$ reveal that only scalar mediated self interactions remain viable. For Higgs portal models, these constraints require the dark matter mass to satisfy $m_χ< 25~\\mathrm{MeV}$. Within this mass range, indirect detection constraints imply that, for $g_χ> 10^{-2}$, the allowed range of the Higgs portal coupling is approximately $10^{-4} \\lesssim λ\\lesssim 10^{-2}$. For $g_χ< 10^{-2}$, the constraints are satisfied for a broader range, $10^{-4} \\lesssim λ\\lesssim 1$.","authors":"Pa. Gokhula Prasad, V. Suryanarayana Mummidi","nlinked":37,"nref":56,"src":"INSPIRE","html":false},{"id":"3089741","arxiv":"2512.05694","title":"p-Wave Dominant Majorana Dark Matter and Its Self-Interactions in a Gauged $U(1)_{L_μ- L_τ}$ Model","first":"Yang","nauth":1,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[2795517]]. Also cites widely used network papers: [[1362180]]. Closest of your papers: [[2787890]] (coupling 0.07, 12 shared references). Closest network paper: [[2942039]] (coupling 0.13, 20 shared references). Shared topics: relic abundance, thermal relic, direct detection, majorana mass, dark matter.","score":36.8,"rank":9,"section":"replacement","parts":[0.48,0.24,0.37,0.0,0.72],"abstract":"We propose a model of $p$-wave dominant Majorana dark matter (DM) featuring a macroscopic mass gap in a gauged $U(1)_{L_μ- L_τ}$ extension of the Standard Model. Spontaneous symmetry breaking generates a dominant Majorana mass via a strong Yukawa coupling, splitting the dark fermion into two distinct states. The lighter state ($χ_-$) is the DM candidate, with an allowed mass of $\\sim 10$ GeV to several hundred GeV. Crucially, within the $10 \\sim 75$ GeV mass range and a scalar mediator at the tens of MeV scale, this strong coupling dictates the thermal relic abundance and induces significant elastic self-interactions. These self-interactions naturally resolve small-scale structure anomalies, such as the core-cusp problem, while satisfying massive cluster constraints. Furthermore, we place stringent joint constraints on the scalar mass and the Higgs mixing angle $α$ using the latest LZ 2025 direct detection data. The model's gauge boson $Z^\\prime$ maintains early-Universe thermal equilibrium and accommodates the muon anomalous magnetic moment $(g-2)_μ$, remaining consistent with updated cosmological and experimental bounds.","authors":"Kwei-Chou Yang","nlinked":133,"nref":140,"src":"INSPIRE","html":true},{"id":"3219068","arxiv":"2610.35587","title":"Neutrino Phenomenology and Leptogenesis from Non-Invertible Fusion Symmetry","first":"Borah","nauth":2,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[2715897]]. Closest of your papers: [[1249404]] (coupling 0.05, 4 shared references). Closest network paper: [[2874212]] (coupling 0.08, 7 shared references). Shared topics: seesaw model, neutrino mass, majorana mass.","score":29.0,"rank":10,"section":"new","parts":[0.45,0.15,0.24,0.0,0.52],"abstract":"We constructed a minimal type-I seesaw model with two right-handed neutrinos, in which the flavor structure is determined by a non-invertible \\(\\mathbb{Z}_2\\)-gauged \\(\\mathbb{Z}_5\\) fusion symmetry~($\\mathbb{Z}^{IN}_5$). The framework, incorporating a second Higgs doublet and an auxiliary \\(\\mathbb{Z}_2\\) parity, yields predictive neutrino mass textures without introducing flavon fields. A fit to neutrino data selects the inverted mass ordering with \\(m_3=0\\) and predicts a nearly maximal Dirac CP phase, together with a characteristic prediction for the effective Majorana mass governing neutrinoless double-beta decay($0νββ$). We further investigate thermal leptogenesis and show that the framework can reproduce the observed baryon asymmetry of the Universe. Our results establish a connection between predictive neutrino phenomenology and leptogenesis within a minimal framework based on non-invertible fusion symmetry.","authors":"Pulakesh Borah, Mrinal Kumar Das","nlinked":34,"nref":42,"src":"INSPIRE","html":true},{"id":"3115009","arxiv":"2602.02817","title":"Dark-Matter-Induced Nuclear Deexcitation at the Short Baseline Near Detector with Ab Initio Nuclear Theory","first":"Dutta","nauth":5,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[2795517]]. Closest of your papers: [[3146383]] (coupling 0.08, 9 shared references). Closest network paper: [[3216851]] (coupling 0.10, 16 shared references). Shared topics: dark matter.","score":27.9,"rank":11,"section":"replacement","parts":[0.45,0.22,0.29,0.0,0.13],"abstract":"We explore the sensitivity of the short-baseline near detector (SBND) experiment to light dark matter using MeV-scale electromagnetic activity. Inelastic scattering of dark matter with argon nuclei can excite nuclear states that subsequently deexcite via the emission of MeV-scale photons, producing localized low-energy \"blip\" signatures in a liquid argon time projection chamber. We perform state-of-the-art ab initio nuclear calculations, including all relevant argon excited states with energies up to 18 MeV, to provide reliable predictions for these signals. After accounting for relevant backgrounds, we find that SBND can probe previously unexplored regions of parameter space for light dark matter.","authors":"Bhaskar Dutta, Debopam Goswami, Baishan Hu, Wei-Chih Huang, Vishvas Pandey","nlinked":69,"nref":74,"src":"INSPIRE","html":true},{"id":"3133820","arxiv":"2603.22391","title":"What does it take to have $N_{\\rm eff} < 3$ at CMB times?","first":"Escudero","nauth":3,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[1803656]]. Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2663002]] (coupling 0.06, 10 shared references). Closest network paper: [[2895271]] (coupling 0.09, 9 shared references). Shared topics: dark matter.","score":27.5,"rank":12,"section":"replacement","parts":[0.48,0.19,0.25,0.0,0.13],"abstract":"The vast majority of extensions of the Standard Model affecting the number of effective relativistic neutrino species ($N_{\\rm eff}$) do so additively, namely, they enhance this quantity with some light state contributing to dark radiation. In this work, we consider precisely the opposite case: new physics scenarios that can lead to $N_{\\rm eff} < 3$ that are consistent with all known cosmological, astrophysical, and laboratory data. We are motivated by three main reasons: 1) a recent measurement from ACT and SPT in combination with Planck that leads to $N_{\\rm eff} = 2.81\\pm0.12$, 2) by a new and powerful measurement of the primordial helium abundance, which anchors $N_{\\rm eff}$ to be very close to the Standard Model value one second after the Big Bang, 3) by the deployment of the Simons Observatory which will provide precise tests of the radiation content in the Universe and which may detect with a high significance cosmologies with $N_{\\rm eff}<3$. We survey the main theoretical possibilities and find that only a few simple scenarios can consistently give $N_{\\rm eff}=2.81\\pm0.12$. One class consists of thermal electrophilic relics with masses $m\\sim 8\\!-\\!13\\,{\\rm MeV}$. Another consists of out-of-equilibrium particles decaying to $e^+e^-$ or $γγ$, with a rather particular lifetime $0.05\\,{\\rm s}\\lesssim τ\\lesssim 3\\,{\\rm min}$, mass $250\\,{\\rm MeV}\\lesssim m \\lesssim 600\\,{\\rm MeV}$, and abundance $ρ/ρ_γ\\sim 0.1$ at decay. Thermal electrophilic particles are especially interesting because they can account for the dark matter in the Universe and can be tested in experiments such as SENSEI, DAMIC-M, and Oscura, and their portals to the visible sector at experiments such as NA64 and LDMX. We conclude that if the Simons Observatory confirms that $N_{\\rm eff} \\simeq 2.8$, it will point to very specific extensions of the Standard Model.","authors":"Miguel Escudero, Maksym Ovchynnikov, Neal Weiner","nlinked":110,"nref":111,"src":"INSPIRE","html":true},{"id":"3188104","arxiv":"2608.05279","title":"Axion-driven spontaneous leptogenesis, precisely","first":"Kuckenberg","nauth":4,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[1803656]]. Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1941263]] (coupling 0.04, 10 shared references). Closest network paper: [[2692782]] (coupling 0.10, 12 shared references). Shared topics: neutrino mass.","score":27.5,"rank":13,"section":"replacement","parts":[0.48,0.14,0.29,0.0,0.2],"abstract":"We revisit a minimal scenario for spontaneous leptogenesis where the asymmetry generation is driven by a heavy axion-like field evolving via standard misalignment. We focus on the simplest framework in which lepton number violation originates from the dimension-five Weinberg operator and contributions from standard thermal leptogenesis become negligible. The asymmetry is computed by solving a set of transport equations, which incorporate fully flavor-dependent interaction rates for the Weinberg operator that are presented here for the first time. We also derive a simple algebraic master formula for the generated $B\\!-\\!L$ asymmetry, valid for arbitrary axion velocities and classically shift-symmetric couplings to the Standard Model, that reproduces the $B\\!-\\!L$-production dynamics of the full set of transport equations in controlled parameter regions. Along the way, we quantify the importance of low-scale neutrino masses and the two mass orderings on the final prediction for the generated asymmetry. Finally, we assess the cosmological viability of different axion couplings by accounting for entropy dilution from late-time axion decays and imposing constraints from baryonic isocurvature perturbations. We demonstrate that explaining the baryon asymmetry via standard Majoron misalignment is under severe tension due to dilution from late-time decays. In contrast, axions coupled to strong or weak sphalerons can successfully produce the observed asymmetry for decay constants near the energy scale of grand unification and axion oscillation temperatures $T_{\\text{osc}} \\gtrsim 10^{11\\cdots12}$ GeV, provided a cosmological history featuring high-scale inflation and efficient reheating.","authors":"Konstantin Kuckenberg, Martin A. Mojahed, Kai Schmitz, Hidenaga Watanabe","nlinked":80,"nref":81,"src":"INSPIRE","html":true},{"id":"3206125","arxiv":"2609.25601","title":"Electroweak phase transition triggered by a long-lived scalar and LHC searches","first":"Wang","nauth":4,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[1678642]]. Closest of your papers: [[1455793]] (coupling 0.02, 3 shared references). Closest network paper: [[3073459]] (coupling 0.14, 24 shared references). Shared topics: singlet scalar.","score":26.3,"rank":14,"section":"replacement","parts":[0.45,0.05,0.4,0.0,0.3],"abstract":"We investigate a long-lived scalar $S$ that triggers a strongly first-order electroweak phase transition (SFOEWPT) in the singlet scalar extension of standard model (SM). A sufficient small mixing angle between $S$ and the SM-like Higgs boson $h$ naturally leads to a long lifetime for $S$. We focus on the mass range $m_S>m_h/2$, where the dominant production channel at the LHC is the Higgs-mediated process $gg\\to h^*\\to SS$ with an off-shell $h$. By analyzing the finite-temperature effective potential, we identify the parameter space realizing an SFOEWPT and calculate the associated gravitational-wave spectra, finding that part of the parameter space can be probed by LISA. We further study the LHC sensitivity to the long-lived $S$ using the ATLAS detector and proposed far detectors, including ANUBIS, CODEX-b, FACET, FASER2, MoEDAL-MAPP1 and MAPP2, and MATHUSLA. The combined sensitivity of the main detector and far detectors, particularly ANUBIS and MATHUSLA, allows a large fraction of the SFOEWPT parameter space to be probed for $10^{-10}\\leq \\sinθ\\leq 10^{-5}$, with $m_S$ up to $250~\\mathrm{GeV}$. For $\\sinθ\\leq 10^{-11}$, however, the SFOEWPT parameter space becomes inaccessible to both the main detector and the far-detector searches.","authors":"Lei Wang, Xiaoting Zhao, Xiao-Fang Han, Hongxin Wang","nlinked":79,"nref":81,"src":"INSPIRE","html":true},{"id":"3217591","arxiv":"2610.33549","title":"Catastrophe Structure and Stability of Axion Stars","first":"Kusmartsev","nauth":3,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[2969908]]. Closest of your papers: [[1941263]] (coupling 0.05, 4 shared references). Closest network paper: [[3170380]] (coupling 0.13, 9 shared references).","score":25.0,"rank":15,"section":"new","parts":[0.45,0.12,0.38,0.0,0.0],"abstract":"Axion stars are self-gravitating Bose--Einstein condensates of QCD axions or axion-like particles. Their stability determines whether they can survive as dark-matter structures and what astrophysical signatures they may produce. Here we combine a non-relativistic Schrödinger--Poisson description with catastrophe theory to develop a unified picture of axion-star stability. Beginning with the Einstein--Klein--Gordon system for a periodic axion potential, we derive the effective equations of motion and conserved quantities and construct a one-parameter family of star-like solutions. A Gaussian variational ansatz reduces the problem to an analytic energy functional $E(R;N)$. Within this model, equilibria appear and disappear through Arnold $A_2$, $A_3$, and $A_4$ catastrophes as the particle number $N$ and interaction strengths vary. A repulsive sextic interaction produces two stable branches---dilute and dense axion stars---separated by an unstable branch. The same catastrophe criteria apply beyond the sextic truncation: for the full cosine and QCD-corrected potentials, the fold conditions follow from the complete variational energy and can be evaluated numerically. We also separate stability within the collective-coordinate ansatz from full radial perturbative stability and specify the range in which the non-relativistic treatment is reliable. This framework provides a compact classification of axion-star phases and identifies model-dependent critical masses associated with collapse, bosenova-like emission, and black-hole formation.","authors":"Fedor V Kusmartsev, Joudy J F Beek, Jack C M Hughes","nlinked":43,"nref":56,"src":"INSPIRE","html":false},{"id":"3131605","arxiv":"2603.19109","title":"Searching for dark matter X-ray lines from the Large Magellanic Cloud with eROSITA","first":"Calvo","nauth":5,"year":2026,"cites":0,"role":"repl","note":"Co-authors of yours: Taoso. Closest of your papers: [[1597138]] (coupling 0.06, 7 shared references). Closest network paper: [[2926248]] (coupling 0.19, 19 shared references). Shared topics: mass below, dm mass, dark matter.","score":24.4,"rank":16,"section":"replacement","parts":[0.0,0.17,0.54,0.5,0.62],"abstract":"We perform a search for an X-ray monochromatic line arising from dark matter (DM) decay in the halo of the Large Magellanic Cloud. An emission line can be expected from two well-motivated DM candidates: sterile neturinos and axion-like particles (ALPs). We analyze the eROSITA-DE DR1 datasets in the energy range between 1 and 9 keV. No evidence for a DM line is found, and we set lower limits on the DM lifetime. We then recast these bounds into upper limits on the active-sterile neutrino mixing angle $\\sin^2(2θ)$ and on the ALP to photon coupling $g_{aγ}$, for DM masses between 2 and 18 keV. These results set new strong constraints for masses below 5 keV.","authors":"Jorge Terol Calvo, Marco Taoso, Andrea Caputo, Michela Negro, Marco Regis","nlinked":77,"nref":81,"src":"INSPIRE","html":true},{"id":"3207948","arxiv":"2609.30366","title":"Hybrid Partial Dressing: Correct Effective Potentials at All Temperatures","first":"Berthiaume","nauth":5,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[1858217]]. Closest of your papers: [[1832796]] (coupling 0.01, 2 shared references). Closest network paper: [[3128752]] (coupling 0.15, 30 shared references).","score":23.8,"rank":17,"section":"replacement","parts":[0.45,0.04,0.43,0.0,0.02],"abstract":"We develop Hybrid Partial Dressing (HPD), a simple diagrammatic resummation scheme for finite-temperature effective potentials in scalar field theory which is valid at all temperatures. HPD improves on earlier resummation schemes such as Daisy Resummation and Partial Dressing by being two-loop exact at all temperatures and free of the overlapping momentum problem. Renormalization group improvement is straightforward to implement. We illustrate the scheme in multi-scalar theories with a spontaneously broken $\\mathbb{Z}_2$ symmetry, and compare it against existing approaches, showing in particular that it reproduces the two-loop Dimensional Reduction (DR) potential exactly in the high-temperature regime where DR applies, while remaining valid at all temperatures. This makes HPD suitable for the general study of strong first order phase transitions beyond the Standard Model, as we demonstrate through gravitational wave predictions from HPD and its RG-improved version, RGHPD.","authors":"Raphaël Berthiaume, David Curtin, Michael Luke, Andrija Rasovic, Jyotirmoy Roy","nlinked":144,"nref":145,"src":"INSPIRE","html":true},{"id":"2944562","arxiv":"2507.07164","title":"Unconventional Materials for Light Dark Matter Detection","first":"Hochberg","nauth":4,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[2051195]]. Closest of your papers: [[2856850]] (coupling 0.03, 3 shared references). Closest network paper: [[1607216]] (coupling 0.07, 9 shared references). Shared topics: dark matter.","score":23.1,"rank":18,"section":"replacement","parts":[0.45,0.1,0.2,0.0,0.13],"abstract":"We propose the use of several unconventional materials as detectors for dark matter with mass beneath the MeV scale. These include the transition-metal dichalcogenide TiSe$_2$ hosting a low-energy plasmon in the charge-density-wave phase, Sr$_2$RuO$_4$ containing a low-energy acoustic demon mode, and hole-doped diamond with tunable optical and acoustic plasmon frequencies. We perform first-principles density functional theory computations of their loss functions at non-vanishing momenta and establish their reach into light dark matter parameter space. We show that due to intense low-energy plasmon modes -- of different microscopic origin in each -- the reach of detectors based on these materials could surpass existing proposals by several orders of magnitude for both dark matter scattering and absorption on electrons. The anisotropic response of these materials, which enables directional detection, renders them exceptionally strong detector candidates, motivating the design and fabrication of future devices.","authors":"Yonit Hochberg, Dino Novko, Rotem Ovadia, Antonio Politano","nlinked":34,"nref":61,"src":"INSPIRE","html":true},{"id":"3218780","arxiv":"2610.33150","title":"Dark Matter phase space distribution under a fully relativistic treatment. Eddington inversion according to general relativity","first":"Zink","nauth":2,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[2795517]]. Closest of your papers: [[2964960]] (coupling 0.02, 3 shared references). Closest network paper: [[2795517]] (coupling 0.04, 18 shared references). Shared topics: dark matter.","score":20.1,"rank":19,"section":"new","parts":[0.45,0.05,0.11,0.0,0.13],"abstract":"We develop a fully relativistic extension of Eddington inversion to reconstruct the phase-space distribution function of dark matter from its density profile. Treating dark matter as an effective perfect fluid in a static, spherically symmetric spacetime, we use the Tolman-Oppenheimer-Volkoff equations to determine the gravitational background and derive an Abel-type inversion that yields the distribution function in terms of the conserved particle energy measured at infinity. We show that the resulting expression recovers the classical Eddington inversion in the weak-field, nonrelativistic limit. We also investigate the finite-boundary contribution, which can introduce an unphysical divergence, and present a regularization procedure that removes it. We apply our method to a Milky Way model consisting of a generalized Navarro-Frenk-White halo and a Gondolo-Silk dark-matter spike around Sagittarius A$^*$, neglecting baryonic contributions. The relativistic and Newtonian velocity distributions agree at radii far from the Galactic center but begin to differ at distances of order $10^{-5}\\,\\mathrm{pc}$. Closer to the black hole, the relativistic peak speed can reach approximately twice the Newtonian prediction. Finally, we derive a general expression for dark-matter capture by neutron stars that accommodates arbitrary ambient velocity distributions. Near Sagittarius A$^*$, the relativistic capture factor is nearly an order of magnitude smaller than the Maxwell-Boltzmann prediction, while the Newtonian Eddington result can overestimate it by a factor of approximately two. These results demonstrate the importance of relativistic phase-space reconstruction for dark-matter phenomenology in strong gravitational fields.","authors":"Jaime Hoefken Zink, Pellegrino Piantadosi","nlinked":56,"nref":57,"src":"INSPIRE","html":true},{"id":"3181009","arxiv":"2607.14156","title":"New approach to the estimation of the lowest boundary of an axion mass and axion-electron coupling constant","first":"Guseynova","nauth":5,"year":2026,"cites":0,"role":"repl","note":"Also cites widely used network papers: [[1783234]]. Closest of your papers: [[1941263]] (coupling 0.12, 14 shared references). Closest network paper: [[1625119]] (coupling 0.12, 10 shared references).","score":18.0,"rank":20,"section":"replacement","parts":[0.06,0.36,0.35,0.0,0.0],"abstract":"In this work, we have performed the theoretical estimation of the lowest boundary of an axion mass. We have analyzed the energy spectrum of the electron in a constant homogeneous magnetic field, taking into account its anomalous magnetic moment. We have applied the obtained results on the energy spectrum of the electron in a constant homogeneous magnetic field with allowance for its anomalous magnetic moment to the hydrogen atom electron, which is located in addition to the Coulomb field of the proton, as well as in the magnetic field produced by the magnetic moment of the proton. We have applied the idea of the restriction for the lowest boundary of the axion mass to the triplet-singlet transition between two adjacent levels obtained as a result of the hyperfine structure splitting of the s-levels in the hydrogen atom. We have concluded that the mass of an axion ought to be more than 5.885*10^(-6) eV. We have also obtained the analytical relation for the lowest boundary of the axion-electron coupling constant and numerically estimated its value: the axion-electron coupling constant ought to be more than 1.670*10^(-16).","authors":"Sevinj O. Guseynova, Vali A. Huseynov, Mehriban Sh. Hasanova, Sevinj Y. Rzayeva, Nigar E. Musazade","nlinked":39,"nref":54,"src":"INSPIRE","html":false},{"id":"3218910","arxiv":"2610.34325","title":"Near-exact Upper Confidence Limits for Axion Haloscopes","first":"Rosso","nauth":2,"year":2026,"cites":0,"role":"today","note":"Closest of your papers: [[1941263]] (coupling 0.12, 13 shared references). Closest network paper: [[1625119]] (coupling 0.14, 10 shared references).","score":17.4,"rank":21,"section":"cross","parts":[0.0,0.39,0.39,0.0,0.0],"abstract":"The data acquisition of axion haloscopes commonly implements sequential adaptive frequency scans. We present a method to calculate likelihood-based upper confidence limits on axion-photon coupling under this circumstance. We compare the likelihood-based method conceptually and quantitatively with tailor-made methods, i.e. the one proposed by Brubaker et al. (Geometric) and its upgrade the Bayesian Power-Measured (BPM) framework proposed by Palken et al. We find that the likelihood method yields average upper limits that are significantly more constraining than those obtained from these methods. For example, expected constraints improve by a factor of 1.4 as compared with the current state of the art when applied to projections for the ALPHA Plasma-haloscope. We further clarify the statistical basis for the Geometric and BPM methods. In particular, we point out the correspondence of BPM to e-values, proposed as an alternative to conventional p-values in statistics.","authors":"Andrea Gallo Rosso, Jan Conrad","nlinked":32,"nref":48,"src":"INSPIRE","html":true},{"id":"3096530","arxiv":"2512.24132","title":"An $A_4$-Symmetric Double Seesaw for Neutrino Masses and Mixing in Light of JUNO results","first":"Nanda","nauth":5,"year":2026,"cites":0,"role":"repl","note":"Closest of your papers: [[1249404]] (coupling 0.04, 13 shared references). Closest network paper: [[3121627]] (coupling 0.11, 20 shared references). Shared topics: neutrino mass and mixing, dirac neutrino mass, discrete symmetry, neutrino mass, majorana mass.","score":17.4,"rank":22,"section":"replacement","parts":[0.0,0.12,0.31,0.0,0.92],"abstract":"We discuss a double seesaw mechanism for generating light neutrino masses within the Standard Model extensions that include both right-handed neutrinos and extra gauge-singlet sterile fermions. The flavour structure of the double seesaw framework is invoked by an $A_4$ discrete symmetry which yields predictive textures for the Dirac neutrino mass matrix $M_D$, the mixing matrix $M_{RS}$ connecting right-handed and sterile neutrinos, and the bare Majorana mass matrix $M_S$ for the sterile neutrinos. The interesting feature of the present framework is that the combination of the double seesaw mechanism and $A_4$ flavour alignments yields a leading-order TBM structure, corrected by a single rotation in the (1-3) sector. We also derive analytic expressions for the heavy sterile eigenvalues and for the resulting light neutrino masses, thereby clarifying the role of the symmetry in shaping the neutrino mass hierarchy. We further incorporate the most recent JUNO measurements, which improve the precision of the solar mixing angle $\\sin^2θ_{12} \\simeq 0.31$, along with updated constraints on $\\sin^2θ_{13}$. We show that these results significantly restrict the allowed parameter space of the model. In particular, the observed value of $\\sin^2θ_{12}$ constrains the magnitude of the (1--3) rotation and the phases associated with the $A_4$ flavon couplings, while the value of $\\sin^2θ_{13}$ sharpens these restrictions further. Overall, the interplay between double seesaw dynamics, $A_4$ flavour symmetry, and the recent JUNO constraints yields a highly predictive framework for neutrino masses and mixings, offering a coherent explanation for the generation of light neutrino masses and testable predictions for future experiments.","authors":"Swaraj Kumar Nanda, Maibam Ricky Devi, Chandini Dash, R. N. Panda, Sudhanwa Patra","nlinked":160,"nref":166,"src":"INSPIRE","html":true},{"id":"3187139","arxiv":"2608.02498","title":"Axion Inflation: Perturbative control in the strong backreaction regime","first":"Domcke","nauth":4,"year":2026,"cites":0,"role":"repl","note":"Closest of your papers: [[1955022]] (coupling 0.01, 1 shared references). Closest network paper: [[3183493]] (coupling 0.42, 30 shared references).","score":15.9,"rank":23,"section":"replacement","parts":[0.0,0.03,1,0.0,0.0],"abstract":"We study the strong backreaction regime in axion inflation, in which the friction from Abelian gauge fields generated via the pseudo-scalar interaction $\\fracβ{4 M_p} φF {\\tilde F}$ is comparable to Hubble friction. The non-linear dynamics associated with the gauge fields render this regime phenomenologically particularly interesting, but also notoriously difficult to study with perturbative methods. Quantifying the perturbative control through the direct impact on the spectral backreaction using (i) a first-order gradient-expansion formalism including axion gradients, and (ii) a one-loop in-in calculation, we discover an extended mild backreaction regime at large couplings $β$, with a relatively large, nearly constant particle production parameter $ξ$. In passing, we point out that CMB non-Gaussianity bounds impose a general upper limit on the product of axion gauge field coupling and Hubble parameter during inflation, $βH/M_p < 1.4\\cdot 10^{-3}$, independently of the choice of the axion potential.","authors":"Valerie Domcke, Alexandros Papageorgiou, Marco Peloso, Stefan Sandner","nlinked":59,"nref":59,"src":"INSPIRE","html":true},{"id":"3149759","arxiv":"2604.24849","title":"Accidental Peccei-Quinn Symmetry from Chiral Gauge Symmetry and Mirror QCD","first":"Fukuda","nauth":2,"year":2026,"cites":0,"role":"repl","note":"Closest of your papers: [[1597138]] (coupling 0.06, 8 shared references). Closest network paper: [[1783234]] (coupling 0.11, 37 shared references). Shared topics: dark matter candidate, dark matter.","score":13.5,"rank":24,"section":"replacement","parts":[0.0,0.17,0.31,0.0,0.38],"abstract":"We present a solution to the strong CP problem in which a simple chiral U(1) gauge symmetry gives rise to an accidental Peccei-Quinn symmetry that is both explicitly and spontaneously broken by mirror QCD dynamics, yielding a framework without massless fermions or a light QCD axion. The model contains no stable domain walls or colored relics, and it accommodates a sufficiently high reheating temperature to account for the baryon asymmetry of the Universe via leptogenesis. Metastable domain walls and first-order mirror QCD phase transition generate a stochastic background of primordial gravitational waves. Additionally, one of the pseudo-Nambu-Goldstone bosons serves as a viable WIMP dark matter candidate. The gauge boson associated with the chiral U(1) gauge symmetry, which kinetically mixes with the Standard Model hypercharge gauge boson, provides a vector portal connecting dark matter to the Standard Model and plays a central role in the dark-matter phenomenology. Colored pseudo-Nambu-Goldstone bosons can be probed at the LHC through searches for dijet resonances, jets plus missing energy, multijet events with leptons, and displaced vertices.","authors":"Hajime Fukuda, Keisuke Harigaya","nlinked":112,"nref":112,"src":"INSPIRE","html":true},{"id":"3219053","arxiv":"2610.35379","title":"Revisiting supernova constraints on dark gauge bosons","first":"Wang","nauth":2,"year":2026,"cites":0,"role":"today","note":"Also cites widely used network papers: [[1362180]]. Closest of your papers: [[3130296]] (coupling 0.09, 22 shared references). Closest network paper: [[2942039]] (coupling 0.08, 16 shared references).","score":12.8,"rank":25,"section":"new","parts":[0.06,0.24,0.23,0.0,0.0],"abstract":"We revisit the supernova constraints on three well-motivated light gauge bosons: the dark photon, the $U(1)_{B-L}$ gauge boson, and the $U(1)_{L_μ-L_τ}$ gauge boson. For the dark photon and the $U(1)_{B-L}$ gauge boson, we re-evaluate the nucleon bremsstrahlung process within the one-pion exchange approximation, retaining the full momentum and mass dependence. The geometrical dependence of the decay and absorption of these gauge bosons inside the supernova core is also taken into account. Updated bounds on these models are derived based on the cooling of SN1987A and energy deposition constraints from low-energy supernovae (LESNe). Taking the SFHo-18.8 $18.8\\,M_\\odot$ profile, the SN1987A cooling constraints reach masses of about $230$ MeV, $280$ MeV, and $300$ MeV for the dark photon, the $U(1)_{B-L}$ boson, and the $U(1)_{L_μ-L_τ}$ boson, while the corresponding LESN limits extend to about $450$ MeV, $440$ MeV, and $600$ MeV, respectively. The kinetic mixing parameter $ε$ for dark photon, the gauge coupling $g_{BL}$ in the $U(1)_{B-L}$ model, and the gauge coupling $g_{μτ}$ for the $U(1)_{L_μ-L_τ}$ model are constrained down to $5.8\\times10^{-12}$, $2.9\\times10^{-16}$, and $6.4\\times10^{-12}$, respectively.","authors":"Zun Wang, Yongchao Zhang","nlinked":224,"nref":234,"src":"INSPIRE","html":true},{"id":"3218872","arxiv":"2610.33805","title":"Fermiophobic Z' Bosons in 3-4-1 Models: Classification and Collider Constraints","first":"Suarez","nauth":3,"year":2026,"cites":0,"role":"today","note":"Closest of your papers: [[731108]] (coupling 0.06, 3 shared references). Closest network paper: [[1960293]] (coupling 0.17, 8 shared references).","score":12.7,"rank":26,"section":"new","parts":[0.0,0.17,0.49,0.0,0.03],"abstract":"We investigate the fermion spectra and collider phenomenology of models based on the \\(SU(3)_C \\otimes SU(4)_L \\otimes U(1)_X\\) gauge symmetry, focusing on two realizations of the electric charge operator characterized by \\(b=c=1\\) and \\(b=1,\\ c=-2\\). For each configuration, we classify anomaly-free fermion sets and identify five minimal spectra with at least three SM-like quark and lepton families for each configuration, distinguishing algebraically irreducible structures from reducible spectra that remain minimal under the three-family requirement. We derive the chiral couplings of the additional neutral gauge boson \\(Z'\\) to Standard Model fermions and show that distinct anomaly-free fermion spectra can lead to identical low-energy neutral-current interactions. We then investigate the corresponding collider constraints using the ATLAS dilepton resonance search at \\(\\sqrt{s}=13\\) TeV with an integrated luminosity of \\(139\\,\\mathrm{fb}^{-1}\\), assuming negligible \\(Z-Z'\\) mixing and kinematically inaccessible exotic fermions. A particularly interesting result emerges for the \\(b=c=1\\) configuration, where all \\(Z'\\) couplings to Standard Model fermions are proportional to \\(\\sinψ\\), with \\(ψ\\) denoting the additional neutral gauge-boson mixing angle. Consequently, these couplings vanish simultaneously at \\(ψ=nπ\\), giving rise to a fermiophobic limit in which conventional Drell-Yan dilepton constraints disappear. In contrast, the \\(b=1,\\ c=-2\\) configuration does not exhibit a universal fermiophobic limit. Our results demonstrate that collider constraints on additional neutral gauge bosons depend sensitively on the fermion embeddings and neutral gauge-boson mixing structure, and suggest the possibility of comparatively light \\(Z'\\) bosons in suitable realizations of extended electroweak gauge theories.","authors":"Eduard Suarez, Yithsbey Giraldo, Eduardo Rojas","nlinked":24,"nref":24,"src":"INSPIRE","html":true},{"id":"3218965","arxiv":"2610.34720","title":"Fermion Mass and Mixing Patterns from Fusion Algebras","first":"Distler","nauth":3,"year":2026,"cites":0,"role":"today","note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[824906]] (coupling 0.02, 2 shared references). Closest network paper: [[3144122]] (coupling 0.19, 11 shared references).","score":12.0,"rank":27,"section":"new","parts":[0.06,0.06,0.53,0.0,0.0],"abstract":"The large hierarchy of fermion masses in the Standard Model has long posed a challenge to be explained. One approach is to try to invoke a symmetry principle to dictate the structure (\"texture\") of the matrices of fermion Yukawa couplings to the Higgs field. Here we invoke noninvertible symmetries, specifically, fusion algebras, to provide such textures. In particular, the structure of the fusion-algebra can be used to assign labels to each field, which determines how suppressed any given composite operator is as a term in the Lagrangian. In UV completions, this can be interpreted as specifying a hierarchy of operators that in the IR effective theory become the Yukawa couplings to the Higgs field. Remaining agnostic of a specific UV model, we perform a Monte Carlo numerical scan over unknown Wilson coefficients, and we identify the rank-8 fusion algebra $\\rm{FR}^{8,6}_8$ as the one providing the best fit for the textures of the up-quark, down-quark and charged-lepton Yukawa matrices. We also study the predictions for the CKM and PMNS mixing matrices, with the conclusion that none of the fusion algebras we study provide an accurate fit for the masses and mixing angles simultaneously. The fusion algebra structure ensures that the textures that we find are stable under RG running and persist down to low energies.","authors":"Jacques Distler, Can Kilic, Sanjay Mathai","nlinked":41,"nref":43,"src":"INSPIRE","html":true},{"id":"3219121","arxiv":"2610.35789","title":"The neutrino fog for inelastic dark matter","first":"Amarasinghe","nauth":1,"year":2026,"cites":0,"role":"today","note":"Closest of your papers: [[3130296]] (coupling 0.04, 5 shared references). Closest network paper: [[3201080]] (coupling 0.12, 6 shared references). Shared topics: dark matter mass, dark matter.","score":12.0,"rank":28,"section":"new","parts":[0.0,0.1,0.33,0.0,0.39],"abstract":"We characterize the behavior of the neutrino fog for inelastic dark matter scattering on xenon. The inelastic scattering kinematics reshape the recoil spectrum of the signal and produce a qualitatively different neutrino fog landscape. In some regions of the inelastic parameter space the fog is completely absent for future xenon experiments at any scale, while in other regions the fog is dispelled only to reappear at larger exposures. We find that multiple background sources with uncertain normalizations can make the onset of the fog jump discontinuously with the dark matter mass and mass splitting, while the discovery limit varies smoothly. We also describe a mechanism by which reduced uncertainties on neutrino rates may have the unintuitive effect of raising neutrino floors derived from the fog opacity.","authors":"C. S. Amarasinghe","nlinked":46,"nref":49,"src":"INSPIRE","html":true},{"id":"3183736","arxiv":"2607.24329","title":"The Spectrum of a Compact Internal Space II: Effective Couplings and Mass Scales","first":"Guo","nauth":1,"year":2026,"cites":0,"role":"repl","note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2690106]] (coupling 0.01, 3 shared references). Closest network paper: [[2940906]] (coupling 0.12, 3 shared references). Shared topics: neutrino mass.","score":10.7,"rank":29,"section":"replacement","parts":[0.06,0.05,0.35,0.0,0.2],"abstract":"Minimal unbiased compositional change generates the Gaussian source of the compact internal construction. We derive joint constraints on effective couplings and mass scales from its gauge and matter content, scalar sector, spectral endpoint and kinetic normalizations. Compatibility of source and colour screening selects three matter copies. Within the response family indexed by integers, shell support and position retention select the level R=5, whose transverse traceless endpoint equation has a unique positive root. Eliminating shared transfer parameters gives a relation among six geometric fermion masses. Bandwidth variation correlates the electron and electroweak scales, while two cosmological ratios are independent of the common neutrino mass normalization. Finite matching through one loop implements the generated Fermi, top and Higgs conditions in a common action. The absorptive top self energy gives the Born decay width as an additional output. The compact source covariance and positive RMS amplitude determine a local nonlinear flux that couples matter motion to source feedback. A model with an auxiliary radius admits autonomous source evolution, positive reduced propagation forms and a matter phase clock on a specified finite cosmological interval. Physical comparisons use the stated mass definitions, matching and thermal approximations. The fixed DESI DR2 distance comparison gives \\c{hi}^2 = 29.5087 for thirteen components and p=0.00554, indicating tension in the adopted cosmological mapping. Spectral tail and quadrature bounds control the finite response calculation.","authors":"Jinku Guo","nlinked":61,"nref":74,"src":"INSPIRE","html":true},{"id":"2817040","arxiv":"","title":"Review of particle physics","first":"Navas","nauth":244,"year":2024,"cites":6528,"role":"other","note":"","score":null},{"id":"1955022","arxiv":"2110.15167","title":"Singlet fermion dark matter and Dirac neutrinos from Peccei-Quinn symmetry","first":"Carvajal","nauth":4,"year":2021,"cites":7,"role":"seed","note":"","score":null},{"id":"2971971","arxiv":"2509.16319","title":"Light thermal dark matter models in the light of DAMIC-M 2025 constraints","first":"Borah","nauth":4,"year":2025,"cites":5,"role":"other","note":"","score":null},{"id":"1842151","arxiv":"2101.08666","title":"Bound states of WIMP dark matter in Higgs-portal models. Part I. Cross-sections and transition rates","first":"Oncala","nauth":2,"year":2021,"cites":23,"role":"other","note":"","
