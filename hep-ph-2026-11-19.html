<script>
const RAW = {"n":[{"id":"3113252","arxiv":"2601.22740","title":"Radiative Dirac Neutrino Masses from Modular $S_3$ Symmetry in an Axion Model","first":"Kang","nauth":3,"year":2026,"cites":0,"role":"repl","note":"Cites 13 network papers: [[2822193]], [[2877739]], [[2963992]], [[2963338]], [[2931725]], [[2697191]]…. Also cites widely used network papers: [[1783234]], [[1688995]]. Closest of your papers: [[1941263]] (coupling 0.07, 18 shared references). Closest network paper: [[3062873]] (coupling 0.24, 36 shared references). Shared topics: dirac neutrino mass, radiative neutrino mass, observed dark matter, dark matter abundance, lepton flavor violation.","score":61.0,"rank":1,"section":"replacement","parts":[1.0,0.22,0.68,0.0,0.93],"abstract":"We present a unified axion model framework that simultaneously addresses the origin of neutrino masses, leptonic flavor structure, the strong CP problem, and dark matter. The model is based on a global $U(1)_{\\rm PQ}$ symmetry combined with a modular $S_3$ symmetry and is realized within a novel class of KSVZ-type axion model. Exotic colored fermions and scalars mediate radiative neutrino mass generation at the one loop-level. The PQ charge assignment forbids tree-level neutrino masses and leaves a residual $Z_3$ symmetry that ensures the Dirac nature of neutrinos. In the minimal realization, the neutrino mass matrix is of rank two, predicting one massless neutrino. Consequently, the sum of neutrino masses is constrained for both the normal and inverted hierarchies. We analyze the implications for charged lepton flavor violation and the lepton $g-2$. The axion emerging from this framework dynamically resolves the strong CP problem and accounts for the observed dark matter abundance. Notably, the predicted axion-photon coupling is within reach of upcoming experiments and consistent with existing astrophysical and cosmological bounds.","authors":"Sin Kyu Kang, Ranjeet Kumar, Hiroshi Okada","nlinked":157,"nref":162,"src":"INSPIRE","html":true},{"id":"3227632","arxiv":"2611.14593","title":"Strongly supercooled first-order phase transitions: monopole abundance, entropy production and homogeneity consistency","first":"Zhang","nauth":3,"year":2026,"cites":0,"role":"repl","note":"Cites 2 network papers: [[2747842]], [[2657746]]. Closest of your papers: [[3130296]] (coupling 0.01, 2 shared references). Closest network paper: [[3128752]] (coupling 0.08, 16 shared references). Shared topics: early universe, gravitational wave.","score":31.4,"rank":2,"section":"replacement","parts":[0.7,0.04,0.24,0.0,0.23],"abstract":"We investigate whether monopole production in the early universe from a first-order phase transition in a unified gauge theory can be significantly suppressed if the phase transition is subject to strong supercooling but still completes successfully. This is facilitated by adopting a Gaussian nucleation model and assuming the false vacuum energy released is transferred to sectors which behave effectively as radiation in terms of cosmological evolution. We distinguish three criteria of phase-transition completion: the comoving measure completion (CMC) characterized by the eventual vanishing of the false-vacuum fraction (FVF), the physical volume completion (PVC) characterized by the eventual vanishing of the physical volume of false vacuum, and the asymptotic thermodynamic completion (ATC), which refers to the finiteness of total entropy production. Assuming an idealized Friedmann-Lemaître-Robertson-Walker (FLRW) cosmology, it is shown that the three criteria share exactly the same completion boundary, away from which they are completely equivalent. It is further shown that monopole abundance can be arbitrarily suppressed for parameter points approaching the completion boundary from the successful side. Nevertheless, for parameter points too close to the completion boundary, justification of the self-consistency of a homogeneous FLRW cosmology is difficult. We propose the use of the Hubble-scale FVF root-mean-square fluctuation to diagnose the homogeneity consistency issue, and find that arbitrarily strong suppression of monopole abundance relative to a reasonable Kibble estimate is not justifiable in terms of homogeneity consistency. These findings also have implications for gravitational wave production in strongly supercooled phase transitions.","authors":"Chen Zhang, Yue Niu, Xin Zhang","nlinked":119,"nref":124,"src":"INSPIRE","html":true},{"id":"3225739","arxiv":"2611.09478","title":"An interrelation of three neutrino mixing angles","first":"Xing","nauth":1,"year":2026,"cites":0,"role":"repl","note":"Cites 2 network papers: [[2762216]], [[3193100]]. Closest of your papers: [[1854224]] (coupling 0.02, 1 shared references). Closest network paper: [[2762216]] (coupling 0.07, 10 shared references).","score":29.3,"rank":3,"section":"replacement","parts":[0.7,0.06,0.2,0.0,0.0],"abstract":"We conjecture a novel interrelation of three neutrino mixing angles: $θ^{}_{23} = \\left(θ^{}_{12} + θ^{}_{13}\\right)/2 + π/8$, which predicts $θ^{}_{23} = 43.46^\\circ \\pm 0.26^\\circ$ with inputs of the latest JUNO and Daya Bay precision data. A simple ansatz is proposed to derive this phenomenologically favored and experimentally testable angle relation, and a new expansion of the lepton flavor mixing matrix in powers of a single small parameter is presented as a by-product.","authors":"Zhi-zhong Xing","nlinked":26,"nref":26,"src":"INSPIRE","html":true},{"id":"3161788","arxiv":"2605.28275","title":"Dark Matter Interpretation of the Super-Kamiokande Antineutrino Excess in $\\mathrm{U}(1)_{L_μ-L_τ}$ model","first":"Endo","nauth":3,"year":2026,"cites":0,"role":"repl","note":"Closest of your papers: [[3130296]] (coupling 0.14, 15 shared references). Closest network paper: [[2942039]] (coupling 0.20, 20 shared references). Shared topics: observed relic, relic abundance, dark matter.","score":27.4,"rank":4,"section":"replacement","parts":[0.0,0.4,0.58,0.0,0.68],"abstract":"Recent Super-Kamiokande analyses of the diffuse supernova neutrino background, based on data across all SK phases, indicate a mild preference over the zero-DSNB hypothesis at the level of about $2.3σ$ with electron-like antineutrino events at $E_{\\barν_e} \\simeq 20\\,\\mathrm{MeV}$. We investigate whether all or part of this excess can be accounted for by MeV-scale dark matter annihilation into neutrinos in a $\\mathrm{U}(1)_{L_μ-L_τ}$ model. The dark matter is a Dirac fermion with $m_χ\\simeq 22\\,\\mathrm{MeV}$ that annihilates via a light $Z'$ mediator into $ν_μ\\barν_μ$ and $ν_τ\\barν_τ$, which are partly converted into $\\barν_e$ through flavor oscillations. We find that this scenario can account for the excess, or a fraction thereof, while reproducing the observed relic abundance via thermal freeze-out. We further discuss the relevant laboratory and cosmological constraints, including neutrino trident production, NA64-$μ$, Borexino, and the contribution to $ΔN_\\mathrm{eff}$.","authors":"Motoi Endo, Yushi Mura, Tenta Tsuji","nlinked":60,"nref":71,"src":"INSPIRE","html":true},{"id":"","arxiv":"2611.24241","title":"Search for Heavy Charged Higgs Bosons in Boosted Top and Bottom Quark Final States at a 1.4 TeV Future Lepton Collider","first":"Hashemi","nauth":1,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[822544]]. Closest of your papers: [[1455793]] (coupling 0.04, 5 shared references). Closest network paper: [[2183252]] (coupling 0.10, 8 shared references).","score":24.0,"rank":5,"section":"new","parts":[0.45,0.13,0.28,0.0,0.0],"abstract":"The discovery potential for heavy charged Higgs bosons $H^\\pm$ decaying into a top-bottom quark pair is investigated at a future $e^+e^-$ collider operating at $\\sqrt{s}=1.4~\\mathrm{TeV}$. The study considers charged Higgs masses between 200 and 600 GeV within all four Yukawa types of the two-Higgs-doublet model (2HDM). The boosted $tb$ final state is explored using complementary cut-based and machine-learning analyses based on boosted decision trees (BDT). The expected signal significance and sensitivity contours in the $(m_{H^\\pm},\\tanβ)$ plane are obtained for each Yukawa type. The resulting sensitivity extends to regions of the 2HDM parameter space beyond the projected reach of the High-Luminosity LHC (HL-LHC), demonstrating the complementary potential of a future high-energy lepton collider to probe heavy charged Higgs bosons.","authors":"Majid Hashemi","nlinked":46,"nref":52,"src":"arXiv source","html":true},{"id":"","arxiv":"2611.24694","title":"Pole parameters of the $f_2(1270)$ and $f_2'(1525)$ from a coupled-channel analysis of the radiative $J/ψ$ multipoles","first":"Danilkin","nauth":4,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Also cites widely used network papers: [[2817040]]. Closest of your papers: [[3184726]] (coupling 0.00, 1 shared references). Closest network paper: [[3193100]] (coupling 0.02, 18 shared references).","score":18.3,"rank":6,"section":"new","parts":[0.48,0.02,0.06,0.0,0.0],"abstract":"We determine the pole parameters of $f_2(1270)$ and $f_2'(1525)$ from the combined fit to the isoscalar $D$-wave $ππ$ phase shift, the $ππ\\to K\\bar K$ modulus, and the BESIII $J/ψ\\toγπ^0π^0$ and $γK_SK_S$ data: all three $2^{++}$ multipoles $E1$, $M2$ and $E3$, and the $M2$-$E1$ phases. The hadronic amplitude is a two-channel $K$-matrix with two poles and all parameters free, so that no resonance information is taken from the Particle Data Group. The radiative decay amplitudes are written as a coupled-channel Muskhelishvili-Omnès representation, with the Omnès matrix generated by that hadronic amplitude. The left-hand cuts, which carry the production dynamics, are approximated by a linear subtraction polynomial in the physical region. The model-independent kinematic constraints among the $J=2$ helicity amplitudes are implemented explicitly. The fit describes all $358$ points with $χ^2/N=1.29$ and gives $\\sqrt{s_p}=(1267.5\\pm1.3\\pm2.6)-i\\,\\frac{1}{2}\\,(175.5\\pm2.4\\pm7.4)\\ \\mathrm{MeV}$ for the $f_2(1270)$ and $(1514.8\\pm2.8\\pm1.5)-i\\,\\frac{1}{2}\\,(80.4\\pm3.4\\pm4.8)\\ \\mathrm{MeV}$ for the $f_2'(1525)$, where the first uncertainty is statistical, from a parametric bootstrap with the data errors rescaled by $\\sqrt{χ^2/N}$ of each set, and the second systematic, from $17$ variations of the analysis.","authors":"Igor Danilkin, David Baron, Emilie Passemar, Marc Vanderhaeghen","nlinked":46,"nref":48,"src":"arXiv source","html":true},{"id":"3230853","arxiv":"2611.23984","title":"Role of excited hyperons in $K^{*}Ξ$ production via $K^{-}N$ scattering","first":"Ma","nauth":2,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Closest network paper: [[3227657]] (coupling 0.01, 1 shared references). Shared topics: production mechanism.","score":17.9,"rank":7,"section":"new","parts":[0.45,0.0,0.04,0.0,0.14],"abstract":"We investigate the production mechanism of $K^-N\\to K^*Ξ$ and the role of high-mass excited hyperons within an effective Lagrangian approach, using a combined fit to cross section and polarization data for $K^-p\\to K^{*+}Ξ^-$. The model includes $s$- and $u$-channel exchanges of the ground-state $Λ$ and $Σ$ hyperons, together with $s$-channel contributions from $Λ(2325)$ and $Σ(2230)$. The pronounced near-threshold enhancement of the total cross section is driven mainly by these excited hyperons, whereas $u$-channel exchange dominates at backward angles at higher energies. Polarization results show that both the $K^*$ spin-density matrix elements and the $Ξ$ recoil polarization are sensitive to excited-hyperon contributions near threshold. Notably, the latter remains sensitive to interference involving excited-hyperon amplitudes even at higher energies. Moreover, with the same fitted parameters and no additional free parameters, the predicted cross sections for $K^-p\\to K^{*0}Ξ^0$ and $K^-n\\to K^{*0}Ξ^-$ agree well with available measurements. Finally, a Dalitz analysis of $K^-p \\to K^{*+}Ξ^- \\to KπΞ^-$, together with existing $KπΞ^-$ cross section data, indicates the feasibility of reconstructing $K^{*+}Ξ^-$ through this final state. These results suggest that $K^*Ξ$ production provides a valuable reaction channel for investigating high-mass excited hyperons and their hadronic couplings, and offers theoretical guidance for future experimental measurements.","authors":"Si-Yu Ma, Xiao-Yun Wang","nlinked":55,"nref":56,"src":"INSPIRE","html":true},{"id":"3195622","arxiv":"2608.23713","title":"Soft Scale Symmetry Breaking with Laguerre Explicit Regulators","first":"Vieira","nauth":1,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[3193100]]. Closest network paper: [[1667060]] (coupling 0.04, 2 shared references).","score":17.3,"rank":8,"section":"replacement","parts":[0.45,0.0,0.1,0.0,0.0],"abstract":"In this work, we search for explicit regulators that do not spuriously break scale invariance starting from conditions established by implicit regularization. There is a family of regulator functions that obeys the conditions and leads to soft breaking terms of the dilatation current. This family of functions is shown to be related to the Laguerre polynomials. We apply this approach by revisiting quadratic divergences in the context of the naturalness problem of the Standard Model and show that the quadratic dependence of the Higgs mass on the cutoff is not required by consistency of scale-symmetry breaking and can be removed within this class of regulators. Applications of these regulators beyond 1-loop order are also considered.","authors":"A. R. Vieira","nlinked":38,"nref":39,"src":"INSPIRE","html":true},{"id":"3230863","arxiv":"2611.24344","title":"Doubly heavy open--flavor tetraquarks within the relativistic quark model","first":"Galkin","nauth":2,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Closest network paper: [[3193100]] (coupling 0.03, 39 shared references).","score":17.2,"rank":9,"section":"new","parts":[0.45,0.0,0.1,0.0,0.0],"abstract":"Mass spectra of the ground, orbitally and radially excited states of doubly heavy open--flavor tetraquarks are calculated within the relativistic quark model based on the quasipotential approach and quantum chromodynamics. Tetraquarks are considered as bound states of a heavy diquark $\\mathrm{QQ^{\\prime}}$ ($\\mathrm{Q,Q^{\\prime} = c,b}$) and a light antidiquark $\\mathrm{\\overline{qq^{\\prime}}}$ ($\\mathrm{q,q^{\\prime} = u,d,s}$). The diquark--antidiquark interaction quasipotential includes both spin--independent and spin--dependent relativistic contributions. The finite sizes of the diquark and antidiquark are taken into account via the form factors of their interaction with gluons. Masses of the ground ($1S$) and excited ($1P$, $2S$, $1D$, $2P$, $3S$) states are calculated including the mixing of states with the same observable quantum numbers $J^{P}$ but different spins $S$. The obtained masses are compared with the lowest allowed thresholds for strong fall--apart decays into a pair of heavy--light mesons in $S$--wave. Most of the states lie significantly above these thresholds. However, several states, predominantly orbital excitations with large $J$, lie below or slightly above the corresponding thresholds and, thus, could be promising candidates for experimental observation. The number of such near--threshold states increases for tetraquarks containing bottom quarks. The predicted mass of the ground state of the $\\mathrm{cc\\overline{ud}}$ tetraquark with $J^{P}=1^{+}$ is consistent with the experimentally observed $\\mathrm{T}_{\\mathrm{cc}}(3875)^{+}$ state.","authors":"Vladimir O. Galkin, Elena M. Savchenko","nlinked":107,"nref":116,"src":"INSPIRE","html":true},{"id":"3159166","arxiv":"2605.25918","title":"Predicted Exotic Doubly Heavy-Strange Pentaquarks","first":"Feijoo","nauth":2,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[3193100]]. Closest network paper: [[3091093]] (coupling 0.03, 3 shared references).","score":17.2,"rank":10,"section":"replacement","parts":[0.45,0.0,0.09,0.0,0.0],"abstract":"We predict exotic doubly heavy--strange pentaquarks with minimal quark content $u\\bar d sQQ'$ ($QQ'=cc,bc,bb$) within a coupled-channel unitary framework where the interaction is derived from an extension of the local hidden gauge approach to the heavy-quark sector. We obtain a robust spectrum of manifestly exotic states; two states appear in the $u\\bar d scc$ sector, three in $u\\bar d scb$, and two in $u\\bar d sbb$. These emerge either as bound states or resonances, along with seven additional virtual states manifested as threshold cusps. The binding mechanism is dominated by off-diagonal transitions among heavy-baryon--light-meson channels, while diagonal interactions are strongly suppressed. These results extend exotic hadron spectroscopy into the doubly heavy--strange sector and provide concrete targets for future experimental searches.","authors":"Albert Feijoo, Eulogio Oset","nlinked":86,"nref":87,"src":"INSPIRE","html":true},{"id":"3230802","arxiv":"2611.23922","title":"Gravitational Form Factors and Transverse Mechanical Structure of the Charged Kaon in a Two-Fock-Sector Light-Front Hamiltonian","first":"Thakuria","nauth":3,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Closest network paper: [[2851201]] (coupling 0.02, 1 shared references).","score":16.5,"rank":11,"section":"new","parts":[0.45,0.0,0.04,0.0,0.0],"abstract":"We study the electromagnetic and gravitational form factors of the charged kaon in a light-front Hamiltonian model with coupled $|u\\bar s\\rangle$ and $|u\\bar s g\\rangle$ Fock sectors. We solve the coupled Hamiltonian in a longitudinal Jacobi and transverse harmonic-oscillator basis, with the interaction strength fixed by the kaon mass. The momentum form factors are extracted from $T^{++}$, while the stress form factors are obtained from the transverse shear projection of the QCD Belinfante energy-momentum tensor, including diagonal, sector-changing, and constrained-field contributions. The strange antiquark carries the largest fraction of the kaon's longitudinal momentum, whereas the gluon carries only $2.05\\%$. Despite this small momentum fraction, the gluon contributes $42.4\\%$ of $|D_K(0)|$, for which we obtain $D_K(0)=-2.03610$. The charge and transverse momentum radii are $0.5178\\pm0.0278\\,\\mathrm{fm}$ and $0.3394\\pm0.0113\\,\\mathrm{fm}$, respectively, with uncertainties estimated from mass and basis variations. We obtain the transverse mechanical distributions using two ultraviolet continuations of the directly calculated $D$ form factors beyond $Q^2=2\\,\\mathrm{GeV}^2$. Both continuations give positive pressure at small transverse distances and negative pressure at larger distances. The corresponding transverse mechanical radii are $0.4616\\pm0.0130\\,\\mathrm{fm}$ and $0.4768\\pm0.0132\\,\\mathrm{fm}$, both larger than the transverse momentum radius. The central pressure changes substantially between the two continuations, whereas the pressure zero and mechanical radii vary much less.","authors":"Parashmani Thakuria, Madhurjya Lalung, Jayanta Kumar Sarma","nlinked":79,"nref":85,"src":"INSPIRE","html":true},{"id":"3115088","arxiv":"2602.03384","title":"Asymmetric dark matter from leptogenesis in type-III seesaw framework with modular $S_4$ symmetry","first":"Abhishek","nauth":2,"year":2026,"cites":0,"role":"repl","note":"Closest of your papers: [[3184726]] (coupling 0.03, 4 shared references). Closest network paper: [[3148101]] (coupling 0.12, 8 shared references). Shared topics: relic density, dark matter mass, neutrino oscillation data, dark matter abundance, dark sector.","score":16.4,"rank":12,"section":"replacement","parts":[0.0,0.09,0.33,0.0,0.88],"abstract":"We present a unified framework for neutrino masses, baryogenesis, and dark matter based on a modular $S_4$ symmetry combined with a type-III seesaw mechanism. All Yukawa couplings, CP phases, and flavor textures originate from a single complex modulus $τ$, whose vacuum expectation value controls both visible and dark sector dynamics. The same modular parameter fixes the neutrino mass matrix, determines the CP asymmetries driving resonant leptogenesis, and correlates the resulting baryon and dark matter abundances. A detailed numerical analysis shows that the model reproduces all neutrino oscillation data within the $3σ$ NuFIT~5.2 (2024) ranges for normal ordering, predicting $δ_{\\rm CP} \\simeq \\pm (150^\\circ-180^\\circ)$, $\\sum m_ν\\simeq(0.06-0.08)~\\mathrm{eV}$, and an effective Majorana mass $m_{ββ} \\simeq (0.3 - 4)\\times 10^{-3}~\\mathrm{eV}$, testable in next-generation neutrinoless double-beta decay experiments. The same modular Yukawas yield resonantly enhanced CP asymmetries $|ε_{L,χ}| \\sim 10^{-9}-10^{-6}$ at $M_Σ\\sim 10^{7}~\\mathrm{GeV}$, successfully generating the observed baryon asymmetry $η_B\\simeq6\\times10^{-10}$ and dark relic density $Ω_χh^2\\simeq0.12$ without additional free parameters. The predicted correlation $Ω_χ/Ω_B\\simeq5.4$ fixes the dark matter mass to $m_χ\\simeq0.1-2~\\mathrm{GeV}$, consistent with all current constraints. This framework therefore realizes a fully predictive baryon$-$dark matter co-genesis, where the geometry of the modular symmetry links the origin of flavor, CP violation, and the cosmic matter asymmetry.","authors":" Abhishek, V. Suryanarayana Mummidi","nlinked":44,"nref":44,"src":"INSPIRE","html":true},{"id":"","arxiv":"2611.24671","title":"A New GUT","first":"Agrawal","nauth":3,"year":2026,"cites":0,"role":"today","note":"Co-authors of yours: Reig. Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1663960]] (coupling 0.03, 1 shared references). Closest network paper: [[1944631]] (coupling 0.09, 12 shared references).","score":13.4,"rank":13,"section":"new","parts":[0.06,0.08,0.26,0.5,0.0],"abstract":"We present a new class of 4-dimensional Grand Unified Theories where the gauge sectors of the standard model have a novel embedding in the unified group that does not factor through an $SU(5)$ subgroup. The smallest example has gauge algebra $\\frak{su}(12)$ and an anomaly-free spectrum that produces the three standard model generations with no additional chiral matter. The embedding predicts the axion-photon anomaly ratio $E/N=2/3$ and the weak mixing angle $\\sin^2θ_W=1/2$ at the unification scale. Gauge-mediated proton decay proceeds through flipped-$SU(5)$-like operators and the minimally charged smooth monopole carries two Dirac charge units. The global gauge group can be $SU(12)$ or $SU(12)/\\mathbb{Z}_2$, with the former allowing color singlets of half-integer electric charge. We develop a GUT bootstrap to constrain $SU(n)$ embeddings with three generations and no additional chiral matter. For unified fermions in up to two-index representations, we prove that all new embeddings arise from the $SU(8m+4)$ family, including flavor unified models for $m \\geq 2$.","authors":"Prateek Agrawal, Michael Nee, Mario Reig","nlinked":51,"nref":54,"src":"arXiv source","html":true},{"id":"3213657","arxiv":"2610.12719","title":"Stochastic gravitational waves from narrow-band cosmological magnetic fields","first":"Aires","nauth":2,"year":2026,"cites":0,"role":"repl","note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2787890]] (coupling 0.03, 4 shared references). Closest network paper: [[2134073]] (coupling 0.10, 7 shared references). Shared topics: dark matter model, dark matter, gravitational wave.","score":12.8,"rank":14,"section":"replacement","parts":[0.06,0.09,0.3,0.0,0.37],"abstract":"We calculate the spectrum of gravitational waves generated by a cosmological magnetic field with a narrow-band power spectrum. For a magnetic spectrum narrowly peaked at a comoving wavenumber $k_c$, we find that the gravitational wave signal has a maximum at $2k_c$ and, as expected from momentum conservation, has a sharp cutoff at that scale. We apply this analysis to an ultralight dark matter model of magnetogenesis operating around recombination, in which an axion-photon coupling generates a helical magnetic field by parametric resonance. We determine the conditions for the resulting gravitational waves to enter the frequency range of pulsar timing experiments. Although the required frequency can be reached for sufficiently large coupling, the corresponding amplitude is below the experimental sensitivity for physically allowed energy densities of the magnetic field. We generalize this conclusion to models of magnetogenesis operating at other epochs, estimating as $T \\simeq 160$ MeV the temperature of a magnetogenesis process assumed to be the source of the stochastic gravitational wave background suggested by pulsar timing arrays. We place the lower bound $T \\gtrsim 1$-10 MeV on such viable models.","authors":"Abdias Aires, Tatsuya Daniel","nlinked":41,"nref":49,"src":"INSPIRE","html":true},{"id":"3230160","arxiv":"2611.21595","title":"Rest-frame annihilation lines of $\\sim70$ GeV WIMPs in 23,000 stacked galaxy clusters","first":"Keshet","nauth":1,"year":2026,"cites":0,"role":"today","note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1693823]] (coupling 0.04, 6 shared references). Closest network paper: [[2958466]] (coupling 0.06, 6 shared references). Shared topics: interacting massive particle, weakly interacting massive particle.","score":11.9,"rank":15,"section":"cross","parts":[0.06,0.12,0.16,0.0,0.38],"abstract":"Weakly interacting massive particle (WIMP) annihilation features were reported as a 43 GeV line in three Fermi-LAT galaxy clusters ($\\mathtt{S}_3$), as triad $\\{γγ, γZ,γh\\}$ lines from $\\sim70$ GeV WIMPs in LAT data cross-correlated ($\\mathtt{C}_{\\mathtt{W}}$) with western eROSITA X-rays, and as a nonad (combining three triads) of two cross-annihilating WIMPs in $\\mathtt{C}_{\\mathtt{W}}$. A blind scan of LAT 16.3-year data around 23,343 high-latitude clusters in their rest frames finds three triads, at 70 GeV ($2.8σ$ trial-corrected, henceforth), $72$ GeV ($1.3σ$; strengthening to $2.7σ$ if mass-fixed by $\\mathtt{S}_3$, $4.0σ$ combined with $\\mathtt{C}_{\\mathtt{W}}$ masked around the clusters, $5.7σ$ if also combined with $\\mathtt{S}_3$), and 74-75 GeV: a triplet not only rare ($3.5σ$) but also forming a $\\{70,74\\}$ GeV nonad ($3.4σ$; strengthening to $4.0σ$, $4.6σ$, and $6.1σ$, respectively). The spectral features, robust in and out of the $\\mathtt{C}_{\\mathtt{W}}$ region and $\\mathtt{S}_3$ clusters, appear in all Galactic quadrants and only in the cluster rest frame (vanishing upon redshift rescaling or permutation), fade away from cluster centers, are absent from their surrounding stacked fields, and like $\\mathtt{C}_{\\mathtt{W}}$ indicate intrinsic few $10^{-19}$ cm$^3$ s$^{-1}$ cross sections (uncorrected) across samples. All features are largely explained by cross-annihilating $69.7^{+0.4}_{-1.0}$ and $74.5^{+1.1}_{-0.6}$ GeV WIMPs.","authors":"Uri Keshet","nlinked":80,"nref":85,"src":"INSPIRE","html":true},{"id":"3225702","arxiv":"2611.09106","title":"Probing Dark Matter via the Migdal Effect in LUX-ZEPLIN Data","first":"Yu","nauth":2,"year":2026,"cites":0,"role":"repl","note":"Closest of your papers: [[2794409]] (coupling 0.05, 7 shared references). Closest network paper: [[3207263]] (coupling 0.11, 12 shared references). Shared topics: dark matter.","score":10.8,"rank":16,"section":"replacement","parts":[0.0,0.16,0.31,0.0,0.13],"abstract":"Sub-GeV dark matter (DM) particles deposit little energy in conventional direct-detection experiments and are therefore difficult to probe, but the Migdal effect provides an electronic signal from atomic ionization accompanying the recoil. Using the new results of the LUX-ZEPLIN experiment with a 4.2 tonne-year exposure, we evaluate the sensitivity of the Migdal effect to the spin-independent DM--nucleon scattering cross section. For masses between $350~\\mathrm{MeV}$ and $10~\\mathrm{GeV}$, the projected 90\\% upper limits range from $6.5\\times10^{-37}$ to $3.1\\times10^{-43}~\\mathrm{cm^2}$. These limits are then used to constrain the minimal scalar- and vector-mediator DM models. For the light-mediator DM model, the constraint on the coupling reaches $α\\simeq 10^{-12}$, which is stronger than or comparable to the constraints from kaon decays, stellar cooling, and SN1987A.","authors":"Yang Yu, Lei Feng","nlinked":47,"nref":48,"src":"INSPIRE","html":true},{"id":"3230760","arxiv":"2611.23371","title":"Seeing through the fog: astrophysical priors and the evidence for new physics in pulsar timing arrays","first":"Bringmann","nauth":3,"year":2026,"cites":0,"role":"today","note":"Closest of your papers: [[2787890]] (coupling 0.03, 6 shared references). Closest network paper: [[2803557]] (coupling 0.09, 14 shared references). Shared topics: dark sector, early universe, gravitational wave.","score":10.6,"rank":17,"section":"cross","parts":[0.0,0.09,0.27,0.0,0.38],"abstract":"Pulsar timing arrays (PTAs) have found evidence for a gravitational wave background at nHz frequencies. Inspiralling supermassive black hole binaries (SMBHBs) likely contribute to at least part of the signal, but there may be additional cosmological sources from new physics in the early universe. Disentangling the two is complicated by the prohibitively slow modelling of SMBHB spectra based on realistic population models. Here we introduce binaryfog, a surrogate of up-to-date population models also used by the NANOGrav collaboration, that returns the statistical distribution of bent spectra $\\mathcal{O}(10^6)$ faster than direct computation. We use binaryfog to profile over the six astrophysical parameters in fits of four extensively discussed new-physics models: a dark sector phase transition, cosmic superstrings, inflationary gravitational waves, and domain walls. Compared to the widely adopted power-law description of the SMBHB background, the preference for a phase transition drops from $2.8σ$ to $1.5σ$. The other three models follow a similar pattern. We also recommend updated astrophysical priors based on galaxy surveys published since 2014, which for current PTA data still only give a marginal preference of $1.7σ$ for a phase transition. An interpretation of the signal in terms of SMBHBs alone favours binaries that merge within about $2\\,$Gyr after their host galaxies have merged, requiring an efficient mechanism to overcome the final parsec of separation. If binaries need longer than about $6.5\\,$Gyr to merge, the preference for a phase transition exceeds $3σ$ under our recommended updated prior set. binaryfog can help resolve these questions, as it allows users to study the impact of updated astrophysical priors and a realistic SMBHB population model on new-physics searches with PTAs.","authors":"Torsten Bringmann, Chris Gordon, Carlo Tasillo","nlinked":125,"nref":144,"src":"INSPIRE","html":true},{"id":"3230757","arxiv":"2611.23374","title":"The Price of Discovery: Cost-Optimized Detectors for the GUT-Scale QCD Axion","first":"Benabou","nauth":3,"year":2026,"cites":0,"role":"today","note":"Closest of your papers: [[1941263]] (coupling 0.07, 14 shared references). Closest network paper: [[1895232]] (coupling 0.06, 11 shared references). Shared topics: dark matter.","score":10.0,"rank":18,"section":"new","parts":[0.0,0.21,0.16,0.0,0.13],"abstract":"Grand unification and string theory point to a quantum chromodynamics (QCD) axion with mass between $10^{-11}$ and $10^{-8}$ eV, while heterotic string theory suggests a mass of $0.5-0.8$ neV. We study which laboratory experiment could discover or exclude DFSZ-strength QCD axion dark matter at and above 0.5 neV at the lowest cost, which we estimate from scaling laws calibrated to historical data. We find that a lumped-element detector, building on the ABRACADABRA concept, can do so with demonstrated readout technology; an example is a shielded toroid about 14 m across with a 6 T NbTi magnet, whose magnet and cryostat we estimate at around 120 million Swiss francs (MCHF). If projected readout targets are met, a 5 m toroid at 25 MCHF suffices. We find these designs by optimizing the toroid, solenoid, and core lumped-element topologies under a common cost metric. The toroid emerges as the most promising and cost-effective topology. The optimal field of the toroid detector is far below the 16 T of the proposed DMRadio-GUT design, which would cost nearly twice as much as our optimum. Heterodyne searches with superconducting radio-frequency cavities, with cavity shapes that we optimize for price, cost between about the same as and twice as much as the lumped-element detectors, but require cavities of volumes $\\sim50-2000$ m$^3$. We find that nuclear-magnetic-resonance searches (CASPEr) need orders-of-magnitude gains in spin polarization and coherence. We release axionMultiPhysics, an open-source finite-element and multiphysics package for, e.g., magnetoquasistatic and full-wave electromagnetics, superconductors, readout circuits, and mechanics, from which most of our numerical results were obtained.","authors":"Joshua N. Benabou, Joshua W. Foster, Benjamin R. Safdi","nlinked":106,"nref":151,"src":"INSPIRE","html":true},{"id":"1597138","arxiv":"1704.08340","title":"Linking axionlike dark matter to neutrino masses","first":"Carvajal","nauth":3,"year":2017,"cites":22,"role":"seed","note":"","score":null},{"id":"2627241","arxiv":"2301.11345","title":"Gravitational wave from graviton Bremsstrahlung during reheating","first":"Barman","nauth":4,"year":2023,"cites":74,"role":"seed","note":"","score":null},{"id":"1796734","arxiv":"2005.08287","title":"Observable Signatures of Scotogenic Dirac Model","first":"Guo","nauth":2,"year":2020,"cites":37,"role":"other","note":""," 60,"c"],[82,63,"c"],[15,83,"k"],[29,20,"c"],[79,40,"c"],[69,75,"c"],[2,84,"k"]],"next":[{"arxiv":"2611.23385","id":"3230790","title":"Leading Axion Sensitivity with Interstellar Medium Optical Line Emission","authors":"Rebecca K. Leane, Gowri Sundaresan","score":9.5,"section":"new","rank":19,"parts":[0.06,0.13,0.15,0.0,0.13],"note":"Also cites widely used network papers: [[1783234]]. Closest of your papers: [[2964960]] (coupling 0.05, 4 shared references). Closest network paper: [[2725313]] (coupling 0.05, 6 shared references). Shared topics: dark matter.","abstract":"We introduce interstellar optical line emission as a new probe of axion dark matter. Axion decays to photons or electrons can excite or ionize neutral hydrogen, producing H$α$ emission at a fixed atomic wavelength rather than at an energy set by the axion mass. Developing the formalism and applying it to the Leo T galaxy with Very Large Telescope data, we derive strong constraints for eV--GeV scale axions, covering new regions of parameter space for both axion-photon and axion-electron couplings. These results establish optical line measurements as a new discovery channel for axion dark matter, probe poorly constrained parameter space below hydrogen's ionization threshold, and constrain axion explanations of JWST's high-redshift supermassive-black-hole observations."},{"arxiv":"2611.23384","id":"3230775","title":"Capturing Ultralight Dark Matter Around Black Holes","authors":"Salvatore Bottaro, Viktor Firsov, Gilad Perez, Halil Steuer, Ofri Telem","score":9.2,"section":"new","rank":20,"parts":[0.0,0.12,0.3,0.0,0.13],"note":"Closest of your papers: [[1709434]] (coupling 0.04, 5 shared references). Closest network paper: [[3170445]] (coupling 0.10, 7 shared references). Shared topics: dark matter.","abstract":"Ultralight dark matter (DM) can form hydrogen-like bound states around black holes (BHs), that can be perturbatively described at small gravitational fine-structure constant alpha=G*M*mu<<1, where M and mu are the masses of the BH and the DM scalar, respectively. We show that self-interactions lead to the formation of a 2p-halo around a Schwarzschild BH, with the final cloud density as high as 10^5 times the background density. We also show that for the case of a Kerr BH with a superradiant cloud, the decay of the 211 state can populate the ground state faster than it decays into the BH. Consequently, the 211 cloud mass is bounded from above by M_{211}^{crit}/M~=5*10^{-3}*alpha^{-1/2}*[f_a/10^{16} GeV]^2 up to an O(1) factor depending on the spin of the BH. Crucially, for rapidly spinning BHs with M~<4*10^6 M_{sun}, alpha~<0.03, and f_a~<9*10^{15} GeV the resulting superradiant cloud mass is lower than previously assumed, which might have an impact on axion bounds from measurements of stellar BH spins."},{"arxiv":"2411.08097","id":"2848010","title":"Atomic Dark Matter, Interacting Dark Radiation, and the Hubble Tension","authors":"Manuel A. Buen-Abad, Zackaria Chacko, Ina Flood, Can Kilic, Gustavo Marques-Tavares, Taewook Youn","score":8.6,"section":"replacement","rank":21,"parts":[0.0,0.04,0.27,0.0,0.33],"note":"Closest of your papers: [[1679809]] (coupling 0.01, 1 shared references). Closest network paper: [[2051195]] (coupling 0.09, 51 shared references). Shared topics: dark sector, dark matter.","abstract":"We present a new class of interacting dark sector models that can address the Hubble tension. Interacting dark radiation (DR) has previously been put forward as a solution to the problem, but this proposal is disfavored by the high-$\\ell$ cosmic microwave background (CMB) data. We modify this basic framework by introducing a subcomponent of dark matter (DM) that interacts strongly with the DR, so that together they constitute a tightly coupled fluid at early times. We show that if this subcomponent decouples from the interacting DR during the CMB epoch, the $\\ell$ modes of the CMB that entered the horizon before decoupling are impacted differently from those that entered after, allowing a solution to the problem. We present a model that realizes this framework, which we dub \"New Atomic Dark Matter\", or nuADaM, in which the interacting dark matter (iDM) subcomponent is composed of dark atoms, and dark \"neutrinos\" with long-range interactions contribute to the DR, hence the name of the model. This iDM subcomponent is acoustic at early times but decouples from the DR following dark recombination. In contrast to conventional atomic dark matter (ADM) models, the dark photon is part of a richer DR sector, which ensures that it continues to be self-interacting even after recombination. We show that this model admits a significantly larger value of $H_0$ than $Λ\\mathrm{CDM}$ when fit to CMB and BAO data, while maintaining a comparable goodness of fit. Once the SHOES data set is included, it provides a significantly better fit than $Λ\\mathrm{CDM}$."},{"arxiv":"2611.24091","id":"3230857","title":"Improving Sensitivity to Rare Processes at the LHC with Geodesic-Aware Graph Neural Networks","authors":"Benjamin Fuks, A. Hammad, Adil Jueid, Mihoko Nojiri","score":8.5,"section":"new","rank":22,"parts":[0.06,0.11,0.22,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1455793]] (coupling 0.04, 6 shared references). Closest network paper: [[2623950]] (coupling 0.08, 9 shared references).","abstract":"Rare processes at the Large Hadron Collider often lead to final states with quarks, for which the dominant backgrounds contain the same reconstructed objects as the signal. The colour structure of the hard process, imprinted on the pattern of soft QCD radiation, carries information that is largely left unused by standard analyses. We introduce a geometric representation of this colour flow by mapping hadronic constituents onto the unit sphere through a modified inverse stereographic projection centred on a pair of jets selected as a colour-singlet resonance candidate. The jet separation defines a circular region whose interior and exterior are mapped to opposite hemispheres, allowing a graph neural network to exploit the resulting radiation pattern using geodesic distances. As a benchmark, we consider flavour-changing neutral interactions of the top quark with the Higgs boson at $\\sqrt{s}=13.6$~TeV, through associated $tH$ production and $t\\bar t$ production with one top quark undergoing a $t\\to qH$ decay, where $q=u,c$, focusing on subsequent $H\\to b\\bar b$ and leptonically top quark decays in both channels. Relative to a baseline graph neural network operating in the $(η,φ)$ plane, the geodesic-aware network improves the expected 95\\% confidence-level limits on $\\mathrm{BR}(t\\to uH)$ and $\\mathrm{BR}(t\\to cH)$ by about an order of magnitude, to $1.1\\times10^{-4}$ and $8.3\\times10^{-5}$ for an assumed integrated luminosity of $139~\\mathrm{fb}^{-1}$. The approach can also be applied to searches for other colour-singlet resonances decaying into quarks or gluons."},{"arxiv":"2207.08856","id":"2116929","title":"Dimension-8 SMEFT Matching Conditions for the Low-Energy Effective Field Theory","authors":"Serge Hamoudou, Jacky Kumar, David London","score":8.3,"section":"replacement","rank":23,"parts":[0.0,0.0,0.46,0.0,0.14],"note":"Closest network paper: [[2778553]] (coupling 0.16, 15 shared references). Shared topics: one-loop level.","abstract":"In particle physics, the modern view is to categorize things in terms of effective field theories (EFTs). Above the weak scale, we have the SMEFT, formed when the heavy new physics (NP) is integrated out, and for which the Standard Model (SM) is the leading part. Below $M_W$, we have the LEFT (low-energy EFT), formed when the heavy SM particles ($W^\\pm$, $Z^0$, $H$, $t$) are also integrated out. In order to determine how low-energy measurements depend on the underlying NP, it is necessary to compute the matching conditions of LEFT operators to SMEFT operators. These matching conditions have been worked out for all LEFT operators up to dimension 6 in terms of SMEFT operators up to dimension 6 at the one-loop level. However, this is not sufficient for all low-energy observables. In this paper we present the momentum-independent matching conditions of all such LEFT operators to SMEFT operators up to dimension 8 at tree level."},{"arxiv":"2611.24674","id":"","title":"On the cosmic window for neutrino self-interactions","authors":"Ivan Pérez-Castro, Jorge Venzor, Josue De-Santiago, Pablo Roig, Abdel Pérez-Lorenzana","score":7.4,"section":"new","rank":24,"parts":[0.0,0.1,0.3,0.0,0.0],"note":"Closest of your papers: [[2663002]] (coupling 0.03, 5 shared references). Closest network paper: [[3223723]] (coupling 0.10, 31 shared references).","abstract":"Neutrino self-interactions ($ν$SI) beyond the Standard Model have arisen as a promising probe of new physics in cosmology. In this Letter, we show that $ν$SI emerging in the low-energy limit of renormalizable theories implies resonant mediator behavior. We identify two regions for $ν$SI: (i) neutrinos become tightly coupled with background evolution; for the first time, we establish how this evolution modifies the Boltzmann hierarchy equations (BHEs), and (ii) resonant $ν$SI dominates the dynamics with negligible background evolution, relevant for mediator masses $\\sim 10^{-6}-1$ MeV. In region (i), before matter-radiation equality, neutrino free-streaming is determined by the effective four-fermion interaction, known as the heavy-mediator limit (HML); we explore the impact of background evolution on this scenario, and from our modified BHEs, we show that self-interacting dark radiation scenarios require larger couplings than previously estimated to mimic $ν$SI. Region (ii) shows that the simplest realization of $ν$SI mediated by a (pseudo)scalar particle leads to an extra radiation contribution of $ΔN_{\\rm eff}^{\\rm CMB} \\approx 0$, instead of the commonly quoted $\\simeq 0.12$, at the CMB epoch. Overall, we highlight that our findings should be considered in any plausible scenario involving $ν$SI."},{"arxiv":"2511.16554","id":"3085109","title":"Dark Matter-Dark Radiation Interactions and the Hubble Tension","authors":"Manuel A. Buen-Abad, Zackaria Chacko, Ina Flood, Can Kilic, Gustavo Marques-Tavares, Taewook Youn","score":7.1,"section":"replacement","rank":25,"parts":[0.0,0.04,0.23,0.0,0.25],"note":"Closest of your papers: [[1941263]] (coupling 0.01, 2 shared references). Closest network paper: [[2119988]] (coupling 0.08, 8 shared references). Shared topics: early universe, dark matter.","abstract":"Models in which a subcomponent of dark matter interacts with dark radiation have been proposed as a solution to the Hubble tension. In this framework, the interacting subcomponent of dark matter is in thermal equilibrium with the dark radiation in the early universe, but decouples from it around the time of matter-radiation equality. We study this general class of models and evaluate the quality of fit to recent cosmological data on the cosmic microwave background (from Planck 2018 and ACT DR6), baryon acoustic oscillations, large-scale structure, supernovae type Ia, and Cepheid variables. We focus on three benchmark scenarios that differ in the rate at which the dark matter decouples from the dark radiation, resulting in different patterns of dark acoustic oscillations. Fitting without ACT DR6 data, we find that all three scenarios significantly reduce the Hubble tension relative to $Λ$CDM, with an exponentially fast decoupling being the most preferred. The tension is reduced to less than $2 \\, σ$ in fits that don't include the SH0ES collaboration results as part of the data and to less than $1 \\, σ$ when these are included. The preference for the interacting model is substantially reduced when ACT DR6 data are included. We find that the largest $H_0$ value at the $95 \\%$ confidence region is $70.1$ km/s/Mpc without the SH0ES data, leading to only a mild reduction in the tension. This increases to $72.5$ km/s/Mpc, corresponding to a reduction in the tension to less than $3 \\, σ$, if the SH0ES results are included in the fit."},{"arxiv":"2611.24625","id":"","title":"LIGO-Virgo-KAGRA stochastic constraints on first-order phase transitions: A tale of priors","authors":"S. AbdusSalam, J. Kersten, S. A. Ojaghi, L. Velasco-Sevilla, A. Zafari","score":6.8,"section":"cross","rank":26,"parts":[0.0,0.05,0.28,0.0,0.1],"note":"Closest of your papers: [[3130296]] (coupling 0.02, 3 shared references). Closest network paper: [[3128752]] (coupling 0.10, 12 shared references). Shared topics: gravitational wave.","abstract":"We re-examine the methodology for constraining cosmological first-order phase transitions from gravitational-wave searches using Bayesian statistical analysis. Specifically, we use results from LIGO-Virgo-KAGRA searches for a stochastic gravitational wave background during observing runs O1--O4a. We explore multiple prior choices across three categories of fit parameters: geometrical parameters, thermodynamical parameters of phase transitions, and the parameters of an Abelian Higgs particle physics model. Our key finding is that the constraints on most parameters describing gravitational waves from a phase transition depend strongly on the prior. Consequently, the data do not yet allow to derive robust constraints on these parameters. Besides, even if a parameter is meaningfully constrained, the upper limit can vary significantly with the prior range. We provide practical recommendations for assessing the robustness of parameter estimates and guidelines for rigorously testing prior independence in future analyses."},{"arxiv":"2611.24825","id":"","title":"Three-nucleon potentials and their matrix elements for $δ_{\\mathrm{NS}}$ in superallowed $β$ decays","authors":"Graham Chambers-Wall, Maria Dawid, Emanuele Mereghetti, Saori Pastore, Maria Piarulli","score":6.2,"section":"cross","rank":27,"parts":[0.06,0.05,0.17,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2690106]] (coupling 0.02, 2 shared references). Closest network paper: [[1847652]] (coupling 0.06, 5 shared references).","abstract":"We derive three-nucleon potentials for radiative corrections at order $\\mathcal{O}(αε_χ^2)$ in chiral effective field theory where $α$ is the electromagnetic coupling and $ε_χ$ is the chiral expansion parameter. These corrections contribute to the nuclear-structure-dependent term $δ_\\mathrm{NS}$ for determinations of the Cabibbo-Kobayashi-Maskawa matrix element $V_{ud}$ from superallowed nuclear $β$ decays. We compute matrix elements of three-nucleon contributions at orders $\\mathcal{O}(α^2)$ and $\\mathcal{O}(αε_χ^2)$ using quantum Monte Carlo methods. We find the matrix elements at order $\\mathcal{O}(α^2)$ to be large and to have an effect on the extraction of $V_{ud}$ at the scale of $10^{-4}$. In the case of $^{10}$C, the matrix elements of $\\mathcal{O}(αε_χ^2)$ three-nucleon operators provide a 2% correction to $δ_{\\text{NS}}$, and are thus beyond the current precision goals. The relative size of three-nucleon corrections to $δ_{\\text{NS}}$ in medium mass nuclei, where two-body contributions tend to be smaller, remains to be investigated. We then use these results to determine $V_{ud}$ from the superallowed transition ${}^{10}\\mathrm{C}\\rightarrow{}^{10}\\mathrm{B}$."},{"arxiv":"2611.24537","id":"","title":"Active Learning and Genetic Search for Discrete Abelian Flavor Model Building","authors":"Selin Aşmanoğlu, Christopher D. Carone","score":6.1,"section":"new","rank":28,"parts":[0.0,0.14,0.13,0.0,0.0],"note":"Closest of your papers: [[1394206]] (coupling 0.05, 2 shared references). Closest network paper: [[820731]] (coupling 0.05, 2 shared references).","abstract":"The sequential breaking of discrete flavor symmetries provides a theoretical framework that can explain quark mass and mixing angle hierarchies. Each model is identified by its ry processes across the FCC-ee operating stages and show that the exceptional luminosity and clean environment of future $e^+e^-$ colliders allow for substantial improvements over current limits from LEP and the LHC. The $e^+e^- \\to τ^+τ^-$ process provides excellent sensitivity to weak dipole operators through resonant $Z$ production and $Z$-pole energy scans, while $γγ\\to τ^+τ^-$ yields the strongest constraint on the anomalous magnetic moment owing to the dominance of linear interference effects in the near-threshold region. Higher-energy stages improve the sensitivity to the $τ$ electric dipole moment. The radiative processes $e^+e^- \\to τ^+τ^-γ$ and $H\\toτ^+τ^-γ$ provide complementary, though subleading, probes of $τ$ dipole operators. Combining all channels, we estimate the statistical reach at the 95% CL to be $|Δa_τ|<2.8\\times10^{-5}$, $|d_τ|<2.5\\times10^{-18}\\,e\\,{\\rm cm}$, $|Δa_τ^Z|<1.0\\times10^{-5}$, and $|d_τ^Z|<4.4\\times10^{-19}\\,e\\,{\\rm cm}$, improving upon the current bounds by several orders of magnitude. These projections quantify the potential statistical reach of the FCC-ee program, motivating dedicated studies incorporating detector effects, systematic uncertainties, and higher-order theoretical predictions."},{"arxiv":"2611.23373","id":"3230753","title":"Why supersonic UAP events are not accompanied by acoustic booms?","authors":"Ariel Zhitnitsky","score":5.5,"section":"new","rank":30,"parts":[0.0,0.03,0.12,0.0,0.29],"note":"Closest of your papers: [[2787890]] (coupling 0.01, 1 shared references). Closest network paper: [[1998852]] (coupling 0.04, 3 shared references). Shared topics: dark matter model, dark matter.","abstract":"The Unidentified Anomalous Phenomena (UAP) events have been recorded for decades. However, the nature of these events remains unknown. We advocate an idea that the dark matter (DM) in form of the axion quark nuggets (AQN) made of standard model quarks (or {\\it antiquarks}) and gluons could {\\it simultaneously} explain many observed puzzling features which always accompany the UAP events, such as high velocity, enormous acceleration, absence of any remaining materials in affected area, etc. This long list of mysterious features also includes the absence of any sound which normally accompanies any supersonic motion. The AQN framework answers this last puzzle as well, which represents the title of the present work. The AQN dark matter model was invented long ago without any intension to apply the model to UAP events. Rather, it was invented with a single motivation to explain the observed similarity $Ω_{\\rm DM}\\sim Ω_{\\rm visible}$ between visible and DM components, which represents a very generic feature of this framework, not sensitive to any parameters of the construction. In this work we use the same framework with the same set of parameters to study the observed UAP events. Essentially we argue that a specific class of UAP represents the close cousin of other mysteries known for decades (even centuries), such as sky-quakes, Ball Lightnings, and Mysterious Transient events. In other words, the UAPs represent different manifestations of exactly the same objects, the AQNs propagating in atmosphere. The fuel powering all these mysterious energetic events is one and the same: it is the antiquark core of the AQNs. We also present some suggestions on type of instruments required to study this specific (and well defined) type of the UAP events."},{"arxiv":"2604.19864","id":"3148047","title":"Low-Multiplicity Jets as Probes of GeV-Scale Light-Quark-Coupled Particles","authors":"Carlos Henrique de Lima, David McKeen, Maximilian Swiatlowski","score":5.2,"section":"replacement","rank":31,"parts":[0.06,0.05,0.11,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1455793]] (coupling 0.02, 3 shared references). Closest network paper: [[2621240]] (coupling 0.04, 5 shared references).","abstract":"We propose a search at the LHC for GeV-scale particles coupling predominantly to light quarks based on low-multiplicity jets. The search targets production in association with a hard photon and uses the feature that a light gauge-singlet can only decay into a small number of hadronic channels, yielding jets with anomalously low charged-track multiplicity and mass compared to QCD jets at the same transverse momentum. We determine the sensitivity to scalar and pseudoscalar couplings to up-quarks, and suggest a data-driven estimate that reduces the sensitivity to jet modeling uncertainties. This search extends the reach to hadronically-coupled particles into a previously inaccessible regime."},{"arxiv":"2611.23897","id":"3230845","title":"Projected Sensitivity of a Differential Torsion Sensor for Tests of the Weak Equivalence Principle","authors":"Jiayi Qin, Sheon S. Y. Chua, Ling Sun, Bram J. J. Slagmolen","score":4.9,"section":"cross","rank":32,"parts":[0.0,0.03,0.14,0.0,0.2],"note":"Closest of your papers: [[2663002]] (coupling 0.01, 1 shared references). Closest network paper: [[2051205]] (coupling 0.05, 3 shared references). Shared topics: yukawa interaction.","abstract":"Tests of the weak equivalence principle (WEP) are among the most sensitive probes of new long-range, composition-dependent interactions beyond general relativity and the Standard Model. We evaluate the potential of a differential torsion sensor, which combines long mechanical coherence times with optical-cavity readout and common-mode rejection, for laboratory WEP tests and fifth-force searches. For a representative configuration based on an existing prototype, with Be-Ti test masses and 180 days of coherent integration, the projected noise-limited sensitivity to the Eötvös parameter is $η\\simeq7.5\\times10^{-16}$ and $2.4\\times10^{-16}$ for signal modulation at 2 and 20 mHz, respectively, below current ground-based torsion-balance limits. For a baryon-coupled Yukawa interaction sourced by the Earth, the corresponding projected sensitivity to the coupling strength is $α\\simeq3.1\\times10^{-13}$ and $9.8\\times10^{-14}$ for ranges $λ\\gtrsim10^{7}$ m. We identify the modulation scheme, the material contrast, and the source geometry as the main factors that set the projected reach, and the control of systematic couplings as the main experimental requirement for attaining it. These results indicate that differential torsion sensors are a promising platform for future laboratory WEP tests."},{"arxiv":"2606.15680","id":"3168706","title":"Assessing the enrichment of heat-producing elements in deep-mantle structures using a directional geoneutrino detector","authors":"Zhihao Xu, Misaki Hosoya, William F. McDonough, Taichi Sakai, Hiroko Watanabe","score":4.8,"section":"replacement","rank":33,"parts":[0.06,0.05,0.08,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2751074]] (coupling 0.02, 1 shared references). Closest network paper: [[1822456]] (coupling 0.03, 2 shared references).","abstract":"Determining the spatial distribution of heat-producing elements (HPEs) within the Earth is critical for understanding the planet's thermal and chemical evolution. A central debate is whether domains in the deep mantle, particularly the Large Low-Velocity Provinces (LLVP), represent anomalous, radiogenically enriched reservoirs. Variation in the surface flux of geoneutrinos provide a direct probe of Earth's internal radioactivity. However, current continental located detectors measure only the angle-integrated flux, leading to strong spatial trade-offs that substantially limit the ability of practical networks to uniquely resolve mantle compositional heterogeneity. In this study, we quantify the potential of directional geoneutrino detection to overcome this limitation. By evaluating realistic LLVP geometries in the context of the proposed Ocean Bottom Detector (OBD), we demonstrate that resolving the incoming direction of geoneutrinos can substantially improve the ro Da Rold, Manuel Epele, Anibal D. Medina, Nicolás I. Mileo, Alejandro Szynkman","score":4.4,"section":"replacement","rank":35,"parts":[0.0,0.07,0.15,0.0,0.0],"note":"Closest of your papers: [[3094526]] (coupling 0.02, 5 shared references). Closest network paper: [[3206672]] (coupling 0.05, 6 shared references).","abstract":"We investigate di-Higgs production in the $b\\bar{b}γγ$ final state at the LHC, focusing on scenarios where the gluon fusion process is enhanced by new colored scalars, which could be identified as squarks or leptoquarks. We consider two benchmarks characterized by the mass of the lightest colored scalar, BM$_{\\mathrm{L}}$ and BM$_{\\mathrm{H}}$, corresponding to 464 GeV and 621 GeV, respectively. Using Monte Carlo simulations for both the signal and the dominant backgrounds, we perform a discovery analysis with deep neural networks, exploring various architectures and input variables. Our results show that the discrimination power is maximized by employing two dedicated classifiers, one trained against QCD backgrounds and another against backgrounds involving single-Higgs processes. Furthermore, we demonstrate that including high-level features -- such as the invariant masses $m_{γγ}$, $m_{bb}$, and $m_{hh}$, as well as the transverse momenta and angular separations of the photon and $b$-jet pairs -- significantly improves the performance compared to using only low-level features as the invariant mass and momenta of the final particles. For the latter case, we find that architectures processing photon and $b$-jet variables separately can enhance the significance for BM$_{\\mathrm{H}}$. Projecting for an integrated luminosity of 3 ab$^{-1}$, we obtain a significance of 7.2 for BM$_{\\mathrm{L}}$, while it drops to 3.1 for BM$_{\\mathrm{H}}$. In the particular case of BM$_{\\mathrm{L}}$, discovery level significance can be reached at 1.4 ab$^{-1}$. We also estimate how these results could be modified by potential systematic uncertainties."},{"arxiv":"2611.23978","id":"","title":"Geoneutrinos (and reactor neutrinos) do not visibly decay","authors":"Mauricio Bustamante","score":4.2,"section":"new","rank":36,"parts":[0.06,0.03,0.08,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2751074]] (coupling 0.01, 1 shared references). Closest network paper: [[3225492]] (coupling 0.03, 3 shared references).","abstract":"Neutrinos that decay on their way to a detector arrive depleted, more so at low energies, where time dilation lengthens their lifetime the least. Geoneutrinos---electron antineutrinos from the radioactive decay of uranium and thorium inside the Earth---have energies of a few MeV and travel up to the diameter of the Earth. We use them to test neutrino decay for the first time. We compute the geoneutrino signal at Borexino, KamLAND, SNO+, and JUNO for visible decay, in which the daughter neutrinos are themselves detected, and compare it against their published data. We find no evidence of decay that holds across Earth models. Combining the four experiments, we limit the decay $ν_1 \\to ν_3$ in the inverted mass ordering at 90% C.L.: $τ_1/m_1 > 3.7 \\times 10^{-9}$ s eV$^{-1}$ when the radiogenic power of the Earth is left free and $τ_1/m_1 > 4.4 \\times 10^{-9}$ to $1.6 \\times 10^{-8}$ s eV$^{-1}$ when it is taken from Earth models. With an Earth model assumed, the geoneutrinos set the limit; with the power free, the antineutrinos from nuclear reactors that the same experiments detect count as much as the geoneutrinos. These are the first terrestrial limits on the visible decay of $ν_1$."},{"arxiv":"2606.08329","id":"3166318","title":"Lepton $g-2$ non-universality of hadronic contributions and a sub-GeV window to New Physics","authors":"Siyuan Li, Vladimir Pascalutsa, Maxim Pospelov","score":4.2,"section":"replacement","rank":37,"parts":[0.0,0.05,0.18,0.0,0.0],"note":"Closest of your papers: [[2690106]] (coupling 0.02, 2 shared references). Closest network paper: [[2059568]] (coupling 0.06, 7 shared references).","abstract":"We propose the linear combination of the anomalous magnetic moments of the muon and electron, $a_{μ-e} \\equiv a_μ- (m_μ/m_e)^2 a_e$, as a natural low-energy window quantity that may directly probe the current discrepancy between the data-driven and lattice-QCD evaluations of hadronic contributions. The rescaling ensures an exact cancellation of the leading short-range ($m_\\ell^2$-scaling) effects, thereby improving the UV behavior. Because entire classes of contributions cancel identically --- not merely in variance --- the combination is predictable in chiral perturbation theory with no free low-energy constant, and it isolates flavor-non-universal New Physics. The hadronic-vacuum-polarization effect in $a^{\\rm HVP}_{μ-e}$, together with its uncertainty, is reduced as compared to $a^{\\rm HVP}_μ$ by $\\sim 85\\%$. This is promising for tests of New Physics with some degree of flavor non-universality, conditional on significant improvements in the measurements of $a_e$ and $α$."},{"arxiv":"2611.24658","id":"","title":"Light fermions can trigger a Brout-Englert-Higgs effect","authors":"Axel Maas, Sofie Martins, Georg Wieland","score":4.1,"section":"cross","rank":38,"parts":[0.0,0.04,0.07,0.0,0.19],"note":"Closest of your papers: [[2787890]] (coupling 0.01, 1 shared references). Closest network paper: [[1455732]] (coupling 0.03, 1 shared references). Shared topics: standard model particle.","abstract":"The Brout-Englert-Higgs effect produces the masses of the Standard Model particles. However, the cause of this effect is unknown. Beyond-the-Standard-Model theories aim to find the source of this effect, for example using a composite Higgs and dynamically generating its vacuum expectation value. In this paper, we show evidence from lattice simulations with vectorially coupled fermions and without Yukawa couplings that the Brout-Englert-Higgs effect could be triggered by the light masses of fermions. This suggests that an explanation entirely within the Standard Model could be possible. Moreover, our results are consistent with weak couplings and fermions can only impact the Higgs potential at NNLO. This implies a so far unidentified mechanism in an SU(2) scalar-fermion-gauge system that produces a non-zero vacuum expectation value. In addition, we find that the transition from a QCD-like behavior to a Higgs-like behavior happens when the fermion mass falls below twice the W/Z mass: a threshold that is integer valued but not connected to other critical physical behavior."}],"rest":[{"arxiv":"2611.23983","title":"Positron escape from dark matter spikes in black hole X-ray binaries","score":4.0,"section":"cross","rank":39},{"arxiv":"2611.23869","title":"Coupled-channel pole structure and bare-state mixing of bottom-strange heavy-quark spin partners","score":3.9,"section":"new","rank":40},{"arxiv":"2509.14701","title":"Enhancement of Weak Interactions in Phase Transitions in Condensed Matter and Early Universe","score":3.9,"section":"replacement","rank":41},{"arxiv":"2611.24372","title":"No room for $X(2370)$ exceptionalism: the glueball interpretation warrants caution","score":3.8,"section":"new","rank":42},{"arxiv":"2604.21755","title":"Quantum-information diagnostics of cosmological perturbations with nontrivial sound speed in inflation","score":3.8,"section":"replacement","rank":43},{"arxiv":"2603.16266","title":"Lattice QCD study of the $K^*(892)$ resonance at the physical point","score":3.6,"section":"replacement","rank":44},{"arxiv":"2611.24435","title":"Total Angular Momentum Assignments in the Hadron Spectrum","score":2.9,"section":"new","rank":45},{"arxiv":"2611.23924","title":"Precision Measurements of the Effective Leptonic Weak Mixing Angle at Hadron Colliders","score":2.5,"section":"cross","rank":46},{"arxiv":"2611.23884","title":"Long-lived linear slow roll near critical and spinodal points in soft-wall AdS/QCD","score":2.2,"section":"new","rank":4 function toc(){const t=document.getElementById('toc');if(!NEWS.length)return;t.hidden=false;
  const X=RAW.next||[];
  t.innerHTML=`<h3>In this listing</h3><ol>${NEWS.map(n=>`<li><a href="#p${n.i}"><span class="sc${n.role==='repl'?' repl':''}">${n.score.toFixed(0)}</span><span class="tt">${esc(n.title)}</span></a></li>`).join('')}${X.length?`<li class="more-link"><a href="#more"><span class="sc">+${X.length}</span><span class="tt">The next ${X.length} papers by score (folded)</span></a></li>`:''}</ol>`;
  const m=t.querySelector('.more-link a');if(m)m.addEventListener('click',()=>{document.getElementById('more').open=true});tex(t)}
let sel=NEWS[0]||null, hover=null, query='', G;
const svg=d3.select('#svg'), tip=document.getElementById('tip');
function draw(){
  if(!NEWS.length)return;
  const RNG=d3.randomLcg(11);
  const W=Math.max(300,document.getElementById('chart').clientWidth), H=W<600?500:480, m={l:16,r:16,t:20,b:34};
  svg.attr('viewBox',`0 0 ${W} ${H}`); svg.selectAll('*').remove();
  const yrs=d3.extent(N,n=>n.year);
  const x=d3.scaleLinear().domain([yrs[0]-.5,yrs[1]+1.2]).range([m.l+8,W-m.r-8]);
  const ticks=x.ticks(W<600?6:12).filter(t=>Number.isInteger(t)&&t<=yrs[1]);
  svg.append('g').attr('class','grid').selectAll('line').data(ticks).join('line').attr('x1',d=>x(d)).attr('x2',d=>x(d)).attr('y1',m.t).attr('y2',H-m.b);
  svg.append('g').attr('class','axis').attr('transform',`translate(0,${H-m.b})`).call(d3.axisBottom(x).tickValues(ticks).tickFormat(d3.format('d')).tickSizeOuter(0));
  const cy=(m.t+H-m.b)/2, xf=n=>isNew(n)?x(yrs[1]+.75):x(n.year);
  const sim=N.map(n=>({n,x:xf(n)+(RNG()-.5)*4,y:cy+(RNG()-.5)*H*.5}));
  const links=E.map(e=>({source:sim[e.s],target:sim[e.t],s:e.s,t:e.t,k:e.k}));
  d3.forceSimulation(sim).force('x',d3.forceX(s=>xf(s.n)).strength(1)).force('y',d3.forceY(cy).strength(.04))
    .force('link',d3.forceLink(links).strength(.03)).force('charge',d3.forceManyBody().strength(-40))
    .force('col',d3.forceCollide(s=>r(s.n)+2)).stop().tick(320);
  sim.forEach(s=>{s.y=Math.max(m.t+8,Math.min(H-m.b-8,s.y));s.x=Math.max(m.l+4,Math.min(W-m.r-4,s.x))});
  G=svg.append('g');
  G.append('g').selectAll('path').data(links).join('path').attr('class',l=>'edge '+l.k)
    .attr('d',l=>{const a=l.source,b=l.target;return `M${a.x},${a.y}Q${(a.x+b.x)/2},${(a.y+b.y)/2-Math.abs(a.x-b.x)*.12} ${b.x},${b.y}`});
  G.append('g').selectAll('circle').data([...sim].sort((a,b)=>RANK[b.n.role]-RANK[a.n.role])).join('circle')
    .attr('class','node').attr('cx',s=>s.x).attr('cy',s=>s.y).attr('r',s=>r(s.n)).attr('fill',s=>col(s.n))
    .on('pointerenter',(ev,s)=>{hover=s.n;showTip(ev,s.n);paint()}).on('pointermove',(ev,s)=>showTip(ev,s.n))
    .on('pointerleave',()=>{hover=null;tip.hidden=true;paint()}).on('click',(ev,s)=>pick(s.n,false));
  const lab=sim.filter(s=>isNew(s.n)||s.n.role==='seed'||s.n.deg>=3);
  const L=lab.map(s=>{const right=s.x>W*.8,t=isNew(s.n)?`#${s.n.rank} ${s.n.first}`:`${s.n.first} ${s.n.year}`,w=t.length*6.2;return{s,t,right,x0:right?s.x-r(s.n)-4-w:s.x+r(s.n)+4,w,y:s.y+4}}).sort((a,b)=>a.y-b.y);
  const placed=[];L.forEach(l=>{let k=0;while(k<40&&placed.some(p=>l.x0<p.x0+p.w&&p.x0<l.x0+l.w&&Math.abs(l.y-p.y)<13)){l.y+=13*(k%2?-1:1)*(1+Math.floor(k/2));k++;l.y=Math.max(m.t+10,Math.min(H-m.b-4,l.y))}placed.push(l)});
  G.append('g').selectAll('text').data(L).join('text').attr('class','nlabel').attr('x',l=>l.right?l.s.x-r(l.s.n)-4:l.s.x+r(l.s.n)+4).attr('y',l=>l.y)
    .attr('text-anchor',l=>l.right?'end':'start').text(l=>l.t);
  paint();
}
function showTip(ev,n){const b=document.getElementById('chart').getBoundingClientRect();tip.hidden=false;tip.textContent=`${auth(n)} (${n.year}) — ${plain(n.title)}`+(isNew(n)?` · score ${n.score}`:'');
  let L=ev.clientX-b.left+12;if(L>b.width-290)L=ev.clientX-b.left-290;tip.style.left=Math.max(4,L)+'px';tip.style.top=(ev.clientY-b.top+12)+'px'}
function paint(){if(!G)return;const f=hover||sel,on=new Set();if(f){on.add(f.i);f.out.forEach(i=>on.add(i));f.inn.forEach(i=>on.add(i))}
  svg.classed('dim',!!f);
  G.selectAll('path.edge').attr('class',l=>'edge '+l.k+(!f?'':l.s===f.i?' hot out':l.t===f.i?' hot in':''));G.selectAll('path.edge.hot').raise();
  G.selectAll('circle').classed('on',s=>on.has(s.n.i)).classed('sel',s=>sel&&s.n.i===sel.i).classed('match',s=>query&&`${s.n.first} ${s.n.title} ${s.n.arxiv} ${s.n.authors||''}`.toLowerCase().includes(query));
  G.selectAll('text.nlabel').classed('on',l=>on.has(l.s.n.i))}
function panel(){const p=document.getElementById('panel'),n=sel;
  if(!n){p.innerHTML='<p>Select a paper in the network.</p>';return}
  const links=`<div class="links">${n.id?`<a href="https://inspirehep.net/literature/${n.id}" target="_blank" rel="noopener">INSPIRE</a>`:''}${n.arxiv?`<a href="https://arxiv.org/abs/${esc(n.arxiv)}" target="_blank" rel="noopener">arXiv</a>`:''}</div>`;
  if(isNew(n)) p.innerHTML=`<div class="role" style="color:${col(n)}">#${n.rank} · ${esc(SEC[n.section])} · score ${n.score.toFixed(1)}</div><h4>${esc(n.title)}</h4>
   <div class="meta">${esc(auth(n))} · arXiv:${esc(n.arxiv)}</div><p>${why(n.note)}</p><div class="links"><a href="#p${n.i}">Back to abstract</a></div>`;
  else p.innerHTML=`<div class="role" style="color:${col(n)}">${esc(ROLE[n.role])}</div><h4>${esc(n.title)}</h4>
   <div class="meta">${esc(auth(n))} · ${n.year}${n.arxiv?' · arXiv:'+esc(n.arxiv):''}</div>
   <div class="stats"><span>${n.cites.toLocaleString()} citations</span><span>${n.inn.filter(i=>isNew(N[i])).length} of the matches link here</span></div>${links}`;
  tex(p)}
function pick(n,scroll){sel=n;panel();paint();document.querySelectorAll('.paper').forEach(el=>el.classList.toggle('sel',el.id==='p'+n.i));if(scroll)document.getElementById('chart').scrollIntoView({behavior:'smooth',block:'nearest'})}
const present=new Set(N.map(n=>n.role));
document.getElementById('legend').innerHTML=['today','repl','seed','other'].filter(k=>present.has(k)).map(k=>`<span><i class="dot" style="background:var(--${k})"></i>${esc(ROLE[k])}</span>`).join('')+'<span style="color:var(--fg-3)">Listing papers: size ∝ score; others: size ∝ log(citations)</span>';
document.getElementById('q').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();paint()});
svg.on('click',ev=>{if(ev.target.tagName!=='circle'){sel=null;panel();paint()}});
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(draw,200)});
function nextList(){const X=RAW.next||[];if(!X.length)return;const box=document.getElementById('nextlist'),more=document.getElementById('more');
  more.hidden=false;more.querySelector('summary').firstChild.textContent=`The next ${X.length} papers by score `;
  const nmin=M.nextMin;
  document.getElementById('moresub').textContent=`below the threshold of ${M.threshold}${nmin!=null?`: every paper scoring ${nmin} or more, and at least ${M.nextCount} when available`:''}; not drawn in the network`;
  const cut=nmin!=null?X.findIndex(n=>n.score<nmin):-1;
  box.innerHTML=X.map((n,i)=>(i===cut?`<li class="divider">Below ${nmin}: weaker relation (most of these share no specific reference, coupling or topic with your work)</li>`:'')+`<li><div class="role" style="color:var(--${n.section==='replacement'?'repl':'today'})">#${n.rank} · ${esc(SEC[n.section])} · score ${n.score.toFixed(1)}</div>
    <div class="t">${esc(n.title)}</div><div class="authors">${authors(n.authors)} · arXiv:${esc(n.arxiv)}</div>
    ${n.note?`<p class="why">${why(n.note)}</p>`:''}
    <details class="abs"><summary>Abstract</summary><p class="abs">${esc(n.abstract)}</p></details>
    <div class="links">${n.id?`<a href="https://inspirehep.net/literature/${n.id}" target="_blank" rel="noopener">INSPIRE</a>`:''}<a href="https://arxiv.org/abs/${esc(n.arxiv)}" target="_blank" rel="noopener">arXiv</a><a href="https://arxiv.org/pdf/${esc(n.arxiv)}" target="_blank" rel="noopener">PDF</a></div></li>`).join('');
  more.addEventListener('toggle',()=>{if(more.open)tex(box)})}
const rtip=document.getElementById('reftip');let rcur=null;
function refShow(el){const r=REFS[el.dataset.ref];if(!r)return;rcur=el;rtip.textContent=`${auth(r)} (${r.year}) — ${plain(r.title)}`;rtip.hidden=false;
  const b=el.getBoundingClientRect(),t=rtip.getBoundingClientRect();let L=Math.min(Math.max(8,b.left),innerWidth-t.width-8),T=b.bottom+6;
  if(T+t.height>innerHeight-8)T=b.top-t.height-6;rtip.style.left=L+'px';rtip.style.top=T+'px'}
function refHide(){rtip.hidden=true;rcur=null}
document.addEventListener('pointerover',e=>{const el=e.target.closest('.ref');if(el&&e.pointerType==='mouse')refShow(el)});
document.addEventListener('pointerout',e=>{if(e.target.closest('.ref')&&e.pointerType==='mouse')refHide()});
document.addEventListener('click',e=>{const el=e.target.closest('.ref');if(el)refShow(el);else if(rcur)refHide()});
document.addEventListener('focusin',e=>{const el=e.target.closest('.ref');if(el)refShow(el)});
document.addEventListener('focusout',e=>{if(e.target.closest('.ref'))refHide()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')refHide()});
addEventListener('scroll',()=>{if(rcur)refHide()},{passive:true});
// the rest of the day's papers by score: only the title, linked to the arXiv record
function restList(){const X=RAW.rest||[];if(!X.length)return;const d=document.getElementById('rest'),box=document.getElementById('restlist');
  d.hidden=false;d.querySelector('summary').firstChild.textContent=`All other ${X.length} papers in this listing `;
  document.getElementById('restsub').textContent='by score, title only';
  box.innerHTML=X.map(n=>`<li><span class="sc">#${n.rank} · ${n.score.toFixed(1)}</span><a href="https://arxiv.org/abs/${esc(n.arxiv)}" target="_blank" rel="noopener">${esc(n.title)}</a></li>`).join('');
  d.addEventListener('toggle',()=>{if(d.open)tex(box)})}
list();nextList();restList();fold();draw();panel();
window.addEventListener('load',()=>{tex(document.getElementById('list'));tex(document.getElementById('panel'));fold();
  if(window.MathJax&&MathJax.startup&&MathJax.startup.promise)MathJax.startup.promise.then(()=>setTimeout(fold,300))});
addEventListener('resize',()=>{clearTimeout(window._ft);window._ft=setTimeout(fold,200)});
</script>
