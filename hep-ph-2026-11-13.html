ions, fuzzy dark matter (FDM) can form a stable equilibrium configuration, the so-called FDM soliton. The SP system can also determine the evolution of FDM solitons, such as head-on collision. In this paper, we first propose a new adimensional unit of length, time and mass. And then, we simulate the adimensional SP system with $\\mathtt{PyUltraLight}$ to study the GWs from collision of FDM solitons when the linearized theory is valid and the GW back reaction on the evolution of FDM solitons is ignored. Finally, we find that the GWs from collisions have a frequency of (few ten-years)$^{-1}$ or (few years)$^{-1}$ when FDM mass is $m=10^{-18}\\rm{eV}/c^2$ or $m=10^{-17}\\rm{eV}/c^2$. Therefore, future detection of such GWs will constrain the property of FDM particle and solitons."},{"arxiv":"2611.14584","id":"3227643","title":"A Positive Turn: Coupled Quintessence and Cosmological Neutrino Masses","authors":"Tian-Nuo Li, William Giarè, Guo-Hong Du, Eleonora Di Valentino, Luis A. Anchordoqui, Shao-Jiang Wang, Xin Zhang, Rong-Gen Cai","score":9.6,"section":"cross","rank":44,"parts":[0.0,0.01,0.34,0.0,0.41],"note":"Closest of your papers: [[3184726]] (coupling 0.00, 2 shared references). Closest network paper: [[3223723]] (coupling 0.12, 40 shared references). Shared topics: dark sector, neutrino mass, dark matter.","abstract":"In $Λ$CDM, the CMB and DESI BAO upper limits on the total neutrino mass are in tension with the lower bounds from oscillation experiments, and analyses allowing negative effective masses favor negative values. We investigate whether a coupled quintessence (CQ) model in which dark matter interacts with a canonical scalar field $φ$ through an exponential mass coupling $m_{\\rm c}(φ)\\propto e^{-βφ/M_{\\rm Pl}}$ can alleviate this tension. Combining CMB, DESI, and supernova data, we find that CQ yields neutrino-mass constraints comparable to those obtained in CPL and consistent with oscillation experiments within $2σ$ for normal ordering, without requiring the scalar-field equation of state to cross the phantom divide. We further show that it alleviates the tension more effectively than alternative interacting dark energy models that instead favor more negative effective masses. This comparison shows that whether dark sector interactions can relax neutrino mass bounds ultimately depends on the interplay of their effects on primary CMB anisotropies, geometry, growth, and lensing."},{"arxiv":"2610.38188","id":"3220103","title":"Gravitational baryogenesis in Gauss-Bonnet braneworld cosmology","authors":"Ian B Whittingham","score":9.0,"section":"replacement","rank":45,"parts":[0.0,0.21,0.17,0.0,0.0],"note":"Closest of your papers: [[2860896]] (coupling 0.08, 5 shared references). Closest network paper: [[2894411]] (coupling 0.06, 4 shared references).","abstract":"The present study investigates the feasibility of gravitational baryogenesis in a Gauss-Bonnet (GB) modified Randall-Sundrum (RS) type II braneworld cosmology. The modified expansion rate of the Universe in this scenario evolves through three distinct expansion regimes, the GB regime at early times where the expansion rate $H \\sim ρ^{1/3}$ falls more slowly than the standard expansion law $H\\sim ρ^{1/2}$ of GR, then the RS type era with an enhanced expansion $H \\sim ρ$, before finally reducing to the standard expansion law in the low energy limit. Gravitational baryogenesis depends on $\\dot{R}$ and requires $\\dot{R} <0$. This condition is satisfied for the GB and GR regimes. However, $\\dot{R}>0$ for the RS regime and successful baryogenesis requires either that the decoupling temperature occurs during the GB regime or that the Universe makes a direct transition from the GB regime to the GR regime. The GB baryon asymmetry $η(T)$ is proportional to $μ(1+w)(1-w)(1+1/β)$, where $μ$ is the energy scale $μ\\equiv 1/l$ associated with the bulk curvature scale $l$, $β\\equiv 4 αμ^{2}$, where $α$ is the GB coupling, and $w$ is the equation of state parameter $p=w ρ$. Studies of inflation in GB-braneworld cosmology place constraints on the allowed ranges of the parameters $μ$ and $β$. Guided by these, the asymmetry has been calculated for ranges of $(μ, β, w)$ and it is found that the observed values can be obtained for a value of $β$ within the range $(10^{-2} - 10^{-3})$ for $μ=10^{12}$ GeV, and within the range $(10^{-1}- 10^{-2})$ for $μ=10^{13}$ GeV. All values of $η$ for $μ=10^{14}$ are too high. The parameter ranges for the decoupling temperatures required to produce the observed asymmetry have also been established."},{"arxiv":"2611.14642","id":"3227678","title":"Earth-sized tests of long-range neutrino interactions","authors":"Dyer F. Cardenas, Mauricio Bustamante","score":8.8,"section":"new","rank":46,"parts":[0.0,0.23,0.14,0.0,0.0],"note":"Closest of your papers: [[3130296]] (coupling 0.08, 10 shared references). Closest network paper: [[2796272]] (coupling 0.05, 5 shared references).","abstract":"Neutrinos may experience a new long-range force that distinguishes their flavors, mediated by an ultralight neutral boson of a new $U(1)'$ gauge symmetry and sourced by the electrons and nucleons of ordinary matter. Atmospheric neutrinos that cross the Earth would then feel a flavor-dependent potential that alters their oscillations. When the range of the force is about one Earth radius or less, this potential varies from point to point along each neutrino's path, since it comes mostly from the matter near the neutrino. Earlier limits approximated it, either as constant along the path or as following the local density of matter. We compute it exactly at every point of each path, for the Earth model of the IceCube analysis and over the distribution of heights at which the neutrinos are produced, and use it to analyze the 8-yr public IceCube DeepCore sample with the systematic uncertainties of that analysis. For mediator masses from $10^{-15}$ to $10^{-9}$ eV, where the Earth alone sources the potential, we set upper limits at 90% confidence level on the coupling of eight of 14 $U(1)'$ symmetries, those whose potential differs between $ν_μ$ and $ν_τ$. A potential held at its value at the detector would weaken our limits by factors of about 1-3. Below about $10^{-11}$-$10^{-10}$ eV, depending on the symmetry, our limits are stronger than those from tests of the equivalence principle."},{"arxiv":"2606.16296","id":"3168750","title":"Ultraviolet Structure of the Gravitational-Wave Response in a Time-Dependent Scalar Medium","authors":"Han Lai, Atsuhisa Ota","score":8.8,"section":"replacement","rank":47,"parts":[0.0,0.12,0.28,0.0,0.1],"note":"Closest of your papers: [[2627241]] (coupling 0.04, 3 shared references). Closest network paper: [[2033551]] (coupling 0.10, 7 shared references). Shared topics: gravitational wave.","abstract":"We study the real-time linear response of gravitational waves in an FLRW background with a scalar field of general time-dependent effective mass. In the Schwinger-Keldysh formalism, we develop an adiabatic regularization scheme for unequal-time correlation functions and use it to extract the ultraviolet structure of the one-loop response. The leading divergence reproduces the familiar $\\Box ^2h_{ij}$ structure, whereas the time-dependent background induces additional local divergences proportional to $\\Box h_{ij}$, $\\partial_τh_{ij}$, and $h_{ij}$. These are renormalized by local counterterms associated with the Weyl-squared term, a time-dependent Ricci-scalar term, a time-dependent cosmological constant, and the Ricci-scalar-squared term $R^2$. The same counterterms also remove the ultraviolet divergences of the background tadpole stress tensor and agree with the known covariant counterterm results. In a flat-background Mathieu oscillator example, replacing the adiabatic vacuum by the instantaneous vacuum leaves these counterterms unchanged but introduces an initial-surface divergence, which is absorbed into the initial data rather than the bulk counterterms."},{"arxiv":"2611.14641","id":"3227671","title":"A Grover-Accelerated Search for Dark Matter","authors":"Zachary Bogorad, Roni Harnik","score":8.2,"section":"new","rank":48,"parts":[0.06,0.09,0.15,0.0,0.13],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1709434]] (coupling 0.03, 4 shared references). Closest network paper: [[2969908]] (coupling 0.05, 6 shared references). Shared topics: dark matter.","abstract":"We show that Grover's algorithm can be used to parametrically accelerate wave-like dark matter searches. Despite having a finite coherence time $τ$, wavelike dark matter can imprint a coherent $O(1)$ phase onto a sensor through a dispersive coupling over an integration time which significantly exceeds $τ$. As such, we show that dark matter can be used as a repeatable quantum phase gate in a quantum device. If the sensor is prepared in a superposition of frequencies, we show that this phase can be transferred to a qubit register and digitized. The qubits are thus available for quantum computational processing in which dark matter can take part as a coherent gate. We show that Grover's algorithm can be used to speed up a search for dark matter in $N_{\\rm bins}$ frequency bins by a factor of $\\sqrt{N_{\\rm bins}}$. Although the technological challenges to implementing such a search remain substantial, this demonstrates that there is no fundamental obstruction to accelerating wave-like dark matter searches with quantum computational techniques over many coherence times."},{"arxiv":"2606.24005","id":"3171632","title":"Non-Standard Interactions and Light Z' Bosons from CEvNS Data at CONUS+","authors":"Ch. M. Benavides, C. S. Muñoz, B. C. Canas, Eduardo Rojas","score":8.2,"section":"replacement","rank":49,"parts":[0.06,0.07,0.27,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[3130296]] (coupling 0.02, 2 shared references). Closest network paper: [[3095306]] (coupling 0.10, 6 shared references).","abstract":"We analyze the first Conus+ reactor-antineutrino spectrum to constrain nonstandard neutrino interactions (NSI) with quarks and light vector $Z'$ mediators in $E_6$ and leptophilic $U(1)_{L_a-L_b}$ models. The prediction includes coherent elastic antineutrino--nucleus scattering (CEvNS) and elastic antineutrino--electron scattering (EvES), with Standard Model (SM)--mediator interference in each channel and an analytically profiled normalization uncertainty. We formulate $L_e-L_μ$ and $L_e-L_τ$ in a common charge convention, combining direct electron scattering with the nuclear interaction induced by photon-- $Z'$ mixing. The data remain compatible with the SM. Electronic scattering has little effect on the quark-NSI and fixed-coupling $E_6$ angular regions, but substantially strengthens the low-mass coupling limits of the $E_6$ benchmarks. The leptophilic models share a common low-mass plateau dominated by electronic scattering, while their limits separate at larger mediator masses through their different nuclear loop contributions."},{"arxiv":"2604.06937","id":"3141818","title":"Squeezed double-$b$ tagging for light hadronic resonances at the LHC","authors":"Dilip Kumar Ghosh, Biswarup Mukhopadhyaya, Sirshendu Samanta, Ritesh K. Singh","score":8.0,"section":"replacement","rank":50,"parts":[0.0,0.11,0.32,0.0,0.0],"note":"Closest of your papers: [[1455793]] (coupling 0.04, 3 shared references). Closest network paper: [[2621240]] (coupling 0.11, 6 shared references).","abstract":"A boosted light resonance decaying into $b\\bar b$ can produce a single jet containing two bottom-hadron decay systems. We investigate this squeezed double-$b$ topology using a tracking-based boosted decision tree that distinguishes non-bottom, single-bottom and double-bottom jets. The classifier combines displaced-track multiplicities and momentum fractions with ordered impact parameters and jet kinematics. For the simulated jet samples, the double-bottom tagging response is approximately $83\\%$, with corresponding single-bottom and non-bottom mistag responses of $9.7\\%$ and $0.5\\%$; charm contamination is assessed separately. The tagger is combined with soft-drop mass reconstruction and an event-level classifier using the candidate and recoil jets to identify light hadronic resonances within the QCD background. As an illustrative example, we consider a singlet extension of the flipped two-Higgs-doublet model with pseudoscalar masses of 30, 50 and 60 GeV. The signal samples use a simplified effective-vertex approximation, replacing the momentum-dependent quark-loop production interaction by a local vertex. A resolved loop calculation and higher-order production corrections are beyond the scope of this tagging study. The resulting reconstruction strategy can be applied to different signal hypotheses with their corresponding kinematic acceptance and tagging response."},{"arxiv":"2611.15274","id":"3227729","title":"Benchmarking Machine-Learning Top Taggers from JetClass to a Full-Simulation $Z'\\to t\\bar{t}$ Search: Transfer, Extrapolation, Sensitivity and Inference Cost","authors":"Manisha Kumari, Amal Sarkar","score":7.8,"section":"cross","rank":51,"parts":[0.0,0.09,0.34,0.0,0.0],"note":"Closest of your papers: [[1455793]] (coupling 0.03, 4 shared references). Closest network paper: [[2621240]] (coupling 0.12, 9 shared references).","abstract":"Searches for heavy resonances decaying to \\(t\\bar{t}\\) test physics beyond the Standard Model at the TeV scale, and their reach depends on how well boosted top jets are identified. Machine-learning top taggers are usually compared on fast-simulation samples without pileup and in a narrow jet-\\(p_T\\) window, so a benchmark ranking does not directly show how much each tagger adds to a real search. This study trains seven taggers under identical conditions on JetClass. They are a boosted decision tree, two image-based networks, ParticleNet, and three particle transformers (ParT, UParT, and GloParT). The taggers are then applied without retraining to a \\(Z'\\to t\\bar{t}\\) search with \\(m_{Z'}\\) between 1.2 and 2.5~TeV, using 2016 CMS Open Data simulated with Geant4 and realistic pileup. The overall benchmark order of the taggers is preserved. However, taggers with similar area under the ROC curve (AUC) differ by up to a factor of three in jet-level discovery significance. The particle transformers extend the mass reach of the search by \\(400~\\mathrm{GeV}\\), and their lead grows with resonance mass. This gain is seen in fully merged top jets and is associated with stable performance at jet \\(p_T\\) above the training range. Pileup has only a minor effect on all taggers. A small convolutional network achieves competitive discrimination at a much lower computational cost. The gaps between tagger groups hold under retraining and within statistical uncertainties. The results show that a tagger must be chosen on its kinematic coverage, the working point of the analysis, its discovery sensitivity and its cost, and not on its benchmark score alone."},{"arxiv":"2611.14613","id":"3227646","title":"The NANOGrav 15-year data set: A Limit on Continuous Spin Gravitons","authors":"Chinmay Ambasht, Olivia Bitcon, Tanner Trickle, the NANOGrav Collaboration","score":7.1,"section":"new","rank":52,"parts":[0.0,0.09,0.22,0.0,0.1],"note":"Closest of your papers: [[2787890]] (coupling 0.03, 5 shared references). Closest network paper: [[2854117]] (coupling 0.08, 8 shared references). Shared topics: gravitational wave.","abstract":"Continuous spin particles (CSPs) are massless particles characterized by a dimensionful spin scale, $ρ$, which, when non-zero, changes their helicity under Lorentz boosts. Since CSPs reduce to ordinary particles when $ρ\\rightarrow 0$, the photon or graviton could be CSPs and only appear to behave as ordinary particles due to a small value of $ρ$. Therefore, it is important to determine what value of $ρ$ is experimentally allowed. Recent work has shown that the physical effects of CSPs scale as powers of $ρ/ω$ when $ρ\\ll ω$, where $ω$ is a frequency scale, making low-frequency probes particularly beneficial for highlighting these phenomena. In this paper we use pulsar timing arrays to set constraints on the spin scale of the continuous spin graviton. Pulsar timing arrays are uniquely suited for this application as they have exceptional sensitivity to low, nanohertz frequency gravitational waves, as demonstrated by their recent evidence for a stochastic gravitational wave background. Using standard Bayesian data analysis techniques, we find that the NANOGrav 15-year data set constrains the graviton spin scale to $ρ_\\text{g} < 1.23 \\times 10^{-23} \\, \\text{eV} $ at the 95% credible level."},{"arxiv":"2610.30773","id":"3218076","title":"A Chiral Nelson-Barr Relaxion","authors":"Cristien Arzate, Joshua Iascau","score":7.0,"section":"replacement","rank":53,"parts":[0.0,0.06,0.26,0.0,0.12],"note":"Closest of your papers: [[1365306]] (coupling 0.02, 2 shared references). Closest network paper: [[1863157]] (coupling 0.09, 7 shared references).","abstract":"We present the chiral Nelson-Barr relaxion model, an extension of the Nelson-Barr relaxion framework with a gauged chiral $\\mathrm{U}(1)$ symmetry. It includes vector-like quarks to cancel gauge anomalies and a scalar whose vacuum expectation value generates their masses. The chiral symmetry forbids the leading operators responsible for the Nelson-Barr and clockwork quality problems. Right-handed neutrinos generate light-neutrino masses through the type-I seesaw mechanism and permit thermal leptogenesis. For the particular Nelson-Barr sector Yukawa coupling considered, relaxion phenomenology gives a maximal scale of $CP$ violation $f_{\\textrm{max}}^{\\textrm{pheno}}\\sim 4 \\times 10^{11}\\ \\mathrm{GeV}$, about an order of magnitude greater than the corresponding phenomenological ceiling in the original model. The model can accommodate thermal leptogenesis if its right-handed-neutrino masses and reheating history satisfy the Davidson-Ibarra bound."},{"arxiv":"2606.15387","id":"3168747","title":"Mapping Domain-Wall Bayesian Reconstruction with LISA","authors":"Satyabrata Datta, Rome Samanta","score":6.8,"section":"replacement","rank":54,"parts":[0.0,0.1,0.25,0.0,0.0],"note":"Closest of your papers: [[2787890]] (coupling 0.04, 5 shared references). Closest network paper: [[2901490]] (coupling 0.09, 8 shared references).","abstract":"We study the Bayesian reconstruction of peaked domain-wall gravitational-wave signals with LISA and construct reconstruction maps over the signal-parameter plane. These maps identify regions where the signal can be probed with minimal posterior uncertainty and parameter degeneracy. Our analysis employs a two-parameter domain-wall spectral template and includes astrophysical foregrounds from Galactic double-white-dwarf binaries and extragalactic compact binaries, together with LISA instrumental noise. Bayesian inference is performed for 64 injections using nested sampling, and the resulting posterior quantities are interpolated with the Clough--Tocher method to generate smooth maps across parameter space. Under the adopted instrumental-noise and foreground assumptions, we find that LISA reconstructs domain-wall signals most effectively for annihilation temperatures $T_*\\sim10^3\\!-\\!10^6\\,\\mathrm{GeV}$. In this regime, posteriors become tighter and less degenerate, enabling reliable two-parameter reconstruction. The most favorable region corresponds to signals with ${\\rm SNR}\\gtrsim50$, while signals with ${\\rm SNR}\\sim10$ remain reconstructable near $T_*\\sim10^{5-6}\\,\\mathrm{GeV}$. This weaker-signal region corresponds approximately to $4\\times10^{-12}\\lesssimΩ_{\\rm GW}^{\\rm peak}h^2\\lesssim4\\times10^{-11}$ and $30\\,\\mathrm{mHz}\\lesssim f_p\\lesssim100\\,\\mathrm{mHz}$. Our results provide a quantitative reconstruction forecast for peaked domain-wall signals in the LISA band and a guide for particle-physics models predicting milli-Hz gravitational-wave spectra."},{"arxiv":"2611.15647","id":"","title":"Enhanced Early Structure from Axiodilatons & 21cm Observations","authors":"Chan Youn Weon, Carsten van de Bruck, C. P. Burgess, Jeong Han Kim, Adam Smith","score":6.6,"section":"cross","rank":55,"parts":[0.0,0.01,0.17,0.0,0.37],"note":"Closest of your papers: [[2856850]] (coupling 0.01, 2 shared references). Closest network paper: [[3223723]] (coupling 0.06, 19 shared references). Shared topics: turn out, dark sector.","abstract":"Axiodilatons provide a promising unified model of the Dark Sector whose properties are motivated by the use of accidental approximate symmetries to embed the light fields needed for observations into well-motivated UV physics in a technically natural way. These models turn out to help ameliorate many current puzzles in $Λ$CDM phenomenology (e.g. the Hubble tension and the evidence for evolving Dark Energy) `for free' despite not being designed for that purpose. We here explore in more detail another serendipitous feature of these models: their tendency to enhance early structure formation, in a way that seems suggestive given the accumulating evidence for structure arising earlier than expected in $Λ$CDM. Since early structure growth is the cleanest to study we explore in detail the expected 21cm signal produced by axiodilaton models, using the same parameter choices that improve agreement with observations elsewhere in cosmology. For fixed astrophysics, we forecast that SKA1-Low could distinguish dilaton couplings as small as a few times $10^{-2}$ from $Λ$CDM at $2σ$, mainly because of the earlier formation of structure. We provide complete derivations of the mass dependence of the relevant cosmological observables, including how dilaton-dependent baryon and electron masses affect the hyperfine transition, the Ly$α$ coupling, X-ray heating and ionization during cosmic dawn and the epoch of reionization. We provide details of radiative transfer, atomic physics and the equations governing the thermal and ionization state of the intergalactic medium."},{"arxiv":"2410.02266","id":"2836908","title":"Stellar evolution and axion-like particles: new constraints and hints from globular clusters in the GAIA DR3 data","authors":"S. V. Troitsky","score":6.4,"section":"replacement","rank":56,"parts":[0.06,0.06,0.17,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2751074]] (coupling 0.02, 1 shared references). Closest network paper: [[1758016]] (coupling 0.06, 3 shared references).","abstract":"Axion-like particles (ALPs) are hypothetical pseudoscalar bosons, natural in extensions of the Standard Model. Their interactions with ordinary matter and radiation are suppressed, making it challenging to detect them in laboratory experiments. However, these particles, produced within stellar interiors, can provide an additional mechanism for energy loss, potentially influencing stellar evolution. Prominent methods for searching for such effects involve measuring the properties of red giants and helium-burning stars in globular clusters (GCs). Here we use published catalogs of stars selected as members of seven GCs on the basis of parallaxes and proper motions measured by Gaia (Data Release 3). Making use of previously derived theoretical relations and the new data, we find the upper limit on the ALP-electron coupling, g_{ae}<1.3*10^{-13} (95% CL), and an indication (2.6 sigma) to nonzero ALP-photon coupling, g_{aγ}=(6.6+1.3-1.8)*10^{-11} GeV^{-1}. Given the precision of contemporary observational data, it is imperative to refine ALP constraints through more sophisticated analyses, which will be explored in detail elsewhere."},{"arxiv":"2606.07776","id":"3166355","title":"B Meson Semi-Invisible Decays via Perturbative QCD","authors":"Han-Bing Liu, Ye Xing, Bin Luo","score":6.3,"section":"replacement","rank":57,"parts":[0.0,0.05,0.11,0.0,0.3],"note":"Closest of your papers: [[3130296]] (coupling 0.02, 2 shared references). Closest network paper: [[2051136]] (coupling 0.04, 6 shared references). Shared topics: dark sector, dark matter.","abstract":"This paper focuses on the dark sector decay processes of $B$ mesons ($B\\to \\mathcal{B}_8\\ +$ invisible). Using the perturbative QCD (pQCD) approach, we calculate the upper bounds on the branching ratios for decays from $B$ mesons into light baryons and dark baryons within two distinct $B$-Mesogenesis scenarios. A detailed discussion of the form factor $B\\to \\mathcal{B}_8$ is presented. Based on the derived form factors and effective couplings, we then reach the final numerical analysis. The results show that these upper bounds can reach sizable, especially for $B^0\\to nψ$ in Type-I scenario, with values of orderis $\\mathcal{O}(10^{-5})$ . Such processes are expected to facilitate the search for dark matter at hadron colliders and B factories."},{"arxiv":"2611.15860","id":"","title":"Cosmological Signals from Finite-Lifetime Domain Wall Networks","authors":"Fengwei Yang, Kylar Greene, Aurora Ireland, Yuhsin Tsai","score":6.0,"section":"cross","rank":58,"parts":[0.0,0.09,0.2,0.0,0.01],"note":"Closest of your papers: [[2690106]] (coupling 0.03, 2 shared references). Closest network paper: [[2828434]] (coupling 0.07, 6 shared references).","abstract":"We study cosmological perturbations sourced by metastable domain wall (DW) networks. Using the unconnected segment model, we derive analytic expressions for the scalar and tensor power spectra in the long-wavelength regime, finding a fixed ratio between their amplitudes during the scaling regime. These spectra grow as the network evolves, driven by the increasing correlation length and slower redshifting of the wall energy density relative to radiation, and peak at a scale set by the network's collapse time. Comparing the scalar spectrum with observational constraints, we derive bounds on the DW energy density at collapse, which we apply to $\\mathbb{Z}_2$ and axion models. When these bounds are saturated, the resulting CMB $B$-mode signal can be comparable to or larger than the inflationary signal for a tensor-to-scalar ratio $r \\sim 0.03$, potentially bringing it within reach of future CMB polarization experiments."},{"arxiv":"2611.15893","id":"","title":"Chains of Vector-like Leptons at Colliders","authors":"Tao Han, Tong Arthur Wu","score":5.8,"section":"new","rank":59,"parts":[0.0,0.05,0.18,0.0,0.15],"note":"Closest of your papers: [[824906]] (coupling 0.02, 2 shared references). Closest network paper: [[2664140]] (coupling 0.06, 9 shared references). Shared topics: production mechanism.","abstract":"Vector-like leptons (VLLs) are predicted in the chain flavor models, which possess characteristic features to explain the mass hierarchy and mixing of the fermions in the Standard Model (SM). We investigate the production and decay of the VLL chains and quantify the discovery potential at the LHC, FCC-hh, and lepton colliders. The resonant mass sets the new physics scale responsible for the fermion mass generation. The observation of the VLL multiplets associated with each lepton flavor yields the chain structure. The mass difference among the VLL multiplets determines the hopping parameter that gives the power-law pattern for the observed SM fermion masses. The single VLL production via vector boson-lepton fusion directly measures the partial width, equivalently the new Yukawa coupling and the VLL mass hopping parameter. At hadron colliders, the leading production mechanism is pair production via their gauge interaction. We find that HL-LHC may have the sensitivity to reach the chain scale of $800-900\\,\\mathrm{GeV}$ and FCC-hh reaches $>2.5\\,\\mathrm{TeV}$. In $e^+e^-$ and $μ^+μ^-$ colliders, VLL pair production is a clear discovery channel once the threshold is reached. Single production via $Z$-lepton fusion becomes more accessible owing to a lower mass threshold and extends signal discovery to the collider kinematic limit."},{"arxiv":"2611.14629","id":"3227640","title":"Quantum Computing Enhanced Search for Wavelike Dark Matter","authors":"Yunjia Bao, Yu Cheng, Liang Jiang, Lian-Tao Wang","score":5.7,"section":"new","rank":60,"parts":[0.0,0.09,0.12,0.0,0.13],"note":"Closest of your papers: [[1597138]] (coupling 0.03, 4 shared references). Closest network paper: [[2747842]] (coupling 0.04, 8 shared references). Shared topics: dark matter.","abstract":"Identifying a weak, stochastic signal hidden within a broad frequency band is a central challenge in the search for wavelike dark matter. We explore quantum computing enhanced sensing based on the Grover search algorithm to address this problem and find that a long integration time stabilizes the accumulated sensing phase, reducing quantum signal processing (QSP) errors induced by dark matter fluctuations. We further propose alternating the signs of the QSP angles between oracle calls to suppress the coherent accumulation of the intrinsic QSP approximation errors during the search. Combining these strategies in a transmon-based benchmark, we obtain a projected sensitivity to axion dark matter beyond existing astrophysical limits. This opens access to substantial unexplored parameter space across the $10$-$100\\,μ\\mathrm{eV}$ mass range and offers an accelerated discovery channel for wavelike dark matter. With $10^6$ entangled sensing qubits, the projected sensitivity reaches the QCD axion band. Although illustrated with transmons, the protocol can be adapted to other experimental platforms for wavelike dark matter detection."},{"arxiv":"2602.04586","id":"3115457","title":"Fluctuation-Induced Backreaction on Bubble-Wall Dynamics in Cosmological First-Order Phase Transitions","authors":"Dongdong Wei, Zong-Kuan Guo","score":5.6,"section":"replacement","rank":61,"parts":[0.0,0.04,0.3,0.0,0.0],"note":"Closest of your papers: [[3094526]] (coupling 0.01, 1 shared references). Closest network paper: [[2957941]] (coupling 0.11, 8 shared references).","abstract":"We study bubble-wall dynamics in cosmological first-order phase transitions in a two-scalar-field model, where the wall is formed by the scalar field $φ$ and an additional real scalar field $s$ is coupled to it through a portal interaction. We evolve the coupled classical field equations on the lattice and consider a prescribed classical stochastic background of $s$ fluctuations at the onset of the phase transition. Through the portal interaction, this patchy background intermittently modulates the local driving pressure on the wall. The wall consequently undergoes alternating episodes of acceleration and deceleration, with a smaller finite-time averaged propagation rate than in the decoupled limit. A wall-frame analysis of the dynamical $s$-sector energy reveals a coupling-dependent crossover from excess energy deposited behind the wall at weak coupling to a front-side bias at strong coupling. These results demonstrate an additional scalar-field source of bubble-wall backreaction and may affect gravitational-wave and baryogenesis predictions."},{"arxiv":"2611.15873","id":"","title":"Scalar and pseudoscalar glueballonia: do they bind?","authors":"Narmin Nasibova, Francesco Giacosa","score":5.4,"section":"new","rank":62,"parts":[0.0,0.02,0.18,0.0,0.2],"note":"Closest of your papers: [[1832796]] (coupling 0.01, 1 shared references). Closest network paper: [[2750604]] (coupling 0.06, 3 shared references). Shared topics: yukawa interaction.","abstract":"We investigate the existence of molecular two-glueball bound states, so-called glueballonia, in pure Yang-Mills (YM) theory. We mainly concentrate on the scalar and pseudoscalar channels, thus studying scalar-scalar and scalar-pseudoscalar bound states, respectively. Near the onset of binding, when a bound state first appears just below threshold, a nonrelativistic framework is justified. We employ an attractive scalar-exchange Yukawa potential together with a smeared contact term contribution and determine the critical attraction required for binding. For two scalar glueballs, we use the scalar dilaton effective theory to determine the parameters of the non-relativistic potential: the Yukawa interaction is generated by t- and u-channels involving the exchange of one scalar glueball, while the repulsion emerges by the s-channel annihilation and contact interaction. Using lattice-YM input to fix the dilaton parameters, we find that the attraction is strong enough: the scalar glueballonium binds, and the result is quite robust with respect to parameter variations. In a minimal scalar-pseudoscalar extension, the Yukawa attraction is again given by the t-channel scalar glueball, while the crossed u-channel pseudoscalar exchange induces an attractive local contribution, making the pseudoscalar glueballonium also bind in pure gauge. Importantly, both the scalar and pseudoscalar glueballonia are stable in the YM vacuum. Next, we briefly comment on the pseudoscalar-pseudoscalar, scalar-tensor, and tensor-tensor channels: all these channels are attractive too and could form bound states, which, however, would be unstable in pure YM due to decay into two lighter glueballs. Finally, as a cross-check, our formalism confirms that Higgs-Higgs bound state does not form."}],"rest":[{"arxiv":"2611.15878","title":"Dark Matter Velocimetry with Quantum Networks","score":5.2,"section":"new","rank":63},{"arxiv":"2610.17033","title":"Cosmic Colliders in Binary Blazars Probing Ultra-High-Energy Particle Physics","score":5.1,"section":"replacement","rank":64},{"arxiv":"2601.14413","title":"Amplifying the Cosmological Collider with Ghost Spectators","score":5.1,"section":"replacement","rank":65},{"arxiv":"2611.15541","title":"On the reduction of negative-weight events in MC@NLO with Machine Learning techniques","score":4.8,"section":"new","rank":66},{"arxiv":"2603.28517","title":"Heavy-Meson Bag Paramete const isNew=n=>n.role==='today'||n.role==='repl';
const r=n=>isNew(n)?4+n.score/9:2.6+1.5*Math.log10(1+n.cites)+(n.role==='seed'?1:0);
const auth=n=>n.first+(n.nauth>2?' et al.':n.nauth===2?' + 1':'');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const plain=s=>String(s).replace(/\$/g,'').replace(/\\([a-zA-Z]+)/g,'$1').replace(/[{}^_]/g,'');
const REFS=RAW.refs||{};
// reasons text: [[INSPIRE id]] becomes 'Author Year' with a pop-up (authors, year, title), like the graph's tooltip
const why=s=>esc(s).replace(/\[\[(\d+)\]\]/g,(m,k)=>{const r=REFS[k];return r?`<span class="ref ${r.role}" tabindex="0" data-ref="${k}">${esc(r.first)} ${r.year}</span>`:m});
const tex=el=>{if(window.MathJax&&MathJax.typesetPromise)MathJax.typesetPromise([el]).then(()=>fold()).catch(()=>{})};
const NEWS=N.filter(isNew).sort((a,b)=>a.rank-b.rank);
document.getElementById('eyebrow').innerHTML=`arXiv ${esc(M.cat)} · <a href="${esc(M.url)}" target="_blank" rel="noopener">${esc(M.date)}</a>`;
document.getElementById('dek').textContent=`${M.nrel} of the ${M.nlist} papers in this listing (${M.counts.new} new, ${M.counts.cross} cross-lists, ${M.counts.replacement} replacements) score ${M.threshold} or more for belonging to the reference and citation network of your ${M.nown} papers and the ${M.next} papers by other authors around them. Highest score first.`;
const T=!!M.topics;   // network file with shared phrases: 35/30/15/10 + 10% shared topics
document.getElementById('foot').innerHTML=`<p><b>Score (0–100).</b> ${T?35:40}% direct citations of network papers (each of your papers counts 1, each other network paper 0.6, network papers with over 1,000 citations 0.06; saturating as 1 − e<sup>−x</sup>); ${T?30:35}% bibliographic coupling with your own papers (idf-weighted cosine of INSPIRE-linked reference sets, best match and mean of the top three, 0.30 = full marks); 15% best coupling with the other network papers (0.35 = full marks); 10% authorship (you, or your co-authors)${T?`; 10% shared topics: technical phrases of two or more words in the title and abstract that your papers and the network use much more often than hep-ph as a whole (each weighted by how much more${M.halfLife?`, with recent papers counting more: a paper's weight halves every ${M.halfLife} years`:''}; saturating as 1 − e<sup>−x/3</sup>)${(M.watch||[]).length?`, plus your watch topics (${M.watch.map(esc).join(', ')})`:''}`:''}.</p>
<p><b>Data.</b> Network: INSPIRE records supplied with the project. Listing papers: INSPIRE records where already harvested (${M.onInspire} of ${M.nlist}); for the rest the reference list was read from the arXiv source and matched to INSPIRE by arXiv number, DOI and texkey. Only links between papers on this page are drawn. Built ${esc(M.built)}.</p>`;
const P=['Direct citations','Coupling to your papers','Coupling to network','Authorship','Shared topics'];
const PS=['Citations','Your papers','Network','Authors','Topics'];   // short labels for phones
function list(){const box=document.getElementById('list');
  if(!NEWS.length){box.innerHTML=`<div class="empty">No paper in this listing reaches a score of ${M.threshold}.</div>`;document.getElementById('mainnet').hidden=true;return}
  NEWS.forEach(n=>{const d=document.createElement('article');d.className='paper';d.id='p'+n.i;
    d.innerHTML=`<div class="role" style="color:${col(n)}">#${n.rank} · ${esc(SEC[n.section])} · score ${n.score.toFixed(1)}</div>
    <h2>${esc(n.title)}</h2>
    <div class="authors">${authors(n.authors)} · arXiv:${esc(n.arxiv)}</div>
    <p class="abs">${esc(n.abstract)}</p><button class="linkbtn absmore" type="button" hidden>More</button>
    <p class="why">${why(n.note)}</p>
    <div class="row"><div class="bars">${n.parts.map((v,j)=>`<span><span class="pl">${P[j]}</span><span class="ps">${PS[j]}</span> <span class="mb"><i style="width:${Math.round(v*100)}%"></i></span></span>`).join('')}</div><span>${n.nlinked} of ${n.nref} references linked to INSPIRE · refs from ${esc(n.src)}</span></div>
    <div class="links">${n.id?`<a href="https://inspirehep.net/literature/${n.id}" target="_blank" rel="noopener">INSPIRE</a>`:''}<a href="https://arxiv.org/abs/${esc(n.arxiv)}" target="_blank" rel="noopener">arXiv</a><a href="https://arxiv.org/pdf/${esc(n.arxiv)}" target="_blank" rel="noopener">PDF</a>${n.html?`<a href="https://arxiv.org/html/${esc(n.arxiv)}" target="_blank" rel="noopener" title="arXiv's experimental HTML version">HTML</a>`:''}<button class="linkbtn graphbtn" type="button">Show in network</button></div>`;
    d.querySelector('.graphbtn').addEventListener('click',()=>pick(n,true));
    d.querySelector('.absmore').addEventListener('click',e=>{const o=d.classList.toggle('open');e.target.textContent=o?'Less':'More'});
    box.appendChild(d)});
  toc();tex(box)}
// Phones: long author lists show the first 3 and "et al." (tap to expand); abstracts fold to 3 lines with More.
function authors(s){const a=String(s||'').split(', ');if(a.length<=3)return esc(s);
  return `<span class="au-short">${esc(a.slice(0,3).join(', '))} <button class="aubtn" type="button" aria-label="Show all ${a.length} authors">et al. (+${a.length-3})</button></span><span class="au-full">${esc(s)}</span>`}
document.addEventListener('click',e=>{const b=e.target.closest('.aubtn');if(b)b.closest('.authors').classList.add('open')});
function fold(){document.querySelectorAll('.paper').forEach(d=>{const p=d.querySelector('.abs'),b=d.querySelector('.absmore');
  if(!p||!b||d.classList.contains('open'))return;b.hidden=!(p.scrollHeight>p.clientHeight+2)})}
function toc(){const t=document.getElementById('toc');if(!NEWS.length)return;t.hidden=false;
  const X=RAW.next||[];
  t.innerHTML=`<h3>In this listing</h3><ol>${NEWS.map(n=>`<li><a href="#p${n.i}"><span class="sc${n.role==='repl'?' repl':''}">${n.score.toFixed(0)}</span><span class="tt">${esc(n.title)}</span></a></li>`).join('')}${X.length?`<li class="more-link"><a href="#more"><span class="sc">+${X.length}</span><span class="tt">The next ${X.length} papers by score (folded)</span></a></li>`:''}</ol>`;
  const m=t.querySelector('.more-link a');if(m)m.addEventListener('click',()=>{document.getElementById('more').open=true});tex(t)}
let sel=NEWS[0]||null, hover=null, query='', G;
const svg=d3.select('#svg'), tip=document.getElementById('tip');
function draw(){
  if(!NEWS.length)return;
  const RNG=d3.randomLcg(11);
  const W=Math.max(300,document.getElementById('chart').clientWidth), H=W<600?500:480, m={l:16,r:16,t:20,b:34};
  svg.attr('viewBox',`0 0 ${W} ${H}`); svg.selectAll('*').remove();
  const yrs=d3.extent(N,n=>n.year);
  const x=d3.scaleLinear().domain([yrs[0]-.5,yrs[1]+1.2]).range([m.l+8,W-m.r-8]);
  const ticks=x.ticks(W<600?6:12).filter(t=>Number.isInteger(t)&&t<=yrs[1]);
  svg.append('g').attr('class','grid').selectAll('line').data(ticks).join('line').attr('x1',d=>x(d)).attr('x2',d=>x(d)).attr('y1',m.t).attr('y2',H-m.b);
  svg.append('g').attr('class','axis').attr('transform',`translate(0,${H-m.b})`).call(d3.axisBottom(x).tickValues(ticks).tickFormat(d3.format('d')).tickSizeOuter(0));
  const cy=(m.t+H-m.b)/2, xf=n=>isNew(n)?x(yrs[1]+.75):x(n.year);
  const sim=N.map(n=>({n,x:xf(n)+(RNG()-.5)*4,y:cy+(RNG()-.5)*H*.5}));
  const links=E.map(e=>({source:sim[e.s],target:sim[e.t],s:e.s,t:e.t,k:e.k}));
  d3.forceSimulation(sim).force('x',d3.forceX(s=>xf(s.n)).strength(1)).force('y',d3.forceY(cy).strength(.04))
    .force('link',d3.forceLink(links).strength(.03)).force('charge',d3.forceManyBody().strength(-40))
    .force('col',d3.forceCollide(s=>r(s.n)+2)).stop().tick(320);
  sim.forEach(s=>{s.y=Math.max(m.t+8,Math.min(H-m.b-8,s.y));s.x=Math.max(m.l+4,Math.min(W-m.r-4,s.x))});
  G=svg.append('g');
  G.append('g').selectAll('path').data(links).join('path').attr('class',l=>'edge '+l.k)
    .attr('d',l=>{const a=l.source,b=l.target;return `M${a.x},${a.y}Q${(a.x+b.x)/2},${(a.y+b.y)/2-Math.abs(a.x-b.x)*.12} ${b.x},${b.y}`});
  G.append('g').selectAll('circle').data([...sim].sort((a,b)=>RANK[b.n.role]-RANK[a.n.role])).join('circle')
    .attr('class','node').attr('cx',s=>s.x).attr('cy',s=>s.y).attr('r',s=>r(s.n)).attr('fill',s=>col(s.n))
    .on('pointerenter',(ev,s)=>{hover=s.n;showTip(ev,s.n);paint()}).on('pointermove',(ev,s)=>showTip(ev,s.n))
    .on('pointerleave',()=>{hover=null;tip.hidden=true;paint()}).on('click',(ev,s)=>pick(s.n,false));
  const lab=sim.filter(s=>isNew(s.n)||s.n.role==='seed'||s.n.deg>=3);
  const L=lab.map(s=>{const right=s.x>W*.8,t=isNew(s.n)?`#${s.n.rank} ${s.n.first}`:`${s.n.first} ${s.n.year}`,w=t.length*6.2;return{s,t,right,x0:right?s.x-r(s.n)-4-w:s.x+r(s.n)+4,w,y:s.y+4}}).sort((a,b)=>a.y-b.y);
  const placed=[];L.forEach(l=>{let k=0;while(k<40&&placed.some(p=>l.x0<p.x0+p.w&&p.x0<l.x0+l.w&&Math.abs(l.y-p.y)<13)){l.y+=13*(k%2?-1:1)*(1+Math.floor(k/2));k++;l.y=Math.max(m.t+10,Math.min(H-m.b-4,l.y))}placed.push(l)});
  G.append('g').selectAll('text').data(L).join('text').attr('class','nlabel').attr('x',l=>l.right?l.s.x-r(l.s.n)-4:l.s.x+r(l.s.n)+4).attr('y',l=>l.y)
    .attr('text-anchor',l=>l.right?'end':'start').text(l=>l.t);
  paint();
}
function showTip(ev,n){const b=document.getElementById('chart').getBoundingClientRect();tip.hidden=false;tip.textContent=`${auth(n)} (${n.year}) — ${plain(n.title)}`+(isNew(n)?` · score ${n.score}`:'');
  let L=ev.clientX-b.left+12;if(L>b.width-290)L=ev.clientX-b.left-290;tip.style.left=Math.max(4,L)+'px';tip.style.top=(ev.clientY-b.top+12)+'px'}
function paint(){if(!G)return;const f=hover||sel,on=new Set();if(f){on.add(f.i);f.out.forEach(i=>on.add(i));f.inn.forEach(i=>on.add(i))}
  svg.classed('dim',!!f);
  G.selectAll('path.edge').attr('class',l=>'edge '+l.k+(!f?'':l.s===f.i?' hot out':l.t===f.i?' hot in':''));G.selectAll('path.edge.hot').raise();
  G.selectAll('circle').classed('on',s=>on.has(s.n.i)).classed('sel',s=>sel&&s.n.i===sel.i).classed('match',s=>query&&`${s.n.first} ${s.n.title} ${s.n.arxiv} ${s.n.authors||''}`.toLowerCase().includes(query));
  G.selectAll('text.nlabel').classed('on',l=>on.has(l.s.n.i))}
function panel(){const p=document.getElementById('panel'),n=sel;
  if(!n){p.innerHTML='<p>Select a paper in the network.</p>';return}
  const links=`<div class="links">${n.id?`<a href="https://inspirehep.net/literature/${n.id}" target="_blank" rel="noopener">INSPIRE</a>`:''}${n.arxiv?`<a href="https://arxiv.org/abs/${esc(n.arxiv)}" target="_blank" rel="noopener">arXiv</a>`:''}</div>`;
  if(isNew(n)) p.innerHTML=`<div class="role" style="color:${col(n)}">#${n.rank} · ${esc(SEC[n.section])} · score ${n.score.toFixed(1)}</div><h4>${esc(n.title)}</h4>
   <div class="meta">${esc(auth(n))} · arXiv:${esc(n.arxiv)}</div><p>${why(n.note)}</p><div class="links"><a href="#p${n.i}">Back to abstract</a></div>`;
  else p.innerHTML=`<div class="role" style="color:${col(n)}">${esc(ROLE[n.role])}</div><h4>${esc(n.title)}</h4>
   <div class="meta">${esc(auth(n))} · ${n.year}${n.arxiv?' · arXiv:'+esc(n.arxiv):''}</div>
   <div class="stats"><span>${n.cites.toLocaleString()} citations</span><span>${n.inn.filter(i=>isNew(N[i])).length} of the matches link here</span></div>${links}`;
  tex(p)}
function pick(n,scroll){sel=n;panel();paint();document.querySelectorAll('.paper').forEach(el=>el.classList.toggle('sel',el.id==='p'+n.i));if(scroll)document.getElementById('chart').scrollIntoView({behavior:'smooth',block:'nearest'})}
const present=new Set(N.map(n=>n.role));
document.getElementById('legend').innerHTML=['today','repl','seed','other'].filter(k=>present.has(k)).map(k=>`<span><i class="dot" style="background:var(--${k})"></i>${esc(ROLE[k])}</span>`).join('')+'<span style="color:var(--fg-3)">Listing papers: size ∝ score; others: size ∝ log(citations)</span>';
document.getElementById('q').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();paint()});
svg.on('click',ev=>{if(ev.target.tagName!=='circle'){sel=null;panel();paint()}});
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(draw,200)});
function nextList(){const X=RAW.next||[];if(!X.length)return;const box=document.getElementById('nextlist'),more=document.getElementById('more');
  more.hidden=false;more.querySelector('summary').firstChild.textContent=`The next ${X.length} papers by score `;
  const nmin=M.nextMin;
  document.getElementById('moresub').textContent=`below the threshold of ${M.threshold}${nmin!=null?`: every paper scoring ${nmin} or more, and at least ${M.nextCount} when available`:''}; not drawn in the network`;
  const cut=nmin!=null?X.findIndex(n=>n.score<nmin):-1;
  box.innerHTML=X.map((n,i)=>(i===cut?`<li class="divider">Below ${nmin}: weaker relation (most of these share no specific reference, coupling or topic with your work)</li>`:'')+`<li><div class="role" style="color:var(--${n.section==='replacement'?'repl':'today'})">#${n.rank} · ${esc(SEC[n.section])} · score ${n.score.toFixed(1)}</div>
    <div class="t">${esc(n.title)}</div><div class="authors">${authors(n.authors)} · arXiv:${esc(n.arxiv)}</div>
    ${n.note?`<p class="why">${why(n.note)}</p>`:''}
    <details class="abs"><summary>Abstract</summary><p class="abs">${esc(n.abstract)}</p></details>
    <div class="links">${n.id?`<a href="https://inspirehep.net/literature/${n.id}" target="_blank" rel="noopener">INSPIRE</a>`:''}<a href="https://arxiv.org/abs/${esc(n.arxiv)}" target="_blank" rel="noopener">arXiv</a><a href="https://arxiv.org/pdf/${esc(n.arxiv)}" target="_blank" rel="noopener">PDF</a></div></li>`).join('');
  more.addEventListener('toggle',()=>{if(more.open)tex(box)})}
const rtip=document.getElementById('reftip');let rcur=null;
function refShow(el){const r=REFS[el.dataset.ref];if(!r)return;rcur=el;rtip.textContent=`${auth(r)} (${r.year}) — ${plain(r.title)}`;rtip.hidden=false;
  const b=el.getBoundingClientRect(),t=rtip.getBoundingClientRect();let L=Math.min(Math.max(8,b.left),innerWidth-t.width-8),T=b.bottom+6;
  if(T+t.height>innerHeight-8)T=b.top-t.height-6;rtip.style.left=L+'px';rtip.style.top=T+'px'}
function refHide(){rtip.hidden=true;rcur=null}
document.addEventListener('pointerover',e=>{const el=e.target.closest('.ref');if(el&&e.pointerType==='mouse')refShow(el)});
document.addEventListener('pointerout',e=>{if(e.target.closest('.ref')&&e.pointerType==='mouse')refHide()});
document.addEventListener('click',e=>{const el=e.target.closest('.ref');if(el)refShow(el);else if(rcur)refHide()});
document.addEventListener('focusin',e=>{const el=e.target.closest('.ref');if(el)refShow(el)});
document.addEventListener('focusout',e=>{if(e.target.closest('.ref'))refHide()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')refHide()});
addEventListener('scroll',()=>{if(rcur)refHide()},{passive:true});
// the rest of the day's papers by score: only the title, linked to the arXiv record
function restList(){const X=RAW.rest||[];if(!X.length)return;const d=document.getElementById('rest'),box=document.getElementById('restlist');
  d.hidden=false;d.querySelector('summary').firstChild.textContent=`All other ${X.length} papers in this listing `;
  document.getElementById('restsub').textContent='by score, title only';
  box.innerHTML=X.map(n=>`<li><span class="sc">#${n.rank} · ${n.score.toFixed(1)}</span><a href="https://arxiv.org/abs/${esc(n.arxiv)}" target="_blank" rel="noopener">${esc(n.title)}</a></li>`).join('');
  d.addEventListener('toggle',()=>{if(d.open)tex(box)})}
list();nextList();restList();fold();draw();panel();
window.addEventListener('load',()=>{tex(document.getElementById('list'));tex(document.getElementById('panel'));fold();
  if(window.MathJax&&MathJax.startup&&MathJax.startup.promise)MathJax.startup.promise.then(()=>setTimeout(fold,300))});
addEventListener('resize',()=>{clearTimeout(window._ft);window._ft=setTimeout(fold,200)});
</script>
