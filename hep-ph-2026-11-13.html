<script>
const RAW = {"n":[{"id":"","arxiv":"2611.16553","title":"Inelastic Scalar Dark Matter in a Gauged $U(1)_{B-L}$ Model and its LZ Phenomenology","first":"Dai","nauth":4,"year":2026,"cites":0,"role":"today","note":"Cites 4 network papers: [[3215016]], [[3202840]], [[3201080]], [[1393299]]. Closest of your papers: [[1764733]] (coupling 0.04, 6 shared references). Closest network paper: [[3202840]] (coupling 0.45, 45 shared references). Shared topics: dm abundance, observed relic, relic abundance, scalar dark matter, complex scalar.","score":60.3,"rank":1,"section":"new","parts":[0.91,0.14,1,0.0,0.94],"abstract":"We study inelastic scalar dark matter (DM) in a gauged $U(1)_{B-L}$ model motivated by the high-energy recoil candidate reported by LUX-ZEPLIN (LZ). The model introduces two complex scalars, $Φ$ and $S$, charged under $U(1)_{B-L}$. The scalar $S$ is responsible for spontaneous symmetry breaking, while the two real components of $Φ$, $φ_1$ and $φ_2$, serve as DM. This two-component DM framework accommodates both exothermic and endothermic scenarios. In the exothermic scenario, the lifetime of the heavier state $φ_1$ exceeds the age of the Universe, and both states contribute to the present-day DM abundance. In the endothermic scenario, the abundance comes almost entirely from the lighter state $φ_2$. We investigate the thermal history of the dark sector and find that the two scalars have approximately equal abundances at freeze-out. We identify parameter regions that reproduce the observed relic abundance. We calculate the nuclear recoil spectra, perform a three-bin likelihood analysis, and obtain the best-fit points interpreting the LZ signal in both scenarios.","authors":"Changjie Dai, Linyun He, Yonghua Wang, Wei Chao","nlinked":136,"nref":136,"src":"arXiv source","html":true},{"id":"","arxiv":"2611.15957","title":"The Curious Case of Anapole Dark Matter at LZ: Minimal, Elastic and Testable","first":"Bera","nauth":3,"year":2026,"cites":0,"role":"today","note":"Cites 5 network papers: [[3217265]], [[3207263]], [[3215016]], [[3202840]], [[3201080]]. Closest of your papers: [[1413755]] (coupling 0.02, 2 shared references). Closest network paper: [[3202840]] (coupling 0.48, 57 shared references). Shared topics: observed dark matter, dark matter abundance, indirect detection, dark matter.","score":56.7,"rank":2,"section":"new","parts":[0.95,0.06,1,0.0,0.68],"abstract":"Majorana fermions can carry neither charge nor dipole moments, leaving the anapole moment as their leading electromagnetic interaction. A stable Majorana fermion is therefore a minimal realization of electromagnetically interacting dark matter. The momentum dependence of the anapole interaction produces a harder recoil spectrum than standard momentum-independent interactions. We show that this makes elastically scattering anapole dark matter a viable interpretation of the single high-energy nuclear-recoil event recorded by the LUX-ZEPLIN (LZ) experiment, in a region where almost no background is expected. Curiously, the same coupling that fits the LZ data also yields the observed dark matter abundance at a mass of about 300 GeV, and is consistent with collider searches and indirect detection. The scenario is testable, predicting further events at lower energies, which the full LZ run will probe and a next-generation detector such as XLZD will decisively test.","authors":"Sourav Bera, Suvam Maharana, Poulami Mondal","nlinked":188,"nref":192,"src":"arXiv source","html":true},{"id":"3227657","arxiv":"2611.14616","title":"$N_{\\mathrm{eff}}$, Radiative Dirac Neutrinos, and Flavor Physics from Leptoquarks","first":"Escalona","nauth":5,"year":2026,"cites":0,"role":"today","note":"Cites your papers: [[1708907]]. Cites 4 network papers: [[2875244]], [[3193100]], [[1667059]], [[1655576]]. Closest of your papers: [[1708907]] (coupling 0.05, 4 shared references). Closest network paper: [[2813804]] (coupling 0.17, 12 shared references). Shared topics: dirac neutrino mass, neutrino mass.","score":51.4,"rank":3,"section":"new","parts":[0.97,0.15,0.48,0.0,0.57],"abstract":"Leptoquarks provide a common framework for addressing flavor anomalies, rare meson decays, and neutrino-mass generation. We study a model with two mixed scalar leptoquarks and three right-handed neutrinos that generates radiative Dirac neutrino masses and contributes to $B^+\\to K^+ν\\barν$, charged-lepton flavor violation, and the effective number of relativistic species. We show that the model can accommodate the Belle~II measurement of $B^+\\to K^+ν\\barν$ while satisfying the $μ\\to eγ$ bound and the cosmological constraint on $ΔN_{\\mathrm{eff}}$. When both leptoquark masses exceed approximately $12$--$14\\,\\mathrm{TeV}$, the new contribution to the $B$-meson decay becomes too small, and the prediction approaches the SM value, which lies below the Belle~II measurement. Interestingly, the lower bounds on the leptoquark mass scale derived from $N_{\\mathrm{eff}}$ can be stronger than those from direct collider searches.","authors":"Patricio Escalona, Guillermo Gambini, Vítor Pereira, C. A. de S. Pires, Farinaldo S. Queiroz","nlinked":72,"nref":74,"src":"INSPIRE","html":true},{"id":"3227749","arxiv":"2611.15218","title":"Enhancing Graviton--Photon Conversion through Galactic Magnetic Turbulence","first":"Tian","nauth":4,"year":2026,"cites":0,"role":"today","note":"Cites 4 network papers: [[2857389]], [[2737686]], [[2661930]], [[2957726]]. Closest of your papers: [[1824064]] (coupling 0.04, 4 shared references). Closest network paper: [[2920754]] (coupling 0.23, 19 shared references).","score":45.3,"rank":4,"section":"new","parts":[0.91,0.12,0.66,0.0,0.0],"abstract":"Plasma dispersion suppresses coherent graviton-photon conversion over astrophysical distances. We show that Galactic magnetic turbulence enables phase matching by compensating the plasma-induced mismatch, allowing matched magnetic modes to contribute coherently. In the long path limit, the ensemble-averaged conversion probability grows linearly with propagation distance in the phase matched regime and is governed by the projected magnetic power spectrum. Applied to photon background observations, this mechanism yields characteristic strain limits that are stronger than previous Galactic conversion bounds in the inertial range phase matching window, with improvements of up to two orders of magnitude.","authors":"Hongliang Tian, Lei Wu, Yang Zhang, Bin Zhu","nlinked":59,"nref":70,"src":"INSPIRE","html":true},{"id":"3227691","arxiv":"2611.15169","title":"Rapidly Spinning Primordial Black Holes from Confinement","first":"Zantedeschi","nauth":1,"year":2026,"cites":0,"role":"today","note":"Cites 4 network papers: [[3177521]], [[2973967]], [[2935598]], [[2905045]]. Closest of your papers: [[2826987]] (coupling 0.05, 8 shared references). Closest network paper: [[2973967]] (coupling 0.11, 16 shared references). Shared topics: primordial black hole.","score":44.4,"rank":5,"section":"new","parts":[0.91,0.15,0.31,0.0,0.35],"abstract":"Confinement can turn widely separated particles into rapidly spinning primordial black holes. A flux tube pulls a heavy quark--antiquark pair together, converting its stored energy into relativistic motion. The same mechanism is possible in the magnetic dual, where a Higgs phase confines magnetic flux into a string joining a monopole--antimonopole pair. As the particles approach, cosmological tides and string bends can deflect their motion and make them miss. These disturbances can originate during inflation or be generated later. Black-hole formation then requires rare close passages from a smooth, broad encounter distribution. The resulting natal spin density therefore rises linearly to extremality, with mean dimensionless spin two thirds. Numerical string evolutions recover this law. Pairs that miss can remain bound, radiate and later collapse into lighter, near-extremal holes, sourcing a stochastic gravitational-wave background. Although the abundance remains model dependent, confinement leaves a unique spin signature that gravitational-wave observations can test.","authors":"Michael Zantedeschi","nlinked":72,"nref":77,"src":"INSPIRE","html":true},{"id":"3208607","arxiv":"2609.33952","title":"Sub-MeV gamma-ray lines from an endothermic interpretation of the LZ recoil candidate","first":"Dutra","nauth":3,"year":2026,"cites":0,"role":"repl","note":"Cites 2 network papers: [[3201080]], [[3165814]]. Closest of your papers: [[3146383]] (coupling 0.03, 4 shared references). Closest network paper: [[3202840]] (coupling 0.44, 30 shared references). Shared topics: dark matter.","score":43.1,"rank":6,"section":"replacement","parts":[0.7,0.08,1,0.0,0.13],"abstract":"Endothermic upscattering of heavy dark matter offers a compelling interpretation of the high-energy nuclear-recoil candidate recently reported by LUX-ZEPLIN, with a characteristic recoil energy $E_R \\propto δ$, where $δ$ is the mass splitting between the dark matter states. Cosmological and experimental constraints motivate the depletion of the primordial heavier state, which can be regenerated in the Galactic halo. We show that, if the heavier state decays radiatively, the same mass splitting sets the energy of a gamma-ray line, $E_γ\\simeq δ$. For our benchmark, this leads to a sub-MeV line within the projected reach of the Compton Spectrometer and Imager (COSI), scheduled for launch in 2027. The confirmation of the LUX-ZEPLIN candidate event as a dark matter signal would therefore motivate dedicated searches for sub-MeV gamma-ray lines, with COSI providing a timely opportunity to test this interpretation.","authors":"Maíra Dutra, Jacinto P. Neto, Clarissa Siqueira","nlinked":58,"nref":81,"src":"INSPIRE","html":true},{"id":"3227631","arxiv":"2611.14563","title":"SuSy and CoDy Radiation from Evaporating Black Holes","first":"Cacciapaglia","nauth":4,"year":2026,"cites":0,"role":"today","note":"Cites 7 network papers: [[3165453]], [[3193100]], [[2967474]], [[2652636]], [[1895597]], [[1873947]]…. Closest of your papers: [[2826987]] (coupling 0.03, 11 shared references). Closest network paper: [[2682367]] (coupling 0.09, 21 shared references).","score":41.6,"rank":7,"section":"new","parts":[0.99,0.11,0.26,0.0,0.0],"abstract":"We investigate the interplay between physics beyond the Standard Model and modified spacetime geometries in shaping the photon and neutrino spectra from evaporating black holes. We implement three representative supersymmetric (SuSy) benchmarks and a composite dynamics (CoDy) scenario in BlackHawk. We consider both Schwarzschild black holes and regular black holes geometries, namely polymerized, Hayward, and Simpson--Visser black holes. New degrees of freedom at the TeV scale become accessible at Hawking temperatures corresponding to black hole masses of approximately $M_{\\rm BH}\\sim 10^{10}\\,\\mathrm{g}$. We show that physics beyond the Standard Model produces distinctive signatures in both the instantaneous secondary-photon and neutrino spectra. Radiative decays generate narrow spectral features with approximately temperature-independent relative amplitudes, while multistep decay cascades produce broad enhancements that become increasingly pronounced at higher temperatures. In contrast, compressed mass spectra exhibit no localized features. Crucially, we show that the effects of new particle physics and modified spacetime geometries can become intertwined in specific energy regimes, altering the resulting spectral signatures. Our results demonstrate that photon and neutrino spectra provide complementary probes of new particle physics and black hole geometry, with predicted spectral enhancements extending into the energy ranges accessible to current and future high-energy observatories.","authors":"Giacomo Cacciapaglia, Francesco Sannino, Paola Simone, Vania Vellucci","nlinked":154,"nref":167,"src":"INSPIRE","html":true},{"id":"2854064","arxiv":"2411.18725","title":"Generating the Dark Matter mass from the QCD vacuum: A new approach to the mass aspect of the Dark Matter-Baryon coincidence problem","first":"Chung","nauth":1,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[1678642]]. Closest of your papers: [[1679809]] (coupling 0.04, 2 shared references). Closest network paper: [[3213062]] (coupling 0.30, 39 shared references). Shared topics: mass arise, dark matter mass, dark sector, dark matter model, dark matter.","score":40.5,"rank":8,"section":"replacement","parts":[0.45,0.1,0.85,0.0,0.88],"abstract":"The comparable abundances of dark matter and baryons imply a deep connection between the dark sector and the QCD sector. In asymmetric dark matter models, the number densities of both sectors are ensured to be similar. However, a complete solution should also include a mechanism relating their masses. In this study, we explore a new mechanism where an $\\mathcal{O}(Λ_{\\rm QCD})$ dark matter mass arises from the QCD vacuum. The idea is realized by a strongly coupled chiral dark sector, featuring a light composite fermion as the dark matter. Its mass is generated through the vacuum misalignment induced by QCD, ensuring the mass to be comparable with baryons. The model also features additional light bosons, including GeV-scale dark pions and a composite QCD axion.","authors":"Yi Chung","nlinked":73,"nref":75,"src":"INSPIRE","html":true},{"id":"3227794","arxiv":"2611.15030","title":"Suppressed Direct Detection of Dark Matter from a Non-Invertible Selection Rule","first":"Sheikh","nauth":2,"year":2026,"cites":0,"role":"today","note":"Cites 2 network papers: [[2771408]], [[2740358]]. Also cites widely used network papers: [[1518747]]. Closest of your papers: [[2794409]] (coupling 0.04, 5 shared references). Closest network paper: [[3144122]] (coupling 0.12, 5 shared references). Shared topics: direct detection, direct detection experiment, dark matter.","score":38.5,"rank":9,"section":"new","parts":[0.72,0.12,0.35,0.0,0.45],"abstract":"Although the existence of dark matter is well established, its particle nature is still unknown. Direct detection experiments have been struggling to find any viable signal, implying that the dark matter--nucleon scattering cross-section must be suppressed. Here we propose a mechanism to explain the origin of this suppression by considering a non-invertible selection rule. Our numerical analysis shows that a suppressed yet predictable dark matter--nucleon scattering cross section is possible.","authors":"Riasat Sheikh, Koji Tsumura","nlinked":29,"nref":31,"src":"INSPIRE","html":true},{"id":"","arxiv":"2611.15852","title":"The Dark Side of the Periodic Table: Theory and Signatures of Nuclear Atomic Dark Matter","first":"Asadi","nauth":5,"year":2026,"cites":0,"role":"today","note":"Cites 2 network papers: [[3178478]], [[2795517]]. Also cites widely used network papers: [[2817040]]. Closest of your papers: [[824906]] (coupling 0.04, 7 shared references). Closest network paper: [[3214429]] (coupling 0.09, 44 shared references). Shared topics: big bang nucleosynthesis, dm mass, dark matter.","score":38.0,"rank":10,"section":"new","parts":[0.72,0.12,0.25,0.0,0.56],"abstract":"We study the theory and signatures of a Mirror Twin Higgs (MTH) scenario in which stable twin neutrons constitute most of the dark matter (DM), while a subdominant component of twin elements survives as nuclear atomic dark matter (naDM). This framework offers a solution to the $matter~coincidence~problem$ ($Ω_{\\rm DM}\\simeq5Ω_b$), as the twin $\\mathbb{Z}_2$ symmetry can correlate the visible and DM mass scales and their number densities. We analyze twin nucleon freeze-out and the onset of twin Big Bang nucleosynthesis (BBN) to estimate the total naDM abundance, and determine which elements in the dark periodic table could be populated. An appreciable but subdominant naDM component generally requires a fractional nucleon mass splitting near the percent level, with twin-BBN creating heavy elements up to twin carbon. Strong twin neutron-proton scattering allows nearly all of the dark matter, not only the atomic sub-component, to participate in $dark~acoustic~oscillations$ (DAO) at early times, giving rise to a characteristic two-stage DAO signature that may be detected with future cosmological probes. Interactions between the twin and visible sectors, including the irreducible Higgs portal, make this scenario a well-motivated target for future directional direct-detection searches, and the naDM sub-component is expected to exhibit highly exotic astrophysics. We outline a supersymmetric twin Froggatt-Nielsen realization in which spontaneous $\\mathbb{Z}_2$ breaking in the flavon sector can generate the required fermion spectrum and Higgs potential.","authors":"Pouya Asadi, Zackaria Chacko, David Curtin, Micah Mellors, Ethan T. Neil","nlinked":311,"nref":316,"src":"arXiv source","html":true},{"id":"3222430","arxiv":"2611.03429","title":"DBI Softens Stiff-Phase Gravitational-Wave Spectra","first":"López","nauth":3,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[1803656]]. Closest of your papers: [[2663002]] (coupling 0.09, 14 shared references). Closest network paper: [[2857387]] (coupling 0.11, 8 shared references). Shared topics: viable parameter space, big bang nucleosynthesis, gravitational wave.","score":34.8,"rank":11,"section":"replacement","parts":[0.45,0.26,0.33,0.0,0.62],"abstract":"We investigate the effect of non-canonical kinetic terms on the present-day density spectrum of primordial gravitational waves (GWs), by considering the dynamics of a scalar field governed by the Dirac--Born--Infeld (DBI) action and a runaway potential. The field, responsible for a period of inflation, subsequently enters a kinetically dominated regime, where the DBI structure reduces the equation-of-state parameter relative to the canonical kination result $w=1$, thereby softening the blue tilt of the GW spectrum. Simultaneously, the energy density of the field redshifts at a slower rate, delaying radiation domination and prolonging the stiff phase. The interplay between these two effects can lead to a potentially observable GW signal that would otherwise remain beyond the reach of future experiments in the canonical case. We test our predictions by numerically solving the background and perturbations, from inflation until radiation domination, and find viable parameter space compatible with cosmic microwave background and Big Bang Nucleosynthesis constraints.","authors":"Samuel Sánchez López, Eemeli Tomberg, Juan C. Bueno Sánchez","nlinked":99,"nref":103,"src":"INSPIRE","html":true},{"id":"3227744","arxiv":"2611.15454","title":"Constraining Dark Matter Gravitational Production with the 21cm Signal at the Cosmic Dawn","first":"Costa","nauth":2,"year":2026,"cites":0,"role":"today","note":"Cites 2 network papers: [[2737356]], [[2795517]]. Closest of your papers: [[1828504]] (coupling 0.01, 2 shared references). Closest network paper: [[3090372]] (coupling 0.09, 4 shared references). Shared topics: direct detection, indirect detection, dark matter.","score":34.3,"rank":12,"section":"cross","parts":[0.7,0.05,0.26,0.0,0.45],"abstract":"The origin of dark matter is one of the major problems in modern cosmology. We can infer its existence from the gravitational potential wells around astrophysical objects, but there is no convincing explanation for what its nature and origin are. Moreover, experiments for direct detection, indirect detection, or particle production in accelerators have not shown, until now, any conclusive interaction between dark matter and particles in the standard model. This may imply that dark matter does not interact with ordinary matter and originates from pure gravitational interaction. In this manuscript, we investigate the possibility to constrain the gravitational production of dark matter from the 21cm brightness temperature at the cosmic dawn. Considering only the time when the absorption profile occurs, we can impose upper limits on the dark matter's mass. Future measurements have potential to extend current constraints and help understanding the nature of dark matter.","authors":"André A. Costa, Valdir B. Bezerra","nlinked":20,"nref":22,"src":"INSPIRE","html":true},{"id":"3105005","arxiv":"2601.09095","title":"Heavy Neutrinos across the Electroweak-to-Multi-TeV Frontier via Novel ML-Enhanced Probes","first":"Shen","nauth":5,"year":2026,"cites":0,"role":"repl","note":"Co-authors of yours: Flórez. Also cites widely used network papers: [[2817040]]. Closest of your papers: [[3094526]] (coupling 0.14, 18 shared references). Closest network paper: [[3187199]] (coupling 0.14, 12 shared references). Shared topics: mass below, neutrino mass, production mechanism.","score":29.8,"rank":13,"section":"replacement","parts":[0.06,0.37,0.4,0.5,0.56],"abstract":"We propose a new strategy to probe heavy neutrinos with non-universal fermion couplings at the Large Hadron Collider (LHC) using a novel production mechanism and machine-learning algorithms. Focusing on proton--proton collisions at $\\sqrt{s} = 13.6~\\mathrm{TeV}$, we investigate final states containing a charged lepton, missing transverse energy, and two jets. For heavy neutrino masses below $\\mathcal{O}(1~\\mathrm{TeV})$, production is dominated by the $s$ channel process. At higher masses, vector boson fusion becomes the dominant production mechanism, with cross sections that decrease slowly as the heavy neutrino mass increases. We simulate both signal and Standard Model background events and employ gradient-boosted decision trees to optimize event classification. Assuming an integrated luminosity of $3000~\\mathrm{fb^{-1}}$, expected for the high-luminosity, and considering realistic statistical and systematic uncertainties, we find that heavy neutrinos in the mass range $50~\\mathrm{GeV}$--$10~\\mathrm{TeV}$ can be probed with sensitivity to the mixing parameter $|V_{\\ell N}|^2$ spanning from $\\mathcal{O}(10^{-5})$ to 1. This approach enhances the discovery potential for heavy neutrinos and provides a complementary pathway to existing search strategies.","authors":"Yin-Fa Shen, Alfredo Gurrola, Francesco Romeo, Denis Rathjens, Andres Flórez","nlinked":124,"nref":131,"src":"INSPIRE","html":true},{"id":"","arxiv":"2611.15874","title":"Dual-species atom interferometry for axion dark matter","first":"Reckermann","nauth":9,"year":2026,"cites":0,"role":"today","note":"Cites 2 network papers: [[3193100]], [[2795517]]. Closest of your papers: [[1607572]] (coupling 0.02, 3 shared references). Closest network paper: [[2810207]] (coupling 0.04, 12 shared references). Shared topics: dark matter.","score":29.0,"rank":14,"section":"new","parts":[0.7,0.06,0.11,0.0,0.13],"abstract":"Atom interferometers are sensitive to oscillations of the masses and transition frequencies of atoms, which can be induced by axion dark matter. The main limitation is the sensitivity to gravity gradient noise (GGN). We propose a dual-species atom interferometry sequence that provides a suppression of GGN by up to three orders of magnitude and a sensitivity enhancement via the mass difference of the two atoms. We show that, under realistic experimental assumptions, a 10m-baseline dual-species atom interferometer is more sensitive to the axion gluon coupling than a 100m single-species gradiometer. Including a comprehensive noise analysis, we demonstrate that the Very Long Baseline Atom Interferometer (VLBAI) in Hannover with a baseline of 10m can probe the axion decay constant at levels almost competitive with leading laboratory constraints. The proposed 100m-baseline Atom Interferometer CERN Experiment (AICE) can extend this sensitivity by up to two orders of magnitude, surpassing laboratory constraints for axion masses of $10^{-19}\\;\\text{eV}/c^2 \\lesssim m_a \\lesssim 3\\times10^{-15}\\;\\text{eV}/c^2$.","authors":"Maike Reckermann, John Carlton, Michael Werner, Agnese Mariotti, Guillermo A. Perez-Lobato, Nathaniel Sherrill, Naceur Gaaloul, Dennis Schlippert, Elina Fuchs","nlinked":84,"nref":102,"src":"arXiv source","html":true},{"id":"","arxiv":"2611.15856","title":"Beyond the Standard Model EFT: Stress Testing the Electroweak Phase Transition in the Real Singlet Model","first":"Cassidy","nauth":4,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Closest of your papers: [[1832796]] (coupling 0.01, 2 shared references). Closest network paper: [[2924315]] (coupling 0.12, 31 shared references). Shared topics: singlet scalar, production mechanism, gravitational wave.","score":26.3,"rank":15,"section":"new","parts":[0.45,0.03,0.35,0.0,0.43],"abstract":"The real singlet scalar extension of the Standard Model is a much studied benchmark model for a strong first order electroweak phase transition (EWPT) and its role in electroweak baryogenesis. However, this model is not sufficient to generate the baryon asymmetry of the Universe, since it does not introduce any additional sources of CP violation. That is, additional new physics is still expected in the TeV range. In this paper we use effective field theory (EFT) methods to study the effects of new physics on the EWPT in the real singlet model with no $Z_2$. Effective operators up to dimension six with a cutoff scale of $Λ=1$ TeV are included in the scalar potential. We study the correlations between a strong first order EWPT, the Higgs trilinear coupling, resonant di-Higgs production, and gravitational wave signals in the EFT. We find that in the real singlet model with a strong first order EWPT the allowed region of the Higgs trilinear coupling is sensitive to TeV scale new physics, while the predictions of the gravitational wave signal and maximum resonant di-Higgs rate (with no additional production mechanisms) are robust against additional weakly coupled physics at or above the TeV scale.","authors":"Morgan E. Cassidy, Zhongtian Dong, Peisi Huang, Ian M. Lewis","nlinked":159,"nref":165,"src":"arXiv source","html":true},{"id":"","arxiv":"2611.15861","title":"A Scattering Phase Space Primer","first":"Acanfora","nauth":1,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Closest of your papers: [[793723]] (coupling 0.07, 3 shared references). Closest network paper: [[3206672]] (coupling 0.08, 6 shared references). Shared topics: dark matter.","score":26.2,"rank":16,"section":"new","parts":[0.45,0.19,0.22,0.0,0.13],"abstract":"The kinematic phase space is fundamental to all particle scattering processes across experiments - from lepton and hadron colliders to dark matter searches. While $2 \\to 2$ scatterings are well understood, the simplest non-trivial case of three-body final states presents major analytic challenges that are typically circumvented by numerical methods. This paper provides the first comprehensive analytic treatment of $2 \\to 3$ phase space and cross section distributions that uses a non-constant matrix element and keeps all particle masses non-zero. This is fundamental for an accurate description of crucial configurations for Beyond Standard Model searches, e.g. Vector Boson Fusion. Using Gram Determinants as our primary language for Lorentz-invariant kinematics, we derive exact, closed-form expressions for differential cross section distributions and explicitly construct the complete physical phase space boundaries. This paper serves as both a pedagogical introduction and a practical reference for the analytic computation of realistic $2 \\to 3$ processes, showing how the $m\\neq0, |{\\cal M}|\\neq 1$ problem is computationally tractable through proper kinematic methods. The results apply universally across all $2 \\to 3$ scatterings regardless of center-of-mass energy, particle masses, or interaction type.","authors":"Francesca Acanfora","nlinked":40,"nref":50,"src":"arXiv source","html":true},{"id":"","arxiv":"2611.16191","title":"Connecting Electroweak Fine-Tuning, Tens-of-GeV Dark Matter, and Exotic Higgs Decays in the GNMSSM","first":"Heng","nauth":3,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[2771408]]. Also cites widely used network papers: [[1518747]]. Closest of your papers: [[1455793]] (coupling 0.02, 2 shared references). Closest network paper: [[2744388]] (coupling 0.06, 13 shared references). Shared topics: direct detection, dark matter candidate, dark matter.","score":26.1,"rank":17,"section":"new","parts":[0.48,0.06,0.18,0.0,0.46],"abstract":"In the general next-to-minimal supersymmetric standard model (GNMSSM), we connect electroweak fine-tuning, a singlino dark matter candidate with mass around tens of GeV, and Exotic Higgs Decays, identifying a natural region characterized by the mass hierarchy $m_{\\tilde{S}}<m_{\\tilde{B}}<m_{\\tilde{H}}$ and $μ_{\\rm tot}\\in [200, 500]$ GeV. For fine-tuning measure $Δ\\leq 40$, the branching ratio $\\mathrm{Br}(h\\to a_sa_s)$ falls in the range 7\\%$-$25\\%, with the pseudoscalar mass $m_{a_s}$ lying mostly between 10 and 20 GeV. This region splits into two viable scenarios consistent with LZ 2024 direct detection: one where the lightest CP-even Higgs $h_1$ is SM-like ($h_1$ case), and another where the second-lightest $h_2$ is SM-like ($h_2$ case). LHC searches for $h\\to a_sa_s \\to b\\bar{b}τ^+τ^-$ exclude 12\\% (10\\%) of samples with 12 GeV $\\leq m_{a_s} \\leq$ 15.5 GeV in the $h_1$ ($h_2$) case, while a substantial fraction remains accessible at the HL-LHC in the $h_2$ case. Our analysis unifies naturalness, dark matter, and observable exotic Higgs decays, yielding concrete targets for future experiments.","authors":"Zhaoxia Heng, Haijing Zhou, Fei Li","nlinked":60,"nref":61,"src":"arXiv source","html":true},{"id":"","arxiv":"2611.16545","title":"A perturbative construction of a modular $S_3$ model for quarks","first":"Battimelli","nauth":2,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[2762216]]. Closest of your papers: [[1249404]] (coupling 0.01, 1 shared references). Closest network paper: [[3154793]] (coupling 0.22, 15 shared references).","score":26.0,"rank":18,"section":"new","parts":[0.45,0.03,0.61,0.0,0.0],"abstract":"We present a modular-invariant supersymmetric model of flavour for quark masses and mixing, based on the group $Γ_2\\cong S_3$. Hierarchies in the quark sector follow from the symmetric structure of the model, as they are generated by modular forms of different weights in the mass matrices, and no severe tuning of free superpotential coefficients is needed. Moreover, no flavons are employed besides the modulus $τ$ which is, given the gCP symmetry imposed on the model, the only source of CP violation. 8 dimensionless observables (4 mass ratios and 4 CKM parameters) are reproduced by making use of 10 free model parameters (including real and imaginary part of the modulus) within the $1σ$ range making our model, to the best of our knowledge, the $S_3$ modular model for quarks with the fewest free parameters.","authors":"Gabriele Battimelli, Davide Meloni","nlinked":37,"nref":39,"src":"arXiv source","html":true},{"id":"","arxiv":"2611.16689","title":"Dark matter evolution in stellar objects: A Boltzmann transport approach","first":"Lin","nauth":3,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3202840]]. Closest of your papers: [[2751074]] (coupling 0.01, 2 shared references). Closest network paper: [[2843822]] (coupling 0.16, 18 shared references). Shared topics: dark matter.","score":24.9,"rank":19,"section":"new","parts":[0.45,0.03,0.46,0.0,0.13],"abstract":"Dark matter (DM) captured by stars offers a way to search for physics beyond the Standard Model. We study the evolution of captured DM with the Boltzmann transport equation (BTE), which follows both the abundance and the phase-space distribution of the bound particles from capture toward a stationary state. Averaging over orbital motion, we write the BTE as a master equation in energy and angular momentum that includes capture, scattering between bound orbits, annihilation and evaporation. Applying it to the Sun, we find that captured DM does not thermalize within the solar age when its scattering on nuclei is rare. The bound DM then remains much more extended than the isothermal distribution assumed in the classical treatment, and its annihilation rate can be suppressed by many orders of magnitude. We also apply the BTE to the inelastic Higgsino interpretation of the recent LUX-ZEPLIN result, which involves two DM components coupled through inelastic scattering. The thermal motion of solar nuclei opens capture channels that are closed for nuclei at rest and strengthens the constraint on the mass splitting by tens of keV.","authors":"Yen-Hsun Lin, Meng-Ru Wu, Seokhoon Yun","nlinked":113,"nref":114,"src":"arXiv source","html":true},{"id":"","arxiv":"2611.15807","title":"A triple-threat challenge for $\\mathit{T}$ and $\\mathit{S}$ at two loops","first":"Haisch","nauth":3,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Closest of your papers: [[1589847]] (coupling 0.04, 6 shared references). Closest network paper: [[2819170]] (coupling 0.09, 13 shared references).","score":23.3,"rank":20,"section":"new","parts":[0.45,0.12,0.25,0.0,0.0],"abstract":"In the $Z_2$-symmetric real singlet-scalar extension of the Standard Model (SM), the oblique parameters $\\mathit{T}$ and $\\mathit{S}$ first receive contributions at two loops, making their precise prediction a challenge. We take on this challenge with a triple threat. First, we perform an exact two-loop calculation in the full theory. Second, we derive the logarithmically enhanced terms from a general argument, according to which the singlet rescales the Higgs couplings to the electroweak gauge bosons and thereby spoils the cancellation of ultraviolet divergences between Higgs and Goldstone contributions. Third, we reproduce the results in the SM effective field theory, where the logarithms and mass-dependent terms stem from one-loop matrix elements of the dimension-six operator that modifies the Higgs kinetic term, and the remaining constants from two-loop matching. Our calculations provide a blueprint for new-physics scenarios in which the leading effects modify the Higgs couplings in a custodially symmetric way, so that custodial-symmetry violation, and hence $\\mathit{T}$, arises only beyond one loop. Finally, we derive constraints from current and projected electroweak precision measurements and show that effects beyond dimension six matter for light singlets.","authors":"Ulrich Haisch, Sara Martellini, Ben A. Stefanek","nlinked":106,"nref":107,"src":"arXiv source","html":true},{"id":"","arxiv":"2611.15889","title":"Gray-body factors: Method matters II, WKB vs GrayHawk","first":"Calzà","nauth":2,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[2893856]]. Closest of your papers: [[2826987]] (coupling 0.01, 4 shared references). Closest network paper: [[2893856]] (coupling 0.12, 17 shared references).","score":22.2,"rank":21,"section":"cross","parts":[0.45,0.04,0.35,0.0,0.0],"abstract":"We present a systematic comparison between two independent approaches for the computation of gray-body factors. A fully numerical integration of the radial scattering equation, as implemented in GrayHawk, and one based on the WKB approximation. We consider four black hole geometries and scalar, fermionic, and vector perturbations, comparing the corresponding gray-body factors, primary Hawking emission spectra, and Page evaporation factors. As expected for high-frequency and large $l$ regimes, the two methods provide excellent agreement. At low frequencies, however, systematic discrepancies emerge and become particularly pronounced for nearly-extremal black holes. Systematic discrepancies are also met when considering effective geometric potentials characterized by the presence of more than one peak. A significant difference between the two approaches is also found in their computational cost, highlighting their complementary nature.","authors":"Marco Calzà, Andrea Spina","nlinked":111,"nref":115,"src":"arXiv source","html":true},{"id":"3227632","arxiv":"2611.14593","title":"Strongly supercooled first-order phase transitions: monopole abundance, entropy production and homogeneity consistency","first":"Zhang","nauth":3,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[2657746]]. Closest of your papers: [[3130296]] (coupling 0.02, 2 shared references). Closest network paper: [[3128752]] (coupling 0.06, 10 shared references). Shared topics: early universe, gravitational wave.","score":21.9,"rank":22,"section":"new","parts":[0.45,0.04,0.18,0.0,0.22],"abstract":"We investigate whether monopole production in the early universe from a first-order phase transition in a unified gauge theory can be significantly suppressed if the phase transition is subject to strong supercooling but still completes successfully. This is facilitated by adopting a Gaussian nucleation model and assuming the false vacuum energy released is transferred to sectors which behave effectively as radiation in terms of cosmological evolution. We distinguish three criteria of phase-transition completion: the comoving measure completion (CMC) characterized by the eventual vanishing of the false-vacuum fraction (FVF), the physical volume completion (PVC) characterized by the eventual vanishing of the physical volume of false vacuum, and the asymptotic thermodynamic completion (ATC), which refers to the finiteness of total entropy production. Assuming an idealized Friedmann-Lemaître-Robertson-Walker (FLRW) cosmology, it is shown that the three criteria share exactly the same completion boundary, away from which they are completely equivalent. It is further shown that monopole abundance can be arbitrarily suppressed for parameter points approaching the completion boundary from the successful side. Nevertheless, for parameter points too close to the completion boundary, justification of the self-consistency of a homogeneous FLRW cosmology is difficult. We propose the use of the Hubble-scale FVF root-mean-square fluctuation to diagnose the homogeneity consistency issue, and find that arbitrarily strong suppression of monopole abundance relative to a reasonable Kibble estimate is not justifiable in terms of homogeneity consistency. These findings also have implications for gravitational wave production in strongly supercooled phase transitions.","authors":"Chen Zhang, Yue Niu, Xin Zhang","nlinked":87,"nref":92,"src":"INSPIRE","html":true},{"id":"","arxiv":"2611.15979","title":"Matching 2HDM to HEFT in triple Higgs boson production from WBF","first":"Barreiro","nauth":5,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Closest of your papers: [[1455793]] (coupling 0.03, 3 shared references). Closest network paper: [[2845027]] (coupling 0.06, 5 shared references).","score":20.8,"rank":23,"section":"new","parts":[0.45,0.08,0.17,0.0,0.0],"abstract":"In this work we compare the Higgs Effective Field Theory (HEFT) predictions with the Two Higgs Doublet Model (2HDM) predictions for triple Higgs production via $WW \\rightarrow hhh$ scattering, under the hypothesis of very heavy Higgs bosons $H$, $A$, and $H^\\pm$, and assuming the lightest one $h$ has the observed mass in the experiments, $m_h \\simeq 125$ GeV. By requiring the matching of the two corresponding scattering amplitudes for this $WW \\rightarrow hhh$ process in the limit of very heavy mass for these bosons, we find the solutions for the leading order HEFT coefficients. Concretely, we determine the coefficients $a$, $b$, $c$, $κ_3$ and $κ_4$ defining the effective interactions $WWh$, $WWhh$, $WWhhh$, $hhh$ and $hhhh$, respectively, in terms of the 2HDM input parameters, $c_{β-α}$, $\\tan β$ and $m_{12}$. We will also compare these solutions with the corresponding solutions found for the case of double Higgs production. The solutions presented here for the matched coefficients summarize the non-decoupling effects from the heavy modes, $H$, $A$ and $H^\\pm$ in the scattering process $WW \\rightarrow hhh$ and provide the most relevant contributions to the cross section $σ(WW \\rightarrow hhh)$ that do not decrease as inverse powers of the heavy masses. In the last part, we will also discuss the numerical predictions of the cross section $σ(WW \\rightarrow hhh)$ in terms of the HEFT-matched coefficients. The focus of this discussion is set on the big gap between the HEFT-matched prediction and the SM prediction due to the non-decoupling behaviour occurring whenever misalignment is assumed in the 2HDM, i.e. for $c_{β-α} \\neq 0$. This big gap could serve as potential signals of the 2HDM heavy modes, $H$, $A$ and $H^\\pm$, at future high energy colliders, even if they are too heavy and cannot be produced at these colliders.","authors":"L. Barreiro, D. Domenech, D. Garcia-Tejada, M. Herrero, S. Salazar","nlinked":26,"nref":27,"src":"arXiv source","html":true},{"id":"","arxiv":"2611.17328","title":"A Dark-Sector Mass Flip-Flop Mechanism for the ANITA-IV Events","first":"Chattopadhyay","nauth":3,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[2737356]]. Also cites widely used network papers: [[2817040]]. Closest of your papers: [[3184726]] (coupling 0.01, 1 shared references). Closest network paper: [[3223724]] (coupling 0.05, 6 shared references).","score":19.4,"rank":24,"section":"new","parts":[0.48,0.02,0.14,0.0,0.0],"abstract":"ANITA-IV has observed four upward-going air-shower candidates just below the horizon, consistent with ultra-high-energy $ν_τ$, yet IceCube, despite its much larger exposure, has detected no neutrino events at such energies. We propose a dark-sector mass flip-flop mechanism that reconciles these observations. We consider an all-sky, monoenergetic flux of ultra-high-energy $N_1$, that is lighter than its partner $N_2$ and stable in vacuum. In our scenario, an ultralight scalar mediating interactions with Earth matter inverts the mass ordering of $N_1$ and $N_2$, allowing an incident $N_1$ to decay into $N_2$ deep underground. The resulting $N_2$ propagates unimpeded through matter and exits the Earth, where the decay $N_2 \\to N_1 Z'$ becomes kinematically allowed in the atmosphere, initiating an extensive air shower. At IceCube depths, neither $N_1\\to N_2 Z'$ nor $N_2\\to N_1 Z'$ is kinematically allowed, which explains the absence of analogous events at IceCube. Normalizing the $N_1$ flux to the four ANITA-IV events, we also predict three events during PUEO's first flight.","authors":"Dibya S. Chattopadhyay, Carlos A. Argüelles, Vedran Brdar","nlinked":45,"nref":47,"src":"arXiv source","html":true},{"id":"","arxiv":"2611.16686","title":"Next-to-leading-order QCD corrections to prompt $Υ(1S)$ pair hadroproduction","first":"He","nauth":3,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Closest network paper: [[2809347]] (coupling 0.02, 1 shared references). Shared topics: turn out.","score":18.9,"rank":25,"section":"new","parts":[0.45,0.0,0.07,0.0,0.21],"abstract":"Working at next-to-leading order in nonrelativistic-QCD factorization, we study prompt $Υ(1S)$ pair hadroproduction, including feed-down from the excited $Υ(2S)$ and $Υ(3S)$ states and focusing on the color singlet contributions, which are known to be dominant. Besides the integrated cross section $σ^{ΥΥ}$, we predict distributions in the invariant mass $m_{ΥΥ}$, transverse momentum $p_T^{ΥΥ}$, and rapidity separation $|Δy|$ of the $Υ(1S)$ pair, as well as the one in the transverse momentum $p_T^Υ$ of either $Υ(1S)$ meson, and compare them with measurements by the CMS Collaboration at the CERN LHC with center-of-mass energies $\\sqrt{s}=8$ and $13~\\mathrm{TeV}$ as far as they go. The QCD corrections to $σ^{ΥΥ}$ turn out to be mildly negative, with $K$ factors of about 0.9. By contrast, the differential cross sections receive $K$ factors as small as 0.6 and 0.2 at large values of $m_{ΥΥ}\\le 100$ GeV and $|Δy|\\le4$, respectively, and as large as 20 for large values of $p_T^Υ\\le30$ GeV. Our predictions agree well with the data, except in the outermost bins of $m_{ΥΥ}$ and $|Δy|$, where they fall short of the data, leaving room for contributions from double parton scattering as expected. Our analysis thus provides a first solid basis for the extraction of the key parameter $σ_{\\mathrm{eff}}$ of double parton scattering.","authors":"Zhi-Guo He, Xiao-Bo Jin, Bernd A. Kniehl","nlinked":25,"nref":25,"src":"arXiv source","html":false},{"id":"","arxiv":"2611.16276","title":"Probing the Molecular Nature of $D_{sJ}(2860)$ and $D_{s3}(2860)$ through Their Decays","first":"Lu","nauth":4,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Closest network paper: [[3193100]] (coupling 0.04, 32 shared references).","score":17.3,"rank":26,"section":"new","parts":[0.45,0.0,0.1,0.0,0.0],"abstract":"In this work, we investigate the molecular interpretations of $D_{sJ}(2860)$ and $D_{s3}(2860)$ by studying their strong decays within the effective Lagrangian approach. We consider two possible configurations for $D_{sJ}(2860)$: an $S$-wave $D_1K$ molecule and a $P$-wave $D^*K^*$ molecule, while treating $D_{s3}(2860)$ as a $P$-wave $D^*K^*$ molecule. By fitting the LHCb-measured angular distribution and decay widths in $B_s^0\\to\\bar{D}^0K^-π^+$, we determine the molecular coupling constants and cutoff parameter $Λ$. Using these parameters, we calculate the total decay widths and the ratios $R$ of the partial widths into the $D^*K$ and $DK$ channels. For $D_{sJ}(2860)$, the $S$-wave $D_1K$ assignment provides a slightly better description of the measured total width than the $P$-wave $D^*K^*$ assignment. However, the combined $D_1K$ and $D^*K^*$ assignments for $D_{sJ}(2860)$ and $D_{s3}(2860)$, respectively, are disfavored by the predicted $R_{D_{s3}(2860)}$, which exceeds the experimental upper limit. In contrast, assigning both states as $P$-wave $D^*K^*$ molecules yields good agreement with the measured $R_{D_{s3}(2860)}$ and predicts $R_{D_{sJ}(2860)}\\simeq 1.26$--$1.29$. These results favor the $P$-wave $D^*K^*$ molecular interpretation for both states, which can be further tested through future measurements of $R_{D_{sJ}(2860)}$.","authors":"Qing Lu, Dan Dan Feng, Cai Cheng, Yin Huang","nlinked":62,"nref":62,"src":"arXiv source","html":true},{"id":"3170368","arxiv":"2606.19428","title":"Cooling, conduction, and compact objects: Gravothermal evolution of dissipative self-interacting dark matter halos","first":"Schmidt","nauth":3,"year":2026,"cites":0,"role":"repl","note":"Closest of your papers: [[2787890]] (coupling 0.09, 10 shared references). Closest network paper: [[3214429]] (coupling 0.18, 39 shared references). Shared topics: dark matter.","score":17.2,"rank":27,"section":"replacement","parts":[0.0,0.27,0.52,0.0,0.13],"abstract":"Many proposed self-interacting dark matter (SIDM) models yield radiative processes that can dissipate energy. Understanding their impact on astrophysical objects through simulations and comparing the results with observations may thus constrain SIDM models. We systematically investigated how dissipation alters the gravothermal evolution of isolated SIDM halos by independently varying dissipation and heat conduction and identified potential observational signatures. We present the first extension of the $N$-body formalism for frequent small-angle self-interactions to include effective dissipation. We compared all results for isolated halos with a dissipative gravothermal fluid model to assess the validity and limitations of the latter. We find that dissipation qualitatively changes the gravothermal evolution of SIDM halos beyond simply accelerating collapse. Sufficiently strong central cooling can invert the usual role of heat conduction: the formation of an isothermal core is suppressed such that conduction remains directed inward throughout the evolution. Outer halo regions beyond the scale radius can cool efficiently rather than being heated by conduction, resulting in a larger region of mass infall and a less pronounced indentation between the core and the outer halo in the final density profile. These effects depend strongly on the cooling rate but are comparatively insensitive to the angular dependence of the self-interaction cross section. We further show that weakly dissipative self-interactions can explain the properties of the recently observed strong lens perturber in JVAS B1938+666 with significantly shorter evolution times or, equivalently, smaller cross sections compared to the elastic case. Our results open a new route to connecting halo structure and recently reported compact objects to dark-sector microphysics.","authors":"Ludwig D. Schmidt, Moritz S. Fischer, Mathias Garny","nlinked":66,"nref":76,"src":"INSPIRE","html":true},{"id":"","arxiv":"2611.16974","title":"Exploring the Pion Vector Form Factor Beyond the Physical Sheet","first":"Herren","nauth":3,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Closest network paper: [[3193100]] (coupling 0.03, 24 shared references).","score":17.1,"rank":28,"section":"new","parts":[0.45,0.0,0.09,0.0,0.0],"abstract":"Using analyticity and unitarity, we parametrise the pion vector form factor on the first and second Riemann sheets, below the inelastic $πω$ threshold. We fit this model-independent parametrisation to the available $τ^-\\toπ^-π^0ν_τ$ data from ALEPH, Belle, CLEO and OPAL, together with spacelike data from NA7 and JLab, and extract the pole position and couplings of the $ρ^\\pm$ along with the pion charge radius and low-energy $ππ$ scattering parameters. Our results are independent of external scattering input and agree with the literature; in particular, we find $M_{ρ^\\pm} = 762.07\\pm 0.63$ MeV and $Γ_{ρ^\\pm} = 143.62^{+0.79}_{-0.80}$ MeV. The parametrisation is publicly available in the EOS software.","authors":"Florian Herren, Fatemeh Nouri, Méril Reboud","nlinked":50,"nref":55,"src":"arXiv source","html":true},{"id":"3227703","arxiv":"2611.15158","title":"Novel method for measuring the isovector partner of X(3872)","first":"Tan","nauth":5,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Closest network paper: [[3193100]] (coupling 0.03, 21 shared references).","score":17.0,"rank":29,"section":"new","parts":[0.45,0.0,0.08,0.0,0.0],"abstract":"The predicted isovector partner of the $X(3872)$, denoted as $W_{c1}$, is expected to produce only a relatively weak structure near the charged $D \\bar{D}^*$ threshold, making its experimental identification challenging. In this work, we explore the triangle singularity (TS) mechanism as a means of enhancing the sensitivity to the $W_{c1}$ in the decays $B^0 \\to πK \\bar{D}^0 D^{*0}$. We investigate the $D_{s1}(2536) \\bar{D}^*$ triangle rescattering mechanism, incorporating the coupled-channel $D \\bar{D}^*$ scattering amplitudes obtained from the Lippmann-Schwinger equation. The interplay between the TS and the coupled-channel dynamics produces characteristic structures in the $K \\bar{D}^0 D^{*0}$ invariant mass distributions associated with the $X(3872)$ and its isovector partner $W_{c1}$. In particular, the charged-channel contribution exhibits a distinct structure sensitive to the nearby $W_{c1}$ pole. Our results demonstrate that the TS mechanism provides a promising way to probe the otherwise weak manifestation of the $W_{c1}$, offering a complementary experimental strategy for searching for this predicted state at Belle II and LHCb.","authors":"Qiu-Lin Tan, Mao-Jun Yan, Chun-Sheng An, Cheng-Rong Deng, Xiao-Hai Liu","nlinked":42,"nref":43,"src":"INSPIRE","html":true},{"id":"3227711","arxiv":"2611.15252","title":"Tau polarization, new physics and CP violation in $ν_τ$-nucleus hyperon production","first":"Hernández","nauth":3,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Closest network paper: [[2835155]] (coupling 0.03, 3 shared references).","score":17.0,"rank":30,"section":"new","parts":[0.45,0.0,0.08,0.0,0.0],"abstract":"Charged-current interactions of the $τ$ neutrino are the least constrained sector of the Standard Model (SM) flavour structure, and the polarisation of the produced $τ$ lepton probes new-physics (NP) couplings, including CP-violating ones. Hyperon and charmed-baryon production gives access to the $u\\to s$ and $d\\to c$ transitions, but any measurement would be made on nuclei, which calls for a proper treatment of nuclear effects. We therefore study the sequential reactions $ν_τ\\,{}^A Z\\toτ^-(\\toπ^-ν_τ)\\,Λ_c^+ X$ and $\\barν_τ\\,{}^A Z\\toτ^+ (\\toπ^+\\barν_τ)\\,ΛX$ within the impulse approximation. The energy and angular distributions of the pion, which encode the $τ$ polarization, are derived for an arbitrary nuclear hole spectral function. As for free nucleons, an azimuthal pion asymmetry with respect to the plane spanned by the neutrino and the outgoing baryon is shown to remain. This is a CP-odd observable that vanishes in the SM, so that a nonzero value would signal CP violation irrespective of the hadronic form factors. Local Fermi gas results for ${}^{16}$O show that nuclear effects lower the reaction thresholds but leave the pion distributions, and hence the polarization information, close to their free-nucleon form. For representative NP scenarios the predicted asymmetries are at the percent level or below, with a magnitude that, in the $Λ$ channel, depends strongly on the transition form factors.","authors":"E. Hernández, J. Nieves, J. E. Sobczyk","nlinked":42,"nref":46,"src":"INSPIRE","html":true},{"id":"3198461","arxiv":"2609.00660","title":"Mixing-angle sensitivity of inclusive $Ξ_{bc} $ and $Ω_{bc}$ lifetimes","first":"Cheng","nauth":3,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[3193100]]. Closest network paper: [[2169464]] (coupling 0.02, 4 shared references).","score":16.7,"rank":31,"section":"replacement","parts":[0.45,0.0,0.06,0.0,0.0],"abstract":"We study the inclusive lifetimes of $Ξ_{bc}^{+}$, $Ξ_{bc}^{0}$, and $Ω_{bc}^{0}$ with emphasis on the mixing between the spin-zero and spin-one $bc$-diquark configurations. The matrix elements are evaluated in both the homogeneous bag model (HBM) and the nonrelativistic quark model (NRQM). At the benchmark mixing angles $-23.0^\\circ$ for $Ξ_{bc}$ and $-23.5^\\circ$ for $Ω_{bc}$, the corresponding lifetime triplets are $(τ_{Ξ_{bc}^{+}},τ_{Ξ_{bc}^{0}},τ_{Ω_{bc}^{0}})=(0.421^{+0.098}_{-0.093}{}^{+0.007}_{-0.014},0.075^{+0.035}_{-0.017}{}^{+0.004}_{-0.001},0.223^{+0.074}_{-0.046}{}^{+0.018}_{-0.012})\\,\\mathrm{ps}$ in HBM and $(τ_{Ξ_{bc}^{+}},τ_{Ξ_{bc}^{0}},τ_{Ω_{bc}^{0}})=(0.367^{+0.076}_{-0.070}{}^{+0.001}_{-0.005},0.100^{+0.032}_{-0.014}{}^{+0.006}_{-0.001},0.229^{+0.066}_{-0.042}{}^{+0.017}_{-0.011})\\,\\mathrm{ps}$ in NRQM. The first errors are the fixed-angle uncertainties; the second are the envelopes from varying each mixing angle by $\\pm10^\\circ$ with all other inputs fixed. Relative to the unmixed spin-one reference points, the $Ξ_{bc}^{0}$ and $Ω_{bc}$ lifetimes decrease by approximately $17\\%$-$19\\%$. Neither the minimum nor the maximum of the central lifetime curves occurs at a pure $S_{bc}=0$ or $S_{bc}=1$ configuration; the extrema instead lie at mixed angles with $|φ_{\\cal B}|\\simeq27^\\circ$-$63^\\circ$. The two pure-spin cases alone are therefore insufficient to characterize the angular dependence.","authors":"Hai-Yang Cheng, Chia-Wei Liu, Fanrong Xu","nlinked":74,"nref":80,"src":"INSPIRE","html":true},{"id":"","arxiv":"2611.16576","title":"Low-lying doubly charmed strange baryons via QCD sum rules","first":"Yang","nauth":3,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Closest network paper: [[2101884]] (coupling 0.02, 1 shared references).","score":16.6,"rank":32,"section":"new","parts":[0.45,0.0,0.06,0.0,0.0],"abstract":"We systematically investigate the masses of the low-lying doubly heavy baryons and their $B^*(3/2^+)\\to B(1/2^+)γ$ radiative transitions within QCD sum rules and light-cone sum rules (LCSR). By constructing mixed interpolating currents, we obtain $M_{Ξ_{cc}}=3.62^{+0.14}_{-0.15}$ GeV, $M_{Ξ_{cc}^*}=3.72^{+0.14}_{-0.13}$ GeV, $M_{Ω_{cc}}=3.72^{+0.13}_{-0.15}$ GeV, and $M_{Ω_{cc}^*}=3.82^{+0.13}_{-0.15}$ GeV, together with their doubly bottom partners around $10.27$--$10.34$ GeV. The extracted masses are compatible with the observed $Ξ_{cc}$ and $Ω_{cc}$ states and predict hyperfine splittings of about $101^{+27}_{-11}$ MeV and $99^{+11}_{-12}$ MeV for the $Ξ_{cc}$ and $Ω_{cc}$ systems, respectively. Using these inputs, we derive the LCSR for the electromagnetic form factors and obtain radiative widths $Γ(Ξ_{cc}^{*++}\\toΞ_{cc}^{++}γ)=5.25^{+8.57}_{-3.62}$ keV, $Γ(Ξ_{cc}^{*+}\\toΞ_{cc}^{+}γ)=0.31^{+0.84}_{-0.25}$ keV, and $Γ(Ω_{cc}^{*+}\\toΩ_{cc}^{+}γ)=0.41^{+0.67}_{-0.30}$ keV, while the corresponding doubly bottom widths are at the $0.002$--$0.01$ keV level. We find that the magnetic-dipole contribution dominates, whereas the electric-quadrupole form factor is numerically small. The light- and heavy-quark photon-emission terms can interfere or enhance significantly, and the heavy-quark contribution cannot be neglected in radiative transitions. These results provide useful theoretical guidance for future searches for spin-$3/2$ doubly heavy baryons through radiative decay modes at LHCb, Belle II, and other experimental facilities.","authors":"Hui-Min Yang, Hua-Xing Chen, Xuan Luo","nlinked":50,"nref":50,"src":"arXiv source","html":true},{"id":"","arxiv":"2611.16827","title":"A unified reduced-mass parametrization of effective chromoelectric interactions in hadrons","first":"Liu","nauth":3,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Closest network paper: [[2750604]] (coupling 0.02, 1 shared references).","score":16.6,"rank":33,"section":"new","parts":[0.45,0.0,0.05,0.0,0.0],"abstract":"We construct a unified effective mass relation in which a common reduced-mass function describes the flavor dependence of chromoelectric pair contributions, with explicit color factors connecting $q\\bar q$ and $qq$ pairs. After subtracting fixed spin-weighted chromomagnetic contributions, we jointly fit fourteen spin-averaged meson and baryon masses using constituent quark masses and an additive constant shared by both sectors, obtaining a root-mean-square (RMS) residual of 4 MeV. The fitted saturating form connects the nearly saturated light-flavor contribution with increasing attraction in the heavy-flavor region. In the common saturation limit, the leading chromoelectric contribution acts as a common mass shift for each constituent and can be absorbed into effective constituent masses; the residual pair term accounts for the flavor dependence away from saturation. With the chromomagnetic interaction included, this single parameter set reproduces the ground-state meson and baryon spectra and yields predictions for multiply heavy baryons outside the calibration set. By diagonalizing the sum of the chromoelectric and chromomagnetic mass matrices, we further obtain the ground-state spectra of $cc\\bar c\\bar c$, $bb\\bar b\\bar b$, and $bc\\bar b\\bar c$. The fully charmed tensor mass is ${6505}{(9)(9)}$ MeV, close to recent lattice QCD results, while the upper scalar mass of {${6562}{(9)(12)}$} MeV lies in the mass region near $X(6600)$. The tetraquark masses remain relatively stable under the examined variations of the $qq$ chromomagnetic couplings. The relative $S$-wave rearrangement-decay weights obtained from color--spin recoupling can be used to identify favored decay channels under the stated spatial-overlap approximation.","authors":"Wen-Nian Liu, Duo-Jie Jia, Fu-Quan Dou","nlinked":60,"nref":63,"src":"arXiv source","html":true},{"id":"","arxiv":"2611.16508","title":"Probing the internal structure of the $ΩΩ$ dibaryon via its weak decays and lifetime","first":"Lü","nauth":5,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Closest network paper: [[3193100]] (coupling 0.01, 17 shared references).","score":16.4,"rank":34,"section":"new","parts":[0.45,0.0,0.04,0.0,0.0],"abstract":"The weak decay properties of the $ΩΩ$ dibaryon play a crucial role in probing its internal structure and guiding experimental efforts. Using an effective Lagrangian approach, we systematically study its weak decays and lifetime by computing the widths for both three- and four-body final states, with amplitudes receiving contributions from single- and double-weak-vertex diagrams. We investigate the dependence of the decay properties on the binding energy ranging from a few MeV to over $100$ MeV. For weakly bound states ($E_b = 1$ and $20$ MeV), the three-body channels $ΩΛ\\bar{K}$, $ΩΞπ$, and $ΞΞ\\bar{K}$ exhaust essentially the entire width, with the largest channel shifting from $ΩΛ\\bar{K}$ at $E_b=1$ MeV to $ΩΞπ$ at $E_b=20$ MeV. For deeply bound states ($E_b = 100$ and $120$ MeV), the $ΩΛ\\bar{K}$ channel is forbidden, and the dominant modes are $ΩΞπ$ and $ΞΞ\\bar{K}$, while the double-weak-vertex channel $Λ\\bar{K} Λ\\bar{K}$ is found to be negligibly small. As the binding energy increases, the total lifetime extends from the order of $10^{-10}~\\mathrm{s}$ to $10^{-9}~\\mathrm{s}$. These distinct differences in decay patterns and lifetimes provide valuable theoretical reference values for experimental searches at RHIC and the LHC, and offer a clear discriminator between the compact hexaquark and weakly bound molecular interpretations.","authors":"Qi-Fang Lü, Deng-Wang Tang, Yu-Bing Dong, Peng-Nian Shen, Jia-Jun Wu","nlinked":98,"nref":98,"src":"arXiv source","html":true},{"id":"3184917","arxiv":"2607.28517","title":"Dynamical flattening of halo density cusps by Q-ball dark matter","first":"Libanov","nauth":2,"year":2026,"cites":0,"role":"repl","note":"Closest of your papers: [[2964960]] (coupling 0.07, 8 shared references). Closest network paper: [[3113487]] (coupling 0.14, 17 shared references). Shared topics: dark sector, early universe, dark matter.","score":15.6,"rank":35,"section":"replacement","parts":[0.0,0.19,0.4,0.0,0.4],"abstract":"Cold, collisionless dark matter successfully explains a wide range of observations, including the formation of large-scale structure. Nevertheless, tensions remain on small, galactic scales, most notably the cusp-core, or inner-mass-deficit, problem and the diversity of inner rotation-curve shapes and central densities at fixed halo mass. These observations suggest that additional dark-sector physics may affect the inner structure of halos, although no generally accepted explanation has yet emerged. Here, making use of a toy but representative model, we investigate how interacting dark-matter Q-balls -- non-topological solitons stabilized by a conserved charge -- modify halo centers and generate a diversity of inner profiles. Our calculations include merger-induced mass and kinetic-energy losses, elastic heat transport, and the gravitational readjustment of the halo; flattening and later recontraction can both occur. Produced in the early Universe in the dark sector, these Q-balls grow in the dense central regions of halos, while their interaction cross section decreases as the soliton mass increases. This process operates preferentially in halo centers, converting part of the rest-mass energy stored in massive Q-balls into relativistic dark-sector particles and thereby modifying the inner mass-density profile. The resulting density-dependent energy loss competes with heat transport and halo response. An ensemble of initial assembly conditions yields very different final densities at fixed microphysics, although neither a universal constant-density core nor a statistical fit to the observed population is established.","authors":"Alexander Libanov, Sergey Troitsky","nlinked":61,"nref":65,"src":"INSPIRE","html":true},{"id":"","arxiv":"2611.16845","title":"Dilution of cosmological relics and gravitational waves from a supercooled electroweak phase transition in classically scale-invariant models","first":"Chaudhuri","nauth":1,"year":2026,"cites":0,"role":"today","note":"Closest of your papers: [[1828504]] (coupling 0.02, 3 shared references). Closest network paper: [[2928725]] (coupling 0.16, 29 shared references). Shared topics: viable region, dark matter, gravitational wave.","score":14.4,"rank":36,"section":"new","parts":[0.0,0.06,0.45,0.0,0.58],"abstract":"In classically scale-invariant extensions of the Standard Model the electroweak scale is generated radiatively, and the absence of tree-level mass terms keeps the symmetric phase metastable down to very low temperatures. We study the resulting phase transition in a model with a real singlet and several additional scalars coupled to the Higgs doublet and to the singlet, in which electroweak symmetry is broken along a Gildener-Weinberg flat direction and a light dilaton appears in the spectrum. Computing the bounce along the two-dimensional tunnelling path and following the false-vacuum fraction through percolation and completion, we find that the transition proceeds in a single, strongly supercooled step and completes above the QCD scale over a region of parameter space consistent with Higgs measurements and perturbativity. Despite the strong supercooling the transition is fast. The bubble walls reach their terminal velocity early, and almost all of the released vacuum energy goes into bulk motion of the plasma, which thermalises and reheats the universe close to the scale set by the vacuum energy. The resulting entropy injection dilutes pre-existing relics by up to several orders of magnitude. It raises the baryon asymmetry that must be present before the transition, relaxes the unitarity bound on the mass of thermal dark matter, and suppresses earlier gravitational-wave backgrounds. If the acoustic description of gravitational-wave production extends to this regime, the signal peaks in the millihertz band, follows an approximate scaling relation between peak amplitude and frequency set by the vacuum energy, and would be observed by LISA throughout the viable region. The results depend on the multiplicity of the new scalars and their Higgs portal coupling at leading order through a single combination, and require the singlet scale to lie at or above the TeV scale.","authors":"Arnab Chaudhuri","nlinked":111,"nref":113,"src":"arXiv source","html":true},{"id":"3189945","arxiv":"2608.10123","title":"Heavy neutral leptons beyond the BBN bound: probing the lepton asymmetry of the Universe","first":"Akita","nauth":3,"year":2026,"cites":0,"role":"repl","note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2627241]] (coupling 0.03, 4 shared references). Closest network paper: [[2954192]] (coupling 0.12, 9 shared references). Shared topics: big bang nucleosynthesis, gravitational wave.","score":13.9,"rank":37,"section":"replacement","parts":[0.06,0.1,0.35,0.0,0.38],"abstract":"Hadronically decaying particles with lifetimes $τ\\gtrsim0.02\\,{\\rm s}$ are excluded by Big Bang Nucleosynthesis almost independently of their abundance: the mesons from their decays convert protons into neutrons faster than the reverse, and helium is overproduced. For heavy neutral leptons (HNLs), this blankets the couplings the upcoming accelerator searches can reach. We propose a scenario with large lepton flavor asymmetries in which HNLs evade it. A Dirac HNL decays into $π^+$ and its antiparticle into $π^-$, so an asymmetry between the two populations injects an excess of $π^+$, which converts the neutrons back to their standard abundance, while a cancellation between the asymmetries and the HNL decays keeps the shift in $N_{\\rm eff}$ small. This opens the parameter space with $m_l+m_π\\lesssim m_N\\lesssim1\\,{\\rm GeV}$ and $τ_N\\lesssim1\\,{\\rm s}$, including a substantial region within the reach of SHiP. A discovery there, combined with the BBN and CMB observables, would fix the primordial flavor asymmetries up to one remaining direction. The relic neutrino background and gravitational waves from the QCD transition epoch may probe that direction, and with it the lepton asymmetry of the Universe.","authors":"Kensuke Akita, Maksym Ovchynnikov, Vsevolod Syvolap","nlinked":83,"nref":85,"src":"INSPIRE","html":true},{"id":"3227642","arxiv":"2611.14669","title":"Lepton flavor violation at mass dimension eight","first":"Heeck","nauth":2,"year":2026,"cites":0,"role":"today","note":"Closest of your papers: [[1249404]] (coupling 0.06, 11 shared references). Closest network paper: [[3096515]] (coupling 0.11, 12 shared references). Shared topics: lepton flavor violation.","score":13.1,"rank":38,"section":"new","parts":[0.0,0.19,0.32,0.0,0.26],"abstract":"Operators that violate lepton flavor first arise at mass dimension $d=5$ in the Standard Model Effective Field Theory, while charged lepton flavor violation first appears at $d=6$, inducing the typical exotic particle decays currently probed by experiments. Operators at $d=8$ carry the same quantum numbers as those at $d=6$ and are thus seemingly doomed to be subleading corrections. After (re)deriving the complete set of tree-level UV completions for lepton-flavor-violating $d\\leq 8$ operators via heavy scalars and fermions, we show that some UV completions exclusively generate $d=8$ flavor violation at tree level, with $d=6$ contributions suppressed by loop factors and, in some cases, unrelated couplings. Such accidentally protected $d=8$ scenarios enlarge the set of testable lepton-flavor-violating operators.","authors":"Julian Heeck, Mikheil Sokhashvili","nlinked":54,"nref":57,"src":"INSPIRE","html":true},{"id":"","arxiv":"2611.15865","title":"Toward the minimal set of states in axion superradiance","first":"Cannizzaro","nauth":3,"year":2026,"cites":0,"role":"today","note":"Closest of your papers: [[1941263]] (coupling 0.03, 8 shared references). Closest network paper: [[2669622]] (coupling 0.22, 25 shared references).","score":12.6,"rank":39,"section":"new","parts":[0.0,0.11,0.63,0.0,0.0],"abstract":"Observational searches for black hole superradiance require predicting the growth and evolution of quasi-bound states on astrophysical timescales. For axions (and most light spin-0 particles), self-interactions efficiently redistribute energy and angular momentum from the fastest-growing superradiant states into higher-order, more weakly bound states, and do so on short timescales. This has made it difficult to compute even the most mundane of observables across large regions of parameter space. In this work we extend the study of self-interacting systems, following the evolution of nearly 300 coupled quasi-bound states. We evolve a $10\\,M_\\odot$ black hole over a Salpeter timescale, and $10^4$ and $10^8\\,M_\\odot$ black holes over a Gyr, identifying for each axion mass the minimal set of states required to describe the evolution of the black hole and the shape of the superradiant cloud. In most cases the evolution converges as increasingly weakly bound states are added; we identify no less than 203 distinct quasi-bound states that play a role in establishing this convergence. In small regions of parameter space, however, we find no converged solution, and show that broad resonant features and nearly degenerate scattering rates redistribute mass to bound states with principal quantum numbers $n \\gtrsim 45$. We further show that the cloud can extend to radii orders of magnitude larger than usually assumed, that gravitational-wave level transitions can prevent the growth of superradiant states, and that both the gravitational-wave spectrum and the interaction with the environment are far richer than previously appreciated.","authors":"Enrico Cannizzaro, Thomas F. M. Spieksma, Samuel J. Witte","nlinked":80,"nref":85,"src":"arXiv source","html":true},{"id":"","arxiv":"2611.16604","title":"Extended $SO(10)$-inspired leptogenesis","first":"Bari","nauth":2,"year":2026,"cites":0,"role":"today","note":"Closest of your papers: [[3184726]] (coupling 0.02, 4 shared references). Closest network paper: [[2688973]] (coupling 0.10, 23 shared references). Shared topics: dirac neutrino mass, neutrino mass, seesaw model.","score":12.2,"rank":40,"section":"new","parts":[0.0,0.06,0.29,0.0,0.61],"abstract":"We consider seesaw models with hierarchical Dirac neutrino masses. We show that, barring well known fine-tuned crossing level solutions and given current low energy neutrino experimental data, these always lead to a very hierarchical heavy neutrino spectrum. If the Dirac neutrino masses are assumed not to significantly differ from the up-quark masses, then the intermediate seesaw neutrino ($N_2$) mass falls in the correct range for its decays to explain the matter-antimatter asymmetry of the universe via ($N_2$-)leptogenesis, while the lightest seesaw neutrino decays give a negligible contribution. We show that these conclusions are valid independently of any additional condition on the Dirac neutrino mass matrix. In this way we extend the usual $SO(10)$-inspired leptogenesis scenario, assuming the mismatch between neutrino and charged lepton Dirac mass matrices at the level of the CKM matrix. We find that solutions for inverted ordered neutrino masses become viable. We still find a lower bound on the lightest neutrino mass, $m_1 \\gtrsim 10^{-5}\\,{\\rm eV}$, but this is relaxed by two orders of magnitude. We also consider the special subset of solutions realising strong thermal leptogenesis within this extended scenario, finding that inverted ordering remains incompatible. Our results show how the emergence of the $N_2$-leptogenesis scenario within seesaw models is much more general than thought so far.","authors":"Pasquale Di Bari, Xubin Hu","nlinked":75,"nref":95,"src":"arXiv source","html":true},{"id":"","arxiv":"2611.16785","title":"Bayesian Inference of Fermionic Dark Matter Admixed Neutron Stars Informed by Galaxy Cluster Constraints","first":"Das","nauth":2,"year":2026,"cites":0,"role":"today","note":"Closest of your papers: [[2787890]] (coupling 0.03, 6 shared references). Closest network paper: [[2843822]] (coupling 0.05, 5 shared references). Shared topics: fermionic dark matter, dark matter mass, dark matter.","score":11.4,"rank":41,"section":"cross","parts":[0.0,0.11,0.14,0.0,0.61],"abstract":"Self-interacting dark matter is constrained on galactic and cluster scales by its elastic scattering cross section per unit mass, $σ/m_χ\\sim 0.1-10\\ {\\rm cm^2/g}$. We incorporate this cross section into the equation of state of an asymmetric, self-interacting fermionic dark matter component and perform a Bayesian inference of dark matter admixed neutron stars in the two-fluid framework at $σ/m_χ= 0.1$, $1$ and $10\\ {\\rm cm^2/g}$. Seven nuclear matter parameters are sampled together with the dark particle mass and mass fraction, and confronted with nuclear theory and neutron star observations. The nuclear sector and the global observables are statistically indistinguishable across the whole range of cross sections, while the data constrain the dark matter mass to $m_χ\\simeq 1.45-1.88$~GeV and its mass fraction to $f_χ\\simeq 0.05-0.09$, depending on the cross section. Finally, comparing runs built from the same parameter draws, so that only the cross section differs, we find that it does change the baryonic radius appreciably, but only for light dark matter, a region the astrophysical data largely disfavor. The self-interaction is therefore not too weak to be seen; however its effect is hidden in the region of parameter space that the present observational data already disfavor.","authors":"H. C. Das, J. B. Wei","nlinked":83,"nref":85,"src":"arXiv source","html":true},{"id":"","arxiv":"2611.17204","title":"Probing Ultralight Higher-spin Dark Matter using Stellar Kinematics of Dwarf Galaxies","first":"Singh","nauth":4,"year":2026,"cites":0,"role":"today","note":"Closest of your papers: [[1941263]] (coupling 0.04, 9 shared references). Closest network paper: [[2719600]] (coupling 0.15, 14 shared references). Shared topics: dark matter.","score":11.1,"rank":42,"section":"cross","parts":[0.0,0.12,0.43,0.0,0.13],"abstract":"Stellar kinematics of the classical Milky Way dwarf galaxies provide a powerful probe of the dark matter distribution and its underlying physics. In this article we use them to explore ultralight dark matter (ULDM) with a non-zero spin. Numerical simulations in the non-relativistic limit have shown that, for the same initial conditions, higher-spin ULDM forms a more diffuse soliton core at the galactic center, with a smoother transition to the NFW outer region, than scalar ULDM. We introduce a generalized parametrization of the ULDM halo profile that captures these spin-induced effects through three additional parameters: the normalization of the central core density, the exponent of the core-halo mass relation, and the radius of the transition to the NFW envelope. Applying this profile in a Bayesian analysis of six classical dwarf galaxies, we find halo masses in the range $10^{8.5}$-$10^{9.5}\\,M_\\odot$ and, from each galaxy individually, a particle mass $m \\gtrsim 3\\times10^{-21}$ eV. The core-halo exponent and the transition radius are consistent with their scalar values. The core-density normalization is also consistent with the scalar value in four galaxies and prefers a core denser than a scalar soliton in Fornax, while the factor-of-several suppression expected for higher-spin cores is not excluded by any single galaxy. The data therefore show no preference for the more diffuse cores of higher-spin ULDM, but do not yet rule them out.","authors":"Praniti Singh, JiJi Fan, Savvas M. Koushiappa
