<script>
const RAW = {"n":[{"id":"3184726","arxiv":"2607.27325","title":"Seesaw Cosmology","first":"Bernal","nauth":3,"year":2026,"cites":0,"role":"repl","note":"You are an author. Co-authors of yours: Bernal, Fong. Cites your papers: [[2663002]], [[2627241]], [[2787444]]. Cites 13 network papers: [[3204438]], [[3156721]], [[2820703]], [[2945961]], [[2866569]], [[2904433]]…. Also cites widely used network papers: [[2817040]]. Closest of your papers: [[3184726]] (coupling 1.00, 71 shared references). Closest network paper: [[3204438]] (coupling 0.63, 44 shared references). Shared topics: inflaton decays.","score":96.3,"rank":1,"section":"replacement","parts":[1.0,1,1,1.0,0.63],"abstract":"We study perturbative reheating in which the inflaton transfers its energy to the Standard Model through right-handed neutrinos (RHNs) responsible for light-neutrino masses via the type-I seesaw mechanism. We refer to the resulting nonstandard thermal history as $seesaw$ $cosmology$. When produced relativistically and sufficiently long lived, the RHNs generate a characteristic sequence of inflaton, relativistic-RHN, nonrelativistic-RHN, and Standard Model radiation domination. We solve the Boltzmann system while retaining the production-time dependence of the nonthermal RHN distribution and its relativistic-to-nonrelativistic transition. The Standard Model temperature rapidly approaches a plateau during inflaton domination and subsequently scales as $a^{-1/4}$ and $a^{-3/8}$ during relativistic- and nonrelativistic-RHN domination, respectively. We investigate the implications of seesaw cosmology for dark-matter production. Direct production through inflaton decays can be enhanced relative to conventional reheating by a factor of order $m_φ/(2m_N)$, while ultraviolet freeze-in exhibits the critical temperature powers $p = 12$ and $20$, leading to potentially large contributions before the final radiation-dominated era. Seesaw cosmology therefore connects neutrino-mass generation, the pre-BBN thermal history and phenomena such as dark-matter production and baryogenesis.","authors":"Nicolás Bernal, Chee Sheng Fong, Óscar Zapata","nlinked":71,"nref":72,"src":"INSPIRE","html":true},{"id":"3096843","arxiv":"2601.00436","title":"Anatomy of RHN DM relic in the vanilla scotogenic neutrino mass model","first":"Sahoo","nauth":3,"year":2026,"cites":0,"role":"repl","note":"Cites your papers: [[1413755]], [[1294681]]. Cites 15 network papers: [[3070024]], [[3096515]], [[2134261]], [[2514136]], [[3084425]], [[2638716]]…. Also cites widely used network papers: [[2817040]]. Closest of your papers: [[3094526]] (coupling 0.10, 16 shared references). Closest network paper: [[3096843]] (coupling 1.00, 72 shared references). Shared topics: freeze-in mechanism, dm relic, neutrino oscillation data, dark matter mass, lepton flavor violation.","score":68.6,"rank":2,"section":"replacement","parts":[1.0,0.31,1,0.0,0.95],"abstract":"The scotogeneic neutrino mass models are very popular choices to generate light neutrino masses via radiative mechanism. In these models, the particles running in the loop are distinguished from the standard model due to an imposed $\\mathcal{Z}_2$ symmetry under which the loop particles are odd. Therefore, the lightest particle running in the loop can be a viable dark matter candidate. In this paper, we revisit the minimal scotogenic neutrino mass model and study the anatomy of right handed neutrino (RHN) DM relic, taking into account contributions from self-annihilation, co-annihilation, conversion-driven processes, as well as production via the freeze-in mechanism. We impose the constraints from direct detection and collider searches of DM including anomalous magnetic moment of muon, charged lepton flavor violation and low-energy neutrino oscillation data to show that the lightest RHN can be a viable DM in the mass range: $M_{h}/2\\lesssim M_{\\rm DM}\\lesssim2000 {\\rm GeV}$ (thermal DM) and $0.1 ~{\\rm GeV}\\lesssim M_{\\rm DM}\\lesssim 1000 {\\rm GeV}$ (non-thermal DM), where $M_h$ denotes the Standard Model Higgs mass and $M_{\\rm DM}$ is the RHN dark matter mass. We also find the displaced vertex signatures of long lived particles which can be probed at future colliders.","authors":"Sujit Kumar Sahoo, Narendra Sahu, Vicky Singh Thounaojam","nlinked":72,"nref":72,"src":"INSPIRE","html":true},{"id":"3217464","arxiv":"2610.29967","title":"Gravitational Waves from New Inflation","first":"Kitajima","nauth":3,"year":2026,"cites":0,"role":"today","note":"Cites your papers: [[2663002]], [[2627241]]. Cites 12 network papers: [[3198665]], [[3196194]], [[3113263]], [[3147101]], [[3144756]], [[3096852]]…. Closest of your papers: [[2787444]] (coupling 0.12, 5 shared references). Closest network paper: [[3217464]] (coupling 1.00, 74 shared references). Shared topics: production mechanism.","score":63.6,"rank":3,"section":"new","parts":[1.0,0.41,1,0.0,0.13],"abstract":"Gravitational waves provide one of the most powerful observational probes for discriminating among inflationary models. In particular, it has recently become clear that the high-frequency gravitational-wave spectrum encodes a wealth of information about the properties of the inflaton and the post-inflationary dynamics. In this paper, we present the first comprehensive prediction of the complete gravitational-wave spectrum in the new inflation scenario, a prototypical realization of small-field inflation, incorporating all known production mechanisms including both the classical and quantum sources.","authors":"Naoya Kitajima, Kamil Mudrunka, Kazunori Nakayama","nlinked":74,"nref":74,"src":"INSPIRE","html":true},{"id":"3217357","arxiv":"2610.29543","title":"Detectable Dark Matter Freeze-in via Low Reheating","first":"Alagappan","nauth":1,"year":2026,"cites":0,"role":"today","note":"Cites your papers: [[2856850]]. Cites 3 network papers: [[2935590]], [[2673377]], [[2795517]]. Closest of your papers: [[3130296]] (coupling 0.07, 11 shared references). Closest network paper: [[3217357]] (coupling 1.00, 49 shared references). Shared topics: relic density, direct detection, dark matter.","score":60.1,"rank":4,"section":"new","parts":[0.94,0.22,1,0.0,0.55],"abstract":"This work focuses on freeze-in production of dark matter (DM) during low reheating, where the latter arises from the decay of inflatons leading to a non-adiabatic matter-dominated era. Under freeze-in, DM comoving yield is inversely proportional to Hubble, and during matter domination, as Hubble increases, the coupling, keeping the DM interaction with SM, should be enhanced to have relic density $Ω_{DM}\\simeq0.12$, making DM potentially vulnerable to direct detection searches. A renormalizable Yukawa-like Lagrangian is considered for DM interaction with a singlet electron $e$, and a BSM parent particle $P$. With the decay being the dominant freeze-in production channel, the required coupling enhancement is calculated with the aid of freeze-in Boltzmann equation. Dealing with freeze-in, the higher coupling could thermalize the feebly interacting particles, and this places an upper bound on coupling. The coupling has been found to be sensitive to the vacuum energy of the inflaton during the inflationary phase. Keeping this vacuum energy at the upper bound from {\\tt planck}, the model fails to feature any detectable direct detection signals even at a reheating temperature of BBN. The findings of this thesis then show that, only under low reheating and low inflationary vacuum energy, the DM-electron cross sections become high enough to be detectable in near-future direct detection searches. However, the proposed model becomes non-perturbative near the direct detection exclusion limits.","authors":"Sadayappan Alagappan","nlinked":49,"nref":76,"src":"INSPIRE","html":true},{"id":"3203037","arxiv":"2609.13438","title":"Semi-visible Jets from Sneaky Dark Matter","first":"Kar","nauth":4,"year":2026,"cites":0,"role":"repl","note":"Cites your papers: [[2787890]]. Cites 2 network papers: [[2851201]], [[2750604]]. Closest of your papers: [[2964960]] (coupling 0.02, 3 shared references). Closest network paper: [[3203037]] (coupling 1.00, 60 shared references). Shared topics: dark matter.","score":49.7,"rank":5,"section":"replacement","parts":[0.89,0.08,1,0.0,0.13],"abstract":"In this paper, we compare two different ways of generating semi-visible jet signature in non-resonant production mode, and flag the potential advantages of the new generation approach we propose. In addition, we suggest a more efficient matrix element to parton shower matching configuration for this hadronic final state signature. Finally, we perform a reinterpretation study of the ATLAS search for t-channel semi-visible jet production and obtain collider limits on the sneaky DM scenario.","authors":"Deepak Kar, Christiane Scherb, Pedro Schwaller, Sukanya Sinha","nlinked":60,"nref":63,"src":"INSPIRE","html":true},{"id":"3217345","arxiv":"2610.29335","title":"Heavy Pseudo-Dirac Doublet Dark Matter and Non-Thermal Leptogenesis in Light of the LZ Event","first":"Ibe","nauth":2,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3201080]]. Closest of your papers: [[3184726]] (coupling 0.07, 12 shared references). Closest network paper: [[3202840]] (coupling 0.35, 29 shared references). Shared topics: during reheating, relic abundance, thermal relic, dark matter.","score":44.5,"rank":6,"section":"new","parts":[0.45,0.19,1,0.0,0.81],"abstract":"Motivated by the recent LZ candidate nuclear-recoil event, we study pseudo-Dirac electroweak doublet dark matter in the mass range $10^2$--$10^4\\,\\mathrm{TeV}$, where bounds from searches for neutrinos produced by dark matter annihilation in the Sun can be evaded. To suppress the excessive thermal relic abundance, we consider freeze-out during inflaton domination followed by entropy production during reheating. We examine whether this cosmological history can also accommodate non-thermal leptogenesis. Our analysis includes dark matter production through the emission of virtual electroweak gauge bosons in right-handed-neutrino decays and through thermalization cascades. Our estimates suggest that the two scenarios can be reconciled if dark matter pair emission in right-handed-neutrino decays is kinematically forbidden and cascade production is sufficiently suppressed. Such a realization, however, requires enhanced CP violation, typically involving fine-tuning in the seesaw mechanism or the right-handed-neutrino mass spectrum.","authors":"Masahiro Ibe, Jun Miyamoto","nlinked":96,"nref":98,"src":"INSPIRE","html":true},{"id":"3217265","arxiv":"2610.28731","title":"Simulation-Informed High-Velocity Dark Matter in the Effective Theory of Direct Detection","first":"Zhang","nauth":4,"year":2026,"cites":0,"role":"today","note":"Cites your papers: [[3130296]]. Closest of your papers: [[3130296]] (coupling 0.02, 4 shared references). Closest network paper: [[3217265]] (coupling 1.00, 128 shared references). Shared topics: dm mass, direct detection, dark matter.","score":43.8,"rank":7,"section":"new","parts":[0.63,0.06,1,0.0,0.47],"abstract":"The interpretation and reach of direct detection (DD) experiments depend sensitively on the local dark matter (DM) velocity distribution, particularly its high-velocity tail. This tail is crucial for elastic scattering at low DM masses or large momentum transfers, and for inelastic upscattering, where additional kinetic energy is needed to overcome the mass splitting. In practice, however, phenomenological studies typically rely either on the Standard Halo Model (SHM) or, when an enhanced high-velocity tail contributes to the scattering rate, on the single simulation that includes a large Magellanic Cloud (LMC) analogue, Au-25, whose debris reaches ~ 950\\kms. In this work, we instead build on a previously presented empirically-motivated reconstruction method, to construct the local DM velocity distribution, using stellar kinematics from the Gaia space telescope. We combine this reconstructed Milky Way component with the best LMC analog in the FIRE-2 simulations, and find no local DM faster than ~ 900\\kms. We compare the resulting distribution with the two commonly used benchmarks, the SHM and Au-25. We then study how these different velocity distributions affect the interpretation of DD searches across all operators of the non-relativistic effective field theory of DM--nucleon interactions, for both elastic and inelastic DM. As an illustrative application, we consider the high-energy event observed in the LUX-ZEPLIN extended search. Requiring the event to remain compatible with the absence of signal in the surrounding energy sidebands, we observe the inferred inelastic DM mass splitting can be shifted by up to $\\sim 130$~keV depending on the assumed high-velocity tail. Higher-resolution simulations of the high-velocity DM population reaching the detector will therefore be crucial for interpreting a future signal and setting robust limits on DM interactions.","authors":"Xiuyuan Zhang, Gonzalo Herrera, Andreas Thoyas, Lina Necib","nlinked":128,"nref":146,"src":"INSPIRE","html":true},{"id":"3175104","arxiv":"2606.31629","title":"Ultralight dark matter mixed with primordial black holes","first":"Yang","nauth":1,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[2795517]]. Closest of your papers: [[2826987]] (coupling 0.06, 8 shared references). Closest network paper: [[3141847]] (coupling 0.11, 14 shared references). Shared topics: primordial black hole, dark matter candidate, dark matter.","score":31.3,"rank":8,"section":"replacement","parts":[0.45,0.18,0.31,0.0,0.55],"abstract":"Dark matter candidates span many orders of magnitude in mass, from ultralight bosonic fields to massive compact objects. In this work, we connect these two extremes by investigating ultralight dark matter (ULDM) mixed with primordial black holes (PBHs). We study mixed ULDM-PBH halos by separating the continuum PBH contribution from the shot-noise fluctuation generated by discrete PBHs. The continuum contribution enters the averaged Schrödinger-Poisson background, while the discreteness contribution is treated as a perturbation that induces ULDM eigenmode transitions and soliton heating. The two contributions have distinct parametric dependencies: continuum effects scale with PBH fraction, whereas discreteness-driven transition rates scale with the product of PBH fraction and individual PBH mass in the perturbative regime. For a fiducial mixed halo with ULDM particle mass $10^{-22}\\,\\mathrm{eV}$, virial mass of order $10^{10}\\,M_{\\odot}$, and PBH fraction $1\\%$, the continuum PBH component modifies the background density, gravitational potential, and low-lying ULDM eigenvalues only at the sub-percent level. Nevertheless, this percent-level continuum PBH contribution produces a tens-of-percent response in the coherent soliton region, changing the radial mode participation by about $20\\%$. For stellar-mass PBHs, the discrete shot-noise fluctuation induces extremely slow ULDM mode transitions, with the fastest low-lying multiplet transition having a timescale of order $10^9\\,\\mathrm{Gyr}$ for solar-mass PBHs. In this regime, the leading PBH effect is the continuum contribution, while discrete PBH shot noise is dynamically negligible on galactic timescales.","authors":"Xing-Yu Yang","nlinked":60,"nref":61,"src":"INSPIRE","html":true},{"id":"3217255","arxiv":"2610.28790","title":"New CP-violating sources beyond the reach of EDMs","first":"Keus","nauth":1,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[2860407]]. Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1402978]] (coupling 0.03, 2 shared references). Closest network paper: [[2860407]] (coupling 0.09, 7 shared references).","score":23.6,"rank":9,"section":"new","parts":[0.48,0.09,0.27,0.0,0.0],"abstract":"The Standard Model does not contain sufficient amount of CP violation to account for the observed baryon asymmetry of the universe. Beyond Standard Model scenarios that aim to explain this asymmetry introduce new sources of CP violation, but these generically feed into electric dipole moments (EDMs), which are severely constrained by experiment. We indentify a new class of CP-violating sources that cannot generate EDMs directly: EDM operators are C conserving and P violating, whereas CP violation introduced here is, by construction, C violating and P conserving. We give a concrete model realisation accommodating such sources and discuss their relevance for baryogenesis.","authors":"Venus Keus","nlinked":61,"nref":76,"src":"INSPIRE","html":true},{"id":"3217379","arxiv":"2610.29598","title":"Electromagnetic multipoles of Majorana spin-3/2 dark matter particles and implications for direct detection","first":"Ibarra","nauth":2,"year":2026,"cites":0,"role":"today","note":"Co-authors of yours: Ibarra. Closest of your papers: [[1413755]] (coupling 0.06, 3 shared references). Closest network paper: [[3152711]] (coupling 0.09, 6 shared references). Shared topics: direct detection, dark matter particle, direct detection experiment, nuclear recoil, dark matter.","score":19.9,"rank":10,"section":"new","parts":[0.0,0.16,0.27,0.5,0.62],"abstract":"We investigate the electromagnetic interactions of Majorana spin-3/2 dark matter and their implications for direct detection experiments. We derive model independent constraints on the three electromagnetic multipole moments of the spin-3/2 dark matter allowed by the gauge and Lorentz-invariances from the non-observation of dark matter induced nuclear recoils in direct detection experiments. We then calculate the expected values of the multipole moments in two concrete particle physics scenarios: the gravitino in supergravity models, and a simplified model where a spin-3/2 particle interacts with an electrically charged spin-1/2 fermion and a vector boson.","authors":"Alejandro Ibarra, Onur Yonar","nlinked":58,"nref":59,"src":"INSPIRE","html":true},{"id":"3217259","arxiv":"2610.28744","title":"The renormalization-group running of neutrino mixing is undetectable","first":"Barenboim","nauth":3,"year":2026,"cites":0,"role":"today","note":"Also cites widely used network papers: [[1362180]], [[2817040]]. Closest of your papers: [[3184726]] (coupling 0.03, 9 shared references). Closest network paper: [[2921177]] (coupling 0.06, 14 shared references). Shared topics: neutrino mass and mixing, seesaw model, neutrino mass.","score":16.7,"rank":11,"section":"new","parts":[0.11,0.09,0.18,0.0,0.74],"abstract":"Quantum corrections make the parameters of a theory depend on an arbitrary renormalization scale, $μ$. The renormalization-group (RG) running of neutrino masses and mixing is a standard tool to relate models defined at a high mass scale to measured values. A growing body of work holds that the running is also directly observable: a neutrino produced or detected at momentum transfer $Q$ would carry the mixing matrix evaluated at $μ= Q$. Proposed signatures include flavor change at zero distance from the source, shifts in the measured CP-violation phase, and an anomalous flavor composition of high-energy astrophysical neutrinos. We show that this premise is incorrect. The mixing is a property of the neutrino itself, fixed by its self-energy on the mass shell, not by the process that produces or detects it. Setting $μ= Q$ is legitimate, but then large logarithms in the self-energy undo the running; the premise incorrectly drops them. Hence, apart from small vertex and box corrections, every experiment measures the same mixing: the running is undetectable. We illustrate this in the Minimal Supersymmetric Standard Model, two seesaw models, and the Standard Model effective field theory. Independently, short-baseline data already limit the change of any one mixing angle between pion decay and detection at $Q$ of a few GeV to below $0.7^\\circ$--$2.4^\\circ$.","authors":"Gabriela Barenboim, Mauricio Bustamante, Qinrui Liu","nlinked":141,"nref":150,"src":"INSPIRE","html":true},{"id":"3217445","arxiv":"2610.29942","title":"PBR sensitivity to boosted dark matter explanation for the KM3-230213A event","first":"Reno","nauth":121,"year":2026,"cites":0,"role":"today","note":"Closest of your papers: [[1597138]] (coupling 0.01, 2 shared references). Closest network paper: [[2905773]] (coupling 0.20, 21 shared references). Shared topics: dark matter scenario, dark matter.","score":13.3,"rank":12,"section":"cross","parts":[0.0,0.03,0.57,0.0,0.39],"abstract":"POEMMA-Balloon with Radio (PBR) is a hybrid fluorescence and optical Cherenkov telescope that is a pathfinder instrument for a future Probe Of Extreme Multi-Messenger Astrophysics (POEMMA), together with a radio instrument, to be flown on a super pressure balloon in Spring 2028. One of its science objectives is follow up of astrophysical event alerts via signals of tau decays in the atmosphere, sourced by Earth-skimming tau neutrinos. The recent report of the KM3NeT Collaboration's muon event with $ E_μ=120^{+110}_{-60}$ PeV sparked searches for beyond the standard model (BSM) physics explanations. Using a specific, boosted dark matter scenario which together with the KM3NeT observation, sets a scale for the fluence of boosted dark matter in this energy range, we assess the capabilities of PBR to constrain or discover such a source for a boosted dark matter energy spectrum above $\\sim 10^8$ GeV. PBR has discovery potential for dark matter energies above $10^9$ GeV, and depending on BSM input parameters, to dark matter energies as low as $1.5\\times 10^8$ GeV. While the analysis is focused on one BSM example, the methodology is applicable to any BSM physics that affects tau production in the Earth.","authors":"M. H. Reno, T. Venters, M. Abrate, J. Adams, J. Alfaro, D. Allard, P. Alldredge, R. Aloisio, R. Ammendola, A. Anastasio, L. Anchordoqui, D. Badoni, J. Baláž, B. Baret, M. Battisti, R. Bellotti, M. Bertaina, M. Betts, S. Blin, M. Boezio, P. Bořil, I. Buckland, J. Burton Heibges, F. Cafagna, R. Caruso, M. Casolino, K. Černý, B. Chamanbahar, N. Cordrey, A. Creusot, A. Cummings, C. De Santis, P. Degarate, N. DeWitt Pierrat, A. Di Giovanni, A. Di Salvo, B. J. DiLella, J. Eser, S. Ferrarese, G. Filippatos, J. Ford, N. Gagalis, P. Gálvez Molina, S. Garbolino, D. Garg, R. Gargiulo, B. Gockel, A. Grelle, C. Guépin, A. Haungs, T. Heibges, J. Hinkel, A. K. Ikehara, J. Krizmanic, L. Kupari, E. H. Lenzing, F. Liberatori, S. Mackovjak, D. Mandát, M. Manfrin, A. Marcelli, L. Marcelli, G. Masciantonio, V. Masone, E. Mayotte, A. Meli, E. Mentzell, M. Mese, S. Meyer, M. Mignone, M. Miller, M. Mongelli, J. Moses, E. Msihid, R. Munini, M. Murdock, A. Novikov, A. V. Olinto, Y. Onel, G. Osteria, B. Panico, E. Parizot, G. Passeggio, T. Paul, M. Pech, K. Peñaló Castillo, F. Perfetto, C. Petta, P. Picozza, L. Piotrowski, Z. Plebaniak, H. Qureshi, E. Reali, F. Reynaud, E. Ricci, M. Ricci, A. Rivetti, A. Roy, F. Sarazin, V. Scherini, P. Schovánek, F. Schroeder, V. Scotti, A. Sotgiu, R. Sparvoli, B. Stillwell, I. Strhárský, J. Szabelski, Y. Takizawa, R. Torres, R. Triggiani, C. Trimarelli, J. Tutt, M. Unger, M. Venugopal, P. von Ballmoos, D. Washington, A. Weindl, L. Wiencke, S. Wissel, A. Yuan","nlinked":109,"nref":119,"src":"INSPIRE","html":true},{"id":"3217465","arxiv":"2610.30106","title":"On Particle Production from Bubble Collisions in the Non-runaway Regime","first":"Abu-Ajamieh","nauth":4,"year":2026,"cites":0,"role":"today","note":"Closest of your papers: [[1869725]] (coupling 0.01, 1 shared references). Closest network paper: [[3208082]] (coupling 0.20, 12 shared references). Shared topics: dark sector, dark matter.","score":12.5,"rank":13,"section":"new","parts":[0.0,0.04,0.57,0.0,0.28],"abstract":"Particle production from bubble collisions during First-Order Phase Transitions (FOPTs) has been studied as an efficient mechanism for baryogenesis and dark matter production, but existing semi-analytical treatments assume runaway bubbles with wall velocity $v_w\\to 1$. We generalize this treatment to arbitrary $v_w< 1$, relevant for scenarios such as electroweak baryogenesis and transitions with significant wall friction. We first extend the analytical trapping-equation approach to finite-thickness boosted kink profiles for both elastic and inelastic collisions, then go beyond this by numerically solving the full Klein-Gordon equation without assuming $SO(1,1)$ symmetry or thin walls, across a broad grid of $v_w$ and potential shapes. We find the analytical generalization underestimates the true efficiency factor by orders of magnitude away from $v_w\\to 1$, and provide new semi-analytic fit functions consisting of a power-law continuum plus a resonance peak, which reproduce the main spectral features of the numerical results across the parameter range studied. Applying these to a toy dark sector model, we show particle production is strongly suppressed as $v_w$ decreases from unity, enhanced for lighter produced particles, and that the relative contribution from the oscillatory peak differs from prior runaway-regime estimates. We also discuss limitations of the trapping equation and the off-shell effective-action truncation underlying this formalism.","authors":"Fayez Abu-Ajamieh, Amine Ahriche, Sagar Modak, Nobuchika Okada","nlinked":77,"nref":79,"src":"INSPIRE","html":true},{"id":"3124274","arxiv":"2602.23915","title":"Impact of non-standard neutrino-electron interactions on Big Bang Nucleosynthesis","first":"Froustey","nauth":5,"year":2026,"cites":0,"role":"repl","note":"Closest of your papers: [[2663002]] (coupling 0.05, 6 shared references). Closest network paper: [[2895271]] (coupling 0.05, 5 shared references). Shared topics: big bang nucleosynthesis, early universe.","score":11.0,"rank":14,"section":"replacement","parts":[0.0,0.17,0.15,0.0,0.35],"abstract":"Neutrino non-standard interactions (NSI) with electrons, predicted in many extended theoretical models of particle physics, are known to alter the picture of neutrino decoupling from the cosmic plasma. We update previous analyses of neutrino decoupling in the presence of NSI with electrons, extending the parameter space and assessing their impact on the primordial light-element abundances produced during Big Bang Nucleosynthesis (BBN). We show that tracking the NSI-induced modifications of the neutrino distributions is necessary to accurately predict the helium-4 abundance, which cannot be derived from a pure $N_{\\rm eff}$-driven change. BBN therefore provides additional observables that are complementary to $N_{\\rm eff}$. We then derive cosmological constraints on non-universal and flavour-changing NSI parameters, using different dataset combinations, and compare them with bounds from terrestrial experiments. We find that the cosmological limits are significantly less stringent than the terrestrial ones, but they provide an independent probe of neutrino interactions in the early universe.","authors":"Julien Froustey, Stefano Gariazzo, Jaume Moncho, Sergio Pastor, Ofelia Pisanti","nlinked":51,"nref":51,"src":"INSPIRE","html":true},{"id":"3217360","arxiv":"2610.29541","title":"Domain models of turbulent magnetic fields and the spectral shape of ensemble averaged axion-photon conversion","first":"Khasai","nauth":4,"year":2026,"cites":0,"role":"today","note":"Closest of your papers: [[1941263]] (coupling 0.06, 7 shared references). Closest network paper: [[2691930]] (coupling 0.08, 8 shared references). Shared topics: dark matter.","score":10.5,"rank":15,"section":"cross","parts":[0.0,0.19,0.24,0.0,0.13],"abstract":"Axion-like particles are light pseudoscalars that appear in many extensions of the Standard Model and are candidates for dark matter. Through their mixing with photons, they imprint energy dependent modulations on the spectra of astrophysical sources shining through magnetised media. When a distant source shines through the turbulent magnetic field of an intervening galaxy cluster, these modulations are stochastic. It has recently been shown that averaging over an ensemble of such sources instead produces a smooth absorption-like feature. In this work we derive the analytic form of this ensemble averaged signal, previously known only numerically. We further relate the index $a$ of the magnetic field energy spectrum to the index $β$ of the domain size distribution that simulations use to describe the turbulent field. For $1<a<2$ the two indices obey the simple analytic relation $β=3-a$. Any distribution with $β<1$ instead mimics the spectral index $a=2$, which the sharp domain walls impose. For Kolmogorov turbulence, relevant for galaxy clusters, the relation gives $β=4/3$.","authors":"Oleksandr Khasai, Lidiia Zadorozhna, Denys Malyshev, Oleg Ruchayskiy","nlinked":32,"nref":38,"src":"INSPIRE","html":true},{"id":"3217320","arxiv":"2610.29069","title":"Low Primordial Helium as a Probe of Non-Unitary Neutrino Mixing","first":"Guo","nauth":2,"year":2026,"cites":0,"role":"today","note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2663002]] (coupling 0.03, 3 shared references). Closest network paper: [[2945961]] (coupling 0.06, 2 shared references). Shared topics: big bang nucleosynthesis.","score":10.2,"rank":16,"section":"new","parts":[0.06,0.1,0.16,0.0,0.27],"abstract":"The EMPRESS collaboration has reported a primordial helium mass fraction \\(Y_P = 0.2402 \\pm 0.0040\\), which lies more than \\(1σ\\) below the standard Big Bang Nucleosynthesis prediction. Combined with the deuterium abundance and the Planck baryon density, this corresponds to a mild \\(\\sim 2σ\\) tension with the standard value of the effective number of relativistic species, or to a \\(\\sim 2σ\\) indication of a non-zero electron-neutrino degeneracy. We show that it can be explained by non-unitary three-neutrino mixing, a generic feature of seesaw extensions of the Standard Model. Non-unitarity makes the Fermi constant in beta decay exceed that in muon decay, enhancing the neutron-to-proton conversion rate and lowering \\(Y_P\\). A full numerical BBN calculation, combined with the EMPRESS \\(Y_P\\) determination and the deuterium abundance gives the best fit point at \\(α_{22}=0.982\\), while the standard values \\(N_{\\mathrm{eff}}=3.044\\), \\(ξ_e=0\\) remain allowed; the required level of non-unitarity is consistent with current experimental constraints.","authors":"Shu-Yuan Guo, Jia-Qi Li","nlinked":27,"nref":30,"src":"INSPIRE","html":true},{"id":"2900457","arxiv":"2503.10756","title":"Pre-thermalized gravitational waves","first":"Bernal","nauth":4,"year":2025,"cites":25,"role":"other","note":"","score":null},{"id":"3198665","arxiv":"2609.01480","title":"Gravitational Waves from Reheating beyond Instantaneous Thermalization","first":"Mukaida","nauth":2,"year":2026,"cites":2,"role":"other","note":"","score":null},{"id":"2904433","arxiv":"2503.19980","title":"Two or three things particle physicists (mis)understand about (pre)heating","first":"Barman","nauth":3,"year":2025,"cites":33,"role":"other","note":"","score":null},{"id":"3175584","arxiv":"","title":"Cosmological Aspects of Minimal and Extended Higgs Sectors","first":"Ziegler","nauth":1,"year":2026,"cites":0,"role":"other","note":"","score":null},{"id":"2627241","arxiv":"2301.11345","title":"Gravitational wave from graviton Bremsstrahlung during reheating","first":"Barman","nauth":4,"year":2023,"cites":74,"role":"seed","note":"","score":null},{"id":"2756278","arxiv":"2402.04310","title":"Minimal production of prompt gravitational waves during reheating","first":"Choi","nauth":3,"year":2024,"cites":43,"role":"other","note":"","score":null},{"id":"3207263","arxiv":"2609.29462","title":"Limits on Primordial Black Hole Evaporation from LUX-ZEPLIN","first":"Kalita","nauth":1,"year":2026,"cites":8,"role":"other","note":"","score":null},{"id":"1941263","arxiv":"2110.04312","title":  Shared topics: dark matter abundance, dark matter.","abstract":"We present the first 3D lattice simulations of magnetic monopole production from a first-order phase transition, using the Press-Ryden-Spergel method, capturing the subsequent annihilation stage and the entry into the scaling regime in an expanding universe. We establish the quantitative relationship between the initial bubble number and the residual monopole abundance, and calculate the magnetic field and gravitational wave power spectra sourced by monopole dynamics. Crucially, we find that the magnetic field spectrum displays a steep $k^{-5}$ decline beyond the monopole size $w_M$, whereas the peak of the gravitational wave spectrum aligns with the scale of the mean monopole separation $d_M$, governed by $k^3$ and $k^{-3}$ scalings on the low- and high-wavenumber sides of the peak, respectively. However, since the resulting magnetic field strength is excluded by blazar observations, magnetic monopoles cannot be the origin of primordial cosmic magnetic fields. Finally, we determine the allowed monopole mass under the constraints of the Parker bound ($m_M\\lesssim2.18\\times10^{11}\\,\\mathrm{GeV}$) and dark matter abundance ($m_M\\lesssim1.58\\times10^{12}\\,\\mathrm{GeV}$)."},{"arxiv":"2608.21963","id":"3195288","title":"Searching for signatures of self-interacting dark matter in halos from full physics simulations: From 3D structure to projected observables","authors":"Giovanni Y. Ferron, Antonio Ragagnin, Lorenzo Pizzuti, Moritz S. Fischer","score":7.9,"section":"replacement","rank":18,"parts":[0.0,0.05,0.11,0.0,0.48],"note":"Closest of your papers: [[2787890]] (coupling 0.02, 1 shared references). Closest network paper: [[3214429]] (coupling 0.04, 5 shared references). Shared topics: observed dark matter, dark matter.","abstract":"In this work we explore the imprints of self-interacting dark matter (SIDM) on the structure of simulated galaxy groups and clusters in view of future optical surveys. We find that both baryonic and projection effects lead to a significant alleviation of the SIDM core-forming behavior on the mass and density profiles, resulting in very small ($\\lesssim 5\\%$) deviations from standard collisionless dark matter. The opposite trend emerges for our most massive halos, where SIDM tends to significantly enhance the central density instead; we compare those halos with the observed dark matter profiles of two galaxy clusters, MACS J1206 and Abell S1063, finding that SIDM may leave potentially detectable imprints on cluster cores when considering the small observational uncertainty of current kinematic mass measurements. Finally, we find that weak lensing observations provide a promising tool for testing SIDM on cluster scales: in an idealized scenario where systematics are under control, weak lensing shear profiles exhibit up to $\\sim 20\\%$ level deviations for $M_{200} \\gtrsim 10^{13}\\ \\text{M}_\\odot$ halos. Conversely, the projected concentration-mass relation is only slightly modified by our SIDM models. We also discuss the limitiations of our analysis and the impact of the simulation resolution, as well as possible extension of this work. Overall, our results provide a baseline for future SIDM studies: although line-of-sight projection and baryonic effects significantly reduce SIDM imprints on halo mass profiles, weak lensing and kinematic analyses in galaxy clusters may potentially allow for robust detection and constraining of dark matter self-interactions in massive structures from megaparsec down to kiloparsec scales."},{"arxiv":"2610.29978","id":"3217463","title":"String phenomenology from the landscape","authors":"Howard Baer, Vernon Barger, Shadman Salam, Kairui Zhang","score":7.3,"section":"new","rank":19,"parts":[0.0,0.08,0.33,0.0,0.0],"note":"Closest of your papers: [[1655573]] (coupling 0.03, 2 shared references). Closest network paper: [[2744388]] (coupling 0.12, 26 shared references).","abstract":"SUSY breaking trilinear terms, known as A-terms, play a key role in supersymmetric phenomenology in that 1. large weak scale values help boost the light Higgs boson mass m_h -> 125 GeV and 2. the same large negative values {\\it decrease} the top-squark contributions to the weak scale, thus making the theory more natural. Their renormalization group evolution also plays a key role in the string landscape in that large values can drive top-squark soft terms to tachyonic values leading to charge-and-color breaking (CCB) minima in the scalar potential. Adjacent to these CCB regions is where m_h -> 125 GeV and where natural parameter space can be found. This is an example of {\\it living dangerously} on the landscape where the draw to large soft terms stops just short of catastrophic minima, but where nature is natural with a Higgs mass near its measured value. In a final panoramic view, we compare the reach of HL-LHC for landscape SUSY via several prominent signatures in the higgsino vs. gaugino mass parameter space for the case of decoupled first/second generation scalars."},{"arxiv":"2610.28723","id":"3217260","title":"Poisson Clustering and Seed Effect of PBHs: Implications for Microlensing, Gravitational Waves, Little Red Dots and Ultra-Faint Dwarf Galaxies","authors":"Bernard Carr, Sebastien Clesse, Juan Garcia-Bellido, Michael Hawkins, Florian Kuhnel","score":7.2,"section":"cross","rank":20,"parts":[0.0,0.02,0.16,0.0,0.42],"note":"Closest of your papers: [[1941263]] (coupling 0.01, 2 shared references). Closest network paper: [[2904988]] (coupling 0.06, 5 shared references). Shared topics: primordial black hole, dark matter.","abstract":"The existence of primordial black holes (PBHs) could have significant effects on the formation of cosmic structures through both the seed effect and the Poisson effect. For an extended PBH mass function, this should lead to dark virialised bound clusters of black holes with modest mass, together with central black holes of larger mass. We consider the combination of three effects: the inevitable gravitational binding of small-scale inhomogeneities due to Poisson and seed fluctuations; the dilution through dynamical heating of all clusters smaller than around $10^{6}\\,M_{\\odot}$; the survival of clusters in the outer Galactic halo (i.e. towards the Magellanic Clouds) but their destruction in the central halo region through tidal disruption and collisions. We examine the implications of this for the constraints on the fraction of dark matter in PBHs from microlensing surveys and gravitational-wave events. Although the clustering of PBHs with the expected mass and radius is unlikely to relax the microlensing limits, the decline of the Galactic rotation curve might do so, allowing much of the dark matter to be in solar-mass PBHs formed at the quantum chromodynamics transition. We also emphasise that binary merger rates must be revised: binaries formed in PBH clusters can dominate the merger rate, which may be compatible with the LIGO-Virgo-KAGRA gravitational-wave limits if PBHs provide the dark matter. More positively, Ultra-Faint Dwarf Galaxies and Little Red Dots might arise through a combination of the seed and Poisson effects. Our conclusions could be modified for PBHs produced from primordial fluctuations with exponential non-Gaussian tails, since the clustering would then exceed the Poissonian prediction, opening up new possibilities to explain dark matter with solar-mass PBHs."},{"arxiv":"2607.19323","id":"3182189","title":"Towards anomaly detection searches for new physics signatures including Higgs bosons with weakly supervised machine learning","authors":"Chi Lung Cheng, Julia Gonski, Julie Khalilieh Romman, Runze Li, Qibin Liu, Benjamin Nachman, Dennis Noll, Liangyu Wu","score":7.2,"section":"replacement","rank":21,"parts":[0.0,0.14,0.21,0.0,0.0],"note":"Closest of your papers: [[1455793]] (coupling 0.05, 6 shared references). Closest network paper: [[3187354]] (coupling 0.07, 5 shared references).","abstract":"The Higgs boson, with its universal coupling to mass, provides a broadly applicable portal to sectors beyond the Standard Model and is therefore a natural anchor for anomaly detection (AD) at collider experiments. The Higgs And X Anomaly Detection (HAXAD) strategy offers a principled approach to searching for such anomalies occurring in association with a Higgs boson by combining machine-learning-based feature embedding, background estimation, and weakly supervised classification. This work extends the previous HAXAD approach towards the level of maturity required for application to recorded collider data. A major addition is the introduction and comparison of two new embedding strategies, which in turn shape the background estimation and classification. In addition, a new inference framework is developed, yielding signal-agnostic and signal-specific cross section limits and thereby completing the statistical machinery needed for future AD analyses built on HAXAD. The set of investigated signal models is also significantly expanded, allowing for the evaluation of sensitivity on a much broader phase space. Improvements to the method increase signal sensitivity with respect to the original method, and when benchmarked against an example cut-based search on the same final state, HAXAD matches or exceeds the best individual cut-based limits for a wide variety of considered signal models. These developments strengthen the case for HAXAD as a viable and compelling AD-based search strategy with novel discovery potential at colliders."},{"arxiv":"2610.28729","id":"3217270","title":"Cosmological vacuum selection in dynamical symmetry breaking at zero vacuum energy","authors":"Mateusz Duch, Alessandro Strumia","score":6.9,"section":"new","rank":22,"parts":[0.0,0.07,0.32,0.0,0.0],"note":"Closest of your papers: [[1854224]] (coupling 0.02, 1 shared references). Closest network paper: [[1918535]] (coupling 0.11, 10 shared references).","abstract":"Coleman-Weinberg models invoke classical scale invariance to forbid scalar masses, but then add a dimensionful constant to cancel the vacuum energy of the broken vacuum. This inconsistency is avoided by special quantum potentials, whose symmetry-breaking vacuum is degenerate with the symmetric one. We compute which vacuum is selected by the thermal history of the universe. While a neutral thermal plasma favours the symmetric phase, a sufficiently large conserved charge asymmetry supports a rotating scalar condensate that evolves toward the broken vacuum as the universe cools, and survives fragmentation."},{"arxiv":"2610.12208","id":"3213071","title":"Evidence for Normal Neutrino Ordering with Combined Atmospheric Neutrino Experiments","authors":"Miaochen Jin, Carlos A. Argüelles, Pablo Fernández-Menéndez, Iván Martínez-Soler","score":6.6,"section":"replacement","rank":23,"parts":[0.0,0.07,0.16,0.0,0.2],"note":"Closest of your papers: [[1455793]] (coupling 0.02, 2 shared references). Closest network paper: [[3158607]] (coupling 0.06, 5 shared references). Shared topics: neutrino mass.","abstract":"We present a combined analysis of the latest publicly available atmospheric neutrino data from Super-Kamiokande including all data-taking stages previous to the gadolinium phase, IceCube-DeepCore, and the six-detection-unit configuration of KM3NeT/ORCA. Our fit uses all event samples simultaneously and treats the systematic uncertainties shared among experiments as fully correlated, while detector-response uncertainties are modeled independently for each experiment. The combined data constrain the atmospheric oscillation parameters to $Δm^2_{31} = 2.44^{+0.06}_{-0.04} \\times 10^{-3}\\,\\mathrm{eV}^2$ and $\\sin^2θ_{23} = 0.52^{+0.03}_{-0.04}$, with a precision of $2.2\\%$ and $6.1\\%$, respectively, which is competitive with current accelerator-based measurements, and independently constrain the $CP$-violating phase to $δ_{CP} = 1.30^{+0.24}_{-0.28}~π$. Finally, comparing the orderings of the neutrino mass spectrum, we find a preference for the normal ordering with $Δχ^2 = 11.0$; further calibrated with pseudoexperiments, we exclude the inverted ordering at $99.95\\%$ confidence level ($3.3σ$). In a joint fit including 207 days of JUNO data, we further exclude the inverted ordering at $Δχ^2 = 15.1$, corresponding to $3.9 σ$."},{"arxiv":"2610.28742","id":"3217273","title":"Radiative corrections to double-$β$ decay and their impact on experimental analyses","authors":"Jordy de Vries, Emanuele Mereghetti, Saad el Morabit, Stefan Sandner","score":6.3,"section":"new","rank":24,"parts":[0.06,0.02,0.12,0.0,0.17],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2627241]] (coupling 0.01, 1 shared references). Closest network paper: [[2788951]] (coupling 0.04, 6 shared references). Shared topics: majorana mass.","abstract":"We present a comprehensive study of the $\\mathcal{O}(α)$ radiative corrections to two-neutrino and neutrinoless double-$β$ decay within a heavy-nucleus effective field theory. We compute all virtual and real-emission corrections for intermediate nuclear states of arbitrary excitation energy, including new closed-form expressions for the required one-loop integrals with heavy-nucleus propagators. For excitation energies large compared with the lepton energies, the corrections factorize into the tree-level rate times a universal double-weak Sirlin function, which differs substantially from the sum of two single-$β$ Sirlin functions used so far in the literature. We discuss the impact of the radiative corrections on the analysis of measured spectra in terms of ratios of nuclear matrix elements, $ξ_{31}$, and show that neglecting radiative corrections can significantly bias the extraction. Real-photon emission, not considered in previous analyses, plays a central role and the impact of radiative corrections depends crucially on the detector setup. We provide the photon spectrum, fully differential in the photon energy and direction, and recommend that experiments simulate the photon explicitly. For $0νββ$ decay, the radiative corrections increase the inclusive rate by about $5\\%$, independently of the nuclear matrix elements or the neutrino Majorana mass."},{"arxiv":"2610.20940","id":"3215507","title":"CT25: the new generation of CTEQ-TEA PDFs","authors":"Alim Ablat, Daniel Adamiak, Aurore Courtoy, Sayipjamal Dulat, Yao Fu, Marco Guzzi, T. J. Hobbs, Joey Huston, Maximiliano Ponce Chavez, Kirtimaan Mohan, Pavel Nadolsky, Tanishq Sharma, Dan Stump, Keping Xie, C. -P. Yuan","score":5.9,"section":"replacement","rank":25,"parts":[0.06,0.07,0.13,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[3094526]] (coupling 0.02, 2 shared references). Closest network paper: [[3206672]] (coupling 0.04, 2 shared references).","abstract":"This contribution reviews CT25, a new generation of CTEQ--TEA parton distribution functions (PDFs) for precision QCD. With its first member sets released in 2025, the CT25 family addresses common uses of parton distributions in diverse contexts. We describe the CTEQ--TEA Parton Cloud, an online database of exploratory global fits to precision QCD measurements, from which we select PDF solutions for general- and special-purpose calculations. These solutions are published as complementary error PDF ensembles---the baseline CT25, CT25m, CT25pd, and ensembles with conservative priors---optimized for distinct uses. They implement new approaches to quantifying uncertainties and different treatments of theoretical, parametrization, and nuclear-target uncertainties. In particular, they provide complementary frameworks for exploring PDF uncertainties at large partonic momentum fractions relevant to HL-LHC and EIC studies. Further details will appear in the forthcoming CT25 publication."},{"arxiv":"2610.28704","id":"3217242","title":"Gauge Field Fluctuations Protect the Higgs Vacuum When a Small Universe Begins","authors":"Alan Zhang","score":5.3,"section":"new","rank":26,"parts":[0.0,0.02,0.32,0.0,0.0],"note":"Closest of your papers: [[2663002]] (coupling 0.01, 1 shared references). Closest network paper: [[2046345]] (coupling 0.11, 9 shared references).","abstract":"The Standard Model Higgs quartic coupling $λ$ turns negative at high energies. We show that in a small periodic box with antiperiodic fermions, zero-point fluctuations of the constant gauge modes turn the Higgs zero mode into a resonance for $λ<0$, whose width falls exponentially in $|λ|^{-1/2}$. A box lasting $N$ light-crossing times keeps its vacuum with probability above $1/2$ for $λ>λ_c(N)$, which depends on $N$ only logarithmically. For a universe that begins at a Casimir turning point, $λ_c\\approx-0.012$ lies below the Standard Model value $-0.0098$; given a curvature coupling $ξ_H\\gtrsim0.08$, survival has probability above $1/2$ for $m_t<172.96$ GeV and $\\approx0.7$ for current data, and FCC-ee can exclude this beginning if $m_t\\gtrsim173.7$ GeV."},{"arxiv":"2607.16904","id":"3181800","title":"The muon collider: expected physics, technological challenges, and the prospects for reusing the 21 km UNK tunnel","authors":"L. V. Dudko","score":5.1,"section":"replacement","rank":27,"parts":[0.0,0.01,0.32,0.0,0.0],"note":"Closest of your papers: [[2690106]] (coupling 0.00, 1 shared references). Closest network paper: [[2115290]] (coupling 0.11, 10 shared references).","abstract":"A multi-TeV muon collider is among the main options for the post-LHC energy frontier. Muons radiate about 10^9 times less synchrotron power than electrons of the same energy, so a compact circular collider could combine the energy reach of a 100 TeV-class proton machine with the clean final states of a lepton collider. This review summarizes the expected physics programme, including Higgs couplings and self-coupling, electroweak and top-quark physics, and searches beyond the Standard Model. It also describes the technological challenges: muon production, ionization cooling, rapid acceleration, high-field HTS magnets, the machine-detector interface and the neutrino-flux constraint. None of these technologies has yet been demonstrated at the required performance. Scaling the parameters of the International Muon Collider Collaboration (IMCC), the review examines three ways of reusing the existing 21 km UNK tunnel near Protvino. With the last rapid-cycling synchrotron in the tunnel, the centre-of-mass energy is limited to about 6 TeV. With the collider ring in the tunnel, 11-16 T dipoles give about 14-21 TeV, but the acceleration chain needs a separate 50-73 km tunnel. With both in the tunnel, the reach is about 6-10 TeV at 35-57% of the target luminosity. Non-collider applications of intense muon beams are also discussed."},{"arxiv":"2610.28758","id":"3217288","title":"PIANISTpy: A JAX-based Python package for velocity-anisotropic astrophysical equilibrium models","authors":"Barry T. Chiang, Frank C. van den Bosch, Hsi-Yu Schive","score":4.4,"section":"cross","rank":28,"parts":[0.0,0.05,0.11,0.0,0.13],"note":"Closest of your papers: [[2794409]] (coupling 0.02, 3 shared references). Closest network paper: [[3215016]] (coupling 0.04, 5 shared references). Shared topics: dark matter.","abstract":"The hierarchical assembly of dark matter haloes and galaxies via mergers and anisotropic mass accretion naturally imprints non-trivial velocity anisotropy onto haloes and galaxies, an empirical fact emerging from cosmological simulations. However, dynamical studies based on idealised numerical simulations typically assume isotropic velocity distributions for the systems studied. This is mainly because no tools exist to construct anisotropic initial conditions with fully self-consistent (i.e., physical and instability-free) truncation boundary conditions for finite spatial extents. Here we present the first such analytical framework that performs truncation in phase space, with two distinct approaches to guarantee either the monotonicity of output distribution functions or identical truncated density profiles. We additionally present the open-source JAX-based GPU-accelerated Python package PIANISTpy (Particle Initial conditions with ANISoTropy) for constructing spherical, non-rotating initial conditions, supporting arbitrary double-power-law analytical radial density profiles and a library of analytical anisotropy profiles. This framework further permits the construction of systems with non-analytical anisotropy profiles via an arbitrary linear superposition of all implemented analytical anisotropy models as basis functions. PIANISTpy also outputs 3D velocity profiles and line-of-sight-integrated observables with end-to-end differentiability for rapid gradient-based Monte Carlo inference, and self-consistent local dark matter velocity distributions of anisotropic haloes beyond the unphysical Maxwell-Boltzmann simplification adopted in terrestrial detection experiments. We discuss use cases and demonstrate PIANISTpy's orders-of-magnitude higher numerical solver accuracy and superior dynamical stability of particle initial conditions relative to existing tools, including galpy and AGAMA."},{"arxiv":"2610.29678","id":"3217369","title":"Lorentz-Equivariant Geometric Algebra Transformers for Top-Quark Event Reconstruction","authors":"E. Abasov, L. Dudko, A. Markina, M. Perfilov, P. Volkov, G. Vorotnikov, A. Zaborenko","score":4.0,"section":"new","rank":29,"parts":[0.0,0.08,0.09,0.0,0.0],"note":"Closest of your papers: [[1679809]] (coupling 0.03, 1 shared references). Closest network paper: [[2686887]] (coupling 0.03, 2 shared references).","abstract":"Results are presented for Lorentz-equivariant geometric algebra transformers (LGaTr) in three event reconstruction tasks involving top quarks. Geometric algebra provides a common Lorentz-covariant representation of four-momenta and typed physical objects. Performance of LGaTr is evaluated on three different physics tasks - $t\\bar{t}/tWb$ separation, FCNC detection in single top-quark production and universal event reconstruction. LGaTr is outperforming the baseline networks in $tW/t\\bar{t}$ separation and full event reconstruction and is showing comparable or better performance to standard transformer-based networks. The implementation is provided in a companion repository https://github.com/emil2001/top-quark-universal-nets."},{"arxiv":"2610.19256","id":"3215063","title":"Bottom-Charm $[bc]$ Diquark Masses from QCD Laplace Sum-Rules","authors":"T. de Oliveira, D. Harnett, J. Ho, R. T. Kleiv, Siyuan Li, N. Loewen, A. Palameta, T. G. Steele","score":3.9,"section":"replacement","rank":30,"parts":[0.06,0.01,0.11,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[3184726]] (coupling 0.00, 1 shared references). Closest network paper: [[3217357]] (coupling 0.04, 4 shared references).","abstract":"Constituent mass predictions for bottom-charm $[bc]$ color-antitriplet diquarks are generated using QCD Laplace sum rules. We calculate the diquark correlator within the operator product expansion to next-to-leading-order (NLO), including terms proportional to the four- and six-dimensional gluon and six-dimensional quark condensates. Existing analytic expressions for the resulting multi-scale master integrals are insufficient for these calculations, so we utilize numerical $D$-dimensional loop integration techniques. The sum rule analyses stabilize in all four channels yielding constituent masses in GeV of: scalar ($0^+$) $(5.60\\pm0.56)$, pseudoscalar ($0^-$) $(6.04\\pm0.60)$, axial vector ($1^+$) $(5.60\\pm0.56)$ and vector ($1^-$) $(5.99\\pm0.60)$. These constituent mass results are discussed in comparison with values used in diquark models of tetraquark hadronic states. We also summarize QCD sum rule predictions for diquark masses for all possible quark-flavor combinations, providing QCD-based criteria for assessing the diquark mass parameters used in constituent diquark models of hadrons."},{"arxiv":"2610.28681","id":"3217257","title":"Testing the statistical compatibility of data sets with a common prior","authors":"Pilar Coloma, Michele Maltoni, Thomas Schwetz","score":3.8,"section":"new","rank":31,"parts":[0.0,0.09,0.08,0.0,0.0],"note":"Closest of your papers: [[2751074]] (coupling 0.03, 1 shared references). Closest network paper: [[3204120]] (coupling 0.03, 2 shared references).","abstract":"The Parameter Goodness-of-fit (PG) test [hep-ph/0304176] offers a simple test statistic to study the compatibility of different data sets within a given theoretical model. In its original formulation it assumes that the data sets are statistically independent. We propose an extension of the PG test for the situation when some parameters of the model are constrained by an auxiliary data set called prior here. As the prior is imposed for all data sets, they are no longer statistically independent. We show that under the Gaussian approximation, the prior-constrained PG test statistic follows a generalised $χ^2$ distribution, which can be used to obtain $p$-values in a straight-forward way. In the approximation of a strong prior constraint, the test converges towards the standard PG test for the unconstrained model parameters."},{"arxiv":"2610.29754","id":"3217382","title":"Fermion Hierarchies from Fricke Modular Symmetry","authors":"Takafumi Kai, Justin Kaidi, Katsumi Kina, Hajime Otsuka","score":3.8,"section":"new","rank":32,"parts":[0.0,0.03,0.2,0.0,0.0],"note":"Closest of your papers: [[3184726]] (coupling 0.01, 1 shared references). Closest network paper: [[3154793]] (coupling 0.07, 5 shared references).","abstract":"We show how Fricke modular symmetry can generate realistic fermion hierarchies and quark CP violation from a single modulus in a supersymmetric effective theory. Matter fields are labelled by the two one-dimensional characters of $Γ_0^+(N)$ that are trivial on $Γ_0(N)$, and interactions use complete spaces of cusp-regular holomorphic modular forms. At level three, the Fricke extension enlarges an interior stabilizer from order three to order six, allowing its parity to enforce three additional powers of the displacement $t$. An explicit assignment gives quark mass powers $(7,3,0)$ and $(5,4,2)$ and CKM powers $(1,2,3)$. The leading textures conserve CP, but an exact relation among the modular generators produces an appreciable CKM phase at finite displacement. A fit at $|t|\\simeq0.306$ reproduces the quark and lepton reference values with order one coefficients in a fixed normalization. We also relate the Fricke double-coset algebra to coset non-invertible symmetry; on the coefficient spaces used here its action reduces to ordinary Fricke parity."},{"arxiv":"2607.17496","id":"3181818","title":"Vector mesons leading-twist longitudinal distribution amplitudes and related semi-leptonic decays within QCD sum rules","authors":"Wan-Bing Luo, Ru-Meng Pan, Ya-Xiong Wang, Tao Zhong","score":3.7,"section":"replacement","rank":33,"parts":[0.06,0.01,0.09,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[3184726]] (coupling 0.00, 1 shared references). Closest network paper: [[2835155]] (coupling 0.03, 5 shared references).","abstract":"In this work, we focus on the light vector meson leading-twist longitudinal distribution amplitudes (DAs) $φ^\\parallel_{2;V}(x,μ)$ with $V = ρ, K^\\ast, φ$. A new scheme of QCD sum rule research with respect to DA suggested in 2021 by us is adopted. With an improved sum rule formula, the $ξ$-moments $\\langleξ^n\\rangle_{2;V}^\\parallel$ up to tenth order are calculated. In which, $\\langleξ^2\\rangle^\\parallel_{2;ρ}=0.225^{+0.013}_{-0.012}$, $\\langleξ^1\\rangle^\\parallel_{2;K^\\ast}=-0.0228^{+0.0042}_{-0.0040}$, $\\langleξ^2\\rangle^\\parallel_{2;K^\\ast}=0.217^{+0.007}_{-0.007}$, $\\langleξ^2\\rangle^\\parallel_{2;φ}=0.209^{+0.020}_{-0.020}$, and the corresponding Gegenbauer moments $a^{2;\\parallel}_{2;ρ}=0.074^{+0.039}_{-0.036}$, $a^{1;\\parallel}_{2;K^\\ast}=-0.038^{+0.007}_{-0.007}$, $a^{2;\\parallel}_{2;K^\\ast}=0.050^{+0.020}_{-0.019}$, $a^{2;\\parallel}_{2;φ}=0.027^{+0.058}_{-0.058}$ at the scale $μ= 1~{\\rm GeV}$, respectively. By fitting those $\\langleξ^n\\rangle^\\parallel_{2;V}(n = 1,2,\\cdots,10)$ with the least squares method, the behaviors of leading-twist longitudinal DAs for $ρ, K^\\ast, φ$ are determined. In addition, we also analyze the impact of incorporating different numbers of $ξ$-moments into the fitting on the stability and reliability of the obtained DAs. Be different from the pion leading-twist DA, we find that the higher-order moments do not significantly change the reconstructed shapes of $φ^\\parallel_{2;V}(x,μ)$. Further, we recalculate the transition form factors and branching ratios of the $D\\to(ρ,K^\\ast)$, $D_s\\toφ$ semi-leptonic decay processes."},{"arxiv":"2610.29181","id":"3217325","title":"Next-to-leading-order QCD corrections to the radiative decays $χ_{bJ}\\to J/ψ+γ$","authors":"Yu-Dong Zhang, Zai-Fu Jiang","score":3.6,"section":"new","rank":34,"parts":[0.06,0.01,0.07,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[3184726]] (coupling 0.00, 1 shared references). Closest network paper: [[2169464]] (coupling 0.03, 5 shared references).","abstract":"Within nonrelativistic QCD (NRQCD) factorization, we calculate the next-to-leading-order (NLO) QCD corrections to $χ_{bJ}\\to J/ψ+γ$ with $J=0,1,2$. We determine all six independent helicity amplitudes, including the one-loop corrections to the QED amplitude and the two-loop corrections to the QCD amplitude, and retain the interference between the QED and QCD amplitudes in the decay widths. The NLO corrections substantially enhance the $χ_{b0}$ and $χ_{b1}$ decay widths, while reducing the $χ_{b2}$ decay width by approximately $36\\%$. Including the QED amplitude leads to sizable destructive interference for $χ_{b0}$ and an enhancement for $χ_{b2}$, but has only a small effect on the $χ_{b1}$ decay width. Two treatments of photon fragmentation, based on the NRQCD matrix element and the experimentally determined $J/ψ$ decay constant, yield NLO unpolarized decay widths that agree at the few percent level or better. Using the decay constant scheme at $μ_R=m_b$, we obtain NLO central branching fractions of $1.03\\times10^{-6}$, $1.45\\times10^{-5}$, and $1.99\\times10^{-6}$ for the three channels, respectively. The NLO corrections reduce the renormalization scale dependence, particularly for $χ_{b2}$, although a sizable dependence remains for $χ_{b0}$. At fixed $m_b$, the branching fractions decrease with increasing $r=m_c/m_b$, more strongly for $χ_{b1}$ and $χ_{b2}$ than for $χ_{b0}$. For $pp$ collisions at $\\sqrt{s}=14\\,{\\rm TeV}$ and an integrated luminosity of $100\\,{\\rm fb}^{-1}$, we estimate about $1.9\\times10^4$ and $4.8\\times10^4$ $\\ell^+\\ell^-γ$ events from $χ_{b0}$ and $χ_{b2}$ decays, respectively. Measurements with the existing Belle $Υ(2S)$ sample remain challenging because of the small expected yields. A larger $Υ(2S)$ sample at Belle II would improve the prospects for observing these radiative decays."},{"arxiv":"2610.29087","id":"3217296","title":"8-type electric flux tube solutions in SU(3) gauge theory","authors":"Jude Pereira","score":3.5,"section":"cross","rank":35,"parts":[0.0,0.07,0.1,0.0,0.0],"note":"Closest of your papers: [[2751074]] (coupling 0.03, 1 shared references). Closest network paper: [[2753529]] (coupling 0.03, 1 shared references).","abstract":"We consider electric flux tube solutions in SU(3) gauge theory with scalar fields in the fundamental representation, for an electric field in the $λ_8$ direction (8-type). In temporal gauge, the 3-type electric field rotates within a single SU(2) subgroup at one frequency, whereas the 8-type electric field necessarily rotates within three SU(2) subgroups with at least two different frequencies. We construct the homogeneous 8-type electric field with three scalar fields and show that two scalar fields are sufficient only on a one-parameter family of gauge field backgrounds. Like the 3-type field, the homogeneous 8-type field is immune to decay through Schwinger pair production of gauge bosons. We then construct an 8-type electric string solution in temporal gauge. Its electric field is of 8-type on the string axis and, unlike the 3-type string, the string is only net color neutral, which results in a weak radial electric field."},{"arxiv":"2604.21804","id":"3148504","title":"Agentic AI Detector Co-design and Optimization in Vertically Integrated Differentiable Full Simulations","authors":"Wonyong Chung, Qibin Liu, Liangyu Wu, Julia Gonski","score":3.5,"section":"replacement","rank":36,"parts":[0.0,0.07,0.1,0.0,0.0],"note":"Closest of your papers: [[2751074]] (coupling 0.03, 1 shared references). Closest network paper: [[2753529]] (coupling 0.03, 1 shared references).","abstract":"We present the first implementation of AI agents into the design and optimization of detectors in high-energy physics experiments via a bi-level optimization framework that vertically integrates detector geometry, front-end digitization, and high-level reconstruction algorithm parameters in differentiable full simulations. Using the example of a dual-readout, segmented crystal EM calorimeter with a baseline resolution of $3\\%/\\sqrt{E}$, we investigate the capabilities and value propositions of AI agents in the identification and reduction of key detector parameters and in the nonlinear traversal of design space. We find that frontier LLM reasoning-models today, without being given additional experiment-specific context, are able to effectively execute complex workflows and proactively suggest generic but relevant avenues for further study or improvement. Here, we demonstrate an AI agent's ability to find an optimal design point amidst three competing performance criteria, showing that effectiv function panel(){const p=document.getElementById('panel'),n=sel;
  if(!n){p.innerHTML='<p>Select a paper in the network.</p>';return}
  const links=`<div class="links">${n.id?`<a href="https://inspirehep.net/literature/${n.id}" target="_blank" rel="noopener">INSPIRE</a>`:''}${n.arxiv?`<a href="https://arxiv.org/abs/${esc(n.arxiv)}" target="_blank" rel="noopener">arXiv</a>`:''}</div>`;
  if(isNew(n)) p.innerHTML=`<div class="role" style="color:${col(n)}">#${n.rank} · ${esc(SEC[n.section])} · score ${n.score.toFixed(1)}</div><h4>${esc(n.title)}</h4>
   <div class="meta">${esc(auth(n))} · arXiv:${esc(n.arxiv)}</div><p>${why(n.note)}</p><div class="links"><a href="#p${n.i}">Back to abstract</a></div>`;
  else p.innerHTML=`<div class="role" style="color:${col(n)}">${esc(ROLE[n.role])}</div><h4>${esc(n.title)}</h4>
   <div class="meta">${esc(auth(n))} · ${n.year}${n.arxiv?' · arXiv:'+esc(n.arxiv):''}</div>
   <div class="stats"><span>${n.cites.toLocaleString()} citations</span><span>${n.inn.filter(i=>isNew(N[i])).length} of the matches link here</span></div>${links}`;
  tex(p)}
function pick(n,scroll){sel=n;panel();paint();document.querySelectorAll('.paper').forEach(el=>el.classList.toggle('sel',el.id==='p'+n.i));if(scroll)document.getElementById('chart').scrollIntoView({behavior:'smooth',block:'nearest'})}
const present=new Set(N.map(n=>n.role));
document.getElementById('legend').innerHTML=['today','repl','seed','other'].filter(k=>present.has(k)).map(k=>`<span><i class="dot" style="background:var(--${k})"></i>${esc(ROLE[k])}</span>`).join('')+'<span style="color:var(--fg-3)">Listing papers: size ∝ score; others: size ∝ log(citations)</span>';
document.getElementById('q').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();paint()});
svg.on('click',ev=>{if(ev.target.tagName!=='circle'){sel=null;panel();paint()}});
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(draw,200)});
function nextList(){const X=RAW.next||[];if(!X.length)return;const box=document.getElementById('nextlist'),more=document.getElementById('more');
  more.hidden=false;more.querySelector('summary').firstChild.textContent=`The next ${X.length} papers by score `;
  document.getElementById('moresub').textContent=`below the threshold of ${M.threshold}, not drawn in the network`;
  box.innerHTML=X.map(n=>`<li><div class="role" style="color:var(--${n.section==='replacement'?'repl':'today'})">#${n.rank} · ${esc(SEC[n.section])} · score ${n.score.toFixed(1)}</div>
    <div class="t">${esc(n.title)}</div><div class="authors">${authors(n.authors)} · arXiv:${esc(n.arxiv)}</div>
    ${n.note?`<p class="why">${why(n.note)}</p>`:''}
    <details class="abs"><summary>Abstract</summary><p class="abs">${esc(n.abstract)}</p></details>
    <div class="links">${n.id?`<a href="https://inspirehep.net/literature/${n.id}" target="_blank" rel="noopener">INSPIRE</a>`:''}<a href="https://arxiv.org/abs/${esc(n.arxiv)}" target="_blank" rel="noopener">arXiv</a><a href="https://arxiv.org/pdf/${esc(n.arxiv)}" target="_blank" rel="noopener">PDF</a></div></li>`).join('');
  more.addEventListener('toggle',()=>{if(more.open)tex(box)})}
const rtip=document.getElementById('reftip');let rcur=null;
function refShow(el){const r=REFS[el.dataset.ref];if(!r)return;rcur=el;rtip.textContent=`${auth(r)} (${r.year}) — ${plain(r.title)}`;rtip.hidden=false;
  const b=el.getBoundingClientRect(),t=rtip.getBoundingClientRect();let L=Math.min(Math.max(8,b.left),innerWidth-t.width-8),T=b.bottom+6;
  if(T+t.height>innerHeight-8)T=b.top-t.height-6;rtip.style.left=L+'px';rtip.style.top=T+'px'}
function refHide(){rtip.hidden=true;rcur=null}
document.addEventListener('pointerover',e=>{const el=e.target.closest('.ref');if(el&&e.pointerType==='mouse')refShow(el)});
document.addEventListener('pointerout',e=>{if(e.target.closest('.ref')&&e.pointerType==='mouse')refHide()});
document.addEventListener('click',e=>{const el=e.target.closest('.ref');if(el)refShow(el);else if(rcur)refHide()});
document.addEventListener('focusin',e=>{const el=e.target.closest('.ref');if(el)refShow(el)});
document.addEventListener('focusout',e=>{if(e.target.closest('.ref'))refHide()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')refHide()});
addEventListener('scroll',()=>{if(rcur)refHide()},{passive:true});
list();nextList();fold();draw();panel();
window.addEventListener('load',()=>{tex(document.getElementById('list'));tex(document.getElementById('panel'));fold();
  if(window.MathJax&&MathJax.startup&&MathJax.startup.promise)MathJax.startup.promise.then(()=>setTimeout(fold,300))});
addEventListener('resize',()=>{clearTimeout(window._ft);window._ft=setTimeout(fold,200)});
</script>
