<script>
const RAW = {"n":[{"id":"3118953","arxiv":"2602.12154","title":"Resurrecting Kaluza-Klein Dark Matter with Low-Temperature Reheating","first":"Ghosh","nauth":3,"year":2026,"cites":0,"role":"repl","note":"Cites 5 network papers: [[2860397]], [[2802022]], [[2152955]], [[1803656]], [[2740358]]. Closest of your papers: [[1220579]] (coupling 0.10, 5 shared references). Closest network paper: [[2860397]] (coupling 0.12, 14 shared references). Shared topics: during reheating, observed relic, relic abundance, relic density, discrete symmetry.","score":56.5,"rank":1,"section":"replacement","parts":[0.95,0.3,0.34,0.0,0.93],"abstract":"In Universal Extra Dimension (UED) scenarios, the lightest Kaluza-Klein (KK) particle is naturally stable due to a remnant discrete symmetry, KK parity, arising from extra-dimensional compactification. This stability requires no ad hoc symmetry and renders Kaluza-Klein dark matter a well-motivated candidate, provided it reproduces the observed relic abundance. The minimal UED (mUED) framework being highly predictive is strongly constrained by the combined requirements of relic density and collider searches under standard cosmological assumptions. We revisit the dark matter phenomenology of mUED in the presence of a nonstandard cosmological history featuring a low reheating temperature driven by prolonged inflaton decay. Solving the coupled Boltzmann equations for dark matter, radiation, and inflaton energy densities, we show that entropy injection during reheating can dilute the relic abundance by orders of magnitude, reopening large regions of parameter space previously ruled out. We further demonstrate that the revived parameter space is consistent with current collider, direct-detection, and indirect-detection constraints, while remaining testable by upcoming experiments.","authors":"Kirtiman Ghosh, Abhishek Roy, Rameswar Sahu","nlinked":67,"nref":72,"src":"INSPIRE","html":true},{"id":"3231393","arxiv":"2611.26303","title":"Towards Consistent Thermal Resummation: Improved Partial Dressing for Precise Electroweak Phase Transition Predictions","first":"Qiu","nauth":2,"year":2026,"cites":0,"role":"today","note":"Cites 4 network papers: [[2957941]], [[2957726]], [[1937352]], [[2657746]]. Closest of your papers: [[2663002]] (coupling 0.05, 7 shared references). Closest network paper: [[2957941]] (coupling 0.19, 23 shared references). Shared topics: gravitational wave.","score":45.5,"rank":2,"section":"new","parts":[0.91,0.15,0.56,0.0,0.1],"abstract":"Reliable predictions for the electroweak phase transition depend critically on a consistent resummation of thermal fluctuations. However, existing prescriptions often entail sizable uncertainties, motivating the development of a robust and systematically controlled resummation scheme. In this work, we develop an improved partial dressing (IPD) scheme that resolves intrinsic inconsistencies in the original partial dressing prescription, including the overlapping momentum problem and the associated divergences in the gap equations. By consistently incorporating momentum-dependent self-energies and reorganizing the daisy resummation, the IPD scheme provides a more systematic framework for thermal resummation. We perform a comprehensive comparison of 5 different resummation prescriptions in the well-motivated inert doublet model and demonstrate that the choice of resummation scheme can substantially affect the predicted phase transition parameters and the resulting gravitational wave spectra. Notably, the IPD prescription yields a reliable potential and comparatively robust phenomenological predictions, highlighting the importance of a self-consistent treatment of thermal corrections. Our results establish the theoretical consistency of IPD and demonstrate that controlling resummation uncertainties is essential for reliable predictions of cosmological phase transitions and their gravitational wave signatures.","authors":"Dayun Qiu, Fa Peng Huang","nlinked":86,"nref":90,"src":"INSPIRE","html":true},{"id":"3231312","arxiv":"2611.25812","title":"Direct simulation Monte Carlo for dark matter production and phase-space evolution","first":"Kahlhoefer","nauth":2,"year":2026,"cites":0,"role":"today","note":"Cites 2 network papers: [[3081713]], [[2912193]]. Closest of your papers: [[2686856]] (coupling 0.03, 3 shared references). Closest network paper: [[3081713]] (coupling 0.24, 16 shared references). Shared topics: dark sector, dark matter, dark matter particle.","score":41.6,"rank":3,"section":"new","parts":[0.7,0.11,0.68,0.0,0.38],"abstract":"To study the early-universe production of dark matter particles beyond thermal equilibrium often requires solving several coupled Boltzmann equations at the phase-space level. We present a new method to address this challenge using Direct Simulation Monte Carlo (DSMC) based on stochastic interactions of an ensemble of particles. We implement and validate efficient algorithms to describe freeze-out, decays, elastic scattering and number-changing processes within the dark sector. These algorithms do not require a discretisation of momentum space on a pre-defined grid and do not rely on approximations such as thermally averaged cross sections. As illustrative example, we consider a scenario with two-step dark matter production, leading to a bimodal phase-space distribution, and consider the subsequent evolution under elastic and number-changing processes. We show that DSMC is a flexible approach to explore out-of-equilibrium processes and solve Boltzmann equations at the phase-space level in order to predict the abundance of dark matter particles and their effect on structure formation.","authors":"Felix Kahlhoefer, Ann Cathrin Wesener","nlinked":49,"nref":55,"src":"INSPIRE","html":true},{"id":"2938740","arxiv":"2506.20113","title":"Mono-Higgs signature in a singlet fermionic dark matter model","first":"Kim","nauth":3,"year":2026,"cites":0,"role":"repl","note":"Cites 2 network papers: [[3165814]], [[2795517]]. Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2751074]] (coupling 0.04, 4 shared references). Closest network paper: [[2958466]] (coupling 0.07, 9 shared references). Shared topics: viable parameter space, fermionic dark matter, relic density, dark matter scenario, direct detection.","score":40.9,"rank":4,"section":"replacement","parts":[0.72,0.11,0.21,0.0,0.93],"abstract":"We investigate mono-Higgs production as a probe of singlet fermionic dark matter (SFDM) at the LHC. In this framework, a Standard Model (SM) gauge-singlet Dirac fermion serves as the dark matter candidate, interacting with the visible sector through a real scalar mediator that mixes with the SM Higgs boson. Focusing on light dark matter with $M_ψ\\in [0.1,10]$ GeV, we analyze the viable parameter space under constraints from relic density, Higgs decay properties, invisible decay bounds, rare $B$-meson decays, and direct detection experiments. We compute the mono-Higgs production cross sections at $\\sqrt{s}=13~\\mathrm{TeV}$ and compare approximate detector-level yields with the ATLAS $b\\bar b$ search, supplemented by an inclusive upper bound for the CMS four-lepton channel. For the two benchmarks, the signal is dominated by non-resonant Higgs-pair production followed by an invisible Higgs decay. The resulting signal rate depends on both the production cross sections and the physical invisible branching fractions. The inclusive rates of $3.33$ and $1.43$~fb at loop-induced leading order provide quantitative signal targets before the visible Higgs decay and analysis cuts. For representative benchmark points satisfying the constraints considered, these comparisons indicate limited sensitivity in the analyzed channels. Nevertheless, the mono-Higgs channel provides a complementary probe of Higgs-portal dark matter scenarios, particularly in the low-mass mediator regime.","authors":"Yeong Gyun Kim, Kang Young Lee, Soo-hyeon Nam","nlinked":67,"nref":70,"src":"INSPIRE","html":true},{"id":"3161765","arxiv":"2605.27519","title":"Probing the dynamical inverse seesaw mechanism with low-frequency gravitational waves","first":"Borah","nauth":5,"year":2026,"cites":0,"role":"repl","note":"Cites 2 network papers: [[2828434]], [[2134273]]. Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1249404]] (coupling 0.03, 8 shared references). Closest network paper: [[3190827]] (coupling 0.19, 33 shared references). Shared topics: neutrino mass, gravitational wave.","score":39.4,"rank":5,"section":"replacement","parts":[0.72,0.1,0.55,0.0,0.31],"abstract":"We study the possibility of probing the dynamical inverse seesaw mechanism for the origin of light neutrino masses via the detection of stochastic gravitational waves (GW) in the low-frequency regime currently being probed by pulsar timing arrays. As the lepton number-violating term in inverse seesaw typically remains in the sub-MeV ballpark, its dynamical origin naturally brings the possibility of a low-scale first-order phase transition, which can be probed at low-frequency GW experiments. We also find interesting complementarity with heavy neutral lepton searches, as GW experiments remain sensitive to parameter space with small active-sterile mixing, which is out of reach for most particle physics experiments.","authors":"Debasish Borah, Sounak Dutta, Partha Kumar Paul, Indrajit Saha, Narendra Sahu","nlinked":127,"nref":132,"src":"INSPIRE","html":true},{"id":"3231394","arxiv":"2611.26274","title":"Photon-Mediated Axino-Bino Scattering Process for the LZ High-Energy Recoil Event","first":"Yin","nauth":3,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3201080]]. Closest of your papers: [[2794409]] (coupling 0.06, 9 shared references). Closest network paper: [[3202840]] (coupling 0.42, 27 shared references). Shared topics: dm mass, dark matter.","score":39.2,"rank":6,"section":"new","parts":[0.45,0.16,1,0.0,0.36],"abstract":"We for the first time investigate the photon-mediated endothermic axino-bino scattering process to explain the LUX-ZEPLIN (LZ) high-energy recoil event. We calculate the signals from non-relativistic halo and boosted dark matter (DM), including natural xenon isotopes, detector efficiency, and energy resolution. For a fixed Standard Halo Model (SHM) distribution, a simplified three-bin Poisson analysis yields a best-fit benchmark with mass $m\\simeq506\\,\\mathrm{GeV}$ and mass splitting $δ\\simeq326\\,\\mathrm{keV}$ at the adopted upper coupling bound $g_γ=10^{-3}\\,\\mathrm{GeV}^{-1}$. It predicts approximately one accepted event, with $70\\%$ in the middle bin. A boosted benchmark with $m\\simeq82.87\\,\\mathrm{GeV}$ and $δ\\simeq0.626\\,\\mathrm{MeV}$ provides a comparable fit. Broader Gaussian incident energy distributions allow fitted masses down to a few GeV. Thus, both the halo and boosted DM scenarios can fit the LZ signal at different DM mass scales.","authors":"Xiangwei Yin, Quanyu Wang, Tianjun Li","nlinked":62,"nref":63,"src":"INSPIRE","html":true},{"id":"3201808","arxiv":"2609.08918","title":"Probing the Inert Scalar Sector of the Inert Doublet Model via Vector-Boson Fusion at a Muon Collider","first":"Arhrib","nauth":5,"year":2026,"cites":0,"role":"repl","note":"Cites 2 network papers: [[822544]], [[2740358]]. Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1455793]] (coupling 0.07, 12 shared references). Closest network paper: [[2115290]] (coupling 0.14, 15 shared references). Shared topics: dark matter.","score":38.8,"rank":7,"section":"replacement","parts":[0.72,0.22,0.39,0.0,0.13],"abstract":"We investigate how a future high-energy muon collider (MuC) probe the inert scalar sector of the Inert Doublet Model (IDM) through a comprehensive set of $2\\to4$ electroweak gauge-boson fusion processes. The scalar spectrum consists of two $CP$-even neutral scalars, $h$ and $H$, one $CP$-odd neutral scalar $A$, and a pair of charged scalars $H^\\pm$. We assume the neutral scalar $H$ is the lightest inert state and the dark matter (DM) candidate, while we identify the observed $125$~GeV Higgs boson with the scalar from the Standard-Model-like doublet. We consider charged Higgs pair production, $μ^+μ^-\\to H^+H^-ν\\barν$, induced by $WW$ fusion, as well as the associated channels $μ^+μ^-\\to HH^\\pmμ^\\mpν$ and $μ^+μ^-\\to AH^\\pmμ^\\mpν$, induced by $WZ$ and $Wγ$ fusion. Owing to their Vector Boson Fusion (VBF) origin, the corresponding cross sections increase significantly with collider energy, making them particularly well suited for exploration at a high-energy MuC. We first study the $2\\to 2$ subprocesses $WW\\to H^+ H^-$ and $WV\\to H^+ S_i$, with $V=Z, γ$ and $S_i=H,A$, and establish the presence of destructive interference among the contributing diagrams. After imposing theoretical consistency requirements and current experimental constraints, including those from DM and collider searches, we evaluate the corresponding signal rates at $\\sqrt{s}=3$, $10$, and $20$~TeV. We further perform a detector-level Monte Carlo analysis combined with a cut-based signal-background selection. Our results demonstrate that the sensitivity to inert scalar production grows significantly with collision energy, establishing the $10$ and $20$~TeV stages of a MuC as powerful probes of the IDM scalar sector.","authors":"Abdesslam Arhrib, Es-said Ghourmin, Ayoub Hmissou, Larbi Rahili, Bassim Taki","nlinked":88,"nref":94,"src":"INSPIRE","html":true},{"id":"3231350","arxiv":"2611.25931","title":"Interpretation of the LZ Event via Inelastic ALP-Dark Photon Transition with Photon Exchange","first":"Wang","nauth":3,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3201080]]. Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2794409]] (coupling 0.05, 6 shared references). Closest network paper: [[3202840]] (coupling 0.29, 19 shared references). Shared topics: nuclear recoil, dark matter.","score":36.5,"rank":8,"section":"new","parts":[0.48,0.14,0.82,0.0,0.31],"abstract":"The LUX-ZEPLIN (LZ) experiment has reported a nuclear recoil event at $248\\pm23$~keV with a global significance of about $2.6σ$. We for the first time explain it via the inelastic process with photon mediator. We consider a dark matter (DM) axion-like particle (ALP) $a$ converts into a heavier dark photon $γ'$ via the nuclear electromagnetic current, and study the photon-mediated endothermic transition $aA\\rightarrowγ'A$. We derive the kinematics and cross sections for non-relativistic halo and boosted ALPs. A three-bin Poisson fit to the LZ data includes the xenon isotopes, charge form factors, detector efficiency, and energy resolution. Halo DM, which has mass $m\\simeq1.2$~TeV, mass splitting $δ\\simeq346$~keV, and near the upper coupling bound, reproduces the event with about $61\\%$ in the middle bin. Boosted DM with $v_{0}=0.05\\,c$ and $Φ_{0}=10^{5}~\\mathrm{cm^{-2}\\,s^{-1}}$ requires only $m\\simeq5.74$~GeV and $δ\\simeq6.66$~MeV to give about $62\\%$. We find that a broader Gaussian spread in the incident energy has a significant effect on the fitted masses.","authors":"Quanyu Wang, Xiangwei Yin, Tianjun Li","nlinked":63,"nref":64,"src":"INSPIRE","html":true},{"id":"3231213","arxiv":"2611.25036","title":"Simulation-based inference for gravitational-wave cosmology: parameter reconstruction of a first-order electroweak phase transition","first":"Biekötter","nauth":3,"year":2026,"cites":0,"role":"today","note":"Cites 2 network papers: [[2134961]], [[2784023]]. Closest of your papers: [[2787890]] (coupling 0.03, 4 shared references). Closest network paper: [[3128752]] (coupling 0.15, 31 shared references).","score":33.6,"rank":9,"section":"cross","parts":[0.7,0.09,0.44,0.0,0.0],"abstract":"The detection of a stochastic gravitational-wave background (SGWB) from a cosmological first- order phase transition would be unambiguous evidence for physics beyond the Standard Model, with a strong electroweak phase transition (EWPT) at LISA as a prime example. Reconstructing the underlying model from such a signal is challenging, since the map from the model parameters to the spectrum is degenerate and strong transitions occupy only small and sparse regions of parameter space. We show that simulation-based inference (SBI), a likelihood-free approach applicable to generic SGWB sources, provides a reliable parameter reconstruction despite these difficulties. We first apply SBI to the thermodynamic parameters characterizing the transition, namely its strength, inverse duration, temperature and bubble wall velocity. As a concrete application, we then consider a strong EWPT in a singlet extension of the Standard Model and reconstruct the model parameters from the resulting SGWB. We find that the SBI posteriors agree with those of a likelihood-based Markov chain Monte Carlo analysis, at negligible cost per data set once the network has been trained. Using the network posterior as the proposal for importance sampling with the exact likelihood further corrects its remaining deviations, at a sampling efficiency several orders of magnitude higher than sampling from the prior. SBI thus offers a fast and flexible framework for the cosmological science case of LISA","authors":"Thomas Biekötter, Andrii Dashko, Kateryna Radchenko","nlinked":113,"nref":129,"src":"INSPIRE","html":true},{"id":"3231449","arxiv":"2611.26549","title":"Refractive Neutrino Mass: Effects of Fluctuations of the Dark Matter Field","first":"Sahasrabuddhe","nauth":3,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3089716]]. Closest of your papers: [[1854224]] (coupling 0.01, 1 shared references). Closest network paper: [[3089716]] (coupling 0.15, 11 shared references). Shared topics: scalar dark matter, complex scalar, neutrino mass, dark matter.","score":29.4,"rank":10,"section":"new","parts":[0.45,0.03,0.44,0.0,0.62],"abstract":"Observed neutrino oscillations can be reproduced by a refractive neutrino mass-squared arising from interactions with ultralight scalar dark matter (ULDM). The wave behaviour of the scalar field gives rise to a fluctuating interference pattern, inducing spatial and temporal variations in the refractive mass that can distort neutrino oscillation probabilities. We simulate the interference patterns of the scalar field in the presence of self-interactions. Using results of these simulations, the oscillation probabilities for JUNO and T2K experiments are computed. We find that the refractive mass scenario remains viable for the complex scalar field without self-coupling for $m_φ\\lesssim 10^{-16}~\\mathrm{eV}$. For $m_φ\\gtrsim10^{-16}~\\mathrm{eV}$, repulsive self-interactions narrow the density distribution, reducing the deviation of the survival probability at the first minimum to $ΔP \\approx 0.07$ for an appropriate self-interaction coupling. In contrast, for a real scalar field, rapid oscillations with the Compton frequency distort the probabilities for scalar masses $ 10^{-22}~\\mathrm{eV} \\lesssim m_φ\\lesssim 10^{-10} ~\\mathrm{eV}$, and self-interactions do not remove this distortion. This distortion becomes negligible only for $m_φ\\gtrsim10^{-9}~\\mathrm{eV}$. We explore additional effects which could modify the interference pattern and relax the constraints on the required values of $m_φ$. These include scenarios with multiple scalar fields (the axiverse), the gravitational effects of the Sun and Earth on the granule structure, and interactions with the relic neutrino background.","authors":"Soham Sahasrabuddhe, Manibrata Sen, Alexei Y. Smirnov","nlinked":52,"nref":53,"src":"INSPIRE","html":true},{"id":"3182562","arxiv":"2607.20340","title":"Monopoles, Strings, Walls and Gravitational waves","first":"Maji","nauth":2,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[2825297]]. Closest of your papers: [[2787890]] (coupling 0.03, 6 shared references). Closest network paper: [[2737686]] (coupling 0.16, 24 shared references). Shared topics: gravitational wave.","score":26.6,"rank":11,"section":"replacement","parts":[0.45,0.1,0.46,0.0,0.1],"abstract":"The gauge symmetry breaking $SU(2) \\to U(1) \\to Z_2 \\to 1$ successively produces monopoles, strings and domain walls bounded by strings (WBS), with the elementary monopole carrying a $U(1)$ magnetic flux twice as large as the elementary string. The elementary strings and subsequently WBS emit gravitational waves, and during their decay, the WBS yield a network of composite strings that carry the same $U(1)$ flux as the monopoles. Depending on the cosmological evolution, we provide the gravitational wave spectra generated by the elementary strings and WBS, in combination with the composite strings which are either effectively stable, quasistable, or metastable. These three scenarios are also realized in the symmetry breaking chain $SU(3) \\to SO(3) \\to Z_2 \\to 1$. Both $SU(2)$ and $SU(3)$ have appeared in the literature as flavor gauge symmetries.","authors":"Rinku Maji, Qaisar Shafi","nlinked":84,"nref":86,"src":"INSPIRE","html":true},{"id":"3231217","arxiv":"2611.25029","title":"Dirac leptogenesis with charged leptons","first":"Garcés","nauth":3,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Closest of your papers: [[1709434]] (coupling 0.02, 2 shared references). Closest network paper: [[3070028]] (coupling 0.12, 12 shared references). Shared topics: lepton flavor violation, early universe.","score":26.4,"rank":12,"section":"new","parts":[0.45,0.06,0.35,0.0,0.36],"abstract":"Popular frameworks that explain the baryon asymmetry of the Universe (BAU) are electroweak baryogenesis, requiring a first-order phase transition, and Majorana leptogenesis, which relies on lepton number violation in the neutrino sector. Dirac leptogenesis offers an alternative mechanism that avoids both requirements, instead allowing the BAU to follow from previously generated chiral asymmetries that remain out of equilibrium in the early Universe. Conventional realizations of this scenario typically invoke ultra-light Dirac neutrinos. In this work, we generalize the mechanism to include Standard Model charged leptons by assuming that their mass-generating interactions have a UV origin and arise from higher-dimensional operators. For concreteness, the analysis is performed within a Froggatt-Nielsen setup, which allows us to naturally address fermionic mass hierarchies, too, now linked to the BAU, and we show that the proposed mechanism is viable by supercooling the flavon phase transition. The framework predicts a flavon with a (1.7-50) GeV mass, bounded by the non-observation of lepton flavor violation and the requirement for the Universe to not reheat above sphaleron temperatures, which could be indirectly probed by future lepton flavor violation experiments.","authors":"Juan P. Garcés, Florian Goertz, Maya Hager","nlinked":73,"nref":82,"src":"INSPIRE","html":true},{"id":"3151200","arxiv":"2605.01318","title":"Gravitational waves from CP domain wall collapse and electron EDM in a complex singlet model with dimension-five Yukawa interactions","first":"Pham","nauth":2,"year":2026,"cites":0,"role":"repl","note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2690106]] (coupling 0.04, 4 shared references). Closest network paper: [[2734721]] (coupling 0.24, 13 shared references). Shared topics: singlet scalar, yukawa interaction, gravitational wave.","score":20.4,"rank":13,"section":"replacement","parts":[0.06,0.11,0.69,0.0,0.47],"abstract":"We study the interplay between gravitational waves (GWs) from domain wall collapse and the electron electric dipole moment (EDM) in a complex singlet extension of the standard model with dimension-five Yukawa interactions. In this framework, the scalar potential admits CP-related degenerate vacua, leading to the formation of CP domain walls. While the resulting GW signal provides a probe of the vacuum structure of the singlet scalar sector, it does not by itself constitute a CP-violating observable. Once the singlet scalar is coupled to standard model fermions, CP-violating phases become observable through EDMs. We analyze whether current and future EDM experiments can probe the parameter region where the GW signal is detectable by SKA and THEIA. We find that the current electron EDM bound already constrains part of the parameter space, while future sensitivities at the level of $10^{-31}$--$10^{-32}\\,e\\,\\mathrm{cm}$ can probe regions overlapping with the GW-detectable domain. Our results highlight the complementarity between GW and EDM observables in probing the singlet scalar sector, providing a coherent picture of its vacuum structure and CP properties.","authors":"Hieu The Pham, Eibun Senaha","nlinked":72,"nref":78,"src":"INSPIRE","html":true},{"id":"3230059","arxiv":"2611.21252","title":"Phenomenology of neutrino mass ordering synergies in reactor, accelerator, and atmospheric neutrino experiments, and the role of the detector response","first":"Cerrone","nauth":2,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[3193100]]. Closest of your papers: [[2751074]] (coupling 0.01, 1 shared references). Closest network paper: [[2721859]] (coupling 0.04, 4 shared references). Shared topics: neutrino mass.","score":20.3,"rank":14,"section":"replacement","parts":[0.45,0.04,0.12,0.0,0.16],"abstract":"The neutrino mass ordering is one of the main open questions of neutrino physics, addressed by reactor, accelerator, and atmospheric experiments and by their combination. When the data are fitted under the wrong ordering, each experiment returns its own value of $Δm^2_{31}$, its wrong-ordering solution. We show that this solution is a weighted average of the values preferred by the individual bins of the measured event spectra, in reconstructed energy and, for atmospheric neutrinos, also zenith angle, with weights set by their statistical precision. Both the values and the weights depend on the detector response. In the plane of $Δm^2_{31}$ fitted under the two orderings, the solutions lie on lines of slope close to $-1$, so that each experiment is described by one intercept. The weighted bin average extends the mass ordering sum rule to any oscillation experiment, including atmospheric neutrinos in Earth matter. It recovers the known closed forms for short-baseline reactors and for accelerators in vacuum, and for JUNO it equals a closed form evaluated at one effective energy, which depends on the energy resolution. Above the MSW resonance the frequency of atmospheric $ν_μ$ disappearance becomes nearly independent of $δ_{CP}$, and the $ν_μ$ disappearance solution moves mainly with $θ_{23}$. The atmospheric intercept depends on the energy and direction resolutions, the energy range, and the event classes, and differs between detectors. The synergy of two experiments is determined by the separation of their intercepts relative to their precisions on $|Δm^2_{31}|$. With JUNO, this separation depends strongly on $δ_{CP}$ for an accelerator and is nearly independent of $δ_{CP}$ and $θ_{23}$ for IceCube DeepCore using all channels.","authors":"Vanessa Cerrone, Marco Grassi","nlinked":97,"nref":112,"src":"INSPIRE","html":true},{"id":"3231410","arxiv":"2611.26324","title":"$Zb\\bar{b}$ couplings at the Large Hadron Collider","first":"Dermisek","nauth":5,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Closest of your papers: [[1455793]] (coupling 0.03, 4 shared references). Closest network paper: [[3206672]] (coupling 0.04, 4 shared references).","score":20.0,"rank":15,"section":"new","parts":[0.45,0.08,0.11,0.0,0.0],"abstract":"Constraining the $Z$-boson couplings of the $b$ quark, or even ruling out the possibility of an opposite-sign coupling, is considered very challenging at the LHC. Utilizing signatures of new physics resulting from contact operators accompanying the modification of $Zb\\bar{b}$ couplings from Standard Model predictions, we show that the ATLAS measurement of $pp\\to Zh$ already ruled out the opposite-sign couplings by more than 9.5 standard deviations. We also argue that $pp\\to Zhb$, which receives a contribution from the same contact term, would lead to even better sensitivity. Furthermore, we show that with future data this indirect method can provide the strongest constraints on $Zb\\bar{b}$ couplings, and can even probe the anomaly in these couplings left over from the LEP era.","authors":"Radovan Dermisek, Keith Hermanek, Marcos A. Hernandez Ojeda, Taegyu Lee, Navin McGinnis","nlinked":51,"nref":52,"src":"INSPIRE","html":true},{"id":"3231208","arxiv":"2611.24985","title":"Hadron masses and pseudoscalar meson form factors in a Poincaré-invariant constituent quark model","first":"Baek","nauth":1,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Closest network paper: [[3147506]] (coupling 0.06, 4 shared references).","score":18.3,"rank":16,"section":"new","parts":[0.45,0.0,0.16,0.0,0.0],"abstract":"We study a Poincaré-invariant constituent quark model with pair, fine-structure, and finite-range three-quark interactions treated in the diagonalization. A fit of 20 parameters to 36 meson and 27 baryon masses gives an rms deviation of $6.85\\,\\mathrm{MeV}$, with the common offset fixed by a spectral condition. The same mass-fit wave functions give the elastic form factors of ten pseudoscalar mesons in the light-front impulse approximation with the Melosh rotation. The pion and charged-kaon radii are $0.407$ and $0.411\\,\\mathrm{fm}$, below the measured values. Unlike experiment, the kaon radius slightly exceeds the pion radius. Replacing the pion radial function by the normalized $S$-wave component of the $ρ$ raises its radius to $0.604\\,\\mathrm{fm}$, showing that hyperfine compression accounts for most of the deficit in the mean-square charge radius. With the light-quark size fixed by the pion, the $K^+$ and $K^0$ radii require strange-quark sizes that differ by $2.2$ standard deviations.","authors":"Jongheon Baek","nlinked":55,"nref":55,"src":"INSPIRE","html":true},{"id":"3231290","arxiv":"2611.25402","title":"Helicity amplitudes and angular distributions in $D\\to b_1(1235)(\\toωπ)\\ell^+ν_\\ell$","first":"Zeng","nauth":2,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Closest network paper: [[3227657]] (coupling 0.02, 1 shared references).","score":16.8,"rank":17,"section":"new","parts":[0.45,0.0,0.07,0.0,0.0],"abstract":"Using the helicity amplitude technique, we derive the decay intensity for the charmed meson semileptonic decays $D\\to b_1(1235)\\ell^+ν_\\ell, b_1(1235)\\toωπ$ with $\\ell=e,μ$. Based on the theoretically predicted hadronic transition form factors, the branching fractions for $D^0\\to b_1(1235)^-\\ell^+ν_\\ell$ and their lepton flavor universality ratios are calculated. The predicted branching fractions of the positronic channel span $(2.6$--$8.8)\\times10^{-5}$, with most theoretical predictions being consistent with the previous BESIII measurement $(7.2\\pm1.8^{+0.6}_{-0.8})\\times10^{-5}$ by assuming $\\mathcal{B}(b_1(1235)\\toωπ)=1$. We further explore the partial decay widths and angular distributions of $D\\to b_1(1235)\\ell^+ν_\\ell, b_1(1235)\\toωπ$ and find distinct behavior among various hadronic transition form factors. Further amplitude analysis with larger statistics is thus desired to test these theoretical predictions.","authors":"Yijia Zeng, Hailong Ma","nlinked":22,"nref":22,"src":"INSPIRE","html":true},{"id":"3231200","arxiv":"2611.25062","title":"Naturalness scale inference in chiral perturbation theory and chiral logarithms","first":"Hassanzadeh","nauth":5,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Closest network paper: [[3193100]] (coupling 0.02, 14 shared references).","score":16.5,"rank":18,"section":"new","parts":[0.45,0.0,0.05,0.0,0.0],"abstract":"We infer naturalness scales of chiral perturbation theory in the mesonic sector using Bayesian techniques that are extended to explicitly take into account chiral logarithms. To demonstrate our approach, we consider the chiral expansion of the pion decay constant $F_π$ and the threshold and subthreshold parameters of $ππ$ scattering. We find a strong observable dependence of the inferred naturalness scales, and show that they need not coincide with the pion mass at which the order-by-order hierarchy of the chiral expansion breaks down. As an application, we discuss the requirements for lattice-QCD constraints on the two combinations of $O(p^6)$ low-energy constants that in the current matching of Roy-equation analyses to chiral perturbation theory need to be estimated from resonance saturation, but could be extracted from the pion-mass dependence of $ππ$ scattering parameters.","authors":"Tara Hassanzadeh, Martin Hoferichter, Lucas Platter, Jacobo Ruiz de Elvira, Matthias R. Schindler","nlinked":57,"nref":60,"src":"INSPIRE","html":true},{"id":"3211641","arxiv":"2610.05727","title":"Bakamjian--Thomas construction and light-front zero modes in pseudoscalar transitions: A comparison with the covariant Bethe--Salpeter model","first":"Choi","nauth":1,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[3193100]]. Closest network paper: [[3152706]] (coupling 0.02, 1 shared references).","score":16.5,"rank":19,"section":"replacement","parts":[0.45,0.0,0.05,0.0,0.0],"abstract":"We examine the role of light-front zero modes in the extraction of the semileptonic form factor $f_-(q^2)$ between pseudoscalar mesons. In an exactly solvable covariant Bethe--Salpeter (BS) model, we calculate the transverse-current zero-mode contribution directly from the shrinking nonvalence region and reproduce it with an effective operator in the valence convolution. In the valence-only light-front quark model (LFQM) based on the Bakamjian--Thomas (BT) construction, the one-body current is built from on-shell constituent spinors, and the interaction enters through the mass operator and wave functions. The $(+,\\perp)$ extraction of $f_-$ is zero-mode free and is saturated by the on-shell overlap. Using the free constituent invariant masses in the internal minus-current projection gives the same $f_-$ from $(+,-)$ after integration. For spacelike momentum transfer, we prove this equality for rotationally invariant radial wave functions with the light-front Jacobian and the adopted pseudoscalar spin coupling, provided the reduced overlaps converge. Subtracting the minus-current result obtained with physical meson masses from the common transverse result gives the BT completion. Current-component independence indirectly identifies this completion as the effective zero-mode contribution missing from the physical-mass minus-current extraction. When the BS valence current and the effective zero-mode operator for the nonvalence endpoint contribution are transferred unchanged to the Gaussian BT-based LFQM, the resulting expression fails to reproduce the component-independent BT result for $f_-$. We construct a mass-weighted complex transverse contour on which the Gaussian wave functions remain analytic for $0<q^2<(m_1+m_2)^2$, where $m_1$ and $m_2$ are the initial and final active-quark masses.","authors":"Ho-Meoyng Choi","nlinked":60,"nref":60,"src":"INSPIRE","html":true},{"id":"3231317","arxiv":"2611.25846","title":"Resonant Cavity Searches for Millicharged Dark Matter","first":"Albert","nauth":3,"year":2026,"cites":0,"role":"today","note":"Closest of your papers: [[1941263]] (coupling 0.12, 15 shared references). Closest network paper: [[2688651]] (coupling 0.11, 13 shared references). Shared topics: dark matter.","score":16.3,"rank":20,"section":"new","parts":[0.0,0.35,0.31,0.0,0.13],"abstract":"A plethora of resonant cavity experiments have been designed to search for ultralight dark matter (DM) candidates, such as axion or dark-photon DM. In this work, we show that these same apparatuses can be sensitive to ultralight millicharged dark matter (mDM) with masses $m_φ\\sim1-100\\,μ\\mathrm{eV}$. Similar to axion DM, in the presence of a background magnetic field, mDM acts as an effective current which can excite the modes of a resonant cavity. Importantly, for a cylindrical cavity, axion DM dominantly couples to the transverse magnetic (TM) modes, whereas mDM dominantly couples to the transverse electric (TE) modes. We project the sensitivity to mDM that resonant cavity experiments can achieve if they are able to tune and readout their TE modes. We find that fractional millicharges as small as $ε_m=e_m/e\\sim10^{-19}$ can be probed. If mDM constitutes only a subfraction $f_\\mDM \\lesssim0.2\\%$ of the total DM density, competing astrophysical bounds do not apply. In this case, resonant cavities can be the most sensitive probes of mDM in this mass range.","authors":"Miguel González Albert, Ariel Arza, Saarik Kalia","nlinked":75,"nref":89,"src":"INSPIRE","html":true},{"id":"3140676","arxiv":"2604.05041","title":"Aspects of a Five-Dimensional $U(1)_{L_μ- L_τ}$ Model at Future Muon-Based Colliders","first":"Chakraborty","nauth":5,"year":2026,"cites":0,"role":"repl","note":"Closest of your papers: [[3130296]] (coupling 0.09, 13 shared references). Closest network paper: [[2942039]] (coupling 0.20, 26 shared references).","score":15.6,"rank":21,"section":"replacement","parts":[0.0,0.24,0.56,0.0,0.0],"abstract":"We study a five-dimensional (5D) framework based on the $U(1)_{L_μ-L_τ}$ gauge symmetry, where the associated gauge field $V$ propagates in the bulk, giving rise to an infinite tower of Kaluza--Klein (KK) excitations $V^{(n)}$ that couple selectively to the second- and third-generation leptons. Originally motivated by its potential to address the muon $g-2$ anomaly, this framework remains of interest as a minimal, anomaly-free, phenomenologically well-motivated extension of the Standard Model (SM) of particle physics. We focus on high-energy muon-based colliders, which could directly probe the gauge structure without relying on the kinetic mixing between the SM hypercharge gauge boson and the 5D gauge boson $V$. We explore a set of complementary processes: the elastic $μ^+μ^+ \\to μ^+μ^+$ scattering via off-shell exchange of KK (gauge) excitations $V^{(n)}$; the bremsstrahlung production of $V^{(n)}$ followed by their decays into neutrinos and into $μ^-μ^+$ at a future $μ$TRISTAN collider. Further, we study the $μ^-μ^+ \\to μ^-μ^+$ scattering via resonant KK excitation(s) at a future muon collider. Our results show that these future muon-based colliders could offer sensitive and complementary probes into regions in the parameter space of the scenario that are beyond the reach of low-energy experiments. In particular, such experiments would be able to probe both heavier such KK gauge bosons with TeV-scale masses for relatively large gauge couplings, as well as the much lighter ones with masses in the MeV-scale for couplings as weak as $g_D \\sim \\mathcal{O}(10^{-5})$, thereby offering a promising $2σ$ exclusion reach for such KK excitations, over an extensive range of masses, at these facilities.","authors":"Dibyendu Chakraborty, Arindam Chatterjee, AseshKrishna Datta, Ayushi Kaushik, Kenji Nishiwaki","nlinked":127,"nref":131,"src":"INSPIRE","html":true},{"id":"3231275","arxiv":"2611.25581","title":"A New Gravitational Wave Power Law from Dissipative Sound Waves in Cosmological Phase Transitions","first":"Guo","nauth":5,"year":2026,"cites":0,"role":"today","note":"Closest of your papers: [[2627241]] (coupling 0.04, 3 shared references). Closest network paper: [[2928725]] (coupling 0.17, 16 shared references). Shared topics: gravitational wave.","score":11.5,"rank":22,"section":"new","parts":[0.0,0.11,0.49,0.0,0.1],"abstract":"Power-law behavior in cosmological gravitational wave (GW) spectra reveals the physical nature of their sources. For sound waves generated by cosmological first-order phase transitions, we identify a new high-frequency power law arising from the dissipative evolution of the acoustic source. In a dissipative plasma, the GW spectrum acquires an additional $q^{-2}$ suppression relative to the perfect-fluid result in the late-time, strong-damping limit. The exponent is largely insensitive to the source profile, while the turnover and suppression strength probe plasma transport and the source lifetime. In particular, the turnover frequency in weakly coupled hidden sector plasmas is sensitive to the underlying gauge coupling and can lie in the millihertz band targeted by space-based interferometers, opening a way to probe microscopic plasma dynamics through the detailed GW spectrum.","authors":"Huai-Ke Guo, Sihao Xiao, Yang Xiao, Jin Min Yang, Yang Zhang","nlinked":42,"nref":45,"src":"INSPIRE","html":true},{"id":"3231262","arxiv":"2611.25359","title":"Dark Matter Model Implications of a Candidate Sub-halo Near the Sun, and the Data Needed to Discriminate Among Them","first":"Profumo","nauth":2,"year":2026,"cites":0,"role":"today","note":"Closest of your papers: [[2787890]] (coupling 0.03, 4 shared references). Closest network paper: [[3214429]] (coupling 0.06, 17 shared references). Shared topics: primordial black hole, indirect detection, dark matter model, dark matter.","score":11.3,"rank":23,"section":"cross","parts":[0.0,0.09,0.17,0.0,0.62],"abstract":"Pulsar-timing accelerations point to a localized mass concentration near the Sun, consistent with a dark matter sub-halo. We work out what such an object implies for the nature of dark matter, organizing the implications by their observable effect: suppression or enhancement of structure formation, internal structure and survival after formation, and emission or scattering by the constituents. We discuss ultralight wave dark matter, thermal and nonthermal warm dark matter, dark acoustic oscillations and dark matter-baryon scattering, elastic and inelastic self-interactions, invisible decays with recoil, primordial black holes, indirect detection, and a possible connection to the LUX-ZEPLIN high-energy recoil candidate. We then ask what new data would discriminate among these models. The existing accelerations are measured outside the tidal radius, where they are blind to the interior mass distribution, to the object's velocity, and to the sub-halo population. We identify four routes that lift these degeneracies: accelerations measured inside the halo, which separate point-mass, cuspy, and cored profiles; lensing and accretion, which test whether the mass is compact; the morphology of annihilation or decay emission, which probes the inner profile; and a search for a comoving stellar population, which tests whether the object is dark and measures its velocity. We also contrast this program with pulsar-timing-array searches for transiting dark matter substructure, which probe vastly lighter objects through a different observable.","authors":"Stefano Profumo, Sukanya Chakrabarti","nlinked":79,"nref":82,"src":"INSPIRE","html":true},{"id":"3231445","arxiv":"2611.26541","title":"Self-gravity depletes superradiant clouds","first":"Bošković","nauth":4,"year":2026,"cites":0,"role":"today","note":"Closest of your papers: [[1941263]] (coupling 0.03, 8 shared references). Closest network paper: [[2669622]] (coupling 0.18, 22 shared references).","score":10.8,"rank":24,"section":"new","parts":[0.0,0.1,0.51,0.0,0.0],"abstract":"Superradiant clouds of ultralight scalars around black holes are often modeled as free fields, whose levels grow independently and decay slowly through gravitational-wave emission. We show that this limit is never realized. The cloud's self-gravity redistributes particles between levels, just as in the case of axion self-interactions, and dominates over self-interactions for decay constants $f_a\\gtrsim6\\times10^{16}\\,{\\rm GeV}\\,(α/0.1)$, with $α$ the gravitational fine-structure constant. Self-gravity depletes the cloud by orders of magnitude and feeds more extended levels, weakening all signals that rely on the existence of a large cloud mass. A binary companion, however, can partly offset the depletion. Any assessment of superradiant signals must therefore account for both self-gravity and the cloud's environment.","authors":"Mateja Bošković, Lucas Gathercole, Thomas F. M. Spieksma, Samuel J. Witte","nlinked":80,"nref":83,"src":"INSPIRE","html":true},{"id":"3231241","arxiv":"2611.25060","title":"The BSM Rollercoaster, 1980-2000","first":"Dimopoulos","nauth":1,"year":2026,"cites":0,"role":"today","note":"Closest of your papers: [[1655573]] (coupling 0.08, 5 shared references). Closest network paper: [[2744388]] (coupling 0.07, 14 shared references).","score":10.1,"rank":25,"section":"new","parts":[0.0,0.23,0.21,0.0,0.0],"abstract":"This contribution is a personal historical retrospective on beyond-the-Standard-Model (BSM) physics from 1978 to the early 2000s, organized around its emotional rollercoaster. I trace two waves of optimism separated by a multiyear contraction of confidence, both ultimately ending in disappointment when decisive experimental confirmation failed to arrive. The story begins in 1978, when the Standard Model emerged as the front-runner. It then moves from the first wave of excitement over naturalness and Technicolor, rumored proton-decay events, and the construction of the Minimal Supersymmetric Standard Model, to the contraction of confidence in the late 1980s. A dramatic revival came in 1991, when the LEP and SLC precision data pointed toward supersymmetric unification, but it eventually gave way to renewed disappointment over the absence of superpartners and the sharpening of the LEP paradox. I also describe how the realization that Newtonian gravity had been tested only down to distances of order centimeters opened the door to large extra dimensions. Finally, I discuss how Weinberg's 1987 anthropic argument for the cosmological constant, the 1998 discovery of cosmic acceleration, and the emergence of the string landscape changed the intellectual status of naturalness itself and led to Split Supersymmetry. I have tried to describe not only what was proposed, but why these ideas felt compelling at the time, why confidence rose and fell, and how later evidence changed our sense of what could count as an explanation.","authors":"Savas Dimopoulos","nlinked":54,"nref":60,"src":"INSPIRE","html":true},{"id":"3231421","arxiv":"2611.26417","title":"Thermal Resummation Effects on Electroweak Phase Transitions and Gravitational Waves in Conformal and Non-Conformal 2HDMs","first":"Zhao","nauth":3,"year":2026,"cites":0,"role":"today","note":"Closest of your papers: [[1402978]] (coupling 0.02, 3 shared references). Closest network paper: [[2128137]] (coupling 0.17, 17 shared references). Shared topics: gravitational wave.","score":10.0,"rank":26,"section":"new","parts":[0.0,0.06,0.47,0.0,0.1],"abstract":"We quantify how thermal resummation affects electroweak phase transitions and gravitational-wave predictions in classically conformal and non-conformal two-Higgs-doublet models. We compare multi-field partial dressing (PD), which retains the full thermal functions and determines scalar masses and mixing from gap equations, with the Parwani and Arnold-Espinosa (AE) prescriptions at identical zero-temperature inputs. Completed first-order transitions dominate the conformal scan under all three prescriptions. PD typically gives the strongest and most supercooled transitions, reaching $T_p/T_c \\simeq 0.5$ versus $T_p/T_c \\gtrsim 0.8$ for Parwani and AE. At every conformal point where all three predict completion, PD gives the largest gravitational-wave peak amplitude, followed by Parwani and AE. The non-conformal model has no universal ordering, and the prescription changes the type of thermal history across extended regions of parameter space. For representative benchmarks, PD and AE differ by up to about nine orders of magnitude in peak amplitude and a factor of about fifty in peak frequency. In multi-field PD, the dressed tadpole is not a gradient, so the reconstructed potential depends on the integration path. In benchmark tests, changing the path shifts the transition temperatures by at most about 7% and the peak amplitude by up to a factor of about three. This intrinsic ambiguity is smaller than the largest differences between prescriptions. Thermal resummation is a major source of uncertainty in these phase-transition and gravitational-wave predictions.","authors":"Yu-Bo Zhao, Ji-Wei Li, Zhi-Wei Wang","nlinked":80,"nref":84,"src":"INSPIRE","html":true},{"id":"1394206","arxiv":"1509.06313","title":"Fermion dark matter from SO(10) GUTs","first":"Arbelaez","nauth":4,"year":2015,"cites":30,"role":"seed","note":"","score":null},{"id":"3193100","arxiv":"","title":"Review of Particle Physics","first":"Takahashi","nauth":259,"year":2026,"cites":493,"role":"other","note":"","score":null},{"id":"3147506","arxiv":"2604.19197","title":"CP-violating multi-field phase transitions and gravitational waves in a hidden NJL sector","first":"Liu","nauth":1,"year":2026,"cites":0,"role":"other","note":"","score":null},{"id":"2825297","arxiv":"2409.03498","title":"Cosmic superstrings, metastable strings and ultralight primordial black holes: from NANOGrav to LIGO and beyond","first":"Datta","nauth":2,"year":2024,"cites":28,"role":"other","note":"","score":null},{"id":"2928725","arxiv":"2506.02116","title":"Primordial gravitational waves from phase transitions during reheating","first":"Banik","nauth":3,"year":2025,"cites":8,"role":"other","note":"","score":null},{"id":"2691930","arxiv":"2308.15322","title":"Constraining axion and ALP dark matter from misalignment during reheating","first":"Xu","nauth":1,"year":2023,"cites":21,"role":"other","note":"","score":null},{"id":"2719600","arxiv":"","title":"Structure formation in quantum-wave dark matt ,"c"],[18,27,"c"],[22,62,"k"],[37,109,"c"],[107,106,"c"],[4,65,"c"],[101,58,"c"],[63,71,"c"],[100,112,"c"],[34,35,"c"],[89,106,"c"],[6,68,"k"],[51,113,"c"],[73,58,"c"],[95,80,"c"],[72,35,"c"],[33,103,"c"],[19,54,"k"],[29,104,"c"],[97,112,"c"],[62,44,"c"],[30,41,"c"],[107,101,"c"],[5,74,"c"],[20,84,"k"],[44,105,"c"],[91,74,"c"],[98,56,"c"],[19,88,"k"],[55,83,"c"],[37,116,"c"],[55,52,"c"],[6,92,"k"],[21,93,"k"],[54,88,"c"],[33,35,"c"],[7,98,"k"],[25,99,"k"],[10,102,"k"],[44,46,"c"],[60,30,"c"],[47,58,"c"],[31,112,"c"],[84,101,"c"],[113,54,"c"],[71,100,"c"],[0,107,"k"],[57,107,"c"],[85,88,"c"],[107,88,"c"],[11,27,"c"],[107,112,"c"],[85,77,"c"],[85,101,"c"],[5,73,"k"],[20,114,"k"],[32,61,"c"],[55,93,"c"],[3,115,"k"],[70,47,"c"],[5,34,"k"],[8,115,"c"],[12,35,"c"],[94,64,"c"],[95,58,"c"]],"next":[{"arxiv":"2606.12915","id":"3167932","title":"Mass Varying Neutrino Oscillation in Teleparallel Gravity","authors":"H. Mohseni Sadjadi, H. Yazdani Ahmadabadi","score":9.3,"section":"replacement","rank":27,"parts":[0.06,0.11,0.15,0.0,0.16],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1854224]] (coupling 0.04, 5 shared references). Closest network paper: [[1796007]] (coupling 0.05, 10 shared references). Shared topics: neutrino mass.","abstract":"In the Cartan teleparallel formulation of gravity, a scalar field coupled to the torsion tensor can acquire an environment-dependent effective mass. This gives rise to a screening effect: inside dense bodies such as the Sun, the scalar field is suppressed, causing the neutrino mass to vary with local density. We investigate the impact of this torsion-induced screening on solar neutrino oscillations. The mechanism modifies the standard MSW resonance condition distinctly, leading to detectable shifts in the flavor conversion probability. Using data from solar neutrino experiments (Super-Kamiokande, Borexino, SNO), we place constraints on the torsion scalar coupling parameters. Our work provides a concrete test of teleparallel gravity through mass-varying neutrino oscillations."},{"arxiv":"2611.25872","id":"3231299","title":"Majorana dark matter from a thick-to-thin brane junction: Modal stability, real-mediator coannihilation, and a dark-radiation imprint","authors":"F. A. Brito","score":9.0,"section":"new","rank":28,"parts":[0.0,0.11,0.27,0.0,0.17],"note":"Closest of your papers: [[1220579]] (coupling 0.04, 3 shared references). Closest network paper: [[2958466]] (coupling 0.09, 6 shared references). Shared topics: dark matter.","abstract":"We show that the localized spectrum of a $D=7$ thick-to-thin brane junction can host a thermal Majorana dark-matter candidate. The anisotropy of the wall widths isolates a light junction fermion, which a four-dimensional Majorana mass splits into two nearby states. The factorized transverse profiles impose a modal selection rule on all cubic couplings, and together with the relaxation of the softly deformed background this makes the lighter state stable without an imposed dark parity. Because the localized mediator is a real scalar, identical Majorana particles annihilate in the $s$ wave, and the relic coupling becomes nearly independent of the Majorana mass. The junction sector is a Standard-Model singlet whose light chiral mode is a source of dark radiation. Current CMB data restrict its decoupling temperature and imply $0.05\\lesssim\\dNeff\\lesssim0.076$ for dark-matter masses between $10\\GeV$ and $1.5\\TeV$, a range accessible to next-generation CMB surveys."},{"arxiv":"2611.25473","id":"3231224","title":"Upper Bounds on the Radion Mass in a Warped Extra Dimension","authors":"Leandro Da Rold, Eugenio Megias, Mariano Quiros, Lindber Salas","score":8.5,"section":"cross","rank":29,"parts":[0.0,0.07,0.42,0.0,0.0],"note":"Closest of your papers: [[636564]] (coupling 0.02, 1 shared references). Closest network paper: [[3215109]] (coupling 0.15, 7 shared references).","abstract":"We study absolute upper bounds on the mass ratio $R_{11}=m_{r_1}/m_{h_1}$ between the radion ($r_1$) and graviton ($h_1$) lightest modes in five dimensional warped models. We consider warped models with an admissible singular behavior in the infrared: i.e.~models with power-like ($\\sim \\barφ^{2n}$) and with exponential ($\\sim e^{2ν\\barφ}$) bulk potentials, where $\\barφ$ is the stabilizing bulk field. We find a correlation between $R_{11}$ and the singular behavior of the Ricci scalar, which allows to establish an absolute upper bound on the former. For the power-like models, the maximum value of $R_{11}$ increases with $n$. In the limit $n\\to\\infty$, the power-like model reproduces the exponential model and reaches the same upper bound as the latter. For the exponential model, we derive analytically the bound $R_{11}<1$, with the largest value approached for the case $ν\\to 1^+$ (where $ν=1$ corresponds to the linear dilaton model) and consistent with unitarity sum rules. For exponential models we also obtain the absolute upper bound on the second radion mode ratio $R_{21}=m_{r_2}/m_{h_1}\\lesssim 1.374$. This value is reached for $ν=2$ when the IR brane approaches the singularity. For this configuration, we verify that the scalar contribution satisfies the unitarity sum rule when the complete radion Kaluza-Klein tower is included."},{"arxiv":"2611.26620","id":"3231458","title":"Little Red Dots from Primordial Vacuum Bubbles","authors":"Miguel Barroso Varela, Katherine Freese, Matthew Kleban, Cameron Norton, Evangelos I. Sfakianakis","score":8.1,"section":"cross","rank":30,"parts":[0.0,0.03,0.25,0.0,0.35],"note":"Closest of your papers: [[1824064]] (coupling 0.01, 2 shared references). Closest network paper: [[2923472]] (coupling 0.09, 7 shared references). Shared topics: primordial black hole.","abstract":"Quantum tunneling transverse to the inflaton trajectory can produce $10^6$--$10^8M_\\odot$ primordial black holes at the abundance of JWST's little red dots, without the enhanced curvature perturbations excluded by limits on CMB spectral distortions. Rare vacuum bubbles nucleate during a brief interval of inflation and later form black holes, with adjustable mass and abundance and a narrow mass spectrum of percent-level width. The leading constraint, from accretion, is satisfied for a population matching the bright little red dots even if all the emitted radiation escapes as hard X-rays."},{"arxiv":"2611.25876","id":"3231316","title":"Gamma-Ray Bursts from Primordial Black Hole-Induced Neutron Star Collapse","authors":"Yu Watanabe, Koichiro Yasuda, Alexander Kusenko","score":7.8,"section":"cross","rank":31,"parts":[0.0,0.03,0.13,0.0,0.49],"note":"Closest of your papers: [[2790381]] (coupling 0.01, 3 shared references). Closest network paper: [[3141847]] (coupling 0.05, 9 shared references). Shared topics: primordial black hole, dark matter, gravitational wave.","abstract":"We show that the capture and subsequent endoparasitic consumption of a neutron star (NS) by a primordial black hole (PBH) can produce a short gamma-ray burst (GRB) without forming an accretion disk. During PBH-induced NS consumption, the NS spin is amplified through angular-momentum conservation and transfer from infalling matter, while flux freezing and a differential-rotation-driven dynamo amplify the magnetic field. We find that, for rapidly rotating millisecond pulsars (MSPs), these mechanisms can power short GRBs through magnetic dipole radiation and magnetic energy release. If asteroid-mass PBHs in the range $10^{-14}M_\\odot$--$10^{-11}M_\\odot$ constitute the dark matter, we estimate that searches of the Fermi-GBM archive and a future MeV gamma-ray mission such as COSI could detect these bursts. We also discuss possible multimessenger counterparts, including fast radio bursts powered by magnetic energy release, kilonovae and $511\\,{\\rm keV}$ line emission associated with centrifugally ejected neutron-rich matter, and gravitational waves from the rapid collapse and subsequent black-hole ringdown. Together, these signals probe complementary stages of PBH-induced NS consumption."},{"arxiv":"2611.25016","id":"3231212","title":"Automate the geometric SMEFT at dimension eight","authors":"Benoît Assi, Adam Martin","score":6.6,"section":"new","rank":32,"parts":[0.06,0.04,0.22,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2690106]] (coupling 0.01, 2 shared references). Closest network paper: [[2630211]] (coupling 0.08, 8 shared references).","abstract":"We present the first complete dimension-eight implementation of the geometric Standard Model Effective Field Theory (geoSMEFT) as UFO models for event generators such as MadGraph. The models contain all 674 baryon-number-conserving operators, with minimal flavour violation for the fermionic operators, and are also provided in the Murphy basis. We include dimension-six contributions and electroweak input-parameter corrections consistently through order $1/Λ^4$, and provide dimension-eight squared contributions as a diagnostic of EFT truncation. We validate the implementation against independent calculations and Ward identities. To make these models practical for collider studies, we develop a standalone tool that identifies all operators contributing to a given process at tree level, including those entering through input-parameter shifts. It reports their expected energy scaling and generates a restriction card to reduce the computational cost of event generation. The same geometric construction allows us to calculate two- and three-point functions beyond dimension eight, to arbitrary order in $1/Λ^2$. The models and the tool are publicly available."},{"arxiv":"2610.38463","id":"3220160","title":"Gauge-parameter cancellation and finite form factors in one-loop quark scattering in the refined Gribov-Zwanziger framework","authors":"Wan Wu","score":6.4,"section":"replacement","rank":33,"parts":[0.0,0.06,0.3,0.0,0.0],"note":"Closest of your papers: [[1365306]] (coupling 0.02, 1 shared references). Closest network paper: [[3170413]] (coupling 0.11, 4 shared references).","abstract":"We calculate the one-loop amplitude for distinct-flavor massless quark scattering in a local BRST-invariant refined Gribov-Zwanziger theory with minimally coupled quarks. The constraint determinant and two dynamical quark flavors are included in the action and loop sum. Retaining the RGZ masses in the free field matrix, we combine the mixed self-energy insertion, complete vertex and box corrections, and external-leg residues. The difference between a general linear covariant gauge and a reference gauge vanishes symbolically after removal of the Stueckelberg regulator in the specified dimensional prescription. We separate ultraviolet and infrared poles, including contributions hidden by scaleless integrals and the order of mass and dimensional limits. Local modified-minimal-subtraction counterterms cancel the ultraviolet poles, and the remaining infrared poles cancel in the stated nonzero-mass domain. The finite result is supplied as eight color-spin form factors over a thirty-entry scalar integral inventory, with all 144 finite-function coefficients provided electronically. Physical-region benchmarks evaluate the scalar functions on a common analytic sheet. Along a specified common-mass scaling path, the four physical color-helicity coefficients approach the QCD finite hard amplitudes numerically at three scattering angles after an explicit infrared conversion. Infrared helicity differences isolate color-dependent mass corrections beyond a universal rescaling of the Born exchange. A low-momentum expansion identifies an effective contact-interaction scale and clarifies the suppression relative to massless exchange. The result defines a partonic amplitude on a specified analytic branch; it does not establish a unitary colored-state S matrix or an inclusive next-to-leading-order cross section."},{"arxiv":"2611.26594","id":"3231438","title":"UV Bounds on Inflationary Parity Violation","authors":"Alexander Cassem, Mark P. Hertzberg","score":6.3,"section":"cross","rank":34,"parts":[0.0,0.09,0.23,0.0,0.0],"note":"Closest of your papers: [[2663002]] (coupling 0.03, 6 shared references). Closest network paper: [[3076170]] (coupling 0.08, 11 shared references).","abstract":"A question of fundamental interest is whether parity is violated on large scales in the Universe. This possibility has been motivated by recent analyses of the four-point matter correlation function. It has also been suggested that detectable parity violation could be generated during inflation by the dynamical Chern-Simons operator, a leading effective field theory correction to general relativity. In this work, we examine this possibility in realistic UV completions, including fermionic and string-theoretic examples. We show that existing bounds on the tensor-scalar-scalar (TSS) bispectrum strongly constrain the possibility of generating a detectable parity-odd trispectrum. For tensor-to-scalar ratios near current observational limits, detectability is incompatible with, or pushes against, the regime of validity of these UV completions. A detectable signal can remain possible for a sufficiently small tensor-to-scalar ratio, but only at the cost of an extremely large enhancement of the TSS vertex. Thus, while a future search for large scale parity violation is worth pursuing, generating a detectable signal within a consistent effective theory is highly nontrivial."},{"arxiv":"2611.26418","id":"3231416","title":"Future avenues for precision oscillation measurements with compact movable reactors","authors":"Matheus Hostert, Stephan A. Meighen-Berger, Maxim Pospelov","score":6.2,"section":"new","rank":35,"parts":[0.0,0.09,0.23,0.0,0.0],"note":"Closest of your papers: [[1854224]] (coupling 0.03, 5 shared references). Closest network paper: [[3158607]] (coupling 0.08, 9 shared references).","abstract":"No planned neutrino experiment is expected to surpass Daya Bay's precision on $\\thone$. Doing so requires innovative strategies to reduce statistical and systematic uncertainties. In this study, we consider a futuristic program with a movable reactor antineutrino source placed within short distances ($L\\lesssim 3\\,\\km$) from the Jiangmen Underground Neutrino Observatory (JUNO) detector. Due to the large fiducial mass of JUNO, even a relatively small reactor can produce a statistically significant number of events over a few years to probe the $\\lesssim 8.7\\% \\,\\nuebar$ disappearance set by $\\thone$. We consider two possibilities: a $\\mathcal{O}(20\\mwth)$ microreactor in alcoves of the access tunnel to the underground laboratory, and a $\\mathcal{O}(400 \\mwth)$ unit on the surface. In both cases the reactor is observed by a small flux monitor detector near the source, while JUNO measures the antineutrino flux at two baselines, suppressing correlated flux and detector systematics. Using the measured Daya Bay per-isotope spectra and its covariance, we model a high-assay low-enriched uranium (HALEU) core for the microreactor and a low-enriched uranium (LEU) core for the surface unit, and discuss various potential sources of systematic uncertainties and their impact on the precision of $\\thone$. The underground microreactor could improve on JUNO's reach by a factor of three to four, to $\\relsth \\simeq 4\\%$ over a decade, while the surface reactor would reach the present global-fit precision, $\\relsth=2.5\\%$, in about three years, provided the emission rate is monitored across reactor relocations to the sub-percent level."},{"arxiv":"2601.15839","id":"3110486","title":"Interplay between the chiral and deconfinement transitions from a Curci-Ferrari-based Polyakov loop potential","authors":"V. Tomas Mari Surkau, Urko Reinosa","score":5.6,"section":"replacement","rank":36,"parts":[0.06,0.02,0.19,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2787890]] (coupling 0.01, 1 shared references). Closest network paper: [[3147506]] (coupling 0.07, 7 shared references).","abstract":"We couple the two-flavor Nambu--Jona-Lasinio model to a gluonic background corresponding to the gauge-field expectation value in the center-symmetric Landau gauge. Low-energy features in this gauge are captured by a center-symmetric extension of the Curci-Ferrari model and provide a good grasp on key aspects of the confinement/deconfinement transition. Within this framework, we can investigate the interplay between the chiral and deconfinement transitions. Compared to other approaches based on multi-parameter Ansätze of the Polyakov loop potential fixed from comparison to finite-temperature lattice data, the modeling of the glue sector in the present set-up depends on only one phenomenological parameter that can be fixed by comparison to lattice data in the vacuum. We detail the structure of the phase diagram, with special emphasis on the finite density axis, and compute thermodynamical observables relevant for applications. We also highlight the properties of the recently introduced net quark number response of the medium as a sensible probe of the phases of QCD, in particular as a tool to disambiguate the nature of certain regions of the phase diagram where the use of the Polyakov loops could lead to misinterpretations. Finally, we critically assess the sensitivity of our results to the various parameters, both in the glue sector and in the chiral sector."},{"arxiv":"2512.10729","id":"3092161","title":"Two-dimensional Pulsar Distance Inference from Nanohertz Gravitational Waves","authors":"Si-Ren Xiao, Ji-Yu Song, Yue Shao, Ling-Feng Wang, Jing-Fei Zhang, Xin Zhang","score":5.6,"section":"replacement","rank":37,"parts":[0.0,0.07,0.16,0.0,0.1],"note":"Closest of your papers: [[2787890]] (coupling 0.03, 5 shared references). Closest network paper: [[3194628]] (coupling 0.06, 7 shared references). Shared topics: gravitational wave.","abstract":"Pulsar timing arrays (PTAs) are limited in localizing nanohertz continuous gravitational waves (CGWs) by uncertainties in pulsar distances. We introduce a method to infer pulsar distances in two dimensions, using phase information from the pulsar terms of multiple CGW sources. Our approach can enhance distance precision relative to existing one-dimensional distance-inference methods. Using idealized SKA-motivated PTA simulations with prospective pulsar-distance priors, we combine information from five high-SNR CGW sources with known sky positions and luminosity distances. For example, our method achieves subparsec precision for a simulated pulsar at $0.8\\,\\mathrm{kpc}$ in $40\\%$ of realizations, compared with none for the existing one-dimensional method. Such improvements in pulsar-distance precision could facilitate CGW host-galaxy identification and multimessenger observational prospects."},{"arxiv":"2611.25795","id":"3231298","title":"Parity restoration in a sterile-neutrino scenario: bounds from atomic parity violation to the LHC","authors":"Iman Motie, She-Sheng Xue, Alain Blanchard","score":5.4,"section":"new","rank":38,"parts":[0.06,0.02,0.18,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1421624]] (coupling 0.01, 1 shared references). Closest network paper: [[3090922]] (coupling 0.06, 6 shared references).","abstract":"In a four-fermion-interaction scenario beyond the Standard Model (SM), in which right-handed (sterile) neutrinos take part in TeV-scale composite dynamics, the $Z$ boson acquires an energy-dependent right-handed coupling $\\GR(q^2)$ that is expected to vanish at low energies and to restore parity symmetry at high energies. We derive the contribution of $\\GR$ to neutral-current parity-violating observables. At first order in $\\GR$, every low-energy parity-violating coupling is obtained from its SM value by the replacement $\\sin^2θ_W\\to\\sin^2θ_W(1-\\GR)$; in particular the nuclear weak charge is shifted by $ΔQ_W=4\\sin^2θ_W\\,Z\\,\\GR$, while the $Z$-pole effective mixing angle is shifted by $-\\tfrac12(1-2\\sin^2θ_W)\\GR$. Using atomic parity violation in cesium, parity-violating electron scattering and $Z$-pole determinations of $\\sin^2θ_{\\rm eff}$, we extract $\\GR$ at each momentum transfer. All data are consistent with $\\GR=0$; at the $Z$ pole we find $\\GR(m_Z)<1.1\\times10^{-3}$ (95\\% CL). We then use the CMS measurement of the Drell--Yan forward--backward asymmetry at dilepton masses above 170~GeV to constrain the coupling directly at TeV momentum transfer, finding $\\GR<0.04$ (95\\% CL) for $0.2<\\sqrt{q^2}<2$~TeV. Combining both, the scale of parity restoration in a running $\\GR=q^{2n}/(q^{2n}+Λ^{2n})$ must satisfy $Λ>3.8$, $2.1$ and $1.7$~TeV for $n=1,2,3$. Future MOLLER, P2 and HL-LHC data will improve these bounds."},{"arxiv":"2611.26364","id":"3231402","title":"Quantum Autoencoder on Real Hardware for New Physics Searches at Muon Colliders","authors":"Shuai Zhang, Ji-Chong Yang","score":5.2,"section":"new","rank":39,"parts":[0.0,0.06,0.22,0.0,0.0],"note":"Closest of your papers: [[1455793]] (coupling 0.02, 2 shared references). Closest network paper: [[2115290]] (coupling 0.08, 4 shared references).","abstract":"We apply a quantum autoencoder to search for new physics (NP) in the tri-photon process $μ^+μ^-\\toγγγ$ at muon colliders. Using a six-qubit circuit on the Tianyan176 quantum computer, we measure the reconstruction losses for Standard Model (SM) events and anomalous quartic gauge couplings (aQGCs) events. The results demonstrate that the hardware-implemented quantum autoencoder effectively discriminates NP signals from the SM background. Concurrently, we derive the expected constraints on the aQGCs coefficients and compare them with those obtained from conventional methods."},{"arxiv":"2611.25013","id":"3231188","title":"Theory of Particle Scattering on Superconducting Qubits: From Single Devices to Quantum Arrays","authors":"Doojin Kim, Kyoungchul Kong, Myeonghun Park","score":4.7,"section":"new","rank":40,"parts":[0.0,0.07,0.1,0.0,0.13],"note":"Closest of your papers: [[2856850]] (coupling 0.02, 2 shared references). Closest network paper: [[2012895]] (coupling 0.03, 2 shared references). Shared topics: dark matter.","abstract":"Superconducting qubits provide microwave-scale transitions and thus offer quantum targets for direct particle scattering with extremely small energy transfer. We develop a general framework for inelastic scattering in which an incident particle exchanges an off-shell photon with a superconducting quantum circuit, inducing a transition from a lower-energy internal state of the circuit to a higher-energy one. The target dependence is encoded in a finite-momentum electromagnetic transition current and, for charge-dominated response, in a qubit transition form factor. A key feature of particle scattering is that a microwave-scale excitation does not necessarily correspond to a long-wavelength interaction, since nonrelativistic particles can transfer spatial momenta much larger than the deposited energy. The full finite-momentum device response is therefore essential. We specialize the formalism to transmon qubits, construct a realistic electrostatic response for a planar Xmon-style transmon, and apply it to photon-mediated scattering of eV-scale bosonic dark matter, including final-state Bose stimulation. We find that the resulting enhancement substantially improves the projected sensitivity at the lowest masses. Owing to the exceptionally low transition threshold of superconducting qubits, this approach opens sensitivity to dark matter in the eV-to-keV mass range, which remains largely unexplored by existing direct-detection experiments. We further show that $N$ independently operated qubits give the expected rate proportional to $N$, while suitably prepared Dicke states can in principle achieve a collective enhancement approaching $N^2$ when spatial coherence is maintained across the array. These results establish superconducting qubits as quantum targets for direct particle scattering and provide a framework for optimizing low-threshold dark-matter searches."},{"arxiv":"2607.25317","id":"3184108","title":"Gravitational Waves from Superconducting Cosmic Strings","authors":"Jinyoung Jhun, Takashi Hiramatsu","score":4.7,"section":"replacement","rank":41,"parts":[0.0,0.07,0.11,0.0,0.1],"note":"Closest of your papers: [[2663002]] (coupling 0.02, 4 shared references). Closest network paper: [[3191566]] (coupling 0.04, 6 shared references). Shared topics: gravitational wave.","abstract":"We study the evolution of superconducting cosmic-string networks in a $U(1)_{\\rm local}\\times U(1)_{\\rm global}$ field-theoretic model using three-dimensional lattice field simulations in an expanding universe. The scalar field charged under $U(1)_{\\rm local}$ forms cosmic strings, while the scalar field associated with $U(1)_{\\rm global}$ acts as a current carrier and condenses in their vicinity. We investigate the evolution of the string network for several values of the coupling constant between the string-forming and current-carrier fields and estimate the gravitational-wave power spectrum sourced by the resulting superconducting cosmic-string network. We find that the spectral shape depends on the coupling constant: as the interaction strength increases, the spectrum is suppressed on small scales. This feature may be probed by future high-frequency gravitational-wave observations."},{"arxiv":"2611.26281","id":"3231427","title":"Predictions for Inclusive Production Cross Sections of the Higgs Boson at the LHC and HL-LHC","authors":"Robin Hayes, Alexander Karlberg, Bernhard Mistlberger, Dermot Moran, Hannah Arnold, Gaetano Barone, Christian Biello, Johannes Blümlein, Valeria Botta, Christian Brønnum-Hansen, Alessandro Calandri, Benjamin Campillo, Alessandra Cappati, Andrea Cardini, Suman Chatterjee, Jiayi Chen, Michal Czakon, Valerio Dao,
