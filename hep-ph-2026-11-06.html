<script>
const RAW = {"n":[{"id":"3225492","arxiv":"2611.08440","title":"Signatures of Neutrinophilic Pion Dark Matter","first":"Chevallier","nauth":3,"year":2026,"cites":0,"role":"today","note":"Co-authors of yours: Landini. Cites your papers: [[2787890]], [[2964960]]. Cites 7 network papers: [[3210992]], [[3091093]], [[3115042]], [[3178478]], [[2750604]], [[1515160]]…. Closest of your papers: [[2787890]] (coupling 0.32, 36 shared references). Closest network paper: [[3115042]] (coupling 0.34, 42 shared references). Shared topics: observed relic, relic abundance, dark matter mass, neutrino mass, dark matter.","score":90.5,"rank":1,"section":"new","parts":[1.0,0.93,0.98,0.5,0.81],"abstract":"We study the phenomenology of pion dark matter coupled to neutrinos in a confining sector that dynamically generates both small neutrino masses and dark matter mass from gauge confinement. Dark matter semi-annihilation to active neutrinos or annihilation to light sterile neutrinos can reproduce the observed relic abundance through thermal freeze-out while satisfying constraints from self-interactions. In the first scenario, semi-annihilations of sub-GeV dark matter in the galactic halo produce a flux of antineutrinos which can provide a viable interpretation for the mild electron antineutrino excess reported by the Super-Kamiokande collaboration. We assess the potential of the JUNO detector to test this interpretation. In the second scenario, light sterile neutrinos can leave signatures through displaced vertex searches at accelerator facilities.","authors":"Claire Chevallier, Ji-Heng Guo, Giacomo Landini","nlinked":92,"nref":93,"src":"INSPIRE","html":true},{"id":"3179642","arxiv":"2607.09282","title":"Leptogenesis with sub-electroweak-scale reheating temperature","first":"Barman","nauth":4,"year":2026,"cites":0,"role":"repl","note":"Co-authors of yours: Barman. Cites your papers: [[3184726]]. Cites 10 network papers: [[3210485]], [[2956181]], [[2842814]], [[2820703]], [[2811077]], [[3196096]]…. Closest of your papers: [[2663002]] (coupling 0.22, 34 shared references). Closest network paper: [[2842814]] (coupling 0.60, 88 shared references). Shared topics: inflaton decays, during reheating, gravitational wave.","score":83.6,"rank":2,"section":"replacement","parts":[1.0,0.67,1,0.5,0.85],"abstract":"We study the generation of the baryon asymmetry of the Universe via leptogenesis during the post-inflationary reheating epoch, considering reheating temperatures below the temperature of sphaleron freeze-out. Within the framework of a monomial inflaton potential during reheating, we analyze three perturbative reheating scenarios in which the inflaton decays into (i) a pair of Standard Model (SM)-like bosons, (ii) a pair of SM-like fermions, or (iii) exclusively into a pair of heavy right-handed neutrinos, which eventually decays into the SM final states after briefly dominating the energy density of the Universe. For each case, we identify the regions of parameter space that successfully reproduce the observed baryon asymmetry consistently tracking the sphaleron interaction rate during reheating, while satisfying existing cosmological constraints. We also highlight the potential of future primordial gravitational wave observations to probe this class of scenarios.","authors":"Basabendu Barman, Arindam Basu, Debasish Borah, Nayan Das","nlinked":131,"nref":132,"src":"INSPIRE","html":true},{"id":"3224074","arxiv":"2611.07509","title":"Scale-Invariant Three-Component Dark Matter and Gravitational Wave Signals","first":"Hosseini","nauth":2,"year":2026,"cites":0,"role":"today","note":"Cites your papers: [[1686334]], [[1803365]], [[1869725]], [[1764733]], [[1990302]]. Cites 19 network papers: [[3221793]], [[3183927]], [[2843521]], [[2921478]], [[3094784]], [[3117718]]…. Closest of your papers: [[2614919]] (coupling 0.21, 19 shared references). Closest network paper: [[3224074]] (coupling 1.00, 76 shared references). Shared topics: observed relic, viable parameter space, relic density, direct detection, complex scalar.","score":78.2,"rank":3,"section":"new","parts":[1.0,0.64,1,0.0,0.89],"abstract":"We study a classically scale-invariant extension of the Standard Model (SM) with four new fields in a hidden sector: a complex scalar $S$, two Dirac fermions $ψ^{1,2}$ and the gauge boson $V_μ$ of a new $U(1)_D$ symmetry. The scalar $S$ couples to the SM through the Higgs portal. We identify regions of parameter space in which $V_μ$, $ψ^1$ and $ψ^2$ are all stable, giving a three-component dark matter (DM) scenario. The model is classically scale invariant, and the electroweak symmetry breaks because of the loop effects. We impose the observed relic density and current direct detection bounds, and then study the finite temperature effective potential. For a benchmark point, we find a first-order phase transition and compute the resulting gravitational wave (GW) spectrum, which we compare with the projected sensitivities of space-based interferometers. Although the viable parameter space is small, it can be probed by future experiments.","authors":"Mojtaba Hosseini, Rouzbeh Rouzbehi","nlinked":76,"nref":76,"src":"INSPIRE","html":true},{"id":"3122861","arxiv":"2602.18564","title":"Mixed Freeze-In and Freeze-Out Histories and Dark-Sector Decays in a $\\mathbb{Z}_4$ Two-Scalar Model","first":"Carvalho-Corrêa","nauth":3,"year":2026,"cites":0,"role":"repl","note":"Co-authors of yours: Sánchez-Vega. Cites your papers: [[1869725]], [[1764733]], [[2686856]]. Cites 4 network papers: [[2895388]], [[850629]], [[1298995]], [[2740358]]. Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2686856]] (coupling 0.14, 8 shared references). Closest network paper: [[3122861]] (coupling 1.00, 52 shared references). Shared topics: relic density, complex scalar, standard model particle, dark matter.","score":74.8,"rank":4,"section":"replacement","parts":[1.0,0.45,1,0.5,0.64],"abstract":"We study dark matter production in a renormalisable $\\mathbb{Z}_4$ Higgs-portal model containing a complex scalar $S_A$ and a real scalar $S_B$, where one or both states remain out of thermal equilibrium with the Standard Model bath. We follow their coupled evolution through conversion, semi-annihilation, and the decay $S_B\\to S_A S_A$ when kinematically allowed. We impose theoretical consistency conditions, limits on invisible Higgs decays, and LZ direct-detection bounds, accounting for each component's relic fraction. We check WIMP/FIMP assignments against interaction rates. When both states are stable, we find viable FIMP--FIMP and mixed WIMP--FIMP scenarios. In mixed cases, the WIMP-like state remains constrained by its Higgs-portal interactions, with the surviving points mainly concentrated near the Higgs resonance. The FIMP-like state can, however, provide a substantial fraction of the relic density with a negligible direct-detection signal. For $M_{S_B}>2M_{S_A}$, the decay of the heavier scalar leads to three production histories: SuperWIMP production, injection-assisted freeze-out, and sequential freeze-in. The mechanism depends on parent and daughter production. These decays can increase the abundance of a WIMP after freeze-out or contribute to the final abundance of a FIMP, changing the relation between the daughter's Higgs coupling and its relic density. Since the primary decays produce no Standard Model particles, electromagnetic and hadronic BBN bounds on visible decay products do not apply directly. We find $r_{\\rm BBN}\\ll1$ throughout the retained sample. To assess effects on structure formation, we use the dark matter fraction produced through decays and an equivalent thermal-WDM mass as approximate diagnostics. Some late-decay configurations are flagged as potentially warm, whereas the sequential freeze-in sample satisfies $m_{\\rm WDM}^{\\rm eq}\\gtrsim1~\\mathrm{MeV}$.","authors":"J. P. Carvalho-Corrêa, B. A. Couto e Silva, B. L. Sánchez-Vega","nlinked":52,"nref":53,"src":"INSPIRE","html":true},{"id":"3159193","arxiv":"2605.24473","title":"Freeze-in $SU(2)$ vector dark matter at low reheating temperature","first":"Ghosh","nauth":5,"year":2026,"cites":0,"role":"repl","note":"Cites your papers: [[3130296]]. Cites 8 network papers: [[3138530]], [[3118148]], [[2952952]], [[3033967]], [[2860397]], [[2784023]]…. Also cites widely used network papers: [[2817040]], [[1518747]]. Closest of your papers: [[2856850]] (coupling 0.10, 13 shared references). Closest network paper: [[3159193]] (coupling 1.00, 45 shared references). Shared topics: dm abundance, freeze-in mechanism, observed relic, viable parameter space, relic abundance.","score":68.7,"rank":5,"section":"replacement","parts":[1.0,0.3,1,0.0,0.96],"abstract":"The freeze-in mechanism for dark matter (DM) requires extremely feeble interactions with the Standard Model (SM), preventing thermal equilibrium in the early Universe and typically evading experimental detection. However, for sufficiently low reheating temperatures ($T_{\\rm RH}$), the observed relic abundance can be realized with larger couplings, opening prospects for experimental searches. In this work, we investigate freeze-in production of $SU(2)_{\\rm HS}$ vector dark matter (VDM) in a low-$T_{\\rm RH}$ cosmology. The framework naturally contains three mass-degenerate stable VDM candidates without the need for any additional discrete symmetry. We perform a systematic study of the dark matter phenomenology and identify the parameter space consistent with the observed relic abundance. We work with the approximation of instantaneous reheating and consider the DM abundance to be negligible at $T_{\\rm RH}$. In contrast to conventional freeze-in scenarios, the required DM couplings can be sizable, rendering part of the parameter space already constrained by existing direct searches like PandaX-4T and LZ, while a significant region remains within the reach of future experiments such as DARWIN. Though one can realize the freeze-in mechanism for an abelian $U(1)_X$ vector DM models as well, we find that the non-abelian structure of the $SU(2)_{\\rm HS}$ scenario leads to a distinct feature due to a larger number of dark matter particles, resulting in an enlarged viable parameter space due to the multiplicity of dark matter states.","authors":"Dilip Kumar Ghosh, Sourav Gope, Xiao-Gang He, Xuan Hong, Sk Jeesun","nlinked":45,"nref":45,"src":"INSPIRE","html":true},{"id":"3190925","arxiv":"2608.12497","title":"Spontaneous Scoto-leptogenesis","first":"Datta","nauth":3,"year":2026,"cites":0,"role":"repl","note":"Cites your papers: [[3094526]]. Cites 7 network papers: [[2827001]], [[2808986]], [[2623114]], [[2638716]], [[822544]], [[875754]]…. Closest of your papers: [[1294681]] (coupling 0.09, 12 shared references). Closest network paper: [[2851262]] (coupling 0.23, 32 shared references). Shared topics: scotogenic model, scalar dark matter, direct detection, dark sector, direct detection experiment.","score":61.8,"rank":6,"section":"replacement","parts":[0.99,0.27,0.66,0.0,0.89],"abstract":"We propose a low-scale spontaneous leptogenesis scenario within the dynamical minimal scotogenic model for accommodating neutrino masses and inert scalar dark matter simultaneously. Thus, we dub the mechanism Spontaneous Scoto-leptogenesis. In this setup, a rolling Majoron arising from the global $U(1)_{B-L}$ symmetry breaking induces an effective chemical potential for the $B-L$ charge in the presence of $B-L$ violating interactions that allow for the efficient decays and inverse decays of right handed neutrinos (RHN) and RHN mediated scattering, so it gives rise to the observed baryon asymmetry of the Universe through the electroweak sphaleron conversion. The mechanism becomes effective in the strong washout regime and successfully lowers the viable mass scale of the lightest RHN to the range of TeV scales, thereby making the thermal scotogenic leptogenesis with two hierarchical RHNs accessible to direct tests. We identify the roles of the $λ_5$ coupling for spontaneous leptogenesis and inert scalar dark matter through the efficient erasure of the inert scalar asymmetry. We also explore the regime for Majoron dark matter from the kinetic misalignment, showing that a multicomponent dark sector comprising the inert scalar and the Majoron can be realized in the model. The resulting framework provides a unified origin for low-scale baryogenesis, neutrino masses, and multicomponent dark sector, so it can be tested by complementary experimental probes through direct detection experiments, collider searches for inert scalars, and future detection of Majoron dark matter or dark radiation.","authors":"Arghyajit Datta, Hyun Min Lee, Jun-Ho Song","nlinked":107,"nref":112,"src":"INSPIRE","html":true},{"id":"3225487","arxiv":"2611.08187","title":"Light Primordial Black Holes from a First-Order Phase Transition near the End of Inflation: Baryogenesis and Gravitational Wave Signatures","first":"Cheng","nauth":2,"year":2026,"cites":0,"role":"today","note":"Cites 8 network papers: [[3158142]], [[2901490]], [[1982883]], [[2657746]], [[2829767]], [[2824793]]…. Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2826987]] (coupling 0.06, 12 shared references). Closest network paper: [[3208082]] (coupling 0.19, 9 shared references). Shared topics: light primordial black hole, primordial black hole, big bang nucleosynthesis, gravitational wave.","score":56.5,"rank":7,"section":"new","parts":[0.99,0.17,0.54,0.0,0.85],"abstract":"We investigate the formation and cosmological consequences of light primordial black holes (PBHs) from vacuum bubbles nucleated during a spectator sector first-order phase transition in inflation. We construct a phenomenological model in which the spectator potential evolves with the rolling inflaton, allowing vacuum bubbles to nucleate and grow during inflation. The vacuum ordering subsequently reverses near the end of inflation, leaving the bubble interiors in a metastable false vacuum state. We examine their stability against reverse vacuum tunneling and impose benchmark conditions to suppress this process before and after reheating. Sufficiently large bubbles can subsequently undergo supercritical evolution and form PBHs. In this framework, the PBH abundance is determined by the vacuum tunneling history, while the characteristic mass depends on the nucleation epoch and bubble growth during inflation. For sufficiently light PBHs that evaporate before big bang nucleosynthesis, Hawking radiation can create locally superheated regions in which electroweak symmetry is restored, potentially generating a baryon asymmetry in the presence of additional CP-violating interactions. We also investigate the direct gravitational wave (GW) signals from Hawking radiation and the induced GWs from PBH density fluctuations, the latter arising if an early PBH dominated epoch occurs. For representative benchmark parameters, the resulting baryon asymmetry can reach the ten-percent level of the observed value, while the induced GW signal can reach a peak amplitude of $Ω_{\\rm GW,0}h^2\\sim10^{-7}$ at frequencies of order $10$-$10^2\\,{\\rm Hz}$.","authors":"Zihong Cheng, Fa Peng Huang","nlinked":97,"nref":97,"src":"INSPIRE","html":true},{"id":"3223949","arxiv":"2611.07031","title":"Constraining $U(1)_{L_μ-L_τ}$ Model with Dark Matter Using Relic Density and $N_{\\rm eff}$ Bounds","first":"Gola","nauth":1,"year":2026,"cites":0,"role":"today","note":"Cites 2 network papers: [[2771408]], [[1493855]]. Also cites widely used network papers: [[1362180]]. Closest of your papers: [[3130296]] (coupling 0.08, 9 shared references). Closest network paper: [[2942039]] (coupling 0.25, 21 shared references). Shared topics: viable parameter space, relic density, dark matter.","score":49.7,"rank":8,"section":"new","parts":[0.72,0.25,0.72,0.0,0.65],"abstract":"We study thermal Dirac dark matter in the gauged $U(1)_{L_μ-L_τ}$ model, focusing on resonant annihilation near the $Z'$ pole. We determine the parameter space that satisfies the Planck relic density bound while remaining consistent with collider, astrophysical, and laboratory searches. MeV-scale dark matter and the $Z'$ mediator decouple near the active neutrino decoupling temperature; entropy injection into the neutrino bath modifies $T_ν/T_γ$, leading to a shift in the effective number of relativistic species, $N_{\\rm eff}$. Incorporating the coupled temperature evolution alongside the Planck 2018 limit on $N_{\\rm eff}$, we find that the viable parameter space is restricted to a narrow mass window of $M_{Z'} \\sim 30\\text{--}50\\text{ MeV}$ with $g' \\simeq 10^{-7}-10^{-6}$, well within reach of upcoming fixed-target experiments such as SHiP and LDMX.","authors":"Shivam Gola","nlinked":59,"nref":62,"src":"INSPIRE","html":true},{"id":"2775441","arxiv":"2404.05704","title":"Novel collider signatures in the type-I 2HDM+$a$ model","first":"Argyropoulos","nauth":3,"year":2026,"cites":0,"role":"repl","note":"Cites 5 network papers: [[1674879]], [[2686887]], [[1445014]], [[1489221]], [[2771408]]. Also cites widely used network papers: [[1518747]]. Closest of your papers: [[2751074]] (coupling 0.07, 12 shared references). Closest network paper: [[2686887]] (coupling 0.12, 22 shared references). Shared topics: dark matter.","score":46.7,"rank":9,"section":"replacement","parts":[0.95,0.23,0.35,0.0,0.13],"abstract":"The 2HDM+$a$ model is one of the main models used in the interpretations of dark matter searches at the LHC. So far, all the 2HDM+$a$ benchmarks considered by the ATLAS and CMS experiments are limited to a type-II Yukawa sector, in which the Higgs bosons $A$, $H$, and $H^\\pm$ are all constrained to be mass-degenerate and heavier than around $600 \\, {\\rm GeV}$. In this work, we present the first detailed study of 2HDM+$a$ models with a type-I Yukawa sector, which, for moderate values of $\\tanβ$, lift the constraints from flavour physics, allowing the extra Higgs bosons to be even lighter than the $125 \\, {\\rm GeV}$ Higgs boson discovered at the LHC. We discuss several benchmarks where the $A$, $H$, and $H^\\pm$ states are not necessarily mass-degenerate and the signatures that arise in these models, some of which have not yet been explored at the LHC. We present the dominant channels in the studied benchmarks and the expected sensitivity in Run 2 data using truth-level analyses and discuss potential improvements in the experimental searches for Run 3.","authors":"Spyros Argyropoulos, Ulrich Haisch, Ilia Kalaitzidou","nlinked":210,"nref":213,"src":"INSPIRE","html":true},{"id":"3094437","arxiv":"2512.17231","title":"Higgs-Portal Stueckelberg Dark Matter","first":"Felice","nauth":4,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[1607216]]. Closest of your papers: [[2686856]] (coupling 0.05, 4 shared references). Closest network paper: [[2809347]] (coupling 0.11, 6 shared references). Shared topics: observed dark matter, relic density, dark matter mass, dark matter.","score":33.0,"rank":10,"section":"replacement","parts":[0.45,0.17,0.31,0.0,0.76],"abstract":"We study dark photon dark matter X associated with a dark $U(1)_X$ gauge symmetry. To evade laboratory and cosmological constraints on kinetic mixing with the Standard Model $U(1)_Y$, we assign a $Z_2$-odd dark parity to X that forbids such mixing. The leading interactions then arise from gauge-invariant dimension-6 Higgs-portal operators, including both parity-even and parity-odd terms. We assume that the dark matter mass is generated via the Stueckelberg mechanism. In the interacting Stueckelberg EFT, a gauge-invariant dimension-6 parent reduces in unitary gauge to the nominal dimension-4 Higgs-portal interaction $(H^†H)X_μX^μ$, with its coefficient correlated with $m_X^2/Λ^2$, while additional derivative operators are organized by the same longitudinal-mode power counting. We investigate freeze-in production of X from Higgs-pair annihilations after reheating, incorporating both field-strength and Stueckelberg-allowed operators. First, we consider the case in which the Wilson coefficients of the gauge-invariant dimension-6 operators, C and $\\tilde C$, are of order unity. Under a conservative single-cutoff power counting in which the strong-coupling scales of the longitudinal mode lie above the cutoff of the field-strength effective theory, we find that the Stueckelberg contributions remain subdominant in dark matter production. We emphasize that this ordering of scales is an explicit assumption rather than a universal consequence of perturbative unitarity. Next, we explore a more general situation in which C and $\\tilde C$ are smaller than unity. In this second case, Stueckelberg-allowed operators can become comparable and generate contributions proportional to $T_{reh}^3$, $T_{reh}^5$, and $T_{reh}^7$, including sign-dependent interference effects. For both cases, we show that there exists a wide parameter space consistent with the observed dark matter relic density.","authors":"Antonio De Felice, Takehiro Ogura, Shinji Tsujikawa, Kimiko Yamashita","nlinked":23,"nref":25,"src":"INSPIRE","html":true},{"id":"2860389","arxiv":"2412.12286","title":"Searching for axion-like particles with SPHEREx","first":"Regis","nauth":3,"year":2026,"cites":0,"role":"repl","note":"Co-authors of yours: Taoso. Cites 1 network paper: [[2795517]]. Closest of your papers: [[1941263]] (coupling 0.05, 8 shared references). Closest network paper: [[2691930]] (coupling 0.10, 10 shared references). Shared topics: dark matter.","score":31.7,"rank":11,"section":"replacement","parts":[0.45,0.18,0.29,0.5,0.13],"abstract":"We study prospects to detect axion-like particles (ALPs) with the upcoming near-infrared telescope SPHEREx. The signal under investigation is the ALP decay into two photons. Assuming dark matter (DM) to be in the form of ALPs, we analyze the signal from the DM halos of dwarf spheroidal galaxies, the Large Magellanic Cloud and the Milky Way. We find that SPHEREx can significantly improve current limits on the axion-photon coupling in the 0.5-3 eV ALP mass range.","authors":"Marco Regis, Marco Taoso, Jorge Terol Calvo","nlinked":33,"nref":36,"src":"INSPIRE","html":true},{"id":"3208562","arxiv":"2609.33031","title":"Resonantly-Enhanced Baryogenesis through Asymmetric Capture by Primordial Black Holes","first":"Abu-Ajamieh","nauth":2,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[2826986]]. Closest of your papers: [[2826987]] (coupling 0.07, 9 shared references). Closest network paper: [[2652636]] (coupling 0.09, 11 shared references). Shared topics: primordial black hole.","score":29.4,"rank":12,"section":"replacement","parts":[0.45,0.21,0.25,0.0,0.35],"abstract":"Primordial black holes (PBHs) can generate the Baryon Asymmetry of the Universe (BAU) through asymmetric capture of baryon-charge-carrying particles, but previous realizations of this mechanism typically yield an asymmetry well below the observed value because the relevant CP-violating scattering asymmetry is loop suppressed. We show that this limitation can be overcome through resonant CP violation in a mixed system of two nearly degenerate unstable fermions, $Y_{1,2}$, whose mass splitting is comparable to their decay widths. Rare production of the coherent $Y_1$--$Y_2$ state, followed by CP-asymmetric return and loss decays, generates an $\\mathcal{O}(0.1)$ difference in integrated decay probabilities while preserving the global baryon charge at the Lagrangian level. Embedding this resonant source in the PBH-capture transport system yields the observed baryon asymmetry. We first reproduce the mechanism in a zero-temperature, sudden-evaporation treatment, which gives $η_B^{T=0}\\simeq1.74\\times10^{-10} \\simeq2.00η_B^{\\rm obs}$. We find that after including thermal corrections and continuous PBH evaporation and entropy production, the resulting BAU becomes $η_B = 8.72\\times 10^{-11}$ in agreement with the observed value. An interesting finding of the model is that even if PBH absorption remains active, we would still have BAU $η_{B}^{\\text{no evap}} \\sim 9.1 \\times 10^{-12} \\sim 0.105 η_B^{\\rm obs}$. We further investigate gravitational-wave signatures associated with the primordial fluctuations responsible for PBH formation. The corresponding scalar-induced gravitational-wave spectra peak at $f \\sim 0.16\\text{--}0.17~\\mathrm{MHz}$, with $h^2Ω_{\\rm GW}^{\\rm peak} \\sim (3\\text{--}7)\\times 10^{-8}$. Under idealized sensitivity assumptions, U-DECIGO can achieve signal-to-noise ratios above 10 for the benchmark spectra.","authors":"Fayez Abu-Ajamieh, Xiaoyan Huo","nlinked":52,"nref":55,"src":"INSPIRE","html":true},{"id":"3224001","arxiv":"2611.07281","title":"Testing the Pseudo-Dirac Nature of Atmospheric Neutrinos","first":"Bitter","nauth":4,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Closest of your papers: [[1249404]] (coupling 0.06, 10 shared references). Closest network paper: [[2969254]] (coupling 0.14, 11 shared references).","score":26.7,"rank":13,"section":"new","parts":[0.45,0.16,0.41,0.0,0.0],"abstract":"Pseudo-Dirac neutrinos are characterized by extremely small mass-squared differences between two nearly degenerate, strongly-mixed, active-sterile states. These differences are associated with new very-long oscillation lengths and provide a probe of the nature of neutrinos. Atmospheric neutrinos can probe these oscillations as they allow access to a broad range of baseline distances, from tens of kilometers to the Earth's diameter. We investigate the sensitivity of an experiment like the Deep Underground Neutrino Experiment (DUNE) to the pseudo-Dirac nature of neutrinos through measurements of the atmospheric neutrino flux. We concentrate on the modifications to the atmospheric neutrino energy and angular spectra induced by one new oscillation frequency associated with the $ν_3$ state and determine the parameter space that can be probed with atmospheric neutrinos at a DUNE-like detector. We also comment on the sensitivity of these measurements to the sub-leading \"solar\" oscillations, which are also characterized by a relatively small mass-squared difference.","authors":"Olivia M. Bitter, André de Gouvêa, Srubabati Goswami, Supriya Pan","nlinked":51,"nref":51,"src":"INSPIRE","html":true},{"id":"3224034","arxiv":"2611.07578","title":"Can cosmic neutrinos induce a cosmic birefringence signal?","first":"Reig","nauth":1,"year":2026,"cites":0,"role":"today","note":"Co-authors of yours: Reig. Cites 1 network paper: [[1493855]]. Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2690106]] (coupling 0.02, 3 shared references). Closest network paper: [[2810207]] (coupling 0.04, 7 shared references).","score":25.2,"rank":14,"section":"new","parts":[0.48,0.05,0.11,0.5,0.0],"abstract":"A coupling of photons to the cosmic neutrino asymmetry current has been proposed to explain the hinted isotropic rotation of CMB polarization. Gauge invariant UV completions require a Kalb-Ramond field that is exactly dual to a massless axion. We show that, in this case, the product of the axion-photon coupling and the axion-neutrino current coupling is fixed by the signal, $g_{aγ}/f_\\ell=1/Λ_*^2$ with $Λ_*\\simeq10$ TeV. Using $SU(2)_L$ gauge invariance we show that the dual axion couples to electrons as $g_{aγ}g_{ae}=m_e/Λ_*^2\\simeq5\\times10^{-12}\\,\\mathrm{GeV}^{-1}$. This value is excluded by the measured electron magnetic moment combined with light-shining-through-a-wall searches, as well as by stellar evolution. Conserved anomaly-free currents may evade these bounds, but then either a contact interaction among SM fermions excludes the model, or the relic neutrinos decouple from the signal. We conclude that cosmic neutrinos cannot induce a birefringence signal.","authors":"Mario Reig","nlinked":70,"nref":70,"src":"INSPIRE","html":true},{"id":"3224042","arxiv":"2611.07852","title":"Long lived MeV scale bound state dark matter alleviates the ${}^7 Li$ tension","first":"Prasad","nauth":2,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Closest of your papers: [[1941263]] (coupling 0.02, 1 shared references). Closest network paper: [[3152711]] (coupling 0.04, 2 shared references). Shared topics: big bang nucleosynthesis, dark matter scenario, dark matter.","score":25.2,"rank":15,"section":"new","parts":[0.45,0.06,0.13,0.0,0.56],"abstract":"We investigate the impact of MeV scale unstable bound state dark matter on both thermal and non thermal Big Bang nucleosynthesis. Focusing on the weakly self interacting regime, we find that this framework can reproduce the theoretically predicted abundances through both short and long lived bound states. While long lived bound states can alleviate the cosmological ${}^7$Li problem, they simultaneously lead to discrepancies with other light element abundances. We show that this tension is resolved by incorporating non thermal nucleosynthesis, which act on these non standard initial light element abundances to alleviate the ${}^7 Li$ tension without violating observational constraints on the other elements. Remarkably, across the range of $\\widetildeρ_B$ and $m_χ$ considered, long lived bound states with lifetimes $10^0\\,{\\rm s}\\lesssimτ\\lesssim10^2\\,{\\rm s}$ can simultaneously resolve the ${}^7$Li problem and a large parameter space remain consistent with the observed abundances of the other light elements. Our results demonstrate that non thermal effects are essential for obtaining a consistent nucleosynthesis history in unstable bound state dark matter scenarios.","authors":"Pa. Gokhula Prasad, V. Suryanarayana Mummidi","nlinked":28,"nref":41,"src":"INSPIRE","html":true},{"id":"3223988","arxiv":"2611.07136","title":"Stars Within Stars: The Interplay Between Main-Sequence Stars and Dark Matter","first":"Kamenetskaia","nauth":2,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[2795517]]. Closest of your papers: [[2039411]] (coupling 0.02, 3 shared references). Closest network paper: [[2923472]] (coupling 0.06, 6 shared references). Shared topics: dark matter mass, dark sector, dark matter.","score":24.9,"rank":16,"section":"new","parts":[0.45,0.05,0.17,0.0,0.51],"abstract":"Asymmetric dark matter may form self-gravitating macroscopic structures called dark stars if its microscopic properties give rise to sufficient effective pressure to counteract gravity. We study low-mass baryonic stars embedded within such dark stars, treating the baryonic and dark components as two gravitating fluids. The dark sector is assumed to be non-luminous and to interact with the baryonic star only through gravity, while the baryonic structure is computed using a realistic equation of state, opacity tables, and proton-proton-chain energy production. We find that the additional gravitational potential increases the luminosity at fixed baryonic mass, as the baryons must reach higher temperatures to maintain hydrostatic equilibrium. This lowers the minimum baryonic mass for hydrogen-burning configurations below the standard value of $\\sim0.085M_\\odot$. The resulting increase in luminosity can reduce the estimated main-sequence lifetime significantly, bringing low-mass configurations that would otherwise remain on the main sequence for hundreds of Gyr to cosmologically relevant timescales. We further show that photons escaping from the stellar surface undergo gravitational redshift determined by the global dark matter mass distribution. Consequently, extended dark star configurations can produce distinct observational signatures even when their outer regions have little effect on the intrinsic baryonic stellar structure, providing a potential probe of otherwise hidden dark structures.","authors":"Boris Betancourt Kamenetskaia, Chris Kouvaris","nlinked":54,"nref":67,"src":"INSPIRE","html":true},{"id":"3223995","arxiv":"2611.07195","title":"Nuclear Atomic Dark Matter","first":"Asadi","nauth":5,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[2795517]]. Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1679809]] (coupling 0.03, 2 shared references). Closest network paper: [[3214429]] (coupling 0.08, 23 shared references). Shared topics: dark matter.","score":24.3,"rank":17,"section":"new","parts":[0.48,0.1,0.22,0.0,0.13],"abstract":"The matter coincidence, $Ω_{\\rm DM}\\simeq5Ω_b$, suggests a common origin for visible and dark matter (DM). We show that this motivates the study of nuclear atomic DM (naDM), which is composed of $\\sim5\\,\\mathrm{GeV}$ mirror-neutron DM and a subdominant population of mirror elements. We realize naDM in the Mirror Twin Higgs, employing a twin Froggatt--Nielsen mechanism to generate fermion masses and realize spontaneous $\\mathbb{Z}_2$ symmetry breaking. However, the low-energy mirror framework is more general and can emerge from other ultraviolet completions. naDM gives rise to a novel two-stage dark acoustic oscillation signature, multiple correlated direct-detection signals, and highly exotic twin astrophysics.","authors":"Pouya Asadi, Zackaria Chacko, David Curtin, Micah Mellors, Ethan T. Neil","nlinked":94,"nref":98,"src":"INSPIRE","html":true},{"id":"3225516","arxiv":"2611.08459","title":"Testing the Spin of New Physics with Top Precision Measurements","first":"Lessa","nauth":3,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[1982681]]. Closest of your papers: [[1455793]] (coupling 0.01, 1 shared references). Closest network paper: [[3170413]] (coupling 0.07, 4 shared references). Shared topics: vector-like fermion.","score":21.5,"rank":18,"section":"new","parts":[0.45,0.04,0.2,0.0,0.14],"abstract":"Precision measurements can reveal not only the presence of new physics, but also information about the dynamics that generated it. We study this question in top-pair production by comparing three top-philic scenarios: a colored scalar top partner, a colored vector-like fermion, and a spin-one $Z^\\prime$ mediator. The first two contribute through loop corrections, while the $Z^\\prime$ contributes at tree level. We show that the scalar and vector-like fermion scenarios match onto the same effective operator structure at low energies,making their distinction unfeasible using the EFT approach. However, near or above threshold their full loop amplitudes develop distinct momentum-dependent interference patterns. Using the top transverse momentum spectrum we find that resonant and loop-induced effects are relatively easy to distinguish, whereas separating the scalar and vector-like hypotheses is substantially more challenging. Nevertheless, their different analytic structures leave measurable information in the shape of the distribution. These results illustrate how precision differential measurements can probe the spin and dynamics of virtual new states even when they are not directly reconstructed, and motivate more powerful multidimensional analyses.","authors":"André Lessa, Vinícius Rocca, Veronica Sanz","nlinked":50,"nref":64,"src":"INSPIRE","html":true},{"id":"3218141","arxiv":"2610.31254","title":"A consistent neutrino determination of the low-energy weak mixing angle","first":"Corona","nauth":8,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[3193100]]. Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1854224]] (coupling 0.02, 2 shared references). Closest network paper: [[3095306]] (coupling 0.05, 5 shared references).","score":21.4,"rank":19,"section":"replacement","parts":[0.48,0.07,0.15,0.0,0.0],"abstract":"The weak mixing angle, $\\sin^2θ_W$, is a fundamental parameter of the Standard Model and a sensitive probe of electroweak physics across various energy scales. At low momentum transfer, the Standard Model prediction approaches a well-defined low-energy plateau, providing a target for precision tests of the electroweak theory. At the lowest momentum transfer, atomic parity violation (APV) in cesium provides one of the most precise determinations of the weak mixing angle. Here, we review and update the status of this determination and compare it with other available probes. We then consistently reanalyze low-energy neutrino scattering data and combine the resulting determinations from coherent elastic scattering (CE$ν$NS) and neutrino-electron scattering. The complementary sensitivity of these processes to electroweak couplings enables a neutrino-based determination of the low-energy weak mixing angle, accounting for electroweak radiative corrections and relevant theoretical uncertainties. Our global analysis yields $\\sin^2θ_W^{\\rm low}(ν\\,\\text{data}) = 0.232\\pm 0.006$. We assess the consistency and relative impact of the individual neutrino measurements and discuss the prospects for future CE$ν$NS and neutrino-electron scattering experiments to improve the precision of this determination. Our analysis provides an independent test of the Standard Model at low momentum transfer, complementary to that provided by atomic parity violation.","authors":"M. Atzori Corona, M. Cadeddu, N. Cargioli, F. Dordei, L. Ferro, C. Giunti, R. Pavarani, M. Sestu","nlinked":82,"nref":88,"src":"INSPIRE","html":true},{"id":"","arxiv":"2611.08388","title":"Top-Quark Pair Production and Decay in Extended Higgs Sectors","first":"Banfi","nauth":4,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Closest of your papers: [[1402978]] (coupling 0.01, 1 shared references). Closest network paper: [[3131565]] (coupling 0.05, 3 shared references).","score":19.1,"rank":20,"section":"new","parts":[0.45,0.04,0.15,0.0,0.0],"abstract":"Extensions of the Higgs sector in the Standard Model address outstanding questions like the first-order electroweak phase transition and also present a rich collider phenomenology. The two-Higgs-doublet model is a minimal extension of the Standard Model with an extra complex $SU(2)_L$ doublet, and consists of an extra scalar, a pseudoscalar and a pair of charged Higgs bosons along with a Standard-Model-like Higgs boson. We present a modified version of the hvq library of the POWHEG-BOX-V2 event generator interfaced with the OpenLoops 2 amplitude generator to obtain predictions for top-quark pair production at NLO accuracy, including top-quark decays with full spin correlations in a framework that extends the SM Higgs sector with an extra heavy scalar and a pseudoscalar. The interference effects between the scalar and pseudoscalar signals, and the Standard Model QCD background are implemented. We include parton showers and hadronisation, and take detector effects into consideration. The status of our work and plans to extend it to future collider projects are discussed.","authors":"Andrea Banfi, Alexander Lind, Jonas M. Lindert, Vishakha Lingadahally","nlinked":22,"nref":23,"src":"arXiv source","html":true},{"id":"3223971","arxiv":"2611.07086","title":"Amplitude Analysis of the Invariant-Mass Spectra of Centrally Exclusively Produced $π^+π^-$ and $K^+K^-$ Pairs in $pp$ Collisions at $\\sqrt{s}=510$ GeV","first":"Giri","nauth":3,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Also cites widely used network papers: [[2817040]]. Closest of your papers: [[3184726]] (coupling 0.01, 1 shared references). Closest network paper: [[1688995]] (coupling 0.03, 15 shared references).","score":18.7,"rank":21,"section":"cross","parts":[0.48,0.02,0.08,0.0,0.0],"abstract":"We present an amplitude analysis of the $π^{+}π^{-}$ and $K^{+}K^{-}$ invariant-mass spectra from central exclusive $pp$ collisions at $\\sqrt{s}=510~\\mathrm{GeV}$, measured by the STAR experiment with forward-scattered protons tagged in the Roman Pot detectors. The $π^{+}π^{-}$ channel is described with $f_{0}(500)$, $ρ^{0}(770)$, $f_{0}(980)$, $f_{2}(1270)$, $f_{0}(1500)$ and $f_{0}(1710)$ resonances with $χ^{2}/\\mathrm{ndf}=121.712/57$. The fit also yields $m_{f_{0}(980)}=0.989$ GeV and $Γ=0.091$ GeV. The $K^{+}K^{-}$ channel is described with $f_{0}(980)$, $f_{2}(1270)$, $f_{2}^{\\prime}(1525)$ and $f_{0}(1710)$ resonances with $χ^{2}/\\mathrm{ndf}=14.662/15$. The fiducial cross sections for the individual resonances and interference terms were calculated, together with their ratios relative to the total fitted cross section. These ratios were compared across decay channels and qualitatively with previous measurements. A consistent flavor dependence of $f_{0}(1500)$ and $f_{0}(1710)$ has been derived for the highest RHIC collision energies, which is in agreement with low energy data.","authors":"Aranya Giri, Barak Schmookler, Rene Bellwied","nlinked":32,"nref":34,"src":"INSPIRE","html":true},{"id":"3224005","arxiv":"2611.07416","title":"Enhancing Gravitational Waves from Global Strings via a First-Order Phase Transition","first":"Jia","nauth":3,"year":2026,"cites":0,"role":"today","note":"Closest of your papers: [[2790381]] (coupling 0.06, 9 shared references). Closest network paper: [[2737686]] (coupling 0.16, 28 shared references). Shared topics: relic abundance, big bang nucleosynthesis, gravitational wave.","score":18.6,"rank":22,"section":"new","parts":[0.0,0.18,0.47,0.0,0.61],"abstract":"We perform the first (3+1)-dimensional lattice simulations of a cosmological first-order phase transition (PT) in which true-vacuum bubbles with random phases nucleate, expand, and collide, producing a network of global strings. We find that the string network enters the scaling regime, and the coefficient of the logarithmic growth is smaller than the value obtained for a second-order PT. From the axion spectrum, we derive the dark-matter relic abundance and the dark-radiation bound from big bang nucleosynthesis on the axion decay constant $f_a$ and mass $m_a$. The ratio of the gravitational wave emission rate to the axion emission rate is found to be about two orders of magnitude larger than in the second-order case, and the resulting gravitational wave spectrum can be probed by pulsar timing arrays as well as by space- and ground-based interferometers.","authors":"Yongtao Jia, Ligong Bian, Huai-Ke Guo","nlinked":80,"nref":85,"src":"INSPIRE","html":true},{"id":"3177407","arxiv":"2607.02876","title":"Revisiting $\\bar B^0 \\rightarrow Λ_c^+ \\bar p$ decay with higher twist corrections","first":"Zou","nauth":3,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[3193100]]. Closest network paper: [[1333250]] (coupling 0.02, 1 shared references).","score":16.5,"rank":23,"section":"replacement","parts":[0.45,0.0,0.05,0.0,0.0],"abstract":"We investigate the single-charmed baryonic decays $\\bar B^0 \\to Λ_c^+ \\bar p$ and $\\bar B^0 \\to \\barΛ_c^- p$, which receive contributions from both $W$-emission and $W$-exchange topologies, within the framework of perturbative QCD (PQCD). Higher-power corrections associated with the hadronic light-cone distribution amplitudes (LCDAs) of both the initial- and final-state hadrons are systematically taken into account. We find that these higher-twist contributions play an important role in baryonic $B$ decays and cannot be neglected. A sizable destructive interference between the $W$-emission and $W$-exchange amplitudes is observed, which significantly reduces the predicted branching fraction of $\\bar B^0 \\to Λ_c^+ \\bar p$ and leads to improved agreement with experimental measurements. The doubly Cabibbo-suppressed decay $\\bar B^0 \\to \\barΛ_c^- p$ is studied for the first time. Its branching fraction is predicted to be of order $10^{-8}$, placing it within the reach of future high-luminosity experiments. We further present the first theoretical predictions for the decay asymmetry parameters of both channels, which provide additional observables for testing the underlying decay dynamics and can be confronted with future experimental data.","authors":"Zhi-Tian Zou, Ying Li, Zhou Rui","nlinked":53,"nref":54,"src":"INSPIRE","html":true},{"id":"3205605","arxiv":"2609.23691","title":"LZ-Motivated Pseudo-Dirac Higgsinos in the Supersymmetric 331 Model from the Supersymmetric \\texorpdfstring{$SU(6)$}{SU(6)} GUT Model","first":"Khan","nauth":6,"year":2026,"cites":0,"role":"repl","note":"Closest of your papers: [[1693823]] (coupling 0.02, 2 shared references). Closest network paper: [[3202840]] (coupling 0.41, 25 shared references).","score":16.5,"rank":24,"section":"replacement","parts":[0.0,0.05,1,0.0,0.0],"abstract":"The high-recoil event reported by LUX--ZEPLIN motivates a neutral electroweak state with an inelastic splitting in the sub-MeV range. We propose supersymmetric 331 model from the supersymmetric $SU(6)$ GUT model, and we study the electroweakino sector relevant to this recoil. Above the $331$-breaking scale hypercharge is not an independent gauge factor, and the leading bino--wino cancellation is replaced by a relation between the physical $U(1)_X$ and $SU(3)_L$ gaugino invariants, $I_X=-I_L$. A singlet--adjoint gauge-kinetic source also correlates the colored invariant. We diagonalize the neutral gauge--Higgs fermion sector of the renormalizable model and determine the tree-level Higgsino splitting without introducing an effective bino mass by hand. The required solutions form a continuous locus in the gaugino and $331$-breaking parameters. At the reference point, the solution lies close to the leading sum rule, while variation of the $331$-breaking coupling moves the locus continuously. The same calculation tests the ordering of the additional neutral states, the gauge/gaugino contribution to the $331$-breaking scalar mass, and the gravitino ordering. We compare this construction with recent $SU(5)$, singlino-assisted, electroweak-multiplet, nuclear-response and solar-capture analyses of the LZ event.","authors":"Imtiaz Khan, Ali Muhammad, G. Mustafa, Farruh Atamurotov, Ahmadjon Abdujabbarov, Mussawir Khan","nlinked":48,"nref":49,"src":"INSPIRE","html":true},{"id":"3224011","arxiv":"2611.07385","title":"Natural Dark Matter in Generalized No-scale $\\mathcal{F}$-$SU(5)$ at the HL-LHC and LUX-ZEPLIN Experiment","first":"Li","nauth":3,"year":2026,"cites":0,"role":"today","note":"Closest of your papers: [[1655573]] (coupling 0.10, 9 shared references). Closest network paper: [[2744388]] (coupling 0.05, 14 shared references). Shared topics: relic density, dark matter scenario, dark matter.","score":15.7,"rank":25,"section":"new","parts":[0.0,0.26,0.14,0.0,0.58],"abstract":"Is a supersymmetric bulk region with sub-200 GeV neutralinos and right-handed sleptons still feasible? Initially the bulk was the discovery target of the supersymmetry (SUSY) pioneers in the 1980s, though reality crashed those ambitions over the subsequent years and decades, presumptively excluding these light neutralinos and sleptons, inviting finely tuned dark matter scenarios to satisfy emerging high-precision relic density measurements. The answer to this important question is $yes$, if we consider the GUT model $\\mathcal{F}$-$SU(5)$, namely, flipped $SU$(5) supplemented with a string derived TeV-scale extra $10+\\overline{10}$ vector-like multiplet and charged vector-like singlet $(XE,XE^c)$, dubbed flippons. We pair $\\mathcal{F}$-$SU(5)$ with effective supernatural supersymmetry (SUSY), known as generalized No-Scale Supergravity (SUGRA). This merging of $\\mathcal{F}$-$SU(5)$ with generalized No-Scale SUGRA solves the SUSY electroweak fine-tuning problem and includes natural dark matter (NDM) that meets the latest 5$σ$ Planck satellite observations through annihilation only. The NDM in this model is imminently under test by the LUX-ZEPLIN 1000-day experiment, thus prospective observed events by LUX-ZEPLIN in 2026-27 will compel confirmation by the high-luminosity LHC (HL-LHC) energizing in 2030. Therefore, we present the parameter space observable at both LUX-ZEPLIN and the HL-LHC that is consistent with all presently operating experiments, including the LHC Run 3 gluino and squark constraints. Our results predict sub-200 GeV neutralinos and right-handed sleptons in the bulk that are not beyond detection, though more massive electroweakinos greater than 600 GeV are also allowed.","authors":"Tianjun Li, James A. Maxin, Dimitri V. Nanopoulos","nlinked":112,"nref":118,"src":"INSPIRE","html":true},{"id":"3148122","arxiv":"2604.20481","title":"Dilaton-Induced Resonant Production of Ultralight Vector Dark Matter","first":"Khan","nauth":6,"year":2026,"cites":0,"role":"repl","note":"Closest of your papers: [[3184726]] (coupling 0.03, 3 shared references). Closest network paper: [[2974439]] (coupling 0.26, 18 shared references). Shared topics: dark matter.","score":15.0,"rank":26,"section":"replacement","parts":[0.0,0.09,0.74,0.0,0.13],"abstract":"We consider the production of ultralight vector dark matter through a dilatonic half-mass resonance in the presence of an oscillating spectator scalar. The cosmological condition is that the Floquet instability becomes efficient before the spectator contributes dominantly to the expansion. We express this condition in terms of the microscopic modulation parameter $ε_i=Φ_i/M$ and the gravitational onset fraction $r_i=Φ_i^2/(6\\Mpl^2)$. For a background with constant equation-of-state parameter $w_b$, the narrow-band result gives $μ/H\\propto a^{3w_b/2}$; the ratio therefore grows as $a^{1/2}$ during radiation domination and remains constant for matter-like expansion. Requiring delayed amplification to precede spectator domination gives the amplitude-independent bound $M/\\Mpl\\lesssim\\sqrt6\\,c_1\\simeq0.31$, with $c_1\\simeq1/8$ for the linear half-mass branch. An expanding-background calculation gives $a_\\star<a_{\\rm dom}$ for sub-Planckian $M$, whereas $M\\simeq\\Mpl$ delays efficient growth until after domination. Using the efficient-transfer normalization, we obtain $m_{γ'}\\propto r_i^{-2}$, so that $m_{γ'}\\sim10^{-20}$--$10^{-18}\\,{\\rm eV}$ corresponds to $r_i\\sim10^{-5}$--$10^{-4}$ rather than to early spectator domination. The canonical polarization analysis shows a more infrared-localized longitudinal spectrum than the transverse spectrum, while derivative terms associated with canonical normalization change the leading Floquet exponents at order unity. Stückelberg and Higgsed realizations lead to different ultraviolet consistency conditions, including radial-mode decoupling and symmetry-restoration bounds. These conditions select a radiation-era, perturbative, infrared-dominated regime with a sub-Planckian kinetic scale for production.","authors":"Imtiaz Khan, G. Mustafa, Jehanzad Zafar, Farruh Atamurotov, Ahmadjon Abdujabbarov, Chengxun Yuan","nlinked":50,"nref":53,"src":"INSPIRE","html":true},{"id":"3224051","arxiv":"2611.07806","title":"Search for dark matter axions at 1-2 micro-eV with a RADES-DarkQuantum haloscope at CERN","first":"Puente","nauth":28,"year":2026,"cites":0,"role":"today","note":"Closest of your papers: [[1941263]] (coupling 0.09, 10 shared references). Closest network paper: [[2863261]] (coupling 0.11, 9 shared references). Shared topics: dark matter.","score":14.1,"rank":27,"section":"cross","parts":[0.0,0.27,0.32,0.0,0.13],"abstract":"The QCD axion remains one of the most compelling candidates for the dark matter of the Universe, yet the mass range around $1$\\text{--}\\SI{2}{\\micro\\electronvolt} remains essentially unexplored. In this paper, we describe a proposal to employ CERN's M1 superconducting magnet to deploy a haloscope to perform a search for galactic axion and axion-like particle dark matter providing continuous coverage from approximately 1.2 to 1.8 \\SI{}{\\micro\\electronvolt}. Under conservative assumptions, the experiment can reach the QCD axion band over a significant fraction of the scanned range, while optimistic detector performance would allow sensitivity to benchmark models such as KSVZ and DFSZ over a large part of the explored mass interval. With the current long shut-down of CERN's accelerators providing a unique and timely window, such an experiment will deliver high-impact results even in conservative scenarios and potentially delivering a definitive test of the axion dark matter paradigm in the unexplored $1$\\text{--}\\SI{2}{\\micro\\electronvolt} mass range.","authors":"Alberto Arcusa Puente, Sergio Arguedas Cuendis, Marcos Buetas Mata, Sergio Calatroni, Cristian Cogollos, Alejandro Díaz-Morcillo, Babette Döbrich, Jacob Egge, Elisa Gabbrielli, Javier Galindo Guarch, Jose María García-Barceló, Benito Gimeno, Yikun Gu, Sophia Hollick, Igor Garcia Irastorza, David Kittlinger, Adrian Lambies-Asensio, Axel Lindner, Manuel Meyer, Adrián Muñoz-Urán, Jose R. Navarro-Madrid, Tobias Ortmann, Sagar Paul, Angel Rodriguez, Kristof Schmieden, Laura Segui, Wolfgang Wernsdorfer, Mina Yami","nlinked":36,"nref":54,"src":"INSPIRE","html":true},{"id":"3222604","arxiv":"2611.04600","title":"Light Mediators at the Neutrino-Dark Matter Frontier: Coherent Scattering, Precision Constraints, and Complementary Searches","first":"Serao","nauth":4,"year":2026,"cites":0,"role":"repl","note":"Closest of your papers: [[3130296]] (coupling 0.04, 7 shared references). Closest network paper: [[3095306]] (coupling 0.14, 11 shared references). Shared topics: direct detection, dark matter.","score":12.5,"rank":28,"section":"replacement","parts":[0.0,0.12,0.39,0.0,0.31],"abstract":"Low-threshold neutrino and dark-matter experiments constrain light mediators through different momentum transfers, targets, and coupling combinations. We examine scalar and vector interactions in coherent neutrino--nucleus scattering, neutrino--electron scattering, and dark-matter direct detection. Three representative interaction models are used to compare recoil spectra and coupling degeneracies. For $^{73}\\mathrm{Ge}$ and $^{131}\\mathrm{Xe}$, the nuclear-charge response matrix has a condition number of approximately 115, so two different targets may still leave nearly parallel blind directions. An analytic profile-likelihood calculation shows how spectral overlap and uncertainties in neutrino interactions affect dark-matter discovery sensitivity in the neutrino fog. We discuss the implications of measurements from COHERENT, CONUS+, LZ, XENONnT, and PandaX-4T and specify which theoretical inputs, detector responses, and statistical correlations are needed to combine their constraints. keyword : coherent elastic neutrino-nucleus scattering; light mediators; neutrino--electron scattering; dark matter direct detection; non-standard interactions; solar neutrinos; complementarity","authors":"Raoul Serao, Mohamed Ouchemhou, Antonio Capolupo, Salvatore Capozziello","nlinked":76,"nref":232,"src":"INSPIRE","html":true},{"id":"3224040","arxiv":"2611.07574","title":"Probing the Seed Effect of Supermassive Primordial Black Holes with Weak Gravitational Lensing","first":"Zu","nauth":2,"year":2026,"cites":0,"role":"today","note":"Closest of your papers: [[2860896]] (coupling 0.04, 5 shared references). Closest network paper: [[2918603]] (coupling 0.11, 9 shared references). Shared topics: primordial black hole, dark matter.","score":12.3,"rank":29,"section":"cross","parts":[0.0,0.11,0.31,0.0,0.43],"abstract":"We investigate the cosmological implications of supermassive primordial black holes (PBHs) as a component of dark matter (DM), focusing on their seed effect on large-scale structure formation. In contrast to the Poisson effect associated with the discrete distribution of PBHs, the seed effect arises because PBHs act as early gravitational seeds, accreting surrounding DM and developing dense DM spikes to form dressed PBHs. These structures enhance the matter power spectrum, particularly on small scales. We model their contribution within the halo-model framework under two prescriptions for DM accretion: an optimistic scenario (Case 1) and a conservative scenario (Case 2), which predict different modifications to the 1-halo term. We constrain the PBH abundance using weak-lensing measurements from the Dark Energy Survey Year 3 (DES Y3), performing a Markov Chain Monte Carlo analysis to derive upper limits on the PBH fraction $f_{\\rm PBH}$, as a function of the PBH mass $M_{\\rm PBH}$. We find that weak lensing places competitive constraints on supermassive PBHs, with the upper limits on $f_{\\rm PBH}$ becoming progressively stronger toward higher PBH masses. Case 1, which predicts more efficient DM accretion and hence a larger enhancement of the matter power spectrum, yields stronger constraints than Case 2; in particular, it excludes $f_{\\rm PBH}\\gtrsim10^{-4}$ for $M_{\\rm PBH}\\gtrsim10^{10} M_\\odot$. We further forecast the sensitivity of the Vera C. Rubin Observatory's Legacy Survey of Space and Time (LSST) using mock weak-lensing data and find that the constraints could improve by approximately two orders of magnitude. Our results establish weak gravitational lensing as a sensitive probe of the seed effect of supermassive PBHs and demonstrate its potential to complement other cosmological and astrophysical searches.","authors":"Lei Zu, Kazunori Kohri","nlinked":66,"nref":67,"src":"INSPIRE","html":true},{"id":"3224082","arxiv":"2611.07877","title":"Can Two-Point Correlations Determine Gravitational Waves from Sound Waves?","first":"Chen","nauth":3,"year":2026,"cites":0,"role":"today","note":"Closest of your papers: [[2787890]] (coupling 0.02, 1 shared references). Closest network paper: [[2928725]] (coupling 0.22, 20 shared references). Shared topics: gravitational wave.","score":11.9,"rank":30,"section":"new","parts":[0.0,0.04,0.64,0.0,0.1],"abstract":"Sound waves are expected to be a dominant source of gravitational waves (GWs) from cosmological first-order phase transitions. Their spectrum is commonly predicted using the fluid velocity two-point correlation function under the Gaussian approximation. However, since the GW source is quadratic in velocity, connected four-point correlations may also contribute to the GW spectrum. Through two analytical toy examples, we demonstrate that velocity two-point correlations alone does not always uniquely determine the GW spectrum. Moving beyond these idealized examples, we investigate a realistic acoustic source based on stochastic bubble nucleation and growth, proving that the connected contribution becomes subleading during subsequent linear acoustic propagation, although cosmic expansion limits this suppression. These results clarify when two-point reconstruction is reliable and how higher-order velocity correlations and the duration of acoustic emission affect GW predictions.","authors":"Guangshang Chen, Jianpeng Dai, Yang Xiao","nlinked":34,"nref":36,"src":"INSPIRE","html":true},{"id":"3223966","arxiv":"2611.07008","title":"Probing Dark Matter-Electron Scattering with the Central Molecular Zone","first":"Nguyen","nauth":4,"year":2026,"cites":0,"role":"today","note":"Closest of your papers: [[3130296]] (coupling 0.06, 12 shared references). Closest network paper: [[1894389]] (coupling 0.12, 15 shared references). Shared topics: dark matter.","score":11.7,"rank":31,"section":"new","parts":[0.0,0.16,0.35,0.0,0.16],"abstract":"The Central Molecular Zone, a dense and gas-rich region surrounding the Galactic Center, hosts numerous dense molecular gas cores that provide unique environments to probe dark matter interactions. Among these, the IRS 13E3 cluster is one of the closest to the Galactic Center and one of the most extensively studied. We show that dark matter-electron scattering can substantially ionize molecular hydrogen (H$_2$) in the IRS 13E3 core, contributing to the ionization rate in conjunction with standard cosmic rays. Using the ionization rate inferred from H$_3^+$ observations of the central parsecs, we derive constraints on heavy and ultralight dark photon mediators, a heavy leptophilic mediator, and electric dipole moment interactions in the strongly interacting regime, where terrestrial searches are limited by the overburden problem. Our results highlight the potential of dense molecular cores near the Galactic Center as promising targets for constraining dark matter interactions with future observations.","authors":"Thong T. Q. Nguyen, Shyam Balaji, Carlos Blanco, Pedro De la Torre Luque","nlinked":134,"nref":159,"src":"INSPIRE","html":true},{"id":"3224097","arxiv":"2611.07957","title":"Can $n_s$ hint at a parity-odd sector of gravity?","first":"Dioguardi","nauth":1,"year":2026,"cites":0,"role":"today","note":"Closest of your papers: [[2663002]] (coupling 0.04, 8 shared references). Closest network paper: [[3185270]] (coupling 0.17, 16 shared references).","score":10.7,"rank":32,"section":"cross","parts":[0.0,0.11,0.49,0.0,0.0],"abstract":"We study slow-roll inflation in the context of metric-affine gravity. We consider the most general projectively invariant metric-affine theory at most quadratic in the distortion and linear in curvature with no propagating torsion and non-metricity and couple it non-minimally to a scalar field. We focus on the class of $ξ$-attractors, in which a single function $f(φ)$ fixes the whole scalar sector. Integrating out the non-dynamical distortion generates a correction to the kinetic term $k(φ)$ which is $f'(φ)^2$ times a ratio of polynomials in $f(φ)$. The new kinetic term can develop poles at finite field values, where the distortion field equations degenerate. We classify the poles and derive the conditions on the effective couplings for poles of order $p=2$ and $p=3$, the maximal order allowed in this setting. We then proceed to study inflation. Second-order poles realize $α$-attractors with $α$ fixed by the residue and are already available in the parity-even sector of the theory. Third-order poles instead require the parity-odd sector: whenever the parity-odd quadratic couplings vanish, the kinetic function splits into two independent terms with poles of order at most $p=2$
