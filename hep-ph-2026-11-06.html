 as well as its implementation in a companion code. The usual method consists in building the first few VVMFs, whose tensor products then generate the others. We address the difficulty of systematically finding the minimal set of VVMFs that suffices to produce all higher-weight ones, and we propose a method to identify it that makes use of the Burnside-Brauer theorem. For any given group, whose basic group-theoretic and representation-theoretic description is provided by the user, the code determines the minimal set of VVMFs, explicitly builds it using general results of the theory of such functions, then performs the tensor products that generate any other VVMF. Importantly, it automatically takes into account all caveats that might arise during the study of new groups. Our approach reproduces the known results for the finite modular groups explored in the recent phenomenological literature on modular flavor symmetries, and works for additional groups which we tested. We illustrate our algorithm and the working of our code by studying a model of leptons based on the unexplored finite modular group $A_4\\times\\mathbb{Z}_4$."},{"arxiv":"2606.21658","id":"3170879","title":"Towards LLM-Powered Automation of a Dark Matter Constraint Repository","authors":"Lanqing Yuan, Karthik Ramanathan","score":7.7,"section":"replacement","rank":34,"parts":[0.06,0.07,0.15,0.0,0.13],"note":"Also cites widely used network papers: [[1783234]]. Closest of your papers: [[1607572]] (coupling 0.02, 1 shared references). Closest network paper: [[2822193]] (coupling 0.05, 3 shared references). Shared topics: dark matter.","abstract":"Dark matter constraint repositories are critical community infrastructure, yet the most widely-used are volunteer-maintained, a sustainability risk as results accelerate. Limits are typically published as figures rather than machine-readable records, compounding the burden. We present a large language model (LLM) system that monitors arXiv, extracts limit curves, integrates them as code, and opens pull requests for human review. Extraction uses a tool-using agent that interprets physical conventions and checks its results, with a fixed multi-channel pipeline evaluated as an alternative. We evaluate both approaches on a 329-paper benchmark of measured limits graded against the upstream-curated repository. An extraction is considered successful when the extracted and reference mass ranges overlap by more than 90%, with at least 90% of compared values agreeing within a factor of two. For Fable 5, 52.6% of eligible curve comparisons meet this criterion with the agent, compared with 20.9% with the pipeline. Deployed, the pipeline has generated limit proposals, but none have merged: governance of AI-generated scientific data is itself unsolved."},{"arxiv":"2611.07026","id":"3223952","title":"Finite is not enough: Triviality bounds in nonlocal field theories","authors":"Fabian Wagner","score":6.9,"section":"cross","rank":35,"parts":[0.0,0.03,0.07,0.5,0.0],"note":"Co-authors of yours: Wagner. Closest of your papers: [[1394206]] (coupling 0.01, 1 shared references). Closest network paper: [[2895388]] (coupling 0.02, 2 shared references).","abstract":"An ultraviolet-finite theory need not be ultraviolet complete. This observation weakens the case for spacetime discreteness in quantum gravity if that case rests on removing ultraviolet divergences alone. We arrive at this observation by deriving the one-loop momentum-subtraction flow in four-dimensional $φ^4$ theories with ultraviolet-suppressing form factors. The suppression freezes the running above the nonlocality scale, but the theory can hit a Landau pole before suppression sets in. We obtain a bound on the infrared coupling by requiring perturbative control at all scales. This bound varies only at the percent level across the examples we consider. We expect similar bounds in models of discrete spacetime. Thus, requiring ultraviolet completeness improves the predictivity of nonlocal theories."},{"arxiv":"1303.1523","id":"1222779","title":"Inflation, Cosmic Perturbations and Non-Gaussianities","authors":"Yi Wang","score":6.9,"section":"replacement","rank":36,"parts":[0.0,0.07,0.32,0.0,0.0],"note":"Closest of your papers: [[1655573]] (coupling 0.02, 5 shared references). Closest network paper: [[3177342]] (coupling 0.11, 30 shared references).","abstract":"We review the theory of inflationary perturbations. Perturbations at both linear and nonlinear orders are reviewed. We also review a variety of inflation models, emphasizing their signatures on cosmic perturbations."},{"arxiv":"2611.07426","id":"3224014","title":"First broadband search for fixed-polarization dark photon dark matter with GigaBREAD","authors":"Jialin Yu, Stefan Knirck, Gabe Hoshino, Rakshya Khatiwada, Alex Lapuente, David W. Miller, Andrew Sonnenschein","score":6.8,"section":"cross","rank":37,"parts":[0.0,0.08,0.19,0.0,0.16],"note":"Closest of your papers: [[3130296]] (coupling 0.03, 2 shared references). Closest network paper: [[1741056]] (coupling 0.07, 3 shared references). Shared topics: dark matter.","abstract":"We present the first search for fixed-polarization dark photon (DP) dark matter in the 44-52$μ\\mathrm{eV}$ mass range, corresponding to 10.7-12.5GHz. GigaBREAD is a room-temperature broadband dish antenna experiment in which DP convert to ordinary photons on a cylindrical metallic emission surface and are focused onto a radio-frequency receiver. Previous searches, including GigaBREAD and several other dish antenna searches, have assumed randomly polarized DP dark matter. However, vector dark matter produced by a misalignment-like mechanism may retain an approximately fixed polarization, leading to sidereal modulation of the detector response as the Earth rotates. We reanalyze the GigaBREAD data using a polarization-matched likelihood that accounts for the time-dependent projection of a fixed DP polarization onto the detector axis. We find no evidence for a fixed-polarization DP signal and set upper limits on the kinetic mixing parameter at the level of $χ\\sim10^{-12}$. These limits are about $20\\%$ better than a naive limit obtained by rescaling the previous GigaBREAD limit under the fixed-polarization assumption."},{"arxiv":"2611.02987","id":"3222372","title":"Machine-learning discovery potential for a heavy Higgs boson in $e^+e^-\\to ZH$ at a future lepton collider","authors":"Majid Hashemi","score":6.4,"section":"replacement","rank":38,"parts":[0.0,0.09,0.25,0.0,0.0],"note":"Closest of your papers: [[1455793]] (coupling 0.03, 3 shared references). Closest network paper: [[2686887]] (coupling 0.09, 8 shared references).","abstract":"A study of the discovery potential for a CP-even heavy neutral Higgs boson $H$ is presented in the Type-I two-Higgs-doublet model (2HDM) at a future $e^+e^-$ collider with $\\sqrt{s}=500~\\mathrm{GeV}$, focusing on the process $e^+e^-\\to ZH$ with $H\\to WW$, and with $Z\\to\\ell\\ell$ or $Z\\toνν$. The final states are four jets plus two leptons ($4j2\\ell$) and four jets plus missing transverse momentum ($4j2ν$). Both a Boosted Decision Tree (BDT) and a Deep Neural Network (DNN) were trained on the same inputs. The BDT was found to be substantially faster in training and inference without any loss of performance, and it is therefore the classifier used in the interpretation. Three strategies are compared: a cut-based analysis, a one-dimensional BDT selection trained per mass point, and a two-dimensional (BDT $\\times$ $m_H$) template analysed with a profile likelihood. The 2D template improves the expected discovery significance by a factor of $2.5$--$3.6$ in the $4j2\\ell$ channel and by a factor of $5$--$18$ in the $4j2ν$ channel relative to the cut-based analysis, with the largest gains at high $m_H$ where the cut-based mass window loses efficiency. We translate the expected exclusions into $95\\%$ CL upper limits on $σ\\times$ BR and discuss the implications for the Type-I 2HDM parameter space."},{"arxiv":"2611.07056","id":"3223970","title":"Searches for electroweak singlets at future plasma wakefield colliders","authors":"So Chigusa, Simon Knapen, Toby Opferkuch, Inbar Savoray, Christiane Scherb, Weishuang Linda Xu","score":6.2,"section":"new","rank":39,"parts":[0.0,0.05,0.14,0.0,0.26],"note":"Closest of your papers: [[1832796]] (coupling 0.02, 3 shared references). Closest network paper: [[2672276]] (coupling 0.05, 7 shared references). Shared topics: singlet scalar.","abstract":"We study the sensitivity of future 10 TeV plasma wakefield colliders to a real electroweak singlet scalar $S$ coupled to the Standard Model through the Higgs portal. Using luminosity spectra obtained from particle-in-cell simulations, we compare $e^+e^-$ and $e^-e^-$ configurations with both flat and round beam profiles, as well as a $γγ$ collider based on Compton backscattering of laser photons off the $e^-e^-$ beams. The $e^-e^-$ and $γγ$ options avoid the open challenge of accelerating positrons in plasma. Without a positron beam, however, the vector boson fusion channels $e^+e^-\\toν\\barνS$ and $e^+e^-\\toν\\barνSS$, which dominate at $e^+e^-$ colliders, can only proceed through secondary positrons and are heavily suppressed. At a $γγ$ collider, this loss in signal rate is partially compensated by additional photon-initiated processes. While the $e^-e^-$ configurations are not as competitive, both the $e^+e^-$ and $γγ$ wakefield options have a reach qualitatively similar to that of a 10 TeV muon collider and the FCC-hh. Between the two, the $γγ$ option gives the stronger sensitivity if the achievable geometric luminosities of $e^+e^-$ colliders are more than a factor of $\\sim$3 lower than that of the $γγ$ collider."},{"arxiv":"2611.07366","id":"3224093","title":"A framework for matrix-element-corrected QED antenna showers in hadron decays","authors":"F. Abudinén, G. Morgante, P. Skands","score":6.0,"section":"new","rank":40,"parts":[0.06,0.06,0.14,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[3094526]] (coupling 0.02, 4 shared references). Closest network paper: [[2658297]] (coupling 0.05, 9 shared references).","abstract":"We present a general framework for the description of QED parton showers in hadron decays. The formalism is constructed in terms of coherent QED antennae with full dependence on particle masses and extends beyond the YFS approach by systematically incorporating spin-dependent (quasi)collinear single-unresolved limits to all orders. In addition, we incorporate corrections derived from tree-level matrix elements up to $\\mathcal{O}(α^2)$ and describe a generic procedure to obtain such matrix elements using FeynRules and MadGraph. We provide an explicit implementation of the method for decays involving pseudoscalar mesons and for decays of vectors and pseudoscalars into fermion-antifermion pairs, within the combined Pythia+Vincia parton-shower Monte Carlo framework, and compare the resulting QED emission spectra to those generated with Photos and Sherpa+Photons++ through the EvtGen generator."},{"arxiv":"2611.07013","id":"3224007","title":"Latest $ν$s from the Earliest Galaxies: Probing neutrino self-interactions with JWST","authors":"Ranjini Mondol, Priyank Parashari, Anirban Das, Vera Gluscevic, Ranjan Laha","score":6.0,"section":"cross","rank":41,"parts":[0.0,0.03,0.24,0.0,0.14],"note":"Closest of your papers: [[2663002]] (coupling 0.01, 3 shared references). Closest network paper: [[3223723]] (coupling 0.09, 39 shared references). Shared topics: early universe.","abstract":"Our Universe serves as a complementary laboratory for particle physics interactions. One intriguing possibility is that neutrinos may have beyond-the-Standard-Model (BSM) self-interactions, which can delay their free streaming and have an observable effect across different redshifts. Such interactions can induce scale-dependent changes in the matter power spectrum. The James Webb Space Telescope (JWST) has opened up a new window onto the early Universe by discovering a large population of high-redshift galaxies up to $z \\sim 15$ and various probable galaxy candidates at even higher redshifts, between $z \\sim 15-30$. Such high-redshift observations can probe the matter power spectrum on small scales, since structure formation is hierarchical and the structures hosting these high-redshift galaxies are therefore expected to be small. We, $\\textit{for the first time}$, use the UV luminosity function data from JWST and combine them with the $\\textit{Planck}$ CMB data to probe neutrino self-interactions ($ν$SI). If only one neutrino flavor experiences such BSM interactions, then $\\textit{Planck}$ + JWST data give a 95% C.L. upper limit on $\\mathrm{Log}_{10}(G_{\\mathrm{eff}}/\\mathrm{MeV}^{-2})$ $\\approx$ $-2.75$ and when all three flavors are interacting, the corresponding constraint becomes $\\lesssim -3.41$; both stronger than those obtained using only $\\textit{Planck}$ data. Our results highlight the power of this new observable, the high-redshift UV luminosity function from JWST as a complementary probe to terrestrial experiments, showing that small-scale observables can open a new window onto smaller neutrino self-interaction strengths."},{"arxiv":"2611.07317","id":"3223979","title":"Constraining the parameter space of a singlet down-type vector-like quark","authors":"Mohammad Ahmady, Maryam Bibi, Ruben Sandapen","score":5.9,"section":"new","rank":42,"parts":[0.06,0.08,0.1,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2690106]] (coupling 0.03, 2 shared references). Closest network paper: [[3203506]] (coupling 0.04, 2 shared references).","abstract":"We consider a minimal New Physics scenario in which the Standard Model is extended by singlet down-type vector-like quark(VLQ). We constrain its parameter space using the measured branching ratios for $B_s \\to μ^+ μ^-$, $B \\to X_s μ^+ μ^-$ and $B \\to X_s γ$, which are all consistent with Standard Model predictions. Besides considering the tree-level flavor-changing-neutral-current amplitude allowed in this NP scenario, we account for a Higgs--VLQ loop amplitude and show that their resulting interference drives the VLQ mass into the discovery reach via direct searches at the LHC. We also examine the implications of this minimal NP scenario for the rare $B \\to K ν\\barν$ decay where there is a persistent tension between the SM prediction and the Belle II measurements."},{"arxiv":"2604.19880","id":"3148043","title":"Ultra-High-Energy Tau Neutrinos as Probes of Lorentz Invariance","authors":"Vedran Brdar, Samiur R. Mir","score":5.9,"section":"replacement","rank":43,"parts":[0.0,0.02,0.36,0.0,0.0],"note":"Closest of your papers: [[3184726]] (coupling 0.01, 1 shared references). Closest network paper: [[2905773]] (coupling 0.13, 13 shared references).","abstract":"Neutrino telescopes have detected astrophysical neutrinos with energies up to ${O}(100)$ PeV. Several current and proposed experiments aim to observe neutrinos at even higher energies, with the goal of detecting cosmogenic neutrinos. This increase in neutrino energy makes tests of Lorentz invariance violation (LIV) particularly appealing, since the effects of higher-dimension LIV operators on neutrino propagation grow rapidly with energy. In this work, we investigate the potential of the upcoming experiments GRAND and POEMMA to probe LIV in the neutrino sector through the detection of ultra-high-energy tau neutrinos. We generate the cosmogenic neutrino flux using SimProp and interface it with a calculation of neutrino flavor transition probabilities in the presence of LIV effects. Deviations from standard flavor transition probabilities manifest as changes in the expected tau neutrino event rates at GRAND and POEMMA. We first consider the case with a single nonzero LIV operator of various dimensions, and find that the projected sensitivities exceed existing limits from lower-energy probes by orders of magnitude. We then explore scenarios with multiple nonzero LIV parameters and show that their interplay can significantly modify the sensitivities compared to the single-parameter case. Overall, we find that upcoming observations of ultra-high-energy tau neutrinos will place some of the most stringent constraints on LIV."},{"arxiv":"2506.19053","id":"2938364","title":"Dark Energy Crosses the Line: Quantifying and Testing the Evidence for Phantom Crossing","authors":"Emre Özülker, Eleonora Di Valentino, William Giarè","score":5.5,"section":"replacement","rank":44,"parts":[0.0,0.03,0.31,0.0,0.0],"note":"Closest of your papers: [[2663002]] (coupling 0.01, 3 shared references). Closest network paper: [[3223723]] (coupling 0.11, 36 shared references).","abstract":"Combinations of the most recent CMB, BAO, and SNeIa datasets, when analyzed using the CPL parametrization, $w(a) = w_0 + (1 - a) w_a$, exclude $Λ$CDM at $\\gtrsim\\!3σ$ in favor of a dark energy equation of state (EoS) parameter that crosses the phantom divide. We confirm this behavior and show that it persists when DESI BAO data are replaced by SH0ES $H_0$ measurements, despite the known tension between these probes in the presence of CMB data. In both cases, the constraints favor a transition from an early-time phantom-like phase to a late-time quintessence-like phase, with the crossing occurring at different redshifts depending on the dataset combination. The probability that a phantom divide line (PDL) crossing does not occur within the expansion history is excluded at significance levels ranging \\mbox{between $3.1σ$\\,--\\,$5.2σ$.} To investigate whether the apparent PDL crossing is a genuine feature preferred by the data or an artifact of the linear form of the CPL parametrization, we isolate the PDL crossing feature by introducing two modified versions of CPL that explicitly forbid it: CPL${}_{>a_\\mathrm{c}}$ and CPL${}_{<a_\\mathrm{c}}$. These models are physically motivated in that they phenomenologically capture the behavior of thawing and freezing scalar field scenarios. While previous studies have primarily considered thawing quintessence as a non-crossing alternative, we find that a freezing phantom-like model is the only one capable of performing comparably to CPL--and only in a few cases. Nevertheless, across all dataset combinations considered, the standard CPL model consistently provides the best fit, strongly indicating that the data genuinely favor a PDL crossing."},{"arxiv":"2611.07897","id":"3224044","title":"The Mass Gap Approach to QCD. III. Solution of the gluon confinement problem","authors":"Vakhtang Gogokhia, Gergely Gábor Barnaföldi","score":5.0,"section":"cross","rank":45,"parts":[0.06,0.05,0.1,0.0,0.0],"note":"Also cites widely used network papers: [[1688995]]. Closest of your papers: [[1708907]] (coupling 0.02, 1 shared references). Closest network paper: [[3081871]] (coupling 0.04, 3 shared references).","abstract":"We present reports on progress in the solution of the gluon confinement problem and in the explanation of the scale breaking in the asymptotic freedom regime in QCD. It is based on the previously formulated the mass gap approach to QCD, which sheds the light on a mass origin in its ground state. We have established the exact expression for the full gluon propagator. One of its solution allows to sum up all the severe (more singular than $1/q^2$) infrared singularities which can be accommodated by a single full gluon propagator. In order to correctly treat them, we have developed a formalism of the joint use of the theory of functions of complex variable, and the dimensional regularization method correctly implemented into the theory of distributions. Despite the presence of the mass gap, gluons remain massless. Our solution satisfies the two boundary conditions: it dominates over all other possible solutions at large distances but itself prevents gluons to appear in the physical spectrum. It possesses the asymptotic freedom behaviour at short distances. We discuss the connection of our results to the Elitzur's theorem."},{"arxiv":"2512.17695","id":"3220828","title":"Baryogenesis and EDMs in the 2HDM with a Complex Singlet","authors":"Björn Garbrecht, Edward Wang","score":5.0,"section":"replacement","rank":46,"parts":[0.0,0.02,0.14,0.0,0.21],"note":"Closest of your papers: [[2663002]] (coupling 0.01, 1 shared references). Closest network paper: [[2051136]] (coupling 0.05, 10 shared references). Shared topics: complex scalar.","abstract":"We perform the first joint analysis of baryogenesis from initial Higgs charges (also called Higgsogenesis) and electric dipole moments (EDMs) in a model with two Higgs doublets, a complex scalar, and a Majorana fermion. In our proposed scenario, baryogenesis happens in three steps: (1) The decay of the scalar produces an asymmetry between the two Higgs doublets which is partly transferred to fermions via Standard Model processes. (2) This asymmetry is converted into a $B-L$ charge via interactions mediated by the Majorana fermion. (3) The weak sphaleron processes partially convert the resulting $B-L$ charge into a $B$ asymmetry. We perform a numerical analysis of baryogenesis and the EDM contributions and find that, due to resonant enhancement, baryogenesis is possible with singlet masses as low as $10^5$ GeV. We also find that for some parameters, the model can give large contributions to the electron and neutron EDM while also producing baryogenesis. The present scenario offers a new perspective on interpreting observational bounds in terms of cosmology: Because it relies on out-of-equilibrium decays, the questions of baryogenesis and $CP$ violation in the Higgs sector may be linked with EDM signals without the additional assumption of a first order electroweak phase transition."},{"arxiv":"2611.04802","id":"3222623","title":"Study of enhancing the signal-background separation for the Higgs boson production in association with a single top-quark in $pp$ collisions at the LHC","authors":"Rustam Azimzade, Alina Dadashova, Igor Boiko, Vladimir Lyubushkin, Nazim Huseynov","score":5.0,"section":"replacement","rank":47,"parts":[0.0,0.09,0.15,0.0,0.0],"note":"Closest of your papers: [[3094526]] (coupling 0.03, 5 shared references). Closest network paper: [[2660030]] (coupling 0.05, 10 shared references).","abstract":"In this paper, a multivariate analysis based approach for enhancing the extraction of the rare Standard Model (SM) process being studied - Higgs boson production in association with a single top quark (tH) - from the prevailing background processes is presented. The analysis was performed using a Monte Carlo generated dataset simulating the outcomes of proton-proton collisions at the Large Hadron Collider (LHC). A deep fully connected neural network was developed for signal-background discrimination, incorporating a masking mechanism designed to suppress the contribution of input variables associated with objects that were not reconstructed in a given event. The performance of the masked architecture was evaluated on independent Monte Carlo samples. The results of the proposed methodology are compared with a conventional cut-based approach in terms of the statistical significance of the tH production channel. The developed framework was tested using a simulated dataset corresponding approximately to the combined statistical samples of LHC Runs 1, 2, and 3."},{"arxiv":"2611.07067","id":"3223976","title":"QED corrections to $e^+e^-\\toπ^+π^-(γ)$ with amplitude-level resummation","authors":"Stéphane Delorme, Charles Earnshaw, Frank Krauss, Alan Price, Nora Salone, Andrzej Siódmok","score":4.9,"section":"new","rank":48,"parts":[0.0,0.06,0.2,0.0,0.0],"note":"Closest of your papers: [[2690106]] (coupling 0.02, 4 shared references). Closest network paper: [[2873857]] (coupling 0.07, 8 shared references).","abstract":"We present QED corrections to $e^+e^-\\toπ^+π^-(γ)$ in two independent Monte Carlo event generators, KKMC and SHERPA, for point-like scalar pions dressed with the pion form factor. All-order soft-photon exponentiation is combined with exact one- and two-photon tree amplitudes, the complete one-loop correction including the initial-final boxes with coherent interference, and at second order the photonic two-loop vertices and the exact one-loop correction to one-photon emission. At first order their fiducial cross sections agree to $\\lesssim0.04\\%$ and their distributions within statistical precision. The second-order band is $\\sim0.005\\%$ for CMD, $\\sim0.4\\%$ at $4$ GeV and $\\sim0.9\\%$ at $10$ GeV. Theory nuisance parameters estimate missing higher orders, and we construct a new rule for treating radiative return, where first-order corrections are of order one."},{"arxiv":"2611.08221","id":"3225490","title":"DIS-secting the universe with high-energy neutrinos","authors":"Rhorry Gauld, Lorenzo Guerra, Ulrich Haisch, Alessio Vorona","score":4.4,"section":"new","rank":49,"parts":[0.06,0.01,0.13,0.0,0.01],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[3146383]] (coupling 0.00, 1 shared references). Closest network paper: [[2940264]] (coupling 0.05, 8 shared references).","abstract":"We revisit the impact of electroweak (EW) radiative corrections on the kinematic distributions of charged leptons in neutrino-induced charged-current (CC) deep inelastic scattering (DIS). These corrections are particularly relevant for observables sensitive to collinear photon radiation, such as the energy spectrum of high-energy muons detected in neutrino telescopes. To study these effects, we implement full next-to-leading order (NLO) EW corrections to CC DIS in a flexible Monte Carlo framework, supplemented with higher-order logarithmically enhanced final-state QED radiation and coherent scattering contributions. We compare our results to exclusive NLO QCD plus parton shower (PS) predictions obtained with an existing $\\texttt{POWHEG-BOX}$ event generator, examining different PS models and settings. Based on this comparison, we provide recommendations for the use of the $\\texttt{POWHEG-BOX}$ event generator in experimental analyses. We further assess the impact of radiative corrections on the correlation between the observed muon energy and the incoming neutrino energy, and on the mean inelasticity averaged over a realistic neutrino flux. These corrections can exceed $10\\%$, and above about $10^4\\,{\\rm GeV}$ they receive sizeable contributions from photon-initiated and coherent $W$-boson production, which are not included in the event generator."},{"arxiv":"2604.18286","id":"3147008","title":"Analysis of the $D_0^*(2300)$ resonance from lattice QCD under chiral symmetry","authors":"Jing Luo, Bing Wu, Pan-Pan Shi, Meng-Lin Du","score":4.4,"section":"replacement","rank":50,"parts":[0.06,0.01,0.13,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[3184726]] (coupling 0.00, 1 shared references). Closest network paper: [[3193100]] (coupling 0.05, 49 shared references).","abstract":"We reanalyze the lattice spectra for $I=1/2$ $Dπ$ scattering in the $A_1^+$ irreducible representation from [Phys. Rev. D 111, 014503 (2025)] to investigate the impact of chiral and SU(3) flavor symmetries in $S$-wave $Dπ$ scattering and the $D_0^*(2300)$ resonance. By fitting the phase shifts obtained via Lüscher's formula with both traditional and chirally modified effective-range expansion and $K$-matrix parameterizations, we find that the chiral factor shifts the extracted pole mass closer to the threshold (especially for resonances) and substantially reduces the resonance width. These findings are confirmed by unitarized chiral perturbation theory through a direct fit to the lattice spectra with both the single-channel and the $Dπ$-$Dη$-$D_s\\bar{K}$ coupled-channel schemes. Once the coupled channels are incorporated, the two-pole structure of the $D_0^*(2300)$ emerges. The trajectories of the two poles are investigated by varying the pion mass."},{"arxiv":"2606.28498","id":"3174427","title":"Defining a Minimum Resolution for Unbinned Analyses","authors":"Manuel Szewc","score":4.3,"section":"replacement","rank":51,"parts":[0.0,0.04,0.2,0.0,0.0],"note":"Closest of your papers: [[1455793]] (coupling 0.01, 2 shared references). Closest network paper: [[3187354]] (coupling 0.07, 5 shared references).","abstract":"Collider analyses combine rigorous statistical techniques with state-of-the-art Machine Learning models. However, when the latter are used directly to estimate the likelihood function of the background, hard to quantify systematic effects may bias the estimation of the relevant signal parameters. To address this problem, we present the Minimum Resolution Likelihood (MRL) method, which defines a Fiducial Signal Region that aims to turn systematic effects into statistical uncertainties. We show with examples that the resulting signal strength estimation has a reduced bias, with the effect depending on the sample size and type of signal considered. We consider both toy examples and a realistic application based on the HI-SIGMA technique applied to di-Higgs searches."},{"arxiv":"2604.18416","id":"3147129","title":"Classical and quantum evolution of inflationary fluctuations","authors":"Guillermo Ballesteros, Jesús Gambín Egea, Alejandro Pérez Rodríguez","score":4.2,"section":"replacement","rank":52,"parts":[0.0,0.06,0.16,0.0,0.0],"note":"Closest of your papers: [[2663002]] (coupling 0.02, 3 shared references). Closest network paper: [[2753529]] (coupling 0.06, 3 shared references).","abstract":"We compare the correlation functions of inflationary perturbations computed either with quantum or classical dynamics. Even if they are enforced to agree at a specific time during inflation, classical and quantum correlations will differ at the end of inflation, provided that interactions are relevant. The difference between the results of the classical and quantum computations is exponentially sensi- tive to the number of e-folds elapsed from the time of agreement. We illustrate this finding with the tree-level bispectrum of the primordial curvature fluctuation and the one-loop power spectrum of tensor modes. We also show that classical evolution from a finite time does not imply the appearance of poles in the scalar bispectrum."}],"rest":[{"arxiv":"2610.39959","title":"$P$-wave quarkonia in jets at the LHC","score":4.0,"section":"replacement","rank":53},{"arxiv":"2611.07826","title":"Estimating Spectrum-Free Information Bounds for Generative Surrogates Beyond Conditional Collapse","score":3.9,"section":"new","rank":54},{"arxiv":"2607.06046","title":"Radiative decays of $X(3872)$ within $D{\\bar D}^*$ molecular framework","score":3.9,"section":"replacement","rank":55},{"arxiv":"2608.04105","title":"Quarkoniumlike states above open-flavor thresholds in Born-Oppenheimer EFT","score":3.8,"section":"replacement","rank":56},{"arxiv":"2601.11277","title":"Hadronic tau decays at higher orders in QCD","score":3.7,"section":"replacement","rank":57},{"arxiv":"2508.14898","title":"Lorentz-Equivariance without Limitations","score":3.3,"section":"replacement","rank":58},{"arxiv":"2611.07838","title":"Phenomenological investigation of order statistics for multi-jet events","score":3.2,"section":"new","rank":59},{"arxiv":"2611.08272","title":"Analytic parametrisations of the scale dependence of proton parton distributions","score":2.5,"section":"new","rank":60},{"arxiv":"2611.08463","title":"Joint Bayesian Inference for Extraction of Charmonium Long Distance Matrix Elements Using PYTHIA","score":2.4,"section":"new","rank":61},{"arxiv":"2611.07869","title":"Generalized parton distributions of the nucleon in the chiral quark soliton model II: Chiral anomaly mediation in the polarized GPDs","score":2.2,"section":"new","rank":62},{"arxiv":"2610.26892","title":"Minimal-le function refShow(el){const r=REFS[el.dataset.ref];if(!r)return;rcur=el;rtip.textContent=`${auth(r)} (${r.year}) — ${plain(r.title)}`;rtip.hidden=false;
  const b=el.getBoundingClientRect(),t=rtip.getBoundingClientRect();let L=Math.min(Math.max(8,b.left),innerWidth-t.width-8),T=b.bottom+6;
  if(T+t.height>innerHeight-8)T=b.top-t.height-6;rtip.style.left=L+'px';rtip.style.top=T+'px'}
function refHide(){rtip.hidden=true;rcur=null}
document.addEventListener('pointerover',e=>{const el=e.target.closest('.ref');if(el&&e.pointerType==='mouse')refShow(el)});
document.addEventListener('pointerout',e=>{if(e.target.closest('.ref')&&e.pointerType==='mouse')refHide()});
document.addEventListener('click',e=>{const el=e.target.closest('.ref');if(el)refShow(el);else if(rcur)refHide()});
document.addEventListener('focusin',e=>{const el=e.target.closest('.ref');if(el)refShow(el)});
document.addEventListener('focusout',e=>{if(e.target.closest('.ref'))refHide()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')refHide()});
addEventListener('scroll',()=>{if(rcur)refHide()},{passive:true});
// the rest of the day's papers by score: only the title, linked to the arXiv record
function restList(){const X=RAW.rest||[];if(!X.length)return;const d=document.getElementById('rest'),box=document.getElementById('restlist');
  d.hidden=false;d.querySelector('summary').firstChild.textContent=`All other ${X.length} papers in this listing `;
  document.getElementById('restsub').textContent='by score, title only';
  box.innerHTML=X.map(n=>`<li><span class="sc">#${n.rank} · ${n.score.toFixed(1)}</span><a href="https://arxiv.org/abs/${esc(n.arxiv)}" target="_blank" rel="noopener">${esc(n.title)}</a></li>`).join('');
  d.addEventListener('toggle',()=>{if(d.open)tex(box)})}
list();nextList();restList();fold();draw();panel();
window.addEventListener('load',()=>{tex(document.getElementById('list'));tex(document.getElementById('panel'));fold();
  if(window.MathJax&&MathJax.startup&&MathJax.startup.promise)MathJax.startup.promise.then(()=>setTimeout(fold,300))});
addEventListener('resize',()=>{clearTimeout(window._ft);window._ft=setTimeout(fold,200)});
</script>
