ling 0.17, 7 shared references).","abstract":"Ultra-relativistic electrons initiate electromagnetic showers in ordinary matter that evolve through bremsstrahlung and pair production. At very high energy, the quantum mechanical duration of bremsstrahlung becomes longer than the mean free time to elastically scatter from the medium, leading to a significant suppression known at the Landau-Pomeranchuk-Migdal (LPM) effect. For some ranges of bremsstrahlung photon and initial electron energies $(k_γ,E)$, the duration becomes so long that it will also overlap with subsequent pair production by the bremsstrahlung photon, disrupting LPM suppression and drastically changing LPM predictions. We have previously calculated this change for extremely high energies ($k_γ\\gg 2$ TeV or more, depending on the medium), for which the electron mass and medium-induced photon mass could be ignored. In this paper, we extend that analysis to lower (but still ultra-relativistic) energy by accounting for those masses, leading to a rich map of behavior in different regions of $(k_γ,E)$."},{"arxiv":"2611.19416","id":"3229502","title":"Constraining neutrino masses with localized fast radio bursts: Current bounds and future prospects","authors":"Yin-Long Cao, Ji-Guo Zhang, Guo-Hong Du, Tian-Nuo Li, Jing-Fei Zhang, Xin Zhang","score":8.5,"section":"cross","rank":31,"parts":[0.06,0.05,0.22,0.0,0.16],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1220579]] (coupling 0.02, 3 shared references). Closest network paper: [[3223723]] (coupling 0.08, 29 shared references). Shared topics: neutrino mass.","abstract":"The dispersion-measure (DM)--redshift relation of fast radio bursts (FRBs) provides independent low-redshift cosmological information for neutrino-mass inference. In this work, we perform joint analyses with cosmic microwave background (CMB) data, using 120 localized FRBs with reliable host-galaxy redshifts and larger mock samples, to investigate the effects of sample size and the dark-energy model on constraints on the sum of neutrino masses, $\\sum m_ν$. In the $Λ$CDM+$\\sum m_ν$ model, CMB+FRB gives $\\sum m_ν<0.21\\,\\mathrm{eV}$, substantially relaxed relative to the current CMB+DESI result. With 1000 simulated events, CMB+FRB1(mock) gives an upper limit of $0.12\\,\\mathrm{eV}$, which decreases to $0.035\\,\\mathrm{eV}$ for CMB+FRB2(mock) with 10000 events. The latter is more stringent than the CMB+DESI limit, demonstrating the potential of large localized FRB samples to constrain neutrino mass. When the model is extended to $w_0w_a$CDM+$\\sum m_ν$, both the observed and mock samples yield upper limits of approximately $0.3$--$0.4\\,\\mathrm{eV}$, indicating that the assumed dark-energy model remains a dominant factor in these constraints. As localized FRB samples grow and the modeling of the individual DM contributions becomes more accurate, FRBs may provide further independent low-redshift information for constraining neutrino mass."},{"arxiv":"2611.20143","id":"","title":"HVP contributions to the muon anomalous magnetic moment in spacelike and timelike domains","authors":"A. V. Nesterenko","score":8.2,"section":"new","rank":32,"parts":[0.06,0.04,0.33,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2690106]] (coupling 0.02, 3 shared references). Closest network paper: [[1938335]] (coupling 0.11, 17 shared references).","abstract":"The hadronic vacuum polarization contributions to the muon anomalous magnetic moment $a^{\\text{HVP}}_μ$ in spacelike and timelike domains are recapped. The values of $a^{\\text{HVP}}_μ$ assessed within dispersively-improved perturbation theory are reported. The obtained results can be employed in the evaluations of $a^{\\text{HVP}}_μ$ in the framework of such methods as lattice studies, MUonE project, and others."},{"arxiv":"2611.17345","id":"3228654","title":"Composition-dependent ultralight dark matter detection with a tetrahedral superconducting gravity gradiometer","authors":"John J. Oh, Ho Jung Paik","score":5.8,"section":"cross","rank":33,"parts":[0.0,0.03,0.24,0.0,0.13],"note":"Closest of your papers: [[3130296]] (coupling 0.01, 1 shared references). Closest network paper: [[2051205]] (coupling 0.08, 4 shared references). Shared topics: dark matter.","abstract":"Tetrahedral superconducting gravity gradiometers designed as full-tensor gravitational-wave detectors, such as the ground-based mSOGRO design and the proposed lunar LANGO observatory, reconstruct the acceleration-gradient tensor from four test masses. We show that giving the four test masses two compositions in a $2+2$ arrangement adds a composition-dependent ultralight dark matter (ULDM) channel to that same tensor readout, with no separate dark-matter sensor and no dark-matter-specific readout. A coherently oscillating scalar accelerates each mass in proportion to its dilaton charge, and the tensor reconstruction leaves the charges only in a mean, rejected with the common mode, and a single vector $\\qv$ proportional to the charge contrast $Δ\\abaralpha_{AB}$ between the two materials. The response is the rank-one tensor $\\K_{\\ULDM}(t)=\\gv_φ(t)\\otimes\\qv$, whose amplitude is set by the halo, independent of $m_φ$. The axis of $\\qv$ is fixed in advance by the material assignment, so the response obeys the null condition $\\K_{\\ULDM}(\\mathbf{I}-\\Pq)=0$ at every instant, for any $\\gv_φ$ including a virialized field with a stochastic gradient---an exact tensor discriminator against gravitational-wave signals; for a single composition $\\qv=0$. With the gravitational-wave noise model, the coupling sensitivity for copper and lead test masses reaches $d_{\\hat m}-d_g\\simeq3.4\\times10^{-8}$ for the baseline instrument and $4.9\\times10^{-10}$ with upgraded accelerometers. The rank-one factorization and the null condition are summarized in a companion Letter; the present paper gives the derivations and the detector-level analysis."},{"arxiv":"2611.21413","id":"","title":"Non-Canonical Q-balls in Polyattractor Inflation Models","authors":"Kimberley Siret, Rhys Abercromby, Kit Lloyd-Stubbs, John McDonald","score":5.7,"section":"new","rank":34,"parts":[0.0,0.04,0.22,0.0,0.13],"note":"Closest of your papers: [[2663002]] (coupling 0.02, 1 shared references). Closest network paper: [[2797795]] (coupling 0.08, 3 shared references). Shared topics: dark matter.","abstract":"We show that Q-balls can exist in supergravity-based polyattractor inflation models that interpolate between $α$-attractor T-models and polynomial attractor models. We consider both the original polyattractor potential and a natural generalisation. We find that Q-balls solutions exist when the model deviates significantly from the T-model $α$-attractor, whereas in the T-model limit no Q-balls exist. These are non-canonical Q-balls due to the non-canonical kinetic term of the complex inflaton field. Such Q-balls could have significant cosmological consequences if they are produced at the end of inflation. In particular, if the global $\\mathrm{U}(1)$ symmetry of the supergravity-based polyattractor model is unbroken, the Q-balls can be absolutely stable and could account for dark matter."},{"arxiv":"2610.40749","id":"3220958","title":"Combinatorial Residual Network: a decay-chain-aware classifier without explicit jet assignment","authors":"John Alison, Patrick Bryant, Alejandro Gomez Espinosa, Christian Guinto-Brody, Aniket Khanal, Chuyuan Liu, Sindhu Murthy, Guanglei Zhao","score":5.7,"section":"replacement","rank":35,"parts":[0.0,0.11,0.17,0.0,0.0],"note":"Closest of your papers: [[1455793]] (coupling 0.04, 4 shared references). Closest network paper: [[2621240]] (coupling 0.06, 5 shared references).","abstract":"Final states with several jets from the decays of heavy particles pose a combinatorial problem: the jets must be assigned, at least implicitly, to their parent particles. The Combinatorial Residual Network (CoReNet) is a classifier that encodes the assumed decay chain in its architecture, building the event representation level by level along the decay hierarchy and combining all jet assignment hypotheses, evaluated with shared weights, with learned weights. The exchange symmetries of the decay are built in, the network size does not depend on the number of hypotheses, and no generator-level jet assignments are used in training. Developed for the $b\\bar{b}b\\bar{b}$ final state and used in several CMS searches, CoReNet with 1508 parameters performs well above kinematic baselines on fast-simulated Higgs boson pair production against QCD multijet events and trains in minutes on a single GPU, and its hypothesis weights select the truth-matched jet pairing in most signal events in which it is defined. Since only the encoded decay chain is specific to the final state, we test the construction on $HH \\to b\\bar{b}W^+W^-$ against semileptonic $t\\bar{t}$, where encoding the decay chain of the background as well improves the classification at a cost of about $10^{3}$ parameters. In both final states, CoReNet performs comparably to a state-of-the-art transformer-based network more than two orders of magnitude larger. The implementation is publicly available at https://github.com/cms-cmu/CoReNet."},{"arxiv":"2607.22358","id":"3183123","title":"First Lattice Calculation of Structure-Dependent Radiative Corrections to Lepton-Flavor-Universality Ratios in Leptonic Decays","authors":"Peter Boyle, Norman H. Christ, Xu Feng, Taku Izubuchi, Luchang Jin, Christopher T. Sachrajda, Xin-Yu Tuo","score":5.6,"section":"replacement","rank":36,"parts":[0.06,0.02,0.2,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[3184726]] (coupling 0.01, 1 shared references). Closest network paper: [[3081701]] (coupling 0.07, 4 shared references).","abstract":"The ratio of electronic to muonic leptonic decay widths, $R_{e/μ}$, for the light mesons $π$ and $K$, provides a clean test of lepton flavor universality (LFU) and a sensitive probe of physics beyond the Standard Model. Its Standard-Model prediction is exceptionally precise, with the leading uncertainty associated with the structure-dependent (SD) radiative correction of $O(0.1\\%)$. As experiments such as PIONEER and NA62 aim for unprecedented precision, this SD correction has become an essential ingredient in precision experiment--theory comparisons. We present the first lattice QCD$+$QED calculation of this SD correction at the physical pion mass and in the continuum limit. We employ the infinite-volume reconstruction (IVR) method with Coulomb-gauge photons, significantly reducing both statistical errors and finite-volume effects. We obtain the Standard-Model predictions, $R_{e/μ}=1.23516(10)\\times10^{-4}$ for $π$ and $R_{e/μ}=2.47661(31)\\times10^{-5}$ for $K$. Our results reduce the hadronic uncertainty in $R_{e/μ}$, provide the most precise Standard-Model predictions to date, and establish first-principles benchmarks for future high-precision tests of LFU."},{"arxiv":"2609.10382","id":"3201617","title":"Searching for New Physics with Reinforcement Learning","authors":"Jacky Kumar, Marianne Bouchard, David London","score":5.2,"section":"replacement","rank":37,"parts":[0.06,0.04,0.14,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1421624]] (coupling 0.01, 1 shared references). Closest network paper: [[2163299]] (coupling 0.05, 3 shared references).","abstract":"Finding new physics (NP) is the fundamental problem in particle physics today. Studying anomalies, i.e., measurements of low-energy observables whose values disagree with the predictions of the Standard Model (SM), is a powerful search strategy. The SM Effective Field Theory (SMEFT) provides a general model-independent framework for parametrizing NP; given some anomalies, it is natural to try to find the SMEFT operator(s) that can explain them. This is a challenging task because (i) the number of SMEFT operators is enormous, and (ii) at loop level there are very complicated correlations among the operators. Analyses by humans typically rely on phenomenological intuition to decide which operators are relevant. This is often biased and does not explore the complete SMEFT operator space. Interestingly, reinforcement learning (RL) techniques excel at tasks that require decision making to achieve their goals. In this paper, we introduce an RL method that can be used to find the SMEFT operators that explain any anomalies. Using some explicit examples, we demonstrate that our RL method can be used to efficiently search for NP at the level of SMEFT. The RL training can be performed efficiently using standard CPU resources, without requiring specialized computing hardware."},{"arxiv":"2607.07777","id":"3178756","title":"The Status of Single Scalar Field Dark Energy","authors":"Carlos García-García, Pedro G. Ferreira, William J. Wolf","score":5.2,"section":"replacement","rank":38,"parts":[0.0,0.04,0.26,0.0,0.0],"note":"Closest of your papers: [[2751074]] (coupling 0.01, 3 shared references). Closest network paper: [[3223723]] (coupling 0.09, 39 shared references).","abstract":"We present an assessment of the current observational status of single scalar field models of dark energy. Motivated by recent cosmological measurements -- including baryon acoustic oscillations, Type Ia supernovae, and CMB data -- we examine whether a dynamical scalar field offers a viable explanation for the accelerated expansion of the Universe. Working within an effective field theory (EFT) framework, we argue that cosmological observations are fundamentally limited and can at most constrain a small number of parameters that govern scalar field dynamics. We show that quintessence remains only marginally distinguishable from a cosmological constant, $Λ$, and that more general EFT extensions exhibit modest statistical preference, though such evidence is sensitive to data set selection and prior assumptions. These extended models generically predict fifth forces and modifications to the growth of structure, raising challenges from astrophysical constraints. We compare their predictions with current growth rate measurements, Integrated Sachs-Wolfe (ISW) effect and Solar System constraints. We emphasize that viable screening mechanisms remain theoretically non-trivial and observationally testable. On the other hand, we find that current ISW and growth data remain largely in agreement. Looking ahead to Stage IV surveys we forecast improvements in constraints on the dark energy behaviour; although there will be some tightening of bounds, we argue that the problem of underdetermination will persist. We conclude that while single scalar field dark energy remains a natural and flexible framework, its ultimate viability will hinge on improved low-redshift growth measurements and a clearer understanding of gravitational screening."},{"arxiv":"2503.06249","id":"2898371","title":"Higgs production from anomalous gluon dynamics","authors":"Ulrich Haisch","score":5.0,"section":"replacement","rank":39,"parts":[0.06,0.04,0.12,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[3094526]] (coupling 0.01, 3 shared references). Closest network paper: [[2778553]] (coupling 0.04, 8 shared references).","abstract":"We present a two-loop analysis of the contributions to Higgs production via gluon-gluon fusion arising from the triple-gluon operator in the Standard Model effective field theory (SMEFT). Our discussion covers all aspects of renormalization group (RG) improved perturbation theory, including matching and running within the SMEFT. This study can therefore be seen as a blueprint of the intricacies and subtleties that arise in RG improved SMEFT calculations for collider processes beyond the leading order."},{"arxiv":"2606.30768","id":"3175004","title":"Toponium effects on quantum steering and Bell nonlocality of top quarks","authors":"J. A. Aguilar-Saavedra, S. Rodríguez-Benítez","score":5.0,"section":"replacement","rank":40,"parts":[0.0,0.11,0.12,0.0,0.0],"note":"Closest of your papers: [[1455793]] (coupling 0.04, 4 shared references). Closest network paper: [[1674879]] (coupling 0.04, 3 shared references).","abstract":"We investigate quantum steering and Bell nonlocality in top-quark pair production at the LHC near threshold. The toponium contribution strengthens the spin-singlet component and substantially enhances the entanglement between the two quark spins. With current LHC data, quantum steering appears to be observable at the $5σ$ level provided systematic uncertainties are at 5\\% or below. For Bell nonlocality, the statistical significance can also be high close to threshold, but systematics are expected to limit a possible measurement to around $2σ$ sensitivity."},{"arxiv":"2611.20386","id":"","title":"Lean-Verified No-Go Theorems for $R$-Symmetries and Modular Symmetries in 4D GUTs","authors":"Mu-Chun Chen, Xiang-Gan Liu, Michael Ratz, Alexander Stewart","score":4.8,"section":"new","rank":41,"parts":[0.0,0.07,0.18,0.0,0.0],"note":"Closest of your papers: [[1655573]] (coupling 0.02, 1 shared references). Closest network paper: [[3154793]] (coupling 0.06, 5 shared references).","abstract":"$R$-symmetries are instrumental in supersymmetric model building. However, a no-go theorem restricts us from using them in a large class of four-dimensional (4D) grand unified theories (GUTs). Specifically, it has been shown that a supersymmetric 4D GUT based on SU(5), with finitely many chiral multiplets, cannot be broken spontaneously to the exact minimal supersymmetric standard model (MSSM) while preserving a discrete $\\mathbb{Z}_M^R$, with $M \\geq 3$, or continuous U(1) $R$-symmetry. We use Lean 4 to formalize this proof. In the process, we identify and close a gap in the general case of the published argument. Further, we discuss the implications for GUT models with modular symmetries. We point out that modular symmetries are inevitably $R$-symmetries in a supersymmetric framework that also describes gravity. At certain critical points in moduli space, discrete $R$-symmetries are linearly realized. In the context of 4D GUTs, the no-go theorem then implies that exotic states become massless at these points, provided the GUT-breaking vacuum preserves these symmetries. In the vicinity of these critical points, these exotics are parametrically light, which may spoil gauge coupling unification."},{"arxiv":"2505.14332","id":"2867379","title":"Left-Chiral Neutrino Secret Interactions Probed by High-Energy Neutrinos Surviving the Cosmic Neutrino Background","authors":"Maria Petropavlova","score":4.6,"section":"replacement","rank":42,"parts":[0.0,0.0,0.1,0.0,0.32],"note":"Closest network paper: [[2736974]] (coupling 0.03, 3 shared references). Shared topics: neutrino mass, early universe.","abstract":"This work explores the potential of astrophysical neutrinos to probe neutrino secret interactions ($ν$SI) through their propagation in the Cosmic Neutrino Background (C$ν$B). Using representative energies and distances for SN 1987A, NGC 1068, TXS 0506+056 and PKS 0735+178, together with distance hypotheses for KM3-230213A, we derive single-event survival benchmarks for the mediator mass and coupling. We focus on scenarios that do not populate right-handed neutrino states in the early Universe and therefore avoid the strongest cosmological constraints: a massive spin-one mediator with a left-chiral coupling to Dirac neutrinos and a scalar mediator coupled to Majorana neutrinos. We also consider scalar exchange with Dirac neutrinos, a common benchmark in propagation studies, and demonstrate that on the standard relic background its resonance is helicity suppressed, with a strength controlled by the relic-neutrino mass. The analysis covers a broad range of mediator masses, including the light-mediator, resonant and heavy-mediator regions, and accounts for the effects of the relic-neutrino masses and of cosmological evolution along the propagation path. We illustrate the main features of each scenario in a common-mass approximation, with analytic expressions for the non-relativistic and ultra-relativistic relic background, and then extend the analysis to realistic non-degenerate neutrino mass spectra. Owing to its energy, the KM3-230213A event shifts the resonant sensitivity to heavier mediators, while distant-source hypotheses increase the propagation sensitivity in this mass range."},{"arxiv":"2611.21439","id":"","title":"A Reinforcement Learning Method to Navigate SMEFT Operator Space","authors":"Jacky Kumar","score":4.4,"section":"cross","rank":43,"parts":[0.0,0.06,0.17,0.0,0.0],"note":"Closest of your papers: [[2751074]] (coupling 0.03, 1 shared references). Closest network paper: [[3073459]] (coupling 0.06, 5 shared references).","abstract":"In particle physics, discrepancies between experimental measurements and Standard Model (SM) predictions are commonly interpreted within new theoretical models. In this context, the Standard Model Effective Field Theory (SMEFT) provides a general framework encompassing a broad class of models. However, exploring the enormous space of possible SMEFT operators rapidly becomes a challenging combinatorial problem: many operators can contribute simultaneously to different observables, their effects are correlated, and distinct operator combinations can provide comparably good descriptions of the data. In this work, we formulate the exploration of the SMEFT operator space as a sequential decision-making problem using reinforcement learning (RL). Our RL agent employs a lightweight actor-critic architecture with approximately 40K trainable parameters in total. Rather than searching for a single best-fit theory, our method is designed to discover a diverse set of high-quality theory hypotheses. We test the method in a complex phenomenological environment comprising 132 observables across several sectors of particle physics, including 24 measurements that deviate from their SM predictions by more than $1.5σ$. We show that the learned RL policy efficiently constructs multi-operator theories that substantially improve the global fit. Comparisons with independent random-subset and random-sequential searches demonstrate the ability of the RL policy to navigate this large combinatorial space. Our results establish RL as a systematic framework for exploring diverse patterns of new physics (NP) interactions within SMEFT."},{"arxiv":"2611.19519","id":"3229519","title":"Confinement--Higgs Complementarity Viewed through Relative Quantum Reference Frames","authors":"Kei-Ichi Kondo","score":4.3,"section":"cross","rank":44,"parts":[0.0,0.06,0.16,0.0,0.0],"note":"Closest of your papers: [[3094526]] (coupling 0.02, 3 shared references). Closest network paper: [[2183252]] (coupling 0.06, 5 shared references).","abstract":"We formulate confinement--Higgs complementarity in terms of the relative orientation between two independently constructed quantum reference frames (QRFs): one derived from the gauge field and the other from the scalar field. Exact continuum and lattice identities give a relational interpretation of the scalar--color observables used in recent gauge-fixing-free $SU(2)$ simulations. In particular, we provide a QRF interpretation of the additional gauge-invariant nonlocal separation line obtained from the Cho--Duan--Ge (CDG) reduction reported in lattice simulations of the radially fixed fundamental $SU(2)$ gauge--scalar model. We explain why such a candidate nonlocal boundary is compatible with Fradkin--Shenker continuity and Osterwalder--Seiler analyticity for the appropriate class of local gauge-invariant observables. Separately, we show that a Wilson-rooted control observable admits an exact results at zero plaquette coupling and that it does not cause such a nonlocal separation line."},{"arxiv":"2606.26245","id":"3172954","title":"Axial-Vector Lattice Benchmarks Reveal a Common Medium Response of Meson Screening in Hot QCD","authors":"Jie Ren, Chen Chen, Fei Gao, Si-xue Qin","score":4.1,"section":"replacement","rank":45,"parts":[0.06,0.03,0.07,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2787890]] (coupling 0.01, 1 shared references). Closest network paper: [[2706040]] (coupling 0.03, 2 shared references).","abstract":"Meson screening masses trace the evolution of hadronic correlations toward quasi-free quark--antiquark screening in hot QCD. Combining lattice QCD (LQCD) benchmarks with a symmetry-preserving Dyson--Schwinger baseline, we identify a flavor-dependent axial-vector quasi-free onset, $x^\\ast_{fg}=T^\\ast_{fg}/T_c$: an operational matching scale based on the proximity of the axial-vector screening mass to its free-field reference, where $T_c$ is the pseudocritical temperature. On the finite interval $1\\le T/T_c\\lesssim x^\\ast_{fg}$, independent light/strange and charm-containing lattice benchmarks are organized by a common medium-response function with one flavor-sector parameter. One axial-vector point fixes this parameter; the remaining axial-vector data test the temperature dependence of the response, and vector screening masses validate it without vector input. A reduced-mass interpolation then yields lattice-testable predictions for quasi-free onset scales and vector and axial-vector screening spectra in light--charm and open-bottom sectors."},{"arxiv":"2606.06478","id":"3165459","title":"Short Gravitational-Wave Transients as Probes of Cosmic Domain Walls","authors":"Tore Boybeyi, Doga Veske, David Maibach","score":4.0,"section":"replacement","rank":46,"parts":[0.0,0.04,0.11,0.0,0.13],"note":"Closest of your papers: [[2690106]] (coupling 0.01, 1 shared references). Closest network paper: [[2828434]] (coupling 0.04, 4 shared references). Shared topics: dark matter.","abstract":"GW190521 and GW231123 have been reported as short-duration gravitational-wave transients consistent with very massive binary black hole (BBH) coalescences whose inferred parameters, i.e., exceptionally high total masses and spin magnitudes, challenge standard isolated binary stellar evolution. We test a topological dark matter (TDM) interpretation invoking cosmic domain walls by fitting a physically motivated domain wall template to the LIGO Hanford and Livingston strain data. The BBH hypothesis is individually favored, with $\\log_{10}\\mathcal{B}_{\\rm BBH/TDM}=12.2$ and $11.3$ for GW231123 and GW190521, respectively. However, these values are lower than those typically recovered from matched maximum a posteriori BBH waveforms injected into nearby noise segments. We further perform, for the first time, a joint fit in which domain wall signals from a single underlying scalar field are constrained simultaneously by both events. Although not favored over BBH signals, we find the two events are consistent with a common scalar field, with shared TDM parameters agreeing across independent noise realizations and sky locations. We further find that injected TDM transients are systematically recovered under the BBH hypothesis with large spin parameters, revealing a morphological degeneracy that could mask genuine domain wall signals. This analysis demonstrates that multi-event parameter consistency tests provide a new discriminant for domain wall dark matter searches in upcoming observing runs."},{"arxiv":"2611.19789","id":"","title":"Charm quark energy loss fluctuations in clumpy color string medium","authors":"Daria Prokhorova, Shuzhe Shi, Evgeny Andronov","score":3.9,"section":"new","rank":47,"parts":[0.0,0.01,0.22,0.0,0.02],"note":"Closest of your papers: [[3146383]] (coupling 0.01, 1 shared references). Closest network paper: [[2164775]] (coupling 0.08, 5 shared references).","abstract":"We simulate charm quark propagation through an ensemble of color flux tubes formed between receding color charges in proton-proton collisions. Under the assumption of sharp string boundaries and a localized nature of the overlap regions, high flux tube densities lead to the formation of string clusters. We convert the local energy density of the superposed color field into an effective temperature of an ideal gluon gas and study the dependence of charm energy loss on its spatial inhomogeneities. By comparing different energy-density extraction prescriptions, we show that both elastic and inelastic momentum damping mechanisms are sensitive to the medium properties. However, the collisional channel is an order of magnitude smaller in absolute terms (up to $\\sim0.15$~GeV) compared to the radiative loss (up to $\\sim1.5$~GeV). Overall, the results demonstrate that the spatial overlap of individual strings generates a complex local energy density pattern, which predominantly governs the medium-induced quenching of charm quarks."},{"arxiv":"2611.21279","id":"","title":"Pulsar Timing Correlations Induced by Stochastic Spin-2 Ultralight Dark Matter","authors":"Hao-Xuan Shi, Yu-Mei Wu, Chang Liu","score":3.6,"section":"new","rank":48,"parts":[0.0,0.02,0.11,0.0,0.13],"note":"Closest of your papers: [[1990302]] (coupling 0.01, 2 shared references). Closest network paper: [[2818719]] (coupling 0.04, 5 shared references). Shared topics: dark matter.","abstract":"Ultralight dark matter (ULDM) can generate time-dependent gravitational perturbations, providing a potential signal for pulsar timing arrays (PTAs). In Galactic halos, the velocity dispersion of ULDM gives rise to finite spatial coherence, which influences the correlations between pulsar timing signals. In this work, we derive the timing-residual cross-correlations induced by rapid metric oscillations of spin-2 ULDM, allowing for general polarization statistics. Under equipartition among the five polarization modes, the intrinsic angular kernel contains monopole and quadrupole components and exhibits an angular profile closely resembling that of spin-1 ULDM, suggesting a potential degeneracy between the two ULDM candidates in PTA observations."},{"arxiv":"2605.26658","id":"3160215","title":"Isospin-breaking effects on the threshold cusp structures in $ΛN$-$ΣN$ scattering","authors":"Katsuyoshi Sone, Yudai Ichikawa, Tetsuo Hyodo","score":3.5,"section":"replacement","rank":49,"parts":[0.06,0.01,0.07,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[3184726]] (coupling 0.00, 1 shared references). Closest network paper: [[3091093]] (coupling 0.02, 2 shared references).","abstract":"We discuss the isospin-breaking effects on threshold cusp structures in multichannel scattering near two-body thresholds. In hadronic systems with isospin symmetry, two or more nearly degenerate thresholds can appear, and their small splitting due to isospin breaking can generate multiple cusp structures in a narrow energy region. In this paper, using the $K$-matrix representation, we derive a general expression for the scattering amplitude near the thresholds and show that the cusp structures can be classified by the signs of the slopes of the cross section above and below threshold. We also show that additional restrictions appear in two- or three-channel systems and in the Flatté amplitude. For three-channel scattering with two nearby thresholds, we clarify how the two cusp structures are related when the threshold splitting is small and how they merge into a single cusp in the degenerate limit. Finally, we discuss the cusp structures in the $Λp$ elastic cross section in the coupled $ΛN$-$ΣN$ system with charge $Q=+1$. We show that, when isospin breaking is small, the two cusp structures are constrained by isospin symmetry. We also perform quantitative calculations using both simplified examples and realistic input based on N$^2$LO chiral effective field theory, and find that isospin breaking can significantly modify the relative sharpness of the cusps and may even chang }
function showTip(ev,n){const b=document.getElementById('chart').getBoundingClientRect();tip.hidden=false;tip.textContent=`${auth(n)} (${n.year}) — ${plain(n.title)}`+(isNew(n)?` · score ${n.score}`:'');
  let L=ev.clientX-b.left+12;if(L>b.width-290)L=ev.clientX-b.left-290;tip.style.left=Math.max(4,L)+'px';tip.style.top=(ev.clientY-b.top+12)+'px'}
function paint(){if(!G)return;const f=hover||sel,on=new Set();if(f){on.add(f.i);f.out.forEach(i=>on.add(i));f.inn.forEach(i=>on.add(i))}
  svg.classed('dim',!!f);
  G.selectAll('path.edge').attr('class',l=>'edge '+l.k+(!f?'':l.s===f.i?' hot out':l.t===f.i?' hot in':''));G.selectAll('path.edge.hot').raise();
  G.selectAll('circle').classed('on',s=>on.has(s.n.i)).classed('sel',s=>sel&&s.n.i===sel.i).classed('match',s=>query&&`${s.n.first} ${s.n.title} ${s.n.arxiv} ${s.n.authors||''}`.toLowerCase().includes(query));
  G.selectAll('text.nlabel').classed('on',l=>on.has(l.s.n.i))}
function panel(){const p=document.getElementById('panel'),n=sel;
  if(!n){p.innerHTML='<p>Select a paper in the network.</p>';return}
  const links=`<div class="links">${n.id?`<a href="https://inspirehep.net/literature/${n.id}" target="_blank" rel="noopener">INSPIRE</a>`:''}${n.arxiv?`<a href="https://arxiv.org/abs/${esc(n.arxiv)}" target="_blank" rel="noopener">arXiv</a>`:''}</div>`;
  if(isNew(n)) p.innerHTML=`<div class="role" style="color:${col(n)}">#${n.rank} · ${esc(SEC[n.section])} · score ${n.score.toFixed(1)}</div><h4>${esc(n.title)}</h4>
   <div class="meta">${esc(auth(n))} · arXiv:${esc(n.arxiv)}</div><p>${why(n.note)}</p><div class="links"><a href="#p${n.i}">Back to abstract</a></div>`;
  else p.innerHTML=`<div class="role" style="color:${col(n)}">${esc(ROLE[n.role])}</div><h4>${esc(n.title)}</h4>
   <div class="meta">${esc(auth(n))} · ${n.year}${n.arxiv?' · arXiv:'+esc(n.arxiv):''}</div>
   <div class="stats"><span>${n.cites.toLocaleString()} citations</span><span>${n.inn.filter(i=>isNew(N[i])).length} of the matches link here</span></div>${links}`;
  tex(p)}
function pick(n,scroll){sel=n;panel();paint();document.querySelectorAll('.paper').forEach(el=>el.classList.toggle('sel',el.id==='p'+n.i));if(scroll)document.getElementById('chart').scrollIntoView({behavior:'smooth',block:'nearest'})}
const present=new Set(N.map(n=>n.role));
document.getElementById('legend').innerHTML=['today','repl','seed','other'].filter(k=>present.has(k)).map(k=>`<span><i class="dot" style="background:var(--${k})"></i>${esc(ROLE[k])}</span>`).join('')+'<span style="color:var(--fg-3)">Listing papers: size ∝ score; others: size ∝ log(citations)</span>';
document.getElementById('q').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();paint()});
svg.on('click',ev=>{if(ev.target.tagName!=='circle'){sel=null;panel();paint()}});
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(draw,200)});
function nextList(){const X=RAW.next||[];if(!X.length)return;const box=document.getElementById('nextlist'),more=document.getElementById('more');
  more.hidden=false;more.querySelector('summary').firstChild.textContent=`The next ${X.length} papers by score `;
  const nmin=M.nextMin;
  document.getElementById('moresub').textContent=`below the threshold of ${M.threshold}${nmin!=null?`: every paper scoring ${nmin} or more, and at least ${M.nextCount} when available`:''}; not drawn in the network`;
  const cut=nmin!=null?X.findIndex(n=>n.score<nmin):-1;
  box.innerHTML=X.map((n,i)=>(i===cut?`<li class="divider">Below ${nmin}: weaker relation (most of these share no specific reference, coupling or topic with your work)</li>`:'')+`<li><div class="role" style="color:var(--${n.section==='replacement'?'repl':'today'})">#${n.rank} · ${esc(SEC[n.section])} · score ${n.score.toFixed(1)}</div>
    <div class="t">${esc(n.title)}</div><div class="authors">${authors(n.authors)} · arXiv:${esc(n.arxiv)}</div>
    ${n.note?`<p class="why">${why(n.note)}</p>`:''}
    <details class="abs"><summary>Abstract</summary><p class="abs">${esc(n.abstract)}</p></details>
    <div class="links">${n.id?`<a href="https://inspirehep.net/literature/${n.id}" target="_blank" rel="noopener">INSPIRE</a>`:''}<a href="https://arxiv.org/abs/${esc(n.arxiv)}" target="_blank" rel="noopener">arXiv</a><a href="https://arxiv.org/pdf/${esc(n.arxiv)}" target="_blank" rel="noopener">PDF</a></div></li>`).join('');
  more.addEventListener('toggle',()=>{if(more.open)tex(box)})}
const rtip=document.getElementById('reftip');let rcur=null;
function refShow(el){const r=REFS[el.dataset.ref];if(!r)return;rcur=el;rtip.textContent=`${auth(r)} (${r.year}) — ${plain(r.title)}`;rtip.hidden=false;
  const b=el.getBoundingClientRect(),t=rtip.getBoundingClientRect();let L=Math.min(Math.max(8,b.left),innerWidth-t.width-8),T=b.bottom+6;
  if(T+t.height>innerHeight-8)T=b.top-t.height-6;rtip.style.left=L+'px';rtip.style.top=T+'px'}
function refHide(){rtip.hidden=true;rcur=null}
document.addEventListener('pointerover',e=>{const el=e.target.closest('.ref');if(el&&e.pointerType==='mouse')refShow(el)});
document.addEventListener('pointerout',e=>{if(e.target.closest('.ref')&&e.pointerType==='mouse')refHide()});
document.addEventListener('click',e=>{const el=e.target.closest('.ref');if(el)refShow(el);else if(rcur)refHide()});
document.addEventListener('focusin',e=>{const el=e.target.closest('.ref');if(el)refShow(el)});
document.addEventListener('focusout',e=>{if(e.target.closest('.ref'))refHide()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')refHide()});
addEventListener('scroll',()=>{if(rcur)refHide()},{passive:true});
// the rest of the day's papers by score: only the title, linked to the arXiv record
function restList(){const X=RAW.rest||[];if(!X.length)return;const d=document.getElementById('rest'),box=document.getElementById('restlist');
  d.hidden=false;d.querySelector('summary').firstChild.textContent=`All other ${X.length} papers in this listing `;
  document.getElementById('restsub').textContent='by score, title only';
  box.innerHTML=X.map(n=>`<li><span class="sc">#${n.rank} · ${n.score.toFixed(1)}</span><a href="https://arxiv.org/abs/${esc(n.arxiv)}" target="_blank" rel="noopener">${esc(n.title)}</a></li>`).join('');
  d.addEventListener('toggle',()=>{if(d.open)tex(box)})}
list();nextList();restList();fold();draw();panel();
window.addEventListener('load',()=>{tex(document.getElementById('list'));tex(document.getElementById('panel'));fold();
  if(window.MathJax&&MathJax.startup&&MathJax.startup.promise)MathJax.startup.promise.then(()=>setTimeout(fold,300))});
addEventListener('resize',()=>{clearTimeout(window._ft);window._ft=setTimeout(fold,200)});
</script>
