<script>
const RAW = {"n":[{"id":"3161874","arxiv":"2605.27513","title":"Constraints on a Light Leptophilic Scalar from Dark-Sector Couplings","first":"Graziani","nauth":5,"year":2026,"cites":0,"role":"repl","note":"Co-authors of yours: Landini. Cites 1 network paper: [[2795517]]. Closest of your papers: [[2787890]] (coupling 0.11, 17 shared references). Closest network paper: [[3115042]] (coupling 0.26, 32 shared references). Shared topics: fermion dark matter, relic abundance, dark matter, dark matter particle.","score":49.3,"rank":1,"section":"replacement","parts":[0.45,0.34,0.73,0.5,0.75],"abstract":"We study a minimal framework where a Majorana fermion dark matter particle interacts with a light scalar mediator coupled mainly to electrons. We examine both freeze-out and freeze-in production to determine the regions of parameter space that yield the correct relic abundance with particular emphasis on a detailed comparison with results in the recent literature. The analysis includes cosmological and astrophysical constraints as well as laboratory bounds from electron-recoil experiments, fixed target searches, and precision measurements. The combined results identify a narrow but viable parameter region, favoring sub-GeV dark matter, and define clear targets for future experimental tests. This highlights the strong complementarity between direct-detection experiments and collider searches. We additionally investigate the mediator-mass region around 17 MeV, motivated by the hints reported by the ATOMKI experiment and the PADME collaboration, including couplings between the mediator and light quarks. Direct searches already constrain a large region of the parameter space, even when dark matter is produced via freeze-in, pointing again to sub-GeV dark matter.","authors":"Marco Graziani, Giacomo Landini, Federico Mescia, Claudio Toni, Ludovico Vittorio","nlinked":125,"nref":131,"src":"INSPIRE","html":true},{"id":"","arxiv":"2611.21278","title":"Mono-Z Signatures of Vector Dark Matter Detection at Future Electron-Positron Colliders: FCC-ee and ILC","first":"Ayazi","nauth":3,"year":2026,"cites":0,"role":"today","note":"Cites 4 network papers: [[3224074]], [[2843521]], [[2684223]], [[2795517]]. Closest of your papers: [[2794409]] (coupling 0.03, 4 shared references). Closest network paper: [[2842478]] (coupling 0.17, 15 shared references). Shared topics: dark matter.","score":43.2,"rank":2,"section":"new","parts":[0.91,0.09,0.49,0.0,0.13],"abstract":"We investigate the mono-$Z$ signature of a vector dark matter (VDM) model at future electron-positron colliders. In this model, a stable vector boson, arising from an extended $U(1)$ gauge symmetry, serves as a viable DM candidate that interacts with the Standard Model (SM) through a Higgs portal. We perform a detailed cut-based analysis for the mono-$Z$ channel at the FCC-ee (with $\\sqrt{s}=240$ and $365$ GeV) and the ILC (with $\\sqrt{s}=1$ TeV), considering both leptonic and hadronic decays of the $Z$ boson. Signal significances are evaluated for benchmark points using fast event simulation with MadGraph5, PYTHIA8, and Delphes3. Our results demonstrate that future $e^+e^-$ colliders provide excellent sensitivity to Higgs-portal VDM, with the ILC's beam polarization offering an additional handle to suppress SM backgrounds. This study highlights the potential of lepton colliders in probing DM interactions.","authors":"Seyed Yaser Ayazi, Saeid Paktinat Mehdiabadi, Rouzbeh Rouzbehi","nlinked":77,"nref":79,"src":"arXiv source","html":true},{"id":"3200309","arxiv":"2609.05291","title":"Inelastic from the Other Side: Xenon Excitation Signals in Light of the LZ High-Recoil Event","first":"Gu","nauth":4,"year":2026,"cites":0,"role":"repl","note":"Co-authors of yours: Xu. Cites 1 network paper: [[913031]]. Closest of your papers: [[3146383]] (coupling 0.02, 4 shared references). Closest network paper: [[3201080]] (coupling 0.29, 18 shared references). Shared topics: nuclear recoil, dark matter.","score":38.0,"rank":3,"section":"replacement","parts":[0.45,0.06,0.84,0.5,0.28],"abstract":"The LUX-ZEPLIN (LZ) experiment recently reported a single event consistent with a nuclear recoil of $E_{\\rm NR}\\sim248$~keV in an extended-energy search. We study the accompanying inelastic-xenon channel, $χ+Xe\\toχ+Xe^{*}$, as a complementary test of dark matter (DM) interpretations of such high-recoil events. Using the non-relativistic effective-field-theory (NREFT) framework, we compute the inelastic-xenon rates for representative scenarios including accelerated DM populations and inelastic dark matter. Their signal patterns in the S1--S2 plane are reconstructed. The nuclear de-excitation shifts these signals toward the electronic-recoil band, where they may overlap with clustered isotope backgrounds. We then propose a schematic, physics-motivated background model to estimate their detectability. For many benchmarks, the inelastic-xenon rates are $\\mathcal{O}(0.1)$ of the elastic rates or below, and the projected sensitivity remains weak even at $200~{\\rm tonne\\,yr}$ for the scenarios investigated. Our results provide additional inelastic-xenon signal predictions for various DM scenarios and motivate improved high-energy background modeling and detector calibration for future searches.","authors":"Guanhua Gu, Lingfeng Li, Shao-Song Tang, Yongheng Xu","nlinked":65,"nref":67,"src":"INSPIRE","html":true},{"id":"3216038","arxiv":"2610.11880","title":"Warm-Inflation: a software for first-principles integration of warm inflation power spectra","first":"Rogelj","nauth":1,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[3177342]]. Also cites widely used network papers: [[1783234]]. Closest of your papers: [[2663002]] (coupling 0.04, 8 shared references). Closest network paper: [[3177342]] (coupling 0.20, 32 shared references). Shared topics: during reheating.","score":34.7,"rank":4,"section":"replacement","parts":[0.48,0.13,0.56,0.0,0.55],"abstract":"As part of a PhD thesis entitled `Scalar perturbations in warm inflation and during reheating' we present a software for computing warm inflation observables. In particular, our Mathematica implementation computes the power spectrum, spectral tilt, and tensor-to-scalar ratio for a given momentum scale. Compared with other implementations, we start in a Bunch-Davies state deep inside the horizon, ideally at a time when thermal noise is exponentially suppressed. We integrate gauge-invariant equations for three curvature perturbations across horizon exit. We continue deep enough outside of horizon so that all curvature perturbations agree. Results are illustrated for Standard Model embedded warm inflation, and we also provide notebooks for several other popular potentials and friction coefficients. The theoretical foundations for the code can be found in the main part of the thesis or in earlier papers [1,2]. Specifically, part II derives gauge-invariant, model-agnostic evolution equations, as well as the noise autocorrelator interpolating between quantum and classical domains. Part III presents the general ideas behind the numerical implementation, while part IV presents selected results. The code is described, line-by-line, in Appendix A. The published PhD thesis is available at https://doi.org/10.48620/101166 while the notebooks can be downloaded from https://github.com/alicarogeljblackhole/Warm-Inflation.","authors":"Alica Rogelj","nlinked":103,"nref":108,"src":"INSPIRE","html":true},{"id":"3168985","arxiv":"2606.17044","title":"Fermi-eROSITA cross-correlations suggest annihilation lines of $\\sim70$ GeV WIMPs","first":"Keshet","nauth":1,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[1304242]]. Also cites widely used network papers: [[2817040]], [[1518747]]. Closest of your papers: [[1693823]] (coupling 0.05, 8 shared references). Closest network paper: [[2795517]] (coupling 0.06, 60 shared references). Shared topics: interacting massive particle, weakly interacting massive particle, dark matter.","score":29.5,"rank":5,"section":"replacement","parts":[0.51,0.14,0.19,0.0,0.46],"abstract":"The deep potential wells of galaxy clusters provide some of the strongest constraints on the velocity-dependent ($p$-wave) annihilation of weakly interacting massive particle (WIMP) dark matter. Cross-correlating high-latitude Fermi-LAT 16.3-year data with the western Galactic hemisphere eROSITA map facilitates high-sensitivity tests. A blind composite matched-filter scan of the cross-correlated spectrum for the $χχ\\toγγ$, $γZ$, and $γh$ annihilation-line triad of a single WIMP $χ$ finds $m_χc^2\\simeq71.9$ and $67.5$ GeV (observer-frame) triads, each with a local $Z$-score $\\sim3$ and a (henceforth global) $1.7$-$2.1σ$ (trial-corrected), insensitive to details of detrending, sky masks, and filters. The leading nonad (equidistant three triads) corresponds to $66.4$ and $71.9$ GeV cross-annihilating WIMPs ($2.5σ$). The leading $\\sim72$ GeV triad coincides with the mass implied by interpreting the reported $\\sim43.2$ GeV $γ$-ray line in three nearby clusters as its $γZ$ channel. At this externally fixed mass, the triad reaches $3.0σ$ alone, and $5.1σ$ when combined with the reported line ($3.8σ$ under alternative assumptions; similar values for the nonad). This triad, absent from the ambient (X-ray-uncorrelated) spectrum, presents in different Galactic sectors, strengthens under cosmological (positive) but not negative redshift broadening $Δz$, and peaks at $Δz\\simeq 0.05$, consistent with galaxy clusters; its two non-$43$ GeV channels reach $2.4σ$ by themselves. Measured (not loss-corrected) intrinsic cross sections are a few $10^{-19}$ cm$^3$ s$^{-1}$ for WIMPs tracing the X-ray gas.","authors":"Uri Keshet","nlinked":117,"nref":133,"src":"INSPIRE","html":true},{"id":"3228059","arxiv":"2611.16191","title":"Connecting Electroweak Fine-Tuning, Tens-of-GeV Dark Matter, and Exotic Higgs Decays in the GNMSSM","first":"Heng","nauth":3,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[2771408]]. Also cites widely used network papers: [[1518747]]. Closest of your papers: [[1455793]] (coupling 0.02, 2 shared references). Closest network paper: [[2744388]] (coupling 0.06, 13 shared references). Shared topics: direct detection, dark matter candidate, dark matter.","score":26.0,"rank":6,"section":"replacement","parts":[0.48,0.06,0.18,0.0,0.46],"abstract":"In the general next-to-minimal supersymmetric standard model (GNMSSM), we connect electroweak fine-tuning, a singlino dark matter candidate with mass around tens of GeV, and Exotic Higgs Decays, identifying a natural region characterized by the mass hierarchy $m_{\\tilde{S}}<m_{\\tilde{B}}<m_{\\tilde{H}}$ and $μ_{\\rm tot}\\in [200, 500]$ GeV. For fine-tuning measure $Δ\\leq 40$, the branching ratio $\\mathrm{Br}(h\\to a_sa_s)$ falls in the range 7\\%$-$25\\%, with the pseudoscalar mass $m_{a_s}$ lying mostly between 10 and 20 GeV. This region splits into two viable scenarios consistent with LZ 2024 direct detection: one where the lightest CP-even Higgs $h_1$ is SM-like ($h_1$ case), and another where the second-lightest $h_2$ is SM-like ($h_2$ case). LHC searches for $h\\to a_sa_s \\to b\\bar{b}τ^+τ^-$ exclude 12\\% (10\\%) of samples with 12 GeV $\\leq m_{a_s} \\leq$ 15.5 GeV in the $h_1$ ($h_2$) case, while a substantial fraction remains accessible at the HL-LHC in the $h_2$ case. Our analysis unifies naturalness, dark matter, and observable exotic Higgs decays, yielding concrete targets for future experiments.","authors":"Zhaoxia Heng, Fei Li, Haijing Zhou","nlinked":61,"nref":61,"src":"INSPIRE","html":true},{"id":"","arxiv":"2611.21271","title":"Soft momentum expansion about the Stokes topological limit of Bogoliubov coefficients","first":"Chung","nauth":3,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[2737356]]. Closest of your papers: [[2039411]] (coupling 0.01, 1 shared references). Closest network paper: [[2790912]] (coupling 0.15, 9 shared references). Shared topics: discrete symmetry.","score":25.5,"rank":7,"section":"cross","parts":[0.45,0.03,0.44,0.0,0.22],"abstract":"It is known that particle production in time-dependent cosmological backgrounds can be computed using the Stokes phenomena occurring in Bogoliubov transformations with an analytically continued time coordinate. We analytically compute the soft momentum expansion of the particle production amplitude about the Stokes topological limit that was recently discovered in this context. The computational technique relies on an exponentially improved asymptotic expansion that involves automorphisms in the space of functions defined partly by the angular step function intrinsic to the Stokes topological sectors. We combine this with special discrete symmetries tied to the time dependence of the dispersion relation $ω_k^2(z) = C(k) + A z^n$ for even $n$ to explicitly compute the leading momentum dependence of the amplitude which is nonperturbative in $A$. We also use this result to give a semi-analytic estimate of the number density of particles in this class of scenarios.","authors":"Daniel J. H. Chung, Nidhi Sudhir, Junqi Zhang","nlinked":25,"nref":38,"src":"arXiv source","html":true},{"id":"","arxiv":"2611.20938","title":"A consistent (3D) EFT expansion of the bubble nucleation rate. Part I: scalar theories","first":"Gil","nauth":2,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[2706040]]. Closest of your papers: [[2751074]] (coupling 0.02, 1 shared references). Closest network paper: [[2706040]] (coupling 0.16, 14 shared references).","score":24.6,"rank":8,"section":"new","parts":[0.45,0.06,0.47,0.0,0.0],"abstract":"Precise predictions of bubble nucleation are essential for connecting cosmological phase transitions to their potential observational signatures. In this first paper of a two-part series, we develop a general, fully perturbative framework for incorporating higher-dimensional operators (HDOs) into nucleation calculations in scalar high-temperature effective field theories. Our approach consistently includes their effects on the bounce and the fluctuations around it, including interactions with higher derivatives. We prove that the resulting statistical rate is invariant under field redefinitions, and establish sufficient conditions for the existence of the perturbative bounce solution in the presence of HDOs. We illustrate the framework by applying it to a model containing a scalar and a fermion, where we find modest HDO corrections in its regime of moderately strong transitions. We thus extend the systematic study of HDO effects beyond critical thermodynamics and provide a controlled method for determining their impact on bubble nucleation.","authors":"Luis Gil, Javier López Miras","nlinked":81,"nref":85,"src":"arXiv source","html":true},{"id":"","arxiv":"2611.20919","title":"Cosmological Collider Signals from Fermion Bubble Loops with a Chemical Potential","first":"Han","nauth":4,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[2737356]]. Closest of your papers: [[3184726]] (coupling 0.05, 7 shared references). Closest network paper: [[2737356]] (coupling 0.08, 19 shared references).","score":23.3,"rank":9,"section":"new","parts":[0.45,0.14,0.22,0.0,0.0],"abstract":"We present the first systematic analytical calculation of the local and nonlocal cosmological collider (CC) signals generated by massive fermion bubble loops in the presence of an effective chemical potential during inflation. Working in the de Sitter approximation, we investigate the four-point correlator of inflaton perturbations in the single-squeezed limit. By combining CC cutting rules, late-time expansions, and partial Mellin-Barnes (MB) techniques, we derive analytical expressions for both local and nonlocal signals. In particular, we identify two distinct contributions to the local signal, arising from spectrum and integer poles and from ultraviolet poles of the loop-momentum integral. We further investigate the three-point limit, where the separately extracted local and nonlocal contributions develop apparent folded singularities. By reorganizing the MB representation, we demonstrate that these singularities cancel in the complete signal and obtain a convergent double-MB integral suitable for numerical evaluation. Independent calculations using complementary MB representations provide nontrivial consistency checks of our results. We find that the chemical potential can significantly enhance the oscillatory signal while increasing its logarithmic oscillation frequency. Our analytical results provide a foundation for further studies of chemical-potential-enhanced fermionic CC signals, including fermion triangle loops.","authors":"Chengcheng Han, Zhanhong Lei, Zhehan Qin, Wuzhou Yin","nlinked":106,"nref":110,"src":"arXiv source","html":true},{"id":"3229395","arxiv":"2611.18794","title":"Nonperturbative lattice simulation of the nucleation rate in thermal first-order phase transitions","first":"Zhou","nauth":2,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[2657746]]. Closest of your papers: [[2787890]] (coupling 0.02, 4 shared references). Closest network paper: [[2706040]] (coupling 0.14, 12 shared references).","score":23.3,"rank":10,"section":"cross","parts":[0.45,0.05,0.39,0.0,0.0],"abstract":"We present a nonperturbative lattice study of vacuum decay through bubble nucleation in a three-dimensional real scalar field theory at finite temperature. The vacuum decay rate is computed by combining an expanded-ensemble multicanonical hybrid Monte Carlo approach, which samples the critical bubble configurations, with real-time Langevin dynamics, which follows the subsequent bubble evolution. We extrapolate the nucleation rate to the continuum limit and compare it with the corresponding one-loop perturbative prediction, finding a discrepancy of about \\(8\\%\\).","authors":"Jing Zhou, Ligong Bian","nlinked":83,"nref":90,"src":"INSPIRE","html":true},{"id":"3219126","arxiv":"2610.35818","title":"Holographic Approaches to Hadron Structure","first":"Cappiello","nauth":3,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[3193100]]. Also cites widely used network papers: [[2817040]]. Closest of your papers: [[636564]] (coupling 0.01, 2 shared references). Closest network paper: [[2858283]] (coupling 0.03, 5 shared references). Shared topics: minimal model.","score":21.5,"rank":11,"section":"replacement","parts":[0.48,0.04,0.09,0.0,0.21],"abstract":"We give an introduction to and an overview of holographic approaches to QCD and hadron structure. After an introduction to the string-theoretic foundations of holographic QCD, we review the predictions of top-down and bottom-up models for the phenomenology of mesons, baryons, and glueballs. We focus on the top-down model following from probe flavor branes in the Witten model of low-energy Yang-Mills theory and, in the more phenomenological approach of bottom-up models, mostly on minimal models based on five-dimensional anti-de Sitter space, which also implement global symmetries and their anomalies consistently, but allow the high-energy behavior to better match real QCD.","authors":"Luigi Cappiello, Anton Rebhan, Shigeki Sugimoto","nlinked":382,"nref":615,"src":"INSPIRE","html":false},{"id":"3229406","arxiv":"2611.18830","title":"Determination of $V_{ud}$ from superallowed $β$ decays using effective field theory","first":"Novario","nauth":8,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Closest of your papers: [[2690106]] (coupling 0.02, 2 shared references). Closest network paper: [[1847652]] (coupling 0.08, 9 shared references).","score":21.0,"rank":12,"section":"cross","parts":[0.45,0.06,0.23,0.0,0.0],"abstract":"A precision determination of $V_{ud}$ from superallowed $β$ decays requires exquisite control over radiative corrections, including nuclear-structure-dependent effects whose evaluation has traditionally relied on nuclear models. To assess the uncertainties inherent in the nuclear matrix elements, an alternative strategy based on effective field theory (EFT) has been established in recent years. Here, we present material progress in this program, in terms of a first EFT calculation of the crucial correction $\\barδ_\\text{NS}$ for 12 superallowed transitions ranging from $^{10}$C $\\rightarrow$ $^{10}$B to $^{54}$Co $\\rightarrow$ $^{54}$Fe. These main results rely on nuclear ab initio calculations using the coupled cluster method, benchmarked against Quantum Monte Carlo evaluations for light nuclei. The global fit to superallowed decay rates reveals that the precision in $V_{ud}$ is currently limited by short-distance contributions that in the EFT are parameterized as two-nucleon contact interactions, leading to an uncertainty $δV_{ud}\\simeq 6\\times 10^{-4}$. We discuss the consequences for the status of the first-row unitarity test of the CKM matrix as well as a roadmap how to reduce the uncertainty in $V_{ud}$ in the future.","authors":"Samuel Novario, Graham Chambers-Wall, Vincenzo Cirigliano, Wouter Dekens, Jordy de Vries, Stefano Gandolfi, Martin Hoferichter, Emanuele Mereghetti","nlinked":104,"nref":112,"src":"INSPIRE","html":true},{"id":"","arxiv":"2611.21252","title":"Phenomenology of neutrino mass ordering synergies in reactor, accelerator, and atmospheric neutrino experiments, and the role of the detector response","first":"Cerrone","nauth":2,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Closest of your papers: [[2751074]] (coupling 0.01, 1 shared references). Closest network paper: [[2721859]] (coupling 0.04, 4 shared references). Shared topics: neutrino mass.","score":20.4,"rank":13,"section":"new","parts":[0.45,0.04,0.12,0.0,0.16],"abstract":"The neutrino mass ordering is one of the main open questions of neutrino physics, addressed by reactor, accelerator, and atmospheric experiments and by their combination. When the data are fitted under the wrong ordering, each experiment returns its own value of $Δm^2_{31}$, its wrong-ordering solution. We show that this solution is a weighted average of the values preferred by the individual bins of the measured event spectra, in reconstructed energy and, for atmospheric neutrinos, also zenith angle, with weights set by their statistical precision. Both the values and the weights depend on the detector response. In the plane of $Δm^2_{31}$ fitted under the two orderings, the solutions lie on lines of slope close to $-1$, so that each experiment is described by one intercept. The weighted bin average extends the mass ordering sum rule to any oscillation experiment, including atmospheric neutrinos in Earth matter. It recovers the known closed forms for short-baseline reactors and for accelerators in vacuum, and for JUNO it equals a closed form evaluated at one effective energy, which depends on the energy resolution. Above the MSW resonance the frequency of atmospheric $ν_μ$ disappearance becomes nearly independent of $δ_{CP}$, and the $ν_μ$ disappearance solution moves mainly with $θ_{23}$. The atmospheric intercept depends on the energy and direction resolutions, the energy window, and the event classes, and differs between detectors. The synergy of two experiments is determined by the separation of their intercepts relative to their precisions on $|Δm^2_{31}|$. With JUNO, this separation depends strongly on $δ_{CP}$ for an accelerator and is nearly independent of $δ_{CP}$ and $θ_{23}$ for IceCube DeepCore using all channels.","authors":"Vanessa Cerrone, Marco Grassi","nlinked":96,"nref":106,"src":"arXiv source","html":true},{"id":"3229388","arxiv":"2611.18843","title":"Ab initio calculations of ${\\barδ_\\text{NS}}$ and extraction of ${V_{ud}}$ using effective field theory","first":"Novario","nauth":8,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Closest of your papers: [[2690106]] (coupling 0.02, 2 shared references). Closest network paper: [[1847652]] (coupling 0.07, 9 shared references).","score":20.1,"rank":14,"section":"cross","parts":[0.45,0.05,0.19,0.0,0.0],"abstract":"Radiative corrections limit the precision of $V_{ud}$ extractions from superallowed $β$ decays. In particular, the model dependence in the nuclear matrix elements (NMEs) is difficult to assess without a clear organizing principle, which is provided by effective field theory (EFT). We report substantial progress in this program based on ab initio nuclear calculations using the coupled cluster method. Benchmarking results against Quantum Monte Carlo calculations for light nuclei, we evaluate all two-body NMEs that enter the correction $\\barδ_\\text{NS}$ across 12 superallowed transitions relevant for $V_{ud}$, including an estimate of truncation and Hamiltonian uncertainties. We find that certain three-body NMEs at ${\\mathcal O}(α^2)$ play an important role, due to a combination of large numerical prefactors and coherent scaling with $Z^2$. We develop a formalism to estimate such NMEs based on nuclear densities to complete the EFT evaluation of $\\barδ_\\text{NS}$, validating the corresponding two-body NMEs against ab initio calculations. We further identify the corrections in the traditional phase-space factor that are captured by the EFT and remove them consistently, which renders the individual transitions mutually consistent. Profiting from a recent calculation of ${\\mathcal O}(α^2 Z)$ ultrasoft photons, we find that the scale uncertainty in the EFT is now negligible, while the remaining uncertainty is dominated by contact terms required to renormalize the magnetic Gamow-Teller NMEs. One combination of low-energy constants can be determined from a global fit to the superallowed data, but the second one proves strongly correlated with $V_{ud}$, necessitating additional input to resolve the nuclear-structure effects. We argue that such short-distance contributions currently imply an uncertainty in $V_{ud}$ at the level of $δV_{ud}\\simeq 6\\times 10^{-4}$.","authors":"Samuel Novario, Graham Chambers-Wall, Vincenzo Cirigliano, Wouter Dekens, Jordy de Vries, Stefano Gandolfi, Martin Hoferichter, Emanuele Mereghetti","nlinked":148,"nref":162,"src":"INSPIRE","html":true},{"id":"","arxiv":"2611.19831","title":"Exploring X17 Couplings through Meson Dalitz Decays","first":"Wang","nauth":4,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Closest network paper: [[3115042]] (coupling 0.09, 4 shared references).","score":19.9,"rank":15,"section":"new","parts":[0.45,0.0,0.27,0.0,0.0],"abstract":"The ATOMKI collaboration has reported anomalous $e^+e^-$ pair production in a series of nuclear transitions, which has been interpreted as a possible signature of a new light boson, X17. Meson Dalitz decays provide a complementary probe of the X17 interaction structure. However, the widely studied vector coupling scenario is in tension with the combined constraints from existing $D^{*0}\\to D^0e^+e^-$, $D_s^{*+}\\to D_s^+e^+e^-$ measurements and nuclear transition analyses. In this work, we investigate the X17 contributions to meson Dalitz decays within a framework incorporating both vector and axial-vector couplings, employing the Bethe--Salpeter approach to calculate the hadronic transition matrix elements. With $u$ and $d$ quark couplings taken from previous analyses, we identify allowed regions for the charm and strange quark couplings, which require the axial-vector coupling strength $|g_{c,s}^A|\\sim10^{-3}$. We obtain four degenerate best-fit solutions, one of which is $(g_c^V,g_c^A,g_s^V,g_s^A)=(8.32,1.09,-2.62,1.36)\\times10^{-3}$, and estimate the decay ratio $R^{\\mathrm{th}}(D^{*+}\\to D^+e^+e^-)$, which significantly exceeds the Standard Model prediction.","authors":"Xuan Wang, Tianhong Wang, SiQi Zhang, Guo-Li Wang","nlinked":18,"nref":32,"src":"arXiv source","html":true},{"id":"3155167","arxiv":"2605.12946","title":"Minimal Majoron Dark Matter","first":"Akita","nauth":4,"year":2026,"cites":0,"role":"repl","note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[3184726]] (coupling 0.05, 10 shared references). Closest network paper: [[2901490]] (coupling 0.13, 12 shared references). Shared topics: dm abundance, viable parameter space, complex scalar, dark matter.","score":19.9,"rank":16,"section":"replacement","parts":[0.06,0.15,0.38,0.0,0.78],"abstract":"We study Majoron dark matter (DM) in its minimal realization, based on the Type-I seesaw framework extended by a SM-singlet complex scalar. Remaining agnostic about the origin and value of the Majoron mass, we evaluate the DM abundance from both the freeze-in and misalignment mechanisms, and identify the viable parameter space consistent with observational constraints. Without fine-tuning of the initial misalignment angle, we find that the Majoron mass is bounded by $m_J \\lesssim \\mathcal{O}(10)~\\mathrm{MeV}$. We also discuss compatibility with thermal leptogenesis. Successful leptogenesis with two right-handed neutrinos favors misalignment-dominated production with the Majoron mass $m_J \\lesssim \\mathcal{O}(100)~\\mathrm{eV}$, while freeze-in dominated production is compatible with leptogenesis only with a mild fine-tuning of the initial misalignment angle, $θ_i \\lesssim \\mathcal{O}(0.01)$.","authors":"Kensuke Akita, Koichi Hamaguchi, Haruto Kitagawa, Tatsuya Yokoyama","nlinked":65,"nref":65,"src":"INSPIRE","html":true},{"id":"3180735","arxiv":"2607.13142","title":"Connecting $B\\to K^{(\\ast)}νν$ and $K\\to πνν$ decays with neutrino physics","first":"Abada","nauth":6,"year":2026,"cites":0,"role":"repl","note":"Co-authors of yours: Leal. Also cites widely used network papers: [[2817040]]. Closest of your papers: [[793723]] (coupling 0.01, 1 shared references). Closest network paper: [[2813804]] (coupling 0.22, 23 shared references). Shared topics: neutrino mass.","score":19.2,"rank":17,"section":"replacement","parts":[0.06,0.03,0.61,0.5,0.19],"abstract":"We investigate the contributions of Lepton Number Violating (LNV) effective operators to the rare decays $B\\to K^{(\\ast)}νν$ and $K\\to πνν$. Such operators can modify the kinematic distributions of these processes, providing distinctive probes of physics beyond the Standard Model. Through a renormalization-group analysis, we show that the Standard Model Effective Field Theory (SMEFT) operators responsible for these effects are subject to stringent indirect constraints from neutrino physics. In particular, we find that the mild excess reported by Belle-II in the $B^+\\to K^+νν$ channel cannot be explained by LNV SMEFT operators without introducing significant fine-tuning in neutrino masses. We then show that these constraints can be evaded in the SMEFT minimally extended by a light right-handed neutrino, allowing for sizable effects in rare meson decays. Finally, we explore the implications of this viable scenario for low-energy processes, including neutrinoless double-beta decays.","authors":"Asmaa Abada, Claire Chevallier, Luighi P. S. Leal, Anna Llauradó, Olcyr Sumensari, Renata Zukanovich Funchal","nlinked":106,"nref":106,"src":"INSPIRE","html":true},{"id":"3186474","arxiv":"2608.01100","title":"Thermal Evolution and Hydrodynamic Filtering of Pseudoscalar Dark Matter","first":"Li","nauth":3,"year":2026,"cites":0,"role":"repl","note":"Closest of your papers: [[2614919]] (coupling 0.03, 4 shared references). Closest network paper: [[2957941]] (coupling 0.19, 14 shared references). Shared topics: dark matter mass, dark matter abundance, dark matter, dark matter particle.","score":17.4,"rank":18,"section":"replacement","parts":[0.0,0.11,0.55,0.0,0.59],"abstract":"Filtered dark matter provides a mechanism for producing massive dark matter particles during a first order phase transition. The resulting abundance can be modified by plasma hydrodynamics. We investigate this effect in a complex singlet extension of the Standard Model, focusing on the deflagration regime. The entropy normalized dark matter abundance $Y_χ$ is calculated using both analytic and numerical methods. As the dark matter mass increases, we identify three patterns of abundance evolution before nucleation, ranging from thermal equilibrium to thermal suppression and freeze-out. For $ξ_w=0.01$, the numerical results show that hydrodynamic effects increase the final $Y_χ$ by factors of approximately $4.1$, $5.7$, and $31.6$ for $m_χ=1.78$, $2.30$, and $5.03~\\mathrm{TeV}$, respectively. For the two lighter masses, the numerical and analytic results agree within $5\\%$, and the difference is reduced to about $1\\%$ or less when hydrodynamic effects are included. The heaviest case requires a numerical treatment because dark matter freeze-out before nucleation. Our results show that hydrodynamic reheating can enhance $Y_χ$ even when dark matter has already frozen out before the phase transition. In this regime, $Y_χ$ is determined by the dark matter abundance established before nucleation and hydrodynamic filtering at the bubble wall.","authors":"Xiu-Fei Li, Hongxin Wang, Lei Wang","nlinked":63,"nref":63,"src":"INSPIRE","html":true},{"id":"","arxiv":"2611.21380","title":"Heavy double-gluon quarkonium and $\\overline{b}ggc$ mesons","first":"Esmer","nauth":5,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Closest network paper: [[3081871]] (coupling 0.03, 3 shared references).","score":17.1,"rank":19,"section":"new","parts":[0.45,0.0,0.09,0.0,0.0],"abstract":"We investigate heavy double-gluon hybrid mesons, built from a heavy quark-antiquark pair and two valence gluons, using the two-point QCD sum rule method. The charmonium-like $\\bar{c}GGc$ and bottomonium-like $\\bar{b}GGb$ states are considered with $J^{PC}=0^{\\pm\\pm}$ and $1^{\\pm\\pm}$, whereas the open-flavor $\\bar{b}GGc$ states are classified by $J^{P}=0^{\\pm}$ and $1^{\\pm}$. The currents with $J^{PC}=0^{+-}, 0^{--}, 1^{++}$, and $1^{-+}$ vanish identically, so sum rules are derived for the remaining four channels. The operator product expansion is carried out up to dimension twelve, and the Borel parameter and continuum threshold are fixed so that the pole contribution dominates and the OPE converges. The resulting masses lie in the ranges $M\\simeq 6.2$--$6.7$~GeV for $\\bar{c}GGc$, $M\\simeq 12.0$--$12.2$~GeV for $\\bar{b}GGb$, and $M\\simeq 9.2$--$9.6$~GeV for $\\bar{b}GGc$, and the current couplings are obtained for all channels. These predictions provide a basis for analyzing the strong decays of double-gluon hybrids and for interpreting future experimental data in the heavy-quark sector.","authors":"G. Daylan Esmer, B. Barsbay, K. Azizi, H. Sundu, S. Türkmen","nlinked":36,"nref":36,"src":"arXiv source","html":true},{"id":"3227703","arxiv":"2611.15158","title":"Novel method for measuring the isovector partner of X(3872)","first":"Tan","nauth":5,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[3193100]]. Closest network paper: [[3193100]] (coupling 0.03, 21 shared references).","score":17.0,"rank":20,"section":"replacement","parts":[0.45,0.0,0.08,0.0,0.0],"abstract":"The predicted isovector partner of the $X(3872)$, denoted as $W_{c1}$, is expected to produce only a relatively weak structure near the charged $D \\bar{D}^*$ threshold, making its experimental identification challenging. In this work, we explore the triangle singularity (TS) mechanism as a means of enhancing the sensitivity to the $W_{c1}$ in the decays $B^0 \\to πK \\bar{D}^0 D^{*0}$. We investigate the $D_{s1}(2536) \\bar{D}^*$ triangle rescattering mechanism, incorporating the coupled-channel $D \\bar{D}^*$ scattering amplitudes obtained from the Lippmann-Schwinger equation. The interplay between the TS and the coupled-channel dynamics produces characteristic structures in the $K \\bar{D}^0 D^{*0}$ invariant mass distributions associated with the $X(3872)$ and its isovector partner $W_{c1}$. In particular, the charged-channel contribution exhibits a distinct structure sensitive to the nearby $W_{c1}$ pole. Our results demonstrate that the TS mechanism provides a promising way to probe the otherwise weak manifestation of the $W_{c1}$, offering a complementary experimental strategy for searching for this predicted state at Belle II and LHCb.","authors":"Qiu-Lin Tan, Mao-Jun Yan, Chun-Sheng An, Cheng-Rong Deng, Xiao-Hai Liu","nlinked":42,"nref":43,"src":"INSPIRE","html":true},{"id":"","arxiv":"2611.20588","title":"Doubly strange tetraquark as a $KK^*$ virtual state: quark-model study with harmonic traps","first":"Zhang","nauth":4,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Closest network paper: [[3193100]] (coupling 0.02, 23 shared references).","score":16.7,"rank":21,"section":"new","parts":[0.45,0.0,0.06,0.0,0.0],"abstract":"We extract hadron--hadron scattering information from quark-level interactions using an artificial harmonic trap and a four-quark basis that includes both meson--meson and compact diquark--antidiquark configurations. Combining the Busch--Englert--Rzażewski--Wilkens formula with the effective range expansion (ERE), we determine phase shifts, scattering lengths, effective ranges, and pole positions from the trapped spectrum. We control uncertainties from basis truncation, finite trap frequencies, truncation of ERE, and quark-model parameters. The extracted $DD^*$ and $BB^*$ binding energies agree with direct calculations, providing benchmarks. For the doubly strange $T_{ss}$ with $I(J^P)=0(1^+)$, we predict a $KK^*$ virtual-state pole about 30--35~MeV below threshold in the stable-$K^*$ approximation. Both the AL1 model and its modified version that better reproduces the measured $T_{cc}^+$ binding energy yield this result. This finding differs from earlier predictions of a bound state and motivates searches for the $T_{ss}$ at facilities such as the High Intensity heavy Ion Accelerator Facility (HIAF). This framework could be extended to other hadron-hadron channels to extract scattering observables and pole positions.","authors":"Kai-Kai Zhang, Zi-Yang Lin, Yan-Ke Chen, Lu Meng","nlinked":85,"nref":95,"src":"arXiv source","html":true},{"id":"","arxiv":"2611.21112","title":"Global analysis of the $ρ$ resonance in lattice QCD","first":"Jevsenak","nauth":6,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Closest network paper: [[3193100]] (coupling 0.02, 14 shared references).","score":16.6,"rank":22,"section":"cross","parts":[0.45,0.0,0.05,0.0,0.0],"abstract":"We present a lattice-QCD study of the $ρ$ resonance in which we address the quark-mass and lattice-spacing dependence in a novel way using a global analysis of four $N_f=2+1$ ensembles. We parametrize discretization effects in the lattice energy levels and not in the scattering amplitude, which is defined in the continuum. We describe the amplitude using a $K$-matrix parameterization, which contains the light- and strange-quark mass dependence. By varying the parameterizations of quark-mass and lattice-spacing dependence, we examine the sensitivity of the physical-limit $ρ$ pole position to these choices and obtain the result $\\sqrt{s}_ρ= 744(11)(7) - i\\,69(7)(3)~\\text{MeV}$ from a model average.","authors":"Luka Jevsenak, Luka Leskovec, Stefan Meinel, John Negele, Srijit Paul, Andrew Pochinsky","nlinked":47,"nref":49,"src":"arXiv source","html":true},{"id":"3228114","arxiv":"2611.16576","title":"Low-lying doubly charmed strange baryons via QCD sum rules","first":"Yang","nauth":3,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[3193100]]. Closest network paper: [[2101884]] (coupling 0.02, 1 shared references).","score":16.6,"rank":23,"section":"replacement","parts":[0.45,0.0,0.06,0.0,0.0],"abstract":"We systematically investigate the masses of the low-lying doubly heavy baryons and their $B^*(3/2^+)\\to B(1/2^+)γ$ radiative transitions within QCD sum rules and light-cone sum rules (LCSR). By constructing mixed interpolating currents, we obtain $M_{Ξ_{cc}}=3.62^{+0.14}_{-0.15}$ GeV, $M_{Ξ_{cc}^*}=3.72^{+0.14}_{-0.13}$ GeV, $M_{Ω_{cc}}=3.72^{+0.13}_{-0.15}$ GeV, and $M_{Ω_{cc}^*}=3.82^{+0.13}_{-0.15}$ GeV, together with their doubly bottom partners around $10.27$--$10.34$ GeV. The extracted masses are compatible with the observed $Ξ_{cc}$ and $Ω_{cc}$ states and predict hyperfine splittings of about $101^{+27}_{-11}$ MeV and $99^{+11}_{-12}$ MeV for the $Ξ_{cc}$ and $Ω_{cc}$ systems, respectively. Using these inputs, we derive the LCSR for the electromagnetic form factors and obtain radiative widths $Γ(Ξ_{cc}^{*++}\\toΞ_{cc}^{++}γ)=5.25^{+8.57}_{-3.62}$ keV, $Γ(Ξ_{cc}^{*+}\\toΞ_{cc}^{+}γ)=0.31^{+0.84}_{-0.25}$ keV, and $Γ(Ω_{cc}^{*+}\\toΩ_{cc}^{+}γ)=0.41^{+0.67}_{-0.30}$ keV, while the corresponding doubly bottom widths are at the $0.002$--$0.01$ keV level. We find that the magnetic-dipole contribution dominates, whereas the electric-quadrupole form factor is numerically small. The light- and heavy-quark photon-emission terms can interfere or enhance significantly, and the heavy-quark contribution cannot be neglected in radiative transitions. These results provide useful theoretical guidance for future searches for spin-$3/2$ doubly heavy baryons through radiative decay modes at LHCb, Belle II, and other experimental facilities.","authors":"Hui-Min Yang, Hua-Xing Chen, Xuan Luo","nlinked":50,"nref":52,"src":"INSPIRE","html":false},{"id":"","arxiv":"2611.20747","title":"Dimension-seven spectator effects in charm-hadron lifetimes at NLO","first":"Liu","nauth":1,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Closest network paper: [[3227657]] (coupling 0.02, 1 shared references).","score":16.5,"rank":24,"section":"new","parts":[0.45,0.0,0.04,0.0,0.0],"abstract":"We compute the next-to-leading-order (NLO) QCD corrections to the connected current-current part of the dimension-seven spectator coefficients in the heavy-quark expansion of charm-hadron widths. The finite terms are fixed in NDR-$\\overline{\\rm MS}$, with the evanescent operators defined by the standard Greek projection and averaged over Hermitian-conjugate pairs, and with a finite subtraction that sets the finite mixing of the dimension-seven operators into the dimension-six ones to zero. In several channels the one-loop term is comparable to the LO coefficient, and two operator families absent at LO are generated. Since the NLO matrix elements of the dimension-seven operators are not known, we estimate the effect of the coefficients on the widths with tree-level matrix elements from vacuum insertion for $D$ mesons and from the bag model for charmed baryons. The $1/m_c$ corrections to the matrix elements of the dimension-six QCD operators are treated by a naive expansion. Without their $O(α_s)$ part the semileptonic width of the $D_s^+$ would be negative. The NLO dimension-seven correction raises the $D^+$ width by 0.78 ps$^{-1}$, so that its central value, slightly negative as published, becomes positive. At central inputs, it is about 1% of the $D^0$ width, 10% of the $D_s^+$ width and at most 2% of the widths of the singly charmed baryons. Added to the published pole-scheme width, the $D^+$ correction gives $τ(D^+)=1.41^{+\\infty}_{-0.76}$ ps. The NLO term reduces the scale dependence of the nonleptonic dimension-seven contribution severalfold for the singly charmed baryons, whose matrix elements are evolved, but not uniformly for the $D$ mesons.","authors":"Chia-Wei Liu","nlinked":53,"nref":55,"src":"arXiv source","html":true},{"id":"","arxiv":"2611.21537","title":"The Skyrme-Dilaton and Nucleon Observables","first":"Fischbacher","nauth":2,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Closest network paper: [[2646376]] (coupling 0.02, 2 shared references).","score":16.5,"rank":25,"section":"new","parts":[0.45,0.0,0.05,0.0,0.0],"abstract":"We extend the Skyrme model by incorporating the $σ/f_0(500)$-meson as a dilaton. The motivation is twofold: the $σ$-meson is the lightest scalar resonance in QCD and is therefore the natural extensions to the pions of the classical Skyrme model, while its interpretation as a pseudo-Goldstone boson of spontaneously broken scale symmetry is supported by recent studies of gravitational form factors and related developments. Although the $σ$-meson is a broad resonance, for static observables it can be treated as real particle since its line-shape is not expected to be essential. A combined fit to static nucleon observables yields $χ^2/\\mathrm{dof} $ close to unity, with substantial improvement over the original Skyrme model, while simultaneously reproducing the physical value of $F_π$, the overall scale of the model.","authors":"Thomas Fischbacher, Roman Zwicky","nlinked":71,"nref":73,"src":"arXiv source","html":true},{"id":"3184783","arxiv":"2607.27603","title":"Unbiased Data-Driven Determination of the Nuclear Dipole Amplitude in the Color Glass Condensate","first":"Dai","nauth":7,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[3193100]]. Closest network paper: [[3227657]] (coupling 0.01, 1 shared references).","score":16.3,"rank":26,"section":"replacement","parts":[0.45,0.0,0.03,0.0,0.0],"abstract":"Gluon saturation limits the growth of parton densities at small Bjorken-$x$ and is expected to be most pronounced in heavy nuclei. Yet quantitative extractions of the nuclear gluon dipole amplitude have long relied on parametrized initial conditions, introducing uncontrolled model dependence that obscures genuine nuclear effects. We introduce a physics-informed neural-network framework that embeds the collinearly improved Balitsky-Kovchegov evolution equation directly into the training objective, allowing the impact-parameter-averaged dipole amplitude to be determined from data without assuming a functional form for its initial condition. Applying this framework to forward-hadron nuclear-modification-factor and coherent $J/ψ$ photoproduction data, we extract the $^{208}$Pb dipole amplitude at $x_0=0.01$ with QCD evolution and momentum-space positivity enforced throughout training. The evolved amplitude reproduces the measured cross sections across the available kinematic range and yields a saturation-scale ratio $Q_{s0,\\mathrm{Pb}}^2/Q_{s0,p}^2 = 3.17^{+0.17}_{-0.10}$, consistent with simple geometric scaling. The extracted Pb initial condition is well described by a McLerran-Venugopalan-type form, in contrast to the proton, reflecting the higher color-charge density of a large nucleus. Using the same amplitude, we predict the rapidity dependence of the transverse-momentum ratio in $pp$, $p$Pb, and Pb$p$ collisions, finding agreement with recent LHCb measurements at low multiplicity without any system-dependent parameters. This work provides the first unbiased, data-driven determination of nuclear structure in the saturation regime and establishes a general strategy for embedding nonlinear evolution equations into machine-learning extractions of dynamically constrained observables.","authors":"Si-Wei Dai, Haowu Duan, Long-Gang Pang, Guang-You Qin, Shu-Yi Wei, Han-Zhong Zhang, Wenbin Zhao","nlinked":92,"nref":104,"src":"INSPIRE","html":false},{"id":"3174532","arxiv":"2606.29380","title":"$λ$, $ρ$, and $σ$ Regge trajectories for the hexaquark ${(\\bar{u}(cc))(b(\\bar{b}\\bar{b}))}$ in the triquark-antitriquark picture","first":"Liu","nauth":3,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[3193100]]. Closest network paper: [[3227657]] (coupling 0.01, 1 shared references).","score":16.2,"rank":27,"section":"replacement","parts":[0.45,0.0,0.03,0.0,0.0],"abstract":"We propose Regge trajectory relations for the hexaquark ${(\\bar{u}(cc))(b(\\bar{b}\\bar{b}))}$ by using the Regge trajectory relations for diquarks and triquarks. With these newly derived relations, we investigate five series of hexaquark Regge trajectories: the $λ$-, $ρ_1$-, $ρ_2$-, $σ_1$-, and $σ_2$-trajectories. We demonstrate that, apart from the simplest $λ_1$-trajectories, the $ρ_1$-, $ρ_2$-, $σ_1$-, and $σ_2$-trajectories cannot be constructed by merely mimicking the meson Regge trajectories, since mesons possess no internal substructures. To derive these trajectories, one must account for the structure and internal substructure of the hexaquark. Without this structural information, the $ρ_1$-, $ρ_2$-, $σ_1$-, and $σ_2$-trajectories could only be obtained through direct fits to available theoretical predictions or future experimental data. We demonstrate that the $ρ_1$-, $ρ_2$-, $σ_1$-, and $σ_2$-trajectories for the hexaquark do not correspond respectively to the Regge trajectories for the triquark, antitriquark, diquark, and antidiquark. Nevertheless, their behaviors match those of the Regge trajectories for the triquark $(\\bar{u}(cc))$, the antitriquark $(b(\\bar{b}\\bar{b}))$, the diquark $(cc)$, and the antidiquark $(\\bar{b}\\bar{b})$, in that respective order. Furthermore, we present rough mass estimates for the excited states corresponding to the $λ$-, $ρ_1$-, $ρ_2$-, $σ_1$-, and $σ_2$-trajectories.","authors":"Xin-Ru Liu, Qi Liu, Jiao-Kai Chen","nlinked":113,"nref":116,"src":"INSPIRE","html":true},{"id":"3229423","arxiv":"2611.18833","title":"Black Hole Superradiance and the Gravitational Auger Effect","first":"Foster","nauth":2,"year":2026,"cites":0,"role":"today","note":"Closest of your papers: [[2790381]] (coupling 0.02, 4 shared references). Closest network paper: [[2669622]] (coupling 0.21, 24 shared references).","score":10.9,"rank":28,"section":"new","parts":[0.0,0.06,0.6,0.0,0.0],"abstract":"Black hole superradiance is a powerful probe of nature's light degrees of freedom. In the vicinity of a spinning black hole, it exponentially amplifies ultralight bosons from vacuum fluctuations to a macroscopic cloud of enormous occupation number. Observational superradiance effects - modified black-hole spins, gravitational-wave and coherent boson emission - are known to depend sensitively on bosonic self-interactions as induced by a quartic, $λφ^4$. Here we point out that purely gravitational interactions within the cloud significantly modify superradiance dynamics, through an analog of the Auger effect. Moreover, we identify nontrivial evolution of the superradiant levels beyond the first, driven by scattering into even higher levels and their radial overtones. For the QCD axion, the irreducible gravitational coupling rapidly dissipates the first superradiant level after it reaches saturation, through scalar emission and absorption by the black hole, while truncating the growth of higher levels. This can dramatically suppress the observability of continuous gravitational-wave signals or signatures in late binary inspirals. Black hole spin-down remains more robust, but for higher modes begins earlier and proceeds more slowly, requiring revision of existing limits.","authors":"Joshua W. Foster, Nicholas L. Rodd","nlinked":83,"nref":95,"src":"INSPIRE","html":true},{"id":"3174583","arxiv":"2606.30094","title":"Dynamical criterion for biased domain-wall formation","first":"Ai","nauth":1,"year":2026,"cites":0,"role":"repl","note":"Closest of your papers: [[2690106]] (coupling 0.06, 5 shared references). Closest network paper: [[2861922]] (coupling 0.12, 8 shared references).","score":10.0,"rank":29,"section":"replacement","parts":[0.0,0.17,0.34,0.0,0.0],"abstract":"In the presence of a bias term, the conventional condition for forming a domain-wall network is $p_{\\rm fv}>p_c\\simeq 0.31$, with $p_{\\rm fv}/(1-p_{\\rm fv})=\\exp(-ΔV(0)/V_b(0))$, where $p_{\\rm fv}$ is the false-vacuum fraction immediately after the phase transition, $ΔV(0)$ is the zero-temperature energy splitting between the false and true vacua and $V_b(0)$ is the zero-temperature barrier height measured from the true vacuum. This criterion, however, cannot be generally valid, since it is insensitive to the dynamics of the phase transition. In this work, we derive a dynamical criterion for domain wall formation in the presence of a bias term. We evaluate $p_{\\rm fv}$ at the freeze-out temperature of the false-vacuum correlation volumes $T_{\\rm fo}$, obtaining a substantially stricter criterion. The same dynamical picture also yields a necessary consistency condition for applying scaling-regime gravitational-wave estimates, $T_{\\rm fo}>T_{\\rm ann}$, where $T_{\\rm ann}$ is the annihilation temperature inferred from the scaling-regime dynamics.","authors":"Wen-Yuan Ai","nlinked":60,"nref":61,"src":"INSPIRE","html":true},{"id":"2737356","arxiv":"2312.09042","title":"Cosmological gravitational particle production and its implications for cosmological relics","first":"Kolb","nauth":2,"year":2023,"cites":193,"role":"other","note":"","score":null},{"id":"3177342","arxiv":"2607.06983","title":"From Inflation to Hot Big Bang","first":"Laine","nauth":2,"year":2026,"cites":2,"role":"other","note":"","score":null},{"id":"3070661","arxiv":"2510.15609","title":"Signals from Fermionic inflationary cosmology with Yukawa interaction","first":"Sui","nauth":4,"year":2025,"cites":3,"role":"other","note":"","score":null},{"id":"2642079","arxiv":"2303.07359","title":"Isocurvature constraints on scalar dark matter production from the inflaton","first":"Garcia","nauth":3,"year":2023,"cites":40,"role":"other","note":"","score":null},{"id":"3062873","arxiv":"2510.02972","title":"Flavor imprints on novel low mass dark matter","first":"Kumar","nauth":4,"year":2025,"cites":12,"role":"other","note":"","score":null},{"id":"2074575","arxiv":"2204.13735","title":"What's the (dark) matter with cosmological bubbles?","first":"Breitbach","nauth":1,"year":2022,"cites":0,"role":"other","note":"","score":null},{"id":"2721859","arxiv":"2311.07109","title":"Probing dirac neutrino properties with dilep
