<script>
const RAW = {"n":[{"id":"3222533","arxiv":"2611.04136","title":"Revisiting the gamma-ray signal from light ALPs emitted during the evaporation of memory-burdened PBHs","first":"Jiang","nauth":2,"year":2026,"cites":0,"role":"today","note":"Cites 10 network papers: [[3115426]], [[3141847]], [[2181757]], [[3076216]], [[1894389]], [[2908650]]…. Closest of your papers: [[2826987]] (coupling 0.06, 15 shared references). Closest network paper: [[3076216]] (coupling 0.14, 16 shared references). Shared topics: evaporation of primordial black hole, detection prospect, primordial black hole.","score":55.7,"rank":1,"section":"new","parts":[1.0,0.21,0.41,0.0,0.85],"abstract":"The memory-burden effect was recently proposed to take into account the information back-reaction in the evaporation of primordial black holes (PBHs). In this work, we systematically explore the axion-like particle (ALP) production via the evaporation of memory-burdened PBHs and the subsequent ALP-photon conversion in cosmic magnetic fields. The PBH evaporation progress is divided in the semiclassical phase of Hawking radiation and the quantum memory-burden phase. The time evolution of PBH mass and the gamma-ray flux after the conversion of PBH-emitted ALP are then evaluated by considering the memory-burden induced PBH entropy suppression. Furthermore, we investigate the detection prospects of this evaporation-conversion signal in next-generation satellite telescopes, including AMEGO, e-ASTROGAM and MAST. The detectable PBH mass range is extended down to masses much smaller than $10^{15}$ g. Applying the Fisher forecasting method, we derive the projected sensitivity for PBH fraction $f_{\\rm PBH}$ and ALP-photon coupling $g_{aγγ}$.","authors":"Cheng-Rui Jiang, Tong Li","nlinked":97,"nref":101,"src":"INSPIRE","html":true},{"id":"3222490","arxiv":"2611.03793","title":"Gaia's dark partners: A new signature of dissipative dark matter","first":"Bhalla","nauth":6,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[2795517]]. Closest of your papers: [[1832796]] (coupling 0.01, 4 shared references). Closest network paper: [[3214429]] (coupling 0.06, 21 shared references). Shared topics: dark sector, dark matter.","score":22.5,"rank":2,"section":"cross","parts":[0.45,0.04,0.18,0.0,0.28],"abstract":"The Gaia mission has greatly improved our understanding of the stellar binary population. Beyond providing an extensive catalog of binary systems with two luminous stars, Gaia has also discovered several systems that appear to be star--black hole (BH) binaries. One of the leading candidate formation channels for these systems is dynamical exchange, in which one component of a star--star binary is ejected from the system and replaced by a BH. Exchange processes are very sensitive to the velocity distribution of the incoming objects, and become very efficient in the limit that perturbers are slow, so the exchanged binary population is a sensitive probe of slow-moving objects. A population of slow-moving, nonluminous objects is naturally produced in dissipative dark matter (DDM) scenarios, where a subcomponent of dark matter can cool to form a dark disk and dark compact objects (DCOs), including but not limited to BHs, with a small velocity dispersion. In this work, we evaluate the rate at which DCOs formed by DDM exchange into star--star binaries to form star--DCO binaries. We find that in a wide range of parameter space, even under conservative assumptions, the rate of exchange interactions is sufficient to produce the objects that Gaia has observed to date. In some portions of parameter space, the predicted exchange rate is well in excess of the rate estimated from observations. We point out the potential for competitive constraints on the DDM parameter space with current and future data, making the Gaia mission an important testbed for dark sector cooling.","authors":"Badal Bhalla, David Dunsky, Akshay Ghalsasi, Benjamin V. Lehmann, Jackie Lodman, Kuver Sinha","nlinked":126,"nref":155,"src":"INSPIRE","html":true},{"id":"3222565","arxiv":"2611.04237","title":"Observable gravitational waves from unstable ALP catastrogenesis","first":"Gelmini","nauth":3,"year":2026,"cites":0,"role":"today","note":"Also cites widely used network papers: [[1783234]]. Closest of your papers: [[1941263]] (coupling 0.10, 18 shared references). Closest network paper: [[1615480]] (coupling 0.12, 15 shared references).","score":16.1,"rank":3,"section":"new","parts":[0.06,0.29,0.35,0.0,0.02],"abstract":"We focus on gravitational waves (GWs) observable in pulsar timing array and interferometric searches that are produced by the annihilation of cosmic string-wall networks in axion-like particle (ALP) models. We called this process \"catastrogenesis.\" It produces GWs with a characteristic peaked spectrum. These GWs would not be observable if the ALPs were stable. We thus assume that ALPs decay into two photons before Big-Bang nucleosynthesis (BBN). The large ALP-photon coupling required could induce field dissipation and friction on cosmic walls through interactions with the radiation background. We study the conditions under which these effects are negligible and map the parameter regions yielding observable GW signals onto the usual ALP mass-coupling parameter space. We find that, in these regions, ALPs dominate the energy density of the Universe before they decay, leading to a period of intermediate matter domination, which would leave a clear imprint on the GW spectrum.","authors":"Graciela B. Gelmini, Jonah Hyman, Yu Watanabe","nlinked":100,"nref":107,"src":"INSPIRE","html":true},{"id":"3222489","arxiv":"2611.03904","title":"Constraints on a Long-Lived X17 Vector Boson with FASER","first":"Collaboration","nauth":136,"year":2026,"cites":0,"role":"today","note":"Co-authors of yours: Xu. Closest of your papers: [[3130296]] (coupling 0.03, 3 shared references). Closest network paper: [[3115042]] (coupling 0.19, 14 shared references).","score":15.5,"rank":4,"section":"cross","parts":[0.0,0.08,0.55,0.5,0.0],"abstract":"The ATOMKI anomalies motivate the possibility of a new particle, the X17, with a mass of 17 MeV and weak couplings to nuclei and electrons. Such a particle may be produced at the LHC, travel 480 m in the far-forward direction, and decay to $e^+e^-$ in FASER. In this paper, previous FASER searches for dark photons and axion-like particles (ALPs) are combined and interpreted as searches for a candidate X17 particle, the protophobic vector boson. The searches use data collected from $pp$ collisions at $\\sqrt{s} = 13.6$ TeV in LHC Run 3 from 2022 for the dark photon search and from 2022-2023 for the ALP search. No excess events are found above the expected background, and the combined null results exclude a previously-unconstrained \"low-coupling window\" with electron coupling $6 \\times 10^{-5} < ε_e < 1.2 \\times 10^{-4}$. A \"high-coupling window\" remains.","authors":" FASER Collaboration, Roshan Mammen Abraham, Xiaocong Ai, Saul Alonso Monsalve, John Anders, Emma Kate Anderson, Akitaka Ariga, Tomoko Ariga, Jeremy Atkinson, Florian U. Bernlochner, Jianming Bian, Tobias Boeckh, Eliot Bornand, Jamie Boyd, Lydia Brenner, Angela Burger, Franck Cadoux, Haichuan Cao, Roberto Cardella, David W. Casper, Charlotte Cavanagh, Shiyang Chen, Xin Chen, Xing Cheng, Dhruv Chouhan, Emily Chown, Andrea Coccaro, Fabio Cufino, Stephane Débieux, Ansh Desai, Sergey Dmitrievsky, Radu Dobre, Monica D'Onofrio, Sinead Eley, Yannick Favre, Jonathan L. Feng, Carlo Alberto Fenoglio, Didier Ferrere, Max Fieg, Wissal Filali, Elena Firu, Haruhi Fujimori, Edward Galantay, Ali Garabaglu, Stephen Gibson, Sergio Gonzalez-Sevilla, Yuri Gornushkin, Yotam Granov, Jinjing Gu, Carl Gwilliam, Elie Hammou, Daiki Hayakawa, Michael Holzbock, Shih-Chieh Hsu, Zhen Hu, Giuseppe Iacobucci, Tomohiro Inada, Luca Iodice, Sune Jakobsen, Cesar Jesus-Valls, Arash Jofrehei, Hans Joos, Enrique Kajomovitz, Hiroaki Kawahara, Alex Keyken, Felix Kling, Daniela Köck, Pantelis Kontaxakis, Jelle Koorn, Umut Kose, Peter Krack, Susanne Kuehn, Thanushan Kugathasan, Sebastian Laudage, Lorne Levinson, Botao Li, Jiaxi Liu, Yi Liu, Joern Mahlstedt, Toni Mäkelä, Yasuhiro Maruya, Anna Mascellani, Lawson McCoy, Josh McFayden, Andrea Pizarro Medina, Hiroaki Menjo, Théo Moretti, Toshiyuki Nakano, Laurie Nevay, Ken Ohashi, Hidetoshi Otono, Lorenzo Paolozzi, Annabelle Parry, Pawan Pawan, Brian Petersen, Titi Preda, Markus Prim, Junkai Qin, Michaela Queitsch-Maitland, Juan Rojo, Hiroki Rokujo, André Rubbia, Jorge Sabater-Iglesias, Osamu Sato, Paola Scampoli, Kristof Schmieden, Matthias Schott, Cristiano Sebastiani, Anna Sfyrla, Davide Sgalaberna, Mansoora Shamim, Yosuke Takubo, Kakeru Tanaka, Simon Thor, Eric Torrence, Serhan Tufanli, Oscar Ivan Valdes Martinez, Svetlana Vasina, Emanuele Villa, Benedikt Vormwald, Chi Wang, Yuxiao Wang, Eli Welch, Aaron White, Monika Wielers, Benjamin James Wilson, Zhongyi Wu, Yue Xu, Heng Yang, Lekai Yao, Daichi Yoshikawa, Stefano Zambito, Shunliang Zhang, Yuxuan Zhang, Xingyu Zhao, Zijian Zhao","nlinked":54,"nref":56,"src":"INSPIRE","html":true},{"id":"3222513","arxiv":"2611.03893","title":"Searching for Long-Lived Dark Scalars with MAPP-1 and MAPP-2 at the HL-LHC","first":"Arifeen","nauth":4,"year":2026,"cites":0,"role":"today","note":"Also cites widely used network papers: [[2817040]], [[1518747]]. Closest of your papers: [[3146383]] (coupling 0.05, 8 shared references). Closest network paper: [[3084653]] (coupling 0.11, 26 shared references). Shared topics: dark sector.","score":15.4,"rank":5,"section":"new","parts":[0.11,0.17,0.31,0.0,0.17],"abstract":"Feebly interacting particles (FIPs) arise generically in dark-sector extensions of the Standard Model (SM). Among the simplest and most theoretically motivated such candidates is a dark scalar that mixes with the SM Higgs boson, acting as a mediator between the dark sector and the SM. For sufficiently small mixing, such a dark scalar manifests at collider experiments as a long-lived particle with a macroscopic decay length---a signature to which conventional general-purpose detectors have limited sensitivity. The MoEDAL-MAPP experiment is a dedicated search facility at the Large Hadron Collider (LHC) targeting long-lived FIPs as avatars of physics beyond the SM. We present $95\\%$ confidence-level background-free sensitivity projections for the MAPP-1 and MAPP-2 detectors at the High-Luminosity LHC to Higgs-portal dark scalars produced via rare $B$-meson decays and exotic Higgs boson decays. Our results establish the proposed MAPP-2 detector as a complementary probe of feebly-coupled dark scalars, with sensitivity to lifetimes beyond the reach of existing collider searches.","authors":"Shafakat Arifeen, James Pinfold, Pierre-Philippe A. Ouimet, Michael Staelens","nlinked":66,"nref":72,"src":"INSPIRE","html":true},{"id":"3222604","arxiv":"2611.04600","title":"Light Mediators at the Neutrino-Dark Matter Frontier: Coherent Scattering, Precision Constraints, and Complementary Searches","first":"Serao","nauth":4,"year":2026,"cites":0,"role":"today","note":"Closest of your papers: [[3130296]] (coupling 0.04, 6 shared references). Closest network paper: [[3095306]] (coupling 0.14, 10 shared references). Shared topics: direct detection, dark matter.","score":12.1,"rank":6,"section":"new","parts":[0.0,0.11,0.4,0.0,0.3],"abstract":"Low-threshold neutrino and dark-matter experiments constrain light mediators through different momentum transfers, targets, and coupling combinations. We examine scalar and vector interactions in coherent neutrino--nucleus scattering, neutrino--electron scattering, and dark-matter direct detection. Three representative interaction models are used to compare recoil spectra and coupling degeneracies. For $^{73}\\mathrm{Ge}$ and $^{131}\\mathrm{Xe}$, the nuclear-charge response matrix has a condition number of approximately 115, so two different targets may still leave nearly parallel blind directions. An analytic profile-likelihood calculation shows how spectral overlap and uncertainties in neutrino interactions affect dark-matter discovery sensitivity in the neutrino fog. We discuss the implications of measurements from COHERENT, CONUS+, LZ, XENONnT, and PandaX-4T and specify which theoretical inputs, detector responses, and statistical correlations are needed to combine their constraints. keyword : coherent elastic neutrino-nucleus scattering; light mediators; neutrino--electron scattering; dark matter direct detection; non-standard interactions; solar neutrinos; complementarity","authors":"Raoul Serao, Mohamed Ouchemhou, Antonio Capolupo, Salvatore Capozziello","nlinked":60,"nref":77,"src":"INSPIRE","html":true},{"id":"3222486","arxiv":"2611.03794","title":"Shortcomings of the squark simplified model","first":"Agashe","nauth":5,"year":2026,"cites":0,"role":"today","note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1394206]] (coupling 0.05, 3 shared references). Closest network paper: [[2744388]] (coupling 0.09, 13 shared references).","score":10.9,"rank":7,"section":"new","parts":[0.06,0.17,0.26,0.0,0.0],"abstract":"We argue that the squark simplified model commonly used in collider analyses fails to represent realistic low-energy supersymmetric models and significantly underestimates squark production rates at hadron colliders. This has important implications for extracting squark mass limits at the LHC and assessing the potential reach of HL-LHC or the FCC-hh. In particular, we find that the current LHC squark mass limit is realistically in the range of 2.6-3.0 TeV, rather than the 1.7-1.8 TeV range that is typically quoted based on the simplified model.","authors":"Kaustubh Agashe, Roberto Franceschini, Gian F. Giudice, Andre Lessa, Xing Wang","nlinked":32,"nref":39,"src":"INSPIRE","html":true},{"id":"3222488","arxiv":"2611.03802","title":"A full chemical network treatment of supermassive black hole seed formation from dark matter annihilation or decay","first":"Wu","nauth":3,"year":2026,"cites":0,"role":"today","note":"Closest of your papers: [[2964960]] (coupling 0.02, 2 shared references). Closest network paper: [[2725313]] (coupling 0.09, 12 shared references). Shared topics: mass below, dark matter.","score":10.4,"rank":8,"section":"cross","parts":[0.0,0.05,0.25,0.0,0.5],"abstract":"The recent discoveries of high-redshift quasars at $z\\sim6-10.1$ present a challenge to conventional supermassive black hole (SMBH) formation scenarios: their central SMBHs are too large to have grown from early stellar remnants, even under efficient super-Eddington accretion. An alternative approach is the direct collapse of primordial, dust- and metal-free gas clouds into black hole seeds as early as $z\\sim20$. To prevent fragmentation from highly efficient molecular hydrogen cooling and allow such a collapse, a strong flux of UV photons is required to photodissociate molecular hydrogen, suppressing star formation. We investigate whether the decay or annihilation of dark matter with masses below $\\sim200$ eV can produce sufficient UV radiation, both from the cosmological background and within early dark matter halos. Using thermal simulations of a one-zone primordial gas cloud model with the Grackle chemistry and cooling library, we map the resulting gas behavior across a range of dark matter lifetimes, cross sections, and masses. From this, we determine regions of parameter space where direct collapse into an SMBH is possible and the corresponding maximum halo mass required.","authors":"Han Wu, Sarah Schon, Aaron C. Vincent","nlinked":78,"nref":96,"src":"INSPIRE","html":true},{"id":"2817040","arxiv":"","title":"Review of particle physics","first":"Navas","nauth":244,"year":2024,"cites":6595,"role":"other","note":"","score":null},{"id":"3214448","arxiv":"2610.17207","title":"Implications for new physics solutions to the LSND and MiniBooNE anomalies after MicroBooNE results","first":"Abdalla 22,"c"],[51,13,"c"],[6,36,"k"],[17,13,"c"],[0,52,"k"],[32,15,"c"],[0,37,"c"],[8,32,"c"],[4,38,"k"],[51,14,"c"],[25,8,"c"],[40,52,"c"],[24,28,"c"],[37,52,"c"],[29,47,"c"],[2,28,"k"],[38,50,"c"],[37,13,"c"],[19,40,"c"],[52,45,"c"],[20,51,"c"],[2,15,"k"],[19,52,"c"],[46,51,"c"],[0,17,"k"],[8,15,"c"],[40,22,"c"],[24,45,"c"],[10,13,"c"],[34,48,"c"],[0,22,"c"],[49,32,"c"],[3,27,"k"],[17,40,"c"],[22,45,"c"],[23,8,"c"],[45,52,"c"],[27,50,"c"],[51,10,"c"],[45,13,"c"],[12,24,"c"],[0,40,"c"],[1,46,"k"],[4,47,"k"],[22,24,"c"],[2,49,"k"],[5,41,"k"],[23,43,"c"],[1,51,"c"],[0,14,"c"]],"next":[{"arxiv":"2611.03783","id":"3222464","title":"GUT Color-Triplet Around the Corner: The Story of an Overlooked Lightness","authors":"Gia Dvali, Manuel Ettengruber, Anna Jankowsky, Tongxuan Zhang","score":8.2,"section":"new","rank":9,"parts":[0.0,0.06,0.42,0.0,0.0],"note":"Closest of your papers: [[1663960]] (coupling 0.02, 1 shared references). Closest network paper: [[2936613]] (coupling 0.15, 10 shared references).","abstract":"In traditional approach to the doublet-triplet splitting problem in grand unified theories (GUTs) it is assumed that color-triplet partner of the Higgs doublet must be superheavy in order not to mediate proton decay. However, it has been proposed [1] that the splitting, instead of the mass sector, can occur among the Yukawa couplings. In this scenario the color-triplet emerges as a long-lived $T$-particle with the mass around the TeV scale. This framework provides a direct low-energy window into GUT physics. In the present paper, we study an explicit supersymmetric $SO(10)$ GUT which realizes this mechanism, including effects of gravity-mediated supersymmetry breaking. We show how the shift of the heavy fields, triggered by supersymmetry-breaking, generates a tiny coupling between the $T$-particle and the Standard Model fields and explore the resulting phenomenology. Depending on the order of gravitino mass in which the coupling emerges, the lifetime of the $T$-particle is either around a second or exceeds the age of the Universe. In our analysis, we validate some earlier constraints on (super)gravity vacua imposed by the $S$-matrix: based on the Goldstino Argument, we show that none of the GUT vacua have positive energy densities, whereas the Minkowski vacua are safe against tunneling. We also highlight the role of the species scale cutoff in sensitivity of the low energy observables towards the GUT physics."},{"arxiv":"2611.03751","id":"3222457","title":"Electroweak Constraints on Nuclear Neutron Distributions and the Low-Energy Weak Mixing Angle","authors":"Xu-Run Huang, Tong-Gang Yue, Zhen Zhang, Lie-Wen Chen","score":6.7,"section":"cross","rank":10,"parts":[0.06,0.03,0.25,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2794409]] (coupling 0.01, 1 shared references). Closest network paper: [[3095306]] (coupling 0.09, 7 shared references).","abstract":"Coherent elastic neutrino--nucleus scattering (CE$ν$NS) offers a low-energy probe of the weak mixing angle, $\\sin^2θ_W$, and possible new physics in the neutrino sector. Its reliable interpretation, however, requires independent constraints on the neutron distributions of the target nuclei. We exploit correlations across nuclei within an extended Skyrme energy-density-functional framework to propagate constraints from the CREX and PREX-II parity-violating electron-scattering (PVES) measurements to CE$ν$NS targets. This yields neutron form factors and radii, with relative radius uncertainties below $1\\%$. Using these inferred neutron form factors, we jointly analyze the COHERENT CsI, Ge, and Ar data and obtain $\\sin^2θ_W=0.231^{+0.016}_{-0.015}$, consistent with the Standard Model prediction. These results provide the first electroweak-experimentally constrained benchmarks for nuclear-structure studies, neutrino-sector electroweak tests, and CE$ν$NS signal predictions in dark-matter detectors."},{"arxiv":"2611.04110","id":"3222553","title":"Holographic spin alignment of vector mesons in a spinning black-hole background","authors":"Fei Wang, Zi-qiang Zhang","score":6.4,"section":"new","rank":11,"parts":[0.06,0.09,0.11,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[636564]] (coupling 0.03, 2 shared references). Closest network paper: [[634308]] (coupling 0.04, 4 shared references).","abstract":"Holographic predictions for vector-meson spin alignment are difficult to compare between charmonium and light vector mesons, as the two sectors are typically treated in different rotating backgrounds and spectral prescriptions. Consequently, it remains unclear whether a single rotating medium can generate the opposite polarization preferences observed in data. We address this by placing \\(J/ψ\\) and \\(φ\\) in one soft-wall model on the planar limit of a five-dimensional equal-spin Myers--Perry (MP) AdS black hole, computing spectral functions and spin alignment within the same current-correlator framework; the nonrotating results of Sheng et al. [Phys. Rev. D 110, 056047 (2024)] are recovered at \\(a=0\\). At \\(T=0.15~\\mathrm{GeV}\\), \\(J/ψ\\) retains a clear resonance peak, whereas \\(φ\\) shows no narrow peak and instead behaves as a broad distribution consistent with unstable \\(s\\bar{s}\\) pairs. For \\(J/ψ\\) along \\(z\\), rotation enhances the positive deviation of \\(ρ_{00}^{h}\\) from \\(1/3\\) at low and intermediate momenta but suppresses it at high momenta; along \\(x\\), the effect is small. For \\(φ\\), rotation enhances the negative deviation, more along \\(z\\) than along \\(x\\). The opposite helicity-frame signs and the opposing azimuthal and rapidity trends of the global alignment provide a reference for interpreting data: trends inconsistent with these would challenge the simplest single homogeneous rotating-medium interpretation. We distinguish model-dependent numerical details from qualitative features stable within this model class."},{"arxiv":"2611.04890","id":"3222820","title":"DAMA/LIBRA dark matter signal: a global analysis","authors":"Matti Heikinheimo, Sebastian Sassi, Alex Stendahl, Kimmo Tuominen, Niklas Zimmermann","score":6.3,"section":"new","rank":12,"parts":[0.0,0.06,0.21,0.0,0.13],"note":"Closest of your papers: [[3146383]] (coupling 0.02, 4 shared references). Closest network paper: [[3217265]] (coupling 0.07, 7 shared references). Shared topics: dark matter.","abstract":"The annual modulation reported by the DAMA/LIBRA collaboration remains in tension with the null results of other direct-detection experiments. We investigate the compatibility of DAMA/LIBRA with LZ, PICO-60 and CDMSlite within a generalized non-relativistic effective field theory (EFT) framework. In addition to the EFT operator expansion we investigate additional modifications to the standard WIMP picture, including inelastic scattering, variations in the NaI quenching factors, and a rescaling of the dark-matter velocity dispersion. We perform a Markov chain Monte Carlo analysis in this extended model space, using two alternative approaches to the likelihood function describing the DAMA/LIBRA data. Both approaches result in strong discrepancy between the data from DAMA/LIBRA and other experiments. We conclude that the extended model space considered here cannot accommodate the DAMA/LIBRA signal while remaining consistent with the non-observation of dark matter in other experiments."},{"arxiv":"2611.03785","id":"3222477","title":"Cosmic-Ray Signals from Dark Matter Annihilation into Scalars with Baryon Number","authors":"Mattia Di Mauro, Caleb Gemmell, Dan Hooper, Fabrizio Vassallo","score":5.9,"section":"new","rank":13,"parts":[0.0,0.03,0.25,0.0,0.13],"note":"Closest of your papers: [[860906]] (coupling 0.01, 1 shared references). Closest network paper: [[3130997]] (coupling 0.09, 6 shared references). Shared topics: dark matter.","abstract":"Cosmic-ray antideuterons and antihelium-3 nuclei are promising probes of dark matter (DM). In light of potential detections of heavy antinuclei at AMS-02, we investigate a recently proposed scenario in which DM annihilates into color-singlet scalars carrying baryon and lepton number, which has been shown to enhance antideuteron and antihelium-3 fluxes relative to antiprotons. Accounting for Galactic propagation and detector sensitivities, we calculate the number of events predicted by our model for parameters that are compatible with the seven-year AMS-02 antiproton data. Broad regions of the DM-mediator mass plane result in observable antideuteron fluxes at AMS-02 and GAPS. While detecting antihelium-3 remains more challenging, potentially detectable fluxes can arise for light mediators and moderately light DM, and in general are enhanced relative to the standard WIMP predictions. Furthermore, we find antihelium-to-antideuteron event ratios of O(0.1), closer to those suggested by the reported AMS-02 candidate events than conventional WIMP predictions."},{"arxiv":"2611.03988","id":"3222497","title":"Axion Electrodynamics in Presence of a Stellar Non-homogeneous Background Magnetic Field","authors":"Bernard Teles de Menezes","score":5.2,"section":"new","rank":14,"parts":[0.0,0.09,0.17,0.0,0.0],"note":"Closest of your papers: [[1941263]] (coupling 0.03, 3 shared references). Closest network paper: [[2969908]] (coupling 0.06, 4 shared references).","abstract":"We re-assess effects of Axion Electrodynamics in the presence of non-homogeneous background magnetic fields. The Primakoff effect, which is an ALP-photon mixing induced by a background magnetic field, is generalized to the case of non-homogeneous backgrounds. The production of ALPs from a magnetized plasma thermal medium is also computed. The Eddington's solar standard model is adopted as the phenomenological scenario for our settings, and new bounds on the Axion Electrodynamics parameter space are imposed by considering helioseismological and neutrino observational measurements."},{"arxiv":"2611.03748","id":"3222469","title":"Topological Diagnostics of CP Degeneracies in Long-Baseline Neutrino Oscillations with Non-Standard Interactions via Pancharatnam Open-Path Phases","authors":"Neda Razzaghi","score":5.1,"section":"new","rank":15,"parts":[0.0,0.06,0.22,0.0,0.0],"note":"Closest of your papers: [[3184726]] (coupling 0.02, 1 shared references). Closest network paper: [[2874212]] (coupling 0.08, 3 shared references).","abstract":"We investigate the topological signatures of neutral-current Non-Standard Interactions (NSI) in long-baseline neutrino oscillations by extending the open-path Pancharatnam geometric phase framework. Incorporating off-diagonal vector couplings ($\\varepsilon_{eτ} = |\\varepsilon_{eτ}|e^{iφ_{eτ}}$) into the discrete-layer matter Hamiltonian across the DUNE baseline ($L = 1300\\text{ km}$), we analyze the state evolution for both neutrino ($ν_μ\\to ν_e$) and antineutrino ($\\barν_μ\\to \\barν_e$) appearance channels over the broadband energy spectrum $E_ν\\in [0.5, 8.0]\\text{ GeV}$. Our analysis demonstrates that complex NSI phases imprint distinct, energy-dependent spectral dispersions onto the open-path geometric holonomies $Φ_g^{(n)}$ and their $\\mathcal{CP}$-conjugate counterparts. By clarifying that these geometric phases manifest through gauge-invariant interference terms $ΔΓ_{nm}$ rather than asymptotic single-channel measurements, we construct the $\\mathcal{CP}$-violating geometric phase differences $ΔΦ_g^{\\mathrm{CP}}$. We show that the interplay between these geometric dispersions and the matter-potential sign reversal under $\\mathcal{CP}$-conjugation forces the neutrino and antineutrino degeneracy bands to intersect at non-parallel angles in the two-dimensional $(δ_{\\mathrm{CP}}, φ_{eτ})$ parameter space. This non-trivial topological intersection isolates a unique physical solution, providing a robust, independent diagnostic capable of breaking persistent parameter degeneracies even under realistic calorimetric energy smearing."},{"arxiv":"2611.04802","id":"3222623","title":"Study of enhancing the signal-background separation for the Higgs boson production in association with a single top-quark in $pp$ collisions at the LHC","authors":"Rustam Azimzade, Alina Dadashova, Igor Boiko, Vladimir Lyubushkin, Nazim Huseynov","score":5.0,"section":"new","rank":16,"parts":[0.0,0.09,0.15,0.0,0.0],"note":"Closest of your papers: [[3094526]] (coupling 0.03, 5 shared references). Closest network paper: [[2660030]] (coupling 0.05, 10 shared references).","abstract":"In this paper, a multivariate analysis based approach for enhancing the extraction of the rare Standard Model (SM) process being studied - Higgs boson production in association with a single top quark (tH) - from the prevailing background processes is presented. The analysis was performed using a Monte Carlo generated dataset simulating the outcomes of proton-proton collisions at the Large Hadron Collider (LHC). A deep fully connected neural network was developed for signal-background discrimination, incorporating a masking mechanism designed to suppress the contribution of input variables associated with objects that were not reconstructed in a given event. The performance of the masked architecture was evaluated on independent Monte Carlo samples. The results of the proposed methodology are compared with a conventional cut-based approach in terms of the statistical significance of the tH production channel. The developed framework was tested using a simulated dataset corresponding approximately to the combined statistical samples of LHC Runs 1, 2, and 3."},{"arxiv":"2611.04468","id":"3222587","title":"Vertex-resummed kinetic theory of dipole-symmetric bosons from 2PI effective action","authors":"Chun-Wei Su","score":4.2,"section":"new","rank":17,"parts":[0.0,0.02,0.24,0.0,0.0],"note":"Closest of your papers: [[2039411]] (coupling 0.01, 1 shared references). Closest network paper: [[2677060]] (coupling 0.08, 7 shared references).","abstract":"The formalism of non-equilibrium dynamics for the dipole-symmetric $U(N)$ model involving $N$-component charged scalar fields is studied on the Schwinger-Keldysh contour by a systematic $1/N$ expansion of two-particle-irreducible (2PI) effective action to the next-to-leading order (NLO). The differential equations describing non-equilibrium evolution equations of two-point functions and field expectation values related to the symmetry breaking in the dynamics are derived, which encompass scatterings between modes essential in the late-time evolution and thermalization beyond the scope of the mean field. At the late-time regime of the evolution, the leading-order (LO) gradient expansion is performed to construct the vertex-resummed kinetic theory by encoding non-perturbative effects in the vertex through the resummation, which is distinct from the standard kinetic theory written by the weak-coupling expansion."},{"arxiv":"2611.03694","id":"3222454","title":"Birefringence in non-linear electrodynamics emerging from a Lorentz-symmetry violation scenario","authors":"M. J. Neves","score":4.0,"section":"cross","rank":18,"parts":[0.0,0.0,0.27,0.0,0.0],"note":"Closest network paper: [[3164308]] (coupling 0.09, 3 shared references).","abstract":"In this paper, we investigate the classical properties of a non-linear electrodynamics that emerges from one loop effective action for fermions coupled to an antisymmetric background tensor, that breaks the Lorentz symmetry in the model. The conservation laws are obtained through the Belinfante-Rosenfeld energy-momentum tensor in the non-linear electrodynamics that provides the energy density, the Poynting vector, the linear momentum and the stress tensor. In particular, this Lorentz symmetry violation breaks the symmetric index of the energy-momentum tensor, but it preserves the gauge invariance, as we expect. We introduce the prescription of a magnetic background field, that we consider constant and uniform. For propagation effects, the model is linearized by the magnetic background. This prescription allows us investigations of the plane wave propagation in the presence of an external magnetic field. In this context, we obtain the constitutive relations of the material medium, that behaves like an bi-anisotropic medium. Thereby, we calculate the refractive index whose one of the solutions show the total absorption of the wave in the medium. Using the wave equation for linear polarization, we investigate the birefringence phenomenon when the linear wave polarization changes with the magnetic background direction. The birefringence is so related to one of the spatial component of the LSV tensor in which we estimate through the PVLS experiment. We use one of the dispersion relations to obtain the kinematic of the Compton effect in the presence of the LSV parameter."},{"arxiv":"2611.03813","id":"3222503","title":"Presupernovae Strongly Constrain Electrophilic MeV Bosons","authors":"Yu Cheng, Damiano F. G. Fiorillo, Chui-Fan Kong, Edoardo Vitagliano","score":3.7,"section":"new","rank":19,"parts":[0.0,0.07,0.11,0.0,0.0],"note":"Closest of your papers: [[2856850]] (coupling 0.02, 3 shared references). Closest network paper: [[3146899]] (coupling 0.04, 7 shared references).","abstract":"The years preceding a supernova (SN) can constrain new electrophilic bosons with MeV masses more than the explosion itself. Although cooler than SNe, the massive progenitors maintain consistently high temperatures much longer, injecting more particles whose decays to positrons contribute to the diffuse Galactic 511-keV emission. For dark photons, the increase is exacerbated by the lower plasma frequency compared to SNe, where MeV excitations are screened. We find preSNe bounds on dark photon couplings up to two orders of magnitude stronger than SNe for masses between 1 and 3~MeV, with similar improvements for other electrophilic species such as axion-like particles."},{"arxiv":"2611.05170","id":"3222863","title":"Constraining tau-sterile neutrino mixing with high-energy astrophysical neutrinos","authors":"Mauricio Bustamante, Qinrui Liu","score":3.5,"section":"new","rank":20,"parts":[0.0,0.03,0.17,0.0,0.0],"note":"Closest of your papers: [[2751074]] (coupling 0.01, 1 shared references). Closest network paper: [[3214448]] (coupling 0.06, 10 shared references).","abstract":"Whether a sterile neutrino mixes with the three active ones remains an open question. Its mixing with the tau neutrino, $|U_{τ4}|^2$, is the least constrained, since terrestrial experiments probe it only indirectly and over limited ranges of sterile-neutrino mass. We show that TeV-PeV astrophysical neutrinos probe it differently. Their sources make almost no $ν_τ$, but oscillations over cosmological distances turn about one third of them into $ν_τ$ before they reach Earth. Mixing with a sterile neutrino would make these $ν_τ$ scarcer, lowering the $ν_τ$ fraction that neutrino telescopes measure, whatever the sterile-neutrino mass. In contrast, sterile mixing with $ν_e$ or $ν_μ$ is nearly undetectable. Fitting the flavor composition measured by IceCube, with the composition at the sources left free, we find $|U_{τ4}|^2 < 0.88$ at 90% C.L. Combining IceCube with present and planned neutrino telescopes, including IceCube-Gen2 and HUNT, could lower this limit to 0.24-0.29 by 2040 and to 0.12-0.14 by 2050. By 2050, these limits would match some present terrestrial limits, though not the strongest."},{"arxiv":"2611.04981","id":"3222816","title":"Renormalization and Factorization Scale-Invariant Predictions for the $e^+e^-\\to J/ψ+η_c$ process at $B$ factories","authors":"Si-Qi Gong, Ting Sun, Sheng-Quan Wang, Jian-Ming Shen, Xu-Dong Huang, Xing-Gang Wu, Leonardo Di Giustino","score":3.0,"section":"new","rank":21,"parts":[0.06,0.01,0.04,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[3184726]] (coupling 0.00, 1 shared references). Closest network paper: [[1966767]] (coupling 0.01, 2 shared references).","abstract":"We perform a NNLO perturbative QCD analysis for exclusive double charmonium production $e^+e^-\\to J/ψ+η_c$ within the NRQCD factorization formalism using the Principle of Maximum Conformality (PMC). It is well known that this charmonium process suffers poor pQCD convergence, as well as large renormalization scale uncertainty. The PMC is used to remove conventional renormalization scale uncertainty. Based on two fundamental physical processes of charmonium, $J/ψ\\rightarrow e^+e^-$ and $η_c\\rightarrowγγ$, and using the NNLO perturbative results together with experimental measurements, we extract the factorization-scale-dependent long-distance matrix elements for $J/ψ$ and $η_c$. Combining these two matrix elements with the factorization-scale-dependent short-distance coefficient, we obtain predictions that are independent of the factorization scale for the $e^+e^-\\to J/ψ+η_c$ process. Our predictions agree with the measurement from the BaBar collaborations within errors. Remarkably, we provide a new way to eliminate conventional renormalization and factorization scale ambiguities for the $e^+e^-\\to J/ψ+η_c$ process. We further demonstrate that the slow convergence of the pQCD series is an intrinsic property of this double-charmonium process."},{"arxiv":"2611.04857","id":"3222799","title":"Electroweak corrections to the SM-like Higgs boson decays and the Higgs trilinear coupling in the real Higgs triplet model","authors":"Masashi Aiko, Shinya Kanemura, Mariko Kikuchi, Kodai Sakurai, Sora Taniguchi, Kei Yagyu","score":2.8,"section":"new","rank":22,"parts":[0.0,0.02,0.14,0.0,0.0],"note":"Closest of your papers: [[1365306]] (coupling 0.01, 1 shared references). Closest network paper: [[2133294]] (coupling 0.05, 5 shared references).","abstract":"We study new physics effects on the decays of the standard model-like Higgs boson ($h$) and the Higgs trilinear coupling including the full one-loop corrections in the real Higgs triplet model (RHTM). We adopt the on-shell renormalization scheme, in which the scalar mixing angles are renormalized in a gauge-independent way using the pinch technique. We found that sizable one-loop effects can arise in the decay rates through the Higgs wave-function (external-leg) corrections, while the tree-level effects are rather small due to the constraint on the vacuum expectation value of the triplet field from the electroweak precision measurements. In addition, the $h\\toγγ$ decay rate and the $hhh$ coupling are sensitive to loop contributions. The RHTM may be distinguishable from other extended Higgs models by studying the correlations among the $h\\toττ$, $h\\to ZZ^{*}$, and $h\\toγγ$ decay modes, and such characteristic predictions can be tested at the High-Luminosity LHC or future Higgs factories."},{"arxiv":"2611.03782","id":"3222456","title":"Toponium hadroproduction at next-to-next-to-leading order in NRQCD","authors":"Sven Yannick Klein, Fabio Maltoni, Hua-Sheng Shao, Lukas Simon, Guoxing Wang","score":2.4,"section":"new","rank":23,"parts":[0.0,0.04,0.09,0.0,0.0],"note":"Closest of your papers: [[3094526]] (coupling 0.01, 1 shared references). Closest network paper: [[3206672]] (coupling 0.03, 3 shared references).","abstract":"We present the first next-to-next-to-leading-order (NNLO) predictions for inclusive color-singlet toponium hadroproduction within NRQCD in the zero-width limit for the top quark. The central new result is the NNLO QCD correction to the short-distance coefficient for pseudoscalar toponium production. The predictions include electroweak and relativistic corrections, additional production channels, and perturbatively evaluated bound-state matrix elements. At the Large Hadron Collider proton-proton center-of-mass energy of $13\\,\\mathrm{TeV}$, we obtain a cross section of $4.87^{+0.63}_{-0.65}\\,\\mathrm{pb}$, with scale and parametric uncertainties combined. The NNLO corrections reduce the renormalization- and factorization-scale uncertainties by approximately a factor of four relative to NLO, to the few-percent level. The dominant remaining uncertainty arises from the Coulomb-scale dependence of the bound-state matrix elements."},{"arxiv":"2611.03671","id":"3222465","title":"Renormalisation of Hydrogen Partition Function and Saha Ionisation Equation","authors":"George Savvidy, Pengming Zhang","score":2.1,"section":"cross","rank":24,"parts":[0.0,0.0,0.14,0.0,0.0],"note":"Closest network paper: [[3164308]] (coupling 0.05, 2 shared references).","abstract":"An important physical quantity that is part of the Saha ionisation equation is the partition function of the neutral hydrogen atoms. An immense uncertainty is caused by the divergency of the neutral atom partition function arising due to the fast growing degeneracy factor of its excited n-state. We suggested a regularisation and renormalisation procedure for the partition function of the neutral hydrogen atoms. The renormalised partition function is well defined and allows to calculate the population of the energy levels and the ionisation state of the hydrogen plasma as a function of its temperature and pressure. In the low-temperature limit the behaviour of these functions smoothly transforms to the Saha equation, which is used in the description of the low-temperature plasma. At higher temperatures the renormalised ionisation equation describes the deviation from the Saha equation. The application of the renormalised ionisation equation to the solar core and atmosphere is considered."},{"arxiv":"2611.04267","id":"3222567","title":"Semiparametric Estimation of Physics Parameters and Parton Distribution Functions","authors":"Huanbiao Zhu, Jaco ter Hoeve, Mikael Kuusela, Maria Ubiali, Larry Wasserman","score":2.0,"section":"new","rank":25,"parts":[0.0,0.04,0.06,0.0,0.0],"note":"Closest of your papers: [[3094526]] (coupling 0.01, 1 shared references). Closest network paper: [[2864372]] (coupling 0.02, 1 shared references).","abstract":"The simultaneous determination of Parton Distribution Functions (PDFs) and fundamental physical parameters, e.g. the strong coupling constant $α_s$, the mass of the top quark $m_t$, or Wilson coefficients of an Effective Field Theory operators, is essential for the high-precision physics programme of the Large Hadron Collider. Yet, simultaneous global fits face significant methodological and computational challenges, rooted in the fundamental tension between estimating a finite-dimensional parameter and an infinite-dimensional function. In this paper, we address this problem by introducing a semiparametric estimation framework. The key advantage of our approach is that it avoids the need to refit the PDFs in the presence of either modified SM parameters or BSM contributions. Starting from standard, decoupled estimates of the PDFs and physics parameters, the method computes a bias correction a posteriori via the efficient influence function, yielding a debiased one-step estimator of the finite-dimensional parameter along with uncertainties with valid frequentist coverage. This correction rigorously accounts for the interplay between PDF and physics parameters without requiring a computationally expensive joint fit. As a proof of concept, we apply the method to two toy scenarios preparatory to a realistic global fit: the extraction of a dimension-six SMEFT Wilson coefficient from Deep Inelastic Scattering (DIS) pseudo-data based on BCDMS measurements, isolating the non-singlet PDF combination $T_3$, and to the determination of the proton total valence $V$ from combined HERA measurements. Our results demonstrate that the one-step estimator successfully removes the bias inherent in a preliminary, decoupled estimate and achieves confidence intervals with correct nominal coverage, offering a statistically rigorous and computationally efficient alternative to full simultaneous PDF fits."},{"arxiv":"2611.04014","id":"3222544","title":"Branching Fractions and CP-Violating Asymmetries in D => PP Decays","authors":"Franco Buccella, Pietro Santorelli","score":2.0,"section":"new","rank":26,"parts":[0.0,0.04,0.07,0.0,0.0],"note":"Closest of your papers: [[1692605]] (coupling 0.01, 1 shared references). Closest network paper: [[3214449]] (coupling 0.02, 1 shared references).","abstract":"We update an $SU(3)_F$ analysis of $D\\to PP$ decays ($P\\equiv π, K$) in which the dominant $SU(3)_F$-breaking effects are modeled through final-state interactions. The new fit improves the description relative to the previous parameter set, although significant global tension remains, mainly in charged-$D$ modes. Within the adopted rescattering model, the direct CP asymmetries in $D^0\\toπ^+π^-$, $K^+K^-$, $π^0π^0$, and $K_S^0 K_S^0$ depend on two additional reduced amplitudes. Using the $D^0\\toπ^+π^-$ and $D^0\\to K^+K^-$ asymmetries as inputs, we derive conditional predictions for the two neutral modes. The OZI-motivated benchmark $Δ_4=0$ is mildly disfavored by the charged-mode asymmetries and leads to substantially smaller asymmetries in the neutral modes, which can be tested with more precise $K_S^0K_S^0$ and $π^0π^0$ measurements."},{"arxiv":"2611.05098","id":"3222841","title":"Chiral anomalies in two dimensions","authors":"Clément Liesse, Cypris Plantier, Christopher Smith","score":1.9,"section":"new","rank":27,"parts":[0.0,0.0,0.13,0.0,0.0],"note":"Closest network paper: [[2946768]] (coupling 0.05, 4 shared references).","abstract":"Chiral anomalies offer a fundamental probe of the quantum structure of gauge theories and their underlying symmetries. In this paper, we introduce a framework to characterize the chiral anomaly in two dimensions directly at the diagrammatic level. To this end, we establish a consistent prescription for handling $γ^5$ in dimensional regularization at $d=2$. On this basis, we derive an expression for the fully generic chiral anomaly directly from the contributions of the bubble and triangle diagrams, either in the massless or massive case. Then, we show that the different forms of the anomaly can arise from appropriate choices of parameters directly at the level of this master expression. Overall, $d=2$ is shown to provide an excellent environment to investigate chiral anomalies at the amplitude level: Ward identities are demonstrated rigorously and to arbitrary order in the mass expansion without further approximation, resulting in an unprecedented degree of control on the anomaly."},{"arxiv":"2611.05362","id":"3222857","title":"Deconfinement Confined to the Heaviest Neutron Stars: Strange Quark Matter from a Flavor-Dressed Contact Interaction","authors":"Aftab Ahmad, Noreen Akhter, Alfredo Raya","score":1.6,"section":"new","rank":28,"parts":[0.0,0.02,0.06,0.0,0.0],"note":"Closest of your papers: [[2787890]] (coupling 0.01, 1 shared references). Closest network paper: [[2051205]] (coupling 0.02, 2 shared references).","abstract":"We study cold, electrically neutral, beta-equilibrated quark matter with u, d, and s quarks described by a symmetry-preserving contact interaction whose parameters are fixed in vacuum. The vector repulsion is varied as a fraction 0 < eta < 3/2 of the scalar coupling, and results are given with and without the flavor dressing of the effective coupling. Pure quark matter is not self-bound in this model, and no value of eta produces a star that reaches two solar masses while satisfying the tidal constraint from GW170817; the heaviest configurations owe their mass to an envelope of constituent quarks. We then construct hybrid stars with a relativistic mean-field hadronic phase fitted to GM1 saturation properties, using both Maxwell and Gibbs constructions and a deconfinement bag shift. Tying deconfinement to chiral restoration and requiring a continuous pressure yields an upper bound on this shift. Within that bound, quark matter appears inside stable stars only for eta < 1/2, never below about 4 n0, and only in stars bet     <div class="links">${n.id?`<a href="https://inspirehep.net/literature/${n.id}" target="_blank" rel="noopener">INSPIRE</a>`:''}<a href="https://arxiv.org/abs/${esc(n.arxiv)}" target="_blank" rel="noopener">arXiv</a><a href="https://arxiv.org/pdf/${esc(n.arxiv)}" target="_blank" rel="noopener">PDF</a></div></li>`).join('');
  more.addEventListener('toggle',()=>{if(more.open)tex(box)})}
const rtip=document.getElementById('reftip');let rcur=null;
function refShow(el){const r=REFS[el.dataset.ref];if(!r)return;rcur=el;rtip.textContent=`${auth(r)} (${r.year}) — ${plain(r.title)}`;rtip.hidden=false;
  const b=el.getBoundingClientRect(),t=rtip.getBoundingClientRect();let L=Math.min(Math.max(8,b.left),innerWidth-t.width-8),T=b.bottom+6;
  if(T+t.height>innerHeight-8)T=b.top-t.height-6;rtip.style.left=L+'px';rtip.style.top=T+'px'}
function refHide(){rtip.hidden=true;rcur=null}
document.addEventListener('pointerover',e=>{const el=e.target.closest('.ref');if(el&&e.pointerType==='mouse')refShow(el)});
document.addEventListener('pointerout',e=>{if(e.target.closest('.ref')&&e.pointerType==='mouse')refHide()});
document.addEventListener('click',e=>{const el=e.target.closest('.ref');if(el)refShow(el);else if(rcur)refHide()});
document.addEventListener('focusin',e=>{const el=e.target.closest('.ref');if(el)refShow(el)});
document.addEventListener('focusout',e=>{if(e.target.closest('.ref'))refHide()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')refHide()});
addEventListener('scroll',()=>{if(rcur)refHide()},{passive:true});
list();nextList();fold();draw();panel();
window.addEventListener('load',()=>{tex(document.getElementById('list'));tex(document.getElementById('panel'));fold();
  if(window.MathJax&&MathJax.startup&&MathJax.startup.promise)MathJax.startup.promise.then(()=>setTimeout(fold,300))});
addEventListener('resize',()=>{clearTimeout(window._ft);window._ft=setTimeout(fold,200)});
</script>
