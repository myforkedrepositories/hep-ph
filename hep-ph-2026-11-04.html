<script>
const RAW = {"n":[{"id":"3158114","arxiv":"2605.21477","title":"Opening the Window of Ultra-Light PBHs by Exorcising the Poltergeist","first":"Gouttenoire","nauth":3,"year":2026,"cites":0,"role":"repl","note":"Cites 5 network papers: [[3081453]], [[3125346]], [[2846370]], [[2829767]], [[2612899]]. Closest of your papers: [[2826987]] (coupling 0.12, 21 shared references). Closest network paper: [[3158142]] (coupling 0.43, 84 shared references). Shared topics: evaporation of primordial black hole, primordial black hole.","score":67.8,"rank":1,"section":"replacement","parts":[0.95,0.4,1,0.0,0.75],"abstract":"The hot Big Bang may have emerged from evaporation of primordial black holes (PBHs) lighter than $10^9$g. Standard monochromatic treatments predict nearly simultaneous evaporation, abrupt reheating, and a large Poltergeist scalar-induced gravitational wave signal. We confront this expectation with the irreducible collapse mass tail predicted by general relativity, $df_{\\rm PBH}/d\\ln M\\propto M^{3.78}$, which smooths reheating, suppresses the signal by orders of magnitude, and reopens the ultra-light PBH window.","authors":"Yann Gouttenoire, Nicholas Leister, Pedro Schwaller","nlinked":88,"nref":90,"src":"INSPIRE","html":true},{"id":"3222533","arxiv":"2611.04136","title":"Revisiting the gamma-ray signal from light ALPs emitted during the evaporation of memory-burdened PBHs","first":"Jiang","nauth":2,"year":2026,"cites":0,"role":"today","note":"Cites 10 network papers: [[3115426]], [[3141847]], [[3076216]], [[2181757]], [[1894389]], [[2935598]]…. Closest of your papers: [[2826987]] (coupling 0.06, 15 shared references). Closest network paper: [[3076216]] (coupling 0.14, 16 shared references). Shared topics: evaporation of primordial black hole, detection prospect, primordial black hole.","score":55.8,"rank":2,"section":"new","parts":[1.0,0.21,0.41,0.0,0.85],"abstract":"The memory-burden effect was recently proposed to take into account the information back-reaction in the evaporation of primordial black holes (PBHs). In this work, we systematically explore the axion-like particle (ALP) production via the evaporation of memory-burdened PBHs and the subsequent ALP-photon conversion in cosmic magnetic fields. The PBH evaporation progress is divided in the semiclassical phase of Hawking radiation and the quantum memory-burden phase. The time evolution of PBH mass and the gamma-ray flux after the conversion of PBH-emitted ALP are then evaluated by considering the memory-burden induced PBH entropy suppression. Furthermore, we investigate the detection prospects of this evaporation-conversion signal in next-generation satellite telescopes, including AMEGO, e-ASTROGAM and MAST. The detectable PBH mass range is extended down to masses much smaller than $10^{15}$ g. Applying the Fisher forecasting method, we derive the projected sensitivity for PBH fraction $f_{\\rm PBH}$ and ALP-photon coupling $g_{aγγ}$.","authors":"Cheng-Rui Jiang, Tong Li","nlinked":97,"nref":101,"src":"INSPIRE","html":true},{"id":"3145848","arxiv":"2604.15006","title":"Cosmology of Inelastic Self-Interacting Dark Matter: Linear Evolution and Observational Constraints","first":"Duan","nauth":3,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[1992028]]. Closest of your papers: [[1824064]] (coupling 0.05, 7 shared references). Closest network paper: [[3214429]] (coupling 0.15, 43 shared references). Shared topics: dark matter mass, dark sector, dark matter.","score":32.0,"rank":3,"section":"replacement","parts":[0.45,0.16,0.44,0.0,0.5],"abstract":"We study the linear cosmological evolution of inelastic self-interacting dark matter in a two-component dark sector with a small mass splitting, assuming thermal initial conditions for the two species. We derive the coupled background and perturbation equations for inelastic conversion between the two species, considering both power-law and low-velocity saturation cross sections. Exothermic conversion injects kinetic energy into the light component, generating pressure support that suppresses small-scale structure and produces dark acoustic oscillations in the matter power spectrum. The resulting cutoff at scale $k > 1\\,h\\,\\mathrm{Mpc}^{-1}$ depends on the normalization and velocity dependence of the cross section, the dark matter mass and the mass splitting. Using linear power spectra computed with a modified Boltzmann solver, we apply recast constraints from Lyman-$α$ forest data and high-redshift UV luminosity functions, finding non-monotonic but closed exclusion regions driven by the competition between efficient conversion and rapid depletion of the heavy component. These results show that the internal thermodynamics of a secluded multi-component dark sector can leave observable imprints on structure formation, providing a complementary probe of secluded dark matter.","authors":"Xin-Chen Duan, Yue-Lin Sming Tsai, Ziwei Wang","nlinked":87,"nref":88,"src":"INSPIRE","html":true},{"id":"3222490","arxiv":"2611.03793","title":"Gaia's dark partners: A new signature of dissipative dark matter","first":"Bhalla","nauth":6,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[2795517]]. Closest of your papers: [[1832796]] (coupling 0.01, 4 shared references). Closest network paper: [[3214429]] (coupling 0.06, 21 shared references). Shared topics: dark sector, dark matter.","score":22.5,"rank":4,"section":"cross","parts":[0.45,0.04,0.18,0.0,0.28],"abstract":"The Gaia mission has greatly improved our understanding of the stellar binary population. Beyond providing an extensive catalog of binary systems with two luminous stars, Gaia has also discovered several systems that appear to be star--black hole (BH) binaries. One of the leading candidate formation channels for these systems is dynamical exchange, in which one component of a star--star binary is ejected from the system and replaced by a BH. Exchange processes are very sensitive to the velocity distribution of the incoming objects, and become very efficient in the limit that perturbers are slow, so the exchanged binary population is a sensitive probe of slow-moving objects. A population of slow-moving, nonluminous objects is naturally produced in dissipative dark matter (DDM) scenarios, where a subcomponent of dark matter can cool to form a dark disk and dark compact objects (DCOs), including but not limited to BHs, with a small velocity dispersion. In this work, we evaluate the rate at which DCOs formed by DDM exchange into star--star binaries to form star--DCO binaries. We find that in a wide range of parameter space, even under conservative assumptions, the rate of exchange interactions is sufficient to produce the objects that Gaia has observed to date. In some portions of parameter space, the predicted exchange rate is well in excess of the rate estimated from observations. We point out the potential for competitive constraints on the DDM parameter space with current and future data, making the Gaia mission an important testbed for dark sector cooling.","authors":"Badal Bhalla, David Dunsky, Akshay Ghalsasi, Benjamin V. Lehmann, Jackie Lodman, Kuver Sinha","nlinked":126,"nref":155,"src":"INSPIRE","html":true},{"id":"3133782","arxiv":"2603.22647","title":"Dark graviton sensing with magnetically levitated superconductors","first":"Danieli","nauth":3,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[2051205]]. Closest of your papers: [[3130296]] (coupling 0.01, 1 shared references). Closest network paper: [[2051205]] (coupling 0.06, 4 shared references). Shared topics: dark matter.","score":20.6,"rank":5,"section":"replacement","parts":[0.45,0.02,0.18,0.0,0.15],"abstract":"Levitated sensors have emerged as a new frontier to detect ultra-light dark matter such as axion-like particles and dark photons. In this work we study how a magnetically levitated superconductor responds to a spin-2 dark matter field, the dark graviton, in the dHz to kHz frequency range. To do so, we compute the forces that the dark graviton exerts on the superconductor, separately for matter and light couplings. The matter coupling produces a strain-like tidal acceleration between the superconductor and the centre of mass of the rigid apparatus, resulting in a displacement relative to the readout pick-up loop, in a way analogous to the response to a slow, continuous, massive gravitational wave. The light coupling instead induces an effective current that sources an oscillating magnetic field, thus driving the superdiamagnetic response of the superconductor. We find that, albeit with significant experimental improvements, the sensitivity reach for the matter coupling could surpass existing fifth-force experiments in the audio frequency band. At the same time, magnetically levitated superconductors could be among the most sensitive laboratory probes of the dark-graviton coupling to electromagnetism, especially at low frequencies, provided technical and readout noise can be kept under control.","authors":"Valentina Danieli, Paola C. M. Delgado, Federico R. Urban","nlinked":49,"nref":51,"src":"INSPIRE","html":true},{"id":"3222565","arxiv":"2611.04237","title":"Observable gravitational waves from unstable ALP catastrogenesis","first":"Gelmini","nauth":3,"year":2026,"cites":0,"role":"today","note":"Also cites widely used network papers: [[1783234]]. Closest of your papers: [[1941263]] (coupling 0.10, 18 shared references). Closest network paper: [[1615480]] (coupling 0.12, 15 shared references).","score":16.1,"rank":6,"section":"new","parts":[0.06,0.29,0.35,0.0,0.02],"abstract":"We focus on gravitational waves (GWs) observable in pulsar timing array and interferometric searches that are produced by the annihilation of cosmic string-wall networks in axion-like particle (ALP) models. We called this process \"catastrogenesis.\" It produces GWs with a characteristic peaked spectrum. These GWs would not be observable if the ALPs were stable. We thus assume that ALPs decay into two photons before Big-Bang nucleosynthesis (BBN). The large ALP-photon coupling required could induce field dissipation and friction on cosmic walls through interactions with the radiation background. We study the conditions under which these effects are negligible and map the parameter regions yielding observable GW signals onto the usual ALP mass-coupling parameter space. We find that, in these regions, ALPs dominate the energy density of the Universe before they decay, leading to a period of intermediate matter domination, which would leave a clear imprint on the GW spectrum.","authors":"Graciela B. Gelmini, Jonah Hyman, Yu Watanabe","nlinked":100,"nref":107,"src":"INSPIRE","html":true},{"id":"3222489","arxiv":"2611.03904","title":"Constraints on a Long-Lived X17 Vector Boson with FASER","first":"Collaboration","nauth":136,"year":2026,"cites":0,"role":"today","note":"Co-authors of yours: Xu. Closest of your papers: [[3130296]] (coupling 0.03, 3 shared references). Closest network paper: [[3115042]] (coupling 0.20, 14 shared references).","score":15.8,"rank":7,"section":"cross","parts":[0.0,0.08,0.56,0.5,0.0],"abstract":"The ATOMKI anomalies motivate the possibility of a new particle, the X17, with a mass of 17 MeV and weak couplings to nuclei and electrons. Such a particle may be produced at the LHC, travel 480 m in the far-forward direction, and decay to $e^+e^-$ in FASER. In this paper, previous FASER searches for dark photons and axion-like particles (ALPs) are combined and interpreted as searches for a candidate X17 particle, the protophobic vector boson. The searches use data collected from $pp$ collisions at $\\sqrt{s} = 13.6$ TeV in LHC Run 3 from 2022 for the dark photon search and from 2022-2023 for the ALP search. No excess events are found above the expected background, and the combined null results exclude a previously-unconstrained \"low-coupling window\" with electron coupling $6 \\times 10^{-5} < ε_e < 1.2 \\times 10^{-4}$. A \"high-coupling window\" remains.","authors":" FASER Collaboration, Roshan Mammen Abraham, Xiaocong Ai, Saul Alonso Monsalve, John Anders, Emma Kate Anderson, Akitaka Ariga, Tomoko Ariga, Jeremy Atkinson, Florian U. Bernlochner, Jianming Bian, Tobias Boeckh, Eliot Bornand, Jamie Boyd, Lydia Brenner, Angela Burger, Franck Cadoux, Haichuan Cao, Roberto Cardella, David W. Casper, Charlotte Cavanagh, Shiyang Chen, Xin Chen, Xing Cheng, Dhruv Chouhan, Emily Chown, Andrea Coccaro, Fabio Cufino, Stephane Débieux, Ansh Desai, Sergey Dmitrievsky, Radu Dobre, Monica D'Onofrio, Sinead Eley, Yannick Favre, Jonathan L. Feng, Carlo Alberto Fenoglio, Didier Ferrere, Max Fieg, Wissal Filali, Elena Firu, Haruhi Fujimori, Edward Galantay, Ali Garabaglu, Stephen Gibson, Sergio Gonzalez-Sevilla, Yuri Gornushkin, Yotam Granov, Jinjing Gu, Carl Gwilliam, Elie Hammou, Daiki Hayakawa, Michael Holzbock, Shih-Chieh Hsu, Zhen Hu, Giuseppe Iacobucci, Tomohiro Inada, Luca Iodice, Sune Jakobsen, Cesar Jesus-Valls, Arash Jofrehei, Hans Joos, Enrique Kajomovitz, Hiroaki Kawahara, Alex Keyken, Felix Kling, Daniela Köck, Pantelis Kontaxakis, Jelle Koorn, Umut Kose, Peter Krack, Susanne Kuehn, Thanushan Kugathasan, Sebastian Laudage, Lorne Levinson, Botao Li, Jiaxi Liu, Yi Liu, Joern Mahlstedt, Toni Mäkelä, Yasuhiro Maruya, Anna Mascellani, Lawson McCoy, Josh McFayden, Andrea Pizarro Medina, Hiroaki Menjo, Théo Moretti, Toshiyuki Nakano, Laurie Nevay, Ken Ohashi, Hidetoshi Otono, Lorenzo Paolozzi, Annabelle Parry, Pawan Pawan, Brian Petersen, Titi Preda, Markus Prim, Junkai Qin, Michaela Queitsch-Maitland, Juan Rojo, Hiroki Rokujo, André Rubbia, Jorge Sabater-Iglesias, Osamu Sato, Paola Scampoli, Kristof Schmieden, Matthias Schott, Cristiano Sebastiani, Anna Sfyrla, Davide Sgalaberna, Mansoora Shamim, Yosuke Takubo, Kakeru Tanaka, Simon Thor, Eric Torrence, Serhan Tufanli, Oscar Ivan Valdes Martinez, Svetlana Vasina, Emanuele Villa, Benedikt Vormwald, Chi Wang, Yuxiao Wang, Eli Welch, Aaron White, Monika Wielers, Benjamin James Wilson, Zhongyi Wu, Yue Xu, Heng Yang, Lekai Yao, Daichi Yoshikawa, Stefano Zambito, Shunliang Zhang, Yuxuan Zhang, Xingyu Zhao, Zijian Zhao","nlinked":52,"nref":56,"src":"INSPIRE","html":true},{"id":"3175093","arxiv":"2606.31476","title":"Landau-Zener formula and resonant axion conversion in neutron star magnetospheres","first":"Heikinheimo","nauth":3,"year":2026,"cites":0,"role":"repl","note":"Also cites widely used network papers: [[1783234]]. Closest of your papers: [[1941263]] (coupling 0.09, 12 shared references). Closest network paper: [[2691930]] (coupling 0.12, 14 shared references).","score":15.6,"rank":8,"section":"replacement","parts":[0.06,0.28,0.35,0.0,0.0],"abstract":"We investigate the Landau-Zener description of resonant axion-photon conversion in neutron star magnetospheres. We find that this picture often fails for axion conversions to millimeter-to-optical band photons due to the characteristic resonance width exceeding the size of the conversion region. This comparison of scales yields a simple criterion for evaluating the validity of the Landau-Zener formula. We verify this criterion numerically, and show that when invalid, the Landau-Zener conversion probability may significantly deviate from the numerical result. In light of these findings, we revise constraints on axions from neutron star optical-band polarization searches.","authors":"Matti Heikinheimo, Topi Sirkiä, Kimmo Tuominen","nlinked":52,"nref":57,"src":"INSPIRE","html":true},{"id":"3222513","arxiv":"2611.03893","title":"Searching for Long-Lived Dark Scalars with MAPP-1 and MAPP-2 at the HL-LHC","first":"Arifeen","nauth":4,"year":2026,"cites":0,"role":"today","note":"Also cites widely used network papers: [[2817040]], [[1518747]]. Closest of your papers: [[3146383]] (coupling 0.05, 8 shared references). Closest network paper: [[3084653]] (coupling 0.11, 26 shared references). Shared topics: dark sector.","score":15.4,"rank":9,"section":"new","parts":[0.11,0.17,0.31,0.0,0.17],"abstract":"Feebly interacting particles (FIPs) arise generically in dark-sector extensions of the Standard Model (SM). Among the simplest and most theoretically motivated such candidates is a dark scalar that mixes with the SM Higgs boson, acting as a mediator between the dark sector and the SM. For sufficiently small mixing, such a dark scalar manifests at collider experiments as a long-lived particle with a macroscopic decay length---a signature to which conventional general-purpose detectors have limited sensitivity. The MoEDAL-MAPP experiment is a dedicated search facility at the Large Hadron Collider (LHC) targeting long-lived FIPs as avatars of physics beyond the SM. We present $95\\%$ confidence-level background-free sensitivity projections for the MAPP-1 and MAPP-2 detectors at the High-Luminosity LHC to Higgs-portal dark scalars produced via rare $B$-meson decays and exotic Higgs boson decays. Our results establish the proposed MAPP-2 detector as a complementary probe of feebly-coupled dark scalars, with sensitivity to lifetimes beyond the reach of existing collider searches.","authors":"Shafakat Arifeen, James Pinfold, Pierre-Philippe A. Ouimet, Michael Staelens","nlinked":66,"nref":72,"src":"INSPIRE","html":true},{"id":"3138575","arxiv":"2604.00107","title":"Full positivity bounds for anomalous quartic gauge couplings in SMEFT","first":"Chang","nauth":3,"year":2026,"cites":0,"role":"repl","note":"Closest network paper: [[3092194]] (coupling 0.23, 30 shared references). Shared topics: viable parameter space.","score":13.3,"rank":10,"section":"replacement","parts":[0.0,0.0,0.65,0.0,0.36],"abstract":"Electroweak boson scattering at the LHC provides a crucial avenue for probing physics beyond the Standard Model, particularly regarding deviations in quartic gauge couplings. We derive the complete set of positivity bounds for the $22$ dimension-$8$ anomalous quartic gauge coupling (aQGC) coefficients within the Standard Model Effective Field Theory (SMEFT). Moving beyond previous studies limited to transverse vector bosons, our analysis incorporates all electroweak boson modes, explicitly constructing the extremal rays (ERs) of the positivity cone through a group theoretic framework. We utilize two independent methods--direct construction and Casimir operator analysis--to determine these rays, addressing complexities such as parity-violating operators and continuous parameter degeneracies. Our results indicate that the positivity bounds impose severe constraints, restricting the physically viable parameter space to approximately $0.05255\\%$ of the naive total space. Furthermore, we derive linear analytical bounds for various operator combinations and provide an easy-to-use Python package, {\\tt SMEFTaQGC}, which implements algorithms to numerically verify positivity and compute the optimized positivity bounds for general aQGC configurations.","authors":"Fu-Ming Chang, Zhuo-Yan Chen, Shuang-Yong Zhou","nlinked":115,"nref":118,"src":"INSPIRE","html":true},{"id":"3222604","arxiv":"2611.04600","title":"Light Mediators at the Neutrino-Dark Matter Frontier: Coherent Scattering, Precision Constraints, and Complementary Searches","first":"Serao","nauth":2,"year":2026,"cites":0,"role":"today","note":"Closest of your papers: [[3130296]] (coupling 0.04, 6 shared references). Closest network paper: [[3095306]] (coupling 0.14, 10 shared references). Shared topics: direct detection, dark matter.","score":12.1,"rank":11,"section":"new","parts":[0.0,0.11,0.4,0.0,0.3],"abstract":"Low-threshold neutrino and dark-matter experiments constrain light mediators through different momentum transfers, targets, and coupling combinations. We examine scalar and vector interactions in coherent neutrino--nucleus scattering, neutrino--electron scattering, and dark-matter direct detection. Three representative interaction models are used to compare recoil spectra and coupling degeneracies. For $^{73}\\mathrm{Ge}$ and $^{131}\\mathrm{Xe}$, the nuclear-charge response matrix has a condition number of approximately 115, so two different targets may still leave nearly parallel blind directions. An analytic profile-likelihood calculation shows how spectral overlap and uncertainties in neutrino interactions affect dark-matter discovery sensitivity in the neutrino fog. We discuss the implications of measurements from COHERENT, CONUS+, LZ, XENONnT, and PandaX-4T and specify which theoretical inputs, detector responses, and statistical correlations are needed to combine their constraints. keyword : coherent elastic neutrino-nucleus scattering; light mediators; neutrino--electron scattering; dark matter direct detection; non-standard interactions; solar neutrinos; complementarity","authors":"Raoul Serao, Mohamed Ouchemhou","nlinked":60,"nref":77,"src":"INSPIRE","html":true},{"id":"3138503","arxiv":"2604.00866","title":"Signatures of Long-Lived Heavy Neutral Leptons from Neutrinophilic Charged Higgs Pair Production at the LHC","first":"Okada","nauth":3,"year":2026,"cites":0,"role":"repl","note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1854224]] (coupling 0.05, 4 shared references). Closest network paper: [[1508494]] (coupling 0.13, 20 shared references).","score":12.0,"rank":12,"section":"replacement","parts":[0.06,0.15,0.37,0.0,0.01],"abstract":"In the neutrinophilic Higgs doublet framework, the neutrino Dirac Yukawa couplings can be sizable because of the small vacuum expection value of the extra Higgs doublet, even for a low seesaw scale. Due to this structure, the neutrinophilic charged Higgs bosons, once created, decay dominantly into heavy neutral leptons (HNLs) and charged leptons. This is a new mechanism to produce a gauge singlet HNL without suppressed cross sections. In the standard seesaw, one HNL can be long-lived, when the lightest neutrino is sufficiently light. We investigate displaced vertex signatures of the long-lived HNLs produced from the decays of the charged Higgs pair at the high luminosity LHC. We consider one displaced vertex as well as two displaced vertices signatures and perform a dedicated simulation to identify the displaced leptons. We find that high statistical significance can be achieved for the observation of one displaced vertex for charged Higgs pair production cross section $>\\mathcal{O}(1)$ fb. On the other hand, the observation of two displaced vertices is challenging, particularly for charged Higgs pair production cross section below $\\mathcal{O}(10)$ fb.","authors":"Nobuchika Okada, Prasenjit Sanyal, Ravindra Kumar Verma","nlinked":68,"nref":68,"src":"INSPIRE","html":true},{"id":"3164252","arxiv":"2606.00176","title":"Eigenvalue formulation of Stochastic Inflation and application to large perturbation generating inflationary features","first":"Mishra","nauth":3,"year":2026,"cites":0,"role":"repl","note":"Closest of your papers: [[2826987]] (coupling 0.04, 10 shared references). Closest network paper: [[2840581]] (coupling 0.11, 21 shared references). Shared topics: primordial black hole.","score":11.5,"rank":13,"section":"replacement","parts":[0.0,0.12,0.31,0.0,0.31],"abstract":"Stochastic inflation is a powerful technique for calculating the probability distribution function (PDF) of large inflationary perturbations, which may collapse to form Primordial Black Holes. The PDF, $P({\\cal N})$, of the stochastic number of e-folds, ${\\cal N}$, satisfies an adjoint Fokker-Planck Equation. We develop a new self-contained eigenvalue technique which can be used to determine $P({\\cal N})$. First we apply this method to the simple case of quantum diffusion along a flat potential without any classical drift. We recover the expression for the PDF that has previously been found using characteristic functions, with an exponential tail, and a power-law behaviour, $P({\\cal N}) \\propto {\\cal N}^{-3/2}$, in the intermediate regime between the peak and the tail of the PDF. Finally we apply the method to constant drift inflation, in the narrow- and broad-well limits. In the narrow-well limit, there is an analytic solution and the PDF is similar to the drift-free case, with a mildly suppressed tail. In the broad-well limit, determining the full set of eigenvalues and eigenfunctions requires a piecewise construction of the spectrum, and the broad-well PDF is qualitatively different, with an enhanced peak and a strongly suppressed tail.","authors":"Swagat S. Mishra, Edmund J. Copeland, Anne M. Green","nlinked":96,"nref":113,"src":"INSPIRE","html":true},{"id":"3222486","arxiv":"2611.03794","title":"Shortcomings of the squark simplified model","first":"Agashe","nauth":5,"year":2026,"cites":0,"role":"today","note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1394206]] (coupling 0.05, 3 shared references). Closest network paper: [[2744388]] (coupling 0.09, 13 shared references).","score":10.9,"rank":14,"section":"new","parts":[0.06,0.17,0.26,0.0,0.0],"abstract":"We argue that the squark simplified model commonly used in collider analyses fails to represent realistic low-energy supersymmetric models and significantly underestimates squark production rates at hadron colliders. This has important implications for extracting squark mass limits at the LHC and assessing the potential reach of HL-LHC or the FCC-hh. In particular, we find that the current LHC squark mass limit is realistically in the range of 2.6-3.0 TeV, rather than the 1.7-1.8 TeV range that is typically quoted based on the simplified model.","authors":"Kaustubh Agashe, Roberto Franceschini, Gian F. Giudice, Andre Lessa, Xing Wang","nlinked":32,"nref":39,"src":"INSPIRE","html":true},{"id":"3222488","arxiv":"2611.03802","title":"A full chemical network treatment of supermassive black hole seed formation from dark matter annihilation or decay","first":"Wu","nauth":3,"year":2026,"cites":0,"role":"today","note":"Closest of your papers: [[2964960]] (coupling 0.02, 2 shared references). Closest network paper: [[2725313]] (coupling 0.09, 12 shared references). Shared topics: mass below, dark matter.","score":10.4,"rank":15,"section":"cross","parts":[0.0,0.05,0.25,0.0,0.5],"abstract":"The recent discoveries of high-redshift quasars at $z\\sim6-10.1$ present a challenge to conventional supermassive black hole (SMBH) formation scenarios: their central SMBHs are too large to have grown from early stellar remnants, even under efficient super-Eddington accretion. An alternative approach is the direct collapse of primordial, dust- and metal-free gas clouds into black hole seeds as early as $z\\sim20$. To prevent fragmentation from highly efficient molecular hydrogen cooling and allow such a collapse, a strong flux of UV photons is required to photodissociate molecular hydrogen, suppressing star formation. We investigate whether the decay or annihilation of dark matter with masses below $\\sim200$ eV can produce sufficient UV radiation, both from the cosmological background and within early dark matter halos. Using thermal simulations of a one-zone primordial gas cloud model with the Grackle chemistry and cooling library, we map the resulting gas behavior across a range of dark matter lifetimes, cross sections, and masses. From this, we determine regions of parameter space where direct collapse into an SMBH is possible and the corresponding maximum halo mass required.","authors":"Han Wu, Sarah Schon, Aaron C. Vincent","nlinked":78,"nref":96,"src":"INSPIRE","html":true},{"id":"2921232","arxiv":"2505.09153","title":"Neutrino fluence influenced by memory burdened primordial black holes","first":"Chaudhuri","nauth":3,"year":2025,"cites":12,"role":"other","note":"","score":null},{"id":"2780809","arxiv":"2404.16815","title":"Quantum effects on the evaporation of PBHs: contributions to dark matter","first":"Haque","nauth":4,"year":2024,"cites":55,"role":"other","note":"","score":null},{"id":"2935598","arxiv":"2506.13861","title":"The f "CMB Spectral Distortions from Resonant Conversions in Atomic Dark Sectors","authors":"Duncan K. Adams, Jared Barron, Bryce Cyr, Xiuyuan Zhang","score":9.3,"section":"replacement","rank":16,"parts":[0.0,0.13,0.24,0.0,0.17],"note":"Closest of your papers: [[2663002]] (coupling 0.04, 6 shared references). Closest network paper: [[3081871]] (coupling 0.08, 11 shared references). Shared topics: dark sector.","abstract":"Dark sectors consisting of atomic constituents (electrons, protons, and photons) offer a well-motivated extension to the Standard Model while providing multiple avenues for phenomenological study. In this work, we explore the impact of conversions between the dark and Standard Model photons in the primordial CMB spectral distortion epoch ($10^3 \\lesssim z \\lesssim 10^6$). These conversions are resonantly enhanced when the induced thermal masses of both photonic species are equal, thus leading to the possibility that sizeable distortions can be produced. To this end, we solve the Boltzmann equation at early times to determine the (irreducible) freeze-in or freeze-out abundance of dark photons. This procedure also allows us to update the limits on generic milli-charged dark sectors using the ACT DR6 bound on the number of effective radiative degrees of freedom ($N_{\\rm eff}$). By then modeling the evolution of the thermal masses in both sectors, we compute the primordial CMB distortion using the Landau-Zener formalism. We find that when the dark electron and proton are roughly similar in mass (the positronium limit), current spectral distortion data from the COBE/FIRAS instrument is able to rule out novel regions of parameter space. We also forecast bounds from the proposed FOSSIL satellite, finding that spectral distortions can also be used to probe the ultra-low dark electric charge regions of parameter space, which are difficult to investigate by other means."},{"arxiv":"2506.09103","id":"2933346","title":"The Primakoff effect: The Axion-Photon Mixing in the Context of Stellar Plasma Physics","authors":"Bernard Teles de Menezes","score":8.9,"section":"replacement","rank":17,"parts":[0.0,0.11,0.2,0.0,0.28],"note":"Closest of your papers: [[1941263]] (coupling 0.03, 3 shared references). Closest network paper: [[2969908]] (coupling 0.07, 4 shared references). Shared topics: dark sector, dark matter.","abstract":"We propose in this work the study of the production of axions in stellar plasma medium through an external magnetic field. In the background field approximation, we can show that the presence of the external magnetic field induces a mixing between the photon and the axion, i.e. the so called Primakoff effect. Since the axion is one of the greatest candidates for dark matter, for being a neutral pseudo-scalar field, the Primakoff process constitutes a mechanism (or portal) to access the dark sector, which in turn provides us new perspectives beyond the standard model. In the high energies limit, observables like probabilities transitions and particles production rates were computed."},{"arxiv":"2608.14269","id":"3191293","title":"Nonstandard Solution for Anomaly Cancellation as Seesaw Neutrino Origin in the SM","authors":"Zi-Yue Zou, Chia-Wei Liu, Zhong-Lv Huang, Xiao-Gang He","score":8.4,"section":"replacement","rank":18,"parts":[0.0,0.11,0.18,0.0,0.24],"note":"Closest of your papers: [[731108]] (coupling 0.03, 2 shared references). Closest network paper: [[1966767]] (coupling 0.06, 10 shared references). Shared topics: minimal model.","abstract":"For fixed Standard Model (SM) non-Abelian representations of 15 chiral fermions with arbitrary hypercharges, anomaly cancellation admits the usual assignment and a distinct nonstandard solution. In the latter, the exotic quark and lepton weak doublets and exotic lepton singlet have zero hypercharge, whereas the two exotic quark singlets carry opposite hypercharges $-q$ and $q$. The neutral exotic lepton singlets naturally provide heavy neutrinos. With two copies, the minimal model realizes the minimal type-I seesaw, yielding one massless active neutrino, and predicts $m_{ββ}=1.2$--$4.1$ meV for normal ordering and $15.9$--$48.9$ meV for inverted ordering. In a direct SM realization, generating exotic-quark masses through the SM Higgs mechanism fixes their electric charges to $\\pm 1/2$. A separate $SU(2)_{L'}$ realization of the nonstandard solution can allow exotic-quark masses ranging from several TeV to 10 TeV with order-one Yukawa couplings while all charged exotic particles carry charges $\\pm q$. In both cases, the lightest exotic quark and lepton are generically stable, providing distinctive and potentially testable signatures while remaining compatible with current constraints."},{"arxiv":"2611.03783","id":"3222464","title":"GUT Color-Triplet Around the Corner: The Story of an Overlooked Lightness","authors":"Gia Dvali, Manuel Ettengruber, Anna Jankowsky, Tongxuan Zhang","score":8.2,"section":"new","rank":19,"parts":[0.0,0.06,0.42,0.0,0.0],"note":"Closest of your papers: [[1663960]] (coupling 0.02, 1 shared references). Closest network paper: [[2936613]] (coupling 0.15, 10 shared references).","abstract":"In traditional approach to the doublet-triplet splitting problem in grand unified theories (GUTs) it is assumed that color-triplet partner of the Higgs doublet must be superheavy in order not to mediate proton decay. However, it has been proposed [1] that the splitting, instead of the mass sector, can occur among the Yukawa couplings. In this scenario the color-triplet emerges as a long-lived $T$-particle with the mass around the TeV scale. This framework provides a direct low-energy window into GUT physics. In the present paper, we study an explicit supersymmetric $SO(10)$ GUT which realizes this mechanism, including effects of gravity-mediated supersymmetry breaking. We show how the shift of the heavy fields, triggered by supersymmetry-breaking, generates a tiny coupling between the $T$-particle and the Standard Model fields and explore the resulting phenomenology. Depending on the order of gravitino mass in which the coupling emerges, the lifetime of the $T$-particle is either around a second or exceeds the age of the Universe. In our analysis, we validate some earlier constraints on (super)gravity vacua imposed by the $S$-matrix: based on the Goldstino Argument, we show that none of the GUT vacua have positive energy densities, whereas the Minkowski vacua are safe against tunneling. We also highlight the role of the species scale cutoff in sensitivity of the low energy observables towards the GUT physics."},{"arxiv":"2601.17126","id":"3111399","title":"Foundation model for particle collision data analysis","authors":"Ting-Hsiang Hsu, Bai-Hong Zhou, Qibin Liu, Yue Xu, Shu Li, George Wei-Shu Hou, Benjamin Nachman, Shih-Chieh Hsu, Vinicius Mikuni, Yuan-Tang Chou, Yulei Zhang","score":8.0,"section":"replacement","rank":20,"parts":[0.0,0.03,0.14,0.5,0.0],"note":"Co-authors of yours: Xu. Closest of your papers: [[2751074]] (coupling 0.01, 1 shared references). Closest network paper: [[3187354]] (coupling 0.05, 3 shared references).","abstract":"Data-intensive collider experiments increasingly require models that transfer across high-dimensional, partially observed measurements, yet most analyses still optimize separate models for each task. Here, to address this bottleneck, we introduce EVENET, an event-level foundation model pretrained on 500 million simulated collision events using self-supervised learning and physics-informed supervision. The model constructs a shared particle-cloud representation from the variable-length set of physics objects in each event. Across searches for heavy resonances and exotic Higgs decays, EVENET outperforms both established and state-of-the-art baselines, particularly in low-statistics regimes. We validate transfer to experimental data by rediscovering the $Υ$ meson in CMS Open Data. The pretrained model also supports precise extraction of quantum-correlation observables that remain stable under the tested systematic variations. Together, these results establish a reusable backbone for diverse collider analyses, improving downstream adaptation after a substantial one-time pretraining investment."},{"arxiv":"2506.13310","id":"2935131","title":"QCD Axion Conversion in Magnetospheres of Neutron Stars","authors":"Shubham Yadav, Sachin Dev Kushwaha, Kamni Pawar","score":7.8,"section":"replacement","rank":21,"parts":[0.0,0.14,0.16,0.0,0.13],"note":"Closest of your papers: [[1941263]] (coupling 0.04, 8 shared references). Closest network paper: [[2063283]] (coupling 0.06, 5 shared references). Shared topics: dark matter.","abstract":"The axion-converted-photons flux plays a key role in searches of QCD axions as a dark matter (DM) candidate. In addition to solving the strong CP problem, these may explain the properties of the mysterious DM. Neutron star (NS) cooling by neutrino/axion emissions rate constrains the astrophysical properties of superdense matter. We attempt to analyse the impact of strong magnetic fields on the emission properties of axions by employing the APR, FPS, and SLY equation of State (EoS). We modify the Tolman Oppenheimer Volkoff (TOV) equations by considering effects of strong fields' and generate profiles. We assume Cooper-pair-breaking formation (PBF) and the Bremsstrahlung process occurring in the core of NS. We use the radial distance-dependent magnetic field configuration within the permissible limit of the central magnetic field. Our work explores the variations in the axion masses of 10 meV, 15 meV, and 20 meV as a cooling source for spherically symmetric magnetised NSs. We have also shown the energy spectrum of axions and their conversion to photons. Our analysis shows that the cooling rate and the luminosity of observables (axions) for NSs change significantly due to the magnetic field. The results for the luminosity of axions is quite sensitive to its mass and EoS, as the less separation is observed for SLY EoS in comparison to the FPS and APR EoS. We report that the spectrum of axions from the Bremsstrahlung process dominates over the PBF process at lesser axion energies, within the possible axion mass range for PSR J1357-6429 NS. Our results reveal that the impact of the magnetic field is less at lower axion energies, indicating the necessity for including a magnetic field in axion-to-photon conversion mechanisms. The results for the axions mass 10 meV and 15 meV as compared to 20 meV confirms the existing report of the 16 meV."},{"arxiv":"2611.03751","id":"3222457","title":"Electroweak Constraints on Nuclear Neutron Distributions and the Low-Energy Weak Mixing Angle","authors":"Xu-Run Huang, Tong-Gang Yue, Zhen Zhang, Lie-Wen Chen","score":6.7,"section":"cross","rank":22,"parts":[0.06,0.03,0.25,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2794409]] (coupling 0.01, 1 shared references). Closest network paper: [[3095306]] (coupling 0.09, 7 shared references).","abstract":"Coherent elastic neutrino--nucleus scattering (CE$ν$NS) offers a low-energy probe of the weak mixing angle, $\\sin^2θ_W$, and possible new physics in the neutrino sector. Its reliable interpretation, however, requires independent constraints on the neutron distributions of the target nuclei. We exploit correlations across nuclei within an extended Skyrme energy-density-functional framework to propagate constraints from the CREX and PREX-II parity-violating electron-scattering (PVES) measurements to CE$ν$NS targets. This yields neutron form factors and radii, with relative radius uncertainties below $1\\%$. Using these inferred neutron form factors, we jointly analyze the COHERENT CsI, Ge, and Ar data and obtain $\\sin^2θ_W=0.231^{+0.016}_{-0.015}$, consistent with the Standard Model prediction. These results provide the first electroweak-experimentally constrained benchmarks for nuclear-structure studies, neutrino-sector electroweak tests, and CE$ν$NS signal predictions in dark-matter detectors."},{"arxiv":"2611.04110","id":"3222553","title":"Holographic spin alignment of vector mesons in a spinning black-hole background","authors":"Fei Wang, Zi-qiang Zhang","score":6.4,"section":"new","rank":23,"parts":[0.06,0.09,0.11,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[636564]] (coupling 0.03, 2 shared references). Closest network paper: [[634308]] (coupling 0.04, 4 shared references).","abstract":"Holographic predictions for vector-meson spin alignment are difficult to compare between charmonium and light vector mesons, as the two sectors are typically treated in different rotating backgrounds and spectral prescriptions. Consequently, it remains unclear whether a single rotating medium can generate the opposite polarization preferences observed in data. We address this by placing \\(J/ψ\\) and \\(φ\\) in one soft-wall model on the planar limit of a five-dimensional equal-spin Myers--Perry (MP) AdS black hole, computing spectral functions and spin alignment within the same current-correlator framework; the nonrotating results of Sheng et al. [Phys. Rev. D 110, 056047 (2024)] are recovered at \\(a=0\\). At \\(T=0.15~\\mathrm{GeV}\\), \\(J/ψ\\) retains a clear resonance peak, whereas \\(φ\\) shows no narrow peak and instead behaves as a broad distribution consistent with unstable \\(s\\bar{s}\\) pairs. For \\(J/ψ\\) along \\(z\\), rotation enhances the positive deviation of \\(ρ_{00}^{h}\\) from \\(1/3\\) at low and intermediate momenta but suppresses it at high momenta; along \\(x\\), the effect is small. For \\(φ\\), rotation enhances the negative deviation, more along \\(z\\) than along \\(x\\). The opposite helicity-frame signs and the opposing azimuthal and rapidity trends of the global alignment provide a reference for interpreting data: trends inconsistent with these would challenge the simplest single homogeneous rotating-medium interpretation. We distinguish model-dependent numerical details from qualitative features stable within this model class."},{"arxiv":"2611.04890","id":"","title":"DAMA/LIBRA dark matter signal: a global analysis","authors":"Matti Heikinheimo, Sebastian Sassi, Alex Stendahl, Kimmo Tuominen, Niklas Zimmermann","score":6.4,"section":"new","rank":24,"parts":[0.0,0.06,0.21,0.0,0.13],"note":"Closest of your papers: [[3146383]] (coupling 0.02, 4 shared references). Closest network paper: [[3217265]] (coupling 0.08, 7 shared references). Shared topics: dark matter.","abstract":"The annual modulation reported by the DAMA/LIBRA collaboration remains in tension with the null results of other direct-detection experiments. We investigate the compatibility of DAMA/LIBRA with LZ, PICO-60 and CDMSlite within a generalized non-relativistic effective field theory (EFT) framework. In addition to the EFT operator expansion we investigate additional modifications to the standard WIMP picture, including inelastic scattering, variations in the NaI quenching factors, and a rescaling of the dark-matter velocity dispersion. We perform a Markov chain Monte Carlo analysis in this extended model space, using two alternative approaches to the likelihood function describing the DAMA/LIBRA data. Both approaches result in strong discrepancy between the data from DAMA/LIBRA and other experiments. We conclude that the extended model space considered here cannot accommodate the DAMA/LIBRA signal while remaining consistent with the non-observation of dark matter in other experiments."},{"arxiv":"2611.03785","id":"3222477","title":"Cosmic-Ray Signals from Dark Matter Annihilation into Scalars with Baryon Number","authors":"Mattia Di Mauro, Caleb Gemmell, Dan Hooper, Fabrizio Vassallo","score":5.4,"section":"new","rank":25,"parts":[0.0,0.03,0.22,0.0,0.13],"note":"Closest of your papers: [[860906]] (coupling 0.01, 1 shared references). Closest network paper: [[1759674]] (coupling 0.08, 5 shared references). Shared topics: dark matter.","abstract":"Cosmic-ray antideuterons and antihelium-3 nuclei are promising probes of dark matter (DM). In light of potential detections of heavy antinuclei at AMS-02, we investigate a recently proposed scenario in which DM annihilates into color-singlet scalars carrying baryon and lepton number, which has been shown to enhance antideuteron and antihelium-3 fluxes relative to antiprotons. Accounting for Galactic propagation and detector sensitivities, we calculate the number of events predicted by our model for parameters that are compatible with the seven-year AMS-02 antiproton data. Broad regions of the DM-mediator mass plane result in observable antideuteron fluxes at AMS-02 and GAPS. While detecting antihelium-3 remains more challenging, potentially detectable fluxes can arise for light mediators and moderately light DM, and in general are enhanced relative to the standard WIMP predictions. Furthermore, we find antihelium-to-antideuteron event ratios of O(0.1), closer to those suggested by the reported AMS-02 candidate events than conventional WIMP predictions."},{"arxiv":"2609.16276","id":"3203922","title":"Probabilistic, Structure-Intrinsic Clustering with a Hierarchical Embedding (PSICHE) in Time and Space Applied In Particle Physics Jet Reconstruction","authors":"Margaret Lazarovits, Christopher Rogan","score":5.3,"section":"replacement","rank":26,"parts":[0.0,0.11,0.13,0.0,0.0],"note":"Closest of your papers: [[1455793]] (coupling 0.04, 3 shared references). Closest network paper: [[2621240]] (coupling 0.04, 3 shared references).","abstract":"Jet reconstruction is an active and open area of particle physics research, with questions related to jet size, multiplicity, substructure, and experimental performance in the presence of pileup and noise. Analogous challenges are ubiquitous throughout other applications of unsupervised learning in the context of clustering and association. This paper introduces a new algorithm for clustering in the context of jet reconstruction: Probabilistic, Structure-Intrinsic Clustering with a Hierarchical Embedding (PSICHE). PSICHE addresses several challenges and shortcomings of existing jet clustering methods with novel features, including but not limited to: (i) dynamically-learned and variable jet (cluster) sizes, (ii) unsupervised, multi-scale learning of emergent features, like jet substructure and multiplicity, (iii) clustering in space and time, and (iv) incorporation of domain-specific experimental uncertainties. All of these properties are achieved in a self-consistent, probabilistic framework that is computationally tractable. Furthermore, demonstrations of these features are presented for a range of jet clustering examples in LHC scenarios for various physics phenomena, clustering inputs, pileup conditions, and detector performance parameters."},{"arxiv":"2611.03988","id":"3222497","title":"Axion Electrodynamics in Presence of a Stellar Non-homogeneous Background Magnetic Field","authors":"Bernard Teles de Menezes","score":5.2,"section":"new","rank":27,"parts":[0.0,0.09,0.17,0.0,0.0],"note":"Closest of your papers: [[1941263]] (coupling 0.03, 3 shared references). Closest network paper: [[2969908]] (coupling 0.06, 4 shared references).","abstract":"We re-assess effects of Axion Electrodynamics in the presence of non-homogeneous background magnetic fields. The Primakoff effect, which is an ALP-photon mixing induced by a background magnetic field, is generalized to the case of non-homogeneous backgrounds. The production of ALPs from a magnetized plasma thermal medium is also computed. The Eddington's solar standard model is adopted as the phenomenological scenario for our settings, and new bounds on the Axion Electrodynamics parameter space are imposed by considering helioseismological and neutrino observational measurements."},{"arxiv":"2606.17132","id":"3169184","title":"Are neutrinos Majorana? Fixed-target and high-energy astrophysical searches decide","authors":"Gabriela Barenboim, Mauricio Bustamante, Qinrui Liu","score":5.2,"section":"replacement","rank":28,"parts":[0.06,0.04,0.13,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1854224]] (coupling 0.01, 3 shared references). Closest network paper: [[2682367]] (coupling 0.05, 6 shared references).","abstract":"The original version of this paper proposed a new approach to determining whether neutrinos are Dirac or Majorana fermions, a fundamental open question in particle physics. Conventional searches rely on neutrinoless double beta decay, but this electron-only channel suffers from blind spots. We propose a new, complementary probe to overcome this limitation. A heavy neutral lepton (HNL) triggers a high-energy shift in how the active neutrino flavors ($ν_e$, $ν_μ$, $ν_τ$) mix---but only if the neutrinos are Majorana. For GeV-scale HNLs, the upcoming beam-dump experiment SHiP can discover the HNL and measure how it mixes with the active flavors.However, the proposed signature of the Majorana nature of neutrinos does not exist. The reasons are explained here. The analysis has been superseded by Ref.~\\cite{Barenboim:2026udr}. The original version is retained as v1 for the record."},{"arxiv":"2611.03748","id":"3222469","title":"Topological Diagnostics of CP Degeneracies in Long-Baseline Neutrino Oscillations with Non-Standard Interactions via Pancharatnam Open-Path Phases","authors":"Neda Razzaghi","score":5.1,"section":"new","rank":29,"parts":[0.0,0.06,0.22,0.0,0.0],"note":"Closest of your papers: [[3184726]] (coupling 0.02, 1 shared references). Closest network paper: [[2874212]] (coupling 0.08, 3 shared references).","abstract":"We investigate the topological signatures of neutral-current Non-Standard Interactions (NSI) in long-baseline neutrino oscillations by extending the open-path Pancharatnam geometric phase framework. Incorporating off-diagonal vector couplings ($\\varepsilon_{eτ} = |\\varepsilon_{eτ}|e^{iφ_{eτ}}$) into the discrete-layer matter Hamiltonian across the DUNE baseline ($L = 1300\\text{ km}$), we analyze the state evolution for both neutrino ($ν_μ\\to ν_e$) and antineutrino ($\\barν_μ\\to \\barν_e$) appearance channels over the broadband energy spectrum $E_ν\\in [0.5, 8.0]\\text{ GeV}$. Our analysis demonstrates that complex NSI phases imprint distinct, energy-dependent spectral dispersions onto the open-path geometric holonomies $Φ_g^{(n)}$ and their $\\mathcal{CP}$-conjugate counterparts. By clarifying that these geometric phases manifest through gauge-invariant interference terms $ΔΓ_{nm}$ rather than asymptotic single-channel measurements, we construct the $\\mathcal{CP}$-violating geometric phase differences $ΔΦ_g^{\\mathrm{CP}}$. We show that the interplay between these geometric dispersions and the matter-potential sign reversal under $\\mathcal{CP}$-conjugation forces the neutrino and antineutrino degeneracy bands to intersect at non-parallel angles in the two-dimensional $(δ_{\\mathrm{CP}}, φ_{eτ})$ parameter space. This non-trivial topological intersection isolates a unique physical solution, providing a robust, independent diagnostic capable of breaking persistent parameter degeneracies even under realistic calorimetric energy smearing."},{"arxiv":"2611.04802","id":"3222623","title":"Study of enhancing the signal-background separation for the Higgs boson production in association with a single top-quark in $pp$ collisions at the LHC","authors":"Rustam Azimzade, Alina Dadashova, Igor Boiko, Vladimir Lyubushkin, Nazim Huseynov","score":5.0,"section":"new","rank":30,"parts":[0.0,0.09,0.15,0.0,0.0],"note":"Closest of your papers: [[3094526]] (coupling 0.03, 5 shared references). Closest network paper: [[2660030]] (coupling 0.05, 10 shared references).","abstract":"In this paper, a multivariate analysis based approach for enhancing the extraction of the rare Standard Model (SM) process being studied - Higgs boson production in association with a single top quark (tH) - from the prevailing background processes is presented. The analysis was performed using a Monte Carlo generated dataset simulating the outcomes of proton-proton collisions at the Large Hadron Collider (LHC). A deep fully connected neural network was developed for signal-background discrimination, incorporating a masking mechanism designed to suppress the contribution of input variables associated with objects that were not reconstructed in a given event. The performance of the masked architecture was evaluated on independent Monte Carlo samples. The results of the proposed methodology are compared with a conventional cut-based approach in terms of the statistical significance of the tH production channel. The developed framework was tested using a simulated dataset corresponding approximately to the combined statistical samples of LHC Runs 1, 2, and 3."},{"arxiv":"2602.01010","id":"3113767","title":"Search for Vector-Like Singlet Top ($T$) Quark in a Future Muon-Proton ($μp$) Collider at $\\sqrt{s} = 5.29, 6.48,$ and $9.16$ TeV using Advanced Machine Learning Architectures","authors":"Haroon Sagheer, M. Tayyab Javaid, Ijaz Ahmed, M. Danial Farooq, Jamil Muhammad","score":4.3,"section":"replacement","rank":31,"parts":[0.0,0.07,0.15,0.0,0.0],"note":"Closest of your papers: [[1455793]] (coupling 0.02, 3 shared references). Closest network paper: [[2621240]] (coupling 0.05, 7 shared references).","abstract":"We study the sensitivity of a future $μp$ collider to singly produced singlet vector-like $T$ quarks in the $T\\to Wb$ decay mode across both fully hadronic ($bjj$) and leptonic ($b\\ellν$) final states at $\\sqrt{s}=5.29$, $6.48$, and $9.16~\\mathrm{TeV}$. Utilizing resolved-object reconstruction and TMVA-based multivariate classifiers (BDT, BDTG, MLP, and Likelihood), we perform a fast-simulation scan over $m_T=2$--$5~\\mathrm{TeV}$ and the $(g^{*},m_T)$ parameter space. To quantify improvements, we compare this multivariate selection against the closest cut-based baseline at a benchmark point of $m_T=3~\\mathrm{TeV}$, $\\sqrt{s}=9.16~\\mathrm{TeV}$, and $\\mathcal{L}=3000~\\mathrm{fb}^{-1}$, incorporating a $20\\%$ background-normalization uncertainty via the Asimov significance $Z_A$. At this benchmark, the hadronic channel exhibits a substantial enhancement in both $S/\\sqrt{S+B}$ and $Z_A$, improving from $18.05$ and $1.44$ to $273.51$ and $42.24$, respectively. Similarly, the leptonic channel improves from $3.51$ and $0.330$ to $113.85$ and $21.51$. In the full parameter scan, the $\\sqrt{s}=9.16~\\mathrm{TeV}$ configuration provides the strongest sensitivity at $\\mathcal{L}=3000~\\mathrm{fb}^{-1}$. The hadronic channel excludes (discovers) regions with $g^{*}\\in[0.20,0.50]$ ($[0.30,0.50]$) up to $m_T\\approx4.0~(3.5)~\\mathrm{TeV}$, while the leptonic channel remains sensitive up to $m_T\\approx5.0~\\mathrm{TeV}$ for $g^{*}\\in[0.10,0.50]$. These gains arise from the higher-purity multivariate signal regions evaluated under a common significance prescription, and not from a change of the collider configuration. The projections assume resolved-object reconstruction and fast detector simulation, and the absolute reach should be read with these assumptions in mind."},{"arxiv":"2609.01261","id":"3198585","title":"Spin alignment of vector mesons in a plasma at finite density","authors":"Fei Wang, Zi-qiang Zhang","score":4.3,"section":"replacement","rank":32,"parts":[0.06,0.04,0.08,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[636564]] (coupling 0.01, 1 shared references). Closest network paper: [[634308]] (coupling 0.03, 3 shared references).","abstract":"Holographic predictions for vector meson spin alignment at finite density have been limited by how the chemical potential is implemented. Existing models use a baryon chemical potential and report that the alignment is insensitive to it, while zero-density benchmarks do not address the geometric deformation. We address this limitation by using a charged AdS black-hole background with a quark chemical potential and solving the coupled bulk vector equations with infalling horizon conditions. The zero-density limit reproduces previous results of Sheng et al. [Phys. Rev. D 110, 056047 (2024)]. At \\(T=0.15~\\mathrm{GeV}\\), the \\(J/ψ\\) spectral function has a resonance peak at \\(μ=0\\) that lowers and broadens with increasing \\(μ\\), whereas the \\(φ\\) spectral function shows no pronounced peak. In the helicity frame, \\(ρ_{00}\\) deviates positively from \\(1/3\\) for the \\(J/ψ\\) and negatively for the \\(φ\\). The density response is more visible in our setup than the weak baryon chemical potential sensitivity reported in a four-flavor soft-wall model. This difference illustrates the model dependence of the density response: it is controlled by the chemical potential normalization. We identify the presence of the resonance peak and the signs of the helicity deviations as robust qualitative features, and treat the numerical shifts of \\(ρ_{00}\\) as model-dependent estimates."},{"arxiv":"2611.04468","id":"3222587","title":"Vertex-resummed kinetic theory of dipole-symmetric bosons from 2PI effective action","authors":"Chun-Wei Su","score":4.2,"section":"new","rank":33,"parts":[0.0,0.02,0.24,0.0,0.0],"note":"Closest of your papers: [[2039411]] (coupling 0.01, 1 shared references). Closest network paper: [[2677060]] (coupling 0.08, 7 shared references).","abstract":"The formalism of non-equilibrium dynamics for the dipole-symmetric $U(N)$ model involving $N$-component charged scalar fields is studied on the Schwinger-Keldysh contour by a systematic $1/N$ expansion of two-particle-irreducible (2PI) effective action to the next-to-leading order (NLO). The differential equations describing non-equilibrium evolution equations of two-point functions and field expectation values related to the symmetry breaking in the dynamics are derived, which encompass scatterings between modes essential in the late-time evolution and thermalization beyond the scope of the mean field. At the late-time regime of the evolution, the leading-order (LO) gradient expansion is performed to construct the vertex-resummed kinetic theory by encoding non-perturbative effects in the vertex through the resummation, which is distinct from the standard kinetic theory written by the weak-coupling expansion."},{"arxiv":"2611.03694","id":"3222454","title":"Birefringence in non-linear electrodynamics emerging from a Lorentz-symmetry violation scenario","authors":"M. J. Neves","score":4.0,"section":"cross","rank":34,"parts":[0.0,0.0,0.27,0.0,0.0],"note":"Closest network paper: [[3164308]] (coupling 0.09, 3 shared references).","abstract":"In this paper, we investigate the classical properties of a non-linear electrodynamics that emerges from one loop effective action for fermions coupled to an antisymmetric background tensor, that breaks the Lorentz symmetry in the model. The conservation laws are obtained through the Belinfante-Rosenfeld energy-momentum tensor in the non-linear electrodynamics that provides the energy density, the Poynting vector, the linear momentum and the stress tensor. In particular, this Lorentz symmetry violation breaks the symmetric index of the energy-momentum tensor, but it preserves the gauge invariance, as we expect. We introduce the prescription of a magnetic background field, that we consider constant and uniform. For propagation effects, the model is linearized by the magnetic background. This prescription allows us investigations of the plane wave propagation in the presence of an external magnetic field. In this context, we obtain the constitutive relations of the material medium, that behaves like an bi-anisotropic medium. Thereby, we calculate the refractive index whose one of the solutions show the total absorption of the wave in the medium. Using the wave equation for linear polarization, we investigate the birefringence phenomenon when the linear wave polarization changes with the magnetic background direction. The birefringence is so related to one of the spatial component of the LSV tensor in which we estimate through the PVLS experiment. We use one of the dispersion relations to obtain the kinematic of the Compton effect in the presence of the LSV parameter."},{"arxiv":"2611.03813","id":"3222503","title":"Presupernovae Strongly Constrain Electrophilic MeV Bosons","authors":"Yu Cheng, Damiano F. G. Fiorillo, Chui-Fan Kong, Edoardo Vitagliano","score":3.7,"section":"new","rank":35,"parts":[0.0,0.07,0.11,0.0,0.0],"note":"Closest of your papers: [[2856850]] (coupling 0.02, 3 shared references). Closest network paper: [[3146899]] (coupling 0.04, 7 shared references).","abstract":"The years preceding a supernova (SN) can constrain new electrophilic bosons with MeV masses more than the explosion itself. Although cooler than SNe, the massive progenitors maintain consistently high temperatures much longer, injecting more particles whose decays to positrons contribute to the diffuse Galactic 511-keV emission. For dark photons, the increase is exacerbated by the lower plasma frequency compared to SNe, where MeV excitations are screened. We find preSNe bounds on dark photon couplings up to two orders of magnitude stronger than SNe for masses between 1 and 3~MeV, with similar improvements for other electrophilic species such as axion-like particles."}],"refs":{"3095306":{"first":"Duque","year":2025,"nauth":3,"title":"Uncertainties in the neutrino fog: Studying the isospin-violating dark matter case","role":"other"},"1508494":{"first":"Guo","year":2017,"nauth":5,"title":"Hunting for Heavy Majorana Neutrinos with Lepton Number Violating Signatures at LHC","role":"other"},"634308":{"first":"Son","year":2003,"nauth":1,"title":"Strings on plane waves and AdS x S","role":"other"},"1394206":{"first":"Arbelaez","year":2015,"nauth":4,"title":"Fermion dark matter from SO(10) GUTs","role":"seed"},"2874
