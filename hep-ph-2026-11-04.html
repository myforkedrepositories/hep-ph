<script>
const RAW = {"n":[{"id":"3158114","arxiv":"2605.21477","title":"Opening the Window of Ultra-Light PBHs by Exorcising the Poltergeist","first":"Gouttenoire","nauth":3,"year":2026,"cites":0,"role":"repl","note":"Cites 5 network papers: [[3081453]], [[3125346]], [[2846370]], [[2829767]], [[2612899]]. Closest of your papers: [[2826987]] (coupling 0.12, 21 shared references). Closest network paper: [[3158142]] (coupling 0.43, 84 shared references). Shared topics: evaporation of primordial black hole, primordial black hole, gravitational wave.","score":68.1,"rank":1,"section":"replacement","parts":[0.95,0.4,1,0.0,0.78],"abstract":"The hot Big Bang may have emerged from evaporation of primordial black holes (PBHs) lighter than $10^9$g. Standard monochromatic treatments predict nearly simultaneous evaporation, abrupt reheating, and a large Poltergeist scalar-induced gravitational wave signal. We confront this expectation with the irreducible collapse mass tail predicted by general relativity, $df_{\\rm PBH}/d\\ln M\\propto M^{3.78}$, which smooths reheating, suppresses the signal by orders of magnitude, and reopens the ultra-light PBH window.","authors":"Yann Gouttenoire, Nicholas Leister, Pedro Schwaller","nlinked":88,"nref":90,"src":"INSPIRE","html":true},{"id":"3222533","arxiv":"2611.04136","title":"Revisiting the gamma-ray signal from light ALPs emitted during the evaporation of memory-burdened PBHs","first":"Jiang","nauth":2,"year":2026,"cites":0,"role":"today","note":"Cites 10 network papers: [[3115426]], [[3141847]], [[3076216]], [[2181757]], [[1894389]], [[2908650]]…. Closest of your papers: [[2826987]] (coupling 0.06, 15 shared references). Closest network paper: [[3076216]] (coupling 0.14, 16 shared references). Shared topics: evaporation of primordial black hole, detection prospect, primordial black hole.","score":55.8,"rank":2,"section":"new","parts":[1.0,0.21,0.41,0.0,0.86],"abstract":"The memory-burden effect was recently proposed to take into account the information back-reaction in the evaporation of primordial black holes (PBHs). In this work, we systematically explore the axion-like particle (ALP) production via the evaporation of memory-burdened PBHs and the subsequent ALP-photon conversion in cosmic magnetic fields. The PBH evaporation progress is divided in the semiclassical phase of Hawking radiation and the quantum memory-burden phase. The time evolution of PBH mass and the gamma-ray flux after the conversion of PBH-emitted ALP are then evaluated by considering the memory-burden induced PBH entropy suppression. Furthermore, we investigate the detection prospects of this evaporation-conversion signal in next-generation satellite telescopes, including AMEGO, e-ASTROGAM and MAST. The detectable PBH mass range is extended down to masses much smaller than $10^{15}$ g. Applying the Fisher forecasting method, we derive the projected sensitivity for PBH fraction $f_{\\rm PBH}$ and ALP-photon coupling $g_{aγγ}$.","authors":"Cheng-Rui Jiang, Tong Li","nlinked":97,"nref":101,"src":"INSPIRE","html":true},{"id":"3145848","arxiv":"2604.15006","title":"Cosmology of Inelastic Self-Interacting Dark Matter: Linear Evolution and Observational Constraints","first":"Duan","nauth":3,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[1992028]]. Closest of your papers: [[1824064]] (coupling 0.05, 7 shared references). Closest network paper: [[3214429]] (coupling 0.17, 51 shared references). Shared topics: dark matter mass, dark sector, dark matter.","score":32.2,"rank":3,"section":"replacement","parts":[0.45,0.14,0.48,0.0,0.51],"abstract":"We study the linear cosmological evolution of inelastic self-interacting dark matter in a two-component dark sector with a small mass splitting, assuming thermal initial conditions for the two species. We derive the coupled background and perturbation equations for inelastic conversion between the two species, considering both power-law and low-velocity saturation cross sections. Exothermic conversion injects kinetic energy into the light component, generating pressure support that suppresses small-scale structure and produces dark acoustic oscillations in the matter power spectrum. The resulting cutoff at scale $k > 1\\,h\\,\\mathrm{Mpc}^{-1}$ depends on the normalization and velocity dependence of the cross section, the dark matter mass and the mass splitting. Using linear power spectra computed with a modified Boltzmann solver, we apply recast constraints from Lyman-$α$ forest data and high-redshift UV luminosity functions, finding non-monotonic but closed exclusion regions driven by the competition between efficient conversion and rapid depletion of the heavy component. These results show that the internal thermodynamics of a secluded multi-component dark sector can leave observable imprints on structure formation, providing a complementary probe of secluded dark matter.","authors":"Xin-Chen Duan, Yue-Lin Sming Tsai, Ziwei Wang","nlinked":111,"nref":112,"src":"INSPIRE","html":true},{"id":"3222464","arxiv":"2611.03783","title":"GUT Color-Triplet Around the Corner: The Story of an Overlooked Lightness","first":"Dvali","nauth":4,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Closest of your papers: [[1663960]] (coupling 0.02, 1 shared references). Closest network paper: [[2936613]] (coupling 0.15, 10 shared references).","score":24.2,"rank":4,"section":"new","parts":[0.45,0.06,0.42,0.0,0.01],"abstract":"In traditional approach to the doublet-triplet splitting problem in grand unified theories (GUTs) it is assumed that color-triplet partner of the Higgs doublet must be superheavy in order not to mediate proton decay. However, it has been proposed [1] that the splitting, instead of the mass sector, can occur among the Yukawa couplings. In this scenario the color-triplet emerges as a long-lived $T$-particle with the mass around the TeV scale. This framework provides a direct low-energy window into GUT physics. In the present paper, we study an explicit supersymmetric $SO(10)$ GUT which realizes this mechanism, including effects of gravity-mediated supersymmetry breaking. We show how the shift of the heavy fields, triggered by supersymmetry-breaking, generates a tiny coupling between the $T$-particle and the Standard Model fields and explore the resulting phenomenology. Depending on the order of gravitino mass in which the coupling emerges, the lifetime of the $T$-particle is either around a second or exceeds the age of the Universe. In our analysis, we validate some earlier constraints on (super)gravity vacua imposed by the $S$-matrix: based on the Goldstino Argument, we show that none of the GUT vacua have positive energy densities, whereas the Minkowski vacua are safe against tunneling. We also highlight the role of the species scale cutoff in sensitivity of the low energy observables towards the GUT physics.","authors":"Gia Dvali, Manuel Ettengruber, Anna Jankowsky, Tongxuan Zhang","nlinked":66,"nref":71,"src":"INSPIRE","html":true},{"id":"3191293","arxiv":"2608.14269","title":"Nonstandard Solution for Anomaly Cancellation as Seesaw Neutrino Origin in the SM","first":"Zou","nauth":4,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[3193100]]. Closest of your papers: [[731108]] (coupling 0.03, 2 shared references). Closest network paper: [[1966767]] (coupling 0.06, 10 shared references). Shared topics: minimal model.","score":23.9,"rank":5,"section":"replacement","parts":[0.45,0.11,0.18,0.0,0.21],"abstract":"For fixed Standard Model (SM) non-Abelian representations of 15 chiral fermions with arbitrary hypercharges, anomaly cancellation admits the usual assignment and a distinct nonstandard solution. In the latter, the exotic quark and lepton weak doublets and exotic lepton singlet have zero hypercharge, whereas the two exotic quark singlets carry opposite hypercharges $-q$ and $q$. The neutral exotic lepton singlets naturally provide heavy neutrinos. With two copies, the minimal model realizes the minimal type-I seesaw, yielding one massless active neutrino, and predicts $m_{ββ}=1.2$--$4.1$ meV for normal ordering and $15.9$--$48.9$ meV for inverted ordering. In a direct SM realization, generating exotic-quark masses through the SM Higgs mechanism fixes their electric charges to $\\pm 1/2$. A separate $SU(2)_{L'}$ realization of the nonstandard solution can allow exotic-quark masses ranging from several TeV to 10 TeV with order-one Yukawa couplings while all charged exotic particles carry charges $\\pm q$. In both cases, the lightest exotic quark and lepton are generically stable, providing distinctive and potentially testable signatures while remaining compatible with current constraints.","authors":"Zi-Yue Zou, Chia-Wei Liu, Zhong-Lv Huang, Xiao-Gang He","nlinked":49,"nref":53,"src":"INSPIRE","html":true},{"id":"3222490","arxiv":"2611.03793","title":"Gaia's dark partners: A new signature of dissipative dark matter","first":"Bhalla","nauth":6,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[2795517]]. Closest of your papers: [[1832796]] (coupling 0.01, 4 shared references). Closest network paper: [[3214429]] (coupling 0.06, 21 shared references). Shared topics: dark sector, dark matter.","score":22.7,"rank":6,"section":"cross","parts":[0.45,0.04,0.18,0.0,0.3],"abstract":"The Gaia mission has greatly improved our understanding of the stellar binary population. Beyond providing an extensive catalog of binary systems with two luminous stars, Gaia has also discovered several systems that appear to be star--black hole (BH) binaries. One of the leading candidate formation channels for these systems is dynamical exchange, in which one component of a star--star binary is ejected from the system and replaced by a BH. Exchange processes are very sensitive to the velocity distribution of the incoming objects, and become very efficient in the limit that perturbers are slow, so the exchanged binary population is a sensitive probe of slow-moving objects. A population of slow-moving, nonluminous objects is naturally produced in dissipative dark matter (DDM) scenarios, where a subcomponent of dark matter can cool to form a dark disk and dark compact objects (DCOs), including but not limited to BHs, with a small velocity dispersion. In this work, we evaluate the rate at which DCOs formed by DDM exchange into star--star binaries to form star--DCO binaries. We find that in a wide range of parameter space, even under conservative assumptions, the rate of exchange interactions is sufficient to produce the objects that Gaia has observed to date. In some portions of parameter space, the predicted exchange rate is well in excess of the rate estimated from observations. We point out the potential for competitive constraints on the DDM parameter space with current and future data, making the Gaia mission an important testbed for dark sector cooling.","authors":"Badal Bhalla, David Dunsky, Akshay Ghalsasi, Benjamin V. Lehmann, Jackie Lodman, Kuver Sinha","nlinked":126,"nref":155,"src":"INSPIRE","html":true},{"id":"3133782","arxiv":"2603.22647","title":"Dark graviton sensing with magnetically levitated superconductors","first":"Danieli","nauth":3,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[2051205]]. Closest of your papers: [[3130296]] (coupling 0.01, 1 shared references). Closest network paper: [[2051205]] (coupling 0.06, 4 shared references). Shared topics: dark matter, gravitational wave.","score":21.5,"rank":7,"section":"replacement","parts":[0.45,0.02,0.17,0.0,0.25],"abstract":"Levitated sensors have emerged as a new frontier to detect ultra-light dark matter such as axion-like particles and dark photons. In this work we study how a magnetically levitated superconductor responds to a spin-2 dark matter field, the dark graviton, in the dHz to kHz frequency range. To do so, we compute the forces that the dark graviton exerts on the superconductor, separately for matter and light couplings. The matter coupling produces a strain-like tidal acceleration between the superconductor and the centre of mass of the rigid apparatus, resulting in a displacement relative to the readout pick-up loop, in a way analogous to the response to a slow, continuous, massive gravitational wave. The light coupling instead induces an effective current that sources an oscillating magnetic field, thus driving the superdiamagnetic response of the superconductor. We find that, albeit with significant experimental improvements, the sensitivity reach for the matter coupling could surpass existing fifth-force experiments in the audio frequency band. At the same time, magnetically levitated superconductors could be among the most sensitive laboratory probes of the dark-graviton coupling to electromagnetism, especially at low frequencies, provided technical and readout noise can be kept under control.","authors":"Valentina Danieli, Paola C. M. Delgado, Federico R. Urban","nlinked":49,"nref":51,"src":"INSPIRE","html":true},{"id":"3222799","arxiv":"2611.04857","title":"Electroweak corrections to the SM-like Higgs boson decays and the Higgs trilinear coupling in the real Higgs triplet model","first":"Aiko","nauth":6,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Closest of your papers: [[1365306]] (coupling 0.01, 1 shared references). Closest network paper: [[2133294]] (coupling 0.05, 5 shared references).","score":18.6,"rank":8,"section":"new","parts":[0.45,0.02,0.14,0.0,0.0],"abstract":"We study new physics effects on the decays of the standard model-like Higgs boson ($h$) and the Higgs trilinear coupling including the full one-loop corrections in the real Higgs triplet model (RHTM). We adopt the on-shell renormalization scheme, in which the scalar mixing angles are renormalized in a gauge-independent way using the pinch technique. We found that sizable one-loop effects can arise in the decay rates through the Higgs wave-function (external-leg) corrections, while the tree-level effects are rather small due to the constraint on the vacuum expectation value of the triplet field from the electroweak precision measurements. In addition, the $h\\toγγ$ decay rate and the $hhh$ coupling are sensitive to loop contributions. The RHTM may be distinguishable from other extended Higgs models by studying the correlations among the $h\\toττ$, $h\\to ZZ^{*}$, and $h\\toγγ$ decay modes, and such characteristic predictions can be tested at the High-Luminosity LHC or future Higgs factories.","authors":"Masashi Aiko, Shinya Kanemura, Mariko Kikuchi, Kodai Sakurai, Sora Taniguchi, Kei Yagyu","nlinked":115,"nref":118,"src":"INSPIRE","html":true},{"id":"3222456","arxiv":"2611.03782","title":"Toponium hadroproduction at next-to-next-to-leading order in NRQCD","first":"Klein","nauth":5,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Closest of your papers: [[3094526]] (coupling 0.01, 1 shared references). Closest network paper: [[3206672]] (coupling 0.03, 3 shared references).","score":18.1,"rank":9,"section":"new","parts":[0.45,0.03,0.09,0.0,0.0],"abstract":"We present the first next-to-next-to-leading-order (NNLO) predictions for inclusive color-singlet toponium hadroproduction within NRQCD in the zero-width limit for the top quark. The central new result is the NNLO QCD correction to the short-distance coefficient for pseudoscalar toponium production. The predictions include electroweak and relativistic corrections, additional production channels, and perturbatively evaluated bound-state matrix elements. At the Large Hadron Collider proton-proton center-of-mass energy of $13\\,\\mathrm{TeV}$, we obtain a cross section of $4.87^{+0.63}_{-0.65}\\,\\mathrm{pb}$, with scale and parametric uncertainties combined. The NNLO corrections reduce the renormalization- and factorization-scale uncertainties by approximately a factor of four relative to NLO, to the few-percent level. The dominant remaining uncertainty arises from the Coulomb-scale dependence of the bound-state matrix elements.","authors":"Sven Yannick Klein, Fabio Maltoni, Hua-Sheng Shao, Lukas Simon, Guoxing Wang","nlinked":52,"nref":57,"src":"INSPIRE","html":true},{"id":"3192747","arxiv":"2608.18949","title":"Three-body forces in the quark model","first":"Baek","nauth":7,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[3193100]]. Also cites widely used network papers: [[2817040]]. Closest of your papers: [[3184726]] (coupling 0.00, 1 shared references). Closest network paper: [[3193100]] (coupling 0.02, 54 shared references).","score":18.1,"rank":10,"section":"replacement","parts":[0.48,0.01,0.07,0.0,0.0],"abstract":"We review the connection between constituent-quark Hamiltonians and QCD and investigate the long-standing difficulty of describing meson and baryon spectra with one common two-body interaction. A Hamiltonian calibrated to ground-state mesons leaves systematic baryon mass residuals, largest in the light-quark sector and decreasing toward heavier flavors. We show that a short-range, color-spin-dependent connected three-quark interaction substantially reduces this incompatibility. Mass-scaled finite-range profiles yield high-accuracy baryon spectra, whereas flavor-independent common-range profiles do not remove the residual flavor pattern. The result is tested on additional ground-state baryons outside the calibration set and through meson--baryon compatibility analyses across several alternative quark-model Hamiltonians. We also benchmark radial and orbital excitations to identify the regime in which a static compact valence Hamiltonian remains reliable, and provide explicit color-spin matrix elements for two- and three-body operators in baryons and multiquark configurations. Within the tested valence-space representations, the results indicate that a mass-dependent short-range connected three-quark interaction provides the missing contribution required for a consistent simultaneous description of meson and baryon ground-state spectra.","authors":"Jongheon Baek, Aaron Park, Emiko Hiyama, Sungsik Noh, Hyeongock Yun, Kyong Chol Han, Su Houng Lee","nlinked":351,"nref":394,"src":"INSPIRE","html":true},{"id":"3222816","arxiv":"2611.04981","title":"Renormalization and Factorization Scale-Invariant Predictions for the $e^+e^-\\to J/ψ+η_c$ process at $B$ factories","first":"Gong","nauth":7,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Also cites widely used network papers: [[2817040]]. Closest of your papers: [[3184726]] (coupling 0.00, 1 shared references). Closest network paper: [[1966767]] (coupling 0.01, 2 shared references).","score":17.9,"rank":11,"section":"new","parts":[0.48,0.01,0.04,0.0,0.0],"abstract":"We perform a NNLO perturbative QCD analysis for exclusive double charmonium production $e^+e^-\\to J/ψ+η_c$ within the NRQCD factorization formalism using the Principle of Maximum Conformality (PMC). It is well known that this charmonium process suffers poor pQCD convergence, as well as large renormalization scale uncertainty. The PMC is used to remove conventional renormalization scale uncertainty. Based on two fundamental physical processes of charmonium, $J/ψ\\rightarrow e^+e^-$ and $η_c\\rightarrowγγ$, and using the NNLO perturbative results together with experimental measurements, we extract the factorization-scale-dependent long-distance matrix elements for $J/ψ$ and $η_c$. Combining these two matrix elements with the factorization-scale-dependent short-distance coefficient, we obtain predictions that are independent of the factorization scale for the $e^+e^-\\to J/ψ+η_c$ process. Our predictions agree with the measurement from the BaBar collaborations within errors. Remarkably, we provide a new way to eliminate conventional renormalization and factorization scale ambiguities for the $e^+e^-\\to J/ψ+η_c$ process. We further demonstrate that the slow convergence of the pQCD series is an intrinsic property of this double-charmonium process.","authors":"Si-Qi Gong, Ting Sun, Sheng-Quan Wang, Jian-Ming Shen, Xu-Dong Huang, Xing-Gang Wu, Leonardo Di Giustino","nlinked":67,"nref":71,"src":"INSPIRE","html":true},{"id":"3222544","arxiv":"2611.04014","title":"Branching Fractions and CP-Violating Asymmetries in D => PP Decays","first":"Buccella","nauth":2,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Closest of your papers: [[1692605]] (coupling 0.01, 1 shared references). Closest network paper: [[3214449]] (coupling 0.02, 1 shared references).","score":17.8,"rank":12,"section":"new","parts":[0.45,0.03,0.07,0.0,0.0],"abstract":"We update an $SU(3)_F$ analysis of $D\\to PP$ decays ($P\\equiv π, K$) in which the dominant $SU(3)_F$-breaking effects are modeled through final-state interactions. The new fit improves the description relative to the previous parameter set, although significant global tension remains, mainly in charged-$D$ modes. Within the adopted rescattering model, the direct CP asymmetries in $D^0\\toπ^+π^-$, $K^+K^-$, $π^0π^0$, and $K_S^0 K_S^0$ depend on two additional reduced amplitudes. Using the $D^0\\toπ^+π^-$ and $D^0\\to K^+K^-$ asymmetries as inputs, we derive conditional predictions for the two neutral modes. The OZI-motivated benchmark $Δ_4=0$ is mildly disfavored by the charged-mode asymmetries and leads to substantially smaller asymmetries in the neutral modes, which can be tested with more precise $K_S^0K_S^0$ and $π^0π^0$ measurements.","authors":"Franco Buccella, Pietro Santorelli","nlinked":27,"nref":29,"src":"INSPIRE","html":true},{"id":"3183161","arxiv":"2607.22093","title":"Polarization fractions and helicity-dependent CP asymmetries in $B_{(s)} \\to ρρ, ρK^\\ast$ and $K^\\ast K^\\ast$ decays","first":"Chai","nauth":6,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[3193100]]. Closest of your papers: [[2964960]] (coupling 0.01, 1 shared references). Closest network paper: [[3201794]] (coupling 0.03, 2 shared references).","score":17.6,"rank":13,"section":"replacement","parts":[0.45,0.02,0.08,0.0,0.0],"abstract":"In this paper, we present a phenomenological analysis of $B_{(s)} \\to ρρ, ρK^\\ast$ and $K^\\ast K^\\ast$ decays using state-of-the-art perturbative QCD (pQCD) calculations. Our study is primarily motivated by recent polarization measurements from the LHCb and Belle II collaborations, which have significantly improved the precision of polarization fractions and enabled the first full determination of polarization-dependent CP asymmetries. This work extends the comprehensive pQCD study of charmless two-body $B$ decays reported in our previous paper [Chin. Phys. C 46 (2022) 123103], with a particular focus on polarization observables, especially the CP asymmetries in each helicity state, which reflect distinct orbital angular momentum configurations between the two vector mesons. Our predictions for the branching ratios and longitudinal polarization fractions in the $B^0 \\to K^{\\ast 0} {\\bar K}^{\\ast 0}$ and $B^+ \\to ρ^0 K^{\\ast +}$ modes are in good agreement with the new experimental data. However, the calculated longitudinal polarization fraction for $B_s \\to K^{\\ast 0} {\\bar K}^{\\ast 0}$ is significantly larger than the LHCb measurement. Moreover, the predicted (helicity-dependent) CP asymmetries in $B^+ \\to ρ^0 K^{\\ast +}$ are about $30 \\%$ smaller than the observed values. These discrepancies point to a rich interplay between different topological amplitudes, highlighting the need for further theoretical investigation to resolve the long-standing polarization puzzle in two-body $B$ decays into vector mesons.","authors":"Jian Chai, Shan Cheng, Feng-Qing Hu, Ya Li, Jin-Yang Shen, Da-Cheng Yan","nlinked":37,"nref":38,"src":"INSPIRE","html":true},{"id":"3222565","arxiv":"2611.04237","title":"Observable gravitational waves from unstable ALP catastrogenesis","first":"Gelmini","nauth":3,"year":2026,"cites":0,"role":"today","note":"Also cites widely used network papers: [[1783234]]. Closest of your papers: [[1941263]] (coupling 0.10, 18 shared references). Closest network paper: [[1615480]] (coupling 0.12, 15 shared references). Shared topics: gravitational wave.","score":17.1,"rank":14,"section":"new","parts":[0.06,0.29,0.35,0.0,0.11],"abstract":"We focus on gravitational waves (GWs) observable in pulsar timing array and interferometric searches that are produced by the annihilation of cosmic string-wall networks in axion-like particle (ALP) models. We called this process \"catastrogenesis.\" It produces GWs with a characteristic peaked spectrum. These GWs would not be observable if the ALPs were stable. We thus assume that ALPs decay into two photons before Big-Bang nucleosynthesis (BBN). The large ALP-photon coupling required could induce field dissipation and friction on cosmic walls through interactions with the radiation background. We study the conditions under which these effects are negligible and map the parameter regions yielding observable GW signals onto the usual ALP mass-coupling parameter space. We find that, in these regions, ALPs dominate the energy density of the Universe before they decay, leading to a period of intermediate matter domination, which would leave a clear imprint on the GW spectrum.","authors":"Graciela B. Gelmini, Jonah Hyman, Yu Watanabe","nlinked":100,"nref":107,"src":"INSPIRE","html":true},{"id":"3184530","arxiv":"2607.27202","title":"Anomalies in Hadronic $B \\to VV$ Decays","first":"Bhattacharya","nauth":5,"year":2026,"cites":0,"role":"repl","note":"Cites 1 network paper: [[3193100]]. Closest network paper: [[3193100]] (coupling 0.02, 16 shared references).","score":16.7,"rank":15,"section":"replacement","parts":[0.45,0.0,0.06,0.0,0.0],"abstract":"Recently, a fit of charmless $B\\to PP$ decays ($B \\in \\{B^0, B^+, B_s^0\\}$, $P \\in \\{ π, K, η, η' \\}$) to the latest data was performed under the assumption of flavour SU(3) symmetry [SU(3)$_F$]. It was found that there is a $4.1σ$ disagreement with the SU(3)$_F$ limit of the Standard Model [$\\rm SM_{SU(3)_F}$]. In this paper, we extend this analysis to charmless $B \\to VV$ decays ($V \\in \\{ρ, K^*, φ, ω\\}$). The fit examining $B \\to ρK^*$ decays, assuming only isospin symmetry, is found to be acceptable. When we fit to $B \\to VV$ decays with $V \\in \\{ ρ, K^* \\}$ within SU(3)$_F$, we find a $5.2σ$ discrepancy with SM$_{SU(3)_F}$. Finally, when $B \\to VV$ decays with $V \\in \\{ ρ, K^*, φ, ω\\}$ are considered, the discrepancy grows to $>7σ$. The theoretical input in this analysis is modest, so our results are quite rigorous, group theoretically, and hold almost exactly in the SU(3)$_F$ limit. Although it seems unlikely that the introduction of $\\sim 30$% SU(3)$_F$-breaking effects can account for this discrepancy, this must be verified.","authors":"Bhubanjyoti Bhattacharya, Marianne Bouchard, Alexandre Jean, David London, Ipsita Ray","nlinked":47,"nref":48,"src":"INSPIRE","html":true},{"id":"3222628","arxiv":"2611.04770","title":"Investigating nucleon resonances in the $pp\\to K^+K^+ΛΛ$ reaction","first":"Zhang","nauth":8,"year":2026,"cites":0,"role":"today","note":"Cites 1 network paper: [[3193100]]. Closest network paper: [[3214449]] (coupling 0.01, 1 shared references).","score":16.4,"rank":16,"section":"new","parts":[0.45,0.0,0.04,0.0,0.0],"abstract":"In this work, we investigate the \\(pp \\to K^+ K^+ ΛΛ\\) reaction using an effective Lagrangian approach and the isobar model. The calculation includes the exchange of \\(π\\), \\(η\\), \\(σ\\), \\(ρ\\), \\(ω\\), and \\(K\\) mesons, as well as contributions from eight nucleon resonances: \\(N(1535)\\), \\(N(1650)\\), \\(N(1710)\\), \\(N(1720)\\), \\(N(1895)\\), \\(N(1900)\\), \\(N(2060)\\) and \\(N(2120)\\). The double-resonance excitation mechanism (\\(NN \\to N^* N^*\\)) is found to dominate this reaction over the entire energy range considered. Among the exchanged mesons, the \\(η\\) exchange provides the largest contribution at lower energies, whereas the \\(K\\) exchange dominates at higher energies. Near the threshold, \\(N(1535)\\) and \\(N(1650)\\) play the most important roles, while at higher energies \\(N(1710)\\) and \\(N(1720)\\) become dominant. Due to isospin conservation, this reaction is predominantly coupled to nucleon resonances, providing a relatively clean channel for \\(N^*\\) spectroscopy. Our results indicate the unique potential of this reaction for studying nucleon resonances and provide a theoretical reference for future experimental studies at HIAF.","authors":"Zi-Zhao Zhang, Xu Cao, Bo-Chao Liu, Zi-Xi Ou-Yang, Ke Wang, Yin-Jie Wang, Jia-Jun Wu, Zhi-Hong Ye","nlinked":71,"nref":77,"src":"INSPIRE","html":true},{"id":"3222489","arxiv":"2611.03904","title":"Constraints on a Long-Lived X17 Vector Boson with FASER","first":"Collaboration","nauth":136,"year":2026,"cites":0,"role":"today","note":"Co-authors of yours: Xu. Closest of your papers: [[3130296]] (coupling 0.03, 3 shared references). Closest network paper: [[3115042]] (coupling 0.19, 14 shared references).","score":16.0,"rank":17,"section":"cross","parts":[0.0,0.08,0.55,0.5,0.04],"abstract":"The ATOMKI anomalies motivate the possibility of a new particle, the X17, with a mass of 17 MeV and weak couplings to nuclei and electrons. Such a particle may be produced at the LHC, travel 480 m in the far-forward direction, and decay to $e^+e^-$ in FASER. In this paper, previous FASER searches for dark photons and axion-like particles (ALPs) are combined and interpreted as searches for a candidate X17 particle, the protophobic vector boson. The searches use data collected from $pp$ collisions at $\\sqrt{s} = 13.6$ TeV in LHC Run 3 from 2022 for the dark photon search and from 2022-2023 for the ALP search. No excess events are found above the expected background, and the combined null results exclude a previously-unconstrained \"low-coupling window\" with electron coupling $6 \\times 10^{-5} < ε_e < 1.2 \\times 10^{-4}$. A \"high-coupling window\" remains.","authors":" FASER Collaboration, Roshan Mammen Abraham, Xiaocong Ai, Saul Alonso Monsalve, John Anders, Emma Kate Anderson, Akitaka Ariga, Tomoko Ariga, Jeremy Atkinson, Florian U. Bernlochner, Jianming Bian, Tobias Boeckh, Eliot Bornand, Jamie Boyd, Lydia Brenner, Angela Burger, Franck Cadoux, Haichuan Cao, Roberto Cardella, David W. Casper, Charlotte Cavanagh, Shiyang Chen, Xin Chen, Xing Cheng, Dhruv Chouhan, Emily Chown, Andrea Coccaro, Fabio Cufino, Stephane Débieux, Ansh Desai, Sergey Dmitrievsky, Radu Dobre, Monica D'Onofrio, Sinead Eley, Yannick Favre, Jonathan L. Feng, Carlo Alberto Fenoglio, Didier Ferrere, Max Fieg, Wissal Filali, Elena Firu, Haruhi Fujimori, Edward Galantay, Ali Garabaglu, Stephen Gibson, Sergio Gonzalez-Sevilla, Yuri Gornushkin, Yotam Granov, Jinjing Gu, Carl Gwilliam, Elie Hammou, Daiki Hayakawa, Michael Holzbock, Shih-Chieh Hsu, Zhen Hu, Giuseppe Iacobucci, Tomohiro Inada, Luca Iodice, Sune Jakobsen, Cesar Jesus-Valls, Arash Jofrehei, Hans Joos, Enrique Kajomovitz, Hiroaki Kawahara, Alex Keyken, Felix Kling, Daniela Köck, Pantelis Kontaxakis, Jelle Koorn, Umut Kose, Peter Krack, Susanne Kuehn, Thanushan Kugathasan, Sebastian Laudage, Lorne Levinson, Botao Li, Jiaxi Liu, Yi Liu, Joern Mahlstedt, Toni Mäkelä, Yasuhiro Maruya, Anna Mascellani, Lawson McCoy, Josh McFayden, Andrea Pizarro Medina, Hiroaki Menjo, Théo Moretti, Toshiyuki Nakano, Laurie Nevay, Ken Ohashi, Hidetoshi Otono, Lorenzo Paolozzi, Annabelle Parry, Pawan Pawan, Brian Petersen, Titi Preda, Markus Prim, Junkai Qin, Michaela Queitsch-Maitland, Juan Rojo, Hiroki Rokujo, André Rubbia, Jorge Sabater-Iglesias, Osamu Sato, Paola Scampoli, Kristof Schmieden, Matthias Schott, Cristiano Sebastiani, Anna Sfyrla, Davide Sgalaberna, Mansoora Shamim, Yosuke Takubo, Kakeru Tanaka, Simon Thor, Eric Torrence, Serhan Tufanli, Oscar Ivan Valdes Martinez, Svetlana Vasina, Emanuele Villa, Benedikt Vormwald, Chi Wang, Yuxiao Wang, Eli Welch, Aaron White, Monika Wielers, Benjamin James Wilson, Zhongyi Wu, Yue Xu, Heng Yang, Lekai Yao, Daichi Yoshikawa, Stefano Zambito, Shunliang Zhang, Yuxuan Zhang, Xingyu Zhao, Zijian Zhao","nlinked":54,"nref":56,"src":"INSPIRE","html":true},{"id":"3222513","arxiv":"2611.03893","title":"Searching for Long-Lived Dark Scalars with MAPP-1 and MAPP-2 at the HL-LHC","first":"Arifeen","nauth":4,"year":2026,"cites":0,"role":"today","note":"Also cites widely used network papers: [[2817040]], [[1518747]]. Closest of your papers: [[3146383]] (coupling 0.05, 8 shared references). Closest network paper: [[3084653]] (coupling 0.11, 26 shared references). Shared topics: dark sector.","score":15.6,"rank":18,"section":"new","parts":[0.11,0.17,0.32,0.0,0.2],"abstract":"Feebly interacting particles (FIPs) arise generically in dark-sector extensions of the Standard Model (SM). Among the simplest and most theoretically motivated such candidates is a dark scalar that mixes with the SM Higgs boson, acting as a mediator between the dark sector and the SM. For sufficiently small mixing, such a dark scalar manifests at collider experiments as a long-lived particle with a macroscopic decay length---a signature to which conventional general-purpose detectors have limited sensitivity. The MoEDAL-MAPP experiment is a dedicated search facility at the Large Hadron Collider (LHC) targeting long-lived FIPs as avatars of physics beyond the SM. We present $95\\%$ confidence-level background-free sensitivity projections for the MAPP-1 and MAPP-2 detectors at the High-Luminosity LHC to Higgs-portal dark scalars produced via rare $B$-meson decays and exotic Higgs boson decays. Our results establish the proposed MAPP-2 detector as a complementary probe of feebly-coupled dark scalars, with sensitivity to lifetimes beyond the reach of existing collider searches.","authors":"Shafakat Arifeen, James Pinfold, Pierre-Philippe A. Ouimet, Michael Staelens","nlinked":66,"nref":72,"src":"INSPIRE","html":true},{"id":"3175093","arxiv":"2606.31476","title":"Landau-Zener formula and resonant axion conversion in neutron star magnetospheres","first":"Heikinheimo","nauth":3,"year":2026,"cites":0,"role":"repl","note":"Also cites widely used network papers: [[1783234]]. Closest of your papers: [[1941263]] (coupling 0.09, 12 shared references). Closest network paper: [[2691930]] (coupling 0.12, 14 shared references).","score":15.1,"rank":19,"section":"replacement","parts":[0.06,0.27,0.33,0.0,0.0],"abstract":"We investigate the Landau-Zener description of resonant axion-photon conversion in neutron star magnetospheres. We find that this picture often fails for axion conversions to millimeter-to-optical band photons due to the characteristic resonance width exceeding the size of the conversion region. This comparison of scales yields a simple criterion for evaluating the validity of the Landau-Zener formula. We verify this criterion numerically, and show that when invalid, the Landau-Zener conversion probability may significantly deviate from the numerical result. In light of these findings, we revise constraints on axions from neutron star optical-band polarization searches.","authors":"Matti Heikinheimo, Topi Sirkiä, Kimmo Tuominen","nlinked":55,"nref":60,"src":"INSPIRE","html":true},{"id":"3138575","arxiv":"2604.00107","title":"Full positivity bounds for anomalous quartic gauge couplings in SMEFT","first":"Chang","nauth":3,"year":2026,"cites":0,"role":"repl","note":"Closest network paper: [[3092194]] (coupling 0.21, 28 shared references). Shared topics: viable parameter space.","score":12.6,"rank":20,"section":"replacement","parts":[0.0,0.0,0.59,0.0,0.39],"abstract":"Electroweak boson scattering at the LHC provides a crucial avenue for probing physics beyond the Standard Model, particularly regarding deviations in quartic gauge couplings. We derive the complete set of positivity bounds for the $22$ dimension-$8$ anomalous quartic gauge coupling (aQGC) coefficients within the Standard Model Effective Field Theory (SMEFT). Moving beyond previous studies limited to transverse vector bosons, our analysis incorporates all electroweak boson modes, explicitly constructing the extremal rays (ERs) of the positivity cone through a group theoretic framework. We utilize two independent methods--direct construction and Casimir operator analysis--to determine these rays, addressing complexities such as parity-violating operators and continuous parameter degeneracies. Our results indicate that the positivity bounds impose severe constraints, restricting the physically viable parameter space to approximately $0.05255\\%$ of the naive total space. Furthermore, we derive linear analytical bounds for various operator combinations and provide an easy-to-use Python package, {\\tt SMEFTaQGC}, which implements algorithms to numerically verify positivity and compute the optimized positivity bounds for general aQGC configurations.","authors":"Fu-Ming Chang, Zhuo-Yan Chen, Shuang-Yong Zhou","nlinked":118,"nref":121,"src":"INSPIRE","html":true},{"id":"3222604","arxiv":"2611.04600","title":"Light Mediators at the Neutrino-Dark Matter Frontier: Coherent Scattering, Precision Constraints, and Complementary Searches","first":"Serao","nauth":4,"year":2026,"cites":0,"role":"today","note":"Closest of your papers: [[3130296]] (coupling 0.04, 6 shared references). Closest network paper: [[3095306]] (coupling 0.14, 10 shared references). Shared topics: direct detection, dark matter.","score":12.2,"rank":21,"section":"new","parts":[0.0,0.1,0.4,0.0,0.31],"abstract":"Low-threshold neutrino and dark-matter experiments constrain light mediators through different momentum transfers, targets, and coupling combinations. We examine scalar and vector interactions in coherent neutrino--nucleus scattering, neutrino--electron scattering, and dark-matter direct detection. Three representative interaction models are used to compare recoil spectra and coupling degeneracies. For $^{73}\\mathrm{Ge}$ and $^{131}\\mathrm{Xe}$, the nuclear-charge response matrix has a condition number of approximately 115, so two different targets may still leave nearly parallel blind directions. An analytic profile-likelihood calculation shows how spectral overlap and uncertainties in neutrino interactions affect dark-matter discovery sensitivity in the neutrino fog. We discuss the implications of measurements from COHERENT, CONUS+, LZ, XENONnT, and PandaX-4T and specify which theoretical inputs, detector responses, and statistical correlations are needed to combine their constraints. keyword : coherent elastic neutrino-nucleus scattering; light mediators; neutrino--electron scattering; dark matter direct detection; non-standard interactions; solar neutrinos; complementarity","authors":"Raoul Serao, Mohamed Ouchemhou, Antonio Capolupo, Salvatore Capozziello","nlinked":60,"nref":77,"src":"INSPIRE","html":true},{"id":"3138503","arxiv":"2604.00866","title":"Signatures of Long-Lived Heavy Neutral Leptons from Neutrinophilic Charged Higgs Pair Production at the LHC","first":"Okada","nauth":3,"year":2026,"cites":0,"role":"repl","note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1854224]] (coupling 0.05, 4 shared references). Closest network paper: [[1508494]] (coupling 0.13, 21 shared references).","score":12.0,"rank":22,"section":"replacement","parts":[0.06,0.14,0.38,0.0,0.01],"abstract":"In the neutrinophilic Higgs doublet framework, the neutrino Dirac Yukawa couplings can be sizable because of the small vacuum expection value of the extra Higgs doublet, even for a low seesaw scale. Due to this structure, the neutrinophilic charged Higgs bosons, once created, decay dominantly into heavy neutral leptons (HNLs) and charged leptons. This is a new mechanism to produce a gauge singlet HNL without suppressed cross sections. In the standard seesaw, one HNL can be long-lived, when the lightest neutrino is sufficiently light. We investigate displaced vertex signatures of the long-lived HNLs produced from the decays of the charged Higgs pair at the high luminosity LHC. We consider one displaced vertex as well as two displaced vertices signatures and perform a dedicated simulation to identify the displaced leptons. We find that high statistical significance can be achieved for the observation of one displaced vertex for charged Higgs pair production cross section $>\\mathcal{O}(1)$ fb. On the other hand, the observation of two displaced vertices is challenging, particularly for charged Higgs pair production cross section below $\\mathcal{O}(10)$ fb.","authors":"Nobuchika Okada, Prasenjit Sanyal, Ravindra Kumar Verma","nlinked":72,"nref":72,"src":"INSPIRE","html":true},{"id":"3164252","arxiv":"2606.00176","title":"Eigenvalue formulation of Stochastic Inflation and application to large perturbation generating inflationary features","first":"Mishra","nauth":3,"year":2026,"cites":0,"role":"repl","note":"Closest of your papers: [[2826987]] (coupling 0.04, 10 shared references). Closest network paper: [[2840581]] (coupling 0.11, 21 shared references). Shared topics: primordial black hole.","score":11.8,"rank":23,"section":"replacement","parts":[0.0,0.12,0.31,0.0,0.35],"abstract":"Stochastic inflation is a powerful technique for calculating the probability distribution function (PDF) of large inflationary perturbations, which may collapse to form Primordial Black Holes. The PDF, $P({\\cal N})$, of the stochastic number of e-folds, ${\\cal N}$, satisfies an adjoint Fokker-Planck Equation. We develop a new self-contained eigenvalue technique which can be used to determine $P({\\cal N})$. First we apply this method to the simple case of quantum diffusion along a flat potential without any classical drift. We recover the expression for the PDF that has previously been found using characteristic functions, with an exponential tail, and a power-law behaviour, $P({\\cal N}) \\propto {\\cal N}^{-3/2}$, in the intermediate regime between the peak and the tail of the PDF. Finally we apply the method to constant drift inflation, in the narrow- and broad-well limits. In the narrow-well limit, there is an analytic solution and the PDF is similar to the drift-free case, with a mildly suppressed tail. In the broad-well limit, determining the full set of eigenvalues and eigenfunctions requires a piecewise construction of the spectrum, and the broad-well PDF is qualitatively different, with an enhanced peak and a strongly suppressed tail.","authors":"Swagat S. Mishra, Edmund J. Copeland, Anne M. Green","nlinked":96,"nref":113,"src":"INSPIRE","html":true},{"id":"3137150","arxiv":"2603.27257","title":"Particle--antiparticle asymmetry from charge separation at expanding horizons","first":"Xue","nauth":1,"year":2026,"cites":0,"role":"repl","note":"Closest of your papers: [[3184726]] (coupling 0.06, 8 shared references). Closest network paper: [[3076170]] (coupling 0.12, 13 shared references).","score":11.0,"rank":24,"section":"replacement","parts":[0.0,0.19,0.34,0.0,0.0],"abstract":"In a Friedmann universe with a time-varying cosmological term, massive particle--antiparticle pairs are produced continuously from the spacetime vacuum, and their members are separated by horizons. Along the cosmic history that explains $n_s$, $A_s$, $r$ and the low-$\\ell$ power anomaly, we show how this separation generates the observed asymmetry. Horizons absorb the charge they separate, since gravity does not conserve global charges. Charge separation at the many horizons inside today's Hubble volume then acts as a volume violation of the U(1) charge, at a rate $Γ_C=κ_CΓ_M$ proportional to pair production. The sign requires a C- and CP-odd coupling to the time arrow. We describe both by an effective Lagrangian with a U(1)-violating coupling $g_c\\,δ\\mathcal O_SΦ^2$ to the spacetime vacuum and a time bias $-\\partial_μf(R)\\,J^μ$. For $f=c_a\\ln|R|$ the chemical potential of producing a particle is $μ\\simeq2c_a\\dot H/H$. The asymmetry per pair reaches an attractor in the pair-dominated episode and freezes when the cosmological term is exhausted. The observed value requires $|c_a|/τ_S\\simeq(0.65$--$1.0)\\times10^{-4}$, with $T_S=τ_SH/2π$ the temperature of the spacetime vacuum, and its sign is fixed by the arrow of time. The Yukawa decays of the pairs transfer the asymmetry, with a uniform sign, to baryons and leptons and to dark-matter particles. The current of the charged decay products generates a magnetic field of $10^{-14}$--$10^{-11}$ G today on the coherence length of reheating.","authors":"She-Sheng Xue","nlinked":67,"nref":70,"src":"INSPIRE","html":true},{"id":"3222486","arxiv":"2611.03794","title":"Shortcomings of the squark simplified model","first":"Agashe","nauth":5,"year":2026,"cites":0,"role":"today","note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1394206]] (coupling 0.05, 3 shared references). Closest network paper: [[2744388]] (coupling 0.09, 13 shared references).","score":10.7,"rank":25,"section":"new","parts":[0.06,0.16,0.26,0.0,0.0],"abstract":"We argue that the squark simplified model commonly used in collider analyses fails to represent realistic low-energy supersymmetric models and significantly underestimates squark production rates at hadron colliders. This has important implications for extracting squark mass limits at the LHC and assessing the potential reach of HL-LHC or the FCC-hh. In particular, we find that the current LHC squark mass limit is realistically in the range of 2.6-3.0 TeV, rather than the 1.7-1.8 TeV range that is typically quoted based on the simplified model.","authors":"Kaustubh Agashe, Roberto Franceschini, Gian F. Giudice, Andre Lessa, Xing Wang","nlinked":32,"nref":39,"src":"INSPIRE","html":true},{"id":"3222488","arxiv":"2611.03802","title":"A full chemical network treatment of supermassive black hole seed formation from dark matter annihilation or decay","first":"Wu","nauth":3,"year":2026,"cites":0,"role":"today","note":"Closest of your papers: [[2964960]] (coupling 0.02, 2 shared references). Closest network paper: [[2725313]] (coupling 0.09, 12 shared references). Shared topics: mass below, dark matter.","score":10.0,"rank":26,"section":"cross","parts":[0.0,0.05,0.25,0.0,0.46],"abstract":"The recent discoveries of high-redshift quasars at $z\\sim6-10.1$ present a challenge to conventional supermassive black hole (SMBH) formation scenarios: their central SMBHs are too large to have grown from early stellar remnants, even under efficient super-Eddington accretion. An alternative approach is the direct collapse of primordial, dust- and metal-free gas clouds into black hole seeds as early as $z\\sim20$. To prevent fragmentation from highly efficient molecular hydrogen cooling and allow such a collapse, a strong flux of UV photons is required to photodissociate molecular hydrogen, suppressing star formation. We investigate whether the decay or annihilation of dark matter with masses below $\\sim200$ eV can produce sufficient UV radiation, both from the cosmological background and within early dark matter halos. Using thermal simulations of a one-zone primordial gas cloud model with the Grackle chemistry and cooling library, we map the resulting gas behavior across a range of dark matter lifetimes, cross sections, and masses. From this, we determine regions of parameter space where direct collapse into an SMBH is possible and the corresponding maximum halo mass required.","authors":"Han Wu, Sarah Schon, Aaron C. Vincent","nlinked":78,"nref":96,"src":"INSPIRE","html":true},{"id":"2973967","arxiv":"2509.22540","title":"Swift Memory Burden in Merging Black Holes: how information load affects black hole's classical dynamics","first":"Dvali","nauth":1,"year":2025,"cites":14,"role":"other","note":"","score":null},{"id":"3193100","arxiv":"","title":"Review of Particle Physics","first":"Takahashi","nauth":259,
