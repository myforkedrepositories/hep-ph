,[23,48,"k"],[93,43,"c"],[70,103,"c"],[63,86,"c"],[51,64,"c"],[9,43,"c"],[95,100,"c"],[84,64,"c"],[54,81,"c"],[18,40,"k"],[66,59,"c"],[98,86,"c"],[107,68,"c"],[99,80,"c"],[21,61,"k"],[1,63,"c"],[99,37,"c"],[88,81,"c"],[3,67,"k"],[21,73,"k"],[99,62,"c"],[115,77,"c"],[6,75,"k"],[18,81,"c"],[10,27,"c"],[107,38,"c"],[97,94,"c"],[36,107,"c"],[76,109,"c"],[53,40,"c"],[62,102,"c"],[67,109,"c"],[1,94,"c"],[66,63,"c"],[1,40,"k"],[109,103,"c"],[81,32,"c"],[46,41,"c"],[111,43,"c"],[67,26,"c"],[94,109,"c"],[94,37,"c"],[107,110,"c"],[12,27,"c"],[0,103,"c"],[17,105,"k"],[34,37,"c"],[74,107,"c"],[22,40,"k"],[26,99,"c"],[87,88,"c"],[27,32,"c"],[44,109,"c"],[89,43,"c"],[65,80,"c"],[70,86,"c"],[83,43,"c"],[33,110,"c"],[39,114,"c"],[64,59,"c"],[70,40,"c"],[23,112,"k"],[74,115,"c"]],"next":[{"arxiv":"2602.13384","id":"3120654","title":"CMB Spectral Distortions from Resonant Conversions in Atomic Dark Sectors","authors":"Duncan K. Adams, Jared Barron, Bryce Cyr, Xiuyuan Zhang","score":9.8,"section":"replacement","rank":27,"parts":[0.0,0.13,0.24,0.0,0.23],"note":"Closest of your papers: [[2663002]] (coupling 0.04, 6 shared references). Closest network paper: [[3081871]] (coupling 0.08, 11 shared references). Shared topics: dark sector.","abstract":"Dark sectors consisting of atomic constituents (electrons, protons, and photons) offer a well-motivated extension to the Standard Model while providing multiple avenues for phenomenological study. In this work, we explore the impact of conversions between the dark and Standard Model photons in the primordial CMB spectral distortion epoch ($10^3 \\lesssim z \\lesssim 10^6$). These conversions are resonantly enhanced when the induced thermal masses of both photonic species are equal, thus leading to the possibility that sizeable distortions can be produced. To this end, we solve the Boltzmann equation at early times to determine the (irreducible) freeze-in or freeze-out abundance of dark photons. This procedure also allows us to update the limits on generic milli-charged dark sectors using the ACT DR6 bound on the number of effective radiative degrees of freedom ($N_{\\rm eff}$). By then modeling the evolution of the thermal masses in both sectors, we compute the primordial CMB distortion using the Landau-Zener formalism. We find that when the dark electron and proton are roughly similar in mass (the positronium limit), current spectral distortion data from the COBE/FIRAS instrument is able to rule out novel regions of parameter space. We also forecast bounds from the proposed FOSSIL satellite, finding that spectral distortions can also be used to probe the ultra-low dark electric charge regions of parameter space, which are difficult to investigate by other means."},{"arxiv":"2506.09103","id":"2933346","title":"The Primakoff effect: The Axion-Photon Mixing in the Context of Stellar Plasma Physics","authors":"Bernard Teles de Menezes","score":9.2,"section":"replacement","rank":28,"parts":[0.0,0.11,0.2,0.0,0.3],"note":"Closest of your papers: [[1941263]] (coupling 0.03, 3 shared references). Closest network paper: [[2969908]] (coupling 0.07, 4 shared references). Shared topics: dark sector, dark matter.","abstract":"We propose in this work the study of the production of axions in stellar plasma medium through an external magnetic field. In the background field approximation, we can show that the presence of the external magnetic field induces a mixing between the photon and the axion, i.e. the so called Primakoff effect. Since the axion is one of the greatest candidates for dark matter, for being a neutral pseudo-scalar field, the Primakoff process constitutes a mechanism (or portal) to access the dark sector, which in turn provides us new perspectives beyond the standard model. In the high energies limit, observables like probabilities transitions and particles production rates were computed."},{"arxiv":"2601.17126","id":"3111399","title":"Foundation model for particle collision data analysis","authors":"Ting-Hsiang Hsu, Bai-Hong Zhou, Qibin Liu, Yue Xu, Shu Li, George Wei-Shu Hou, Benjamin Nachman, Shih-Chieh Hsu, Vinicius Mikuni, Yuan-Tang Chou, Yulei Zhang","score":7.9,"section":"replacement","rank":29,"parts":[0.0,0.03,0.14,0.5,0.0],"note":"Co-authors of yours: Xu. Closest of your papers: [[2751074]] (coupling 0.01, 1 shared references). Closest network paper: [[3187354]] (coupling 0.05, 3 shared references).","abstract":"Data-intensive collider experiments increasingly require models that transfer across high-dimensional, partially observed measurements, yet most analyses still optimize separate models for each task. Here, to address this bottleneck, we introduce EVENET, an event-level foundation model pretrained on 500 million simulated collision events using self-supervised learning and physics-informed supervision. The model constructs a shared particle-cloud representation from the variable-length set of physics objects in each event. Across searches for heavy resonances and exotic Higgs decays, EVENET outperforms both established and state-of-the-art baselines, particularly in low-statistics regimes. We validate transfer to experimental data by rediscovering the $Υ$ meson in CMS Open Data. The pretrained model also supports precise extraction of quantum-correlation observables that remain stable under the tested systematic variations. Together, these results establish a reusable backbone for diverse collider analyses, improving downstream adaptation after a substantial one-time pretraining investment."},{"arxiv":"2506.13310","id":"2935131","title":"QCD Axion Conversion in Magnetospheres of Neutron Stars","authors":"Shubham Yadav, Sachin Dev Kushwaha, Kamni Pawar","score":7.7,"section":"replacement","rank":30,"parts":[0.0,0.14,0.16,0.0,0.13],"note":"Closest of your papers: [[1941263]] (coupling 0.04, 8 shared references). Closest network paper: [[2063283]] (coupling 0.05, 5 shared references). Shared topics: dark matter.","abstract":"The axion-converted-photons flux plays a key role in searches of QCD axions as a dark matter (DM) candidate. In addition to solving the strong CP problem, these may explain the properties of the mysterious DM. Neutron star (NS) cooling by neutrino/axion emissions rate constrains the astrophysical properties of superdense matter. We attempt to analyse the impact of strong magnetic fields on the emission properties of axions by employing the APR, FPS, and SLY equation of State (EoS). We modify the Tolman Oppenheimer Volkoff (TOV) equations by considering effects of strong fields' and generate profiles. We assume Cooper-pair-breaking formation (PBF) and the Bremsstrahlung process occurring in the core of NS. We use the radial distance-dependent magnetic field configuration within the permissible limit of the central magnetic field. Our work explores the variations in the axion masses of 10 meV, 15 meV, and 20 meV as a cooling source for spherically symmetric magnetised NSs. We have also shown the energy spectrum of axions and their conversion to photons. Our analysis shows that the cooling rate and the luminosity of observables (axions) for NSs change significantly due to the magnetic field. The results for the luminosity of axions is quite sensitive to its mass and EoS, as the less separation is observed for SLY EoS in comparison to the FPS and APR EoS. We report that the spectrum of axions from the Bremsstrahlung process dominates over the PBF process at lesser axion energies, within the possible axion mass range for PSR J1357-6429 NS. Our results reveal that the impact of the magnetic field is less at lower axion energies, indicating the necessity for including a magnetic field in axion-to-photon conversion mechanisms. The results for the axions mass 10 meV and 15 meV as compared to 20 meV confirms the existing report of the 16 meV."},{"arxiv":"2611.03751","id":"3222457","title":"Electroweak Constraints on Nuclear Neutron Distributions and the Low-Energy Weak Mixing Angle","authors":"Xu-Run Huang, Tong-Gang Yue, Zhen Zhang, Lie-Wen Chen","score":6.7,"section":"cross","rank":31,"parts":[0.06,0.03,0.25,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[2794409]] (coupling 0.01, 1 shared references). Closest network paper: [[3095306]] (coupling 0.09, 7 shared references).","abstract":"Coherent elastic neutrino--nucleus scattering (CE$ν$NS) offers a low-energy probe of the weak mixing angle, $\\sin^2θ_W$, and possible new physics in the neutrino sector. Its reliable interpretation, however, requires independent constraints on the neutron distributions of the target nuclei. We exploit correlations across nuclei within an extended Skyrme energy-density-functional framework to propagate constraints from the CREX and PREX-II parity-violating electron-scattering (PVES) measurements to CE$ν$NS targets. This yields neutron form factors and radii, with relative radius uncertainties below $1\\%$. Using these inferred neutron form factors, we jointly analyze the COHERENT CsI, Ge, and Ar data and obtain $\\sin^2θ_W=0.231^{+0.016}_{-0.015}$, consistent with the Standard Model prediction. These results provide the first electroweak-experimentally constrained benchmarks for nuclear-structure studies, neutrino-sector electroweak tests, and CE$ν$NS signal predictions in dark-matter detectors."},{"arxiv":"2611.04110","id":"3222553","title":"Holographic spin alignment of vector mesons in a spinning black-hole background","authors":"Fei Wang, Zi-qiang Zhang","score":6.3,"section":"new","rank":32,"parts":[0.06,0.09,0.11,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[636564]] (coupling 0.03, 2 shared references). Closest network paper: [[634308]] (coupling 0.04, 4 shared references).","abstract":"Holographic predictions for vector-meson spin alignment are difficult to compare between charmonium and light vector mesons, as the two sectors are typically treated in different rotating backgrounds and spectral prescriptions. Consequently, it remains unclear whether a single rotating medium can generate the opposite polarization preferences observed in data. We address this by placing \\(J/ψ\\) and \\(φ\\) in one soft-wall model on the planar limit of a five-dimensional equal-spin Myers--Perry (MP) AdS black hole, computing spectral functions and spin alignment within the same current-correlator framework; the nonrotating results of Sheng et al. [Phys. Rev. D 110, 056047 (2024)] are recovered at \\(a=0\\). At \\(T=0.15~\\mathrm{GeV}\\), \\(J/ψ\\) retains a clear resonance peak, whereas \\(φ\\) shows no narrow peak and instead behaves as a broad distribution consistent with unstable \\(s\\bar{s}\\) pairs. For \\(J/ψ\\) along \\(z\\), rotation enhances the positive deviation of \\(ρ_{00}^{h}\\) from \\(1/3\\) at low and intermediate momenta but suppresses it at high momenta; along \\(x\\), the effect is small. For \\(φ\\), rotation enhances the negative deviation, more along \\(z\\) than along \\(x\\). The opposite helicity-frame signs and the opposing azimuthal and rapidity trends of the global alignment provide a reference for interpreting data: trends inconsistent with these would challenge the simplest single homogeneous rotating-medium interpretation. We distinguish model-dependent numerical details from qualitative features stable within this model class."},{"arxiv":"2611.04890","id":"3222820","title":"DAMA/LIBRA dark matter signal: a global analysis","authors":"Matti Heikinheimo, Sebastian Sassi, Alex Stendahl, Kimmo Tuominen, Niklas Zimmermann","score":6.2,"section":"new","rank":33,"parts":[0.0,0.06,0.21,0.0,0.13],"note":"Closest of your papers: [[3146383]] (coupling 0.02, 4 shared references). Closest network paper: [[3217265]] (coupling 0.07, 7 shared references). Shared topics: dark matter.","abstract":"The annual modulation reported by the DAMA/LIBRA collaboration remains in tension with the null results of other direct-detection experiments. We investigate the compatibility of DAMA/LIBRA with LZ, PICO-60 and CDMSlite within a generalized non-relativistic effective field theory (EFT) framework. In addition to the EFT operator expansion we investigate additional modifications to the standard WIMP picture, including inelastic scattering, variations in the NaI quenching factors, and a rescaling of the dark-matter velocity dispersion. We perform a Markov chain Monte Carlo analysis in this extended model space, using two alternative approaches to the likelihood function describing the DAMA/LIBRA data. Both approaches result in strong discrepancy between the data from DAMA/LIBRA and other experiments. We conclude that the extended model space considered here cannot accommodate the DAMA/LIBRA signal while remaining consistent with the non-observation of dark matter in other experiments."},{"arxiv":"2611.03785","id":"3222477","title":"Cosmic-Ray Signals from Dark Matter Annihilation into Scalars with Baryon Number","authors":"Mattia Di Mauro, Caleb Gemmell, Dan Hooper, Fabrizio Vassallo","score":5.9,"section":"new","rank":34,"parts":[0.0,0.03,0.25,0.0,0.13],"note":"Closest of your papers: [[860906]] (coupling 0.01, 1 shared references). Closest network paper: [[3130997]] (coupling 0.09, 6 shared references). Shared topics: dark matter.","abstract":"Cosmic-ray antideuterons and antihelium-3 nuclei are promising probes of dark matter (DM). In light of potential detections of heavy antinuclei at AMS-02, we investigate a recently proposed scenario in which DM annihilates into color-singlet scalars carrying baryon and lepton number, which has been shown to enhance antideuteron and antihelium-3 fluxes relative to antiprotons. Accounting for Galactic propagation and detector sensitivities, we calculate the number of events predicted by our model for parameters that are compatible with the seven-year AMS-02 antiproton data. Broad regions of the DM-mediator mass plane result in observable antideuteron fluxes at AMS-02 and GAPS. While detecting antihelium-3 remains more challenging, potentially detectable fluxes can arise for light mediators and moderately light DM, and in general are enhanced relative to the standard WIMP predictions. Furthermore, we find antihelium-to-antideuteron event ratios of O(0.1), closer to those suggested by the reported AMS-02 candidate events than conventional WIMP predictions."},{"arxiv":"2609.16276","id":"3203922","title":"Probabilistic, Structure-Intrinsic Clustering with a Hierarchical Embedding (PSICHE) in Time and Space Applied In Particle Physics Jet Reconstruction","authors":"Margaret Lazarovits, Christopher Rogan","score":5.4,"section":"replacement","rank":35,"parts":[0.0,0.11,0.13,0.0,0.0],"note":"Closest of your papers: [[1455793]] (coupling 0.04, 3 shared references). Closest network paper: [[2621240]] (coupling 0.05, 3 shared references).","abstract":"Jet reconstruction is an active and open area of particle physics research, with questions related to jet size, multiplicity, substructure, and experimental performance in the presence of pileup and noise. Analogous challenges are ubiquitous throughout other applications of unsupervised learning in the context of clustering and association. This paper introduces a new algorithm for clustering in the context of jet reconstruction: Probabilistic, Structure-Intrinsic Clustering with a Hierarchical Embedding (PSICHE). PSICHE addresses several challenges and shortcomings of existing jet clustering methods with novel features, including but not limited to: (i) dynamically-learned and variable jet (cluster) sizes, (ii) unsupervised, multi-scale learning of emergent features, like jet substructure and multiplicity, (iii) clustering in space and time, and (iv) incorporation of domain-specific experimental uncertainties. All of these properties are achieved in a self-consistent, probabilistic framework that is computationally tractable. Furthermore, demonstrations of these features are presented for a range of jet clustering examples in LHC scenarios for various physics phenomena, clustering inputs, pileup conditions, and detector performance parameters."},{"arxiv":"2611.03988","id":"3222497","title":"Axion Electrodynamics in Presence of a Stellar Non-homogeneous Background Magnetic Field","authors":"Bernard Teles de Menezes","score":5.2,"section":"new","rank":36,"parts":[0.0,0.09,0.17,0.0,0.0],"note":"Closest of your papers: [[1941263]] (coupling 0.03, 3 shared references). Closest network paper: [[2969908]] (coupling 0.06, 4 shared references).","abstract":"We re-assess effects of Axion Electrodynamics in the presence of non-homogeneous background magnetic fields. The Primakoff effect, which is an ALP-photon mixing induced by a background magnetic field, is generalized to the case of non-homogeneous backgrounds. The production of ALPs from a magnetized plasma thermal medium is also computed. The Eddington's solar standard model is adopted as the phenomenological scenario for our settings, and new bounds on the Axion Electrodynamics parameter space are imposed by considering helioseismological and neutrino observational measurements."},{"arxiv":"2606.17132","id":"3169184","title":"Are neutrinos Majorana? Fixed-target and high-energy astrophysical searches decide","authors":"Gabriela Barenboim, Mauricio Bustamante, Qinrui Liu","score":5.1,"section":"replacement","rank":37,"parts":[0.06,0.04,0.13,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[1854224]] (coupling 0.01, 3 shared references). Closest network paper: [[2682367]] (coupling 0.05, 6 shared references).","abstract":"The original version of this paper proposed a new approach to determining whether neutrinos are Dirac or Majorana fermions, a fundamental open question in particle physics. Conventional searches rely on neutrinoless double beta decay, but this electron-only channel suffers from blind spots. We propose a new, complementary probe to overcome this limitation. A heavy neutral lepton (HNL) triggers a high-energy shift in how the active neutrino flavors ($ν_e$, $ν_μ$, $ν_τ$) mix---but only if the neutrinos are Majorana. For GeV-scale HNLs, the upcoming beam-dump experiment SHiP can discover the HNL and measure how it mixes with the active flavors.However, the proposed signature of the Majorana nature of neutrinos does not exist. The reasons are explained here. The analysis has been superseded by Ref.~\\cite{Barenboim:2026udr}. The original version is retained as v1 for the record."},{"arxiv":"2611.03748","id":"3222469","title":"Topological Diagnostics of CP Degeneracies in Long-Baseline Neutrino Oscillations with Non-Standard Interactions via Pancharatnam Open-Path Phases","authors":"Neda Razzaghi","score":5.0,"section":"new","rank":38,"parts":[0.0,0.06,0.22,0.0,0.0],"note":"Closest of your papers: [[3184726]] (coupling 0.02, 1 shared references). Closest network paper: [[2874212]] (coupling 0.08, 3 shared references).","abstract":"We investigate the topological signatures of neutral-current Non-Standard Interactions (NSI) in long-baseline neutrino oscillations by extending the open-path Pancharatnam geometric phase framework. Incorporating off-diagonal vector couplings ($\\varepsilon_{eτ} = |\\varepsilon_{eτ}|e^{iφ_{eτ}}$) into the discrete-layer matter Hamiltonian across the DUNE baseline ($L = 1300\\text{ km}$), we analyze the state evolution for both neutrino ($ν_μ\\to ν_e$) and antineutrino ($\\barν_μ\\to \\barν_e$) appearance channels over the broadband energy spectrum $E_ν\\in [0.5, 8.0]\\text{ GeV}$. Our analysis demonstrates that complex NSI phases imprint distinct, energy-dependent spectral dispersions onto the open-path geometric holonomies $Φ_g^{(n)}$ and their $\\mathcal{CP}$-conjugate counterparts. By clarifying that these geometric phases manifest through gauge-invariant interference terms $ΔΓ_{nm}$ rather than asymptotic single-channel measurements, we construct the $\\mathcal{CP}$-violating geometric phase differences $ΔΦ_g^{\\mathrm{CP}}$. We show that the interplay between these geometric dispersions and the matter-potential sign reversal under $\\mathcal{CP}$-conjugation forces the neutrino and antineutrino degeneracy bands to intersect at non-parallel angles in the two-dimensional $(δ_{\\mathrm{CP}}, φ_{eτ})$ parameter space. This non-trivial topological intersection isolates a unique physical solution, providing a robust, independent diagnostic capable of breaking persistent parameter degeneracies even under realistic calorimetric energy smearing."},{"arxiv":"2611.04802","id":"3222623","title":"Study of enhancing the signal-background separation for the Higgs boson production in association with a single top-quark in $pp$ collisions at the LHC","authors":"Rustam Azimzade, Alina Dadashova, Igor Boiko, Vladimir Lyubushkin, Nazim Huseynov","score":5.0,"section":"new","rank":39,"parts":[0.0,0.09,0.15,0.0,0.0],"note":"Closest of your papers: [[3094526]] (coupling 0.03, 5 shared references). Closest network paper: [[2660030]] (coupling 0.05, 10 shared references).","abstract":"In this paper, a multivariate analysis based approach for enhancing the extraction of the rare Standard Model (SM) process being studied - Higgs boson production in association with a single top quark (tH) - from the prevailing background processes is presented. The analysis was performed using a Monte Carlo generated dataset simulating the outcomes of proton-proton collisions at the Large Hadron Collider (LHC). A deep fully connected neural network was developed for signal-background discrimination, incorporating a masking mechanism designed to suppress the contribution of input variables associated with objects that were not reconstructed in a given event. The performance of the masked architecture was evaluated on independent Monte Carlo samples. The results of the proposed methodology are compared with a conventional cut-based approach in terms of the statistical significance of the tH production channel. The developed framework was tested using a simulated dataset corresponding approximately to the combined statistical samples of LHC Runs 1, 2, and 3."},{"arxiv":"2602.01010","id":"3113767","title":"Search for Vector-Like Singlet Top ($T$) Quark in a Future Muon-Proton ($μp$) Collider at $\\sqrt{s} = 5.29, 6.48,$ and $9.16$ TeV using Advanced Machine Learning Architectures","authors":"Haroon Sagheer, M. Tayyab Javaid, Ijaz Ahmed, M. Danial Farooq, Jamil Muhammad","score":4.4,"section":"replacement","rank":40,"parts":[0.0,0.07,0.15,0.0,0.0],"note":"Closest of your papers: [[1455793]] (coupling 0.02, 3 shared references). Closest network paper: [[2621240]] (coupling 0.05, 7 shared references).","abstract":"We study the sensitivity of a future $μp$ collider to singly produced singlet vector-like $T$ quarks in the $T\\to Wb$ decay mode across both fully hadronic ($bjj$) and leptonic ($b\\ellν$) final states at $\\sqrt{s}=5.29$, $6.48$, and $9.16~\\mathrm{TeV}$. Utilizing resolved-object reconstruction and TMVA-based multivariate classifiers (BDT, BDTG, MLP, and Likelihood), we perform a fast-simulation scan over $m_T=2$--$5~\\mathrm{TeV}$ and the $(g^{*},m_T)$ parameter space. To quantify improvements, we compare this multivariate selection against the closest cut-based baseline at a benchmark point of $m_T=3~\\mathrm{TeV}$, $\\sqrt{s}=9.16~\\mathrm{TeV}$, and $\\mathcal{L}=3000~\\mathrm{fb}^{-1}$, incorporating a $20\\%$ background-normalization uncertainty via the Asimov significance $Z_A$. At this benchmark, the hadronic channel exhibits a substantial enhancement in both $S/\\sqrt{S+B}$ and $Z_A$, improving from $18.05$ and $1.44$ to $273.51$ and $42.24$, respectively. Similarly, the leptonic channel improves from $3.51$ and $0.330$ to $113.85$ and $21.51$. In the full parameter scan, the $\\sqrt{s}=9.16~\\mathrm{TeV}$ configuration provides the strongest sensitivity at $\\mathcal{L}=3000~\\mathrm{fb}^{-1}$. The hadronic channel excludes (discovers) regions with $g^{*}\\in[0.20,0.50]$ ($[0.30,0.50]$) up to $m_T\\approx4.0~(3.5)~\\mathrm{TeV}$, while the leptonic channel remains sensitive up to $m_T\\approx5.0~\\mathrm{TeV}$ for $g^{*}\\in[0.10,0.50]$. These gains arise from the higher-purity multivariate signal regions evaluated under a common significance prescription, and not from a change of the collider configuration. The projections assume resolved-object reconstruction and fast detector simulation, and the absolute reach should be read with these assumptions in mind."},{"arxiv":"2611.04468","id":"3222587","title":"Vertex-resummed kinetic theory of dipole-symmetric bosons from 2PI effective action","authors":"Chun-Wei Su","score":4.2,"section":"new","rank":41,"parts":[0.0,0.02,0.24,0.0,0.0],"note":"Closest of your papers: [[2039411]] (coupling 0.01, 1 shared references). Closest network paper: [[2677060]] (coupling 0.08, 7 shared references).","abstract":"The formalism of non-equilibrium dynamics for the dipole-symmetric $U(N)$ model involving $N$-component charged scalar fields is studied on the Schwinger-Keldysh contour by a systematic $1/N$ expansion of two-particle-irreducible (2PI) effective action to the next-to-leading order (NLO). The differential equations describing non-equilibrium evolution equations of two-point functions and field expectation values related to the symmetry breaking in the dynamics are derived, which encompass scatterings between modes essential in the late-time evolution and thermalization beyond the scope of the mean field. At the late-time regime of the evolution, the leading-order (LO) gradient expansion is performed to construct the vertex-resummed kinetic theory by encoding non-perturbative effects in the vertex through the resummation, which is distinct from the standard kinetic theory written by the weak-coupling expansion."},{"arxiv":"2611.03694","id":"3222454","title":"Birefringence in non-linear electrodynamics emerging from a Lorentz-symmetry violation scenario","authors":"M. J. Neves","score":4.2,"section":"cross","rank":42,"parts":[0.0,0.0,0.27,0.0,0.01],"note":"Closest network paper: [[3164308]] (coupling 0.09, 3 shared references).","abstract":"In this paper, we investigate the classical properties of a non-linear electrodynamics that emerges from one loop effective action for fermions coupled to an antisymmetric background tensor, that breaks the Lorentz symmetry in the model. The conservation laws are obtained through the Belinfante-Rosenfeld energy-momentum tensor in the non-linear electrodynamics that provides the energy density, the Poynting vector, the linear momentum and the stress tensor. In particular, this Lorentz symmetry violation breaks the symmetric index of the energy-momentum tensor, but it preserves the gauge invariance, as we expect. We introduce the prescription of a magnetic background field, that we consider constant and uniform. For propagation effects, the model is linearized by the magnetic background. This prescription allows us investigations of the plane wave propagation in the presence of an external magnetic field. In this context, we obtain the constitutive relations of the material medium, that behaves like an bi-anisotropic medium. Thereby, we calculate the refractive index whose one of the solutions show the total absorption of the wave in the medium. Using the wave equation for linear polarization, we investigate the birefringence phenomenon when the linear wave polarization changes with the magnetic background direction. The birefringence is so related to one of the spatial component of the LSV tensor in which we estimate through the PVLS experiment. We use one of the dispersion relations to obtain the kinematic of the Compton effect in the presence of the LSV parameter."},{"arxiv":"2609.01261","id":"3198585","title":"Spin alignment of vector mesons in a plasma at finite density","authors":"Fei Wang, Zi-qiang Zhang","score":4.2,"section":"replacement","rank":43,"parts":[0.06,0.04,0.07,0.0,0.0],"note":"Also cites widely used network papers: [[2817040]]. Closest of your papers: [[636564]] (coupling 0.01, 1 shared references). Closest network paper: [[634308]] (coupling 0.03, 3 shared references).","abstract":"Holographic predictions for vector meson spin alignment at finite density have been limited by how the chemical potential is implemented. Existing models use a baryon chemical potential and report that the alignment is insensitive to it, while zero-density benchmarks do not address the geometric deformation. We address this limitation by using a charged AdS black-hole background with a quark chemical potential and solving the coupled bulk vector equations with infalling horizon conditions. The zero-density limit reproduces previous results of Sheng et al. [Phys. Rev. D 110, 056047 (2024)]. At \\(T=0.15~\\mathrm{GeV}\\), the \\(J/ψ\\) spectral function has a resonance peak at \\(μ=0\\) that lowers and broadens with increasing \\(μ\\), whereas the \\(φ\\) spectral function shows no pronounced peak. In the helicity frame, \\(ρ_{00}\\) deviates positively from \\(1/3\\) for the \\(J/ψ\\) and negatively for the \\(φ\\). The density response is more visible in our setup than the weak baryon chemical potential sensitivity reported in a four-flavor soft-wall model. This difference illustrates the model dependence of the density response: it is controlled by the chemical potential normalization. We identify the presence of the resonance peak and the signs of the helicity deviations as robust qualitative features, and treat the numerical shifts of \\(ρ_{00}\\) as model-dependent estimates."},{"arxiv":"2611.03813","id":"3222503","title":"Presupernovae Strongly Constrain Electrophilic MeV Bosons","authors":"Yu Cheng, Damiano F. G. Fiorillo, Chui-Fan Kong, Edoardo Vitagliano","score":4.1,"section":"new","rank":44,"parts":[0.0,0.07,0.11,0.0,0.04],"note":"Closest of your papers: [[2856850]] (coupling 0.02, 3 shared references). Closest network paper: [[3146899]] (coupling 0.04, 7 shared references).","abstract":"The years preceding a supernova (SN) can constrain new electrophilic bosons with MeV masses more than the explosion itself. Although cooler than SNe, the massive progenitors maintain consistently high temperatures much longer, injecting more particles whose decays to positrons contribute to the diffuse Galactic 511-keV emission. For dark photons, the increase is exacerbated by the lower plasma frequency compared to SNe, where MeV excitations are screened. We find preSNe bounds on dark photon couplings up to two orders of magnitude stronger than SNe for masses between 1 and 3~MeV, with similar improvements for other electrophilic species such as axion-like particles."},{"arxiv":"2611.05170","id":"3222863","title":"Constraining tau-sterile neutrino mixing with high-energy astrophysical neutrinos","authors":"Mauricio Bustamante, Qinrui Liu","score":3.4,"section":"new","rank":45,"parts":[0.0,0.03,0.17,0.0,0.0],"note":"Closest of your papers: [[2751074]] (coupling 0.01, 1 shared references). Closest network paper: [[3214448]] (coupling 0.06, 10 shared references).","abstract":"Whether a sterile neutrino mixes with the three active ones remains an open question. Its mixing with the tau neutrino, $|U_{τ4}|^2$, is the least constrained, since terrestrial experiments probe it only indirectly and over limited ranges of sterile-neutrino mass. We show that TeV-PeV astrophysical neutrinos probe it differently. Their sources make almost no $ν_τ$, but oscillations over cosmological distances turn about one third of them into $ν_τ$ before they reach Earth. Mixing with a sterile neutrino would make these $ν_τ$ scarcer, lowering the $ν_τ$ fraction that neutrino telescopes measure, whatever the sterile-neutrino mass. In contrast, sterile mixing with $ν_e$ or $ν_μ$ is nearly undetectable. Fitting the flavor composition measured by IceCube, with the composition at the sources left free, we find $|U_{τ4}|^2 < 0.88$ at 90% C.L. Combining IceCube with present and planned neutrino telescopes, including IceCube-Gen2 and HUNT, could lower this limit to 0.24-0.29 by 2040 and to 0.12-0.14 by 2050. By 2050, these limits would match some present terrestrial limits, though not the strongest."},{"arxiv":"2610.06734","id":"3212018","title":"Two-loop RI/SMOM-$\\overline{\\text{MS}}$ matching factors for the renormalization of bi-local operators contributing to $ε_K$","authors":"Erik Lundstrum","score":3.3,"section":"replacement","rank":46,"parts":[0.0,0.0,0.22,0.0,0.0],"note":"Closest network paper: [[3217357]] (coupling 0.08, 4 shared references).","abstract":"The measure of indirect CP violation in the neutral kaon system, $ε_K$, is an important precision test of the Standard Model. A first-principles Standard Model prediction of $ε_K$ requires evaluating the long-distance contribution in which the $ΔS = 2$ process proceeds via two $ΔS = 1$ operators. The non-perturbative nature of QCD in the relevant energy regimes requires a lattice QCD simulation. In this paper we present the two-loop, $O(α_s)$ RI/SMOM - $\\overline{\\text{MS}}$ matching factors required to renormalize a lattice QCD calculation of the long-distance contribution to $ε_K$."}],"rest":[{"arxiv":"2611.03046","title":"BESIII $X(3790)$ enhancement as a reflection of higher charmed mesons","score":3.1,"section":"replacement","rank":47},{"arxiv":"2601.14939","title":"Gravitational form factors of the proton in the improved holographic QCD model","score":3.1,"section":"replacement","rank":48},{"arxiv":"2606.12155","title":"Neutron Capture Information in Improving IBD Angular Resolution","score":2.9,"section":"replacement","rank":49},{"arxiv":"2606.26598","title":"Holographic light-quark energy loss in a spinning plasma","score":2.8,"section":"replacement","rank":50},{"arxiv":"2609.17858","title":"Matter Swapping between Two Branes: A Local Type IIB D3--D7--D3 Mechanism for Charged-Fermion Mixing via E3 Instantons","score":2.3,"section":"repl     .force('link',d3.forceLink(links).strength(.03)).force('charge',d3.forceManyBody().strength(-40))
    .force('col',d3.forceCollide(s=>r(s.n)+2)).stop().tick(320);
  sim.forEach(s=>{s.y=Math.max(m.t+8,Math.min(H-m.b-8,s.y));s.x=Math.max(m.l+4,Math.min(W-m.r-4,s.x))});
  G=svg.append('g');
  G.append('g').selectAll('path').data(links).join('path').attr('class',l=>'edge '+l.k)
    .attr('d',l=>{const a=l.source,b=l.target;return `M${a.x},${a.y}Q${(a.x+b.x)/2},${(a.y+b.y)/2-Math.abs(a.x-b.x)*.12} ${b.x},${b.y}`});
  G.append('g').selectAll('circle').data([...sim].sort((a,b)=>RANK[b.n.role]-RANK[a.n.role])).join('circle')
    .attr('class','node').attr('cx',s=>s.x).attr('cy',s=>s.y).attr('r',s=>r(s.n)).attr('fill',s=>col(s.n))
    .on('pointerenter',(ev,s)=>{hover=s.n;showTip(ev,s.n);paint()}).on('pointermove',(ev,s)=>showTip(ev,s.n))
    .on('pointerleave',()=>{hover=null;tip.hidden=true;paint()}).on('click',(ev,s)=>pick(s.n,false));
  const lab=sim.filter(s=>isNew(s.n)||s.n.role==='seed'||s.n.deg>=3);
  const L=lab.map(s=>{const right=s.x>W*.8,t=isNew(s.n)?`#${s.n.rank} ${s.n.first}`:`${s.n.first} ${s.n.year}`,w=t.length*6.2;return{s,t,right,x0:right?s.x-r(s.n)-4-w:s.x+r(s.n)+4,w,y:s.y+4}}).sort((a,b)=>a.y-b.y);
  const placed=[];L.forEach(l=>{let k=0;while(k<40&&placed.some(p=>l.x0<p.x0+p.w&&p.x0<l.x0+l.w&&Math.abs(l.y-p.y)<13)){l.y+=13*(k%2?-1:1)*(1+Math.floor(k/2));k++;l.y=Math.max(m.t+10,Math.min(H-m.b-4,l.y))}placed.push(l)});
  G.append('g').selectAll('text').data(L).join('text').attr('class','nlabel').attr('x',l=>l.right?l.s.x-r(l.s.n)-4:l.s.x+r(l.s.n)+4).attr('y',l=>l.y)
    .attr('text-anchor',l=>l.right?'end':'start').text(l=>l.t);
  paint();
}
function showTip(ev,n){const b=document.getElementById('chart').getBoundingClientRect();tip.hidden=false;tip.textContent=`${auth(n)} (${n.year}) — ${plain(n.title)}`+(isNew(n)?` · score ${n.score}`:'');
  let L=ev.clientX-b.left+12;if(L>b.width-290)L=ev.clientX-b.left-290;tip.style.left=Math.max(4,L)+'px';tip.style.top=(ev.clientY-b.top+12)+'px'}
function paint(){if(!G)return;const f=hover||sel,on=new Set();if(f){on.add(f.i);f.out.forEach(i=>on.add(i));f.inn.forEach(i=>on.add(i))}
  svg.classed('dim',!!f);
  G.selectAll('path.edge').attr('class',l=>'edge '+l.k+(!f?'':l.s===f.i?' hot out':l.t===f.i?' hot in':''));G.selectAll('path.edge.hot').raise();
  G.selectAll('circle').classed('on',s=>on.has(s.n.i)).classed('sel',s=>sel&&s.n.i===sel.i).classed('match',s=>query&&`${s.n.first} ${s.n.title} ${s.n.arxiv} ${s.n.authors||''}`.toLowerCase().includes(query));
  G.selectAll('text.nlabel').classed('on',l=>on.has(l.s.n.i))}
function panel(){const p=document.getElementById('panel'),n=sel;
  if(!n){p.innerHTML='<p>Select a paper in the network.</p>';return}
  const links=`<div class="links">${n.id?`<a href="https://inspirehep.net/literature/${n.id}" target="_blank" rel="noopener">INSPIRE</a>`:''}${n.arxiv?`<a href="https://arxiv.org/abs/${esc(n.arxiv)}" target="_blank" rel="noopener">arXiv</a>`:''}</div>`;
  if(isNew(n)) p.innerHTML=`<div class="role" style="color:${col(n)}">#${n.rank} · ${esc(SEC[n.section])} · score ${n.score.toFixed(1)}</div><h4>${esc(n.title)}</h4>
   <div class="meta">${esc(auth(n))} · arXiv:${esc(n.arxiv)}</div><p>${why(n.note)}</p><div class="links"><a href="#p${n.i}">Back to abstract</a></div>`;
  else p.innerHTML=`<div class="role" style="color:${col(n)}">${esc(ROLE[n.role])}</div><h4>${esc(n.title)}</h4>
   <div class="meta">${esc(auth(n))} · ${n.year}${n.arxiv?' · arXiv:'+esc(n.arxiv):''}</div>
   <div class="stats"><span>${n.cites.toLocaleString()} citations</span><span>${n.inn.filter(i=>isNew(N[i])).length} of the matches link here</span></div>${links}`;
  tex(p)}
function pick(n,scroll){sel=n;panel();paint();document.querySelectorAll('.paper').forEach(el=>el.classList.toggle('sel',el.id==='p'+n.i));if(scroll)document.getElementById('chart').scrollIntoView({behavior:'smooth',block:'nearest'})}
const present=new Set(N.map(n=>n.role));
document.getElementById('legend').innerHTML=['today','repl','seed','other'].filter(k=>present.has(k)).map(k=>`<span><i class="dot" style="background:var(--${k})"></i>${esc(ROLE[k])}</span>`).join('')+'<span style="color:var(--fg-3)">Listing papers: size ∝ score; others: size ∝ log(citations)</span>';
document.getElementById('q').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();paint()});
svg.on('click',ev=>{if(ev.target.tagName!=='circle'){sel=null;panel();paint()}});
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(draw,200)});
function nextList(){const X=RAW.next||[];if(!X.length)return;const box=document.getElementById('nextlist'),more=document.getElementById('more');
  more.hidden=false;more.querySelector('summary').firstChild.textContent=`The next ${X.length} papers by score `;
  const nmin=M.nextMin;
  document.getElementById('moresub').textContent=`below the threshold of ${M.threshold}${nmin!=null?`: every paper scoring ${nmin} or more, and at least ${M.nextCount} when available`:''}; not drawn in the network`;
  const cut=nmin!=null?X.findIndex(n=>n.score<nmin):-1;
  box.innerHTML=X.map((n,i)=>(i===cut?`<li class="divider">Below ${nmin}: weaker relation (most of these share no specific reference, coupling or topic with your work)</li>`:'')+`<li><div class="role" style="color:var(--${n.section==='replacement'?'repl':'today'})">#${n.rank} · ${esc(SEC[n.section])} · score ${n.score.toFixed(1)}</div>
    <div class="t">${esc(n.title)}</div><div class="authors">${authors(n.authors)} · arXiv:${esc(n.arxiv)}</div>
    ${n.note?`<p class="why">${why(n.note)}</p>`:''}
    <details class="abs"><summary>Abstract</summary><p class="abs">${esc(n.abstract)}</p></details>
    <div class="links">${n.id?`<a href="https://inspirehep.net/literature/${n.id}" target="_blank" rel="noopener">INSPIRE</a>`:''}<a href="https://arxiv.org/abs/${esc(n.arxiv)}" target="_blank" rel="noopener">arXiv</a><a href="https://arxiv.org/pdf/${esc(n.arxiv)}" target="_blank" rel="noopener">PDF</a></div></li>`).join('');
  more.addEventListener('toggle',()=>{if(more.open)tex(box)})}
const rtip=document.getElementById('reftip');let rcur=null;
function refShow(el){const r=REFS[el.dataset.ref];if(!r)return;rcur=el;rtip.textContent=`${auth(r)} (${r.year}) — ${plain(r.title)}`;rtip.hidden=false;
  const b=el.getBoundingClientRect(),t=rtip.getBoundingClientRect();let L=Math.min(Math.max(8,b.left),innerWidth-t.width-8),T=b.bottom+6;
  if(T+t.height>innerHeight-8)T=b.top-t.height-6;rtip.style.left=L+'px';rtip.style.top=T+'px'}
function refHide(){rtip.hidden=true;rcur=null}
document.addEventListener('pointerover',e=>{const el=e.target.closest('.ref');if(el&&e.pointerType==='mouse')refShow(el)});
document.addEventListener('pointerout',e=>{if(e.target.closest('.ref')&&e.pointerType==='mouse')refHide()});
document.addEventListener('click',e=>{const el=e.target.closest('.ref');if(el)refShow(el);else if(rcur)refHide()});
document.addEventListener('focusin',e=>{const el=e.target.closest('.ref');if(el)refShow(el)});
document.addEventListener('focusout',e=>{if(e.target.closest('.ref'))refHide()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')refHide()});
addEventListener('scroll',()=>{if(rcur)refHide()},{passive:true});
// the rest of the day's papers by score: only the title, linked to the arXiv record
function restList(){const X=RAW.rest||[];if(!X.length)return;const d=document.getElementById('rest'),box=document.getElementById('restlist');
  d.hidden=false;d.querySelector('summary').firstChild.textContent=`All other ${X.length} papers in this listing `;
  document.getElementById('restsub').textContent='by score, title only';
  box.innerHTML=X.map(n=>`<li><span class="sc">#${n.rank} · ${n.score.toFixed(1)}</span><a href="https://arxiv.org/abs/${esc(n.arxiv)}" target="_blank" rel="noopener">${esc(n.title)}</a></li>`).join('');
  d.addEventListener('toggle',()=>{if(d.open)tex(box)})}
list();nextList();restList();fold();draw();panel();
window.addEventListener('load',()=>{tex(document.getElementById('list'));tex(document.getElementById('panel'));fold();
  if(window.MathJax&&MathJax.startup&&MathJax.startup.promise)MathJax.startup.promise.then(()=>setTimeout(fold,300))});
addEventListener('resize',()=>{clearTimeout(window._ft);window._ft=setTimeout(fold,200)});
</script>
